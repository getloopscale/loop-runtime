<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extraction target state</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>One composition of the topology, and one cluster that is optional</h1>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="target-state-title target-state-desc">
      <title id="target-state-title">Extraction target state</title>
      <desc id="target-state-desc">The engine repository publishes signed charts to a private OCI registry; the cluster-management repository consumes them at pinned versions and applies four separate compositions — control plane, build plane, workload cells and secrets — onto a topology instantiated both on LoopZero's account and on a self-hosting customer's, all four compositions moving to the destination under a single renamed scope item, with the secrets composition conditional on the secret backend chosen at install time.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ZONE: the topology, instantiated twice -->
      <rect x="784" y="88" width="192" height="384" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="800" y="92" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="880" y="101" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TOPOLOGY · OURS AND THEIRS</text>

      <!-- ARROWS (before boxes) -->
      <line x1="208" y1="280" x2="288" y2="280" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="222" y="254" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="248" y="263" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUBLISH</text>

      <line x1="448" y1="280" x2="528" y2="280" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="456" y="254" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="488" y="263" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PINNED@v</text>

      <!-- four fanned connectors: own attach point and own vertical corridor each -->
      <path d="M 688,252 H 704 Q 712,252 712,244 V 164 Q 712,156 720,156 H 800"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 688,268 H 720 Q 728,268 728,260 V 252 Q 728,244 736,244 H 800"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 688,288 H 736 Q 744,288 744,296 V 324 Q 744,332 752,332 H 800"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 688,308 H 752 Q 760,308 760,316 V 412 Q 760,420 768,420 H 800"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- NODE: loopzero (engine) -->
      <rect x="48" y="232" width="160" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="232" width="160" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="56" y="240" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="78" y="249" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENGINE</text>
      <text x="128" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">loopzero</text>
      <text x="128" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">api · operators · pkg</text>
      <text x="128" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">charts/ · ~35 gates</text>

      <!-- NODE: registry -->
      <rect x="288" y="232" width="160" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="232" width="160" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="296" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="310" y="249" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OCI</text>
      <text x="368" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Private registry</text>
      <text x="368" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ghcr.io · cosign</text>
      <text x="368" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">13 charts signed</text>

      <!-- NODE: cluster-management (FOCAL) -->
      <rect x="528" y="232" width="160" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="232" width="160" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="536" y="240" width="64" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="568" y="249" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COMPOSITION</text>
      <text x="608" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">cluster-management</text>
      <text x="608" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">compose/ · values/</text>
      <text x="608" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 helmfiles · 101 rel</text>

      <!-- CLUSTER 1: core / control plane -->
      <rect x="800" y="120" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="120" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="808" y="128" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="834" y="137" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SINGLETON</text>
      <text x="880" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">core · control plane</text>
      <text x="880" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">55 rel · singleton</text>

      <!-- CLUSTER 2: build plane -->
      <rect x="800" y="208" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="208" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="808" y="216" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="834" y="225" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SINGLETON</text>
      <text x="880" y="250" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">build plane</text>
      <text x="880" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10 rel · loopzero only</text>

      <!-- CLUSTER 3: cells (FOCAL — the only claimed one) -->
      <rect x="800" y="296" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="296" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="808" y="304" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="834" y="313" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MULTIPLIED</text>
      <text x="880" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">cells · workload</text>
      <text x="880" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">28 rel · x N cells</text>

      <!-- CLUSTER 4: secrets -->
      <rect x="800" y="384" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="384" width="160" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="808" y="392" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="840" y="401" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONDITIONAL</text>
      <text x="880" y="426" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">secrets · OpenBao</text>
      <text x="880" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">8 rel · own backend only</text>

      <!-- Editorial note -->
      <text x="32" y="516" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">One way to stand up a cluster of the topology. Bring your own secret store and the fifth cluster never exists.</text>

      <!-- LEGEND -->
      <line x1="32" y1="544" x2="968" y2="544" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="112" y="552" width="12" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="132" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FOCAL · WHAT MOVES</text>

      <rect x="320" y="552" width="12" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="340" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CLUSTER OF THE TOPOLOGY</text>

      <rect x="576" y="552" width="12" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="596" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CONDITIONAL ON BACKEND</text>

      <line x1="732" y1="556" x2="760" y2="556" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="768" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ARTIFACT · VERSIONED</text>
    </svg>
  </div>
</body>
</html>
