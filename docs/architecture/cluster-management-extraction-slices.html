<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extraction slices</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 800px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Seven slices, one point of no return</h1>

    <svg viewBox="0 0 1000 1020" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="slices-title slices-desc">
      <title id="slices-title">Extraction slices</title>
      <desc id="slices-desc">The ordered path from creating the subtree inside the engine repository to cutting it into its own repository, showing which slices only move files, which change behaviour and need a governance record, and the freeze that precedes the irreversible step.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ARROWS (before boxes) -->
      <line x1="500" y1="112" x2="500" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="508" y="128" width="132" height="12" rx="2" fill="#f5f5f5"/>
      <text x="516" y="137" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PRECONDITION · #356</text>

      <line x1="500" y1="232" x2="500" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="352" x2="500" y2="408" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="500" y1="472" x2="500" y2="520" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="500" y1="600" x2="500" y2="648" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="508" y="612" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="516" y="621" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">YES</text>

      <line x1="600" y1="560" x2="720" y2="560" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="632" y="534" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="644" y="543" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <line x1="500" y1="712" x2="500" y2="768" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="500" y1="824" x2="500" y2="880" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="508" y="840" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="516" y="849" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">POINT OF NO RETURN</text>

      <!-- NODE 1: oval start -->
      <rect x="340" y="56" width="320" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="340" y="56" width="320" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="356" y="64" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="372" y="73" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MOVE</text>
      <text x="500" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1 · Subtree is born</text>
      <text x="500" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git mv · pointer CLAUDE.md · gate in warn</text>

      <!-- NODE 2 -->
      <rect x="340" y="168" width="320" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="168" width="320" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="356" y="176" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="366" y="185" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">T3</text>
      <text x="500" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2–3 · Kill the pairs and the wrappers</text>
      <text x="500" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chart origin changes · the boundary scoreboard falls</text>

      <!-- NODE 3 -->
      <rect x="340" y="288" width="320" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="288" width="320" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="356" y="296" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="372" y="305" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MOVE</text>
      <text x="500" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4–5 · Move the charts, then the gates</text>
      <text x="500" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~10 charts · 43 gates classified, ~8 travel</text>

      <!-- NODE 4: FOCAL -->
      <rect x="340" y="408" width="320" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="408" width="320" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="356" y="416" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="372" y="425" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
      <text x="500" y="440" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">6 · Boundary gate flips to Deny, green</text>
      <text x="500" y="456" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the scoreboard reads 0 · ready to cut</text>

      <!-- NODE 5: decision diamond -->
      <polygon points="500,516 600,560 500,604 400,560" fill="#f5f5f5"/>
      <polygon points="500,516 600,560 500,604 400,560" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="556" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">T3 record filed?</text>
      <text x="500" y="572" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">two ADRs RATIFIED</text>

      <!-- NODE 9: HOLD (side exit) -->
      <rect x="720" y="532" width="216" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="532" width="216" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="828" y="558" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hold slices 2, 3 and 7</text>
      <text x="828" y="574" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1, 4, 5, 6 proceed meanwhile</text>

      <!-- NODE 6 -->
      <rect x="340" y="648" width="320" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="648" width="320" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="356" y="656" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="366" y="665" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">T3</text>
      <text x="500" y="680" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">7a · Extract and graft</text>
      <text x="500" y="696" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">filter-repo · merge --allow-unrelated-histories</text>

      <!-- NODE 7: FREEZE -->
      <rect x="340" y="768" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="768" width="320" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="356" y="776" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="372" y="785" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FREEZE</text>
      <text x="500" y="800" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">No composition edits, either side</text>
      <text x="500" y="816" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">need one? abort 7a — never edit a copy</text>

      <!-- NODE 8: FOCAL oval end -->
      <rect x="340" y="880" width="320" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="340" y="880" width="320" height="56" rx="20" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="906" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">7b · Repoint, then delete the local copy</text>
      <text x="500" y="922" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">only after task setup is green without it</text>

      <!-- LEGEND -->
      <line x1="32" y1="960" x2="968" y2="960" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="976" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="112" y="968" width="12" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="132" y="976" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">SLICE</text>

      <rect x="216" y="968" width="12" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="236" y="976" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FOCAL · CRITERION AND CUT</text>

      <rect x="452" y="968" width="12" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="472" y="976" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">PASSIVE · NOT A COMMIT</text>

      <polygon points="656,964 684,972 656,980" fill="none" stroke="#2d3142" stroke-width="1"/>
      <text x="696" y="976" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">DECISION</text>

      <text x="800" y="976" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">T3 · NEEDS THE RECORD</text>
    </svg>
  </div>
</body>
</html>
