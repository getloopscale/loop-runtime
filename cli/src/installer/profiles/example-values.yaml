# LoopZero Platform — Customer Values
# Copy this file and fill in your configuration.
# Install with: loopzero platform install -f my-values.yaml --profile production

# Required: base domain for the platform
domain: "paas.example.com"

# TLS certificate issuer (cert-manager ClusterIssuer name)
clusterIssuer: "letsencrypt-prod"

# Database — bring your own PostgreSQL or let LoopZero install one
database:
  external: false              # true = use your own PG, false = install via Helm
  # url: "postgres://user:pass@pg.example.com:5432/loopzero?sslmode=require"

# Container registry for tenant app images
registry:
  type: "harbor"               # docr | harbor | ecr | gcr
  endpoint: "harbor.example.com"
  # username: "robot$loopzero"
  # password: "..."

# Authentication — bundled (Ory Kratos+Hydra) or external OIDC
auth:
  type: "bundled"              # bundled | external
  # External OIDC (when type=external):
  # issuer: "https://auth.example.com"
  # clientId: "loopzero"

# Artifact storage (S3-compatible) for source bundles and build cache
storage:
  endpoint: "s3.amazonaws.com"
  bucket: "loopzero-artifacts"
  # accessKey: "..."
  # secretKey: "..."

# Sizing profile
profile: "production"          # minimal | production
