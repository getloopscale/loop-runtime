{{- if .Values.vaps.requireImageDigest }}
# ValidatingAdmissionPolicy: Require image@sha256:<digest> references for
# platform (control-plane) pods. T2.3 of maturity-3-62-to-4-0-roadmap plan.
#
# Why: a tag like :v1.2.3 is mutable — anyone with push access to DOCR
# can re-tag the same name to point at a malicious image. Next pod restart
# (HPA scale-up, eviction, OOM kill) fetches the new image, which may even
# be signed (keyless cert mints for ANY workload identity). Enforcing
# image@sha256:<digest> makes the reference immutable: a different content
# hash = a different reference, surfacing the swap at admission time.
#
# Layered defense:
#   - This VAP enforces digest immutability (Kubernetes-native, 1.30+).
#   - sigstore policy-controller (cluster-image-policy.yaml) enforces
#     signature presence + identity match (keyed or keyless).
#   - Together = SLSA L3-equivalent supply chain.
#
# Progressive rollout (EC-5 of plan):
#   - Phase 1 (NOW): validationActions=[Warn, Audit], failurePolicy=Ignore.
#     Operator collects 7-day soak data via Prometheus
#     (apiserver_admission_policy_check_failures_total filtered by
#     policy="loopruntime-require-image-digest").
#   - Phase 2 (sponsor-flip, post-soak): validationActions=[Deny, Audit].
#     Same policy spec, just the binding changes.
#
# Scope: platform namespaces only (loopruntime-system, loopruntime-system-build, argocd).
# Tenant workloads use a separate policy because their build pipeline emits
# digests via `loopruntime deploy` automatically — this is already enforced by
# loopruntime-restrict-registries.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: loopruntime-require-image-digest
spec:
  failurePolicy: Ignore  # warn-mode: don't block API server if CEL errors
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  # CEL expressions — checks every container reference contains "@sha256:".
  # Image references like "loopruntime-api@sha256:abc..." pass; "loopruntime-api:v1.2.3" fails.
  validations:
    - expression: >-
        object.spec.containers.all(c, c.image.contains('@sha256:'))
      message: "Image reference must be immutable: use image@sha256:<digest>, not image:<tag>. See docs/architecture.md."
    - expression: >-
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(c, c.image.contains('@sha256:'))
      message: "Init container image reference must be immutable: use image@sha256:<digest>."
    - expression: >-
        !has(object.spec.ephemeralContainers) ||
        object.spec.ephemeralContainers.all(c, c.image.contains('@sha256:'))
      message: "Ephemeral container image reference must be immutable: use image@sha256:<digest>."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: loopruntime-require-image-digest-binding
spec:
  policyName: loopruntime-require-image-digest
  # Phase 1: Warn + Audit only. Sponsor flips to [Deny, Audit] after 7-day
  # soak shows zero violations across all platform pods.
  validationActions:
    {{- if .Values.vaps.requireImageDigestEnforce }}
    - Deny
    - Audit
    {{- else }}
    - Warn
    - Audit
    {{- end }}
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - loopruntime-system
            - loopruntime-system-build
            - argocd
{{- end }}
