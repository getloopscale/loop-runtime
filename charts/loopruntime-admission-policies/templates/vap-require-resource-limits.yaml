{{- if .Values.vaps.requireResourceLimits }}
# ValidatingAdmissionPolicy: Require resource limits on all tenant containers.
# Prevents unbounded resource consumption in multi-tenant cluster.
# Covers: containers, initContainers (F2-C1). Ephemeral containers excluded (debug use).
# MEET-2026-03-30-021 Phase 2.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: loopruntime-require-resource-limits
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        runtime.getloopscale.com/managed-by: environment-controller
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.resources) && has(c.resources.limits) &&
          has(c.resources.limits.memory) && has(c.resources.limits.cpu))
      message: "All containers must have CPU and memory limits defined."
    - expression: >-
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(c,
          has(c.resources) && has(c.resources.limits) &&
          has(c.resources.limits.memory) && has(c.resources.limits.cpu))
      message: "All init containers must have CPU and memory limits defined."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: loopruntime-require-resource-limits-binding
spec:
  policyName: loopruntime-require-resource-limits
  validationActions:
    - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        runtime.getloopscale.com/managed-by: environment-controller
{{- end }}
