{{- if .Values.alerts.sigstoreEnabled }}
{{- if .Values.tufRootCeremonyDate }}
# T1.2.b of plan 2026-05-27-tenant-build-pipeline-gaps-closure.
# Per v1.1 EC-NEW-2 fix: emit tuf_root_expiry_timestamp metric daily
# so TUF expiry alerts (LoopRuntimeTufRootExpirySoon/Critical) have data.
#
# Without this CronJob, alerts render but never fire = orphan metric
# ("implemented but not wired" anti-pattern).
#
# Disabled if tufRootCeremonyDate is empty (chart default) — safer to
# skip the alert than emit garbage data.
#
# Operator post-Sigstore-activation flow:
#   1. Execute offline TUF ceremony (docs/runbooks.md)
#   2. Extract ceremony date: pulumi stack output tufCeremonyDate
#   3. helmfile -e prod sync --set tufRootCeremonyDate=<ISO-8601-date>
#   4. Verify CronJob next-fire time + first-run output
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tuf-expiry-emitter
  namespace: sigstore-system
  labels:
    app.kubernetes.io/name: loopruntime-admission-policies
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    runtime.getloopscale.com/component: sigstore
    runtime.getloopscale.com/plan: tenant-build-pipeline-gaps-closure
    runtime.getloopscale.com/task: T1.2.b
spec:
  # Schedule: daily 04:00 UTC (off-peak)
  schedule: "0 4 * * *"
  # Prevent overlapping runs (idempotent computation, but Pushgateway
  # POST is fast enough that Forbid is harmless).
  concurrencyPolicy: Forbid
  # Keep last 3 of each for debugging
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300  # 5min hard cap
      template:
        metadata:
          labels:
            runtime.getloopscale.com/component: sigstore
            runtime.getloopscale.com/job: tuf-expiry-emitter
        spec:
          restartPolicy: OnFailure
          containers:
            - name: emitter
              image: curlimages/curl:8.7.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu

                  # Configuration from environment + Helm values
                  CEREMONY_DATE="$TUF_CEREMONY_DATE"   # ISO-8601 from values
                  EXPIRY_DAYS="${EXPIRY_DAYS:-365}"    # Annual rotation
                  PUSHGW_URL="${PUSHGATEWAY_URL:-http://prometheus-pushgateway.monitoring.svc.cluster.local:9091}"

                  # Compute expiry timestamp = ceremonyDate + 365 days (in epoch seconds)
                  CEREMONY_EPOCH=$(date -u -d "$CEREMONY_DATE" +%s 2>/dev/null || \
                                   date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "$CEREMONY_DATE" +%s)
                  EXPIRY_EPOCH=$((CEREMONY_EPOCH + EXPIRY_DAYS * 86400))

                  echo "[tuf-expiry-emitter] ceremony=$CEREMONY_DATE ($CEREMONY_EPOCH)"
                  echo "[tuf-expiry-emitter] expiry=$EXPIRY_EPOCH (after $EXPIRY_DAYS days)"
                  echo "[tuf-expiry-emitter] pushgateway=$PUSHGW_URL"

                  # POST metric to Pushgateway with 48h TTL (TUF expiry
                  # alerts are slower-cadence than a 24h push)
                  cat <<EOF | curl --max-time 30 --connect-timeout 5 \
                    -X POST \
                    -H "Content-Type: text/plain" \
                    -H "Push-Lifetime: 172800" \
                    --data-binary @- \
                    "$PUSHGW_URL/metrics/job/tuf-expiry-emitter/instance/sigstore-system"
                  # HELP tuf_root_expiry_timestamp Unix epoch when TUF root expires (ceremonyDate + 365d)
                  # TYPE tuf_root_expiry_timestamp gauge
                  tuf_root_expiry_timestamp $EXPIRY_EPOCH
                  EOF

                  echo "[tuf-expiry-emitter] pushed successfully"
              env:
                - name: TUF_CEREMONY_DATE
                  value: {{ .Values.tufRootCeremonyDate | quote }}
                - name: EXPIRY_DAYS
                  value: "365"
                - name: PUSHGATEWAY_URL
                  value: "http://prometheus-pushgateway.monitoring.svc.cluster.local:9091"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534  # nobody
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
{{- end }}
{{- end }}
