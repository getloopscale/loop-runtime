{{- if .Values.crds.tenants.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.loopzero.io
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    controller-gen.kubebuilder.io/version: {{ .Values.controllerGenVersion | default "v0.17.2" }}
spec:
  group: loopzero.io
  names:
    kind: Tenant
    listKind: TenantList
    plural: tenants
    singular: tenant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.plan
      name: Plan
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          Tenant is the Schema for the tenants API.
          A Tenant represents a team/account in LoopZero, with its own namespaces,
          RBAC, quotas, and GitOps repository.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TenantSpec defines the desired state of a Tenant as described
              in spec section 9.2.
            properties:
              cellID:
                default: cell-default
                description: |-
                  CellID identifies which Cell this tenant's workloads run in.
                  ADR-0008: Phase 0 defaults to "cell-default" (single Cell).
                  Phase 1+ PlacementEngine assigns tenants to specific Cells.
                minLength: 1
                type: string
              displayName:
                description: |-
                  DisplayName is the human-readable name of the tenant.
                  SEC-011: Pattern constraint prevents injection of control characters or markup.
                maxLength: 128
                minLength: 1
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9 _.\-]*$
                type: string
              environments:
                description: Environments lists the environments available to this
                  tenant.
                items:
                  description: |-
                    TenantEnvironmentEntry defines an environment reference within a Tenant spec.
                    ARCH-004: Renamed from EnvironmentSpec to resolve naming collision with EnvironmentCRSpec.
                  properties:
                    cluster:
                      description: Cluster is the target cluster for this environment.
                      type: string
                    name:
                      description: Name is the environment name (e.g., "production",
                        "staging").
                      type: string
                  required:
                  - cluster
                  - name
                  type: object
                minItems: 1
                type: array
              gitops:
                description: GitOps configures the tenant's GitOps repository.
                properties:
                  branch:
                    description: 'Branch is the branch used for GitOps (default: "main").'
                    minLength: 1
                    type: string
                  repoName:
                    description: RepoName is the name of the GitOps repository in
                      Gitea.
                    minLength: 1
                    type: string
                required:
                - branch
                - repoName
                type: object
              limits:
                description: Limits defines resource limits for the tenant.
                properties:
                  maxBuildConcurrency:
                    description: MaxBuildConcurrency is the maximum number of concurrent
                      builds.
                    minimum: 1
                    type: integer
                  maxCPU:
                    anyOf:
                    - type: integer
                    - type: string
                    description: MaxCPU is the maximum CPU allowed across all tenant
                      namespaces.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  maxMemory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: MaxMemory is the maximum memory allowed across all
                      tenant namespaces.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  maxStorage:
                    anyOf:
                    - type: integer
                    - type: string
                    description: MaxStorage is the maximum storage allowed across
                      all tenant namespaces.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                required:
                - maxBuildConcurrency
                - maxCPU
                - maxMemory
                - maxStorage
                type: object
              plan:
                description: 'Plan is the subscription tier: starter, growth, or enterprise.'
                enum:
                - starter
                - growth
                - enterprise
                type: string
              preview:
                description: Preview configures preview environment limits.
                properties:
                  maxEnvironments:
                    description: MaxEnvironments is the maximum number of concurrent
                      preview environments.
                    type: integer
                  ttlHours:
                    description: TTLHours is the default time-to-live for preview
                      environments in hours.
                    type: integer
                required:
                - maxEnvironments
                - ttlHours
                type: object
            required:
            - displayName
            - environments
            - gitops
            - limits
            - plan
            - preview
            type: object
          status:
            description: TenantStatus defines the observed state of a Tenant.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the tenant's state.
                  Condition types: GitRepoReady, NamespacesReady, RBACReady, QuotaEnforced,
                  NetworkPolicyReady, BuildNamespaceReady.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              gitopsRepo:
                description: GitOpsRepo is the URL of the provisioned GitOps repository.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: Phase represents the overall tenant lifecycle phase.
                enum:
                - Provisioning
                - Active
                - Suspended
                - PendingDeletion
                - Deleting
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
