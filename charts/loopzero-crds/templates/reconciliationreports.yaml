{{- if .Values.crds.reconciliationreports.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: reconciliationreports.loopzero.io
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    controller-gen.kubebuilder.io/version: {{ .Values.controllerGenVersion | default "v0.17.2" }}
spec:
  group: loopzero.io
  names:
    kind: ReconciliationReport
    listKind: ReconciliationReportList
    plural: reconciliationreports
    singular: reconciliationreport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.clusterState
      name: State
      type: string
    - jsonPath: .spec.environment
      name: Environment
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          ReconciliationReport is the Schema for the reconciliationreports API.
          It reports drift between desired state (Git) and actual state (cluster).
          The StateReconciler is observational only and never modifies Git or cluster state.
          See spec section 13.

          NOTE: This CRD is currently dead code — no controller implements reconciliation
          for this type and no sprint is assigned for its implementation. It is retained
          as a placeholder for future drift-detection work. Do not depend on its schema
          being stable.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ReconciliationReportSpec defines the desired reconciliation
              checking behavior.
            properties:
              authorizedControllers:
                description: AuthorizedControllers lists controllers whose mutations
                  are considered expected.
                items:
                  description: AuthorizedController identifies a controller whose
                    field mutations are expected.
                  properties:
                    fields:
                      description: Fields lists the fields this controller is authorized
                        to modify.
                      items:
                        type: string
                      type: array
                    name:
                      description: Name is the human-readable name of the controller
                        (e.g., "HPA", "cert-manager").
                      type: string
                  required:
                  - fields
                  - name
                  type: object
                type: array
              checkInterval:
                description: CheckInterval is how often to check for drift (e.g.,
                  "60s").
                type: string
              driftThreshold:
                description: DriftThreshold is how long drift must persist before
                  alerting (e.g., "300s").
                type: string
              environment:
                description: Environment is the environment being monitored.
                type: string
              excludeAnnotations:
                description: ExcludeAnnotations lists annotation prefixes to ignore
                  during drift detection.
                items:
                  type: string
                type: array
              excludeFields:
                description: ExcludeFields lists field paths to ignore during drift
                  detection.
                items:
                  type: string
                type: array
              excludeLabels:
                description: ExcludeLabels lists label prefixes to ignore during drift
                  detection.
                items:
                  type: string
                type: array
              projectId:
                description: ProjectID is the project being monitored.
                type: string
              tenantId:
                description: TenantID is the tenant being monitored.
                type: string
            required:
            - checkInterval
            - driftThreshold
            - environment
            - projectId
            - tenantId
            type: object
          status:
            description: ReconciliationReportStatus defines the observed reconciliation
              state.
            properties:
              argoSyncCommit:
                description: ArgoSyncCommit is the commit SHA that ArgoCD last synced.
                type: string
              clusterState:
                description: ClusterState is the current synchronization state.
                type: string
              conditions:
                description: |-
                  Conditions represent the latest available observations.
                  Condition types: InSync.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              driftDetails:
                description: DriftDetails lists specific field-level drift information.
                items:
                  description: DriftDetail describes a specific field-level divergence
                    between Git and cluster.
                  properties:
                    cause:
                      description: Cause describes why the drift occurred (e.g., "HPA
                        scaled up").
                      type: string
                    clusterValue:
                      description: ClusterValue is the value in the cluster.
                      type: string
                    field:
                      description: Field is the specific field that drifted (e.g.,
                        "spec.replicas").
                      type: string
                    gitValue:
                      description: GitValue is the value in Git.
                      type: string
                    resource:
                      description: Resource identifies the drifted resource (e.g.,
                        "apps/v1/Deployment/api").
                      type: string
                  required:
                  - clusterValue
                  - field
                  - gitValue
                  - resource
                  type: object
                type: array
              driftDetectedAt:
                description: DriftDetectedAt is when drift was first detected (nil
                  if in sync).
                format: date-time
                type: string
              driftResolution:
                description: DriftResolution describes how the drift was resolved
                  (nil if no drift).
                type: string
              gitHeadCommit:
                description: GitHeadCommit is the latest Git commit SHA observed.
                type: string
              lastCheckedAt:
                description: LastCheckedAt is the last time a drift check was performed.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
