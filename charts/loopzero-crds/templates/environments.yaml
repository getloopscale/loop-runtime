{{- if .Values.crds.environments.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: environments.loopzero.io
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    controller-gen.kubebuilder.io/version: {{ .Values.controllerGenVersion | default "v0.17.2" }}
spec:
  group: loopzero.io
  names:
    kind: Environment
    listKind: EnvironmentList
    plural: environments
    singular: environment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          Environment is the Schema for the environments API.
          An Environment represents a single deployment target (e.g., production, staging)
          within a Tenant. It manages the namespace, RBAC, NetworkPolicy, and ResourceQuota
          for that environment.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EnvironmentCRSpec defines the desired state of an Environment.
              ARCH-004: The naming collision is resolved — EnvironmentSpec was renamed to
              TenantEnvironmentEntry in tenant_types.go. This type can be renamed to
              EnvironmentSpec in a future cleanup if desired.
            properties:
              environment:
                description: Environment is the environment name (e.g., "production",
                  "staging").
                minLength: 1
                type: string
              namespace:
                description: Namespace defines the target namespace for this environment.
                properties:
                  name:
                    description: Name is the explicit namespace name (e.g., "loopzero-loopzero-production").
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              networkPolicy:
                description: NetworkPolicy configures network isolation for the namespace.
                properties:
                  isolate:
                    default: true
                    description: Isolate enables network isolation (deny-all + allow-ingress
                      + allow-egress).
                    type: boolean
                required:
                - isolate
                type: object
              plan:
                description: Plan is the tenant's subscription tier, used to determine
                  RBAC rules.
                enum:
                - starter
                - growth
                - enterprise
                type: string
              project:
                description: |-
                  Project is the project segment of the canonical namespace formula
                  `loopzero-<tenant>-<project>-<env>`. T3.1 of plan
                  2026-06-09-m2-operator-canonical-fix v1.4: when populated by the
                  TenantController (from TenantEnvironmentEntry.Project — which T1.1
                  makes required at the CRD level), EnvironmentController computes the
                  canonical M2 namespace from this field + Environment instead of
                  trusting the Namespace.Name value. Optional at the EnvironmentCRSpec
                  level for backward-compatibility with pre-T3.1 CRs whose namespace
                  was hand-set via Spec.Namespace.Name; new CRs created by the
                  post-T3.1 TenantController populate it unconditionally.
                maxLength: 63
                pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$
                type: string
              resourceQuota:
                description: ResourceQuota defines optional resource limits for the
                  namespace.
                properties:
                  cpu:
                    description: CPU is the maximum CPU allowed (e.g., "8").
                    type: string
                  memory:
                    description: Memory is the maximum memory allowed (e.g., "16Gi").
                    type: string
                  storage:
                    description: Storage is the maximum storage allowed (e.g., "50Gi").
                    type: string
                required:
                - cpu
                - memory
                - storage
                type: object
              tenantRef:
                description: TenantRef references the parent Tenant CR by name.
                properties:
                  name:
                    description: Name is the name of the Tenant CR.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - environment
            - namespace
            - networkPolicy
            - plan
            - tenantRef
            type: object
          status:
            description: EnvironmentCRStatus defines the observed state of an Environment.
            properties:
              cellID:
                description: |-
                  CellID is the cell whose runtime cluster holds Namespace, recorded when
                  the namespace is provisioned. Deletion reads it so the namespace is
                  removed where it was created, even after the Tenant was re-pinned to
                  another cell or is already gone.
                type: string
              conditions:
                description: |-
                  Conditions represent the latest available observations of the environment's state.
                  Condition types: NamespaceReady, RBACReady, NetworkPolicyReady, QuotaReady
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              namespace:
                description: Namespace is the actual namespace name managed by this
                  Environment.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: Phase represents the overall environment lifecycle phase.
                enum:
                - Pending
                - Active
                - Deleting
                - Failed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
