{{- if .Values.crds.previewenvironments.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: previewenvironments.loopzero.io
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    controller-gen.kubebuilder.io/version: {{ .Values.controllerGenVersion | default "v0.17.2" }}
spec:
  group: loopzero.io
  names:
    kind: PreviewEnvironment
    listKind: PreviewEnvironmentList
    plural: previewenvironments
    singular: previewenvironment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.branch
      name: Branch
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          PreviewEnvironment is the Schema for the previewenvironments API.
          It represents a temporary environment created for a pull request.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PreviewEnvironmentSpec defines the desired state of a PreviewEnvironment
              as described in spec section 9.2.
            properties:
              branch:
                description: Branch is the source branch for the preview.
                minLength: 1
                type: string
              cellId:
                description: |-
                  CellID is the multi-cell routing target for this preview environment.
                  T1.1 of deep-review-remediation-plan (closes find_arch_002 HIGH):
                  previously absent, causing PreviewController to route ALL preview
                  workloads to the static CELL_0_KUBECONFIG cell, ignoring the
                  tenant's pinned cell. Cell-2 tenants' previews silently landed on
                  cell-0 — multi-cell isolation breach.

                  When CellID is empty (legacy CRs created pre-T1.1), the controller
                  falls back to tenant.Spec.CellID via tenant lookup. Going forward,
                  the API submitting the CR sets CellID at creation time.
                type: string
              expiresAt:
                description: ExpiresAt is the time at which this preview should be
                  automatically cleaned up.
                format: date-time
                type: string
              prNumber:
                description: PRNumber is the pull request number that triggered this
                  preview.
                minimum: 1
                type: integer
              projectId:
                description: ProjectID is the project this preview belongs to.
                minLength: 1
                type: string
              publicURL:
                description: |-
                  PublicURL is the user-facing URL of this preview, computed once by the
                  API with pkg/naming.PreviewURL (tenant, project, entry app and the
                  public preview domain). The controller reports it in Status.URL and
                  never derives a URL of its own: the formula has one owner. Empty when
                  the API has no public preview domain configured.
                type: string
              releaseId:
                description: ReleaseID is the release associated with this preview.
                type: string
              tenantId:
                description: TenantID is the owning tenant identifier.
                minLength: 1
                type: string
            required:
            - branch
            - expiresAt
            - prNumber
            - projectId
            - releaseId
            - tenantId
            type: object
          status:
            description: PreviewEnvironmentStatus defines the observed state of a
              PreviewEnvironment.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the preview's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              createdAt:
                description: CreatedAt is the time the preview environment was actually
                  created.
                format: date-time
                type: string
              phase:
                description: Phase represents the current lifecycle phase. See state
                  machine 5.3.
                type: string
              url:
                description: URL is the publicly accessible URL for this preview environment.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
