{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loopzero-common.fullname" . }}
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  GITEA_TOKEN: {{ .Values.secrets.giteaToken | quote }}
{{- end }}
