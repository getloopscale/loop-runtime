apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: loopzero-cache-restore
  labels:
    app.kubernetes.io/name: loopzero-build
    app.kubernetes.io/component: build-pipeline
    app.kubernetes.io/part-of: loopzero
spec:
  templates:
    - name: restore-cache
      # Cache hops talk to MinIO over the network. A transient error here failed
      # the whole build with no attempt to recover (SD-10.5, audit 2026-09-07).
      # Bounded tighter than clone: a cache miss is recoverable by rebuilding,
      # so this retries briefly and gets out of the way rather than holding a
      # build slot.
      retryStrategy:
        limit: "2"
        retryPolicy: "OnError"
        backoff:
          duration: "3s"
          factor: "2"
          maxDuration: "20s"
      inputs:
        parameters:
          - name: tenant-id
            description: "Tenant identifier for isolation"
          - name: project-id
            description: "Project identifier"
          - name: cache-key
            description: "Cache key identifier (e.g., node-modules)"
          - name: cache-key-suffix
            description: "Optional suffix appended to cache key (e.g., lockfile hash for precise invalidation)"
            default: ""
      container:
        # MOD-4 fix: Replaced amazon/aws-cli (~200MB) with minio/mc (~30MB).
        # Faster image pull on the hot path (cache hit).
        image: minio/mc:RELEASE.2025-08-13T08-35-41Z
        # Credentials injected from K8s Secret via envFrom — never as workflow parameters.
        # Secret loopzero-minio-credentials provides: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, MINIO_ENDPOINT
        env:
          - name: HOME
            value: /tmp
        envFrom:
          - secretRef:
              name: {{ .Values.minio.existingSecret | default "loopzero-minio-credentials" }}
        command:
          - sh
          - -c
          - |
            set -euo pipefail

            # Configure mc alias for MinIO
            # MOD-6 fix: --insecure flag parametrized via Helm values (not hardcoded).
            mc alias set loopzero "$MINIO_ENDPOINT" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" \
              {{- if .Values.minio.insecure }}
              --insecure \
              {{- end }}
              --api S3v4 >/dev/null 2>&1

            # Compute lockfile hash for cache key precision.
            # If an explicit suffix is provided, use it. Otherwise, auto-detect
            # the lockfile from /workspace (available because clone runs first)
            # and hash it. This ensures cache invalidates when dependencies change.
            SUFFIX="{{ "{{inputs.parameters.cache-key-suffix}}" }}"
            if [ -z "$SUFFIX" ]; then
              LOCKFILE=""
              for f in /workspace/package-lock.json /workspace/yarn.lock /workspace/pnpm-lock.yaml \
                       /workspace/go.sum /workspace/requirements.txt /workspace/poetry.lock; do
                if [ -f "$f" ]; then
                  LOCKFILE="$f"
                  break
                fi
              done
              if [ -n "$LOCKFILE" ]; then
                SUFFIX=$(sha256sum "$LOCKFILE" | cut -c1-12)
                echo "Computed cache suffix from ${LOCKFILE##*/}: ${SUFFIX}"
              fi
            fi

            if [ -n "$SUFFIX" ]; then
              CACHE_KEY="{{ "{{inputs.parameters.tenant-id}}" }}/{{ "{{inputs.parameters.project-id}}" }}/{{ "{{inputs.parameters.cache-key}}" }}-${SUFFIX}"
            else
              CACHE_KEY="{{ "{{inputs.parameters.tenant-id}}" }}/{{ "{{inputs.parameters.project-id}}" }}/{{ "{{inputs.parameters.cache-key}}" }}"
            fi
            CACHE_PATH="loopzero/{{ .Values.sourceBucket }}/{{ "{{inputs.parameters.tenant-id}}" }}/cache/deps/${CACHE_KEY}.tar.gz"

            mc cp "${CACHE_PATH}" /tmp/cache.tar.gz \
              {{- if .Values.minio.insecure }}
              --insecure \
              {{- end }}
              2>&1 || {
              echo "Cache miss — no cached dependencies found for ${CACHE_KEY}"
              exit 0
            }

            cd /workspace
            tar xzf /tmp/cache.tar.gz 2>&1 || echo "Cache extraction failed — treating as miss"
            rm -f /tmp/cache.tar.gz
            echo "Cache restored from ${CACHE_KEY}"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
      # Cache restore is best-effort — failure should not block the build.
      # Bumped 120s→600s for L3+ scale: with 100 concurrent builds pulling from
      # MinIO standalone, even tuned, cold-cache restores can queue past 120s.
      # Failure at 600s is a real MinIO problem worth investigating (not a
      # false-positive from queue pressure).
      activeDeadlineSeconds: 600
