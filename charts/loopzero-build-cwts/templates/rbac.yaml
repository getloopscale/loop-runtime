{{- if .Values.workflow.serviceAccount.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loopzero-build-sa
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: loopzero-platform
    app.kubernetes.io/component: build
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loopzero-build-sa
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: loopzero-platform
    app.kubernetes.io/component: build
subjects:
  - kind: ServiceAccount
    name: {{ .Values.workflow.serviceAccount.name | default "loopzero-build-sa" }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: loopzero-build-sa
  apiGroup: rbac.authorization.k8s.io
---
# Workflow submitter — allows API to create workflows in this namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loopzero-workflow-submitter
  labels:
    app.kubernetes.io/part-of: loopzero-platform
    app.kubernetes.io/component: build
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates", "clusterworkflowtemplates"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loopzero-workflow-submitter
  labels:
    app.kubernetes.io/part-of: loopzero-platform
    app.kubernetes.io/component: build
subjects:
  - kind: ServiceAccount
    name: {{ .Values.workflow.serviceAccount.name | default "loopzero-build-sa" }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: loopzero-workflow-submitter
  apiGroup: rbac.authorization.k8s.io
{{- end }}
