# SEC-009 fix: Default-deny egress for build pods with explicit allowlist.
# Without this, compromised builds can exfiltrate source code/credentials to any host.
# The loopzero-system namespace has NetworkPolicies; this extends coverage to build pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: build-pod-egress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: loopzero-build
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: loopzero
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Allow DNS resolution (required by all pods)
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow MinIO/S3 access (source bundles, cache, static assets)
    - to: []
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 443
    # Allow container registry access (image push)
    - to: []
      ports:
        - protocol: TCP
          port: 5000
    # Allow HTTP/HTTPS for package managers (npm, pip, go mod)
    - to: []
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    # Fix 6 (CHG-2026-04-24-INSTALLER-E2E): Platform control-plane services.
    # Without these, loopzero-api running in loopzero-system (same namespace as build
    # pods because podSelector: {}) cannot reach Gitea (3000), Hydra public
    # (4444), Hydra admin (4445), PostgreSQL (5432), or ArgoCD server (8080).
    # Result was connection refused from every loopzero-api pod despite services
    # resolving via DNS. These are internal control-plane ports; external
    # egress to them would be blocked anyway by namespace-level ingress rules
    # on those target services.
    - to: []
      ports:
        - protocol: TCP
          port: 3000   # Gitea HTTP
        - protocol: TCP
          port: 4444   # Ory Hydra public
        - protocol: TCP
          port: 4445   # Ory Hydra admin
        - protocol: TCP
          port: 5432   # PostgreSQL (CNPG rw/ro/r services)
        - protocol: TCP
          port: 8080   # ArgoCD server (insecure mode) + loopzero-api health
        - protocol: TCP
          port: 8443   # ArgoCD server (TLS) + webhook receivers
