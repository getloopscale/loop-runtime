apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: loopzero-clone
  labels:
    app.kubernetes.io/name: loopzero-build
    app.kubernetes.io/component: build-pipeline
    app.kubernetes.io/part-of: loopzero
spec:
  templates:
    - name: clone-repo
      inputs:
        parameters:
          - name: tenant-id
            description: "Tenant identifier for isolation"
          - name: build-id
            description: "Build identifier — maps to the source bundle path in MinIO"
      retryStrategy:
        limit: "2"
        retryPolicy: "OnFailure"
        backoff:
          duration: "5s"
          factor: "2"
          maxDuration: "30s"
      container:
        # SEC-004: Custom image with mc + git baked in (no runtime downloads).
        # Built from: infra/images/clone-runner/Dockerfile
        # CI builds via build-images.yml, local via task images:build.
        image: {{ .Values.images.cloneRunner | default "registry.digitalocean.com/loopzero-system/loopzero-clone-runner:v0.1.0" }}
        env:
          - name: HOME
            value: /tmp
        {{- include "loopzero-build-cwts.secretEnv" . | trim | nindent 8 }}
        command:
          - sh
          - -c
          - |
            set -euo pipefail

            # Jitter before touching the object store (SRE-08.3, audit 2026-09-07).
            #
            # retryStrategy below backs off 5s/10s/20s with factor 2 and Argo has
            # no jitter field, so a burst of clones retries in lockstep. That is
            # the documented failure mode: clone-repo exhausts its retry budget
            # at roughly 4+ concurrent builds within 30s on a cold cluster, while
            # maxConcurrentBuildsPerCell allows 20. Synchronised retries make the
            # contention they are recovering from worse.
            #
            # 0-3s of spread costs nothing on the happy path and breaks the herd.
            JITTER=$(( RANDOM % 4 ))
            [ "$JITTER" -gt 0 ] && sleep "$JITTER"

            BUNDLE_PATH="{{ "{{inputs.parameters.tenant-id}}" }}/source/{{ "{{inputs.parameters.build-id}}" }}.bundle"
            echo "Downloading source bundle: ${BUNDLE_PATH}"

            {{- include "loopzero-build-cwts.mcAlias" . | trim | nindent 12 }}

            mc cp \
              {{- if .Values.minio.insecure }}
              --insecure \
              {{- end }}
              "loopzero/{{ .Values.sourceBucket }}/${BUNDLE_PATH}" /tmp/source.bundle 2>&1 || {
              echo "ERROR: Failed to download source bundle"
              exit 1
            }

            echo "Bundle downloaded: $(stat -c%s /tmp/source.bundle) bytes"

            # Clone from bundle into temp dir, then copy contents to workspace
            # Use cp -r (not cp -a) because non-root cannot preserve ownership/timestamps
            git clone /tmp/source.bundle /tmp/repo
            cp -r /tmp/repo/. /workspace/
            rm -rf /tmp/repo /tmp/source.bundle

            echo "Source unpacked into /workspace"
            ls -la /workspace
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
