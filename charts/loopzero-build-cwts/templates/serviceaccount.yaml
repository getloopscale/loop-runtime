{{- if .Values.workflow.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workflow.serviceAccount.name | default "loopzero-build-sa" }}
  # CHG-2026-04-25-E2E: hardcoded "argo" because the Argo workflow
  # controller runs there, and it spawns build pods that mount this
  # ServiceAccount. When this chart is included as a sub-chart of the
  # loopzero-platform umbrella (Release.Namespace=loopzero-system), the SA would
  # land in loopzero-system and workflow pods would fail with
  # "ServiceAccount not found in argo".
  namespace: argo
  labels:
    app.kubernetes.io/part-of: loopzero-platform
    app.kubernetes.io/component: build
automountServiceAccountToken: true
# CHG-2026-04-25-E2E: build pods need to pull images from the same DOCR
# the platform uses (loopzero-clone-runner, loopzero-packs-runner, loopzero-cosign-signer).
# The installer's Step 3 creates `loopzero-system-pull` secret in the argo
# namespace; we wire it here so workflow pods inherit auth.
imagePullSecrets:
  - name: loopzero-system-pull
{{- end }}
