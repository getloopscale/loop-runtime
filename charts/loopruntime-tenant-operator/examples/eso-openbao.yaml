# loopruntime-tenant-operator secrets via External Secrets Operator -> openbao
# Apply: kubectl apply -f eso-openbao.yaml ; then helm install ... --set secrets.existingSecret=loopruntime-tenant-operator-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: loopruntime-tenant-operator-openbao
spec:
  provider:
    vault:
      server: "https://!!changeme-openbao-host!!:8200"
      path: "secret"
      version: "v2"
      auth:
        appRole:
          path: "approle"
          roleId: "!!changeme-role-id!!"
          secretRef:
            name: openbao-approle
            namespace: external-secrets
            key: secret_id
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loopruntime-tenant-operator-secrets
  namespace: loopruntime-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: loopruntime-tenant-operator-openbao
    kind: ClusterSecretStore
  target:
    name: loopruntime-tenant-operator-secrets
    creationPolicy: Owner
  data:
    - secretKey: DIGITALOCEAN_TOKEN
      remoteRef: { key: "loopruntime/tenant-operator", property: "digitalocean_token" }
    - secretKey: GITEA_TOKEN
      remoteRef: { key: "loopruntime/tenant-operator", property: "gitea_token" }
    - secretKey: MINIO_ACCESS_KEY
      remoteRef: { key: "loopruntime/tenant-operator", property: "minio_access_key" }
    - secretKey: MINIO_SECRET_KEY
      remoteRef: { key: "loopruntime/tenant-operator", property: "minio_secret_key" }
    - secretKey: REGISTRY_DOCKER_CONFIG
      remoteRef: { key: "loopruntime/tenant-operator", property: "registry_docker_config" }
    - secretKey: SPACES_ACCESS_KEY_ID
      remoteRef: { key: "loopruntime/tenant-operator", property: "spaces_access_key_id" }
    - secretKey: SPACES_SECRET_ACCESS_KEY
      remoteRef: { key: "loopruntime/tenant-operator", property: "spaces_secret_access_key" }
