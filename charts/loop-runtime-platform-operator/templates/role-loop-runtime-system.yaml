{{- if .Values.rbac.create }}
# Secret access in loop-runtime-system, the namespace every platform CR lives in.
#
# Read, list and watch — through the manager's Secret cache, scoped to this
# namespace and the ArgoCD one (operators/cmd/platform-operator
# managerCacheOptions):
#   - clustercredential_controller: the kubeconfig Secret of each
#     ClusterCredential, and a watch on Secrets so a rotated kubeconfig
#     requeues its credential
#   - platformbootstrap_controller: the Gitea admin Secret and platform-tokens
#   - gitrepositorybinding_controller: the Git credential Secret
# Update — platformbootstrap_controller stores the Gitea and ArgoCD tokens in
# platform-tokens. The operator creates no Secret here.
#
# Delete is a separate rule on ONE named resource: platform-tokens, the only
# Secret the platformbootstrap_controller removes (on PlatformBootstrap
# deletion, and only when it carries this controller's managed-by label).
#
# The namespace is the literal the binary uses (constants.NamespacePlatformSystem),
# not .Release.Namespace: the operator reads loop-runtime-system wherever it is installed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "loop-runtime-common.fullname" . }}-secrets-loop-runtime-system
  namespace: loop-runtime-system
  labels:
    {{- include "loop-runtime-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["platform-tokens"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "loop-runtime-common.fullname" . }}-secrets-loop-runtime-system
  namespace: loop-runtime-system
  labels:
    {{- include "loop-runtime-common.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "loop-runtime-common.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "loop-runtime-common.fullname" . }}-secrets-loop-runtime-system
{{- end }}
