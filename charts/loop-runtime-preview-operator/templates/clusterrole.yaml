{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "loop-runtime-common.fullname" . }}
  labels:
    {{- include "loop-runtime-common.labels" . | nindent 4 }}
rules:
  # --- LoopRuntime CRDs: previewenvironments ---
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["previewenvironments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["previewenvironments/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["previewenvironments/finalizers"]
    verbs: ["update"]

  # --- Cell routing: resolve the runtime cluster of a preview's cell ---
  # A preview is provisioned in the cell its tenant is placed in. The cell comes
  # from the PreviewEnvironment (or, for older CRs, its Tenant), and the cell's
  # kubeconfig from its ClusterCredential and that credential's Secret. The
  # Secret lives in loop-runtime-system and is read through a Secret cache scoped to
  # that namespace: the grant is the namespaced Role in role-secret-access.yaml,
  # not a rule here.
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["tenants", "clustercredentials"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.rbac.legacyClusterWideSecrets }}
  # Cutover escape hatch (values.yaml rbac.legacyClusterWideSecrets): an
  # operator image that predates the scoped Secret cache lists Secrets in
  # every namespace. Read only; off by default.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  {{- end }}

  # --- Namespaces: create/manage preview namespaces ---
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]

  # --- ResourceQuotas + LimitRanges: enforce preview resource limits ---
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update"]

  # --- NetworkPolicies: preview environment network isolation ---
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]

  # --- Events: emit Kubernetes events for observability ---
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]

  # --- Leader election: coordination lease for HA ---
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
