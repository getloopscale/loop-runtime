{{- if .Values.rbac.create }}
# Secret access on the management cluster, confined to loop-runtime-system.
#
# What the operator reads there, and nothing else: the kubeconfig Secret of
# each cell's ClusterCredential (CellAwareRuntimeClientFactory; a SecretRef in
# any other namespace is refused by the factory). The read goes through the
# manager cache, whose Secret informer is scoped to loop-runtime-system
# (operators/cmd/preview-operator managerCacheOptions) — hence list/watch alongside
# get. The operator writes no Secret on this cluster.
#
# The namespace is the literal the binary uses (constants.NamespacePlatformSystem),
# not .Release.Namespace: the operator reads loop-runtime-system wherever it is installed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "loop-runtime-common.fullname" . }}-secrets-loop-runtime-system
  namespace: loop-runtime-system
  labels:
    {{- include "loop-runtime-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "loop-runtime-common.fullname" . }}-secrets-loop-runtime-system
  namespace: loop-runtime-system
  labels:
    {{- include "loop-runtime-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "loop-runtime-common.fullname" . }}-secrets-loop-runtime-system
subjects:
  - kind: ServiceAccount
    name: {{ include "loop-runtime-common.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
