# helm-unittest: ServiceMonitor conditional rendering for loopruntime-cloud.
# Plan T1.5.

suite: servicemonitor conditional
templates:
  - servicemonitor.yaml

tests:
  - it: does NOT render ServiceMonitor when disabled
    set:
      metrics.serviceMonitor.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders ServiceMonitor when enabled
    set:
      metrics.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceMonitor

  - it: ServiceMonitor selector includes loopruntime-cloud app label
    set:
      metrics.serviceMonitor.enabled: true
    asserts:
      - matchRegex:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          pattern: "loopruntime-cloud"
