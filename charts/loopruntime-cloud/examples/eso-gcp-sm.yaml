# loopruntime-cloud secrets via External Secrets Operator → GCP Secret Manager
# (install-config-contract Slice 1, ADR D2). Auth via Workload Identity — NO static keys.
#
# Prereq: ESO installed + the ESO service account bound to a GCP service account (Workload
#         Identity) with roles/secretmanager.secretAccessor on the loopruntime-cloud-* secrets.
# Apply:  kubectl apply -f eso-gcp-sm.yaml
# Then:   helm install loopruntime-cloud … --set existingSecret=loopruntime-cloud-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: loopruntime-cloud-gcp-sm
spec:
  provider:
    gcpsm:
      projectID: "!!changeme-gcp-project-id!!"
      auth:
        workloadIdentity:
          clusterLocation: "!!changeme-region!!"
          clusterName: "!!changeme-cluster!!"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loopruntime-cloud-secrets
  namespace: loopruntime-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: loopruntime-cloud-gcp-sm
    kind: ClusterSecretStore
  target:
    name: loopruntime-cloud-secrets        # MUST equal the chart's existingSecret value
    creationPolicy: Owner
  data:
    # GCP Secret Manager secret names (one per key). Adjust remoteRef.key to your names.
    - secretKey: STRIPE_API_KEY
      remoteRef: { key: "loopruntime-cloud-stripe-api-key" }
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef: { key: "loopruntime-cloud-stripe-webhook-secret" }
    - secretKey: SESSION_TOKEN_SECRET
      remoteRef: { key: "loopruntime-cloud-session-token-secret" }
    - secretKey: LOOPRUNTIME_SERVICE_AUTH_SECRET
      remoteRef: { key: "loopruntime-cloud-service-auth-secret" }
    - secretKey: THEMORY_API_KEY
      remoteRef: { key: "loopruntime-cloud-themory-api-key" }
