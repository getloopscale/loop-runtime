# helm-unittest: securityContext rendering for loopruntime-api
# INF-G08 + Plan T2.2: validates security-critical template logic.
# Includes configmap.yaml because deployment.yaml references its checksum.

suite: securityContext rendering
templates:
  - deployment.yaml
  - configmap.yaml

tests:
  - it: renders pod-level securityContext.runAsNonRoot=true
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: renders container-level allowPrivilegeEscalation=false
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: drops ALL capabilities
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: enforces readOnlyRootFilesystem=true
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: pod runs as non-root
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true

  - it: pod has seccompProfile RuntimeDefault
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
