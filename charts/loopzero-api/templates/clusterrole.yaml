{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "loopzero-common.fullname" . }}
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
rules:
  # CHG-2026-04-25-E2E (Gap 3): loopzero-api needs broad RBAC to drive deploys.
  # Previously only Tenant CRs were granted, but the runtime also creates:
  #   - LoopZeroApplication / ExposedRoute / PreviewEnvironment CRs (per deploy)
  #   - Argo Workflows in the `argo` namespace (build pipeline)
  #   - ClusterCredentials (multi-cluster mode)
  #   - PlatformBootstrap (dev seed)
  # Without these, `loopzero deploy` fails at submit-workflow with 403 Forbidden.
  - apiGroups: ["loopzero.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["loopzero.io"]
    resources: ["*/status"]
    verbs: ["get", "update", "patch"]
  # Argo Workflows — submitting builds + reading status for SSE event stream
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflows/status", "workflowtemplates", "clusterworkflowtemplates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Namespaces (creating tenant build/runtime namespaces)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create"]
  # T5.13 of plan 2026-06-02-openbao-adoption v1.3 — closes deep review
  # finding #1 (cluster-wide secrets/configmaps grant = catastrophic blast
  # radius). When .Values.rbac.legacyClusterWideSecrets is true (default
  # backward compat for unreleased clusters), we still grant cluster-wide
  # secrets/configmaps for compatibility with existing deploys. Setting
  # to false (post per-tenant Role rollout via tenant-controller) removes
  # the grant — loopzero-api can then only read/write secrets in tenant
  # namespaces it has been explicitly authorized via the per-namespace
  # Role created by tenant-controller reconcile.
  {{- if .Values.rbac.legacyClusterWideSecrets }}
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  {{- end }}
  # Services + Pods read access (health checks, log collection)
  - apiGroups: [""]
    resources: ["services", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
{{- end }}
