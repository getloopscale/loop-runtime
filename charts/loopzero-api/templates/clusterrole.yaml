{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "loopzero-common.fullname" . }}
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
rules:
  # Tenant CRs: create/update via EnsureTenant (triggered during loopzero init)
  - apiGroups: ["loopzero.io"]
    resources: ["tenants"]
    verbs: ["get", "create", "update", "list", "watch"]
{{- end }}
