{{- /*
  The internal Application Load Balancer the cells' External Secrets reach the
  secret-fetch broker through (POST /internal/v1/secret-fetch/{tenant_id}/{secret_name}).
  Off by default. The AWS Load Balancer Controller makes the ALB from the Ingress, with
  instance targets on the NodePort Service below, as for infra/helm/loki/values-alb.yaml.

  The ALB is internal (VPC only) and forwards the secret-fetch prefix alone: every other
  path of the API, /internal included, answers the ALB's 404 and never reaches a pod.

  The listener is HTTPS 443 with the ACM certificate certificateArn names, because the
  broker sends a bearer token. plaintextListener is for an ALB that is reached only
  through a TLS hop of its own (staging's AWS emulator, whose HTTPS endpoint proxies to
  the ALB); without it and without a certificate the render fails.
*/}}
{{- with .Values.secretFetchLoadBalancer }}
{{- if .enabled }}
{{- if and (not .plaintextListener) (not .certificateArn) }}
{{- fail "loopzero-api: secretFetchLoadBalancer.enabled needs secretFetchLoadBalancer.certificateArn (an ACM certificate for the HTTPS listener): the broker sends a bearer token, and an HTTP listener is allowed only with plaintextListener behind a TLS hop" }}
{{- end }}
{{- $name := printf "%s-secret-fetch" (include "loopzero-common.fullname" $) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "loopzero-common.labels" $ | nindent 4 }}
    app.kubernetes.io/component: secret-fetch-load-balancer
spec:
  type: NodePort
  selector:
    {{- include "loopzero-common.selectorLabels" $ | nindent 4 }}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "loopzero-common.labels" $ | nindent 4 }}
    app.kubernetes.io/component: secret-fetch-load-balancer
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/health
    {{- if .plaintextListener }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ .certificateArn | quote }}
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    {{- end }}
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /internal/v1/secret-fetch
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
{{- end }}
