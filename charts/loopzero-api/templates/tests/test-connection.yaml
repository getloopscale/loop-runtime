apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "loopzero-common.fullname" . }}-test-connection"
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      # Fixado por digest, nao por tag: uma tag e mutavel no registro, e o proximo
      # `helm test` puxaria conteudo diferente sob o mesmo nome. Aqui fixar nao
      # envelhece — a versao de terceiro ja estava presa (1.36), entao o digest
      # tambem nao se move. Resolvido com `docker buildx imagetools inspect` em
      # 2026-08-17 (B-119).
      image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      command: ['wget']
      args: ['--spider', '--timeout=5', 'http://{{ include "loopzero-common.fullname" . }}:{{ .Values.service.port }}/api/v1/health']
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
