apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loopzero-common.fullname" . }}
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
  {{- if .Values.reloader.enabled }}
  annotations:
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 3 }}
  selector:
    matchLabels:
      {{- include "loopzero-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "loopzero-common.checksumAnnotations" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "loopzero-common.selectorLabels" . | nindent 8 }}
        loopzero.io/component: control-plane
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "loopzero-common.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken | default false }}
      securityContext:
        {{- include "loopzero-common.podSecurityContext" . | nindent 8 }}
      {{- include "loopzero-common.priorityClassName" . | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "loopzero-common.affinity" . | nindent 6 }}
      {{- include "loopzero-common.topologySpreadConstraints" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "loopzero-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "loopzero-common.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "loopzero-common.fullname" . }}
            - secretRef:
                {{- if .Values.secrets.existingSecret }}
                name: {{ .Values.secrets.existingSecret }}
                {{- else if .Values.secrets.create }}
                name: {{ include "loopzero-common.fullname" . }}
                {{- else }}
                {{- fail "loopzero-api: no secret source — set secrets.existingSecret OR secrets.create=true (review F3: secrets.create=false without existingSecret would leave a dangling secretRef)" }}
                {{- end }}
            # T1.1 of plan 2026-05-29-dashboard-public-integration-canonicalization.
            # Shared with loopzero-cloud — single source of truth for X-Service-Auth.
            - secretRef:
                name: loopzero-service-auth
                optional: true
          {{- if or .Values.kubeconfig.build.existingConfigMap .Values.kubeconfig.cell0.existingConfigMap }}
          env:
            {{- if .Values.kubeconfig.build.existingConfigMap }}
            - name: BUILD_KUBECONFIG
              value: /etc/loopzero/build-kubeconfig
            {{- end }}
            {{- if .Values.kubeconfig.cell0.existingConfigMap }}
            - name: CELL_0_KUBECONFIG
              value: /etc/loopzero/cell-0-kubeconfig
            {{- end }}
          {{- end }}
          {{- include "loopzero-common.startupProbe" . | nindent 10 }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.kubeconfig.build.existingConfigMap }}
            - name: build-kubeconfig
              mountPath: /etc/loopzero/build-kubeconfig
              subPath: config
              readOnly: true
            {{- end }}
            {{- if .Values.kubeconfig.cell0.existingConfigMap }}
            - name: cell-0-kubeconfig
              mountPath: /etc/loopzero/cell-0-kubeconfig
              subPath: config
              readOnly: true
            {{- end }}
            {{- if .Values.vault.enabled }}
            # T5.11 of plan 2026-06-02-openbao-adoption v1.3 — projected SA
            # token with bounded audience + expiration. Read by pkg/vault.Client
            # at this path; sent to auth/k8s-core/login as JWT. TokenReview on
            # Vault side validates audience claim matches `vault.loopzero.io`,
            # preventing token re-use against the K8s API or other audiences.
            - name: vault-sa-token
              mountPath: /var/run/secrets/vault.loopzero.io
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        {{- if .Values.kubeconfig.build.existingConfigMap }}
        - name: build-kubeconfig
          configMap:
            name: {{ .Values.kubeconfig.build.existingConfigMap }}
            items:
              - key: config
                path: config
        {{- end }}
        {{- if .Values.kubeconfig.cell0.existingConfigMap }}
        - name: cell-0-kubeconfig
          configMap:
            name: {{ .Values.kubeconfig.cell0.existingConfigMap }}
            items:
              - key: config
                path: config
        {{- end }}
        {{- if .Values.vault.enabled }}
        # T5.11 of plan 2026-06-02-openbao-adoption v1.3 — projected token.
        # audience=vault.loopzero.io binds the token cryptographically to the
        # Vault TokenReview check; REDACTED_SECRET_043 (1h) caps blast
        # radius if pod compromised + token exfiltrated. Kubelet auto-rotates
        # token before expiry — pkg/vault.Client re-reads at Login() time.
        - name: vault-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.vault.audience | default "vault.loopzero.io" }}
                  expirationSeconds: {{ .Values.vault.tokenExpirationSeconds | default 3600 }}
        {{- end }}
