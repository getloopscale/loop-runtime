apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loopzero-common.fullname" . }}
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.config.port | quote }}
  METRICS_PORT: {{ .Values.config.metricsPort | quote }}
  LOOPZERO_ENV: {{ .Values.config.loopzeroEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  BASE_DOMAIN: {{ .Values.config.baseDomain | quote }}
  SERVER_READ_HEADER_TIMEOUT: {{ .Values.config.serverReadHeaderTimeout | quote }}
  SERVER_READ_TIMEOUT: {{ .Values.config.serverReadTimeout | quote }}
  SERVER_IDLE_TIMEOUT: {{ .Values.config.serverIdleTimeout | quote }}
  SERVER_GRACEFUL_SHUTDOWN: {{ .Values.config.serverGracefulShutdown | quote }}
  DB_MAX_CONNS: {{ .Values.config.dbMaxConns | quote }}
  DB_MIN_CONNS: {{ .Values.config.dbMinConns | quote }}
  DB_MAX_CONN_IDLE_TIME: {{ .Values.config.dbMaxConnIdleTime | quote }}
  DB_MAX_CONN_LIFETIME: {{ .Values.config.dbMaxConnLifetime | quote }}
  DB_HEALTH_CHECK_PERIOD: {{ .Values.config.dbHealthCheckPeriod | quote }}
  DB_CONNECT_TIMEOUT: {{ .Values.config.dbConnectTimeout | quote }}
  DB_STATEMENT_TIMEOUT: {{ .Values.config.dbStatementTimeout | quote }}
  HTTP_CLIENT_TIMEOUT: {{ .Values.config.httpClientTimeout | quote }}
  ARGOCD_URL: {{ .Values.config.argocdUrl | quote }}
  ARGOCD_CLIENT_TIMEOUT: {{ .Values.config.argocdClientTimeout | quote }}
  ARGOCD_INSECURE: {{ .Values.config.argocdInsecure | quote }}
  ARGOCD_POLL_INTERVAL: {{ .Values.config.argocdPollInterval | quote }}
  ARGOCD_SYNC_TIMEOUT: {{ .Values.config.argocdSyncTimeout | quote }}
  ARGO_NAMESPACE: {{ .Values.config.argoNamespace | quote }}
  ARGOCD_NAMESPACE: {{ .Values.config.argocdNamespace | quote }}
  API_CROSS_CLUSTER_URL: {{ .Values.config.apiCrossClusterUrl | quote }}
  GITEA_URL: {{ .Values.config.giteaUrl | quote }}
  GITEA_CROSS_CLUSTER_URL: {{ .Values.config.giteaCrossClusterUrl | quote }}
  GITEA_ORG: {{ .Values.config.giteaOrg | quote }}
  CORE_KUBE_CONTEXT: {{ .Values.config.mgmtKubeContext | quote }}
  BUILD_KUBE_CONTEXT: {{ .Values.config.buildKubeContext | quote }}
  CELL_0_KUBE_CONTEXT: {{ .Values.config.runtimeKubeContext | quote }}
  MINIO_ENDPOINT: {{ .Values.config.minioEndpoint | quote }}
  MINIO_CROSS_CLUSTER_ENDPOINT: {{ .Values.config.minioCrossClusterEndpoint | quote }}
  SOURCE_BUCKET: {{ .Values.config.sourceBucket | quote }}
  REGISTRY_URL: {{ .Values.config.registryUrl | quote }}
  REGISTRY_INSECURE: {{ .Values.config.registryInsecure | quote }}
  WORKLOAD_INGRESS_URL: {{ .Values.config.workloadIngressUrl | quote }}
  LOOPZERO_PREVIEW_PUBLIC_DOMAIN: {{ .Values.config.loopzeroPreviewPublicDomain | quote }}
  LOOPZERO_PUBLIC_DOMAIN: {{ .Values.config.loopzeroPublicDomain | quote }}
  LOOPZERO_CLUSTER_ISSUER: {{ .Values.config.loopzeroClusterIssuer | quote }}
  LOOPZERO_PROMETHEUS_ADDRESS: {{ .Values.config.loopzeroPrometheusAddress | quote }}
  LOOPZERO_DATA_PLANE_POLLER_ENABLED: {{ .Values.dataPlanePoller.enabled | quote }}
  LOOPZERO_DATA_PLANE_POLLER_PROMETHEUS_URL: {{ .Values.dataPlanePoller.prometheusUrl | quote }}
  LOOPZERO_DATA_PLANE_POLLER_INTERVAL: {{ .Values.dataPlanePoller.interval | quote }}
  LOKI_URL: {{ .Values.config.lokiUrl | quote }}
  LOOPZERO_GRAFANA_BASE_URL: {{ .Values.config.loopzeroGrafanaBaseUrl | quote }}
  GITHUB_APP_ID: {{ .Values.config.githubAppId | quote }}
  GITHUB_API_BASE_URL: {{ .Values.config.githubApiBaseUrl | quote }}
  BILLING_RETURN_URL: {{ .Values.config.billingReturnUrl | quote }}
  BILLING_UPGRADE_URL: {{ .Values.config.billingUpgradeUrl | quote }}
  CF_ACCOUNT_ID: {{ .Values.config.cfAccountId | quote }}
  CF_KV_NAMESPACE_ID: {{ .Values.config.cfKvNamespaceId | quote }}
  CF_ZONE_MANAGEMENT: {{ .Values.config.cfZoneManagement | quote }}
  LOOPZERO_COSIGN_KEYLESS: {{ .Values.config.loopzeroCosignKeyless | quote }}
  LOOPZERO_COSIGN_ATTEST_ENABLED: {{ .Values.config.loopzeroCosignAttestEnabled | quote }}
  LOOPZERO_COSIGN_INSECURE_SKIP_SCT_VERIFY: {{ .Values.config.loopzeroCosignInsecureSkipSctVerify | quote }}
  LOOPZERO_COSIGN_TUF_ROOT_PINNED: {{ .Values.config.loopzeroCosignTufRootPinned | quote }}
  LOOPZERO_FULCIO_URL: {{ .Values.config.loopzeroFulcioUrl | quote }}
  LOOPZERO_REKOR_URL: {{ .Values.config.loopzeroRekorUrl | quote }}
  LOOPZERO_COSIGN_IMAGE: {{ .Values.config.loopzeroCosignImage | quote }}
  LOOPZERO_BUILD_WORKSPACE_STORAGE_CLASS: {{ .Values.config.buildWorkspaceStorageClass | default "" | quote }}
  LOOPZERO_SYFT_IMAGE: {{ .Values.config.loopzeroSyftImage | quote }}
  OPENBAO_TRANSIT_ENABLED: {{ .Values.config.openbaoTransitEnabled | quote }}
  OPENBAO_VAULT_ADDR: {{ .Values.config.openbaoVaultAddr | quote }}
  OPENBAO_SPKI_PIN_SHA256: {{ .Values.config.openbaoSpkiPinSha256 | quote }}
  LOOPZERO_SERVICE_AUTH_ED25519_PUBLIC_CURRENT: {{ .Values.config.loopzeroServiceAuthEd25519PublicCurrent | quote }}
  LOOPZERO_SERVICE_AUTH_ED25519_PUBLIC_PREVIOUS: {{ .Values.config.loopzeroServiceAuthEd25519PublicPrevious | quote }}
  LOOPZERO_SERVICE_AUTH_NONCE_REDIS_ADDR: {{ .Values.config.loopzeroServiceAuthNonceRedisAddr | quote }}
  LOOPZERO_SERVICE_AUTH_REQUIRE_SIGNATURE: {{ .Values.config.loopzeroServiceAuthRequireSignature | quote }}
  LOOPZERO_SERVICE_AUTH_SECRET_CREATED_AT: {{ .Values.config.loopzeroServiceAuthSecretCreatedAt | quote }}
  CB_KEY: {{ .Values.config.cbKey | quote }}
  CB_OPEN_THRESHOLD: {{ .Values.config.cbOpenThreshold | quote }}
  CB_CLOSE_THRESHOLD: {{ .Values.config.cbCloseThreshold | quote }}
  CB_RETRY_INTERVAL: {{ .Values.config.cbRetryInterval | quote }}
  BUILD_QUEUE_TIMEOUT: {{ .Values.config.buildQueueTimeout | quote }}
  BUILD_RUNNING_TIMEOUT: {{ .Values.config.buildRunningTimeout | quote }}
  BUILD_RELEASING_TIMEOUT: {{ .Values.config.buildReleasingTimeout | quote }}
  BUILD_CANCEL_TIMEOUT: {{ .Values.config.buildCancelTimeout | quote }}
  BUILD_REAPER_INTERVAL: {{ .Values.config.buildReaperInterval | quote }}
  RELEASE_READY_TIMEOUT: {{ .Values.config.releaseReadyTimeout | quote }}
  RELEASE_PENDING_TIMEOUT: {{ .Values.config.releasePendingTimeout | quote }}
  RELEASE_REAPER_INTERVAL: {{ .Values.config.releaseReaperInterval | quote }}
  BUILD_RECONCILE_INTERVAL: {{ .Values.config.buildReconcileInterval | quote }}
  SSE_HEARTBEAT_INTERVAL: {{ .Values.config.sseHeartbeatInterval | quote }}
  SSE_POLL_INTERVAL: {{ .Values.config.ssePollInterval | quote }}
  SSE_SAFETY_TIMEOUT: {{ .Values.config.sseSafetyTimeout | quote }}
  SSE_MAX_CONCURRENT_STREAMS: {{ .Values.config.sseMaxConcurrentStreams | quote }}
  AUTH_CACHE_TTL: {{ .Values.config.authCacheTtl | quote }}
  SOURCE_MAX_BUNDLE_SIZE: {{ .Values.config.sourceMaxBundleSize | quote }}
  SOURCE_MULTIPART_MAX_MEMORY: {{ .Values.config.sourceMultipartMaxMemory | quote }}
  LOOPZERO_DISABLE_LEGACY_LOOPS: {{ .Values.config.loopzeroDisableLegacyLoops | quote }}
  LOOPZERO_ADMISSION_CONTROL: {{ .Values.config.loopzeroAdmissionControl | quote }}
  MAX_CONCURRENT_BUILDS_PER_CELL: {{ .Values.config.maxConcurrentBuildsPerCell | quote }}
  MAX_TENANTS_PER_CELL: {{ .Values.config.maxTenantsPerCell | quote }}
  MAX_CONCURRENT_BUILDS_PER_TENANT: {{ .Values.config.maxConcurrentBuildsPerTenant | quote }}
  PG_CIRCUIT_BREAKER_THRESHOLD_PCT: {{ .Values.config.pgCircuitBreakerThresholdPct | quote }}
  LOOPZERO_USE_PG_CLAIMS: {{ .Values.config.loopzeroUsePgClaims | quote }}
  LOOPZERO_KEDA_ENABLED: {{ .Values.config.loopzeroKedaEnabled | quote }}
  CORS_ALLOWED_ORIGIN: {{ .Values.config.corsAllowedOrigin | quote }}
  JWKS_URL: {{ .Values.config.jwksUrl | quote }}
  JWT_ISSUER: {{ .Values.config.jwtIssuer | quote }}
  LOOPZERO_ADMIN_API: {{ .Values.config.loopzeroAdminApi | quote }}
  LOOPZERO_MAINTENANCE_MODE: {{ .Values.config.loopzeroMaintenanceMode | quote }}
  LOOPZERO_PROGRESSIVE_DELIVERY: {{ .Values.config.loopzeroProgressiveDelivery | quote }}
  LOOPZERO_LEAN_RESOURCES: {{ .Values.config.loopzeroLeanResources | quote }}
  LOOPZERO_ENV_BLOCKLIST_MODE: {{ .Values.config.loopzeroEnvBlocklistMode | quote }}
  LOOPZERO_ENV_READINESS_CHECKER: {{ .Values.config.loopzeroEnvReadinessChecker | quote }}
  LOOPZERO_TRUSTED_PROXY_CIDRS: {{ .Values.config.loopzeroTrustedProxyCidrs | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterOtlpEndpoint | quote }}
  LOOPZERO_TRACING_ENABLED: {{ .Values.config.loopzeroTracingEnabled | quote }}
  LOOPZERO_PPROF_ADDR: {{ .Values.config.loopzeroPprofAddr | quote }}
  LOOPZERO_PPROF_ENABLED: {{ .Values.config.loopzeroPprofEnabled | quote }}
