{{- if .Values.secrets.create }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loopzero-common.fullname" . }}
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.loopzeroWorkerDatabaseUrl }}
  LOOPZERO_WORKER_DATABASE_URL: {{ .Values.secrets.loopzeroWorkerDatabaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.loopzeroApiDatabaseUrl }}
  LOOPZERO_API_DATABASE_URL: {{ .Values.secrets.loopzeroApiDatabaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.giteaToken }}
  GITEA_TOKEN: {{ .Values.secrets.giteaToken | quote }}
  {{- end }}
  {{- if .Values.secrets.argocdToken }}
  ARGOCD_TOKEN: {{ .Values.secrets.argocdToken | quote }}
  {{- end }}
  {{- if .Values.secrets.minioAccessKey }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  {{- end }}
  {{- if .Values.secrets.minioSecretKey }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.loopzeroArgoCallbackSecret }}
  LOOPZERO_ARGO_CALLBACK_SECRET: {{ .Values.secrets.loopzeroArgoCallbackSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.loopzeroBootstrapSecret }}
  LOOPZERO_BOOTSTRAP_SECRET: {{ .Values.secrets.loopzeroBootstrapSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.loopzeroSecretEncryptionKey }}
  LOOPZERO_SECRET_ENCRYPTION_KEY: {{ .Values.secrets.loopzeroSecretEncryptionKey | quote }}
  {{- end }}
  {{- if .Values.secrets.openbaoVaultRoleId }}
  OPENBAO_VAULT_ROLE_ID: {{ .Values.secrets.openbaoVaultRoleId | quote }}
  {{- end }}
  {{- if .Values.secrets.openbaoVaultSecretId }}
  OPENBAO_VAULT_SECRET_ID: {{ .Values.secrets.openbaoVaultSecretId | quote }}
  {{- end }}
  {{- if .Values.secrets.cfApiToken }}
  CF_API_TOKEN: {{ .Values.secrets.cfApiToken | quote }}
  {{- end }}
  {{- if .Values.secrets.coreKubeconfig }}
  CORE_KUBECONFIG: {{ .Values.secrets.coreKubeconfig | quote }}
  {{- end }}
  {{- if .Values.secrets.buildKubeconfig }}
  BUILD_KUBECONFIG: {{ .Values.secrets.buildKubeconfig | quote }}
  {{- end }}
  {{- if .Values.secrets.cell0Kubeconfig }}
  CELL_0_KUBECONFIG: {{ .Values.secrets.cell0Kubeconfig | quote }}
  {{- end }}
  {{- if .Values.secrets.stripeSecretKey }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.githubAppPrivateKey }}
  GITHUB_APP_PRIVATE_KEY: {{ .Values.secrets.githubAppPrivateKey | quote }}
  {{- end }}
  {{- if .Values.secrets.githubWebhookSecret }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.secrets.githubWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.loopzeroAdminApiKey }}
  LOOPZERO_ADMIN_API_KEY: {{ .Values.secrets.loopzeroAdminApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.loopzeroAdminApiKeyPrevious }}
  LOOPZERO_ADMIN_API_KEY_PREVIOUS: {{ .Values.secrets.loopzeroAdminApiKeyPrevious | quote }}
  {{- end }}
  {{- if .Values.secrets.loopzeroAdminServiceAuthSecret }}
  LOOPZERO_ADMIN_SERVICE_AUTH_SECRET: {{ .Values.secrets.loopzeroAdminServiceAuthSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.loopzeroAdminServiceAuthSecretPrevious }}
  LOOPZERO_ADMIN_SERVICE_AUTH_SECRET_PREVIOUS: {{ .Values.secrets.loopzeroAdminServiceAuthSecretPrevious | quote }}
  {{- end }}
  {{- if .Values.secrets.loopzeroBrokerToken }}
  LOOPZERO_BROKER_TOKEN: {{ .Values.secrets.loopzeroBrokerToken | quote }}
  {{- end }}
  {{- if .Values.secrets.loopzeroEdgeRouteToken }}
  LOOPZERO_EDGE_ROUTE_TOKEN: {{ .Values.secrets.loopzeroEdgeRouteToken | quote }}
  {{- end }}
  {{- if .Values.secrets.loopzeroServiceAuthSecret }}
  LOOPZERO_SERVICE_AUTH_SECRET: {{ .Values.secrets.loopzeroServiceAuthSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.loopzeroServiceAuthSecretPrevious }}
  LOOPZERO_SERVICE_AUTH_SECRET_PREVIOUS: {{ .Values.secrets.loopzeroServiceAuthSecretPrevious | quote }}
  {{- end }}
  {{- if .Values.secrets.loopzeroServiceAuthNonceRedisPassword }}
  LOOPZERO_SERVICE_AUTH_NONCE_REDIS_PASSWORD: {{ .Values.secrets.loopzeroServiceAuthNonceRedisPassword | quote }}
  {{- end }}
{{- end }}
{{- end }}
