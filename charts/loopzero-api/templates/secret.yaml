{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loopzero-common.fullname" . }}
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.giteaToken }}
  GITEA_TOKEN: {{ .Values.secrets.giteaToken | quote }}
  {{- end }}
  {{- if .Values.secrets.argocdToken }}
  ARGOCD_TOKEN: {{ .Values.secrets.argocdToken | quote }}
  {{- end }}
  {{- if .Values.secrets.minioAccessKey }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  {{- end }}
  {{- if .Values.secrets.minioSecretKey }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.argoCallbackSecret }}
  LOOPZERO_ARGO_CALLBACK_SECRET: {{ .Values.secrets.argoCallbackSecret | quote }}
  {{- end }}
  # CHG-2026-04-25-E2E (Gap 2): missing from previous chart version.
  # Required by api/internal/routes/bootstrap.go to authenticate
  # POST /internal/bootstrap requests. Without it, the install can't
  # seed the first admin user.
  {{- if .Values.secrets.bootstrapSecret }}
  LOOPZERO_BOOTSTRAP_SECRET: {{ .Values.secrets.bootstrapSecret | quote }}
  {{- end }}
  # SEC-001: encryption key for application secrets at rest in PG.
  # Required in production; optional in dev (nil-key disables encryption).
  {{- if .Values.secrets.encryptionKey }}
  LOOPZERO_SECRET_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  {{- end }}
  # CHG-2026-04-25-E2E: shared secret for cloud→engine X-Service-Auth pattern.
  # Engine validates this header for service-to-service requests from
  # loopzero-cloud (browser-facing proxy).
  {{- if .Values.secrets.serviceAuthSecret }}
  LOOPZERO_SERVICE_AUTH_SECRET: {{ .Values.secrets.serviceAuthSecret | quote }}
  {{- end }}
{{- end }}
