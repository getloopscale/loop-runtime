# loopzero-api — example install values (install-config-contract Slice 3)
# Copy, set per-env config + existingSecret, then:
#   helm install loopzero-api oci://ghcr.io/getloopscale/charts/loopzero-api \
#     -f values.example.yaml --set secrets.existingSecret=loopzero-api-secrets
# Secrets are NOT here — they go in the Secret named by secrets.existingSecret (see SECRETS.md).
# Validated by values.schema.json at install (additionalProperties:false) — typo'd key fails fast.

secrets:
  existingSecret: "loopzero-api-secrets"

reloader:
  enabled: false   # set true so secret/config rotation rolls the pod (operator-installed Reloader)

config:
  baseDomain: "!!changeme-base-domain!!"
  loopzeroEnv: "production"
  loopzeroClusterIssuer: "letsencrypt-prod"
  corsAllowedOrigin: "https://!!changeme-app-host!!"
  # ... see CONFIG.md for the full key list + defaults; override only what differs per env.
