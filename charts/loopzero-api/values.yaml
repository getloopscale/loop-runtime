global:
  registry: registry.digitalocean.com/loopzero-system
  imagePullSecrets: []

image:
  repository: loopzero-api
  tag: dev
  pullPolicy: IfNotPresent

# HA default per CTO mandate 2026-05-14 + /chaos-test C01 resilience gap.
# Multi-replica activates leader election fail-over + PodDisruptionBudget
# (via loopzero-common.pdb library — see templates/pdb.yaml). Sustains chaos
# test C01 hypothesis: "surviving pod never restarts during leader kill".
replicaCount: 2
revisionHistoryLimit: 3
priorityClassName: system-cluster-critical

nameOverride: ""
fullnameOverride: ""

podLabels: {}
podAnnotations: {}

service:
  type: ClusterIP
  port: 3001
  metricsPort: 9090

