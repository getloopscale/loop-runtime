global:
  registry: registry.digitalocean.com/loopzero-system
  imagePullSecrets: []

image:
  repository: loopzero-api
  tag: dev
  pullPolicy: IfNotPresent

# HA default per CTO mandate 2026-05-14 + /chaos-test C01 resilience gap.
# Multi-replica activates leader election fail-over + PodDisruptionBudget
# (via loopzero-common.pdb library — see templates/pdb.yaml). Sustains chaos
# test C01 hypothesis: "surviving pod never restarts during leader kill".
replicaCount: 2
revisionHistoryLimit: 3
priorityClassName: system-cluster-critical

nameOverride: ""
fullnameOverride: ""

podLabels: {}
podAnnotations: {}

service:
  type: ClusterIP
  port: 3001
  metricsPort: 9090
  # Fixed node port of the http port when type is NodePort; null lets the cluster
  # pick one. The Helmfile dev-public install pins 30001, the port the k3d serverlb
  # publishes as host 13001 — the CLI's default endpoint on that host.
  nodePort: null

config:
  port: "3001"
  metricsPort: "9090"
  loopzeroEnv: "development"
  logLevel: "info"
  baseDomain: "loopzero.local"
  serverReadHeaderTimeout: "10s"
  serverReadTimeout: "30s"
  serverIdleTimeout: "120s"
  serverGracefulShutdown: "15s"
  dbMaxConns: "25"
  dbMinConns: "5"
  dbMaxConnIdleTime: "30s"
  dbMaxConnLifetime: "1h"
  dbHealthCheckPeriod: "30s"
  dbConnectTimeout: "5s"
  dbStatementTimeout: "30000"
  httpClientTimeout: "10s"
  argocdUrl: "http://argocd-server.argocd.svc.cluster.local:80"
  argocdClientTimeout: "90s"
  argocdInsecure: "true"
  argocdPollInterval: "10s"
  argocdSyncTimeout: "300s"
  argoNamespace: "argo"
  argocdNamespace: "argocd"
  apiCrossClusterUrl: "http://loopzero-api.loopzero-system.svc.cluster.local:3001"
  giteaUrl: "http://gitea-http.loopzero-system.svc.cluster.local:3000"
  giteaCrossClusterUrl: ""
  giteaOrg: "loopzero"
  mgmtKubeContext: "k3d-loopzero-core"
  buildKubeContext: "k3d-loopzero-build"
  runtimeKubeContext: "k3d-loopzero-cell-0"
  minioEndpoint: "minio.loopzero-system.svc.cluster.local:9000"
  minioCrossClusterEndpoint: ""
  sourceBucket: "loopzero-builds"
  registryUrl: ""
  registryInsecure: "false"
  workloadIngressUrl: ""
  loopzeroPreviewPublicDomain: ""
  loopzeroPublicDomain: ""
  loopzeroClusterIssuer: "letsencrypt-prod"
  loopzeroPrometheusAddress: ""
  lokiUrl: "http://loki.monitoring:3100"
  loopzeroGrafanaBaseUrl: ""
  githubAppId: ""
  githubApiBaseUrl: ""
  billingReturnUrl: ""
  billingUpgradeUrl: ""
  cfAccountId: ""
  cfKvNamespaceId: ""
  cfZoneManagement: "false"
  loopzeroCosignKeyless: "false"
  loopzeroCosignAttestEnabled: "false"
  loopzeroCosignInsecureSkipSctVerify: "false"
  loopzeroCosignTufRootPinned: "false"
  loopzeroFulcioUrl: ""
  loopzeroRekorUrl: ""
  loopzeroCosignImage: ""
  loopzeroSyftImage: ""
  openbaoTransitEnabled: "false"
  openbaoVaultAddr: ""
  openbaoSpkiPinSha256: ""
  loopzeroServiceAuthEd25519PublicCurrent: ""
  loopzeroServiceAuthEd25519PublicPrevious: ""
  loopzeroServiceAuthNonceRedisAddr: ""
  loopzeroServiceAuthRequireSignature: "false"
  loopzeroServiceAuthSecretCreatedAt: ""
  cbKey: "argocd"
  cbOpenThreshold: "3"
  cbCloseThreshold: "2"
  cbRetryInterval: "30s"
  buildQueueTimeout: "5m"
  buildRunningTimeout: "30m"
  buildReleasingTimeout: "10m"
  buildCancelTimeout: "60s"
  buildReaperInterval: "30s"
  releaseReadyTimeout: "5m"
  releasePendingTimeout: "6m"
  releaseReaperInterval: "30s"
  buildReconcileInterval: "5s"
  sseHeartbeatInterval: "15s"
  ssePollInterval: "1s"
  sseSafetyTimeout: "5m"
  sseMaxConcurrentStreams: "200"
  authCacheTtl: "5m"
  sourceMaxBundleSize: "524288000"
  sourceMultipartMaxMemory: "33554432"
  loopzeroDisableLegacyLoops: "false"
  loopzeroAdmissionControl: "false"
  maxConcurrentBuildsPerCell: "20"
  maxTenantsPerCell: "5000"
  maxConcurrentBuildsPerTenant: "3"
  pgCircuitBreakerThresholdPct: "90"
  loopzeroUsePgClaims: "false"
  loopzeroKedaEnabled: "false"
  corsAllowedOrigin: ""
  jwksUrl: "http://ory-hydra-public.ory.svc.cluster.local:4444/.well-known/jwks.json"
  jwtIssuer: "http://ory-hydra-public.ory.svc.cluster.local:4444/"
  loopzeroAdminApi: "false"
  loopzeroMaintenanceMode: "false"
  loopzeroProgressiveDelivery: "true"
  loopzeroLeanResources: "false"
  loopzeroEnvBlocklistMode: ""
  loopzeroEnvReadinessChecker: ""
  loopzeroTrustedProxyCidrs: ""
  otelExporterOtlpEndpoint: ""
  loopzeroTracingEnabled: "false"
  loopzeroPprofAddr: ""
  loopzeroPprofEnabled: "false"

secrets:
  create: true
  existingSecret: ""
  databaseUrl: ""
  loopzeroWorkerDatabaseUrl: ""
  loopzeroApiDatabaseUrl: ""
  giteaToken: ""
  argocdToken: ""
  minioAccessKey: ""
  minioSecretKey: ""
  loopzeroArgoCallbackSecret: ""
  loopzeroBootstrapSecret: ""
  loopzeroSecretEncryptionKey: ""
  openbaoVaultRoleId: ""
  openbaoVaultSecretId: ""
  cfApiToken: ""
  coreKubeconfig: ""
  buildKubeconfig: ""
  cell0Kubeconfig: ""
  stripeSecretKey: ""
  githubAppPrivateKey: ""
  githubWebhookSecret: ""
  loopzeroAdminApiKey: ""
  loopzeroAdminApiKeyPrevious: ""
  loopzeroAdminServiceAuthSecret: ""
  loopzeroAdminServiceAuthSecretPrevious: ""
  loopzeroBrokerToken: ""
  loopzeroEdgeRouteToken: ""
  loopzeroServiceAuthSecret: ""
  loopzeroServiceAuthSecretPrevious: ""
  loopzeroServiceAuthNonceRedisPassword: ""
  # Secrets this chart does not create — provisioned by ESO, a bootstrap task or an
  # operator — mounted after the chart's own secret source: {name, optional, reason}.
  # `optional: true` lets the pod start without the Secret, which is how a dependency
  # disappears without the startup saying anything (B-104), so the schema requires a
  # `reason` on every optional entry.
  additionalSources: []
  # One key of an external Secret mapped onto a variable the API reads:
  # {name, secretName, key, optional, reason}. An explicit variable outranks every
  # envFrom source, the ConfigMap included.
  keyRefs: []

kubeconfig:
  build:
    existingConfigMap: ""
  cell0:
    existingConfigMap: ""
  # One Secret holding the three cluster kubeconfigs under the keys core.kubeconfig,
  # build.kubeconfig and cell-0.kubeconfig, mounted at /etc/loopzero/kubeconfigs, with
  # CORE_KUBECONFIG / BUILD_KUBECONFIG / CELL_0_KUBECONFIG pointing into it. Exclusive
  # with the per-cluster ConfigMaps above. `reason` is required when optional is true.
  clusterSecret:
    name: ""
    optional: false
    reason: ""

# writable /tmp for a read-only root filesystem — the GitOps pusher clones into
# temporary directories there.
tmpVolume:
  sizeLimit: 512Mi

# Traefik IngressRoute to the Service (loopzero-common.ingressRoute). Off: a published
# chart does not assume an ingress controller. The Helmfile bootstrap turns it on.
ingressRoute:
  enabled: false
  host: ""
  entryPoints:
    - websecure
  middlewares: []
  # A ClusterIssuer name (a cert-manager Certificate <fullname>-tls is emitted for
  # the host), or CFManaged when TLS terminates at the Cloudflare edge.
  certIssuer: CFManaged

reloader:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: true
  # FIXED on purpose, against the Helm convention of deriving it from the release (B-096).
  #
  # The admission policies exempt ONE identity —
  # `system:serviceaccount:loopzero-system:loopzero-api` (`systemActorExemptions.platformServiceAccounts`
  # in charts/loopzero-admission-policies/values.yaml). With `name: ""` this chart rendered
  # `<release>-loopzero-api`, so a deploy through it brought loopzero-api up with an identity the
  # platform's own fences treat as foreign — and the failure shows up as `Forbidden` during
  # reconciliation, not as an install error.
  #
  # Two installs in the same namespace are not a supported topology: this is the platform's
  # own API, one per cluster, and the VAP exemption assumes a single identity. Widening the
  # exemption to a pattern (`*-loopzero-api`) was the rejected alternative, and it is the
  # dangerous one: it would turn a release name into a credential.
  #
  # MEET-ASYNC-AMENDMENT-2026-08-19-published-loopzero-api-sa-name (pending ratification).
  name: "loopzero-api"
  automountServiceAccountToken: true

# T5.11 of plan 2026-06-02-openbao-adoption v1.3 — Vault K8s auth config.
# When enabled, the Deployment mounts a projected SA token with bounded
# audience + expiration for a Kubernetes-auth Vault login instead of a static
# token env var. No engine code performs that login today: the api's Transit
# client (pkg/vault.TransitClient) authenticates with AppRole. Disabled by default (vault stack opt-in per env).
vault:
  enabled: false
  # Vault endpoint reachable from loopzero-api (mgmt cluster).
  addr: "https://openbao.secrets-system.svc.cluster.local:8200"
  # K8s auth mount name (matches infra/helm/openbao-init T5.1).
  authMount: "k8s-core"
  # Role name on that mount (matches T5.5 role: loopzero-api).
  role: "loopzero-api"
  # Token audience — TokenReviewer on Vault side validates this claim
  # cryptographically; mismatched audience → auth fails fast.
  audience: "vault.loopzero.io"
  # Projected token expiration. Kubelet auto-rotates before expiry.
  tokenExpirationSeconds: 3600
  # SPKI pin populated by ESO from openbao SPKI extractor CronJob
  # (T2.5). No engine code reads this Secret today; the Transit client takes
  # its pin from OPENBAO_SPKI_PIN_SHA256 (see setup_transit.go).
  spkiPinSecretName: "vault-spki-pin"
  spkiPinSecretKey: "spki_hash"

rbac:
  create: true
  # T5.13 of plan 2026-06-02-openbao-adoption v1.3 — closes deep review
  # finding #1 (cluster-wide secrets/configmaps grant = catastrophic blast
  # radius). When true (default backward compat for unreleased clusters),
  # loopzero-api retains cluster-wide secrets/configmaps RBAC for existing
  # deploys. Flip to false only AFTER per-tenant Role rollout via
  # tenant-controller reconcile (see operators/internal/tenant/tenant_rbac.go).
  # Phased cutover: Day 0 deploy keeps current behavior; Day N flip to false.
  legacyClusterWideSecrets: true
  # ArgoCD Applications: get/list/watch/patch/delete, cluster-wide. The API reads an
  # Application's labels to attribute a sync notification to its release, and the
  # administrative tenant eviction lists, de-finalizes and deletes a tenant's
  # Applications. Off by default, so an install that never granted it keeps its RBAC;
  # without it both paths answer Forbidden. The Helmfile bootstrap turns it on.
  argocdApplications: false
  # A Role in the release namespace: secrets get/create/update/delete. The secret-sync
  # broker writes and deletes one Secret per tenant secret there, and the ArgoCD token
  # provider persists the token it mints. Namespaced, so a delete reaches one namespace;
  # it keeps both paths working once legacyClusterWideSecrets is off. Off by default for
  # the same reason as above; the Helmfile bootstrap turns it on.
  controlPlaneSecrets: false

startupProbe:
  enabled: true
  path: /api/v1/health
  port: http
  failureThreshold: 30
  periodSeconds: 2

livenessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5

readinessProbe:
  # DEEP on purpose, and different from the liveness above (B-135).
  #
  # Both used to point at `/api/v1/health`, which answers 200 UNCONDITIONALLY. That leaves
  # the pod `Ready` with the database down — receiving traffic and returning errors on 27 of
  # the 36 surfaces. There was no observable state in which the instance was alive and OUT
  # of the Service, which is the one thing readiness is for.
  #
  # `/api/v1/health/ready` already existed (`server/router.go` -> `DeepHealth`) and returns
  # 503 when the database does not answer, when a declared service is unreachable, or when
  # discovery finds ZERO cells — with zero cells the router resolves no destination and the
  # instance serves NO deploy operation.
  #
  # `periodSeconds` went from 10 to 15 (same as liveness): the deep probe does network I/O,
  # and the cost objection is recorded as an accepted risk in the amendment.
  #
  # LIVENESS DOES NOT CHANGE, deliberately: pointing liveness at the deep probe would make a
  # database outage KILL the pod, and the new pod would have no database either — a restart
  # loop that never converges. Liveness answers "the process is alive".
  #
  # MEET-ASYNC-AMENDMENT-2026-08-19-readiness-deep-probe (pending ratification).
  httpGet:
    path: /api/v1/health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3

metrics:
  serviceMonitor:
    # Enabled 2026-09-07 (system-design audit SD-01.13). While this was false the
    # only scrape of the control-plane API came from a standalone manifest applied
    # by `task infra:install:monitoring` — outside any reconciler, so drift was
    # never corrected and a cluster rebuilt without that task ran unscraped.
    enabled: true
    port: metrics
    interval: 30s
    scrapeTimeout: 10s
    # true keeps the canonical loopzero_* labels the API exposes when they clash with the
    # target labels Prometheus attaches; false renames the clash to exported_<label>.
    honorLabels: false

# dataPlanePoller — the api's readiness poller (Red Team loopzero-cloud#128).
# When enabled, the elected api leader queries Prometheus every `interval`
# for the ready replicas of every tenant environment and records them in
# environment_targets, which the dashboard's /projects badge reads to tell a
# deploy that is serving from one that is down. The api owns that table; the
# poller moved here from loopzero-app-operator so no other component writes it.
#
# Injected into the ConfigMap as LOOPZERO_DATA_PLANE_POLLER_*; the binary refuses
# to start when enabled without an absolute http(s) prometheusUrl. The
# loopzero-common NetworkPolicy helper adds the monitoring/prometheus:9090 egress
# rule when enabled is true.
dataPlanePoller:
  enabled: false
  # Prometheus base URL reachable from the api pod — the one scraping the
  # cells' kube-state-metrics (e.g.
  # http://prometheus-server.monitoring.svc.cluster.local:80).
  prometheusUrl: ""
  # Scrape cadence, a Go duration.
  interval: "30s"

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3001
  extraEgress:
    - ports:
        - protocol: TCP
          port: 5432
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql

# Grace period for in-flight SSE streams on a rolling update (SD-12.2).
# 300 matches the progressDeadlineSeconds the renderer sets on tenant Rollouts:
# the stream must outlive the canary it is reporting on.
terminationGracePeriodSeconds: 300

topologySpreadConstraints:
  # Enabled 2026-09-07 (system-design audit SD-05.4). replicaCount is 2 and the
  # helper spreads on zone AND hostname with whenUnsatisfiable: ScheduleAnyway,
  # so on a single-node k3d cluster this is a no-op and on the managed cluster
  # it is the difference between the pair surviving a node loss and not.
  enabled: true

affinity: {}

tolerations: []
nodeSelector: {}
