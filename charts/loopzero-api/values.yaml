global:
  registry: registry.digitalocean.com/loopzero-system
  imagePullSecrets: []

image:
  repository: loopzero-api
  tag: dev
  pullPolicy: IfNotPresent

replicaCount: 1
revisionHistoryLimit: 3
priorityClassName: system-cluster-critical

nameOverride: ""
fullnameOverride: ""

podLabels: {}
podAnnotations: {}

service:
  type: ClusterIP
  port: 3001
  metricsPort: 9090

config:
  baseDomain: ""
  giteaUrl: "http://gitea-http.gitea.svc.cluster.local:3000"
  argocdUrl: "http://argocd-server.argocd.svc.cluster.local:80"
  minioEndpoint: "minio.loopzero-system.svc.cluster.local:9000"
  registryUrl: ""
  registryInsecure: "false"
  logLevel: "info"
  disableLegacyLoops: "false"
  jwksUrl: ""
  jwtIssuer: ""
  clusterIssuer: "letsencrypt-prod"
  argoNamespace: "argo"
  argocdNamespace: "argocd"

secrets:
  create: true
  existingSecret: ""
  databaseUrl: ""
  giteaToken: ""
  argocdToken: ""
  minioAccessKey: ""
  minioSecretKey: ""
  argoCallbackSecret: ""

kubeconfig:
  build:
    existingConfigMap: ""
  runtime:
    existingConfigMap: ""

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: true

rbac:
  create: true

startupProbe:
  enabled: true
  path: /api/v1/health
  port: http
  failureThreshold: 30
  periodSeconds: 2

livenessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3

metrics:
  serviceMonitor:
    enabled: false
    port: metrics
    interval: 30s
    scrapeTimeout: 10s

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3001
  extraEgress:
    - ports:
        - protocol: TCP
          port: 5432
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql

topologySpreadConstraints:
  enabled: false

affinity: {}

tolerations: []
nodeSelector: {}
