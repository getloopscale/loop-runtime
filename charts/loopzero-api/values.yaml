  mgmtKubeContext: "k3d-loopzero-core"
  buildKubeContext: "k3d-loopzero-build"
  runtimeKubeContext: "k3d-loopzero-cell-0"
  minioEndpoint: "minio.loopzero-system.svc.cluster.local:9000"
  minioCrossClusterEndpoint: ""
  sourceBucket: "loopzero-builds"
  registryUrl: ""
  registryInsecure: "false"
  harborRegistryUrl: ""
  workloadIngressUrl: ""
  loopzeroPreviewPublicDomain: ""
  loopzeroPublicDomain: ""
  loopzeroClusterIssuer: "letsencrypt-prod"
  loopzeroPrometheusAddress: ""
  lokiUrl: "http://loki.monitoring:3100"
  loopzeroGrafanaBaseUrl: ""
  githubAppId: ""
  githubApiBaseUrl: ""
  billingReturnUrl: ""
  billingUpgradeUrl: ""
  cfAccountId: ""
  cfKvNamespaceId: ""
  cfZoneManagement: "false"
  loopzeroCosignKeyless: "false"
  loopzeroCosignAttestEnabled: "false"
  loopzeroCosignInsecureSkipSctVerify: "false"
  loopzeroCosignTufRootPinned: "false"
  loopzeroFulcioUrl: ""
  loopzeroRekorUrl: ""
  loopzeroCosignImage: ""
