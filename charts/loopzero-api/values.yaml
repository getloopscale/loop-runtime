  loopzeroServiceAuthNonceRedisPassword: ""

kubeconfig:
  build:
    existingConfigMap: ""
  cell0:
    existingConfigMap: ""

reloader:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: true
  # FIXO de proposito, contra a convencao do Helm de derivar do release (B-096).
  #
  # As politicas de admissao isentam UMA identidade —
  # `system:serviceaccount:loopzero-system:loopzero-api` (`systemActorExemptions.platformServiceAccounts`
  # em infra/helm/admission-policies/values.yaml). Com `name: ""` este chart rendia
  # `<release>-loopzero-api`, entao um deploy por ele subia o loopzero-api com identidade que as
  # proprias cercas da plataforma tratam como estranha — e a falha aparece como
  # `Forbidden` na reconciliacao, nao como erro de instalacao.
  #
  # Duas instalacoes no mesmo namespace nao sao topologia suportada: e' a API da propria
  # plataforma, uma por cluster, e a isencao das VAPs pressupoe identidade unica. Ampliar
  # a isencao para um padrao (`*-loopzero-api`) foi a alternativa rejeitada, e e' a perigosa:
  # transformaria nome de release em credencial.
  #
  # MEET-ASYNC-AMENDMENT-2026-08-19-published-loopzero-api-sa-name (pending ratification).
  name: "loopzero-api"
  automountServiceAccountToken: true

# T5.11 of plan 2026-06-02-openbao-adoption v1.3 — Vault K8s auth config.
# When enabled, the Deployment mounts a projected SA token with bounded
# audience + expiration for a Kubernetes-auth Vault login instead of a static
# token env var. No engine code performs that login today: the api's Transit
# client (pkg/vault.TransitClient) authenticates with AppRole. Disabled by default (vault stack opt-in per env).
vault:
  enabled: false
  # Vault endpoint reachable from loopzero-api (mgmt cluster).
  addr: "https://openbao.secrets-system.svc.cluster.local:8200"
  # K8s auth mount name (matches infra/helm/openbao-init T5.1).
  authMount: "k8s-core"
  # Role name on that mount (matches T5.5 role: loopzero-api).
  role: "loopzero-api"
  # Token audience — TokenReviewer on Vault side validates this claim
  # cryptographically; mismatched audience → auth fails fast.
  audience: "vault.loopzero.io"
  # Projected token expiration. Kubelet auto-rotates before expiry.
  tokenExpirationSeconds: 3600
  # SPKI pin populated by ESO from openbao SPKI extractor CronJob
  # (T2.5). No engine code reads this Secret today; the Transit client takes
  # its pin from OPENBAO_SPKI_PIN_SHA256 (see setup_transit.go).
  spkiPinSecretName: "vault-spki-pin"
  spkiPinSecretKey: "spki_hash"

rbac:
  create: true
  # T5.13 of plan 2026-06-02-openbao-adoption v1.3 — closes deep review
  # finding #1 (cluster-wide secrets/configmaps grant = catastrophic blast
  # radius). When true (default backward compat for unreleased clusters),
  # loopzero-api retains cluster-wide secrets/configmaps RBAC for existing
  # deploys. Flip to false only AFTER per-tenant Role rollout via
  # tenant-controller reconcile (see operators/internal/tenant/tenant_rbac.go).
  # Phased cutover: Day 0 deploy keeps current behavior; Day N flip to false.
  legacyClusterWideSecrets: true

startupProbe:
  enabled: true
  path: /api/v1/health
  port: http
  failureThreshold: 30
  periodSeconds: 2

livenessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5

readinessProbe:
  # DEEP de proposito, e diferente da liveness acima (B-135).
  #
  # As duas apontavam para `/api/v1/health`, que responde 200 INCONDICIONALMENTE. Isso
  # deixa o pod `Ready` mesmo com o banco fora — recebendo trafego e devolvendo erro em 27
  # das 36 superficies. Nao existia estado observavel em que a instancia estivesse viva e
  # FORA do Service, que e' a unica coisa que prontidao serve para fazer.
  #
  # `/api/v1/health/ready` ja' existia (`server/router.go:120` -> `DeepHealth`) e devolve
  # 503 quando o banco nao responde, quando um servico declarado esta' inalcancavel, ou
  # quando a descoberta encontra ZERO cells — com zero cells o roteador nao resolve destino
  # nenhum e a instancia nao serve NENHUMA operacao de deploy.
  #
  # `periodSeconds` subiu de 10 para 15 (igual a liveness): o deep faz I/O de rede, e a
  # objecao de custo esta' registrada como risco aceito no amendment.
  #
  # A LIVENESS NAO MUDA, e isso e' deliberado: apontar liveness para o deep faria o banco
  # fora MATAR o pod, e o pod novo tambem nao teria banco — laco de reinicio sem
  # convergencia. Liveness responde "o processo esta' vivo".
  #
  # MEET-ASYNC-AMENDMENT-2026-08-19-readiness-deep-probe (pending ratification).
  httpGet:
    path: /api/v1/health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3

metrics:
  serviceMonitor:
    # Enabled 2026-09-07 (system-design audit SD-01.13). While this was false the
    # only scrape of the control-plane API came from a standalone manifest applied
    # by `task infra:install:monitoring` — outside any reconciler, so drift was
    # never corrected and a cluster rebuilt without that task ran unscraped.
    enabled: true
    port: metrics
    interval: 30s
    scrapeTimeout: 10s

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3001
  extraEgress:
    - ports:
        - protocol: TCP
          port: 5432
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql

# Grace period for in-flight SSE streams on a rolling update (SD-12.2).
# 300 matches the progressDeadlineSeconds the renderer sets on tenant Rollouts:
# the stream must outlive the canary it is reporting on.
terminationGracePeriodSeconds: 300

topologySpreadConstraints:
  # Enabled 2026-09-07 (system-design audit SD-05.4). replicaCount is 2 and the
  # helper spreads on zone AND hostname with whenUnsatisfiable: ScheduleAnyway,
  # so on a single-node k3d cluster this is a no-op and on the managed cluster
  # it is the difference between the pair surviving a node loss and not.
  enabled: true

affinity: {}

tolerations: []
nodeSelector: {}
