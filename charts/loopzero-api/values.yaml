  port: "3001"
  metricsPort: "9090"
  loopzeroEnv: "development"
  logLevel: "info"
  baseDomain: "loopzero.local"
  serverReadHeaderTimeout: "10s"
  serverReadTimeout: "30s"
  serverIdleTimeout: "120s"
  serverGracefulShutdown: "15s"
  dbMaxConns: "25"
  dbMinConns: "5"
  dbMaxConnIdleTime: "30s"
  dbMaxConnLifetime: "1h"
  dbHealthCheckPeriod: "30s"
  dbConnectTimeout: "5s"
  dbStatementTimeout: "30000"
  httpClientTimeout: "10s"
  argocdUrl: "http://argocd-server.argocd.svc.cluster.local:80"
  argocdClientTimeout: "90s"
