# helm-unittest: loop-runtime-common.checksumAnnotationsConfigOnly helper validation.
# Plan T2.8 — variant for charts without secret.yaml.

suite: loop-runtime-common.checksumAnnotationsConfigOnly integration
templates:
  - deployment.yaml
  - configmap.yaml

tests:
  - it: deployment has checksum/config annotation
    template: deployment.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/config"]

  - it: checksum/config is sha256 hex
    template: deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: "^[a-f0-9]{64}$"
