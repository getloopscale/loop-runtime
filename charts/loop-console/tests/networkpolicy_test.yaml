# helm-unittest: NetworkPolicy conditional rendering for loop-console.
# Plan T1.5.

suite: networkpolicy toggle
templates:
  - networkpolicy.yaml

tests:
  - it: does NOT render NetworkPolicy when disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders NetworkPolicy when enabled
    set:
      networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy

  - it: NetworkPolicy is networking.k8s.io/v1
    set:
      networkPolicy.enabled: true
    asserts:
      - isAPIVersion:
          of: networking.k8s.io/v1
      - isKind:
          of: NetworkPolicy

  - it: adds no policy for the sandbox API when none is named
    set:
      networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: lets the console reach a sandbox API outside the cluster
    set:
      networkPolicy.enabled: true
      networkPolicy.sandboxApi.cidr: 10.40.0.1/32
      networkPolicy.sandboxApi.port: 8090
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 1
        equal:
          path: spec.egress[0]
          value:
            ports:
              - protocol: TCP
                port: 8090
            to:
              - ipBlock:
                  cidr: 10.40.0.1/32
      - documentIndex: 1
        equal:
          path: spec.policyTypes
          value: [Egress]
