# loop-console secrets via External Secrets Operator → GCP Secret Manager
# (install-config-contract Slice 1, ADR D2). Auth via Workload Identity — NO static keys.
#
# Prereq: ESO installed + the ESO service account bound to a GCP service account (Workload
#         Identity) with roles/secretmanager.secretAccessor on the loop-console-* secrets.
# Apply:  kubectl apply -f eso-gcp-sm.yaml
# Then:   helm install loop-console … --set existingSecret=loop-console-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: loop-console-gcp-sm
spec:
  provider:
    gcpsm:
      projectID: "!!changeme-gcp-project-id!!"
      auth:
        workloadIdentity:
          clusterLocation: "!!changeme-region!!"
          clusterName: "!!changeme-cluster!!"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loop-console-secrets
  namespace: loop-runtime-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: loop-console-gcp-sm
    kind: ClusterSecretStore
  target:
    name: loop-console-secrets        # MUST equal the chart's existingSecret value
    creationPolicy: Owner
  data:
    # GCP Secret Manager secret names (one per key). Adjust remoteRef.key to your names.
    - secretKey: STRIPE_API_KEY
      remoteRef: { key: "loop-console-stripe-api-key" }
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef: { key: "loop-console-stripe-webhook-secret" }
    - secretKey: SESSION_TOKEN_SECRET
      remoteRef: { key: "loop-console-session-token-secret" }
    - secretKey: LOOP_RUNTIME_SERVICE_AUTH_SECRET
      remoteRef: { key: "loop-console-service-auth-secret" }
    - secretKey: THEMORY_API_KEY
      remoteRef: { key: "loop-console-themory-api-key" }
