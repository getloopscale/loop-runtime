{{- /*
Data-plane platform-admin keys, materialised by ESO from OpenBao through a
ClusterSecretStore. One ExternalSecret per enabled data plane: loop-runtime-rag
(values `rag`) and loop-runtime-lens (values `lens`). The target Secret is
loop-runtime-<plane>-admin-key with the key <PLANE>_PLATFORM_ADMIN_KEY; the pod reads
it through a secrets.keyRefs entry.

Rotation: mint a new admin key on the data plane, write it with
`bao kv patch secret/<openBaoPath> <openBaoProperty>=<new>`; ESO refreshes the
Secret within refreshInterval, and `kubectl rollout restart deployment/loop-console`
picks it up (the binary reads configuration only at boot). Revoke the old key
on the data plane afterwards.
*/ -}}
{{- range $plane, $spec := dict "rag" .Values.rag "lens" .Values.lens }}
{{- if $spec.externalSecretEnabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: loop-runtime-{{ $plane }}-admin-key
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "loop-runtime-common.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $plane }}-admin-key
spec:
  refreshInterval: {{ $spec.externalSecretRefreshInterval | quote }}
  secretStoreRef:
    name: {{ $spec.secretStoreName | quote }}
    kind: ClusterSecretStore
  target:
    name: loop-runtime-{{ $plane }}-admin-key
    creationPolicy: Owner
  data:
    - secretKey: {{ upper $plane }}_PLATFORM_ADMIN_KEY
      remoteRef:
        key: {{ $spec.openBaoPath | quote }}
        property: {{ $spec.openBaoProperty | quote }}
{{- end }}
{{- end }}
