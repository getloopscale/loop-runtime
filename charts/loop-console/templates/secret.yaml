{{- /*
Admin API URLs live in a Secret, not the ConfigMap (find_infra_007). They are
cluster-internal URLs rather than credentials, but they map directly to the
high-privilege Hydra/Kratos admin endpoints; keeping them out of the ConfigMap
removes an enumeration shortcut for any pod with ConfigMap read access
(defence-in-depth alongside the ory NetworkPolicy).
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loop-runtime-common.fullname" . }}-admin
  labels:
    {{- include "loop-runtime-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  KRATOS_ADMIN_URL: {{ .Values.config.kratosAdminUrl | quote }}
  HYDRA_ADMIN_URL: {{ .Values.config.hydraAdminUrl | quote }}
