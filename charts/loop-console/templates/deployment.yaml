apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loop-runtime-common.fullname" . }}
  labels:
    {{- include "loop-runtime-common.labels" . | nindent 4 }}
  {{- if .Values.reloader.enabled }}
  annotations:
    # install-config-contract Slice 2 (ADR D1): rotation-aware restart on Secret change.
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 3 }}
  selector:
    matchLabels:
      {{- include "loop-runtime-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "loop-runtime-common.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # The console reads its configuration as environment variables at start: a
        # changed ConfigMap or Secret rolls the pods.
        {{- include "loop-runtime-common.checksumAnnotations" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "loop-runtime-common.priorityClassName" . | nindent 6 }}
      serviceAccountName: {{ include "loop-runtime-common.serviceAccountName" . }}
      automountServiceAccountToken: {{ include "loop-runtime-common.automountServiceAccountToken" . }}
      {{- with (include "loop-runtime-common.imagePullSecrets" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- include "loop-runtime-common.podSecurityContext" . | nindent 8 }}
      {{- include "loop-runtime-common.affinity" . | nindent 6 }}
      {{- include "loop-runtime-common.topologySpreadConstraints" . | nindent 6 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cloud
          image: {{ include "loop-runtime-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "loop-runtime-common.fullname" . }}
            - secretRef:
                name: {{ include "loop-runtime-common.fullname" . }}-admin
            {{- if .Values.wiringConfigMap }}
            # Cross-capability wiring (loop-console#249): a topology ConfigMap supplying
            # data-plane base URLs (e.g. THEMORY_BASE_URL) resolved per-environment.
            # Optional so a deployment that fronts no data plane omits it.
            - configMapRef:
                name: {{ .Values.wiringConfigMap }}
                optional: true
            {{- end }}
            # loop-console#249: the Model B platform-admin key the broker uses to mint
            # per-tenant memory credentials (THEMORY_PLATFORM_ADMIN_KEY). Optional —
            # only needed when memory is fronted. Provisioned out-of-band (ESO /
            # kubectl) like the other sensitive secrets; never in values.
            - secretRef:
                name: loop-runtime-memory-platform-admin
                optional: true
            # T1.1 of plan 2026-05-29-dashboard-public-integration-canonicalization.
            # Shared with loop-runtime-api — single source of truth for X-Service-Auth.
            - secretRef:
                name: loop-runtime-service-auth
                optional: true
            # P4-T4.2 of same plan. cloud/internal/billing/webhook.go fail-closed.
            - secretRef:
                name: loop-runtime-stripe-webhook
                optional: {{ not .Values.billing.required }}
            {{- if .Values.existingSecret }}
            # install-config-contract Slice 1 (ADR D1): operator-provided Secret supplies
            # the app's referenced secrets (Stripe API key, session token, themory key, ...).
            # Backend-agnostic — populated via ESO / CSI / sops / kubectl (see SECRETS.md).
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- end }}
            {{- with .Values.billing.apiKeysSecret }}
            # Stripe API keys, rotated apart from the webhook secret; required exactly
            # when this environment declares that it charges (billing.required).
            - secretRef:
                name: {{ . | quote }}
                optional: {{ not $.Values.billing.required }}
            {{- end }}
            {{- include "loop-runtime-common.additionalSecretSources" . | nindent 12 }}
          {{- with (include "loop-runtime-common.secretKeyRefs" . | trim) }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "loop-runtime-common.startupProbe" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "loop-runtime-common.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "loop-runtime-common.tmpVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "loop-runtime-common.tmpVolume" . | nindent 8 }}
