{{- include "loop-runtime-common.networkpolicy" . }}
{{- /* The LoopSandbox API outside the cluster. A policy of its own, which adds to the
       one above, so an environment names one address instead of restating extraEgress. */}}
{{- $sandbox := .Values.networkPolicy.sandboxApi | default dict }}
{{- if and .Values.networkPolicy.enabled $sandbox.cidr $sandbox.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "loop-runtime-common.fullname" . }}-sandbox-api
  labels:
    {{- include "loop-runtime-common.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "loop-runtime-common.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: {{ $sandbox.port }}
      to:
        - ipBlock:
            cidr: {{ $sandbox.cidr | quote }}
{{- end }}
