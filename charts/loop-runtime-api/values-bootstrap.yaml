# Values the Helmfile L2 bootstrap installs this chart with, on the core cluster
# (release loop-runtime-api, infra/helmfile/core.helmfile.yaml.gotmpl). Per-environment
# differences layer on top from infra/helmfile/values/<env>/loop-runtime-api.yaml.gotmpl; the
# release sets replicaCount from the environment's `replicas.api`.
#
# There used to be a second chart for this install, infra/helm/loop-runtime-api. It was deleted
# when the pair became one chart (docs/decisions.md, "One chart per bootstrap/published
# pair"); this file is what that chart did, expressed through this chart's typed values.
# Where the two differed on purpose, the difference is written next to the value.

# <global.registry>/<image.repository>:<image.tag>. CI, the environment overlay or the
# release sets the tag from build metadata.
global:
  registry: registry.digitalocean.com/loop-runtime-system

image:
  repository: loop-runtime-api
  # Issue #232 — an immutable SENTINEL, not `latest` and not a pinned version. This default
  # is only reached when an override was forgotten, so it must fail loudly: if it ever
  # reaches a cluster the pod fails with ImagePullBackOff naming `SET-BY-CI`.
  tag: "SET-BY-CI"
  pullPolicy: Always

imagePullSecrets:
  - name: loop-runtime-registry-pull

# Kept on the pods so every existing `-l app=loop-runtime-api` selector keeps matching: the
# network-policies chart, the monitoring manifest, scripts, chaos and capacity tests, and
# the Tilt-owned Deployment, which carries the same label. The Deployment and Service
# select on the app.kubernetes.io pair.
podLabels:
  app: loop-runtime-api

# Every key below is one whose chart default differs from what the API did on this path,
# where the bootstrap chart left it unset and the binary used its own default.
config:
  # The binary's default is false; ArgoCD is reached over plain HTTP in-cluster.
  argocdInsecure: "false"
  # The binary's default carries the scheme.
  minioEndpoint: "http://minio.loop-runtime-system.svc.cluster.local:9000"
  # Unset on this path unless the environment names its issuer (dev-public, drill do).
  # The chart default points at an `ory` namespace that does not exist here.
  jwksUrl: ""
  jwtIssuer: ""
  # The mounted kubeconfigs name their context `in-cluster`; the drill overlay replaces
  # these with the DOKS context names.
  mgmtKubeContext: "in-cluster"
  buildKubeContext: "in-cluster"
  runtimeKubeContext: "in-cluster"

secrets:
  # The chart's own Secret carries only the keys an environment sets; every credential
  # arrives from the Secrets below.
  create: true
  additionalSources:
    - name: loop-runtime-db-credentials
      optional: false
      # Not optional: MEET-ASYNC-AMENDMENT-2026-08-17-no-database-is-a-config-error
      # (B-116). With it optional the API came up WITHOUT a database — 27 of the 36
      # router surfaces off, while the shallow health probe answered 200. Now the kubelet
      # refuses to start the container without the Secret, and the binary fails with a
      # typed error (ErrDatabaseURLNotSet) if the variable is missing some other way.
    # T2.5 + T6.1 of plan 2026-06-10-j22-openbao-transit-eso-sync v1.2 — the AppRole
    # secret_id reaches the API ONLY through this Secret, never as an inline value
    # (gate loop-runtime-api-openbao-approle-envfrom). Bootstrap it with
    #   kubectl create secret generic loop-runtime-openbao-approle \
    #     --from-literal=OPENBAO_VAULT_SECRET_ID="<from vault write>"
    # as docs/runbooks.md (Transit cutover, step 2.1) describes. On the k3d topologies
    # vault-bootstrap-dev.sh writes the secret_id and `loop-runtime-ops seed vault-role-id-sync`
    # adds OPENBAO_VAULT_ROLE_ID, which OpenBao issues anew at every bootstrap.
    - name: loop-runtime-openbao-approle
      optional: true
      reason: >-
        Both halves of the OpenBao AppRole (role_id and secret_id). Dev and test installs
        without OpenBao boot without it; config.Validate() fails loud at startup when
        transit is enabled and either half is missing.
    - name: loop-runtime-broker-token
      optional: true
      reason: >-
        LOOP_RUNTIME_BROKER_TOKEN for the ESO sync broker endpoint. Absent, the API logs that the
        secret-fetch broker is disabled and does not register the route, so tenant
        ExternalSecret reconciles answer 404 — visible, not silent.
    - name: loop-runtime-edge-route-token
      optional: true
      reason: >-
        LOOP_RUNTIME_EDGE_ROUTE_TOKEN, the bearer the public edge presents to ask which cell serves
        a host. Absent, the API does not register /internal/edge/route and reports the
        edge_route surface as off, so public app URLs stay unrouted — visible, not silent.
    - name: loop-runtime-api-minio
      optional: true
      reason: >-
        Object-storage credentials for source bundles, synced by ESO. Absent, uploads use
        the in-cluster MinIO default of the binary's config.
    - name: loop-runtime-api-internal
      optional: true
      reason: >-
        Internal call secrets between platform components (Argo callback, bootstrap,
        encryption key), synced by ESO. Absent, the binary's development defaults apply.
    - name: loop-runtime-api-github
      optional: true
      reason: >-
        GitHub App id and private key, synced by ESO. Absent, the repository introspector
        stays nil and the dashboard lists no repositories.
    - name: loop-runtime-api-stripe
      optional: true
      reason: >-
        Stripe keys, synced by ESO. Absent, the billing journey answers a typed error
        instead of disappearing — the path that already fails loud.
    - name: loop-runtime-api-admin
      optional: true
      reason: >-
        Administrative API key, synced by ESO. Absent, validateAdminAPIKey fails CLOSED
        (an empty key refuses before the comparison), so absence denies access instead of
        granting it.
  keyRefs:
    - name: DATABASE_URL
      secretName: loop-runtime-db-credentials
      key: api-uri
      optional: true
      reason: >-
        #396 — the request pool connects as the non-owner loop_runtime_api role, whose URL the
        credentials Secret stores under `api-uri`; `uri` is the owner's and is for
        migrations. The binary refuses to boot on a pool that can bypass RLS and fails
        typed if the value is empty; the Secret itself is mounted non-optionally above.
    - name: LOOP_RUNTIME_WORKER_DATABASE_URL
      secretName: loop-runtime-db-credentials
      key: worker-uri
      optional: true
      reason: >-
        #396 — the background loops that span tenants connect as loop_runtime_worker. Optional
        because a managed-database environment provides it only when it declares
        LOOP_RUNTIME_WORKER_DB_URI; without it the API falls back to the request pool.
    - name: GITEA_TOKEN
      secretName: gitea-admin
      key: token
      optional: true
      reason: >-
        B78 — the org-admin token the API uses to create and push to tenant GitOps repos.
        Written by the bootstrap chain after the chart is installed.
    - name: ARGOCD_TOKEN
      secretName: loop-runtime-api-tokens
      key: argocd-token
      optional: true
      reason: >-
        F-12 — static ArgoCD token written by generate-secrets.sh. Absent, the
        KubeMintingTokenProvider mints one, and the deep health reports argocd auth failures.
    - name: CF_API_TOKEN
      secretName: loop-runtime-api-tokens
      key: cf-api-token
      optional: true
      reason: >-
        Cloudflare API token, synced by ESO from the API secrets path. Absent, custom-domain
        management stays off.
    - name: OPENBAO_SPKI_PIN_SHA256
      secretName: openbao-spki-pin
      key: OPENBAO_SPKI_PIN_SHA256
      optional: true
      reason: >-
        OpenBao TLS SPKI pin written by vault-bootstrap-dev.sh. Absent, the Transit client
        falls back to standard TLS verification without the pin.
    - name: GITHUB_WEBHOOK_SECRET
      secretName: loop-runtime-github-webhook
      key: value
      optional: true
      reason: >-
        GitHub webhook HMAC secret. Absent, the webhook handler stays disabled and says so
        in the startup log.
    - name: GITHUB_APP_PRIVATE_KEY
      secretName: loop-runtime-api-github
      key: GITHUB_APP_PRIVATE_KEY
      optional: true
      reason: >-
        GitHub App private key. Absent, the App client and the auto-deployer stay nil and
        the webhook route is not registered, which the startup log names.
    - name: LOOP_RUNTIME_SERVICE_AUTH_ED25519_PUBLIC_CURRENT
      secretName: loop-runtime-service-auth-ed25519-pub
      key: current
      optional: true
      reason: >-
        Ed25519 dual-control public key, materialised by ESO. Phase 1: absent means an empty
        trust set, and unsigned requests take the legacy X-Service-Auth path.
    - name: LOOP_RUNTIME_SERVICE_AUTH_ED25519_PUBLIC_PREVIOUS
      secretName: loop-runtime-service-auth-ed25519-pub
      key: previous
      optional: true
      reason: >-
        The previous Ed25519 public key, present only during a rotation window. Absent
        outside one, by design.
    - name: LOOP_RUNTIME_SERVICE_AUTH_NONCE_REDIS_PASSWORD
      secretName: loop-runtime-service-auth-redis
      key: password
      optional: true
      reason: >-
        Password of the Redis replay-protection nonce store. Unused while the nonce store
        address is empty (in-memory fallback, single replica).

kubeconfig:
  clusterSecret:
    name: loop-runtime-cluster-kubeconfigs
    optional: true
    reason: >-
      B36 — generated by generate-secrets.sh from the cluster topology, after the chart is
      installed. Absent, the API cannot reach the build and cell clusters and its deep
      health reports it; the release is `wait: false` and the pod converges once the
      Secret exists.

# F-08 — the bootstrap scrape honoured the labels the API emits (loop_runtime_* canonical labels)
# instead of renaming a clash to exported_<label>; dashboards on this path read them.
metrics:
  serviceMonitor:
    honorLabels: true

# The GitOps pusher clones into temporary directories under /tmp (B79).
tmpVolume:
  sizeLimit: 1Gi

# The bootstrap path never ran a NetworkPolicy for loop-runtime-api. The published default admits
# ingress from the traefik namespace only, which would cut the CLI reaching the pod through
# the dev-public NodePort and loop-console's /engine/* proxy in the same namespace. Turning it
# on here is a separate change with its own LIVE test; an egress policy to OpenBao can then
# be expressed through networkPolicy.extraEgress.
networkPolicy:
  enabled: false

# The two grants the API's code paths need beyond the published defaults — see
# rbac.argocdApplications and rbac.controlPlaneSecrets in values.yaml.
rbac:
  argocdApplications: true
  controlPlaneSecrets: true

# api.<domain> on the websecure entry point, with the edge rate and body limits and a
# cert-manager certificate. The host was never parameterised by environment on this path
# except in drill, which overrides it.
ingressRoute:
  enabled: true
  host: api.dev.getloopscale.com
  # SD-04.6 — the edge is the one place a single instance of the rate limit exists, so
  # neither per-replica multiplication nor the fixed-window boundary burst applies to
  # traffic on this route. body-limit matches SOURCE_MAX_BUNDLE_SIZE (SD-14.1;
  # infra/tests/charts/edge_body_limit_test.go fails if the two diverge).
  middlewares:
    - name: rate-limit
      namespace: traefik
    - name: body-limit
      namespace: traefik
  # GET .../stream (Server-Sent Events) without body-limit, whose buffering holds the
  # response until it ends.
  streamMiddlewares:
    - name: rate-limit
      namespace: traefik
  certIssuer: letsencrypt-prod
