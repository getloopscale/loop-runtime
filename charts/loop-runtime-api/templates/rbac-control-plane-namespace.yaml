{{- if and .Values.rbac.create .Values.rbac.controlPlaneSecrets }}
{{- /*
Secrets the API owns in its OWN namespace, and only there. Two code paths:

  - the ESO sync broker keeps one Secret per tenant secret in the control-plane
    namespace and deletes it with the tenant secret
    (api/internal/k8s/secretsync/secret_k8s_manager.go: get, create, update, delete);
  - the ArgoCD token provider persists the token it mints
    (api/internal/argocd/kube_minting_token_provider.go: get, create, update).

A namespaced Role, not a ClusterRole rule: the cluster-wide secrets grant is the
catastrophic blast radius rbac.legacyClusterWideSecrets exists to retire, and it
never carried `delete`. With this Role the API keeps working when that flag is
turned off, and a delete reaches one namespace instead of every namespace.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "loop-runtime-common.fullname" . }}-control-plane-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "loop-runtime-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "loop-runtime-common.fullname" . }}-control-plane-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "loop-runtime-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "loop-runtime-common.fullname" . }}-control-plane-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "loop-runtime-common.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
