{{- if .Values.secrets.create }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loop-runtime-common.fullname" . }}
  labels:
    {{- include "loop-runtime-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.loopRuntimeWorkerDatabaseUrl }}
  LOOP_RUNTIME_WORKER_DATABASE_URL: {{ .Values.secrets.loopRuntimeWorkerDatabaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.loopRuntimeApiDatabaseUrl }}
  LOOP_RUNTIME_API_DATABASE_URL: {{ .Values.secrets.loopRuntimeApiDatabaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.giteaToken }}
  GITEA_TOKEN: {{ .Values.secrets.giteaToken | quote }}
  {{- end }}
  {{- if .Values.secrets.argocdToken }}
  ARGOCD_TOKEN: {{ .Values.secrets.argocdToken | quote }}
  {{- end }}
  {{- if .Values.secrets.minioAccessKey }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  {{- end }}
  {{- if .Values.secrets.minioSecretKey }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.loopRuntimeArgoCallbackSecret }}
  LOOP_RUNTIME_ARGO_CALLBACK_SECRET: {{ .Values.secrets.loopRuntimeArgoCallbackSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.loopRuntimeBootstrapSecret }}
  LOOP_RUNTIME_BOOTSTRAP_SECRET: {{ .Values.secrets.loopRuntimeBootstrapSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.loopRuntimeSecretEncryptionKey }}
  LOOP_RUNTIME_SECRET_ENCRYPTION_KEY: {{ .Values.secrets.loopRuntimeSecretEncryptionKey | quote }}
  {{- end }}
  {{- if .Values.secrets.openbaoVaultRoleId }}
  OPENBAO_VAULT_ROLE_ID: {{ .Values.secrets.openbaoVaultRoleId | quote }}
  {{- end }}
  {{- if .Values.secrets.openbaoVaultSecretId }}
  OPENBAO_VAULT_SECRET_ID: {{ .Values.secrets.openbaoVaultSecretId | quote }}
  {{- end }}
  {{- if .Values.secrets.cfApiToken }}
  CF_API_TOKEN: {{ .Values.secrets.cfApiToken | quote }}
  {{- end }}
  {{- if .Values.secrets.coreKubeconfig }}
  CORE_KUBECONFIG: {{ .Values.secrets.coreKubeconfig | quote }}
  {{- end }}
  {{- if .Values.secrets.buildKubeconfig }}
  BUILD_KUBECONFIG: {{ .Values.secrets.buildKubeconfig | quote }}
  {{- end }}
  {{- if .Values.secrets.cell0Kubeconfig }}
  CELL_0_KUBECONFIG: {{ .Values.secrets.cell0Kubeconfig | quote }}
  {{- end }}
  {{- if .Values.secrets.stripeSecretKey }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.githubAppPrivateKey }}
  GITHUB_APP_PRIVATE_KEY: {{ .Values.secrets.githubAppPrivateKey | quote }}
  {{- end }}
  {{- if .Values.secrets.githubWebhookSecret }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.secrets.githubWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.loopRuntimeAdminApiKey }}
  LOOP_RUNTIME_ADMIN_API_KEY: {{ .Values.secrets.loopRuntimeAdminApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.loopRuntimeAdminApiKeyPrevious }}
  LOOP_RUNTIME_ADMIN_API_KEY_PREVIOUS: {{ .Values.secrets.loopRuntimeAdminApiKeyPrevious | quote }}
  {{- end }}
  {{- if .Values.secrets.loopRuntimeAdminServiceAuthSecret }}
  LOOP_RUNTIME_ADMIN_SERVICE_AUTH_SECRET: {{ .Values.secrets.loopRuntimeAdminServiceAuthSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.loopRuntimeAdminServiceAuthSecretPrevious }}
  LOOP_RUNTIME_ADMIN_SERVICE_AUTH_SECRET_PREVIOUS: {{ .Values.secrets.loopRuntimeAdminServiceAuthSecretPrevious | quote }}
  {{- end }}
  {{- if .Values.secrets.loopRuntimeBrokerToken }}
  LOOP_RUNTIME_BROKER_TOKEN: {{ .Values.secrets.loopRuntimeBrokerToken | quote }}
  {{- end }}
  {{- if .Values.secrets.loopRuntimeBrokerTokens }}
  LOOP_RUNTIME_BROKER_TOKENS: {{ .Values.secrets.loopRuntimeBrokerTokens | quote }}
  {{- end }}
  {{- if .Values.secrets.loopRuntimeEdgeRouteToken }}
  LOOP_RUNTIME_EDGE_ROUTE_TOKEN: {{ .Values.secrets.loopRuntimeEdgeRouteToken | quote }}
  {{- end }}
  {{- if .Values.secrets.loopRuntimeServiceAuthSecret }}
  LOOP_RUNTIME_SERVICE_AUTH_SECRET: {{ .Values.secrets.loopRuntimeServiceAuthSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.loopRuntimeServiceAuthSecretPrevious }}
  LOOP_RUNTIME_SERVICE_AUTH_SECRET_PREVIOUS: {{ .Values.secrets.loopRuntimeServiceAuthSecretPrevious | quote }}
  {{- end }}
  {{- if .Values.secrets.loopRuntimeServiceAuthNonceRedisPassword }}
  LOOP_RUNTIME_SERVICE_AUTH_NONCE_REDIS_PASSWORD: {{ .Values.secrets.loopRuntimeServiceAuthNonceRedisPassword | quote }}
  {{- end }}
{{- end }}
{{- end }}
