{{- if .Values.rbac.create }}
# Secret access on the management cluster, confined to loopzero-system.
#
# What the operator reads there, and nothing else:
#   - the kubeconfig Secret of each cell's ClusterCredential
#     (CellAwareRuntimeClientFactory; a SecretRef in any other namespace is
#     refused by the factory)
#   - the registry pull Secret the Environment controller copies into each
#     workload namespace of a cell
# Both reads go through the manager cache, whose Secret informer is scoped to
# loopzero-system (operators/cmd/tenant-operator managerCacheOptions) — hence
# list/watch alongside get. The operator writes no Secret on this cluster.
#
# The namespace is the literal the binary uses (constants.NamespacePlatformSystem),
# not .Release.Namespace: the operator reads loopzero-system wherever it is installed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "loopzero-common.fullname" . }}-secrets-loopzero-system
  namespace: loopzero-system
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "loopzero-common.fullname" . }}-secrets-loopzero-system
  namespace: loopzero-system
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "loopzero-common.fullname" . }}-secrets-loopzero-system
subjects:
  - kind: ServiceAccount
    name: {{ include "loopzero-common.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
