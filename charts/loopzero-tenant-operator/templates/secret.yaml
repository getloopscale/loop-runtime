{{- if .Values.secrets.create }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loopzero-common.fullname" . }}
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.digitaloceanToken }}
  DIGITALOCEAN_TOKEN: {{ .Values.secrets.digitaloceanToken | quote }}
  {{- end }}
  {{- if .Values.secrets.giteaToken }}
  GITEA_TOKEN: {{ .Values.secrets.giteaToken | quote }}
  {{- end }}
  {{- if .Values.secrets.minioAccessKey }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  {{- end }}
  {{- if .Values.secrets.minioSecretKey }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.registryDockerConfig }}
  REGISTRY_DOCKER_CONFIG: {{ .Values.secrets.registryDockerConfig | quote }}
  {{- end }}
  {{- if .Values.secrets.spacesAccessKeyId }}
  SPACES_ACCESS_KEY_ID: {{ .Values.secrets.spacesAccessKeyId | quote }}
  {{- end }}
  {{- if .Values.secrets.spacesSecretAccessKey }}
  SPACES_SECRET_ACCESS_KEY: {{ .Values.secrets.spacesSecretAccessKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
