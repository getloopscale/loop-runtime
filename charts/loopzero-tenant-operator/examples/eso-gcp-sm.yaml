# loopzero-tenant-operator secrets via External Secrets Operator -> gcp-sm
# Apply: kubectl apply -f eso-gcp-sm.yaml ; then helm install ... --set secrets.existingSecret=loopzero-tenant-operator-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: loopzero-tenant-operator-gcp-sm
spec:
  provider:
    gcpsm:
      projectID: "!!changeme-gcp-project!!"
      auth:
        workloadIdentity:
          clusterLocation: !!changeme-location!!
          clusterName: !!changeme-cluster!!
          serviceAccountRef:
            name: loopzero-tenant-operator
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loopzero-tenant-operator-secrets
  namespace: loopzero-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: loopzero-tenant-operator-gcp-sm
    kind: ClusterSecretStore
  target:
    name: loopzero-tenant-operator-secrets
    creationPolicy: Owner
  data:
    - secretKey: DIGITALOCEAN_TOKEN
      remoteRef: { key: "loopzero/tenant-operator", property: "digitalocean_token" }
    - secretKey: GITEA_TOKEN
      remoteRef: { key: "loopzero/tenant-operator", property: "gitea_token" }
    - secretKey: MINIO_ACCESS_KEY
      remoteRef: { key: "loopzero/tenant-operator", property: "minio_access_key" }
    - secretKey: MINIO_SECRET_KEY
      remoteRef: { key: "loopzero/tenant-operator", property: "minio_secret_key" }
    - secretKey: REGISTRY_DOCKER_CONFIG
      remoteRef: { key: "loopzero/tenant-operator", property: "registry_docker_config" }
    - secretKey: SPACES_ACCESS_KEY_ID
      remoteRef: { key: "loopzero/tenant-operator", property: "spaces_access_key_id" }
    - secretKey: SPACES_SECRET_ACCESS_KEY
      remoteRef: { key: "loopzero/tenant-operator", property: "spaces_secret_access_key" }
