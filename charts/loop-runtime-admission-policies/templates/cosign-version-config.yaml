{{/*
ConfigMap consumed by `infra/scripts/security/check-cosign-cutover-deadline.sh`
for cosign v3 upgrade deadline enforcement per
ADR-2026-05-28-cosign-v2.4.3-deadline.

Default state: target_version=v2.4.3, set_at omitted = no upgrade pending.

When operator schedules v3 upgrade, override via helm values:
  cosignVersionConfig:
    targetVersion: "v3"
    setAt: "2026-06-15"

EC-1 fix: set_at REQUIRED when targetVersion!=v2.4.3 to prevent clock-reset
bypass. Script refuses ambiguous deadline (exit 1) if targetVersion=v3 but
set_at empty.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: loop-runtime-cosign-version-config
  namespace: {{ .Release.Namespace | default "loop-runtime-system" }}
  labels:
    app.kubernetes.io/name: loop-runtime-cosign-version-config
    app.kubernetes.io/component: cosign-upgrade-tracker
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    runtime.getloopscale.com/purpose: cosign-v3-upgrade-deadline-ratchet
  annotations:
    runtime.getloopscale.com/adr: "ADR-2026-05-28-cosign-v2.4.3-deadline"
data:
  target_version: {{ (.Values.cosignVersionConfig | default dict).targetVersion | default "v2.4.3" | quote }}
{{- if (.Values.cosignVersionConfig | default dict).setAt }}
  set_at: {{ .Values.cosignVersionConfig.setAt | quote }}
{{- end }}
