{{- if .Values.vaps.disallowLatestTag }}
# ValidatingAdmissionPolicy: Disallow :latest image tag for tenant workloads.
# Forces explicit versioning for reproducibility and rollback safety.
# Covers: containers, initContainers, ephemeralContainers (F2-C1).
# MEET-2026-03-30-021 Phase 2.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: loop-runtime-disallow-latest-tag
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        runtime.getloopscale.com/managed-by: environment-controller
  validations:
    - expression: >-
        object.spec.containers.all(c, !c.image.endsWith(':latest'))
      message: "Image tag ':latest' is not allowed. Use a specific version or digest."
    - expression: >-
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(c, !c.image.endsWith(':latest'))
      message: "Init container image tag ':latest' is not allowed."
    - expression: >-
        !has(object.spec.ephemeralContainers) ||
        object.spec.ephemeralContainers.all(c, !c.image.endsWith(':latest'))
      message: "Ephemeral container image tag ':latest' is not allowed."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: loop-runtime-disallow-latest-tag-binding
spec:
  policyName: loop-runtime-disallow-latest-tag
  validationActions:
    - Deny
    - Audit
  matchResources:
    namespaceSelector:
      matchLabels:
        runtime.getloopscale.com/managed-by: environment-controller
{{- end }}
