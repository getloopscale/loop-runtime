{{- if .Values.alerts.sigstoreEnabled }}
# T1.2 of plan 2026-05-27-tenant-build-pipeline-gaps-closure.
# Per ADR-2026-05-27-T2.2-OFFLINE-TUF § Engineering deliverables #5.
#
# 4 alerts for self-hosted Sigstore stack (Fulcio + Rekor + CTLog + TUF).
# Gated by sigstoreEnabled flag — operator flips post-Sigstore activation
# (avoids alert noise when stack not yet deployed).
#
# v1.1 EC-NEW-1 fix: fulcio_cert_issuance_duration_seconds (was missing
# _seconds suffix — would never match Fulcio's actual emitted metric).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loop-runtime-sigstore-alerts
  namespace: {{ .Values.alerts.namespace | quote }}
  labels:
    release: {{ .Values.alerts.prometheusReleaseLabel | quote }}
    runtime.getloopscale.com/component: sigstore
    runtime.getloopscale.com/plan: tenant-build-pipeline-gaps-closure
spec:
  groups:
    - name: loop-runtime.sigstore
      interval: 30s
      rules:
        # ─────────────────────────────────────────────────────────────────
        # Alert 1: cosign signing failures (LoopRuntime-emitted counter)
        # ─────────────────────────────────────────────────────────────────
        - alert: LoopRuntimeCosignSignFailures
          expr: |
            rate(loop_runtime_cosign_sign_failure_total[5m]) > 0
          for: 5m
          labels:
            severity: critical
            loop_runtime_component: sigstore
            loop_runtime_alert_class: signing
          annotations:
            summary: "cosign signing failures detected"
            description: {{ printf "{{ $value }} cosign sign failures/sec sustained over 5m. Builds are producing unsigned (or wrongly-signed) images. Check Fulcio reachability + signing key validity. Runbook: docs/runbooks.md + ADR-2026-05-27-T2.2-OFFLINE-TUF." | quote }}
            runbook_url: "https://github.com/getloopscale/loop-runtime/blob/develop/docs/runbooks.md"

        # ─────────────────────────────────────────────────────────────────
        # Alert 2: Fulcio cert issuance latency (Fulcio-native histogram)
        # v1.1 EC-NEW-1 fix: metric name has _seconds suffix per Fulcio
        # emit convention. Without this, PromQL never matches.
        # ─────────────────────────────────────────────────────────────────
        - alert: LoopRuntimeFulcioCertIssuanceSlow
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(fulcio_cert_issuance_duration_seconds_bucket[5m]))
            ) > 30
          for: 10m
          labels:
            severity: warning
            loop_runtime_component: sigstore
            loop_runtime_alert_class: latency
          annotations:
            summary: "Fulcio cert issuance p99 > 30s"
            description: {{ printf "Fulcio cert issuance p99 has been above 30s for 10m. Build pipeline signing step will hit activeDeadlineSeconds (180s) if latency continues to grow. Check Fulcio pod health + upstream OIDC issuer availability." | quote }}
            runbook_url: "https://github.com/getloopscale/loop-runtime/blob/develop/docs/runbooks.md"

        # ─────────────────────────────────────────────────────────────────
        # Alert 3: Rekor log append failures (Rekor-native counter)
        # ─────────────────────────────────────────────────────────────────
        - alert: LoopRuntimeRekorLogAppendFailure
          expr: |
            rate(rekor_log_append_failure_total[5m]) > 0
          for: 2m
          labels:
            severity: critical
            loop_runtime_component: sigstore
            loop_runtime_alert_class: integrity
          annotations:
            summary: "Rekor log append failures detected"
            description: {{ printf "Rekor transparency log append failures: {{ $value }}/sec. Build attestations may not reach the log → SLSA L3 verification chain broken. Check Trillian backend + storage capacity (PV alerts in sigstore-storage-alerts.yaml)." | quote }}
            runbook_url: "https://github.com/getloopscale/loop-runtime/blob/develop/docs/runbooks.md"

        # ─────────────────────────────────────────────────────────────────
        # Alert 4: TUF root expiry countdown
        # Metric tuf_root_expiry_timestamp emitted by CronJob in
        # tuf-expiry-cronjob.yaml (T1.2.b — v1.1 EC-NEW-2 fix).
        # ─────────────────────────────────────────────────────────────────
        - alert: LoopRuntimeTufRootExpirySoon
          expr: |
            (tuf_root_expiry_timestamp - time()) / 86400 < 30
          for: 1h
          labels:
            severity: warning
            loop_runtime_component: sigstore
            loop_runtime_alert_class: expiry
          annotations:
            summary: "TUF root expires in < 30 days"
            description: {{ printf "TUF root key expires in {{ $value }} days. Schedule offline TUF ceremony before expiry — see docs/runbooks.md. Quorum (3-of-5) required; minimum 2 weeks lead time." | quote }}
            runbook_url: "https://github.com/getloopscale/loop-runtime/blob/develop/docs/runbooks.md"

        - alert: LoopRuntimeTufRootExpiryCritical
          expr: |
            (tuf_root_expiry_timestamp - time()) / 86400 < 7
          for: 15m
          labels:
            severity: critical
            loop_runtime_component: sigstore
            loop_runtime_alert_class: expiry
          annotations:
            summary: "TUF root expires in < 7 days — URGENT"
            description: "TUF root key expires in less than 7 days. Sigstore signing chain will BREAK at expiry. Execute emergency rotation OR rollback to keyed mode via ConfigMap loop-runtime-cosign-config."
            runbook_url: "https://github.com/getloopscale/loop-runtime/blob/develop/docs/runbooks.md"

        # Stale-metric alert: if TUF expiry CronJob (T1.2.b) stops emitting,
        # Pushgateway TTL expires the metric → Alert 4 stops firing →
        # operator has NO warning. This meta-alert catches that case.
        - alert: LoopRuntimeTufExpiryMetricMissing
          expr: |
            absent(tuf_root_expiry_timestamp)
          for: 72h
          labels:
            severity: warning
            loop_runtime_component: sigstore
            loop_runtime_alert_class: observability
          annotations:
            summary: "TUF expiry metric absent > 72h"
            description: "Metric tuf_root_expiry_timestamp has been absent for 72h. The daily CronJob tuf-expiry-emitter is likely failing — check its CronJob status in argo-ci-namespace OR sigstore-system. Without this metric, TUF expiry alerts (LoopRuntimeTufRootExpirySoon, LoopRuntimeTufRootExpiryCritical) cannot fire."
            runbook_url: "https://github.com/getloopscale/loop-runtime/blob/develop/docs/runbooks.md"
{{- end }}
