{{- if .Values.alerts.enabled }}
# Sprint 6 / T2.3 — Policy-controller (sigstore) alerts and SLOs.
#
# Source: MEET-2026-03-30-022 §Distributed Systems —
#   "Monitor Kyverno verifyImages webhook latency — alert if p99 > 1s"
# Generalized to sigstore policy-controller (D3).
#
# The webhook is on the admission path; latency above SLO directly
# delays pod scheduling. The signature_verification metrics expose
# both Audit (D4) and Deny outcomes; we alert on either.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loop-runtime-policy-controller-alerts
  namespace: {{ .Values.alerts.namespace | quote }}
  labels:
    release: {{ .Values.alerts.prometheusReleaseLabel | quote }}
    runtime.getloopscale.com/component: policy-controller
    runtime.getloopscale.com/sprint: "6"
spec:
  groups:
    - name: loop-runtime.policy-controller
      interval: 30s
      rules:
        # ─────────────────────────────────────────────────────────────────
        # Webhook latency — admission path SLO
        # ─────────────────────────────────────────────────────────────────
        - alert: LoopRuntimePolicyControllerWebhookLatencyHigh
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(policy_controller_webhook_duration_seconds_bucket[5m]))
            ) > 0.5
          for: 10m
          labels:
            severity: warning
            loop_runtime_component: policy-controller
          annotations:
            summary: "policy-controller webhook p99 latency > 500ms"
            description: "Sigstore policy-controller webhook p99 has been above 500ms for 10 minutes — pod admission is being delayed."

        - alert: LoopRuntimePolicyControllerWebhookLatencyCritical
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(policy_controller_webhook_duration_seconds_bucket[5m]))
            ) > 1.0
          for: 5m
          labels:
            severity: critical
            loop_runtime_component: policy-controller
          annotations:
            summary: "policy-controller webhook p99 latency > 1s"
            description: "Sigstore policy-controller webhook p99 has been above 1s for 5 minutes — admission is severely degraded. New pods cannot start in tenant namespaces until latency recovers."

        # ─────────────────────────────────────────────────────────────────
        # Verification failures — supply chain integrity
        # ─────────────────────────────────────────────────────────────────
        # In Audit mode (D4) failures are LOGGED but admitted. This alert
        # surfaces the ratio so operators can decide when to flip to Deny.
        - alert: LoopRuntimePolicyControllerVerificationFailuresPresent
          expr: |
            increase(policy_controller_image_signature_verifications_total{result="failure"}[15m]) > 0
          for: 0m
          labels:
            severity: info
            loop_runtime_component: policy-controller
          annotations:
            summary: "policy-controller observed signature verification failures"
            description: {{ printf "{{ $value }} verification failure(s) in the last 15m. In Audit mode these are admitted; review the audit log before flipping to Deny." | quote }}

        # When in Deny mode (post-audit), even a single sustained failure
        # blocks deploys. Different threshold/severity for that case.
        - alert: LoopRuntimePolicyControllerVerificationFailureRateHigh
          expr: |
            (
              sum(rate(policy_controller_image_signature_verifications_total{result="failure"}[5m]))
              /
              clamp_min(sum(rate(policy_controller_image_signature_verifications_total[5m])), 0.001)
            ) > 0.05
          for: 10m
          labels:
            severity: warning
            loop_runtime_component: policy-controller
          annotations:
            summary: "policy-controller verification failure rate > 5%"
            description: "More than 5% of admission decisions failed verification in the last 5m. Possible regression in the build pipeline (un-signed images) or rotated key drift."

        # ─────────────────────────────────────────────────────────────────
        # Controller availability
        # ─────────────────────────────────────────────────────────────────
        - alert: LoopRuntimePolicyControllerDown
          expr: |
            absent(up{namespace="cosign-system",job=~".*policy-controller.*"} == 1)
          for: 5m
          labels:
            severity: critical
            loop_runtime_component: policy-controller
          annotations:
            summary: "policy-controller is unreachable"
            description: "Sigstore policy-controller has been unreachable for 5 minutes. In Audit mode (D4) admissions still succeed but lose verification visibility; in Deny mode admissions FAIL CLOSED for tenant namespaces."

        # ─────────────────────────────────────────────────────────────────
        # T2.3 of maturity-3-62-to-4-0-roadmap: image digest enforcement
        # ─────────────────────────────────────────────────────────────────
        # The loop-runtime-require-image-digest VAP runs in warn-mode by default.
        # The Kubernetes apiserver exposes the policy check failure counter
        # for both Warn + Deny outcomes. This alert surfaces the warn-rate
        # so operators can validate zero-violation 7-day soak before
        # flipping requireImageDigestEnforce=true (Deny mode).
        #
        # Expected steady-state: 0 (every platform pod uses image@digest).
        # Non-zero = a chart, sidecar, or operator-applied manifest still
        # uses :tag — investigate before the sponsor flip.
        - alert: LoopRuntimeImageDigestWarnRatePresent
          expr: |
            increase(apiserver_admission_policy_check_failures_total{policy="loop-runtime-require-image-digest"}[15m]) > 0
          for: 0m
          labels:
            severity: info
            loop_runtime_component: admission-vap
            loop_runtime_gate: T2.3
          annotations:
            summary: "image-digest VAP saw warn-mode violations"
            runbook_url: "https://github.com/getloopscale/loop-runtime/blob/develop/docs/runbooks.md#image-digest-admission-warnings"
            description: {{ printf "{{ $value }} pod admission(s) used :tag instead of @sha256:<digest> in the last 15m. Investigate before sponsor flips requireImageDigestEnforce=true (would Deny these admissions)." | quote }}
{{- end }}
