{{- if .Values.alerts.sigstoreEnabled }}
# T1.1 of plan 2026-05-27-tenant-build-pipeline-gaps-closure.
# Per ADR-2026-05-27-T2.2-OFFLINE-TUF § Engineering deliverables #4.
#
# PV usage alerts for Rekor + Trillian backend storage.
# Thresholds: 80% warn (operator schedule archive), 95% critical (page).
#
# Metric source: kubelet exposes kubelet_volume_stats_used_bytes +
# kubelet_volume_stats_capacity_bytes per PV.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loopzero-sigstore-storage-alerts
  namespace: {{ .Values.alerts.namespace | quote }}
  labels:
    release: {{ .Values.alerts.prometheusReleaseLabel | quote }}
    loopzero.io/component: sigstore
    loopzero.io/alert_class: storage
spec:
  groups:
    - name: loopzero.sigstore.storage
      interval: 1m
      rules:
        - alert: LoopZeroSigstorePVUsageHigh
          expr: |
            (
              kubelet_volume_stats_used_bytes{namespace="sigstore-system"}
              /
              kubelet_volume_stats_capacity_bytes{namespace="sigstore-system"}
            ) > 0.80
          for: 30m
          labels:
            severity: warning
            loopzero_component: sigstore
            loopzero_alert_class: storage
          annotations:
            summary: "Sigstore PV usage > 80%"
            description: {{ printf "PV {{ $labels.persistentvolumeclaim }} in sigstore-system at {{ $value | humanizePercentage }} usage. Schedule rekor-archive-old-entries.sh run OR plan PV resize. See docs/operations/sigstore-storage-model.md § PV resize procedure." | quote }}
            runbook_url: "https://github.com/getloopscale/loopzero/blob/develop/docs/operations/sigstore-storage-model.md"

        - alert: LoopZeroSigstorePVUsageCritical
          expr: |
            (
              kubelet_volume_stats_used_bytes{namespace="sigstore-system"}
              /
              kubelet_volume_stats_capacity_bytes{namespace="sigstore-system"}
            ) > 0.95
          for: 5m
          labels:
            severity: critical
            loopzero_component: sigstore
            loopzero_alert_class: storage
          annotations:
            summary: "Sigstore PV usage > 95% — URGENT"
            description: {{ printf "PV {{ $labels.persistentvolumeclaim }} in sigstore-system at {{ $value | humanizePercentage }} usage. Rekor will stop accepting new entries when PV full → builds stall. Immediate action: PV resize (docs/operations/sigstore-storage-model.md) OR force-archive." | quote }}
            runbook_url: "https://github.com/getloopscale/loopzero/blob/develop/docs/operations/sigstore-storage-model.md"
{{- end }}
