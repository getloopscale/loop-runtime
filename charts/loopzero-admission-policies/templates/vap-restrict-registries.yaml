{{- if .Values.vaps.restrictRegistries }}
# ValidatingAdmissionPolicy: Restrict image registries for tenant workloads.
# Only images from approved LoopZero container registries are allowed.
# Covers: containers, initContainers, ephemeralContainers (F2-C1).
# MEET-2026-03-30-021 Phase 2.
#
# MEET-2026-04-11-048: Harbor registry migration (dual-registry transition).
# During migration, BOTH DOCR and Harbor prefixes are allowed.
{{- /*
  CHG-2026-04-29-DOGFOOD iter 9 — build the allowed-registry CEL
  predicate from `docrPrefix` + `harborPrefix` + `additionalPrefixes`.
  Production overlays leave additionalPrefixes empty so DOCR/Harbor are
  the only accepted sources; standalone-multi opts in with the local
  k3d registry so dogfood pods pass admission (Rule 10).
*/}}
{{- $prefixes := list .Values.registries.docrPrefix .Values.registries.harborPrefix }}
{{- range .Values.registries.additionalPrefixes }}
{{- $prefixes = append $prefixes . }}
{{- end }}
{{- $containerCEL := list }}
{{- $initCEL := list }}
{{- $ephCEL := list }}
{{- range $prefixes }}
{{- $containerCEL = append $containerCEL (printf "c.image.startsWith(%q)" .) }}
{{- $initCEL = append $initCEL (printf "c.image.startsWith(%q)" .) }}
{{- $ephCEL = append $ephCEL (printf "c.image.startsWith(%q)" .) }}
{{- end }}
{{- $containerExpr := join " || " $containerCEL }}
{{- $initExpr := join " || " $initCEL }}
{{- $ephExpr := join " || " $ephCEL }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: loopzero-restrict-image-registries
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        loopzero.io/managed-by: environment-controller
  validations:
    # MEET-048 + CHG-DOGFOOD iter 9: prefix list comes from values.yaml.
    - expression: >-
        object.spec.containers.all(c, {{ $containerExpr }})
      message: "All containers must use images from an approved registry"
    - expression: >-
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(c, {{ $initExpr }})
      message: "All init containers must use images from an approved registry"
    - expression: >-
        !has(object.spec.ephemeralContainers) ||
        object.spec.ephemeralContainers.all(c, {{ $ephExpr }})
      message: "All ephemeral containers must use images from an approved registry"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: loopzero-restrict-image-registries-binding
spec:
  policyName: loopzero-restrict-image-registries
  # MEET-048: Upgraded from [Audit] to [Deny, Audit] — enforce registry restriction.
  validationActions:
    - Deny
    - Audit
  matchResources:
    namespaceSelector:
      matchLabels:
        loopzero.io/managed-by: environment-controller
{{- end }}
