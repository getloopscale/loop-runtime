{{- if .Values.alerts.enabled }}
# T3.1 of plan 2026-05-27-tenant-build-pipeline-gaps-closure.
# Per ADR D2: Harbor mirror failure visibility via exit hook → Loki +
# Pushgateway counter. This PrometheusRule alerts on sustained failure
# rate (transient flap noise filtered via 30m window).
#
# Counter source: tenant build pipeline harbor-mirror-observe template
# (api/internal/argo/harbor_mirror_observe.go) pushes to Pushgateway
# with 24h Push-Lifetime TTL (D5).
#
# Alert lifecycle: Alertmanager preserves alert state even after
# Pushgateway TTL expires (decoupled from source metric).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loopzero-harbor-mirror-alerts
  namespace: {{ .Values.alerts.namespace | quote }}
  labels:
    release: {{ .Values.alerts.prometheusReleaseLabel | quote }}
    loopzero.io/component: build-pipeline
    loopzero.io/plan: tenant-build-pipeline-gaps-closure
spec:
  groups:
    - name: loopzero.harbor.mirror
      interval: 1m
      rules:
        # Fire on sustained failure rate (>10% over 30min window).
        # Single transient failures (network flap, harbor restart) won't
        # trigger — only systematic problems do.
        - alert: LoopZeroHarborMirrorFailureRateHigh
          expr: |
            rate(loopzero_harbor_mirror_failure_total[15m]) > 0.1
          for: 30m
          labels:
            severity: warning
            loopzero_component: build-pipeline
            loopzero_alert_class: dual-push
          annotations:
            summary: "Harbor mirror failure rate > 10% sustained 30m"
            description: {{ printf "Harbor mirror has been failing >10%% over 30m. DOCR is primary registry (production still functional) but Harbor mirror is missing latest images. Operator action: check Harbor health + auth credentials." | quote }}
            runbook_url: "https://github.com/getloopscale/loopzero/blob/develop/docs/operations/sigstore-storage-model.md"

        # Immediate alert on any harbor mirror failure (info-level, for
        # dashboard awareness — DOES NOT page operator).
        - alert: LoopZeroHarborMirrorAnyFailure
          expr: |
            increase(loopzero_harbor_mirror_failure_total[5m]) > 0
          for: 0m
          labels:
            severity: info
            loopzero_component: build-pipeline
            loopzero_alert_class: dual-push
          annotations:
            summary: "Harbor mirror failures detected"
            description: {{ printf "{{ $value }} harbor mirror failures in last 5m. Best-effort path — DOCR push still succeeded. Review Loki logs (event=harbor_mirror_failed) for app+tenant detail." | quote }}
{{- end }}
