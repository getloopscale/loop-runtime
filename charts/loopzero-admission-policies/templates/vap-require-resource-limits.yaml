{{- if .Values.policies.requireResourceLimits.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: loopzero-require-resource-limits
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        loopzero.io/managed-by: environment-controller
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.resources) && has(c.resources.limits) &&
          has(c.resources.limits.memory) && has(c.resources.limits.cpu))
      message: "All containers must have CPU and memory limits defined."
    - expression: >-
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(c,
          has(c.resources) && has(c.resources.limits) &&
          has(c.resources.limits.memory) && has(c.resources.limits.cpu))
      message: "All init containers must have CPU and memory limits defined."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: loopzero-require-resource-limits-binding
spec:
  policyName: loopzero-require-resource-limits
  validationActions:
    - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        loopzero.io/managed-by: environment-controller
{{- end }}
