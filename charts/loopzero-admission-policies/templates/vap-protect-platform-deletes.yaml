{{- if .Values.vaps.protectPlatformDeletes }}
# ValidatingAdmissionPolicy: protect the mgmt boundary resources from unauthorized DELETE.
#
# Plan: .claude/knowledge-base/plans/d4-vap-delete-guardrail-plan.md (T1.1)
# ADR:  docs/decisions.md (D4)
#
# WHY THIS EXISTS
#
# ArgoCD Applications created by the tenant-operator carry
# `resources-finalizer.argocd.argoproj.io` (operators/internal/argocd/real_provisioner.go:205),
# so deleting an Application deletes the resources it manages. Before this policy the mgmt
# cluster had NO ValidatingAdmissionPolicy at all — the admission-policies chart is only
# installed on the runtime cluster (infra/helmfile/cell.helmfile.yaml.gotmpl:169), while
# these resources live on mgmt. Under BYOC that cascade reaches a customer's own cloud
# account, which turns an internal incident into contractual damage.
#
# THE CRD RULE IS NOT REDUNDANT (EC-1)
#
# Guarding only the instances leaves open the exact vector of the reference incident:
# deleting the CRD makes Kubernetes garbage-collect every instance, and the cascade runs
# without a single `applications` rule ever being consulted.
#
# TWO CEL TRAPS ARE ALREADY ABSORBED HERE
#
#   1. B33 — a VAP with failurePolicy=Fail on DELETE that does not exempt the cluster's own
#      garbage collector deadlocks namespaces in Terminating forever (5 namespaces were lost
#      to this). The three exemptions below are copied verbatim from
#      vap-protect-platform-networkpolicies.yaml:31-36.
#   2. EC-7 — on a DELETE admission request `object` is NOT populated the way it is on
#      CREATE/UPDATE. Every expression here reads `request.*`; an expression over `object.`
#      would raise an evaluation error which, under failurePolicy=Fail, becomes a blanket
#      block on all deletes. The `vap-delete-guardrail` gate asserts this invariant.
#
# ROLLOUT IS WARN-FIRST BY DESIGN (ADR D3)
#
# `validationActions` ships as Warn. The flip to Deny is a separate task gated on evidence
# that no legitimate identity was caught during the observation window — the mgmt cluster
# has at least one delete path with no known caller (ClusterCredential), so enabling Deny
# with an incomplete exemption map is how B33 happens again.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: loopzero-protect-platform-deletes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["argoproj.io"]
        apiVersions: ["v1alpha1"]
        operations: ["DELETE"]
        resources: ["applications", "appprojects"]
      - apiGroups: ["loopzero.io"]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["tenants", "environments", "clustercredentials"]
      # EC-1 — the CRD itself. Without this the instances above are protected but the
      # object that defines them is not, and deleting it collects them all.
      - apiGroups: ["apiextensions.k8s.io"]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["customresourcedefinitions"]
  matchConditions:
    # B33 — never block the cluster's own garbage collection machinery, nor the
    # platform identities that legitimately tear resources down. Confirmed by
    # deterministic chart render on 2026-08-07 (plan T0.1), not by memory:
    # tenant-operator deletes Applications/AppProjects (real_provisioner.go:381,414,426)
    # and Environment CRs (tenant_deletion.go:86); loopzero-api evicts tenants
    # (api/internal/k8s/tenant_evictor.go:248). The other operators are listed so a
    # future teardown path does not deadlock on a policy nobody remembered to update.
    # Tenants still cannot delete these resources with their own credentials.
    {{- include "loopzero-admission.systemActorExemptions" . | nindent 4 }}
    # Scope the CRD rule to LoopZero's own definitions. Without this the policy would also
    # guard unrelated CRDs (cert-manager, Traefik, KEDA…), which is not its job and would
    # block legitimate platform upgrades. A non-matching CRD makes this condition false,
    # the policy does not run, and the delete proceeds normally.
    - name: only-loopzero-owned-crds
      expression: >-
        request.resource.resource != 'customresourcedefinitions'
        || request.name.endsWith('.loopzero.io')
        || request.name == 'applications.argoproj.io'
        || request.name == 'appprojects.argoproj.io'
  validations:
    # Reaching here means: a guarded resource, deleted by a non-exempt identity. There is
    # nothing left to inspect — the matchConditions already encode the entire decision, so
    # the validation is an unconditional refusal. Message is product language (Rule 3): no
    # ArgoCD, no CRD, no tenant_id.
    - expression: "false"
      message: >-
        This resource is protected. Removing it would also remove the infrastructure it
        manages, including resources that may live in a customer account. Use the product's
        removal command, or contact the platform team.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: loopzero-protect-platform-deletes-binding
spec:
  policyName: loopzero-protect-platform-deletes
  # ADR D3 — Warn first. The flip to Deny is task T2.3, gated on the observation window.
  validationActions:
    - {{ .Values.vaps.protectPlatformDeletesAction | default "Warn" }}
  # No namespaceSelector: the guarded resources live in different namespaces (loopzero-system
  # and whatever ARGOCD_NAMESPACE resolves to — operators/cmd/tenant-operator/main.go:146),
  # and cluster-scoped CRDs live in none. The matchConditions carry the whole decision.
{{- end }}
