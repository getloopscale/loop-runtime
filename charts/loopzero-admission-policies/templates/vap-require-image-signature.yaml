{{- if .Values.vaps.requireImageSignature }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: loopzero-require-image-signature
  annotations:
    loopzero.io/sprint: "6"
    loopzero.io/security: "supply-chain"
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        loopzero.io/managed-by: environment-controller
  validations:
    - expression: >-
        object.spec.containers.all(c,
          c.image.contains('@sha256:'))
      message: "All container images must use digest references (@sha256:...) for supply chain verification. Mutable tags are not allowed in tenant namespaces."
    - expression: >-
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(c,
          c.image.contains('@sha256:'))
      message: "All init container images must use digest references (@sha256:...)."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: loopzero-require-image-signature-binding
spec:
  policyName: loopzero-require-image-signature
  validationActions:
    - Deny
    - Audit
  matchResources:
    namespaceSelector:
      matchLabels:
        loopzero.io/managed-by: environment-controller
{{- end }}
