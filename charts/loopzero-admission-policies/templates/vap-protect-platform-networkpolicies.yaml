{{- if .Values.vaps.protectPlatformNetworkpolicies }}
# CHG-2026-05-05-DOGFOOD-B33: matchConditions exclude the K8s namespace
# garbage collector and kube-controller-manager. Without this, namespace
# deletion deadlocks in Terminating state forever (GC rejected by VAP).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: loopzero-protect-platform-networkpolicies
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["networkpolicies"]
    namespaceSelector:
      matchLabels:
        loopzero.io/managed-by: environment-controller
  matchConditions:
    - name: skip-cluster-internal-gc
      expression: >-
        request.userInfo.username != 'system:serviceaccount:kube-system:namespace-controller'
        && request.userInfo.username != 'system:kube-controller-manager'
        && !('system:masters' in request.userInfo.groups)
  validations:
    - expression: >-
        !has(object.metadata.labels) ||
        !('loopzero.io/managed-by' in object.metadata.labels) ||
        object.metadata.labels['loopzero.io/managed-by'] != 'environment-controller'
      message: "Platform-managed NetworkPolicies cannot be deleted by tenants. Contact platform team."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: loopzero-protect-platform-networkpolicies-binding
spec:
  policyName: loopzero-protect-platform-networkpolicies
  validationActions:
    - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        loopzero.io/managed-by: environment-controller
{{- end }}
