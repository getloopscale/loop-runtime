{{- if .Values.vaps.protectPlatformNetworkpolicies }}
# ValidatingAdmissionPolicy: Protect platform-created NetworkPolicies from tenant deletion.
# Enterprise RBAC grants networkpolicies delete — this prevents deletion of platform policies.
# F2-C2: Mitigates RISK-3 from MEET-2026-03-30-021 security review.
#
# CHG-2026-05-05-DOGFOOD-B33: matchConditions exclude the K8s namespace
# garbage collector (system:serviceaccount:kube-system:namespace-controller)
# and the cluster-internal kube-controller-manager. Without this, when a
# managed namespace enters Terminating state, K8s tries to delete every
# resource (including platform NetworkPolicies). The VAP rejects the
# delete and the namespace deadlocks in Terminating forever — see B33
# evidence: 5 stuck namespaces with cond `ContentDeletionFailed: networkpolicies
# "Unknown" is forbidden: ValidatingAdmissionPolicy ...`. Tenants still
# cannot delete platform NetworkPolicies via their own credentials — only
# the cluster's own machinery and the platform's controllers are exempted
# (loopzero-admission.systemActorExemptions in _helpers.tpl).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: loopzero-protect-platform-networkpolicies
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["networkpolicies"]
    namespaceSelector:
      matchLabels:
        loopzero.io/managed-by: environment-controller
  matchConditions:
    {{- include "loopzero-admission.systemActorExemptions" . | nindent 4 }}
  validations:
    - expression: >-
        !has(object.metadata.labels) ||
        !('loopzero.io/managed-by' in object.metadata.labels) ||
        object.metadata.labels['loopzero.io/managed-by'] != 'environment-controller'
      message: "Platform-managed NetworkPolicies cannot be deleted by tenants. Contact platform team."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: loopzero-protect-platform-networkpolicies-binding
spec:
  policyName: loopzero-protect-platform-networkpolicies
  validationActions:
    - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        loopzero.io/managed-by: environment-controller
{{- end }}
