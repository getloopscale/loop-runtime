# loopzero-admission-policies values.yaml
#
# One chart, three installs. ArgoCD consumes it as the published OCI chart;
# Helmfile L2 installs it on the core cluster (release admission-policies-mgmt,
# overlay values-mgmt.yaml in this directory) and on every cell (release
# admission-policies). Until 2026-09-25 the Helmfile installs used a second copy
# of this chart under infra/helm/admission-policies, kept byte-identical by a
# parity test; it was deleted when the two became one (docs/decisions.md, "One
# chart per bootstrap/published pair").

# Approved registry prefixes used by ClusterImagePolicy and the
# restrict-registries VAP.
registries:
  docrPrefix: "registry.digitalocean.com/loopzero-system/"
  # Opt-in list of additional registry prefixes accepted by the
  # restrict-registries VAP. Default: empty (production only allows the
  # registry above). Local installs add "k3d-loopzero-registry:5000/" so locally built
  # images pass admission while production semantics stay intact.
  additionalPrefixes: []

# ClusterImagePolicy — sigstore policy-controller resource (B16).
# WARNING: policy-controller deny-by-default rejects ALL pods if no
# ClusterImagePolicy matches. This chart MUST be installed before any
# tenant workload starts.
clusterImagePolicy:
  enabled: true
  name: loopzero-images-warn
  # warn    — log audit, admit
  # enforce — reject unsigned images
  #
  # The chart default is warn. Every Helmfile cell install sets the mode from the
  # environment's `policyMode` (infra/helmfile/environments/*.yaml), and the core
  # install disables this policy, so the default only decides an install that
  # names no mode. The `clusterimagepolicy-mode` gate refuses an `enforce` default
  # without a recorded deny-flip sign-off in docs/decisions.md.
  mode: warn
  # static action when no signature can be verified yet
  staticAction: pass
  imageGlobs:
    - "registry.digitalocean.com/loopzero-system/**"

# INF-G16 + MEET-2026-05-03-063 (MEET-B Track-1) + ADR-0040 (charts SBOM parity).
# loopzero-images-keyless: ClusterImagePolicy with Fulcio keyless authority.
# Coexists with loopzero-images-warn during transition (≥ 7 days dual-signing).
# After the T4.4 cutover, loopzero-images-warn is REMOVED and this becomes the sole
# policy. Identity regex narrow: only signatures from the build ServiceAccount
# are accepted.
clusterImagePolicyKeyless:
  enabled: false   # flip to true to install side-by-side warn-mode (T4.3)
  name: loopzero-images-keyless
  mode: warn       # warn during transition; flip to enforce at cutover
  imageGlobs:
    - "registry.digitalocean.com/loopzero-system/**"
  fulcioURL: https://fulcio.sigstore.dev
  rekorURL: https://rekor.sigstore.dev
  # v1.1 EC-NEW-4 fix — oidcIssuer MUST be set explicitly post-Sigstore
  # activation. Use the BUILD cluster's external OIDC URL (NOT intra-cluster,
  # which breaks cross-cluster verification). Extract via:
  #   kubectl --context=loopzero-build get --raw /.well-known/openid-configuration | jq -r .issuer
  # Empty default + chart fail-fast prevents an accidental render with a stale
  # issuer.
  oidcIssuer: ""
  # v1.1 EC-NEW-11: regex anchored ^...$ scopes strictly to the loopzero-build-sa
  # ServiceAccount. Prevents prefix-match attacks
  # (system:serviceaccount:argo:loopzero-build-sa-malicious would match an
  # unanchored regex).
  identityRegexp: "^system:serviceaccount:argo:loopzero-build-sa$"

# Identities no admission policy may block (templates/_helpers.tpl,
# `loopzero-admission.systemActorExemptions`). The platform's own controllers delete
# and de-finalize the objects these policies guard; denying them deadlocks
# teardown (B33, B-095). Names are ServiceAccounts in loopzero-system. Two operator
# names because the install path differs: `loopzero-tenant-operator` in prod/ArgoCD,
# `tenant-operator` under Tilt. At least two entries are required — rendering
# fails below that (EC-2).
systemActorExemptions:
  platformServiceAccounts:
    - loopzero-api
    - loopzero-tenant-operator
    - tenant-operator
    - loopzero-app-operator
    - loopzero-platform-operator
    - loopzero-preview-operator

# Per-policy toggles. All VAP templates read .Values.vaps.<name> (boolean).
vaps:
  # D4 / plan d4-vap-delete-guardrail — protect boundary resources (Application,
  # AppProject, Tenant, Environment, ClusterCredential) AND their CRDs from unauthorized
  # DELETE. The cascade finalizer means deleting one of these deletes what it manages;
  # under BYOC that reaches a customer account.
  #
  # Default OFF, same reasoning as tenantNamespace below: enabling a DELETE policy with an
  # incomplete exemption map deadlocks namespace teardown (B33). Enabled by the mgmt
  # overlay (values-mgmt.yaml) in Warn until the observation window closes.
  protectPlatformDeletes: false
  # Warn | Deny. Stays Warn until T2.3 proves no legitimate identity is caught.
  protectPlatformDeletesAction: Warn
  # M14 gap #2 — validate the loopzero.io Tenant CR shape at the API-server boundary
  # (CEL VAP, plan ADR D1). Closes the M2 legacy-namespace incident class where
  # a direct kubectl apply created a CR the REST layer would have rejected.
  #
  # This key once existed in only one of two copies of this chart, and the fence
  # rendered zero times in the other while a drift gate that compared file NAMES
  # stayed green (measured 2026-08-12). One chart removes that failure mode.
  #
  # Default OFF: this fence matches `loopzero.io/v1 tenants`, and the CRD that
  # defines them is installed by `loopzero-crds` — on the core cluster and never on a
  # cell. The base values are what the CELL clusters receive, and a policy
  # matching a resource that does not exist there can never fire while reading as
  # coverage. Turned ON in values-mgmt.yaml, where the Tenants live (B-077, ADR
  # 2026-08-13-tenant-cr-fence-placement).
  tenantCrShape: false

  disallowLatestTag: true
  restrictRegistries: true
  requireResourceLimits: true
  protectPlatformNetworkpolicies: true
  argocdManagedBy: true
  requireImageSignature: true
  # ADR-0018 v2 / T3.2 — Tenant + Environment CRs MUST live in `loopzero-system`.
  # Default OFF: toggle on via overlay AFTER the T3.3 migration ran successfully
  # (mandatory deployment order C4 in the MEET-ADR-0018 rollout runbook).
  # Enabling before clearing misplaced CRs causes self-inflicted DoS —
  # status subresource updates rejected → operator stops reconciling.
  tenantNamespace: false
  # CHG-2026-04-30-INFRA-PARITY / T1.2 / ADR D3 — block kubectl set image
  # on LoopZero-managed Deployments. Default OFF: the dev workflow needs to adapt
  # to "rebuild → push :latest → kubectl rollout restart" before enabling.
  # Enable via overlay (prod first, dev last after Phase 1 is stable).
  noRuntimeImageMutations: false
  # When `noRuntimeImageMutations` is on, what action to enforce.
  # Warn  — admit + log
  # Deny  — reject the UPDATE (production)
  noRuntimeImageMutationsAction: Warn
  # Failure policy. Ignore is the safest default — a VAP outage doesn't break
  # rollouts. Switch to Fail once the policy is stable in production.
  noRuntimeImageMutationsFailurePolicy: Ignore
  # T2.3 of maturity-3-62-to-4-0-roadmap: require image@sha256:<digest> for
  # platform pods (loopzero-system, loopzero-system-build, argocd namespaces).
  # Default ON in warn-mode (validationActions=[Warn, Audit]); the sponsor flips
  # requireImageDigestEnforce=true after a 7-day soak to switch to Deny+Audit.
  # Why warn first: legacy charts may still emit :tag refs until the rollout
  # propagates everywhere — warn surfaces the violation without blocking.
  requireImageDigest: true
  requireImageDigestEnforce: false

# PrometheusRule (alerts) toggle.
alerts:
  enabled: true
  namespace: monitoring
  prometheusReleaseLabel: monitoring
  # T1.2 + T1.1 of plan 2026-05-27-tenant-build-pipeline-gaps-closure:
  # 4 Sigstore-specific alerts + 2 PV storage alerts + the TUF-expiry CronJob
  # gated by this flag. Default OFF — the operator flips it once the sigstore
  # stack runs, to avoid alert noise before it is deployed.
  sigstoreEnabled: false

# T1.2.b of plan 2026-05-27-tenant-build-pipeline-gaps-closure:
# TUF ceremony date for the tuf_root_expiry_timestamp emitter CronJob.
# Operator sets it post-ceremony via a helmfile override:
#   helmfile -e prod sync --set tufRootCeremonyDate=2026-06-15T10:00:00Z
# Default empty disables the CronJob (better than emitting garbage).
tufRootCeremonyDate: ""
