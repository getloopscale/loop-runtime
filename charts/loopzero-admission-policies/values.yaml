# loopzero-admission-policies values.yaml
# Aligned with infra/helm/admission-policies (CH-G09 + CH-G11 fix per T1.2 + ADR-0040).

# Domain used to derive Harbor registry hostname.
domain: dev.loopzero.example

# Approved registry prefixes used by ClusterImagePolicy and the
# restrict-registries VAP.
registries:
  docrPrefix: "registry.digitalocean.com/loopzero-system/"
  harborPrefix: "harbor.dev.loopzero.example/loopzero-platform/"
  # Opt-in list of additional registry prefixes accepted by registry-restriction VAP.
  # Default: empty (production only allows DOCR + Harbor). Standalone-multi overlay
  # sets this to ["k3d-loopzero-registry:5000/<tenant>/"] for local builds.
  additionalPrefixes: []

# ClusterImagePolicy — sigstore policy-controller resource (B16, Sprint 6).
# WARNING: policy-controller deny-by-default rejects ALL pods if no
# ClusterImagePolicy matches. This chart MUST be installed before any
# tenant workload starts.
clusterImagePolicy:
  enabled: true
  name: loopzero-images-warn
  # warn  — log audit, admit (Sprint 6 default)
  # enforce — reject unsigned images (Sprint 9 cosign keyless)
  mode: warn
  # static action when no signature can be verified yet
  staticAction: pass
  imageGlobs:
    - "registry.digitalocean.com/loopzero-system/**"
    - "harbor.dev.loopzero.example/loopzero-platform/**"

# INF-G16 + MEET-2026-05-03-063 (MEET-B Track-1) + ADR-0040 (charts SBOM parity).
# loopzero-images-keyless: ClusterImagePolicy with Fulcio keyless authority.
# Coexists with loopzero-images-warn during transition (≥ 7 days dual-signing).
clusterImagePolicyKeyless:
  enabled: false
  name: loopzero-images-keyless
  mode: warn
  imageGlobs:
    - "registry.digitalocean.com/loopzero-system/**"
    - "harbor.dev.loopzero.example/loopzero-platform/**"
  fulcioURL: https://fulcio.sigstore.dev
  rekorURL: https://rekor.sigstore.dev
  # v1.1 EC-NEW-4 fix — see infra/helm/admission-policies/values.yaml for full doc
  oidcIssuer: ""
  # v1.1 EC-NEW-11 — anchored regex
  identityRegexp: "^system:serviceaccount:argo:loopzero-build-sa$"

# VAP toggles. Unified schema — matches infra/helm/admission-policies (bootstrap).
# All VAP templates read from .Values.vaps.<name> (boolean).
vaps:
  disallowLatestTag: true
  restrictRegistries: true
  requireResourceLimits: true
  protectPlatformNetworkpolicies: true
  argocdManagedBy: true
  requireImageSignature: true
  # ADR-0018 v2 / T3.2 — Tenant + Environment CRs MUST live in `loopzero-system`.
  tenantNamespace: false
  # CHG-2026-04-30-INFRA-PARITY / T1.2 / ADR D3 — block kubectl set image
  noRuntimeImageMutations: false
  noRuntimeImageMutationsAction: Warn
  noRuntimeImageMutationsFailurePolicy: Ignore
  # T2.3 of maturity-3-62-to-4-0-roadmap: require image@sha256:<digest> for
  # platform pods (loopzero-system, loopzero-system-build, argocd namespaces).
  # Default ON in warn-mode (validationActions=[Warn, Audit]); sponsor flips
  # requireImageDigestEnforce=true post-7d-soak to switch to Deny+Audit.
  requireImageDigest: true
  requireImageDigestEnforce: false

# PrometheusRule (alerts) toggle.
alerts:
  enabled: true
  namespace: monitoring
  prometheusReleaseLabel: monitoring
  # T1.2 + T1.1 of plan 2026-05-27-tenant-build-pipeline-gaps-closure
  sigstoreEnabled: false

# T1.2.b of plan 2026-05-27-tenant-build-pipeline-gaps-closure
tufRootCeremonyDate: ""

# Default namespace selector for VAPBindings (applies to all except system namespaces).
namespaceSelector:
  matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values: ["kube-system", "kube-public"]
