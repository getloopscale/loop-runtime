# helm-unittest: ClusterImagePolicy rendering for loopzero-admission-policies.
# Plan T1.2 + T1.5 — ClusterImagePolicy was ported from infra/helm.

suite: ClusterImagePolicy rendering
templates:
  - cluster-image-policy.yaml

tests:
  - it: does NOT render when disabled
    set:
      clusterImagePolicy.enabled: false
      clusterImagePolicyKeyless.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders warn-mode by default
    asserts:
      - isKind:
          of: ClusterImagePolicy
      - equal:
          path: spec.mode
          value: warn

  - it: imageGlobs include DOCR registry
    asserts:
      - contains:
          path: spec.images
          content:
            glob: "registry.digitalocean.com/loopzero-system/**"

  - it: imageGlobs name no Harbor registry
    asserts:
      - notContains:
          path: spec.images
          content:
            glob: "harbor.dev.getloopscale.com/loopzero-platform/**"
      - lengthEqual:
          path: spec.images
          count: 1

  - it: keyless variant renders when enabled
    template: cluster-image-policy.yaml
    set:
      clusterImagePolicy.enabled: true
      clusterImagePolicyKeyless.enabled: true
    asserts:
      - hasDocuments:
          count: 2  # warn + keyless
