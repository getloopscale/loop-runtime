apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loopruntime-common.fullname" . }}
  labels:
    {{- include "loopruntime-common.labels" . | nindent 4 }}
data:
  BASE_DOMAIN: {{ .Values.config.baseDomain | quote }}
  ROUTE_PROBE_PUBLIC_DOMAIN: {{ .Values.config.routeProbePublicDomain | quote }}
  OPERATOR_INSECURE_SKIP_TLS: {{ .Values.config.operatorInsecureSkipTls | quote }}
  LOOPRUNTIME_REQUIRE_CELL_0_KUBECONFIG: {{ .Values.config.loopruntimeRequireRuntimeKubeconfig | quote }}
  LOOPRUNTIME_PPROF_ADDR: {{ .Values.config.loopruntimePprofAddr | quote }}
  LOOPRUNTIME_PPROF_ENABLED: {{ .Values.config.loopruntimePprofEnabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterOtlpEndpoint | quote }}
  LOOPRUNTIME_ENV: {{ .Values.config.loopruntimeEnv | quote }}
  LOOPRUNTIME_TRACING_ENABLED: {{ .Values.config.loopruntimeTracingEnabled | quote }}
