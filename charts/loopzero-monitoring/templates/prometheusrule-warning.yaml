{{- if and .Values.prometheusRules.enabled .Values.prometheusRules.warning.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loopzero-warning-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    release: monitoring
spec:
  groups:
    - name: loopzero.warning
      rules:
        - alert: LoopZeroAPIHighLatency
          expr: histogram_quantile(0.99, sum(rate(loopzero_api_request_duration_seconds_bucket[5m])) by (le)) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "API p99 latency exceeds 5s"
            description: "API request latency (p99) has been above 5 seconds for 5 minutes."
            runbook: "Check downstream dependencies (Gitea, Argo, PostgreSQL). Scaling API pods only helps if API itself is the bottleneck."

        - alert: LoopZeroTenantQuotaNearLimit
          expr: loopzero_tenant_quota_usage_ratio > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Tenant {{ "{{" }} $labels.tenant {{ "}}" }} quota usage above 90%"
            description: "Resource quota for tenant {{ "{{" }} $labels.tenant {{ "}}" }} ({{ "{{" }} $labels.resource {{ "}}" }}) has been above 90% for 10 minutes."
            runbook: "Contact tenant to optimize resource usage or discuss plan upgrade."

        - alert: LoopZeroBuildQueueBacklog
          expr: loopzero_build_queue_depth > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Build queue depth exceeds 10"
            description: "More than 10 builds are queued for 5+ minutes. Builds may be delayed."
            runbook: "Check Argo Workflows controller capacity. Consider scaling workflow workers."

        - alert: LoopZeroReconcilerUnhealthy
          expr: increase(loopzero_reconciler_errors_total[5m]) > 5
          labels:
            severity: warning
          annotations:
            summary: "Reconciler has 5+ errors in 5 minutes"
            description: "StateReconciler is producing errors at an elevated rate."
            runbook: "Check reconciler pod logs. Verify connectivity to ArgoCD and Gitea."

        - alert: LoopZeroSecretSyncFailed
          expr: increase(loopzero_secret_sync_hash_mismatch_total[15m]) > 3
          labels:
            severity: warning
          annotations:
            summary: "AppSecretOperator sync failures"
            description: "3+ secret sync hash mismatches in 15 minutes."
            runbook: "AppSecretOperator failed to sync secret to workload namespace 3+ times in 15 min. Check operator logs, workload cluster connectivity, and namespace RBAC."

        - alert: LoopZeroTenantPodsStarved
          expr: histogram_quantile(0.99, loopzero_tenant_pods_pending_duration_seconds) > 300
          labels:
            severity: warning
          annotations:
            summary: "Tenant {{ "{{" }} $labels.tenant {{ "}}" }} pods pending > 5 min"
            description: "Pods for tenant {{ "{{" }} $labels.tenant {{ "}}" }} (plan: {{ "{{" }} $labels.plan {{ "}}" }}) have been pending for more than 5 minutes (p99)."
            runbook: "Check cluster capacity. Higher-priority tenants may be consuming resources. Consider scaling or suggesting plan upgrade."

        - alert: LoopZeroMirrorSyncStale
          expr: loopzero_git_mirror_status{status="FAILED"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Git mirror FAILED for {{ "{{" }} $labels.tenant {{ "}}" }}/{{ "{{" }} $labels.env {{ "}}" }} > 1h"
            description: "Gitea mirror has been in FAILED state for more than 1 hour."
            runbook: "Check Gitea health. If Gitea is up, trigger manual mirror sync via API. If Gitea is down, resolve Gitea first."

        - alert: LoopZeroGitDesiredStateDivergence
          expr: loopzero_git_desired_state_divergence == 1 and on(tenant, env) loopzero_git_mirror_status{status="FAILED"} == 0 and on(tenant, env) loopzero_git_mirror_status{status="PENDING"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Git desired state divergence in {{ "{{" }} $labels.tenant {{ "}}" }}/{{ "{{" }} $labels.env {{ "}}" }}"
            description: "Git SHA does not match environment_targets desired release AND no mirror sync is in progress or retrying."
            runbook: "Git SHA does not match environment_targets desired release AND no mirror sync is in progress or retrying. This indicates unauthorized Git push or data corruption. Check Git audit log and environment_targets table."

        - alert: LoopZeroArgoCDAppCountWarning
          expr: count(argocd_app_info) > 200
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD managing 200+ applications"
            description: "ArgoCD application count exceeds 200. Performance degradation may begin."
            runbook: "Monitor ArgoCD reconciliation latency. Consider controller sharding if latency increases."

        - alert: LoopZeroArgoCDAppCountCritical
          expr: count(argocd_app_info) > 400
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ArgoCD managing 400+ applications — critical threshold"
            description: "ArgoCD application count exceeds 400. Reconciliation degradation likely."
            runbook: "Implement application controller sharding (--application-namespaces). Scale controller resources."

        - alert: LoopZeroArgoCDSyncSlow
          expr: histogram_quantile(0.95, sum(rate(argocd_app_reconcile_duration_seconds_bucket[5m])) by (le)) > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD sync duration p95 exceeds 30s"
            description: "ArgoCD application reconciliation is taking longer than 30 seconds (p95)."
            runbook: "Check ArgoCD controller resources and application count. May indicate capacity issues."

        - alert: LoopZeroOrphanBuild
          expr: loopzero_releasing_builds > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $value {{ "}}" }} build(s) stuck in RELEASING state for 5+ minutes"
            description: "Builds in RELEASING state indicate a failed release activation that the reconcile loop is not recovering."
            runbook: "Check API logs for release activation errors. Verify ArgoCD connectivity. The build reconcile loop should retry automatically on next tick."

        - alert: LoopZeroReleasesPendingStuck
          expr: loopzero_releases_pending > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $value {{ "}}" }} release(s) stuck in PENDING for 10+ minutes"
            description: "Releases should converge within 5 minutes. Check ArgoCD sync status and convergence loop health."
            runbook: "Check ArgoCD Application health. Verify convergence loop is running (loopzero_reconcile_loop_last_success_timestamp). Check if TriggerSync failed."

        - alert: LoopZeroReconcileLoopStale
          expr: time() - loopzero_reconcile_loop_last_success_timestamp{loop="build"} > 120
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Build reconcile loop stale (no successful tick in 2 minutes)"
            description: "The build reconcile loop may have crashed or be stuck. Check API pod logs."
            runbook: "Check API pod health and logs. Restart API pod if loop is stuck."

        - alert: LoopZeroMinIODown
          expr: up{job=~".*minio.*"} == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "MinIO is down"
            description: "MinIO has been unreachable for more than 2 minutes. Build cache unavailable. Source uploads will fail."
            runbook: "Check MinIO pod status. Verify PVC. Builds will run without cache (slower but not blocked)."

        - alert: LoopZeroServiceAuthSecretExpiring
          expr: loopzero_service_auth_secret_age_seconds > 6912000
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Service auth secret approaching 90-day rotation deadline"
            description: "Service auth secret has been in use for {{ "{{" }} $value | humanizeDuration {{ "}}" }}. Rotate within 10 days."

        - alert: LoopZeroBuildStuckRunning
          expr: (time() - loopzero_build_started_timestamp) > 2100 and loopzero_build_status == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Build stuck in RUNNING state > 35 minutes"
            description: "A build has been in RUNNING state for more than 35 minutes (beyond the 30m reaper timeout). The reaper may have failed to catch it."
            runbook: "Check build_reaper logs. Verify started_at is populated in the builds table. If stuck, manually fail: UPDATE builds SET status='FAILED' WHERE id='<build_id>'."

        - alert: LoopZeroArgoCDHealthStuck
          expr: argocd_app_info{health_status="Progressing"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD Application {{ "{{" }} $labels.name {{ "}}" }} stuck in Progressing > 10min"
            description: "ArgoCD Application {{ "{{" }} $labels.name {{ "}}" }} has been in Progressing health state for more than 10 minutes. This may block deploy notifications for the entire tenant."
            runbook: "Check for orphaned resources in the Application. Common cause: IngressRoute referencing non-existent Service (static frontend without nginx proxy). Remove orphaned resources or configure ArgoCD health check exclusion."

    - name: loopzero.workload.warning
      rules:
        - alert: LoopZeroAppCrashLoop
          expr: |
            max by (namespace, pod) (
              kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}
            ) * on(namespace) group_left()
            kube_namespace_labels{label_loopzero_io_managed_by="environment-controller"}
            > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "App pod {{ "{{" }} $labels.pod {{ "}}" }} in {{ "{{" }} $labels.namespace {{ "}}" }} stuck in CrashLoopBackOff"
            description: "Pod has been crash-looping for 5+ minutes. Resources consumed without serving traffic."
            runbook: "Check app logs via `loopzero logs`. If image is broken, rollback via `loopzero rollback`."

        - alert: LoopZeroAppImagePullFailed
          expr: |
            max by (namespace, pod) (
              kube_pod_container_status_waiting_reason{reason="ImagePullBackOff"}
              or
              kube_pod_container_status_waiting_reason{reason="ErrImagePull"}
            ) * on(namespace) group_left()
            kube_namespace_labels{label_loopzero_io_managed_by="environment-controller"}
            > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "App pod {{ "{{" }} $labels.pod {{ "}}" }} in {{ "{{" }} $labels.namespace {{ "}}" }} cannot pull image"
            description: "Image pull failing for 5+ minutes. Possible causes: wrong image tag, registry auth, network."
            runbook: "Verify image exists in registry. Check registry credentials. Redeploy with correct image."

        - alert: LoopZeroAppReplicaMismatch
          expr: |
            (
              kube_deployment_spec_replicas
              - kube_deployment_status_replicas_ready
            ) * on(namespace) group_left()
            kube_namespace_labels{label_loopzero_io_managed_by="environment-controller"}
            > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ "{{" }} $labels.deployment {{ "}}" }} in {{ "{{" }} $labels.namespace {{ "}}" }} has unavailable replicas"
            description: "Desired replicas != ready replicas for 5+ minutes. App may be partially down."
            runbook: "Check pod status. Common causes: resource pressure, crash loop, image issues."

        - alert: LoopZeroAppHighRestartRate
          expr: |
            increase(
              kube_pod_container_status_restarts_total[30m]
            ) * on(namespace) group_left()
            kube_namespace_labels{label_loopzero_io_managed_by="environment-controller"}
            > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "App pod {{ "{{" }} $labels.pod {{ "}}" }} in {{ "{{" }} $labels.namespace {{ "}}" }} restarting excessively"
            description: "Pod has restarted 10+ times in 30 minutes. Likely unstable or misconfigured."
            runbook: "Check app logs. Consider rollback if latest deploy caused the instability."

        - alert: LoopZeroAppDeployStuck
          expr: |
            kube_deployment_status_condition{condition="Progressing",status="false"}
            * on(namespace) group_left()
            kube_namespace_labels{label_loopzero_io_managed_by="environment-controller"}
            > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ "{{" }} $labels.deployment {{ "}}" }} in {{ "{{" }} $labels.namespace {{ "}}" }} failed to progress"
            description: "Deployment hit progressDeadlineSeconds (210s). New pods could not become ready."
            runbook: "Check pod events and logs. Likely causes: image crash, failing health check, insufficient resources. Use `loopzero rollback` to revert."

    - name: loopzero.workload.critical
      rules:
        - alert: LoopZeroAppCrashLoopCritical
          expr: |
            max by (namespace, pod) (
              kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}
            ) * on(namespace) group_left()
            kube_namespace_labels{label_loopzero_io_managed_by="environment-controller"}
            > 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "App pod {{ "{{" }} $labels.pod {{ "}}" }} in {{ "{{" }} $labels.namespace {{ "}}" }} crash-looping for 30+ minutes"
            description: "Pod has been crash-looping for 30+ minutes. Actively consuming cluster resources with zero value. May affect other tenants."
            runbook: "Immediate action required. Contact tenant owner. If unreachable, consider rollback via API. This pod is wasting cluster resources."

    - name: loopzero.slos
      rules:
        - alert: LoopZeroQueueSlow
          expr: histogram_quantile(0.95, sum(rate(loopzero_build_duration_seconds_bucket{status="succeeded"}[1h])) by (le)) > 300
          for: 10m
          labels:
            severity: warning
            slo: "true"
          annotations:
            summary: "Build duration p95 exceeds 5min SLO"
            description: "Build duration (p95) has been above 300s for 10 minutes. SLO target: <300s."

        - alert: LoopZeroDeployFailureRate
          expr: (sum(rate(loopzero_builds_total{status="failed"}[24h])) / sum(rate(loopzero_builds_total[24h]))) > 0.1
          for: 30m
          labels:
            severity: warning
            slo: "true"
          annotations:
            summary: "Deploy failure rate exceeds 10% (24h rolling)"
            description: "Deploy success rate dropped below 90% over the last 24 hours. SLO target: >90%."

        - alert: LoopZeroLockContention
          expr: histogram_quantile(0.95, sum(rate(loopzero_lock_hold_duration_seconds_bucket[5m])) by (le)) > 2
          for: 5m
          labels:
            severity: warning
            slo: "true"
          annotations:
            summary: "Lock hold duration p95 exceeds 2s SLO"
            description: "Environment lock hold time (p95) above 2s for 5 minutes. SLO target: <2s."

        - alert: LoopZeroSyncSlow
          expr: histogram_quantile(0.95, sum(rate(loopzero_deploy_duration_seconds_bucket[1h])) by (le)) > 600
          for: 10m
          labels:
            severity: warning
            slo: "true"
          annotations:
            summary: "End-to-end deploy duration p95 exceeds 10min"
            description: "Full deploy cycle (build + sync) p95 above 600s for 10 minutes. SLO target: <600s."

        - alert: LoopZeroBuildQueueSlow
          expr: loopzero_build_queue_depth > 5
          for: 5m
          labels:
            severity: warning
            slo: "true"
          annotations:
            summary: "Build queue depth exceeds 5"
            description: "More than 5 builds waiting in QUEUED state for over 5 minutes."

        - alert: LoopZeroTraefikHighErrorRate
          expr: sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) / sum(rate(traefik_service_requests_total[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Traefik 5xx error rate > 5%"
            description: "Traefik is returning 5xx errors on more than 5% of requests for 5+ minutes."
            runbook: "Check backend service health. Review Traefik access logs. Check IngressRoute configuration for misrouted paths."

        - alert: LoopZeroBuildTenantSaturated
          expr: increase(loopzero_build_tenant_backpressure_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Tenant hitting build concurrency limit"
            description: "Tenant {{ "{{" }} $labels.tenant {{ "}}" }} has builds deferred due to per-tenant concurrency limit for 5+ minutes."
            runbook: "This means the tenant is submitting builds faster than they complete. Check if builds are stuck. Consider increasing MAX_BUILDS_PER_TENANT if the tenant has a legitimate burst workload."

        - alert: LoopZeroCFKVDriftDetected
          expr: loopzero_cfkv_drift_detected == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Cloudflare KV state diverges from database"
            description: "KV routing table has entries that don't match the expected state from the database for 10+ minutes."
            runbook: "Check API leader pod logs for 'kv reconciler: drift detected'. Missing entries mean static apps aren't routable. Extra entries mean stale routes still serving old content. Manual fix: re-deploy affected static apps or clean stale KV entries via CF dashboard."

        - alert: LoopZeroDBPoolSaturation
          expr: (loopzero_postgres_connections_active / loopzero_postgres_pool_max_conns) > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL connection pool >80% utilized"
            description: "{{ "{{" }} $value | humanizePercentage {{ "}}" }} of pool connections are active for 5+ minutes. Approaching exhaustion."
            runbook: "Check loopzero_postgres_pool_acquire_duration_seconds for increased wait times. If sustained, increase DB_MAX_CONNS or investigate slow queries via pg_stat_statements."

        - alert: LoopZeroDBPoolAcquireLatency
          expr: histogram_quantile(0.95, rate(loopzero_postgres_pool_acquire_duration_seconds_bucket[5m])) > 0.1
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL pool acquire p95 >100ms"
            description: "Connection pool acquire latency p95 is {{ "{{" }} $value | humanizeDuration {{ "}}" }}. Clients are waiting for connections."
            runbook: "Check loopzero_postgres_pool_empty_acquire_total for saturation events. Increase DB_MAX_CONNS or add read replica for read-heavy queries."
{{- end }}
