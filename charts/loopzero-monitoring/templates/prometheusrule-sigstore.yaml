{{- if and .Values.prometheusRules.enabled .Values.prometheusRules.sigstore.enabled }}
# T4.2 of plan 2026-05-28-meet-001-engineering-closure-plan.md.
# CR-8 SRE: SLO + error-rate alerts for cosign sign / attest and
# Rekor URL persistence. Toggle via values.prometheusRules.sigstore.
# Mirrors infra/helm/monitoring/manifests/prometheusrule-sigstore.yaml
# in the bootstrap chart system (CLAUDE.md § Helm Chart Dual System).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loopzero-sigstore-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    release: monitoring
    loopzero.io/domain: sigstore
    loopzero.io/plan: 2026-05-28-meet-001-engineering-closure
spec:
  groups:
    - name: loopzero.sigstore
      rules:
        - alert: LoopZeroCosignSignSlow
          expr: |
            histogram_quantile(
              0.99,
              rate(loopzero_cosign_sign_duration_seconds_bucket[10m])
            ) > 60
          for: 10m
          labels:
            severity: critical
            domain: sigstore
            loopzero.io/plan: 2026-05-28-meet-001-engineering-closure
          annotations:
            summary: "Cosign sign P99 latency > 60s"
            description: "Cosign sign step P99 latency exceeded 60s over the last 10m. Investigate Fulcio cert-issue or Rekor-record subcalls."
            runbook: "https://docs.loopzero.example/runbooks/alerts/LoopZeroCosignSignSlow"

        - alert: LoopZeroCosignSignErrorRate
          expr: |
            (
              sum(rate(loopzero_cosign_sign_errors_total[5m]))
              /
              clamp_min(sum(rate(loopzero_cosign_sign_total[5m])), 0.01)
            ) > 0.01
          for: 10m
          labels:
            severity: critical
            domain: sigstore
            loopzero.io/plan: 2026-05-28-meet-001-engineering-closure
          annotations:
            summary: "Cosign sign error rate > 1%"
            description: "Cosign sign error rate exceeded 1% over 10m. Group by `component` (fulcio|rekor|ctlog) to root-cause via loopzero_cosign_sign_errors_total."
            runbook: "https://docs.loopzero.example/runbooks/alerts/LoopZeroCosignSignErrorRate"

        - alert: LoopZeroReleaseAttestationRekorURLNullRate
          expr: |
            (
              rate(loopzero_release_attestation_rekor_url_null_total{result="null"}[5m])
              /
              clamp_min(
                rate(loopzero_release_attestation_rekor_url_null_total{result="null"}[5m])
                + rate(loopzero_release_attestation_rekor_url_null_total{result="populated"}[5m]),
                0.01
              )
            ) > 0.01
          for: 10m
          labels:
            severity: critical
            domain: sigstore
            loopzero.io/plan: 2026-05-28-meet-001-engineering-closure
          annotations:
            summary: "Release attestation Rekor-URL null rate > 1%"
            description: "More than 1% of releases over 10m landed with null image_attestation_rekor_url. Inspect attest step output extraction (cosign_attest.go) + release_store.go enrichment path."
            runbook: "https://docs.loopzero.example/runbooks/alerts/LoopZeroReleaseAttestationRekorURLNullRate"
{{- end }}
