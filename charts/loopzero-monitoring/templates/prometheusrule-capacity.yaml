{{- if and .Values.prometheusRules.enabled .Values.prometheusRules.capacity.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: capacity-loopzero-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    app: loopzero
    role: alert-rules
    prometheus: kube-prometheus
    release: monitoring
    loopzero.io/task: T-07
spec:
  groups:
    - name: loopzero.capacity
      interval: 1m
      rules:
        - alert: GiteaAuthLatencyHigh
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(gitea_http_request_duration_seconds_bucket[5m]))
            ) > 2
          for: 5m
          labels:
            severity: warning
            component: gitea
            task: T-07
          annotations:
            summary: "Gitea p95 auth latency > 2s"
            description: |
              Gitea is returning auth responses slower than 2s at p95.
              This was the leading indicator of bug #44 (c=30 saturation).
              Expected: HPA scales up gitea replicas. If HPA at max,
              either bump maxReplicas or investigate DB/Redis backend.
              Runbook: docs/runbooks/alerts/gitea-auth-latency-high.md

        - alert: ArgoWorkflowQuotaExceeded
          expr: |
            sum(rate(argo_workflows_k8s_request_total{status_code="403"}[5m])) > 0.1
          for: 10m
          labels:
            severity: warning
            component: argo-workflows
            task: T-07
          annotations:
            summary: "Argo Workflows hitting 403 (quota or RBAC) > 0.1/s"
            description: |
              Argo controller receiving sustained 403s. Usually means
              ResourceQuota is exceeded for workflow pods (see bug #41:
              'exceeded quota: argo-workflow-quota').
              Check: kubectl describe resourcequota argo-workflow-quota -n argo

        - alert: HPAAtMaxReplicas
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas
              == on(namespace, horizontalpodautoscaler)
            kube_horizontalpodautoscaler_spec_max_replicas
          for: 5m
          labels:
            severity: warning
            component: autoscaling
            task: T-07
          annotations:
            summary: "HPA {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.horizontalpodautoscaler {{ "}}" }} at max for 5m"
            description: |
              HPA is at maxReplicas and hasn't scaled down. Consider:
              1. Bump maxReplicas (if actual load >= current)
              2. Investigate downstream saturation (pod CPU limit too low)
              3. Profile — maybe a request pattern is pathological

        - alert: PVCPendingSustained
          expr: |
            kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
          for: 2m
          labels:
            severity: warning
            component: storage
            task: T-07
          annotations:
            summary: "PVC {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }} pending 2m+"
            description: |
              PVC is pending for >2min. Historic root causes:
              - DO CSI API 429 rate limit at concurrency > 15 (bug #40)
              - DO block storage serial provisioning (~3/min) (bug #18)
              Check: kubectl describe pvc {{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }} -n {{ "{{" }} $labels.namespace {{ "}}" }}

        - alert: TenantReconcileBacklog
          expr: |
            workqueue_depth{
              name=~"tenant|environment|application|exposure"
            } > 50
          for: 5m
          labels:
            severity: warning
            component: operators
            task: T-07
          annotations:
            summary: "Controller {{ "{{" }} $labels.name {{ "}}" }} queue depth {{ "{{" }} $value {{ "}}" }} > 50"
            description: |
              Operator reconciliation is backing up. Likely:
              - Single-replica controller overwhelmed
              - Downstream API (Gitea, ArgoCD) slow to respond
              - New tenant burst bigger than operator can absorb
              If chronic: implement controller sharding (gap #3).

        - alert: BuildFailureRateHigh
          expr: |
            (
              sum(rate(loopzero_builds_total{status="FAILED"}[5m]))
              /
              sum(rate(loopzero_builds_total[5m]))
            ) > 0.10
          for: 5m
          labels:
            severity: critical
            component: build-pipeline
            task: T-07
          annotations:
            summary: "Build failure rate > 10% for 5m"
            description: |
              >10% of recent builds failing. Check the most-recent
              failed workflow's failing step to identify root cause.
              Common failure modes:
              - cosign sign-image (bug #39): TUF permission
              - mirror-harbor 401: registry auth
              - restore-cache timeout: MinIO saturation
              - CELL_AT_CAPACITY: admission backpressure (not a bug)
{{- end }}
