{{- if and .Values.prometheusRules.enabled .Values.prometheusRules.domains.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loopzero-domain-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    release: monitoring
spec:
  groups:
    - name: loopzero.domains
      rules:
        - alert: LoopZeroDomainTLSExpiringSoon
          expr: loopzero_domain_tls_expiry_days < 14
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Custom domain TLS certificate expiring soon"
            description: "TLS certificate for {{ "{{" }} $labels.domain {{ "}}" }} (tenant {{ "{{" }} $labels.tenant {{ "}}" }}) expires in {{ "{{" }} $value {{ "}}" }} days."
            runbook: "cert-manager should auto-renew. If not, check cert-manager logs and Certificate CR status. The domain CNAME must still resolve for HTTP-01 challenge."

        - alert: LoopZeroDomainVerificationStale
          expr: loopzero_custom_domains_total{status="pending_verification"} > 0
          for: 48h
          labels:
            severity: info
          annotations:
            summary: "Custom domains pending verification for 48h+"
            description: "Tenant {{ "{{" }} $labels.tenant {{ "}}" }} has {{ "{{" }} $value {{ "}}" }} domain(s) pending DNS verification for over 48 hours."
            runbook: "Domains pending > 7 days are auto-cleaned by DomainHealthChecker. No action needed unless tenant reports issues."

        - alert: LoopZeroDomainProvisioningStuck
          expr: loopzero_custom_domains_total{status="provisioning"} > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Custom domain stuck in provisioning"
            description: "Tenant {{ "{{" }} $labels.tenant {{ "}}" }} has {{ "{{" }} $value {{ "}}" }} domain(s) in provisioning state for over 1 hour."
            runbook: "Check DomainProvisioner logs. Verify ArgoCD sync is working. Check cert-manager for pending Certificate CRs. If HTTP-01 challenge fails, verify CNAME resolves through CF Tunnel."

        - alert: LoopZeroDomainCNAMELost
          expr: increase(loopzero_domain_cname_check_failures_total[24h]) > 0
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "Custom domain CNAME check failing"
            description: "Tenant {{ "{{" }} $labels.tenant {{ "}}" }} has domain(s) with CNAME check failures in the last 24 hours."
            runbook: "DomainHealthChecker weekly CNAME re-verification failed. After 14 days (2 consecutive failures), the domain degrades to failed and IngressRoute is removed. Contact tenant if pattern persists."

        - alert: LoopZeroDomainHealthCheckerDown
          expr: increase(loopzero_domain_health_checker_errors_total[30m]) > 5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Domain health checker producing errors"
            description: "Domain health checker has 5+ errors in {{ "{{" }} $labels.check {{ "}}" }} check in the last 30 minutes."
            runbook: "Check API leader pod logs for DomainHealthChecker errors. Verify database connectivity."

    - name: loopzero.certificates
      rules:
        - alert: LoopZeroCertificateIssuanceFailed
          expr: certmanager_certificate_ready_status == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "TLS certificate issuance failed"
            description: "Certificate {{ "{{" }} $labels.name {{ "}}" }} in namespace {{ "{{" }} $labels.namespace {{ "}}" }} has not been issued for 10+ minutes."
            runbook: "Check cert-manager logs and the Certificate CR status. For HTTP-01: verify CNAME resolves through CF Tunnel. For DNS-01: verify Cloudflare API token. Run: kubectl describe certificate {{ "{{" }} $labels.name {{ "}}" }} -n {{ "{{" }} $labels.namespace {{ "}}" }}"

        - alert: LoopZeroCertificateExpiryUrgent
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 7 * 24 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "TLS certificate expires in less than 7 days"
            description: "Certificate {{ "{{" }} $labels.name {{ "}}" }} in namespace {{ "{{" }} $labels.namespace {{ "}}" }} expires in {{ "{{" }} $value | humanizeDuration {{ "}}" }}."
            runbook: "cert-manager should auto-renew 30 days before expiry. If this fires, renewal is broken. Check cert-manager logs, ClusterIssuer status, and DNS reachability. Escalate immediately."
{{- end }}
