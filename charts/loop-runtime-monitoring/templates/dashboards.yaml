{{- if .Values.dashboards.enabled }}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "loop-console-dashboard-%s" (base $path | trimSuffix ".json") | trunc 63 }}
  labels:
    grafana_dashboard: "1"
data:
  {{ base $path }}: |-
    {{ $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
