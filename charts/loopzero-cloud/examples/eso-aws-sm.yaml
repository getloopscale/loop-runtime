# loopzero-cloud secrets via External Secrets Operator → AWS Secrets Manager
# (install-config-contract Slice 1, ADR D2). Auth via IRSA — NO static AWS keys.
#
# Prereq: ESO installed + the ESO service account annotated with an IAM role (IRSA) that has
#         secretsmanager:GetSecretValue on the loopzero/cloud/* secrets.
# Apply:  kubectl apply -f eso-aws-sm.yaml
# Then:   helm install loopzero-cloud … --set existingSecret=loopzero-cloud-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: loopzero-cloud-aws-sm
spec:
  provider:
    aws:
      service: SecretsManager
      region: "!!changeme-region!!"     # e.g. us-east-1
      auth:
        # IRSA: the ESO controller's ServiceAccount carries the IAM role via OIDC.
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loopzero-cloud-secrets
  namespace: loopzero-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: loopzero-cloud-aws-sm
    kind: ClusterSecretStore
  target:
    name: loopzero-cloud-secrets        # MUST equal the chart's existingSecret value
    creationPolicy: Owner
  data:
    # Each AWS secret stored as a JSON document at key "loopzero/cloud" with these properties,
    # OR use separate secret names — adjust remoteRef.key per your layout.
    - secretKey: STRIPE_API_KEY
      remoteRef: { key: "loopzero/cloud", property: "stripe_api_key" }
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef: { key: "loopzero/cloud", property: "stripe_webhook_secret" }
    - secretKey: SESSION_TOKEN_SECRET
      remoteRef: { key: "loopzero/cloud", property: "session_token_secret" }
    - secretKey: LOOPZERO_SERVICE_AUTH_SECRET
      remoteRef: { key: "loopzero/cloud", property: "service_auth_secret" }
    - secretKey: THEMORY_API_KEY
      remoteRef: { key: "loopzero/cloud", property: "themory_api_key" }
