# loopzero-cloud secrets via External Secrets Operator → OpenBao / HashiCorp Vault
# (install-config-contract Slice 1, ADR D2 — ESO is the recommended convenience, not required).
#
# Prereq: ESO installed in the cluster + an OpenBao/Vault reachable with a kv-v2 mount.
# Apply:  kubectl apply -f eso-openbao.yaml
# Then:   helm install loopzero-cloud … --set existingSecret=loopzero-cloud-secrets
#
# This materializes the K8s Secret `loopzero-cloud-secrets` (the value you pass to existingSecret)
# from your OpenBao paths. Secrets never touch git — only the path mapping does.
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: loopzero-cloud-openbao
spec:
  provider:
    vault:
      server: "https://!!changeme-openbao-host!!:8200"
      path: "secret"          # kv-v2 mount point
      version: "v2"
      auth:
        # AppRole auth (role_id + secret_id in a K8s Secret). Kubernetes auth also works.
        appRole:
          path: "approle"
          roleId: "!!changeme-role-id!!"
          secretRef:
            name: openbao-approle      # K8s Secret holding the secret_id
            namespace: external-secrets
            key: secret_id
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loopzero-cloud-secrets
  namespace: loopzero-system        # the namespace where loopzero-cloud runs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: loopzero-cloud-openbao
    kind: ClusterSecretStore
  target:
    name: loopzero-cloud-secrets    # MUST equal the chart's existingSecret value
    creationPolicy: Owner
  data:
    - secretKey: STRIPE_API_KEY
      remoteRef: { key: "loopzero/cloud", property: "stripe_api_key" }
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef: { key: "loopzero/cloud", property: "stripe_webhook_secret" }
    - secretKey: SESSION_TOKEN_SECRET
      remoteRef: { key: "loopzero/cloud", property: "session_token_secret" }
    - secretKey: LOOPZERO_SERVICE_AUTH_SECRET
      remoteRef: { key: "loopzero/cloud", property: "service_auth_secret" }
    - secretKey: THEMORY_API_KEY
      remoteRef: { key: "loopzero/cloud", property: "themory_api_key" }
