# Values the Helmfile L2 bootstrap installs this chart with, on the core cluster
# (release loopzero-cloud, infra/helmfile/core.helmfile.yaml.gotmpl). Per-environment
# differences layer on top from infra/helmfile/values/<env>/loopzero-cloud.yaml.gotmpl.
#
# There used to be a second chart for this install, infra/helm/loopzero-cloud. It was
# deleted when the pair became one chart (docs/decisions.md, "One chart per
# bootstrap/published pair"); this file is what that chart did, expressed through
# this chart's typed values. Where the two differed on purpose, the difference is
# written next to the value.

# The image is published to GHCR by the build-publish workflow (`:develop` and
# `:develop-<sha>` on develop, the release tag on main); the Deployment renders
# <global.registry>/<image.repository>:<image.tag>.
global:
  registry: ghcr.io/getloopscale

image:
  repository: loopzero-cloud
  # Issue #232 — an immutable SENTINEL, not `latest` and not a pinned version. The
  # default is only reached when an override was forgotten, so it must fail loudly
  # (ImagePullBackOff naming SET-BY-CI) rather than ship whatever `latest` is today.
  tag: "SET-BY-CI"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull

# One replica on the bootstrap path, so no PodDisruptionBudget renders.
replicaCount: 1

# Kept on the pods so every existing `-l app=loopzero-cloud` selector (taskfiles,
# live tests, scripts) keeps matching. The Deployment and Service select on the
# app.kubernetes.io labels.
podLabels:
  app: loopzero-cloud

# Topology ConfigMap written by infra/helmfile/scripts/create-wiring-configmap.sh.
wiringConfigMap: loopzero-platform-topology

# Ory lives in loopzero-auth on this path; the chart defaults name `ory`.
config:
  kratosPublicUrl: "http://ory-kratos-public.loopzero-auth.svc.cluster.local:80"
  kratosAdminUrl: "http://ory-kratos-admin.loopzero-auth.svc.cluster.local:80"
  hydraPublicUrl: "http://ory-hydra-public.loopzero-auth.svc.cluster.local:4444"
  hydraAdminUrl: "http://ory-hydra-admin.loopzero-auth.svc.cluster.local:4445"

secrets:
  additionalSources:
    - name: loopzero-db-credentials
      optional: true
      reason: >-
        Written by infra/helmfile/scripts/generate-secrets.sh after the chart can be
        installed. Only its `cloud-uri` key is read (see keyRefs); mounting it whole is what
        the bootstrap chart did, and nothing here depends on the other keys.
  keyRefs:
    - name: DATABASE_URL
      secretName: loopzero-db-credentials
      # The non-owner `loopzero_cloud` role (#438): the control plane refuses to serve as
      # the owner, which holds DDL and an unnamed cross-tenant privilege.
      key: cloud-uri
      optional: true
      reason: >-
        The database credentials Secret is created by the bootstrap chain after
        helmfile sync; until then the cloud API starts without a database and its
        health reports it, which is the self-recovery the release's `wait: false`
        relies on.
    - name: LOOPZERO_SERVICE_AUTH_ED25519_PRIVATE_KEY
      secretName: loopzero-service-auth-ed25519
      key: private
      optional: true
      reason: >-
        Ed25519 dual-control private key (ADR 2026-05-13), materialised by ESO. Absent,
        the binary logs a warning and runs single-control (X-Service-Auth only); Phase 2
        requires it, and a missing key then fails startup closed.
    - name: RAG_PLATFORM_ADMIN_KEY
      secretName: loopzero-rag-admin-key
      key: RAG_PLATFORM_ADMIN_KEY
      optional: true
      reason: >-
        Written by ESO where rag.externalSecretEnabled is on, or minted by
        `loopzero-ops seed data-plane-admin-keys` where it is not (dev-public); without it the RAG dashboard broker cannot mint tenant keys and its
        surface stays off.
    - name: LENS_PLATFORM_ADMIN_KEY
      secretName: loopzero-lens-admin-key
      key: LENS_PLATFORM_ADMIN_KEY
      optional: true
      reason: >-
        Written by ESO where lens.externalSecretEnabled is on, or minted by
        `loopzero-ops seed data-plane-admin-keys` where it is not (dev-public); without it the lens dashboard broker cannot mint tenant keys and its
        surface stays off.

billing:
  apiKeysSecret: loopzero-stripe-api-keys

# The bootstrap path never ran a NetworkPolicy for loopzero-cloud. The published default
# admits ingress from the traefik namespace only, which would cut the host edge that
# reaches the pod through the dev-public NodePort, and egress to an `ory` namespace
# that does not exist here. Turning it on is a separate change with its own LIVE test.
networkPolicy:
  enabled: false

# Cloudflare-managed TLS at the edge, so no Certificate. The host was never
# parameterised by environment on this path, and is not here either.
ingressRoute:
  enabled: true
  host: app.dev.loopzero.example
  certIssuer: CFManaged
