apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loopzero-common.fullname" . }}
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
  {{- if .Values.reloader.enabled }}
  annotations:
    # install-config-contract Slice 2 (ADR D1): rotation-aware restart on Secret change.
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 3 }}
  selector:
    matchLabels:
      {{- include "loopzero-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "loopzero-common.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "loopzero-common.priorityClassName" . | nindent 6 }}
      serviceAccountName: {{ include "loopzero-common.serviceAccountName" . }}
      automountServiceAccountToken: {{ include "loopzero-common.automountServiceAccountToken" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "loopzero-common.podSecurityContext" . | nindent 8 }}
      {{- include "loopzero-common.affinity" . | nindent 6 }}
      {{- include "loopzero-common.topologySpreadConstraints" . | nindent 6 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cloud
          image: {{ include "loopzero-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "loopzero-common.fullname" . }}
            - secretRef:
                name: {{ include "loopzero-common.fullname" . }}-admin
            # T1.1 of plan 2026-05-29-dashboard-public-integration-canonicalization.
            # Shared with loopzero-api — single source of truth for X-Service-Auth.
            - secretRef:
                name: loopzero-service-auth
                optional: true
            # P4-T4.2 of same plan. cloud/internal/billing/webhook.go fail-closed.
            - secretRef:
                name: loopzero-stripe-webhook
                optional: true
            {{- if .Values.existingSecret }}
            # install-config-contract Slice 1 (ADR D1): operator-provided Secret supplies
            # the app's referenced secrets (Stripe API key, session token, themory key, ...).
            # Backend-agnostic — populated via ESO / CSI / sops / kubectl (see SECRETS.md).
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "loopzero-common.startupProbe" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "loopzero-common.containerSecurityContext" . | nindent 12 }}
