apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loopzero-common.fullname" . }}
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
data:
  CLOUD_LISTEN_ADDR: {{ .Values.config.listenAddr | quote }}
  KRATOS_PUBLIC_URL: {{ .Values.config.kratosPublicUrl | quote }}
  HYDRA_PUBLIC_URL: {{ .Values.config.hydraPublicUrl | quote }}
  HYDRA_CLIENT_ID: {{ .Values.config.hydraClientId | quote }}
  # KRATOS_ADMIN_URL / HYDRA_ADMIN_URL live in the Secret (find_infra_007).
  ENGINE_API_URL: {{ .Values.config.engineApiUrl | quote }}
  LOOPZERO_ENV: {{ .Values.config.loopzeroEnv | quote }}
  # Plan J-09 T1.1 (2026-06-05) — GitHub App install handshake.
  GITHUB_APP_SLUG: {{ .Values.config.githubAppSlug | quote }}
  APP_PUBLIC_URL: {{ .Values.config.appPublicUrl | quote }}
  AUTH_COOKIE_DOMAIN: {{ .Values.config.authCookieDomain | quote }}
  {{- with .Values.config.kratosInternalUrl }}
  KRATOS_INTERNAL_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.jwtIssuer }}
  JWT_ISSUER: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.billingReturnUrl }}
  BILLING_RETURN_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.ragBaseUrl }}
  RAG_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.lensBaseUrl }}
  LENS_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.traefikMcpBaseUrl }}
  TRAEFIK_MCP_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.prometheusUrl }}
  LOOPZERO_PROMETHEUS_URL: {{ . | quote }}
  {{- end }}
