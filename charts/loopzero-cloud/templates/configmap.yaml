apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loopzero-common.fullname" . }}
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
data:
  CLOUD_LISTEN_ADDR: {{ .Values.config.listenAddr | quote }}
  KRATOS_PUBLIC_URL: {{ .Values.config.kratosPublicUrl | quote }}
  HYDRA_PUBLIC_URL: {{ .Values.config.hydraPublicUrl | quote }}
  HYDRA_CLIENT_ID: {{ .Values.config.hydraClientId | quote }}
  # KRATOS_ADMIN_URL / HYDRA_ADMIN_URL live in the Secret (find_infra_007).
  ENGINE_API_URL: {{ .Values.config.engineApiUrl | quote }}
  LOOPZERO_ENV: {{ .Values.config.loopzeroEnv | quote }}
