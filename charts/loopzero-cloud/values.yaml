global:
  registry: registry.digitalocean.com/loopzero-system
  imagePullSecrets: []

image:
  repository: loopzero-cloud
  tag: dev
  pullPolicy: IfNotPresent

replicaCount: 1
revisionHistoryLimit: 3
priorityClassName: system-cluster-critical

nameOverride: ""
fullnameOverride: ""

podLabels: {}
podAnnotations: {}

service:
  type: ClusterIP
  port: 13002

config:
  listenAddr: ":13002"
  kratosPublicUrl: "http://ory-kratos-public.ory.svc.cluster.local:80"
  kratosAdminUrl: "http://ory-kratos-admin.ory.svc.cluster.local:80"
  hydraPublicUrl: "http://ory-hydra-public.ory.svc.cluster.local:4444"
  hydraAdminUrl: "http://ory-hydra-admin.ory.svc.cluster.local:4445"
  hydraClientId: "loopzero-cli"
  engineApiUrl: "http://loopzero-api.loopzero-system.svc.cluster.local:3001"
  loopzeroEnv: "dev"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 128Mi

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

startupProbe:
  enabled: true
  path: /health
  port: http
  failureThreshold: 30
  periodSeconds: 2

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 3

metrics:
  serviceMonitor:
    enabled: false
    port: metrics
    interval: 30s
    scrapeTimeout: 10s

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 13002
  extraEgress:
    # Ory Kratos + Hydra
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 4444
        - protocol: TCP
          port: 4445
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ory
    # LoopZero API
    - ports:
        - protocol: TCP
          port: 3001

topologySpreadConstraints:
  enabled: false

affinity:
  podAntiAffinity:
    enabled: false

tolerations: []
nodeSelector: {}
