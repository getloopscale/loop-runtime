global:
  registry: registry.digitalocean.com/loopzero-system
  imagePullSecrets: []

image:
  repository: loopzero-cloud
  tag: dev
  pullPolicy: IfNotPresent

# HA for the auth control plane (find_infra_011): a single pod means an
# eviction during node maintenance takes consent/session flows offline.
# Safe with the shared LOOPZERO_SERVICE_AUTH_SECRET requirement (T1.6) — both
# replicas validate dashboard-proxied requests identically. replicaCount > 1
# also activates the PDB template (pdb.yaml minAvailable: 1).
replicaCount: 2
revisionHistoryLimit: 3
priorityClassName: system-cluster-critical

nameOverride: ""
fullnameOverride: ""

podLabels: {}
podAnnotations: {}

service:
  type: ClusterIP
  port: 13002

config:
  listenAddr: ":13002"
  kratosPublicUrl: "http://ory-kratos-public.ory.svc.cluster.local:80"
  kratosAdminUrl: "http://ory-kratos-admin.ory.svc.cluster.local:80"
  hydraPublicUrl: "http://ory-hydra-public.ory.svc.cluster.local:4444"
  hydraAdminUrl: "http://ory-hydra-admin.ory.svc.cluster.local:4445"
  hydraClientId: "loopzero-cli"
  engineApiUrl: "http://loopzero-api.loopzero-system.svc.cluster.local:3001"
  loopzeroEnv: "dev"
  # Plan J-09 T1.1 (2026-06-05) — GitHub App install handshake.
  # Operator overrides per env. The cloud binary reads them via
  # cloud/internal/config/config.go.
  githubAppSlug: "loopzero-platform"
  appPublicUrl: "http://localhost:3000"
  authCookieDomain: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 128Mi

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

startupProbe:
  enabled: true
  path: /health
  port: http
  failureThreshold: 30
  periodSeconds: 2

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 3

metrics:
  serviceMonitor:
    enabled: false
    port: metrics
    interval: 30s
    scrapeTimeout: 10s

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 13002
  extraEgress:
    # Ory Kratos + Hydra
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 4444
        - protocol: TCP
          port: 4445
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ory
    # LoopZero API
    - ports:
        - protocol: TCP
          port: 3001

topologySpreadConstraints:
  enabled: false

affinity:
  podAntiAffinity:
    enabled: false

tolerations: []
nodeSelector: {}
