global:
  registry: registry.digitalocean.com/loopzero-system
  imagePullSecrets: []

image:
  repository: loopzero-cloud
  tag: dev
  pullPolicy: IfNotPresent

# install-config-contract Slice 1 (ADR D1 — anti-lock-in secret floor).
# Name of a pre-existing K8s Secret supplying the cloud-API's referenced secrets
# (STRIPE_API_KEY, SESSION_TOKEN_SECRET, THEMORY_API_KEY, ...). When set, the chart
# adds it as an envFrom secretRef. The operator populates it however they choose —
# ESO (see examples/eso-*.yaml), CSI, sops, kubectl — so the secret backend is never
# locked in. Empty = legacy behavior (secrets injected by the per-env overlay/seed).
# See SECRETS.md.
existingSecret: ""

# Cross-capability wiring ConfigMap (loopzero-cloud#249) mounted via envFrom. Supplies
# data-plane base URLs (e.g. THEMORY_BASE_URL) resolved per-environment. Empty by
# default; set to a ConfigMap name (e.g. "loopzero-platform-topology") to front memory.
wiringConfigMap: ""

# install-config-contract Slice 2 (ADR D1 — day-2 rotation-aware, opt-in).
# When true (and the Stakater Reloader controller is installed in the cluster),
# the Deployment gets reloader.stakater.com/auto so a rotated secret (re-synced
# by ESO into the referenced Secret) triggers a rolling restart — the cloud-API
# reads config only at boot. Operator-installed (recommended-not-required); OFF
# by default so the render is unchanged for clusters without Reloader.
reloader:
  enabled: false

# HA for the auth control plane (find_infra_011): a single pod means an
# eviction during node maintenance takes consent/session flows offline.
# Safe with the shared LOOPZERO_SERVICE_AUTH_SECRET requirement (T1.6) — both
# replicas validate dashboard-proxied requests identically. replicaCount > 1
# also activates the PDB template (pdb.yaml minAvailable: 1).
replicaCount: 2
revisionHistoryLimit: 3
priorityClassName: system-cluster-critical

nameOverride: ""
fullnameOverride: ""

podLabels: {}
podAnnotations: {}

service:
  type: ClusterIP
  port: 13002

config:
  listenAddr: ":13002"
  kratosPublicUrl: "http://ory-kratos-public.ory.svc.cluster.local:80"
  kratosAdminUrl: "http://ory-kratos-admin.ory.svc.cluster.local:80"
  hydraPublicUrl: "http://ory-hydra-public.ory.svc.cluster.local:4444"
  hydraAdminUrl: "http://ory-hydra-admin.ory.svc.cluster.local:4445"
  hydraClientId: "loopzero-cli"
  engineApiUrl: "http://loopzero-api.loopzero-system.svc.cluster.local:3001"
  loopzeroEnv: "dev"
  # Plan J-09 T1.1 (2026-06-05) — GitHub App install handshake.
  # Operator overrides per env. The cloud binary reads them via
  # cloud/internal/config/config.go.
  githubAppSlug: "loopzero-platform"
  appPublicUrl: "http://localhost:3000"
  authCookieDomain: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 128Mi

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

startupProbe:
  enabled: true
  path: /health
  port: http
  failureThreshold: 30
  periodSeconds: 2

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 3

metrics:
  serviceMonitor:
    enabled: false
    # The Service exposes one named port, `http`, and /metrics is served on it —
    # a ServiceMonitor naming `metrics` would select no endpoint.
    port: http
    interval: 30s
    scrapeTimeout: 10s

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 13002
  extraEgress:
    # Ory Kratos + Hydra
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 4444
        - protocol: TCP
          port: 4445
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ory
    # LoopZero API
    - ports:
        - protocol: TCP
          port: 3001

topologySpreadConstraints:
  enabled: false

affinity:
  podAntiAffinity:
    enabled: false

tolerations: []
nodeSelector: {}

# billing.required declara que ESTE ambiente cobra de verdade.
#
# Medido em 2026-08-11: o painel rodou 20h sem os Secrets de cobrança, `Running`, sem um
# único evento — porque a opcionalidade era um literal `true`, igual em todo ambiente. Um
# literal não pode divergir; um valor pode, e é essa divergência que separa o hermético
# (que roda sem Stripe de propósito) do público (que mostra plano e preço na tela).
#
# Falso por padrão: preserva o caminho de boot sem Stripe. O ambiente que promete cobrar
# liga isto explicitamente — declarar é o ato consciente, não o esquecimento.
billing:
  required: false
