apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loopzero-common.fullname" . }}
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
data:
  BASE_DOMAIN: {{ .Values.config.baseDomain | quote }}
  GITEA_URL: {{ .Values.config.giteaUrl | quote }}
  GITEA_CROSS_CLUSTER_URL: {{ .Values.config.giteaCrossClusterUrl | quote }}
  ARGOCD_URL: {{ .Values.config.argocdUrl | quote }}
  MINIO_ENDPOINT: {{ .Values.config.minioEndpoint | quote }}
  MINIO_CROSS_CLUSTER_ENDPOINT: {{ .Values.config.minioCrossClusterEndpoint | quote }}
  REGISTRY_URL: {{ .Values.config.registryUrl | quote }}
  REGISTRY_INSECURE: {{ .Values.config.registryInsecure | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOOPZERO_USE_PG_CLAIMS: {{ .Values.config.usePgClaims | quote }}
  ARGO_NAMESPACE: {{ .Values.config.argoNamespace | quote }}
  ARGOCD_NAMESPACE: {{ .Values.config.argocdNamespace | quote }}
  WORKLOAD_INGRESS_URL: {{ .Values.config.workloadIngressUrl | quote }}
  # CHG-2026-04-25-E2E (Gap 1+9): keys required by api/internal/config/config.go
  # but missing from chart template. Without these, controller pod crashloops
  # with "LOOPZERO_CLUSTER_ISSUER is required" or accepts wrong defaults silently.
  LOOPZERO_CLUSTER_ISSUER: {{ .Values.config.clusterIssuer | quote }}
  ARGOCD_INSECURE: {{ .Values.config.argocdInsecure | default "false" | quote }}
  JWKS_URL: {{ .Values.config.jwksUrl | default "" | quote }}
  JWT_ISSUER: {{ .Values.config.jwtIssuer | default "" | quote }}
  LOOPZERO_DISABLE_LEGACY_LOOPS: {{ .Values.config.disableLegacyLoops | default "false" | quote }}
  LOOPZERO_ADMISSION_CONTROL: {{ .Values.config.admissionControl | default "false" | quote }}
  MAX_CONCURRENT_BUILDS_PER_CELL: {{ .Values.config.maxConcurrentBuildsPerCell | default "100" | quote }}
  MAX_TENANTS_PER_CELL: {{ .Values.config.maxTenantsPerCell | default "1000" | quote }}
  MAX_CONCURRENT_BUILDS_PER_TENANT: {{ .Values.config.maxConcurrentBuildsPerTenant | default "10" | quote }}
