apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loopzero-common.fullname" . }}
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
data:
  BASE_DOMAIN: {{ .Values.config.baseDomain | quote }}
  GITEA_URL: {{ .Values.config.giteaUrl | quote }}
  GITEA_CROSS_CLUSTER_URL: {{ .Values.config.giteaCrossClusterUrl | quote }}
  ARGOCD_URL: {{ .Values.config.argocdUrl | quote }}
  MINIO_ENDPOINT: {{ .Values.config.minioEndpoint | quote }}
  MINIO_CROSS_CLUSTER_ENDPOINT: {{ .Values.config.minioCrossClusterEndpoint | quote }}
  REGISTRY_URL: {{ .Values.config.registryUrl | quote }}
  REGISTRY_INSECURE: {{ .Values.config.registryInsecure | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOOPZERO_USE_PG_CLAIMS: {{ .Values.config.usePgClaims | quote }}
  ARGO_NAMESPACE: {{ .Values.config.argoNamespace | quote }}
  ARGOCD_NAMESPACE: {{ .Values.config.argocdNamespace | quote }}
  WORKLOAD_INGRESS_URL: {{ .Values.config.workloadIngressUrl | quote }}
