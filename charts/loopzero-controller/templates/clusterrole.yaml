{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "loopzero-common.fullname" . }}
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
rules:
  # Tenant CRs: read-only for status checks during reconciliation loops.
  - apiGroups: ["loopzero.io"]
    resources: ["tenants", "tenants/status"]
    verbs: ["get", "list", "watch"]
  # ClusterCredentials: read-only for DynamicRouter / cell discovery.
  - apiGroups: ["loopzero.io"]
    resources: ["clustercredentials"]
    verbs: ["get", "list", "watch"]
{{- end }}
