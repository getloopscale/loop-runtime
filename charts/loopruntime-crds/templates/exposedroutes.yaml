{{- if .Values.crds.exposedroutes.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: exposedroutes.runtime.getloopscale.com
  labels:
    {{- include "loopruntime-common.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    controller-gen.kubebuilder.io/version: {{ .Values.controllerGenVersion | default "v0.17.2" }}
spec:
  group: runtime.getloopscale.com
  names:
    kind: ExposedRoute
    listKind: ExposedRouteList
    plural: exposedroutes
    singular: exposedroute
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.hostname
      name: Hostname
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          ExposedRoute is the Schema for the exposedroutes API.
          An ExposedRoute represents DNS/TLS exposure for a LoopRuntimeApplication,
          managing certificate status and reachability probes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ExposedRouteSpec defines the desired state of an ExposedRoute.
            properties:
              applicationRef:
                description: ApplicationRef is the name of the parent LoopRuntimeApplication
                  CR.
                minLength: 1
                type: string
              hostname:
                description: Hostname is the external hostname for this route.
                minLength: 1
                type: string
              serviceRef:
                description: ServiceRef references the backing Kubernetes Service.
                properties:
                  name:
                    description: Name is the Service name.
                    minLength: 1
                    type: string
                  port:
                    default: 80
                    description: Port is the Service port.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                required:
                - name
                - port
                type: object
              tls:
                description: TLS configures TLS termination for this route.
                properties:
                  enabled:
                    description: Enabled indicates whether TLS is enabled.
                    type: boolean
                  issuerRef:
                    description: IssuerRef is the cert-manager issuer name.
                    type: string
                type: object
            required:
            - applicationRef
            - hostname
            - serviceRef
            type: object
          status:
            description: ExposedRouteStatus defines the observed state of an ExposedRoute.
            properties:
              certificateReady:
                description: CertificateReady indicates whether the TLS certificate
                  is ready.
                type: boolean
              conditions:
                description: Conditions represent the latest available observations
                  of the route's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              consecutiveFailures:
                description: ConsecutiveFailures tracks the number of consecutive
                  failed probes.
                format: int32
                type: integer
              lastProbeResult:
                description: LastProbeResult is the HTTP status code of the last probe
                  (0 if no probe yet).
                format: int32
                type: integer
              lastProbeTime:
                description: LastProbeTime is the time of the last reachability probe.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: Phase represents the overall route lifecycle phase.
                enum:
                - Pending
                - CertIssued
                - Reachable
                - Failed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
