{{- if .Values.crds.clustercredentials.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clustercredentials.runtime.getloopscale.com
  labels:
    {{- include "loopruntime-common.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    controller-gen.kubebuilder.io/version: {{ .Values.controllerGenVersion | default "v0.17.2" }}
spec:
  group: runtime.getloopscale.com
  names:
    kind: ClusterCredential
    listKind: ClusterCredentialList
    plural: clustercredentials
    singular: clustercredential
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterName
      name: Cluster
      type: string
    - jsonPath: .status.connected
      name: Connected
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterCredential is the Schema for the clustercredentials API.
          It manages workload cluster kubeconfigs and distributes minimum-scope
          credentials to ArgoCD. See spec section 7.3.3.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterCredentialSpec defines the desired state of a ClusterCredential.
            properties:
              apiServer:
                description: |-
                  APIServer is the URL of the target cluster's API server.
                  Must be a valid HTTPS URL (e.g., "https://cluster.example.com:6443").
                minLength: 1
                pattern: ^https?://
                type: string
              cellID:
                default: cell-0
                description: |-
                  CellID identifies which Cell this cluster belongs to.
                  Used by CellRouter to discover available Cells and their kubeconfigs.
                  ADR-0008 Phase 1.
                minLength: 1
                pattern: ^cell-[a-z0-9-]+$
                type: string
              clusterName:
                description: ClusterName is the name of the target cluster.
                minLength: 1
                type: string
              scope:
                description: Scope defines what components are allowed to use these
                  credentials.
                properties:
                  argocd:
                    description: ArgoCD indicates whether ArgoCD should receive these
                      credentials.
                    type: boolean
                  operators:
                    description: Operators indicates whether operators should receive
                      these credentials.
                    type: boolean
                required:
                - argocd
                - operators
                type: object
              secretRef:
                description: SecretRef references the Kubernetes Secret containing
                  the kubeconfig.
                properties:
                  name:
                    description: Name is the name of the source Secret.
                    type: string
                  namespace:
                    description: Namespace is the namespace of the source Secret.
                    type: string
                required:
                - name
                - namespace
                type: object
              tls:
                description: TLS configures TLS verification for the target cluster
                  API server.
                properties:
                  insecure:
                    default: false
                    description: |-
                      Insecure disables TLS certificate verification for the ArgoCD cluster secret.
                      Only enable for development clusters with self-signed certificates.
                    type: boolean
                type: object
            required:
            - apiServer
            - clusterName
            - scope
            - secretRef
            type: object
          status:
            description: ClusterCredentialStatus defines the observed state of a ClusterCredential.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              connected:
                default: false
                description: |-
                  Connected indicates whether the target cluster is reachable.

                  For a plain bool, absent and false are the SAME value — requiring it bought
                  no distinction (that would need *bool), while it made every partial write
                  invalid: a merge patch omits a field equal in base and object, and applying
                  such a patch to an object whose status was never written produces a status
                  without `connected`, which the apiserver rejects. Measured against envtest
                  while converting this controller to the merge-patch contract (B-085).

                  The default is what keeps the `Connected` printcolumn from going blank, and
                  the first version of this change got that wrong. Dropping `required` alone
                  is not enough: a merge patch sends the DIFF, not the marshalled status, so
                  `connected` is omitted whenever it did not change — and an object whose
                  status was never written then stores no key at all. Measured against a real
                  apiserver, `kubectl get` printed an empty cell for every ClusterCredential
                  that had not yet connected. The default makes the server materialise the
                  field on write, so the column reads false again.

                  Decision: MEET-ASYNC-AMENDMENT-2026-08-13-clustercredential-connected-optional
                type: boolean
              lastCheckedAt:
                description: LastCheckedAt is the last time connectivity was verified.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the controller.
                  MEET-053 D-03: Enables consumers to check "has the controller processed my latest spec change?"
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
