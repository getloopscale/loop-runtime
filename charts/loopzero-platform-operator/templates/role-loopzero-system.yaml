{{- if .Values.rbac.create }}
# Namespace-scoped Role for the operator in the loopzero-system namespace.
# Grants ONLY `delete` on the platform-tokens Secret — the one Secret
# the platformbootstrap_controller actually deletes. Combined with the
# cluster-wide rule that removed `delete` from secrets, this narrows
# the operator's destructive Secret authority to exactly one named
# resource in one namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "loopzero-common.fullname" . }}-secrets-loopzero-system
  namespace: loopzero-system
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["platform-tokens"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "loopzero-common.fullname" . }}-secrets-loopzero-system
  namespace: loopzero-system
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "loopzero-common.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "loopzero-common.fullname" . }}-secrets-loopzero-system
{{- end }}
