{{- if .Values.workflow.serviceAccount.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loopruntime-build-sa
  namespace: argo
  labels:
    app.kubernetes.io/part-of: loopruntime-platform
    app.kubernetes.io/component: build
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loopruntime-build-sa
  namespace: argo
  labels:
    app.kubernetes.io/part-of: loopruntime-platform
    app.kubernetes.io/component: build
subjects:
  - kind: ServiceAccount
    name: {{ .Values.workflow.serviceAccount.name | default "loopruntime-build-sa" }}
    namespace: argo
roleRef:
  kind: Role
  name: loopruntime-build-sa
  apiGroup: rbac.authorization.k8s.io
---
# Workflow submitter — allows API to create workflows in this namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loopruntime-workflow-submitter
  labels:
    app.kubernetes.io/part-of: loopruntime-platform
    app.kubernetes.io/component: build
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates", "clusterworkflowtemplates"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # CHG-2026-04-25-E2E: Argo workflow executor (argoexec sidecar) writes
  # task results back to the WorkflowTaskResult CR. Without this rule,
  # every step ends with `wait: Error (exit code 64):
  # workflowtaskresults.argoproj.io is forbidden`. Required by Argo
  # Workflows v3.5+ executor pattern.
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults", "workflowtasksets"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loopruntime-workflow-submitter
  labels:
    app.kubernetes.io/part-of: loopruntime-platform
    app.kubernetes.io/component: build
subjects:
  - kind: ServiceAccount
    name: {{ .Values.workflow.serviceAccount.name | default "loopruntime-build-sa" }}
    namespace: argo
roleRef:
  kind: ClusterRole
  name: loopruntime-workflow-submitter
  apiGroup: rbac.authorization.k8s.io
{{- end }}
