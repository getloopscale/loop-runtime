apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loopzero-common.fullname" . }}
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 3 }}
  selector:
    matchLabels:
      {{- include "loopzero-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "loopzero-common.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # A changed __config.js or csp-origins.conf rolls the pods.
        {{- include "loopzero-common.checksumAnnotationsConfigOnly" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      serviceAccountName: {{ include "loopzero-common.serviceAccountName" . }}
      automountServiceAccountToken: {{ include "loopzero-common.automountServiceAccountToken" . }}
      {{- with (include "loopzero-common.imagePullSecrets" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- include "loopzero-common.podSecurityContext" . | nindent 8 }}
      {{- include "loopzero-common.affinity" . | nindent 6 }}
      {{- include "loopzero-common.topologySpreadConstraints" . | nindent 6 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: {{ include "loopzero-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if .Values.config.viteApiUrl }}
          env:
            - name: VITE_API_URL
              value: {{ .Values.config.viteApiUrl | quote }}
            {{- if .Values.config.viteCloudUrl }}
            - name: VITE_CLOUD_URL
              value: {{ .Values.config.viteCloudUrl | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            # readOnlyRootFilesystem: false — nginx needs to write to /tmp and /var/cache
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            # CHG-2026-04-25-E2E (Gap 7): __config.js MUST be mounted from a
            # ConfigMap, not an emptyDir. With emptyDir + subPath, containerd
            # fails with "not a directory" on mount because the source
            # emptyDir has no file at path __config.js. The previous design
            # likely assumed an initContainer would write the file, but no
            # such initContainer exists. Switching to a ConfigMap volume
            # provides the file content at chart install time.
            - name: html-config
              mountPath: /usr/share/nginx/html/__config.js
              subPath: __config.js
              readOnly: true
            # The origins the Content-Security-Policy allows besides 'self'.
            - name: html-config
              mountPath: /etc/nginx/conf.d/csp-origins.conf
              subPath: csp-origins.conf
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: html-config
          configMap:
            name: {{ include "loopzero-common.fullname" . }}-config
            items:
              - key: __config.js
                path: __config.js
              - key: csp-origins.conf
                path: csp-origins.conf
