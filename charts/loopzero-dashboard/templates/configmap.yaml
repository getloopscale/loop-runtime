# CHG-2026-04-25-E2E (Gap 7): runtime config for the dashboard SPA.
#
# The static frontend is served by nginx and reads __config.js at page load
# to learn where the API/cloud endpoints live. This file MUST be present at
# /usr/share/nginx/html/__config.js or the SPA can't bootstrap.
#
# We render the file at chart install time from values, so cluster operators
# can configure URLs via Helm values (loopzero-dashboard.config.viteApiUrl, etc).
#
# Mounted by deployment.yaml as a ConfigMap volume (NOT emptyDir).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loopzero-common.fullname" . }}-config
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
data:
  __config.js: |
    // Runtime config for loopzero-dashboard. Generated by Helm at install time.
    // Do not edit in-cluster: changes will be overwritten on next chart upgrade.
    window.__LOOPZERO_CONFIG__ = {
      apiUrl: {{ .Values.config.viteApiUrl | default "" | quote }},
      cloudUrl: {{ .Values.config.viteCloudUrl | default "" | quote }},
      baseDomain: {{ .Values.config.baseDomain | default "" | quote }},
    };
  # The origins the image's Content-Security-Policy adds to 'self' (getloopscale/console
  # nginx-security-headers.conf), mounted at /etc/nginx/conf.d/csp-origins.conf.
  # Origins are space-separated URLs, validated by values.schema.json.
  csp-origins.conf: |
    map "" $csp_connect_origins { default {{ join " " (.Values.config.cspConnectOrigins | default list) | quote }}; }
    map "" $csp_form_origins { default {{ join " " (.Values.config.cspFormOrigins | default list) | quote }}; }
