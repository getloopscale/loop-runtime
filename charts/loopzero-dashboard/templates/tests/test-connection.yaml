apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "loopzero-common.fullname" . }}-test-connection"
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: curl
      # Fixado por digest, nao por tag: uma tag e mutavel no registro, e o proximo
      # `helm test` puxaria conteudo diferente sob o mesmo nome. Aqui fixar nao
      # envelhece — a versao de terceiro ja estava presa (8.7.1), entao o digest
      # tambem nao se move. Resolvido com `docker buildx imagetools inspect` em
      # 2026-08-17 (B-119).
      image: curlimages/curl@sha256:25d29daeb9b14b89e2fa8cc17c70e4b188bca1466086907c2d9a4b56b59d8e21
      command:
        - sh
        - -c
        - |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --timeout 10 \
            "http://{{ include "loopzero-common.fullname" . }}:{{ .Values.service.port }}/")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "FAIL: / returned $HTTP_CODE (expected 200)"
            exit 1
          fi
          echo "PASS: dashboard responded 200"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
  restartPolicy: Never
  automountServiceAccountToken: false
