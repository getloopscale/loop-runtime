global:
  registry: registry.digitalocean.com/loopzero-system
  imagePullSecrets: []

image:
  repository: loopzero-dashboard
  tag: dev
  pullPolicy: IfNotPresent

replicaCount: 1
revisionHistoryLimit: 3

# Dashboard is not critical path — no priorityClassName by default
priorityClassName: ""

nameOverride: ""
fullnameOverride: ""

podLabels: {}
podAnnotations: {}

service:
  type: ClusterIP
  port: 8080

config:
  # VITE_* env vars injected at runtime via docker-entrypoint.sh
  viteApiUrl: ""
  viteCloudUrl: ""
  # CHG-2026-04-25-E2E (Gap 7): rendered into __config.js ConfigMap and
  # mounted at /usr/share/nginx/html/__config.js. SPA reads it at page load.
  baseDomain: ""
  # The origins the image's Content-Security-Policy allows besides 'self', rendered into
  # csp-origins.conf: connect-src (the Kratos public host the auth flows read, the
  # control plane's) and form-action (the Kratos public host the forms post to).
  cspConnectOrigins: []
  cspFormOrigins: []

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

# No startupProbe — static assets serve instantly
startupProbe:
  enabled: false

metrics:
  serviceMonitor:
    enabled: false

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
  # Zero egress — static assets, no backend calls from pods
  extraEgress: []

topologySpreadConstraints:
  enabled: false

affinity:
  podAntiAffinity:
    enabled: false

tolerations: []
nodeSelector: {}
