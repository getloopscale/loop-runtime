{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "loopzero-common.serviceAccountName" . }}
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
automountServiceAccountToken: {{ include "loopzero-common.automountServiceAccountToken" . }}
{{- end }}
