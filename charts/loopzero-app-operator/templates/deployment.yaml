apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loopzero-common.fullname" . }}
  labels:
    {{- include "loopzero-common.labels" . | nindent 4 }}
  {{- if .Values.reloader.enabled }}
  annotations:
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 3 }}
  selector:
    matchLabels:
      {{- include "loopzero-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "loopzero-common.checksumAnnotationsConfigOnly" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "loopzero-common.selectorLabels" . | nindent 8 }}
        loopzero.io/component: control-plane
        app.kubernetes.io/component: loopzero-operator
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "loopzero-common.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken | default true }}
      securityContext:
        {{- include "loopzero-common.podSecurityContext" . | nindent 8 }}
      {{- include "loopzero-common.priorityClassName" . | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "loopzero-common.affinity" . | nindent 6 }}
      {{- include "loopzero-common.topologySpreadConstraints" . | nindent 6 }}
      containers:
        - name: controller
          image: {{ include "loopzero-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--leader-elect={{ .Values.args.leaderElect }}"
            - "--health-probe-bind-address={{ .Values.args.healthProbeBindAddress }}"
            - "--metrics-bind-address={{ .Values.args.metricsBindAddress }}"
          securityContext:
            {{- include "loopzero-common.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 8443
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "loopzero-common.fullname" . }}
          {{- if .Values.cell0KubeconfigMount.enabled }}
          # T1.4a of deep-review-remediation-plan (closes find_arch_002 / find_arch_007 partial):
          # mount the cell-aware Secret + set CELL_0_KUBECONFIG env so the
          # operator binary can resolve per-cell runtime clients via
          # CellAwareRuntimeClientFactory.
          #
          # When .Values.cell0KubeconfigMount.requireRunning is true (set
          # post-rollout), the operator main flips LOOPZERO_REQUIRE_CELL_0_KUBECONFIG
          # which fail-fasts on missing/broken kubeconfig (per ADR D3).
          env:
            - name: CELL_0_KUBECONFIG
              value: {{ .Values.cell0KubeconfigMount.path | default "/etc/loopzero/runtime/kubeconfig" }}
            - name: CELL_0_KUBE_CONTEXT
              value: {{ .Values.cell0KubeconfigMount.context | default "in-cluster" }}
            {{- if .Values.cell0KubeconfigMount.requireRunning }}
            - name: LOOPZERO_REQUIRE_CELL_0_KUBECONFIG
              value: "true"
            {{- end }}
          {{- end }}
          {{- include "loopzero-common.startupProbe" . | nindent 10 }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.cell0KubeconfigMount.enabled }}
            - name: cell-0-kubeconfig
              mountPath: {{ .Values.cell0KubeconfigMount.dir | default "/etc/loopzero/runtime" }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.cell0KubeconfigMount.enabled }}
        - name: cell-0-kubeconfig
          secret:
            secretName: {{ .Values.cell0KubeconfigMount.secretName | default "loopzero-cluster-kubeconfigs" }}
            items:
              - key: {{ .Values.cell0KubeconfigMount.secretKey | default "cell-0.kubeconfig" }}
                path: kubeconfig
        {{- end }}
