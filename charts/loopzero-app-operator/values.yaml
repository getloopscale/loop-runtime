global:
  registry: registry.digitalocean.com/loopzero-system
  imagePullSecrets: []

image:
  repository: loopzero-app-operator
  tag: dev
  pullPolicy: IfNotPresent

replicaCount: 2
revisionHistoryLimit: 3
priorityClassName: system-cluster-critical

nameOverride: ""
fullnameOverride: ""

podLabels: {}
podAnnotations: {}

service:
  type: ClusterIP
  healthPort: 8081
  metricsPort: 8443

# Operator configuration (environment variables via ConfigMap)
config:
  baseDomain: ""
  operatorInsecureSkipTls: "false"
  loopzeroRequireRuntimeKubeconfig: "false"
  loopzeroPprofAddr: ""
  loopzeroPprofEnabled: "false"
  otelExporterOtlpEndpoint: ""
  loopzeroEnv: "production"
  loopzeroTracingEnabled: "false"

args:
  leaderElect: true
  healthProbeBindAddress: ":8081"
  metricsBindAddress: ":8443"

reloader:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

serviceAccount:
  create: true
  # FIXED on purpose, against the Helm convention of deriving the name from the release
  # (B-096, B-047). Two literal allowlists name this identity as a string, and neither
  # moves when the release name does:
  #   - the admission policies' system-actor exemption, at
  #     charts/loopzero-admission-policies/values.yaml (systemActorExemptions.platformServiceAccounts)
  #   - OpenBao's boundServiceAccountNames, on mount k8s-core, in
  #     infra/helm/openbao-init/values.yaml
  # With name: "" this chart rendered <release>-loopzero-app-operator, so an install under any release
  # name other than the chart name put the operator outside both lists — and that failure
  # appears as Forbidden during reconciliation, never as a failed install, which is why
  # B-096 survived review.
  # Widening the allowlist to a pattern was considered and rejected; the reason is
  # recorded once, at charts/loopzero-api/values.yaml:202 — it turns a release name into a
  # credential.
  name: "loopzero-app-operator"
  automountServiceAccountToken: true

rbac:
  create: true
  # Cutover escape hatch, OFF by default. The operator reads Secrets only in
  # loopzero-system, granted by a namespaced Role (templates/role-secret-access.yaml),
  # and its manager caches Secrets in that namespace alone. An operator image
  # built before that scoping lists Secrets in every namespace and fails
  # without a cluster-wide grant; set this to true only while such an image
  # runs against this chart, and back to false once it is replaced. It adds
  # cluster-wide Secret READ to the ClusterRole — never write, never ConfigMaps.
  legacyClusterWideSecrets: false

startupProbe:
  enabled: true
  path: /healthz
  port: health
  failureThreshold: 30
  periodSeconds: 2

livenessProbe:
  httpGet:
    path: /healthz
    port: health
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /readyz
    port: health
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3

metrics:
  serviceMonitor:
    enabled: false
    port: metrics
    interval: 30s
    scrapeTimeout: 10s

networkPolicy:
  enabled: true
  ingress:
    # Prometheus scraping metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8443
  extraEgress:
    # Kubernetes API server.
    # Bug #24 LIVE fix (2026-05-17 iter 17): DOKS exposes K8s API on port
    # 443 (ClusterIP 10.245.0.1:443), NOT 6443. Local k3d uses 6443.
    # Allow BOTH so this chart works on k3d, DOKS, EKS, GKE uniformly.
    - ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 443

topologySpreadConstraints:
  enabled: false

affinity: {}

tolerations: []
nodeSelector: {}

# T1.4a of deep-review-remediation-plan (closes find_arch_002 / find_arch_007
# partial): cell-aware runtime client factory needs CELL_0_KUBECONFIG mounted
# from the cluster Secret. Default disabled — production cells set this to
# true once the loopzero-cluster-kubeconfigs Secret is available, then bump
# requireRunning=true to enforce fail-fast (ADR D3).
cell0KubeconfigMount:
  # Flipped on 2026-08-09. It had been `false` since T1.4a of the deep-review-remediation-plan,
  # which left the mount default-off for a gradual rollout — and the flip never happened.
  #
  # While it was off, `appFactory` stayed nil and `reconcileWorkloadStatus`
  # returned on its first line WITH NO LOG (application_controller.go). The workload status
  # was never read, and every LoopZeroApplication stayed in Progressing forever: measured over
  # 26 days on app-dev, with the pods Running. The app-operator was the only one of the four
  # without the runtime kubeconfig — precisely the one that reads the pod state there. Issue #274.
  enabled: true
  # Path inside the container where the kubeconfig file appears.
  path: /etc/loopzero/runtime/kubeconfig
  # Mount directory (must contain the file at $path basename).
  dir: /etc/loopzero/runtime
  # Secret name in the same namespace as the operator. Generated by
  # provision-api-tokens.sh (B34 fix) — keep aligned.
  secretName: loopzero-cluster-kubeconfigs
  # Secret key inside the Secret. F-2 of dogfood-2026-05-08-fixes aligned
  # this to "in-cluster" — context name MUST match CELL_0_KUBE_CONTEXT.
  secretKey: cell-0.kubeconfig
  # In-cluster context name. Drift between F-11 and B34 caused F-2 silent
  # ESO skip; canonical value is "in-cluster".
  context: in-cluster
  # When true, sets LOOPZERO_REQUIRE_CELL_0_KUBECONFIG=true so operator main
  # exits non-zero if the kubeconfig is missing or factory creation fails.
  # FLIP THIS ONLY AFTER the Secret mount is verified in the target cell
  # (per EC-4 of edge-case review — premature flip CrashLoopBackOffs).
  requireRunning: false
