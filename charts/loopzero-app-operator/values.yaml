global:
  registry: registry.digitalocean.com/loopzero-system
  imagePullSecrets: []

image:
  repository: loopzero-app-operator
  tag: dev
  pullPolicy: IfNotPresent

replicaCount: 2
revisionHistoryLimit: 3
priorityClassName: system-cluster-critical

nameOverride: ""
fullnameOverride: ""

podLabels: {}
podAnnotations: {}

service:
  type: ClusterIP
  healthPort: 8081
  metricsPort: 8443

# Operator configuration (environment variables via ConfigMap)
config:
  baseDomain: ""
  operatorInsecureSkipTls: "false"
  loopzeroRequireRuntimeKubeconfig: "false"
  loopzeroReaperGracePeriodSeconds: "300"
  loopzeroPprofAddr: ""
  loopzeroPprofEnabled: "false"
  otelExporterOtlpEndpoint: ""
  loopzeroEnv: "production"
  loopzeroTracingEnabled: "false"

args:
  leaderElect: true
  healthProbeBindAddress: ":8081"
  metricsBindAddress: ":8443"

reloader:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: true

rbac:
  create: true

startupProbe:
  enabled: true
  path: /healthz
  port: health
  failureThreshold: 30
  periodSeconds: 2

livenessProbe:
  httpGet:
    path: /healthz
    port: health
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /readyz
    port: health
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3

metrics:
  serviceMonitor:
    enabled: false
    port: metrics
    interval: 30s
    scrapeTimeout: 10s

networkPolicy:
  enabled: true
  ingress:
    # Prometheus scraping metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8443
  extraEgress:
    # Kubernetes API server.
    # Bug #24 LIVE fix (2026-05-17 iter 17): DOKS exposes K8s API on port
    # 443 (ClusterIP 10.245.0.1:443), NOT 6443. Local k3d uses 6443.
    # Allow BOTH so this chart works on k3d, DOKS, EKS, GKE uniformly.
    - ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 443

topologySpreadConstraints:
  enabled: false

affinity: {}

tolerations: []
nodeSelector: {}

# T1.4a of deep-review-remediation-plan (closes find_arch_002 / find_arch_007
# partial): cell-aware runtime client factory needs RUNTIME_KUBECONFIG mounted
# from the cluster Secret. Default disabled — production cells set this to
# true once the loopzero-cluster-kubeconfigs Secret is available, then bump
# requireRunning=true to enforce fail-fast (ADR D3).
# dataPlanePoller — T2.2 of plan dashboard-badge-data-plane-poller
# (Red Team loopzero-cloud#128). When enabled, the app-operator registers a
# manager.Runnable that scrapes kube_deployment_status_replicas_ready
# from Prometheus every `interval` and persists per-(tenant, project, env)
# snapshots into env_targets. Consumed by ListProjectsWithSummaryByTenant
# LATERAL JOIN so the /projects list badge is data-plane-aware.
#
# Default OFF: env-gated + fail-fast on missing pgUrl/prometheusUrl —
# refuses to start on partial config rather than silently no-op.
#
# Enabling requires the two egress targets to be reachable — the chart's
# NetworkPolicy adds `monitoring/prometheus:9090` egress AUTOMATICALLY
# when this block sets `enabled: true` (see .Values.networkPolicy).
dataPlanePoller:
  enabled: false
  # PG DSN for the LATERAL-JOIN table (env_targets). Same DB the engine
  # uses; the poller UPDATEs env_targets.last_replicas_ready_{value,at}.
  pgUrl: ""
  # Prometheus base URL — the operator posts to `${prometheusUrl}/api/v1/query`.
  # Typically the cluster-internal service DNS + port (e.g.
  # `http://prometheus-server.monitoring.svc.cluster.local:80`).
  prometheusUrl: ""
  # Scrape cadence. 30s is the canonical default (blueprint Q6 + EC-7).
  interval: "30s"

runtimeKubeconfigMount:
  enabled: false
  # Path inside the container where the kubeconfig file appears.
  path: /etc/loopzero/runtime/kubeconfig
  # Mount directory (must contain the file at $path basename).
  dir: /etc/loopzero/runtime
  # Secret name in the same namespace as the operator. Generated by
  # provision-api-tokens.sh (B34 fix) — keep aligned.
  secretName: loopzero-cluster-kubeconfigs
  # Secret key inside the Secret. F-2 of dogfood-2026-05-08-fixes aligned
  # this to "in-cluster" — context name MUST match RUNTIME_KUBE_CONTEXT.
  secretKey: runtime.kubeconfig
  # In-cluster context name. Drift between F-11 and B34 caused F-2 silent
  # ESO skip; canonical value is "in-cluster".
  context: in-cluster
  # When true, sets LOOPZERO_REQUIRE_RUNTIME_KUBECONFIG=true so operator main
  # exits non-zero if the kubeconfig is missing or factory creation fails.
  # FLIP THIS ONLY AFTER the Secret mount is verified in the target cell
  # (per EC-4 of edge-case review — premature flip CrashLoopBackOffs).
  requireRunning: false
