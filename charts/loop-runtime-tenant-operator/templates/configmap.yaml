apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loop-runtime-common.fullname" . }}
  labels:
    {{- include "loop-runtime-common.labels" . | nindent 4 }}
data:
  ARGOCD_NAMESPACE: {{ .Values.config.argocdNamespace | quote }}
  GITEA_ORG: {{ .Values.config.giteaOrg | quote }}
  GITEA_URL: {{ .Values.config.giteaUrl | quote }}
  INGRESS_NAMESPACE: {{ .Values.config.ingressNamespace | quote }}
  MINIO_ENDPOINT: {{ .Values.config.minioEndpoint | quote }}
  REGISTRY_CIDRS: {{ .Values.config.registryCidrs | quote }}
  LOOP_RUNTIME_TENANT_MAX_CONCURRENT: {{ .Values.config.loopRuntimeTenantMaxConcurrent | quote }}
  WORKLOAD_CLUSTER_URL: {{ .Values.config.workloadClusterUrl | quote }}
  OPERATOR_INSECURE_SKIP_TLS: {{ .Values.config.operatorInsecureSkipTls | quote }}
  LOOP_RUNTIME_PPROF_ADDR: {{ .Values.config.loopRuntimePprofAddr | quote }}
  LOOP_RUNTIME_PPROF_ENABLED: {{ .Values.config.loopRuntimePprofEnabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterOtlpEndpoint | quote }}
  LOOP_RUNTIME_ENV: {{ .Values.config.loopRuntimeEnv | quote }}
  LOOP_RUNTIME_TRACING_ENABLED: {{ .Values.config.loopRuntimeTracingEnabled | quote }}
