# helm-unittest: NetworkPolicy conditional rendering for loop-runtime-api.
# INF-G08 + Plan T2.2: NetworkPolicy is gated by .Values.networkPolicy.enabled.

suite: networkpolicy toggle
templates:
  - networkpolicy.yaml

tests:
  - it: does NOT render NetworkPolicy when disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders NetworkPolicy when enabled
    set:
      networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy

  - it: NetworkPolicy is namespaced and named after release
    set:
      networkPolicy.enabled: true
    asserts:
      - isAPIVersion:
          of: networking.k8s.io/v1
      - isKind:
          of: NetworkPolicy
