# Standalone-multi (k3d 3-cluster local) overrides for loop-runtime-tenant-operator.
#
# CHG-2026-04-30-INFRA-NORMALIZE / Phase 2 condition C12 (4 charts × 4
# environments = 16 cells; this is the standalone-multi cell).
#
# k3d uses an in-cluster registry (`k3d-loop-runtime-registry:5000`) accessible
# without auth — empty imagePullSecrets is correct. Image repository
# overridden to point at the local registry instead of DOCR. Mirrors
# pattern from `infra/helm/tenant-controller/values-standalone-multi.yaml`.
global:
  registry: k3d-loop-runtime-registry:5000
  imagePullSecrets: []

image:
  repository: loop-runtime-tenant-operator
  pullPolicy: IfNotPresent   # FB-#1 (MEET-070): k3d image import populates node crictl cache; pullPolicy=Always cycles ImagePullBackOff because registry HTTP returns 404

# FB-#3 partial fix (MEET-070) — populate env vars per plan v1.1 T1.5
# §"Env var distribution across 4 binaries". Minimum-viable for
# standalone-multi boot; MINIO_*/SPACES_*/DIGITALOCEAN_TOKEN
# are runtime-conditional and tracked in fb-cutover-backlog.md.
config:
  giteaUrl: "http://gitea-http.loop-runtime-system.svc.cluster.local:3000"
  argocdNamespace: argocd
  workloadClusterUrl: ""   # patched at runtime by task k3d:heal H10
  ingressNamespace: traefik
  operatorInsecureSkipTls: "true"  # local k3d certs are self-signed

# FB-#2 (MEET-070): the current chart Secret template ships empty
# stringData. For LOCAL cutover, the deploy operator should patch
# the Secret with the actual token from loop-runtime-api-tokens.gitea-token.
# Tracked separately for proper existingSecret + key-remap implementation.
secrets:
  create: true
  existingSecret: ""
  giteaToken: ""

kubeconfig:
  build:
    existingConfigMap: loop-runtime-build-kubeconfig
  cell0:
    existingConfigMap: loop-runtime-cell-0-kubeconfig
