apiVersion: v2
name: loopzero-platform
description: "LoopZeroCloud platform umbrella chart — installs all components. SINGLE-CLUSTER: collapses the core, build and cell planes into one release."
type: application
annotations:
  # Deliberate, decided in ADR 2026-08-12-umbrella-chart-plane-separation (B-048).
  # The 12 dependencies span three planes; this chart installs them in one cluster.
  # What that costs is spelled out in README.md; which chart belongs to which plane
  # is in infra/CHART-PLANE-INDEX.md.
  loopzero.io/topology: single-cluster
  loopzero.io/planes-collapsed: "core,build,cell"
version: 0.2.0
appVersion: "dev"
home: https://github.com/getloopscale/loopzero
sources:
  - https://github.com/getloopscale/loopzero
maintainers:
  - name: LoopZero Team
    url: https://loopzero.example
icon: https://loopzero.example/icon.png
dependencies:
  - name: loopzero-common
    version: ">=0.1.0 <1.0.0"
    repository: "file://../loopzero-common"
  - name: loopzero-crds
    version: ">=0.1.0 <1.0.0"
    repository: "file://../loopzero-crds"
    condition: loopzero-crds.enabled
  - name: loopzero-api
    version: ">=0.1.0 <1.0.0"
    repository: "file://../loopzero-api"
    condition: loopzero-api.enabled
  - name: loopzero-tenant-operator
    version: ">=0.1.0 <1.0.0"
    repository: "file://../loopzero-tenant-operator"
    condition: loopzero-tenant-operator.enabled
  - name: loopzero-app-operator
    version: ">=0.1.0 <1.0.0"
    repository: "file://../loopzero-app-operator"
    condition: loopzero-app-operator.enabled
  - name: loopzero-preview-operator
    version: ">=0.1.0 <1.0.0"
    repository: "file://../loopzero-preview-operator"
    condition: loopzero-preview-operator.enabled
  - name: loopzero-platform-operator
    version: ">=0.1.0 <1.0.0"
    repository: "file://../loopzero-platform-operator"
    condition: loopzero-platform-operator.enabled
  - name: loopzero-cloud
    version: ">=0.1.0 <1.0.0"
    repository: "file://../loopzero-cloud"
    condition: loopzero-cloud.enabled
  - name: loopzero-dashboard
    version: ">=0.1.0 <1.0.0"
    repository: "file://../loopzero-dashboard"
    condition: loopzero-dashboard.enabled
  - name: loopzero-build-cwts
    version: ">=0.1.0 <1.0.0"
    repository: "file://../loopzero-build-cwts"
    condition: loopzero-build-cwts.enabled
  - name: loopzero-monitoring
    version: ">=0.1.0 <1.0.0"
    repository: "file://../loopzero-monitoring"
    condition: loopzero-monitoring.enabled
  - name: loopzero-admission-policies
    version: ">=0.1.0 <1.0.0"
    repository: "file://../loopzero-admission-policies"
    condition: loopzero-admission-policies.enabled
