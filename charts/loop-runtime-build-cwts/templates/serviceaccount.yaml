{{- if .Values.workflow.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workflow.serviceAccount.name | default "loop-runtime-build-sa" }}
  # CHG-2026-04-25-E2E: hardcoded "argo" because the Argo workflow
  # controller runs there, and it spawns build pods that mount this
  # ServiceAccount. When this chart is included as a sub-chart of the
  # loop-runtime-platform umbrella (Release.Namespace=loop-runtime-system), the SA would
  # land in loop-runtime-system and workflow pods would fail with
  # "ServiceAccount not found in argo".
  namespace: argo
  labels:
    app.kubernetes.io/part-of: loop-runtime-platform
    app.kubernetes.io/component: build
automountServiceAccountToken: true
# CHG-2026-04-25-E2E: build pods need to pull images from the same DOCR
# the platform uses (loop-runtime-clone-runner, loop-runtime-cosign-signer, loop-runtime-syft-scanner).
# (loop-runtime-packs-runner removed — simplify-deploy-loopzerokit-only v2.0 T4.1.)
# The installer's Step 3 creates `loop-runtime-system` secret in the argo namespace
# (matching the contract used by EnvironmentController for tenant
# namespaces — see operators/internal/controller/environment_rbac.go);
# we wire it here so workflow pods inherit auth.
imagePullSecrets:
  - name: loop-runtime-system
{{- end }}
