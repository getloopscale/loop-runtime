apiVersion: v1
kind: ResourceQuota
metadata:
  name: argo-workflow-quota
  namespace: argo
  labels:
    app.kubernetes.io/name: loop-runtime-build
    app.kubernetes.io/component: build-pipeline
    app.kubernetes.io/part-of: loop-runtime
spec:
  hard:
    # Scaled for L3 c=30 + heavy DAG (validate+restore+deps+build+sign+mirror).
    # Each workflow uses ~4 CPU limits × 30 parallel = 120 CPU at peak.
    # Bumped for v14: 48→128 CPU limits to absorb burst without 403s.
    # Plan: 50k-immediate-focus
    requests.cpu: "48"
    requests.memory: 96Gi
    limits.cpu: "128"
    limits.memory: 256Gi
    pods: "200"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: argo-workflow-limits
  namespace: argo
  labels:
    app.kubernetes.io/name: loop-runtime-build
    app.kubernetes.io/component: build-pipeline
    app.kubernetes.io/part-of: loop-runtime
spec:
  limits:
    - default:
        cpu: "1"
        memory: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      type: Container
