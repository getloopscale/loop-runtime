apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: loop-runtime-cache-save
  labels:
    app.kubernetes.io/name: loop-runtime-build
    app.kubernetes.io/component: build-pipeline
    app.kubernetes.io/part-of: loop-runtime
spec:
  templates:
    - name: save-cache
      # Cache hops talk to MinIO over the network. A transient error here failed
      # the whole build with no attempt to recover (SD-10.5, audit 2026-09-07).
      # Bounded tighter than clone: a cache miss is recoverable by rebuilding,
      # so this retries briefly and gets out of the way rather than holding a
      # build slot.
      retryStrategy:
        limit: "2"
        retryPolicy: "OnError"
        backoff:
          duration: "3s"
          factor: "2"
          maxDuration: "20s"
      inputs:
        parameters:
          - name: tenant-id
            description: "Tenant identifier for isolation"
          - name: project-id
            description: "Project identifier"
          - name: cache-key
            description: "Cache key identifier (e.g., node-modules)"
          - name: cache-key-suffix
            description: "Optional suffix appended to cache key (e.g., lockfile hash for precise invalidation)"
            default: ""
          - name: cache-dirs
            description: "Comma-separated directories to tar (e.g., node_modules)"
      container:
        # MOD-4 fix: Replaced amazon/aws-cli (~200MB) with minio/mc (~30MB).
        # The clone runner carries mc, built from pinned source (#394).
        image: {{ .Values.images.cloneRunner | default "registry.digitalocean.com/loop-runtime-system/loop-runtime-clone-runner:v0.1.0" }}
        # Credentials injected from K8s Secret via envFrom — never as workflow parameters.
        # Secret loop-runtime-minio-credentials provides: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, MINIO_ENDPOINT
        env:
          - name: HOME
            value: /tmp
        {{- include "loop-runtime-build-cwts.secretEnv" . | trim | nindent 8 }}
        command:
          - sh
          - -c
          - |
            set -euo pipefail
            cd /workspace 2>&1 || { echo "No workspace — skipping cache save"; exit 0; }

            # Configure mc alias for MinIO
            # MOD-6 fix: --insecure flag parametrized via Helm values (not hardcoded).
            {{- include "loop-runtime-build-cwts.mcAlias" . | trim | nindent 12 }}

            # Cache key: the same derivation cache-restore uses (loop-runtime-build-cwts.cacheKey).
            {{- include "loop-runtime-build-cwts.cacheKey" . | nindent 12 }}

            # Build list of dirs to cache from comma-separated input
            DIRS="{{ "{{inputs.parameters.cache-dirs}}" }}"
            EXISTING_DIRS=""
            # POSIX sh only: this runs in loop-runtime-clone-runner, whose `sh` is BusyBox
            # ash — no arrays, no here-strings (#394). Split on commas with IFS and
            # keep globbing off so a directory name is never expanded.
            set -f
            OLD_IFS="$IFS"
            IFS=','
            for d in $DIRS; do
              IFS="$OLD_IFS"
              # Trim surrounding whitespace
              d="${d#"${d%%[![:space:]]*}"}"
              d="${d%"${d##*[![:space:]]}"}"
              if [ -n "$d" ] && [ -d "$d" ]; then
                EXISTING_DIRS="$EXISTING_DIRS $d/"
              fi
            done
            IFS="$OLD_IFS"
            set +f

            if [ -n "$EXISTING_DIRS" ]; then
              # B9 (CHG-2026-04-22-001): the minio/mc image this step used to run in did
              # not ship tar, and `tar: command not found` failed the whole workflow.
              # loop-runtime-clone-runner carries BusyBox tar (#394), so the guard no longer
              # fires there; it stays because cache save is best-effort and MUST NOT
              # break a successful build if the image ever changes again.
              if command -v tar >/dev/null 2>&1; then
                tar czf /tmp/cache.tar.gz $EXISTING_DIRS
                mc cp /tmp/cache.tar.gz "${CACHE_PATH}" \
                  {{- if .Values.minio.insecure }}
                  --insecure \
                  {{- end }}
                  2>&1 || echo "Cache save failed — non-fatal"
                rm -f /tmp/cache.tar.gz
                echo "Cache saved to ${CACHE_KEY}"
              else
                echo "tar not available in image — cache save skipped (non-fatal)"
              fi
            else
              echo "No directories to cache"
            fi
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
      # Cache save is best-effort — prevent indefinite hangs if MinIO is slow
      activeDeadlineSeconds: 120
