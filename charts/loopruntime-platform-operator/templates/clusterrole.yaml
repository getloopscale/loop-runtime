{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "loopruntime-common.fullname" . }}
  labels:
    {{- include "loopruntime-common.labels" . | nindent 4 }}
rules:
  # --- LoopRuntime CRDs: clustercredentials, gitrepositorybindings, platformbootstraps ---
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["clustercredentials", "gitrepositorybindings", "platformbootstraps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["clustercredentials/status", "gitrepositorybindings/status", "platformbootstraps/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["clustercredentials/finalizers", "gitrepositorybindings/finalizers", "platformbootstraps/finalizers"]
    verbs: ["update"]

  # --- Secrets: NOT here ---
  # The operator touches Secrets in two namespaces only, each granted by a
  # namespaced Role: loopruntime-system (role-loopruntime-system.yaml) and the ArgoCD
  # namespace (role-argocd.yaml). Its Secret cache watches those two alone.
  {{- if .Values.rbac.legacyClusterWideSecrets }}
  # Cutover escape hatch (values.yaml rbac.legacyClusterWideSecrets): an
  # operator image that predates the scoped Secret cache lists Secrets in
  # every namespace. Read only — writes stay in the namespaced Roles; off by
  # default.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  {{- end }}

  # --- Events: emit Kubernetes events for observability ---
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]

  # --- Leader election: coordination lease for HA ---
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
