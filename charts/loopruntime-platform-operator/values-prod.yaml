# Production overrides for loopruntime-platform-operator.
#
# CHG-2026-04-30-INFRA-NORMALIZE / Phase 2 condition C12 — propagates
# the DOCR (DigitalOcean Container Registry) image pull secret across
# all 4 split-operator charts × all 4 environments.
#
# In production, loopruntime-* operator images are pulled from
# `registry.digitalocean.com/loopruntime-system/...`. The cluster needs a
# `loopruntime-registry-pull` Secret (provisioned by Pulumi L1) referenced
# here so kubelet can authenticate.
#
# Values shape mirrors the monolith chart's
# `infra/helm/tenant-controller/values.yaml` (see imagePullSecrets
# block at line 17). The split chart already references
# `.Values.global.imagePullSecrets` in templates/deployment.yaml line 28.
global:
  imagePullSecrets:
    - name: loopruntime-registry-pull
