      - task: test:chaos:api-leader-kill
      - task: test:chaos:controller-kill
      - task: test:chaos:pg-latency
      - task: test:chaos:pg-saturation
      - task: test:chaos:argocd-crash
      - task: test:chaos:gitea-outage

  lint:
    desc: Lint all components
    cmds:
      - |
        if command -v golangci-lint >/dev/null 2>&1; then
          cd pkg && golangci-lint run ./...
        else
          echo "SKIP: golangci-lint not installed — install: https://golangci-lint.run/welcome/install/"
        fi
      - |
        if command -v golangci-lint >/dev/null 2>&1; then
          cd operators && golangci-lint run ./...
        else
          echo "SKIP: golangci-lint not installed — install: https://golangci-lint.run/welcome/install/"
        fi
      - |
        if command -v golangci-lint >/dev/null 2>&1; then
          cd api && golangci-lint run ./...
        else
          echo "SKIP: golangci-lint not installed — install: https://golangci-lint.run/welcome/install/"
        fi
      - cd cli && npx eslint src/

  validate:helm-deps:
    desc: |
      Run `helm dependency build` on every chart with file:// deps so
      umbrella charts (loopzero-platform) + 4 split-operator charts can
      `helm template` cleanly. Closes condition C24 of
      MEET-INFRA-NORMALIZE-T3-operator-split.
    cmds:
      - |
        set -e
        for chart in charts/loopzero-api charts/loopzero-app-operator charts/loopzero-cloud \
                     charts/loopzero-controller charts/loopzero-crds charts/loopzero-dashboard \
                     charts/loopzero-platform charts/loopzero-platform-operator \
                     charts/loopzero-preview-operator charts/loopzero-tenant-controller \
                     charts/loopzero-tenant-operator; do
          if [[ -d "$chart" ]]; then
            echo "==> helm dependency build: $chart"
            (cd "$chart" && helm dependency build) || exit 1
          fi
        done

  validate:manifests:
    desc: Validate all K8s manifests with kubeconform
    cmds:
      - kubeconform --strict --skip CustomResourceDefinition operators/config/
      - kubeconform --strict infra/tilt/api-deployment.yaml infra/tilt/operator-deployment.yaml
      # ArgoCD templates use CRD kinds (AppProject, Application) — skip those
      - kubeconform --strict --skip AppProject,Application infra/helm/argocd/templates/
      # PodDisruptionBudgets
      - kubeconform --strict infra/helm/postgresql/templates/pdb.yaml
      - kubeconform --strict infra/helm/gitea/templates/pdb.yaml
      - kubeconform --strict infra/helm/argocd/templates/pdb.yaml
      # NetworkPolicies
      # network-policies migrou de raw manifest para Helm chart (CHG-2026-04-28-LAYERED-BOOTSTRAP iter 5).
      # `helm template` produz uma stream de YAML que kubeconform pode consumir via stdin.
      - helm template network-policies infra/helm/network-policies/ | kubeconform --strict --summary
      # Internal LoopZero charts (CHG-2026-04-28-LAYERED-BOOTSTRAP iter 5+).
      # Skip Traefik IngressRoute and ClusterImagePolicy CRDs (not in default schema).
      - helm template loopzero-api infra/helm/loopzero-api/ | kubeconform --strict --skip IngressRoute,Certificate --summary
      - helm template loopzero-cloud infra/helm/loopzero-cloud/ | kubeconform --strict --skip IngressRoute,Certificate --summary
      - helm template loopzero-controller infra/helm/loopzero-controller/ | kubeconform --strict --summary
      - helm template tenant-controller infra/helm/tenant-controller/ | kubeconform --strict --summary
      - helm template cloudflared infra/helm/cloudflared/ | kubeconform --strict --summary
      - helm template smoke-test infra/helm/smoke-test/ | kubeconform --strict --summary
      - helm template cluster-issuer infra/helm/cluster-issuer/ | kubeconform --strict --skip ClusterIssuer --summary
      - helm template admission-policies infra/helm/admission-policies/ | kubeconform --strict --skip ClusterImagePolicy,ValidatingAdmissionPolicy,ValidatingAdmissionPolicyBinding,PrometheusRule --summary
      # Monitoring manifests (ServiceMonitor, PrometheusRule are CRD kinds — skip those)
      - kubeconform --strict --skip ServiceMonitor,PrometheusRule,Probe infra/helm/monitoring/manifests/
      # infra/helm/argo-workflows/templates/ contains Go template syntax ({{ }}) — requires helm template to validate

  # ---------------------------------------------------------------------------
  # Sprint 8 v3.2 — bootstrap regression prevention
  # ---------------------------------------------------------------------------

  validate:helm-charts:
    desc: |
      Validates every Helmfile-referenced Helm chart resolves to its declared version
      in the upstream repo index. Catches deprecated chart names and renames before
      bootstrap. CHG-2026-04-28-LAYERED-BOOTSTRAP — reads from infra/helmfile/*.yaml
      (replacing pre-refactor bootstrap-shared.ts).
    cmds:
      - |
        python3 << 'PYEOF'
        import re
        import sys
        import urllib.request
        try:
            import yaml
        except ImportError:
            print("Install pyyaml: pip install --user pyyaml", file=sys.stderr)
            sys.exit(1)

        helmfiles = [
            "infra/helmfile/mgmt.helmfile.yaml.gotmpl",
            "infra/helmfile/build.helmfile.yaml.gotmpl",
            "infra/helmfile/runtime.helmfile.yaml.gotmpl",
        ]

        # Build mapping repo-name → repo-url AND release → (repo-name, chart-name, version)
        # Iter 20: helmfiles are .gotmpl with go-template placeholders.
        # We strip them via shell sed before yaml.safe_load (Python regex with
        # the templating syntax conflicts with Task's own go-template parser).
        repo_urls = {}
        releases = []
        OPEN = chr(123) + chr(123)
        CLOSE = chr(125) + chr(125)
        import re as _re
        TPL_RE = _re.compile(_re.escape(OPEN) + r'[^}]*' + _re.escape(CLOSE))
        for hf in helmfiles:
            with open(hf) as f:
                content = f.read()
            content = TPL_RE.sub('false', content)
            for doc in yaml.safe_load_all(content):
                if not doc:
                    continue
                for r in doc.get("repositories", []) or []:
                    repo_urls[r["name"]] = r["url"]
                for rel in doc.get("releases", []) or []:
                    chart = rel.get("chart", "")
                    version = rel.get("version")
                    if not version:
                        continue  # Local chart (../helm/X) — no upstream version
                    if "/" not in chart or chart.startswith("../"):
                        continue
                    repo_name, chart_name = chart.split("/", 1)
                    releases.append((rel["name"], repo_name, chart_name, version))

        cache = {}
        def fetch_index(repo_url: str):
            if repo_url in cache:
                return cache[repo_url]
            url = repo_url.rstrip("/") + "/index.yaml"
            try:
                with urllib.request.urlopen(url, timeout=15) as r:
                    cache[repo_url] = yaml.safe_load(r.read())
                return cache[repo_url]
            except Exception as e:
                return {"_error": str(e)}

        failed = []
        skipped = []
        ok = 0
        for name, repo_name, chart_name, version in releases:
            repo_url = repo_urls.get(repo_name)
            if not repo_url:
                skipped.append(f"  - {name}: repo '{repo_name}' not declared in helmfiles")
                continue
            idx = fetch_index(repo_url)
            if "_error" in idx:
                skipped.append(f"  - {name}: repo {repo_url} unreachable ({idx['_error']})")
                continue
            entries = idx.get("entries", {}).get(chart_name, [])
            avail = [e.get("version") for e in entries]
            # Strip leading 'v' for cert-manager etc. when present in helmfile but not index
            version_clean = version.lstrip("v")
            if version in avail or version_clean in avail or f"v{version_clean}" in avail:
                print(f"OK  {name:30} → {chart_name}@{version}")
                ok += 1
            else:
                latest = sorted(avail, reverse=True)[:3] if avail else ["<none>"]
                failed.append(f"  - {name} ({chart_name}@{version}): not in repo {repo_url}. Latest 3: {latest}")

        if skipped:
            print("\nSkipped (no mapping or unreachable):")
            print("\n".join(skipped))
        if failed:
            print("\nFAIL: Helm chart references stale or wrong:")
            print("\n".join(failed))
            sys.exit(2)
        print(f"\n✓ {ok} chart references valid (out of {len(releases)} declared)")
        PYEOF

  validate:helmfile-scripts:
    desc: |
      Runs the offline helmfile-script regression tests. Validates that
      generate-secrets.sh, generate-runtime-secrets.sh, and create-wiring-configmap.sh
      produce correct kubectl invocations. CHG-2026-04-28-LAYERED-BOOTSTRAP / Phase 8.
    cmds:
      - bash infra/helmfile/scripts/test_helpers/run-all.sh

  validate:internal-charts:
    desc: |
      Lints all internal LoopZero Helm charts (those referenced as `../helm/X` in
      helmfiles). CHG-2026-04-28-LAYERED-BOOTSTRAP iteration 5+ created these
      to close the chart-not-found gap. Validates each chart parses, templates,
      and produces at least one K8s object.
    cmds:
      - |
        FAIL=0
        for d in admission-policies cloudflared cluster-issuer network-policies smoke-test tenant-controller loopzero-api loopzero-cloud loopzero-controller; do
          if ! helm lint infra/helm/$d/ >/dev/null 2>&1; then
            echo "FAIL  $d (helm lint)"; FAIL=$((FAIL+1)); continue
          fi
          COUNT=$(helm template "$d" "infra/helm/$d/" 2>/dev/null | grep -c "^kind:" || echo 0)
          if [ "$COUNT" -lt 1 ]; then
            echo "FAIL  $d (renders 0 K8s objects)"; FAIL=$((FAIL+1)); continue
          fi
          echo "PASS  $d ($COUNT K8s objects)"
        done
        if [ "$FAIL" -gt 0 ]; then
          echo "Internal-chart validation FAILED ($FAIL chart(s))"
          exit 1
        fi
        echo "✓ All 9 internal Helm charts lint and render correctly"

  validate:helmfile-templates:
    desc: |
      CHG-2026-04-28-LAYERED-BOOTSTRAP iter 11 — renders ALL helmfile releases
      (mgmt 287 + build 45 + runtime 213 = 545 K8s objects) and validates each
      against its K8s schema via kubeconform. Catches:
        - Deprecated apiVersion (e.g., policy/v1beta1 in PDBs)
        - Invalid spec values (additionalProperties: false strict mode)
        - Schema drift between chart upgrades
      Uses local CRD schemas at infra/kubeconform-schemas/ for kinds not in
      the default kubeconform schema repository (CustomResourceDefinition).
    cmds:
      # Delegate to a shell script — keeps kubeconform's {{...}} template
      # placeholders out of Task's Go-template parser.
      - bash infra/kubeconform-schemas/validate-helmfile-templates.sh

  validate:argocd-sync-waves:
    desc: |
      Validates that the 38 ArgoCD App-of-Apps Application manifests have a
      coherent sync-wave ordering — e.g., cert-manager (wave -3) before traefik
      (-2) before loopzero-api (2) before smoke-test (99). Catches manual edits
      that would make ArgoCD try to create resources before their CRDs exist.
    cmds:
      - python3 infra/argocd-bootstrap/validate-sync-waves.py

  validate:layered-bootstrap:
    desc: |
      Aggregate validation for CHG-2026-04-28-LAYERED-BOOTSTRAP — runs the full
      offline test suite (helm lint, helmfile YAML structure, regression tests).
    cmds:
      - task: validate:internal-charts
      - task: validate:argocd-sync-waves
      - task: validate:helmfile-templates
      - bash infra/helmfile/scripts/test_helpers/run-all.sh
      - go test ./infra/tests/load/ -run "TestRegression|TestB18|TestB16|TestL3CoverageMatrix" -count=1
      - helmfile -f infra/helmfile/mgmt.helmfile.yaml.gotmpl -e dev list >/dev/null
      - helmfile -f infra/helmfile/build.helmfile.yaml.gotmpl -e dev list >/dev/null
      - helmfile -f infra/helmfile/runtime.helmfile.yaml.gotmpl -e dev list >/dev/null
      - echo "✓ All layered-bootstrap offline validations PASS"

  validate:k3d-integration:
    desc: |
      Runs the layered-bootstrap integration tests against a local k3d cluster.
      Requires `k3d cluster create loopzero-test` to exist. Validates:
        - admission-policies Helm chart installs cleanly + creates 6 VAPs
        - scoped-kubeconfig.sh produces a working SA-backed kubeconfig
        - argocd-register.sh creates ArgoCD cluster Secret with correct caData
        - regression-checks.sh runs without bash syntax errors against real cluster
        - 8/8 internal Helm charts install cleanly on real k8s
      CHG-2026-04-28-LAYERED-BOOTSTRAP / Phase 7 partial real-cluster validation.
    cmds:
      - LOOPZERO_K3D_INTEGRATION=1 go test -timeout 5m ./infra/tests/load/ -run "TestK3d" -count=1 -v

  validate:full:
    desc: |
      CHG-2026-04-28-LAYERED-BOOTSTRAP — runs ALL offline + k3d (if available)
      validations as a single CI gate. Use this in PR CI to validate the entire
      layered-bootstrap deliverable.

      Includes:
        - task lint (golangci-lint + ESLint with 0 errors)
        - task validate:manifests (kubeconform on all chart-rendered K8s objects)
        - task validate:internal-charts (helm lint + template on 9 internal charts)
        - task validate:helm-charts (chart versions resolve in upstream repos)
        - task validate:helmfile-scripts (3 shell tests with mock-kubectl)
        - task validate:layered-bootstrap (aggregate offline)
        - go test ./infra/tests/load/ regression
        - cd cli && npm test (CLI 1114 tests)
        - cd infra/pulumi && npx vitest run (Pulumi 75 tests)
    cmds:
      - task: lint
      - task: validate:manifests
      - task: validate:internal-charts
      - task: validate:helm-charts
      - task: validate:helmfile-scripts
      - task: validate:layered-bootstrap
      - go test ./infra/tests/load/ -run "TestRegression|TestB18|TestB16|TestL3CoverageMatrix" -count=1
      - cd cli && npm test -- --silent 2>&1 | tail -3
      - cd infra/pulumi && npx vitest run 2>&1 | tail -3
      - echo "✓ All CHG-2026-04-28-LAYERED-BOOTSTRAP validations PASS"

  migrate:tenants:
    desc: |
      F-04 (CHG-2026-04-29-DOGFOOD T3.3) — Reconcile Tenant + Environment
      CRs duplicados entre namespaces para o canônico loopzero-system. Default
      é dry-run; usar `task migrate:tenants -- --apply` para commit.

      CRITICAL: este é o T1 fix (data cleanup). T3.1 (hard-code do
      namespace no operator/API code) + T3.2 (ValidatingAdmissionPolicy
      preventiva) ficam T2 governance per CLAUDE.md Pre-release rule
      (touches tenant isolation contract).
    cmds:
      - bash infra/scripts/migrate-tenant-namespace.sh {{.CLI_ARGS}}

  dogfood:repro:
    desc: |
      CHG-2026-04-29-DOGFOOD — Reproduce all 13 dogfood findings (F-01..F-13)
      against k3d standalone-multi. Emits JSON to stdout + summary table to
      stderr. Exit 0 when all REPRODUCED (consistent matrix), exit 1 when at
      least one FIXED (matrix needs update).
    cmds:
      - bash infra/tests/dogfood/repro-findings.sh

  validate:k8s-versions:
    desc: |
      Validates that K8s versions in Pulumi.{stack}.yaml are still supported by
      DigitalOcean. DOKS rotates patch versions ~quarterly — catches stale slugs
      before bootstrap fails with 422 invalid version slug. Sprint 8 v3.2 / Pilar 2.
    cmds:
      - |
        python3 << 'PYEOF'
        import json
        import subprocess
        import sys
        import yaml

        try:
            supported_raw = subprocess.check_output(
                ["doctl", "kubernetes", "options", "versions", "-o", "json"],
                stderr=subprocess.DEVNULL, timeout=30,
            )
            supported = {v["slug"] for v in json.loads(supported_raw)}
        except Exception as e:
            print(f"FAIL: doctl unavailable or unauthenticated: {e}", file=sys.stderr)
            sys.exit(1)

        print(f"DO supports: {sorted(supported)}")

        failed = []
        for stack_yaml in ["Pulumi.dev.yaml", "Pulumi.staging.yaml", "Pulumi.homolog.yaml", "Pulumi.prod.yaml"]:
            path = f"infra/pulumi/{stack_yaml}"
            try:
                cfg = yaml.safe_load(open(path)).get("config", {})
            except FileNotFoundError:
                print(f"  - {stack_yaml}: missing (skipped)")
                continue
            for key in ["mgmtK8sVersion", "runtimeK8sVersion", "buildK8sVersion"]:
                slug = cfg.get(f"loopzero-infra:{key}")
                if not slug:
                    continue
                if slug in supported:
                    print(f"OK  {stack_yaml} {key} = {slug}")
                else:
                    failed.append(f"  - {stack_yaml} {key}: {slug} NOT in supported set")

        if failed:
            print("\nFAIL: Stale K8s versions detected:")
            print("\n".join(failed))
            sys.exit(2)
        print("\n✓ All K8s version slugs supported by DO")
        PYEOF

  chaos:install:
    desc: |
      Sprint 8 v3.2 / CHG-002a / T0.3 — Install Chaos Mesh 2.7.0 in all 4 DOKS
      clusters (mgmt + build + runtime + runtime-2). ADR-0016 D-4 hardening:
      hardened RBAC (no cluster-admin default), Audit/Deny alignment with
      Sprint 6 policy-controller. Idempotent — safe to re-run.
    cmds:
      - |
        set -e
        cd infra/helm/chaos-mesh
        helm dependency update
        cd /home/paulo/loopzero
        for KCFG in ${HOME}/.kube/loopzero-loopzero-infra-dev-sfo3-mgmt.yaml \
                    ${HOME}/.kube/loopzero-loopzero-infra-dev-sfo3-build.yaml \
                    ${HOME}/.kube/loopzero-loopzero-infra-dev-sfo3-runtime.yaml \
                    ${HOME}/.kube/loopzero-loopzero-infra-dev-sfo3-runtime-2.yaml; do
          [ -f "$KCFG" ] || { echo "skip: $KCFG not found"; continue; }
          NAME=$(basename "$KCFG" .yaml | sed 's/loopzero-//')
          echo "=== Installing Chaos Mesh in $NAME ==="
          KUBECONFIG=$KCFG helm upgrade --install loopzero-chaos-mesh infra/helm/chaos-mesh \
            -n chaos-mesh --create-namespace \
            -f infra/helm/chaos-mesh/values.yaml \
            --wait --timeout 5m
          echo ""
          echo "verify CRDs:"
          KUBECONFIG=$KCFG kubectl get crd podchaos.chaos-mesh.org stresschaos.chaos-mesh.org networkchaos.chaos-mesh.org 2>&1 | head -5
        done

  chaos:uninstall:
    desc: |
      Uninstall Chaos Mesh from all 4 clusters. Use only after CHG-002c chaos
      validation completes. CRDs are NOT deleted by uninstall — must `kubectl
      delete crd` separately if full removal is desired.
    cmds:
      - |
        for KCFG in ${HOME}/.kube/loopzero-loopzero-infra-dev-sfo3-mgmt.yaml \
                    ${HOME}/.kube/loopzero-loopzero-infra-dev-sfo3-build.yaml \
                    ${HOME}/.kube/loopzero-loopzero-infra-dev-sfo3-runtime.yaml \
                    ${HOME}/.kube/loopzero-loopzero-infra-dev-sfo3-runtime-2.yaml; do
          [ -f "$KCFG" ] || continue
          NAME=$(basename "$KCFG" .yaml)
          echo "=== Uninstalling Chaos Mesh from $NAME ==="
          KUBECONFIG=$KCFG helm uninstall loopzero-chaos-mesh -n chaos-mesh 2>&1 | head -3
        done

  validate:bootstrap:
    desc: |
      Composite Sprint 8 validation — runs all three Sprint 8 v3.2 checks
      (helm-charts, k8s-versions, manifests) plus pulumi vitest suite.
      Use as PR gate. Sprint 8 v3.2 / Pilar 2.
    cmds:
      - task: validate:helm-charts
      - task: validate:k8s-versions
      - task: validate:manifests
      - cd infra/pulumi && npx vitest run src/__tests__/adopt-or-create.test.ts src/__tests__/sprint8-fixes.test.ts

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------
  monitoring:install:
    desc: Install full monitoring stack (Prometheus + Grafana + OTel + ServiceMonitors + dashboards)
    cmds:
      - task: infra:install:monitoring

  monitoring:validate-targets:
    desc: Validate all Prometheus scrape targets are UP
    cmds:
      - |
        echo "Checking Prometheus targets..."
        TARGETS=$(curl -sf http://localhost:{{.PROMETHEUS_PORT}}/api/v1/targets | jq -r '.data.activeTargets[] | "\(.labels.job) \(.health)"' 2>/dev/null)
        if [ -z "$TARGETS" ]; then
          echo "ERROR: Cannot reach Prometheus at localhost:{{.PROMETHEUS_PORT}}"
          exit 1
        fi
        echo "$TARGETS" | sort | uniq -c | sort -rn
        echo ""
        DOWN=$(echo "$TARGETS" | grep -c "down" || true)
        if [ "$DOWN" -gt 0 ]; then
          echo "WARNING: $DOWN target(s) are DOWN:"
          echo "$TARGETS" | grep "down"
          exit 1
        fi
        echo "All targets are UP."

  monitoring:status:
    desc: Show monitoring stack status (targets, alerts, dashboards)
    cmds:
      - |
        echo "=== Prometheus Targets ==="
        curl -sf http://localhost:{{.PROMETHEUS_PORT}}/api/v1/targets | jq -r '.data.activeTargets[] | "\(.labels.job)\t\(.health)\t\(.lastScrape)"' 2>/dev/null | column -t || echo "Prometheus not reachable at localhost:{{.PROMETHEUS_PORT}}"
        echo ""
        echo "=== Active Alerts ==="
        curl -sf http://localhost:{{.PROMETHEUS_PORT}}/api/v1/alerts | jq -r '.data.alerts[] | "\(.labels.alertname)\t\(.state)\t\(.labels.severity)"' 2>/dev/null | column -t || echo "No alerts or Prometheus not reachable"
        echo ""
        echo "=== Grafana Dashboards ==="
        curl -sf -u REDACTED_SECRET_056 http://localhost:{{.GRAFANA_PORT}}/api/search?type=dash-db | jq -r '.[].title' 2>/dev/null || echo "Grafana not reachable at localhost:{{.GRAFANA_PORT}}"

  # =========================================================================
  # MEET-055: Post-Stress-Test Operational Tasks
  # =========================================================================

  loadtest:run:
    desc: Run load test at specified LEVEL (l1-l5). Uses Go E2E harness.
    vars:
      LEVEL: '{{.LEVEL | default "l1"}}'
    cmds:
      - |
        cd infra/tests/load
        if [ ! -f run-tests.sh ]; then
          echo "ERROR: run-tests.sh not found in infra/tests/load/"
          exit 1
        fi
        echo "=== Load Test Level: {{.LEVEL}} ==="
        bash run-tests.sh {{.LEVEL}}

  api:hotfix:
    desc: Sanctioned fast-path for API image hotfix (build, push, rollout restart with audit)
    vars:
      TAG: '{{.TAG | default "homolog"}}'
      CONTEXT: '{{.CONTEXT | default "do-nyc3-loopzero-infra-homolog-nyc3-mgmt"}}'
    cmds:
      - |
        set -euo pipefail
        echo "=== API Hotfix ==="
        echo "  Operator: $(whoami)"
        echo "  Time:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "  Tag:      {{.TAG}}"
        echo "  Context:  {{.CONTEXT}}"
        echo ""
        echo "Building API image..."
        docker build -f api/Dockerfile -t registry.digitalocean.com/loopzero-system/loopzero-api:{{.TAG}} .
        echo "Pushing..."
        docker push registry.digitalocean.com/loopzero-system/loopzero-api:{{.TAG}}
        echo "Rolling out..."
        kubectl --context={{.CONTEXT}} -n loopzero-system rollout restart deploy/loopzero-api
        kubectl --context={{.CONTEXT}} -n loopzero-system rollout restart deploy/loopzero-controller
        echo ""
        echo "✅ Hotfix applied. Rollout status:"
        kubectl --context={{.CONTEXT}} -n loopzero-system rollout status deploy/loopzero-api --timeout=120s
        echo ""
        echo "⚠️  Do NOT use 'kubectl set image'. This task is the sanctioned fast-path."

  infra:drift:
    desc: Check Pulumi drift (expect no changes). Run locally or in CI.
    cmds:
      - |
        cd infra/pulumi
        echo "=== Pulumi Drift Check ==="
        echo "  Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        npx pulumi preview --stack homolog --expect-no-changes --non-interactive 2>&1 || {
          echo ""
          echo "🚨 DRIFT DETECTED! Review changes above."
          echo "   If intentional (hotfix): reconcile via 'pulumi up' within 24h."
          echo "   If unauthorized: investigate and revert."
          exit 1
        }
        echo "✅ No drift detected."

  infra:state-delete:
    desc: Wrapper for 'pulumi state delete' with audit trail. Use ONLY when necessary.
    vars:
      URN: '{{.URN}}'
      REASON: '{{.REASON | default "no reason provided"}}'
    cmds:
      - |
        set -euo pipefail
        if [ -z "{{.URN}}" ]; then
          echo "ERROR: URN is required. Usage: task infra:state-delete URN=<urn> REASON='why'"
          exit 1
        fi
        echo "=== Pulumi State Delete (AUDITED) ==="
        echo "  Operator: $(whoami)"
        echo "  Time:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "  URN:      {{.URN}}"
        echo "  Reason:   {{.REASON}}"
        echo ""
        echo "⚠️  WARNING: This removes the resource from Pulumi state."
        echo "⚠️  The REAL resource in the cloud is NOT deleted."
        echo "⚠️  You MUST delete the real resource FIRST (doctl/aws/cf)."
        echo ""
        read -p "Have you already deleted the real resource? [y/N] " -n 1 -r
        echo
        if [[ ! $REPLY =~ ^[Yy]$ ]]; then
          echo "Aborted. Delete the real resource first, then retry."
          exit 1
        fi
        cd infra/pulumi
        npx pulumi state delete --stack homolog "{{.URN}}" --force
        echo "✅ Resource removed from state."

  break-glass:
    desc: Issue time-boxed cluster-admin access for emergency operations (MEET-055 M3)
    vars:
      CONTEXT: '{{.CONTEXT | default "do-nyc3-loopzero-infra-homolog-nyc3-mgmt"}}'
      TTL: '{{.TTL | default "4"}}'
      REASON: '{{.REASON | default ""}}'
    cmds:
      - bash infra/scripts/break-glass.sh {{.CONTEXT}} {{.TTL}} "{{.REASON}}"

  # ===========================================================================
  # Observability — Blackbox, pprof, Sloth
  # ===========================================================================

  pprof:api:
    desc: Port-forward to API pprof endpoint (http://localhost:6060/debug/pprof/)
    cmds:
      - kubectl --context {{.MGMT_CONTEXT}} -n loopzero-system port-forward deploy/loopzero-api 6060:6060

  pprof:operators:
    desc: Port-forward to Operator pprof endpoint (http://localhost:6061/debug/pprof/)
    cmds:
      - kubectl --context {{.MGMT_CONTEXT}} -n loopzero-system port-forward deploy/loopzero-controller 6061:6061

  blackbox:status:
    desc: Check blackbox exporter health and probe results
    cmds:
      - |
        echo "=== Blackbox Pod ==="
        kubectl --context {{.MGMT_CONTEXT}} -n loopzero-system get pods -l app.kubernetes.io/name=prometheus-blackbox-exporter 2>/dev/null || echo "Blackbox pod not found"
        echo ""
        echo "=== Probe CRDs ==="
        kubectl --context {{.MGMT_CONTEXT}} -n monitoring get probes 2>/dev/null || echo "No Probe resources found"
        echo ""
        echo "=== PrometheusRules ==="
        kubectl --context {{.MGMT_CONTEXT}} -n monitoring get prometheusrules loopzero-probe-alerts 2>/dev/null || echo "PrometheusRule not found"

  sloth:generate:
    desc: Generate PrometheusRules from Sloth SLO specs
    preconditions:
      - sh: command -v sloth
        msg: "sloth CLI not found. Install: go install github.com/slok/sloth/cmd/sloth@latest"
    cmds:
      - sloth generate -i infra/sloth/*.yaml -o infra/helm/monitoring/manifests/prometheusrule-slo-generated.yaml
      - echo "✅ SLO rules generated at infra/helm/monitoring/manifests/prometheusrule-slo-generated.yaml"

  sloth:validate:
    desc: Validate Sloth SLO spec files
    preconditions:
      - sh: command -v sloth
        msg: "sloth CLI not found. Install: go install github.com/slok/sloth/cmd/sloth@latest"
    cmds:
      - |
        for f in infra/sloth/*.yaml; do
          echo "Validating $f..."
          sloth validate -i "$f"
        done
        echo "✅ All SLO specs valid"

  tempo:status:
    desc: Check Tempo health, ServiceMonitor, and PrometheusRules (MEET-020)
    cmds:
      - |
        echo "=== Tempo Pod ==="
        kubectl --context k3d-loopzero-mgmt -n loopzero-system get pods -l app.kubernetes.io/name=tempo 2>/dev/null || echo "Tempo pod not found"
        echo ""
        echo "=== ServiceMonitor ==="
        kubectl --context k3d-loopzero-mgmt -n monitoring get servicemonitor loopzero-tempo 2>/dev/null || echo "ServiceMonitor not found"
        echo ""
        echo "=== PrometheusRules ==="
        kubectl --context k3d-loopzero-mgmt -n monitoring get prometheusrules loopzero-tracing 2>/dev/null || echo "PrometheusRule not found"

  # ---------------------------------------------------------------------------
  # Helm chart operations (charts/)
  # ---------------------------------------------------------------------------

  helm:lint:
    desc: Lint all Helm charts
    cmds:
      - |
        FAILED=0
        for chart in charts/*/; do
          echo "Linting $chart..."
          if ! helm lint "$chart" 2>&1; then
            FAILED=1
          fi
        done
        if [ "$FAILED" -ne 0 ]; then
          echo "FAILED: one or more charts failed lint"
          exit 1
        fi
        echo "All charts passed lint"

  helm:template:
    desc: Render all chart templates (dry-run)
    cmds:
      - helm template loopzero charts/loopzero-platform

  helm:template:dev:
    desc: Render templates with dev profile
    cmds:
      - helm template loopzero charts/loopzero-platform -f charts/loopzero-platform/profiles/dev.yaml

  helm:template:prod:
    desc: Render templates with prod profile
    cmds:
      - helm template loopzero charts/loopzero-platform -f charts/loopzero-platform/profiles/prod.yaml

  helm:dep:update:
    desc: Update dependencies for all charts (regenerates Chart.lock)
    cmds:
      - |
        for chart in charts/*/; do
          if [ -f "$chart/Chart.yaml" ] && grep -q "dependencies:" "$chart/Chart.yaml"; then
            echo "Updating deps for $chart..."
            helm dependency update "$chart"
          fi
        done
        echo "All dependencies updated"

  helm:sync-crds:
    desc: Sync CRDs from operators/config/crd/bases/ to charts/loopzero-crds/templates/
    cmds:
      - |
        SRC="operators/config/crd/bases"
        DST="charts/loopzero-crds/templates"
        COUNT=0
        for crd_file in "$SRC"/loopzero.io_*.yaml; do
          base=$(basename "$crd_file" .yaml)
          short=${base#loopzero.io_}
          template_file="$DST/${short}.yaml"
          crd_name=$(grep "^  name:" "$crd_file" | head -1 | awk '{print $2}')
          spec_content=$(sed -n '/^spec:/,$p' "$crd_file")
          cat > "$template_file" << TMPL_EOF
        {{- if .Values.crds.${short}.enabled }}
        apiVersion: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        metadata:
          name: ${crd_name}
          labels:
            {{- include "loopzero-common.labels" . | nindent 4 }}
          annotations:
            "helm.sh/resource-policy": keep
            controller-gen.kubebuilder.io/version: {{ .Values.controllerGenVersion | default "v0.17.2" }}
        ${spec_content}
        {{- end }}
        TMPL_EOF
          COUNT=$((COUNT + 1))
        done
        echo "Synced $COUNT CRDs from $SRC to $DST"

  helm:install:dev:
    desc: Install umbrella chart with dev profile on k3d
    cmds:
      - helm upgrade --install loopzero-crds charts/loopzero-crds -n loopzero-system --create-namespace
      - helm upgrade --install loopzero charts/loopzero-platform -n loopzero-system -f charts/loopzero-platform/profiles/dev.yaml

  helm:install:test:
