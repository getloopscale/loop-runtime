version: "3"

vars:
  MGMT_CONTEXT: k3d-loopzero-mgmt
  BUILD_CONTEXT: k3d-loopzero-build
  WORKLOAD_CONTEXT: k3d-loopzero-workload

tasks:
  # ---------------------------------------------------------------------------
  # S0.2: Cluster lifecycle
  # ---------------------------------------------------------------------------
  registry:create:
    desc: Create shared container registry for local development
    cmds:
      - k3d registry list -o json | grep -q '"name":"k3d-loopzero-registry"' || k3d registry create loopzero-registry --port 5000

  clusters:create:
    desc: Create all 3 k3d clusters (mgmt, build, workload)
    cmds:
      - k3d cluster list -o json | grep -q '"name":"loopzero-mgmt"' || k3d cluster create --config infra/k3d/mgmt-cluster.yaml
      - k3d cluster list -o json | grep -q '"name":"loopzero-build"' || k3d cluster create --config infra/k3d/build-cluster.yaml
      - k3d cluster list -o json | grep -q '"name":"loopzero-workload"' || k3d cluster create --config infra/k3d/workload-cluster.yaml
      - task: clusters:verify

  clusters:verify:
    desc: Verify all clusters are reachable
    cmds:
      - kubectl --context {{.MGMT_CONTEXT}} cluster-info
      - kubectl --context {{.BUILD_CONTEXT}} cluster-info
      - kubectl --context {{.WORKLOAD_CONTEXT}} cluster-info

  clusters:delete:
    desc: Delete all k3d clusters
    cmds:
      - k3d cluster delete loopzero-mgmt || true
      - k3d cluster delete loopzero-build || true
      - k3d cluster delete loopzero-workload || true

  clusters:recreate:
    desc: Recreate a single k3d cluster (e.g., task clusters:recreate -- workload)
    cmds:
      - |
        CLUSTER="{{.CLI_ARGS}}"
        if [ -z "$CLUSTER" ]; then
          echo "Usage: task clusters:recreate -- <mgmt|build|workload>"
          exit 1
        fi
        case "$CLUSTER" in
          mgmt)     CONFIG="infra/k3d/mgmt-cluster.yaml";     INSTALL_TASK="infra:install:mgmt" ;;
          build)    CONFIG="infra/k3d/build-cluster.yaml";     INSTALL_TASK="infra:install:build" ;;
          workload) CONFIG="infra/k3d/workload-cluster.yaml";  INSTALL_TASK="infra:install:workload" ;;
          *)        echo "Unknown cluster: $CLUSTER. Use mgmt, build, or workload."; exit 1 ;;
        esac
        echo "Recreating loopzero-${CLUSTER}..."
        k3d cluster delete "loopzero-${CLUSTER}" 2>/dev/null || true
        k3d cluster create --config "$CONFIG"
        echo "Installing components..."
        task "$INSTALL_TASK"
        echo "Done. loopzero-${CLUSTER} recreated."

  # ---------------------------------------------------------------------------
  # S0.3: Infrastructure install
  # ---------------------------------------------------------------------------
  helm:repos:
    desc: Add all required Helm repositories
    cmds:
      - helm repo add bitnami https://charts.bitnami.com/bitnami || true
      - helm repo add gitea-charts https://dl.gitea.com/charts/ || true
      - helm repo add minio https://charts.min.io/ || true
      - helm repo add argo https://argoproj.github.io/argo-helm || true
      - helm repo add traefik https://traefik.github.io/charts || true
      - helm repo add jetstack https://charts.jetstack.io || true
      - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts || true
      - helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts || true
      - helm repo update

  infra:install:mgmt:
    desc: Install platform components in mgmt cluster
    deps: [helm:repos]
    cmds:
      - >-
        helm upgrade --install postgresql bitnami/postgresql
        --kube-context {{.MGMT_CONTEXT}}
        --namespace loopzero-system --create-namespace
        -f infra/helm/postgresql/values.yaml
        --wait --timeout 3m
      - >-
        helm upgrade --install gitea gitea-charts/gitea
        --kube-context {{.MGMT_CONTEXT}}
        --namespace loopzero-system
        -f infra/helm/gitea/values.yaml
        --wait --timeout 3m
      - >-
        helm upgrade --install minio minio/minio
        --kube-context {{.MGMT_CONTEXT}}
        --namespace loopzero-system
        -f infra/helm/minio/values.yaml
        --wait --timeout 3m
      - >-
        helm upgrade --install argocd argo/argo-cd
        --kube-context {{.MGMT_CONTEXT}}
        --namespace argocd --create-namespace
        -f infra/helm/argocd/values.yaml
        --wait --timeout 3m
      - >-
        helm upgrade --install cert-manager jetstack/cert-manager
        --kube-context {{.MGMT_CONTEXT}}
        --namespace cert-manager --create-namespace
        -f infra/helm/cert-manager/values.yaml
        --wait --timeout 3m

  infra:install:build:
    desc: Install platform components in build cluster
    deps: [helm:repos]
    cmds:
      - >-
        helm upgrade --install argo-workflows argo/argo-workflows
        --kube-context {{.BUILD_CONTEXT}}
        --namespace argo --create-namespace
        -f infra/helm/argo-workflows/values.yaml
        --wait --timeout 3m

  infra:install:workload:
    desc: Install platform components in workload cluster
    deps: [helm:repos]
    cmds:
      - >-
        helm upgrade --install traefik traefik/traefik
        --kube-context {{.WORKLOAD_CONTEXT}}
        --namespace traefik --create-namespace
        -f infra/helm/traefik/values.yaml
        --wait --timeout 3m

  infra:install:monitoring:
    desc: Install Prometheus + Grafana + OTel in mgmt cluster
    deps: [helm:repos]
    cmds:
      - >-
        helm upgrade --install monitoring prometheus-community/kube-prometheus-stack
        --kube-context {{.MGMT_CONTEXT}}
        --namespace monitoring --create-namespace
        -f infra/helm/monitoring/values.yaml
        --wait --timeout 5m
      - >-
        helm upgrade --install otel-collector open-telemetry/opentelemetry-collector
        --kube-context {{.MGMT_CONTEXT}}
        --namespace monitoring
        -f infra/helm/otel/values.yaml
        --wait --timeout 3m
      - task: dashboards:install

  dashboards:install:
    desc: Install LoopZero Grafana dashboards and ServiceMonitors
    cmds:
      - >-
        kubectl --context {{.MGMT_CONTEXT}} -n monitoring
        create configmap loopzero-grafana-dashboards
        --from-file=infra/helm/monitoring/dashboards/
        --dry-run=client -o yaml |
        kubectl --context {{.MGMT_CONTEXT}} label -f - --local --dry-run=client -o yaml
        grafana_dashboard=1 |
        kubectl --context {{.MGMT_CONTEXT}} apply -f -
      # ServiceMonitors for mgmt cluster components (loopzero-api, gitea, minio, tenant-controller)
      - >-
        kubectl --context {{.MGMT_CONTEXT}} apply
        -f infra/helm/monitoring/manifests/servicemonitor.yaml
        -f infra/helm/monitoring/manifests/servicemonitor-gitea.yaml
        -f infra/helm/monitoring/manifests/servicemonitor-minio.yaml
        -f infra/helm/monitoring/manifests/servicemonitor-tenant-controller.yaml
      # Cross-cluster metrics services (NodePort for Prometheus to scrape via additionalScrapeConfigs)
      - >-
        kubectl --context {{.BUILD_CONTEXT}} apply
        -f infra/helm/monitoring/manifests/metrics-service-argo-workflows.yaml
      - >-
        kubectl --context {{.WORKLOAD_CONTEXT}} apply
        -f infra/helm/monitoring/manifests/metrics-service-traefik.yaml
      # Alerting rules
      - >-
        kubectl --context {{.MGMT_CONTEXT}} apply
        -f infra/helm/monitoring/manifests/prometheusrule-critical.yaml
        -f infra/helm/monitoring/manifests/prometheusrule-warning.yaml

  infra:install:
    desc: Install all platform components via Helm
    cmds:
      - task: infra:install:mgmt
      - task: infra:install:build
      - task: infra:install:workload
      - task: infra:install:monitoring

  # ---------------------------------------------------------------------------
  # S0.4: CRDs
  # ---------------------------------------------------------------------------
  crds:install:
    desc: Install CRDs into mgmt cluster
    cmds:
      - kubectl --context {{.MGMT_CONTEXT}} apply -f operators/config/crd/bases/

  # ---------------------------------------------------------------------------
  # S0.5: Database
  # ---------------------------------------------------------------------------
  db:migrate:
    desc: Run database migrations against PostgreSQL
    cmds:
      - |
        kubectl --context {{.MGMT_CONTEXT}} port-forward -n loopzero-system svc/postgresql 5432:5432 &
        PF_PID=$!
        trap "kill $PF_PID 2>/dev/null; wait $PF_PID 2>/dev/null" EXIT
        sleep 2
        for f in $(ls api/internal/db/migrations/*.up.sql | sort); do
          echo "Applying $f..."
          PGPASSWORD=loopzero-dev-password psql -h localhost -p 5432 -U loopzero -d loopzero -f "$f"
        done

  # ---------------------------------------------------------------------------
  # S1: Development seed data
  # ---------------------------------------------------------------------------
  dev:seed:
    desc: Seed database with a dev user + tenant for manual testing
    vars:
      GITHUB_USER: '{{.GITHUB_USER | default "paulohenriquevn"}}'
      GITHUB_EMAIL: '{{.GITHUB_EMAIL | default "paulohenriquevn@gmail.com"}}'
      GITHUB_ID: '{{.GITHUB_ID | default "6766298"}}'
      TENANT: '{{.TENANT | default "acme"}}'
      PLAN: '{{.PLAN | default "starter"}}'
    cmds:
      - |
        kubectl --context {{.MGMT_CONTEXT}} port-forward -n loopzero-system svc/postgresql 5432:5432 &
        PF_PID=$!
        trap "kill $PF_PID 2>/dev/null; wait $PF_PID 2>/dev/null" EXIT
        sleep 2
        PGPASSWORD=loopzero-dev-password psql -h localhost -p 5432 -U loopzero -d loopzero <<SQL
        -- Idempotent: uses ON CONFLICT DO NOTHING
        INSERT INTO users (id, email, github_id, display_name)
        VALUES ('github-{{.GITHUB_USER}}', '{{.GITHUB_EMAIL}}', {{.GITHUB_ID}}, '{{.GITHUB_USER}}')
        ON CONFLICT (id) DO NOTHING;

        INSERT INTO tenants (id, display_name, plan, owner_id)
        VALUES ('{{.TENANT}}', '{{.TENANT}}', '{{.PLAN}}', 'github-{{.GITHUB_USER}}')
        ON CONFLICT (id) DO NOTHING;

        INSERT INTO tenant_members (tenant_id, user_id, role)
        VALUES ('{{.TENANT}}', 'github-{{.GITHUB_USER}}', 'owner')
        ON CONFLICT (tenant_id, user_id) DO NOTHING;

        SELECT '✓ User: github-{{.GITHUB_USER}} (' || '{{.GITHUB_EMAIL}}' || ')';
        SELECT '✓ Tenant: {{.TENANT}} (plan: {{.PLAN}})';
        SELECT '✓ Membership: owner of {{.TENANT}}';
        SQL

  # ---------------------------------------------------------------------------
  # S2: E2E seed data
  # ---------------------------------------------------------------------------
  dev:seed:e2e:
    desc: Seed E2E test data (tenant, user, project) and wait for reconciliation
    env:
      DATABASE_URL: '{{.DATABASE_URL | default "postgres://loopzero:loopzero@localhost:5432/loopzero?sslmode=disable"}}'
      API_URL: '{{.API_URL | default "http://localhost:3001"}}'
    cmds:
      - go run infra/scripts/seed_e2e.go

  # ---------------------------------------------------------------------------
  # S0.14: Composite tasks
  # ---------------------------------------------------------------------------
  setup:
    desc: Full setup from scratch — clusters + infra + CRDs + DB
    cmds:
      - task: registry:create
      - task: clusters:create
      - task: infra:install
      - task: crds:install
      - task: db:migrate

  dev:up:
    desc: Boot dev environment (clusters + Helm deps). Run `tilt up` separately for the dev loop.
    cmds:
      - task: setup
      - echo "Clusters and dependencies are ready. Run 'tilt up' to start the dev loop."

  test:
    desc: Run all tests (unit + integration + e2e)
    cmds:
      - task: test:unit

  test:unit:
    desc: Run all unit tests
    env:
      KUBEBUILDER_ASSETS:
        sh: setup-envtest use -p path 2>/dev/null || echo "$HOME/.local/share/kubebuilder-envtest/k8s/1.35.0-linux-amd64"
    cmds:
      - cd pkg && go test ./... -short
      - cd operators && go test ./... -short
      - cd api && go test ./... -short
      - cd infra/tests && go test ./unit/... -short

  test:integration:
    desc: Run integration tests (requires running clusters)
    env:
      KUBEBUILDER_ASSETS:
        sh: setup-envtest use -p path 2>/dev/null || echo "$HOME/.local/share/kubebuilder-envtest/k8s/1.35.0-linux-amd64"
    cmds:
      - cd operators && go test ./... -tags=integration -v -timeout 5m
      - cd api && go test ./... -tags=integration -v -timeout 5m

  test:e2e:
    desc: Run E2E tests (requires running clusters)
    cmds:
      - cd infra/tests && go test ./e2e/... -v -timeout 15m

  test:e2e:chaos:
    desc: Run chaos engineering tests
    cmds:
      - cd infra/tests && go test ./e2e/... -v -run "Chaos" -timeout 15m

  lint:
    desc: Lint all components
    cmds:
      - cd pkg && golangci-lint run ./...
      - cd operators && golangci-lint run ./...
      - cd api && golangci-lint run ./...

  validate:manifests:
    desc: Validate all K8s manifests with kubeconform
    cmds:
      - kubeconform --strict --skip CustomResourceDefinition operators/config/
      - kubeconform --strict infra/tilt/api-deployment.yaml infra/tilt/operator-deployment.yaml
      # ArgoCD templates use CRD kinds (AppProject, Application) — skip those
      - kubeconform --strict --skip AppProject,Application infra/helm/argocd/templates/
      # infra/helm/argo-workflows/templates/ contains Go template syntax ({{ }}) — requires helm template to validate

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------
  monitoring:install:
    desc: Install full monitoring stack (Prometheus + Grafana + OTel + ServiceMonitors + dashboards)
    cmds:
      - task: infra:install:monitoring
      - task: dashboards:install

  monitoring:validate-targets:
    desc: Validate all Prometheus scrape targets are UP
    cmds:
      - |
        echo "Checking Prometheus targets..."
        TARGETS=$(curl -sf http://localhost:9090/api/v1/targets | jq -r '.data.activeTargets[] | "\(.labels.job) \(.health)"' 2>/dev/null)
        if [ -z "$TARGETS" ]; then
          echo "ERROR: Cannot reach Prometheus at localhost:9090"
          exit 1
        fi
        echo "$TARGETS" | sort | uniq -c | sort -rn
        echo ""
        DOWN=$(echo "$TARGETS" | grep -c "down" || true)
        if [ "$DOWN" -gt 0 ]; then
          echo "WARNING: $DOWN target(s) are DOWN:"
          echo "$TARGETS" | grep "down"
          exit 1
        fi
        echo "All targets are UP."

  monitoring:status:
    desc: Show monitoring stack status (targets, alerts, dashboards)
    cmds:
      - |
        echo "=== Prometheus Targets ==="
        curl -sf http://localhost:9090/api/v1/targets | jq -r '.data.activeTargets[] | "\(.labels.job)\t\(.health)\t\(.lastScrape)"' 2>/dev/null | column -t || echo "Prometheus not reachable"
        echo ""
        echo "=== Active Alerts ==="
        curl -sf http://localhost:9090/api/v1/alerts | jq -r '.data.alerts[] | "\(.labels.alertname)\t\(.state)\t\(.labels.severity)"' 2>/dev/null | column -t || echo "No alerts or Prometheus not reachable"
        echo ""
        echo "=== Grafana Dashboards ==="
        curl -sf -u REDACTED_SECRET_042 http://localhost:3002/api/search?type=dash-db | jq -r '.[].title' 2>/dev/null || echo "Grafana not reachable"
