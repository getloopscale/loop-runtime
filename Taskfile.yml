version: "3"

# Use bash — required for process management and here-docs.
# Default shell on Ubuntu is dash, which lacks `source` and reliable `$!` / `kill`.
shell:
  - bash
  - --noprofile
  - --norc
  - -c

# Load credentials from .env files (precedence: later file overrides earlier).
# Operator stores D7' drill credentials in .env per user directive 2026-05-16
# (iter 10 — drill-l2-unlock plan); .env.local allows local-only overrides.
# See concepts/operations/operator-handoff-2026-05-16-drill-l2-phase4.md.
dotenv:
  - .env
  - .env.local

# Plan T1.3 — Taskfile split via includes (foundation iter 1; per-domain migration ongoing).
# Each include's tasks are merged into the root namespace by Task v3 (no namespace prefix
# unless the included file uses prefixes itself like `parity:foo:`).
# `_legacy` namespace is reserved during transition; remove when domain stubs are populated.
includes:
  testfile:
    taskfile: ./taskfiles/test.yml
    flatten: true
  helmfile:
    taskfile: ./taskfiles/helm.yml
    flatten: true
  infrafile:
    taskfile: ./taskfiles/infra.yml
    flatten: true
  devfile:
    taskfile: ./taskfiles/dev.yml
    flatten: true
  dbfile:
    taskfile: ./taskfiles/db.yml
    flatten: true
  k3dfile:
    taskfile: ./taskfiles/k3d.yml
    flatten: true
  securityfile:
    taskfile: ./taskfiles/security.yml
    flatten: true
  observabilityfile:
    taskfile: ./taskfiles/observability.yml
    flatten: true
  drill:
    taskfile: ./taskfiles/drill.yml
    optional: false
  quality:
    taskfile: ./taskfiles/quality.yml

vars:
  MGMT_CONTEXT: k3d-loopzero-mgmt
  BUILD_CONTEXT: k3d-loopzero-build
  WORKLOAD_CONTEXT: k3d-loopzero-workload
  # cell-2-activation-plan T0.1 — second runtime cluster mapped to cells.cell_id='cell-2'.
  # Provisioned by infra/k3d/runtime-2-cluster.yaml. Cluster name `loopzero-runtime-2`
  # matches production wire-clusters.sh + Pulumi convention (LOOPZERO_RUNTIME2_KUBECONFIG).
  # ClusterCredential CR is named `cell-2` with spec.clusterName=loopzero-runtime-2.
  # Status starts 'maintenance' in cells SQL table (migration 000006); migration
  # 000007 flips to 'active' after cell2-activation-gates.sh passes 12/12.
  RUNTIME2_CONTEXT: k3d-loopzero-runtime-2
  # Standardized port-forward ports (avoid conflicts between tasks)
  PG_PORT: 15432
  PG_HOST: localhost
  # DEV-ONLY credentials — safe for local k3d clusters, never used in production.
  # Override via .env.local (loaded by dotenv above) or environment variables.
  PG_USER: '{{.PG_USER | default "loopzero"}}'
  PG_PASS: '{{.PG_PASS | default "loopzero-dev-password"}}'
  PG_DB: '{{.PG_DB | default "loopzero"}}'
  API_PORT: 13001
  GRAFANA_PORT: 3002
  PROMETHEUS_PORT: 9090
  # Test report output directory
  REPORT_DIR: .test-reports

tasks:
  # ===========================================================================
  # QA Tooling — Environment verification and diagnostics
  # ===========================================================================


  # ===========================================================================
  # QA Tooling — E2E test preparation
  # ===========================================================================

  install:sops:
    desc: "Plan v1.2 T7.1 — install sops + age + helm-secrets plugin for secrets-in-git encryption (D6)"
    cmds:
      - |
        set -e
        echo "[install:sops] Installing sops + age..."
        if command -v sops >/dev/null && command -v age >/dev/null; then
          echo "[install:sops] sops + age already installed."
        elif command -v brew >/dev/null; then
          brew install sops age
        elif command -v apt-get >/dev/null; then
          sudo apt-get install -y age
          curl -fsSL https://github.com/getsops/sops/releases/latest/download/sops-v3.10.2.linux.amd64 -o /tmp/sops
          sudo install /tmp/sops /usr/local/bin/sops
        else
          echo "[install:sops] ERROR: install brew or apt first; or install sops + age manually." >&2
          exit 1
        fi
        echo "[install:sops] Installing helm-secrets plugin..."
        if helm plugin list 2>/dev/null | grep -q secrets; then
          echo "[install:sops] helm-secrets plugin already installed."
        else
          helm plugin install https://github.com/jkroepke/helm-secrets || true
        fi
        echo "[install:sops] Verify:"
        sops --version
        age --version
        helm secrets --version
        echo ""
        echo "[install:sops] Next: generate age keypair + update .sops.yaml recipients:"
        echo "  age-keygen -o ~/.config/sops/age/keys.txt"
        echo "  age-keygen -y ~/.config/sops/age/keys.txt   # public key for .sops.yaml"

  audit:secrets:
    desc: "Plan v1.2 T7.2 — audit repo for plaintext secrets that should be SOPS-encrypted"
    cmds:
      - |
        set -e
        echo "[audit:secrets] Scanning for plaintext private keys + suspicious patterns..."
        # Patterns: BEGIN PRIVATE KEY, api_key, secret_key inline (not in tests/docs)
        HITS=$(grep -rE "BEGIN [A-Z ]*PRIVATE KEY|api[_-]?key:\s+['\"]?[a-zA-Z0-9]{20,}|secret[_-]?key:\s+['\"]?[a-zA-Z0-9]{20,}" \
          --include='*.yaml' --include='*.yml' --include='*.json' \
          infra/ charts/ 2>&1 \
          | grep -vE "(_test\.|/test/|/__tests__/|REPLACE_|placeholder|stub|example)" \
          | grep -vE "schema|\.lock" \
          | head -30 || true)
        if [[ -n "$HITS" ]]; then
          echo "[audit:secrets] ⚠ Potential plaintext secrets found:"
          echo "$HITS"
          echo ""
          echo "[audit:secrets] Encrypt them: source infra/scripts/lib/sops.sh && sops_encrypt FILE"
          exit 1
        else
          echo "[audit:secrets] ✓ No plaintext secrets detected in tracked YAML/JSON."
        fi

  audit:security-context:
    desc: "INF-G08 audit — pod/container securityContext hardening (matches infra-gates.yml CI gate)"
    # 2026-05-20 CI/local parity bug class (CTO Rule 0 ambiente local
    # fidedigno): scripts/audit-security-context.sh is referenced in
    # .github/workflows/infra-gates.yml step 'INF-G08: securityContext
    # audit' but had no local Taskfile shortcut — operator had to
    # remember exact path + --gate flag. Adding task target restores
    # parity with same exit semantics CI uses.
    cmds:
      - bash scripts/audit-security-context.sh --gate

  audit:action-pinning:
    desc: "INF-G18 audit — GitHub Action SHA pinning (matches infra-gates.yml CI gate)"
    # 2026-05-20 CI/local parity. Operator can now run locally before push.
    # Same exit semantics as CI INF-G18 action-pinning job.
    cmds:
      - |
        if [ -f scripts/check-action-pinning.sh ]; then
          bash scripts/check-action-pinning.sh
        else
          echo "[audit:action-pinning] WARN: scripts/check-action-pinning.sh not present"
          exit 0
        fi

  audit:divergence-matrix:
    desc: "Plan T5.2 audit — local↔prod divergence matrix integrity (matches infra-gates.yml CI gate)"
    # Per ADR D5: every code marker `LOCAL ONLY (LP-NNN)` must have a matrix entry.
    # T5.3 of plan 2026-05-22: migrated from check-divergence-matrix.sh to pure-Go gate.
    cmds:
      - cd cmd/loopzero-ops && go run . quality divergence-matrix --root "{{.ROOT_DIR}}"

  audit:charts-schema-present:
    desc: "INF-G17 audit — values.schema.json presence on every OCI chart (matches infra-gates.yml CI gate)"
    # Mirrors infra-gates.yml 'INF-G17: Chart schema validation' step.
    # Library chart loopzero-common is exempt (per CI convention).
    cmds:
      - |
        MISSING=()
        for chart in charts/*/; do
          chart_name=$(basename "$chart")
          if [ "$chart_name" = "loopzero-common" ]; then continue; fi
          if [ ! -f "$chart/values.schema.json" ]; then
            MISSING+=("$chart_name")
          fi
        done
        if [ ${#MISSING[@]} -gt 0 ]; then
          echo "[audit:charts-schema-present] ⚠ Charts MISSING values.schema.json:"
          for m in "${MISSING[@]}"; do echo "  - $m"; done
          exit 1
        fi
        echo "[audit:charts-schema-present] ✓ All OCI charts (excl. loopzero-common library) have values.schema.json"

  setup:
    desc: |
      Full setup from scratch — clusters + infra + networking + CRDs + DB + tokens + standalone bootstrap.

      Per T3.2 of docs/plans/2026-05-22-shell-script-strategic-plan.md v1.3:
      `task setup` builds the PLATFORM (one-shot install). The DEV LOOP is `tilt up`.
      See docs/operations/dev-loop.md for the canonical developer workflow.
    cmds:
      # T3.2 deprecation notice — operators should run `tilt up` after `task setup`
      # to enter the dev loop. `task setup` only PROVISIONS; it does not iterate.
      - echo "[NOTICE] task setup creates platform infrastructure. Dev loop is via 'tilt up'."
      - echo "[NOTICE] See docs/operations/dev-loop.md for canonical workflow."
      - task: registry:create
      - task: clusters:create
      - task: images:build
      - task: infra:install
      - task: networking:setup
      - task: crds:install
      - task: db:migrate
      - task: dev:seed
      - task: tokens:provision
      - task: bootstrap:standalone

  bootstrap:standalone:
    desc: |
      Standalone-mode bootstrap that closes gaps left by `task setup` for
      cleanroom dogfood. Production helmfile sync runs all of these as
      post-sync hooks; standalone (k3d) does not, so we run them explicitly.

      Full B-patch index (B9-B82+) lives in CHANGELOG.md under
      "Cleanroom Dogfood Loop" / "Drill L2 Phase 2 (drill-l2-phase2)"
      sections. Each step below corresponds to one or more codified patches
      from those loops. T5.5 (plan 2026-05-21-deep-review-remediation)
      replaced the stale partial B9-B24 enumeration that used to live here
      with this canonical pointer — the comment was missing 80%+ of the
      actual patches (B14, B15, B17-19, B22, B23, B25-82+).
    cmds:
      - bash infra/helmfile/scripts/generate-secrets.sh standalone mgmt
      - task: k3d:bootstrap-workload
      - bash infra/helmfile/scripts/bootstrap-eso-cluster-secret-store.sh
      - HYDRA_NAMESPACE=loopzero-auth bash infra/helmfile/scripts/bootstrap-oauth-clients.sh
      - bash infra/scripts/provision-api-tokens.sh
      # T5.3 (plan 2026-05-21-deep-review-remediation): extracted 4 inline
      # B-patches to named scripts so each can be re-run individually if
      # only that slice needs fixing during cleanroom debugging.
      # Run order matters — each script depends on its predecessor.
      - bash infra/helmfile/scripts/bootstrap-patch-argocd-gitea-creds.sh
      - bash infra/helmfile/scripts/bootstrap-patch-argocd-repo-server-restart.sh
      - |
        kubectl config use-context k3d-loopzero-build >/dev/null 2>&1
        bash infra/helmfile/scripts/generate-build-secrets.sh standalone
        kubectl config use-context k3d-loopzero-mgmt >/dev/null 2>&1
      - bash infra/helmfile/scripts/bootstrap-patch-sigstore-policy-controller.sh
      - bash infra/helmfile/scripts/bootstrap-patch-admission-policies.sh
      # 2026-05-14 (plan T0.2): provision runtime-2 platform BEFORE the
      # CC bootstrap so cell-2 has a reachable workload destination.
      - task: k3d:bootstrap-runtime-2
      # 2026-05-14 (plan T0.1): bootstrap all three cells atomically
      # (cell-default + cell-1 + cell-2). Closes CTO Golden Rule #1 gap.
      - task: k3d:bootstrap-cells
      - HYDRA_NAMESPACE=loopzero-auth bash infra/helmfile/scripts/seed-local-user.sh
      - bash infra/scripts/bootstrap-seed-tenant-cr.sh

  dev:up:
    desc: Boot dev environment (clusters + Helm deps). Run `tilt up` separately for the dev loop.
    cmds:
      - task: setup
      - echo "Clusters and dependencies are ready. Run 'tilt up' to start the dev loop."

  k3d:bootstrap-workload:
    desc: |
      Bootstrap the workload (k3d-loopzero-workload) cluster with cert-manager +
      traefik + external-secrets + argo-rollouts via helmfile. Idempotent —
      `helmfile sync` no-ops if releases match desired state. Required after
      fresh `k3d cluster create loopzero-workload` (the runtime helmfile usually
      only runs in production cells).
      Discovered LIVE 2026-04-30: ArgoCD app sync to runtime fails with
      "Certificate CRD not found" until this is run.

      F-21 fix (2026-05-07, argo-rollouts-progressive-delivery-plan T0.2):
      argo-rollouts MUST be in this list. Without it, fresh cleanroom
      bootstrap leaves the workload cluster without the Rollouts CRD, so
      every `loopzero deploy` (default-on progressive delivery) fails to
      apply the Rollout manifest and the journey suite cannot run.
    cmds:
      - helmfile -f infra/helmfile/runtime.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-workload --selector name=cert-manager sync
      - helmfile -f infra/helmfile/runtime.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-workload --selector name=traefik sync
      - helmfile -f infra/helmfile/runtime.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-workload --selector name=external-secrets sync
      - helmfile -f infra/helmfile/runtime.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-workload --selector name=argo-rollouts sync

  k3d:bootstrap-runtime-2:
    desc: |
      Bootstrap the runtime-2 (k3d-loopzero-runtime-2) cluster with cert-manager
      + traefik + external-secrets + argo-rollouts via helmfile. Mirrors
      `k3d:bootstrap-workload` but targets the runtime-2 cluster.

      Plan: 2026-05-14-dogfood-findings-and-multi-cell-coverage T0.2
      Closes CTO Golden Rule #1 gap (cleanroom must be multi-cell by default).

      EC-1 pre-step: H4 hostAlias must be applied to runtime-2 nodes so
      helmfile can pull loopzero-packs/cosign/syft images from the local k3d
      registry. Without this, pods land in ImagePullBackOff. The
      `task k3d:heal` invocation below also covers runtime-2 (extended
      2026-05-14).

      Idempotent: helmfile sync no-ops if releases match desired state.
    cmds:
      - task: k3d:heal
      - helmfile -f infra/helmfile/runtime.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-runtime-2 --selector name=cert-manager sync
      - helmfile -f infra/helmfile/runtime.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-runtime-2 --selector name=traefik sync
      - helmfile -f infra/helmfile/runtime.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-runtime-2 --selector name=external-secrets sync
      - helmfile -f infra/helmfile/runtime.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-runtime-2 --selector name=argo-rollouts sync

  k3d:bootstrap-cells:
    desc: |
      Bootstrap the three ClusterCredential CRs (cell-default, cell-1, cell-2)
      atomically. cell-default + cell-1 map to k3d-loopzero-workload; cell-2 maps
      to k3d-loopzero-runtime-2 (real multi-cell placement).

      Plan: 2026-05-14-dogfood-findings-and-multi-cell-coverage T0.1.
      Idempotent. Failures (cluster missing) abort early with clear msg.
    cmds:
      # Plan v1.2 T4.2: consolidated bootstrap-cell-cc.sh --cell --env
      - bash infra/helmfile/scripts/bootstrap-cell-cc.sh --cell default --env standalone-multi
      - bash infra/helmfile/scripts/bootstrap-cell-cc.sh --cell 1 --env standalone-multi
      - bash infra/helmfile/scripts/bootstrap-cell-cc.sh --cell 2 --env standalone-multi

  k3d:heal:
    desc: |
      Idempotent recovery of cross-cluster connectivity in local k3d standalone-multi
      after `k3d cluster stop/start` cycles. Codifies the 9 manual workarounds
      (H1-H9) discovered LIVE during dogfood E2E unblock 2026-04-30:
        H1 — reattach build/runtime nodes to shared k3d-loopzero network
        H2 — refresh loopzero-cluster-kubeconfigs Secret with current IPs (insecure-skip-tls)
        H3 — recreate ArgoCD cluster Secrets (force discovery cache invalidate)
        H4 — add k3d-loopzero-registry hostAlias to /etc/hosts on build + runtime nodes
        H5 — bind kube-system:default SA to cluster-admin in build + runtime (LOCAL-ONLY)
        H6 — empty buildkit-registry-config when DOCR creds absent
        H7 — loopzero-minio-credentials with mgmt NodePort URL
        H8 — LOOPZERO_*_IMAGE env overrides on loopzero-api Deployment
        H9 — loopzero-build-cwts release with images.cloneRunner local registry override
      Production has scoped SAs + permanent helmfile values; this is a LOCAL-DEV recovery only.
      Safe to re-run after every restart.
    cmds:
      - bash infra/scripts/k3d-cross-cluster-heal.sh

  cli:link:
    desc: Symlink 'loopzero' CLI to PATH (makes `loopzero` available globally)
    cmds:
      - cd cli && npm link
    status:
      - which loopzero

  cli:build:
    desc: Build CLI from TypeScript source
    cmds:
      - cd cli && npm run build

  test:
    desc: Run all tests (unit + lint + manifest validation)
    cmds:
      - task: test:unit
      - task: lint
      - task: validate:manifests

  # parity:* + validate:matrix* migrated to taskfiles/test.yml (plan T1.3 iter 1).


  # ---------------------------------------------------------------------------
