version: "3"

# Use bash — required for process management and here-docs.
# Default shell on Ubuntu is dash, which lacks `source` and reliable `$!` / `kill`.
shell:
  - bash
  - --noprofile
  - --norc
  - -c

# Load credentials from .env files (precedence: later file overrides earlier).
# Operator stores D7' drill credentials in .env per user directive 2026-05-16
# (iter 10 — drill-l2-unlock plan); .env.local allows local-only overrides.
# See concepts/operations/operator-handoff-2026-05-16-drill-l2-phase4.md.
dotenv:
  - .env
  - .env.local

# Plan T1.3 — Taskfile split via includes (foundation iter 1; per-domain migration ongoing).
# Each include's tasks are merged into the root namespace by Task v3 (no namespace prefix
# unless the included file uses prefixes itself like `parity:foo:`).
# `_legacy` namespace is reserved during transition; remove when domain stubs are populated.
includes:
  testfile:
    taskfile: ./taskfiles/test.yml
    flatten: true
  helmfile:
    taskfile: ./taskfiles/helm.yml
    flatten: true
  infrafile:
    taskfile: ./taskfiles/infra.yml
    flatten: true
  devfile:
    taskfile: ./taskfiles/dev.yml
    flatten: true
  dbfile:
    taskfile: ./taskfiles/db.yml
    flatten: true
  k3dfile:
    taskfile: ./taskfiles/k3d.yml
    flatten: true
  securityfile:
    taskfile: ./taskfiles/security.yml
    flatten: true
  observabilityfile:
    taskfile: ./taskfiles/observability.yml
    flatten: true
  drill:
    taskfile: ./taskfiles/drill.yml
    optional: false
  quality:
    taskfile: ./taskfiles/quality.yml

vars:
  CORE_CONTEXT: k3d-loopzero-core
  BUILD_CONTEXT: k3d-loopzero-build
  CELL_0_CONTEXT: k3d-loopzero-cell-0
  # cell-1-activation-plan T0.1 — second runtime cluster mapped to cells.cell_id='cell-1'.
  # Provisioned by infra/k3d/cell-1-cluster.yaml. Cluster name `loopzero-cell-1`
  # matches production wire-clusters.sh + Pulumi convention (LOOPZERO_RUNTIME2_KUBECONFIG).
  # ClusterCredential CR is named `cell-1` with spec.clusterName=loopzero-cell-1.
  # Status starts 'maintenance' in cells SQL table (migration 000006); migration
  # 000007 flips to 'active' after cell-1 activation invariants pass (now Ginkgo: ginkgo --label-filter=parity --focus='Cell-2 Activation', migrated from cell2-activation-gates.sh TB1.1 2026-05-24).
  CELL_1_CONTEXT: k3d-loopzero-cell-1
  # Standardized port-forward ports (avoid conflicts between tasks)
  PG_PORT: 15432
  PG_HOST: localhost
  # DEV-ONLY credentials — safe for local k3d clusters, never used in production.
  # Override via .env.local (loaded by dotenv above) or environment variables.
  PG_USER: '{{.PG_USER | default "loopzero"}}'
  PG_PASS: '{{.PG_PASS | default "loopzero-dev-password"}}'
  PG_DB: '{{.PG_DB | default "loopzero"}}'
  API_PORT: 13001
  GRAFANA_PORT: 3002
  PROMETHEUS_PORT: 9090
  # Test report output directory
  REPORT_DIR: .test-reports

tasks:
  # ===========================================================================
  # QA Tooling — Environment verification and diagnostics
  # ===========================================================================

  check:
    desc: >
      Sprint canonical post-cleanroom check — aggregates the 8 category probes
      (helmfile · configmaps · networking · auth · webhook · observability ·
      integrity · cleanroom-guards) into a PASS/WARN/FAIL report. COMPLEMENTAR
      a `task doctor` (per ADR D3 of cleanroom-canonical-5-defense-layers).
      Wired in the Cleanroom skill Phase 4.5. Flags: --json --category=<id>
      --hermetic --fail-fast.
    cmds:
      - bash infra/scripts/local/check-sprint.sh {{.CLI_ARGS}}

  # ===========================================================================
  # QA Tooling — E2E test preparation
  # ===========================================================================

  install:sops:
    desc: "Plan v1.2 T7.1 — install sops + age + helm-secrets plugin for secrets-in-git encryption (D6)"
    cmds:
      - |
        set -e
        echo "[install:sops] Installing sops + age..."
        if command -v sops >/dev/null && command -v age >/dev/null; then
          echo "[install:sops] sops + age already installed."
        elif command -v brew >/dev/null; then
          brew install sops age
        elif command -v apt-get >/dev/null; then
          sudo apt-get install -y age
          curl -fsSL https://github.com/getsops/sops/releases/latest/download/sops-v3.10.2.linux.amd64 -o /tmp/sops
          sudo install /tmp/sops /usr/local/bin/sops
        else
          echo "[install:sops] ERROR: install brew or apt first; or install sops + age manually." >&2
          exit 1
        fi
        echo "[install:sops] Installing helm-secrets plugin..."
        if helm plugin list 2>/dev/null | grep -q secrets; then
          echo "[install:sops] helm-secrets plugin already installed."
        else
          helm plugin install https://github.com/jkroepke/helm-secrets || true
        fi
        echo "[install:sops] Verify:"
        sops --version
        age --version
        helm secrets --version
        echo ""
        echo "[install:sops] Next: generate age keypair + update .sops.yaml recipients:"
        echo "  age-keygen -o ~/.config/sops/age/keys.txt"
        echo "  age-keygen -y ~/.config/sops/age/keys.txt   # public key for .sops.yaml"

  audit:secrets:
    desc: "Plan v1.2 T7.2 — audit repo for plaintext secrets that should be SOPS-encrypted"
    cmds:
      - |
        set -e
        echo "[audit:secrets] Scanning for plaintext private keys + suspicious patterns..."
        # Patterns: BEGIN PRIVATE KEY, api_key, secret_key inline (not in tests/docs)
        HITS=$(grep -rE "BEGIN [A-Z ]*PRIVATE KEY|api[_-]?key:\s+['\"]?[a-zA-Z0-9]{20,}|secret[_-]?key:\s+['\"]?[a-zA-Z0-9]{20,}" \
          --include='*.yaml' --include='*.yml' --include='*.json' \
          infra/ charts/ 2>&1 \
          | grep -vE "(_test\.|/test/|/__tests__/|REPLACE_|placeholder|stub|example)" \
          | grep -vE "schema|\.lock" \
          | head -30 || true)
        if [[ -n "$HITS" ]]; then
          echo "[audit:secrets] ⚠ Potential plaintext secrets found:"
          echo "$HITS"
          echo ""
          echo "[audit:secrets] Encrypt them: source infra/scripts/lib/sops.sh && sops_encrypt FILE"
          exit 1
        else
          echo "[audit:secrets] ✓ No plaintext secrets detected in tracked YAML/JSON."
        fi

  audit:security-context:
    desc: "INF-G08 audit — pod/container securityContext hardening"
    # Local task home for scripts/audit-security-context.sh --gate. (Was also
    # an infra-gates.yml CI step until GitHub Actions was removed 2026-05-23;
    # this task is now the canonical runner — wire it into the real CI if any.)
    cmds:
      - bash scripts/audit-security-context.sh --gate

  audit:action-pinning:
    desc: "INF-G18 audit — GitHub Action SHA pinning (matches infra-gates.yml CI gate)"
    # 2026-05-20 CI/local parity. Operator can now run locally before push.
    # Same exit semantics as CI INF-G18 action-pinning job.
    cmds:
      - |
        if [ -f scripts/check-action-pinning.sh ]; then
          bash scripts/check-action-pinning.sh
        else
          echo "[audit:action-pinning] WARN: scripts/check-action-pinning.sh not present"
          exit 0
        fi

  audit:divergence-matrix:
    desc: "Plan T5.2 audit — local↔prod divergence matrix integrity (matches infra-gates.yml CI gate)"
    # Per ADR D5: every code marker `LOCAL ONLY (LP-NNN)` must have a matrix entry.
    # T5.3 of plan 2026-05-22: migrated from check-divergence-matrix.sh to pure-Go gate.
    cmds:
      - cd cmd/loopzero-ops && go run . quality divergence-matrix --root "{{.ROOT_DIR}}"

  audit:charts-schema-present:
    desc: "INF-G17 audit — values.schema.json presence on every OCI chart (matches infra-gates.yml CI gate)"
    # Mirrors infra-gates.yml 'INF-G17: Chart schema validation' step.
    # Library chart loopzero-common is exempt (per CI convention).
    cmds:
      - |
        MISSING=()
        for chart in charts/*/; do
          chart_name=$(basename "$chart")
          if [ "$chart_name" = "loopzero-common" ]; then continue; fi
          if [ ! -f "$chart/values.schema.json" ]; then
            MISSING+=("$chart_name")
          fi
        done
        if [ ${#MISSING[@]} -gt 0 ]; then
          echo "[audit:charts-schema-present] ⚠ Charts MISSING values.schema.json:"
          for m in "${MISSING[@]}"; do echo "  - $m"; done
          exit 1
        fi
        echo "[audit:charts-schema-present] ✓ All OCI charts (excl. loopzero-common library) have values.schema.json"

  setup:
    desc: |
      Full setup from scratch — clusters + infra + networking + CRDs + DB + tokens + standalone bootstrap.

      Per T3.2 of 2026-05-22-shell-script-strategic-plan v1.3:
      `task setup` builds the PLATFORM (one-shot install). The DEV LOOP is `tilt up`.
      See docs/operations.md for the canonical developer workflow.
    cmds:
      # T3.2 deprecation notice — operators should run `tilt up` after `task setup`
      # to enter the dev loop. `task setup` only PROVISIONS; it does not iterate.
      - echo "[NOTICE] task setup creates platform infrastructure. Dev loop is via 'tilt up'."
      - echo "[NOTICE] See docs/operations.md for canonical workflow."
      - task: registry:create
      - task: clusters:create
      - task: images:build
      # Vendoriza dependencias ANTES do install: `charts/*/charts/` e gitignored, entao
      # um clone novo nao tem nenhuma. Sem este passo, `task setup` reprovava num clone
      # limpo (medido 2026-08-10 no droplet app-dev: loopzero-crds, depois opencost).
      - task: validate:helm-deps
      - task: infra:install
      - task: networking:setup
      - task: crds:install
      # CANONICAL ORDER FIX 2026-06-15 (dev-public Cleanroom chain-gap closure):
      #
      # ORIGINAL chain (broken): infra:install → db:migrate ❌ (loopzero-api in
      #   CrashLoopBackOff because Secrets missing) → dev:seed → tokens:provision
      #   → bootstrap:standalone (creates Secrets + CCs + seed-local-user).
      #
      # The reorder MUST split bootstrap:standalone into 2 phases:
      #   pre-db (Secrets + ClusterCredentials + ArgoCD wiring; no DB tables
      #     needed) — these make loopzero-api Ready so db:migrate works.
      #   post-db (seed-local-user + bootstrap-seed-tenant-cr) — these write
      #     to `users`/`tenants` tables which only exist after db:migrate.
      #
      # NEW chain (canonical):
      #   infra:install (wait:false on bootstrap-deps charts so helmfile
      #     completes; loopzero-api/operators/cloud cycle CrashLoopBackOff until
      #     deps arrive)
      #   bootstrap:standalone:pre-db (provisions Secrets + CCs → loopzero-api Ready)
      #   db:migrate (kubectl exec loopzero-api works — Ready)
      #   bootstrap:standalone:post-db (seed-local-user + tenant CR)
      #   dev:seed (extra dev fixtures)
      #   tokens:provision (idempotent — script already invoked inside pre-db)
      #
      # Sponsor "sem WORKAROUNDs" closure of [[feedback_task_setup_chain_gap_helm_timeout]].
      - task: bootstrap:standalone:pre-db
      - task: db:migrate
      - task: bootstrap:standalone:post-db
      - task: dev:seed
      - task: tokens:provision

  bootstrap:standalone:
    desc: |
      Legacy alias for the FULL bootstrap chain (pre-db + post-db). Kept for
      operator backwards compatibility (some runbooks invoke `task
      bootstrap:standalone` directly). Internally now delegates to the 2-phase
      canonical order. Per CANONICAL ORDER FIX 2026-06-15 — see `task setup`.
    cmds:
      - task: bootstrap:standalone:pre-db
      - task: bootstrap:standalone:post-db

  bootstrap:standalone:pre-db:
    desc: |
      PRE-DB phase of standalone bootstrap (CANONICAL ORDER FIX 2026-06-15).
      Provisions Secrets + ClusterCredentials + ArgoCD wiring + Sigstore + cells
      — everything that does NOT touch DB tables. Makes loopzero-api Ready so the
      next step (db:migrate) can `kubectl exec` to apply migrations.

      Full B-patch index (B9-B82+) lives in CHANGELOG.md under
      "Cleanroom Dogfood Loop" / "Drill L2 Phase 2 (drill-l2-phase2)"
      sections. Each step below corresponds to one or more codified patches
      from those loops. T5.5 (plan 2026-05-21-deep-review-remediation)
      replaced the stale partial B9-B24 enumeration that used to live here
      with this canonical pointer — the comment was missing 80%+ of the
      actual patches (B14, B15, B17-19, B22, B23, B25-82+).
    cmds:
      - bash infra/helmfile/scripts/generate-secrets.sh standalone core
      - task: k3d:bootstrap-cell-0
      - bash infra/helmfile/scripts/bootstrap-eso-cluster-secret-store.sh
      - HYDRA_NAMESPACE=loopzero-auth bash infra/helmfile/scripts/bootstrap-oauth-clients.sh
      - bash infra/scripts/production/provision-api-tokens.sh
      # T5.3 (plan 2026-05-21-deep-review-remediation): extracted 4 inline
      # B-patches to named scripts so each can be re-run individually if
      # only that slice needs fixing during cleanroom debugging.
      # Run order matters — each script depends on its predecessor.
      - bash infra/helmfile/scripts/bootstrap-patch-argocd-gitea-creds.sh
      - bash infra/helmfile/scripts/bootstrap-patch-argocd-repo-server-restart.sh
      # Issue #117 — the switch-and-restore dance that used to wrap this call was
      # a ROOT CAUSE of the bug it was meant to serve. Under `set -e`, a failure
      # in the script skipped the restore line and left the operator pinned to
      # k3d-loopzero-build; every later step in the chain then ran against the build
      # cluster. That is verbatim the "residue from a prior session" repro of
      # #117 — `task setup` manufactured the condition that broke its own next
      # run. generate-build-secrets.sh now pins its own context by construction
      # (KUBECTL_CONTEXT + a kubectl() wrapper), so no global mutation is needed.
      - bash infra/helmfile/scripts/generate-build-secrets.sh standalone
      - bash infra/helmfile/scripts/bootstrap-patch-sigstore-policy-controller.sh
      - bash infra/helmfile/scripts/bootstrap-patch-admission-policies.sh
      # M07 LIVE keyless GREEN (Ralph iter 5 2026-05-28): Sigstore local stack
      # for cosign keyless signing (Fulcio + Rekor + CTLog + sigstore-extras
      # NetworkPolicies + dynamic K3s CACert config). Opt-out via env
      # SKIP_SIGSTORE_LOCAL=1 (e.g., for fast iteration without M07 path).
      # Idempotent: re-running on existing state is safe. Adds ~5min to setup.
      - |
        if [ "${SKIP_SIGSTORE_LOCAL:-0}" != "1" ]; then
          bash infra/scripts/local/bootstrap-sigstore-local.sh || \
            echo "[WARN] bootstrap-sigstore-local.sh failed — M07 LIVE keyless path will not work. Continuing."
        else
          echo "[NOTICE] SKIP_SIGSTORE_LOCAL=1 — skipping Sigstore LOCAL stack bootstrap"
        fi
      # 2026-05-14 (plan T0.2): provision runtime-2 platform BEFORE the
      # CC bootstrap so cell-1 has a reachable workload destination.
      - task: k3d:bootstrap-cell-1
      # 2026-05-14 (plan T0.1): bootstrap all three cells atomically
      # (cell-0 + cell-0 + cell-1). Closes CTO Golden Rule #1 gap.
      - task: k3d:bootstrap-cells

  bootstrap:standalone:post-db:
    desc: |
      POST-DB phase of standalone bootstrap (CANONICAL ORDER FIX 2026-06-15).
      Steps that write to DB tables — MUST run AFTER db:migrate has created
      schema (users, tenants, etc.). Idempotent: re-running on existing
      rows is safe (UPSERT semantics + ON CONFLICT).
    cmds:
      - HYDRA_NAMESPACE=loopzero-auth bash infra/helmfile/scripts/seed-local-user.sh
      - bash infra/scripts/local/bootstrap-seed-tenant-cr.sh

  dev:up:
    desc: Boot dev environment (clusters + Helm deps). Run `tilt up` separately for the dev loop.
    cmds:
      - task: setup
      - echo "Clusters and dependencies are ready. Run 'tilt up' to start the dev loop."

  k3d:bootstrap-cell-0:
    desc: |
      Bootstrap the workload (k3d-loopzero-cell-0) cluster with cert-manager +
      traefik + external-secrets + argo-rollouts via helmfile. Idempotent —
      `helmfile sync` no-ops if releases match desired state. Required after
      fresh `k3d cluster create loopzero-cell-0` (the runtime helmfile usually
      only runs in production cells).
      Discovered LIVE 2026-04-30: ArgoCD app sync to runtime fails with
      "Certificate CRD not found" until this is run.

      F-21 fix (2026-05-07, argo-rollouts-progressive-delivery-plan T0.2):
      argo-rollouts MUST be in this list. Without it, fresh cleanroom
      bootstrap leaves the workload cluster without the Rollouts CRD, so
      every `loopzero deploy` (default-on progressive delivery) fails to
      apply the Rollout manifest and the journey suite cannot run.

      D-FF-03 fix (2026-05-27, /dogfood live): cluster-issuer MUST be in
      this list. Without it, `loopzero deploy` succeeds at build but fails at
      ArgoCD sync with "Referenced ClusterIssuer not found: loopzero-ca-issuer"
      — every Certificate stays in Issuing forever and ArgoCD app stays
      OutOfSync/Missing waiting for healthy state. Discovered LIVE during
      dogfood 2026-05-27: 5 of 8 Ginkgo journey failures all root-caused
      to missing ClusterIssuer.
    cmds:
      - LOOPZERO_CELL_CONTEXT=k3d-loopzero-cell-0 helmfile -f infra/helmfile/cell.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-cell-0 --selector name=cert-manager sync
      - LOOPZERO_CELL_CONTEXT=k3d-loopzero-cell-0 helmfile -f infra/helmfile/cell.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-cell-0 --selector name=cluster-issuer sync
      - LOOPZERO_CELL_CONTEXT=k3d-loopzero-cell-0 helmfile -f infra/helmfile/cell.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-cell-0 --selector name=traefik sync
      - LOOPZERO_CELL_CONTEXT=k3d-loopzero-cell-0 helmfile -f infra/helmfile/cell.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-cell-0 --selector name=external-secrets sync
      - LOOPZERO_CELL_CONTEXT=k3d-loopzero-cell-0 helmfile -f infra/helmfile/cell.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-cell-0 --selector name=argo-rollouts sync

  k3d:bootstrap-build-cert-manager:
    desc: |
      Bootstrap cert-manager + cluster-issuer em loopzero-build cluster.
      Required ANTES de Pulumi up Sigstore stack (per plan 2026-05-27-M07).
      Sigstore Fulcio/Rekor/CTLog precisam TLS internos via loopzero-ca-issuer.
      Idempotente — helmfile sync no-ops se já deployed.
    cmds:
      - LOOPZERO_CELL_CONTEXT=k3d-loopzero-build helmfile -f infra/helmfile/cell.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-build --selector name=cert-manager sync
      - LOOPZERO_CELL_CONTEXT=k3d-loopzero-build helmfile -f infra/helmfile/cell.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-build --selector name=cluster-issuer sync

  k3d:bootstrap-cell-1:
    desc: |
      Bootstrap the second cell cluster (k3d-loopzero-cell-1) with cert-manager
      + traefik + external-secrets + argo-rollouts via helmfile. Mirrors
      `k3d:bootstrap-cell-0` but targets the second cell.

      Plan: 2026-05-14-dogfood-findings-and-multi-cell-coverage T0.2
      Closes CTO Golden Rule #1 gap (cleanroom must be multi-cell by default).

      EC-1 pre-step: H4 hostAlias must be applied to runtime-2 nodes so
      helmfile can pull loopzero-packs/cosign/syft images from the local k3d
      registry. Without this, pods land in ImagePullBackOff. The
      `task k3d:heal` invocation below also covers runtime-2 (extended
      2026-05-14).

      D-FF-03 fix (2026-05-27, /dogfood live): cluster-issuer MUST be in
      this list — same reason as k3d:bootstrap-cell-0 above. Otherwise
      tenants pinned to cell-1 have no ClusterIssuer for cert-manager.

      Idempotent: helmfile sync no-ops if releases match desired state.
    cmds:
      - task: k3d:heal
      - LOOPZERO_CELL_CONTEXT=k3d-loopzero-cell-1 helmfile -f infra/helmfile/cell.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-cell-1 --selector name=cert-manager sync
      - LOOPZERO_CELL_CONTEXT=k3d-loopzero-cell-1 helmfile -f infra/helmfile/cell.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-cell-1 --selector name=cluster-issuer sync
      - LOOPZERO_CELL_CONTEXT=k3d-loopzero-cell-1 helmfile -f infra/helmfile/cell.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-cell-1 --selector name=traefik sync
      - LOOPZERO_CELL_CONTEXT=k3d-loopzero-cell-1 helmfile -f infra/helmfile/cell.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-cell-1 --selector name=external-secrets sync
      - LOOPZERO_CELL_CONTEXT=k3d-loopzero-cell-1 helmfile -f infra/helmfile/cell.helmfile.yaml.gotmpl -e standalone-multi --kube-context k3d-loopzero-cell-1 --selector name=argo-rollouts sync

  k3d:bootstrap-cells:
    desc: |
      Bootstrap the three ClusterCredential CRs (cell-0, cell-0, cell-1)
      atomically. cell-0 + cell-0 map to k3d-loopzero-cell-0; cell-1 maps
      to k3d-loopzero-cell-1 (real multi-cell placement).

      Plan: 2026-05-14-dogfood-findings-and-multi-cell-coverage T0.1.
      Idempotent. Failures (cluster missing) abort early with clear msg.

      Sprint A 2026-06-01 post-cleanroom finding: Each `bootstrap-cell-cc.sh`
      invocation creates an ArgoCD `cluster` Secret via kubectl apply. When
      these three Secrets land sequentially AFTER the argocd-application-controller
      statefulset is already Running (controller.replicas=3 with consistent-hashing
      sharding per `infra/helm/argocd/values.yaml`), the controllers can read
      intermediate Secret-set state and end up with shards permanently mis-
      assigned. Symptom: every Application's status.sync = "" forever, with
      "Ignoring cluster" log spam. LIVE-validated in fresh cleanroom 2026-06-01:
      `tn-e2etest-production` App stuck EMPTY/EMPTY until restart, restart
      converged to Synced+Healthy in <30s with zero "Ignoring" logs.
      Fix: restart the statefulset AFTER all 3 Secrets exist, so all 3
      controller replicas boot with the final Secret set in their informer
      cache. Idempotent (safe to re-run; no-op if no Secret changes).
    cmds:
      # Plan v1.2 T4.2: consolidated bootstrap-cell-cc.sh --cell --env
      # Duas chamadas, nao tres: `default` e `1` apontavam para o mesmo cluster.
      - bash infra/helmfile/scripts/bootstrap-cell-cc.sh --cell 0 --env standalone-multi
      - bash infra/helmfile/scripts/bootstrap-cell-cc.sh --cell 1 --env standalone-multi
      # Sprint A 2026-06-01 — refresh app-controller informer cache so all
      # 3 replicas see the final set of cluster Secrets at boot.
      - kubectl --context k3d-loopzero-core -n argocd rollout restart statefulset/argocd-application-controller
      - kubectl --context k3d-loopzero-core -n argocd rollout status statefulset/argocd-application-controller --timeout=180s

  k3d:heal:
    desc: |
      Idempotent recovery of cross-cluster connectivity in local k3d standalone-multi
      after `k3d cluster stop/start` cycles. Codifies the 9 manual workarounds
      (H1-H9) discovered LIVE during dogfood E2E unblock 2026-04-30:
        H1 — reattach build/runtime nodes to shared k3d-loopzero network
        H2 — refresh loopzero-cluster-kubeconfigs Secret with current IPs (insecure-skip-tls)
        H3 — recreate ArgoCD cluster Secrets (force discovery cache invalidate)
        H4 — add k3d-loopzero-registry hostAlias to /etc/hosts on build + runtime nodes
        H5 — bind kube-system:default SA to cluster-admin in build + runtime (LOCAL-ONLY)
        H6 — empty buildkit-registry-config when DOCR creds absent
        H7 — loopzero-minio-credentials with mgmt NodePort URL
        H8 — LOOPZERO_*_IMAGE env overrides on loopzero-api Deployment
        H9 — loopzero-build-cwts release with images.cloneRunner local registry override
      Production has scoped SAs + permanent helmfile values; this is a LOCAL-DEV recovery only.
      Safe to re-run after every restart.
    cmds:
      - bash infra/scripts/local/k3d-cross-cluster-heal.sh

  # `cli:link` and `cli:build` lived here until 2026-07-30 (issue #254, CHG-2026-07-30-001).
  # Both ran `cd cli && npm …`, but `cli/` left this repository at M2 of the monorepo
  # decomposition (ADR ../decisions/2026-06-16-monorepo-decomposition.md) — so they had been
  # failing with a raw `cd: cli: No such file or directory` for anyone who typed them. Nothing
  # invoked them, so nothing ever went red.
  #
  # Deliberately NOT repointed at `../loopzero-cli`: a task here reaching across a repository
  # boundary reintroduces exactly the coupling M2 removed, and would silently no-op when the
  # sibling is not cloned. Build the CLI in the repo that owns it.
  #
