<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300">
  <style>
    text { font-family: monospace; font-size: 12px; }
    .title { font-size: 16px; font-weight: bold; }
    .count { font-size: 14px; font-weight: bold; fill: white; }
    .label { font-size: 12px; fill: #333; }
  </style>
  <text x="250" y="25" text-anchor="middle" class="title">Findings by Severity (31 total)</text>
  
  <!-- Bars -->
  <rect x="60" y="50" width="60" height="180" fill="#F44336" rx="4"/>
  <text x="90" y="150" text-anchor="middle" class="count">2</text>
  <text x="90" y="250" text-anchor="middle" class="label">Critical</text>
  
  <rect x="160" y="50" width="100" height="180" fill="#FF5722" rx="4"/>
  <text x="210" y="150" text-anchor="middle" class="count">10</text>
  <text x="210" y="250" text-anchor="middle" class="label">High</text>
  
  <rect x="290" y="80" width="80" height="150" fill="#FF9800" rx="4"/>
  <text x="330" y="165" text-anchor="middle" class="count">12</text>
  <text x="330" y="250" text-anchor="middle" class="label">Medium</text>
  
  <rect x="400" y="130" width="60" height="100" fill="#4CAF50" rx="4"/>
  <text x="430" y="190" text-anchor="middle" class="count">7</text>
  <text x="430" y="250" text-anchor="middle" class="label">Low</text>
  
  <!-- Category breakdown -->
  <text x="250" y="280" text-anchor="middle" font-size="10" fill="#666">Completeness: 21 | Architecture: 3 | Security: 3 | Operational: 3 | Testing: 1</text>
</svg>