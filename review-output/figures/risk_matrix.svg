<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <style>
    text { font-family: monospace; font-size: 12px; }
    .title { font-size: 16px; font-weight: bold; }
    .axis { font-size: 11px; fill: #666; }
    .cell { stroke: #333; stroke-width: 1; }
  </style>
  <text x="250" y="25" text-anchor="middle" class="title">Risk Matrix — Cluster Management</text>
  
  <!-- Axes -->
  <text x="250" y="385" text-anchor="middle" class="axis">Probability →</text>
  <text x="15" y="200" text-anchor="middle" transform="rotate(-90,15,200)" class="axis">Impact →</text>
  
  <!-- Grid labels -->
  <text x="135" y="370" text-anchor="middle" class="axis">Low</text>
  <text x="255" y="370" text-anchor="middle" class="axis">Medium</text>
  <text x="375" y="370" text-anchor="middle" class="axis">High</text>
  <text x="60" y="305" text-anchor="middle" class="axis">Low</text>
  <text x="60" y="205" text-anchor="middle" class="axis">Med</text>
  <text x="60" y="105" text-anchor="middle" class="axis">High</text>
  
  <!-- Cells -->
  <rect x="80" y="40" width="120" height="100" fill="#4CAF50" opacity="0.3" class="cell"/>
  <rect x="200" y="40" width="120" height="100" fill="#FF9800" opacity="0.3" class="cell"/>
  <rect x="320" y="40" width="120" height="100" fill="#F44336" opacity="0.3" class="cell"/>
  <rect x="80" y="140" width="120" height="100" fill="#4CAF50" opacity="0.3" class="cell"/>
  <rect x="200" y="140" width="120" height="100" fill="#FF9800" opacity="0.3" class="cell"/>
  <rect x="320" y="140" width="120" height="100" fill="#FF9800" opacity="0.3" class="cell"/>
  <rect x="80" y="240" width="120" height="100" fill="#4CAF50" opacity="0.3" class="cell"/>
  <rect x="200" y="240" width="120" height="100" fill="#4CAF50" opacity="0.3" class="cell"/>
  <rect x="320" y="240" width="120" height="100" fill="#FF9800" opacity="0.3" class="cell"/>
  
  <!-- Findings -->
  <circle cx="260" cy="80" r="12" fill="#F44336"/>
  <text x="260" y="84" text-anchor="middle" fill="white" font-size="9">C:2</text>
  
  <circle cx="350" cy="80" r="16" fill="#FF5722"/>
  <text x="350" y="84" text-anchor="middle" fill="white" font-size="9">H:10</text>
  
  <circle cx="260" cy="180" r="14" fill="#FF9800"/>
  <text x="260" y="184" text-anchor="middle" fill="white" font-size="9">M:12</text>
  
  <circle cx="140" cy="280" r="10" fill="#4CAF50"/>
  <text x="140" y="284" text-anchor="middle" fill="white" font-size="9">L:7</text>
</svg>