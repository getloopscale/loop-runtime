# Same grants as base-clusterrole.yaml, written differently on purpose: block
# sequences instead of flow, keys in another order, scalars unquoted, and the
# members of each list reordered. Every one of those changes the BYTES and none
# of them changes what is granted.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: parity-probe
rules:
  - verbs:
      - watch
      - get
      - list
    resources:
      - secrets
      - configmaps
    apiGroups:
      - ""
  - verbs:
      - get
    resources:
      - tenants
    apiGroups:
      - loopzero.io
