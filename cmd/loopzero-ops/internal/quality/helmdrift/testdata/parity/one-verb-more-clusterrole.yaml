# base-clusterrole.yaml plus exactly one cell: (core)/secrets/delete. It is a
# rule of its own rather than a verb appended to the first rule, because that
# rule covers two resources and appending there would add TWO cells.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: parity-probe
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["delete"]
  - apiGroups: ["loopzero.io"]
    resources: ["tenants"]
    verbs: ["get"]
