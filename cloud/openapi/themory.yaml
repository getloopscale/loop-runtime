# cloud ↔ loopzero-data (TheMemory) — CONSUMER-EXPECTATION contract (OpenAPI 3.0.3).
# M1.4 (plan m1-4-openapi-contract-tests). This documents the subset of the
# TheMemory HTTP API that cloud/internal/themory/client.go actually calls. It is
# the CLOUD's expectation of loopzero-data; it will be reconciled with loopzero-data's
# own published spec at M4/M5 (plan Unresolved Q2). The contract test validates
# that the client's outgoing REQUESTS conform to this spec.
openapi: 3.0.3
info:
  title: TheMemory API (cloud consumer expectation)
  version: "1.0.0"

servers:
  - url: /

components:
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema: { type: string }
      description: "Bearer <master TheMemory key> (held by the cloud proxy)"
    UserId:
      name: X-LoopZero-User-Id
      in: header
      required: true
      schema: { type: string }
      description: tenant scope discriminator propagated by the cloud proxy

paths:
  /memories:
    get:
      summary: List memories for a user
      parameters:
        - { $ref: "#/components/parameters/Authorization" }
        - { $ref: "#/components/parameters/UserId" }
        - { name: limit, in: query, required: false, schema: { type: string } }
        - { name: offset, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: memory list
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /memories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: Forget (delete) one memory
      parameters:
        - { $ref: "#/components/parameters/Authorization" }
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "200": { description: deleted }
        "204": { description: deleted (no content) }
        "404": { description: not found (existence-leak-safe) }

  /metrics:
    get:
      summary: Memory metrics for a user
      parameters:
        - { $ref: "#/components/parameters/Authorization" }
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "200":
          description: metrics
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /entities:
    get:
      summary: Entities for a user/scope
      parameters:
        - { $ref: "#/components/parameters/Authorization" }
        - { $ref: "#/components/parameters/UserId" }
        - { name: scope, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: entities
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404":
          description: >
            endpoint absent at the frozen OSS P0 — the client falls back to an
            empty result (client.go Entities 404 fallback, plan D1).
