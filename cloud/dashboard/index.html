<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy.

      T2.3 of plan 2026-05-27-backend-frontend-integration v1.1 — connect-src
      is now 'self' only. The dashboard is served same-origin via the cloud
      BFF (D2 + MEET-040); every API/auth/proxy hop is a relative URL, so
      we no longer need cross-origin allow-list entries for api/accounts/auth
      subdomains.

      - script-src 'unsafe-inline' kept for /__config.js runtime injection
        (no nonce per-request — that would need container entrypoint refactor,
        deferred to v1.1 per Phase 3 acceptance).
      - style-src 'unsafe-inline' required for Radix + Tailwind v4 inline styles.
      - connect-src 'self' covers all dashboard egress (BFF proxies the rest).
        ws:/wss: kept for Vite HMR in dev (unused in prod).
        Stripe whitelist kept precautionarily (EC-13) — currently we redirect
        via window.location only, but a future Stripe Elements adoption would
        need it and the CSP cost is minimal.
      - frame-ancestors NOT enforced via meta — only via response header.
      - data:/blob:/https: in img-src cover avatars, base64 favicons, S3 assets.
    -->
    <!-- CSP: form-action must allow the Kratos public host so the dashboard's
         login/registration forms can POST cross-origin to auth.loopzero.example
         (the canonical session-cookie issuer per cookieDomain=loopzero.example).
         connect-src likewise extended for XHR flow lookups + cloud's session-
         token exchange. Per plan 2026-05-29-dashboard-public-integration-
         canonicalization Phase 8 LIVE fix 2026-06-01. -->
    <!-- CSP form-action applies to the initial POST URL AND every redirect
         target during the form submission. Google OAuth flow is: POST
         auth.loopzero.example → 303 → accounts.google.com. GitHub OAuth: POST
         auth.loopzero.example → 303 → github.com. Both providers must be allowed,
         otherwise CSP rejects the OIDC redirect chain mid-flight. -->
    <!-- connect-src includes auth.loopzero.example because the init flow GET XHR
         (fetch /self-service/registration/flows?id=...) reads the flow JSON
         before the user submits. The SUBMIT itself is top-level form POST
         (SameSite-Lax safe path — see submitPassword/submitOIDC), so the
         CSRF cookie travels with the navigation. cloud.loopzero.example needed
         for post-login /v1/auth/session/token JWT exchange. -->
    <!-- Plan 2026-06-04-dev-public-domain-canonicalization: CSP extended to
         allow auth-dev.loopzero.example + cloud-dev.loopzero.example so the dashboard
         hosted at app-dev.loopzero.example can complete the same flows against
         the dev-public Kratos/cloud. Stripe + Google + GitHub allowlists
         unchanged (same OAuth/Stripe apps shared between envs per D5). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://checkout.stripe.com https://*.stripe.com https://auth.loopzero.example https://auth-dev.loopzero.example https://cloud.loopzero.example https://cloud-dev.loopzero.example; form-action 'self' https://auth.loopzero.example https://auth-dev.loopzero.example https://accounts.google.com https://github.com; base-uri 'self'; object-src 'none'" />
    <!-- LoopZero brand favicons. The PNG assets in public/ are the canonical
         LoopZero mascot (committed 2026-05-19); these <link> tags re-wire them
         after the previous inline-SVG placeholder (#3ecf8e raio) shadowed
         the real brand. ico provides legacy browser fallback (sizes="any"
         lets the browser pick the embedded size that fits its slot). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <title>LoopZero — Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/__config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
