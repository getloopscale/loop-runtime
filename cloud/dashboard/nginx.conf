server {
    listen 8080;
    root /usr/share/nginx/html;

    # Hide nginx version in responses/error pages.
    server_tokens off;

    # Browser security headers (find_infra_012). The CSP is the primary
    # mitigation that limits the blast radius of any XSS — combined with the
    # dashboard no longer broadcasting the JWT over BroadcastChannel (find_sec_004),
    # this breaks the token-theft chain (CHAIN-3).
    #   - default/script/connect 'self': the SPA + its runtime /__config.js and all
    #     BFF API calls are same-origin (MEET-040), so no remote origins are needed.
    #   - style 'unsafe-inline': Tailwind and small inline style attributes require it.
    #   - frame-ancestors 'none' + X-Frame-Options DENY: clickjacking protection.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # form-action + connect-src extended to the Kratos public host so the
    # dashboard's login/registration forms POST cross-origin to auth.loopzero.example.
    # Per plan 2026-05-29-dashboard-public-integration-canonicalization Phase 8
    # LIVE fix 2026-06-01.
    # form-action covers initial POST + every redirect target during the
    # form submission. OIDC providers (Google/GitHub) are redirect targets
    # of the Kratos OAuth dance — must be listed explicitly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://auth.loopzero.example https://cloud.loopzero.example; object-src 'none'; base-uri 'self'; form-action 'self' https://auth.loopzero.example https://accounts.google.com https://github.com; frame-ancestors 'none'" always;

    location / {
        try_files $uri /index.html;
    }
}
