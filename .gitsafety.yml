# gitsafety configuration — https://github.com/paulohenriquevn/gitsafety
#
# Three keys, all optional. With no file at all the tool already works: this exists
# only to remove noise. Whatever `.gitignore` excludes already leaves the scan on its own.
#
# No entry here ignores a folder of our own code. They all describe the VALUE, so
# that a production credential in the same file keeps being flagged.

allow:
  # --- Database that only exists inside the container network ---------------------
  #
  # A host WITHOUT A DOT is a compose or Kubernetes service name — `pg-cloud`,
  # `pgvector`, `redis`, `localhost`. It is not an internet address, and the credential
  # is only valid inside that network. An FQDN (`db.production.example.com`) has a dot and
  # IS STILL flagged: that is the line separating the two.
  - "://[^@\"' ]{1,80}@[A-Za-z0-9_-]{1,60}[:/]"
  - "://[^@\"' ]{1,80}@[A-Za-z0-9_-]{1,60}$"
  # Loopback by number, which has dots and therefore does not fall under the rule above.
  - "://[^@\"' ]{1,80}@127\\.0\\.0\\.1"
  - "://[^@\"' ]{1,80}@\\[::1\\]"
  - "://[^@\"' ]{1,80}@host\\.docker\\.internal"

  # --- Kubernetes internal DNS -----------------------------------------------------
  #
  # `.svc.cluster.local` does not resolve outside the cluster. Applies to the dev manifests.
  - "://[^@\"' ]{1,80}@[A-Za-z0-9_.-]{1,80}\\.svc\\.cluster\\.local"

  # --- Hosts reserved for documentation --------------------------------------------
  #
  # RFC 2606: `example.com` and `example.org` exist precisely to serve as examples.
  - "://[^@\"' ]{1,80}@[A-Za-z0-9_.-]{1,40}\\.example\\.(com|org)"
  - "://[^@\"' ]{1,80}@<host>"

ignore:
  # Vendored third-party code: we do not write it, we do not fix it, and it carries its
  # own examples. The only folder ignored entirely.
  - "vendor/**"
