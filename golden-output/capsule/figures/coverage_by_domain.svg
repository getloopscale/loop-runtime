  <!-- Bars -->
  <rect x="100" y="30.0" width="80" height="200.0" fill="#2563EB" rx="4"/>  <text x="140" y="24.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">12</text>  <text x="140" y="250" text-anchor="middle" font-size="12" fill="#4B5563">tenant</text>  <text x="140" y="266" text-anchor="middle" font-size="12" fill="#4B5563">isolation</text>  <rect x="220" y="146.66666666666666" width="80" height="83.33333333333334" fill="#16A34A" rx="4"/>  <text x="260" y="140.66666666666666" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">5</text>  <text x="260" y="250" text-anchor="middle" font-size="12" fill="#4B5563">resource</text>  <text x="260" y="266" text-anchor="middle" font-size="12" fill="#4B5563">quotas</text>  <rect x="340" y="163.33333333333331" width="80" height="66.66666666666667" fill="#9333EA" rx="4"/>  <text x="380" y="157.33333333333331" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">4</text>  <text x="380" y="250" text-anchor="middle" font-size="12" fill="#4B5563">network</text>  <text x="380" y="266" text-anchor="middle" font-size="12" fill="#4B5563">policies</text>

