services:
  api:
    build:
      context: ./services/api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080

  web:
    build:
      context: ./services/web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8080
    depends_on:
      - api

  worker:
    build:
      context: ./services/worker
    command: celery -A worker worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
