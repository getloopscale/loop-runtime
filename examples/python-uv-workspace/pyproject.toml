[project]
name = "uv-workspace-app"
version = "0.1.0"
description = "A UV workspace monorepo example"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.0",
    "workspace-package",
]

[tool.uv.workspace]
members = ["workspace-package"]

[tool.uv.sources]
workspace-package = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
