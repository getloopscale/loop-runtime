---
# ServiceAccount for the PlatformBootstrap controller.
# Runs in loopruntime-system namespace with least-privilege RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platformbootstrap-controller
  namespace: loopruntime-system
  labels:
    app.kubernetes.io/name: platformbootstrap-controller
    app.kubernetes.io/part-of: loopruntime
    app.kubernetes.io/component: operator

---
# Role: loopruntime-system namespace permissions.
# Grants access to PlatformBootstrap CRs (namespaced), Secrets, ConfigMaps, and Events.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platformbootstrap-controller
  namespace: loopruntime-system
  labels:
    app.kubernetes.io/name: platformbootstrap-controller
    app.kubernetes.io/part-of: loopruntime
    app.kubernetes.io/component: operator
rules:
  # PlatformBootstrap CR — full reconcile access (no delete).
  - apiGroups:
      - runtime.getloopscale.com
    resources:
      - platformbootstraps
    verbs:
      - get
      - list
      - watch
      - update
  # PlatformBootstrap status subresource — controller updates phase/conditions.
  - apiGroups:
      - runtime.getloopscale.com
    resources:
      - platformbootstraps/status
    verbs:
      - get
      - update
      - patch
  # Secrets — read and write for loopruntime-platform-tokens, gitea-repo-creds, etc.
  # No delete: controller creates and updates credentials, never removes them.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - create
      - update
  # ConfigMaps — read-only for configuration.
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
  # Events — emit Kubernetes events during reconciliation.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch

---
# RoleBinding: bind the Role to the ServiceAccount in loopruntime-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platformbootstrap-controller
  namespace: loopruntime-system
  labels:
    app.kubernetes.io/name: platformbootstrap-controller
    app.kubernetes.io/part-of: loopruntime
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platformbootstrap-controller
subjects:
  - kind: ServiceAccount
    name: platformbootstrap-controller
    namespace: loopruntime-system

---
# Role: argocd namespace permissions.
# Controller creates/updates repo credential Secrets in the argocd namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platformbootstrap-controller
  namespace: argocd
  labels:
    app.kubernetes.io/name: platformbootstrap-controller
    app.kubernetes.io/part-of: loopruntime
    app.kubernetes.io/component: operator
rules:
  # Secrets — manage argocd-repo-* credential secrets.
  # No delete: credentials are created and updated, never removed by the controller.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - update

---
# RoleBinding: bind the argocd Role to the ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platformbootstrap-controller
  namespace: argocd
  labels:
    app.kubernetes.io/name: platformbootstrap-controller
    app.kubernetes.io/part-of: loopruntime
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platformbootstrap-controller
subjects:
  - kind: ServiceAccount
    name: platformbootstrap-controller
    namespace: loopruntime-system

---
# ClusterRole: cluster-scoped access to PlatformBootstrap CRD.
# CRDs are cluster-scoped resources; the controller needs to watch them
# even though PlatformBootstrap instances are namespaced.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platformbootstrap-controller
  labels:
    app.kubernetes.io/name: platformbootstrap-controller
    app.kubernetes.io/part-of: loopruntime
    app.kubernetes.io/component: operator
rules:
  - apiGroups:
      - runtime.getloopscale.com
    resources:
      - platformbootstraps
    verbs:
      - get
      - list
      - watch

---
# ClusterRoleBinding: bind the ClusterRole to the ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platformbootstrap-controller
  labels:
    app.kubernetes.io/name: platformbootstrap-controller
    app.kubernetes.io/part-of: loopruntime
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platformbootstrap-controller
subjects:
  - kind: ServiceAccount
    name: platformbootstrap-controller
    namespace: loopruntime-system
