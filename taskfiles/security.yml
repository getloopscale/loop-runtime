version: "3"

# Security domain tasks — service-auth, cosign, JWT key rotation.
# Loaded from root Taskfile.yml via `includes:` block.
#
# Each task here is documented for the operator runbook
# (concepts/operations/service-auth-ed25519-rollout-runbook.md +
#  concepts/supply-chain/cosign-key-rotation.md).

tasks:

  service-auth-ed25519:generate-keypair:
    desc: |
      Generate a new Ed25519 keypair for service-auth dual-control (ADR
      2026-05-13-service-auth-ed25519-adoption). Output is base64-encoded
      raw bytes (private 64 / public 32) ready for `pulumi config set`.

      Step 1.1 of the rollout runbook. Output goes to stdout as JSON;
      pulumi-set hints emit to stderr.

      Usage:
        task service-auth-ed25519:generate-keypair > keypair.json
        # then jq -r .private_key_b64 keypair.json | pulumi config set --secret ...
    dir: tools/gen-service-auth-ed25519
    cmds:
      - GOWORK=off go run .

  service-auth-ed25519:test-helper:
    desc: Run the gen-service-auth-ed25519 unit tests (5 tests).
    dir: tools/gen-service-auth-ed25519
    cmds:
      - GOWORK=off go test -count=1 -v

  service-auth-ed25519:test-rotation-ratchet:
    desc: |
      Run the rotation deadline ratchet regression suite (pure-Go).
      Validates the shared deadlineratchet gate across
      dormant/within-budget/slip-alert/block/exception states.
    cmds:
      # M9 relocated the gate out of the shared base into the ops binary; this
      # target kept pointing at the old home and had been failing ever since,
      # unseen because nothing asserted the PACKAGE PATTERN of a `go test` —
      # only the `cd` argument, and `pkg` still exists (B-087).
      - cd cmd/loop-runtime-ops && go test ./internal/quality/deadlineratchet/... -count=1

  service-auth-ed25519:check-rotation-deadline:
    desc: |
      Run the rotation deadline check NOW (same gate the weekly cron runs).
      Useful for operator dashboards or pre-merge sanity.
      Exit codes: 0 OK, 1 usage error, 2 blocked.
    cmds:
      - cd cmd/loop-runtime-ops && go run . quality service-auth-rotation --root "{{.ROOT_DIR}}"

  service-auth-ed25519:verify-cluster:
    desc: |
      Operator step 1.5 of the rollout runbook — verify the API + cloud
      deployments are correctly consuming the Ed25519 Secrets.
      Reads logs of loop-runtime-api + loop-console and greps for the expected
      bootstrap messages.

      Variables:
        NAMESPACE — defaults to loop-runtime-system
    vars:
      NAMESPACE: '{{.NAMESPACE | default "loop-runtime-system"}}'
    cmds:
      - echo "=== ExternalSecret status ==="
      - kubectl get externalsecret loop-runtime-service-auth-ed25519 -n {{.NAMESPACE}} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' || echo "not present"
      - kubectl get externalsecret loop-runtime-service-auth-ed25519-pub -n {{.NAMESPACE}} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' || echo "not present"
      - echo ""
      - echo "=== loop-runtime-api Ed25519 bootstrap log ==="
      - kubectl logs -l app=loop-runtime-api -n {{.NAMESPACE}} --tail=100 | grep -E "service-auth Ed25519|service-auth nonce store" || echo "no bootstrap lines yet"
      - echo ""
      - echo "=== loop-console Ed25519 bootstrap log ==="
      - kubectl logs -l app=loop-console -n {{.NAMESPACE}} --tail=100 | grep -E "service-auth Ed25519" || echo "no bootstrap lines yet"

  service-auth-ed25519:metrics:
    desc: |
      Operator step 1.5/1.7 of the rollout runbook — dump the live
      service-auth counters from the loop-runtime-api pod's /metrics endpoint.
      Useful for confirming Phase 1 adoption rate without leaving the
      terminal.
    vars:
      NAMESPACE: '{{.NAMESPACE | default "loop-runtime-system"}}'
    cmds:
      - kubectl exec -n {{.NAMESPACE}} deploy/loop-runtime-api -- curl -s localhost:9090/metrics 2>/dev/null | grep loop_runtime_service_auth_signature || echo "counters not yet emitted (no signed traffic seen)"
