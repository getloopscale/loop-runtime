version: "3"

# taskfiles/infra.yml — Pulumi + cloud + cluster bootstrap + tokens + networking.
# Migration target: infra:install:*, cloud:*, tokens:*, networking:*.

tasks:
  check:infra:
    desc: |
      FAANG-grade post-cleanroom validation — verifies every canonical
      component is in the RIGHT cluster + namespace AND that Secrets +
      ConfigMaps hold REAL values (not chart-default placeholders).

      Catches the bug class that fooled cleanroom 2026-06-04:
        - loopzero-cluster-kubeconfigs build slot pointing at mgmt cluster
        - gitea-admin.token holding 32-char placeholder
        - MinIO rootPassword out of sync with minio-credentials.secretkey
        - operator NetworkPolicy egress to wrong ns

      Goes BEYOND `task doctor` (pod-state smoke) with:
        C1 placement · C2 anti-placement · C3 secret content + LIVE probes
        C4 NetPol cross-namespace egress · C5 cells · C6 deep health

      Usage:
        task check:infra              # human-readable
        task check:infra -- --json    # JSON summary

      Exit 0 if all PASS or only WARN; 1 if any FAIL.
    cmds:
      - bash infra/scripts/local/check-infra.sh {{.CLI_ARGS}}

  infra:install:core:
    desc: Install platform components in mgmt cluster via Helmfile (T2.3 of plan 2026-05-22)
    deps: [helm:repos]
    cmds:
      # T2.3.a (EC-01) MASTER SYNC — single `helmfile sync` per cluster. Helmfile
      # `needs:` directives resolve ordering (postgresql first, then dependent
      # releases like gitea/kratos/hydra). Master-sync REQUIRED to avoid race
      # `Secret postgresql not found` when dependent release sync invoked
      # before postgres install completes. Per-release `--selector` would
      # bypass `needs:` — DO NOT use.
      #
      # T2.3.b (EC-02) PORTABLE BASE64 — `kubectl -o go-template='{{`{{.data.X | base64decode}}`}}'`
      # returns DECODED bytes directly. Replaces `base64 -d` (Linux GNU) which
      # silently breaks on macOS BSD (uses `-D` capital).
      #
      # Pre-sync: generate-secrets.sh creates LOOPZERO_DB_PASSWORD Secret if missing
      # (idempotent — picks up existing for re-runs). Required by ory-kratos +
      # ory-hydra values.yaml.gotmpl `requiredEnv "LOOPZERO_DB_PASSWORD"`.
      # T2.2 of plan 2026-06-04: honor LOOPZERO_HELMFILE_ENV when set so
      # `LOOPZERO_HELMFILE_ENV=dev-public task setup` produces *-dev.loopzero.example
      # URLs in the Kratos ConfigMap. Default remains standalone-multi for
      # backwards compatibility with the legacy localhost flow.
      #
      # Plan 2026-06-04-dev-public-docr-fix-forward EC (cleanroom race):
      # k3d cluster create returns BEFORE the API server is reachable;
      # generate-secrets.sh calls kubectl apply and hits
      # `dial tcp 0.0.0.0:6447: connect: connection refused`. Wait for
      # node Ready up to 180s before any cluster operation. Idempotent
      # (no-op if already ready).
      - |
        echo "[infra:install:core] waiting for k3d-loopzero-core API server + node Ready..."
        for i in $(seq 1 36); do
          if kubectl --context {{.CORE_CONTEXT}} wait --for=condition=Ready node --all --timeout=5s 2>/dev/null; then
            echo "  ready after ${i} attempts"
            break
          fi
          [ "$i" = "36" ] && { echo "TIMEOUT: mgmt API server not ready after 180s"; exit 1; }
          sleep 5
        done
      - |
        HELMFILE_ENV="${LOOPZERO_HELMFILE_ENV:-standalone-multi}"
        echo "[infra:install:core] helmfile env: $HELMFILE_ENV"
        # The operator's credentials file fills what the environment leaves unset —
        # the Resend key generate-secrets.sh stores for Kratos (#445).
        eval "$(cd cmd/loopzero-ops && go run . creds env)"
        bash infra/helmfile/scripts/generate-secrets.sh "$HELMFILE_ENV" core
      - |
        HELMFILE_ENV="${LOOPZERO_HELMFILE_ENV:-standalone-multi}"
        # Plan 2026-06-04-dev-public-docr-fix-forward T4.1.bis — propagate
        # .env values as exported env vars so helmfile {{ env "..." }}
        # interpolations resolve (Task v3 `dotenv:` loads as task vars but
        # NOT as exported env vars; subprocess helmfile sees REPLACE_VIA_PULUMI
        # otherwise). Idempotent: if .env missing, skip.
        if [ -f .env ]; then
          set -a
          # shellcheck disable=SC1091
          source .env
          set +a
        fi
        # Then the operator's credentials file, for what is still unset: Kratos's
        # OAuth clients and mail key live there, and the seeds read them from it too.
        # Without this a cold dev-public install rendered REPLACE_VIA_* into Kratos (#445).
        eval "$(cd cmd/loopzero-ops && go run . creds env)"
        # Portable secret extraction (T2.3.b EC-02) — works on macOS + Linux
        export LOOPZERO_DB_PASSWORD=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system \
          get secret loopzero-db-credentials -o go-template='{{`{{.data.password | base64decode}}`}}' \
          2>/dev/null || echo "")
        if [ -z "$LOOPZERO_DB_PASSWORD" ]; then
          echo "ERROR: LOOPZERO_DB_PASSWORD not in loopzero-db-credentials Secret — run generate-secrets.sh first"
          exit 1
        fi
        helmfile -f infra/helmfile/core.helmfile.yaml.gotmpl \
          -e "$HELMFILE_ENV" \
          --kube-context {{.CORE_CONTEXT}} \
          sync --skip-deps
      # Post-sync: database creation (gitea/kratos/hydra) — helmfile sync
      # creates postgres + chart values but cannot create per-service databases.
      # kubectl exec into postgres pod, create DBs idempotently.
      - |
        echo "Ensuring gitea/kratos/hydra databases exist..."
        POD=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system get pod -l app.kubernetes.io/name=postgresql -o jsonpath='{.items[0].metadata.name}')
        # Portable secret extraction (T2.3.b EC-02)
        PG_ADMIN_PASS=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system \
          get secret loopzero-db-credentials -o go-template='{{`{{index .data "postgres-password" | base64decode}}`}}')
        for DB in gitea kratos hydra; do
          kubectl --context {{.CORE_CONTEXT}} -n loopzero-system exec -i "$POD" -c postgresql -- \
            env PGPASSWORD="$PG_ADMIN_PASS" psql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 || \
          kubectl --context {{.CORE_CONTEXT}} -n loopzero-system exec -i "$POD" -c postgresql -- \
            env PGPASSWORD="$PG_ADMIN_PASS" psql -U postgres -c "CREATE DATABASE $DB OWNER {{.PG_USER}}"
          echo "$DB database: ensured"
        done
      # Post-sync: MinIO lifecycle rules (Job spec immutable — delete-and-recreate)
      - kubectl --context {{.CORE_CONTEXT}} delete job minio-lifecycle-setup -n loopzero-system --ignore-not-found 2>/dev/null
      - kubectl --context {{.CORE_CONTEXT}} apply -f infra/helm/minio/lifecycle-job.yaml
      # Post-sync: the Ory edge NodePorts. infra/k3d/core-cluster.yaml reserves host
      # ports 14433/14444 for them and the Caddyfile logs in through them; only
      # `task cloud:setup` used to apply these, and setup never called it, so a
      # cold install reserved the ports with nothing behind them (#401).
      - kubectl --context {{.CORE_CONTEXT}} apply -f infra/helm/ory-kratos/nodeport-service.yaml
      - kubectl --context {{.CORE_CONTEXT}} apply -f infra/helm/ory-hydra/nodeport-service.yaml

  infra:install:core-dashboard-only:
    desc: |
      Install only the 16 core-cluster releases the dashboard demo needs (skips
      opencost, chaos-mesh, monitoring, loki, tempo, otel, blackbox,
      smoke-test, velero, nfs). Defaults to ENV=dev-public; override with
      ENV=<env>. Per T0.1 of plan 2026-05-29-dashboard-public-integration-
      canonicalization-plan.md.

      The default was standalone-public until B-165. B-025 removed the three
      bare hostnames that env serves (app|cloud|auth.loopzero.example) from
      infra/local/Caddyfile, so the default named an environment no edge
      answered for. dev-public is the canonical replacement and its hostnames
      do have site blocks. The standalone-public env file is kept and still
      selectable with ENV=standalone-public.
    deps: [helm:repos]
    vars:
      ENV: '{{.ENV | default "dev-public"}}'
    cmds:
      # v1.1 EC-01 guard: helmfile sync --selector exits 0 even when zero
      # releases match. Block silent-empty installs.
      - |
        count=$(helmfile -f infra/helmfile/core.helmfile.yaml.gotmpl \
          -e {{.ENV}} \
          --kube-context {{.CORE_CONTEXT}} \
          --selector profile=dashboard-only \
          list --output json 2>/dev/null | jq -r 'length // 0')
        if [ "$count" -lt 16 ]; then
          echo "ERROR: profile=dashboard-only selector matched $count releases, expected >=16"
          echo "Check labels in infra/helmfile/core.helmfile.yaml.gotmpl"
          exit 1
        fi
        echo "OK: dashboard-only selector matched $count releases"
      # Same pre-sync as infra:install:core for LOOPZERO_DB_PASSWORD
      - bash infra/helmfile/scripts/generate-secrets.sh {{.ENV}} core
      - |
        export LOOPZERO_DB_PASSWORD=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system \
          get secret loopzero-db-credentials -o go-template='{{`{{.data.password | base64decode}}`}}' \
          2>/dev/null || echo "")
        if [ -z "$LOOPZERO_DB_PASSWORD" ]; then
          echo "ERROR: LOOPZERO_DB_PASSWORD not in loopzero-db-credentials Secret — run generate-secrets.sh first"
          exit 1
        fi
        helmfile -f infra/helmfile/core.helmfile.yaml.gotmpl \
          -e {{.ENV}} \
          --kube-context {{.CORE_CONTEXT}} \
          --selector profile=dashboard-only \
          sync --skip-deps
      # Post-sync DB creation (idempotent, identical to mgmt)
      - |
        echo "Ensuring gitea/kratos/hydra databases exist..."
        POD=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system get pod -l app.kubernetes.io/name=postgresql -o jsonpath='{.items[0].metadata.name}')
        PG_ADMIN_PASS=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system \
          get secret loopzero-db-credentials -o go-template='{{`{{index .data "postgres-password" | base64decode}}`}}')
        for DB in gitea kratos hydra; do
          kubectl --context {{.CORE_CONTEXT}} -n loopzero-system exec -i "$POD" -c postgresql -- \
            env PGPASSWORD="$PG_ADMIN_PASS" psql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 || \
          kubectl --context {{.CORE_CONTEXT}} -n loopzero-system exec -i "$POD" -c postgresql -- \
            env PGPASSWORD="$PG_ADMIN_PASS" psql -U postgres -c "CREATE DATABASE $DB OWNER {{.PG_USER}}"
          echo "$DB database: ensured"
        done

  infra:install:build:
    desc: Install platform components in build cluster via Helmfile (T2.3 of plan 2026-05-22)
    deps: [helm:repos]
    cmds:
      # T2.3.a (EC-01) MASTER SYNC — single helmfile sync per cluster.
      # Build helmfile declares: argo-workflows, loopzero-build-cwts, loki, promtail.
      # CWTs (loopzero-build-cwts release) handle Helm directives via the chart's
      # own template render — no separate `helm template | kubectl apply` step needed.
      - >-
        helmfile -f infra/helmfile/build.helmfile.yaml.gotmpl
        -e "${LOOPZERO_HELMFILE_ENV:-standalone-multi}"
        --kube-context {{.BUILD_CONTEXT}}
        sync --skip-deps
      # Post-sync: MinIO credentials Secret for cache CWTs (envFrom.secretRef)
      - kubectl --context {{.BUILD_CONTEXT}} apply -f infra/helm/minio/minio-credentials-secret.yaml
      # Post-sync: BuildKit registry config (insecure k3d registry) — non-helm Secret
      - |
        kubectl --context {{.BUILD_CONTEXT}} -n argo create secret generic buildkit-registry-config \
          --from-literal=config.json='{"auths":{}}' \
          --from-literal=buildkitd.toml='[registry."k3d-loopzero-registry:5000"]
          http = true
          insecure = true' \
          --dry-run=client -o yaml | kubectl --context {{.BUILD_CONTEXT}} apply -f -

  infra:install:cell:
    desc: Install platform components in workload cluster via Helmfile (T2.3 of plan 2026-05-22)
    # `requires` is Task's NATIVE mechanism: the task REFUSES to run without CELL_CTX,
    # instead of falling back to a silent default. A default of cell-0 would recreate the
    # defect on the first call that forgot to pass the parameter — which is exactly how
    # the divergence between the cells was born.
    requires:
      vars: [CELL_CTX]
    deps: [helm:repos]
    cmds:
      # Pre-sync: runtime secrets on the workload cluster. The master sync below
      # deploys `static-assets` (nginx-s3-gateway), which mounts the Secret
      # `static-assets-s3` (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY). Without it
      # the pod stays in CreateContainerConfigError and the sync wait stalls.
      # In standalone-multi the S3 backend is core-cluster MinIO, so source the
      # real creds from the mgmt `minio-credentials` Secret and run
      # generate-runtime-secrets.sh against the workload context (KUBECONFIG,
      # no global current-context mutation). Idempotent.
      - |
        # THE CLUSTER COMES FROM THE PARAMETER. While it was a fixed `loopzero-cell-0`, this step
        # generated the `static-assets-s3` Secret ALWAYS on the first cell — and the second
        # cell's `static-assets` stayed in CreateContainerConfigError with "secret not found",
        # measured on 2026-08-10. It is the same class as the fixed-context defect, one layer
        # down: installing on every cell is not enough if the secrets are only born on one of them.
        CELL_CTX_K3D="{{.CELL_CTX}}"; CELL_CTX_K3D="${CELL_CTX_K3D#k3d-}"
        S3_KEY=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system get secret minio-credentials -o jsonpath='{.data.accesskey}' | openssl base64 -d -A)
        S3_SECRET=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system get secret minio-credentials -o jsonpath='{.data.secretkey}' | openssl base64 -d -A)
        KUBECONFIG=$(k3d kubeconfig write "${CELL_CTX_K3D}") \
          LOOPZERO_PROFILE=standalone-multi \
          LOOPZERO_S3_ACCESS_KEY="$S3_KEY" LOOPZERO_S3_SECRET_KEY="$S3_SECRET" \
          bash infra/helmfile/scripts/generate-runtime-secrets.sh standalone-multi workload
      # T2.3.a (EC-01) MASTER SYNC — runtime helmfile declares:
      # cert-manager, traefik, keda, keda-http-addon, argo-rollouts, policy-controller,
      # admission-policies, promtail, cloudflared, cluster-issuer, rbac, static-assets.
      #
      # THE CONTEXT IS A PARAMETER, not fixed. While it was `{{.CELL_0_CONTEXT}}`, this task
      # installed the 28 releases ALWAYS on cell-0: cell-1 was left with only the 5 from
      # `k3d:bootstrap-cell-1`, and a tenant pinned to it got LESS platform —
      # no KEDA (on-demand scaling), no static-assets, no cloudflared, no
      # policy-controller. Nobody chooses the cell (routing is bin-packing), so
      # two cells with different capabilities make the product's behaviour
      # depend on where the tenant landed. Measured on 2026-08-10: 8 components on cell-0
      # against 4 on cell-1.
      #
      # Worse: `task clusters:recreate -- cell-1` calls this same task (k3d.yml), so
      # recreating cell-1 installed onto the WRONG cluster, with no error.
      # LOOPZERO_CELL_CONTEXT comes from the SAME CELL_CTX as the flag: one source, two
      # consumers. The helmfile declares `kubeContext: {{ `{{` }} requiredEnv
      # "LOOPZERO_CELL_CONTEXT" {{ `}}` }}` so that a `helmfile sync` without the flag
      # does NOT land on kubectl's active context (measured against helmfile
      # 1.1.6: with no declaration and no flag, helm receives no --kube-context
      # at all). Binding a fixed value there would recreate the defect the comments
      # above describe; `requiredEnv` fails loudly when nobody passes it.
      - >-
        LOOPZERO_CELL_CONTEXT="{{.CELL_CTX}}"
        helmfile -f infra/helmfile/cell.helmfile.yaml.gotmpl
        -e "${LOOPZERO_HELMFILE_ENV:-standalone-multi}"
        --kube-context "{{.CELL_CTX}}"
        sync --skip-deps
      # Post-sync: Traefik middlewares + wildcard cert + TLSStore
      # (these are non-helm CRs that depend on Traefik + cert-manager CRDs being installed)
      - kubectl --context "{{.CELL_CTX}}" apply -f infra/helm/traefik/middlewares.yaml
      - kubectl --context "{{.CELL_CTX}}" apply -f infra/helm/cert-manager/traefik-tls.yaml

  infra:install:monitoring:
    desc: |
      Install Prometheus + Grafana + OTel in mgmt cluster.

      Note (T2.3 of plan 2026-05-22): monitoring releases (prometheus, grafana,
      otel-collector, tempo, opencost) are now declared in core.helmfile.yaml.gotmpl
      and installed by `infra:install:core`. This task is now a no-op alias for
      backward compatibility — invokes dashboards:install + infra:install:loki only.
    cmds:
      - task: dashboards:install
      - task: infra:install:loki

  infra:install:loki:
    desc: |
      Install Grafana Loki (log aggregation) in build cluster + Promtail.

      Note (T2.3 of plan 2026-05-22): loki + promtail are declared in
      build.helmfile.yaml.gotmpl. This task uses helmfile sync for the
      loki/promtail releases specifically (legacy compat — full install
      happens in `infra:install:build`).
    deps: [helm:repos]
    cmds:
      - >-
        helmfile -f infra/helmfile/build.helmfile.yaml.gotmpl
        -e "${LOOPZERO_HELMFILE_ENV:-standalone-multi}"
        --kube-context {{.BUILD_CONTEXT}}
        --selector name=loki sync --skip-deps
      # The cross-cluster query bridge (Service loki-cross-cluster, NodePort
      # crossCluster.lokiNodePort) is part of the loki release above. A kubectl apply
      # of infra/helm/loki/nodeport-service.yaml used to follow here — onto the CORE
      # cluster, where no Loki runs, so its selector matched nothing.
      # Promtail DaemonSet — scrape config filters for Argo Workflow pods ONLY (`workflows_argoproj_io_workflow` label).
      # At setup time, no workflows exist yet, so promtail's `/ready` endpoint returns 500 ("Unable to find any logs to tail").
      # `--wait` would timeout every bootstrap; readiness converges automatically once the first build runs.
      #
      # 2026-05-13: Use helmfile (canonical orchestrator) instead of direct `helm upgrade`.
      # The promtail values file was renamed to `values.yaml.gotmpl` in `ef7a7c16` so the
      # `loki.pushUrl` is helmfile-injected per environment (audit M08 #18). Direct
      # `helm upgrade -f values.yaml` would 404 on the missing file; even with the .gotmpl
      # extension, helm cannot resolve `.Environment.Values` (helmfile-specific syntax).
      # Helmfile sync with the build helmfile + standalone-multi env produces the same
      # release Helmfile manages in build clusters, with the correct push URL resolved.
      - >-
        helmfile -f infra/helmfile/build.helmfile.yaml.gotmpl
        -e "${LOOPZERO_HELMFILE_ENV:-standalone-multi}"
        --kube-context {{.BUILD_CONTEXT}}
        --selector name=promtail sync

  dashboards:install:
    desc: Install LoopZero Grafana dashboards and ServiceMonitors
    cmds:
      # Server-side apply — dashboard bundle exceeds 256KB `last-applied-configuration` annotation limit.
      # `--force-conflicts` ensures ownership transfer across reruns (field manager: loopzero-task).
      - >-
        kubectl --context {{.CORE_CONTEXT}} -n monitoring
        create configmap loopzero-grafana-dashboards
        --from-file=infra/helm/monitoring/dashboards/
        --dry-run=client -o yaml |
        kubectl --context {{.CORE_CONTEXT}} label -f - --local --dry-run=client -o yaml
        grafana_dashboard=1 |
        kubectl --context {{.CORE_CONTEXT}} apply --server-side --force-conflicts
        --field-manager=loopzero-task -f -
      # ServiceMonitors for mgmt cluster components (loopzero-api, gitea, minio, loopzero operators).
      # CHG-2026-05-05 (charts-sota dogfood): tenant-controller ServiceMonitor
      # consolidated into servicemonitor-loopzero-operators.yaml after ADR-0023 operator split.
      - >-
        kubectl --context {{.CORE_CONTEXT}} apply
        -f infra/helm/monitoring/manifests/servicemonitor.yaml
        -f infra/helm/monitoring/manifests/servicemonitor-gitea.yaml
        -f infra/helm/monitoring/manifests/servicemonitor-minio.yaml
        -f infra/helm/monitoring/manifests/servicemonitor-loopzero-operators.yaml
      # Cross-cluster metrics services (NodePort for Prometheus to scrape via additionalScrapeConfigs)
      - >-
        kubectl --context {{.BUILD_CONTEXT}} apply
        -f infra/helm/monitoring/manifests/metrics-service-argo-workflows.yaml
      - >-
        kubectl --context {{.CELL_0_CONTEXT}} apply
        -f infra/helm/monitoring/manifests/metrics-service-traefik.yaml
      # Alerting rules — the WHOLE set, by glob.
      #
      # This named two files until 2026-09-07. The directory held 19 with 110
      # alerts, so 74 alerts across 17 files were committed, reviewed and loaded
      # by nothing — velero, vault-audit and sigstore among them, which cover
      # exactly the failures nobody notices by hand (system-design audit
      # SD-01.13). The defect was not the 17 files; it was that adding a rule
      # file did not add an alert. A glob fixes the class: a file added tomorrow
      # is applied without anyone remembering to edit this list.
      #
      # Scoped to prometheusrule-* on purpose — the same directory holds
      # metrics-service manifests that belong to the BUILD and CELL_0 contexts,
      # applied above. Locked by infra/tests/charts/monitoring_rules_all_applied_test.go.
      - |
        for rule in infra/helm/monitoring/manifests/prometheusrule-*.yaml; do
          kubectl --context {{.CORE_CONTEXT}} apply -f "$rule"
        done

  infra:install:monitoring-crds:
    desc: Install Prometheus CRDs + monitoring namespace on ALL clusters (required before charts that create ServiceMonitors/PodMonitors/PrometheusRules)
    deps: [helm:repos]
    cmds:
      # CRDs must exist in every cluster where a chart creates a ServiceMonitor / PrometheusRule / PodMonitor.
      # mgmt → kube-prometheus-stack owners; workload → cert-manager + traefik; build → argo-workflows.
      # Prometheus Operator CRs are cluster-scoped by kind but reference objects in specific clusters,
      # so each cluster needs the type registered independently before its charts install.
      - |
        # Every cell from the inventory: this loop named only cell-0, so a chart
        # on cell-1 that ships a ServiceMonitor failed for want of the CRD.
        for CTX in {{.CORE_CONTEXT}} {{.BUILD_CONTEXT}} {{.CELL_CONTEXTS}}; do
          echo "=== Installing Prometheus CRDs + monitoring namespace on $CTX ==="
          kubectl --context "$CTX" create namespace monitoring --dry-run=client -o yaml \
            | kubectl --context "$CTX" apply -f -
          kubectl --context "$CTX" apply --server-side \
            -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml \
            -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_prometheusrules.yaml \
            -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_podmonitors.yaml
        done

  infra:install:
    desc: Install all platform components via Helm
    cmds:
      - task: infra:install:monitoring-crds
      - task: infra:install:core
      - task: infra:install:build
      # ONE CALL PER CELL, over the inventory declared once in Taskfile.yml
      # (CELL_CONTEXTS). Calling it once left cell-1 with 4 components against
      # cell-0's 8, and since nobody chooses the cell (routing is bin-packing),
      # a tenant landing there silently got less platform. Cells mirror each
      # other by contract.
      - for: { var: CELL_CONTEXTS }
        task: infra:install:cell
        vars: { CELL_CTX: '{{.ITEM}}' }
      - task: infra:install:monitoring

  # ---------------------------------------------------------------------------
  # S0.4: CRDs
  # ---------------------------------------------------------------------------
  crds:install:
    desc: Install CRDs into mgmt cluster
    cmds:
      - kubectl --context {{.CORE_CONTEXT}} apply -f operators/config/crd/bases/

  # ---------------------------------------------------------------------------
  # Cloud Auth: Ory Kratos + Hydra (Sprint 11)
  # ---------------------------------------------------------------------------
  cloud:setup:
    desc: |
      Install Ory Kratos + Hydra for auth (idempotent).

      Note (T2.3 of plan 2026-05-22): kratos + hydra are declared in
      core.helmfile.yaml.gotmpl and installed by `infra:install:core`.
      This task is now a thin wrapper that re-runs the helmfile sync for
      these specific releases + ensures databases exist.

      Pre-T2.3 namespace was loopzero-system; helmfile uses loopzero-auth. Migration
      validated in T2.4 LIVE cleanroom.
    deps: [helm:repos]
    cmds:
      # Ensure kratos + hydra databases (idempotent — chart values.yaml.gotmpl
      # uses requiredEnv LOOPZERO_DB_PASSWORD which is set by generate-secrets.sh).
      - |
        echo "=== Ensuring kratos and hydra databases ==="
        POD=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system get pod -l app.kubernetes.io/name=postgresql -o jsonpath='{.items[0].metadata.name}')
        # T2.3.b (EC-02) — portable base64 via kubectl go-template
        PG_ADMIN_PASS=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system \
          get secret loopzero-db-credentials -o go-template='{{`{{index .data "postgres-password" | base64decode}}`}}')
        for DB in kratos hydra; do
          kubectl --context {{.CORE_CONTEXT}} -n loopzero-system exec -i "$POD" -c postgresql -- \
            env PGPASSWORD="$PG_ADMIN_PASS" psql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 || \
          kubectl --context {{.CORE_CONTEXT}} -n loopzero-system exec -i "$POD" -c postgresql -- \
            env PGPASSWORD="$PG_ADMIN_PASS" psql -U postgres -c "CREATE DATABASE $DB OWNER {{.PG_USER}}"
          echo "$DB database: ensured"
        done
      # T2.3.a (EC-01) — helmfile sync ory releases via master pattern (needs:
      # resolves postgresql → kratos → hydra ordering automatically).
      - |
        export LOOPZERO_DB_PASSWORD=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system \
          get secret loopzero-db-credentials -o go-template='{{`{{.data.password | base64decode}}`}}' \
          2>/dev/null || echo "")
        helmfile -f infra/helmfile/core.helmfile.yaml.gotmpl \
          -e "${LOOPZERO_HELMFILE_ENV:-standalone-multi}" \
          --kube-context {{.CORE_CONTEXT}} \
          --selector name=ory-kratos --selector name=ory-hydra \
          sync --skip-deps
      # NodePort bridges to the edge. Without them, `auth-dev` is only reachable through
      # `kubectl port-forward` — which died with the clusters on 2026-08-10 and took down
      # login while Kratos and Hydra were healthy (B-018, same defect as B-010). Additive:
      # the chart's ClusterIP Services stay intact.
      - kubectl --context {{.CORE_CONTEXT}} apply -f infra/helm/ory-kratos/nodeport-service.yaml
      - kubectl --context {{.CORE_CONTEXT}} apply -f infra/helm/ory-hydra/nodeport-service.yaml
      - task: cloud:health

  cloud:health:
    desc: Check Ory Kratos + Hydra health
    cmds:
      - |
        PASS=0
        FAIL=0
        echo "=== Ory Health ==="

        # Kratos health via kubectl port-forward (quick check)
        KRATOS_POD=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system get pod -l app.kubernetes.io/name=kratos -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        if [ -n "$KRATOS_POD" ]; then
          STATUS=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system get pod "$KRATOS_POD" -o jsonpath='{.status.phase}')
          if [ "$STATUS" = "Running" ]; then
            echo "  [PASS] Ory Kratos — pod Running ($KRATOS_POD)"
            PASS=$((PASS+1))
          else
            echo "  [FAIL] Ory Kratos — pod $STATUS ($KRATOS_POD)"
            FAIL=$((FAIL+1))
          fi
        else
          echo "  [FAIL] Ory Kratos — no pod found"
          FAIL=$((FAIL+1))
        fi

        # Hydra health
        HYDRA_POD=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system get pod -l app.kubernetes.io/name=hydra -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        if [ -n "$HYDRA_POD" ]; then
          STATUS=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system get pod "$HYDRA_POD" -o jsonpath='{.status.phase}')
          if [ "$STATUS" = "Running" ]; then
            echo "  [PASS] Ory Hydra — pod Running ($HYDRA_POD)"
            PASS=$((PASS+1))
          else
            echo "  [FAIL] Ory Hydra — pod $STATUS ($HYDRA_POD)"
            FAIL=$((FAIL+1))
          fi
        else
          echo "  [FAIL] Ory Hydra — no pod found"
          FAIL=$((FAIL+1))
        fi

        # Hydra OIDC discovery (via kubectl exec — no port-forward needed)
        if [ -n "$HYDRA_POD" ]; then
          DISC=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system exec "$HYDRA_POD" -- wget -qO- http://localhost:4444/.well-known/openid-configuration 2>/dev/null)
          if echo "$DISC" | grep -q "device_authorization_endpoint" 2>/dev/null; then
            echo "  [PASS] Hydra OIDC discovery — device_authorization_endpoint present"
            PASS=$((PASS+1))
          else
            echo "  [FAIL] Hydra OIDC discovery — device_authorization_endpoint missing"
            FAIL=$((FAIL+1))
          fi
        fi

        echo ""
        echo "  PASS: $PASS  |  FAIL: $FAIL"
        if [ "$FAIL" -gt 0 ]; then exit 1; fi

  cloud:register-client:
    desc: Register the loopzero-cli OAuth2 client in Hydra (idempotent)
    cmds:
      - |
        HYDRA_POD=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system get pod -l app.kubernetes.io/name=hydra -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        if [ -z "$HYDRA_POD" ]; then
          echo "Hydra not running. Run: task cloud:setup"
          exit 1
        fi
        # Check if client exists
        EXISTS=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system exec "$HYDRA_POD" -c hydra -- \
          wget -qO- http://localhost:4445/admin/clients/loopzero-cli 2>/dev/null | grep -c "loopzero-cli" || true)
        if [ "$EXISTS" -gt 0 ]; then
          echo "OAuth2 client 'loopzero-cli' already registered"
          exit 0
        fi
        # Register public client with device_code + refresh_token grants
        kubectl --context {{.CORE_CONTEXT}} -n loopzero-system exec "$HYDRA_POD" -c hydra -- \
          wget -qO- --post-data='{"client_id":"loopzero-cli","client_name":"LoopZero CLI","grant_types":["urn:ietf:params:oauth:grant-type:device_code","refresh_token","authorization_code"],"response_types":["code"],"scope":"openid offline_access","token_endpoint_auth_method":"none","redirect_uris":["http://localhost:9876/auth"]}' \
          --header="Content-Type: application/json" \
          http://localhost:4445/admin/clients 2>/dev/null
        echo "OAuth2 client 'loopzero-cli' registered"
  monitoring:install:
    desc: Install full monitoring stack (Prometheus + Grafana + OTel + ServiceMonitors + dashboards)
    cmds:
      - task: infra:install:monitoring

  monitoring:validate-targets:
    desc: Validate all Prometheus scrape targets are UP
    cmds:
      - |
        echo "Checking Prometheus targets..."
        TARGETS=$(curl -sf http://localhost:{{.PROMETHEUS_PORT}}/api/v1/targets | jq -r '.data.activeTargets[] | "\(.labels.job) \(.health)"' 2>/dev/null)
        if [ -z "$TARGETS" ]; then
          echo "ERROR: Cannot reach Prometheus at localhost:{{.PROMETHEUS_PORT}}"
          exit 1
        fi
        echo "$TARGETS" | sort | uniq -c | sort -rn
        echo ""
        DOWN=$(echo "$TARGETS" | grep -c "down" || true)
        if [ "$DOWN" -gt 0 ]; then
          echo "WARNING: $DOWN target(s) are DOWN:"
          echo "$TARGETS" | grep "down"
          exit 1
        fi
        echo "All targets are UP."

  monitoring:status:
    desc: Show monitoring stack status (targets, alerts, dashboards)
    cmds:
      - |
        echo "=== Prometheus Targets ==="
        curl -sf http://localhost:{{.PROMETHEUS_PORT}}/api/v1/targets | jq -r '.data.activeTargets[] | "\(.labels.job)\t\(.health)\t\(.lastScrape)"' 2>/dev/null | column -t || echo "Prometheus not reachable at localhost:{{.PROMETHEUS_PORT}}"
        echo ""
        echo "=== Active Alerts ==="
        curl -sf http://localhost:{{.PROMETHEUS_PORT}}/api/v1/alerts | jq -r '.data.alerts[] | "\(.labels.alertname)\t\(.state)\t\(.labels.severity)"' 2>/dev/null | column -t || echo "No alerts or Prometheus not reachable"
        echo ""
        echo "=== Grafana Dashboards ==="
        # The chart leaves adminPassword empty, so Grafana generates one and keeps it in
        # the Secret. Read it at call time: a literal here goes stale the moment the
        # release is reinstalled, which is how the previous one came to be wrong.
        GRAFANA_PASS=$(kubectl --context {{.CORE_CONTEXT}} -n monitoring get secret \
          monitoring-grafana -o jsonpath='{.data.admin-password}' 2>/dev/null | openssl base64 -d -A)
        if [ -z "$GRAFANA_PASS" ]; then
          echo "  (not checked: could not read the Grafana admin secret in ns/monitoring)"
        else
          curl -sf -u "admin:$GRAFANA_PASS" http://localhost:{{.GRAFANA_PORT}}/api/search?type=dash-db | jq -r '.[] | "  \(.title)"' 2>/dev/null || echo "  (none)"
        fi

  # =========================================================================
  # MEET-055: Post-Stress-Test Operational Tasks
  # =========================================================================

  loadtest:run:
    desc: Run load test at specified LEVEL (l1-l5). Uses Go E2E harness.
    vars:
      LEVEL: '{{.LEVEL | default "l1"}}'
    cmds:
      - |
        cd infra/tests/performance/load
        if [ ! -f run-tests.sh ]; then
          echo "ERROR: run-tests.sh not found in infra/tests/performance/load/"
          exit 1
        fi
        echo "=== Load Test Level: {{.LEVEL}} ==="
        bash run-tests.sh {{.LEVEL}}

  api:hotfix:
    desc: Sanctioned fast-path for API image hotfix (build, push, rollout restart with audit)
    vars:
      TAG: '{{.TAG | default "homolog"}}'
      CONTEXT: '{{.CONTEXT | default "do-nyc3-loopzero-infra-homolog-nyc3-mgmt"}}'
    cmds:
      - |
        set -euo pipefail
        echo "=== API Hotfix ==="
        echo "  Operator: $(whoami)"
        echo "  Time:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "  Tag:      {{.TAG}}"
        echo "  Context:  {{.CONTEXT}}"
        echo ""
        echo "Building API image..."
        docker build -f api/Dockerfile -t registry.digitalocean.com/loopzero-system/loopzero-api:{{.TAG}} .
        echo "Pushing..."
        docker push registry.digitalocean.com/loopzero-system/loopzero-api:{{.TAG}}
        echo "Rolling out..."
        kubectl --context={{.CONTEXT}} -n loopzero-system rollout restart deploy/loopzero-api
        echo ""
        echo "✅ Hotfix applied. Rollout status:"
        kubectl --context={{.CONTEXT}} -n loopzero-system rollout status deploy/loopzero-api --timeout=120s
        echo ""
        echo "⚠️  Do NOT use 'kubectl set image'. This task is the sanctioned fast-path."

  infra:drift:
    desc: Check Pulumi drift (expect no changes). Run locally or in CI.
    cmds:
      - |
        cd infra/pulumi
        echo "=== Pulumi Drift Check ==="
        echo "  Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        npx pulumi preview --stack homolog --expect-no-changes --non-interactive 2>&1 || {
          echo ""
          echo "🚨 DRIFT DETECTED! Review changes above."
          echo "   If intentional (hotfix): reconcile via 'pulumi up' within 24h."
          echo "   If unauthorized: investigate and revert."
          exit 1
        }
        echo "✅ No drift detected."

  infra:state-delete:
    desc: Wrapper for 'pulumi state delete' with audit trail. Use ONLY when necessary.
    vars:
      URN: '{{.URN}}'
      REASON: '{{.REASON | default "no reason provided"}}'
    cmds:
      - |
        set -euo pipefail
        if [ -z "{{.URN}}" ]; then
          echo "ERROR: URN is required. Usage: task infra:state-delete URN=<urn> REASON='why'"
          exit 1
        fi
        echo "=== Pulumi State Delete (AUDITED) ==="
        echo "  Operator: $(whoami)"
        echo "  Time:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "  URN:      {{.URN}}"
        echo "  Reason:   {{.REASON}}"
        echo ""
        echo "⚠️  WARNING: This removes the resource from Pulumi state."
        echo "⚠️  The REAL resource in the cloud is NOT deleted."
        echo "⚠️  You MUST delete the real resource FIRST (doctl/aws/cf)."
        echo ""
        read -p "Have you already deleted the real resource? [y/N] " -n 1 -r
        echo
        if [[ ! $REPLY =~ ^[Yy]$ ]]; then
          echo "Aborted. Delete the real resource first, then retry."
          exit 1
        fi
        cd infra/pulumi
        npx pulumi state delete --stack homolog "{{.URN}}" --force
        echo "✅ Resource removed from state."

  break-glass:
    desc: Issue time-boxed cluster-admin access for emergency operations (MEET-055 M3)
    vars:
      CONTEXT: '{{.CONTEXT | default "do-nyc3-loopzero-infra-homolog-nyc3-mgmt"}}'
      TTL: '{{.TTL | default "4"}}'
      REASON: '{{.REASON | default ""}}'
    cmds:
      - bash infra/scripts/production/break-glass.sh {{.CONTEXT}} {{.TTL}} "{{.REASON}}"

  # ===========================================================================
  # Observability — Blackbox, pprof, Sloth
  # ===========================================================================

  pprof:api:
    desc: Port-forward to API pprof endpoint (http://localhost:6060/debug/pprof/)
    cmds:
      - kubectl --context {{.CORE_CONTEXT}} -n loopzero-system port-forward deploy/loopzero-api 6060:6060

  pprof:operators:
    desc: "Port-forward to one operator's pprof endpoint (http://localhost:6061/debug/pprof/). OPERATOR=tenant|app|preview|platform"
    # The operators are four binaries since the split; each serves pprof on
    # :6061 (operators/internal/operatorboot/pprof.go). The single
    # deploy/loopzero-controller this used to target no longer exists.
    requires:
      vars:
        - name: OPERATOR
          enum: [tenant, app, preview, platform]
    cmds:
      - kubectl --context {{.CORE_CONTEXT}} -n loopzero-system port-forward deploy/{{.OPERATOR}}-operator 6061:6061

  blackbox:status:
    desc: Check blackbox exporter health and probe results
    cmds:
      - |
        echo "=== Blackbox Pod ==="
        kubectl --context {{.CORE_CONTEXT}} -n loopzero-system get pods -l app.kubernetes.io/name=prometheus-blackbox-exporter 2>/dev/null || echo "Blackbox pod not found"
        echo ""
        echo "=== Probe CRDs ==="
        kubectl --context {{.CORE_CONTEXT}} -n monitoring get probes 2>/dev/null || echo "No Probe resources found"
        echo ""
        echo "=== PrometheusRules ==="
        kubectl --context {{.CORE_CONTEXT}} -n monitoring get prometheusrules loopzero-probe-alerts 2>/dev/null || echo "PrometheusRule not found"

  sloth:generate:
    desc: Generate PrometheusRules from Sloth SLO specs
    preconditions:
      - sh: command -v sloth
        msg: "sloth CLI not found. Install: go install github.com/slok/sloth/cmd/sloth@latest"
    cmds:
      # `-i` takes ONE path, not a glob: `infra/sloth/*.yaml` expanded in the
      # shell and sloth read only the first file, so six of the seven SLOs were
      # silently dropped. `-i` accepts a directory — use it.
      #
      # sloth emits raw `groups:` for prometheus/v1 specs, which kubectl cannot
      # apply. Wrap the seven outputs in one PrometheusRule. The specs are left
      # untouched on purpose: they are the SLO source of truth and the strongest
      # artifact the 2026-09-07 system-design audit found (SRE-09.1).
      - rm -rf .sloth-out && mkdir -p .sloth-out
      - sloth generate -i infra/sloth -o .sloth-out
      - |
        python3 - <<'PY'
        import glob
        groups = []
        for f in sorted(glob.glob(".sloth-out/*.yaml")):
            t = open(f).read()
            if "groups:" not in t:
                continue
            body = t[t.index("groups:") + len("groups:"):].rstrip()
            # sloth emits the list at top level; under spec.groups it needs one
            # more level of indentation.
            groups.append("\n" + "\n".join(("  " + ln if ln.strip() else ln)
                                             for ln in body.lstrip("\n").split("\n")))
        if not groups:
            raise SystemExit("sloth produced no rule groups — refusing to write an empty PrometheusRule")
        doc = """# Code generated by `task sloth:generate`. DO NOT EDIT.
        #
        # Source: infra/sloth/*.yaml. Regenerate with: task sloth:generate
        apiVersion: monitoring.coreos.com/v1
        kind: PrometheusRule
        metadata:
          name: loopzero-slo-burn-rate
          namespace: monitoring
          labels:
            release: monitoring
            app.kubernetes.io/part-of: loopzero
        spec:
          groups:""".replace("\n        ", "\n") + "".join(groups) + "\n"
        open("infra/helm/monitoring/manifests/prometheusrule-slo-generated.yaml", "w").write(doc)
        print(f"SLO rules: {doc.count('alert:')} alerts, {doc.count('record:')} recording rules, from {len(groups)} specs")
        PY
      - rm -rf .sloth-out
      - echo "✅ SLO rules generated at infra/helm/monitoring/manifests/prometheusrule-slo-generated.yaml"
      - echo "   The install task applies every prometheusrule-*.yaml, so this is picked up automatically."

  sloth:validate:
    desc: Validate Sloth SLO spec files
    preconditions:
      - sh: command -v sloth
        msg: "sloth CLI not found. Install: go install github.com/slok/sloth/cmd/sloth@latest"
    cmds:
      - |
        for f in infra/sloth/*.yaml; do
          echo "Validating $f..."
          sloth validate -i "$f"
        done
        echo "✅ All SLO specs valid"

  tempo:status:
    desc: Check Tempo health, ServiceMonitor, and PrometheusRules (MEET-020)
    cmds:
      - |
        echo "=== Tempo Pod ==="
        kubectl --context k3d-loopzero-core -n loopzero-system get pods -l app.kubernetes.io/name=tempo 2>/dev/null || echo "Tempo pod not found"
        echo ""
        echo "=== ServiceMonitor ==="
        kubectl --context k3d-loopzero-core -n monitoring get servicemonitor loopzero-tempo 2>/dev/null || echo "ServiceMonitor not found"
        echo ""
        echo "=== PrometheusRules ==="
        kubectl --context k3d-loopzero-core -n monitoring get prometheusrules loopzero-tracing 2>/dev/null || echo "PrometheusRule not found"

  # ---------------------------------------------------------------------------
  # Helm chart operations (charts/)
  # ---------------------------------------------------------------------------

  networking:setup:
    desc: Connect k3d cluster networks so mgmt can reach workload/build clusters
    cmds:
      - bash infra/scripts/local/setup-cross-cluster-networking.sh
      - bash infra/scripts/local/update-cross-cluster-ips.sh
      # T2.2 of plan dashboard-badge-data-plane-poller (Red Team #128).
      # Patches mgmt CoreDNS NodeHosts so `k3d-loopzero-cell-0-server-0`
      # resolves — required for the mgmt Prometheus scrape of the workload
      # cluster's kube-state-metrics NodePort (values-prometheus.yaml).
      # Idempotent (diff-then-patch). Same mechanism J-17 Loki cross-
      # cluster uses (memory j17-aprendizado-coredns-cross-cluster-build-lb).
      - (cd cmd/loopzero-ops && go run . seed networking-cross-cluster-coredns)

  tokens:provision:
    desc: Provision API tokens (Gitea + ArgoCD) and build cluster kubeconfig
    cmds:
      - bash infra/scripts/production/provision-api-tokens.sh
      - |
        echo ""
        if kubectl --context {{.CORE_CONTEXT}} -n loopzero-system get deployment/loopzero-api >/dev/null 2>&1; then
          echo "Restarting API to pick up new tokens..."
          kubectl --context {{.CORE_CONTEXT}} -n loopzero-system rollout restart deployment/loopzero-api
          kubectl --context {{.CORE_CONTEXT}} -n loopzero-system rollout status deployment/loopzero-api --timeout=60s
        else
          echo "API deployment not found (not running yet — tokens will be picked up on first start)."
        fi
      # ArgoCD repo-server caches repo credentials at startup.
      # After updating the repo secret with Gitea credentials, restart it.
      - |
        if kubectl --context {{.CORE_CONTEXT}} -n argocd get deployment/argocd-repo-server >/dev/null 2>&1; then
          echo "Restarting ArgoCD repo-server to pick up new credentials..."
          kubectl --context {{.CORE_CONTEXT}} -n argocd rollout restart deployment/argocd-repo-server
          kubectl --context {{.CORE_CONTEXT}} -n argocd rollout status deployment/argocd-repo-server --timeout=60s
        fi

  tokens:verify:
    desc: Verify API tokens are valid (non-expired) and services are reachable
    cmds:
      - |
        echo "=== Token Verification ==="
        PASS=0
        FAIL=0

        # Check ArgoCD token (T2.3.b portable base64 — kubectl go-template)
        ARGOCD_TOKEN=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system \
          get secret loopzero-api-tokens -o go-template='{{`{{.data.argocd-token | base64decode}}`}}' \
          2>/dev/null)
        if [ -z "$ARGOCD_TOKEN" ]; then
          echo "  [FAIL] ArgoCD token — not found in secret loopzero-api-tokens"
          FAIL=$((FAIL+1))
        else
          # Check if token has expiration
          # T2.3.b portable: openssl base64 -d -A as fallback (no kubectl involved here — decoding JWT middle segment)
          EXP=$(echo "$ARGOCD_TOKEN" | cut -d. -f2 | openssl base64 -d -A 2>/dev/null | python3 -c "
        import sys, json, datetime
        try:
          data = json.load(sys.stdin)
          exp = data.get('exp')
          sub = data.get('sub', 'unknown')
          if exp:
            remaining = datetime.datetime.fromtimestamp(exp) - datetime.datetime.now()
            if remaining.total_seconds() < 0:
              print(f'EXPIRED|{sub}|expired {-remaining.days}d ago')
            elif remaining.days < 7:
              print(f'EXPIRING|{sub}|expires in {remaining.days}d')
            else:
              print(f'OK|{sub}|expires in {remaining.days}d')
          else:
            print(f'OK|{sub}|never expires')
        except:
          print('ERROR|unknown|cannot parse token')
        " 2>/dev/null)
          STATUS=$(echo "$EXP" | cut -d'|' -f1)
          SUBJECT=$(echo "$EXP" | cut -d'|' -f2)
          DETAIL=$(echo "$EXP" | cut -d'|' -f3)
          if [ "$STATUS" = "OK" ]; then
            echo "  [PASS] ArgoCD token — $SUBJECT ($DETAIL)"
            PASS=$((PASS+1))
          elif [ "$STATUS" = "EXPIRING" ]; then
            echo "  [WARN] ArgoCD token — $SUBJECT ($DETAIL) — run: task tokens:provision"
            FAIL=$((FAIL+1))
          else
            echo "  [FAIL] ArgoCD token — $SUBJECT ($DETAIL) — run: task tokens:provision"
            FAIL=$((FAIL+1))
          fi
        fi

        # Check Gitea token (T2.3.b portable base64 — kubectl go-template)
        GITEA_TOKEN=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system \
          get secret loopzero-api-tokens -o go-template='{{`{{.data.gitea-token | base64decode}}`}}' \
          2>/dev/null)
        if [ -z "$GITEA_TOKEN" ]; then
          echo "  [FAIL] Gitea token — not found"
          FAIL=$((FAIL+1))
        else
          echo "  [PASS] Gitea token — ${#GITEA_TOKEN} chars"
          PASS=$((PASS+1))
        fi

        # Check API can reach ArgoCD
        if curl -sf http://localhost:{{.API_PORT}}/api/v1/health/deep >/dev/null 2>&1; then
          echo "  [PASS] API health — database connected"
          PASS=$((PASS+1))
        else
          echo "  [FAIL] API health — not reachable or DB down"
          FAIL=$((FAIL+1))
        fi

        echo ""
        echo "  PASS: $PASS  |  FAIL: $FAIL"
        if [ "$FAIL" -gt 0 ]; then
          echo "  Fix: task tokens:provision"
          exit 1
        fi

  # ---------------------------------------------------------------------------
  # S0.13: Build pipeline tooling images
  # ---------------------------------------------------------------------------
  # T5.6 (plan 2026-05-21-deep-review-remediation): per-image build tasks
  # for fast iteration. Each task is independently runnable; `images:build`
  # composes them all sequentially for full setup. Operator can rebuild
  # just one image (e.g., `task images:build:cosign-signer`) when iterating
  # on a single piece, cutting dev rebuild time from ~15min to ~3min.
  images:build:clone-runner:
    desc: Build + push loopzero-clone-runner (both :latest and :v0.1.0 tags)
    cmds:
      - |
        echo "=== Building loopzero-clone-runner ==="
        # Pinned Tilt env vars to :v0.1.0; the build must publish BOTH
        # :latest AND :v0.1.0 so api/internal/builds/argo/cosign.go can resolve
        # via LOOPZERO_CLONE_IMAGE env var.
        docker build -t localhost:5000/loopzero-clone-runner:latest infra/images/clone-runner/
        docker tag  localhost:5000/loopzero-clone-runner:latest localhost:5000/loopzero-clone-runner:v0.1.0
        docker push localhost:5000/loopzero-clone-runner:latest
        docker push localhost:5000/loopzero-clone-runner:v0.1.0
        echo "  Pushed: localhost:5000/loopzero-clone-runner:{latest,v0.1.0}"

  images:build:minio:
    desc: Build + push loopzero-minio, the MinIO server built from pinned source (#394)
    cmds:
      - |
        echo "=== Building loopzero-minio (from source — MinIO publishes no community images) ==="
        # The tag is the upstream release the image is built from; the core helmfile
        # pins the same one for a local-registry profile.
        docker build -t localhost:5000/loopzero-minio:RELEASE.2024-12-18T13-15-44Z infra/images/minio/
        docker push localhost:5000/loopzero-minio:RELEASE.2024-12-18T13-15-44Z
        echo "  Pushed: localhost:5000/loopzero-minio:RELEASE.2024-12-18T13-15-44Z"

  images:build:syft-scanner:
    desc: Build + push loopzero-syft-scanner (Sprint 6 SBOM generation)
    cmds:
      - |
        echo "=== Building loopzero-syft-scanner (Sprint 6 / T0.2) ==="
        # T8.3 + NEW-11 (2026-04-30): publish both :latest and :v0.1.0.
        docker build -t localhost:5000/loopzero-syft-scanner:latest infra/images/syft-scanner/
        docker tag  localhost:5000/loopzero-syft-scanner:latest localhost:5000/loopzero-syft-scanner:v0.1.0
        docker push localhost:5000/loopzero-syft-scanner:latest
        docker push localhost:5000/loopzero-syft-scanner:v0.1.0
        echo "  Pushed: localhost:5000/loopzero-syft-scanner:{latest,v0.1.0}"

  images:build:cosign-signer:
    desc: Build + push loopzero-cosign-signer (Sprint 6 supply-chain signing)
    cmds:
      - |
        echo "=== Building loopzero-cosign-signer (Sprint 6 supply-chain) ==="
        # NEW-11/NEW-12 (2026-04-30): publish both :latest and :v0.1.0.
        # Tilt env LOOPZERO_COSIGN_IMAGE points to :v0.1.0.
        docker build -t localhost:5000/loopzero-cosign-signer:latest infra/images/cosign-signer/
        docker tag  localhost:5000/loopzero-cosign-signer:latest localhost:5000/loopzero-cosign-signer:v0.1.0
        docker push localhost:5000/loopzero-cosign-signer:latest
        docker push localhost:5000/loopzero-cosign-signer:v0.1.0
        echo "  Pushed: localhost:5000/loopzero-cosign-signer:{latest,v0.1.0}"

  images:build:
    desc: Build + push ALL tooling images (composite of per-image tasks)
    # T4.1 (simplify-deploy-loopzerokit-only v2.0): packs-runner + dockerfile-lint
    # image builds removed — loopzero-packs generation (T2.1) and the BYO-Dockerfile
    # lint path (T2.2) are gone; the build uses canonical in-process Dockerfiles.
    cmds:
      - task: images:build:clone-runner
      - task: images:build:minio
      - task: images:build:syft-scanner
      - task: images:build:cosign-signer

  # ---------------------------------------------------------------------------
  # Platform image push to DOCR — for env=dev-public (clusterRole=cloud-local).

  images:ghcr:pullsecret:
    desc: Provision ghcr-pull imagePullSecret (loopzero-cloud GHCR canonical) — issue #104 Architecture A
    cmds:
      - |
        set -euo pipefail
        echo "=== images:ghcr:pullsecret — provision ghcr-pull Secret (issue #104) ==="

        # Issue #104 Architecture A (ADR PROPOSED
        # `2026-06-19-loopzero-cloud-image-registry-canonical`). loopzero-cloud
        # images are published to GHCR by the AM6 reusable workflow
        # (`loopzero/.github/workflows/build-publish.yml`). Engine helmfile
        # needs a `kubernetes.io/dockerconfigjson` Secret authenticating
        # to ghcr.io to pull. Canonical SoT: ~/.loopzero/ghcr-pull-token.txt
        # mode 0600 (sibling of ~/.loopzero/gomod-token.txt per memory
        # `reference_gomod_token_canonical_path`).
        #
        # Token requirements (fine-grained PAT recommended for dev-public):
        #   - Repository access: getloopscale/loopzero-cloud
        #   - Permission: Packages: read
        # OR Classic PAT with `read:packages` scope.
        GHCR_PULL_TOKEN_PATH="${HOME}/.loopzero/ghcr-pull-token.txt"
        if [ ! -f "$GHCR_PULL_TOKEN_PATH" ]; then
          echo "ERROR: missing $GHCR_PULL_TOKEN_PATH — required to pull loopzero-cloud from GHCR" >&2
          echo "  Generate a GitHub PAT with \`read:packages\` (or fine-grained \`Packages: read\` on getloopscale/loopzero-cloud) and save:" >&2
          echo "  echo \"ghp_xxx\" > $GHCR_PULL_TOKEN_PATH && chmod 600 $GHCR_PULL_TOKEN_PATH" >&2
          exit 1
        fi

        # Compose dockerconfigjson. Username field is informational for
        # GHCR PAT auth (GHCR auth header is `Basic <base64(username:PAT)>`);
        # use the canonical GitHub bot identity placeholder. The actual
        # auth comes from the token.
        GHCR_USER="${GHCR_USER:-getloopscale}"
        GHCR_TOKEN="$(cat "$GHCR_PULL_TOKEN_PATH")"
        DOCKER_CONFIG_JSON="$(printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$(printf '%s:%s' "$GHCR_USER" "$GHCR_TOKEN" | base64 -w0)")"
        DOCKER_CONFIG_B64="$(printf '%s' "$DOCKER_CONFIG_JSON" | base64 -w0)"

        # Provision in loopzero-system namespace of mgmt cluster (where the
        # loopzero-cloud Deployment lives). Idempotent kubectl apply.
        kubectl --context {{.CORE_CONTEXT}} create namespace loopzero-system --dry-run=client -o yaml | kubectl --context {{.CORE_CONTEXT}} apply -f -
        cat <<EOF | kubectl --context {{.CORE_CONTEXT}} apply -f -
        apiVersion: v1
        kind: Secret
        type: kubernetes.io/dockerconfigjson
        metadata:
          name: ghcr-pull
          namespace: loopzero-system
        data:
          .dockerconfigjson: ${DOCKER_CONFIG_B64}
        EOF
        echo "=== ghcr-pull Secret provisioned in {{.CORE_CONTEXT}}/loopzero-system ==="

  # ---------------------------------------------------------------------------
  # Dashboard public flow (local-Caddy demo droplet)
  # Per plan 2026-05-29-dashboard-public-integration-canonicalization.
  # ---------------------------------------------------------------------------

  cloud:caddy:up:
    desc: |
      Start Caddy reverse proxy for the local-public dashboard flow. Caddy
      binds :80 + :443 (requires sudo) and terminates Let's Encrypt TLS for
      app/cloud/auth.loopzero.example. Serves dashboard prod-bundle via file_server
      (canonical Option B per plan caddyfile-app-dev-prod-bundle-file-server-
      canonical v1.1 closing Red Team loopzero-cloud#66). Routes /sessions/* +
      /self-service/* to :14433 (ory-kratos-public), /v1/* to :13002 (cloud).
      v1.2: exports DASHBOARD_DIST to ../loopzero-cloud/dashboard/dist via sudo -E
      so file_server serves the prod-bundle without operator manual env-export.
    cmds:
      - |
        # Pre-check: ports 80/443 must be free
        for port in 80 443; do
          if ss -tlnp 2>/dev/null | grep -q ":$port "; then
            echo "ERROR: port $port already bound. Stop the conflicting service first."
            ss -tlnp | grep ":$port "
            exit 1
          fi
        done
      - |
        if [ ! -f infra/local/Caddyfile ]; then
          echo "ERROR: infra/local/Caddyfile missing. Run T7.1 first."
          exit 1
        fi
      - |
        # v1.2 pre-check: dashboard prod-bundle must exist (file_server canonical
        # path per plan caddyfile-app-dev-prod-bundle-file-server-canonical).
        DASHBOARD_DIST="${DASHBOARD_DIST:-$(pwd)/../loopzero-cloud/dashboard/dist}"
        if [ ! -f "$DASHBOARD_DIST/index.html" ]; then
          echo "ERROR: dashboard prod-bundle missing at $DASHBOARD_DIST/index.html"
          echo "       Build it first: cd ../loopzero-cloud/dashboard && npm run build"
          exit 1
        fi
        echo "Dashboard prod-bundle ready: $DASHBOARD_DIST ($(du -sh "$DASHBOARD_DIST" | cut -f1))"
      - |
        CADDY=$(command -v caddy || echo $HOME/bin/caddy)
        if [ ! -x "$CADDY" ]; then
          echo "ERROR: caddy binary not found. Install from https://caddyserver.com/"
          exit 1
        fi
        DASHBOARD_DIST="${DASHBOARD_DIST:-$(pwd)/../loopzero-cloud/dashboard/dist}"
        export DASHBOARD_DIST
        echo "Starting Caddy (sudo required for :80/:443); DASHBOARD_DIST=$DASHBOARD_DIST"
        sudo -E "$CADDY" start --config infra/local/Caddyfile

  cloud:caddy:down:
    desc: Stop the local Caddy reverse proxy.
    cmds:
      - |
        CADDY=$(command -v caddy || echo $HOME/bin/caddy)
        sudo "$CADDY" stop || echo "Caddy not running"

  cloud:caddy:status:
    desc: Show Caddy status + listening ports.
    cmds:
      - |
        echo "=== Caddy listening on :80 / :443 ==="
        ss -tlnp 2>/dev/null | grep -E ':80 |:443 ' || echo "  (nothing listening on :80/:443)"
        echo ""
        echo "=== Caddy process ==="
        pgrep -alf 'caddy' || echo "  no caddy process"

  cloud:port-forward:up:
    desc: |
      Start the 4 persistent port-forwards that Caddy proxies into. Auto-retry
      on pod recreation (loopzero-cloud pod restart, kratos rollout, etc.). PID
      file at /tmp/loopzero-port-forward-public.pids. T7.3 of plan.
    cmds:
      - bash infra/scripts/local/port-forward-public-dashboard.sh start

  cloud:port-forward:down:
    desc: Stop the 4 persistent port-forwards (clean shutdown of children).
    cmds:
      - bash infra/scripts/local/port-forward-public-dashboard.sh stop

  cloud:port-forward:status:
    desc: Show the 4 port-forwards + their ports.
    cmds:
      - bash infra/scripts/local/port-forward-public-dashboard.sh status

  cloud:stripe:listen:
    desc: |
      Start `stripe listen` forwarding webhook events to the public cloud URL.
      Use during local-public dev to validate Stripe webhook signature flow.
      Requires `stripe login` (one-time per droplet). T4.1 of plan.
      v1.1 EC-D2 pre-check: aborts if stripe CLI is not logged in.
    vars:
      WEBHOOK_URL: '{{.WEBHOOK_URL | default "https://cloud.loopzero.example/v1/webhooks/stripe"}}'
    cmds:
      - |
        if ! command -v stripe >/dev/null 2>&1; then
          echo "ERROR: stripe CLI not installed. https://stripe.com/docs/stripe-cli"
          exit 1
        fi
        # Pre-check: stripe login state
        if ! stripe config --list >/dev/null 2>&1; then
          echo "ERROR: stripe CLI not configured. Run 'stripe login' first."
          exit 1
        fi
      - |
        echo "Forwarding Stripe webhooks → {{.WEBHOOK_URL}}"
        echo "Copy the printed 'webhook signing secret' (whsec_*) and store via:"
        echo ""
        echo "  WHSEC='<paste here>'"
        echo "  kubectl --context {{.CORE_CONTEXT}} -n loopzero-system \\"
        echo "    create secret generic loopzero-stripe-webhook \\"
        echo "    --from-literal=STRIPE_WEBHOOK_SECRET=\$WHSEC \\"
        echo "    --dry-run=client -o yaml | kubectl --context {{.CORE_CONTEXT}} apply -f -"
        echo "  kubectl --context {{.CORE_CONTEXT}} -n loopzero-system rollout restart deploy/loopzero-cloud"
        echo ""
        echo "---"
        stripe listen --forward-to {{.WEBHOOK_URL}}

  cloud:dashboard-public:up:
    desc: |
      Composite: bring up the entire local-public dashboard demo. Runs
      port-forward → caddy → demo seed (skip if data already present).
      Use after `task infra:install:core-dashboard-only` (ENV=dev-public).
    cmds:
      - task: cloud:port-forward:up
      - task: cloud:caddy:up
      - task: demo:seed

  cloud:dashboard-public:down:
    desc: Composite shutdown for the local-public dashboard demo.
    cmds:
      - task: cloud:caddy:down
      - task: cloud:port-forward:down

  demo:seed:
    desc: |
      Idempotent seed of the demo tenant with 2 projects + 8 builds + 5
      releases + audit log entries. T6.1 of plan. Uses FK-respecting DELETE
      order (env_targets → releases → builds → projects).
    cmds:
      - bash infra/scripts/local/seed-demo-data.sh

  # ---------------------------------------------------------------------------
  # T2.2 of plan 2026-06-04-dev-public-domain-canonicalization
  # ---------------------------------------------------------------------------

  dev-public:dns:
    desc: |
      Provision 3 Cloudflare A records pointing at this dev droplet:
      auth-dev.loopzero.example, app-dev.loopzero.example, cloud-dev.loopzero.example.
      Idempotent via CF API (PATCH if exists, POST if missing).
      The Cloudflare token comes from the operator's credentials file and the IP from
      the droplet's metadata service, unless the environment sets them (#455).
    cmds:
      - |
        eval "$(cd cmd/loopzero-ops && go run . creds env)"
        DROPLET_IP="${DROPLET_IP:-$(curl -fsS --max-time 3 http://169.254.169.254/metadata/v1/interfaces/public/0/ipv4/address 2>/dev/null || true)}"
        [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "CLOUDFLARE_API_TOKEN: set it, or add cloudflare.api_token to ~/.loopzero/dev-credentials.json"; exit 1; }
        [ -n "$DROPLET_IP" ] || { echo "DROPLET_IP: set it (not on a droplet, so no metadata service answered)"; exit 1; }
        export DROPLET_IP
        bash infra/scripts/local/setup-dev-public-dns.sh --verify

  dev-public:caddy:
    desc: |
      Start (or reload) the edge with the canonical infra/local/Caddyfile: the
      auth-dev/app-dev/cloud-dev hosts and the *.prod-dev / *.preview-dev app wildcards
      (DNS-01 with the operator's Cloudflare token). Reloads whichever Caddy owns the
      admin API, so a fresh edge-route token always reaches the live edge (#455).
      Idempotent.
    preconditions:
      - sh: command -v caddy >/dev/null 2>&1
        msg: "caddy binary not installed; install from caddyserver.com"
    cmds:
      - |
        eval "$(cd cmd/loopzero-ops && go run . creds env)"
        # The dashboard bundle comes from the loopzero-dashboard image pinned beside the
        # platform images (#462); LOOPZERO_DASHBOARD_DIST, when set, still overrides it.
        env_file=infra/helmfile/environments/dev-public.yaml
        LOOPZERO_DASHBOARD_IMAGE="$(yq -r '.platformImages.registry + "loopzero-dashboard:" + .platformImages.tags."loopzero-dashboard"' "$env_file")"
        export LOOPZERO_DASHBOARD_IMAGE
        bash infra/scripts/local/caddy-up-dev-public.sh --verify

  dev-public:sync-kratos:
    desc: |
      Re-render and apply the ory-kratos release for dev-public: OIDC keys,
      base_redirect_uri, CORS, cookies, selfservice ui_url and the Resend Bearer,
      all from the environment values plus the operator's .env.

      This replaced `dev-public:patch-kratos`, which ran a seed that rewrote the
      live ory-kratos-config ConfigMap after helmfile sync. Every value it wrote is
      what helmfile renders (infra/tests/charts/seeded_wiring_is_rendered_test.go,
      principle_violations#67), so a drift is fixed by re-syncing the release, never
      by patching the object helmfile owns. Kratos rolls on its own: the chart's
      checksum/kratos-config annotation changes with the config.

      Required env (exported from .env):
        LOOPZERO_GITHUB_CLIENT_ID, LOOPZERO_GITHUB_CLIENT_SECRET
        LOOPZERO_GOOGLE_CLIENT_ID, LOOPZERO_GOOGLE_CLIENT_SECRET
        LOOPZERO_RESEND_API_KEY
    cmds:
      - |
        if [ -f .env ]; then
          set -a
          # shellcheck disable=SC1091
          source .env
          set +a
        fi
        # Then ~/.loopzero/dev-credentials.json, the file the seeds read, for what is still
        # unset (#445). The check below still refuses a variable neither source sets.
        eval "$(cd cmd/loopzero-ops && go run . creds env)"
        for var in LOOPZERO_GITHUB_CLIENT_ID LOOPZERO_GITHUB_CLIENT_SECRET LOOPZERO_GOOGLE_CLIENT_ID LOOPZERO_GOOGLE_CLIENT_SECRET LOOPZERO_RESEND_API_KEY; do
          if [ -z "$(printenv "$var")" ]; then
            echo "ERROR: $var is not set (export it, add it to .env, or fill ~/.loopzero/dev-credentials.json) — Kratos would render the REPLACE_VIA_* placeholder"
            exit 1
          fi
        done
        export LOOPZERO_DB_PASSWORD=$(kubectl --context {{.CORE_CONTEXT}} -n loopzero-system \
          get secret loopzero-db-credentials -o go-template='{{`{{.data.password | base64decode}}`}}')
        if [ -z "$LOOPZERO_DB_PASSWORD" ]; then
          echo "ERROR: LOOPZERO_DB_PASSWORD not in loopzero-db-credentials Secret — run generate-secrets.sh first"
          exit 1
        fi
        helmfile -f infra/helmfile/core.helmfile.yaml.gotmpl \
          -e dev-public \
          --kube-context {{.CORE_CONTEXT}} \
          --selector name=ory-kratos \
          sync --skip-deps

  dev-public:trio:
    desc: |
      Runs the non-destructive trio (cleanroom-soft + chaos-soft +
      dogfood-soft + live-proof) against dev-public env. T8.1 of plan
      2026-06-04. Validates the env in ~15s without destroying any
      infrastructure (vs `task clean:all` + `task setup` which take
      ~60min and destroy LIVE state).

      For full destructive trio (real cleanroom + chaos injection):
        task clean:all && LOOPZERO_HELMFILE_ENV=dev-public task setup
        + bash infra/scripts/local/trio-dev-public.sh
    cmds:
      - bash infra/scripts/local/trio-dev-public.sh

  dev-public:test:all:
    desc: |
      Runs ALL 8 dev-public test suites (4 hermetic + 4 LIVE) and
      reports per-suite verdict + aggregate. T8.1+ of plan 2026-06-04.
      Use as pre-merge gate (after any dev-public script edit) or as
      daily health check.

      Composition:
        Hermetic (~3s, no network):
          - dev-public-env_test.sh                15 asserts
          - check-live-proof-syntax_test.sh       22 asserts
          - check-trio-dev-public-syntax_test.sh  17 asserts
          - check-dev-public-scripts-syntax_test  23 asserts
        LIVE (~30s, needs Caddy + Kratos + loopzero-cloud running):
          - dev-public-oidc-redirect_test.sh       8 asserts
          - dev-public-billing-portal_test.sh      5 asserts
          - live-proof-dev-public.sh               9 asserts
          - trio-dev-public.sh                     4 asserts

      Expected aggregate: 8 suites GREEN / 103 assertions PASS.
    cmds:
      - bash infra/scripts/local/test-all-dev-public.sh

  dev-public:test:hermetic:
    desc: Hermetic-only mode of `test:all` — ~3s, suitable for CI gate.
    cmds:
      - bash infra/scripts/local/test-all-dev-public.sh --hermetic-only

  dev-public:bootstrap:
    desc: |
      Full dev-public bootstrap on the operator droplet (loopzero-e2e-runner).
      Composes DNS + Caddy + (platform helmfile sync deferred until clusters
      created via parent `task setup`) + Kratos ConfigMap patch.

      Recommended invocation (operator):
        export $(grep -E '^LOOPZERO_|^CLOUDFLARE_|^DROPLET_IP' .env | xargs)
        task infrafile:dev-public:bootstrap

      Per T2.2 of plan 2026-06-04: this target is the dev-public default
      entrypoint. To run the legacy localhost-only setup, use the parent
      `task setup` directly (without dev-public wrapper).
    deps:
      - dev-public:dns
      - dev-public:caddy
    cmds:
      - |
        printf '[dev-public:bootstrap] DNS + Caddy OK.\n'
        printf '[dev-public:bootstrap] Next: \n'
        printf '  LOOPZERO_HELMFILE_ENV=dev-public task setup\n'
        printf '  Then visit: https://app-dev.loopzero.example/login\n'

  # ---------------------------------------------------------------------------
