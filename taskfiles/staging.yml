# The staging environment: production's AWS infrastructure, at a smaller scale, on the AWS
# emulator on one Linux host.
#
# The emulator (github.com/paulohenriquevn/aws-emulator, a pinned release) serves the AWS
# APIs as a systemd service, and its EKS provisioner runs every EKS cluster the emulator
# holds as a kind cluster, with the cluster's node group instances as its nodes. The same
# Terraform that builds production (infra-modules, infra-live) is applied against the
# emulator, and the platform is installed on the clusters it creates.
#
# The emulator keeps its state in memory, so a restart empties it: `staging:up` rebuilds
# the environment from nothing, and a reboot or a crash is recovered the same way.
#
#   task staging:host      once per host, as root: packages, tools, kernel limits, services
#   task staging:up        rebuild the infrastructure and the platform from nothing
#   task staging:edge      serve the public hostnames through the core ALB (Caddy, Let's Encrypt)
#   task staging:down      stop the emulator and remove everything it ran
#   task staging:status    what is running
#
# The host layout is in infra/staging/README.md.

version: '3'

vars:
  STAGING_ROOT: /var/lib/loop-runtime-staging
  # The emulator's home and port, where its CLI configuration, keys and CA are written.
  EMULATOR_HOME: /var/lib/aws-emulator
  EMULATOR_PORT: 9597
  # The infra-live staging environment applied against the emulator.
  # infra-live and infra-modules side by side, as infra-live's local sources expect them.
  # Both are private: the host reads them with one read-only deploy key each, named by the
  # github-infra-live and github-infra-modules aliases of /root/.ssh/config.
  IAC_ROOT: /opt/staging-iac
  IAC_BRANCH: develop
  IAC_DIR: /opt/staging-iac/infra-live/staging/us-east-1/staging
  # The emulator release the environment runs, and the SHA-256 of its Linux binary.
  EMULATOR_REPOSITORY: paulohenriquevn/aws-emulator
  # The emulator release the environment runs, and the SHA-256 of its two Linux binaries.
  EMULATOR_VERSION: v0.4.3-rc.6
  EMULATOR_SHA256: 2102d53d6f0df88e4fe4f823ce53ff67fa42bf31334de37234bc3deb7f83c9b2
  PROVISIONER_SHA256: 5b1a7b200b983948a57cc458d354f65e7624dd63081b5cfea2fbe0bf9f77b7c7
  EMULATOR_DIR: /opt/aws-emulator/{{.EMULATOR_VERSION}}
  # Tool versions. kind and helm are the ones the emulator's own CI runs its harness with.
  KIND_VERSION: v0.31.0
  KUBECTL_VERSION: v1.35.0
  HELM_VERSION: v3.22.1
  HELMFILE_VERSION: v1.8.4
  # The versions infra-live's CI plans and applies with.
  TERRAFORM_VERSION: 1.14.6
  TERRAGRUNT_VERSION: v1.0.8
  # Caddy is the public edge, in place of CloudFront and ACM.
  CADDY_VERSION: v2.10.0
  LEGO_VERSION: v5.6.0
  # infra/staging/deploy.sh reads the image pins of the staging environment with it.
  YQ_VERSION: v4.54.1
  # seed-aws-cosign-key.sh generates the build's signing key pair with it; the version the
  # loop-runtime-cosign-signer image signs with.
  COSIGN_VERSION: v2.6.5
  # The emulator listens on the gateway of its own Docker network; each VPC Terraform
  # creates gets a Docker network with the VPC's CIDR, which falls in 10.0.0.0/8.
  EMULATOR_SUBNET: 172.29.0.0/16
  VPC_SUPERNET: 10.0.0.0/8
  EMULATOR_ADDRESS: 172.29.0.1
  # The public edge (`staging:edge`): the hostnames it serves, one Let's Encrypt
  # certificate each, and the cluster whose ALB it passes requests to. Only the hostnames
  # with a route are public: the API, login (auth., the public-routes release) and the
  # console (app. and cloud., routed once profile.loopRuntimeCloud is on; until then Traefik
  # answers them 404). Grafana, ArgoCD and Gitea never are.
  EDGE_HOSTS: api.staging.getloopscale.com,auth.staging.getloopscale.com,app.staging.getloopscale.com,cloud.staging.getloopscale.com
  EDGE_CLUSTER: loop-runtime-staging-core
  EDGE_APPS_DOMAIN: apps.staging.getloopscale.com
  EDGE_APPS_KVS: loop-runtime-staging-app-routes
  EDGE_HEALTH_URL: https://api.staging.getloopscale.com/api/v1/health/ready
  # Custom domains: Caddy issues their certificates on demand after it asks the API's route
  # lookup, and never for a name under the platform's own zone.
  EDGE_PLATFORM_DOMAIN: getloopscale.com
  EDGE_API_HOST: api.staging.getloopscale.com
  EDGE_ASK_PORT: 9180

tasks:
  host:
    desc: Prepare this host for staging (run as root, idempotent)
    preconditions:
      - sh: test "$(id -u)" -eq 0
        msg: staging:host installs packages and system units, so it runs as root
    cmds:
      - task: host:packages
      - task: host:tools
      - task: host:kernel
      - task: host:firewall
      - task: host:emulator
      - task: host:units

  host:packages:
    internal: true
    cmds:
      - apt-get update -qq
      - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git jq curl openssl unzip ca-certificates tcpdump postgresql-client python3 >/dev/null
      - docker version --format '{{"{{"}}.Server.Version{{"}}"}}'

  host:tools:
    internal: true
    cmds:
      - |
        set -euo pipefail
        install_binary() { install -m 0755 "$1" "/usr/local/bin/$2"; }
        tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
        if [ "$(kind version -q 2>/dev/null || true)" != "{{.KIND_VERSION}}" ]; then
          curl -fsSLo "$tmp/kind" "https://github.com/kubernetes-sigs/kind/releases/download/{{.KIND_VERSION}}/kind-linux-amd64"
          install_binary "$tmp/kind" kind
        fi
        if ! kubectl version --client 2>/dev/null | grep -q "{{.KUBECTL_VERSION}}"; then
          curl -fsSLo "$tmp/kubectl" "https://dl.k8s.io/release/{{.KUBECTL_VERSION}}/bin/linux/amd64/kubectl"
          curl -fsSLo "$tmp/kubectl.sha256" "https://dl.k8s.io/release/{{.KUBECTL_VERSION}}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat "$tmp/kubectl.sha256")  $tmp/kubectl" | sha256sum --check --quiet
          install_binary "$tmp/kubectl" kubectl
        fi
        if ! helm version --short 2>/dev/null | grep -q "^{{.HELM_VERSION}}"; then
          curl -fsSLo "$tmp/helm.tgz" "https://get.helm.sh/helm-{{.HELM_VERSION}}-linux-amd64.tar.gz"
          curl -fsSLo "$tmp/helm.tgz.sha256sum" "https://get.helm.sh/helm-{{.HELM_VERSION}}-linux-amd64.tar.gz.sha256sum"
          (cd "$tmp" && sed "s#helm-{{.HELM_VERSION}}-linux-amd64.tar.gz#helm.tgz#" helm.tgz.sha256sum | sha256sum --check --quiet)
          tar -xzf "$tmp/helm.tgz" -C "$tmp" && install_binary "$tmp/linux-amd64/helm" helm
        fi
        if ! helmfile version 2>/dev/null | grep -q "{{.HELMFILE_VERSION}}"; then
          version={{.HELMFILE_VERSION}}
          curl -fsSLo "$tmp/helmfile.tgz" "https://github.com/helmfile/helmfile/releases/download/$version/helmfile_${version#v}_linux_amd64.tar.gz"
          tar -xzf "$tmp/helmfile.tgz" -C "$tmp" helmfile && install_binary "$tmp/helmfile" helmfile
        fi
        if ! caddy version 2>/dev/null | grep -q "^{{.CADDY_VERSION}}"; then
          version={{.CADDY_VERSION}}
          base=https://github.com/caddyserver/caddy/releases/download/$version
          curl -fsSLo "$tmp/caddy.tgz" "$base/caddy_${version#v}_linux_amd64.tar.gz"
          curl -fsSLo "$tmp/caddy.sums" "$base/caddy_${version#v}_checksums.txt"
          echo "$(awk -v f="caddy_${version#v}_linux_amd64.tar.gz" '$2 == f {print $1}' "$tmp/caddy.sums")  $tmp/caddy.tgz" | sha512sum --check --quiet
          tar -xzf "$tmp/caddy.tgz" -C "$tmp" caddy && install_binary "$tmp/caddy" caddy
        fi
        version={{.LEGO_VERSION}}
        if ! lego --version 2>/dev/null | grep -q "^lego version ${version#v} "; then
          base=https://github.com/go-acme/lego/releases/download/$version
          curl -fsSLo "$tmp/lego.tgz" "$base/lego_${version}_linux_amd64.tar.gz"
          curl -fsSLo "$tmp/lego.sums" "$base/lego_${version#v}_checksums.txt"
          echo "$(awk -v f="lego_${version}_linux_amd64.tar.gz" '$2 == f {print $1}' "$tmp/lego.sums")  $tmp/lego.tgz" | sha256sum --check --quiet
          tar -xzf "$tmp/lego.tgz" -C "$tmp" lego && install_binary "$tmp/lego" lego
        fi
        if ! terraform version 2>/dev/null | grep -q "^Terraform v{{.TERRAFORM_VERSION}}$"; then
          base=https://releases.hashicorp.com/terraform/{{.TERRAFORM_VERSION}}
          curl -fsSLo "$tmp/terraform.zip" "$base/terraform_{{.TERRAFORM_VERSION}}_linux_amd64.zip"
          curl -fsSLo "$tmp/terraform.sums" "$base/terraform_{{.TERRAFORM_VERSION}}_SHA256SUMS"
          echo "$(awk '$2 == "terraform_{{.TERRAFORM_VERSION}}_linux_amd64.zip" {print $1}' "$tmp/terraform.sums")  $tmp/terraform.zip" | sha256sum --check --quiet
          unzip -oq "$tmp/terraform.zip" terraform -d "$tmp" && install_binary "$tmp/terraform" terraform
        fi
        if ! terragrunt --version 2>/dev/null | grep -q "{{.TERRAGRUNT_VERSION}}$"; then
          base=https://github.com/gruntwork-io/terragrunt/releases/download/{{.TERRAGRUNT_VERSION}}
          curl -fsSLo "$tmp/terragrunt" "$base/terragrunt_linux_amd64"
          curl -fsSLo "$tmp/terragrunt.sums" "$base/SHA256SUMS"
          echo "$(awk '$2 == "terragrunt_linux_amd64" {print $1}' "$tmp/terragrunt.sums")  $tmp/terragrunt" | sha256sum --check --quiet
          install_binary "$tmp/terragrunt" terragrunt
        fi
        if ! yq --version 2>/dev/null | grep -q "version {{.YQ_VERSION}}$"; then
          base=https://github.com/mikefarah/yq/releases/download/{{.YQ_VERSION}}
          curl -fsSLo "$tmp/yq" "$base/yq_linux_amd64"
          curl -fsSLo "$tmp/yq.sums" "$base/checksums"
          curl -fsSLo "$tmp/yq.order" "$base/checksums_hashes_order"
          # checksums has one line per file: the name, then one hash per line of the order file.
          column=$(( $(grep -nx 'SHA-256' "$tmp/yq.order" | cut -d: -f1) + 1 ))
          echo "$(awk -v c="$column" '$1 == "yq_linux_amd64" {print $c}' "$tmp/yq.sums")  $tmp/yq" | sha256sum --check --quiet
          install_binary "$tmp/yq" yq
        fi
        if ! cosign version 2>/dev/null | grep -q "GitVersion: *{{.COSIGN_VERSION}}$"; then
          base=https://github.com/sigstore/cosign/releases/download/{{.COSIGN_VERSION}}
          curl -fsSLo "$tmp/cosign" "$base/cosign-linux-amd64"
          curl -fsSLo "$tmp/cosign.sums" "$base/cosign_checksums.txt"
          echo "$(awk '$2 == "cosign-linux-amd64" {print $1}' "$tmp/cosign.sums")  $tmp/cosign" | sha256sum --check --quiet
          install_binary "$tmp/cosign" cosign
        fi
        if ! command -v aws >/dev/null; then
          curl -fsSLo "$tmp/awscli.zip" https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
          unzip -q "$tmp/awscli.zip" -d "$tmp" && "$tmp/aws/install"
        fi
      - kind version
      - kubectl version --client
      - helm version --short
      - helmfile version
      - aws --version
      - terraform version
      - terragrunt --version
      - caddy version
      - lego --version

  host:kernel:
    internal: true
    desc: The inotify limits a multi-node kind cluster with the whole platform needs
    cmds:
      - |
        cat >/etc/sysctl.d/90-loop-runtime-staging.conf <<'EOF'
        # kind runs every node's kubelet and every pod on this kernel; the defaults (128
        # instances) make pods fail with "too many open files".
        fs.inotify.max_user_instances = 8192
        fs.inotify.max_user_watches = 1048576
        EOF
      - sysctl --quiet --system

  host:firewall:
    internal: true
    desc: Only SSH and the public edge from the internet; the kind nodes may reach the host
    cmds:
      # Docker publishes container ports through its own chains, so ufw does not cover
      # them; it does cover traffic INTO the host. The kind nodes reach the emulator and
      # the database containers on the network gateway, which is the host, and the default
      # deny dropped exactly that (measured 2026-11-21: every harness check failed with
      # `[UFW BLOCK] SRC=172.29.0.4 DST=172.29.0.1 DPT=9597`).
      - ufw default deny incoming >/dev/null
      - ufw default allow outgoing >/dev/null
      - ufw allow 22/tcp >/dev/null
      - ufw allow 80/tcp >/dev/null
      - ufw allow 443/tcp >/dev/null
      - ufw allow in from {{.EMULATOR_SUBNET}} comment 'containers to the emulator on the host' >/dev/null
      # The VPCs' networks: nodes reach the emulator, and API servers the token webhook.
      - ufw allow in from {{.VPC_SUPERNET}} comment 'VPC networks to the emulator and its EKS provisioner' >/dev/null
      - ufw --force enable >/dev/null
      - ufw status numbered

  host:emulator:
    internal: true
    desc: The pinned emulator release, both binaries checked against their SHA-256
    status:
      - echo "{{.EMULATOR_SHA256}}  {{.EMULATOR_DIR}}/aws-emulator-fork-linux-x64" | sha256sum --check --quiet
      - echo "{{.PROVISIONER_SHA256}}  {{.EMULATOR_DIR}}/eks-provisioner-linux-x64" | sha256sum --check --quiet
      - test "$(readlink /opt/aws-emulator/current)" = "{{.EMULATOR_DIR}}"
    cmds:
      - mkdir -p {{.EMULATOR_DIR}}
      - curl -fsSLo {{.EMULATOR_DIR}}/aws-emulator-fork-linux-x64 https://github.com/{{.EMULATOR_REPOSITORY}}/releases/download/{{.EMULATOR_VERSION}}/aws-emulator-fork-linux-x64
      - echo "{{.EMULATOR_SHA256}}  {{.EMULATOR_DIR}}/aws-emulator-fork-linux-x64" | sha256sum --check
      - curl -fsSLo {{.EMULATOR_DIR}}/eks-provisioner-linux-x64 https://github.com/{{.EMULATOR_REPOSITORY}}/releases/download/{{.EMULATOR_VERSION}}/eks-provisioner-linux-x64
      - echo "{{.PROVISIONER_SHA256}}  {{.EMULATOR_DIR}}/eks-provisioner-linux-x64" | sha256sum --check
      - chmod 0755 {{.EMULATOR_DIR}}/aws-emulator-fork-linux-x64 {{.EMULATOR_DIR}}/eks-provisioner-linux-x64
      - ln -sfn {{.EMULATOR_DIR}} /opt/aws-emulator/current

  host:units:
    internal: true
    desc: The emulator and its EKS provisioner as systemd services
    cmds:
      - install -m 0644 {{.ROOT_DIR}}/infra/staging/systemd/aws-emulator.service {{.ROOT_DIR}}/infra/staging/systemd/aws-emulator-eks.service {{.ROOT_DIR}}/infra/staging/systemd/aws-emulator-localhost.socket {{.ROOT_DIR}}/infra/staging/systemd/aws-emulator-localhost.service /etc/systemd/system/
      - systemctl daemon-reload
      - systemctl enable --now aws-emulator.service aws-emulator-eks.service aws-emulator-localhost.socket

  up:
    desc: Rebuild the infrastructure and the platform from nothing
    cmds:
      - task: down
      - task: emulator
      - task: infrastructure
      - task: platform
      - task: edge

  emulator:
    desc: Start the emulator and its EKS provisioner, empty
    cmds:
      # `down` just stopped the emulator, so a new EMULATOR_VERSION or unit reaches the
      # host here: the nightly rebuild runs `up`, never staging:host.
      - task: host:emulator
      - task: host:units
      - systemctl start aws-emulator.service aws-emulator-eks.service
      - |
        for _ in $(seq 60); do
          systemctl is-active --quiet aws-emulator-eks.service && exit 0
          sleep 1
        done
        journalctl -u aws-emulator -u aws-emulator-eks -n 50 --no-pager >&2
        exit 1

  infrastructure:
    desc: Apply the staging environment of infra-live against the emulator
    env:
      HOME: /root
      AWS_EMULATOR_ENDPOINT: 'https://localhost:{{.EMULATOR_PORT}}'
      AWS_EMULATOR_PORT: '{{.EMULATOR_PORT}}'
      AWS_EMULATOR_HOME: '{{.EMULATOR_HOME}}'
    cmds:
      - |
        set -euo pipefail
        for repo in infra-live infra-modules; do
          dir="{{.IAC_ROOT}}/$repo"
          if [ ! -d "$dir/.git" ]; then
            rm -rf "$dir"
            git clone --quiet "git@github-$repo:getloopscale/$repo.git" "$dir"
          fi
          git -C "$dir" fetch --quiet origin {{.IAC_BRANCH}}
          git -C "$dir" switch --quiet --detach FETCH_HEAD
          echo "$repo at $(git -C "$dir" rev-parse --short HEAD)"
        done
        # The emulator's state starts empty after `down`, the Terraform state bucket with
        # it, so no unit may keep a backend initialised against the previous one.
        find "{{.IAC_ROOT}}/infra-live/staging" -type d -name .terragrunt-cache -prune -exec rm -rf {} +
        emulator={{.EMULATOR_HOME}}/.aws/emulator/{{.EMULATOR_PORT}}
        bucket=loopscale-tfstate-000000000000-us-east-1
        export_emulator() {
          AWS_CONFIG_FILE=$emulator/config AWS_SHARED_CREDENTIALS_FILE=$emulator/emulator_credentials \
            AWS_CA_BUNDLE=$emulator/ca.pem AWS_ENDPOINT_URL=$AWS_EMULATOR_ENDPOINT AWS_REGION=us-east-1 "$@"
        }
        export_emulator aws s3api head-bucket --bucket "$bucket" 2>/dev/null \
          || export_emulator aws s3api create-bucket --bucket "$bucket" >/dev/null
        # root.hcl names the emulator's keys in the provider; nothing else may be read.
        cd "{{.IAC_ROOT}}/infra-live/staging"
        AWS_CONFIG_FILE=/dev/null AWS_SHARED_CREDENTIALS_FILE=/dev/null \
          terragrunt run --all --non-interactive -- apply -input=false -auto-approve

  platform:
    desc: Install the platform on the staging clusters
    # The same helmfiles and the same `staging` environment a production AWS environment
    # would sync, fed with the outputs of the infra-live units that were applied. Secrets
    # come from the emulator's Secrets Manager through External Secrets; nothing here
    # writes a credential into a cluster except the in-cluster wiring of
    # bootstrap-aws-clusters.sh.
    env:
      KUBECONFIG: '{{.STAGING_ROOT}}/kubeconfig'
      AWS_CONFIG_FILE: '{{.EMULATOR_HOME}}/.aws/emulator/{{.EMULATOR_PORT}}/config'
      AWS_SHARED_CREDENTIALS_FILE: '{{.EMULATOR_HOME}}/.aws/emulator/{{.EMULATOR_PORT}}/emulator_credentials'
      AWS_CA_BUNDLE: '{{.EMULATOR_HOME}}/.aws/emulator/{{.EMULATOR_PORT}}/ca.pem'
      AWS_ENDPOINT_URL: 'https://localhost:{{.EMULATOR_PORT}}'
      AWS_REGION: us-east-1
      # Each helmfile's own kubeContext reads these, so no invocation passes --kube-context.
      LOOP_RUNTIME_CORE_CONTEXT: core
      LOOP_RUNTIME_BUILD_CONTEXT: build
    cmds:
      # The every-commit deploy runs this task alone, so the tools it calls install here;
      # host:tools only downloads what is missing or at another version.
      - task: host:tools
      - task: platform:kubeconfig
      - |
        set -euo pipefail
        eval "$(task staging:platform:outputs)"
        bash infra/helmfile/scripts/seed-aws-platform-secret.sh loop-runtime/staging/platform
        bash infra/helmfile/scripts/seed-aws-cosign-key.sh loop-runtime/staging/cosign-signing-key
        # Secrets no script can generate, kept on the host only (mode 0600), and written
        # into the emulator's Secrets Manager again after every rebuild empties it.
        #   ghcr-pull.json: {"username", "password"}, a classic token with read:packages for
        #   the console's private images (aws.imagePullSecret).
        #   resend.json: {"api-key"}, the Resend key Kratos's courier sends with
        #   (aws.resendSecret).
        #   stripe.json: {"api-key", "webhook-secret", "price-starter", "price-pro",
        #   "price-team"}, Stripe test-mode keys and plan prices for
        #   loop-console (aws.stripeSecret).
        #   github-app.json: {"app-id", "private-key", "webhook-secret", "client-id",
        #   "client-secret"}, the staging GitHub App loop-runtime-api deploys from
        #   (aws.githubAppSecret).
        for name in ghcr-pull resend stripe github-app; do
          kept=/etc/loop-runtime-staging/$name.json
          [ -f "$kept" ] || { echo "warning: no $kept, loop-runtime/staging/$name is not seeded" >&2; continue; }
          if aws secretsmanager describe-secret --secret-id "loop-runtime/staging/$name" >/dev/null 2>&1; then
            aws secretsmanager put-secret-value --secret-id "loop-runtime/staging/$name" --secret-string "file://$kept" >/dev/null
          else
            aws secretsmanager create-secret --name "loop-runtime/staging/$name" --kms-key-id alias/loop-runtime-staging \
              --secret-string "file://$kept" >/dev/null
          fi
        done
        # The App's OAuth client id is public, and loop-console takes it as plain
        # configuration (values/staging/loop-console.yaml.gotmpl). Nothing else is read
        # from the file here; without the file the console's connect flow stays off.
        LOOP_RUNTIME_GITHUB_APP_CLIENT_ID=""
        if [ -f /etc/loop-runtime-staging/github-app.json ]; then
          LOOP_RUNTIME_GITHUB_APP_CLIENT_ID="$(jq -r '."client-id" // ""' /etc/loop-runtime-staging/github-app.json)"
        fi
        export LOOP_RUNTIME_GITHUB_APP_CLIENT_ID
        # The sandbox service (getloopscale/loop-sandbox), on the host's Docker: its
        # container driver needs a Docker daemon, and the EKS nodes of the emulator run
        # containerd. A production environment gives it hosts of its own. It trusts the
        # public half of the key loop-console signs with, which the seed above wrote, and
        # it starts before the core sync installs the console that calls it.
        SANDBOX_GATEWAY_PUBKEY="$(aws secretsmanager get-secret-value --secret-id loop-runtime/staging/platform \
          --query SecretString --output text | jq -er '."service-auth-ed25519-public-key"')"
        export SANDBOX_GATEWAY_PUBKEY
        bash infra/staging/sandbox.sh up
        LOOP_RUNTIME_SANDBOX_API_URL="$(bash infra/staging/sandbox.sh address)"
        export LOOP_RUNTIME_SANDBOX_API_URL
        bash infra/helmfile/scripts/bootstrap-aws-clusters.sh pre-core
        # The ServiceMonitor, PodMonitor and PrometheusRule CRDs every cluster's charts
        # create objects of, from the same manifests infra:install:monitoring-crds applies.
        # That task is not called: its contexts are the Taskfile's global k3d ones, which a
        # caller cannot override, and a called task does not inherit KUBECONFIG.
        crds=https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd
        for ctx in core build cell-0 cell-1 secrets; do
          kubectl --context "$ctx" create namespace monitoring --dry-run=client -o yaml | kubectl --context "$ctx" apply -f - >/dev/null
          kubectl --context "$ctx" apply --server-side \
            -f "$crds/monitoring.coreos.com_servicemonitors.yaml" \
            -f "$crds/monitoring.coreos.com_prometheusrules.yaml" \
            -f "$crds/monitoring.coreos.com_podmonitors.yaml"
          # Staging only: the emulator's EKS cluster is a kind cluster, whose control-plane
          # node is a Kubernetes node (an EKS control plane is not) and is no EC2 instance
          # (its providerID is kind://). The AWS Load Balancer Controller registers every
          # node as an instance target unless the node carries this label, and fails the
          # whole target group on that one ("providerID kind://... is invalid for EC2
          # instances"). On EKS no node matches the selector.
          kubectl --context "$ctx" label nodes -l node-role.kubernetes.io/control-plane \
            node.kubernetes.io/exclude-from-external-load-balancers=true --overwrite >/dev/null
        done
        # Staging only: a pod with an IRSA role that the emulator's EKS layer never wired to
        # the emulator calls the real AWS and fails; nothing replaces it by itself.
        bash infra/staging/restart-uninjected-pods.sh core build cell-0 cell-1 secrets
        # OpenBao on the secrets cluster before the core sync: loop-runtime-api encrypts
        # tenant secrets with its transit engine and reads the AppRole this writes.
        # The seal user's access key goes to that script alone, not into this shell.
        (eval "$(task staging:platform:openbao-seal-key)"; bash infra/staging/openbao.sh)
        # The monitoring of the four clusters goes through internal ALBs whose DNSNames
        # exist only once the sync that creates each Ingress is done: the build cluster's
        # Loki (for the Promtail of core and the cells) and the federation Prometheus of
        # the build cluster and of each cell (for the core Prometheus). What a previous
        # deploy published is read first, so the core Prometheus keeps federating during
        # the syncs; a rebuild has none yet.
        eval "$(bash infra/staging/monitoring-addresses.sh metrics)"
        # loop-runtime-api reads the build cluster's Loki through the same ALB as Promtail.
        eval "$(bash infra/staging/monitoring-addresses.sh loki)"
        # infra/staging/deploy.sh pins the images of the commit it deploys through
        # STAGING_STATE_VALUES, a values file layered over the staging environment.
        # core's Promtail needs the Loki ALB, which the build sync creates: it is synced last.
        # So is loop-edge, the custom domain fleet: it proxies to the cells' load balancers.
        helmfile --selector 'name!=promtail,name!=loop-edge' -f infra/helmfile/core.helmfile.yaml.gotmpl -e staging ${STAGING_STATE_VALUES:+--state-values-file "$STAGING_STATE_VALUES"} sync
        helmfile -f infra/helmfile/build.helmfile.yaml.gotmpl -e staging ${STAGING_STATE_VALUES:+--state-values-file "$STAGING_STATE_VALUES"} sync
        eval "$(bash infra/staging/monitoring-addresses.sh loki --wait 600)"
        # The cells' broker store calls loop-runtime-api's secret-fetch endpoint through core's
        # internal ALB, which the core sync above made.
        eval "$(bash infra/staging/monitoring-addresses.sh core-api --wait 600)"
        for cell in cell-0 cell-1; do
          LOOP_RUNTIME_CELL_CONTEXT=$cell helmfile -f infra/helmfile/cell.helmfile.yaml.gotmpl -e staging ${STAGING_STATE_VALUES:+--state-values-file "$STAGING_STATE_VALUES"} sync
        done
        eval "$(bash infra/staging/monitoring-addresses.sh metrics --wait 600)"
        # loop-runtime-api again, for a rebuild: its first core sync ran before the Loki ALB existed.
        helmfile --selector name=promtail --selector name=prometheus --selector name=loop-runtime-api -f infra/helmfile/core.helmfile.yaml.gotmpl -e staging ${STAGING_STATE_VALUES:+--state-values-file "$STAGING_STATE_VALUES"} sync
        # loop-edge, the fleet that serves custom domains in production. On staging the host's
        # Caddy holds the public ports, so the fleet gets no load balancer; it runs so that
        # every deploy proves its image, its shared certificate store and its proxying.
        # Staging only: the cells' load balancers and Valkey present certificates of the
        # emulator's authority, which reaches a pod with an IRSA role and no other.
        eval "$(bash infra/staging/monitoring-addresses.sh cell-origins --wait 600)"
        kubectl --context core -n loop-runtime-system create configmap loop-edge-emulator-ca \
          --from-file=ca.pem="$AWS_CA_BUNDLE" --dry-run=client -o yaml | kubectl --context core apply -f - >/dev/null
        helmfile --selector name=loop-edge -f infra/helmfile/core.helmfile.yaml.gotmpl -e staging ${STAGING_STATE_VALUES:+--state-values-file "$STAGING_STATE_VALUES"} sync
        kubectl --context core -n loop-runtime-system rollout status deployment/loop-edge --timeout=180s
        # The middlewares the routes name (traefik-rate-limit, traefik-body-limit), which
        # are not a release: infra:install:cell applies the same file after its sync.
        # Traefik disables a route whose middleware does not exist.
        for ctx in core cell-0 cell-1; do
          kubectl --context "$ctx" apply -f infra/helm/traefik/middlewares.yaml
        done
        bash infra/helmfile/scripts/bootstrap-aws-clusters.sh post-core
      - task: platform:verify
      # One secret-fetch broker token per cell, for loop-runtime-api and each cell's broker
      # store. After platform:verify: the seed restarts the API and waits for it to be
      # Ready. Tokens already issued are kept, so a redeploy does not rotate them.
      - bash infra/helmfile/scripts/bootstrap-aws-clusters.sh broker-tokens

  platform:kubeconfig:
    internal: true
    desc: One kubeconfig, one context per EKS cluster, named after the cluster's role
    env:
      AWS_CONFIG_FILE: '{{.EMULATOR_HOME}}/.aws/emulator/{{.EMULATOR_PORT}}/config'
      AWS_SHARED_CREDENTIALS_FILE: '{{.EMULATOR_HOME}}/.aws/emulator/{{.EMULATOR_PORT}}/emulator_credentials'
      AWS_CA_BUNDLE: '{{.EMULATOR_HOME}}/.aws/emulator/{{.EMULATOR_PORT}}/ca.pem'
      AWS_ENDPOINT_URL: 'https://localhost:{{.EMULATOR_PORT}}'
      AWS_REGION: us-east-1
    cmds:
      - mkdir -p {{.STAGING_ROOT}}
      - |
        set -euo pipefail
        for cluster in core build cell-0 cell-1 secrets; do
          aws eks update-kubeconfig --name "loop-runtime-staging-$cluster" --alias "$cluster" \
            --kubeconfig {{.STAGING_ROOT}}/kubeconfig >/dev/null
        done
        chmod 600 {{.STAGING_ROOT}}/kubeconfig

  platform:outputs:
    desc: The infra-live outputs the staging environment reads, as shell exports
    env:
      HOME: /root
      AWS_EMULATOR_ENDPOINT: 'https://localhost:{{.EMULATOR_PORT}}'
      AWS_EMULATOR_PORT: '{{.EMULATOR_PORT}}'
      AWS_EMULATOR_HOME: '{{.EMULATOR_HOME}}'
      # root.hcl names the emulator's keys in the provider; nothing else may be read.
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
    silent: true
    cmds:
      - |
        set -euo pipefail
        out() { (cd "{{.IAC_DIR}}/$1" && terragrunt output -raw "$2" 2>/dev/null); }
        printf 'export LOOP_RUNTIME_DB_HOST="%s"\n' "$(out data/rds address)"
        printf 'export LOOP_RUNTIME_DB_PORT="%s"\n' "$(out data/rds port)"
        printf 'export LOOP_RUNTIME_DB_NAME="%s"\n' "$(out data/rds db_name)"
        printf 'export LOOP_RUNTIME_DB_MASTER_SECRET="%s"\n' "$(out data/rds master_user_secret_arn)"
        printf 'export LOOP_RUNTIME_CACHE_HOST="%s"\n' "$(out data/valkey primary_endpoint_address)"
        printf 'export LOOP_RUNTIME_CACHE_PORT="%s"\n' "$(out data/valkey port)"
        printf 'export LOOP_RUNTIME_CACHE_AUTH_SECRET="%s"\n' "$(out data/valkey auth_token_secret_arn)"
        printf 'export LOOP_RUNTIME_VPC_ID="%s"\n' "$(out networking/vpc vpc_id)"
        printf 'export LOOP_RUNTIME_EDGE_KVS_ARN="%s"\n' "$(out edge/app-routes arn)"
        printf 'export OPENBAO_AWS_KMS_KEY_ID="%s"\n' "$(out security/kms-openbao-unseal key_arn)"

  platform:openbao-seal-key:
    desc: The access key OpenBao's seal authenticates with on the emulator, as shell exports
    env:
      HOME: /root
      AWS_EMULATOR_ENDPOINT: 'https://localhost:{{.EMULATOR_PORT}}'
      AWS_EMULATOR_PORT: '{{.EMULATOR_PORT}}'
      AWS_EMULATOR_HOME: '{{.EMULATOR_HOME}}'
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
    silent: true
    cmds:
      - |
        set -euo pipefail
        cd "{{.IAC_DIR}}/identity/secrets-openbao-seal-user"
        printf 'export OPENBAO_SEAL_ACCESS_KEY_ID="%s"\n' "$(terragrunt output -raw access_key_id 2>/dev/null)"
        printf 'export OPENBAO_SEAL_SECRET_ACCESS_KEY="%s"\n' "$(terragrunt output -raw secret_access_key 2>/dev/null)"

  platform:verify:
    internal: true
    desc: loop-runtime-api Ready on core, connected to RDS, its health endpoint answering
    env:
      KUBECONFIG: '{{.STAGING_ROOT}}/kubeconfig'
      AWS_CONFIG_FILE: '{{.EMULATOR_HOME}}/.aws/emulator/{{.EMULATOR_PORT}}/config'
      AWS_SHARED_CREDENTIALS_FILE: '{{.EMULATOR_HOME}}/.aws/emulator/{{.EMULATOR_PORT}}/emulator_credentials'
      AWS_CA_BUNDLE: '{{.EMULATOR_HOME}}/.aws/emulator/{{.EMULATOR_PORT}}/ca.pem'
      AWS_ENDPOINT_URL: 'https://localhost:{{.EMULATOR_PORT}}'
      AWS_REGION: us-east-1
    cmds:
      # The API exits at boot while no ClusterCredential is connected, so the pod that
      # started before post-core ran is replaced rather than waited for. The stamp is to
      # the nanosecond: `kubectl rollout restart` stamps the second, and refuses a restart
      # in the same second as the one the argocd-token seed has just made.
      - >-
        kubectl --context core -n loop-runtime-system patch deployment/loop-runtime-api --type merge
        -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"kubectl.kubernetes.io/restartedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)\"}}}}}"
      - kubectl --context core -n loop-runtime-system rollout status deployment/loop-runtime-api --timeout=10m
      - kubectl --context core -n loop-runtime-system get externalsecret loop-runtime-db-credentials
      - kubectl --context core -n loop-runtime-system exec deploy/loop-runtime-api -- wget -qO- http://127.0.0.1:3001/api/v1/health/ready

  deploy:
    desc: Install the timer that deploys every new head of develop (infra/staging/deploy.sh)
    # The pull model: nothing on GitHub reaches this host. The timer reads develop, and
    # reports back as the staging/deploy commit status with a token kept only here.
    cmds:
      - |
        set -euo pipefail
        token=/etc/loop-runtime-staging/github-status-token
        if [ ! -s "$token" ]; then
          echo "no status token at $token: create a fine-grained token on getloopscale/loop-runtime with Commit statuses read and write, and write it there (mode 0600)" >&2
          exit 1
        fi
        chmod 600 "$token"
        install -d -m 0755 /usr/local/lib/loop-runtime-staging
        install -m 0755 infra/staging/deploy.sh /usr/local/lib/loop-runtime-staging/deploy.sh
        install -m 0644 infra/staging/systemd/loop-runtime-staging-deploy.service infra/staging/systemd/loop-runtime-staging-deploy.timer /etc/systemd/system/
        systemctl daemon-reload
        systemctl enable --now loop-runtime-staging-deploy.timer
        systemctl list-timers loop-runtime-staging-deploy.timer --no-pager

  nightly:
    desc: Install the nightly rebuild, the hourly disk check and the daily token check, all alarming through GitHub issues
    # infra/staging/rebuild.sh rebuilds staging at 06:00 UTC; infra/staging/alarm.sh opens
    # a staging-alarm issue when it fails, when / is more than 80% full, or when a GitHub
    # token the host keeps (the status token, ghcr-pull.json) expires within 14 days or is
    # rejected. The token is the deploy's, which needs Issues read and write too.
    cmds:
      - |
        set -euo pipefail
        token=/etc/loop-runtime-staging/github-status-token
        if [ ! -s "$token" ]; then
          echo "no token at $token: see the deploy task" >&2
          exit 1
        fi
        install -d -m 0755 /usr/local/lib/loop-runtime-staging
        install -m 0755 infra/staging/rebuild.sh infra/staging/alarm.sh /usr/local/lib/loop-runtime-staging/
        install -m 0644 infra/staging/systemd/loop-runtime-staging-rebuild.service infra/staging/systemd/loop-runtime-staging-rebuild.timer \
          infra/staging/systemd/loop-runtime-staging-disk.service infra/staging/systemd/loop-runtime-staging-disk.timer \
          infra/staging/systemd/loop-runtime-staging-tokens.service infra/staging/systemd/loop-runtime-staging-tokens.timer /etc/systemd/system/
        systemctl daemon-reload
        systemctl enable --now loop-runtime-staging-rebuild.timer loop-runtime-staging-disk.timer loop-runtime-staging-tokens.timer
        systemctl list-timers 'loop-runtime-staging-*' --no-pager

  edge:
    desc: Serve the public hostnames on this host's public address, through the core ALB
    # Caddy stands in for CloudFront and ACM (infra/staging/edge/Caddyfile). The ALB's name
    # and the emulator's CA change with every rebuild, so they are read here, not written
    # in the configuration.
    env:
      AWS_CONFIG_FILE: '{{.EMULATOR_HOME}}/.aws/emulator/{{.EMULATOR_PORT}}/config'
      AWS_SHARED_CREDENTIALS_FILE: '{{.EMULATOR_HOME}}/.aws/emulator/{{.EMULATOR_PORT}}/emulator_credentials'
      AWS_CA_BUNDLE: '{{.EMULATOR_HOME}}/.aws/emulator/{{.EMULATOR_PORT}}/ca.pem'
      AWS_ENDPOINT_URL: 'https://localhost:{{.EMULATOR_PORT}}'
      AWS_REGION: us-east-1
      KUBECONFIG: '{{.STAGING_ROOT}}/kubeconfig'
    cmds:
      - |
        set -euo pipefail
        # The ALB the AWS Load Balancer Controller made for the traefik-edge Ingress of
        # the core cluster, found by the tags it gives every load balancer it owns.
        arns=$(aws elbv2 describe-load-balancers --query 'LoadBalancers[].LoadBalancerArn' --output text)
        alb_arn=$(aws elbv2 describe-tags --resource-arns $arns --output json | jq -r \
          '.TagDescriptions[] | select(any(.Tags[]; .Key == "ingress.k8s.aws/stack" and .Value == "traefik/traefik-edge"))
            | select(any(.Tags[]; .Key == "elbv2.k8s.aws/cluster" and .Value == "{{.EDGE_CLUSTER}}")) | .ResourceArn')
        if [ "$(printf '%s\n' "$alb_arn" | grep -c .)" -ne 1 ]; then
          echo "want exactly one ALB tagged ingress.k8s.aws/stack=traefik/traefik-edge on {{.EDGE_CLUSTER}}, found: ${alb_arn:-none}" >&2
          exit 1
        fi
        alb_dns=$(aws elbv2 describe-load-balancers --load-balancer-arns "$alb_arn" --query 'LoadBalancers[0].DNSName' --output text)
        # The address the default route leaves from is the public one; every public
        # hostname must resolve to it, or Let's Encrypt cannot validate the name.
        public=$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i < NF; i++) if ($i == "src") print $(i + 1)}')
        for host in $(echo "{{.EDGE_HOSTS}}" | tr ',' ' '); do
          resolved=$(getent ahostsv4 "$host" | awk 'NR == 1 {print $1}')
          if [ "$resolved" != "$public" ]; then
            echo "$host resolves to ${resolved:-nothing}, not to this host's public address $public" >&2
            exit 1
          fi
        done
        # Tenant apps: every name under the apps domain must resolve here too.
        probe="edge-probe.{{.EDGE_APPS_DOMAIN}}"
        resolved=$(getent ahostsv4 "$probe" | awk 'NR == 1 {print $1}')
        if [ "$resolved" != "$public" ]; then
          echo "$probe resolves to ${resolved:-nothing}, not to this host's public address $public" >&2
          exit 1
        fi
        # Their wildcard certificate (kept across rebuilds; lego renews it only when due), and
        # the cells' ALBs as the origins the app router's function sends them to.
        install -d -m 0755 /usr/local/lib/loop-runtime-staging
        install -m 0755 infra/staging/edge/apps-certificate.sh infra/staging/edge/apps-origins.sh /usr/local/lib/loop-runtime-staging/
        EDGE_APPS_DOMAIN={{.EDGE_APPS_DOMAIN}} EDGE_LEGO_DIR=/var/lib/loop-runtime-edge-certificate \
          EDGE_DNS_TOKEN_FILE=/etc/loop-runtime-edge/hostinger-api-token EDGE_CERT_EMAIL=ops@getloopscale.com \
          /usr/local/lib/loop-runtime-staging/apps-certificate.sh
        kvs_arn=$(aws cloudfront describe-key-value-store --name {{.EDGE_APPS_KVS}} --query KeyValueStore.ARN --output text)
        install -d -m 0755 /etc/loop-runtime-edge
        EDGE_KVS_ARN="$kvs_arn" EDGE_CLUSTER_PREFIX=loop-runtime-staging- EDGE_ORIGINS_FILE=/etc/loop-runtime-edge/cell-origins \
          /usr/local/lib/loop-runtime-staging/apps-origins.sh
        # The bearer of the API's route lookup. A rebuild generates a new one, so it is read
        # on every run; it reaches Caddy as a credential, never through edge.env.
        kubectl --context core -n loop-runtime-system get secret loop-runtime-edge-route-token \
          -o jsonpath='{.data.LOOP_RUNTIME_EDGE_ROUTE_TOKEN}' | base64 -d | install -m 0600 /dev/stdin /etc/loop-runtime-edge/route-token
        [ -s /etc/loop-runtime-edge/route-token ] || { echo "the secret loop-runtime-edge-route-token holds no LOOP_RUNTIME_EDGE_ROUTE_TOKEN" >&2; exit 1; }
        # Caddy opens one site block for `{$EDGE_HOSTS}` and takes ", " between site
        # addresses, not a bare comma.
        hosts=$(echo "{{.EDGE_HOSTS}}" | sed 's/,/, /g')
        install -d -m 0755 /etc/loop-runtime-edge
        install -m 0644 "$AWS_CA_BUNDLE" /etc/loop-runtime-edge/emulator-ca.pem
        install -m 0644 infra/staging/edge/Caddyfile /etc/loop-runtime-edge/Caddyfile
        cat >/etc/loop-runtime-edge/edge.env <<EOF
        EDGE_BIND_ADDRESS=$public
        EDGE_HOSTS="$hosts"
        EDGE_ALB_DNS_NAME=$alb_dns
        EDGE_ORIGIN=https://{{.EMULATOR_ADDRESS}}:{{.EMULATOR_PORT}}
        EDGE_ORIGIN_CA=/etc/loop-runtime-edge/emulator-ca.pem
        EDGE_APPS_DOMAIN={{.EDGE_APPS_DOMAIN}}
        EDGE_PLATFORM_DOMAIN={{.EDGE_PLATFORM_DOMAIN}}
        EDGE_API_HOST={{.EDGE_API_HOST}}
        EDGE_ASK_PORT={{.EDGE_ASK_PORT}}
        EDGE_CELL_ORIGINS=/etc/loop-runtime-edge/cell-origins
        EOF
        # Read as systemd's EnvironmentFile reads it: the quoted host list stays one value.
        # Outside systemd there is no credentials directory, so the certificate is laid out as
        # the unit's LoadCredential= lines lay it out.
        creds=$(mktemp -d)
        trap 'rm -rf "$creds"' EXIT
        ln -s /var/lib/loop-runtime-edge-certificate/certificates/_.{{.EDGE_APPS_DOMAIN}}.crt "$creds/apps.crt"
        ln -s /var/lib/loop-runtime-edge-certificate/certificates/_.{{.EDGE_APPS_DOMAIN}}.key "$creds/apps.key"
        ln -s /etc/loop-runtime-edge/route-token "$creds/route-token"
        (set -a; . /etc/loop-runtime-edge/edge.env; CREDENTIALS_DIRECTORY="$creds" caddy validate --config /etc/loop-runtime-edge/Caddyfile --adapter caddyfile >/dev/null)
        install -m 0644 infra/staging/systemd/loop-runtime-edge.service infra/staging/systemd/loop-runtime-edge-certificate.service \
          infra/staging/systemd/loop-runtime-edge-certificate.timer /etc/systemd/system/
        systemctl daemon-reload
        systemctl enable loop-runtime-edge.service >/dev/null
        systemctl enable --now loop-runtime-edge-certificate.timer >/dev/null
        systemctl restart loop-runtime-edge.service
        echo "edge: {{.EDGE_HOSTS}} on $public -> $alb_dns"
      - task: edge:verify

  edge:verify:
    internal: true
    desc: Every public hostname answers with a certificate this host trusts; the API is healthy
    cmds:
      - |
        set -euo pipefail
        # The first request for a name waits for its certificate to be issued. curl
        # without --insecure fails on a certificate the system does not trust.
        for host in $(echo "{{.EDGE_HOSTS}}" | tr ',' ' '); do
          for _ in $(seq 30); do
            curl -sS -o /dev/null --max-time 10 "https://$host/" 2>/dev/null && break
            sleep 5
          done
          curl -sS -o /dev/null -w "edge: https://$host/ -> %{http_code}, certificate verified\n" --max-time 10 "https://$host/"
        done
        curl -fsS --max-time 10 "{{.EDGE_HEALTH_URL}}"; echo

  down:
    desc: Stop the emulator and remove the clusters, networks and containers it ran
    cmds:
      # The sandbox service first: its API is published on the gateway of a VPC network
      # removed below, and its sandboxes are containers nothing else would remove.
      - bash infra/staging/sandbox.sh down
      - systemctl stop aws-emulator-eks.service aws-emulator.service
      - |
        set -euo pipefail
        for cluster in $(kind get clusters | grep '^eks-' || true); do kind delete cluster --name "$cluster"; done
        containers=$(docker ps -aq --filter label=aws-emulator.service)
        if [ -n "$containers" ]; then docker rm -f $containers >/dev/null; fi
        for network in $(docker network ls -q --filter label=aws-emulator.vpc-id); do docker network rm "$network" >/dev/null; done
        rm -rf /var/lib/aws-emulator /var/lib/aws-emulator-eks

  status:
    desc: What the staging environment is running
    cmds:
      - systemctl is-active aws-emulator.service aws-emulator-eks.service || true
      - kind get clusters
      - docker network ls --filter label=aws-emulator.vpc-id --format '{{"{{"}}.Name{{"}}"}}'
      - docker ps --filter label=com.docker.compose.project=loop-sandbox --format '{{"{{"}}.Names{{"}}"}} {{"{{"}}.Status{{"}}"}}'
