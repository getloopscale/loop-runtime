      - /tmp/loopzero-ops quality chart-default-tags  # #232 — chart loopzero-owned sem tag mutável no default
      - /tmp/loopzero-ops quality values-duplicate-keys  # a values file declaring one key twice loses the first block silently
      # sqlc T3 governance gates (T0.3-T0.5 of plan 2026-05-29-sqlc-
      # migration v1.2). Phase 0 baseline: each gate trivially passes
      # (empty queries/, no sqlc imports). Real exercise begins T1.1+.
      - /tmp/loopzero-ops quality sqlc-sync           # T0.3: committed generated/ in-sync with codegen
      - /tmp/loopzero-ops quality sqlc-tx-prop        # T0.4: pool-bound vs tx-bound inside withEnvironmentLock
      - /tmp/loopzero-ops quality db-generated-boundary  # M9 5a MA-7 Gate A: no outer-layer imports of db/generated (ADR 2026-07-03-m9-db-store-subpackage-topology)
      - /tmp/loopzero-ops quality ma7-status-locality  # M9 5b MA-7 Gates B+C (ADR 2026-07-03-m9-db-store-subpackage-topology)
      - /tmp/loopzero-ops quality feature-fence        # api/internal is organized by feature (docs/decisions.md, 2026-09-25)
      - /tmp/loopzero-ops quality english-only         # everything git tracks is English; exemptions state their reason (#380)
      - /tmp/loopzero-ops quality tenant-predicate    # T0.5: multi-tenant isolation predicate (security veto-backed)
      # Bash security/governance gates re-homed 2026-05-24 (were unwired since
      # GitHub Actions removal). TODO: migrate these to loopzero-ops quality Go gates
      # (strategic home) and drop the bash. Until then they run here = enforced.
      - /tmp/loopzero-ops quality pulumi-required-secrets            # M-Migrate2 (2026-07-07): replaced infra/tests/docs/pulumi-required-secrets_test.sh with pure-logic Go gate. Security: prod/staging/drill secrets externalized.
      - /tmp/loopzero-ops quality skill-paths                        # M-Migrate2 (2026-07-07): replaced infra/tests/skills/skill-paths_test.sh with pure-logic Go gate. Governance: SKILL.md path resolution (declared BLOCKING).
      - /tmp/loopzero-ops quality dev-public-env                     # M-Migrate2 (2026-07-07): replaced infra/tests/helm/dev-public-env_test.sh with pure-logic Go gate. dev-public.yaml canonical shape (dev URLs + cookieDomain + CORS + D5 OAuth reuse + no localhost/legacy leaks).
      - /tmp/loopzero-ops quality k6-load-rigor                      # M-Migrate2 (2026-07-07): replaced infra/tests/check-k6-load-rigor_test.sh with pure-logic Go gate. k6 load rigor: dropped_iterations threshold + L5 distributed + per-level doc (plan k6-load-test-rigor-fixes).
      - bash infra/tests/secrets/check-seed-loopzero-secrets_test.sh        # vault-INT T8.1 EC-21: idempotent Vault seed script (plan 2026-06-02 v1.8)
      - bash infra/tests/secrets/check-rotate-secret_test.sh            # vault-INT T8.1 EC-22: cross-binary atomic rotation script (plan 2026-06-02 v1.8)
      - bash infra/tests/secrets/check-vault-sync_test.sh               # vault-INT Phase 9 T9.1: ESO sync status check (replaces loopzero_config_secret_source metric, plan 2026-06-02 v1.8 D11)
      - bash infra/tests/secrets/check-vault-bootstrap-eso_test.sh      # vault-INT Runbook P1 codification: ESO ClusterSecretStore bootstrap (plan 2026-06-02 v1.8)
      - bash infra/tests/secrets/check-enable-vault-backup_test.sh      # vault-INT Runbook P4 codification: enable snapshot-agent backup (plan 2026-06-02 v1.8)
      - bash infra/tests/secrets/check-restore-vault-snapshot_test.sh   # vault-INT Runbook P5 DR codification: dry-run by default + --execute opt-in (plan 2026-06-02 v1.8)
      - bash infra/tests/secrets/check-rotation-table-parity_test.sh    # vault-INT parity gate: rotate-secret.sh ROTATION_TABLE vs loopzero-external-secrets/values.yaml inventory (plan 2026-06-02 v1.8 iter 17)
      # openbao-adoption v1.5 hermetic tests (iter 28-34) — wired iter 35
      - bash infra/tests/secrets/check-loopzero-api-no-cluster-secrets_test.sh             # openbao-adoption T5.13: legacyClusterWideSecrets backward-compat flag (deep review finding #1)
      - bash infra/tests/secrets/check-loopzero-api-vault-projected-token_test.sh          # openbao-adoption T5.11: projected SA token audience=vault.loopzero.io + dual-chart parity
      - bash infra/tests/secrets/check-scoped-kubeconfig-vault_test.sh                 # openbao-adoption T7.3: Vault kubernetes engine SA token fetch + legacy fallback
      - bash infra/tests/secrets/check-promtail-vault-scrape_test.sh                   # openbao-adoption T8.1+T8.3: Promtail secrets-system scrape + Grafana dashboard
