  diff:
    desc: 'PR-diff quality gates (override base with BASE_REF=<ref>; default origin/main)'
    deps: [build]
    vars:
      BASE_REF: '{{.BASE_REF | default "origin/main"}}'
    cmds:
      - /tmp/loopzero-ops quality no-new-bash --base-ref {{.BASE_REF}} --head-ref HEAD
      - /tmp/loopzero-ops quality dangling-script-refs --base-ref {{.BASE_REF}} --head-ref HEAD
      - /tmp/loopzero-ops quality dangling-data-refs --base-ref {{.BASE_REF}} --head-ref HEAD
      # T0.2 of plan canonical-tests-rewrite-v2 v1.0 — quarantine-protect gate
      # blocks PRs touching archive/canonical-tests-v1/** during strangler-fig
      # window. Per ADR-2026-06-17-T3 D5. PR title env var must be exported by
      # CI: GITHUB_PR_TITLE="${{ github.event.pull_request.title }}" (or equivalent).
      - /tmp/loopzero-ops quality quarantine-protect --base-ref {{.BASE_REF}} --head-ref HEAD

  # dashboard-bundle gate removed (M4): the dashboard moved to the standalone
  # loopzero-cloud repo, which runs its own bundle-budget gate in CI.

  contract:
    desc: >
      Consumer-driven contract gates (M1.4 — plan m1-4-openapi-contract-tests):
      engine OpenAPI spec conformance + cli<->engine. (cloud<->loopzero-data moved to
      the standalone loopzero-cloud repo — M4.)
    cmds:
      # -count=1: these read fixtures from ANOTHER module, and Go's test cache
      # keys on THIS module's inputs. Without it a change in the file being read
      # leaves the cached PASS in place — green over code that moved.
      - cd api && go test ./internal/contract/... -count=1

  contract:cross-repo:
    desc: >
      M5 — run ALL decomposition seam contract tests across the umbrella repos in
      one command (cli↔engine, cloud↔engine serviceauth, cloud↔loopzero-data themory).
      Degrades gracefully (SKIP) when a sibling repo is absent. See
      cross-repo-contract-matrix. The CI platform invokes this target.
    cmds:
      - |
        echo "=== seam engine OpenAPI + cli consumer (loopzero/api) ==="
        cd api && go test ./internal/contract/... -count=1
      - |
        echo "=== seam cloud-themory + cloud-serviceauth ==="
        if [ -d ../loopzero-cloud ]; then
          (cd ../loopzero-cloud && go test ./internal/themory/... ./internal/auth/... -count=1)
        else
          echo "SKIP: loopzero-cloud sibling absent (umbrella layout required)"
        fi
      - |
        echo "=== seam: cli↔engine (loopzero-cli engine-contract.test.ts) ==="
        if [ -d ../loopzero-cli ]; then
          (cd ../loopzero-cli && npm test --silent -- tests/contract/engine-contract.test.ts 2>&1 | tail -8)
        else
          echo "SKIP: loopzero-cli sibling absent (umbrella layout required)"
        fi

  test:coverage:report:
    desc: |
      M23 T5.1 (Post-Cleanroom coverage gate). Runs Go coverage for infra/tests
      hermetic packages (build-tag safe — no LIVE cluster required) and prints
      total statement coverage %. Consumed by /loop-code-review re-audits +
      operator hygiene sweeps.
    cmds:
      - |
        set -e
        OUT=/tmp/loopzero-infra-tests-coverage.out
        cd infra/tests
        # Hermetic-only packages (no live cluster required). Full -tags=helm_render
        # sweep is provided by `task helm:test` separately.
        go test -race -count=1 -coverprofile="$OUT" -covermode=atomic \
          ./charts/... ./chaos/... ./capacity/... ./livetest/... 2>&1 | tail -20
        cd -
        echo "---"
        pct=$(go tool cover -func="$OUT" | tail -1 | awk '{print $NF}')
        echo "infra/tests hermetic coverage: $pct"

  all:
    desc: Standard quality suite — hermetic tests + full-scan gates + contract
    deps: [hermetic, gates, contract]

  all-with-frontend:
    desc: Full quality suite including frontend bundle gate (slower; for pre-release)
    deps: [hermetic, gates, contract]

  leak:live:
    desc: |
      Sonda LIVE que prova o fecho da borda publica — a que o gate `proxy-exposure`
      cita no proprio cabecalho e que nao existia ate 2026-08-10.

      NAO e um quality gate: todos eles sao hermeticos por contrato, e esta depende de
      rede contra um alvo vivo. Por isso mora em `loopzero-ops leak`, ao lado de `chaos` e
      `drill`. Nao entra em `task quality:gates`.

      Alvo padrao: app-dev.loopzero.example + auth-dev.loopzero.example. Passe flags via CLI_ARGS.
    cmds:
      - /tmp/loopzero-ops leak live {{.CLI_ARGS}}
