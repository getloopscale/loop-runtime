version: '3'

# Quality gates — re-homed from .github/workflows (deleted 2026-05-23, GitHub
# Actions is not the CI/CD platform). These are platform-agnostic: they run
# locally for the operator and can be invoked by any real CI via `task quality:*`.
#
# Layers:
#   quality:hermetic  — pure-Go gate unit tests + build (no repo state needed)
#   quality:gates     — full-repo-scan gates (deterministic; no git diff)
#   quality:diff      — PR-diff gates (need a BASE_REF; for CI/PR context)
#   quality:all       — hermetic + gates (the standard local/CI suite)

tasks:
  build:
    desc: Build the loopzero-ops quality binary to /tmp/loopzero-ops
    cmds:
      - cd cmd/loopzero-ops && go build -o /tmp/loopzero-ops .

  gate-list:
    desc: "MA-1 oracle — print the gate inventory (NAME/WIRED/SUMMARY) + assert the split"
    deps: [build]
    cmds:
      # Pillar 1 (caller): exercises `loopzero-ops quality --list` end-to-end.
      - /tmp/loopzero-ops quality --list
      # Pillar 2 (assertion): the inventory must enumerate every registered gate.
      #
      # The expected count is DERIVED from the frozen baseline, not hardcoded.
      # It used to be a literal `-eq 70`, and by 2026-07-30 the registry held
      # 108 — the assertion had been unable to detect drift for as long as it
      # had been drifting, in a task nothing invokes. A number frozen by hand
      # protects only until the first change nobody remembers to mirror.
      #
      # The baseline is the oracle TestOracle_MatchesFrozenBaseline owns and
      # re-freezes deliberately (see its header), so deriving
      # from it keeps ONE place to update and makes an un-mirrored registry
      # change fail here instead of passing silently.
      - |
        BASE=cmd/loopzero-ops/internal/qualitycli/testdata/gateset.frozen
        want=$(grep -vcE '^#|^$' "$BASE")
        n=$(/tmp/loopzero-ops quality --list --names | wc -l)
        [ "$n" -eq "$want" ] || {
          echo "FAIL gate-list: --names emitted $n gates, baseline $BASE has $want." >&2
          echo "  A gate was added or removed without re-freezing the baseline — or vice versa." >&2
          echo "  Re-freeze with: /tmp/loopzero-ops quality --list  (keeping the header comments)" >&2
          exit 1
        }
      # Pillar 3 (runtime signal): the operator-visible split.
      #
      # This used to grep for the literal words `wired` / `unwired`, from an
      # older boolean column. Column 2 now carries the invoking task name (or
      # `-`), so both greps matched nothing and the line reported
      # `wired=0 unwired=0` on every run — a number that was not merely stale
      # but structurally unable to be anything else. Split on the column value.
      - |
        total=$(/tmp/loopzero-ops quality --list --names | wc -l)
        unwired=$(/tmp/loopzero-ops quality --list | awk -F'\t' '$2=="-"' | wc -l)
        echo "registered=$total wired=$((total - unwired)) unwired=$unwired"

  hermetic:
    desc: Run quality-gate hermetic Go tests + verify the gate module builds
    cmds:
      # It pointed at `pkg/quality`, relocated at M9 to cmd/loopzero-ops/internal/quality.
      # The target aborted (exit 201) and took down `quality:all` at the first deps —
      # only `quality:gates` on its own was green, which is what the delivery-gate runs,
      # and that is why nobody saw it. B-087.
      # `./...`, not `./internal/quality/...`: cmd/loopzero-ops's `main` package
      # is NOT under ./internal/..., and it is where TestOracle_MatchesFrozenBaseline,
      # TestEveryGateIsWiredOrExempted, TestNoStalePkgQualityPath and
      # TestTaskfilesDoNotCdIntoMissingDirs live. The last two guard against
      # exactly B-087's defect family — and they were not running. Cost: ~12s.
      - cd cmd/loopzero-ops && go test ./... -count=1
      # The `tools/` binaries build on their own (the module declares no require
      # at all), and GOWORK=off keeps the invocation hermetic. Nothing reached them:
      # they lived only in `test:unit`, which the delivery gate does not call. B-088
      # names both of them in its title.
      #
      # NOTE: this comment claimed that `tools/` is "OUTSIDE go.work by
      # design". That stopped being true in 0f8a2e5f9 (B-170) —
      # `./tools/gen-service-auth-ed25519` is in go.work's `use` since
      # 2026-08-31, otherwise `cd tools/... && go test ./...` fails with "directory
      # prefix . does not contain modules listed in go.work". Membership in the
      # workspace is pinned by TestGoWorkListsEveryModuleInRepo.
      #
      # It was a pair; it became one. `tools/loopzero-dockerfile-lint` was REMOVED on 2026-08-19
      # (B-157): it validated a user-supplied Dockerfile, and that path left in
      # T2.2 — the build generates a canonical Dockerfile in-process. No path invoked it.
      - cd tools/gen-service-auth-ed25519 && GOWORK=off go test ./... -count=1
      - cd cmd/loopzero-ops && go build ./...

  gates:
    desc: Full-repo-scan quality gates (no git diff required)
    deps: [build]
    cmds:
      # unhomed-logic is back in the aggregate: it had been switched off because `.claude/rules/shell-scripts-allowlist.md`
      # had left the repo, and the gate aborted the pre-push instead of measuring. The allowlist was restored.
      - /tmp/loopzero-ops quality unhomed-logic
      # The three below leave the ledger of non-wired gates (#255): crd-semantic-diff
      # already passed and was mislabelled; stack-coverage now derives the
      # strategies from runtimeRegistry (the parallel list rotted when the product
      # shrank to node+python); base-image-digest passed after pinning the 16
      # FROMs to the multi-arch index digest. Combined: < 1.1s.
      # B-095: a Tenant/Environment outside `loopzero-system` is invisible to the operator (cache
      # restricted to that namespace) and undeletable if the admission fence is switched on —
      # removing a finalizer is an UPDATE. The production bootstrap seeded one in `default`.
      - /tmp/loopzero-ops quality platform-cr-namespace
      - /tmp/loopzero-ops quality crd-semantic-diff
      - /tmp/loopzero-ops quality stack-coverage
      - /tmp/loopzero-ops quality base-image-digest
      # test-coverage-report leaves the "measured broken" ledger: the 0.00% average came from
      # measuring ./infra/tests/{unit,charts}, test-only packages. Against production
      # code (pkg + gates) it measures 85.33% in 9s, with the floor raised from 30% to 75%.
      - /tmp/loopzero-ops quality test-coverage-report
      # skip-link leaves the ledger: the baseline was positional (file:LINE), so any
      # edit above a skip re-reported it as new — 145 entries matching almost
      # nothing and 189 false "NEW"s. The key is now file + the skip's own text.
      - /tmp/loopzero-ops quality skip-link
      # proxy-exposure: every edge reverse_proxy declares what it lets through.
      # A proxy inherits the upstream's response contract, so what reaches the
      # browser is invisible in this repo until someone writes it down. 26 proxies, 21ms.
      - /tmp/loopzero-ops quality proxy-exposure
      # mock-budget and pkg-usage-matrix leave the slowGate ledger: they were labelled
      # ">25s" and measure 0.6s and 0.7s. The second also stopped publishing a false
      # "dead code candidate" for cmd/loopzero-ops/internal/pulumi, which only has sub-packages.
      - /tmp/loopzero-ops quality mock-budget
      - /tmp/loopzero-ops quality pkg-usage-matrix
      - /tmp/loopzero-ops quality script-count
      - /tmp/loopzero-ops quality regression-matrix
      - /tmp/loopzero-ops quality postgresql-pdb-config
      - /tmp/loopzero-ops quality dockerfile-no-docker-hub
      - /tmp/loopzero-ops quality advisory-lock-scope
      # records-tree-split (B-166): `.claude/records/` is the live trail and
      # `.claude/knowledge-base/` is frozen at 150 records. Two written trees never
      # error, they accumulate half the truth — an audit that read the wrong one
      # reported 0 implementations / 0 reviews / 0 releases for a repo that had 6,
      # 12 and 8 (`.claude/rules/records-location.md`). Hermetic, no git, ~5ms.
      - /tmp/loopzero-ops quality records-tree-split
      - /tmp/loopzero-ops quality no-env-vault-secrets   # openbao-adoption T2.7 — forbid secrets-as-env-var regression (post D11 ESO migration)
      - /tmp/loopzero-ops quality transit-coverage       # openbao-adoption T3.7 — enforce dispatcher invariant (Set/ListForResync use encryptForStore/decryptFromStore)
      - /tmp/loopzero-ops quality cluster-role-no-secrets-star  # openbao-adoption T5.15 — forbid unconditional cluster-wide secrets/configmaps grants (deep review finding #1)
      - /tmp/loopzero-ops quality no-legacy-sa-token-secret    # openbao-adoption T7.6 — forbid `type: kubernetes.io/service-account-token` Secret (post T7 dynamic SA tokens)
      # T9.6 no-pulumi-inline-secrets — operator-gated; do NOT add to task quality:gates
      # until T9 Vault provider migration runs. Gate is wired in loopzero-ops and can be
      # invoked manually: `/tmp/loopzero-ops quality no-pulumi-inline-secrets`.
      # Pre-migration FAIL is INTENTIONAL forcing-function (operator visibility).
      # no-aes-remaining switched off in the aggregate gate: the T+60d deadline expired on 2026-08-01
      # and the dispatcher's legacy AES branch (api/internal/db/store/secret_wrapper.go) is still there,
      # so the gate started blocking every push instead of signalling. It is still registered in
      # loopzero-ops and invocable by hand: `/tmp/loopzero-ops quality no-aes-remaining`.
      # The T10.3 debt (delete the AES branch) remains open.
      # Workflow hygiene (#233 action without SHA / #250 `${{ }}` inside `run:`). It is not a
      # loopzero-ops gate on purpose: the target is `.github/` YAML, not Go code, and the loopzero-ops
      # registry has a count locked in `gate-list`.
      #
      # It ALSO runs as a workflow (`.github/workflows/workflow-hygiene.yml`), but today no
      # workflow in this repo gets a runner — the `getloopscale` account is blocked by billing and
      # every job dies before the first step. Meanwhile, this line is the guard's only live
      # consumer; without it the guard would exist without ever running, which is the defect it fights.
      - bash .github/scripts/check-workflow-hygiene.sh
      - /tmp/loopzero-ops quality anonymous-auth
      - /tmp/loopzero-ops quality billing-secrets   # B-037: billing-secret optionality is a value, not a literal
      - /tmp/loopzero-ops quality billing-layers    # B-038: the five billing layers, enumerable, with an owner and a ratchet
      - /tmp/loopzero-ops quality scheduled-image   # B-019: a schedule does not point at an image with no publication path
      - /tmp/loopzero-ops quality lint-coverage     # B-121/B-083/B-148: every Go module measured, per-module ratchet
      - /tmp/loopzero-ops quality runbook-parity    # B-140: an error message does not tell you to do what the runbook forbids
      - /tmp/loopzero-ops quality caddy-host-parity # B-150: a hostname the verification requires needs a block that terminates TLS
      - /tmp/loopzero-ops quality dashboard-root-parity # B-039: the runbook names the path the edge serves
      - /tmp/loopzero-ops quality chart-pairs          # B-056, 2026-09-25: no chart exists twice across infra/helm and charts/ (one chart per pair)
      - /tmp/loopzero-ops quality stdlib-only          # B-057: the shared vocabulary drags in no dependency
      - /tmp/loopzero-ops quality adapter-ports        # B-058: an adapter declares the port it satisfies
      - /tmp/loopzero-ops quality package-admission    # B-058: the k8s plumbing admits no domain, and the split's three homes stay populated
      - /tmp/loopzero-ops quality error-vocabulary   # B-081: Rule 3 in authored error messages
      - /tmp/loopzero-ops quality readiness-summary   # B-138: the readiness summary is the last mutation before persisting, in the 6 reconcilers
      # B-158: the registry cycle-maintenance reads to choose the next item. It was
      # INVALID (out-of-order id + stale index) without anyone knowing, and the effect was not
      # cosmetic: a MEASURED item stuck at `raw` was ranked below unmeasured items.
      # Blocks on blocker/major; a vague DoD (minor) exits 0 and does not block.
      # MEET-ASYNC-AMENDMENT-2026-08-19-wire-backlog-validator (pending ratification).
      - python3 .claude/skills/backlog-review/scripts/check_backlog_structure.py BACKLOG.md
      - /tmp/loopzero-ops quality module-selfcontained  # B-140: every module compiles without go.work (CI uses GOWORK=off)
      - /tmp/loopzero-ops quality correlation-header   # T6.1 of plan 2026-06-01-p3-infra-observability-test-debt
      - /tmp/loopzero-ops quality prod-image-digests
      - /tmp/loopzero-ops quality prod-image-tags   # #232 — wire the mutable-tag gate (extended to prod overlays infra/helmfile/values/prod); was registered-but-unrun (review NEEDS_FIXES 2026-07-12)
      - /tmp/loopzero-ops quality trivy-scan
      - /tmp/loopzero-ops quality trufflehog-scan
      - /tmp/loopzero-ops quality dashboard-promtool
      - /tmp/loopzero-ops quality cli-exit-codes
      - /tmp/loopzero-ops quality caddyfile-csp   # plan caddyfile-csp-vite-dev-vs-prod-bundle v1.1 — operator-local-edge Caddyfile invariants (no CSP / no Vite handle 404 / 4 preserved headers / reverse_proxy + plan kratos-self-service-rate-limit-systemic v1.1 invariants 12-15 rate-limit + trusted_proxies + register-route)
      - /tmp/loopzero-ops quality caddyfile-dev-server-deny  # loopzero-cloud#141 defense-in-depth — app-dev block MUST 404 dev-server-only paths (/src/*, /.env, /@vite/*, /node_modules/*, /vite.config.*, /package.json)
      # F-wire-7 absorption: plan kratos-self-service-rate-limit-systemic v1.1 hermetic structural gates.
      - /tmp/loopzero-ops quality ory-kratos-lifespan                     # M-Migrate2 (2026-07-07): replaced infra/tests/helm/ory-kratos-lifespan_test.sh with pure-logic Go gate. T2.2 hermetic Kratos lifespan overlay golden test (source-level, section-scoped).
      - /tmp/loopzero-ops quality acyclic-graph   # M5 — decomposition DAG enforcement (loopzero-contracts ◄── engine + loopzero-cloud + loopzero-cli)
      - task: contract   # M10 T3.1 — spec-based consumer contract (engine conformance + cli↔engine + dashboard↔engine); in-repo, no sibling needed, so it gates every pre-push deterministically
      - /tmp/loopzero-ops quality shell-hygiene
      # D4 (plan d4-vap-delete-guardrail) — the mgmt boundary resources and their CRDs must
      # stay guarded against unauthorized DELETE. Wired here, not just registered: #255
      # found 10 gates that existed and never ran, which is how a guardrail silently rots.
      - /tmp/loopzero-ops quality vap-delete-guardrail
      # Topology index: which chart runs on which cluster, derived from the helmfiles.
      # Wired, not just registered — #255 found 10 gates that existed and never ran.
      - /tmp/loopzero-ops quality helm-topology-index
      # The org the build files AUTHENTICATE against has to match the one the go.mod files REQUEST.
      # It diverged twice in two days (ci.yml, api/Dockerfile) and the second time broke the image
      # build on the merge to develop — with "not found", which looks like a nonexistent repo.
      - /tmp/loopzero-ops quality gomod-auth-org
      - /tmp/loopzero-ops quality argo-app-identity
      - /tmp/loopzero-ops quality corrections-txt-closed
      # Issue #255 — gates that were implemented, registered and unit-tested but
      # never actually run. Each of the nine below was executed on 2026-07-30 and
      # exits 0 against the current tree, so wiring them costs nothing today and
      # makes them enforce from here on. The rest of the #255 backlog stays out on
      # purpose: nine more report real findings (wiring them would turn this task
      # red for reasons unrelated to the change under test), two exceed a 25s
      # budget, and three pass vacuously. Their status is recorded per gate, as
      # the Wiring field of each spec under cmd/loopzero-ops/internal/qualitycli/,
      # rather than left as a silent `-`.
      - /tmp/loopzero-ops quality agpl-isolation
      - /tmp/loopzero-ops quality contract-consumers
      - /tmp/loopzero-ops quality decisions-deletion
      - /tmp/loopzero-ops quality no-migrate-force
      - /tmp/loopzero-ops quality no-shell-wrap
      - /tmp/loopzero-ops quality orphan-alerts
      # B-181: loopzero-cloud's cost aggregator queries three `loopzero_*` series and two of them
      # have no producer in any repository — measured live on 2026-09-05, an empty vector
      # on all three. The mismatch was silent on both sides. The gate reads the pin in
      # api/internal/contract/testdata/cost-aggregator-series.txt and answers per series:
      # producer verified, TRACKED absence (printed, not red), or a new series
      # with no declaration (red). Without loopzero-cloud on disk it says PARTIAL and names
      # what it did not compare — never PASS over what it did not observe (B-169).
      - /tmp/loopzero-ops quality cost-series-producers
      - /tmp/loopzero-ops quality test-deletion
      - /tmp/loopzero-ops quality test-pyramid
      - /tmp/loopzero-ops quality test-targets
      # B-180: a test in infra/tests/ that stats a path and skips when it is missing
      # is conditional in FORM and unconditional in FACT as soon as the path leaves
      # the tree — the package keeps printing ok and everything below the guard is dead
      # code. Four such skips lived in config/ since M5, one of them with an
      # unreachable os.ReadFile + t.Fatalf (B-169 closed the same shape in unit/).
      # The gate reads the pin in infra/quality/test-skip-absent-path.txt and answers per
      # skip: CONDITIONAL, TRACKED (printed, not red), EXTERNAL (outside the repo,
      # not judged) or absent-and-undeclared (red). With no subject — tree
      # moved, zero files, zero skips, unreadable pin — it exits 5 saying what was
      # missing, never 0.
      - /tmp/loopzero-ops quality test-skip-absent-path
      # B-184: the UNGUARDED half of the same class. A bare `t.Skip` — with no condition
      # at all — is not a branch: it aborts the function, so EVERYTHING below it is
      # unreachable and still reads as a live assertion. Two regression tests
      # were like that since T1.4 (one of them hid the hardcode B-069 had
      # removed, back in tenant-operator/main.go) and six more lived inside
      # `t.Run` closures. The gate fails a bare skip WITH code below it, and leaves
      # alone one with nothing below it — that one is honest. The pin in
      # infra/quality/test-skip-unconditional.txt keeps LIVE anchors: if the
      # "is there a statement after it?" test stops working, the declared line is no
      # longer found and the gate turns red instead of silent. With no subject — tree
      # moved, zero files, zero skips, zero unconditional skips, an unreadable or
      # ambiguous pin — it exits 5, never 0.
      - /tmp/loopzero-ops quality test-skip-unconditional
      # Wired 2026-07-30 after its finding was fixed: it failed by demanding
      # `cli:link`/`cli:build`, removed in #254 because `cli/` left at M2. The
      # contract declared a capability the repo lost two milestones
      # earlier — fixed in ExpectedCommands, not by reintroducing the tasks.
      - /tmp/loopzero-ops quality taskfile-interface
      # Regression lock for #59: a Traefik middleware with a static CSP must never be
      # attached to a tenant route — it would clobber LoopZeroKit's per-request nonce and
      # silently kill every inline script. Green today; wired to stay that way.
      - /tmp/loopzero-ops quality tenant-csp-passthrough
      # Wired 2026-07-30 as soon as the findings were fixed (CHG-2026-07-30-002).
      - /tmp/loopzero-ops quality worker-csp          # #35 — CF Worker CSP without inline script
      - /tmp/loopzero-ops quality chart-default-tags  # #232 — loopzero-owned chart with no mutable tag in the default
      - /tmp/loopzero-ops quality values-duplicate-keys  # a values file declaring one key twice loses the first block silently
      # sqlc T3 governance gates (T0.3-T0.5 of plan 2026-05-29-sqlc-
      # migration v1.2). Phase 0 baseline: each gate trivially passes
      # (empty queries/, no sqlc imports). Real exercise begins T1.1+.
      - /tmp/loopzero-ops quality sqlc-sync           # T0.3: committed generated/ in-sync with codegen
      - /tmp/loopzero-ops quality sqlc-tx-prop        # T0.4: pool-bound vs tx-bound inside withEnvironmentLock
      - /tmp/loopzero-ops quality db-generated-boundary  # M9 5a MA-7 Gate A: no outer-layer imports of db/generated (ADR 2026-07-03-m9-db-store-subpackage-topology)
      - /tmp/loopzero-ops quality ma7-status-locality  # M9 5b MA-7 Gates B+C (ADR 2026-07-03-m9-db-store-subpackage-topology)
      - /tmp/loopzero-ops quality feature-fence        # api/internal is organized by feature (docs/decisions.md, 2026-09-25)
      - /tmp/loopzero-ops quality english-only         # everything git tracks is English; exemptions state their reason (#380)
      - /tmp/loopzero-ops quality tenant-predicate    # T0.5: multi-tenant isolation predicate (security veto-backed)
      # Bash security/governance gates re-homed 2026-05-24 (were unwired since
      # GitHub Actions removal). TODO: migrate these to loopzero-ops quality Go gates
      # (strategic home) and drop the bash. Until then they run here = enforced.
      - /tmp/loopzero-ops quality pulumi-required-secrets            # M-Migrate2 (2026-07-07): replaced infra/tests/docs/pulumi-required-secrets_test.sh with pure-logic Go gate. Security: prod/staging/drill secrets externalized.
      - /tmp/loopzero-ops quality skill-paths                        # M-Migrate2 (2026-07-07): replaced infra/tests/skills/skill-paths_test.sh with pure-logic Go gate. Governance: SKILL.md path resolution (declared BLOCKING).
      - /tmp/loopzero-ops quality dev-public-env                     # M-Migrate2 (2026-07-07): replaced infra/tests/helm/dev-public-env_test.sh with pure-logic Go gate. dev-public.yaml canonical shape (dev URLs + cookieDomain + CORS + D5 OAuth reuse + no localhost/legacy leaks).
      - /tmp/loopzero-ops quality k6-load-rigor                      # M-Migrate2 (2026-07-07): replaced infra/tests/check-k6-load-rigor_test.sh with pure-logic Go gate. k6 load rigor: dropped_iterations threshold + L5 distributed + per-level doc (plan k6-load-test-rigor-fixes).
      - bash infra/tests/secrets/check-seed-loopzero-secrets_test.sh        # vault-INT T8.1 EC-21: idempotent Vault seed script (plan 2026-06-02 v1.8)
      - bash infra/tests/secrets/check-rotate-secret_test.sh            # vault-INT T8.1 EC-22: cross-binary atomic rotation script (plan 2026-06-02 v1.8)
      - bash infra/tests/secrets/check-vault-sync_test.sh               # vault-INT Phase 9 T9.1: ESO sync status check (replaces loopzero_config_secret_source metric, plan 2026-06-02 v1.8 D11)
      - bash infra/tests/secrets/check-vault-bootstrap-eso_test.sh      # vault-INT Runbook P1 codification: ESO ClusterSecretStore bootstrap (plan 2026-06-02 v1.8)
      - bash infra/tests/secrets/check-enable-vault-backup_test.sh      # vault-INT Runbook P4 codification: enable snapshot-agent backup (plan 2026-06-02 v1.8)
      - bash infra/tests/secrets/check-restore-vault-snapshot_test.sh   # vault-INT Runbook P5 DR codification: dry-run by default + --execute opt-in (plan 2026-06-02 v1.8)
      - bash infra/tests/secrets/check-rotation-table-parity_test.sh    # vault-INT parity gate: rotate-secret.sh ROTATION_TABLE vs loopzero-external-secrets/values.yaml inventory (plan 2026-06-02 v1.8 iter 17)
      # openbao-adoption v1.5 hermetic tests (iter 28-34) — wired iter 35
      - bash infra/tests/secrets/check-loopzero-api-no-cluster-secrets_test.sh             # openbao-adoption T5.13: legacyClusterWideSecrets backward-compat flag (deep review finding #1)
      - bash infra/tests/secrets/check-loopzero-api-vault-projected-token_test.sh          # openbao-adoption T5.11: projected SA token audience=vault.loopzero.io + dual-chart parity
      - bash infra/tests/secrets/check-scoped-kubeconfig-vault_test.sh                 # openbao-adoption T7.3: Vault kubernetes engine SA token fetch + legacy fallback
      - bash infra/tests/secrets/check-promtail-vault-scrape_test.sh                   # openbao-adoption T8.1+T8.3: Promtail secrets-system scrape + Grafana dashboard
      # iter 34 trio compatibility regression tests (4 defensive-path locks)
      - bash infra/tests/secrets/check-generate-secrets-vault-fallback_test.sh         # openbao-adoption iter 34: T6.5 cold-bootstrap fallback Vault-skipped path (cleanroom)
      - bash infra/tests/secrets/check-scoped-kubeconfig-cold-bootstrap_test.sh        # openbao-adoption iter 34: T7.3 cold-bootstrap legacy SA-token Secret block (cell wiring)
      - bash infra/tests/secrets/check-promtail-vault-empty-targets_test.sh            # openbao-adoption iter 34: T8.1 promtail filter when secrets-system NS absent (dogfood compat)
      # B-033 (2026-08-31): dev-public overlay MUST publish LOOPZERO_PROMETHEUS_URL for
      # cost aggregator wiring — hermetic, no live cluster required. Without that var,
      # cost_counters stays empty in dev-public and CostEnforcer degrades to pass-through.
      - bash infra/tests/check-loopzero-cloud-cost-aggregator-wiring_test.sh
      - /tmp/loopzero-ops quality credentials-sot                    # M-Migrate2 (2026-07-07): replaced infra/tests/docs/credentials-sot_test.sh with pure-logic Go gate. Doc-sync: credentials-required.md enumerates bootstrap Secrets.
      # J-22 openbao-transit v1.2 productive-idle hermetic tests (iters 20-26) — wired iter 27.
      # All 4 are anti-drift contract guards for the engineering deliverables
      # iter 18 (T2.5 wire-up) → iter 26 (rehearsal mode). Each test runs in
      # under 1s, total ~3s. When any test fails, the umbrella `task
      # quality:gates` fails — CI-enforced regression defense for the J-22
      # OpenBao Transit chain (server URL drift / shortcut going out of sync
      # with upstream / overlay role_id hardcode / rehearsal block falling
