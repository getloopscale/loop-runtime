version: '3'

# Quality gates — re-homed from .github/workflows (deleted 2026-05-23, GitHub
# Actions is not the CI/CD platform). These are platform-agnostic: they run
# locally for the operator and can be invoked by any real CI via `task quality:*`.
#
# Layers:
#   quality:hermetic  — pure-Go gate unit tests + build (no repo state needed)
#   quality:gates     — full-repo-scan gates (deterministic; no git diff)
#   quality:diff      — PR-diff gates (need a BASE_REF; for CI/PR context)
#   quality:all       — hermetic + gates (the standard local/CI suite)

tasks:
  build:
    desc: Build the loopzero-ops quality binary to /tmp/loopzero-ops
    cmds:
      - cd cmd/loopzero-ops && go build -o /tmp/loopzero-ops .

  gate-list:
    desc: "MA-1 oracle — print the gate inventory (NAME/WIRED/SUMMARY) + assert the split"
    deps: [build]
    cmds:
      # Pillar 1 (caller): exercises `loopzero-ops quality --list` end-to-end.
      - /tmp/loopzero-ops quality --list
      # Pillar 2 (assertion): the inventory must enumerate every registered gate.
      #
      # The expected count is DERIVED from the frozen baseline, not hardcoded.
      # It used to be a literal `-eq 70`, and by 2026-07-30 the registry held
      # 108 — the assertion had been unable to detect drift for as long as it
      # had been drifting, in a task nothing invokes. A number frozen by hand
      # protects only until the first change nobody remembers to mirror.
      #
      # The baseline is the oracle TestOracle_MatchesFrozenBaseline owns and
      # re-freezes deliberately (see its header), so deriving
      # from it keeps ONE place to update and makes an un-mirrored registry
      # change fail here instead of passing silently.
      - |
        BASE=cmd/loopzero-ops/internal/qualitycli/testdata/gateset.frozen
        want=$(grep -vcE '^#|^$' "$BASE")
        n=$(/tmp/loopzero-ops quality --list --names | wc -l)
        [ "$n" -eq "$want" ] || {
          echo "FAIL gate-list: --names emitted $n gates, baseline $BASE has $want." >&2
          echo "  A gate was added or removed without re-freezing the baseline — or vice versa." >&2
          echo "  Re-freeze with: /tmp/loopzero-ops quality --list  (keeping the header comments)" >&2
          exit 1
        }
      # Pillar 3 (runtime signal): the operator-visible split.
      #
      # This used to grep for the literal words `wired` / `unwired`, from an
      # older boolean column. Column 2 now carries the invoking task name (or
      # `-`), so both greps matched nothing and the line reported
      # `wired=0 unwired=0` on every run — a number that was not merely stale
      # but structurally unable to be anything else. Split on the column value.
      - |
        total=$(/tmp/loopzero-ops quality --list --names | wc -l)
        unwired=$(/tmp/loopzero-ops quality --list | awk -F'\t' '$2=="-"' | wc -l)
        echo "registered=$total wired=$((total - unwired)) unwired=$unwired"

  hermetic:
    desc: Run quality-gate hermetic Go tests + verify the gate module builds
    cmds:
      # Apontava para `pkg/quality`, relocado no M9 para cmd/loopzero-ops/internal/quality.
      # O alvo abortava (exit 201) e derrubava `quality:all` no primeiro deps —
      # so `quality:gates` sozinho era verde, que e o que o delivery-gate roda, e
      # por isso ninguem viu. B-087.
      # `./...`, nao `./internal/quality/...`: o pacote `main` de cmd/loopzero-ops
      # NAO esta em ./internal/..., e e onde vivem TestOracle_MatchesFrozenBaseline,
      # TestEveryGateIsWiredOrExempted, TestNoStalePkgQualityPath e
      # TestTaskfilesDoNotCdIntoMissingDirs. Os dois ultimos sao guardas contra
      # exatamente a familia de defeito do B-087 — e nao rodavam. Custo: ~12s.
      - cd cmd/loopzero-ops && go test ./... -count=1
      # Os binarios de `tools/` constroem sozinhos (o modulo nao declara require
      # nenhum), e GOWORK=off mantem a invocacao hermetica. Ninguem os alcancava:
      # viviam so em `test:unit`, que o gate de entrega nao chama. O B-088 nomeia
      # os dois no titulo.
      #
      # ATENCAO: este comentario afirmava que `tools/` esta "FORA do go.work por
      # desenho". Isso deixou de ser verdade em 0f8a2e5f9 (B-170) —
      # `./tools/gen-service-auth-ed25519` esta no `use` do go.work desde
      # 2026-08-31, senao `cd tools/... && go test ./...` falha com "directory
      # prefix . does not contain modules listed in go.work". A pertinencia ao
      # workspace e pinada por TestGoWorkListsEveryModuleInRepo.
      #
      # Era um par; virou um. `tools/loopzero-dockerfile-lint` foi REMOVIDO em 2026-08-19
      # (B-157): ele validava Dockerfile fornecido pelo usuario, e esse caminho saiu na
      # T2.2 — o build gera Dockerfile canonico em processo. Nenhum caminho o invocava.
      - cd tools/gen-service-auth-ed25519 && GOWORK=off go test ./... -count=1
      - cd cmd/loopzero-ops && go build ./...

  gates:
    desc: Full-repo-scan quality gates (no git diff required)
    deps: [build]
    cmds:
      # unhomed-logic voltou ao agregado: fora desligado porque `.claude/rules/shell-scripts-allowlist.md`
      # tinha saido do repo, e o gate abortava o pre-push em vez de medir. O allowlist foi restaurado.
      - /tmp/loopzero-ops quality unhomed-logic
      # Os tres abaixo saem do ledger de gates nao-wired (#255): crd-semantic-diff
      # ja passava e estava rotulado errado; stack-coverage passou a derivar as
      # strategies do runtimeRegistry (a lista paralela apodreceu quando o produto
      # reduziu para node+python); base-image-digest passou depois de pinar os 16
      # FROM no digest do index multi-arch. Somados: < 1.1s.
      # B-095: Tenant/Environment fora de `loopzero-system` fica invisivel ao operator (cache
      # restrito a esse namespace) e indeletavel se a cerca de admissao for ligada — remover
      # finalizer e' um UPDATE. O bootstrap de producao semeava um em `default`.
      - /tmp/loopzero-ops quality platform-cr-namespace
      - /tmp/loopzero-ops quality crd-semantic-diff
      - /tmp/loopzero-ops quality stack-coverage
      - /tmp/loopzero-ops quality base-image-digest
      # test-coverage-report sai do ledger de "measured broken": media 0.00% vinha de
      # medir ./infra/tests/{unit,charts}, pacotes so-de-teste. Contra o codigo de
      # producao (pkg + gates) mede 85.33% em 9s, com o floor subido de 30% para 75%.
      - /tmp/loopzero-ops quality test-coverage-report
      # skip-link sai do ledger: o baseline era posicional (file:LINE), entao qualquer
      # edicao acima de um skip o re-reportava como novo — 145 entradas casando quase
      # nada e 189 falsos "NEW". A chave passou a ser arquivo + texto do proprio skip.
      - /tmp/loopzero-ops quality skip-link
      # proxy-exposure: todo reverse_proxy do edge declara o que deixa passar.
      # Um proxy herda o contrato de resposta do upstream, entao o que chega no
      # browser e' invisivel neste repo ate alguem escrever. 26 proxies, 21ms.
      - /tmp/loopzero-ops quality proxy-exposure
      # mock-budget e pkg-usage-matrix saem do ledger de slowGate: estavam rotulados
      # ">25s" e medem 0.6s e 0.7s. O segundo tambem parou de publicar um falso
      # "dead code candidate" para cmd/loopzero-ops/internal/pulumi, que so tem sub-pacotes.
      - /tmp/loopzero-ops quality mock-budget
      - /tmp/loopzero-ops quality pkg-usage-matrix
      - /tmp/loopzero-ops quality script-count
      - /tmp/loopzero-ops quality regression-matrix
      - /tmp/loopzero-ops quality postgresql-pdb-config
      - /tmp/loopzero-ops quality dockerfile-no-docker-hub
      - /tmp/loopzero-ops quality advisory-lock-scope
      # records-tree-split (B-166): `.claude/records/` is the live trail and
      # `.claude/knowledge-base/` is frozen at 150 records. Two written trees never
      # error, they accumulate half the truth — an audit that read the wrong one
      # reported 0 implementations / 0 reviews / 0 releases for a repo that had 6,
      # 12 and 8 (`.claude/rules/records-location.md`). Hermetic, no git, ~5ms.
      - /tmp/loopzero-ops quality records-tree-split
      - /tmp/loopzero-ops quality no-env-vault-secrets   # openbao-adoption T2.7 — forbid secrets-as-env-var regression (post D11 ESO migration)
      - /tmp/loopzero-ops quality transit-coverage       # openbao-adoption T3.7 — enforce dispatcher invariant (Set/ListForResync use encryptForStore/decryptFromStore)
      - /tmp/loopzero-ops quality cluster-role-no-secrets-star  # openbao-adoption T5.15 — forbid unconditional cluster-wide secrets/configmaps grants (deep review finding #1)
      - /tmp/loopzero-ops quality no-legacy-sa-token-secret    # openbao-adoption T7.6 — forbid `type: kubernetes.io/service-account-token` Secret (post T7 dynamic SA tokens)
      # T9.6 no-pulumi-inline-secrets — operator-gated; do NOT add to task quality:gates
      # until T9 Vault provider migration runs. Gate is wired in loopzero-ops and can be
      # invoked manually: `/tmp/loopzero-ops quality no-pulumi-inline-secrets`.
      # Pre-migration FAIL is INTENTIONAL forcing-function (operator visibility).
      # no-aes-remaining desligado do gate agregado: o prazo T+60d venceu em 2026-08-01 e o
      # branch AES legado do dispatcher (api/internal/db/store/secret_wrapper.go) ainda esta la,
      # entao o gate passou a travar todo push em vez de sinalizar. Continua registrado no
      # loopzero-ops e invocavel a mao: `/tmp/loopzero-ops quality no-aes-remaining`.
      # A divida T10.3 (deletar o branch AES) segue aberta.
      # Higiene dos workflows (#233 action sem SHA / #250 `${{ }}` dentro de `run:`). Nao e um gate
      # do loopzero-ops de proposito: o alvo e YAML do `.github/`, nao codigo Go, e o registry do
      # loopzero-ops tem uma contagem travada em `gate-list`.
      #
      # Ele TAMBEM roda como workflow (`.github/workflows/workflow-hygiene.yml`), mas hoje nenhum
      # workflow deste repo consegue runner — a conta `getloopscale` esta bloqueada por billing e
      # todo job morre antes do primeiro step. Enquanto isso, esta linha e o unico consumidor vivo
      # da guarda; sem ela, a guarda existiria sem nunca rodar, que e o defeito que ela combate.
      - bash .github/scripts/check-workflow-hygiene.sh
      - /tmp/loopzero-ops quality anonymous-auth
      - /tmp/loopzero-ops quality billing-secrets   # B-037: opcionalidade de segredo de cobranca e valor, nao literal
      - /tmp/loopzero-ops quality billing-layers    # B-038: as cinco camadas de cobranca enumeraveis, com dono e catraca
      - /tmp/loopzero-ops quality scheduled-image   # B-019: agendamento nao aponta para imagem sem caminho de publicacao
      - /tmp/loopzero-ops quality lint-coverage     # B-121/B-083/B-148: todo modulo Go medido, catraca por modulo
      - /tmp/loopzero-ops quality runbook-parity    # B-140: mensagem de erro nao manda fazer o que o runbook proibe
      - /tmp/loopzero-ops quality caddy-host-parity # B-150: hostname exigido pela verificacao precisa de bloco que termine o TLS
      - /tmp/loopzero-ops quality dashboard-root-parity # B-039: o runbook nomeia o caminho que a borda serve
      - /tmp/loopzero-ops quality chart-pairs          # B-056, 2026-09-25: no chart exists twice across infra/helm and charts/ (one chart per pair)
      - /tmp/loopzero-ops quality stdlib-only          # B-057: o vocabulario compartilhado nao arrasta dependencia
      - /tmp/loopzero-ops quality adapter-ports        # B-058: adaptador declara a porta que satisfaz
      - /tmp/loopzero-ops quality package-admission    # B-058: o plumbing k8s nao admite dominio, e as tres casas do split seguem povoadas
      - /tmp/loopzero-ops quality error-vocabulary   # B-081: Regra 3 nas mensagens de erro autoradas
      - /tmp/loopzero-ops quality readiness-summary   # B-138: o sumario de prontidao e a ultima mutacao antes de persistir, nos 6 reconcilers
      # B-158: o registro que o cycle-maintenance le para escolher o proximo item. Ele esteve
      # INVALID (id fora de ordem + indice obsoleto) sem ninguem saber, e o efeito nao foi
      # cosmetico: um item MEDIDO preso em `raw` era ranqueado abaixo de itens nao medidos.
      # Barra em blocker/major; DoD vago (minor) sai com 0 e nao barra.
      # MEET-ASYNC-AMENDMENT-2026-08-19-wire-backlog-validator (pending ratification).
      - python3 .claude/skills/backlog-review/scripts/check_backlog_structure.py BACKLOG.md
      - /tmp/loopzero-ops quality module-selfcontained  # B-140: todo modulo compila sem go.work (o CI usa GOWORK=off)
      - /tmp/loopzero-ops quality correlation-header   # T6.1 of plan 2026-06-01-p3-infra-observability-test-debt
      - /tmp/loopzero-ops quality prod-image-digests
      - /tmp/loopzero-ops quality prod-image-tags   # #232 — wire the mutable-tag gate (extended to prod overlays infra/helmfile/values/prod); was registered-but-unrun (review NEEDS_FIXES 2026-07-12)
      - /tmp/loopzero-ops quality trivy-scan
      - /tmp/loopzero-ops quality trufflehog-scan
      - /tmp/loopzero-ops quality dashboard-promtool
      - /tmp/loopzero-ops quality cli-exit-codes
      - /tmp/loopzero-ops quality caddyfile-csp   # plan caddyfile-csp-vite-dev-vs-prod-bundle v1.1 — operator-local-edge Caddyfile invariants (no CSP / no Vite handle 404 / 4 preserved headers / reverse_proxy + plan kratos-self-service-rate-limit-systemic v1.1 invariants 12-15 rate-limit + trusted_proxies + register-route)
      - /tmp/loopzero-ops quality caddyfile-dev-server-deny  # loopzero-cloud#141 defense-in-depth — app-dev block MUST 404 dev-server-only paths (/src/*, /.env, /@vite/*, /node_modules/*, /vite.config.*, /package.json)
      # F-wire-7 absorption: plan kratos-self-service-rate-limit-systemic v1.1 hermetic structural gates.
      - /tmp/loopzero-ops quality ory-kratos-lifespan                     # M-Migrate2 (2026-07-07): replaced infra/tests/helm/ory-kratos-lifespan_test.sh with pure-logic Go gate. T2.2 hermetic Kratos lifespan overlay golden test (source-level, section-scoped).
      - /tmp/loopzero-ops quality acyclic-graph   # M5 — decomposition DAG enforcement (loopzero-contracts ◄── engine + loopzero-cloud + loopzero-cli)
      - task: contract   # M10 T3.1 — spec-based consumer contract (engine conformance + cli↔engine + dashboard↔engine); in-repo, no sibling needed, so it gates every pre-push deterministically
      - /tmp/loopzero-ops quality shell-hygiene
      # D4 (plan d4-vap-delete-guardrail) — the mgmt boundary resources and their CRDs must
      # stay guarded against unauthorized DELETE. Wired here, not just registered: #255
      # found 10 gates that existed and never ran, which is how a guardrail silently rots.
      - /tmp/loopzero-ops quality vap-delete-guardrail
      # Índice de topologia: qual chart roda em qual cluster, derivado dos helmfiles.
      # Wired, não só registrado — #255 encontrou 10 gates que existiam e nunca rodavam.
      - /tmp/loopzero-ops quality helm-topology-index
      # A org que os arquivos de build AUTENTICAM tem de bater com a que os go.mod PEDEM.
      # Divergiu duas vezes em dois dias (ci.yml, api/Dockerfile) e a segunda quebrou o build
      # da imagem no merge para develop — com "not found", que parece repo inexistente.
      - /tmp/loopzero-ops quality gomod-auth-org
      - /tmp/loopzero-ops quality argo-app-identity
      - /tmp/loopzero-ops quality corrections-txt-closed
      # Issue #255 — gates that were implemented, registered and unit-tested but
      # never actually run. Each of the nine below was executed on 2026-07-30 and
      # exits 0 against the current tree, so wiring them costs nothing today and
      # makes them enforce from here on. The rest of the #255 backlog stays out on
      # purpose: nine more report real findings (wiring them would turn this task
      # red for reasons unrelated to the change under test), two exceed a 25s
      # budget, and three pass vacuously. Their status is recorded per gate, as
      # the Wiring field of each spec under cmd/loopzero-ops/internal/qualitycli/,
      # rather than left as a silent `-`.
      - /tmp/loopzero-ops quality agpl-isolation
      - /tmp/loopzero-ops quality contract-consumers
      - /tmp/loopzero-ops quality decisions-deletion
      - /tmp/loopzero-ops quality no-migrate-force
      - /tmp/loopzero-ops quality no-shell-wrap
      - /tmp/loopzero-ops quality orphan-alerts
      # B-181: o agregador de custo do loopzero-cloud consulta tres series `loopzero_*` e duas
      # nao tem produtor em repositorio nenhum — medido ao vivo em 2026-09-05, vetor
      # vazio nas tres. O desencontro era silencioso dos dois lados. O gate le o pin em
      # api/internal/contract/testdata/cost-aggregator-series.txt e responde por serie:
      # produtor verificado, ausencia RASTREADA (impressa, nao vermelha), ou nova serie
      # sem declaracao (vermelho). Sem o loopzero-cloud em disco ele diz PARTIAL e nomeia o
      # que nao comparou — nunca PASS sobre o que nao observou (B-169).
      - /tmp/loopzero-ops quality cost-series-producers
      - /tmp/loopzero-ops quality test-deletion
      - /tmp/loopzero-ops quality test-pyramid
      - /tmp/loopzero-ops quality test-targets
      # B-180: um teste em infra/tests/ que faz stat num caminho e pula quando ele
      # falta e condicional na FORMA e incondicional no FATO assim que o caminho sai
      # da arvore — o pacote segue imprimindo ok e tudo abaixo da guarda e codigo
      # morto. Quatro skips assim viviam em config/ desde o M5, um deles com
      # os.ReadFile + t.Fatalf inalcancaveis (B-169 fechou a mesma forma em unit/).
      # O gate le o pin em infra/quality/test-skip-absent-path.txt e responde por
      # skip: CONDITIONAL, TRACKED (impresso, nao vermelho), EXTERNAL (fora do repo,
      # nao julgado) ou ausente-e-nao-declarado (vermelho). Sem sujeito — arvore
      # movida, zero arquivos, zero skips, pin ilegivel — ele sai 5 dizendo o que
      # faltou, nunca 0.
      - /tmp/loopzero-ops quality test-skip-absent-path
      # B-184: a metade SEM guarda da mesma classe. Um `t.Skip` nu — sem condicao
      # nenhuma — nao e' um ramo: ele aborta a funcao, entao TUDO abaixo dele e'
      # inalcancavel e mesmo assim se le como assercao viva. Dois testes de regressao
      # estavam assim desde o T1.4 (um deles escondia o hardcode que o B-069 tinha
      # removido, de volta em tenant-operator/main.go) e mais seis viviam dentro de
      # closures `t.Run`. O gate reprova um skip nu COM codigo embaixo, e deixa em paz
      # o que nao tem nada embaixo — esse e' honesto. O pin em
      # infra/quality/test-skip-unconditional.txt guarda ancoras VIVAS: se o teste de
      # "tem statement depois?" parar de funcionar, a linha declarada deixa de ser
      # reencontrada e o gate fica vermelho em vez de silencioso. Sem sujeito — arvore
      # movida, zero arquivos, zero skips, zero skips incondicionais, pin ilegivel ou
      # ambiguo — ele sai 5, nunca 0.
      - /tmp/loopzero-ops quality test-skip-unconditional
      # Wired 2026-07-30 after its finding was fixed: it reprovava exigindo
      # `cli:link`/`cli:build`, removidas no #254 porque `cli/` saiu no M2. O
      # contrato declarava uma capacidade que o repo perdeu dois milestones
