version: '3'

# Quality gates — re-homed from .github/workflows (deleted 2026-05-23, GitHub
# Actions is not the CI/CD platform). These are platform-agnostic: they run
# locally for the operator and can be invoked by any real CI via `task quality:*`.
#
# Layers:
#   quality:hermetic  — pure-Go gate unit tests + build (no repo state needed)
#   quality:gates     — full-repo-scan gates (deterministic; no git diff)
#   quality:diff      — PR-diff gates (need a BASE_REF; for CI/PR context)
#   quality:all       — hermetic + gates (the standard local/CI suite)

tasks:
  build:
    desc: Build the loopzero-ops quality binary to /tmp/loopzero-ops
    cmds:
      - cd cmd/loopzero-ops && go build -o /tmp/loopzero-ops .

  gate-list:
    desc: "MA-1 oracle — print the gate inventory (NAME/WIRED/SUMMARY) + assert the split"
    deps: [build]
    cmds:
      # Pillar 1 (caller): exercises `loopzero-ops quality --list` end-to-end.
      - /tmp/loopzero-ops quality --list
      # Pillar 2 (assertion): the inventory must enumerate every registered gate.
      - |
        n=$(/tmp/loopzero-ops quality --list --names | wc -l)
        [ "$n" -eq 70 ] || { echo "FAIL gate-list: --names emitted $n gates, want 70 (registry drift?)" >&2; exit 1; }
      # Pillar 3 (runtime signal): the operator-visible split.
      - 'echo "registered=$(/tmp/loopzero-ops quality --list --names | wc -l) wired=$(/tmp/loopzero-ops quality --list | grep -cP ''\twired\t'') unwired=$(/tmp/loopzero-ops quality --list | grep -cP ''\tunwired\t'')"'

  hermetic:
    desc: Run quality-gate hermetic Go tests + verify both modules build
    cmds:
      - cd pkg && go test ./quality/...
      - cd cmd/loopzero-ops && go build ./...

  gates:
    desc: Full-repo-scan quality gates (no git diff required)
    deps: [build]
    cmds:
      - /tmp/loopzero-ops quality unhomed-logic --check
      - /tmp/loopzero-ops quality script-count
      - /tmp/loopzero-ops quality regression-matrix
      - /tmp/loopzero-ops quality postgresql-pdb-config
      - /tmp/loopzero-ops quality dockerfile-no-docker-hub
      - /tmp/loopzero-ops quality advisory-lock-scope
      - /tmp/loopzero-ops quality no-env-vault-secrets   # openbao-adoption T2.7 — forbid secrets-as-env-var regression (post D11 ESO migration)
      - /tmp/loopzero-ops quality transit-coverage       # openbao-adoption T3.7 — enforce dispatcher invariant (Set/ListForResync use encryptForStore/decryptFromStore)
      - /tmp/loopzero-ops quality cluster-role-no-secrets-star  # openbao-adoption T5.15 — forbid unconditional cluster-wide secrets/configmaps grants (deep review finding #1)
      - /tmp/loopzero-ops quality no-legacy-sa-token-secret    # openbao-adoption T7.6 — forbid `type: kubernetes.io/service-account-token` Secret (post T7 dynamic SA tokens)
      # T9.6 no-pulumi-inline-secrets — operator-gated; do NOT add to task quality:gates
      # until T9 Vault provider migration runs. Gate is wired in loopzero-ops and can be
      # invoked manually: `/tmp/loopzero-ops quality no-pulumi-inline-secrets`.
      # Pre-migration FAIL is INTENTIONAL forcing-function (operator visibility).
      - /tmp/loopzero-ops quality no-aes-remaining             # openbao-adoption T10.2 — calendar-gated; WARN until T+60d then FAIL on remaining AES code paths
      - /tmp/loopzero-ops quality anonymous-auth
      - /tmp/loopzero-ops quality correlation-header   # T6.1 of plan 2026-06-01-p3-infra-observability-test-debt
      - /tmp/loopzero-ops quality helm-overlap-parity
      - /tmp/loopzero-ops quality prod-image-digests
      - /tmp/loopzero-ops quality trivy-scan
      - /tmp/loopzero-ops quality trufflehog-scan
      - /tmp/loopzero-ops quality dashboard-promtool
      - /tmp/loopzero-ops quality cli-exit-codes
      - /tmp/loopzero-ops quality caddyfile-csp   # plan caddyfile-csp-vite-dev-vs-prod-bundle v1.1 — operator-local-edge Caddyfile invariants (no CSP / no Vite handle 404 / 4 preserved headers / reverse_proxy + plan kratos-self-service-rate-limit-systemic v1.1 invariants 12-15 rate-limit + trusted_proxies + register-route)
      # F-wire-7 absorption: plan kratos-self-service-rate-limit-systemic v1.1 hermetic structural gates.
      - bash infra/tests/check-caddy-build-canonical-syntax_test.sh   # T1.1 hermetic — Caddy xcaddy bundles BOTH cloudflare + ratelimit
      - bash infra/tests/helm/ory-kratos-lifespan_test.sh             # T2.2 hermetic — Kratos lifespan overlay golden test
      - /tmp/loopzero-ops quality acyclic-graph   # M5 — decomposition DAG enforcement (loopzero-contracts ◄── engine + loopzero-cloud + loopzero-cli)
      - task: contract   # M10 T3.1 — spec-based consumer contract (engine conformance + cli↔engine + dashboard↔engine); in-repo, no sibling needed, so it gates every pre-push deterministically
      - /tmp/loopzero-ops quality shell-hygiene
      - /tmp/loopzero-ops quality corrections-txt-closed
      # sqlc T3 governance gates (T0.3-T0.5 of plan 2026-05-29-sqlc-
      # migration v1.2). Phase 0 baseline: each gate trivially passes
      # (empty queries/, no sqlc imports). Real exercise begins T1.1+.
      - /tmp/loopzero-ops quality sqlc-sync           # T0.3: committed generated/ in-sync with codegen
      - /tmp/loopzero-ops quality sqlc-tx-prop        # T0.4: pool-bound vs tx-bound inside withEnvironmentLock
      - /tmp/loopzero-ops quality db-generated-boundary  # M9 5a MA-7 Gate A: no outer-layer imports of db/generated (ADR 2026-07-03-m9-db-store-subpackage-topology)
      - /tmp/loopzero-ops quality ma7-status-locality  # M9 5b MA-7 Gates B+C (ADR 2026-07-03-m9-db-store-subpackage-topology)
      - /tmp/loopzero-ops quality services-acyclic     # M9 Step 6: services bounded-context acyclic DAG (ADR 2026-07-03-m9-db-store-subpackage-topology)
      - /tmp/loopzero-ops quality tenant-predicate    # T0.5: multi-tenant isolation predicate (security veto-backed)
      # Bash security/governance gates re-homed 2026-05-24 (were unwired since
      # GitHub Actions removal). TODO: migrate these to loopzero-ops quality Go gates
      # (strategic home) and drop the bash. Until then they run here = enforced.
      - bash infra/tests/docs/pulumi-required-secrets_test.sh   # security: prod/staging/drill secrets externalized
      - bash infra/tests/skills/skill-paths_test.sh             # governance: SKILL.md path resolution (declared BLOCKING)
      - bash infra/tests/check-fulcio-oidc-diagnose_test.sh     # M07 keyless: Fulcio OIDC trust diagnose script (T0.2 plan 2026-05-28)
      - bash infra/tests/check-k6-load-rigor_test.sh            # k6 load rigor: dropped_iterations threshold + L5 distributed + per-level doc (plan k6-load-test-rigor-fixes)
      - bash infra/tests/check-seed-loopzero-secrets_test.sh        # vault-INT T8.1 EC-21: idempotent Vault seed script (plan 2026-06-02 v1.8)
      - bash infra/tests/check-rotate-secret_test.sh            # vault-INT T8.1 EC-22: cross-binary atomic rotation script (plan 2026-06-02 v1.8)
      - bash infra/tests/check-vault-sync_test.sh               # vault-INT Phase 9 T9.1: ESO sync status check (replaces loopzero_config_secret_source metric, plan 2026-06-02 v1.8 D11)
      - bash infra/tests/check-vault-bootstrap-eso_test.sh      # vault-INT Runbook P1 codification: ESO ClusterSecretStore bootstrap (plan 2026-06-02 v1.8)
      - bash infra/tests/check-enable-vault-backup_test.sh      # vault-INT Runbook P4 codification: enable snapshot-agent backup (plan 2026-06-02 v1.8)
      - bash infra/tests/check-restore-vault-snapshot_test.sh   # vault-INT Runbook P5 DR codification: dry-run by default + --execute opt-in (plan 2026-06-02 v1.8)
      - bash infra/tests/check-rotation-table-parity_test.sh    # vault-INT parity gate: rotate-secret.sh ROTATION_TABLE vs loopzero-external-secrets/values.yaml inventory (plan 2026-06-02 v1.8 iter 17)
      - bash infra/tests/check-loopzero-external-secrets-creation-policy_test.sh   # vault-INT iter 20 P0 regression: creationPolicy=Orphan (NOT Owner) — prevents K8s GC cascade-delete on rollback
      - bash infra/tests/check-loopzero-external-secrets-chart-sanity_test.sh      # vault-INT iter 23: comprehensive chart sanity (13 CRs + unique names + refresh intervals + per-env renders + vaultBinaryOverride positive/negative)
      # openbao-adoption v1.5 hermetic tests (iter 28-34) — wired iter 35
      - bash infra/tests/check-loopzero-api-no-cluster-secrets_test.sh             # openbao-adoption T5.13: legacyClusterWideSecrets backward-compat flag (deep review finding #1)
      - bash infra/tests/check-openbao-init-auth-mounts_test.sh                # openbao-adoption T5.1-T5.9: 6 K8s auth mounts + per-binary roles + isolation invariants
      - bash infra/tests/check-loopzero-api-vault-projected-token_test.sh          # openbao-adoption T5.11: projected SA token audience=vault.loopzero.io + dual-chart parity
      - bash infra/tests/check-vault-prom-alerts_test.sh                       # openbao-adoption T8.4: 4 P1 alerts severity=critical + runbook_url + audit-log-must-flow invariant
      - bash infra/tests/check-day30-day60-cronjobs_test.sh                    # openbao-adoption T10.1+T10.3: Day 30 + Day 60 CronJobs safety defaults + EC-12 filter
      - bash infra/tests/check-scoped-kubeconfig-vault_test.sh                 # openbao-adoption T7.3: Vault kubernetes engine SA token fetch + legacy fallback
      - bash infra/tests/check-loki-vault-retention_test.sh                    # openbao-adoption T8.2+T8.5: Loki per-NS retention 90d + DO Spaces archive cron
      - bash infra/tests/check-promtail-vault-scrape_test.sh                   # openbao-adoption T8.1+T8.3: Promtail vault-system scrape + Grafana dashboard
      # iter 34 trio compatibility regression tests (4 defensive-path locks)
      - bash infra/tests/check-generate-secrets-vault-fallback_test.sh         # openbao-adoption iter 34: T6.5 cold-bootstrap fallback Vault-skipped path (cleanroom)
      - bash infra/tests/check-scoped-kubeconfig-cold-bootstrap_test.sh        # openbao-adoption iter 34: T7.3 cold-bootstrap legacy SA-token Secret block (cell wiring)
      - bash infra/tests/check-promtail-vault-empty-targets_test.sh            # openbao-adoption iter 34: T8.1 promtail filter when vault-system NS absent (dogfood compat)
      - bash infra/tests/check-loki-retention-schema_test.sh                   # openbao-adoption iter 34: T8.2 Loki retention_stream schema valid (cleanroom Loki bootstrap)
      - bash infra/tests/docs/credentials-sot_test.sh           # doc-sync: credentials-required.md enumerates bootstrap Secrets
      # J-22 openbao-transit v1.2 productive-idle hermetic tests (iters 20-26) — wired iter 27.
      # All 4 are anti-drift contract guards for the engineering deliverables
      # iter 18 (T2.5 wire-up) → iter 26 (rehearsal mode). Each test runs in
      # under 1s, total ~3s. When any test fails, the umbrella `task
      # quality:gates` fails — CI-enforced regression defense for the J-22
      # OpenBao Transit chain (server URL drift / shortcut going out of sync
      # with upstream / overlay role_id hardcode / rehearsal block falling
      # through to encrypt path).
      - bash infra/tests/helm/loopzero-api-openbao-approle-envfrom_test.sh           # iter 20 T6.1: chart envFrom secretRef contract (7 assertions)
      - bash infra/tests/check-vault-bootstrap-in-mgmt-task_test.sh              # iter 24 Option (c) shortcut parity with upstream task (18 assertions)
      - bash infra/tests/check-dev-public-loopzero-external-secrets-overlay_test.sh  # iter 25 dev-public ESO overlay shape + anti-hardcode (18 assertions)
      - bash infra/tests/check-rehearsal-mode-syntax_test.sh                     # iter 26 T4.1 --rehearsal flag shape + early-exit (26 assertions)
      - bash infra/tests/check-write-path-subset-syntax_test.sh                  # iter 31 Option A write-path subset shape (27 assertions)
      - bash infra/tests/check-option-b-eso-deploy-doc_test.sh                   # iter 33 Option B ESO deploy doc structure + version drift defense (25 assertions)
      - bash infra/tests/check-vault-bootstrap-unseal-loop_test.sh               # 2026-06-15 dev-public Cleanroom unseal-loop canonical fix (16 assertions; pipefail+bao rc=2 regression guard)
      - bash infra/tests/check-openbao-transit-quality-gates-wired_test.sh       # iter 27 meta-gate: ensures the 6 above stay wired + uncommented + clustered (extended iter 33 → 6 tests)
      # M1 hermetic guards (plan m1-commit-canonical-30-fixes v1.2 SHIPPABLE 96.4 — 2026-06-23)
      - bash infra/tests/check-no-cloud-dev-default_test.sh                       # T1.1 regression guard: no cloud-dev defaults in test/seed scripts (Caddy 301 trap post ee77b8da; EC-1 absorption excludes /api/v1/webhooks/github)
      - bash infra/tests/check-archive-script-repo-root_test.sh                   # T1.2 regression guard: archive/ scripts use canonical 4-dirs-up REPO_ROOT (broken post-quarantine 289cf9d6)
      - bash infra/tests/check-caddyfile-no-docker-network-ip_test.sh             # Red Team #127 (2026-07-01): rejects hardcoded 172.18.x.x Docker network IPs in Caddyfile reverse_proxy — DHCP drift routes customer-app requests to VAULT cluster → 502 sustentado dev-public-wide
      # M2 hermetic guards (plan m2-promote-11-canonical-seeds v1.1 SHIPPABLE 95.2 — 2026-06-23)
      - bash infra/tests/check-allowlist-sunsets_test.sh                         # T5.2.a plan 2026-06-11-code-review-remediation: hermetic test for `.claude/scripts/check-allowlist-sunsets.py` (CI blocks past-sunset entries in rules/code-review-allowlist.txt)
      - python3 .claude/scripts/check-allowlist-sunsets.py rules/code-review-allowlist.txt  # T5.2.a CI gate itself: enforce sunset dates on every quality:gates run
      # Plan 2026-06-15-code-review-49-findings-remediation hermetic gates.
      # Phase 1 (T1.2) — J-20 Scale LIVE bash syntax companion.
      # Phase 5 (T5.1) — 4 ORPHAN companions for billing-portal + oidc-redirect
      # + live-url-discoverability + status-url-probe (closes R1-F2 HIGH).
      - bash infra/tests/check-dev-public-billing-portal-syntax_test.sh            # T5.1 ORPHAN companion 1/4
      - bash infra/tests/check-dev-public-oidc-redirect-syntax_test.sh             # T5.1 ORPHAN companion 2/4
      - bash infra/tests/check-dev-public-overview-flow-syntax_test.sh             # M1 J-06 overview LIVE-flow hermetic guard (28 assertions)
      - bash infra/tests/check-patch-kratos-check-only-readonly_test.sh            # M0 J-01 T5.3 EC-9: patch-kratos --check-only read-only guard (6 assertions)
      # T4.1 of plan 2026-06-15-code-review-49-findings-remediation (R1-F5 HIGH):
      # shell-lint advisory — invokes infra/scripts/local/shellcheck-advisory.sh.
      # Re-homed from inline `bash -c '...'` after that form broke YAML parsing
      # (shell metachars + nested quotes). Script is conditional: runs
      # shellcheck when installed; emits WARN + exits 0 when absent.
      - bash infra/scripts/local/shellcheck-advisory.sh
      # T-cov-1 of plan 2026-06-15-100pct-dashboard-coverage-roadmap Phase 2A
      # (R2-F8 HIGH closure): every user-facing API route must be in the
      # middleware.Auth group OR appear in the explicit public-allowlist.
      - bash infra/tests/check-route-auth-coverage_test.sh
      # Wire: chart Go guards (infra/tests/charts/) — locks NodePort/serverlb
      # canonical (T1.1 vault_host_published_reach), F-1 NetworkPolicy, gateway-
      # derived host.k3d.internal (T1.2), F1 SAN-aligned kubernetes_host, Step
      # 11 container-name, plus 3 post-decomposition tooling fixes
      # (#106 dogfood-all REPO_ROOT, #107 live-proof JSON SoT, #108 LOOPZERO_BIN
      # workspace-discovery). Closes /review HIGH (2026-06-20). The pre-flight
      # block fails LOUDLY if helmfile is absent or LOOPZERO_TEST_SKIP_HELMFILE=1
      # is set — silent SKIP of the central helmfile-render guard is the
      # "looks GREEN, ran nothing" anti-pattern (also closes related MEDIUM).
      # this wiring against silent removal.
      - |
        set -e
        command -v helmfile >/dev/null 2>&1 || { echo "FAIL quality:gates: helmfile NOT on PATH — infra/tests/charts guards would silently SKIP (central guard TestVaultHostPublishedReach renders via helmfile). Install helmfile (CI/droplet MUST have it; local-dev: brew install helmfile / curl)." >&2; exit 1; }
        [ -z "${LOOPZERO_TEST_SKIP_HELMFILE:-}" ] || { echo "FAIL quality:gates: LOOPZERO_TEST_SKIP_HELMFILE=1 — central helmfile-render guard would SKIP silently in the gate. Unset it for real coverage." >&2; exit 1; }
        cd infra/tests && go test ./charts/ -count=1
      # The meta-guard locking THIS wiring runs INSIDE `go test ./charts/`
      # above — see TestChartsGoTestsWired in
      # infra/tests/charts/charts_go_tests_wired_test.go. Hosting it as Go
      # (NOT bash) avoids the un-homed-logic gate bump that would otherwise
      # block a new `.sh` test (sibling-pattern of
      # check-openbao-transit-quality-gates-wired_test.sh, homed as bash
      # before that gate was enforced).

  diff:
    desc: 'PR-diff quality gates (override base with BASE_REF=<ref>; default origin/main)'
    deps: [build]
    vars:
      BASE_REF: '{{.BASE_REF | default "origin/main"}}'
    cmds:
      - /tmp/loopzero-ops quality no-new-bash --base-ref {{.BASE_REF}} --head-ref HEAD
      - /tmp/loopzero-ops quality dangling-script-refs --base-ref {{.BASE_REF}} --head-ref HEAD
      - /tmp/loopzero-ops quality dangling-data-refs --base-ref {{.BASE_REF}} --head-ref HEAD
      # T0.2 of plan canonical-tests-rewrite-v2 v1.0 — quarantine-protect gate
      # blocks PRs touching archive/canonical-tests-v1/** during strangler-fig
      # window. Per ADR-2026-06-17-T3 D5. PR title env var must be exported by
      # CI: GITHUB_PR_TITLE="${{ github.event.pull_request.title }}" (or equivalent).
      - /tmp/loopzero-ops quality quarantine-protect --base-ref {{.BASE_REF}} --head-ref HEAD

  # dashboard-bundle gate removed (M4): the dashboard moved to the standalone
  # loopzero-cloud repo, which runs its own bundle-budget gate in CI.

  contract:
    desc: >
      Consumer-driven contract gates (M1.4 — plan m1-4-openapi-contract-tests):
      engine OpenAPI spec conformance + cli<->engine. (cloud<->loopzero-data moved to
      the standalone loopzero-cloud repo — M4.)
    cmds:
      - cd api && go test ./internal/contract/...

  contract:cross-repo:
    desc: >
      M5 — run ALL decomposition seam contract tests across the umbrella repos in
      one command (cli↔engine, cloud↔engine serviceauth, cloud↔loopzero-data themory).
      Degrades gracefully (SKIP) when a sibling repo is absent. See
      docs/cross-repo-contract-matrix.md. The CI platform invokes this target.
    cmds:
      - |
        echo "=== seam engine OpenAPI + cli consumer (loopzero/api) ==="
        cd api && go test ./internal/contract/...
      - |
        echo "=== seam cloud-themory + cloud-serviceauth ==="
        if [ -d ../loopzero-cloud ]; then
          (cd ../loopzero-cloud && go test ./internal/themory/... ./internal/auth/...)
        else
          echo "SKIP: loopzero-cloud sibling absent (umbrella layout required)"
        fi
      - |
        echo "=== seam: cli↔engine (loopzero-cli engine-contract.test.ts) ==="
        if [ -d ../loopzero-cli ]; then
          (cd ../loopzero-cli && npm test --silent -- tests/contract/engine-contract.test.ts 2>&1 | tail -8)
        else
          echo "SKIP: loopzero-cli sibling absent (umbrella layout required)"
        fi

  all:
    desc: Standard quality suite — hermetic tests + full-scan gates + contract
    deps: [hermetic, gates, contract]

  all-with-frontend:
    desc: Full quality suite including frontend bundle gate (slower; for pre-release)
    deps: [hermetic, gates, contract]
