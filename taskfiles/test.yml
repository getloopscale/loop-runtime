  # ---------------------------------------------------------------------------
  # Monitoring

  # ---------------------------------------------------------------------------
  # Quality Gates: Coverage measurement (Plan 2026-05-21 v1.1 T1.1)
  # ---------------------------------------------------------------------------

  test:coverage:go:
    desc: |
      Run Go coverage across all packages. Output: /tmp/coverage.out.
      Excludes vendor/, handles doc-only packages (EC-10).
    cmds:
      - bash infra/scripts/ci/coverage-go.sh

  # test:coverage:cli removed 2026-06-16 — the CLI was extracted to the standalone
  # github.com/getloopscale/loopzero-cli repo (M2), which runs its own jest --coverage in CI.

  test:coverage:
    desc: |
      Run Go coverage. Output: /tmp/coverage-merged.lcov (consumable by codecov,
      diff-cover, etc). Phase 2 gates (diff + baseline) consume this output.
      (CLI coverage moved to the standalone loopzero-cli repo — M2 decomposition.)
    cmds:
      - task: test:coverage:go
      # Go-only merge after CLI extraction (M2). Was: --cli-lcov /tmp/cli-coverage.lcov.
      - cd cmd/loopzero-ops && go run . quality coverage-merge --go-profile /tmp/coverage.out --output /tmp/coverage-merged.lcov

  # ---------------------------------------------------------------------------
  # Helm chart render-time tests (Plan 2026-05-20 v1.2 T4.2)
  #
  # CANONICAL targets live in taskfiles/helm.yml. These aliases satisfy the
  # plan's literal "taskfiles/test.yml" target location while keeping
  # taskfiles/helm.yml as the source of truth (canonical helm operations).
  # ---------------------------------------------------------------------------

  helm:render:test:
    desc: |
      Run helm chart RENDER-TIME tests (alias for `task helm:test`).
      Tier 2 between schema validation and LIVE drill. ~6m15s for full
      suite of 22 packages / ~210 assertions with -p 1 serialization.
    cmds:
      - task: helm:test

  helm:render:test:vet:
    desc: |
      Fast build gate (~5s) — go vet over all helm render packages.
      Alias for `task helm:test:vet`. Catches b9f19dc8 class regression.
    cmds:
      - task: helm:test:vet

  helm:render:test:chart:
    desc: |
      Run render-time tests for a SINGLE chart (alias for `task helm:test:chart`).
      Usage: task helm:render:test:chart -- loopzero-api-published
    cmds:
      - task: helm:test:chart

  # ============================================================================
  # Pre-release test rigor — plan 2026-06-08-pre-release-test-rigor v1.2
  # Per ADR D1 (canonical entry) + ADR D8 (wall-clock 120 min budget).
  # 4 Scenarios extend cleanroom + dogfood + chaos-test + live-proof so the
  # suite catches the 5 LIVE-only bugs that slipped past the prior gates
  # (dashboard-screens-review-fixes T5.3 sponsor walkthrough).
  # ============================================================================

  test:pre-release-rigor:scenario-2:
    desc: |
      Scenario 2 (baseline match) — runs the cleanroom Phase 0 + Phase 5
      baseline-capture + diff per T1.1 + T1.2. Verifies post-rebuild state
      structurally matches the pre-rebuild snapshot (volatile fields EC-7
      normalized). Internal budget ~45 min for full cleanroom; this task
      assumes the cleanroom skill is invoked externally and only runs the
      drift gate. Plan 2026-06-08-pre-release-test-rigor T1.1 + T1.2.
    cmds:
      - |
        SNAP_PRE="${SNAP_PRE:-/tmp/baseline-pre-rebuild.json}"
        SNAP_POST="${SNAP_POST:-/tmp/baseline-post-rebuild.json}"
        if [ ! -f "$SNAP_PRE" ] ; then
          echo "[scenario-2] capturing pre-rebuild snapshot"
          DETERMINISTIC=1 bash infra/scripts/local/baseline-capture.sh --output "$SNAP_PRE"
        fi
        if [ ! -f "$SNAP_POST" ] ; then
          echo "[scenario-2] capturing post-rebuild snapshot"
          DETERMINISTIC=1 bash infra/scripts/local/baseline-capture.sh --output "$SNAP_POST"
        fi
        bash infra/scripts/local/baseline-diff.sh "$SNAP_PRE" "$SNAP_POST" --markdown

  test:pre-release-rigor:scenario-1:
    desc: |
      Scenario 1 (webhook → autodeploy → HTTPS 200 chain) — runs T2.2 LIVE
      bash chain. EC-13 absorption: when invoked standalone (without
      scenario-2 having run first), the "baseline match" assertion is
      SKIP — the chain validation still proceeds. Plan T2.2.
      Internal budget 20 min wall-clock per ADR D8.
    cmds:
      - |
        if [ ! -f /tmp/baseline-pre-rebuild.json ] ; then
          echo "[scenario-1] EC-13 standalone mode — baseline-match assertion SKIP (no pre-rebuild snapshot); chain validation proceeds"
        fi
        bash infra/tests/e2e/live/dev-public-webhook-chain_test.sh

  test:pre-release-rigor:
    desc: |
      Umbrella — runs the pre-release rigor scenarios of plan
      2026-06-08-pre-release-test-rigor in dependency order per ADR D1:
      scenario-2 (baseline, ~45 min cleanroom) → scenario-1 (chain, ~20 min
      webhook end-to-end).

      Scenario 3 (chaos C11/C12) and scenario 4 (api-sanity live-proof) were
      retired: their scripts were deleted, so the tasks could only fail with
      "No such file". Chaos coverage lives in chaos:v2:hermetic and the
      live-proof checks were absorbed into the counter-proof chain
      (infra/tests/livetest/contraprova, Layer 8) run by chain:v2:full.

      Default Task semantics provide fail-fast — if any scenario exits
      non-zero, the umbrella aborts (per ADR D6). No `ignore_error: true`
      anywhere in this section.

      Use against cleanroom-fresh dev-public infra for T6.1 evidence.
    cmds:
      - task: test:pre-release-rigor:scenario-2
      - task: test:pre-release-rigor:scenario-1

  # T3.1+T3.5 of plan canonical-tests-rewrite-v2 v1.0 per ADR-2026-06-17-T3 D1.
  # Canonical chain runner v2 — replaces archive/canonical-tests-v1/scripts/local/cleanroom-canonical-chain-runner.sh.
  cleanroom:v2:
    desc: |
      T3.1 v2 cleanroom canonical chain (Ginkgo) — 6 phases, Phase 0..5.
      Wall-clock budget ~30-45min. Requires LIVE k3d clusters.
      Phases: baseline pre + clean:all + setup + tilt up + doctor + baseline post-diff.
    cmds:
      - go test -tags=live ./infra/tests/livetest/cleanroom/... -count=1 -timeout 1h -v

  cleanroom:v2:hermetic:
    desc: |
      T3.1 v2 cleanroom helper unit tests (hermetic, no LIVE infra needed).
      Validates Options + Outcome + Run wiring at the Go layer.
    cmds:
      - go test ./infra/tests/livetest/cleanroom/... -count=1 -timeout 1m

  # T3.2 + T3.3 + T3.4 of plan canonical-tests-rewrite-v2 v1.0 — v2 dogfood / chaos / counter-proof
  dogfood:v2:hermetic:
    desc: |
      T3.2 v2 dogfood helper unit tests (hermetic). Validates Env + JWT loader +
      CurlJSON + KubectlGetJSON + Pause helpers. No LIVE infra needed.
    cmds:
      - go test ./infra/tests/livetest/dogfood/... -count=1 -timeout 1m

  dogfood:v2:journey:
    desc: |
      Run ONE v2 dogfood journey (LIVE Ginkgo spec) by its label, e.g.
      `task dogfood:v2:journey JOURNEY=j04`. Replaces the per-journey
      test:dogfood:* wrappers, which ran deleted archive/canonical-tests-v1
      scripts. Requires dev-public UP + JWT seed (see dogfood:v2).
    requires:
      vars: [JOURNEY]
    cmds:
      - go test -tags=live ./infra/tests/livetest/dogfood/... -count=1 -timeout 1h -v -args -ginkgo.label-filter={{.JOURNEY}}

  dogfood:v2:
    desc: |
      T3.2 v2 dogfood per-journey LIVE Ginkgo specs. Requires dev-public UP +
      JWT seed at ~/.loopzero/local-dogfood-token.txt. Gated by build tag `live`.
    cmds:
      - go test -tags=live ./infra/tests/livetest/dogfood/... -count=1 -timeout 1h -v

  chaos:v2:hermetic:
    desc: |
      T3.3 v2 chaos helper unit tests (hermetic). Validates Manifest + ChaosResult
      type contracts + AssertSpanCoverage stub behavior. No LIVE chaos-mesh needed.
    cmds:
      - go test ./infra/tests/livetest/chaos/... -count=1 -timeout 1m

  contraprova:v2:hermetic:
    desc: |
      T3.4 v2 counter-proof helper unit tests (hermetic). Validates 8 layers
      (chaos summary byte-grep / JUnit XML parse / git state / live-proof
      absorption per ADR D3). No LIVE deploy needed.
    cmds:
      - go test ./infra/tests/livetest/contraprova/... -count=1 -timeout 1m

  livetest:v2:hermetic:
    desc: |
      T3.1+T3.2+T3.3+T3.4 aggregate v2 livetest helper unit tests (hermetic).
      All 4 packages exercised without LIVE infra.
    cmds:
      - task: cleanroom:v2:hermetic
      - task: dogfood:v2:hermetic
      - task: chaos:v2:hermetic
      - task: contraprova:v2:hermetic

  # T3.5 of plan canonical-tests-rewrite-v2 v1.0 — chain runner v2 (Taskfile composition per ADR D2)
  chain:v2:full:
    desc: |
      T3.5 v2 canonical chain runner — composes 6 phases via Taskfile.
      Replaces archive/canonical-tests-v1/scripts/local/cleanroom-canonical-chain-runner.sh
      Per ADR D2: bash kept only as a wrapper of `task X` calls; chain
      orchestration moves to Taskfile composition.
      Wall-clock budget ~60-90min (~30-45min cleanroom + ~5min seeds + ~30-45min dogfood + ~15min counter-proof).
      Pre-condition: dev-public infra UP + JWT seeded.
    cmds:
      - task: cleanroom:v2  # T3.1 6 phases
      - bash infra/scripts/local/seed-post-cleanroom-all.sh --verify
      - task: dogfood:v2    # T3.2 per-journey LIVE specs
      - go test -tags=live ./infra/tests/livetest/contraprova/... -count=1 -timeout 30m -v
      - echo "T3.5 chain:v2:full ENGINEERING-COMPLETE — sponsor CP3 TOGETHER gate pending"

  chain:v2:engineering:
    desc: |
      T3.5 engineering-only subset (cleanroom + dogfood + counter-proof,
      no sponsor TOGETHER gate). Use for halt-loop iteration during Phase 3+4 dev.
    cmds:
      - task: cleanroom:v2:hermetic
      - task: dogfood:v2:hermetic
      - task: chaos:v2:hermetic
      - task: contraprova:v2:hermetic
