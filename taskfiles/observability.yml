version: "3"

# Observability domain tasks — Loki cross-cluster, Prometheus,
# Grafana, Tempo. Loaded from root Taskfile.yml via `includes:`.

tasks:

  loki-cross-cluster:verify-env-files:
    desc: |
      Run the vitest invariants on per-env loki.pushUrl declarations
      (audit M08 #18 / §6.C.4b). Confirms no production-tier env file
      carries the k3d-local IP 172.18.0.3, every env declares a non-
      empty pushUrl, and the promtail template reads .Environment.Values.
    dir: infra/pulumi
    cmds:
      - npx vitest run src/__tests__/loki-push-url.test.ts

  loki-cross-cluster:show-pushUrl:
    desc: |
      Dump the canonical Loki push URL from Pulumi stack output (§6.C.4b
      step 6). When the output is empty, fall back to the helmfile env
      file. Useful for operator sanity ahead of `helmfile apply`.

      Variable:
        STACK — pulumi stack name (default: dev)
    vars:
      STACK: '{{.STACK | default "dev"}}'
    dir: infra/pulumi
    cmds:
      - |
        URL=$(pulumi --stack {{.STACK}} stack output lokiPushUrl 2>/dev/null || true)
        if [ -n "$URL" ]; then
          echo "Pulumi stack {{.STACK}} -> $URL"
        else
          echo "Pulumi stack {{.STACK}} has no lokiPushUrl output."
          echo "Falling back to helmfile env file:"
          grep -A2 "^loki:" ../helmfile/environments/{{.STACK}}.yaml | sed 's/^/  /'
        fi

  dogfood-gate:open:
    desc: |
      §6.A.4 Phase 6 Dogfood Gate — Phase 1: open the gate window.
      Creates ConfigMap `loop-runtime-dogfood-gate-window` with annotation
      `runtime.getloopscale.com/dogfood-window=active` in the target namespace. The
      PrometheusRule recording rule `loop_runtime_dogfood_gate_window_active`
      flips to 1 within 30s.

      Variables:
        CONTEXT — kubectl context (default: drill-mgmt)
        NAMESPACE — loop-runtime namespace (default: loop-runtime-system)
    vars:
      CONTEXT: '{{.CONTEXT | default "drill-mgmt"}}'
      NAMESPACE: '{{.NAMESPACE | default "loop-runtime-system"}}'
    cmds:
      - |
        kubectl --context {{.CONTEXT}} -n {{.NAMESPACE}} create configmap \
          loop-runtime-dogfood-gate-window \
          --from-literal=opened=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
          --dry-run=client -o yaml | \
          kubectl --context {{.CONTEXT}} apply -f -
      - kubectl --context {{.CONTEXT}} annotate cm loop-runtime-dogfood-gate-window -n {{.NAMESPACE}} runtime.getloopscale.com/dogfood-window=active --overwrite
      - echo "Gate window OPENED. Watch panel 1 of dashboard 'Phase 6 Dogfood Gate'."

  dogfood-gate:close:
    desc: |
      §6.A.4 Phase 6 Dogfood Gate — Phase 6: close the gate window.
      Removes the `runtime.getloopscale.com/dogfood-window` annotation. Use BOTH on
      success AND abort — closing the window is mandatory so the
      alert evaluation stops scoping.

      Variables:
        CONTEXT — kubectl context (default: drill-mgmt)
        NAMESPACE — loop-runtime namespace (default: loop-runtime-system)
    vars:
      CONTEXT: '{{.CONTEXT | default "drill-mgmt"}}'
      NAMESPACE: '{{.NAMESPACE | default "loop-runtime-system"}}'
    cmds:
      - kubectl --context {{.CONTEXT}} annotate cm loop-runtime-dogfood-gate-window -n {{.NAMESPACE}} runtime.getloopscale.com/dogfood-window- --overwrite || true
      - echo "Gate window CLOSED. File sign-off audit per runbook Phase 5."

  dogfood-gate:traffic:
    desc: |
      §6.A.4 Phase 6 Dogfood Gate — Phase 2: start k6 traffic generator
      via tmux (so it survives operator disconnect). Defaults to 4h
      sustained 50 VUs. Override K6_DURATION + K6_VUS for dry-runs.

      Required env vars:
        API_URL — engine URL (e.g., https://api.drill.drill.getloopscale.com)
        API_TOKEN — bearer JWT
        TENANT_ID — soak tenant identifier
    cmds:
      - tmux kill-session -t phase6-traffic 2>/dev/null || true
      - tmux new-session -d -s phase6-traffic 'k6 run --duration ${K6_DURATION:-4h} --vus ${K6_VUS:-50} --out experimental-prometheus-rw -e API_URL=$API_URL -e API_TOKEN=$API_TOKEN -e TENANT_ID=${TENANT_ID:-phase6-soak-tenant} infra/tests/livetest/dogfood/traffic.js 2>&1 | tee /tmp/phase6-k6.log'
      - sleep 30
      - tail -30 /tmp/phase6-k6.log | grep -E "iterations|http_req|error" || echo "(no k6 output yet — check API_TOKEN + API_URL)"

  dogfood-gate:traffic-stop:
    desc: |
      §6.A.4 Phase 6 Dogfood Gate — stop the k6 traffic generator
      tmux session. Use AFTER `dogfood-gate:close` so SLO assertions
      stop being evaluated against a system that's no longer under
      sustained load.
    cmds:
      - tmux send-keys -t phase6-traffic C-c 2>/dev/null || true
      - sleep 2
      - tmux kill-session -t phase6-traffic 2>/dev/null || true
      - echo "k6 traffic stopped."

  loki-cross-cluster:smoke-query:
    desc: |
      LIVE drill smoke step (§6.C.4b step 7) — port-forward mgmt Loki
      and run a LogQL query for build-cluster logs in the last 5min.
      A non-zero row count confirms cross-cluster wiring is alive.

      Pre-requisite: kubectl --context drill-mgmt is reachable AND a
      build has executed on the drill build cluster within the
      query window. See loki-cross-cluster-drill-smoke-runbook.md.

      Variables:
        CONTEXT — kubectl context for mgmt cluster (default: drill-mgmt)
        LOKI_NS — Loki namespace (default: loop-runtime-observability)
    vars:
      CONTEXT: '{{.CONTEXT | default "drill-mgmt"}}'
      LOKI_NS: '{{.LOKI_NS | default "loop-runtime-observability"}}'
    cmds:
      - |
        kubectl --context {{.CONTEXT}} port-forward -n {{.LOKI_NS}} svc/loki 3100:3100 &
        PF=$!
        sleep 3
        echo "Querying mgmt Loki for build cluster logs in the last 5min..."
        logcli --addr http://localhost:3100 query --since 5m --limit 20 '{namespace="argo"}' || true
        kill $PF 2>/dev/null || true
        wait $PF 2>/dev/null || true
