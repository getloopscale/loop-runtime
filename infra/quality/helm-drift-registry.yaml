# Recorded divergences between each bootstrap chart (infra/helm/) and its
# published twin (charts/), read by the helm-drift quality gate.
#
# Every entry is one observed asymmetry and why it exists. The gate fails on any
# divergence that has no entry here, and it matches entries one resource kind or
# one RBAC cell at a time: a pair being known to diverge never licenses the next
# divergence.
#
# `decision` names a row of docs/decisions.md by its bold title; the gate refuses
# an entry whose decision is not there. `status` is `declared` (intended and
# reviewed) or `undecided` (live and unreviewed: the decision is still open, and
# the gate names the cell on every run so that "recorded" is never read as
# "approved"). RBAC entries are grouped by the rule that produces them, stated by
# its content rather than by a template line number.
#
# Pairs are spelled published:bootstrap, as in infra/quality/chart-pairs.txt.
# Cells are spelled apiGroup/resource/verb, with the core group written (core).

kinds:
  - pair: loopzero-api:loopzero-api
    kind: ConfigMap
    decision: Chart-pair drift is recorded, never blessed per pair
    reason: >-
      Measured 2026-08-16 by rendering the pairs: the published chart mounts its configuration through a ConfigMap; the bootstrap chart receives it as literal env in the helmfile values.
  - pair: loopzero-api:loopzero-api
    kind: NetworkPolicy
    decision: Chart-pair drift is recorded, never blessed per pair
    reason: >-
      Measured 2026-08-16 by rendering the pairs: network policy belongs to the published chart; the bootstrap path runs in a dev cluster whose network is not segmented.
  - pair: loopzero-api:loopzero-api
    kind: Secret
    decision: Chart-pair drift is recorded, never blessed per pair
    reason: >-
      Measured 2026-08-16 by rendering the pairs: the published chart declares the Secret; on the bootstrap path it is provisioned from outside the chart (generate-secrets / ESO), an asymmetry of provenance rather than of resource.
  - pair: loopzero-api:loopzero-api
    kind: Certificate
    decision: Chart-pair drift is recorded, never blessed per pair
    reason: >-
      Measured 2026-08-16 by rendering the pairs: cert-manager exists only on the bootstrap path; the published chart expects TLS to be terminated at the edge.
  - pair: loopzero-api:loopzero-api
    kind: IngressRoute
    decision: Chart-pair drift is recorded, never blessed per pair
    reason: >-
      Measured 2026-08-16 by rendering the pairs: IngressRoute belongs to the Traefik of the bootstrap path; the published chart does not assume an ingress.

cells:
  - pair: loopzero-api:loopzero-api
    side: bootstrap-only
    rule: "apiGroups [(core)], resources [namespaces, configmaps, secrets, services, pods, events], verbs [get, list, watch, create, update, patch, delete]"
    decision: Whether the bootstrap loopzero-api ClusterRole keeps cluster-wide secrets delete and pods/exec create
    status: undecided
    reason: >-
      The bootstrap ClusterRole grants cluster-wide secrets including delete,
      unconditionally. The published chart gates secrets behind
      rbac.legacyClusterWideSecrets and omits delete from the verb list under every
      value of that flag, and its own comment calls the cluster-wide grant a
      catastrophic blast radius. No caller for the grant has been measured. Live,
      unreviewed asymmetry; the decision is open and is not this gate's to make.
    cells:
      - (core)/secrets/delete
  - pair: loopzero-api:loopzero-api
    side: bootstrap-only
    rule: "apiGroups [(core)], resources [pods/log, pods/exec], verbs [get, list, create]"
    decision: Whether the bootstrap loopzero-api ClusterRole keeps cluster-wide secrets delete and pods/exec create
    status: undecided
    reason: >-
      The bootstrap ClusterRole grants pods/exec create cluster-wide; the published
      chart omits pods/exec entirely. No caller for it has been measured. Live,
      unreviewed asymmetry; the decision is open and is not this gate's to make.
    cells:
      - (core)/pods/exec/create
  - pair: loopzero-api:loopzero-api
    side: bootstrap-only
    rule: "apiGroups [argoproj.io], resources [workflows, workflowtemplates, cronworkflows], verbs [get, list, watch, create, update, patch, delete]"
    decision: Chart-pair drift is recorded, never blessed per pair
    status: declared
    reason: >-
      The published chart grants none of these cells under either entry of the RBAC
      values matrix; where it grants other cells of the same resources those agree and
      are not listed. Measured 2026-09-15. Recorded and not converged: narrowing the
      bootstrap side changes the RBAC Helmfile installs, and nothing has measured what
      depends on it.
    cells:
