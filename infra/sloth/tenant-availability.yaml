# SLO: Tenant URL Availability
# Measures blackbox probe success rate against tenant-deployed applications.
# Target: 99.9% — tenant URLs must be reachable.
# Depends on: blackbox_exporter (Phase 1A).
#
# Uses raw SLI because probe_success is a gauge (0/1 per scrape), not a counter.
# error_ratio = (failed probes) / (total probes) over the window.
version: "prometheus/v1"
service: "loop-runtime-tenant-availability"
labels:
  owner: "platform-team"
  tier: "product"
slos:
  - name: "tenant-url-availability"
    objective: 99.9
    description: "Percentage of successful blackbox probes against tenant URLs."
    sli:
      raw:
        error_ratio_query: |
          1 - (
            sum(avg_over_time(probe_success{job=~".*loop-runtime-api-probe.*"}[{{.window}}]))
            /
            count(avg_over_time(probe_success{job=~".*loop-runtime-api-probe.*"}[{{.window}}]))
          )
    alerting:
      name: LoopRuntimeTenantAvailabilityBudgetBurn
      labels:
        category: availability
      annotations:
        summary: "Tenant availability error budget burn rate is too high."
        runbook: "Check Traefik health. Verify CF Tunnel connectivity. Check tenant pod status."
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning
