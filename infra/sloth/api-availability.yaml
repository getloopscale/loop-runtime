# SLO: Control Plane API Availability
# Measures the ratio of non-5xx responses from the LoopRuntime API.
# Target: 99.9% — the API must be available for CLI and webhook operations.
version: "prometheus/v1"
service: "loop-runtime-api"
labels:
  owner: "platform-team"
  tier: "infrastructure"
slos:
  - name: "api-availability"
    objective: 99.9
    description: "Percentage of API requests that do not result in a server error (5xx)."
    sli:
      events:
        error_query: sum(rate(loop_runtime_api_requests_total{status=~"5.."}[{{.window}}]))
        total_query: sum(rate(loop_runtime_api_requests_total[{{.window}}]))
    alerting:
      name: LoopRuntimeAPIAvailabilityBudgetBurn
      labels:
        category: availability
      annotations:
        summary: "API availability error budget burn rate is too high."
        runbook: "Check API pod health. Review error logs. Check database connectivity."
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning
