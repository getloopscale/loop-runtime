# Cell Template v1.0.0
# ADR-0008 Phase 4 (P4-4)
# Defines the exact versions and configuration for all Cell components.
# Each Cell is provisioned from a template version.
# Cells can run different template versions (rolling upgrade).

apiVersion: loopzero.dev/v1
kind: CellTemplate
metadata:
  version: "1.0.0"
  description: "Initial Cell template — matches current production config"

spec:
  kubernetes:
    version: "1.32"
    nodePool:
      defaultSize: "s-2vcpu-4gb"
      defaultCount: 2
      minNodes: 2
      maxNodes: 10
      autoScale: false

  argocd:
    chartVersion: "7.7.16"
    appVersion: "2.13.3"
    tier: "small"  # small/medium/large — maps to P4-3 resource tuning
    config:
      statusProcessors: 20
      operationProcessors: 10
      repoServerReplicas: 1
      repoServerParallelism: 5
      redisMaxMemory: "128MB"
      redisCompression: true

  traefik:
    chartVersion: "28.3.0"
    replicas: 2
    config:
      logFormat: "json"
      accessLog: true
      metrics: true

  certManager:
    chartVersion: "1.14.5"
    config:
      issuer: "letsencrypt-dns01"
      dnsProvider: "cloudflare"

  monitoring:
    prometheus:
      enabled: true
      mode: "agent"  # agent mode: scrape locally, remote-write to central
      remoteWriteURL: "" # set per-environment
    promtail:
      enabled: true
      lokiURL: "" # set per-environment

  networkPolicies:
    denyAllDefault: true
    allowDNS: true
    allowMetrics: true

  resourceQuotas:
    defaultPerNamespace:
      cpu: "4"
      memory: "8Gi"
      pods: "20"
      services: "10"
