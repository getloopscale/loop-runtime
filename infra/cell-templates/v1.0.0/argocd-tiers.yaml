# ArgoCD Resource Tuning per Cell Size Tier
# ADR-0008 Phase 4 (P4-3)
# Based on CNOE benchmark data (50k apps, m5.2xlarge)
# and ArgoCD GitHub Discussion #19113 (ApplicationSet scaling)

tiers:
  small:
    description: "< 1,000 applications per Cell"
    controller:
      statusProcessors: 20
      operationProcessors: 10
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "1"
          memory: "2Gi"
    repoServer:
      replicas: 1
      parallelismLimit: 5
      resources:
        requests:
          cpu: "250m"
          memory: "512Mi"
        limits:
          cpu: "1"
          memory: "1Gi"
    redis:
      maxmemory: "128mb"
      compression: true
    server:
      replicas: 1

  medium:
    description: "1,000 - 3,000 applications per Cell"
    controller:
      statusProcessors: 50
      operationProcessors: 25
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
    repoServer:
      replicas: 3
      parallelismLimit: 10
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "2Gi"
    redis:
      maxmemory: "256mb"
      compression: true
    server:
      replicas: 2

  large:
    description: "3,000 - 5,000 applications per Cell"
    controller:
      statusProcessors: 100
      operationProcessors: 50
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "4"
          memory: "8Gi"
    repoServer:
      replicas: 5
      parallelismLimit: 20
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
    redis:
      maxmemory: "512mb"
      compression: true
    server:
      replicas: 2
