apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  project: loopzero-platform
  source:
    repoURL: https://gitea.loopzero-system.svc.cluster.local:3000/loopzero-platform/argocd-bootstrap.git
    path: infra/argocd-bootstrap/apps
    targetRevision: HEAD
    directory:
      recurse: true
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    # Self-managing root: PR-driven only — no auto-sync to prevent ArgoCD from
    # silently changing its own root configuration.
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
