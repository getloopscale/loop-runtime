apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: build-promtail
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: build
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: loopzero-platform
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: promtail
    targetRevision: 6.16.6
    helm:
      releaseName: promtail
      valuesObject:
        config:
          clients:
          - url: http://172.18.0.3:30094/loki/api/v1/push
            batchwait: 5s
            batchsize: 1048576
            backoff_config:
              max_retries: 20
              min_period: 500ms
              max_period: 5m
          snippets:
            scrapeConfigs: "- job_name: argo-workflow-pods\n  kubernetes_sd_configs:\n\
              \    - role: pod\n  # CHG-002b 2026-04-27 \u2014 drop noisy Argo wait-container\
              \ chatter so\n  # Loki doesn't ingest \"removing directory from watcher\"\
              \ floods.\n  pipeline_stages:\n    - cri: {}\n    - match:\n       \
              \ selector: '{container=\"wait\"}'\n        stages:\n          - drop:\n\
              \              expression: '.*level=info.*\"removing directory from\
              \ watcher\".*'\n          - drop:\n              expression: '.*EOF.*Reading\
              \ from journal.*'\n  relabel_configs:\n    # Only collect logs from\
              \ Argo Workflow pods (have workflow label)\n    - source_labels: [__meta_kubernetes_pod_label_workflows_argoproj_io_workflow]\n\
              \      action: keep\n      regex: .+\n    # Set __path__ so Promtail\
              \ knows which log files to tail\n    - source_labels: [__meta_kubernetes_pod_uid,\
              \ __meta_kubernetes_pod_container_name]\n      target_label: __path__\n\
              \      separator: /\n      replacement: /var/log/pods/*$1/$2/*.log\n\
              \    # Extract workflow ID as label for LogQL queries\n    - source_labels:\
              \ [__meta_kubernetes_pod_label_workflows_argoproj_io_workflow]\n   \
              \   target_label: workflow\n    # Standard K8s metadata\n    - source_labels:\
              \ [__meta_kubernetes_namespace]\n      target_label: namespace\n   \
              \ - source_labels: [__meta_kubernetes_pod_container_name]\n      target_label:\
              \ container\n    # CHG-002b 2026-04-27 \u2014 DROPPED `step` and `pod`\
              \ labels. Each\n    # carried per-execution unique values, multiplying\
              \ Loki active-\n    # stream count by ~5x. Pod identity remains accessible\
              \ via\n    # filename in raw log line; step is queryable via LogQL filter\n\
              \    # over message content. Trade-off: query \"logs of pod X\" requires\n\
              \    # `|= \"$pod_name\"` instead of `{pod=\"X\"}`. Acceptable for L3+\n\
              \    # since UI never queries by pod alone.\n"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
  destination:
    server: https://loopzero-build.example
    namespace: monitoring
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
