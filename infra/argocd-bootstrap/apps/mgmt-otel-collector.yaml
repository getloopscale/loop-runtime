apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-otel-collector
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: mgmt
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: loopzero-platform
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.96.0
    helm:
      releaseName: otel-collector
      valuesObject:
        image:
          repository: otel/opentelemetry-collector-contrib
          tag: 0.96.0
        mode: deployment
        securityContext:
          runAsNonRoot: true
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 15
        config:
          extensions:
            health_check:
              endpoint: 0.0.0.0:13133
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          processors:
            batch:
              timeout: 5s
              send_batch_size: 1024
            probabilistic_sampler:
              sampling_percentage: 100
          exporters:
            debug:
              verbosity: basic
            prometheus:
              endpoint: 0.0.0.0:8889
            otlp/tempo:
              endpoint: tempo.loopzero-system.svc:4317
              tls:
                insecure: true
          service:
            extensions:
            - health_check
            pipelines:
              traces:
                receivers:
                - otlp
                processors:
                - probabilistic_sampler
                - batch
                exporters:
                - otlp/tempo
              metrics:
                receivers:
                - otlp
                processors:
                - batch
                exporters:
                - prometheus
        command:
          extraArgs:
          - --set=service.telemetry.metrics.address=0.0.0.0:8890
        ports:
          metrics:
            enabled: true
            containerPort: 8890
            servicePort: 8890
            protocol: TCP
          otlp:
            enabled: true
            containerPort: 4317
            servicePort: 4317
            protocol: TCP
          otlp-http:
            enabled: true
            containerPort: 4318
            servicePort: 4318
            protocol: TCP
          prometheus:
            enabled: true
            containerPort: 8889
            servicePort: 8889
            protocol: TCP
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
