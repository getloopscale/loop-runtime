apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-minio
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: mgmt
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: loopzero-platform
  source:
    repoURL: https://charts.min.io/
    chart: minio
    targetRevision: 5.4.0
    helm:
      releaseName: minio
      valuesObject:
        mode: distributed
        rootUser: loopzero-admin
        rootPassword: loopzero-dev-password
        livenessProbe:
          enabled: true
        readinessProbe:
          enabled: true
        resources:
          limits:
            cpu: 2000m
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 2Gi
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        persistence:
          size: 50Gi
        extraEnvVars:
        - name: MINIO_API_REQUESTS_MAX
          value: '10000'
        - name: MINIO_API_REQUESTS_DEADLINE
          value: 30s
        - name: MINIO_SCANNER_SPEED
          value: slowest
        - name: MINIO_HEAL_MAX_IO
          value: '30'
        service:
          type: ClusterIP
        consoleService:
          type: ClusterIP
        buckets:
        - name: loopzero-artifacts
          policy: none
        - name: loopzero-builds
          policy: none
        - name: loopzero-logs
          policy: none
        statefulset:
          replicaCount: 4
          drivesPerNode: 1
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: minio
              topologyKey: kubernetes.io/hostname
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        networkPolicy:
          enabled: true
          allowExternal: false
          flavor: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: loopzero-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
