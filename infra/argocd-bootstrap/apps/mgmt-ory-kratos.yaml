apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-ory-kratos
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: mgmt
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: loopzero-platform
  source:
    repoURL: https://k8s.ory.sh/helm/charts
    chart: kratos
    targetRevision: 0.61.0
    helm:
      releaseName: ory-kratos
      valuesObject:
        kratos:
          automigration:
            enabled: true
            type: initContainer
          config:
            dsn: postgres://loopzero:loopzero-dev-password@postgresql.loopzero-system.svc.cluster.local:5432/kratos?sslmode=disable
            identity:
              default_schema_id: default
              schemas:
              - id: default
                url: file:///etc/config/identity.default.schema.json
            selfservice:
              default_browser_return_url: http://localhost:4455/
              methods:
                password:
                  enabled: true
                  config:
                    min_password_length: 10
                    identifier_similarity_check_enabled: true
                    haveibeenpwned_enabled: true
                    ignore_network_errors: true
                totp:
                  enabled: true
                  config:
                    issuer: LoopZero Platform
                lookup_secret:
                  enabled: true
                oidc:
                  enabled: true
                  config:
                    base_redirect_uri: http://localhost:4455/
                    providers:
                    - id: github
                      provider: github
                      client_id: REPLACE_VIA_PULUMI
                      client_secret: REPLACE_VIA_PULUMI
                      mapper_url: base64://bG9jYWwgY2xhaW1zID0gc3RkLmV4dFZhcignY2xhaW1zJyk7CnsKICBpZGVudGl0eTogewogICAgdHJhaXRzOiB7CiAgICAgIGVtYWlsOiBjbGFpbXMuZW1haWwsCiAgICAgIFtpZiBzdGQub2JqZWN0SGFzKGNsYWltcywgJ25hbWUnKSAmJiBjbGFpbXMubmFtZSAhPSBudWxsIHRoZW4gJ25hbWUnXTogY2xhaW1zLm5hbWUsCiAgICB9LAogIH0sCn0K
                      scope:
                      - user:email
                    - id: google
                      provider: google
                      client_id: REPLACE_VIA_PULUMI
                      client_secret: REPLACE_VIA_PULUMI
                      mapper_url: base64://bG9jYWwgY2xhaW1zID0gc3RkLmV4dFZhcignY2xhaW1zJyk7CnsKICBpZGVudGl0eTogewogICAgdHJhaXRzOiB7CiAgICAgIGVtYWlsOiBjbGFpbXMuZW1haWwsCiAgICAgIFtpZiBzdGQub2JqZWN0SGFzKGNsYWltcywgJ25hbWUnKSAmJiBjbGFpbXMubmFtZSAhPSBudWxsIHRoZW4gJ25hbWUnXTogY2xhaW1zLm5hbWUsCiAgICB9LAogIH0sCn0K
                      scope:
                      - email
                      - profile
              flows:
                registration:
                  enabled: true
                  ui_url: http://localhost:4455/registration
                  after:
                    password:
                      hooks:
                      - hook: session
                    oidc:
                      hooks:
                      - hook: session
                login:
                  ui_url: http://localhost:4455/login
                verification:
                  enabled: true
                  ui_url: http://localhost:4455/verification
                recovery:
                  enabled: true
                  ui_url: http://localhost:4455/recovery
                settings:
                  ui_url: http://localhost:4455/settings
                error:
                  ui_url: http://localhost:4455/error
                logout:
                  after:
                    default_browser_return_url: http://localhost:4455/login
            security:
              account_enumeration:
                mitigate: true
            courier:
              delivery_strategy: http
              http:
                request_config:
                  url: https://api.resend.com/emails
                  method: POST
                  headers:
                    Content-Type: application/json
                    Authorization: Bearer placeholder
                  body: base64://ZnVuY3Rpb24oY3R4KSB7CiAgZnJvbTogIlRoZW8gPG5vcmVwbHlAdXNldGhlby5kZXY+IiwKICB0bzogW2N0eC5yZWNpcGllbnRdLAogIHN1YmplY3Q6IGN0eC5zdWJqZWN0LAogIGh0bWw6IGN0eC5odG1sX2JvZHksCn0=
            session:
              lifespan: 24h
              cookie:
                same_site: Lax
            log:
              level: info
              format: json
              leak_sensitive_values: false
            secrets:
              cookie:
              - loopzero-dev-cookie-secret-32chars!!
              cipher:
              - loopzero-dev-cipher-secret-32chars!!
            hashers:
              argon2:
                parallelism: 1
                memory: 128MB
                iterations: 2
                salt_length: 16
                key_length: 16
          identitySchemas:
            identity.default.schema.json: "{\n  \"$id\": \"https://schemas.loopzero.example/identity.schema.json\"\
              ,\n  \"$schema\": \"http://json-schema.org/draft-07/schema#\",\n  \"\
              title\": \"LoopZero Identity\",\n  \"type\": \"object\",\n  \"properties\"\
              : {\n    \"traits\": {\n      \"type\": \"object\",\n      \"properties\"\
              : {\n        \"email\": {\n          \"type\": \"string\",\n       \
              \   \"format\": \"email\",\n          \"title\": \"Email\",\n      \
              \    \"ory.sh/kratos\": {\n            \"credentials\": {\n        \
              \      \"password\": { \"identifier\": true }\n            },\n    \
              \        \"recovery\": { \"via\": \"email\" },\n            \"verification\"\
              : { \"via\": \"email\" }\n          }\n        },\n        \"name\"\
              : {\n          \"type\": \"string\",\n          \"title\": \"Name\"\n\
              \        }\n      },\n      \"required\": [\"email\"],\n      \"additionalProperties\"\
              : false\n    }\n  }\n}\n"
        service:
          public:
            enabled: true
            type: ClusterIP
            port: 80
          admin:
            enabled: true
            type: ClusterIP
            port: 80
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
  destination:
    server: https://kubernetes.default.svc
    namespace: loopzero-auth
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
