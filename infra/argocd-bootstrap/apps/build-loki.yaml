apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: build-loki
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: build
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: loopzero-platform
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.24.0
    helm:
      releaseName: loki
      valuesObject:
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: s3
            bucketNames:
              chunks: loopzero-logs
              ruler: loopzero-logs
              admin: loopzero-logs
            s3:
              endpoint: minio.loopzero-system:9000
              bucketnames: loopzero-logs
              access_key_id: loopzero-admin
              secret_access_key: loopzero-dev-password
              s3ForcePathStyle: true
              insecure: true
          limits_config:
            retention_period: 168h
            max_query_series: 500
            max_query_length: 721h
            max_global_streams_per_user: 100000
            max_streams_per_user: 0
            ingestion_rate_mb: 16
            ingestion_burst_size_mb: 32
            max_entries_limit_per_query: 10000
            per_stream_rate_limit: 10MB
            per_stream_rate_limit_burst: 20MB
          ingester:
            chunk_idle_period: 15m
            chunk_target_size: 1572864
            max_chunk_age: 1h
          schemaConfig:
            configs:
            - from: '2026-01-01'
              store: tsdb
              object_store: s3
              schema: v13
              index:
                prefix: loki_index_
                period: 24h
        deploymentMode: SingleBinary
        singleBinary:
          replicas: 1
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        gateway:
          enabled: false
        monitoring:
          selfMonitoring:
            enabled: false
          lokiCanary:
            enabled: false
        test:
          enabled: false
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
  destination:
    server: https://loopzero-build.example
    namespace: monitoring
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
