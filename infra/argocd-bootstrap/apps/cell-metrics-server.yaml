apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: runtime-metrics-server
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: runtime
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
spec:
  project: loopzero-platform
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.12.1
    helm:
      releaseName: metrics-server
      valuesObject:
        args:
        - --kubelet-insecure-tls
        - --kubelet-preferred-address-types=InternalIP
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 200m
            memory: 400Mi
  destination:
    server: https://loopzero-cell-0.example
    namespace: kube-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
