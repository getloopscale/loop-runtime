apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: runtime-external-secrets
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: runtime
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  project: loopzero-platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.14.3
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        webhook:
          create: true
        certController:
          create: true
  destination:
    server: https://loopzero-cell-0.example
    namespace: external-secrets
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
