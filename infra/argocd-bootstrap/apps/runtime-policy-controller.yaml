apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: runtime-policy-controller
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: runtime
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: loopzero-platform
  source:
    repoURL: https://sigstore.github.io/helm-charts
    chart: policy-controller
    targetRevision: 0.8.5
    helm:
      releaseName: policy-controller
      valuesObject:
        webhook:
          replicaCount: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  destination:
    server: https://loopzero-runtime.example
    namespace: cosign-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
