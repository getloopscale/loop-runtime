apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-ory-hydra
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: mgmt
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: loopzero-platform
  source:
    repoURL: https://k8s.ory.sh/helm/charts
    chart: hydra
    targetRevision: 0.61.0
    helm:
      releaseName: ory-hydra
      valuesObject:
        hydra:
          automigration:
            enabled: true
            type: initContainer
          dev: true
          config:
            dsn: postgres://loopzero:loopzero-dev-password@postgresql.loopzero-system.svc.cluster.local:5432/hydra?sslmode=disable
            urls:
              self:
                issuer: http://localhost:4444/
              login: http://localhost:4455/login
              consent: http://localhost:4455/consent
              logout: http://localhost:4455/logout
            oauth2:
              expose_internal_errors: false
            serve:
              public:
                cors:
                  enabled: true
                  allowed_origins:
                  - http://localhost:3000
                  - http://localhost:4455
                  allowed_methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  allowed_headers:
                  - Authorization
                  - Content-Type
                  allow_credentials: true
              admin:
                cors:
                  enabled: false
            log:
              level: info
              format: json
              leak_sensitive_values: false
            secrets:
              system:
              - loopzero-dev-hydra-system-secret!!
              cookie:
              - loopzero-dev-hydra-cookie-secret!!
            ttl:
              access_token: 1h
              refresh_token: 720h
              id_token: 1h
              auth_code: 10m
            strategies:
              access_token: jwt
              jwt:
                scope_claim: list
        service:
          public:
            enabled: true
            type: ClusterIP
            port: 4444
          admin:
            enabled: true
            type: ClusterIP
            port: 4445
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
  destination:
    server: https://kubernetes.default.svc
    namespace: loopzero-auth
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
