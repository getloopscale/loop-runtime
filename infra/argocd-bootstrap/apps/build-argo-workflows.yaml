apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: build-argo-workflows
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: build
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: loopzero-platform
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-workflows
    targetRevision: 1.0.5
    helm:
      releaseName: argo-workflows
      valuesObject:
        images:
          cloneRunner: registry.digitalocean.com/loopzero-system/loopzero-clone-runner:v0.1.0
        sourceBucket: loopzero-builds
        controller:
          securityContext:
            runAsNonRoot: true
          workflowWorkers: 32
          podWorkers: 32
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6060
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 6060
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            limits:
              cpu: '2'
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 512Mi
          metricsConfig:
            enabled: true
            port: 9090
            path: /metrics
        workflow:
          serviceAccount:
            create: true
            name: loopzero-build-sa
          rbac:
            create: true
        minio:
          insecure: true
        workflowDefaults:
          spec:
            podGC:
              strategy: OnWorkflowCompletion
              deleteDelayDuration: 4h
            volumeClaimGC:
              strategy: OnWorkflowCompletion
        server:
          securityContext:
            runAsNonRoot: true
          livenessProbe:
            httpGet:
              path: /
              port: 2746
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 2746
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          service:
            type: ClusterIP
  destination:
    server: https://loopzero-build.example
    namespace: argo
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
