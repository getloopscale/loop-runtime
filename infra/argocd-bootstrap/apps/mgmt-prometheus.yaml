apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-prometheus
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: mgmt
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: loopzero-platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 25.27.0
    helm:
      releaseName: prometheus
      valuesObject:
        server:
          retention: 15d
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          persistentVolume:
            enabled: true
            size: 50Gi
        alertmanager:
          enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
        serverFiles:
          alerting_rules.yml: {}
          recording_rules.yml: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
