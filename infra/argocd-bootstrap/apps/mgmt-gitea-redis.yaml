apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-gitea-redis
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: mgmt
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  project: loopzero-platform
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: redis
    targetRevision: 19.6.4
    helm:
      releaseName: gitea-redis
      valuesObject:
        architecture: standalone
        image:
          repository: bitnamilegacy/redis
        auth:
          enabled: false
        master:
          persistence:
            enabled: true
            size: 1Gi
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          podSecurityContext:
            runAsNonRoot: true
          containerSecurityContext:
            runAsNonRoot: true
        metrics:
          enabled: true
          image:
            repository: bitnamilegacy/redis-exporter
          serviceMonitor:
            enabled: false
        replica:
          replicaCount: 0
  destination:
    server: https://kubernetes.default.svc
    namespace: loopzero-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
