apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-gitea
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: mgmt
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  project: loopzero-platform
  source:
    repoURL: https://dl.gitea.com/charts/
    chart: gitea
    targetRevision: 10.6.0
    helm:
      releaseName: gitea
      valuesObject:
        gitea:
          admin:
            username: gitea_admin
            password: loopzero-gitea-dev-2026
            email: admin@loopzero.local
          livenessProbe:
            enabled: true
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            enabled: true
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          config:
            database:
              DB_TYPE: postgres
              HOST: postgresql.loopzero-system.svc.cluster.local:5432
              NAME: gitea
              USER: loopzero
              PASSWD: loopzero-dev-password
              SSL_MODE: disable
              MAX_OPEN_CONNS: '8'
              MAX_IDLE_CONNS: '4'
              CONN_MAX_LIFETIME: 3600s
            server:
              ROOT_URL: http://gitea-http.loopzero-system.svc.cluster.local:3000
              HTTP_PORT: 3000
            service:
              DISABLE_REGISTRATION: true
            metrics:
              ENABLED: true
              ENABLE_PPROF: false
            session:
              PROVIDER: redis
              PROVIDER_CONFIG: network=tcp,addr=gitea-redis-master:6379,db=0,pool_size=100,idle_timeout=180s
            cache:
              ADAPTER: redis
              HOST: network=tcp,addr=gitea-redis-master:6379,db=1,pool_size=100,idle_timeout=180s
            queue:
              TYPE: redis
              CONN_STR: network=tcp,addr=gitea-redis-master:6379,db=2,pool_size=100,idle_timeout=180s
            indexer:
              ISSUE_INDEXER_TYPE: db
              REPO_INDEXER_ENABLED: false
          metrics:
            enabled: true
        image:
          tag: 1.22.6
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 256Mi
        podSecurityContext:
          runAsNonRoot: true
        service:
          http:
            type: ClusterIP
            sessionAffinity: None
        persistence:
          size: 10Gi
          accessModes:
          - ReadWriteMany
          storageClass: nfs
        redis-cluster:
          enabled: false
        postgresql-ha:
          enabled: false
        postgresql:
          enabled: false
        replicaCount: 2
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: gitea
              topologyKey: kubernetes.io/hostname
  destination:
    server: https://kubernetes.default.svc
    namespace: loopzero-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
