apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: runtime-cluster-issuer
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: runtime
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: loopzero-platform
  source:
    repoURL: https://gitea.loopzero-system.svc.cluster.local:3000/loopzero-platform/charts.git
    path: infra/helm/cluster-issuer
    targetRevision: HEAD
    helm:
      releaseName: cluster-issuer
      valueFiles:
      - ../../helm/cluster-issuer/values.yaml
  destination:
    server: https://loopzero-cell-0.example
    namespace: cert-manager
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
