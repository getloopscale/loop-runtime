apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-harbor
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: mgmt
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: loopzero-platform
  source:
    repoURL: https://helm.goharbor.io
    chart: harbor
    targetRevision: 1.16.2
    helm:
      releaseName: harbor
      valuesObject:
        harbor:
          expose:
            type: clusterIP
            clusterIP:
              name: harbor
            tls:
              enabled: false
          externalURL: https://harbor.dev.loopzero.example
          nginx:
            replicas: 0
          core:
            replicas: 2
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
            podAnnotations:
              prometheus.io/scrape: 'true'
              prometheus.io/port: '8001'
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        component: core
                    topologyKey: kubernetes.io/hostname
            secretKey: ''
            xsrfKey: ''
            robotTokenDuration: 1440
          registry:
            replicas: 2
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        component: registry
                    topologyKey: kubernetes.io/hostname
          jobservice:
            replicas: 1
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            maxJobWorkers: 5
          trivy:
            enabled: false
          notary:
            enabled: false
          chartmuseum:
            enabled: false
          portal:
            enabled: false
          database:
            type: external
            external:
              host: ''
              port: '25060'
              username: harbor
              password: ''
              coreDatabase: harbor_db
              sslmode: require
              maxOpenConns: 10
              maxIdleConns: 5
          redis:
            type: internal
            internal:
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          persistence:
            enabled: true
            resourcePolicy: keep
            imageChartStorage:
              disableredirect: false
              type: s3
              s3:
                region: us-east-1
                regionendpoint: ''
                bucket: ''
                accesskey: ''
                secretkey: ''
                rootdirectory: /harbor
                encrypt: false
                secure: true
                multipartcopymaxconcurrency: 100
                multipartcopythresholdsize: '33554432'
          gc:
            enabled: true
            schedule: 0 2 * * *
            deleteUntagged: true
          metrics:
            enabled: true
            core:
              path: /metrics
              port: 8001
            registry:
              path: /metrics
              port: 8001
            jobservice:
              path: /metrics
              port: 8001
            serviceMonitor:
              enabled: false
              additionalLabels:
                release: monitoring
          containerSecurityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            seccompProfile:
              type: RuntimeDefault
          canary:
            enabled: false
            image: curlimages/curl:8.7.1
            credentialSecretRef:
              name: ''
          init:
            enabled: false
            image: ''
            passwordSecretRef:
              name: ''
              key: harbor-admin-password
          updateStrategy:
            type: RollingUpdate
  destination:
    server: https://kubernetes.default.svc
    namespace: loopzero-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
