apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: runtime-keda
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: runtime
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: loopzero-platform
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.16.1
    helm:
      releaseName: keda
      valuesObject:
        keda:
          operator:
            replicaCount: 1
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
          metricsServer:
            replicaCount: 1
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi
          webhooks:
            enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi
          namespaceLabels:
            keda.sh/exclude: 'true'
          podSecurityContext:
            operator:
              runAsNonRoot: true
            metricServer:
              runAsNonRoot: true
            webhooks:
              runAsNonRoot: true
          prometheus:
            operator:
              enabled: true
              serviceMonitor:
                enabled: true
                additionalLabels:
                  release: monitoring
            metricServer:
              enabled: true
              serviceMonitor:
                enabled: true
                additionalLabels:
                  release: monitoring
            webhooks:
              enabled: true
              serviceMonitor:
                enabled: true
                additionalLabels:
                  release: monitoring
  destination:
    server: https://loopzero-runtime.example
    namespace: keda
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
