apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-blackbox-exporter
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: mgmt
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: loopzero-platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-blackbox-exporter
    targetRevision: 9.2.0
    helm:
      releaseName: blackbox-exporter
      valuesObject:
        modules:
          http_2xx:
            prober: http
            timeout: 10s
            http:
              valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
              valid_status_codes: []
              follow_redirects: true
              preferred_ip_protocol: ip4
          dns_resolve:
            prober: dns
            timeout: 5s
            dns:
              query_name: kubernetes.default.svc.cluster.local
              query_type: A
              preferred_ip_protocol: ip4
          tcp_connect:
            prober: tcp
            timeout: 5s
            tcp:
              preferred_ip_protocol: ip4
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
