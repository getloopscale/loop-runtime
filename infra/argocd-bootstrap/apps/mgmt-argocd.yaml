apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-argocd
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: mgmt
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: loopzero-platform
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 7.3.11
    helm:
      releaseName: argocd
      valuesObject:
        global:
          image:
            tag: v2.13.3
        server:
          containerSecurityContext:
            runAsNonRoot: true
          readinessProbe:
            enabled: true
          livenessProbe:
            enabled: true
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          service:
            type: NodePort
            nodePortHttp: 30082
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: monitoring
              namespace: monitoring
        controller:
          replicas: 3
          env:
          - name: ARGOCD_CONTROLLER_REPLICAS
            value: '3'
          - name: ARGOCD_CONTROLLER_WORKQUEUE_BASEDELAY
            value: 5s
          - name: ARGOCD_CONTROLLER_WORKQUEUE_MAXDELAY
            value: 300s
          - name: ARGOCD_CONTROLLER_WORKQUEUE_BACKOFF_FACTOR
            value: '2'
          containerSecurityContext:
            runAsNonRoot: true
          readinessProbe:
            enabled: true
          livenessProbe:
            enabled: true
          resources:
            limits:
              cpu: 2000m
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 512Mi
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: monitoring
              namespace: monitoring
        repoServer:
          containerSecurityContext:
            runAsNonRoot: true
          readinessProbe:
            enabled: true
          livenessProbe:
            enabled: true
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          replicas: 2
          env:
          - name: ARGOCD_REPO_SERVER_REPO_CACHE_EXPIRATION
            value: 10m
          - name: ARGOCD_REPO_SERVER_DISABLE_TLS
            value: 'false'
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: monitoring
              namespace: monitoring
        redis:
          containerSecurityContext:
            runAsNonRoot: true
          readinessProbe:
            enabled: true
          livenessProbe:
            enabled: true
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
        configs:
          rbac:
            policy.csv: 'p, loopzero-api, applications, sync, */*, allow

              p, loopzero-api, applications, get, */*, allow

              p, loopzero-api, applications, action/*, */*, allow

              '
          params:
            server.insecure: true
            controller.self.heal.enabled: 'false'
            controller.operation.processing.timeout: '300'
          repositories:
            gitea-internal:
              url: http://gitea-http.loopzero-system.svc.cluster.local:3000
              type: git
          cm:
            accounts.loopzero-api: apiKey
            resource.customizations.health.argoproj.io_Application: "hs = {}\nhs.status\
              \ = \"Progressing\"\nhs.message = \"\"\nif obj.status ~= nil then\n\
              \  if obj.status.health ~= nil then\n    hs.status = obj.status.health.status\n\
              \    if obj.status.health.message ~= nil then\n      hs.message = obj.status.health.message\n\
              \    end\n  end\nend\nreturn hs\n"
        notificationsController:
          enabled: true
        notifications:
          notifiers:
            service.webhook.loopzero-api: "# NOTE (infra-arch-012): This URL uses loopzero-system\
              \ namespace which is correct for\n# production (where ArgoCD and loopzero-api\
              \ share the namespace). In local dev (k3d),\n# ArgoCD lives in the 'argocd'\
              \ namespace so this cross-namespace DNS name still\n# resolves correctly\
              \ \u2014 K8s DNS handles {svc}.{ns}.svc.cluster.local across namespaces.\n\
              url: http://loopzero-api.loopzero-system.svc.cluster.local:8080/internal/argocd-callback\n\
              headers:\n- name: Content-Type\n  value: application/json\n# MEET-2026-04-04-029\
              \ P0: Must match LOOPZERO_ARGO_CALLBACK_SECRET.\n# Production: overridden\
              \ by Pulumi with RandomPassword-generated secret.\n# Dev: uses this\
              \ default. NEVER use this value in production.\n- name: Authorization\n\
              \  value: \"Bearer cb-loopzero-dev-local-only\"\n"
          templates:
            template.sync-completed: "webhook:\n  loopzero-api:\n    method: POST\n  \
              \  body: |\n      {\"app_name\": \"\"templated\"\", \"sync_status\"\
              : \"\"templated\"\", \"health_status\": \"\"templated\"\", \"revision\"\
              : \"\"templated\"\"}\n"
          triggers:
            trigger.on-sync-healthy: "- when: app.status.sync.status == 'Synced' &&\
              \ app.status.health.status == 'Healthy'\n  send: [sync-completed]\n"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
