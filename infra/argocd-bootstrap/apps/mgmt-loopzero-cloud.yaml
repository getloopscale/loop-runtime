apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-loopzero-cloud
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: mgmt
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: loopzero-platform
  source:
    repoURL: https://gitea.loopzero-system.svc.cluster.local:3000/loopzero-platform/charts.git
    path: infra/helm/loopzero-cloud
    targetRevision: HEAD
    helm:
      releaseName: loopzero-cloud
      valueFiles:
      - ../../helm/loopzero-cloud/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: loopzero-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
