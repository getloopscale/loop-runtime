apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-nfs-server-provisioner
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: mgmt
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  project: loopzero-platform
  source:
    repoURL: https://kubernetes-sigs.github.io/nfs-ganesha-server-and-external-provisioner/
    chart: nfs-server-provisioner
    targetRevision: 1.8.0
    helm:
      releaseName: nfs-server-provisioner
      valuesObject:
        persistence:
          enabled: true
          size: 100Gi
          storageClass: ''
        storageClass:
          defaultClass: false
          name: nfs
          reclaimPolicy: Retain
          allowVolumeExpansion: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: nfs-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
