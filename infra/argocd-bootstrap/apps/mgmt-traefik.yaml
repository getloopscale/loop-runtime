apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-traefik
  namespace: argocd
  labels:
    loopzero.io/managed-by: loopzero-platform
    loopzero.io/cluster-role: mgmt
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  project: loopzero-platform
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 28.3.0
    helm:
      releaseName: traefik
      valuesObject:
        deployment:
          replicas: 2
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
          apiVersion: policy/v1
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: traefik
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
        service:
          type: LoadBalancer
        providers:
          kubernetesIngress:
            enabled: true
          kubernetesCRD:
            enabled: true
            allowCrossNamespace: true
        ports:
          web:
            port: 8000
            expose:
              default: true
            exposedPort: 80
            protocol: TCP
            redirectTo:
              port: websecure
          websecure:
            port: 8443
            expose:
              default: true
            exposedPort: 443
            protocol: TCP
            tls:
              enabled: true
          metrics:
            port: 9100
            expose:
              default: false
            exposedPort: 9100
            protocol: TCP
        additionalArguments:
        - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=60s
        - --entryPoints.websecure.transport.respondingTimeouts.writeTimeout=60s
        - --entryPoints.websecure.transport.respondingTimeouts.idleTimeout=120s
        - --entryPoints.web.transport.respondingTimeouts.readTimeout=10s
        - --entryPoints.web.transport.respondingTimeouts.writeTimeout=10s
        - --serversTransport.forwardingTimeouts.dialTimeout=30s
        - --serversTransport.forwardingTimeouts.responseHeaderTimeout=60s
        metrics:
          prometheus:
            entryPoint: metrics
            addEntryPointsLabels: true
            addRoutersLabels: true
            addServicesLabels: true
        logs:
          general:
            format: json
          access:
            enabled: true
            format: json
            filters:
              statusCodes:
              - 400-599
              retryAttempts: true
            fields:
              headers:
                defaultMode: drop
                names:
                  Host: keep
                  X-Correlation-ID: keep
                  User-Agent: keep
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
