# Plan 2026-05-20-helm-render-time-testing-terratest T1.3 / D10
#
# DRILL env stub for loopzero-api render-time tests. Plain YAML.
#
# Source of truth: infra/helmfile/values/drill/loopzero-api.yaml.gotmpl
# Sync: manual on helmfile values change.
#
# Drill-specific: uses prod DOCR namespace, drill-phase2-* image tag
# (Bug #16/#18 LIVE fixes from 2026-05-17/18 drill iters).

image:
  repository: registry.digitalocean.com/loopzero-system/loopzero-api
  # drill uses immutable build tag (NOT latest — DOCR rejects)
  tag: drill-phase2-9ad223a5
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: loopzero-registry-pull

# Drill HA — multi-replica per CTO mandate 2026-05-14 (Bug #18 closure
# evidence — leader election fail-over validated LIVE iter 12).
replicaCount: 2

# Drill domain (pulumi-drill CF Zone)
domain: loopzero-drill.example

# Drill Hydra in loopzero-auth namespace (drill helmfile install location)
env:
  JWT_ISSUER: http://ory-hydra-public.loopzero-auth.svc.cluster.local:4444
  JWKS_URL: http://ory-hydra-public.loopzero-auth.svc.cluster.local:4444/.well-known/jwks.json
