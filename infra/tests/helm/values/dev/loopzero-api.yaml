# Plan 2026-05-20-helm-render-time-testing-terratest T1.3 / D10
#
# DEV env stub for loopzero-api render-time tests. Plain YAML (NO .gotmpl
# template directives) — consumable by helm.RenderTemplate directly.
#
# Source of truth: infra/helmfile/values/dev/loopzero-api.yaml.gotmpl
#                  (helmfile-templated, NOT directly usable by tests)
#
# Sync protocol: when helmfile values change, operator manually updates
# this stub. Phase 3 render tests catch drift via assertions.

image:
  # dev uses local k3d registry — no DOCR pull
  repository: k3d-loopzero-registry:5000/loopzero-api
  tag: dev
  pullPolicy: Always

# dev k3d does not have DOCR pull secret
imagePullSecrets: []

# Dev-specific config: 1 replica (single-node k3d, no HA needed)
replicaCount: 1

# dev domain
domain: dev.loopzero.local

# JWT issuer points to local Hydra (cluster-local DNS)
env:
  JWT_ISSUER: http://ory-hydra-public.loopzero-auth.svc.cluster.local:4444
  JWKS_URL: http://ory-hydra-public.loopzero-auth.svc.cluster.local:4444/.well-known/jwks.json
