# Plan 2026-05-20-helm-render-time-testing-terratest T1.3 / D10
#
# PROD env stub for loopzero-api render-time tests. Plain YAML.
#
# Source of truth: infra/helmfile/values/prod/loopzero-api.yaml.gotmpl
# Sync: manual on helmfile values change.
#
# Prod uses immutable release tag (semver / commit-sha).

image:
  repository: registry.digitalocean.com/loopzero-system/loopzero-api
  # Prod tag pinned to last released semver — set by CI build metadata
  tag: v0.5.0
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: loopzero-registry-pull

# Prod HA — multi-replica + scaled higher per traffic envelope
replicaCount: 3

# Prod domain — sales-public hostname
domain: loopzero.example

# Prod Hydra namespace + public HTTPS issuer
env:
  JWT_ISSUER: https://auth.loopzero.example
  JWKS_URL: https://auth.loopzero.example/.well-known/jwks.json
