# Distributed L5 test using k6 Operator.
# Requires k6-operator installed (infra/helm/k6-operator/).
# Splits the 5,000-tenant multi-cell test across 16 pods — L5 is the
# largest test (maxVUs:1000), where a single k6 pod becomes the
# generator bottleneck. Mirrors testrun-l4-distributed.yaml; the
# fixture-builder + fixtures volumes are declared at the runner level
# (correct pod-spec placement) and the build-fixture initContainer only
# mounts them.
#
# Apply via: task k6:distributed:l5
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: k6-l5-distributed
  namespace: loop-runtime-system
  labels:
    app.kubernetes.io/name: k6-load-test
    app.kubernetes.io/part-of: loop-runtime
spec:
  parallelism: 16
  script:
    configMap:
      name: k6-scripts
      file: scripts/l5-multicell.js
  runner:
    image: grafana/k6:0.52.0
    env:
      - name: K6_API_URL
        value: "http://loop-runtime-api.loop-runtime-system.svc.cluster.local:8080"
      - name: K6_SVC_AUTH
        valueFrom:
          secretKeyRef:
            name: loop-runtime-api-secrets
            key: LOOP_RUNTIME_SERVICE_AUTH_SECRET
      - name: K6_BUNDLE_PATH
        value: "/fixtures/bundle.bin"
      - name: K6_PROMETHEUS_RW_SERVER_URL
        value: "http://prometheus-server.loop-runtime-system.svc.cluster.local/api/v1/write"
      - name: K6_TENANT_COUNT
        value: "5000"
      - name: K6_TENANTS_PER_CELL
        value: "500"
    resources:
      limits:
        cpu: "2"
        memory: "2Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"
    volumeMounts:
      - name: fixtures
        mountPath: /fixtures
        readOnly: true
    volumes:
      - name: fixtures
        emptyDir: {}
      - name: fixture-builder
        configMap:
          name: k6-fixture-builder
          defaultMode: 0755
    initContainers:
      - name: build-fixture
        image: alpine:3.21
        command: ["sh", "/scripts/build-bundle.sh"]
        volumeMounts:
          - name: fixture-builder
            mountPath: /scripts
          - name: fixtures
            mountPath: /fixtures
