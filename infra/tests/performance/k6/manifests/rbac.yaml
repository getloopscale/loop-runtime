apiVersion: v1
kind: ServiceAccount
metadata:
  name: k6-runner
  namespace: loop-runtime-system
  labels:
    app.kubernetes.io/name: k6-runner
    app.kubernetes.io/part-of: loop-runtime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k6-runner
  namespace: loop-runtime-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["loop-runtime-api-secrets"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k6-runner
  namespace: loop-runtime-system
subjects:
  - kind: ServiceAccount
    name: k6-runner
    namespace: loop-runtime-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k6-runner
