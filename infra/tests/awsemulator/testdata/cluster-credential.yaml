# loop-runtime-api refuses to start without a connected cell. Nothing writes this status here (no
# platform operator runs), so the test sets it.
apiVersion: runtime.getloopscale.com/v1
kind: ClusterCredential
metadata:
  name: cell-0
spec:
  apiServer: https://kubernetes.default.svc
  cellID: cell-0
  clusterName: {{ .ClusterName }}
  scope: {argocd: false, operators: false}
  secretRef: {name: cell-0-kubeconfig, namespace: {{ .Namespace }}}
