# loopzero-api reads a kubeconfig file for the build cluster at boot and makes no call to it
# there. This one points back at the cluster loopzero-api runs in.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loopzero-api-build-kubeconfig
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: self
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: service-account
        user: {tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token}
    contexts:
      - name: build
        context: {cluster: self, user: service-account}
    current-context: build
