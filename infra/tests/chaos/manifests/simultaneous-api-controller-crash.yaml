# Chaos Experiment: Simultaneous API + Controller crash
#
# scale-50k-plan L4: "Simultaneous controller + API crash → full
# recovery < 3min"
#
# Kills both the loopzero-api and loopzero-controller pods within the same
# time window. This is the worst-case control plane failure. The
# platform MUST:
#   1. Both pods restart via Deployment controller
#   2. Controller re-acquires leader lease via generation fencing
#   3. API serves health within 60s
#   4. No builds stuck in RUNNING with no owner
#
# Hypothesis:
#   - Both pods recover within 3 minutes
#   - Leader election completes cleanly (no split-brain)
#   - No stuck builds after recovery
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: simultaneous-api-controller-crash
  namespace: loopzero-system
  annotations:
    loopzero.io/roadmap: "scale-50k-plan"
    loopzero.io/dod-test: "TestChaos_SimultaneousCrash"
    loopzero.io/hypothesis: "Both recover <3min, leader fencing prevents split-brain"
spec:
  action: pod-kill
  mode: all
  selector:
    namespaces:
      - loopzero-system
    labelSelectors:
      "loopzero.io/component": "control-plane"
  duration: "10s"
