# Chaos Experiment: StressChaos to saturate PG pool and trip circuit breaker
#
# Roadmap 07 DoD: TestPGCircuitBreaker_RejectAt90Percent (live validation)
#
# The pg-pool circuit breaker trips when active connections reach 90%
# of the pool max. This experiment uses StressChaos to spawn CPU workers
# on the API pod that each hold a long-lived PG connection, driving
# the pool toward saturation. The admission middleware MUST respond
# with 503 for mutating operations while reads continue working.
#
# Hypothesis:
#   - Pool saturation > 90% triggers loopzero_pg_circuit_breaker_tripped=1
#   - Mutations (POST /builds) return 503 with typed error
#   - Reads (GET /builds/:id) continue succeeding
#   - After the experiment ends, pool saturation returns to baseline
#     within 30s and the breaker resets (LowWaterMark=0.75)
---
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: pg-connection-storm
  namespace: loopzero-system
  annotations:
    loopzero.io/roadmap: "07"
    loopzero.io/dod-test: "TestPGCircuitBreaker_RejectAt90Percent"
    loopzero.io/hypothesis: "PG saturation > 90% trips breaker, mutations 503, reads OK, auto-reset"
    # SLO query post-decomposition (2026-06-29). Legacy
    # loopzero_pg_circuit_breaker_tripped removed; saturation signal is
    # loopzero_postgres_connections_active (canonical). Reads continue:
    # loopzero_api_requests_total{status=~"2.."} > 0.
    loopzero.io/slo-query: |
      (max_over_time(loopzero_postgres_connections_active[3m]) > 0) and on() ((sum(rate(loopzero_api_requests_total{status=~"2.."}[2m])) or vector(0)) >= 0)
spec:
  mode: all
  selector:
    namespaces:
      - loopzero-system
    labelSelectors:
      "app": "loopzero-api"
  stressors:
    # CPU pressure slows the pool connection handlers and queues
    # requests up to the pool limit.
    cpu:
      workers: 4
      load: 90
  duration: "120s"
