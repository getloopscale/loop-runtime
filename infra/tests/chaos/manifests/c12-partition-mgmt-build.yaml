# Chaos Experiment: partition mgmt (loop-runtime-system) <-> build (argo-system)
#
# M13 (plan m13-chaos-declarative): the declarative reexpression of the c12
# scenario, previously an inline heredoc in
# infra/scripts/local/chaos-scenarios/c12-simul-prs-during-partition.sh.
#
# Scenario: cut the network between the mgmt cluster (where loop-runtime-api submits
# builds + writes releases) and the build cluster (argo-workflows) while TWO
# PRs for the same (tenant, project, environment) are dispatched simultaneously.
#
# EC-6 (INVARIANT, hermetically locked by TestC12Manifest_ScopedPartition):
# the partition selector is EXPLICITLY scoped to [loop-runtime-system, argo-system].
# It is NEVER an unscoped all-namespace partition — that would also cut
# operator port-forwards + browser sessions on shared dev-public infra
# (out-of-scope blast radius).
#
# Hypothesis (asserted by the LIVE c12 spec post-heal):
#   - at least 1 release reaches ACTIVE (the deploy path survives + heals)
#   - ZERO duplicate ACTIVE releases for the same commit_sha
#     (withEnvironmentLock + pg_advisory_xact_lock hold under a real partition:
#      the 2 concurrent PRs resolve as 1 ACTIVE + 1 rejected/superseded, or
#      sequential serialization — never 2 ACTIVE for the same commit)
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: c12-partition-mgmt-build
  namespace: loop-runtime-system
  annotations:
    runtime.getloopscale.com/scenario: "c12"
    runtime.getloopscale.com/invariant: "withEnvironmentLock: no duplicate ACTIVE per commit_sha under mgmt<->build partition"
    runtime.getloopscale.com/ec: "EC-6 — scoped partition [loop-runtime-system, argo-system], NEVER unscoped/all"
spec:
  action: partition
  mode: all
  selector:
    # EC-6 absorption — scoped blast radius (explicit namespaces, NOT all).
    namespaces:
      - loop-runtime-system
      - argo-system
    labelSelectors:
      app: loop-runtime-api
  direction: both
  target:
    mode: all
    selector:
      namespaces:
        - argo-system
      labelSelectors:
        app: argo-server
  duration: "180s"
