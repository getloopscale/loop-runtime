# Chaos Experiment: Gitea unavailable
#
# Roadmap 08: Gitea unavailable → builds fail fast with clear error,
# no silent data loss.
#
# Hypothesis: when Gitea is unreachable, source uploads and gitops
# pushes fail immediately with typed LoopZeroError (not goroutine hangs),
# the API returns actionable 5xx errors to the CLI, and NO partial
# state is written to PG.
#
# Steady-state SLO:
#   - No builds stuck in READY state longer than 5 min (ReleaseReadyTimeout)
#   - All failures have a typed error code, not "Something went wrong"
#   - PG remains writable (no deadlock on the environment lock)
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: gitea-outage
  namespace: loopzero-system
  annotations:
    loopzero.io/roadmap: "08"
    loopzero.io/hypothesis: "Gitea outage = fast-fail builds, typed errors, no stuck state, no deadlocks"
    # SLO: loopzero-api scrape still alive post-outage AND release backlog
    # under control. Canonical metric names per 2026-06-24 audit
    # (post-decomposition rename): loopzero_api_requests_total (was
    # loopzero_http_requests_total), loopzero_releases_pending (was
    # loopzero_releases_ready_over_timeout — reaper now emits queue depth
    # directly). Steady-state: ≥ 1 loopzero_api_requests_total series AND
    # release queue ≤ 5. `and on()` joins heterogeneous vectors;
    # `or vector(...)` defaults when metrics scrape lag.
    loopzero.io/slo-query: |
      ((count(loopzero_api_requests_total) or vector(0)) > 0) and on() ((sum(loopzero_releases_pending) or vector(0)) <= 5)
spec:
  action: partition
  mode: all
  selector:
    namespaces:
      - loopzero-system
    labelSelectors:
      "app": "loopzero-api"
  direction: to
  target:
    mode: all
    selector:
      namespaces:
        - loopzero-system
      labelSelectors:
        "app.kubernetes.io/name": "gitea"
  duration: "120s"
