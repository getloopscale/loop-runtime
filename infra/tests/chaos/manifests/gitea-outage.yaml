# Chaos Experiment: Gitea unavailable
#
# Roadmap 08: Gitea unavailable → builds fail fast with clear error,
# no silent data loss.
#
# Hypothesis: when Gitea is unreachable, source uploads and gitops
# pushes fail immediately with typed LoopZeroError (not goroutine hangs),
# the API returns actionable 5xx errors to the CLI, and NO partial
# state is written to PG.
#
# Steady-state SLO:
#   - No builds stuck in READY state longer than 5 min (ReleaseReadyTimeout)
#   - All failures have a typed error code, not "Something went wrong"
#   - PG remains writable (no deadlock on the environment lock)
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: gitea-outage
  namespace: loopzero-system
  annotations:
    loopzero.io/roadmap: "08"
    loopzero.io/hypothesis: "Gitea outage = fast-fail builds, typed errors, no stuck state, no deadlocks"
    loopzero.io/slo-query: |
      # SLO: loopzero-api scrape still alive post-outage AND release backlog under control.
      # Canonical metric names per 2026-06-24 audit (post-decomposition rename):
      #   - loopzero_api_requests_total (was loopzero_http_requests_total pre-decomposition)
      #   - loopzero_releases_pending (was loopzero_releases_ready_over_timeout — release reaper
      #     now emits the queue-depth gauge directly; over-timeout was a derived view).
      # Steady-state: at least one loopzero_api_requests_total series scraped at probe time
      # (proves Prometheus + loopzero-api liveness AFTER the chaos window) AND release queue
      # ≤ 5 (proves the reaper kept up — no stuck-in-PENDING runaway).
      (count(loopzero_api_requests_total) > 0) and (sum(loopzero_releases_pending) <= 5)
spec:
  action: partition
  mode: all
  selector:
    namespaces:
      - loopzero-system
    labelSelectors:
      "app": "loopzero-api"
  direction: to
  target:
    mode: all
    selector:
      namespaces:
        - loopzero-system
      labelSelectors:
        "app.kubernetes.io/name": "gitea"
  duration: "120s"
