# Chaos Experiment: kill loop-runtime-controller pod
#
# Roadmap 02 DoD: TestController_CrashRecovery
#
# Hypothesis: killing the controller pod does NOT lose in-flight builds.
# The leader_generations table preserves the generation counter, so the
# next controller start bumps the generation and picks up where the
# dead one left off. Running builds continue on the build cluster
# (Argo Workflows are independent of the controller) and the new
# controller's reconcile loop detects them on its first tick.
#
# Steady-state SLO (enforced by Prometheus rule):
#   - loop_runtime_build_reconcile_loop_last_success seconds-since < 60
#   - loop_runtime_leader_status{name="loop-runtime-controller"} == 1 within 30s of kill
#   - NO build transitions from RUNNING to FAILED during the window
#
# Experiment window: 120s. The controller is killed every 60s twice
# so we observe recovery + re-recovery.
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: kill-loop-runtime-controller
  namespace: loop-runtime-system
  annotations:
    runtime.getloopscale.com/roadmap: "02"
    runtime.getloopscale.com/dod-test: "TestController_CrashRecovery"
    runtime.getloopscale.com/hypothesis: "Controller kill does not lose in-flight builds; new leader resumes within 30s"
    # SLO query post-decomposition (2026-06-29). Legacy
    # loop_runtime_leader_status{name="loop-runtime-controller"} +
    # loop_runtime_builds_total{reason="controller_crash"} were monolith-only;
    # post-split we use kube-state-metrics restart signal + loop_runtime_api
    # leader health proxy. `and on()` joins heterogeneous vectors;
    # `or vector(0)` defaults the LHS when restart series is briefly
    # empty post-cleanup; `max_over_time` absorbs Service-DNS scrape
    # rotation across the 2 loop-runtime-api pods.
    runtime.getloopscale.com/slo-query: |
      ((sum(increase(kube_pod_container_status_restarts_total{pod=~"loop-runtime-tenant-operator-.*"}[2m])) or vector(0)) == 0) and on() (max_over_time(loop_runtime_api_leader_status[2m]) == 1)
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - loop-runtime-system
    labelSelectors:
      # ADR-0023 / plan v1.1 T1.5: legacy `app: loop-runtime-controller` label
      # gone with the monolith deletion. Targets the tenant-operator
      # (heaviest of the 4 split binaries: handles Tenant + Environment
      # reconcile + ArgoCD sync + Gitea push). Same crash-recovery
      # semantics — leader_generations preserves the counter; restart
      # re-acquires lease + resumes pending work.
      # FIX 2026-05-14: label is `app: tenant-operator` (verified LIVE
      # against pod label set), NOT `app.kubernetes.io/name`.
      "app": "tenant-operator"
  # FIX 2026-05-14: chaos-mesh 2.7.0 removed `spec.scheduler` (use
  # separate Schedule resource for repeated chaos). Single-shot kill;
  # re-run /chaos-test --scenario C02 multiple times to observe
  # repeated recovery.
  duration: "30s"
