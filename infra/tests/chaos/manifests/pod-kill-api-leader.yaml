# Chaos Experiment: kill loop-runtime-api leader pod
#
# Roadmap 01 D/F: non-leader pod must survive leader kill and take
# over without being killed by its own liveness probe during election.
#
# Historical bug: leader election took 60s, liveness probe killed pods
# at 45s → infinite restart loop. The fix was to start the HTTP server
# BEFORE leader election so /healthz is always 200 from t=0.
#
# Hypothesis: killing the leader results in election by the survivor
# within 90s. Neither pod restarts. Health endpoint never returns 5xx.
#
# Steady-state SLO:
#   - /api/v1/health returns 200 during the entire experiment
#   - pod restart count does NOT increase for loop-runtime-api pods
#   - new leader's loop_runtime_leader_status=1 within 90s
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: kill-loop-runtime-api-leader
  namespace: loop-runtime-system
  annotations:
    runtime.getloopscale.com/roadmap: "01"
    runtime.getloopscale.com/dod-test: "Non-leader pod restart count = 0 during 30 min"
    runtime.getloopscale.com/hypothesis: "Killing leader pod elects new leader within 90s; surviving pod never restarts"
    # No pod restarts during the experiment window AND API health stays
    # 200. `and on()` is the canonical join across heterogeneous vectors
    # (pod metric vs blackbox probe instance label set differ); without
    # the explicit `on()` modifier the implicit set-intersection returns
    # empty even when both conditions hold.
    runtime.getloopscale.com/slo-query: |
      ((sum(increase(kube_pod_container_status_restarts_total{pod=~"loop-runtime-api-.*"}[5m])) or vector(0)) == 0) and on() (max(probe_success{job="loop-runtime-api-health"}) == 1)
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - loop-runtime-system
    labelSelectors:
      "app": "loop-runtime-api"
  duration: "30s"
