# Chaos Experiment: random tenant pod kill (T1.2 of chaos plan / §3.B.2)
#
# Per ADR D6 of original chaos-mesh-experiments-plan (superseded by
# active-execution-plan): kills 30% of pods in any namespace matching
# `loopruntime-tn-*` (tenant namespaces). Validates that:
#   1. KEDA scale-to-zero correctly re-scales after partial outage
#   2. Argo Rollouts canary state survives mid-deploy pod kill
#   3. Tenant SLO isolation (one tenant's outage doesn't affect peers)
#
# Mode `fixed-percent` with value `30` = bounded blast radius. 100% kill
# would overwhelm k3d capacity; 30% gives meaningful chaos without
# self-DoS. Duration 60s = enough for K8s to observe + react via
# controller managers.
#
# Hypothesis:
#   - All killed pods restart within 90s of chaos end
#   - No HTTP 5xx from peer tenants during the 60s window
#   - Argo Rollouts in canary state do NOT regress to Stable
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: random-tenant-pod-kill
  namespace: chaos-mesh
  annotations:
    runtime.getloopscale.com/plan: active-execution-plan
    runtime.getloopscale.com/section: "3.B.2"
    runtime.getloopscale.com/hypothesis: "30% tenant pod kill — peers unaffected, killed pods recover <90s"
    runtime.getloopscale.com/dod-test: "TestChaos_RandomTenantPodKill"
    runtime.getloopscale.com/slo-query: |
      # No 5xx from peer tenants during chaos window
      sum(rate(loopruntime_http_requests_total{
        namespace=~"loopruntime-tn-.*",
        code=~"5.."
      }[1m])) == 0
spec:
  action: pod-kill
  mode: fixed-percent
  value: "30"
  selector:
    # FIX 2026-05-14: tenant namespaces follow `loopruntime-${TENANT_SLUG}-${ENV}`
    # pattern per CLAUDE.md Multi-Cell section. Previous `loopruntime-tn-acme` +
    # `loopruntime-tn-e2etest` didn't match deployed namespaces (e.g.,
    # `loopruntime-tn-e2etest-production`). Enumerate active tenant ns OR add
    # new ns when seeding tenants for chaos suite.
    namespaces:
      - loopruntime-tn-e2etest-production
      - loopruntime-e2e-tenant-production
    # FIX 2026-05-14: label is `app.kubernetes.io/managed-by` (standard
    # K8s recommended label per labels.go), not `runtime.getloopscale.com/managed-by`.
    labelSelectors:
      "app.kubernetes.io/managed-by": "loopruntime"
  # PodChaos with action=pod-kill is instantaneous — duration governs
  # the observation window for the chaos controller (no re-kill).
  duration: "60s"
