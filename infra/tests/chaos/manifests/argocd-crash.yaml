# Chaos Experiment: crash ArgoCD server
#
# Roadmap 08: Cell ArgoCD crash — blast radius containment.
#
# Hypothesis: when one cell's ArgoCD crashes, tenants in other cells
# (or in the same cell's existing Applications) continue operating.
# The loopzero-api falls back to the circuit breaker pattern: new syncs
# return ErrDeployServiceAuthFailed (503) or ErrPlatformDegraded, but
# existing Applications continue running on the workload cluster
# because ArgoCD is a reconciliation layer, not a data path.
#
# Steady-state SLO:
#   - Workload pods in the runtime cluster continue Running
#   - Other cells' loopzero_deploy_success_total continues incrementing
#   - Circuit breaker records the degradation (metric increments)
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: argocd-crash
  namespace: loopzero-system
  annotations:
    loopzero.io/roadmap: "08"
    loopzero.io/hypothesis: "ArgoCD crash does not affect running workloads; breaker records degradation"
    loopzero.io/slo-query: |
      # Circuit breaker fired AND recovered
      max_over_time(loopzero_deploy_circuit_breaker_state[3m]) > 0
      and
      # Runtime pods stayed Running (no pod restart burst)
      increase(kube_pod_container_status_restarts_total{namespace=~"loopzero-.*"}[3m]) == 0
spec:
  action: pod-failure
  mode: all
  selector:
    namespaces:
      - loopzero-system
    labelSelectors:
      "app.kubernetes.io/name": "argocd-server"
  duration: "90s"
