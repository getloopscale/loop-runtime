# T1.3 of plan 2026-05-27-tenant-build-pipeline-gaps-closure.
# Per ADR-2026-05-27-T2.2-OFFLINE-TUF § Engineering deliverables #6.
#
# Chaos scenario: kill Fulcio pod during active build to validate
# graceful failure of build pipeline.
#
# Hypothesis (MANDATORY per /chaos-test SKILL): Fulcio unreachable
# during build SHOULD fail CLEANLY (typed error CHAIN_BROKEN) NOT
# silent unsigned push.
#
# Prerequisite (v1.1 EC-NEW-3 fix): Sigstore stack must be deployed
# AND Fulcio pods must be Running. Otherwise this manifest selects
# zero pods → false-positive PASS.
#
# Operator runs via /chaos-test --scenario cosign-fulcio-kill (manual)
# OR /chaos-test --full (after Sigstore active).
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: cosign-fulcio-kill
  namespace: chaos-mesh
  labels:
    runtime.getloopscale.com/chaos-class: pod
    runtime.getloopscale.com/component: sigstore
    runtime.getloopscale.com/plan: tenant-build-pipeline-gaps-closure
  annotations:
    # Mandatory chaos-test SKILL annotations
    runtime.getloopscale.com/hypothesis: |
      Killing Fulcio pod during active build causes cosign-sign step to fail
      CLEANLY with typed error CHAIN_BROKEN. Build Workflow exits non-zero,
      API marks build FAILED, NO image pushed to DOCR (silent unsigned push
      would be a security regression).
    runtime.getloopscale.com/slo-query: |
      sum(rate(loopruntime_cosign_sign_failure_total{reason="fulcio_unreachable"}[1m])) > 0
    runtime.getloopscale.com/dod-test: |
      During chaos window: at least 1 build attempts cosign-sign + fails
      cleanly. No unsigned image appears in DOCR (verify via:
      cosign verify --certificate-identity ... registry/image:tag → fails).
      Pre-chaos baseline: 0 sign failures in last 5min.
      Post-chaos: Fulcio pod re-scheduled, sign failures stop within 2min.
    # v1.1 EC-NEW-3: chaos-test SKILL pre-flight skips this scenario if
    # prerequisite not satisfied. Without this, manifest runs against empty
    # selector → "0 pods affected" → false-positive PASS (no signal).
    runtime.getloopscale.com/prerequisite: "sigstore-active"
    runtime.getloopscale.com/prerequisite-check: |
      kubectl get pods -n sigstore-system -l app.kubernetes.io/name=fulcio \
        --field-selector=status.phase=Running --no-headers | wc -l
      # Expected: > 0 (Fulcio Running). If 0, skip with explicit log.
spec:
  action: pod-kill
  mode: one  # Kill 1 pod at a time (PDB minAvailable=1 protects against accidental all-kill)
  selector:
    namespaces:
      - sigstore-system
    labelSelectors:
      # Match Helm chart standard label (sigstore/fulcio helm chart sets
      # app.kubernetes.io/name=fulcio per K8s recommended labels). Earlier
      # `app: fulcio` was wrong assumption — discovered LIVE 2026-05-27 chaos
      # iter 1 with "Failed to select targets: no pod is selected" warning.
      app.kubernetes.io/name: fulcio
  # Single iteration; chaos-test SKILL re-runs as needed for soak.
  duration: "30s"
