name: loopzero-drill
runtime: nodejs
description: >
  LoopZero DR drill stack — SEPARATE from production per MEET-2026-05-12 D9 +
  EC-NEW-5. Provisions a quarterly disaster-recovery validation cluster on
  *.drill.getloopscale.com (separate CF Zone) + dedicated DO project + isolated
  Pulumi state at s3://loopzero-drill-pulumi-state.

  This stack MUST NOT share credentials with production:
    - CF API token scoped only to drill.getloopscale.com
    - DO API token scoped only to loopzero-drill project
    - Pulumi state backend bucket separate

  Lifecycle: provisioned + destroyed quarterly by the operator on-demand via
  infra/scripts/drill/dr-drill.sh (the GitHub reconstruction-drill cron was removed
  2026-05-23 — re-home to the real CI if quarterly automation is wanted).

template:
  description: LoopZero DR drill — quarterly disaster recovery validation
