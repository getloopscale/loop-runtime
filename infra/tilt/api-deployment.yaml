apiVersion: v1
kind: ServiceAccount
metadata:
  name: loopzero-api
  namespace: loopzero-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loopzero-api
rules:
  # --- Tenant CRs: create/update via EnsureTenant (triggered during loopzero init) ---
  - apiGroups: ["loopzero.io"]
    resources: ["tenants"]
    verbs: ["get", "create", "update"]
  # --- LoopZeroApplication CRs: BuildReconcileLoop.ensureApplicationCRs after each release ---
  # AUDIT-38: RBAC was missing — reconcile loop logged "forbidden" for every build
  # and release stuck in SYNC_FAILED until operator-side fallback intervened.
  - apiGroups: ["loopzero.io"]
    resources: ["loopzeroapplications"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loopzero-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loopzero-api
subjects:
  - kind: ServiceAccount
    name: loopzero-api
    namespace: loopzero-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loopzero-api
  namespace: loopzero-system
  labels:
    app: loopzero-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loopzero-api
  template:
    metadata:
      labels:
        app: loopzero-api
        loopzero.io/component: control-plane
    spec:
      serviceAccountName: loopzero-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: loopzero-api
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              value: "postgres://loopzero:loopzero-dev-password@postgresql.loopzero-system.svc.cluster.local:5432/loopzero?sslmode=disable"
            - name: LOOPZERO_ARGO_CALLBACK_SECRET
              value: "dev-callback-secret"
            - name: LOG_LEVEL
              value: "debug"
            # Phase 0.1 (scale-50k-plan): When loopzero-controller is deployed
            # alongside, set this to "true" so the API serves HTTP only.
            # The controller binary owns all background loops.
            - name: LOOPZERO_DISABLE_LEGACY_LOOPS
              value: "false"
            # W1: MinIO (real source store)
            - name: MINIO_ENDPOINT
              value: "http://minio.loopzero-system.svc.cluster.local:9000"
            # Cross-cluster MinIO endpoint (for Argo Workflow cache pods in build cluster)
            # Uses mgmt LB NodePort. Update after cluster recreate:
            #   docker inspect k3d-loopzero-mgmt-serverlb --format '{{json .NetworkSettings.Networks}}'
            - name: MINIO_CROSS_CLUSTER_ENDPOINT
              value: "http://172.18.0.3:32000"
            - name: MINIO_ACCESS_KEY
              value: "loopzero-admin"
            - name: MINIO_SECRET_KEY
              value: "loopzero-dev-password"
            # Gitea — uses NodePort for cross-cluster access (build cluster needs to reach it)
            - name: GITEA_URL
              value: "http://gitea-http.loopzero-system.svc.cluster.local:3000"
            # Cross-cluster Gitea URL (for Argo Workflow parameters — build cluster → mgmt Gitea)
            # IP = mgmt LB on k3d-loopzero-build network. Update after cluster recreate:
            #   docker inspect k3d-loopzero-mgmt-serverlb --format '{{json .NetworkSettings.Networks}}'
            - name: GITEA_CROSS_CLUSTER_URL
              value: "http://172.18.0.3:30000"
            # Cross-cluster API URL (for Argo Workflow callback — build cluster → mgmt API)
            - name: API_CROSS_CLUSTER_URL
              value: "http://172.18.0.3:30001"
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: loopzero-api-tokens
                  key: gitea-token
                  optional: true
            # W4: ArgoCD (real sync client)
            - name: ARGOCD_URL
              value: "http://argocd-server.argocd.svc.cluster.local:80"
            - name: ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: loopzero-api-tokens
                  key: argocd-token
                  optional: true
            # W2: Build cluster (real workflow submitter)
            - name: BUILD_KUBECONFIG
              value: "/etc/loopzero/build-kubeconfig"
            - name: BUILD_KUBE_CONTEXT
              value: "build"
            - name: REGISTRY_URL
              value: "k3d-loopzero-registry:5000"
            # BuildKit insecure flags are conditional on this.
            # Set to "true" for dev (k3d registry has no TLS).
            # Config.Validate() enforces "false" in production.
            - name: REGISTRY_INSECURE
              value: "true"
            # Override loopzero-packs-runner image for local dev (k3d registry).
            # Production uses the pinned image from constants.go.
            - name: LOOPZERO_PACKS_IMAGE
              value: "k3d-loopzero-registry:5000/loopzero-packs-runner:latest"
            # Workload cluster ingress — Traefik LoadBalancer on k3d-loopzero-workload.
            # Uses the Docker IP of k3d-loopzero-workload-serverlb directly because
            # host.k3d.internal does not resolve from within mgmt cluster pods.
            # The LB exposes port 80 (Traefik HTTP entrypoint).
            # Workload LB IP on k3d-loopzero-workload network. Update after cluster recreate:
            #   docker inspect k3d-loopzero-workload-serverlb --format '{{json .NetworkSettings.Networks}}'
            - name: WORKLOAD_INGRESS_URL
              value: "http://172.18.0.12:80"
            - name: BASE_DOMAIN
              value: "loopzero.local"
            # CHG-2026-04-22-001 B4 — JWKS wiring for local dev (Rule 10 parity).
            # Engine is RSA-only (MEET-039 B3). Without these, no JWT validates
            # and `loopzero login` → 401 across the board. Hydra runs in loopzero-system
            # and exposes both URLs; consumed by api/cmd/setup_auth.go.
            - name: JWKS_URL
              value: "http://ory-hydra-public.loopzero-system.svc.cluster.local:4444/.well-known/jwks.json"
            # JWT_ISSUER must match exactly the `iss` claim Hydra stamps into tokens.
            # Local Hydra is configured with `urls.self.issuer=http://localhost:4444/`
            # (see infra/helm/ory-hydra/values.yaml) so the API must validate against
            # that exact string. JWKS is fetched in-cluster (correct URL above).
            - name: JWT_ISSUER
              value: "http://localhost:4444/"
            # B14 (MEET-2026-04-23-058): cert-manager ClusterIssuer for TLS Certificates.
            # Dev uses loopzero-ca-issuer (self-signed CA, already provisioned on workload cluster).
            # Prod sets letsencrypt-prod via Pulumi mgmt-api.ts ConfigMap.
            - name: LOOPZERO_CLUSTER_ISSUER
              value: "loopzero-ca-issuer"
          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: build-kubeconfig
              mountPath: /etc/loopzero
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: build-kubeconfig
          configMap:
            name: loopzero-build-kubeconfig
            items:
              - key: config
                path: build-kubeconfig
---
apiVersion: v1
kind: Service
metadata:
  name: loopzero-api
  namespace: loopzero-system
  labels:
    app: loopzero-api
spec:
  type: NodePort
  selector:
    app: loopzero-api
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001
      protocol: TCP
      name: http
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
