apiVersion: v1
kind: ServiceAccount
metadata:
  name: loopzero-api
  namespace: loopzero-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loopzero-api
rules:
- apiGroups:
  - loopzero.io
  resources:
  - tenants
  verbs:
  - get
  - create
  - update
- apiGroups:
  - loopzero.io
  resources:
  - loopzeroapplications
  verbs:
  - get
  - create
  - update
  - patch
- apiGroups:
  - loopzero.io
  resources:
  - clustercredentials
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - loopzero.io
  resources:
  - environments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - loopzero.io
  resources:
  - previewenvironments
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - loopzero.io
  resources:
  - previewenvironments/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loopzero-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loopzero-api
subjects:
- kind: ServiceAccount
  name: loopzero-api
  namespace: loopzero-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loopzero-api
  namespace: loopzero-system
  labels:
    app: loopzero-api
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loopzero-api
  template:
    metadata:
      labels:
        app: loopzero-api
        loopzero.io/component: control-plane
      annotations:
        checksum/config: tilt-managed-placeholder-T1.1.c
    spec:
      serviceAccountName: loopzero-api
      # T8.4 of deep-review-remediation-plan (closes find_infra_006 MEDIUM):
      # Tilt deployment now matches Helm chart security posture by setting
      # seccompProfile: RuntimeDefault at pod level (was missing — Tilt had
      # weaker PSA than the published chart). Enforces "Local equals
      # production" per CLAUDE.md Rule 10.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: loopzero-api
        env:
        - name: GITEA_TOKEN
          valueFrom:
            secretKeyRef:
              name: loopzero-api-tokens
              key: gitea-token
              optional: true
        - name: ARGOCD_TOKEN
          valueFrom:
            secretKeyRef:
              name: loopzero-api-tokens
              key: argocd-token
              optional: true
        - name: GITHUB_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: loopzero-github-webhook
              key: value
              optional: true
        - name: GITHUB_APP_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: loopzero-api-github
              key: GITHUB_APP_PRIVATE_KEY
              optional: true
        # Canonical FAANG 2026-06-16: mirror the chart's
        # OPENBAO_SPKI_PIN_SHA256 binding (the secrets.keyRefs entry of
        # charts/loopzero-api/values-bootstrap.yaml). Closes
        # the Tilt-owned-vs-chart drift (per memory
        # feedback_tilt_owned_deployment_yaml_drift). Without this env
        # var, api/internal/config/config.go:429 reads empty SPKI pin,
        # loopzero-api falls back to standard CA verification, fails with
        # "x509: certificate signed by unknown authority" on every
        # OpenBao AppRole login → secret POST returns 500.
        - name: OPENBAO_SPKI_PIN_SHA256
          valueFrom:
            secretKeyRef:
              name: openbao-spki-pin
              key: OPENBAO_SPKI_PIN_SHA256
              optional: true
        # Paths into the kubeconfig mounts declared below, so they live beside them.
        - name: BUILD_KUBECONFIG
          value: /etc/loopzero/build-kubeconfig
        - name: CELL_0_KUBECONFIG
          value: /etc/loopzero/runtime/kubeconfig
        envFrom:
        - secretRef:
            name: loopzero-openbao-approle
            optional: true
        - secretRef:
            name: loopzero-broker-token
            optional: true
        # ConfigMap and Secret `loopzero-api`, rendered by the Tiltfile from charts/loopzero-api
        # with infra/tilt/loopzero-api-values.yaml.
        - configMapRef:
            name: loopzero-api
        - secretRef:
            name: loopzero-api
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: build-kubeconfig
          mountPath: /etc/loopzero
          readOnly: true
        - name: runtime-kubeconfig
          mountPath: /etc/loopzero/runtime
          readOnly: true
        - name: tmp
          mountPath: /tmp
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
      - name: build-kubeconfig
        configMap:
          name: loopzero-build-kubeconfig
          items:
          - key: config
            path: build-kubeconfig
      - name: runtime-kubeconfig
        secret:
          secretName: loopzero-cluster-kubeconfigs
          items:
          - key: cell-0.kubeconfig
            path: kubeconfig
---
apiVersion: v1
kind: Service
metadata:
  name: loopzero-api
  namespace: loopzero-system
  labels:
    app: loopzero-api
spec:
  type: NodePort
  selector:
    app: loopzero-api
  ports:
  - port: 3001
    targetPort: 3001
    nodePort: 30001
    protocol: TCP
    name: http
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
