apiVersion: apps/v1
kind: Deployment
metadata:
  name: loopzero-api
  namespace: loopzero-system
  labels:
    app: loopzero-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loopzero-api
  template:
    metadata:
      labels:
        app: loopzero-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: loopzero-api
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              value: "postgres://loopzero:loopzero-dev-password@postgresql.loopzero-system.svc.cluster.local:5432/loopzero?sslmode=disable"
            - name: LOOPZERO_ARGO_CALLBACK_SECRET
              value: "dev-callback-secret"
            - name: LOG_LEVEL
              value: "debug"
          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: loopzero-api
  namespace: loopzero-system
  labels:
    app: loopzero-api
spec:
  selector:
    app: loopzero-api
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
      name: http
