# Preview Operator — manages PreviewEnvironment CRD lifecycle
# Split from monolithic operator-deployment.yaml for independent scaling and faster dev loops.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preview-operator
  namespace: loopzero-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: preview-operator
rules:
  # --- LoopZero CRDs: PreviewEnvironment lifecycle ---
  - apiGroups: ["loopzero.io"]
    resources: ["previewenvironments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["loopzero.io"]
    resources: ["previewenvironments/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["loopzero.io"]
    resources: ["previewenvironments/finalizers"]
    verbs: ["update"]

  # --- Namespaces: create/delete preview namespaces ---
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]

  # --- ResourceQuotas + LimitRanges: enforce preview resource limits ---
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update"]

  # --- NetworkPolicies: preview namespace isolation ---
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]

  # --- Events: emit Kubernetes events for observability ---
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]

  # --- Leader election: coordination lease ---
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: preview-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: preview-operator
subjects:
  - kind: ServiceAccount
    name: preview-operator
    namespace: loopzero-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-operator
  namespace: loopzero-system
  labels:
    app: preview-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preview-operator
  template:
    metadata:
      labels:
        app: preview-operator
    spec:
      serviceAccountName: preview-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: operator
          image: loopzero-preview-operator
          args:
            - "--leader-elect=false"
            - "--health-probe-bind-address=:8081"
            - "--metrics-bind-address=:8080"
          env:
            - name: RUNTIME_KUBECONFIG
              value: "/etc/loopzero/runtime-kubeconfig"
            - name: BASE_DOMAIN
              value: "loopzero.local"
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
            - containerPort: 8080
              name: metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: "200m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "32Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: runtime-kubeconfig
              mountPath: /etc/loopzero/runtime-kubeconfig
              subPath: runtime-kubeconfig
              readOnly: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: runtime-kubeconfig
          configMap:
            name: loopzero-runtime-kubeconfig
            items:
              - key: config
                path: runtime-kubeconfig
