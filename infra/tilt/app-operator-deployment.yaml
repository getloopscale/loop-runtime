# App Operator — manages LoopRuntimeApplication and ExposedRoute CRDs
# Split from monolithic operator-deployment.yaml for independent scaling and faster dev loops.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-operator
  namespace: loop-runtime-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: app-operator
rules:
  # --- LoopRuntime CRDs: LoopRuntimeApplication + ExposedRoute lifecycle ---
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["loopruntimeapplications", "exposedroutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["loopruntimeapplications/status", "exposedroutes/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["loopruntimeapplications/finalizers", "exposedroutes/finalizers"]
    verbs: ["update"]

  # --- Tenant CR: read-only for fast-path Healthy resolution
  # (dogfood-2026-05-08-fixes T4.2 — ApplicationReconciler reads tenant.Spec.CellID)
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["tenants"]
    verbs: ["get", "list", "watch"]

  # --- ClusterCredential CR: read-only for cell-aware runtime client factory
  # (dogfood-2026-05-08-fixes T4.2 — CellAwareRuntimeClientFactory.For
  # lists ClusterCredentials by spec.cellID)
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["clustercredentials"]
    verbs: ["get", "list", "watch"]

  # --- Secrets: NOT here — Role app-operator-secrets-loop-runtime-system below.
  # Mirrors charts/loop-runtime-app-operator/templates/role-secret-access.yaml.

  # --- Services: read-only for routing validation ---
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]

  # --- Ingresses: manage routing for exposed routes ---
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]

  # --- Events: emit Kubernetes events for observability ---
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]

  # --- Leader election: coordination lease ---
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: app-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: app-operator
subjects:
  - kind: ServiceAccount
    name: app-operator
    namespace: loop-runtime-system
---
# Secret read in loop-runtime-system only: cell kubeconfigs. The operator's Secret
# cache watches this namespace alone.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-operator-secrets-loop-runtime-system
  namespace: loop-runtime-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-operator-secrets-loop-runtime-system
  namespace: loop-runtime-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-operator-secrets-loop-runtime-system
subjects:
  - kind: ServiceAccount
    name: app-operator
    namespace: loop-runtime-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-operator
  namespace: loop-runtime-system
  labels:
    app: app-operator
    app.kubernetes.io/component: loop-runtime-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-operator
      app.kubernetes.io/component: loop-runtime-operator
  template:
    metadata:
      labels:
        app: app-operator
        app.kubernetes.io/component: loop-runtime-operator
    spec:
      serviceAccountName: app-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: operator
          image: loop-runtime-app-operator
          args:
            - "--leader-elect=false"
            - "--health-probe-bind-address=:8081"
            - "--metrics-bind-address=:8080"
          env:
            - name: BASE_DOMAIN
              value: "loop-runtime.local"
            # dogfood-2026-05-08-fixes T4.2 (F-6, ADR D6 + EC-5):
            # ApplicationController fast-path Healthy needs a cell-0-cluster
            # client (cell-aware via CellAwareRuntimeClientFactory). Mount the
            # runtime kubeconfig from loop-runtime-cluster-kubeconfigs Secret (same
            # mount as tenant-operator + loop-runtime-api). Without CELL_0_KUBECONFIG
            # the controller falls back to legacy mode (Application phase
            # only converges via ExposedRoute Reachable).
            - name: CELL_0_KUBECONFIG
              value: "/etc/loop-runtime/runtime/kubeconfig"
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
            - containerPort: 8080
              name: metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: "200m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "32Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # dogfood-2026-05-08-fixes T4.2: mount runtime kubeconfig
            - name: runtime-kubeconfig
              mountPath: /etc/loop-runtime/runtime
              readOnly: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: runtime-kubeconfig
          secret:
            secretName: loop-runtime-cluster-kubeconfigs
            items:
              - key: cell-0.kubeconfig
                path: kubeconfig
            optional: true
