apiVersion: apps/v1
kind: Deployment
metadata:
  name: loopzero-cloud
  namespace: loopzero-system
  labels:
    app: loopzero-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loopzero-cloud
  template:
    metadata:
      labels:
        app: loopzero-cloud
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: cloud
          image: k3d-loopzero-registry:5000/loopzero-cloud:latest
          imagePullPolicy: Always
          env:
            - name: CLOUD_LISTEN_ADDR
              value: ":13002"
            - name: KRATOS_PUBLIC_URL
              value: "http://ory-kratos-public.loopzero-system.svc.cluster.local:80"
            - name: KRATOS_ADMIN_URL
              value: "http://ory-kratos-admin.loopzero-system.svc.cluster.local:80"
            - name: HYDRA_PUBLIC_URL
              value: "http://ory-hydra-public.loopzero-system.svc.cluster.local:4444"
            - name: HYDRA_ADMIN_URL
              value: "http://ory-hydra-admin.loopzero-system.svc.cluster.local:4445"
            - name: HYDRA_CLIENT_ID
              value: "loopzero-cli"
            - name: ENGINE_API_URL
              value: "http://loopzero-api.loopzero-system.svc.cluster.local:3001"
            - name: LOOPZERO_ENV
              value: "dev"
          ports:
            - containerPort: 13002
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 13002
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 13002
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: "300m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: loopzero-cloud
  namespace: loopzero-system
  labels:
    app: loopzero-cloud
spec:
  type: NodePort
  selector:
    app: loopzero-cloud
  ports:
    - port: 13002
      targetPort: 13002
      nodePort: 30012
      protocol: TCP
      name: http
