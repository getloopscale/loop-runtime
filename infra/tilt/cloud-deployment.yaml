apiVersion: apps/v1
kind: Deployment
metadata:
  name: loopzero-cloud
  namespace: loopzero-system
  labels:
    app: loopzero-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loopzero-cloud
  template:
    metadata:
      labels:
        app: loopzero-cloud
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: cloud
          image: k3d-loopzero-registry:5000/loopzero-cloud:latest
          imagePullPolicy: Always
          env:
            - name: CLOUD_LISTEN_ADDR
              value: ":13002"
            # FIX 2026-06-07: Ory services live in loopzero-auth ns (per helmfile),
            # not loopzero-system. URLs corrected so cmd can reach Hydra/Kratos.
            - name: KRATOS_PUBLIC_URL
              value: "http://ory-kratos-public.loopzero-auth.svc.cluster.local:80"
            - name: KRATOS_ADMIN_URL
              value: "http://ory-kratos-admin.loopzero-auth.svc.cluster.local:80"
            - name: HYDRA_PUBLIC_URL
              value: "http://ory-hydra-public.loopzero-auth.svc.cluster.local:4444"
            - name: HYDRA_ADMIN_URL
              value: "http://ory-hydra-admin.loopzero-auth.svc.cluster.local:4445"
            # NEW 2026-06-07: Memory section proxy target.
            # Host TheMemory native process at 0.0.0.0:8080 (bound to all interfaces).
            # From inside k3d pod, reach host via docker bridge 10.0.5.1.
            - name: THEMORY_BASE_URL
              value: "http://10.0.5.1:8080"
            - name: THEMORY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: themory-dev-key
                  key: api-key
            # Plan dashboard-memory-bff-server-side-key-vault v1.2 § T3.1.
            # BFF-minted loopzero_live_* keys expire after this window. Range [1, 168].
            - name: LOOPZEROCLOUD_BFF_KEY_TTL_HOURS
              value: "24"
            - name: HYDRA_CLIENT_ID
              value: "loopzero-cli"
            - name: ENGINE_API_URL
              value: "http://loopzero-api.loopzero-system.svc.cluster.local:3001"
            - name: LOOPZERO_ENV
              # Sprint A T2.1 EC-4 (2026-06-01): canonicalized "dev" → "development"
              # to align with config.Validate() allowlist {development, staging,
              # production}. Out-of-allowlist values now fail-fast at startup.
              value: "development"
          ports:
            - containerPort: 13002
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 13002
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 13002
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: "300m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: loopzero-cloud
  namespace: loopzero-system
  labels:
    app: loopzero-cloud
spec:
  type: NodePort
  selector:
    app: loopzero-cloud
  ports:
    - port: 13002
      targetPort: 13002
      nodePort: 30012
      protocol: TCP
      name: http
