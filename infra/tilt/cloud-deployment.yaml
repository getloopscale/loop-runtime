apiVersion: apps/v1
kind: Deployment
metadata:
  name: loop-console
  namespace: loop-runtime-system
  labels:
    app: loop-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loop-console
  template:
    metadata:
      labels:
        app: loop-console
      annotations:
        checksum/config: tilt-managed-placeholder-T1.1.c
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: cloud
        image: loop-console
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 13002
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 13002
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 13002
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 300m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        envFrom:
        - configMapRef:
            name: loop-console-runtime-config
        - secretRef:
            name: loop-console-runtime-secret
---
apiVersion: v1
kind: Service
metadata:
  name: loop-console
  namespace: loop-runtime-system
  labels:
    app: loop-console
spec:
  type: NodePort
  selector:
    app: loop-console
  ports:
  - port: 13002
    targetPort: 13002
    nodePort: 30012
    protocol: TCP
    name: http
