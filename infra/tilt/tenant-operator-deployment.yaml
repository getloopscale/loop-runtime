# Tenant Operator — manages Tenant, Environment, ClusterCredential CRDs
# Split from monolithic operator-deployment.yaml for independent scaling and faster dev loops.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-operator
  namespace: loopruntime-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-operator
rules:
  # --- LoopRuntime CRDs: Tenant + Environment + PreviewEnvironment lifecycle ---
  #
  # J-23 LIVE catch 2026-06-07, sponsor mandate (English: "close everything —
  # make the whole chain work visually"), verbatim:
  # "Fechar tudo — fazer chain inteira funcionar visual"  # english-only: verbatim sponsor quote, kept as evidence
  # tenant_gitops.go now lists PreviewEnvironment
  # CRs of the tenant to emit ArgoCD App + AppProject destinations for active
  # previews. Without `list` on previewenvironments, the operator silently
  # falls back to nil and no preview App is created (build runs but never
  # syncs to workload cluster → no live URL). Mirrored in charts/loopruntime-
  # tenant-operator/templates/clusterrole.yaml for prod helm path.
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["tenants", "environments", "previewenvironments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["tenants/status", "environments/status", "previewenvironments/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["tenants/finalizers", "environments/finalizers", "previewenvironments/finalizers"]
    verbs: ["update"]

  # --- ClusterCredentials: list/watch for cell-aware reconcile ---
  # Plan 2026-05-15 T1.2 (close-all-gaps Phase 1): tenant-operator needs
  # to resolve RuntimeFactory.For(cellID) which lists ClusterCredentials
  # to find the matching cell's kubeconfig Secret. Without this RBAC the
  # operator logs "clustercredentials.runtime.getloopscale.com is forbidden" and cell
  # migration silently stalls — namespace never created in destination cell.
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["clustercredentials"]
    verbs: ["get", "list", "watch"]

  # --- Namespaces: create/manage tenant namespaces ---
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]

  # --- ResourceQuotas + LimitRanges: enforce tenant resource limits ---
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update"]

  # --- RBAC: create Roles/RoleBindings in tenant namespaces ---
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update"]

  # --- ServiceAccounts: create in tenant namespaces ---
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create"]

  # --- NetworkPolicies: tenant network isolation ---
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]

  # --- Secrets: NOT here — Role tenant-operator-secrets-loopruntime-system below.
  # Mirrors charts/loopruntime-tenant-operator/templates/role-secret-access.yaml.

  # --- PriorityClasses: tenant workload priorities ---
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch", "create", "update"]

  # --- Workload resources: required for RBAC escalation prevention ---
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch"]

  # --- ArgoCD: create/manage Applications and AppProjects ---
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "appprojects"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # --- Pods: needed for log streaming and status checks ---
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]

  # --- Events: emit Kubernetes events for observability ---
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]

  # --- Leader election: coordination lease ---
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenant-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant-operator
subjects:
  - kind: ServiceAccount
    name: tenant-operator
    namespace: loopruntime-system
---
# Secret read in loopruntime-system only: cell kubeconfigs and the registry pull
# Secret. The operator's Secret cache watches this namespace alone.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-operator-secrets-loopruntime-system
  namespace: loopruntime-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-operator-secrets-loopruntime-system
  namespace: loopruntime-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-operator-secrets-loopruntime-system
subjects:
  - kind: ServiceAccount
    name: tenant-operator
    namespace: loopruntime-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-operator
  namespace: loopruntime-system
  labels:
    app: tenant-operator
    app.kubernetes.io/component: loopruntime-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenant-operator
      app.kubernetes.io/component: loopruntime-operator
  template:
    metadata:
      labels:
        app: tenant-operator
        app.kubernetes.io/component: loopruntime-operator
    spec:
      serviceAccountName: tenant-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: operator
          image: loopruntime-tenant-operator
          args:
            - "--leader-elect=false"
            - "--health-probe-bind-address=:8081"
            - "--metrics-bind-address=:8080"
          env:
            - name: GITEA_URL
              value: "http://gitea-http.loopruntime-system.svc.cluster.local:3000"
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: loopruntime-api-tokens
                  key: gitea-token
            - name: ARGOCD_NAMESPACE
              value: "argocd"
            - name: BUILD_KUBECONFIG
              value: "/etc/loopruntime/build-kubeconfig"
            - name: CELL_0_KUBECONFIG
              value: "/etc/loopruntime/runtime-kubeconfig"
            - name: BASE_DOMAIN
              value: "loopruntime.local"
            - name: WORKLOAD_CLUSTER_URL
              value: "https://k3d-loopruntime-cell-0-server-0:6443"
            - name: OPERATOR_INSECURE_SKIP_TLS
              value: "true"
            - name: INGRESS_NAMESPACE
              value: "traefik"
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
            - containerPort: 8080
              name: metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: build-kubeconfig
              mountPath: /etc/loopruntime/build-kubeconfig
              subPath: build-kubeconfig
              readOnly: true
            - name: runtime-kubeconfig
              mountPath: /etc/loopruntime/runtime-kubeconfig
              subPath: runtime-kubeconfig
              readOnly: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: build-kubeconfig
          configMap:
            name: loopruntime-build-kubeconfig
            items:
              - key: config
                path: build-kubeconfig
        - name: runtime-kubeconfig
          configMap:
            name: loopruntime-cell-0-kubeconfig
            items:
              - key: config
                path: runtime-kubeconfig
