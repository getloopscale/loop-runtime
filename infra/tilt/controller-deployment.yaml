# Controller Deployment — Phase 0.5 of scale-50k-plan
#
# This is the dedicated controller binary that owns all background
# reconciliation loops (build reconcile, release convergence, reapers,
# event pruning, idempotency cleanup). The API binary runs with
# LOOP_RUNTIME_DISABLE_LEGACY_LOOPS=true and serves only HTTP.
#
# Leader election is via PG generation fencing (api/internal/leader),
# not K8s Lease objects.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loop-runtime-controller
  namespace: loop-runtime-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loop-runtime-controller
rules:
  # Tenant CRs: read for status checks
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["tenants", "tenants/status"]
    verbs: ["get", "list", "watch"]
  # ClusterCredentials for DynamicRouter/cell discovery
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["clustercredentials"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loop-runtime-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loop-runtime-controller
subjects:
  - kind: ServiceAccount
    name: loop-runtime-controller
    namespace: loop-runtime-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loop-runtime-controller
  namespace: loop-runtime-system
  labels:
    app: loop-runtime-controller
    runtime.getloopscale.com/component: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loop-runtime-controller
  template:
    metadata:
      labels:
        app: loop-runtime-controller
        runtime.getloopscale.com/component: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: loop-runtime-controller
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: controller
          image: loop-runtime-api
          command: ["/loop-runtime-controller"]
          args:
            - "-health-port=9091"
          env:
            - name: DATABASE_URL
              value: "postgres://loop_runtime:loop-runtime-dev-password@postgresql.loop-runtime-system.svc.cluster.local:5432/loop_runtime?sslmode=disable"
            - name: LOG_LEVEL
              value: "debug"
            # MinIO for source operations
            - name: MINIO_ENDPOINT
              value: "http://minio.loop-runtime-system.svc.cluster.local:9000"
            - name: MINIO_CROSS_CLUSTER_ENDPOINT
              value: "http://172.18.0.3:32000"
            - name: MINIO_ACCESS_KEY
              value: "loop-runtime-admin"
            - name: MINIO_SECRET_KEY
              value: "loop-runtime-dev-password"
            # Gitea for gitops operations
            - name: GITEA_URL
              value: "http://gitea-http.loop-runtime-system.svc.cluster.local:3000"
            - name: GITEA_CROSS_CLUSTER_URL
              value: "http://172.18.0.3:30000"
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: loop-runtime-api-tokens
                  key: gitea-token
                  optional: true
            # ArgoCD for sync operations
            - name: ARGOCD_URL
              value: "http://argocd-server.argocd.svc.cluster.local:80"
            - name: ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: loop-runtime-api-tokens
                  key: argocd-token
                  optional: true
            # Build cluster for Argo Workflows
            - name: BUILD_KUBECONFIG
              value: "/etc/loop-runtime/build-kubeconfig"
            - name: BUILD_KUBE_CONTEXT
              value: "build"
            - name: REGISTRY_URL
              value: "k3d-loop-runtime-registry:5000"
            - name: REGISTRY_INSECURE
              value: "true"
            # Workload cluster
            - name: WORKLOAD_INGRESS_URL
              value: "http://172.18.0.14:80"
            - name: BASE_DOMAIN
              value: "loop-runtime.local"
            # PG claims for cross-replica dedup
            - name: LOOP_RUNTIME_USE_PG_CLAIMS
              value: "true"
            # Pod name for claim holder identity
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 9091
              name: health
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: build-kubeconfig
              mountPath: /etc/loop-runtime
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: build-kubeconfig
          configMap:
            name: loop-runtime-build-kubeconfig
            items:
              - key: config
                path: build-kubeconfig
---
# ServiceMonitor for Prometheus scraping (if prometheus-operator is installed)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loop-runtime-controller
  namespace: loop-runtime-system
  labels:
    app: loop-runtime-controller
spec:
  selector:
    matchLabels:
      app: loop-runtime-controller
  endpoints:
    - port: health
      path: /metrics
      interval: 15s
---
apiVersion: v1
kind: Service
metadata:
  name: loop-runtime-controller
  namespace: loop-runtime-system
  labels:
    app: loop-runtime-controller
spec:
  type: ClusterIP
  selector:
    app: loop-runtime-controller
  ports:
    - port: 9091
      targetPort: 9091
      protocol: TCP
      name: health
