# Platform Operator — manages ClusterCredential, GitRepositoryBinding, PlatformBootstrap CRDs
# Split from monolithic operator-deployment.yaml for independent scaling and faster dev loops.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-operator
  namespace: loop-runtime-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-operator
rules:
  # --- LoopRuntime CRDs: ClusterCredential, GitRepositoryBinding, PlatformBootstrap lifecycle ---
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["clustercredentials", "gitrepositorybindings", "platformbootstraps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["clustercredentials/status", "gitrepositorybindings/status", "platformbootstraps/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["runtime.getloopscale.com"]
    resources: ["clustercredentials/finalizers", "gitrepositorybindings/finalizers", "platformbootstraps/finalizers"]
    verbs: ["update"]

  # --- Secrets: NOT here — Roles platform-operator-secrets-loop-runtime-system and
  # platform-operator-secrets-argocd below. Mirrors
  # charts/loop-runtime-platform-operator/templates/role-{loop-runtime-system,argocd}.yaml.

  # --- Events: emit Kubernetes events for observability ---
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]

  # --- Leader election: coordination lease ---
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-operator
subjects:
  - kind: ServiceAccount
    name: platform-operator
    namespace: loop-runtime-system
---
# Secret access in loop-runtime-system: kubeconfigs, Gitea admin Secret,
# platform-tokens, Git credentials. Delete only on platform-tokens.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-operator-secrets-loop-runtime-system
  namespace: loop-runtime-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["platform-tokens"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-operator-secrets-loop-runtime-system
  namespace: loop-runtime-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-operator-secrets-loop-runtime-system
subjects:
  - kind: ServiceAccount
    name: platform-operator
    namespace: loop-runtime-system
---
# Secret access in the ArgoCD namespace: the cluster, repository and
# repo-creds Secrets the operator writes, and the ArgoCD admin Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-operator-secrets-argocd
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-operator-secrets-argocd
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-operator-secrets-argocd
subjects:
  - kind: ServiceAccount
    name: platform-operator
    namespace: loop-runtime-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-operator
  namespace: loop-runtime-system
  labels:
    app: platform-operator
    app.kubernetes.io/component: loop-runtime-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-operator
      app.kubernetes.io/component: loop-runtime-operator
  template:
    metadata:
      labels:
        app: platform-operator
        app.kubernetes.io/component: loop-runtime-operator
    spec:
      serviceAccountName: platform-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: operator
          image: loop-runtime-platform-operator
          args:
            - "--leader-elect=false"
            - "--health-probe-bind-address=:8081"
            - "--metrics-bind-address=:8080"
          env:
            - name: ARGOCD_NAMESPACE
              value: "argocd"
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
            - containerPort: 8080
              name: metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: "200m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "32Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
