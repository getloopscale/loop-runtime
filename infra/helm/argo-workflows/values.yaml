controller:
  securityContext:
    runAsNonRoot: true
  # Parallelism limits to prevent scheduler pressure under high concurrency.
  # workflowWorkers: max concurrent workflow reconciliations.
  # podWorkers: max concurrent pod reconciliations.
  # These prevent 100 simultaneous builds from overwhelming the build cluster.
  workflowWorkers: 32
  podWorkers: 32
  livenessProbe:
    httpGet:
      path: /healthz
      port: 6060
    initialDelaySeconds: 30
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /healthz
      port: 6060
    initialDelaySeconds: 10
    periodSeconds: 15
  resources:
    limits:
      cpu: "500m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  metricsConfig:
    enabled: true
    port: 9090
    path: /metrics

# Workflow execution ServiceAccount and RBAC.
# The WorkflowTemplate (loopzero-build-nodejs-v1) specifies serviceAccountName: loopzero-build-sa.
# This SA is created by Helm with RBAC for workflow task results.
# The controller creates pods using its own ClusterRole — the workflow SA just needs to exist
# and have workflowtaskresults permissions so step pods can report back.
workflow:
  serviceAccount:
    create: true
    name: loopzero-build-sa
  rbac:
    create: true

# Kaniko image builder configuration.
# IMPORTANT: Set insecure=false and skipTlsVerify=false in production overlays.
# These flags disable TLS verification for the container registry and are
# only appropriate for local development with k3d registries.
kaniko:
  insecure: true       # DEV ONLY — allows HTTP registry (no TLS)
  skipTlsVerify: true  # DEV ONLY — skips TLS certificate validation

# MinIO object storage configuration.
# Used by clone step (source bundles) and cache steps (dependency cache).
# IMPORTANT: Set insecure=false in production overlays. This flag disables
# TLS verification for the MinIO endpoint and is only appropriate for local
# development with k3d (MinIO without TLS).
#
# BLOCKER-1 fix: Gitea section removed. Source code is now fetched from MinIO
# (where the CLI uploads it) instead of cloning from Gitea cross-cluster.
# Gitea is only used for GitOps manifests (ArgoCD watches it).
minio:
  insecure: true   # DEV ONLY — allows HTTP MinIO (no TLS)

server:
  securityContext:
    runAsNonRoot: true
  livenessProbe:
    httpGet:
      path: /
      port: 2746
    initialDelaySeconds: 10
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /
      port: 2746
    initialDelaySeconds: 10
    periodSeconds: 20
  resources:
    limits:
      cpu: "200m"
      memory: "128Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"
  service:
    type: NodePort
    nodePort: 30081
