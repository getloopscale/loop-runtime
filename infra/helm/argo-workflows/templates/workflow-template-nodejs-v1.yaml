apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: loopzero-build-nodejs-v1
  labels:
    app.kubernetes.io/name: loopzero-build
    app.kubernetes.io/component: build-pipeline
    app.kubernetes.io/part-of: loopzero
spec:
  entrypoint: build-pipeline
  onExit: finalize
  serviceAccountName: loopzero-build-sa
  arguments:
    parameters:
      - name: tenant-id
        description: "Tenant identifier for isolation"
      - name: project-id
        description: "Project identifier"
      - name: environment
        description: "Target environment (e.g., production, staging)"
      - name: commit-sha
        description: "Git commit SHA to build"
      - name: apps
        description: "JSON array of app specs to build"
        value: "[]"
      - name: build-id
        description: "Unique build identifier"
      - name: api-callback-url
        description: "API endpoint for build completion callback"
      - name: callback-secret
        description: "Bearer token for callback authentication"
      - name: gitea-url
        description: "Gitea server URL for source and GitOps repos"
      - name: gitea-token
        description: "Ephemeral Gitea token scoped to tenant repos"
      - name: minio-endpoint
        description: "MinIO S3-compatible endpoint for cache and artifacts"
      - name: minio-access-key
        description: "MinIO access key scoped to tenant prefix"
      - name: minio-secret-key
        description: "MinIO secret key scoped to tenant prefix"
      - name: correlation-id
        description: "Correlation ID for end-to-end request tracing"
      - name: registry-url
        description: "Container registry URL for image push"
  templates:
    # =========================================================================
    # Entrypoint: DAG-based build pipeline
    # =========================================================================
    - name: build-pipeline
      dag:
        tasks:
          # -- Step 1: setup --------------------------------------------------
          - name: clone-repo
            template: clone-repo
          - name: restore-cache
            template: restore-cache
            dependencies:
              - clone-repo

          # -- Step 1.5: validate workspace (fail-fast) -------------------------
          - name: validate-workspace
            template: validate-workspace
            dependencies:
              - clone-repo

          # -- Step 2: parallel-1 (after setup) -------------------------------
          - name: security-scan
            template: security-scan
            dependencies:
              - restore-cache
          - name: install-deps
            template: install-deps
            dependencies:
              - restore-cache
              - validate-workspace

          # -- Step 3: build (after install-deps) -----------------------------
          - name: build-apps
            template: build-apps
            dependencies:
              - install-deps

          # -- Step 3.5: generate Dockerfile if missing -------------------------
          - name: generate-dockerfile
            template: generate-dockerfile
            dependencies:
              - build-apps

          # -- Step 4: publish (after build) ----------------------------------
          - name: build-image
            template: build-image
            dependencies:
              - generate-dockerfile

          # -- Step 5: release (after publish) --------------------------------
          - name: generate-manifests
            template: generate-manifests
            dependencies:
              - build-image
          - name: validate-manifests
            template: validate-manifests
            continueOn:
              failed: true
            dependencies:
              - generate-manifests
          - name: gitops-push
            template: gitops-push
            dependencies:
              - generate-manifests

    # =========================================================================
    # Step 1: clone-repo
    # =========================================================================
    - name: clone-repo
      container:
        image: alpine/git:2.43.0
        command:
          - sh
          - -c
          - |
            set -euo pipefail
            REPO_URL="{{workflow.parameters.gitea-url}}/loopzero/loopzero-source-{{workflow.parameters.tenant-id}}-{{workflow.parameters.project-id}}.git"
            CLONE_URL=$(echo "$REPO_URL" | sed "s|://|://oauth2:{{workflow.parameters.gitea-token}}@|")
            git clone --depth 1 "$CLONE_URL" /workspace
            cd /workspace
            echo "Cloned from Gitea source repo"
            ls -la
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000

    # =========================================================================
    # Step 1: restore-cache
    # =========================================================================
    - name: restore-cache
      container:
        image: amazon/aws-cli:2.15.17
        command:
          - sh
          - -c
          - |
            set -euo pipefail
            CACHE_KEY="{{workflow.parameters.tenant-id}}/{{workflow.parameters.project-id}}/node-modules"
            CACHE_PATH="s3://loopzero-builds/{{workflow.parameters.tenant-id}}/cache/deps/${CACHE_KEY}.tar.gz"

            export AWS_ACCESS_KEY_ID="{{workflow.parameters.minio-access-key}}"
            export AWS_SECRET_ACCESS_KEY="{{workflow.parameters.minio-secret-key}}"

            aws s3 cp "$CACHE_PATH" /tmp/cache.tar.gz \
              --endpoint-url "{{workflow.parameters.minio-endpoint}}" \
              --no-sign-request=false 2>/dev/null || {
              echo "Cache miss — no cached dependencies found"
              exit 0
            }

            cd /workspace
            tar xzf /tmp/cache.tar.gz 2>/dev/null || echo "Cache extraction failed — treating as miss"
            echo "Cache restored from ${CACHE_KEY}"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
      # Cache restore is best-effort — failure should not block the build
      activeDeadlineSeconds: 120

    # =========================================================================
    # Step 2: security-scan (allow failure for v1 — warning only)
    # =========================================================================
    - name: security-scan
      container:
        image: node:20.11.1-alpine
        command:
          - sh
          - -c
          - |
            set -uo pipefail
            cd /workspace
            if [ -f package-lock.json ]; then
              npm audit --audit-level=high 2>&1 || {
                echo "WARNING: npm audit found high-severity vulnerabilities"
                echo "This is a warning only for v1 — build continues"
              }
            else
              echo "No package-lock.json found — skipping npm audit"
            fi
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
      # Security scan is non-blocking for v1
      activeDeadlineSeconds: 300

    # =========================================================================
    # Step 1.5: validate-workspace (fail-fast on missing prerequisites)
    # =========================================================================
    - name: validate-workspace
      container:
        image: alpine:3.19.1
        command:
          - sh
          - -c
          - |
            set -euo pipefail
            cd /workspace

            echo "Validating workspace..."

            # Check package.json exists
            if [ ! -f package.json ]; then
              echo "ERROR: No package.json found in repository root."
              echo "Ensure your project has a package.json at the root level."
              exit 1
            fi

            # Check lockfile exists (prevents 3x retry waste in install-deps)
            if [ ! -f package-lock.json ] && [ ! -f yarn.lock ] && [ ! -f pnpm-lock.yaml ]; then
              echo "ERROR: No lockfile found (package-lock.json, yarn.lock, or pnpm-lock.yaml)."
              echo "Run 'npm install' locally and commit the lockfile before deploying."
              exit 1
            fi

            echo "Workspace validation passed"
            echo "  package.json: OK"
            for f in package-lock.json yarn.lock pnpm-lock.yaml; do [ -f "$f" ] && echo "  $f: OK"; done
            true
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000

    # =========================================================================
    # Step 2: install-deps
    # =========================================================================
    - name: install-deps
      retryStrategy:
        limit: "3"
        retryPolicy: "OnFailure"
        backoff:
          duration: "5s"
          factor: "2"
          maxDuration: "60s"
      container:
        image: node:20.11.1-alpine
        command:
          - sh
          - -c
          - |
            set -euo pipefail
            cd /workspace

            # Detect package manager by lockfile
            if [ -f pnpm-lock.yaml ]; then
              corepack enable
              pnpm install --frozen-lockfile
            elif [ -f yarn.lock ]; then
              corepack enable
              yarn install --frozen-lockfile
            elif [ -f package-lock.json ]; then
              npm ci
            else
              echo "ERROR: No lockfile found (package-lock.json, yarn.lock, or pnpm-lock.yaml)"
              exit 1
            fi
            echo "Dependencies installed successfully"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000

    # =========================================================================
    # Step 3: build-apps
    # =========================================================================
    - name: build-apps
      container:
        image: node:20.11.1-alpine
        command:
          - sh
          - -c
          - |
            set -euo pipefail
            cd /workspace

            APPS='{{workflow.parameters.apps}}'

            if [ "$APPS" = "[]" ] || [ -z "$APPS" ]; then
              echo "No specific apps — running default build"
              npm run build --if-present
            else
              echo "Building apps: $APPS"
              npm run build --if-present
            fi
            echo "Build completed successfully"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000

    # =========================================================================
    # Step 3.5: generate-dockerfile (if user didn't provide one)
    # =========================================================================
    - name: generate-dockerfile
      container:
        image: node:20.11.1-alpine
        command:
          - sh
          - -c
          - |
            set -euo pipefail
            cd /workspace

            # Respect user-provided Dockerfile
            if [ -f Dockerfile ]; then
              echo "User-provided Dockerfile found — skipping generation"
              cat Dockerfile
              exit 0
            fi

            echo "No Dockerfile found — generating for Node.js"

            # Extract port from apps JSON parameter (default: 3000)
            APPS='{{workflow.parameters.apps}}'
            PORT=3000
            if command -v node >/dev/null 2>&1 && [ "$APPS" != "[]" ] && [ -n "$APPS" ]; then
              DETECTED_PORT=$(node -e "
                try {
                  const apps = JSON.parse(process.argv[1]);
                  const app = apps.find(a => a.port) || {};
                  if (app.port) console.log(app.port);
                } catch(e) {}
              " "$APPS" 2>/dev/null) || true
              if [ -n "$DETECTED_PORT" ]; then
                PORT="$DETECTED_PORT"
              fi
            fi

            echo "Generating Dockerfile with PORT=$PORT"

            cat > Dockerfile << DEOF
            FROM node:20-alpine
            WORKDIR /app
            COPY . .
            RUN npm ci --omit=dev 2>/dev/null || npm install --production
            EXPOSE ${PORT}
            CMD ["npm", "start"]
            DEOF

            # Remove leading whitespace from heredoc
            sed -i 's/^            //' Dockerfile

            echo "Generated Dockerfile:"
            cat Dockerfile
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000

    # =========================================================================
    # Step 4: build-image (Kaniko)
    # =========================================================================
    - name: build-image
      retryStrategy:
        limit: "3"
        retryPolicy: "OnFailure"
        backoff:
          duration: "5s"
          factor: "2"
          maxDuration: "60s"
      container:
        image: gcr.io/kaniko-project/executor:v1.23.2
        command:
          - /kaniko/executor
        args:
          - --dockerfile=/workspace/Dockerfile
          - --context=/workspace
          - --destination={{workflow.parameters.registry-url}}/{{workflow.parameters.tenant-id}}/{{workflow.parameters.project-id}}:{{workflow.parameters.commit-sha}}
          - --cache=true
          - --cache-repo={{workflow.parameters.registry-url}}/{{workflow.parameters.tenant-id}}/cache
          - --snapshot-mode=redo
          - --compressed-caching=false
          - --insecure
          - --skip-tls-verify
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        # Kaniko requires root to build container images
        securityContext:
          runAsNonRoot: false
          runAsUser: 0

    # =========================================================================
    # Step 5: generate-manifests (multi-app monorepo support)
    # =========================================================================
    - name: generate-manifests
      container:
        image: node:20.11.1-alpine
        command:
          - sh
          - -c
          - |
            set -euo pipefail

            export MANIFEST_DIR="/manifests/{{workflow.parameters.tenant-id}}/{{workflow.parameters.project-id}}/{{workflow.parameters.environment}}"
            mkdir -p "$MANIFEST_DIR"

            export IMAGE="{{workflow.parameters.registry-url}}/{{workflow.parameters.tenant-id}}/{{workflow.parameters.project-id}}:{{workflow.parameters.commit-sha}}"
            export TENANT="{{workflow.parameters.tenant-id}}"
            export PROJECT="{{workflow.parameters.project-id}}"
            export ENV="{{workflow.parameters.environment}}"
            export BUILD="{{workflow.parameters.build-id}}"
            export NS="${TENANT}-${ENV}"
            export APPS_JSON='{{workflow.parameters.apps}}'

            node -e "
            const fs = require('fs');
            const apps = JSON.parse(process.env.APPS_JSON || '[]');
            const image = process.env.IMAGE;
            const tenant = process.env.TENANT;
            const project = process.env.PROJECT;
            const env = process.env.ENV;
            const build = process.env.BUILD;
            const ns = process.env.NS;
            const manifestDir = process.env.MANIFEST_DIR;

            // If no apps specified, fall back to single-app mode
            const appList = apps.length > 0 ? apps : [{name: project, type: 'server', port: 3000, path: '.'}];
            // Always use per-app hostname format. This ensures consistency between
            // full deploys and --app partial deploys. A single-app deploy of "api"
            // must generate the same hostname as a full deploy that includes "api".
            const hasExplicitApps = apps.length > 0;
            let manifests = '';
            const callbackApps = [];

            for (const app of appList) {
              const appName = app.name;
              const appType = app.type || 'server';
              const appPort = app.port || 3000;
              const appPath = app.path || (hasExplicitApps ? 'apps/' + appName : '.');
              // Always use per-app hostname: {app}-{project}.{tenant}.loopzero.local
              // This ensures --app deploys generate the same URL as full deploys.
              const host = hasExplicitApps
                ? appName + '-' + project + '.' + tenant + '.loopzero.local'
                : project + '.' + tenant + '.loopzero.local';

              // Command: for explicit apps, cd into app dir and npm start; for single app, npm start
              const cmd = hasExplicitApps
                ? 'cd ' + appPath + ' && npm start'
                : 'npm start';

              // Deployment (always)
              manifests += 'apiVersion: apps/v1\n';
              manifests += 'kind: Deployment\n';
              manifests += 'metadata:\n';
              manifests += '  name: ' + appName + '\n';
              manifests += '  namespace: ' + ns + '\n';
              manifests += '  labels:\n';
              manifests += '    app: ' + appName + '\n';
              manifests += '    loopzero.io/tenant: ' + tenant + '\n';
              manifests += '    loopzero.io/project: ' + project + '\n';
              manifests += '    loopzero.io/environment: ' + env + '\n';
              manifests += '    loopzero.io/build-id: ' + build + '\n';
              manifests += 'spec:\n';
              manifests += '  replicas: 1\n';
              manifests += '  selector:\n';
              manifests += '    matchLabels:\n';
              manifests += '      app: ' + appName + '\n';
              manifests += '  template:\n';
              manifests += '    metadata:\n';
              manifests += '      labels:\n';
              manifests += '        app: ' + appName + '\n';
              manifests += '    spec:\n';
              manifests += '      containers:\n';
              manifests += '        - name: app\n';
              manifests += '          image: ' + image + '\n';
              manifests += '          command: [\"sh\", \"-c\", \"' + cmd + '\"]\n';
              if (appType !== 'worker') {
                manifests += '          ports:\n';
                manifests += '            - containerPort: ' + appPort + '\n';
              }
              manifests += '          env:\n';
              manifests += '            - name: PORT\n';
              manifests += '              value: \"' + appPort + '\"\n';
              manifests += '            - name: NODE_ENV\n';
              manifests += '              value: production\n';
              manifests += '---\n';

              // Service + IngressRoute only for server/frontend (not worker)
              if (appType !== 'worker') {
                manifests += 'apiVersion: v1\n';
                manifests += 'kind: Service\n';
                manifests += 'metadata:\n';
                manifests += '  name: ' + appName + '\n';
                manifests += '  namespace: ' + ns + '\n';
                manifests += 'spec:\n';
                manifests += '  selector:\n';
                manifests += '    app: ' + appName + '\n';
                manifests += '  ports:\n';
                manifests += '    - port: 80\n';
                manifests += '      targetPort: ' + appPort + '\n';
                manifests += '---\n';

                manifests += 'apiVersion: traefik.io/v1alpha1\n';
                manifests += 'kind: IngressRoute\n';
                manifests += 'metadata:\n';
                manifests += '  name: ' + appName + '\n';
                manifests += '  namespace: ' + ns + '\n';
                manifests += '  labels:\n';
                manifests += '    app: ' + appName + '\n';
                manifests += '    loopzero.io/tenant: ' + tenant + '\n';
                manifests += '    loopzero.io/environment: ' + env + '\n';
                manifests += 'spec:\n';
                manifests += '  entryPoints:\n';
                manifests += '    - web\n';
                manifests += '  routes:\n';
                manifests += '    - match: Host(\x60' + host + '\x60)\n';
                manifests += '      kind: Rule\n';
                manifests += '      services:\n';
                manifests += '        - name: ' + appName + '\n';
                manifests += '          port: 80\n';
                manifests += '---\n';

                callbackApps.push({name: appName, type: appType, url: 'http://' + host});
              } else {
                callbackApps.push({name: appName, type: appType, url: ''});
              }
            }

            fs.writeFileSync(manifestDir + '/manifests.yaml', manifests);
            fs.writeFileSync('/manifests/callback-apps.json', JSON.stringify(callbackApps));
            console.log('Generated manifests for ' + appList.length + ' app(s)');
            console.log(manifests);
            "
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: manifests
            mountPath: /manifests
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000

    # =========================================================================
    # Step 5: validate-manifests
    # =========================================================================
    - name: validate-manifests
      container:
        image: alpine:3.21
        command:
          - sh
          - -c
          - |
            set -euo pipefail
            apk add --no-cache curl >/dev/null 2>&1
            curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin/
            MANIFEST_DIR="/manifests/{{workflow.parameters.tenant-id}}/{{workflow.parameters.project-id}}/{{workflow.parameters.environment}}"
            kubeconform --strict --summary "$MANIFEST_DIR/manifests.yaml"
            echo "Manifest validation passed"
        volumeMounts:
          - name: manifests
            mountPath: /manifests
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "128Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000

    # =========================================================================
    # Step 5: gitops-push (atomic commit to Gitea GitOps repo)
    # =========================================================================
    - name: gitops-push
      retryStrategy:
        limit: "3"
        retryPolicy: "OnFailure"
        backoff:
          duration: "5s"
          factor: "2"
          maxDuration: "60s"
      container:
        image: alpine/git:2.43.0
        command:
          - sh
          - -c
          - |
            set -euo pipefail

            GITOPS_REPO="{{workflow.parameters.gitea-url}}/loopzero/loopzero-tenant-{{workflow.parameters.tenant-id}}.git"
            CLONE_URL=$(echo "$GITOPS_REPO" | sed "s|://|://oauth2:{{workflow.parameters.gitea-token}}@|")
            ENV_PATH="{{workflow.parameters.project-id}}/{{workflow.parameters.environment}}"

            git clone --depth 5 "$CLONE_URL" /tmp/gitops
            cd /tmp/gitops

            git config user.email "loopzero-build@loopzero.io"
            git config user.name "LoopZero Build"

            # Copy generated manifests
            MANIFEST_SRC="/manifests/{{workflow.parameters.tenant-id}}/{{workflow.parameters.project-id}}/{{workflow.parameters.environment}}"
            mkdir -p "$ENV_PATH"
            cp "$MANIFEST_SRC/manifests.yaml" "$ENV_PATH/"

            git add "$ENV_PATH/"

            # Commit with mandatory Git trailers (spec 17.5)
            git commit -m "Deploy {{workflow.parameters.project-id}} to {{workflow.parameters.environment}}

            Release-ID: {{workflow.parameters.build-id}}
            Correlation-ID: {{workflow.parameters.correlation-id}}
            Build-ID: {{workflow.parameters.build-id}}" || {
              echo "No changes to commit"
              exit 0
            }

            # Push with fetch-merge-push on non-fast-forward (spec 7.4)
            ATTEMPT=0
            MAX_ATTEMPTS=3
            while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
              if git push origin HEAD; then
                echo "GitOps push succeeded"
                exit 0
              fi
              ATTEMPT=$((ATTEMPT + 1))
              echo "Push attempt $ATTEMPT failed — fetching and rebasing"
              git fetch origin
              git rebase origin/main || git rebase origin/master || true
            done

            echo "ERROR: GitOps push failed after $MAX_ATTEMPTS attempts"
            exit 1
        volumeMounts:
          - name: manifests
            mountPath: /manifests
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000

    # =========================================================================
    # onExit: finalize (ALWAYS runs — even on failure)
    # =========================================================================
    - name: finalize
      dag:
        tasks:
          - name: save-cache
            template: save-cache
          - name: emit-summary
            template: emit-summary
          - name: notify-api
            template: notify-api

    # =========================================================================
    # Finalize: save-cache
    # =========================================================================
    - name: save-cache
      container:
        image: amazon/aws-cli:2.15.17
        command:
          - sh
          - -c
          - |
            set -uo pipefail
            cd /workspace 2>/dev/null || { echo "No workspace — skipping cache save"; exit 0; }

            CACHE_KEY="{{workflow.parameters.tenant-id}}/{{workflow.parameters.project-id}}/node-modules"
            CACHE_PATH="s3://loopzero-builds/{{workflow.parameters.tenant-id}}/cache/deps/${CACHE_KEY}.tar.gz"

            export AWS_ACCESS_KEY_ID="{{workflow.parameters.minio-access-key}}"
            export AWS_SECRET_ACCESS_KEY="{{workflow.parameters.minio-secret-key}}"

            if [ -d node_modules ]; then
              tar czf /tmp/cache.tar.gz node_modules/
              aws s3 cp /tmp/cache.tar.gz "$CACHE_PATH" \
                --endpoint-url "{{workflow.parameters.minio-endpoint}}" \
                --no-sign-request=false 2>/dev/null || echo "Cache save failed — non-fatal"
              echo "Cache saved to ${CACHE_KEY}"
            else
              echo "No node_modules to cache"
            fi
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000

    # =========================================================================
    # Finalize: emit-summary
    # =========================================================================
    - name: emit-summary
      container:
        image: alpine:3.19.1
        command:
          - sh
          - -c
          - |
            echo "============================================"
            echo "  Build Summary"
            echo "============================================"
            echo "  Tenant:      {{workflow.parameters.tenant-id}}"
            echo "  Project:     {{workflow.parameters.project-id}}"
            echo "  Environment: {{workflow.parameters.environment}}"
            echo "  Commit:      {{workflow.parameters.commit-sha}}"
            echo "  Build ID:    {{workflow.parameters.build-id}}"
            echo "  Status:      {{workflow.status}}"
            echo "============================================"
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000

    # =========================================================================
    # Finalize: notify-api (DA-15 callback — retry 3x with backoff)
    # =========================================================================
    - name: notify-api
      retryStrategy:
        limit: "3"
        retryPolicy: "Always"
        backoff:
          duration: "5s"
          factor: "2"
          maxDuration: "60s"
      container:
        image: curlimages/curl:8.6.0
        command:
          - sh
          - -c
          - |
            set -euo pipefail

            if [ "{{workflow.status}}" = "Succeeded" ]; then
              BUILD_STATUS="succeeded"
            else
              BUILD_STATUS="failed"
            fi

            CALLBACK_URL="{{workflow.parameters.api-callback-url}}/{{workflow.parameters.build-id}}/callback"
            IMAGE="{{workflow.parameters.registry-url}}/{{workflow.parameters.tenant-id}}/{{workflow.parameters.project-id}}:{{workflow.parameters.commit-sha}}"

            # Build per-app callback payload from generate-manifests output
            if [ "$BUILD_STATUS" = "succeeded" ] && [ -f /manifests/callback-apps.json ]; then
              # Read per-app data and add image_digest to each
              CALLBACK_APPS=$(cat /manifests/callback-apps.json)
              # Use sed to inject image_digest into each app object
              APPS_WITH_IMAGE=$(printf '%s' "$CALLBACK_APPS" | sed "s|\"name\"|\"image_digest\":\"${IMAGE}\",\"name\"|g")
              BODY="{\"status\":\"${BUILD_STATUS}\",\"apps\":${APPS_WITH_IMAGE}}"
            elif [ "$BUILD_STATUS" = "failed" ]; then
              # Include error details from workflow failures.
              # IMPORTANT: {{workflow.failures}} expands to a JSON array with nested quotes.
              # We extract only displayName+message to avoid nested JSON breaking the callback payload.
              FAILED_MSG="Build pipeline failed"
              FAILURES='{{workflow.failures}}'
              if [ -n "$FAILURES" ] && [ "$FAILURES" != "<no value>" ] && [ "$FAILURES" != "null" ] && [ "$FAILURES" != "[]" ]; then
                STEP_NAME=$(printf '%s' "$FAILURES" | grep -o '"displayName":"[^"]*"' | head -1 | cut -d'"' -f4) || true
                STEP_MSG=$(printf '%s' "$FAILURES" | grep -o '"message":"[^"]*"' | head -1 | cut -d'"' -f4) || true
                if [ -n "$STEP_NAME" ]; then
                  FAILED_MSG="${STEP_NAME}: ${STEP_MSG:-failed}"
                fi
                # Do NOT dump raw $FAILURES into the error message — it contains nested JSON
                # that breaks the callback payload. If we couldn't extract step name,
                # extract all failed step displayNames as a summary.
                if [ "$FAILED_MSG" = "Build pipeline failed" ]; then
                  FAILED_STEPS=$(printf '%s' "$FAILURES" | grep -o '"displayName":"[^"]*"' | cut -d'"' -f4 | tr '\n' ', ' | sed 's/,$//' | head -c 200) || true
                  if [ -n "$FAILED_STEPS" ]; then
                    FAILED_MSG="Build pipeline failed at: ${FAILED_STEPS}"
                  fi
                fi
              fi
              # Escape any remaining quotes for JSON safety
              ESCAPED_MSG=$(printf '%s' "$FAILED_MSG" | sed 's/"/\\"/g' | head -c 500)
              APP_NAME="{{workflow.parameters.project-id}}"
              BODY="{\"status\":\"${BUILD_STATUS}\",\"error\":\"${ESCAPED_MSG}\",\"apps\":[{\"name\":\"${APP_NAME}\",\"image_digest\":\"${IMAGE}\"}]}"
            else
              APP_NAME="{{workflow.parameters.project-id}}"
              BODY="{\"status\":\"${BUILD_STATUS}\",\"apps\":[{\"name\":\"${APP_NAME}\",\"image_digest\":\"${IMAGE}\"}]}"
            fi
            echo "Callback body: $BODY"

            HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
              -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer {{workflow.parameters.callback-secret}}" \
              -d "$BODY" \
              --connect-timeout 10 \
              --max-time 30)

            echo "Callback response: HTTP $HTTP_CODE"
            cat /tmp/response.txt

            # Fail on 5xx to trigger retry; accept 2xx and 4xx
            if [ "$HTTP_CODE" -ge 500 ]; then
              echo "ERROR: Server error $HTTP_CODE — will retry"
              exit 1
            fi

            echo "Build callback sent successfully (status: $BUILD_STATUS)"
        volumeMounts:
          - name: manifests
            mountPath: /manifests
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000

  # ===========================================================================
  # Shared volumes across DAG tasks (PVCs persist for the entire workflow)
  # emptyDir does NOT work across DAG tasks — each pod gets its own copy.
  # volumeClaimTemplates create real PVCs shared by all pods in the workflow.
  # ===========================================================================
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: manifests
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 256Mi
