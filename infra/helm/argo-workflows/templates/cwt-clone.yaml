apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: loopzero-clone
  labels:
    app.kubernetes.io/name: loopzero-build
    app.kubernetes.io/component: build-pipeline
    app.kubernetes.io/part-of: loopzero
spec:
  templates:
    - name: clone-repo
      inputs:
        parameters:
          - name: tenant-id
            description: "Tenant identifier for isolation"
          - name: project-id
            description: "Project identifier"
      retryStrategy:
        limit: "2"
        retryPolicy: "OnFailure"
        backoff:
          duration: "5s"
          factor: "2"
          maxDuration: "30s"
      container:
        image: alpine/git:2.43.0
        # Credentials injected from K8s Secret via envFrom — never as workflow parameters.
        # Secret loopzero-gitea-credentials provides: GITEA_URL, GITEA_TOKEN
        envFrom:
          - secretRef:
              name: loopzero-gitea-credentials
        command:
          - sh
          - -c
          - |
            set -euo pipefail
            REPO_URL="${GITEA_URL}/loopzero/loopzero-source-{{inputs.parameters.tenant-id}}-{{inputs.parameters.project-id}}.git"
            CLONE_URL=$(echo "$REPO_URL" | sed "s|://|://oauth2:${GITEA_TOKEN}@|")
            git clone --depth 1 "$CLONE_URL" /workspace
            cd /workspace
            echo "Cloned from source repo"
            ls -la
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
