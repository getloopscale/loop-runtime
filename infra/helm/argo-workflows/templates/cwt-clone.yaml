apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: loopzero-clone
  labels:
    app.kubernetes.io/name: loopzero-build
    app.kubernetes.io/component: build-pipeline
    app.kubernetes.io/part-of: loopzero
spec:
  templates:
    - name: clone-repo
      inputs:
        parameters:
          - name: tenant-id
            description: "Tenant identifier for isolation"
          - name: build-id
            description: "Build identifier — maps to the source bundle path in MinIO"
      retryStrategy:
        limit: "2"
        retryPolicy: "OnFailure"
        backoff:
          duration: "5s"
          factor: "2"
          maxDuration: "30s"
      container:
        # BLOCKER-1 fix: Source bundle downloaded from MinIO (not cloned from Gitea).
        # REVIEW-SEC-MINIO: Changed from alpine/git + unauthenticated wget to
        # minio/mc for authenticated S3 download. git installed via apk for unpack.
        #
        # minio/mc is Alpine-based (~30MB) and handles S3 authentication natively
        # using AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY from the injected Secret.
        # Without authentication, the MinIO bucket would need to be public-read,
        # allowing any pod in the cluster to read any tenant's source code.
        image: minio/mc:RELEASE.2024-01-16T16-06-34Z
        # MinIO credentials injected from K8s Secret via envFrom — never as workflow parameters.
        # Secret loopzero-minio-credentials provides: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, MINIO_ENDPOINT
        env:
          - name: HOME
            value: /tmp
        envFrom:
          - secretRef:
              name: loopzero-minio-credentials
        command:
          - sh
          - -c
          - |
            set -euo pipefail

            BUNDLE_PATH="{{ "{{inputs.parameters.tenant-id}}" }}/source/{{ "{{inputs.parameters.build-id}}" }}.bundle"

            echo "Downloading source bundle from MinIO: ${BUNDLE_PATH}"

            # Configure mc alias with credentials from K8s Secret
            mc alias set loopzero "$MINIO_ENDPOINT" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" \
              {{- if .Values.minio.insecure }}
              --insecure \
              {{- end }}
              --api S3v4 >/dev/null 2>&1

            # Authenticated download via mc (S3 protocol with SigV4)
            mc cp \
              {{- if .Values.minio.insecure }}
              --insecure \
              {{- end }}
              "loopzero/loopzero-builds/${BUNDLE_PATH}" /tmp/source.bundle 2>&1 || {
              echo "ERROR: Failed to download source bundle"
              echo "The source may not have been uploaded. Run 'loopzero deploy' again."
              exit 1
            }

            BUNDLE_SIZE=$(stat -c%s /tmp/source.bundle 2>/dev/null || echo "unknown")
            echo "Bundle downloaded: ${BUNDLE_SIZE} bytes"

            # Install git for bundle unpack (minio/mc is Alpine-based, git is ~15MB)
            apk add --no-cache git >/dev/null 2>&1

            # Unpack the git bundle into the workspace
            cd /workspace
            git init
            git fetch /tmp/source.bundle "refs/heads/*:refs/heads/*"
            git checkout HEAD 2>/dev/null || git checkout $(git branch -a | head -1 | tr -d '* ')
            rm -f /tmp/source.bundle

            echo "Source unpacked into /workspace"
            ls -la
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
