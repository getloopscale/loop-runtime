apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: loopzero-manifests-validate
  labels:
    app.kubernetes.io/name: loopzero-build
    app.kubernetes.io/component: build-pipeline
    app.kubernetes.io/part-of: loopzero
spec:
  templates:
    - name: validate-manifests
      inputs:
        parameters:
          - name: tenant-id
            description: "Tenant identifier for isolation"
          - name: project-id
            description: "Project identifier"
          - name: environment
            description: "Target environment (e.g., production, staging)"
      container:
        image: ghcr.io/yannh/kubeconform:v0.6.7-alpine
        command:
          - sh
          - -c
          - |
            set -euo pipefail
            MANIFEST_DIR="/manifests/{{inputs.parameters.tenant-id}}/{{inputs.parameters.project-id}}/{{inputs.parameters.environment}}"
            # --strict: reject unknown fields in resources that have schemas.
            # Two schema locations: default (upstream K8s) + datreeio CRDs-catalog (Traefik, etc).
            # datreeio/CRDs-catalog contains JSON schemas for 500+ popular CRDs including
            # Traefik IngressRoute, Middleware, etc. This validates CRDs properly instead of
            # skipping them with --ignore-missing-schemas.
            #
            # RISK: CRD schemas are fetched from GitHub at build time.
            # If GitHub is unreachable, validation fails and blocks the build.
            # For air-gapped or production environments, pre-download schemas into
            # a ConfigMap and mount as a local schema-location path.
            set +e
            /kubeconform --strict --summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "$MANIFEST_DIR/manifests.yaml"
            EXIT_CODE=$?
            set -e
            if [ "$EXIT_CODE" -eq 0 ]; then
              echo "Manifest validation passed"
            elif [ "$EXIT_CODE" -eq 1 ]; then
              # Exit code 1 = validation errors (real failures — must block build).
              echo "ERROR: Manifest validation failed"
              exit 1
            else
              # Any other non-zero = network/schema fetch failure — warn but do not block.
              echo "WARNING: kubeconform exited with code $EXIT_CODE (possible network issue fetching CRD schemas)"
              echo "Proceeding with build — manual manifest review recommended"
            fi
        volumeMounts:
          - name: manifests
            mountPath: /manifests
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "128Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
