apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: loopzero-cache-restore
  labels:
    app.kubernetes.io/name: loopzero-build
    app.kubernetes.io/component: build-pipeline
    app.kubernetes.io/part-of: loopzero
spec:
  templates:
    - name: restore-cache
      inputs:
        parameters:
          - name: tenant-id
            description: "Tenant identifier for isolation"
          - name: project-id
            description: "Project identifier"
          - name: minio-endpoint
            description: "MinIO S3-compatible endpoint for cache and artifacts"
          - name: minio-access-key
            description: "MinIO access key scoped to tenant prefix"
          - name: minio-secret-key
            description: "MinIO secret key scoped to tenant prefix"
          - name: cache-key
            description: "Cache key identifier (e.g., node-modules)"
      container:
        image: amazon/aws-cli:2.15.17
        command:
          - sh
          - -c
          - |
            set -euo pipefail
            CACHE_KEY="{{inputs.parameters.tenant-id}}/{{inputs.parameters.project-id}}/{{inputs.parameters.cache-key}}"
            CACHE_PATH="s3://loopzero-builds/{{inputs.parameters.tenant-id}}/cache/deps/${CACHE_KEY}.tar.gz"

            export AWS_ACCESS_KEY_ID="{{inputs.parameters.minio-access-key}}"
            export AWS_SECRET_ACCESS_KEY="{{inputs.parameters.minio-secret-key}}"

            aws s3 cp "$CACHE_PATH" /tmp/cache.tar.gz \
              --endpoint-url "{{inputs.parameters.minio-endpoint}}" \
              --no-sign-request=false 2>/dev/null || {
              echo "Cache miss — no cached dependencies found"
              exit 0
            }

            cd /workspace
            tar xzf /tmp/cache.tar.gz 2>/dev/null || echo "Cache extraction failed — treating as miss"
            echo "Cache restored from ${CACHE_KEY}"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
      # Cache restore is best-effort — failure should not block the build
      activeDeadlineSeconds: 120
