# Gitea credentials for the build cluster.
# The clone step (loopzero-clone CWT) reads credentials from this Secret via envFrom
# instead of receiving them as Workflow parameters.
#
# This prevents the Gitea token from being visible in plaintext in Workflow CR
# objects (kubectl get workflow -o yaml), which would allow any build cluster
# operator to read ALL tenant source code.
#
# In production: replace stringData values with references to an external
# secret manager (e.g., Sealed Secrets, External Secrets Operator).
#
# Applied to the build cluster (argo namespace) by: task infra:install:build
apiVersion: v1
kind: Secret
metadata:
  name: loopzero-gitea-credentials
  labels:
    app.kubernetes.io/name: loopzero-build
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: loopzero
type: Opaque
stringData:
  GITEA_URL: {{ .Values.gitea.url | quote }}
  GITEA_TOKEN: {{ .Values.gitea.token | quote }}
