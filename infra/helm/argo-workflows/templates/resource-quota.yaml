apiVersion: v1
kind: ResourceQuota
metadata:
  name: argo-workflow-quota
  namespace: argo
  labels:
    app.kubernetes.io/name: loopzero-build
    app.kubernetes.io/component: build-pipeline
    app.kubernetes.io/part-of: loopzero
spec:
  hard:
    # Scaled for L3+ load tests (c=20 concurrent workflows, each ~500m-1000m request
    # and up to 3000m limit burst). Original 8/16 saturated at c=15.
    # See scale-50k-plan.md L3 readiness and docs/plans/scale-50k-l3-readiness.md.
    requests.cpu: "24"
    requests.memory: 48Gi
    limits.cpu: "48"
    limits.memory: 96Gi
    pods: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: argo-workflow-limits
  namespace: argo
  labels:
    app.kubernetes.io/name: loopzero-build
    app.kubernetes.io/component: build-pipeline
    app.kubernetes.io/part-of: loopzero
spec:
  limits:
    - default:
        cpu: "1"
        memory: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      type: Container
