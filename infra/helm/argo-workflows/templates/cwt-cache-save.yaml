apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: loopzero-cache-save
  labels:
    app.kubernetes.io/name: loopzero-build
    app.kubernetes.io/component: build-pipeline
    app.kubernetes.io/part-of: loopzero
spec:
  templates:
    - name: save-cache
      inputs:
        parameters:
          - name: tenant-id
            description: "Tenant identifier for isolation"
          - name: project-id
            description: "Project identifier"
          - name: minio-endpoint
            description: "MinIO S3-compatible endpoint for cache and artifacts"
          - name: minio-access-key
            description: "MinIO access key scoped to tenant prefix"
          - name: minio-secret-key
            description: "MinIO secret key scoped to tenant prefix"
          - name: cache-key
            description: "Cache key identifier (e.g., node-modules)"
          - name: cache-dirs
            description: "Comma-separated directories to tar (e.g., node_modules)"
      container:
        image: amazon/aws-cli:2.15.17
        command:
          - sh
          - -c
          - |
            set -uo pipefail
            cd /workspace 2>/dev/null || { echo "No workspace — skipping cache save"; exit 0; }

            CACHE_KEY="{{inputs.parameters.tenant-id}}/{{inputs.parameters.project-id}}/{{inputs.parameters.cache-key}}"
            CACHE_PATH="s3://loopzero-builds/{{inputs.parameters.tenant-id}}/cache/deps/${CACHE_KEY}.tar.gz"

            export AWS_ACCESS_KEY_ID="{{inputs.parameters.minio-access-key}}"
            export AWS_SECRET_ACCESS_KEY="{{inputs.parameters.minio-secret-key}}"

            # Build list of dirs to cache from comma-separated input
            DIRS="{{inputs.parameters.cache-dirs}}"
            EXISTING_DIRS=""
            IFS=',' read -ra DIR_ARRAY <<< "$DIRS"
            for d in "${DIR_ARRAY[@]}"; do
              d=$(echo "$d" | xargs)  # trim whitespace
              if [ -d "$d" ]; then
                EXISTING_DIRS="$EXISTING_DIRS $d/"
              fi
            done

            if [ -n "$EXISTING_DIRS" ]; then
              tar czf /tmp/cache.tar.gz $EXISTING_DIRS
              aws s3 cp /tmp/cache.tar.gz "$CACHE_PATH" \
                --endpoint-url "{{inputs.parameters.minio-endpoint}}" \
                --no-sign-request=false 2>/dev/null || echo "Cache save failed — non-fatal"
              echo "Cache saved to ${CACHE_KEY}"
            else
              echo "No directories to cache"
            fi
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
