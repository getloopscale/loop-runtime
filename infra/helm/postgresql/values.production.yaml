# Production PostgreSQL values overlay
# Usage: helm upgrade --install postgresql bitnami/postgresql-ha -f values.yaml -f values.production.yaml
#
# NOTE: Production HA requires the bitnami/postgresql-ha chart (not bitnami/postgresql).
# The standalone chart does not support replication. For production, migrate to
# postgresql-ha or use CloudNativePG operator (see ADR recommendation below).
#
# This file documents the target production configuration. It is NOT used in
# local development (k3d clusters use values.yaml with standalone mode).

# --- Architecture ---
# Switch from standalone to replication with synchronous commit.
# Ensures at least one replica has the data before acknowledging writes.
architecture: replication
replication:
  numReplicas: 2
  synchronousCommit: "on"
  numSynchronousReplicas: 1

# --- Primary ---
primary:
  persistence:
    size: 50Gi
    storageClass: ""  # Use cluster default; override per cloud provider
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  # WAL archiving for point-in-time recovery (PITR)
  # Bitnami chart supports extended configuration via postgresql.conf overrides.
  extendedConfiguration: |
    # Two-phase commit stays off, and stays off ON PURPOSE.
    #
    # Nothing here uses it (measured 2026-08-14: zero PREPARE TRANSACTION across all
    # eight repositories). PostgreSQL already defaults this to 0, so the value below
    # changes no behaviour — it removes the reliance on a default.
    #
    # A prepared transaction holds its locks and its snapshot until someone commits or
    # rolls it back, surviving both the client disconnecting and a server restart. That
    # makes the maximum transaction duration unbounded, and an unbounded transaction is
    # what stops any tenant-migration or shard-cutover quiesce window from ever being
    # provably closed. Raising this is a decision to argue for, not a knob to turn for
    # one integration.
    max_prepared_transactions = 0
    archive_mode = on
    archive_command = 'test ! -f /bitnami/postgresql/archive/%f && cp %p /bitnami/postgresql/archive/%f'
    wal_level = replica
    max_wal_senders = 10
    wal_keep_size = 1024
  # Mount a persistent volume for WAL archives
  extraVolumeMounts:
    - name: wal-archive
      mountPath: /bitnami/postgresql/archive
  extraVolumes:
    - name: wal-archive
      persistentVolumeClaim:
        claimName: postgresql-wal-archive
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  podSecurityContext:
    runAsNonRoot: true
  containerSecurityContext:
    runAsNonRoot: true

# --- Read Replicas ---
readReplicas:
  persistence:
    size: 50Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  podSecurityContext:
    runAsNonRoot: true
  containerSecurityContext:
    runAsNonRoot: true

# --- Backup ---
# Bitnami chart CronJob-based logical backup (pg_dumpall).
# For production PITR, prefer WAL archiving + pgBackRest or CloudNativePG.
backup:
  enabled: true
  cronjob:
    schedule: "0 2 * * *"  # Daily at 2 AM UTC
    storage:
      storageClass: ""
      size: 50Gi
    concurrencyPolicy: Forbid
    # Retain last 7 backups
    successfulJobsHistoryLimit: 7
    failedJobsHistoryLimit: 3

# --- TLS ---
# Enable in-transit encryption between clients and PostgreSQL.
tls:
  enabled: true
  autoGenerated: true

# --- Metrics ---
# Keep Prometheus exporter enabled with a ServiceMonitor for Grafana dashboards.
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    labels:
      release: monitoring
    interval: 15s
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 32Mi

# --- Auth ---
# IMPORTANT: Override these in production via --set or external secret.
# NEVER use the dev defaults from values.yaml in production.
# auth:
#   password: <from-external-secret>
#   replicationPassword: <from-external-secret>
