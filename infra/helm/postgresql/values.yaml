auth:
  username: loopzero
  password: loopzero-dev-password
  database: loopzero

primary:
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  podSecurityContext:
    runAsNonRoot: true
  containerSecurityContext:
    runAsNonRoot: true
  persistence:
    size: 1Gi
  service:
    type: NodePort
    nodePorts:
      postgresql: 30432

metrics:
  enabled: true
  resources:
    limits:
      cpu: "100m"
      memory: "64Mi"
    requests:
      cpu: "50m"
      memory: "32Mi"
