# PRODUCTION WARNING: Override ALL passwords before deploying to production.
# Default values are for local development only.
# Use --set auth.password=<secure-value> or a values override file.
auth:
  username: loopzero
  password: loopzero-dev-password  # LOCAL DEV ONLY — override for production
  database: loopzero

primary:
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  podSecurityContext:
    runAsNonRoot: true
  containerSecurityContext:
    runAsNonRoot: true
  persistence:
    size: 1Gi
  service:
    type: NodePort
    nodePorts:
      postgresql: 30432

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    labels:
      release: monitoring
    interval: 15s
  resources:
    limits:
      cpu: "100m"
      memory: "64Mi"
    requests:
      cpu: "50m"
      memory: "32Mi"
