# kube-prometheus-stack values for LOCAL DEVELOPMENT (k3d) only.
# Production overrides are applied by Pulumi (infra/pulumi/src/components/mgmt-observability.ts,
# mgmt-grafana.ts). Credentials here are dev-only defaults — never used in production.
prometheus:
  prometheusSpec:
    retention: 15d
    securityContext:
      runAsNonRoot: true
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "256Mi"
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    additionalScrapeConfigs:
      - job_name: argo-workflows
        scrape_interval: 15s
        scrape_timeout: 10s
        metrics_path: /metrics
        static_configs:
          - targets:
              # The build cluster's load balancer, by container name: Docker's DNS
              # resolves it on the k3d network, so no setup step rewrites it (#264).
              - "k3d-loopruntime-build-serverlb:30090"
            labels:
              cluster: build
              component: argo-workflows
      - job_name: traefik
        scrape_interval: 15s
        scrape_timeout: 10s
        metrics_path: /metrics
        static_configs:
          - targets:
              # The cell-0 load balancer, by container name (#264).
              - "k3d-loopruntime-cell-0-serverlb:30091"
            labels:
              cluster: workload
              component: traefik
  service:
    type: NodePort
    nodePort: 30004

grafana:
  securityContext:
    runAsNonRoot: true
  # T1.3 (plan 2026-05-21-deep-review-remediation): empty → Grafana chart
  # auto-generates random one stored in K8s Secret "grafana" (admin-password).
  # Operator reads via: kubectl -n monitoring get secret grafana -o jsonpath='{.data.admin-password}' | base64 -d
  adminPassword: ""
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring:3100
      access: proxy
      isDefault: false
      jsonData:
        derivedFields:
          - datasourceUid: tempo
            matcherRegex: '"trace_id":"([a-f0-9]+)"'
            name: TraceID
            url: "$${__value.raw}"
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.loopruntime-system:3200
      access: proxy
      isDefault: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folder: /var/lib/grafana/dashboards/sidecar
      provider:
        name: sidecar
        orgId: 1
        folder: LoopRuntime
        type: file
        disableDeletion: false
        editable: true
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60
    periodSeconds: 30
  service:
    type: NodePort
    nodePort: 30002
  resources:
    limits:
      cpu: "300m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: LoopRuntime
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      cluster-health:
        gnetId: 315
        revision: 3
        datasource: Prometheus

alertmanager:
  enabled: true
  alertmanagerSpec:
    # MEET-054 S1: Mount Slack webhook URLs Secret for real alert delivery.
    secrets:
      - alertmanager-slack-webhooks
    resources:
      limits:
        cpu: "100m"
        memory: "128Mi"
      requests:
        cpu: "50m"
        memory: "64Mi"
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: default
      group_by: ['alertname', 'tenant']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: critical
          matchers:
            - severity = critical
          group_wait: 10s
          repeat_interval: 1h
        - receiver: default
          matchers:
            - severity = warning
    receivers:
      # MEET-054 S1-02: Real receivers (SRE VETO resolved).
      # Slack webhook URLs injected via alertmanager-slack-webhooks Secret
      # mounted at /etc/alertmanager/secrets/. Create Secret:
      #   kubectl -n monitoring create secret generic alertmanager-slack-webhooks \
      #     --from-literal=slack-webhook-url="https://hooks.slack.com/..." \
      #     --from-literal=slack-critical-webhook-url="https://hooks.slack.com/..."
      #
      # For environments without Slack, override with webhook_configs pointing
      # to any HTTP endpoint that accepts Alertmanager payloads.
      - name: default
        slack_configs:
          - api_url_file: '/etc/alertmanager/secrets/alertmanager-slack-webhooks/slack-webhook-url'
            channel: '#loopruntime-alerts'
            send_resolved: true
            title: '{{ "{{ .Status | toUpper }}" }}: {{ "{{ .CommonLabels.alertname }}" }}'
            text: >-
              {{ "{{ range .Alerts }}" }}{{ "{{ .Annotations.summary }}" }}
              {{ "{{ end }}" }}
      - name: critical
        slack_configs:
          - api_url_file: '/etc/alertmanager/secrets/alertmanager-slack-webhooks/slack-critical-webhook-url'
            channel: '#loopruntime-critical'
            send_resolved: true
            title: ':rotating_light: {{ "{{ .CommonLabels.alertname }}" }}'
            text: >-
              {{ "{{ range .Alerts }}" }}{{ "{{ .Annotations.description }}" }}
              {{ "{{ end }}" }}
  service:
    type: NodePort
    nodePort: 30093

nodeExporter:
  enabled: true
  resources:
    limits:
      cpu: "100m"
      memory: "64Mi"
    requests:
      cpu: "50m"
      memory: "32Mi"

kubeStateMetrics:
  resources:
    limits:
      cpu: "100m"
      memory: "128Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"
