# kube-prometheus-stack values for dev local
prometheus:
  prometheusSpec:
    retention: 15d
    securityContext:
      runAsNonRoot: true
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "256Mi"
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    additionalScrapeConfigs:
      - job_name: argo-workflows
        scrape_interval: 15s
        scrape_timeout: 10s
        metrics_path: /metrics
        static_configs:
          - targets:
              - "host.k3d.internal:30090"
            labels:
              cluster: build
              component: argo-workflows
      - job_name: traefik
        scrape_interval: 15s
        scrape_timeout: 10s
        metrics_path: /metrics
        static_configs:
          - targets:
              - "host.k3d.internal:30091"
            labels:
              cluster: workload
              component: traefik
  service:
    type: NodePort
    nodePort: 30004

grafana:
  securityContext:
    runAsNonRoot: true
  adminPassword: loopzero-dev-password
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folder: /var/lib/grafana/dashboards/sidecar
      provider:
        name: sidecar
        orgId: 1
        folder: LoopZero
        type: file
        disableDeletion: false
        editable: true
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60
    periodSeconds: 30
  service:
    type: NodePort
    nodePort: 30002
  resources:
    limits:
      cpu: "300m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: LoopZero
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      cluster-health:
        gnetId: 315
        revision: 3
        datasource: Prometheus

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      limits:
        cpu: "100m"
        memory: "128Mi"
      requests:
        cpu: "50m"
        memory: "64Mi"
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: default
      group_by: ['alertname', 'tenant']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: critical
          matchers:
            - severity = critical
          group_wait: 10s
          repeat_interval: 1h
        - receiver: default
          matchers:
            - severity = warning
    receivers:
      - name: default
        webhook_configs:
          - url: 'http://localhost:9093/dev-null'
            send_resolved: true
      - name: critical
        webhook_configs:
          - url: 'http://localhost:9093/dev-null'
            send_resolved: true
  service:
    type: NodePort
    nodePort: 30093

nodeExporter:
  enabled: true
  resources:
    limits:
      cpu: "100m"
      memory: "64Mi"
    requests:
      cpu: "50m"
      memory: "32Mi"

kubeStateMetrics:
  resources:
    limits:
      cpu: "100m"
      memory: "128Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"
