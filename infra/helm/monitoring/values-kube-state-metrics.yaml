# kube-state-metrics values used by runtime helmfile.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Expose metrics on a NodePort so the core-cluster Prometheus can federate-scrape.
# The exact port is fixed (30030) so Prometheus configs don't need to be regenerated
# every time the runtime cluster is bootstrapped.
service:
  type: NodePort
  nodePort: 30030
  servicePort: 8080

# The runtime.getloopscale.com labels the manifest renderer puts on a tenant app's pods and Services,
# exported as kube_pod_labels and kube_service_labels (label_runtime_getloopscale_com_tenant, ...).
# kube-state-metrics exports no object label unless it is listed. The cell's Prometheus
# joins on them to record each app's ready replicas and request rate by tenant, project,
# app and environment (values-tenant-app-recording-rules.yaml).
metricLabelsAllowlist:
  - pods=[runtime.getloopscale.com/tenant,runtime.getloopscale.com/project,runtime.getloopscale.com/app-name,runtime.getloopscale.com/environment]
  - services=[runtime.getloopscale.com/tenant,runtime.getloopscale.com/project,runtime.getloopscale.com/app-name,runtime.getloopscale.com/environment]
