# prometheus values used by mgmt helmfile.
server:
  retention: 15d
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  persistentVolume:
    enabled: true
    size: 50Gi
alertmanager:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  # T5.9 of deep-review-remediation-plan (closes find_obs_008 MEDIUM):
  # alertmanager receivers + routing tree. Critical alerts MUST escalate
  # via PagerDuty; warnings go to Slack. Pre-T5.9 the chart had no
  # routing config — every alert defaulted to the dummy "null" receiver.
  #
  # Operators set the secret values in production via
  # infra/scripts/seed-alertmanager-secrets.sh (gen Slack webhook +
  # PagerDuty integration key from 1Password) and apply via helmfile.
  # In local k3d the values stay empty so AM doesn't spam external services.
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'slack-default'
      routes:
        # Critical alerts → PagerDuty (escalates if not ack'd in 10m).
        # ALSO copies to Slack for visibility (continue: true).
        - match:
            severity: critical
          receiver: 'pagerduty-critical'
          continue: true
        - match:
            severity: critical
          receiver: 'slack-critical'
        # Warning alerts → Slack only (no PagerDuty escalation).
        - match:
            severity: warning
          receiver: 'slack-warning'
    receivers:
      - name: 'slack-default'
        slack_configs:
          - api_url_file: '/etc/alertmanager/secrets/alertmanager-slack-webhooks/slack-webhook-url'
            channel: '#alerts'
            send_resolved: true
            title: '{{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ if .Annotations.runbook_url }}Runbook: {{ .Annotations.runbook_url }}{{ end }}\n{{ end }}'
      - name: 'slack-warning'
        slack_configs:
          - api_url_file: '/etc/alertmanager/secrets/alertmanager-slack-webhooks/slack-webhook-url'
            channel: '#alerts-warning'
            send_resolved: true
      - name: 'slack-critical'
        slack_configs:
          - api_url_file: '/etc/alertmanager/secrets/alertmanager-slack-webhooks/slack-critical-webhook-url'
            channel: '#alerts-critical'
            send_resolved: true
      - name: 'pagerduty-critical'
        pagerduty_configs:
          - service_key: '${PAGERDUTY_SERVICE_KEY}'
            send_resolved: true
            description: '{{ .GroupLabels.alertname }} ({{ .GroupLabels.severity }})'
            details:
              firing: '{{ .Alerts.Firing | len }}'
              runbook: '{{ (index .Alerts 0).Annotations.runbook_url }}'
serverFiles:
  alerting_rules.yml: {}
  recording_rules.yml: {}

# velero-backup-dr-plan v1.0 / T3.2 — Scrape Velero metrics so
# prometheusrule-velero.yaml alerts have a data source. Velero exposes
# /metrics on :8085 (in-cluster Service `velero.velero-system.svc`).
extraScrapeConfigs: |
  - job_name: velero
    static_configs:
      - targets:
          - velero.velero-system.svc:8085
    metrics_path: /metrics
    scrape_interval: 30s
