# prometheus values used by mgmt helmfile.
server:
  retention: 15d
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  persistentVolume:
    enabled: true
    size: 50Gi
alertmanager:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  # T5.9 of deep-review-remediation-plan (closes find_obs_008 MEDIUM):
  # alertmanager receivers + routing tree. Critical alerts MUST escalate
  # via PagerDuty; warnings go to Slack. Pre-T5.9 the chart had no
  # routing config — every alert defaulted to the dummy "null" receiver.
  #
  # Operators set the secret values in production via
  # infra/scripts/seed-alertmanager-secrets.sh (gen Slack webhook +
  # PagerDuty integration key from 1Password) and apply via helmfile.
  # In local k3d the values stay empty so AM doesn't spam external services.
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'slack-default'
      routes:
        # Critical alerts → PagerDuty (escalates if not ack'd in 10m).
        # ALSO copies to Slack for visibility (continue: true).
        - match:
            severity: critical
          receiver: 'pagerduty-critical'
          continue: true
        - match:
            severity: critical
          receiver: 'slack-critical'
        # Warning alerts → Slack only (no PagerDuty escalation).
        - match:
            severity: warning
          receiver: 'slack-warning'
    receivers:
      - name: 'slack-default'
        slack_configs:
          - api_url_file: '/etc/alertmanager/secrets/alertmanager-slack-webhooks/slack-webhook-url'
            channel: '#alerts'
            send_resolved: true
            title: '{{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ if .Annotations.runbook_url }}Runbook: {{ .Annotations.runbook_url }}{{ end }}\n{{ end }}'
      - name: 'slack-warning'
        slack_configs:
          - api_url_file: '/etc/alertmanager/secrets/alertmanager-slack-webhooks/slack-webhook-url'
            channel: '#alerts-warning'
            send_resolved: true
      - name: 'slack-critical'
        slack_configs:
          - api_url_file: '/etc/alertmanager/secrets/alertmanager-slack-webhooks/slack-critical-webhook-url'
            channel: '#alerts-critical'
            send_resolved: true
      - name: 'pagerduty-critical'
        pagerduty_configs:
          - service_key: '${PAGERDUTY_SERVICE_KEY}'
            send_resolved: true
            description: '{{ .GroupLabels.alertname }} ({{ .GroupLabels.severity }})'
            details:
              firing: '{{ .Alerts.Firing | len }}'
              runbook: '{{ (index .Alerts 0).Annotations.runbook_url }}'
serverFiles:
  alerting_rules.yml: {}
  recording_rules.yml: {}

# velero-backup-dr-plan v1.0 / T3.2 — Scrape Velero metrics so
# prometheusrule-velero.yaml alerts have a data source. Velero exposes
# /metrics on :8085 (in-cluster Service `velero.velero-system.svc`).
#
# red-team-77-107-closure plan (2026-06-29) — Step 5 Chaos closure: the
# canonical chaos manifests under infra/tests/chaos/manifests/ assert
# `probe_success{job="loop-runtime-api-health"} == 1` (e.g., pod-kill-api-leader.yaml).
# Without this scrape config the assertion returns an empty vector and the
# chaos test fails even when failover itself succeeded. The Probe CRDs at
# infra/helm/monitoring/manifests/probe-targets.yaml require the operator
# pattern (kube-prometheus-stack); the community `prometheus` chart deployed
# here honors only static scrape configs, so we wire blackbox-exporter via
# the canonical relabel chain instead.
extraScrapeConfigs: |
  - job_name: velero
    static_configs:
      - targets:
          - velero.velero-system.svc:8085
    metrics_path: /metrics
    scrape_interval: 30s
  - job_name: loop-runtime-api-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://loop-runtime-api.loop-runtime-system.svc:3001/api/v1/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc:9115
    scrape_interval: 15s
    scrape_timeout: 10s
  # Direct scrape of loop-runtime-api /metrics on port 9090 — emits loop_runtime_api_*
  # metrics consumed by chaos SLO queries (loop_runtime_api_leader_status,
  # loop_runtime_api_requests_total, etc., post-decomposition canonical names per
  # the 2026-06-24 audit). The loop-runtime-api Service does not carry the
  # prometheus.io/scrape annotation; static-config is the canonical wire
  # without coupling Service metadata to scrape selection.
  - job_name: loop-runtime-api-metrics
    static_configs:
      - targets:
          - loop-runtime-api.loop-runtime-system.svc:9090
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
  # Cross-cluster scrape of the workload cluster's kube-state-metrics —
  # T2.2 of plan dashboard-badge-data-plane-poller (Red Team #128).
  # Native Prometheus feature (scrape_configs, parsimony rung 3).
  # Without this the mgmt Prometheus has NO visibility into tenant
  # workload Deployments, so `kube_deployment_status_replicas_ready`
  # returns an empty vector and the api's readiness poller writes zero
  # rows to env_targets. Address `k3d-loop-runtime-cell-0-server-0:30030` is the
  # NodePort exposed by the workload monitoring chart; resolves via
  # the CoreDNS NodeHosts patch shipped by
  # `loop-runtime-ops seed networking-cross-cluster-coredns` (M15 W3).
  # Same cross-cluster mechanism the Loki scrape uses (memory
  # `j17-aprendizado-coredns-cross-cluster-build-lb`).
  {{- /*
    The chart evaluates this string with `tpl`. An environment that declares
    `federation:` (the AWS environments, values/<env>/prometheus.yaml.gotmpl) federates
    each remote cluster's Prometheus through its internal ALB instead, one job per
    cluster, and renders no k3d job; `federation.clusters` is empty on the first core
    sync of a rebuild, before the remote ALBs exist. Builtins only, so the render tests
    can evaluate it with text/template.
  */}}
  {{- with .Values.federation }}
  {{- range .clusters }}
  - job_name: {{ .name }}-federation
    honor_labels: true
    scheme: {{ .scheme }}
    metrics_path: {{ .metricsPath }}
    params:
      'match[]':
        - '{job=~".+"}'
        # The series a cell records per tenant app (values-tenant-app-recording-rules.yaml).
        # A recorded series has no job label, so the selector above leaves it behind.
        - '{__name__=~"loop_runtime_app[a-z_]*:.+"}'
    static_configs:
      - targets:
          - {{ .address }}
        labels:
          cluster: {{ .name }}
    scrape_interval: 30s
    scrape_timeout: 25s
  {{- end }}
  {{- else }}
  - job_name: cell-0-cluster-kube-state-metrics
    static_configs:
      - targets:
          - k3d-loop-runtime-cell-0-server-0:30030
        labels:
          cluster: workload
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
  {{- end }}
  {{- /*
    The platform's own PostgreSQL (infra/helm/platform-postgres), in the environments
    that run it. Every instance of every CloudNativePG cluster in the namespace, on its
    `metrics` port (9187); prometheusrule-platform-postgres.yaml reads this job.
  */}}
  {{- with .Values.platformPostgres }}
  - job_name: platform-postgres
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - {{ .namespace }}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
        regex: .+
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
        target_label: cluster_name
      - source_labels: [__meta_kubernetes_pod_label_cnpg_io_instanceRole]
        target_label: role
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
    scrape_interval: 30s
    scrape_timeout: 10s
  {{- end }}
