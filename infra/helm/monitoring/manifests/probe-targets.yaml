# Prometheus Probe CRDs for blackbox-exporter targets (Phase 1A observability).
# Probes core platform services for availability monitoring.
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: loopzero-api-probe
  namespace: monitoring
  labels:
    release: monitoring
spec:
  prober:
    url: blackbox-exporter.loopzero-system.svc:9115
  module: http_2xx
  targets:
    staticConfig:
      static:
        - http://loopzero-api.loopzero-system.svc:3000/api/v1/health
        # B-022: o `loopzero-cloud` e' o proxy autenticador do motor — `r.Route("/engine")` tira o
        # prefixo, aplica requireJWT e repassa. Quando ele cai, `/engine/*` e `/v1/*` devolvem
        # 502 JUNTOS, mesmo com o `loopzero-api` saudavel (medido em 2026-08-10). Era o unico
        # componente com esse acoplamento que ninguem sondava: sem serie, a bala do B-022 que
        # pede indisponibilidade medida nao tinha como ser respondida.
        - http://loopzero-cloud.loopzero-system.svc:13002/health
        - http://gitea-http.loopzero-system.svc:3000/api/v1/version
        - http://traefik.loopzero-system.svc:9000/ping
  interval: 30s
  scrapeTimeout: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: loopzero-infra-probe
  namespace: monitoring
  labels:
    release: monitoring
spec:
  prober:
    url: blackbox-exporter.loopzero-system.svc:9115
  module: http_2xx
  targets:
    staticConfig:
      static:
        - https://argocd-server.argocd.svc/healthz
  interval: 60s
  scrapeTimeout: 15s
  tlsConfig:
    insecureSkipVerify: true
