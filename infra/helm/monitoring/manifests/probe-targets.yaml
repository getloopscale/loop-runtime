# Prometheus Probe CRDs for blackbox-exporter targets (Phase 1A observability).
# Probes core platform services for availability monitoring.
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: loopzero-api-probe
  namespace: monitoring
  labels:
    release: monitoring
spec:
  prober:
    url: blackbox-exporter.platform-system.svc:9115
  module: http_2xx
  targets:
    staticConfig:
      static:
        - http://loopzero-api.platform-system.svc:3000/api/v1/health
        - http://gitea-http.platform-system.svc:3000/api/v1/version
        - http://traefik.platform-system.svc:9000/ping
  interval: 30s
  scrapeTimeout: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: loopzero-infra-probe
  namespace: monitoring
  labels:
    release: monitoring
spec:
  prober:
    url: blackbox-exporter.platform-system.svc:9115
  module: http_2xx
  targets:
    staticConfig:
      static:
        - https://argocd-server.argocd.svc/healthz
  interval: 60s
  scrapeTimeout: 15s
  tlsConfig:
    insecureSkipVerify: true
