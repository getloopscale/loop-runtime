# ServiceMonitor for LoopRuntime Operators (split-binary topology).
#
# Selects all 4 split operator Services via the shared label
# `app.kubernetes.io/component: loop-runtime-operator` applied by
# loop-runtime-common.operatorLabels helper to:
#   - loop-runtime-tenant-operator
#   - loop-runtime-app-operator
#   - loop-runtime-preview-operator
#   - loop-runtime-platform-operator
#
# Per ADR-0023 / plan v1.1 T1.4: the legacy monolith binary
# (operators/cmd/main.go + operators/internal/controller/) was deleted
# from this codebase. The infra/helm/tenant-controller chart was also
# deleted in T1.5. No `app: tenant-controller` Service exists in this
# tree to scrape.
#
# Production rollout (still on the monolith image built before commit
# d24fa3f7) is handled via separate CHG-NNNN-OPERATOR-SPLIT-PROD per
# ADR-0023 4-stage cutover; that change record provides its own
# transitional ServiceMonitor.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loop-runtime-operators
  namespace: monitoring
  labels:
    release: monitoring
    runtime.getloopscale.com/sprint: "9"
    runtime.getloopscale.com/adr: "0023"
spec:
  namespaceSelector:
    matchNames:
      - loop-runtime-system
  selector:
    matchLabels:
      app.kubernetes.io/component: loop-runtime-operator
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
