# NodePort Service to expose Traefik metrics for cross-cluster scraping.
# Deploy to workload cluster: kubectl --context k3d-loop-runtime-cell-0 apply -f metrics-service-traefik.yaml
apiVersion: v1
kind: Service
metadata:
  name: traefik-metrics
  namespace: traefik
  labels:
    app: traefik-metrics
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - port: 9100
      targetPort: 9100
      nodePort: 30091
      protocol: TCP
      name: metrics
