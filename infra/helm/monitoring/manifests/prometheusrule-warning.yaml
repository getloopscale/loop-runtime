# Warning alerting rules for LoopRuntime platform (spec §15.5).
# These indicate potential issues that should be investigated soon.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loopruntime-warning-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: loopruntime.warning
      rules:
        - alert: LoopRuntimeAPIHighLatency
          expr: histogram_quantile(0.99, sum(rate(loopruntime_api_request_duration_seconds_bucket[5m])) by (le)) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "API p99 latency exceeds 5s"
            description: "API request latency (p99) has been above 5 seconds for 5 minutes."
            runbook: "Check downstream dependencies (Gitea, Argo, PostgreSQL). Scaling API pods only helps if API itself is the bottleneck."

        - alert: LoopRuntimeBuildQueueBacklog
          expr: loopruntime_build_queue_depth > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Build queue depth exceeds 10"
            description: "More than 10 builds are queued for 5+ minutes. Builds may be delayed."
            runbook: "Check Argo Workflows controller capacity. Consider scaling workflow workers."

        - alert: LoopRuntimeReconcilerUnhealthy
          expr: increase(loopruntime_operator_reconcile_errors_total[5m]) > 5
          labels:
            severity: warning
          annotations:
            summary: "Reconciler has 5+ errors in 5 minutes"
            description: "StateReconciler is producing errors at an elevated rate."
            runbook: "Check reconciler pod logs. Verify connectivity to ArgoCD and Gitea."

        - alert: LoopRuntimeArgoCDAppCountWarning
          expr: count(argocd_app_info) > 200
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD managing 200+ applications"
            description: "ArgoCD application count exceeds 200. Performance degradation may begin."
            runbook: "Monitor ArgoCD reconciliation latency. Consider controller sharding if latency increases."

        - alert: LoopRuntimeArgoCDAppCountCritical
          expr: count(argocd_app_info) > 400
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ArgoCD managing 400+ applications — critical threshold"
            description: "ArgoCD application count exceeds 400. Reconciliation degradation likely."
            runbook: "Implement application controller sharding (--application-namespaces). Scale controller resources."

        - alert: LoopRuntimeArgoCDSyncSlow
          expr: histogram_quantile(0.95, sum(rate(argocd_app_reconcile_duration_seconds_bucket[5m])) by (le)) > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD sync duration p95 exceeds 30s"
            description: "ArgoCD application reconciliation is taking longer than 30 seconds (p95)."
            runbook: "Check ArgoCD controller resources and application count. May indicate capacity issues."

        # MEET-2026-03-31-023 T0-3: Build stuck in RELEASING state.
        # The metric loopruntime_releasing_builds exists in api/internal/metrics/release_metrics.go.
        # This alert was designed but never created as a PrometheusRule.
        - alert: LoopRuntimeOrphanBuild
          expr: loopruntime_releasing_builds > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} build(s) stuck in RELEASING state for 5+ minutes"
            description: "Builds in RELEASING state indicate a failed release activation that the reconcile loop is not recovering."
            runbook: "Check API logs for release activation errors. Verify ArgoCD connectivity. The build reconcile loop should retry automatically on next tick."

        # MEET-2026-03-31-023 T1-8: Releases stuck in PENDING state.
        - alert: LoopRuntimeReleasesPendingStuck
          expr: loopruntime_releases_pending > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} release(s) stuck in PENDING for 10+ minutes"
            description: "Releases should converge within 5 minutes. Check ArgoCD sync status and convergence loop health."
            runbook: "Check ArgoCD Application health. Verify convergence loop is running (loopruntime_reconcile_loop_last_success_timestamp). Check if TriggerSync failed."

        # MEET-2026-03-31-023 T1-8: Reconcile loop health heartbeat.
        - alert: LoopRuntimeReconcileLoopStale
          expr: time() - loopruntime_reconcile_loop_last_success_timestamp{loop="build"} > 120
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Build reconcile loop stale (no successful tick in 2 minutes)"
            description: "The build reconcile loop may have crashed or be stuck. Check API pod logs."
            runbook: "Check API pod health and logs. Restart API pod if loop is stuck."

        - alert: LoopRuntimeMinIODown
          expr: up{job=~".*minio.*"} == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "MinIO is down"
            description: "MinIO has been unreachable for more than 2 minutes. Build cache unavailable. Source uploads will fail."
            runbook: "Check MinIO pod status. Verify PVC. Builds will run without cache (slower but not blocked)."

        # WS.1: Service auth secret approaching 90-day rotation deadline.
        # Fires at 80 days (6912000s) to give operators 10 days to rotate.
        - alert: LoopRuntimeServiceAuthSecretExpiring
          expr: loopruntime_service_auth_secret_age_seconds > 6912000
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Service auth secret approaching 90-day rotation deadline"
            runbook: "docs/runbooks.md"
            description: "Service auth secret has been in use for {{ $value | humanizeDuration }}. Rotate within 10 days."

        - alert: LoopRuntimeArgoCDHealthStuck
          expr: argocd_app_info{health_status="Progressing"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD Application {{ $labels.name }} stuck in Progressing > 10min"
            description: "ArgoCD Application {{ $labels.name }} has been in Progressing health state for more than 10 minutes. This may block deploy notifications for the entire tenant."
            runbook: "Check for orphaned resources in the Application. Common cause: IngressRoute referencing non-existent Service (static frontend without nginx proxy). Remove orphaned resources or configure ArgoCD health check exclusion."

    # ═══════════════════════════════════════════════════
    # Workload Protection Alerts (MEET-2026-03-30-021)
    # ═══════════════════════════════════════════════════

    - name: loopruntime.workload.warning
      rules:
        # F1-C4: CrashLoopBackOff for 5+ minutes (reduced from 10m per SRE review)
        - alert: LoopRuntimeAppCrashLoop
          expr: |
            max by (namespace, pod) (
              kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}
            ) * on(namespace) group_left()
            kube_namespace_labels{label_runtime_getloopscale_com_managed_by="environment-controller"}
            > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "App pod {{ $labels.pod }} in {{ $labels.namespace }} stuck in CrashLoopBackOff"
            description: "Pod has been crash-looping for 5+ minutes. Resources consumed without serving traffic."
            runbook: "Check app logs via `loopscale logs`. If image is broken, rollback via `loopscale rollback`."

        # Image pull failure for 5+ minutes
        - alert: LoopRuntimeAppImagePullFailed
          expr: |
            max by (namespace, pod) (
              kube_pod_container_status_waiting_reason{reason="ImagePullBackOff"}
              or
              kube_pod_container_status_waiting_reason{reason="ErrImagePull"}
            ) * on(namespace) group_left()
            kube_namespace_labels{label_runtime_getloopscale_com_managed_by="environment-controller"}
            > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "App pod {{ $labels.pod }} in {{ $labels.namespace }} cannot pull image"
            description: "Image pull failing for 5+ minutes. Possible causes: wrong image tag, registry auth, network."
            runbook: "Verify image exists in registry. Check registry credentials. Redeploy with correct image."

        # F1-C4: Replica mismatch for 5+ minutes (reduced from 15m per SRE review)
        - alert: LoopRuntimeAppReplicaMismatch
          expr: |
            (
              kube_deployment_spec_replicas
              - kube_deployment_status_replicas_ready
            ) * on(namespace) group_left()
            kube_namespace_labels{label_runtime_getloopscale_com_managed_by="environment-controller"}
            > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.deployment }} in {{ $labels.namespace }} has unavailable replicas"
            description: "Desired replicas != ready replicas for 5+ minutes. App may be partially down."
            runbook: "Check pod status. Common causes: resource pressure, crash loop, image issues."

        # High restart rate (10+ restarts in 30 minutes)
        - alert: LoopRuntimeAppHighRestartRate
          expr: |
            increase(
              kube_pod_container_status_restarts_total[30m]
            ) * on(namespace) group_left()
            kube_namespace_labels{label_runtime_getloopscale_com_managed_by="environment-controller"}
            > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "App pod {{ $labels.pod }} in {{ $labels.namespace }} restarting excessively"
            description: "Pod has restarted 10+ times in 30 minutes. Likely unstable or misconfigured."
            runbook: "Check app logs. Consider rollback if latest deploy caused the instability."

        # F1-C5: ProgressDeadlineExceeded — primary signal for stuck deploys
        - alert: LoopRuntimeAppDeployStuck
          expr: |
            kube_deployment_status_condition{condition="Progressing",status="false"}
            * on(namespace) group_left()
            kube_namespace_labels{label_runtime_getloopscale_com_managed_by="environment-controller"}
            > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.deployment }} in {{ $labels.namespace }} failed to progress"
            description: "Deployment hit progressDeadlineSeconds (210s). New pods could not become ready."
            runbook: "Check pod events and logs. Likely causes: image crash, failing health check, insufficient resources. Use `loopscale rollback` to revert."

    - name: loopruntime.workload.critical
      rules:
        # F1-C6: CrashLoopBackOff persisting for 30+ minutes — critical escalation
        - alert: LoopRuntimeAppCrashLoopCritical
          expr: |
            max by (namespace, pod) (
              kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}
            ) * on(namespace) group_left()
            kube_namespace_labels{label_runtime_getloopscale_com_managed_by="environment-controller"}
            > 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "App pod {{ $labels.pod }} in {{ $labels.namespace }} crash-looping for 30+ minutes"
            description: "Pod has been crash-looping for 30+ minutes. Actively consuming cluster resources with zero value. May affect other tenants."
            runbook: "Immediate action required. Contact tenant owner. If unreachable, consider rollback via API. This pod is wasting cluster resources."

    # ═══════════════════════════════════════
    # SLO Alerts (Sprint 4 — Observability)
    # ═══════════════════════════════════════

    - name: loopruntime.slos
      rules:
        - alert: LoopRuntimeQueueSlow
          expr: histogram_quantile(0.95, sum(rate(loopruntime_build_duration_seconds_bucket{status="succeeded"}[1h])) by (le)) > 300
          for: 10m
          labels:
            severity: warning
            slo: "true"
          annotations:
            summary: "Build duration p95 exceeds 5min SLO"
            runbook: "docs/runbooks.md"
            description: "Build duration (p95) has been above 300s for 10 minutes. SLO target: <300s."

        - alert: LoopRuntimeDeployFailureRate
          expr: (sum(rate(loopruntime_builds_total{status="failed"}[24h])) / sum(rate(loopruntime_builds_total[24h]))) > 0.1
          for: 30m
          labels:
            severity: warning
            slo: "true"
          annotations:
            summary: "Deploy failure rate exceeds 10% (24h rolling)"
            runbook: "docs/runbooks.md"
            description: "Deploy success rate dropped below 90% over the last 24 hours. SLO target: >90%."

        - alert: LoopRuntimeLockContention
          expr: histogram_quantile(0.95, sum(rate(loopruntime_lock_hold_duration_seconds_bucket[5m])) by (le)) > 2
          for: 5m
          labels:
            severity: warning
            slo: "true"
          annotations:
            summary: "Lock hold duration p95 exceeds 2s SLO"
            runbook: "docs/runbooks.md"
            description: "Environment lock hold time (p95) above 2s for 5 minutes. SLO target: <2s."

        - alert: LoopRuntimeSyncSlow
          expr: histogram_quantile(0.95, sum(rate(loopruntime_deploy_duration_seconds_bucket[1h])) by (le)) > 600
          for: 10m
          labels:
            severity: warning
            slo: "true"
          annotations:
            summary: "End-to-end deploy duration p95 exceeds 10min"
            runbook: "docs/runbooks.md"
            description: "Full deploy cycle (build + sync) p95 above 600s for 10 minutes. SLO target: <600s."

        - alert: LoopRuntimeBuildQueueSlow
          expr: loopruntime_build_queue_depth > 5
          for: 5m
          labels:
            severity: warning
            slo: "true"
          annotations:
            summary: "Build queue depth exceeds 5"
            runbook: "docs/runbooks.md"
            description: "More than 5 builds waiting in QUEUED state for over 5 minutes."

        # MEET-040: Traefik error rate monitoring.
        - alert: LoopRuntimeTraefikHighErrorRate
          expr: sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) / sum(rate(traefik_service_requests_total[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Traefik 5xx error rate > 5%"
            description: "Traefik is returning 5xx errors on more than 5% of requests for 5+ minutes."
            runbook: "Check backend service health. Review Traefik access logs. Check IngressRoute configuration for misrouted paths."

        - alert: LoopRuntimeBuildTenantSaturated
          expr: increase(loopruntime_build_tenant_backpressure_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Tenant hitting build concurrency limit"
            description: "Tenant {{ $labels.tenant }} has builds deferred due to per-tenant concurrency limit for 5+ minutes."
            runbook: "This means the tenant is submitting builds faster than they complete. Check if builds are stuck. Consider increasing MAX_CONCURRENT_BUILDS_PER_TENANT if the tenant has a legitimate burst workload."

        - alert: LoopRuntimeCFKVDriftDetected
          expr: loopruntime_cfkv_drift_detected == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Cloudflare KV state diverges from database"
            description: "KV routing table has entries that don't match the expected state from the database for 10+ minutes."
            runbook: "Check API leader pod logs for 'kv reconciler: drift detected'. Missing entries mean static apps aren't routable. Extra entries mean stale routes still serving old content. Manual fix: re-deploy affected static apps or clean stale KV entries via CF dashboard."

        # P2-9: DB pool saturation — early warning before connection exhaustion
        - alert: LoopRuntimeDBPoolSaturation
          expr: (loopruntime_postgres_connections_active / loopruntime_postgres_pool_max_conns) > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL connection pool >80% utilized"
            description: "{{ $value | humanizePercentage }} of pool connections are active for 5+ minutes. Approaching exhaustion."
            runbook: "Check loopruntime_postgres_pool_acquire_duration_seconds for increased wait times. If sustained, increase DB_MAX_CONNS or investigate slow queries via pg_stat_statements."
