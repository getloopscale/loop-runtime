# Chaos engineering PrometheusRule — active-execution-plan §3.A.5 (iter 3)
#
# Per ADR D4 (chaos-mesh-experiments-plan superseded; pattern preserved in
# active-execution-plan.md): chaos experiments set a Prometheus label
# `loopruntime_chaos_active=1` via a ConfigMap-derived recording rule. SLO alerts
# that fire during scheduled chaos windows are suppressed using
# `unless loopruntime_chaos_active == 1` so PagerDuty doesn't page during
# expected degradation.
#
# This file:
#   1. Defines the `loopruntime_chaos_active` recording rule (reads a sentinel
#      label from `loopruntime-chaos-window` ConfigMap in loopruntime-system namespace).
#   2. Provides two example chaos-window alerts that VALIDATE the inhibit
#      pattern — they fire only OUTSIDE chaos windows when SLO breached.
#   3. Provides one chaos-INSIDE-window alert that captures runaway chaos
#      (chaos active for > 1h = forgot to stop = bug).
#
# The chaos test framework toggles loopruntime-chaos-window ConfigMap on/off
# at scenario start/end (planned for §3.B integration test).
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loopruntime-chaos-rules
  namespace: loopruntime-system
  labels:
    app: loopruntime
    role: alert-rules
    prometheus: kube-prometheus
    release: monitoring
    runtime.getloopscale.com/task: 3.A.5
    runtime.getloopscale.com/plan: active-execution-plan
spec:
  groups:
    - name: loopruntime.chaos.recording
      interval: 30s
      rules:
        # Recording rule: loopruntime_chaos_active is 1 when a ConfigMap with
        # annotation `runtime.getloopscale.com/chaos-window=active` exists; else 0.
        #
        # Implementation: kube-state-metrics exposes
        # kube_configmap_annotations{annotation_runtime_getloopscale_com_chaos_window=...}.
        # We project that into a binary signal usable in `unless` clauses.
        - record: loopruntime_chaos_active
          expr: |
            max(
              kube_configmap_annotations{
                namespace="loopruntime-system",
                configmap="loopruntime-chaos-window",
                annotation_runtime_getloopscale_com_chaos_window="active"
              }
            ) or vector(0)

    - name: loopruntime.chaos.slo-inhibits
      interval: 1m
      rules:
        # Sample inhibit pattern — admission rate-of-rejections is a typical
        # SLO that chaos pods would breach legitimately. During chaos this
        # alert is suppressed; outside chaos it fires normally.
        - alert: AdmissionDeniedRateHigh_OutsideChaos
          expr: |
            (
              sum(rate(loopruntime_admission_denied_total[5m])) > 0.1
            )
            unless on() loopruntime_chaos_active == 1
          for: 5m
          labels:
            severity: warning
            runtime_getloopscale_com_inhibit_during_chaos: "true"
          annotations:
            summary: Admission denial rate elevated outside chaos window
            runbook: "docs/runbooks.md"
            description: |
              `loopruntime_admission_denied_total` rate > 0.1/s sustained 5m.
              Chaos window NOT active (loopruntime_chaos_active=0). Investigate
              policy-controller logs OR rollback recent deny-mode change.

        # Sample inhibit pattern — PG circuit breaker open is normal during
        # chaos (PG storm experiment); abnormal otherwise.
        - alert: PGCircuitBreakerOpen_OutsideChaos
          expr: |
            (
              loopruntime_pg_circuit_breaker_state > 0
            )
            unless on() loopruntime_chaos_active == 1
          for: 3m
          labels:
            severity: critical
            runtime_getloopscale_com_inhibit_during_chaos: "true"
          annotations:
            summary: PG circuit breaker open outside chaos window
            runbook: "docs/runbooks.md"
            description: |
              Connection pool saturated (>90%) and rejecting mutations.
              No chaos window active — this is a real saturation incident.

    - name: loopruntime.chaos.runaway
      interval: 1m
      rules:
        # Safety alert: chaos window stuck open for > 1h means the test
        # framework forgot to clear loopruntime-chaos-window ConfigMap. SLOs
        # are inhibited which is a security/observability hole.
        - alert: ChaosWindowStuckOpen
          expr: |
            (loopruntime_chaos_active == 1)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Chaos window active for >1h — forgot to clear?
            runbook: "docs/runbooks.md"
            description: |
              `loopruntime_chaos_active` has been 1 for over an hour. All
              chaos-inhibited SLO alerts are suppressed. Clear the
              `loopruntime-chaos-window` ConfigMap annotation OR delete the
              ConfigMap to restore SLO visibility.
