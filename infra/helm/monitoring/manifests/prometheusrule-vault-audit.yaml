# SPDX-License-Identifier: Apache-2.0
# T8.4 of plan 2026-06-02-openbao-adoption v1.3 — 4 P1 alerts per Q14.
#
# Vault audit + auth + uptime alerting. These are intentionally tight
# because Vault is now the cryptographic root for LoopZero: any auth failure
# spike, policy denial spike, or audit log silence is a potential
# compromise indicator.
#
# Routing:
#   severity=critical → P1 oncall (immediate page)
#   severity=warning  → triage queue (Slack #loopzero-alerts)
#
# These rules expect Prometheus to scrape OpenBao's /v1/sys/metrics endpoint
# (Prometheus-format; configured via openbao server { telemetry { prometheus_retention_time } })
# AND parse audit log entries via Loki labels (see T8.2 promtail config).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vault-audit-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/part-of: loopzero-platform
    loopzero.io/related-plan: "2026-06-02-openbao-adoption v1.3 T8.4"
spec:
  groups:
    - name: vault-audit-p1
      interval: 30s
      rules:
        # Alert 1: Vault auth failure rate spike — possible brute force /
        # leaked SA token / misconfigured workload retry storm.
        - alert: VaultAuthFailureRateHigh
          expr: |
            sum(rate(vault_audit_log_request_count{type="failure",path=~"auth/.+"}[5m])) by (path)
            >
            (10 / 60)
          for: 5m
          labels:
            severity: critical
            team: platform-security
            domain: vault
          annotations:
            summary: "Vault auth failure rate > 10/min on {{ $labels.path }}"
            description: |
              The Vault auth method at path `{{ $labels.path }}` is rejecting
              more than 10 logins per minute over 5min. Possible causes:
              (a) brute force against k8s SA tokens,
              (b) leaked tokenReviewerJwt enabling forged SA tokens,
              (c) misconfigured workload in retry loop.
              Triage: `bao audit list`, `bao audit-device read`, and grep
              recent audit log entries by source addr.
            runbook_url: "https://docs.loopzero.example/runbooks/vault-auth-failure-spike"

        # Alert 2: Policy denial rate spike — workload attempting paths
        # outside its policy. Could be configuration drift or compromise.
        - alert: VaultPolicyDenialRateHigh
          expr: |
            sum(rate(vault_audit_log_response_count{response_type=~"permission.denied"}[5m])) by (request_path)
            >
            (5 / 60)
          for: 5m
          labels:
            severity: critical
            team: platform-security
            domain: vault
          annotations:
            summary: "Vault policy denial rate > 5/min for {{ $labels.request_path }}"
            description: |
              Policy denials at `{{ $labels.request_path }}` exceed 5/min over
              5min. Indicates a workload attempting paths outside its policy
              (legitimate misconfig OR adversary exploring scope).
              Triage: identify workload via audit log accessor; verify policy
              attached to its role; check for recent role changes.
            runbook_url: "https://docs.loopzero.example/runbooks/vault-policy-denial-spike"

        # Alert 3: Vault sealed (engine down) — emergency. All loopzero-api
        # workloads using K8s auth login will fail; cached secrets continue
        # serving but no rotation possible.
        - alert: VaultSealedOrDown
          expr: |
            vault_core_unsealed{job="openbao"} == 0
            or
            absent(vault_core_unsealed{job="openbao"})
          for: 1m
          labels:
            severity: critical
            team: platform-security
            domain: vault
          annotations:
            summary: "OpenBao Vault is sealed OR scrape down"
            description: |
              vault_core_unsealed=0 (sealed) OR the metrics scrape itself is
              absent (Vault pod down / network partition). Either way, all
              new Vault operations fail. loopzero-api fallback: serve cached
              secrets from pkg/vault.CachedClient (no rotation possible).
              Triage: `kubectl -n vault-system get pods openbao-0` + check
              for recent restart events. Unseal procedure: see runbook.
            runbook_url: "https://docs.loopzero.example/runbooks/vault-sealed"

        # Alert 4: Audit log stalled (no entries appended in 10min on a
        # Vault that has had recent traffic). Audit log silence is the
        # canonical adversary signal — tampering with audit device to
        # hide subsequent operations.
        - alert: VaultAuditLogStalled
          expr: |
            (
              sum(rate(vault_audit_log_request_count[1m])) > 0
            )
            and
            (
              (time() - vault_audit_log_entry_timestamp_seconds) > 600
            )
          for: 5m
          labels:
            severity: critical
            team: platform-security
            domain: vault
            invariant: "audit-log-must-flow"
          annotations:
            summary: "OpenBao audit log silent > 10min despite active traffic"
            description: |
              Vault is processing requests (vault_audit_log_request_count > 0)
              but no audit log entries have been appended for 10+ minutes.
              This is a HIGH-CONFIDENCE adversary signal — audit device may
              have been disabled or tampered with to hide subsequent operations.
              Triage: `bao audit list` (verify all expected devices still
              enabled); check Vault file/syslog audit device target writable;
              compare /v1/sys/health to audit emit counter.
            runbook_url: "https://docs.loopzero.example/runbooks/vault-audit-stalled"
