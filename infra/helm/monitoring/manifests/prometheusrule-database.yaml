# Database alerting rules for LoopZero platform (MEET-2026-03-31-024 Phase 1 Track C).
# Monitors PostgreSQL health: connection pool, query performance, transactions, errors, RLS.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loopzero-database-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: loopzero.database.warning
      rules:
        # Track C Rule 1: Pool exhaustion approaching — 80% of max connections used
        - alert: LoopZeroDBPoolNearExhaustion
          expr: loopzero_postgres_connections_active / 25 > 0.8
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL connection pool usage above 80%"
            description: "{{ $value | humanizePercentage }} of the 25-connection pool is in use for 2+ minutes. Approaching exhaustion."
            runbook: "Check for long-running transactions or leaked connections. Review API pod count — each pod holds connections. Consider increasing pool size if load is legitimate."

        # Track C Rule 3: Slow queries — p95 query duration exceeds 500ms
        - alert: LoopZeroDBSlowQueries
          expr: histogram_quantile(0.95, sum(rate(loopzero_postgres_query_duration_seconds_bucket[5m])) by (le)) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL query duration p95 exceeds 500ms"
            description: "Database query latency (p95) has been above 500ms for 5 minutes. May indicate missing indexes, table bloat, or lock contention."
            runbook: "Check pg_stat_statements for top queries by mean_exec_time. Look for sequential scans on large tables. Verify advisory lock contention via loopzero_lock_hold_duration_seconds."

        # Track C Rule 4: Long-running transactions — active transaction older than 30s
        # T1.2 / VAL-001: loopzero_postgres_longest_transaction_seconds not emitted
        # by any Go code; needs PG exporter integration.
        - alert: LoopZeroDBLongTransaction
          expr: vector(0) > 1  # ORPHAN: loopzero_postgres_longest_transaction_seconds not emitted
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL transaction running for {{ $value | humanizeDuration }}"
            description: "A transaction has been active for more than 30 seconds. Long transactions hold advisory locks, block vacuuming, and can cause connection pool starvation."
            runbook: "Identify the long transaction via pg_stat_activity. Check if a build orchestration is stuck. If the API pod crashed mid-transaction, the connection should be reclaimed by pgx pool timeout."

        # Track C Rule 6: RLS denial detection — queries returning 0 rows when > 0 expected
        # T1.2 / VAL-001: loopzero_postgres_rls_denial_total not emitted (RLS
        # not implemented in operators scope).
        - alert: LoopZeroDBRLSDenialDetected
          expr: vector(0) > 1  # ORPHAN: loopzero_postgres_rls_denial_total not emitted
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "RLS denial detected — {{ $value }} queries returned 0 rows unexpectedly"
            description: "Application-level metric detected queries that returned 0 rows when at least 1 was expected. This may indicate a row-level security policy blocking legitimate access or a tenant isolation breach attempt."
            runbook: "Check API logs for the denied queries. Verify tenant_id in the request context matches the data being accessed. If legitimate, review RLS policies. If unauthorized, escalate as security incident."

    - name: loopzero.database.critical
      rules:
        # Track C Rule 2: Pool exhaustion imminent — 95% of max connections used
        - alert: LoopZeroDBPoolExhaustion
          expr: loopzero_postgres_connections_active / 25 > 0.95
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL connection pool at 95%+ — exhaustion imminent"
            description: "{{ $value | humanizePercentage }} of the 25-connection pool is in use. New requests will fail with connection timeout."
            runbook: "Immediate action: check for leaked connections (pg_stat_activity idle in transaction). Kill long-running idle transactions if safe. Scale down non-critical API consumers. If pool is legitimately full, increase max_connections and pool size."

        # Track C Rule 5: Query error rate spike — sudden increase in PG errors
        # T1.2 / VAL-001: loopzero_postgres_errors_total not emitted (PG exporter
        # not configured; api/internal/db doesn't track aggregate error counter).
        - alert: LoopZeroDBErrorRateSpike
          expr: vector(0) > 1  # ORPHAN: loopzero_postgres_errors_total not emitted
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL error rate spike — {{ $value }} errors in 5 minutes"
            description: "Sudden increase in database errors. May indicate connection failures, schema issues, disk full, or PostgreSQL instability."
            runbook: "Check PostgreSQL pod logs for error details. Verify disk usage (PVC). Check if a migration ran recently. If connection errors, verify network between API and PostgreSQL. If permission errors, check role grants."

        # Compound: Pool exhausted AND long transactions — likely deadlock or stuck build
        # T1.2 / VAL-001: depends on loopzero_postgres_longest_transaction_seconds
        # which is not emitted. Compound rule disabled until histogram lands.
        - alert: LoopZeroDBPoolExhaustedWithLongTx
          expr: vector(0) > 1  # ORPHAN: loopzero_postgres_longest_transaction_seconds not emitted
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Pool exhausted with transaction running for {{ $labels.longest_tx }}+ seconds"
            description: "Connection pool is at 95%+ capacity AND a transaction has been running for 60+ seconds. This combination typically indicates a stuck build orchestration or advisory lock deadlock."
            runbook: "Identify the long transaction via pg_stat_activity. If it is an orphaned advisory lock from a crashed API pod, terminate the backend (pg_terminate_backend). Verify API pod health. Check build reconcile loop status."
