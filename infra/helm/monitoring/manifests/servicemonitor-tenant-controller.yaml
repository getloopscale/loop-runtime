# ServiceMonitor for Tenant Controller (kubebuilder operator).
# Scrapes controller-runtime metrics: reconciliation duration, errors, queue depth.
# Requires a Service exposing port 8080 with label app: tenant-controller.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loopzero-tenant-controller
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - loopzero-system
  selector:
    matchLabels:
      app: tenant-controller
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
