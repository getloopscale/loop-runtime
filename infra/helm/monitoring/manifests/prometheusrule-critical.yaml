# Critical alerting rules for LoopZero platform (spec §15.5).
# These indicate service-impacting issues requiring immediate attention.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loopzero-critical-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: loopzero.critical
      rules:
        - alert: LoopZeroDriftDetected
          expr: loopzero_drift_detected == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Drift detected in {{ $labels.tenant }}/{{ $labels.env }}"
            description: "Cluster state diverges from desired state in Git for more than 5 minutes."
            runbook: "Check ArgoCD sync status. If auto-sync is enabled, investigate why it failed. If manual sync, trigger sync via API."

        - alert: LoopZeroBuildClusterUnreachable
          expr: up{job="argo-workflows"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Build cluster is unreachable"
            description: "Argo Workflows controller in the build cluster has been down for more than 2 minutes. No new builds can start."
            runbook: "Check k3d-loopzero-build cluster health. Verify argo-workflows pods are running. Check network connectivity between clusters."

        - alert: LoopZeroPostgresDown
          expr: pg_up == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL is down"
            description: "PostgreSQL has been unreachable for more than 1 minute. All mutations are blocked."
            runbook: "Check PostgreSQL pod status. Verify PVC is bound. Check pod logs for crash reasons."

        - alert: LoopZeroPostgresBackupStale
          expr: time() - pg_last_backup_timestamp > 90000
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL backup is stale (>25h)"
            description: "Last PostgreSQL backup is older than 25 hours. Data loss risk in case of failure."
            runbook: "Check backup CronJob status. Verify MinIO connectivity. Trigger manual backup."

        - alert: LoopZeroGiteaDown
          expr: up{job=~".*gitea.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Gitea is down"
            description: "Gitea has been unreachable for more than 2 minutes. Builds cannot clone source code. GitOps pushes will fail."
            runbook: "Check Gitea pod status. Verify PVC is bound. Check pod logs. If data loss, restore from MinIO backup (RPO: 6h)."

        - alert: LoopZeroGiteaBackupStale
          expr: time() - loopzero_gitea_last_backup_timestamp > 25200
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Gitea backup is stale (>7h)"
            description: "Last Gitea git bundle backup is older than 7 hours. RPO exceeded."
            runbook: "Check Gitea backup CronJob. Verify MinIO connectivity. Trigger manual git bundle."

        - alert: LoopZeroArgoCDCircuitOpen
          expr: loopzero_argocd_circuit_state == 1
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "ArgoCD circuit breaker is OPEN"
            description: "ArgoCD health gate tripped after 3 consecutive failures. New deployments are rejected with 503."
            runbook: "Check ArgoCD server and controller health. Once ArgoCD recovers, circuit will close after 2 consecutive successful checks."

        - alert: LoopZeroGitMirrorExhausted
          expr: loopzero_git_desired_state_divergence == 1 and on(tenant, env) loopzero_git_mirror_status{status="FAILED"} == 1
          for: 3h
          labels:
            severity: critical
          annotations:
            summary: "Git mirror retry exhausted for {{ $labels.tenant }}/{{ $labels.env }}"
            description: "Git desired state diverges AND mirror has been FAILED for 3+ hours. All retries exhausted."
            runbook: "Fix Gitea. Then trigger manual mirror sync via API. If Gitea is up, investigate why mirror push fails."

        - alert: LoopZeroFallbackStuck
          expr: loopzero_fallback_active == 1 and on(tenant, env) loopzero_git_mirror_status{status="FAILED"} == 1
          for: 3h
          labels:
            severity: critical
          annotations:
            summary: "Fallback stuck for {{ $labels.tenant }}/{{ $labels.env }}"
            description: "Emergency fallback deployment is active but Git mirror has been FAILED for 3+ hours."
            runbook: "Fix Gitea. Retry mirror. Once mirror succeeds, auto-sync re-enables and fallback clears automatically."

        - alert: LoopZeroBuildEgressStale
          expr: loopzero_build_egress_connectivity == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Build pods cannot reach required services"
            description: "Build pods failing DNS/connection to Gitea/MinIO/registry for 5+ minutes."
            runbook: "Check NetworkPolicy in build namespace. Verify Service endpoints for Gitea, MinIO, and registry."

        - alert: LoopZeroBreakGlassAccess
          expr: loopzero_break_glass_sessions_active > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Break-glass access session active"
            description: "Emergency direct cluster access is in use. Requires post-incident review within 24 hours."
            runbook: "Verify the break-glass session is authorized. Document the incident. Schedule post-incident review."
