# Critical alerting rules for LoopRuntime platform (spec §15.5).
# These indicate service-impacting issues requiring immediate attention.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loop-runtime-critical-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: loop-runtime.critical
      rules:
        - alert: LoopRuntimeDriftDetected
          expr: loop_runtime_drift_detected == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Drift detected in {{ $labels.tenant }}/{{ $labels.env }}"
            description: "Cluster state diverges from desired state in Git for more than 5 minutes."
            runbook: "Check ArgoCD sync status. If auto-sync is enabled, investigate why it failed. If manual sync, trigger sync via API."

        - alert: LoopRuntimeBuildClusterUnreachable
          expr: up{job="argo-workflows"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Build cluster is unreachable"
            description: "Argo Workflows controller in the build cluster has been down for more than 2 minutes. No new builds can start."
            runbook: "Check k3d-loop-runtime-build cluster health. Verify argo-workflows pods are running. Check network connectivity between clusters."

        - alert: LoopRuntimePostgresDown
          expr: pg_up == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL is down"
            description: "PostgreSQL has been unreachable for more than 1 minute. All mutations are blocked."
            runbook: "Check PostgreSQL pod status. Verify PVC is bound. Check pod logs for crash reasons."

        - alert: LoopRuntimePostgresBackupStale
          expr: time() - pg_last_backup_timestamp > 90000
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL backup is stale (>25h)"
            description: "Last PostgreSQL backup is older than 25 hours. Data loss risk in case of failure."
            runbook: "Check backup CronJob status. Verify MinIO connectivity. Trigger manual backup."

        - alert: LoopRuntimeGiteaDown
          expr: up{job=~".*gitea.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Gitea is down"
            description: "Gitea has been unreachable for more than 2 minutes. Builds cannot clone source code. GitOps pushes will fail."
            runbook: "Check Gitea pod status. Verify PVC is bound. Check pod logs. If data loss, restore from MinIO backup (RPO: 6h)."

        # ORPHAN alert removed by velero-backup-dr-plan v1.0 / T3.1.
        # The legacy `LoopRuntimeGiteaBackupStale` rule referenced a metric
        # (`loop_runtime_gitea_last_backup_timestamp`) that was never emitted.
        # Replaced by `LoopRuntimeVeleroBackupStale` in
        # infra/helm/monitoring/manifests/prometheusrule-velero.yaml,
        # which covers Gitea AND every other scheduled scope (CRDs,
        # ArgoCD, Secrets, full snapshot) via velero_backup_*.

        - alert: LoopRuntimeArgoCDCircuitOpen
          expr: loop_runtime_argocd_circuit_state == 1
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "ArgoCD circuit breaker is OPEN"
            description: "ArgoCD health gate tripped after 3 consecutive failures. New deployments are rejected with 503."
            runbook: "Check ArgoCD server and controller health. Once ArgoCD recovers, circuit will close after 2 consecutive successful checks."

        - alert: LoopRuntimeTraefikDown
          expr: absent(up{job=~".*traefik.*"} == 1)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Traefik ingress controller is down"
            description: "Traefik has been unreachable for 1+ minutes. ALL platform traffic (dashboard, API, auth, CLI) is blocked."
            runbook: "Check Traefik pod status in loop-runtime-system namespace. Verify PDB (minAvailable: 1). Check node health. Restart deployment if needed."

        # MEET-053 A-05: Cell discovery alert.
        # DynamicRouter with 0 cells = platform-wide outage for all deploy operations.
        - alert: LoopRuntimeCellDiscoveryEmpty
          expr: loop_runtime_cell_discovery_count == 0
          for: 60s
          labels:
            severity: critical
          annotations:
            summary: "Zero cells discovered by DynamicRouter"
            description: "No ClusterCredential CRDs found or all disconnected. All deploy, rollback, and status operations will fail."
            runbook: "1) Check ClusterCredential CRs: kubectl get clustercredentials -n loop-runtime-system. 2) Verify status.connected=true. 3) If missing, check Pulumi bootstrap. 4) Rollback: set LOOP_RUNTIME_SINGLE_CELL=true on loop-runtime-api deployment."

        # Cloudflare Tunnel is the sole ingress path for all user traffic.
        # If disconnected, every deployed app and the platform API become unreachable.
        - alert: LoopRuntimeCFTunnelDisconnected
          expr: absent(cloudflared_tunnel_connections{status="connected"}) or cloudflared_tunnel_connections{status="connected"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Cloudflare Tunnel disconnected — all user traffic blocked"
            runbook: "docs/runbooks.md"
