# Service-auth Ed25519 dual-control PrometheusRule
#
# ADR: decisions/2026-05-13-service-auth-ed25519-adoption.md
# Plan: 2026-05-12-active-execution-plan.md §6.B.5
#
# Watches the 2 counters emitted by api/internal/middleware/service_auth_ed25519.go:
#   - loopruntime_service_auth_signature_present_total{outcome=present|absent}
#   - loopruntime_service_auth_signature_rejected_total{reason=invalid_signature|replay_window|replay_nonce|no_trusted_keys|malformed_input}
#
# Alert taxonomy (3 alerts + 1 cutover-gate recording rule):
#   - LoopRuntimeServiceAuthSignatureUnsignedTraffic — Phase 1 progress tracker.
#     Operator watches this to time the Phase 1 → Phase 2 cutover.
#     Goal: rate goes to zero over 7 days.
#   - LoopRuntimeServiceAuthSignatureForgeryRate — security signal. Non-trivial
#     rate of `invalid_signature` rejects indicates active forgery
#     attempt OR rotation-window mismatch.
#   - LoopRuntimeServiceAuthSignatureNoTrustedKeys — fail-closed misconfig.
#     If ANY signed request fails because the trust set is empty, the
#     operator screwed up the bootstrap. CRITICAL.
#
# Cutover-gate recording rule: loopruntime_service_auth_signature_phase1_ready
#   = 1 when the present rate is 100% over 7 days
#   = 0 otherwise
# Operator dashboard reads this to gate the Phase 2 flip.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loopruntime-service-auth-ed25519
  namespace: loopruntime-system
  labels:
    app: loopruntime
    role: alert-rules
    prometheus: kube-prometheus
    release: monitoring
    runtime.getloopscale.com/task: 6.B.5
    runtime.getloopscale.com/plan: active-execution-plan
spec:
  groups:
    - name: loopruntime.service-auth-ed25519.recording
      interval: 1m
      rules:
        # Phase 1 readiness gate: 100% present rate over the last 7d.
        # Operator dashboard reads this; the value is 1 iff every
        # observed service-auth request in the last 7 days carried a
        # signature header. When 1, the operator may flip
        # LOOPRUNTIME_SERVICE_AUTH_REQUIRE_SIGNATURE=true (Phase 2).
        - record: loopruntime_service_auth_signature_phase1_ready
          expr: |
            (
              sum(rate(loopruntime_service_auth_signature_present_total{outcome="present"}[7d]))
              /
              clamp_min(
                sum(rate(loopruntime_service_auth_signature_present_total[7d])),
                1
              )
            ) >= bool 1.0

        # Last-1h adoption rate. Used by the dashboard for moment-in-
        # time visibility (the 7d rate above moves slowly).
        - record: loopruntime_service_auth_signature_adoption_1h
          expr: |
            sum(rate(loopruntime_service_auth_signature_present_total{outcome="present"}[1h]))
            /
            clamp_min(
              sum(rate(loopruntime_service_auth_signature_present_total[1h])),
              0.001
            )

    - name: loopruntime.service-auth-ed25519.alerts
      interval: 1m
      rules:
        # Phase 1 progress tracker. Fires WARN when unsigned traffic
        # persists past 48h — operator hasn't deployed the cloud
        # signer to all replicas yet. Default Phase 1 window is 2
        # weeks; after that, this alert escalates the conversation.
        - alert: LoopRuntimeServiceAuthSignatureUnsignedTrafficLingering
          expr: |
            sum(rate(loopruntime_service_auth_signature_present_total{outcome="absent"}[1h])) > 0
          for: 48h
          labels:
            severity: warning
            audit: M10-G1
          annotations:
            summary: service-auth unsigned traffic still present after 48h
            description: |
              Some cloud→engine requests still arrive WITHOUT the
              X-LoopRuntime-Signature header. Phase 1 (accept-both) tolerates
              this, but the Phase 1 → Phase 2 cutover (per ADR Q3)
              needs 100% present rate sustained over 7 days.
              Check `cloud` pod logs for "service-auth Ed25519 private
              key not configured" warning; ensure
              LOOPRUNTIME_SERVICE_AUTH_ED25519_PRIVATE_KEY is mounted in all
              cloud replicas.
            runbook: concepts/operations/service-auth-ed25519-rollout-runbook.md

        # Security signal. A non-zero forgery rate over 5min sustained
        # 10min indicates active attack OR rotation window mismatch
        # (caller has stale public key). Reason `invalid_signature`
        # specifically — not `replay_*` which are normal-noise during
        # client-side bugs.
        - alert: LoopRuntimeServiceAuthSignatureForgeryRate
          expr: |
            sum(rate(loopruntime_service_auth_signature_rejected_total{reason="invalid_signature"}[5m])) > 0.01
          for: 10m
          labels:
            severity: critical
            audit: M10-G1
          annotations:
            summary: service-auth signature forgery rate elevated
            description: |
              `loopruntime_service_auth_signature_rejected_total{reason="invalid_signature"}`
              rate > 0.01/s sustained 10m. Possible causes (in order
              of likelihood):
                1. Rotation window mismatch — cloud is signing with
                   key version N, API trust set is at N-1 only.
                   Fix: roll cloud pods OR populate previous public.
                2. Active forgery — attacker has the shared secret but
                   not the Ed25519 private. Page on-call; investigate
                   audit_log for source IP patterns.
                3. Stack drift — different stacks share the cloud→
                   engine path but have different keypairs. Should not
                   happen post-Pulumi-consolidation; if it does,
                   ServiceAuthEd25519 component config is out of sync.
            runbook: concepts/operations/service-auth-ed25519-rollout-runbook.md

        # Fail-closed misconfig. If the API trust set is empty AND a
        # signed request arrives, it gets rejected with
        # `reason="no_trusted_keys"`. This means the operator deployed
        # the cloud signer but did NOT populate the API's
        # LOOPRUNTIME_SERVICE_AUTH_ED25519_PUBLIC_CURRENT env var. Page
        # immediately — the gate is operationally broken.
        - alert: LoopRuntimeServiceAuthSignatureNoTrustedKeys
          expr: |
            sum(rate(loopruntime_service_auth_signature_rejected_total{reason="no_trusted_keys"}[1m])) > 0
          for: 2m
          labels:
            severity: critical
            audit: M10-G1
          annotations:
            summary: service-auth Ed25519 trust set is empty — fail-closed rejecting signed requests
            description: |
              API received signed requests but
              `ServiceAuthEd25519PublicKeys` is empty — every signed
              request is being rejected. Either:
                1. ESO has not yet synced
                   `loopruntime-service-auth-ed25519-pub` Secret. Check
                   ExternalSecret status: kubectl get externalsecret
                   loopruntime-service-auth-ed25519-pub -n loopruntime-system.
                2. Pulumi component was not invoked (set
                   serviceAuthEd25519Enabled=true + run pulumi up).
                3. LOOPRUNTIME_SERVICE_AUTH_ED25519_PUBLIC_CURRENT was set to
                   garbage and the loader fell back to empty rather
                   than crashing (would only happen if env was set
                   then cleared — unusual).
            runbook: concepts/operations/service-auth-ed25519-rollout-runbook.md

        # Replay-attack telemetry. Non-zero `replay_nonce` rate over
        # 5min is unusual (clients shouldn't reuse nonces); over 10min
        # sustained suggests either a buggy client OR replay attempt.
        - alert: LoopRuntimeServiceAuthReplayNonceRate
          expr: |
            sum(rate(loopruntime_service_auth_signature_rejected_total{reason="replay_nonce"}[5m])) > 0.01
          for: 10m
          labels:
            severity: warning
            audit: M10-G1
          annotations:
            summary: service-auth nonce replay rate elevated
            runbook: "docs/runbooks.md"
            description: |
              Clients are reusing (user_id, nonce) tuples within the
              5-min TTL window. Either a client-side bug (nonce RNG
              broken) OR a replay attempt. Check
              `loopruntime_service_auth_signature_rejected_total{reason="replay_nonce"}`
              by source pod label to identify the buggy caller.
