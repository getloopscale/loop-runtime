# ServiceMonitor for OpenTelemetry Collector metrics (Phase 1A observability).
# Enables Prometheus to scrape OTel Collector self-telemetry for pipeline health alerts.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loopruntime-otel-collector
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - loopruntime-system
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
