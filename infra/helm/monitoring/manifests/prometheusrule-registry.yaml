# Registry alerting rules for LoopZero platform (MEET-2026-04-11-048 Phase 5).
# Harbor registry health, latency, storage, and dependency monitoring.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loopzero-registry-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: loopzero.registry
      rules:

        - alert: LoopZeroRegistryPushLatencyHigh
          expr: histogram_quantile(0.95, rate(harbor_core_http_request_duration_seconds_bucket{operation="push"}[5m])) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Registry push p95 latency exceeds 5 seconds"
            description: "Harbor push latency (p95) has been above 5 seconds for 5 minutes. Builds may time out during image push."
            runbook: "Check Harbor core pod resources. Verify S3 backend latency (DO Spaces). Check network between build cluster and Harbor. Large images may need layer caching optimization."

        # Pull latency affects deploy time directly (kubelet image pull).
        - alert: LoopZeroRegistryPullLatencyHigh
          expr: histogram_quantile(0.95, rate(harbor_core_http_request_duration_seconds_bucket{operation="pull"}[5m])) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Registry pull p95 latency exceeds 3 seconds"
            description: "Harbor pull latency (p95) has been above 3 seconds for 5 minutes. Deployments may be slow to start."
            runbook: "Check Harbor core pod resources. Verify S3 backend latency. Consider enabling registry proxy cache if pulling from external registries."

        # Harbor project quota metrics. Falls back to harbor_project_total_storage_byte
        # if harbor_project_quota_usage_byte is not available in the Harbor version.
        - alert: LoopZeroRegistryStorageHigh
          expr: harbor_project_quota_usage_byte / harbor_project_quota_hard_byte > 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Harbor project {{ $labels.project_name }} storage exceeds 80% of quota"
            description: "Project {{ $labels.project_name }} has used {{ $value | humanizePercentage }} of its storage quota for 15+ minutes."
            runbook: "Run Harbor GC to reclaim untagged artifacts. Review tenant image retention policy. Consider increasing project quota if legitimate growth."

        # Harbor GC runs as a scheduled job. If it stops completing, untagged blobs accumulate.
        # Fallback: if harbor_gc_last_completion_timestamp is not available, use
        #   absent(harbor_gc_duration_seconds) to detect missing GC runs.
        - alert: LoopZeroRegistryGCStale
          expr: time() - harbor_gc_last_completion_timestamp > 86400
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Harbor GC has not completed in 24 hours"
            description: "Garbage collection has not run successfully in over 24 hours. Untagged artifacts are accumulating and consuming storage."
            runbook: "Check Harbor jobservice pod health. Verify GC schedule in Harbor system settings. Trigger manual GC via Harbor admin UI if needed."

        # Harbor uses a dedicated PostgreSQL database (harbor_db).
        # The pg_stat_activity metric is exposed by the PostgreSQL exporter already in the monitoring stack.
        # Cap is 10 connections for harbor_db; alert at 80% (8 connections).
        - alert: LoopZeroRegistryPGConnections
          expr: pg_stat_activity_count{datname="harbor_db"} > 8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Harbor database connections exceed 80% of cap ({{ $value }}/10)"
            description: "Harbor database has {{ $value }} active connections for 5+ minutes. Connection exhaustion will cause Harbor API failures."
            runbook: "Check Harbor core replica count (each replica holds connections). Verify no long-running queries via pg_stat_activity. Consider increasing max_connections for harbor_db if Harbor is scaled up."
