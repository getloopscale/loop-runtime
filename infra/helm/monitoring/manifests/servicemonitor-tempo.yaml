# ServiceMonitor for Grafana Tempo trace backend (C1 — MEET-2026-03-30-020)
# Enables Prometheus to scrape Tempo metrics for alerting and dashboards.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loopruntime-tempo
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - loopruntime-system
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
