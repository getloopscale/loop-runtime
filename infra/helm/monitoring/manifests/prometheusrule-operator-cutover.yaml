# CHG-2026-04-30-INFRA-NORMALIZE / Phase 2 condition C15.
# Source: docs/decisions.md
#
# 24h post-cutover restart watcher. Alerts if any of the 4 split
# operator deployments restarts > 5 times in a 24h window after the
# topology cutover. Fires during the post-cutover soak (Step 5 of
# operator-cutover-runbook.md), pages SRE on-call.
#
# This is the "blocks T2.5 deferred chart cleanup" gate (condition C15
# spec): the monolith chart files MUST stay in tree until 30 days of
# silence on this alert. Removing them earlier removes the rollback
# escape hatch and breaks operator-cutover-rollback.sh.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loopzero-operator-cutover-alerts
  namespace: monitoring
  labels:
    release: monitoring
    loopzero.io/component: operator-split
spec:
  groups:
    - name: loopzero.operator-cutover
      rules:
        # Restart rate watcher per split operator deployment. The metric
        # `kube_pod_container_status_restarts_total` is provided by
        # kube-state-metrics; alert sums per Deployment over 24h.
        - alert: ZeroReadyOperatorWindow
          expr: |
            sum by (deployment) (
              kube_deployment_status_replicas_ready{
                namespace="loopzero-system",
                deployment=~"loopzero-(tenant|app|preview|platform)-operator"
              }
            ) == 0
          for: 30s
          labels:
            severity: critical
            loopzero_component: operator-split
            loopzero_phase: cutover-active
          annotations:
            summary: "Zero-Ready window for {{ $labels.deployment }} > 30s"
            runbook: "docs/runbooks.md"
            description: |
              {{ $labels.deployment }} has 0 Ready replicas for >30s.
              Per Invariant I-2 (LeaderElection) + production-design
              veto C6, the cutover MUST NOT produce a window where 0
              reconcilers run > 30s. This alert is the executable
              version of that invariant.

              If during cutover: rollback IMMEDIATELY via
              `bash infra/scripts/operator-cutover-rollback.sh <ctx>`.
              If outside cutover: investigate as a routine OOM /
              CrashLoop; same severity but different urgency.
