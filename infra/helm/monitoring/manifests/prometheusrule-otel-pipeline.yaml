# Alerting rules for OTel Collector pipeline health (Phase 1A observability).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loop-runtime-otel-pipeline-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: loop-runtime.telemetry-pipeline
      rules:
        - alert: LoopRuntimeOTelSpanDropRate
          expr: rate(otelcol_processor_dropped_spans_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OTel Collector dropping spans"
            description: "{{ $value }} spans/s being dropped. Check Collector queue capacity and Tempo health."
            runbook: "Check OTel Collector logs. Verify Tempo is accepting traces. Consider increasing queue size."

        - alert: LoopRuntimeOTelExportFailureRate
          expr: rate(otelcol_exporter_send_failed_spans_total[5m]) / (rate(otelcol_exporter_sent_spans_total[5m]) + rate(otelcol_exporter_send_failed_spans_total[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "OTel Collector export failure rate > 5%"
            description: "{{ $value | humanizePercentage }} of span exports failing."
            runbook: "Check Tempo connectivity. Verify Collector to Tempo network path. Check Tempo disk usage."

        - alert: LoopRuntimeOTelQueueSaturation
          expr: otelcol_exporter_queue_size / otelcol_exporter_queue_capacity > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OTel Collector queue > 80% capacity"
            description: "Exporter queue at {{ $value | humanizePercentage }} capacity."
            runbook: "Increase batch send_batch_size or queue capacity. Check if Tempo is slow."
