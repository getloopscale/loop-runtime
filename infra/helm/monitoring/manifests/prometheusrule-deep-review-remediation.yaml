# Deep Review Remediation — Phase 5 alerts
#
# Implements T5.1, T5.2, T5.3, T5.5, T5.7 (subset) of
# deep-review-remediation-plan by wiring PrometheusRule alerts
# for metrics that previously emitted without an alert ("dark metrics" per
# observability_review.md, find_obs_001 + find_obs_004 + find_secret_skip_no_alert
# + find_cell_fallback_no_metric + find_workqueue_silent_db_errors).
#
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loopzero-deep-review-remediation-alerts
  namespace: monitoring
  labels:
    release: monitoring
    loopzero.io/component: deep-review-remediation
spec:
  groups:
    # === T5.5 — Supply chain (closes find_obs_001 HIGH) ===
    - name: loopzero.supply-chain
      rules:
        - alert: LoopZeroUnsignedReleasePushed
          expr: |
            sum(rate(loopzero_release_signed_total{signed="false"}[5m])) > 0
          for: 2m
          labels:
            severity: warning
            loopzero_component: supply-chain
          annotations:
            runbook_url: "https://github.com/getloopscale/loop-runtime/blob/develop/docs/runbooks.md#loopzerounsignedreleasepushed"
            summary: "Unsigned release pushed to registry"
            description: |
              `loopzero_release_signed_total{signed="false"}` is incrementing,
              meaning at least one release activated an image that was NOT
              cosign-signed. Either cosign signing failed silently in the
              build pipeline or a path bypassed signing. Investigate before
              policy-controller deny-flip (Sprint 9) or these images will
              break deploys.

        - alert: LoopZeroSBOMGenerationStalled
          expr: |
            sum(rate(loopzero_sbom_generated_total[10m])) == 0
            and on() sum(rate(loopzero_release_activated_total[10m])) > 0
          for: 5m
          labels:
            severity: warning
            loopzero_component: supply-chain
          annotations:
            summary: "Releases activating without SBOM generation"
            runbook: "docs/runbooks.md"
            description: |
              Active releases are happening but loopzero_sbom_generated_total
              has not incremented — syft step is silently broken in the
              build pipeline. Provenance for these releases is missing.

        - alert: LoopZeroAttestationSaveFailing
          expr: |
            sum(rate(loopzero_release_attestation_save_fail_total[5m])) > 0
          for: 2m
          labels:
            severity: warning
            loopzero_component: supply-chain
          annotations:
            runbook_url: "https://github.com/getloopscale/loop-runtime/blob/develop/docs/runbooks.md#loopzeroattestationsavefailing"
            summary: "Per-app attestation persistence failing"
            description: |
              loopzero_release_attestation_save_fail_total > 0 in the last 5m.
              The release proceeded (best-effort) but attestation rows
              failed to land in DB. Visibility regression — investigate
              attestation_store before pre-launch security review.

    # === T5.1 — Multi-cell fallback (closes find_cell_fallback_no_metric MEDIUM)
    # Alert + metric pending wire-up of loopzero_cell_fallback_total in T5.1
    # code task. PrometheusRule ships ahead of metric emission (Helm
    # template stays valid even if metric is absent — alert just stays
    # silent until the metric appears).

    # === T5.2 — Secret ESO skip (closes find_secret_skip_no_alert MEDIUM + find_obs_006 HIGH) ===
    - name: loopzero.secrets-eso
      rules:
        - alert: LoopZeroSecretESOSyncSkipped
          expr: |
            sum(rate(loopzero_secret_externalsecret_total{result="skip"}[5m])) > 0
          for: 2m
          labels:
            severity: warning
            loopzero_component: secrets
          annotations:
            runbook_url: "https://github.com/getloopscale/loop-runtime/blob/develop/docs/runbooks.md#loopzerosecretesosyncskipped"
            summary: "loopzero secret set silently no-ops (ESO sync disabled)"
            description: |
              loopzero_secret_externalsecret_total{result="skip"} > 0 means the
              SecretK8sManager was nil at boot (CELL_0_KUBECONFIG mount
              missing or context name drift — see B34). API returns 200 OK
              but writes nothing to the workload cluster — silent data
              loss for tenants.

        - alert: LoopZeroSecretESOSyncFailing
          expr: |
            sum(rate(loopzero_secret_externalsecret_total{result="fail"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
            loopzero_component: secrets
          annotations:
            runbook_url: "https://github.com/getloopscale/loop-runtime/blob/develop/docs/runbooks.md#loopzerosecretesosyncfailing"
            summary: "ExternalSecret CR creation failing >5%"
            description: |
              loopzero_secret_externalsecret_total{result="fail"} rate > 0.05/s
              over 5m — investigate runtime client RBAC or cell-0-cluster
              connectivity.

    # === T5.3 — Workqueue terminal-write fail (closes find_workqueue_silent_db_errors HIGH) ===
    - name: loopzero.workqueue
      rules:
        - alert: LoopZeroWorkqueueTerminalWriteFailed
          expr: |
            sum by (terminal) (rate(loopzero_workqueue_terminal_write_fail_total[5m])) > 0
          for: 2m
          labels:
            severity: warning
            loopzero_component: workqueue
          annotations:
            summary: "Workqueue terminal-state DB write failed (duplicate side-effects risk)"
            runbook: "docs/runbooks.md"
            description: |
              loopzero_workqueue_terminal_write_fail_total{{`{{ $labels.terminal }}`}}
              > 0 — Complete or Fail call returned DB error. If terminal=complete:
              successful handler followed by FAILED Complete write means the
              item will be re-dequeued and the handler will run again,
              producing duplicate side-effects (e.g., duplicate Argo
              Workflow submissions). If terminal=fail: orphan workqueue
              rows accumulate.

    # === T1.5 — CellPinner CR-patch divergence (closes find_arch_005 MEDIUM) ===
    - name: loopzero.cell-pinner
      rules:
        - alert: LoopZeroCellPinnerCRPatchDiverged
          expr: |
            sum(rate(loopzero_cell_pinner_cr_patch_fail_total[5m])) > 0
          for: 2m
          labels:
            severity: warning
            loopzero_component: cell-pinner
          annotations:
            summary: "CellPinner DB ↔ CR diverged — operator patch failed"
            runbook: "docs/runbooks.md"
            description: |
              loopzero_cell_pinner_cr_patch_fail_total > 0 means tenants.cell_id
              was UPDATED in PostgreSQL but the corresponding Tenant CR
              MergePatch FAILED. The operator reads tenant.Spec.CellID from
              the CR, so until the CR is patched manually new
              EnvironmentReconciler operations land on the OLD cell.

    # === T5.7 (subset) — Operator L4 metrics not yet aliased (closes find_obs_004 partial) ===
    - name: loopzero.operator-l4
      rules:
        - alert: LoopZeroTenantDeletionStuck
          expr: |
            sum(rate(loopzero_tenant_deletion_stuck_total[5m])) > 0
          for: 5m
          labels:
            severity: warning
            loopzero_component: tenant-operator
          annotations:
            summary: "Tenant deletion stuck — manual intervention may be required"
            runbook: "docs/runbooks.md"
            description: |
              loopzero_tenant_deletion_stuck_total is incrementing. The tenant
              lifecycle reached a state where automatic deletion cannot
              proceed (likely finalizer holding, or hard cleanup pending
              admin force).

        - alert: LoopZeroMisplacedTenant
          expr: |
            sum(rate(loopzero_misplaced_tenant_total[10m])) > 0
          for: 5m
          labels:
            severity: warning
            loopzero_component: cell-router
          annotations:
            summary: "Tenant resources observed on wrong cell — ADR-0018 violation"
            runbook: "docs/runbooks.md"
            description: |
              loopzero_misplaced_tenant_total > 0 means at least one tenant's
              workload is running on a cluster whose cellID does NOT match
              tenants.cell_id. This is a multi-cell isolation breach. Run
              `loopzero admin tenants pin` to reconcile or escalate.
