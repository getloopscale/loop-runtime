# PrometheusRules for tracing subsystem (C1 — MEET-2026-03-30-020)
# Alerts for Tempo and OTel Collector health.
# "Observability of the observability" — without these, tracing breaks silently.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loop-runtime-tracing
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: loop-runtime-tracing
      rules:
        - alert: LoopRuntimeTempoDown
          expr: 'up{job="tempo"} == 0'
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Grafana Tempo is down"
            description: "Tempo trace backend unreachable for 2+ minutes. Traces are being lost."
            runbook: "Check pod status: kubectl -n loop-runtime-system get pods -l app.kubernetes.io/name=tempo"

        - alert: LoopRuntimeTempoStorageHigh
          expr: |
            kubelet_volume_stats_used_bytes{persistentvolumeclaim=~".*tempo.*"}
            / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".*tempo.*"}
            > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Tempo PVC usage above 80%"
            runbook: "docs/runbooks.md"
            description: "Tempo storage at {{ $value | humanizePercentage }}. Reduce retention or increase PVC."

        - alert: LoopRuntimeOTelCollectorDown
          expr: 'up{job="otel-collector"} == 0'
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "OTel Collector is down"
            description: "OTel Collector unreachable for 2+ minutes. All traces and OTel metrics are being lost."
            runbook: "Check pod: kubectl -n loop-runtime-system get pods -l app.kubernetes.io/name=opentelemetry-collector"

        - alert: LoopRuntimeCollectorExportErrors
          expr: 'increase(otelcol_exporter_send_failed_spans_total[5m]) > 0'
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OTel Collector failing to export spans"
            runbook: "docs/runbooks.md"
            description: "Collector has failed span exports for 5+ minutes. Tempo may be down or unreachable."
