# §6.A.4 Phase 6 Dogfood Gate PrometheusRule
#
# ADR reference: operators-sota-faang-grade-plan Phase 6 (Dogfood Gate).
# Plan: 2026-05-12-active-execution-plan.md §6.A.4.
# Audit gap: M03 (Operators) + M09 (Multi-Cell) — both flagged the
# 4h soak + chaos + SLO P95<705ms as the LIVE evidence pending.
#
# The 4h Dogfood Gate has 3 simultaneous criteria (per CLAUDE.md
# "Operators Phase 6 Dogfood Gate items pendentes"):
#   1. 4h sustained traffic (k6 traffic generator)
#   2. Chaos Mesh injection active (pod kills + IO pressure)
#   3. SLO assertions: rollback P95 < 705ms (the LIVE baseline);
#      API P95 < 500ms; SEV-1 count == 0
#
# This file defines:
#   - Recording rule: loopruntime_dogfood_gate_window_active (boolean — fires
#     1 when a chaos window is active AND the gate ConfigMap exists).
#   - 4 alerts that detect gate violations DURING the 4h window:
#     * Phase6RollbackLatencyExceeds705ms (the critical AUDIT-CITED
#       LIVE baseline)
#     * Phase6APILatencyExceeds500ms (P95 budget violation)
#     * Phase6SEV1Detected (any SEV-1 alert during the window)
#     * Phase6TrafficTooLow (operator forgot to start traffic
#       generator OR generator died — gate evidence would be
#       meaningless)
#
# Inhibit pattern (mirror of chaos-rules): alerts use `unless loopruntime_chaos_active == 1`
# selectively. The rollback + API latency alerts STILL fire during
# chaos (the gate IS testing latency under chaos). Only specific
# alerts that would be 100% false positives during chaos use the
# inhibit clause.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loopruntime-dogfood-slo-gate
  namespace: loopruntime-system
  labels:
    app: loopruntime
    role: alert-rules
    prometheus: kube-prometheus
    release: monitoring
    runtime.getloopscale.com/task: 6.A.4
    runtime.getloopscale.com/plan: active-execution-plan
spec:
  groups:
    - name: loopruntime.dogfood.recording
      interval: 30s
      rules:
        # Phase 6 gate window: 1 when the operator has started the
        # gate (creates ConfigMap `loopruntime-dogfood-gate-window` with
        # annotation `runtime.getloopscale.com/dogfood-window=active`). Used by the
        # 4h-window alerts to scope evaluation.
        - record: loopruntime_dogfood_gate_window_active
          expr: |
            max(
              kube_configmap_annotations{
                namespace="loopruntime-system",
                configmap="loopruntime-dogfood-gate-window",
                annotation_runtime_getloopscale_com_phase6_window="active"
              }
            ) or vector(0)

        # 4h window p95 of rollback duration — projected so the
        # dashboard can render a single timeseries panel.
        - record: loopruntime_phase6_rollback_p95_4h_ms
          expr: |
            histogram_quantile(0.95,
              sum(rate(loopruntime_rollback_duration_seconds_bucket[4h])) by (le)
            ) * 1000

    - name: loopruntime.dogfood.alerts
      interval: 1m
      rules:
        # CRITICAL — the headline SLO of the gate.
        # 705ms is the LIVE pre-soak baseline (audit 2026-05-11
        # §02-api.md line 112). The gate target is "no worse than
        # that under sustained load + chaos".
        - alert: Phase6RollbackLatencyExceeds705ms
          expr: |
            (loopruntime_phase6_rollback_p95_4h_ms > 705)
            AND
            (loopruntime_dogfood_gate_window_active == 1)
          for: 5m
          labels:
            severity: critical
            audit: M03+M09
            phase: dogfood-slo-gate
          annotations:
            summary: Phase 6 gate FAIL — rollback P95 > 705ms (AUDIT baseline) for 5m
            description: |
              `loopruntime_rollback_duration_seconds` p95 over the 4h gate
              window exceeded 705ms (the LIVE baseline observed
              2026-05-02 during cell-1 activation). Sustained for 5m
              means the gate is failing.
              The 4h soak SHOULD be aborted; investigate per the
              dogfood-slo-gate-runbook.md decision tree.
            runbook: concepts/operations/dogfood-slo-gate-runbook.md
