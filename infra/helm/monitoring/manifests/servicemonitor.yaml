# ServiceMonitor instructs Prometheus to scrape the LoopRuntime API /metrics endpoint.
# kube-prometheus-stack auto-discovers ServiceMonitors when the release label matches.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loopruntime-api
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - loopruntime-system
  selector:
    matchLabels:
      app: loopruntime-api
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
