# Alerting rules for blackbox probe results (Phase 1A observability).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loopruntime-probe-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: loopruntime.probes
      rules:
        - alert: LoopRuntimeAPIProbeFailure
          expr: probe_success{job="probe/monitoring/loopruntime-api-probe"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "API probe failed for {{ $labels.instance }}"
            description: "Blackbox probe to {{ $labels.instance }} has been failing for 2+ minutes."
            runbook: "Check target service health. Verify network policies allow probe traffic. Check blackbox-exporter logs."

        - alert: LoopRuntimeTLSCertExpiring
          expr: probe_ssl_earliest_cert_expiry - time() < 604800
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "TLS certificate expiring within 7 days for {{ $labels.instance }}"
            description: "Certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}."
            runbook: "Check cert-manager Certificate resources. Verify ACME issuer is working. Renew manually if needed."

        - alert: LoopRuntimeProbeSlow
          expr: probe_duration_seconds{job=~"probe/monitoring/loopruntime-.*"} > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Probe latency high for {{ $labels.instance }}"
            description: "Probe to {{ $labels.instance }} taking {{ $value }}s (threshold: 10s)."
            runbook: "Check target service performance. Investigate network latency between clusters."
