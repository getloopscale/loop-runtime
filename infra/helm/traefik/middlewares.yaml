# Traefik middlewares available in this cluster.
#
# CORRECTION (#59): this header used to say "applied to ALL tenant IngressRoutes",
# and that was FALSE — and dangerous. Traced in
# api/internal/manifests/renderer_ingress.go, tenant routes (primary and
# custom domains) are rendered WITHOUT a `Middlewares` field. Nothing here is
# applied automatically.
#
# Why the wrong sentence was dangerous, and not just inaccurate: an operator reading
# "applied to all" and seeing it was not applied would tend to "fix" it by
# attaching the CSP middleware to the tenant routes. That would overwrite the
# Content-Security-Policy header of EVERY LoopZeroKit app, which serves a per-request nonce —
# the header would diverge from the body's `<script nonce="...">`, and the browser
# would block every inline script IN SILENCE. No server error, no log.
#
# What the generated routes actually reference: `traefik-rate-limit@kubernetescrd`
# and `traefik-body-limit@kubernetescrd`, by name.
#
# The invariant is locked by `loopruntime-ops quality tenant-csp-passthrough`.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: traefik
spec:
  rateLimit:
    average: 100
    burst: 200
    period: 1s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit
  namespace: traefik
spec:
  buffering:
    # 500 MB — MUST NOT drop below SOURCE_MAX_BUNDLE_SIZE (api/internal/config/config.go).
    # It was 10 MiB while the app accepted 500 MB, and attaching it in that state
    # would have rejected every deploy over 10 MiB at the edge with a 413 the API
    # never sees and cannot explain. That is why rate-limit was attached first and
    # this one waited for the value to be right (SD-14.1, audit 2026-09-07).
    # The coupling is asserted by infra/tests/charts/edge_body_limit_test.go.
    maxRequestBodyBytes: 524288000  # 500 MB
    maxResponseBodyBytes: 0  # unlimited response
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  # RENAMED (#59): it was `security-headers`. The old name described an
  # ambition ("the security headers") and invited exactly the mistake above —
  # who would not want to apply the security headers to everyone? The new name
  # describes the REAL USE: the marketing site, whose Stripe checkout needs
  # `script-src https://js.stripe.com` and which does NOT serve a per-request nonce.
  #
  # This middleware must NOT be attached to a tenant route. See the header.
  name: marketing-site-csp
  namespace: traefik
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    # S2.4: browserXssFilter removed — X-XSS-Protection is deprecated in modern browsers
    # (Chrome removed XSS Auditor in 2019). Rely on CSP instead.
    stsSeconds: 31536000  # 1 year
    stsIncludeSubdomains: true
    # §3.1 + S2.4: Content-Security-Policy with hardened directives.
    # style-src 'unsafe-inline' is required for CSS-in-JS (Tailwind/styled-components).
    # base-uri and form-action restrict base tag injection and form hijacking.
    contentSecurityPolicy: "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.stripe.com https://checkout.stripe.com; frame-src https://checkout.stripe.com https://js.stripe.com; img-src 'self' data: https:; font-src 'self' data:; base-uri 'self'; form-action 'self';"
    customResponseHeaders:
      X-Powered-By: ""  # Remove server fingerprint
