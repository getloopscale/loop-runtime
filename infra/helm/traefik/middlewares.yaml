# Traefik middlewares available in this cluster.
#
# CORRECAO (#59): este cabecalho dizia "applied to ALL tenant IngressRoutes",
# e isso era FALSO — e perigoso. Rastreado em
# api/internal/manifests/renderer_ingress.go, as rotas de tenant (primaria e
# dominios custom) sao renderizadas SEM campo `Middlewares`. Nada aqui e'
# aplicado automaticamente.
#
# Por que a frase errada era perigosa, e nao so' imprecisa: um operador lendo
# "aplicado a todas" e vendo que nao estava aplicado tenderia a "consertar"
# ligando o middleware de CSP as rotas de tenant. Isso sobrescreveria o header
# Content-Security-Policy de TODA app LoopZeroKit, que serve nonce por requisicao —
# o header passaria a divergir do `<script nonce="...">` do corpo, e o browser
# bloquearia todo script inline EM SILENCIO. Sem erro no servidor, sem log.
#
# Quem de fato e' referenciado pelas rotas geradas: `traefik-rate-limit@kubernetescrd`
# e `traefik-body-limit@kubernetescrd`, por nome.
#
# O invariante esta travado por `loopzero-ops quality tenant-csp-passthrough`.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: traefik
spec:
  rateLimit:
    average: 100
    burst: 200
    period: 1s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit
  namespace: traefik
spec:
  buffering:
    maxRequestBodyBytes: 10485760  # 10 MiB
    maxResponseBodyBytes: 0  # unlimited response
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  # RENOMEADO (#59): era `security-headers`. O nome antigo descrevia uma
  # ambicao ("os headers de seguranca") e convidava exatamente ao erro acima —
  # quem nao quer aplicar os headers de seguranca a todo mundo? O nome novo
  # descreve o USO REAL: o site de marketing, cujo checkout Stripe precisa de
  # `script-src https://js.stripe.com` e que NAO serve nonce por requisicao.
  #
  # Este middleware NAO deve ser anexado a rota de tenant. Ver o cabecalho.
  name: marketing-site-csp
  namespace: traefik
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    # S2.4: browserXssFilter removed — X-XSS-Protection is deprecated in modern browsers
    # (Chrome removed XSS Auditor in 2019). Rely on CSP instead.
    stsSeconds: 31536000  # 1 year
    stsIncludeSubdomains: true
    # §3.1 + S2.4: Content-Security-Policy with hardened directives.
    # style-src 'unsafe-inline' is required for CSS-in-JS (Tailwind/styled-components).
    # base-uri and form-action restrict base tag injection and form hijacking.
    contentSecurityPolicy: "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.stripe.com https://checkout.stripe.com; frame-src https://checkout.stripe.com https://js.stripe.com; img-src 'self' data: https:; font-src 'self' data:; base-uri 'self'; form-action 'self';"
    customResponseHeaders:
      X-Powered-By: ""  # Remove server fingerprint
