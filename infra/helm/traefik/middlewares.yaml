# Default Traefik middlewares applied to all tenant IngressRoutes.
# Generated IngressRoutes reference these by name: traefik-rate-limit@kubernetescrd
# and traefik-body-limit@kubernetescrd.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: traefik
spec:
  rateLimit:
    average: 100
    burst: 200
    period: 1s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit
  namespace: traefik
spec:
  buffering:
    maxRequestBodyBytes: 10485760  # 10 MiB
    maxResponseBodyBytes: 0  # unlimited response
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: traefik
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    stsSeconds: 31536000  # 1 year
    stsIncludeSubdomains: true
    # §3.1: Content-Security-Policy blocks XSS from loading external scripts
    # Allows Stripe checkout iframe and connect-src for API calls
    contentSecurityPolicy: "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.stripe.com https://checkout.stripe.com; frame-src https://checkout.stripe.com https://js.stripe.com; img-src 'self' data: https:; font-src 'self' data:;"
    customResponseHeaders:
      X-Powered-By: ""  # Remove server fingerprint
