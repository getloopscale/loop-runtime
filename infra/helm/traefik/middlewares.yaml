# Default Traefik middlewares applied to all tenant IngressRoutes.
# Generated IngressRoutes reference these by name: traefik-rate-limit@kubernetescrd
# and traefik-body-limit@kubernetescrd.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: traefik
spec:
  rateLimit:
    average: 100
    burst: 200
    period: 1s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit
  namespace: traefik
spec:
  buffering:
    maxRequestBodyBytes: 10485760  # 10 MiB
    maxResponseBodyBytes: 0  # unlimited response
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: traefik
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    stsSeconds: 31536000  # 1 year
    stsIncludeSubdomains: true
    customResponseHeaders:
      X-Powered-By: ""  # Remove server fingerprint
