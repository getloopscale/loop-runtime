# Health probes: Traefik chart includes default livenessProbe and readinessProbe
# on the traefik container (HTTP GET /ping on port 9000). These are built into
# the chart and do not need explicit configuration in values.yaml.
# livenessProbe: chart default (GET /ping)
# readinessProbe: chart default (GET /ping)

# --- High Availability ---
deployment:
  replicas: 2

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # Pin to policy/v1 — policy/v1beta1 was removed in K8s 1.25.
  # CHG-2026-04-28-LAYERED-BOOTSTRAP iter 11: kubeconform validate:helmfile-templates
  # caught traefik 28.3.0 chart defaulting to policy/v1beta1 when Capabilities are
  # not provided (e.g. helmfile template without live cluster).
  apiVersion: policy/v1

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik

# --- Resources (sized for multi-tenant workloads with access logs + metrics) ---
resources:
  limits:
    cpu: "500m"
    memory: "256Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

# Hardened securityContext (INF-G08 + plan ADR D7).
# Traefik binds port 8000/8443 (internal), with Service mapping 80/443. NET_BIND_SERVICE
# capability NOT required because internal ports are >1024.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: LoadBalancer

providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true

# --- Entrypoints ---
ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
    # Redirect HTTP → HTTPS
    redirectTo:
      port: websecure
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    tls:
      enabled: true
  metrics:
    port: 9100
    expose:
      default: false  # Scrape via ServiceMonitor only, not via LoadBalancer
    exposedPort: 9100
    protocol: TCP

# --- Global Timeouts ---
#
# Plan red-team-77-107-closure v1.0 T1.1 (closes Red Team loopruntime-cloud#107)
# bumps three values from the original 60s/120s/60s cap to Vercel-Pro-parity
# 300s/600s/300s on the customer-app HTTPS surface (websecure entryPoint).
# Pre-fix: any response taking > ~61s (SSE / AI streaming / long-poll / large
# upload) was cut by Traefik's writeTimeout. Post-fix ceiling is 5min HTTP,
# 10min idle, 5min TTFB — covers > 99% of legitimate customer backends per
# the Vercel/Cloudflare/Netlify SOTA matrix recorded in the plan's ADR D1.
#
# ADRs (red-team-77-107-closure-plan.md):
#   D1 — writeTimeout 300s (NOT 0s — slowloris exposure; 5min ceiling auditable)
#   D2 — responseHeaderTimeout 300s in lockstep (TTFB cap matches D1 ceiling)
#   D3 — idleTimeout 600s (SSE reconnect amortization; idle != active write)
#   D4 — single values.yaml change (no per-env overlay — both mgmt + workload
#        Traefik tolerate 5min; only workload NEEDS it)
#
# readTimeout=60s (request body), web entryPoint=10s (ACME HTTP-01 + 80→443
# redirect), and dialTimeout=30s preserved — none of those affect streaming.
additionalArguments:
  - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=60s"
  - "--entryPoints.websecure.transport.respondingTimeouts.writeTimeout=300s"
  - "--entryPoints.websecure.transport.respondingTimeouts.idleTimeout=600s"
  - "--entryPoints.web.transport.respondingTimeouts.readTimeout=10s"
  - "--entryPoints.web.transport.respondingTimeouts.writeTimeout=10s"
  - "--serversTransport.forwardingTimeouts.dialTimeout=30s"
  - "--serversTransport.forwardingTimeouts.responseHeaderTimeout=300s"

# --- Metrics ---
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

# --- Logging ---
logs:
  general:
    format: json
  access:
    enabled: true
    format: json
    filters:
      statusCodes:
        - "400-599"
      retryAttempts: true
    fields:
      headers:
        defaultMode: drop
        names:
          Host: keep
          X-Correlation-ID: keep
          User-Agent: keep
