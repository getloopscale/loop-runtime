# SPDX-License-Identifier: Apache-2.0
# F2+ openbao-init values — what to provision in OpenBao via `bao` CLI Job.
#
# Per VK validation (vault-local): root token comes inline from devMode
# (`server.dev.devRootToken` = "loop-runtime-dev-vault-root" in secrets.helmfile).
# Per prod: root token is provided OUT-OF-BAND via K8s Secret created
# after Shamir init ceremony (operator runbook openbao-init-runbook.md).

# OpenBao endpoint (Service ClusterIP, port from chart oficial)
openbao:
  serviceName: openbao
  serviceNamespace: secrets-system
  port: 8200
  scheme: http  # vault-local uses tlsDisable; prod overrides to https
  # Reference to existing Secret with ca.crt key (typically the openbao-tls
  # Secret produced by cert-manager via openbao-cert chart). When set, the
  # Job mounts it at /etc/openbao/ca and sets BAO_CACERT.
  tlsCASecret: ""
  tlsCASecretKey: "ca.crt"

# How to authenticate the Job to OpenBao.
# Option A (dev/local): root token inline via Secret managed by this chart.
# Option B (prod): existingSecret with key BAO_TOKEN (operator-provisioned).
auth:
  # Set ONLY for dev/local. Creates Secret openbao-init-token with this value.
  # In prod, leave empty and use existingSecret instead.
  rootTokenInline: ""

  # Reference to existing Secret (prod path).
  existingSecret: ""
  existingSecretKey: "BAO_TOKEN"

# Image: official openbao/openbao container has bao CLI baked in.
image:
  repository: quay.io/openbao/openbao
  tag: "2.5.4"
  pullPolicy: IfNotPresent

# Resources for the init Job (light — runs ~30s then exits)
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Job behavior
job:
  # backoffLimit: how many retries before Job fails permanently
  backoffLimit: 3
  # activeDeadlineSeconds: kill Job if exceeds this (max time including retries)
  activeDeadlineSeconds: 300
  # ttlSecondsAfterFinished: cleanup completed pods after this
  ttlSecondsAfterFinished: 600

# Secrets engines to enable (idempotent — skip if mounted).
# Each entry: { path, type, description, options }.
secretsEngines:
  - path: secret  # kv-v2 already mounted by default in dev; harmless re-enable
    type: kv-v2
    description: "Generic kv-v2 store for LoopRuntime platform secrets"
    options:
      version: "2"
  - path: transit
    type: transit
    # Per-tenant on purpose: one key per tenant is what makes erasure possible at all
    # (destroy the key, the tenant's ciphertexts die with it). The mechanism that would
    # destroy it does not exist yet — see `B-075`. This names the shape, not a feature.
    description: "Per-tenant encryption keys (one key per tenant — the shape erasure needs)"
    options: {}
  # T6.1 of openbao-adoption v1.3 — Vault database secrets engine for
  # dynamic PG credentials with TTL 1h max 24h. Replaces static
  # loop-runtime-dev-password (T6.5) + generate-secrets.sh:149 placeholder.
  - path: database
    type: database
    description: "T6.1 dynamic PG creds — v-k8s-loop-runtime-api-* short-lived"
    options: {}
  # T7.1 of openbao-adoption v1.3 — Vault kubernetes secrets engine for
  # dynamic SA tokens with TTL 24h audience kubernetes.default.svc.
  # Replaces scoped-kubeconfig.sh legacy SA-Secret-token pattern (T7.4).
  - path: kubernetes
    type: kubernetes
    description: "T7.1 dynamic SA tokens per cluster"
    options: {}

# Auth methods to enable (idempotent).
#
# T5.1-T5.4 of plan 2026-06-02-openbao-adoption v1.3: per-cluster K8s auth
# mounts isolate cross-cluster trust. Compromising one cluster's SA tokens
# does NOT grant Vault login on other mounts since each mount has its own
# bound tokenReviewerJwt + kubernetesHost + kubernetesCaCert.
#
# Mount layout:
#   - kubernetes        : legacy/backward-compat for in-cluster mgmt workloads
#                          (eso, snapshot-agent, tenant-controller, spki-extractor)
#   - k8s-core          : NEW T5.1 — explicit mgmt cluster auth (loop-runtime-api, operators)
#   - k8s-build         : NEW T5.2 — build cluster auth (argo-workflows, BuildKit)
#   - k8s-cell-0        : NEW T5.3/T5.4 — cell-0 workload cluster (ESO broker)
#   - k8s-cell-1        : NEW T5.4 — cell-1 workload cluster (ESO broker)
#
# Operator-time: per-mount auth/<path>/config (kubernetesHost + CACert +
# tokenReviewerJwt) MUST be written manually after init — see
# docs/runbooks.md (cluster credentials
# cannot be templated at helm-time).
authMethods:
  - path: kubernetes
    type: kubernetes
    description: "K8s ServiceAccount auth — legacy mount for in-cluster mgmt workloads"
  - path: k8s-core
    type: kubernetes
    description: "T5.1 mgmt cluster auth (loop-runtime-api, operators)"
  - path: k8s-build
    type: kubernetes
    description: "T5.2 build cluster auth (argo-workflows, BuildKit)"
  - path: k8s-cell-0
    type: kubernetes
    description: "T5.3/T5.4 cell-0 workload cluster auth (ESO broker)"
  - path: k8s-cell-1
    type: kubernetes
    description: "T5.4 cell-1 workload cluster auth (ESO broker)"

# Policies to provision. Each: { name, ruleHcl }.
#
# TWO SIMILAR NAMES still live here, and only one is a policy (B-098):
#
#   loop-runtime-api  (policy) — IT IS THIS ONE. The k8s-core role carries it.
#   loop-runtime-api  (role)   — a role on the k8s-core mount, not a policy
#
# There were FOUR until 2026-08-19. `loop-runtime-api-read` and `loop-runtime-api-transit-encrypt` were removed:
# no role carried them, and both were EARLIER and BROADER versions of the current `loop-runtime-api`
# (`transit/encrypt/+` versus `transit/encrypt/loop-runtime-tenants-*`; the whole tenant tree versus
# the `+/api/*` branch). They were not neutral leftovers: wiring them by mistake would grant TOO MUCH.
#
# The confusion already cost a patch in the wrong place — when fixing B-072 the change was applied
# to `loop-runtime-api-transit-encrypt` because the pattern matched it first, and only a new test caught it.
#
# The `openbao-init-auth-mounts` gate now refuses a declared policy that no role carries,
# so the list of candidates does not grow back in silence.
policies:
  - name: eso-read
    ruleHcl: |
      path "secret/data/loop-runtime/*" {
        capabilities = ["read"]
      }
      path "secret/metadata/loop-runtime/*" {
        capabilities = ["list"]
      }
  # Phase 8 D12 — snapshot-agent capability per
  # openbao-snapshot-agent k8s-configuration.md.
  - name: snapshot
    ruleHcl: |
      path "sys/storage/raft/snapshot" {
        capabilities = ["read"]
      }
  # T3.3 of openbao-adoption v1.3 — tenant-controller transit key management policy.
  # Allows creating, reading and rotating per-tenant transit keys. Scope intentionally
  # tenant-prefix to prevent cross-tenant key ops.
  #
  # It said "and DELETING … (crypto-shredding pattern)" until 2026-08-16. The verb went
  # away with `B-075`; the sentence describing it had to go with it, or the next reader
  # would look for a capability the policy no longer carries. Why, in full, at the
  # `delete` line below.
  - name: tenant-controller-transit
    ruleHcl: |
      # `delete` was REMOVED on 2026-08-16 (`B-075`, ratified). Per-tenant crypto-shredding
      # is operator-side WHEN BUILT, and it does not exist: `DeleteTenantKey` is only an
      # interface declaration, with no implementation, no assignment and no caller
      # anywhere in the tree.
      #
      # Meanwhile, the grant was irreversible destruction with zero function — and over
      # a namespace nobody fills: this read `tenant-<id>` while the `api` creates
      # `loop-runtime-tenants-<id>` (`pkg/vault/transit_client.go` tenantKeyPrefix). Wiring that
      # path would have deleted nothing and reported success.
      #
      # It comes back together with the shredder, pointed at the right prefix, and the
      # assertion `TestOpenBaoInitAuth_NoPolicyGrantsDeleteOnATransitKey` is amended in
      # the same change. The verbs that remain are also inert today, from the same prefix
      # divergence; removing only `delete` is what the decision authorised, and it is the
      # only one with an irreversible consequence.
      path "transit/keys/tenant-+" {
        capabilities = ["create", "read", "update"]
      }
      path "transit/keys/tenant-+/rotate" {
        capabilities = ["update"]
      }
      path "transit/keys/tenant-+/config" {
        capabilities = ["update"]
      }
  # T2.5 of openbao-adoption v1.3 — SPKI extractor write-only policy.
  # Allows writing SPKI pin hash to platform path; cannot read other secrets.
  # Scoped intentionally narrow: only the SPKI pin key.
  - name: spki-extractor-write
    ruleHcl: |
      path "secret/data/loop-runtime/+/platform/secrets/vault-spki-pin/+" {
        capabilities = ["create", "update"]
      }
      path "secret/metadata/loop-runtime/+/platform/secrets/vault-spki-pin/+" {
        capabilities = ["read"]
      }
  # T5.5 of openbao-adoption v1.3 — loop-runtime-api least-priv read.
  # Identity templating per T5.10: loop-runtime-api authenticates as a single SA;
  # path scope covers all loop-runtime/<env>/api/* secrets but excludes operator
  # paths (tenant-operator owns its own secrets per binary separation).
  - name: loop-runtime-api
    ruleHcl: |
      path "secret/data/loop-runtime/+/api/*" {
        capabilities = ["read"]
      }
      path "secret/metadata/loop-runtime/+/api/*" {
        capabilities = ["read", "list"]
      }
      # Scoped to the prefix the client actually names. `+` matched ANY single
      # segment, letting the api encrypt with any key in the engine; the only key
      # it ever names comes from tenantKeyName (pkg/vault/transit_client.go:133).
      path "transit/encrypt/loop-runtime-tenants-*" {
        capabilities = ["update"]
      }
      path "transit/decrypt/loop-runtime-tenants-*" {
        capabilities = ["update"]
      }
      # This IS the policy the client runs under, since 2026-08-13.
      #
      # TransitClient authenticates by APPROLE (transit_client.go, POST
      # /v1/auth/approle/login). The chart does not declare that AppRole — the
      # credential lifecycle (create the role, generate the secret_id, materialise
      # the Secret) only runs against a live vault, so it lives in
      # infra/scripts/local/vault-bootstrap-dev.sh. What the script no longer does
      # is WRITE this policy: until B-099 it overwrote this same name minutes
      # after helmfile applied it, so the versioned rules — the reviewed ones —
      # reached no runtime at all, and slice-17's B-072 fix was invisible.
      #
      # The split is the decision: what the identity MAY do is declared here; the
      # identity's credential is minted there. Guarded by
      # TestOpenBaoInitAuth_NoScriptWritesAPolicyTheChartOwns, which fails if any
      # shell under infra/ writes a policy again.
      # Decision: MEET-ASYNC-AMENDMENT-2026-08-13-vault-policy-ownership.
      #
      # Scope note: `*` in a Vault policy matches any number of characters
      # INCLUDING `/`, so this also grants update on .../config and .../rotate.
      # Kept as the runbook's form because that is the one with execution
      # evidence; narrowing it is part of the LIVE-validated fix, not a guess.
      #
      # Lazy key creation: Encrypt reacts to a 404 by POSTing to
      # /v1/transit/keys/loop-runtime-tenants-<id> (createTransitKey). This path was
      # ABSENT until 2026-08-13, so that create was denied by design in every
      # environment loading this chart — while the cutover runbook and the dev
      # script both granted it. Drift, not a missing decision (B-072).
      #
      # `update` is required IN ADDITION to `create`: the Go client's POST is an
      # HTTP PUT, which OpenBao policy-enforces as update semantics even when the
      # key does not exist. LIVE-caught 2026-06-10 (J-22) — with ["create","read"]
      # the token reported both and the PUT still returned 403.
      #
      # The separator is a HYPHEN. `loop-runtime-tenants/<id>` makes transit return 404
      # "unsupported path": the engine reads the slash as an endpoint delimiter.
      # Same walkthrough.
      path "transit/keys/loop-runtime-tenants-*" {
        capabilities = ["create", "read", "update"]
      }
  # T5.6 of openbao-adoption v1.3 — loop-runtime-tenant-operator with cross-binary
  # READ access to api/ paths (D6 shared secrets per vault-INT plan: gitea/
  # token + minio creds shared between binaries). Identity templating
  # restricts writes to operators/<binary> paths only.
  - name: loop-runtime-tenant-operator
    ruleHcl: |
      path "secret/data/loop-runtime/+/operators/tenant-operator/*" {
        capabilities = ["read", "list"]
      }
      path "secret/data/loop-runtime/+/api/secrets/gitea/token" {
        capabilities = ["read"]
      }
      path "secret/data/loop-runtime/+/api/secrets/minio/*" {
        capabilities = ["read"]
      }
      # `delete` was REMOVED on 2026-08-16 (`B-075`, ratified). Per-tenant crypto-shredding
      # is operator-side WHEN BUILT, and it does not exist: `DeleteTenantKey` is only an
      # interface declaration, with no implementation, no assignment and no caller
      # anywhere in the tree.
      #
      # Meanwhile, the grant was irreversible destruction with zero function — and over
      # a namespace nobody fills: this read `tenant-<id>` while the `api` creates
      # `loop-runtime-tenants-<id>` (`pkg/vault/transit_client.go` tenantKeyPrefix). Wiring that
      # path would have deleted nothing and reported success.
      #
      # It comes back together with the shredder, pointed at the right prefix, and the
      # assertion `TestOpenBaoInitAuth_NoPolicyGrantsDeleteOnATransitKey` is amended in
      # the same change. The verbs that remain are also inert today, from the same prefix
      # divergence; removing only `delete` is what the decision authorised, and it is the
      # only one with an irreversible consequence.
      path "transit/keys/tenant-+" {
        capabilities = ["create", "read", "update"]
      }
      path "transit/keys/tenant-+/rotate" {
        capabilities = ["update"]
      }
  # T5.7 of openbao-adoption v1.3 — loop-runtime-app-operator least-priv.
  - name: loop-runtime-app-operator
    ruleHcl: |
      path "secret/data/loop-runtime/+/operators/app-operator/*" {
        capabilities = ["read", "list"]
      }
  # T5.7 of openbao-adoption v1.3 — loop-runtime-preview-operator least-priv.
  - name: loop-runtime-preview-operator
    ruleHcl: |
      path "secret/data/loop-runtime/+/operators/preview-operator/*" {
        capabilities = ["read", "list"]
      }
  # T5.7 of openbao-adoption v1.3 — loop-runtime-platform-operator least-priv.
  - name: loop-runtime-platform-operator
    ruleHcl: |
      path "secret/data/loop-runtime/+/operators/platform-operator/*" {
        capabilities = ["read", "list"]
      }
  # T5.8 of openbao-adoption v1.3 — argo-workflows in build cluster.
  # Reads cosign passphrase + DOCR push credentials only.
  - name: argo-workflows
    ruleHcl: |
      path "secret/data/loop-runtime/+/build/secrets/cosign/*" {
        capabilities = ["read"]
      }
      path "secret/data/loop-runtime/+/build/secrets/registry/*" {
        capabilities = ["read"]
      }

# Kubernetes auth roles (Phase 3.1 — D11).
# Maps Vault role name → SA(s) allowed to login.
# R1+R2 of plan dev-public-cross-cluster-secrets (issue #111, sponsor approved
# 2026-06-19): the `eso` role moves from the legacy `kubernetes` mount (intended
# for in-cluster loop-runtime-secrets workloads) to the canonical multi-cluster
# `k8s-core` mount (core-cluster workloads). The `boundAudiences` field
# enforces EC-5 (TokenRequest aud claim == role bound_audiences) as
# defence-in-depth — closes the "any-audience login" gap. The
# `serviceAccountRef.audiences` in the ClusterSecretStore that consumes
# this role (canonical: infra/manifests/cluster-secret-stores/loop-runtime-secrets-secrets.yaml)
# MUST match this list exactly, else ESO's TokenRequest emits an `aud`
# claim the role won't accept → 403 at login.
authRoles:
  - name: eso
    mount: k8s-core
    boundServiceAccountNames:
      - eso-vault-reader
    boundServiceAccountNamespaces:
      - loop-runtime-system
    boundAudiences:
      - openbao.vault.runtime.getloopscale.com
    policies:
      - eso-read
    ttl: "24h"
    description: "External Secrets Operator role (cross-cluster mgmt→vault) — R1+R2 of issue #111"
  # Phase 8 D12 — snapshot-agent intra-cluster role.
  - name: bao-snapshot
    boundServiceAccountNames:
      - bao-snapshot
    boundServiceAccountNamespaces:
      - secrets-system
    policies:
      - snapshot
    ttl: "1h"
    description: "openbao-snapshot-agent CronJob (intra-cluster)"
  # T3.3 of openbao-adoption v1.3 — tenant-controller per-tenant transit key role.
  - name: tenant-controller-transit
    boundServiceAccountNames:
      - loop-runtime-tenant-operator
    boundServiceAccountNamespaces:
      - loop-runtime-system
    policies:
      - tenant-controller-transit
    ttl: "1h"
    description: "tenant-controller role: create transit/keys/tenant-<id> on Tenant reconcile"
  # T2.5 of openbao-adoption v1.3 (EC-09 amendment) — SPKI extractor role.
  - name: spki-extractor
    boundServiceAccountNames:
      - vault-spki-extractor
    boundServiceAccountNamespaces:
      - secrets-system
    policies:
      - spki-extractor-write
    ttl: "1h"
    description: "SPKI extractor CronJob (intra-cluster; pins Vault TLS SPKI every 5min)"
  # T5.5 of openbao-adoption v1.3 — loop-runtime-api role on auth/k8s-core.
  # TTL 1h per plan + audience claim enforced via Deployment projected token.
  - name: loop-runtime-api
    mount: k8s-core
    boundServiceAccountNames:
      - loop-runtime-api
    boundServiceAccountNamespaces:
      - loop-runtime-system
    policies:
      - loop-runtime-api
    ttl: "1h"
    description: "T5.5 loop-runtime-api Vault role (mgmt cluster — secret read + Transit encrypt/decrypt)"
  # T5.6 of openbao-adoption v1.3 — loop-runtime-tenant-operator on auth/k8s-core.
  - name: loop-runtime-tenant-operator
    mount: k8s-core
    boundServiceAccountNames:
      - loop-runtime-tenant-operator
    boundServiceAccountNamespaces:
      - loop-runtime-system
    policies:
      - loop-runtime-tenant-operator
    ttl: "1h"
    description: "T5.6 tenant-operator Vault role (D6 shared paths + per-tenant Transit key)"
  # T5.7 of openbao-adoption v1.3 — loop-runtime-app-operator on auth/k8s-core.
  - name: loop-runtime-app-operator
    mount: k8s-core
    boundServiceAccountNames:
      - loop-runtime-app-operator
    boundServiceAccountNamespaces:
      - loop-runtime-system
    policies:
      - loop-runtime-app-operator
    ttl: "1h"
    description: "T5.7 app-operator Vault role (operators/app-operator path only)"
  # T5.7 of openbao-adoption v1.3 — loop-runtime-preview-operator on auth/k8s-core.
  - name: loop-runtime-preview-operator
    mount: k8s-core
    boundServiceAccountNames:
      - loop-runtime-preview-operator
    boundServiceAccountNamespaces:
      - loop-runtime-system
    policies:
      - loop-runtime-preview-operator
    ttl: "1h"
    description: "T5.7 preview-operator Vault role (operators/preview-operator path only)"
  # T5.7 of openbao-adoption v1.3 — loop-runtime-platform-operator on auth/k8s-core.
  - name: loop-runtime-platform-operator
    mount: k8s-core
    boundServiceAccountNames:
      - loop-runtime-platform-operator
    boundServiceAccountNamespaces:
      - loop-runtime-system
    policies:
      - loop-runtime-platform-operator
    ttl: "1h"
    description: "T5.7 platform-operator Vault role (operators/platform-operator path only)"
  # T5.8 of openbao-adoption v1.3 — argo-workflows on auth/k8s-build.
  - name: argo-workflows
    mount: k8s-build
    boundServiceAccountNames:
      - argo-workflows-controller
      - argo-workflow
    boundServiceAccountNamespaces:
      - argo
    policies:
      - argo-workflows
    ttl: "1h"
    description: "T5.8 argo-workflows Vault role (build cluster — cosign + registry secrets)"
  # T5.9 of openbao-adoption v1.3 — external-secrets broker per cell.
  # eso-broker SA per cell maps to its own mount; tokens issued by cell-X
  # cluster cannot login on cell-Y mount (multi-tenant isolation gate).
  - name: external-secrets-broker
    mount: k8s-cell-0
    boundServiceAccountNames:
      - eso-broker
    boundServiceAccountNamespaces:
      - external-secrets
    policies:
      - eso-read
    ttl: "1h"
    description: "T5.9 ESO broker on cell-0 — reads tenant secrets to materialize K8s Secrets"
  - name: external-secrets-broker
    mount: k8s-cell-1
    boundServiceAccountNames:
      - eso-broker
    boundServiceAccountNamespaces:
      - external-secrets
    policies:
      - eso-read
    ttl: "1h"
    description: "T5.9 ESO broker on cell-1"

# T3.2 of openbao-adoption v1.3 — Transit keys provisioned at init time.
# Per-tenant keys (tenant-<id>) are created on-demand by tenant-controller
# reconcile (T3.3) via dedicated `tenant-controller-transit` role above —
# NOT bootstrapped here.
#
# Master = platform-level envelope encryption (legacy AES key wrap for
# coexistence; will be canonical post-F10 AES code deletion per T10.2).
# Bootstrap = used for initial provisioning encryption (one-time per env).
transitKeys:
  - name: master
    type: aes256-gcm96
    mount: transit
  - name: bootstrap
    type: aes256-gcm96
    mount: transit

# T2.5 SPKI extractor config — CronJob runs in secrets-system NS, extracts SPKI
# hash from openbao-tls Secret tls.crt, writes to KV path
# secret/data/loop-runtime/<env>/platform/secrets/vault-spki-pin/spki_hash.
# ESO mgmt-side reads this path → materializes K8s Secret vault-spki-pin in
# loop-runtime-system NS → loop-runtime-api consumes via env var LOOP_RUNTIME_VAULT_SPKI_PIN.
# Per EC-09 v1.1: CronJob (NOT one-shot Job) because cert-manager auto-renews
# Vault cert every 60-90d independently of ArgoCD sync-waves; without periodic
# re-extraction, loop-runtime-api pins stale SPKI and Vault auth fails periodically.
# T6.1-T6.3 of openbao-adoption v1.3 — database engine connections + roles.
# Each connection: { name, plugin, connectionUrl, allowedRoles, username, password }.
# Operator-time: connectionUrl + username + password come from K8s Secret
# referenced by the init Job (not templated at helm-time — see runbook
# docs/runbooks.md).
#
# Each role: { name, dbName, creationStatements, defaultTtl, maxTtl, revocationStatements }.
# loop-runtime-api role: TTL 1h / max 24h per plan T6.3.
databaseConnections: []
  # Example (operator fills via overlay):
  # - name: postgres-loop-runtime-api
  #   plugin: postgresql-database-plugin
  #   connectionUrl: "postgresql://{{username}}:{{password}}@loop-runtime-pg.loop-runtime-system:5432/loop_runtime?sslmode=require"
  #   allowedRoles: loop-runtime-api
  #   usernameSecretRef: loop-runtime-pg-vault-admin-username  # NOT templated — operator provides
  #   passwordSecretRef: loop-runtime-pg-vault-admin-password
databaseRoles:
  - name: loop-runtime-api
    dbName: postgres-loop-runtime-api
    creationStatements: |
      CREATE ROLE "{{name}}" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}';
      GRANT loop_runtime_api_app TO "{{name}}";
    defaultTtl: "1h"
    maxTtl: "24h"
    revocationStatements: |
      REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA public FROM "{{name}}";
      DROP ROLE IF EXISTS "{{name}}";

# T7.1-T7.2 of openbao-adoption v1.3 — kubernetes engine roles.
# Each role: { name, allowedKubernetesNamespaces, serviceAccountName, tokenDefaultTtl, tokenMaxTtl }.
kubernetesRoles:
  - name: loop-runtime-cell-0-mgmt
    allowedKubernetesNamespaces:
      - loop-runtime-system
      - argocd
      - external-secrets
    serviceAccountName: loop-runtime-cell-0
    tokenDefaultTtl: "1h"
    tokenMaxTtl: "24h"
  - name: loop-runtime-cell-0-build
    allowedKubernetesNamespaces:
      - argo
    serviceAccountName: loop-runtime-build
    tokenDefaultTtl: "1h"
    tokenMaxTtl: "24h"
  - name: loop-runtime-cell-0-workload
    allowedKubernetesNamespaces:
      - loop-runtime-system
    serviceAccountName: loop-runtime-cell-0
    tokenDefaultTtl: "1h"
    tokenMaxTtl: "24h"

spkiExtractor:
  enabled: false  # opt-in per env; flip to true when loop-runtime-secrets TLS active
  schedule: "*/5 * * * *"
  image:
    repository: alpine
    tag: "3.20"
  vaultTlsSecret: openbao-tls
