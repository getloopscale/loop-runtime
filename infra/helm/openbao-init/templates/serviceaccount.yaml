{{/* SA for the init Job. No K8s API permissions needed — only network egress
     to OpenBao Service. Created for naming + auditability of who ran init. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-init
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: openbao-init
    app.kubernetes.io/managed-by: {{ .Release.Service }}
