{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{/* Token Secret — created ONLY when auth.rootTokenInline is set (dev/local).
     In prod, use auth.existingSecret pointing to operator-provisioned Secret. */}}
{{- if .Values.auth.rootTokenInline }}
apiVersion: v1
kind: Secret
metadata:
  name: openbao-init-token
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: openbao-init
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  BAO_TOKEN: {{ .Values.auth.rootTokenInline | quote }}
{{- end }}
