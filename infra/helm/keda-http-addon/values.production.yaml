# KEDA HTTP Add-on production overrides (DigitalOcean workload cluster).
# Usage: helm upgrade --install keda-http-addon loopzero-keda-http-addon -f values.yaml -f values.production.yaml
#
# Requires: KEDA core must be installed first.

http-add-on:
  # ---------------------------------------------------------------------------
  # Interceptor -- HA (2 replicas minimum)
  # ---------------------------------------------------------------------------
  interceptor:
    replicas:
      min: 2
      max: 4
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

  # ---------------------------------------------------------------------------
  # Operator -- production sizing
  # ---------------------------------------------------------------------------
  operator:
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

  # ---------------------------------------------------------------------------
  # Scaler -- production sizing
  # ---------------------------------------------------------------------------
  scaler:
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

  # ---------------------------------------------------------------------------
  # PodDisruptionBudget -- interceptor must stay available during drains
  # ---------------------------------------------------------------------------
  podDisruptionBudget:
    interceptor:
      enabled: true
      minAvailable: 1
