{{- with .Values.externalSecret }}
{{- if .store }}
{{- $remote := required "externalSecret.remoteKey is required with externalSecret.store" .remoteKey }}
# The Secret the service reads (existingSecret), written by External Secrets from one
# secret of the store, a JSON object: each key below is one of its properties.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $.Values.existingSecret }}
  labels:
    {{- include "dps.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .store }}
  target:
    name: {{ $.Values.existingSecret }}
    creationPolicy: Owner
  data:
    {{- range $secretKey, $property := .keys }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $remote }}
        property: {{ $property }}
    {{- end }}
{{- with .postgresRoleSecret }}
---
# The Secret the platform's PostgreSQL reads the service's role password from
# (platform-postgres databases[].passwordSecret). Same property as postgres-password above:
# the role and the service take the password from one place.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ . }}
  labels:
    {{- include "dps.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.externalSecret.store }}
  target:
    name: {{ . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: {{ $.Values.postgres.user | quote }}
        password: "{{ "{{ .password }}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ $remote }}
        property: {{ required "externalSecret.keys.postgres-password is required with externalSecret.postgresRoleSecret" (index $.Values.externalSecret.keys "postgres-password") }}
{{- end }}
{{- with .imagePull }}
{{- if .secretName }}
---
# The registry login the pods pull the service's image with, from a secret of the store
# holding {"username": ..., "password": <token with read:packages>}.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
  labels:
    {{- include "dps.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.externalSecret.store }}
  target:
    name: {{ .secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ printf `{"auths":{"%s":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%%s:%%s" .username .password | b64enc }}"}}}` (required "externalSecret.imagePull.registry is required" .registry) | squote }}
  data:
    - secretKey: username
      remoteRef: { key: {{ required "externalSecret.imagePull.remoteKey is required" .remoteKey | quote }}, property: username }
    - secretKey: password
      remoteRef: { key: {{ .remoteKey | quote }}, property: password }
{{- end }}
{{- end }}
{{- end }}
{{- end }}
