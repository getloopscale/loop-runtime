{{- $image := printf "%s:%s" (required "image.repository is required" .Values.image.repository) (required "image.tag is required" .Values.image.tag) }}
{{- $processes := list (dict "name" "" "command" list) }}
{{- range .Values.workers }}{{ $processes = append $processes . }}{{ end }}
{{- range $processes }}
{{- $component := .name | default "app" }}
{{- $name := ternary $.Release.Name (printf "%s-%s" $.Release.Name .name) (eq .name "") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "dps.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "dps.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      automountServiceAccountToken: false
      # A Service named after the product would otherwise inject <NAME>_PORT=tcp://...,
      # the very variable the product reads its port from.
      enableServiceLinks: false
      {{- with $.Values.externalSecret.imagePull.secretName }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $.Values.runAsUser }}
        seccompProfile: { type: RuntimeDefault }
      # The service migrates its database on boot and exits when it cannot reach it;
      # waiting here turns a crash-loop on every install into an ordered start.
      initContainers:
        - name: wait-for-postgres
          image: {{ $.Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h {{ include "dps.postgresHost" $ }} -p {{ include "dps.postgresPort" $ }} -U {{ $.Values.postgres.user }}; do sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
        {{- with $.Values.postgres.roles }}
        # Each declared role is created without superuser or BYPASSRLS, or brought back
        # to that and its current password, before the service migrates: the migrations
        # grant a role its privileges only if it already exists. The password reaches SQL
        # as a psql variable quoted by format(%L), never spliced into the statement.
        - name: ensure-roles
          image: {{ $.Values.postgres.image }}
          command:
            - sh
            - -c
            - |
              exec psql -v ON_ERROR_STOP=1 -h {{ include "dps.postgresHost" $ }} -p {{ include "dps.postgresPort" $ }} -U {{ $.Values.postgres.user }} -d {{ $.Values.postgres.database }}{{ range $i, $r := . }} -v pw_{{ $i }}="${{ include "dps.rolePasswordEnv" $r }}"{{ end }} <<'SQL'
              {{- range $i, $r := . }}
              SELECT format('CREATE ROLE %I', '{{ $r.name }}') WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ $r.name }}') \gexec
              SELECT format('ALTER ROLE %I WITH LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD %L', '{{ $r.name }}', :'pw_{{ $i }}') \gexec
              {{- end }}
              SQL
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $.Values.existingSecret }}, key: postgres-password }
            - name: PGPASSWORD
              value: $(POSTGRES_PASSWORD)
            {{- range . }}
            - name: {{ include "dps.rolePasswordEnv" . }}
              valueFrom:
                secretKeyRef: { name: {{ $.Values.existingSecret }}, key: {{ .passwordKey }} }
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
        {{- end }}
        {{- if and (eq .name "") $.Values.migrations.command }}
        # The service's migrations, with its own image and environment, after its roles
        # exist and before it serves. Only the app runs them: a worker migrating too
        # would race the app for the same schema.
        - name: migrate
          image: {{ $image }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: {{ toJson $.Values.migrations.command }}
          env:
            {{- include "dps.env" (dict "root" $ "process" "app") | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- include "dps.postgresCAMount" $ | nindent 12 }}
        {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ $image }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- with .command }}
          command: {{ toJson . }}
          {{- end }}
          env:
            {{- include "dps.env" (dict "root" $ "process" $component "workerEnv" (get . "env")) | nindent 12 }}
          {{- if .port }}
          ports:
            - name: http
              containerPort: {{ .port }}
          {{- with .healthPath }}
          readinessProbe:
            httpGet: { path: {{ . }}, port: http }
            periodSeconds: 10
            failureThreshold: 3
          {{- end }}
          {{- end }}
          {{- if eq .name "" }}
          ports:
            - name: http
              containerPort: {{ $.Values.port }}
          readinessProbe:
            httpGet: { path: {{ $.Values.healthPath }}, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: {{ $.Values.healthPath }}, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- include "dps.postgresCAMount" $ | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- with $.Values.postgres.external.caSecret }}
        - name: postgres-ca
          secret:
            secretName: {{ . }}
            items: [{ key: ca.crt, path: ca.crt }]
        {{- end }}
{{- end }}
