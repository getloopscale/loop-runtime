# The image is pinned by an environment: a repository and a tag naming one build. There is
# no default tag, so a release that forgets it is refused instead of running a mutable one.
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# The port the service listens on, and its unauthenticated health endpoint.
port: 8080
healthPath: /v1/health

# Set to publish the service on a fixed node port (the edge reaches it through the
# cluster's host port map). Unset, the Service is ClusterIP.
nodePort: null

# The uid the image runs as. Most of these images name their USER ("node"), which
# Kubernetes cannot verify as non-root, so the uid is stated here.
runAsUser: 1000

# The Secret holding postgres-password and every secretEnv key, created per
# installation (infra/helmfile/scripts/generate-secrets.sh on dev-public).
existingSecret: ""

# Where secrets live in a store (staging and production: AWS Secrets Manager), External
# Secrets writes existingSecret instead of an installer script. `store` names the
# ClusterSecretStore, `remoteKey` one secret in it holding a JSON object, and `keys` maps
# each key of existingSecret to a property of that object. Empty store: nothing is rendered.
externalSecret:
  store: ""
  remoteKey: ""
  refreshInterval: 1h
  keys: {}
  # With postgres.external: also write this kubernetes.io/basic-auth Secret (username
  # postgres.user, password keys[postgres-password]) for the database's operator to read.
  postgresRoleSecret: ""
  # A private image: write the registry login as this kubernetes.io/dockerconfigjson
  # Secret, from the store secret `remoteKey` ({"username", "password"}), and have every
  # pod pull with it. Empty secretName: no pull secret.
  imagePull:
    secretName: ""
    remoteKey: ""
    registry: ghcr.io

# Plain environment, NAME: value.
env: {}

# Environment read from existingSecret: [{name, key}].
secretEnv: []

# Extra processes of the same image — same environment, no port, no probe.
workers: []

# A service whose migrations are a separate command declares it here; the app runs it as
# its last init container, with the service's image and environment. Empty: the service
# migrates itself, or has nothing to migrate.
migrations:
  command: []

resources:
  requests: { cpu: 50m, memory: 256Mi }
  limits: { memory: 1Gi }

postgres:
  # Also the image of the init containers that wait for the database and create roles, so
  # it is required with an external database too.
  image: ""
  database: ""
  user: ""
  # The env var that receives the connection URI (e.g. LOOP_RUNTIMEMEM_PG_URI).
  uriEnv: ""
  # Login roles the service connects as instead of the owner: [{name, uriEnv, passwordKey}].
  # Each is created without superuser or BYPASSRLS before the service starts, its password
  # read from existingSecret[passwordKey], and its URI set on uriEnv. The owner's URI stays
  # on postgres.uriEnv, for the migrations. loop-runtime-memory needs this: it refuses to serve
  # requests as a superuser, which row level security does not bind.
  roles: []
  # A database this chart does not run (staging: the platform's CloudNativePG cluster,
  # infra/helm/platform-postgres). With a host set, no PostgreSQL is rendered and the
  # service connects there as postgres.user, whose password is still
  # existingSecret[postgres-password]. Whoever runs that database creates the database and
  # the role; dataPath, pgdata, storage, runAsUser and resources below are then unused.
  external:
    host: ""
    port: 5432
    # The Secret, in this namespace, whose ca.crt signed the server's certificate (the
    # platform's cluster: <cluster>-ca). Set, the service connects with
    # sslmode=verify-full against it; empty, the URI carries no TLS setting.
    caSecret: ""
  # Where the volume mounts, and PGDATA when the image expects a subdirectory of it.
  dataPath: /var/lib/postgresql/data
  pgdata: ""
  storage: 5Gi
  runAsUser: 999
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
