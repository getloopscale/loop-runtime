# T0.2 Scenario B POC — ServiceAccount for CI Workflow pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespaceName }}
  labels:
    app.kubernetes.io/name: argo-ci-namespace
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    runtime.getloopscale.com/component: ci
    runtime.getloopscale.com/role: ci-runner
automountServiceAccountToken: true
