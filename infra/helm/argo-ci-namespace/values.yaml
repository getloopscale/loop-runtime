# T0.2 Scenario B POC — argo-ci-namespace defaults.
# Per ADR-2026-05-27-T0.2-RATIFIED D3: CI workflows live in dedicated
# namespace separate from tenant builds (argo). NetworkPolicy enforces
# egress restriction to Gitea API + DOCR + Argo Workflows controller only.

# Namespace name. Convention: argo-ci.
namespaceName: argo-ci

# ServiceAccount for CI Workflow pods. Per ADR D3, RBAC scoped to
# namespace only (RoleBinding, NOT ClusterRoleBinding).
serviceAccount:
  name: loop-runtime-ci-runner

# NetworkPolicy egress allowlist.
# Default: lock everything down, explicit allow per destination.
# Operator overrides per environment (dev allows more for debugging).
networkPolicy:
  enabled: true
  # Allow egress to Gitea API for status posting + repo clone.
  # Format: "<svc-name>.<namespace>.svc.cluster.local"
  giteaService: "gitea-http.loop-runtime-system.svc.cluster.local"
  giteaPort: 3000
  # Allow egress to DOCR for image pulls during CI runs (rarely needed
  # but loop-runtime-ops binary might fetch dependencies). Operator validates.
  docrHost: "registry.digitalocean.com"
  docrPort: 443
  # Allow egress to Argo Workflows controller for Workflow CR queries
  # (used by status-posting script).
  argoServerService: "argo-server.argo.svc.cluster.local"
  argoServerPort: 2746
