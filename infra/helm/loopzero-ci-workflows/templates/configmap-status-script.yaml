# T0.2 Cenário B POC — PR status posting script.
# Per ADR-2026-05-27-T0.2-RATIFIED D4.
#
# Mounted as /scripts/post-status.sh in the onExit handler of
# quality-gate WorkflowTemplate. Posts Gitea Checks API status
# with context name = "quality" (D4 fixed name).
#
# Maps Workflow status to Gitea state:
#   Succeeded → success
#   Failed | Error → failure
#   Running | Pending → pending (rare — onExit fires post-completion)
#
# Retries on rate-limit (EC-5 from plan): 3 attempts, 5s/15s/60s backoff.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ci-status-script
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: loopzero-ci-workflows
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    loopzero.io/component: ci
data:
  post-status.sh: |
    #!/bin/sh
    set -eu

    # Required env vars (populated by WorkflowTemplate spec).
    : "${GITEA_API_BASE:?missing GITEA_API_BASE}"
    : "${GITEA_TOKEN:?missing GITEA_TOKEN}"
    : "${PR_COMMIT_SHA:?missing PR_COMMIT_SHA}"
    : "${WORKFLOW_STATUS:?missing WORKFLOW_STATUS}"
    : "${STATUS_CONTEXT:?missing STATUS_CONTEXT}"

    # Map Workflow phase → Gitea state.
    case "$WORKFLOW_STATUS" in
      Succeeded)
        STATE="success"
        DESCRIPTION="All quality gates passed"
        ;;
      Failed|Error)
        STATE="failure"
        DESCRIPTION="Quality gate failures — see Argo UI"
        ;;
      Running|Pending)
        # Unexpected at onExit — log and exit non-fatal.
        STATE="pending"
        DESCRIPTION="Workflow still running (onExit invoked unexpectedly)"
        ;;
      *)
        STATE="failure"
        DESCRIPTION="Unknown Workflow status: $WORKFLOW_STATUS"
        ;;
    esac

    # Repo path inferred from Gitea webhook payload (typically loopzero/loopzero).
    # Future: pass via Sensor parameter for multi-repo support.
    REPO_PATH="${REPO_PATH:-loopzero/loopzero}"

    # Status payload per Gitea API spec.
    PAYLOAD=$(cat <<EOF
    {
      "state": "$STATE",
      "target_url": "${ARGO_UI_URL:-}/workflows/{{ .Values.namespace }}",
      "description": "$DESCRIPTION",
      "context": "$STATUS_CONTEXT"
    }
    EOF
    )

    # Retry loop with exponential backoff (EC-5 absorbed: rate-limit handling).
    attempt=1
    max_attempts=3
    sleep_durations="5 15 60"

    while [ "$attempt" -le "$max_attempts" ]; do
      HTTP_CODE=$(curl -s -o /tmp/status-resp.json -w "%{http_code}" \
        -X POST \
        -H "Authorization: token $GITEA_TOKEN" \
        -H "Content-Type: application/json" \
        -d "$PAYLOAD" \
        "$GITEA_API_BASE/api/v1/repos/$REPO_PATH/statuses/$PR_COMMIT_SHA")

      if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
        echo "[ci-status] Posted $STATE for $PR_COMMIT_SHA context=$STATUS_CONTEXT"
        exit 0
      fi

      if [ "$HTTP_CODE" = "429" ] || [ "$HTTP_CODE" -ge 500 ]; then
        # Retriable: rate-limit or server error
        sleep_for=$(echo "$sleep_durations" | cut -d' ' -f"$attempt")
        echo "[ci-status] HTTP $HTTP_CODE attempt $attempt/$max_attempts, retrying in ${sleep_for}s"
        sleep "$sleep_for"
        attempt=$((attempt + 1))
        continue
      fi

      # Non-retriable error (4xx other than 429): log and exit.
      echo "[ci-status] HTTP $HTTP_CODE non-retriable — bailing"
      cat /tmp/status-resp.json
      exit 1
    done

    echo "[ci-status] Exhausted $max_attempts attempts — giving up"
    exit 1
