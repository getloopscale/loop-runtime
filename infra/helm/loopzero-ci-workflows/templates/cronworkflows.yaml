# T0.2 Cenário B POC — 4 CronWorkflows replacing removed GHA crons.
# Per ADR-2026-05-27-T0.2-RATIFIED + plan T5.1-T5.4.
#
# Each CronWorkflow uses concurrencyPolicy=Forbid so overlapping runs
# don't accumulate (e.g., drill watchdog still running when next 6h
# cycle fires = skip rather than queue).
{{- $ns := .Values.namespace }}
{{- $sa := .Values.serviceAccountName }}
{{- $image := printf "%s:%s" .Values.loopzeroOpsImage.repository .Values.loopzeroOpsImage.tag }}
{{- range $key, $cron := .Values.crons }}
{{- if $cron.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: {{ $key | kebabcase }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: loopzero-ci-workflows
    app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
    loopzero.io/component: ci
    loopzero.io/cron: {{ $key | kebabcase }}
spec:
  # Argo Workflows v4.x changed schedule (singular string) → schedules
  # (plural array). Discovered LIVE during cleanroom 2026-05-27.
  # v3 callers must migrate; v4 supports either but `schedule` is deprecated.
  schedules:
    - {{ $cron.schedule | quote }}
  # Forbid overlapping runs — if previous cycle still running, skip.
  # Alternatives:
  #   Allow — accumulate (risky for drill which is $$$/hr)
  #   Replace — kill old (acceptable for watchdog idempotent tasks)
  # Chose Forbid for safety; operator overrides per-cron if needed.
  concurrencyPolicy: Forbid
  # Keep last 3 successful + last 3 failed runs for debugging.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Workflow definition
  workflowSpec:
    serviceAccountName: {{ $sa }}
    entrypoint: run-task
    activeDeadlineSeconds: 7200  # 2h max per cron (drill l2-scale can take ~60min)
    templates:
      - name: run-task
        container:
          image: {{ $image | quote }}
          imagePullPolicy: {{ $.Values.loopzeroOpsImage.pullPolicy }}
          # Run task via shell — task binary expected in image PATH.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "[cron:{{ $key }}] starting at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              {{ $cron.taskCommand }}
              echo "[cron:{{ $key }}] completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
{{- end }}
{{- end }}
