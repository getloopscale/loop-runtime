# T0.2 Cenário B POC — loopzero-ci-workflows defaults.

# Namespace where CI workflows run. Must match argo-ci-namespace chart output.
namespace: argo-ci
serviceAccountName: loopzero-ci-runner

# Imagem que os quatro CronWorkflows executam.
#
# CORRIGIDO 2026-08-18 (B-019): as duas linhas anteriores afirmavam que o operador constroi
# via `task images:build:loopzero-ops` e publica no DOCR. Medido: essa task NAO EXISTE — a unica
# mencao a ela no repositorio inteiro era este comentario. Nao ha Dockerfile de loopzero-ops, ela
# nao esta na matriz de `release-artifacts.yml`, e o registro DOCR devolve
# `404 registry does not exist`. Quatro camadas de ausencia, e o comentario afirmava a unica
# que teria resolvido.
#
# E os crons NAO executam o binario loopzero-ops: rodam `task ...` e um script bash, sem clone do
# repositorio e sem volume. A imagem que falta e um RUNNER DE CI com a arvore dentro, nao o
# binario — por isso publicar cmd/loopzero-ops nao consertaria nada.
#
# O gate `scheduled-image` guarda a regressao; a divida esta declarada com prazo em
# `scheduledimage.DefaultExemptions`, e o futuro dos quatro crons e decisao registrada no MEET
# de 2026-08-18.
loopzeroOpsImage:
  repository: registry.digitalocean.com/loopzero-system/loopzero-ops
  # Pinned via digest in prod overlay per ADR-2026-05-27-T2.2 + T2.3.
  # Dev uses tag.
  tag: v0.1.0
  pullPolicy: IfNotPresent

# Per-gate config. Each entry runs as a separate step in the quality-gate
# WorkflowTemplate. Must mirror taskfiles/quality.yml `task quality:gates`
# command list. Mismatch detected by render-time test (T7.1).
#
# `gateName`: argument passed to `loopzero-ops quality <gateName>`.
# `displayName`: human-readable step name in Argo UI.
# `independent`: if true, can parallel with other independent gates.
#                Sequential gates run after all independent ones complete.
gates:
  - gateName: unhomed-logic
    displayName: "unhomed-logic"
    independent: true
    extraArgs: ["--check"]
  - gateName: script-count
    displayName: "script-count"
    independent: true
  - gateName: regression-matrix
    displayName: "regression-matrix"
    independent: true
  - gateName: postgresql-pdb-config
    displayName: "postgresql-pdb-config"
    independent: true
  - gateName: dockerfile-no-docker-hub
    displayName: "dockerfile-no-docker-hub"
    independent: true
  - gateName: advisory-lock-scope
    displayName: "advisory-lock-scope"
    independent: true
  - gateName: helm-overlap-parity
    displayName: "helm-overlap-parity"
    independent: true
  - gateName: prod-image-digests
    displayName: "prod-image-digests"
    independent: true
  - gateName: trivy-scan
    displayName: "trivy-scan (skip-on-missing)"
    independent: true
  - gateName: trufflehog-scan
    displayName: "trufflehog-scan (skip-on-missing)"
    independent: true
  - gateName: dashboard-promtool
    displayName: "dashboard-promtool"
    independent: true
  - gateName: cli-exit-codes
    displayName: "cli-exit-codes"
    independent: true
  - gateName: shell-hygiene
    displayName: "shell-hygiene"
    independent: true
  - gateName: corrections-txt-closed
    displayName: "corrections-txt-closed"
    independent: true
  # PR-diff gates (from `task quality:diff` — require base ref) —
  # these enforce changes-against-main-only rules.
  - gateName: no-new-bash
    displayName: "no-new-bash (PR-diff)"
    independent: true
    extraArgs: ["--base-ref", "origin/main", "--head-ref", "HEAD"]
  - gateName: dangling-script-refs
    displayName: "dangling-script-refs (PR-diff)"
    independent: true
    extraArgs: ["--base-ref", "origin/main", "--head-ref", "HEAD"]
  - gateName: dangling-data-refs
    displayName: "dangling-data-refs (PR-diff)"
    independent: true
    extraArgs: ["--base-ref", "origin/main", "--head-ref", "HEAD"]

# Argo UI domain (used in PR status "details" link).
# Override per environment overlay.
argoUiDomain: loopzero.local

# Resource limits per gate step. Based on observed local runs (~1 vCPU + 1GB RAM peak).
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Total Workflow timeout (T2.1 Deep Dive: 15min). Gate timeout: 3min each.
timeouts:
  workflowTotalSeconds: 900  # 15min
  gateStepSeconds: 180       # 3min

# Gitea webhook config (Phase 3).
gitea:
  # Existing ExternalSecret holds HMAC secret for webhook validation.
  webhookSecretRef: gitea-webhook-secret
  webhookSecretKey: secret
  # API token Secret for PR status posting (Phase 4).
  apiTokenSecretRef: gitea-api-token
  apiTokenSecretKey: token
  # Webhook endpoint path. Operator points Gitea repo webhook at
  # https://<eventsource-svc>/<webhookPath>
  webhookPath: "/gitea-webhook"
  # Service port for the webhook receiver.
  webhookServicePort: 12000

# PR status check name posted to Gitea API.
# Per ADR-2026-05-27-T0.2-RATIFIED D4: fixed name "quality" forever.
prStatusContext: quality

# Webhook event filter — only these PR action types trigger CI.
prEventFilter:
  - "pull_request_opened"
  - "pull_request_synchronize"
  - "pull_request_reopened"

# CronWorkflow schedules (Phase 5).
crons:
  drillWatchdog:
    enabled: true
    schedule: "0 */6 * * *"   # every 6h
    taskCommand: "task drill:watchdog"
  weeklySoak:
    enabled: true
    schedule: "0 2 * * 0"     # Sunday 02:00 UTC
    taskCommand: "task drill:l2-scale"
  coverageReport:
    enabled: true
    schedule: "0 9 * * 1"     # Monday 09:00 UTC
    taskCommand: "task quality:coverage:report"
  cosignDeadline:
    enabled: true
    schedule: "0 0 * * *"     # daily 00:00 UTC
    taskCommand: "bash infra/scripts/security/check-cosign-cutover-deadline.sh"
