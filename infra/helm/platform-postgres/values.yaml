# The PostgreSQL image the operator runs, pinned by an environment (a tag naming one minor
# release). There is no default: a cluster that forgets it would follow the operator's.
image: ""

# One primary and instances-1 standbys. With one there is no failover. With more, the
# operator spreads them (spread below), commits wait for one standby (synchronous below)
# and a PodDisruptionBudget protects them.
instances: 1

# Where the instances are kept apart. Zones, so losing one leaves a standby to promote.
# `preferred` still schedules when a zone is missing; `required` leaves the pod pending.
spread:
  topologyKey: topology.kubernetes.io/zone
  type: preferred

# With more than one instance. `required`: no commit is acknowledged before a standby has
# it, and writes stop while none is available. `preferred` keeps writing alone and can
# lose the last commits if the primary is then lost.
synchronous:
  dataDurability: required

storage:
  size: 5Gi
  # Empty: the cluster's default StorageClass.
  storageClass: ""

# A volume of its own for WAL, when sized. The operator cannot remove it later.
walStorage:
  size: ""
  storageClass: ""

# CPU and memory of each instance, as both request and limit.
resources:
  cpu: 500m
  memory: 512Mi

# postgresql.conf settings, NAME: "value". shared_buffers is PostgreSQL's 128MB unless
# set; a quarter of resources.memory is the usual starting point.
parameters: {}

network:
  # The namespace the CloudNativePG operator runs in.
  operatorNamespace: cnpg-system
  # The namespace Prometheus scrapes from (port 9187).
  metricsNamespace: monitoring
  # The pods, in this namespace, allowed to connect to PostgreSQL.
  clientPodLabels:
    app.kubernetes.io/part-of: loop-runtime-data-plane

# Base backups and the WAL archive, in S3, through the Barman Cloud plugin (a release of
# its own in the operator's namespace). Empty bucket: no archive and no backup.
backup:
  bucket: ""
  # The IAM role the instances assume to reach the bucket (IRSA). It trusts the service
  # account <namespace>:<release name>. Required with a bucket.
  roleArn: ""
  # The folder of this cluster in the bucket. Empty: the release name.
  serverName: ""
  # How long a base backup is kept, <n>d, <n>w or <n>m: the window a recovery can reach.
  retention: 30d
  # When a base backup is taken, as six cron fields with seconds first, in UTC.
  schedule: "0 0 3 * * *"

# Build the cluster from backups in the bucket in place of an empty one. serverName is the
# folder to recover from, and backup.serverName must then name another: the recovered
# cluster starts a new archive. targetTime (RFC 3339) stops the replay at that moment;
# empty replays every archived WAL. Read only when the cluster is created.
recovery:
  serverName: ""
  targetTime: ""

# One entry per service: a database `name`, owned by the login role `owner`, whose password
# is the Secret `passwordSecret` (type kubernetes.io/basic-auth, keys username and password).
# The Secret is not created here: the release that deploys the service owns it, so one
# credential has one writer.
databases: []
#  - name: looptrace
#    owner: looptrace
#    passwordSecret: looptrace-postgres-role
