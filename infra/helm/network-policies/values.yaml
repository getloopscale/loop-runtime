# Toggle the chart subpolicies (always default-deny + on/off for each rule).
defaultDenyIngress: true

# T8.5b of deep-review-remediation-plan (find_infra_007 MEDIUM).
# Egress posture for loopruntime-system. Controlled in three layers:
#
#   defaultDenyEgress: when true, ALL outbound from loopruntime-system is rejected
#                      unless explicitly allowed by per-component policies.
#                      Default OFF until T8.5c staging soak validates the
#                      allow-list inventory.
#
#   loopruntimeSystemAllowEgress: per-component allow-egress policies. SAFE to enable
#                          NOW (additive — adding allow rules to a namespace that
#                          does not yet have default-deny is a no-op for non-affected
#                          pods; the inventory in the runbook is the source of truth).
#
# Apply order per EC-5 of edge-case review:
#   1. loopruntimeSystemAllowEgress=true (no breakage; tests do not change behavior).
#   2. T8.5c staging soak — operator manually flips defaultDenyEgress=true on
#      cell-0, observes 1h.
#   3. After staging clean, flip defaultDenyEgress=true in production cells
#      one-at-a-time per PR.
defaultDenyEgress: false
loopruntimeSystemAllowEgress: false

# Namespaces enforced by these policies.
namespaces:
  - loopruntime-system
  - loopruntime-auth
  - loopruntime-build
