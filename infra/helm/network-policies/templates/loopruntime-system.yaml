{{- if .Values.defaultDenyIngress }}
# NetworkPolicies for loopruntime-system namespace.
#
# Design: default deny ingress + per-component ingress/egress rules.
# Each component declares exactly what it needs — no global egress policy
# that accidentally blocks traffic.
#
# Pod label references (verified against actual manifests):
#   loopruntime-api:        app: loopruntime-api                                       (infra/tilt/api-deployment.yaml)
#   loopruntime-operators:  app.kubernetes.io/component: loopruntime-operator          (infra/tilt/{tenant,app,preview,platform}-operator-deployment.yaml)
#   postgresql:      app.kubernetes.io/name: postgresql                  (Bitnami Helm chart)
#   gitea:           app.kubernetes.io/name: gitea                       (Gitea Helm chart)
#   minio:           app: minio                                          (MinIO Helm chart)
#
# Egress strategy: per-component policies instead of global blanket.
# A global "Egress" policy with podSelector: {} would restrict ALL pods
# to only the explicitly allowed ports — breaking any component that needs
# egress to ports not listed. Each component gets its own egress rules.
---
# Default deny all ingress in loopruntime-system
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: loopruntime-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# loopruntime-api: ingress (NodePort + metrics) + egress (GitHub, PostgreSQL, Gitea, MinIO, ArgoCD, DNS, build cluster)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api
  namespace: loopruntime-system
spec:
  podSelector:
    matchLabels:
      app: loopruntime-api
  ingress:
    - ports:
        - port: 3001
          protocol: TCP
        - port: 9090
          protocol: TCP
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL (in-namespace)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - port: 5432
          protocol: TCP
    # Gitea (in-namespace)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea
      ports:
        - port: 3000
          protocol: TCP
    # MinIO (in-namespace)
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - port: 9000
          protocol: TCP
    # ArgoCD (argocd namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
      ports:
        - port: 8080
          protocol: TCP
    # Hydra (in-namespace) — JWKS fetch (4444) + token introspection/admin (4445).
    # CHG-2026-04-22-001 B5: added after MEET-039 B3 moved engine to RSA-only with
    # live JWKS fetch. Without this rule, api → hydra is blocked by default-deny,
    # JWKS retrieval fails, and ALL authenticated requests return 401.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hydra
      ports:
        - port: 4444
          protocol: TCP
        - port: 4445
          protocol: TCP
    # Loki (monitoring namespace) — loopruntime logs queries build pipeline stdout/stderr.
    # Without this rule, `loopscale logs --build <id>` returns "No logs available" with
    # API log: "loki query failed: connection refused". Found during E2E 2026-04-23.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - port: 3100
          protocol: TCP
    # External HTTPS — GitHub API for token validation, any external webhook
    - ports:
        - port: 443
          protocol: TCP
    # Cross-cluster communication — build cluster API (Argo Workflows, NodePort range)
    # and workload cluster (Traefik). Uses IP-based rules because cross-cluster
    # traffic goes through Docker networking, not k8s service mesh.
    - ports:
        - port: 30000
          protocol: TCP
        - port: 30001
          protocol: TCP
        - port: 30090
          protocol: TCP
        - port: 6443
          protocol: TCP
        - port: 80
          protocol: TCP
  policyTypes:
    - Ingress
    - Egress
---
# loopruntime-operators: egress to Gitea, ArgoCD, Kubernetes API, DNS for all
# 4 split operator pods. Selects via the shared label
# `app.kubernetes.io/component: loopruntime-operator` applied by:
#   - infra/tilt/{tenant,app,preview,platform}-operator-deployment.yaml (LOCAL)
#   - charts/loopruntime-{tenant,app,preview,platform}-operator (production via CHG)
#
# Per ADR-0023 / plan v1.1 T1.4 + T1.5: monolith binary + chart deleted
# LOCAL; no `app: tenant-controller` pod exists in this tree. Production
# rollout is governed by separate CHG-NNNN-OPERATOR-SPLIT-PROD per
# ADR-0023 4-stage cutover.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-loopruntime-operators
  namespace: loopruntime-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: loopruntime-operator
  ingress:
    - ports:
        - port: 8081
          protocol: TCP
        - port: 8080
          protocol: TCP
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Gitea (in-namespace)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea
      ports:
        - port: 3000
          protocol: TCP
    # MinIO (in-namespace — per-tenant credential provisioning)
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - port: 9000
          protocol: TCP
    # Kubernetes API server (for CRD reconciliation, namespace management)
    - ports:
        - port: 6443
          protocol: TCP
    # ArgoCD (argocd namespace — for creating ArgoCD Applications)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
      ports:
        - port: 8080
          protocol: TCP
  policyTypes:
    - Ingress
    - Egress
---
# PostgreSQL: ingress from loopruntime-api and gitea + egress for replication/metrics
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgresql
  namespace: loopruntime-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: loopruntime-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea
      ports:
        - port: 5432
          protocol: TCP
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # REVIEW-2026-03-30: Fixes MED-09 — was "- {}" (allow all egress).
    # Now restricted to specific ports for metrics and replication.
    # Metrics (Prometheus scrape)
    - ports:
        - port: 9090
          protocol: TCP
    # PostgreSQL replication
    - ports:
        - port: 5432
          protocol: TCP
  policyTypes:
    - Ingress
    - Egress
---
# Gitea: ingress from loopruntime-api, loopruntime-operators, and ArgoCD repo-server + egress for DB and external
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gitea
  namespace: loopruntime-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gitea
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: loopruntime-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: loopruntime-operator
        # ArgoCD repo-server needs to clone tenant repos from Gitea to generate manifests.
        # It runs in the argocd namespace, so we need a cross-namespace selector.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
          podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-repo-server
      ports:
        - port: 3000
          protocol: TCP
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL (in-namespace)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - port: 5432
          protocol: TCP
    # Valkey (in-namespace)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey-cluster
      ports:
        - port: 6379
          protocol: TCP
  policyTypes:
    - Ingress
    - Egress
---
# MinIO: ingress from loopruntime-api + cross-cluster build pods + egress for DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minio
  namespace: loopruntime-system
spec:
  podSelector:
    matchLabels:
      app: minio
  ingress:
    # In-cluster: loopruntime-api pod
    - from:
        - podSelector:
            matchLabels:
              app: loopruntime-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: loopruntime-operator
      ports:
        - port: 9000
          protocol: TCP
    # Cross-cluster: build cluster workflow pods access MinIO for cache
    # save/restore via Docker networking (not k8s service mesh).
    # Port-restricted ingress without source selector covers cross-cluster traffic.
    - ports:
        - port: 9000
          protocol: TCP
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
  policyTypes:
    - Ingress
    - Egress
---
# Hydra: ingress from loopruntime-api (JWKS fetch + token introspection) + egress for DB + DNS
# CHG-2026-04-22-001 B5: added after MEET-039 B3. The `allow-api` egress rule alone
# is not sufficient — `default-deny-ingress` on loopruntime-system blocks inbound to hydra
# unless an explicit ingress policy for hydra exists. Without this, JWKS fetch
# from loopruntime-api fails with Connection refused and all authenticated requests 401.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hydra
  namespace: loopruntime-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hydra
  ingress:
    # loopruntime-api + loopruntime-operators need JWKS + token introspection.
    # loopruntime-cloud's consent handler calls the Hydra admin API (consent accept,
    # client registration) and the public API — it MUST be an explicit source
    # so the OAuth flow does not depend on the policy being unenforced (T2.1 /
    # find_infra_003: default-deny already blocks arbitrary pods; this allow-
    # lists the legitimate caller).
    - from:
        - podSelector:
            matchLabels:
              app: loopruntime-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: loopruntime-operator
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loopruntime-cloud
      ports:
        - port: 4444
          protocol: TCP
        - port: 4445
          protocol: TCP
    # hydra-maester (Hydra's OAuth2 client operator) talks to admin API
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hydra-maester
      ports:
        - port: 4445
          protocol: TCP
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL (Hydra persists consent/session state)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - port: 5432
          protocol: TCP
  policyTypes:
    - Ingress
    - Egress
---
# B82 (end-to-end-deploy-validation-plan iter 12) — static-assets nginx-s3-gateway.
# Reached by Traefik (workload cluster) for static-frontend deploys generated by
# api/internal/manifests/renderer_static.go. Egress to MinIO / DO Spaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-static-assets
  namespace: loopruntime-system
spec:
  podSelector:
    matchLabels:
      app: static-assets
  ingress:
    # Traefik (cell-0-cluster) — IngressRoutes route here for static apps.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 80
          protocol: TCP
    # In-cluster smoke probes (loopruntime-system loopruntime-operators / loopruntime-api).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: loopruntime-system
      ports:
        - port: 80
          protocol: TCP
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # S3 backend — open to any IP because the endpoint is configurable
    # (MinIO via docker bridge in standalone-multi, DO Spaces in dev/prod).
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 9000
          protocol: TCP
        - port: 32000
          protocol: TCP
  policyTypes:
    - Ingress
    - Egress
{{- end }}
