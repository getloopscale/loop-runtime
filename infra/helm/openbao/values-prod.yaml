# F1.6 — Production HA overrides (Q4 + EC-03).
#
# Per MEET-ASYNC-AMENDMENT-2026-06-02-001-openbao-f1-execution.md:
#   Q4 (architecture): 3-node Raft HA + PodAntiAffinity hard +
#                      PV 10Gi each + PDB minAvailable=2 +
#                      PriorityClass system-cluster-critical
#   Q3-F1: storageClass cluster default (do-block-storage on DOKS)
#   EC-03 (MUST FIX P1): helm fail when unseal=awskms + empty kmsKeyId
#                        — silent plaintext fallback prevention.
#                        Enforced in templates/baoconfiguration.yaml.
#   EC-09 (MUST FIX P1): SPKI extractor CronJob (T2.5 +F8 implements;
#                        cert-manager auto-renew 90d default).
#
# Helmfile L2 wiring (F1.7) injects:
#   - unseal.awskms.kmsKeyId from pulumi stack output awsKmsKeyArn
#   - backup.storage.endpoint/bucket/region from openbaoBackup* outputs
#   - openbao-backup-creds K8s Secret from openbaoBackupAccessKeyId+SecretKey

env: prod

# Q4: 3-replica Raft HA
size: 3

# Q4: Raft storage backend with persistent volume per pod
storage:
  type: raft
  raft:
    enabled: true
    size: 10Gi
    storageClass: ""  # cluster default (DOKS do-block-storage per Q3-F1)

# Q3: AWS KMS auto-unseal (kmsKeyId injected by Helmfile L2 from
# Pulumi output. EC-03 helm fail-block in baoconfiguration template
# prevents silent fallback if empty.)
unseal:
  type: awskms
  awskms:
    region: us-east-1  # Q2-F1 default; override via Helmfile if needed
    kmsKeyId: ""       # Helmfile L2 injects from pulumi stack output

# Dev mode HARD OFF (VAP F1.9 also rejects in prod NS as defense in depth)
devMode:
  enabled: false
  rootToken: ""

# TLS — cert-manager Certificate via self-signed-issuer per Q5-F1
tls:
  enabled: true
  certManager:
    enabled: true
    issuerRef:
      name: self-signed-issuer
      kind: ClusterIssuer
  duration: 2160h  # 90d

# Audit file sink (Promtail wires to Loki in F8 per Q14)
audit:
  file:
    enabled: true
    filePath: /vault/audit/audit.log
    logRaw: false
    hmacAccessor: true
    format: json

# Backup config (Q12: hourly snapshot to DO Spaces NYC3 + retention
# 7d/30d/12w). Helmfile L2 fills endpoint/bucket/region/credentials
# from F1.2 Pulumi outputs.
backup:
  enabled: true
  schedule: "0 * * * *"
  storage:
    type: s3-compatible
    endpoint: ""    # filled by Helmfile L2 from openbaoBackupBucketEndpoint
    bucket: ""      # filled from openbaoBackupBucketName
    region: ""      # filled from openbaoBackupRegion
    pathPrefix: "snapshots/"
    credentialsSecret: openbao-backup-creds
  retention:
    hourly: 7    # Q12
    daily: 30    # Q12
    weekly: 12   # Q12

# Q4 resource limits (medium-node mgmt cluster capacity)
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Q4: PodAntiAffinity hard — 1 pod per node guaranteed
podAntiAffinity:
  enabled: true
  topologyKey: kubernetes.io/hostname

# Q4: system-cluster-critical priority — last to evict under node pressure
priorityClassName: system-cluster-critical

# Q4: PDB minAvailable=2 — Raft quorum preserved during drain
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# NetworkPolicy Q4-F1 single permissive LoopZero T8.5b pattern + EC-01:
# RFC1918 blocked (egress only allows external HTTPS for AWS KMS + DO
# Spaces; intra-cluster goes via K8s API namespacedSelector kube-system).
networkPolicy:
  enabled: true
  ingressAllowedNamespaces:
    - loopzero-system
    - external-secrets
    - monitoring
  egressBlockRfc1918: true  # PROD: enforce strict egress

# Engines — F1.4 scope ships kv-v2 only.
engines:
  kvV2:
    enabled: true
    path: secret
  transit:
    enabled: false  # F3.1
  database:
    enabled: false  # F6.1
  kubernetes:
    enabled: false  # F7.1
  pki:
    enabled: false  # F11 deferred

# Auth methods — F5 expands roles + policies
authMethods:
  kubernetesMgmt:
    enabled: false  # F5.1
  oidcHydra:
    enabled: false  # F5.x via Ory Hydra

serviceMonitor:
  enabled: true
  namespace: monitoring

prometheusRule:
  enabled: true
  namespace: monitoring
