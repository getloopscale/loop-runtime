# F1.5 — k3d dev-mode overrides (Q9 single-node).
#
# Per MEET-ASYNC-AMENDMENT-2026-06-02-001-openbao-f1-execution.md Q9-F1:
#   "k3d local roda 1 pod com -dev-server (in-memory, unseal-skip,
#    root token bem-conhecido). MESMOS engines/policies/auth methods
#    que prod (via BaoConfig CRD). VAP rejeita devMode em prod NS."
#
# Pattern PG existente (Bitnami chart standalone local vs DO managed
# prod) — Rule 10 "Local equals production" interpretada como
# "comportamento observável idêntico", não "backing infra idêntico".

env: standalone

# Single replica, in-memory storage, no unseal (dev-mode auto-handles)
size: 1
storage:
  type: inmemory
  raft:
    enabled: false

unseal:
  type: none

# Dev mode ON with well-known root token (used by Tilt pre-seed jobs
# for fixture population). VAP F1.9 BLOCKS this in any namespace
# with label loopzero.io/env=prod — prevents accidental dev-mode in prod.
devMode:
  enabled: true
  rootToken: "loopzero-dev-vault-root"

# Backup OFF — k3d in-memory storage dies with cluster anyway
backup:
  enabled: false

# Affinity relaxed for k3d single-node convenience (no anti-affinity
# possible with size=1; would prevent scheduling).
podAntiAffinity:
  enabled: false

priorityClassName: ""

podDisruptionBudget:
  enabled: false

# TLS still ON (cert-manager Certificate via self-signed-issuer)
# even in standalone — keeps API surface identical to prod
# (Rule 10 "behavior parity, infra differs").
tls:
  enabled: true
  certManager:
    enabled: true
    issuerRef:
      name: self-signed-issuer
      kind: ClusterIssuer

# NetworkPolicy enabled even in standalone — validates the policy
# templates work in CI; bugs surfaced locally not in prod.
networkPolicy:
  enabled: true
  # Same ingress allowlist as prod (validates broker pattern)
  ingressAllowedNamespaces:
    - loopzero-system
    - external-secrets
    - monitoring
  egressBlockRfc1918: false  # k3d local — relaxed for cluster-internal debug

# Engines: kv-v2 only in F1.4 scope; F2/F3/F6/F7 expand same in both
engines:
  kvV2:
    enabled: true
    path: secret
  transit:
    enabled: false
  database:
    enabled: false
  kubernetes:
    enabled: false
  pki:
    enabled: false

# ServiceMonitor + PrometheusRule enabled — local Prometheus catches
# the metrics + alerts can be validated in dev before prod rollout.
serviceMonitor:
  enabled: true
  namespace: monitoring

prometheusRule:
  enabled: true
  namespace: monitoring
