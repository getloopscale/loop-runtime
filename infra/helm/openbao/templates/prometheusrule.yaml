{{/*
SPDX-License-Identifier: Apache-2.0
F1.4 — PrometheusRule with 4 P1 alerts (Q14 stub).
Full alert wiring + Grafana dashboard in F8.

Alerts (severity=critical, page operator):
  1. OpenBaoPolicyDenialSpike — vault_audit_log_response_failure rate > 0 sustained
  2. OpenBaoAuthFailureRate — failed login rate > 5/min
  3. OpenBaoAuditSinkFailure — audit log write failure
  4. OpenBaoSealStatus — any node sealed > 5min (post-startup)
*/}}
{{- if .Values.prometheusRule.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "openbao.fullname" . }}
  namespace: {{ .Values.prometheusRule.namespace | default "monitoring" }}
  labels:
    {{- include "openbao.labels" . | nindent 4 }}
    prometheus: loopzero
spec:
  groups:
    - name: openbao-p1
      interval: 30s
      rules:
        - alert: OpenBaoPolicyDenialSpike
          expr: |
            sum(rate(vault_audit_log_response_failure[5m])) > 0
          for: 5m
          labels:
            severity: critical
            component: openbao
          annotations:
            summary: "OpenBao policy denial sustained > 5min"
            description: "Possible abuse attempt OR misconfigured client. Investigate audit log."
            runbook: "docs/operations/openbao-runbook.md#policy-denial"

        - alert: OpenBaoAuthFailureRate
          expr: |
            sum(rate(vault_audit_log_request_failure[5m])) > 0.083
          for: 5m
          labels:
            severity: critical
            component: openbao
          annotations:
            summary: "OpenBao auth failure rate > 5/min sustained"
            description: "Possible credential brute force OR misconfigured auth method."
            runbook: "docs/operations/openbao-runbook.md#auth-failure"

        - alert: OpenBaoAuditSinkFailure
          expr: |
            increase(vault_audit_log_response_failure{audit_device="file"}[5m]) > 0
          for: 2m
          labels:
            severity: critical
            component: openbao
          annotations:
            summary: "OpenBao audit log write failure"
            description: "Audit sink failing = compliance gap. Check disk space + permissions."
            runbook: "docs/operations/openbao-runbook.md#audit-sink-failure"

        - alert: OpenBaoSealStatus
          expr: |
            sum(vault_core_unsealed) by (instance) == 0
          for: 5m
          labels:
            severity: critical
            component: openbao
          annotations:
            summary: "OpenBao pod sealed > 5min post-startup"
            description: "Pod cannot unseal — check AWS KMS reachability, NetworkPolicy egress, seal config."
            runbook: "docs/operations/openbao-runbook.md#unseal-failure"
{{- end }}
