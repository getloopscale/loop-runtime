{{/*
SPDX-License-Identifier: Apache-2.0
F1.4 — NetworkPolicy ingress (Q4-F1).

Ingress allowed from explicit namespaces only:
- loopzero-system: loopzero-api + 4 operators
- external-secrets: ESO controller
- monitoring: Prometheus scraping

Default namespace + tenant namespaces NOT permitted to reach Vault
(per broker pattern Q6 — tenants go through loopzero-api).

Quality gate F1.9 validates no `default` NS in ingressAllowedNamespaces.
*/}}
{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openbao.fullname" . }}-allow-ingress
  namespace: {{ include "openbao.namespace" . }}
  labels:
    {{- include "openbao.labels" . | nindent 4 }}
  annotations:
    plan.loopzero.io/ref: "F1.4 (Q4-F1) of plan 2026-06-02-openbao-adoption v1.2"
spec:
  podSelector:
    matchLabels:
      {{- include "openbao.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- range $ns := .Values.networkPolicy.ingressAllowedNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns | quote }}
      ports:
        - {protocol: TCP, port: 8200}
        {{- if eq $ns "monitoring" }}
        # Prometheus may scrape via separate metrics port if config'd
        {{- end }}
    {{- end }}
    # Raft cluster member-to-member (8201) — same namespace pods
    - from:
        - podSelector:
            matchLabels:
              {{- include "openbao.selectorLabels" . | nindent 14 }}
      ports:
        - {protocol: TCP, port: 8201}
{{- end }}
