# SPDX-License-Identifier: Apache-2.0
# F1.4 — vault-system namespace (Q2-F1 dedicated NS in mgmt cluster).
#
# loopzero.io/env label drives VAP (F1.9) gate: dev-mode literals rejected
# when label = prod per EC-04.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "openbao.namespace" . }}
  labels:
    {{- include "openbao.labels" . | nindent 4 }}
    # Pod Security Standard (restricted baseline) — non-root + no
    # privilege escalation enforced by default.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
