# F1.4 — PodDisruptionBudget (Q4: prod HA only).
#
# minAvailable=2 guarantees Raft quorum during node drain (3-replica
# tolerates 1 disruption without losing quorum).
#
# Disabled by default (standalone single-node doesn't need PDB).
# values-prod.yaml enables.
{{- if .Values.podDisruptionBudget.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "openbao.fullname" . }}
  namespace: {{ include "openbao.namespace" . }}
  labels:
    {{- include "openbao.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "openbao.selectorLabels" . | nindent 6 }}
{{- end }}
