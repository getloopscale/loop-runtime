{{/*
SPDX-License-Identifier: Apache-2.0
F1.4 — Vault CR (Bank-Vaults operator consumes this).

VK.6 LIVE refactor 2026-06-02: refactored from `kind: BaoConfiguration`
+ `apiVersion: bao.banzaicloud.io/v1alpha1` (which DOES NOT EXIST in
Bank-Vaults 1.24.0) to `kind: Vault` + `apiVersion: vault.banzaicloud.com/v1alpha1`
(the canonical CR shipped by Bank-Vaults — same CR works for OpenBao via
custom image override). Canonical schema verified via Bank-Vaults
examples/base/vault.yaml.

Scope per plan v1.2:
- kv-v2 engine ONLY (transit/database/kubernetes engines in F2/F3/F6/F7)
- Auth methods stubs ONLY (full roles + policies in F5)
- Backup config — disabled by default; values-prod.yaml enables.

EC-03 (MUST FIX P1): helm fail when unseal=awskms but kmsKeyId empty.
*/}}

{{- if and (eq .Values.unseal.type "awskms") (eq (.Values.unseal.awskms.kmsKeyId | default "") "") -}}
{{- fail "EC-03: unseal.awskms.kmsKeyId MUST be non-empty when unseal.type=awskms (silent plaintext fallback prevention)" -}}
{{- end -}}

apiVersion: vault.banzaicloud.com/v1alpha1
kind: Vault
metadata:
  name: {{ include "openbao.fullname" . }}
  namespace: {{ include "openbao.namespace" . }}
  labels:
    {{- include "openbao.labels" . | nindent 4 }}
spec:
  size: {{ .Values.size }}

  # OpenBao image (canonical Bank-Vaults Vault CRD accepts custom images
  # so we point at the OpenBao fork instead of HashiCorp Vault).
  image: {{ .Values.image.repository }}:{{ .Values.image.tag }}

  # ServiceAccount for the Vault Pod and Bank-Vaults configurer/unsealer.
  serviceAccount: openbao

  {{/* Vault/OpenBao config block (HCL/JSON-encoded). */}}
  config:
    {{- if .Values.devMode.enabled }}
    {{/* Dev mode — single in-memory, root token, TLS disabled.
         VAP F1.9 BLOCKS this in any namespace with loopzero.io/env=prod. */}}
    storage:
      inmem: {}
    listener:
      tcp:
        address: "0.0.0.0:8200"
        tls_disable: true
    ui: true
    {{- else if eq .Values.storage.type "raft" }}
    {{/* Prod HA — Raft + KMS unseal (handled by unsealConfig). */}}
    storage:
      raft:
        path: "/vault/file"
    listener:
      tcp:
        address: "0.0.0.0:8200"
        {{- if .Values.tls.enabled }}
        tls_cert_file: /vault/tls/server.crt
        tls_key_file: /vault/tls/server.key
        {{- else }}
        tls_disable: true
        {{- end }}
    ui: true
    api_addr: "https://0.0.0.0:8200"
    cluster_addr: "https://0.0.0.0:8201"
    {{- else if eq .Values.storage.type "inmemory" }}
    storage:
      inmem: {}
    listener:
      tcp:
        address: "0.0.0.0:8200"
        tls_disable: true
    ui: true
    {{- end }}

  {{/* Unseal config — only awskms here (vault-native KMS init).
       devMode auto-unseals (no unsealConfig needed). */}}
  {{- if and (not .Values.devMode.enabled) (eq .Values.unseal.type "awskms") }}
  unsealConfig:
    aws:
      kmsRegion: {{ .Values.unseal.awskms.region }}
      kmsKeyId: {{ .Values.unseal.awskms.kmsKeyId | quote }}
  {{- end }}

  {{/* Resources per Q4 — applies to Vault pod */}}
  resources:
    vault:
      requests:
        cpu: {{ .Values.resources.requests.cpu | quote }}
        memory: {{ .Values.resources.requests.memory | quote }}
      limits:
        cpu: {{ .Values.resources.limits.cpu | quote }}
        memory: {{ .Values.resources.limits.memory | quote }}

  {{/* PodAntiAffinity per Q4 (prod only) */}}
  {{- if .Values.podAntiAffinity.enabled }}
  vaultPodSpec:
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: {{ .Values.podAntiAffinity.topologyKey }}
            labelSelector:
              matchLabels:
                vault_cr: {{ include "openbao.fullname" . }}
  {{- end }}

  {{/* External config — engines + auth + policies provisioned by configurer
       sidecar after Vault is unsealed. */}}
  externalConfig:
    policies: []

    secrets:
      {{- if .Values.engines.kvV2.enabled }}
      - path: {{ .Values.engines.kvV2.path }}
        type: kv
        description: "kv-v2 engine (LoopZero platform secrets)"
        options:
          version: 2
      {{- end }}
      {{- if .Values.engines.transit.enabled }}
      - path: transit
        type: transit
        description: "transit engine (encryption-as-a-service)"
      {{- end }}
      {{- if .Values.engines.database.enabled }}
      - path: database
        type: database
        description: "database engine (dynamic DB credentials)"
      {{- end }}
      {{- if .Values.engines.pki.enabled }}
      - path: pki-internal
        type: pki
        description: "PKI engine (internal certificates)"
      {{- end }}

    auth: []
