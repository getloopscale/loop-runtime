# SPDX-License-Identifier: Apache-2.0
# OpenBao instance wrapper for LoopZero platform secret management.
#
# F1.4 of plan 2026-06-02-openbao-adoption v1.2.
# ADRs:
#   - decisions/2026-06-02-openbao-adoption.md (Q1=OpenBao MPL, Q2=vault-system
#     NS, Q4=3-node Raft HA, Q5=per-tenant transit keys, Q7=Bank-Vaults+BaoConfig,
#     Q8=cert pinning, Q9=k3d dev-mode, Q12=DO Spaces NYC3 backup, Q14=Promtail
#     audit, Q16=Helmfile L2 bootstrap-tier)
# MEET-ASYNC: meetings/MEET-ASYNC-AMENDMENT-2026-06-02-001-openbao-f1-execution.md
#   (Q4-F1 single permissive NetworkPolicy + Q5-F1 cert-manager self-signed-issuer +
#    Q6-F1 95% pkg/vault coverage)
#
# This chart deploys the OpenBao INSTANCE config (BaoConfiguration CR
# consumed by Bank-Vaults operator from infra/helm/bank-vaults-operator/).
# Operator/instance separation per K8s operator pattern.
#
# F1.4 scope (per plan v1.2):
#   - kv-v2 engine stub only (transit + database + kubernetes engines
#     come in F2/F3/F6/F7)
#   - auth methods stubs only (roles + policies expanded in F5)
#   - audit sink stub (full Promtail wiring in F8)
#
# Deployed to mgmt cluster only via infra/helmfile/mgmt.helmfile.yaml.gotmpl
# (Wave 0 — needs bank-vaults-operator).
#
# values-standalone.yaml: k3d dev-mode (replicas=1, in-memory, no unseal)
# values-prod.yaml: HA (replicas=3, Raft, AWS KMS unseal, DO Spaces backup)

apiVersion: v2
name: loopzero-openbao
description: OpenBao instance wrapper for LoopZero platform secret management (Bank-Vaults BaoConfiguration CR)
type: application
version: 0.1.0
appVersion: "2.2.0"
