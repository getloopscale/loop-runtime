apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.store.name }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "aws-secrets-manager: region is required" .Values.region | quote }}
      # No `auth`: the controller's default credential chain, which on EKS is the web
      # identity of its ServiceAccount (IRSA).
