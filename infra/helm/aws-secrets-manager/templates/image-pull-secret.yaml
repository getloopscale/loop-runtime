{{- /*
A registry pull credential as a kubernetes.io/dockerconfigjson Secret, written from a
Secrets Manager secret. Off unless imagePullSecret.secretsManagerKey is set.

Staging only. Production pulls from ECR, which the node role authorizes, and has no pull
Secret. Staging's nodes cannot pull from the emulator's ECR (it refuses blob uploads, see
environments/staging.yaml platformImages), so images come from GHCR, and the private ones
need a credential.

The Secrets Manager secret is a JSON object with the registry login:

  {"username": "<GitHub user or bot>", "password": "<token with read:packages>"}
*/ -}}
{{- with .Values.imagePullSecret }}
{{- if .secretsManagerKey }}
{{- $registry := required "aws-secrets-manager: imagePullSecret.registry is required" .registry }}
{{- range $namespace := .namespaces }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $.Values.imagePullSecret.name }}
  namespace: {{ $namespace }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.store.name }}
  target:
    name: {{ $.Values.imagePullSecret.name }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: {{ printf `{"auths":{"%s":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%%s:%%s" .username .password | b64enc }}"}}}` $registry | squote }}
  data:
    - secretKey: username
      remoteRef: { key: {{ $.Values.imagePullSecret.secretsManagerKey | quote }}, property: username }
    - secretKey: password
      remoteRef: { key: {{ $.Values.imagePullSecret.secretsManagerKey | quote }}, property: password }
{{- end }}
{{- end }}
{{- end }}
