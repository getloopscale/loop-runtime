{{- /*
The core cluster's credentials, each one an ExternalSecret that writes the Kubernetes
Secret the consuming chart already reads. The connection strings are assembled by the
External Secrets template engine from the raw values, so no password passes through Helm
or through a helmfile environment variable.

Every target is Owner-created: deleting this release deletes the Secrets it wrote, and
a value changed in Secrets Manager reaches the cluster within refreshInterval.
*/ -}}
{{- if .Values.coreSecrets }}
{{- $platform := required "aws-secrets-manager: platformSecret is required" .Values.platformSecret }}
{{- $db := .Values.database }}
{{- $dbHost := required "aws-secrets-manager: database.host is required (data/rds address)" $db.host }}
{{- $master := required "aws-secrets-manager: database.masterSecret is required (data/rds master_user_secret_arn)" $db.masterSecret }}
{{- $cache := .Values.cache }}
{{- $cacheHost := required "aws-secrets-manager: cache.host is required (data/valkey primary_endpoint_address)" $cache.host }}
{{- $cacheToken := required "aws-secrets-manager: cache.authTokenSecret is required (data/valkey auth_token_secret_arn)" $cache.authTokenSecret }}
{{- $endpoint := printf "%s:%v" $dbHost $db.port }}
{{- $userinfo := "{{ .username | urlquery }}:{{ .password | urlquery }}" }}
---
# loop-runtime-api, its migrations and loop-console. `uri` is the owner's, for migrations
# only; the API serves requests as loop_runtime_api and runs its cross-tenant loops as
# loop_runtime_worker (#396), loop-console connects as loop_console (#438). The three role
# passwords are the platform's; database-bootstrap creates the roles with them.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: loop-runtime-db-credentials
  namespace: loop-runtime-system
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.store.name }}
  target:
    name: loop-runtime-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        host: {{ $dbHost | quote }}
        port: {{ $db.port | toString | quote }}
        database: {{ $db.name | quote }}
        user: "{{ "{{ .username }}" }}"
        password: "{{ "{{ .password }}" }}"
        uri: {{ printf "postgresql://%s@%s/%s?sslmode=%s" $userinfo $endpoint $db.name $db.sslmode | quote }}
        api-password: "{{ "{{ .apiPassword }}" }}"
        worker-password: "{{ "{{ .workerPassword }}" }}"
        cloud-password: "{{ "{{ .cloudPassword }}" }}"
        api-uri: {{ printf "postgresql://loop_runtime_api:{{ .apiPassword | urlquery }}@%s/%s?sslmode=%s" $endpoint $db.name $db.sslmode | quote }}
        worker-uri: {{ printf "postgresql://loop_runtime_worker:{{ .workerPassword | urlquery }}@%s/%s?sslmode=%s" $endpoint $db.name $db.sslmode | quote }}
        cloud-uri: {{ printf "postgresql://loop_console:{{ .cloudPassword | urlquery }}@%s/%s?sslmode=%s" $endpoint $db.name $db.sslmode | quote }}
  data:
    - secretKey: username
      remoteRef: { key: {{ $master | quote }}, property: username }
    - secretKey: password
      remoteRef: { key: {{ $master | quote }}, property: password }
    - secretKey: apiPassword
      remoteRef: { key: {{ $platform | quote }}, property: database-api-password }
    - secretKey: workerPassword
      remoteRef: { key: {{ $platform | quote }}, property: database-worker-password }
    - secretKey: cloudPassword
      remoteRef: { key: {{ $platform | quote }}, property: database-cloud-password }
---
# Kratos reads an existing Secret when the chart's own is disabled (secret.enabled=false,
# secret.nameOverride): DSN, SECRETS_DEFAULT, SECRETS_COOKIE and SECRETS_CIPHER.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ory-kratos-credentials
  namespace: loop-runtime-auth
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.store.name }}
  target:
    name: ory-kratos-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        dsn: {{ printf "postgres://%s@%s/%s?sslmode=%s" $userinfo $endpoint $db.kratosDatabase $db.sslmode | quote }}
        secretsDefault: "{{ "{{ .secretDefault }}" }}"
        secretsCookie: "{{ "{{ .secretCookie }}" }}"
        secretsCipher: "{{ "{{ .secretCipher }}" }}"
  data:
    - secretKey: username
      remoteRef: { key: {{ $master | quote }}, property: username }
    - secretKey: password
      remoteRef: { key: {{ $master | quote }}, property: password }
    - secretKey: secretDefault
      remoteRef: { key: {{ $platform | quote }}, property: kratos-secret-default }
    - secretKey: secretCookie
      remoteRef: { key: {{ $platform | quote }}, property: kratos-secret-cookie }
    - secretKey: secretCipher
      remoteRef: { key: {{ $platform | quote }}, property: kratos-secret-cipher }
---
# Hydra, the same way: DSN, SECRETS_SYSTEM and SECRETS_COOKIE.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ory-hydra-credentials
  namespace: loop-runtime-auth
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.store.name }}
  target:
    name: ory-hydra-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        dsn: {{ printf "postgres://%s@%s/%s?sslmode=%s" $userinfo $endpoint $db.hydraDatabase $db.sslmode | quote }}
        secretsSystem: "{{ "{{ .secretSystem }}" }}"
        secretsCookie: "{{ "{{ .secretCookie }}" }}"
  data:
    - secretKey: username
      remoteRef: { key: {{ $master | quote }}, property: username }
    - secretKey: password
      remoteRef: { key: {{ $master | quote }}, property: password }
    - secretKey: secretSystem
      remoteRef: { key: {{ $platform | quote }}, property: hydra-secret-system }
    - secretKey: secretCookie
      remoteRef: { key: {{ $platform | quote }}, property: hydra-secret-cookie }
---
# Gitea's database password and its three Valkey connections (session, cache, queue),
# read through gitea.additionalConfigFromEnvs. ElastiCache with transit encryption takes
# `rediss://`; the AUTH token is the password of the default user.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitea-backing-services
  namespace: loop-runtime-system
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.store.name }}
  target:
    name: gitea-backing-services
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        database-user: "{{ "{{ .username }}" }}"
        database-password: "{{ "{{ .password }}" }}"
        {{- range $i, $use := list "session" "cache" "queue" }}
        {{ $use }}-url: {{ printf "rediss://default:{{ .token | urlquery }}@%s:%v/%d?pool_size=100&idle_timeout=180s" $cacheHost $cache.port $i | quote }}
        {{- end }}
  data:
    - secretKey: username
      remoteRef: { key: {{ $master | quote }}, property: username }
    - secretKey: password
      remoteRef: { key: {{ $master | quote }}, property: password }
    - secretKey: token
      remoteRef: { key: {{ $cacheToken | quote }} }
---
# loop-runtime-api's internal call secrets, read as an optional envFrom source.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: loop-runtime-api-internal
  namespace: loop-runtime-system
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.store.name }}
  target:
    name: loop-runtime-api-internal
    creationPolicy: Owner
  data:
    - secretKey: LOOP_RUNTIME_BOOTSTRAP_SECRET
      remoteRef: { key: {{ $platform | quote }}, property: api-bootstrap-secret }
    - secretKey: LOOP_RUNTIME_ARGO_CALLBACK_SECRET
      remoteRef: { key: {{ $platform | quote }}, property: api-argo-callback-secret }
    - secretKey: LOOP_RUNTIME_SECRET_ENCRYPTION_KEY
      remoteRef: { key: {{ $platform | quote }}, property: api-secret-encryption-key }
---
# The X-Service-Auth secret loop-runtime-api and loop-console share.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: loop-runtime-service-auth
  namespace: loop-runtime-system
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.store.name }}
  target:
    name: loop-runtime-service-auth
    creationPolicy: Owner
  data:
    - secretKey: LOOP_RUNTIME_SERVICE_AUTH_SECRET
      remoteRef: { key: {{ $platform | quote }}, property: service-auth-secret }
---
# loop-console's own secrets, mounted whole as the chart's existingSecret. Its session
# tokens are signed with SESSION_TOKEN_SECRET; without it every pod makes up its own, and a
# token dies with the pod that issued it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: loop-console-secrets
  namespace: loop-runtime-system
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.store.name }}
  target:
    name: loop-console-secrets
    creationPolicy: Owner
  data:
    - secretKey: SESSION_TOKEN_SECRET
      remoteRef: { key: {{ $platform | quote }}, property: session-token-secret }
{{- with .Values.stripeSecret }}
    # Stripe's keys, which production mode requires (test-mode keys on staging).
    - secretKey: STRIPE_API_KEY
      remoteRef: { key: {{ . | quote }}, property: api-key }
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef: { key: {{ . | quote }}, property: webhook-secret }
    # The price ids of the plans checkout sells (internal/billing/plans.go in the console).
    - secretKey: STRIPE_PRICE_STARTER
      remoteRef: { key: {{ . | quote }}, property: price-starter }
    - secretKey: STRIPE_PRICE_PRO
      remoteRef: { key: {{ . | quote }}, property: price-pro }
    - secretKey: STRIPE_PRICE_TEAM
      remoteRef: { key: {{ . | quote }}, property: price-team }
{{- end }}
{{- with .Values.githubAppSecret }}
---
# The GitHub App loop-runtime-api deploys from (id, private key, webhook HMAC secret, and the
# OAuth client it asks GitHub with which installations a user can access), read as the
# optional envFrom source loop-runtime-api-github its values-bootstrap declares.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: loop-runtime-api-github
  namespace: loop-runtime-system
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.store.name }}
  target:
    name: loop-runtime-api-github
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_APP_ID
      remoteRef: { key: {{ . | quote }}, property: app-id }
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef: { key: {{ . | quote }}, property: private-key }
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef: { key: {{ . | quote }}, property: webhook-secret }
    - secretKey: GITHUB_APP_CLIENT_ID
      remoteRef: { key: {{ . | quote }}, property: client-id }
    - secretKey: GITHUB_APP_CLIENT_SECRET
      remoteRef: { key: {{ . | quote }}, property: client-secret }
{{- end }}
---
# The bearer the public edge presents to /internal/edge/route.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: loop-runtime-edge-route-token
  namespace: loop-runtime-system
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.store.name }}
  target:
    name: loop-runtime-edge-route-token
    creationPolicy: Owner
  data:
    - secretKey: LOOP_RUNTIME_EDGE_ROUTE_TOKEN
      remoteRef: { key: {{ $platform | quote }}, property: edge-route-token }
---
# Kratos's courier authenticates to Resend with this key. It is a third-party credential,
# not one the platform can generate. With resendSecret it comes from that secret, and the
# Secret also carries COURIER_HTTP_REQUEST_CONFIG_AUTH_CONFIG_VALUE, the config override
# the courier authenticates with, so the key never passes through Helm. Without it,
# seed-aws-platform-secret.sh writes a placeholder that Resend rejects.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ory-kratos-resend
  namespace: loop-runtime-auth
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.store.name }}
  target:
    name: ory-kratos-resend
    creationPolicy: Owner
{{- if .Values.resendSecret }}
    template:
      engineVersion: v2
      data:
        RESEND_API_KEY: "{{ "{{ .apiKey }}" }}"
        COURIER_HTTP_REQUEST_CONFIG_AUTH_CONFIG_VALUE: "Bearer {{ "{{ .apiKey }}" }}"
  data:
    - secretKey: apiKey
      remoteRef: { key: {{ .Values.resendSecret | quote }}, property: api-key }
{{- else }}
  data:
    - secretKey: RESEND_API_KEY
      remoteRef: { key: {{ $platform | quote }}, property: resend-api-key }
{{- end }}
{{- end }}
