# Self-signed CA chain for LoopRuntime development and staging environments.
#
# Architecture:
#   1. selfsigned-bootstrap: a ClusterIssuer that can issue self-signed certificates
#   2. loopruntime-ca: a CA Certificate issued by the bootstrap issuer (isCA: true)
#   3. loopruntime-ca-issuer: a ClusterIssuer that uses loopruntime-ca to issue real certificates
#
# For production: replace loopruntime-ca-issuer with an ACME-backed ClusterIssuer
# (e.g., Let's Encrypt) and update the tlsStore default certificate.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: loopruntime-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: LoopRuntime Platform CA
  secretName: loopruntime-ca-secret
  duration: 87600h  # 10 years
  renewBefore: 8760h  # 1 year
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: loopruntime-ca-issuer
spec:
  ca:
    secretName: loopruntime-ca-secret
