# Wildcard certificate + TLSStore for Traefik.
# Applied AFTER Traefik install (requires traefik namespace + TLSStore CRD).
---
# Wildcard certificate for *.loopruntime.local — covers all tenant app hostnames.
# In production, this would be replaced by per-tenant or per-environment certificates
# issued by an ACME ClusterIssuer.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: loopruntime-wildcard
  namespace: traefik
spec:
  secretName: loopruntime-wildcard-tls
  duration: 8760h  # 1 year
  renewBefore: 720h  # 30 days
  commonName: "*.loopruntime.local"
  dnsNames:
    - "*.loopruntime.local"
    - "*.*.loopruntime.local"
  issuerRef:
    name: loopruntime-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# TLSStore configures Traefik's default certificate for all IngressRoutes
# that use tls: {} without specifying a secretName.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
spec:
  defaultCertificate:
    secretName: loopruntime-wildcard-tls
