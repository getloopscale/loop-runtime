resources:
  limits:
    cpu: "200m"
    memory: "128Mi"
  requests:
    cpu: "50m"
    memory: "64Mi"

securityContext:
  runAsNonRoot: true

installCRDs: true

# Prometheus metrics for cert-manager (certificate expiry, issuance latency)
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
