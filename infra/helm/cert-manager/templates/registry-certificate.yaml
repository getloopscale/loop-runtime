---
# Server certificate for the local container registry.
# Issued by loop-runtime-local-ca-issuer. Consumed by the k3d registry Docker container
# via volume mount (see Taskfile `registry:tls:setup` task that extracts this
# Secret to the host filesystem).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: loop-runtime-local-registry
  namespace: cert-manager
  labels:
    app.kubernetes.io/part-of: loop-runtime
    app.kubernetes.io/component: registry-tls
spec:
  commonName: k3d-loop-runtime-registry
  dnsNames:
    - k3d-loop-runtime-registry
    - k3d-loop-runtime-registry.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  secretName: loop-runtime-local-registry-tls
  duration: 8760h    # 1 year
  renewBefore: 720h  # 30 days
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - server auth
    - digital signature
    - key encipherment
  issuerRef:
    name: loop-runtime-local-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
