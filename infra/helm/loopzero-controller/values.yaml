# B51 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — `replicaCount: 0` because
# the operators binary is monolithic and competes with tenant-controller
# for the SAME leader-election lease (`loopzero-system/loopzero-operators.loopzero.io`).
# Two replicas → whichever loses the lease enters CrashLoopBackOff after
# informer sync timeout. The tenant-controller chart is the canonical
# leader; this chart kept at 0 until the T2 follow-up deletes it entirely.
replicaCount: 0

# B32 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — The image was previously
# `loopzero-api` but the operators monolith binary is published as
# `loopzero-tenant-controller` (see `operators/Dockerfile` ENTRYPOINT and
# `.github/workflows/build-images.yml` "Build loopzero-tenant-controller").
# `loopzero-api` is the HTTP API server with NO controller-runtime
# manager — this chart's reconcile loops never ran in production.
#
# TECH DEBT: This `loopzero-controller` chart is redundant with the
# `tenant-controller` chart (both deploy the same binary). One of them
# must be eliminated in a follow-up T2 change. Until that meeting
# happens, both point to the same image so the install path works.
image:
  repository: registry.digitalocean.com/loopzero-system/loopzero-tenant-controller
  tag: REDACTED_SECRET_061
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: loopzero-registry-pull

wiringConfigMap: loopzero-platform-topology
dbCredentialsSecret: loopzero-db-credentials

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  LOOPZERO_CONTROLLER_MODE: "true"
  LOOPZERO_LOG_LEVEL: "info"
  LOOPZERO_CLUSTER_ISSUER: "letsencrypt-prod"
  # B43 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — controller binary requires
  # BASE_DOMAIN to construct preview URLs and tenant subdomains. In LoopZero
  # Cloud, Pulumi sets this to dev.loopzero.example / prod.loopzero.example. In
  # standalone single-cluster, this value is what the customer chooses
  # for their self-hosted deployment.
  BASE_DOMAIN: "loopzero.local"
  LOOPZERO_BASE_DOMAIN: "loopzero.local"
  # B66/B69 (end-to-end-deploy-validation-plan iter 8) — same as tenant-
  # controller (monolithic binary). GITEA_URL + GITEA_ORG required for
  # tenant-controller logic to reconcile gitea repos.
  GITEA_URL: "http://gitea-http.loopzero-system.svc.cluster.local:3000"
  GITEA_ORG: "loopzero-platform"
