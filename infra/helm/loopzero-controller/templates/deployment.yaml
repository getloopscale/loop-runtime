apiVersion: apps/v1
kind: Deployment
metadata:
  name: loopzero-controller
  labels:
    app: loopzero-controller
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    loopzero.io/component: loopzero-controller
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: loopzero-controller
  template:
    metadata:
      labels:
        app: loopzero-controller
    spec:
      serviceAccountName: loopzero-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # B42 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — Mount synthetic kubeconfigs.
      volumes:
        - name: cluster-kubeconfigs
          secret:
            secretName: loopzero-cluster-kubeconfigs
            optional: true
      containers:
        - name: loopzero-controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: cluster-kubeconfigs
              mountPath: /etc/loopzero/kubeconfigs
              readOnly: true
          env:
            - name: MGMT_KUBECONFIG
              value: /etc/loopzero/kubeconfigs/mgmt.kubeconfig
            - name: BUILD_KUBECONFIG
              value: /etc/loopzero/kubeconfigs/build.kubeconfig
            - name: RUNTIME_KUBECONFIG
              value: /etc/loopzero/kubeconfigs/runtime.kubeconfig
            - name: MGMT_KUBE_CONTEXT
              value: "in-cluster"
            - name: BUILD_KUBE_CONTEXT
              value: "in-cluster"
            - name: RUNTIME_KUBE_CONTEXT
              value: "in-cluster"
            {{- range $k, $v := .Values.env }}
            - name: {{ $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
            # B35 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — same as loopzero-api:
            # secret key `uri` mapped to env var `DATABASE_URL`.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbCredentialsSecret | quote }}
                  key: uri
                  optional: true
            # B41 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — controller binary
            # requires GITEA_TOKEN to push to gitops repos. Mapped from
            # secret key `token` (provisioned by generate-secrets.sh).
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-admin
                  key: token
                  optional: true
          envFrom:
            - configMapRef:
                name: {{ .Values.wiringConfigMap | quote }}
                optional: true
            - secretRef:
                name: {{ .Values.dbCredentialsSecret | quote }}
                optional: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loopzero-controller
  labels:
    app: loopzero-controller
