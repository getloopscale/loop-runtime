# ClusterRole + ClusterRoleBinding for loopzero-controller.
# Grants read across all namespaces (status reconciliation) and write on
# LoopZero CRDs (LoopZeroApplication, ExposedRoute, Environment) + ArgoCD Applications.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loopzero-controller
  labels:
    app: loopzero-controller
    loopzero.io/component: loopzero-controller
rules:
  # B51 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — Wildcard for all loopzero.io
  # resources because the operators binary is monolithic (see
  # tenant-controller/templates/rbac.yaml for full reasoning).
  - apiGroups: ["loopzero.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ArgoCD Applications + AppProjects (CRUD)
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "appprojects"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Cross-cluster read for status aggregation
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "endpoints", "namespaces"]
    verbs: ["get", "list", "watch"]
  # Events — record reconcile outcomes
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loopzero-controller
  labels:
    app: loopzero-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loopzero-controller
subjects:
  - kind: ServiceAccount
    name: loopzero-controller
    namespace: {{ .Release.Namespace }}
