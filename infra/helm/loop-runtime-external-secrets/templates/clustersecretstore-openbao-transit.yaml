# SPDX-License-Identifier: Apache-2.0
# T2.4 of plan 2026-06-10-j22-openbao-transit-eso-sync v1.2 —
# ClusterSecretStore for the OpenBao transit encrypt/decrypt broker.
# T1.2 of plan dev-public-cross-cluster-secrets v1.1 (issue #111) —
# adds auth.kind selector to switch between AppRole (legacy) and
# Kubernetes-auth (workload identity, blueprint D1). Default kind=appRole
# preserves backwards compat with single-cluster overlays.
#
# When .Values.openbaoTransit.enabled is true, this template renders the
# canonical "openbao-transit" CSS that ESO consumes when an
# ExternalSecret in a tenant workload namespace references it via
# secretStoreRef.name=openbao-transit.
#
# Per D3 ADR: ESO reconciles ExternalSecret CRs via this CSS; the auth
# path is OpenBao AppRole (durable role_id + short-lived secret_id),
# isolated from the loop-runtime-secrets-secrets CSS (Phase 3.1) so transit
# encrypt/decrypt is a separate blast-radius from KV reads.
#
# Per D4 ADR: blast-radius isolation requires per-tenant transit keys;
# loop-runtime-api's AppRole policy MUST permit:
#   transit/encrypt/loop-runtime-tenants/{request_tenant_id}
#   transit/decrypt/loop-runtime-tenants/{request_tenant_id}
#   transit/keys/loop-runtime-tenants/{request_tenant_id}  (EC-06 auto-create)
#
# values.yaml documents:
#   openbaoTransit:
#     enabled: bool                  default false (opt-in)
#     server:  string                openbao service URL
#     auth:
#       kind: string                 "appRole" (default) | "kubernetes"
#       kubernetes:                  (T1.2 — when kind=kubernetes)
#         role:        string        OpenBao role bound to the ESO SA
#         mountPath:   string        auth/<mountPath>/login (default "kubernetes")
#         serviceAccountRef:
#           name:      string
#           namespace: string
#           audiences: list[string]  TokenRequest aud (EC-5: == role bound_audiences)
#     authPath: string               (legacy — kind=appRole) AppRole mount path
#     roleId:  string                (legacy — kind=appRole) AppRole role_id
#     secretRef:                     (legacy — kind=appRole) K8s Secret holding secret_id
#       name:      string
#       namespace: string
#       key:       string
#     caBundle: string (base64)      optional inline CA bundle for TLS

{{- if .Values.openbaoTransit.enabled }}
{{- $bt := .Values.openbaoTransit }}
{{- $kind := default "appRole" (and $bt.auth $bt.auth.kind) }}
{{- if not $bt.server }}
{{- fail "openbaoTransit.enabled=true requires openbaoTransit.server (e.g. https://openbao.secrets-system.svc:8200)" }}
{{- end }}
{{- if eq $kind "kubernetes" }}
{{- if or (not $bt.auth) (not $bt.auth.kubernetes) (not $bt.auth.kubernetes.role) }}
{{- fail "openbaoTransit.auth.kind=kubernetes requires openbaoTransit.auth.kubernetes.role (the OpenBao role bound to the ESO SA — see T1.2 of dev-public-cross-cluster-secrets / issue #111)" }}
{{- end }}
{{- if or (not $bt.auth.kubernetes.serviceAccountRef) (not $bt.auth.kubernetes.serviceAccountRef.name) }}
{{- fail "openbaoTransit.auth.kind=kubernetes requires openbaoTransit.auth.kubernetes.serviceAccountRef.{name,namespace} (the ESO controller ServiceAccount that OpenBao kubernetes-auth trusts)" }}
{{- end }}
{{- else }}
{{- if not $bt.roleId }}
{{- fail "openbaoTransit.enabled=true (kind=appRole) requires openbaoTransit.roleId (AppRole role_id)" }}
{{- end }}
{{- if or (not $bt.secretRef) (not $bt.secretRef.name) }}
{{- fail "openbaoTransit.enabled=true (kind=appRole) requires openbaoTransit.secretRef.{name,namespace,key} pointing at the K8s Secret holding the AppRole secret_id" }}
{{- end }}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: openbao-transit
  labels:
    app.kubernetes.io/name: openbao-transit
    app.kubernetes.io/managed-by: loop-runtime
    runtime.getloopscale.com/plan: 2026-06-10-j22-openbao-transit-eso-sync
    runtime.getloopscale.com/task: T2.4
    runtime.getloopscale.com/auth-kind: {{ $kind | quote }}
spec:
  provider:
    vault:
      server: {{ $bt.server | quote }}
      # ESO Vault provider supports the transit backend via the path field;
      # leaving it empty defers to OpenBao's per-operation routing where
      # /v1/transit/encrypt/loop-runtime-tenants/<id> is constructed by loop-runtime-api
      # (write path) or by the ExternalSecret's dataFrom rewrite (read path).
      path: ""
      version: "v1"
      {{- if $bt.caBundle }}
      caBundle: {{ $bt.caBundle | quote }}
      {{- end }}
      auth:
        {{- if eq $kind "kubernetes" }}
        # T1.2 of plan dev-public-cross-cluster-secrets (issue #111).
        # Workload-identity auth: ESO controller's SA token (TokenRequest
        # API) is presented to OpenBao /v1/auth/<mountPath>/login. The
        # OpenBao role's `bound_audiences` MUST match the audiences below
        # (EC-5). For cross-cluster Approach A topology, the OpenBao
        # kubernetes-auth method MUST be configured to review the mgmt-
        # cluster's tokens — JWKS-static (preferred) OR kubernetes_host=
        # mgmt + disable_local_ca_jwt=true (EC-1).
        kubernetes:
          mountPath: {{ default "kubernetes" $bt.auth.kubernetes.mountPath | quote }}
          role: {{ $bt.auth.kubernetes.role | quote }}
          serviceAccountRef:
            name: {{ $bt.auth.kubernetes.serviceAccountRef.name | quote }}
            namespace: {{ default "external-secrets" $bt.auth.kubernetes.serviceAccountRef.namespace | quote }}
            {{- if $bt.auth.kubernetes.serviceAccountRef.audiences }}
            audiences:
              {{- range $bt.auth.kubernetes.serviceAccountRef.audiences }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
        {{- else }}
        appRole:
          path: {{ $bt.authPath | default "approle" | quote }}
          roleId: {{ $bt.roleId | quote }}
          secretRef:
            name: {{ $bt.secretRef.name | quote }}
            namespace: {{ $bt.secretRef.namespace | default "external-secrets" | quote }}
            key: {{ $bt.secretRef.key | default "secret-id" | quote }}
        {{- end }}
{{- end }}
