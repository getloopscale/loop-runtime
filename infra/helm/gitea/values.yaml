# PRODUCTION WARNING: Override ALL passwords before deploying to production.
# Default values are for local development only.
# Use --set gitea.admin.password=<secure-value> or a values override file.
gitea:
  admin:
    username: loopzero-admin
    password: loopzero-dev-password  # LOCAL DEV ONLY — override for production
    email: admin@loopzero.local
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  config:
    database:
      DB_TYPE: postgres
      HOST: postgresql.loopzero-system.svc.cluster.local:5432
      NAME: gitea
      USER: loopzero
      PASSWD: loopzero-dev-password  # LOCAL DEV ONLY — override for production
      SSL_MODE: disable
    server:
      ROOT_URL: http://localhost:3000
      HTTP_PORT: 3000
    service:
      DISABLE_REGISTRATION: true
    metrics:
      ENABLED: true
      ENABLE_PPROF: false

image:
  tag: "1.22.6"

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

podSecurityContext:
  runAsNonRoot: true

service:
  http:
    type: NodePort
    nodePort: 30000

persistence:
  size: 1Gi

redis-cluster:
  enabled: false

postgresql-ha:
  enabled: false

postgresql:
  enabled: false
