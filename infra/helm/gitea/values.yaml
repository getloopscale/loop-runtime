# PRODUCTION WARNING: Override ALL passwords before deploying to production.
# Default values are for local development only.
# Use --set gitea.admin.password=<secure-value> or a values override file.
gitea:
  admin:
    # Admin creds come from the canonical gitea-admin secret (minted by
    # generate-secrets.sh pre-sync, keys: username + password). Earlier this was
    # an empty inline password → Gitea generated a random admin password that
    # diverged from gitea-admin.password, breaking the later token-registration
    # bootstrap step. existingSecret keeps Gitea + the secret in sync by
    # construction. Fix: finding-2026-05-22-pg-password-divergence (same T1.3 class).
    existingSecret: gitea-admin
    email: admin@loopzero.local
  # DB password injected from the canonical loopzero-db-credentials secret. Gitea's
  # environment-to-ini step (init container) reads GITEA__database__PASSWD and
  # writes it into app.ini before `gitea migrate` runs in configure-gitea.
  # Earlier config.database.PASSWD was "" expecting a never-wired helmfile
  # $LOOPZERO_DB_PASSWORD override → configure-gitea crashed with SASL auth failure
  # (same T1.3 regression as postgresql/kratos). See finding-2026-05-22-pg-password-divergence.
  additionalConfigFromEnvs:
    - name: GITEA__database__PASSWD
      valueFrom:
        secretKeyRef:
          name: loopzero-db-credentials
          key: password
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  config:
    database:
      DB_TYPE: postgres
      HOST: postgresql.loopzero-system.svc.cluster.local:5432
      NAME: gitea
      USER: loopzero
      PASSWD: ""  # T1.3: empty → Gitea startup fails fast with explicit DB auth error; override via helmfile inline or --set gitea.config.database.PASSWD=$LOOPZERO_DB_PASSWORD
      SSL_MODE: disable
      MAX_OPEN_CONNS: "8"        # Bug #44 HA: 8 pods × 8 = 64 conns — under DO PG default 50 headroom
      MAX_IDLE_CONNS: "4"
      CONN_MAX_LIFETIME: "3600s"
    server:
      ROOT_URL: http://gitea-http.loopzero-system.svc.cluster.local:3000
      HTTP_PORT: 3000
    service:
      DISABLE_REGISTRATION: true
    metrics:
      ENABLED: true
      ENABLE_PPROF: false
    # Bug #44 HA config (per Gitea Enterprise HA docs + helm-gitea/ha-setup.md).
    # Without these, session/cache/queue use in-memory per-pod → auth cache
    # misses race across pods, producing 401 mid-stream. Redis shares state.
    # Redis is the bitnami `gitea-redis` Helmfile release (standalone), whose
    # primary Service is `gitea-redis-master:6379`. The CHG-2026-05-05 attempt to
    # ship a custom `gitea-redis`-named Service via infra/helm/gitea/templates/
    # redis.yaml is DEAD: the gitea release uses the REMOTE gitea-charts/gitea
    # chart, so that local template is never rendered. Pointing at the bare
    # `gitea-redis` made gitea crash with "lookup gitea-redis: no such host"
    # (finding-2026-05-22-pg-password-divergence § gitea-redis). Use the bitnami
    # primary service name. Prod parity: same bitnami release runs in dev/prod.
    session:
      PROVIDER: redis
      PROVIDER_CONFIG: "network=tcp,addr=gitea-redis-master:6379,db=0,pool_size=100,idle_timeout=180s"
    cache:
      ADAPTER: redis
      HOST: "network=tcp,addr=gitea-redis-master:6379,db=1,pool_size=100,idle_timeout=180s"
    queue:
      TYPE: redis
      CONN_STR: "network=tcp,addr=gitea-redis-master:6379,db=2,pool_size=100,idle_timeout=180s"
    # Bleve repo indexer breaks HA — disable for multi-pod
    indexer:
      ISSUE_INDEXER_TYPE: db
      REPO_INDEXER_ENABLED: false

image:
  tag: "1.22.6"

resources:
  # Bug #44 fix persisted: L3 c=30 saturated default 500m CPU (7s auth latency
  # → 401 errors in git push). Per-pod headroom for burst + HPA scaling across
  # replicas. See scale-50k-technical-debt.
  limits:
    cpu: "3000m"     # was 500m
    memory: "2Gi"    # was 512Mi
  requests:
    cpu: "500m"      # was 100m
    memory: "1Gi"    # was 128Mi

podSecurityContext:
  runAsNonRoot: true

service:
  http:
    # Bug #44 fix: ClusterIP virtual IP (not headless) enables kube-proxy LB.
    type: ClusterIP
    #
    # NO sessionAffinity — git HTTP uses Authorization header per request
    # (stateless at transport), so ClientIP stickiness just creates
    # hotspots when API pods have few IPs. Redis session/cache/queue
    # (configured in gitea.config above) is the HA primitive that
    # makes auth safe across pods. Per research:
    # https://docs.gitea.com/enterprise/installation/high-availability
    sessionAffinity: None

persistence:
  size: 1Gi

redis-cluster:
  enabled: false

postgresql-ha:
  enabled: false

postgresql:
  enabled: false
