# PRODUCTION WARNING: Override ALL passwords before deploying to production.
# Default values are for local development only.
# Use --set gitea.admin.password=<secure-value> or a values override file.
gitea:
  admin:
    username: gitea_admin
    password: loopzero-gitea-dev-2026  # LOCAL DEV ONLY — matches provision-api-tokens.sh defaults
    email: admin@loopzero.local
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  config:
    database:
      DB_TYPE: postgres
      HOST: postgresql.loopzero-system.svc.cluster.local:5432
      NAME: gitea
      USER: loopzero
      PASSWD: loopzero-dev-password  # LOCAL DEV ONLY — override for production
      SSL_MODE: disable
    server:
      ROOT_URL: http://gitea-http.loopzero-system.svc.cluster.local:3000
      HTTP_PORT: 3000
    service:
      DISABLE_REGISTRATION: true
    metrics:
      ENABLED: true
      ENABLE_PPROF: false

image:
  tag: "1.22.6"

resources:
  # Bug #44 fix persisted: L3 c=30 saturated default 500m CPU (7s auth latency
  # → 401 errors in git push). Per-pod headroom for burst + HPA scaling across
  # replicas. See docs/plans/scale-50k-technical-debt.md.
  limits:
    cpu: "3000m"     # was 500m
    memory: "2Gi"    # was 512Mi
  requests:
    cpu: "500m"      # was 100m
    memory: "1Gi"    # was 128Mi

podSecurityContext:
  runAsNonRoot: true

service:
  http:
    # Bug #44 root-cause deeper fix: NodePort (or headless ClusterIP from the
    # gitea-http subchart) prevents kube-proxy load-balancing across HPA
    # replicas. With NodePort + single-endpoint DNS lookup, all git pushes
    # hit the first pod. Forcing ClusterIP with virtual IP enables round-
    # robin across replicas.
    type: ClusterIP
    # clusterIP auto-assigned (not "None"!)
    # Removed nodePort — not applicable to ClusterIP
    #
    # Bug #44 part 3: git push is multi-step HTTP (GET info/refs, POST
    # git-receive-pack, streaming) — without sticky session the phases
    # land on different pods and auth session is lost → 401 + disconnect.
    # ClientIP sessionAffinity pins a client to one pod for 180s.
    sessionAffinity: ClientIP
    sessionAffinityConfig:
      clientIP:
        timeoutSeconds: 180

persistence:
  size: 1Gi

redis-cluster:
  enabled: false

postgresql-ha:
  enabled: false

postgresql:
  enabled: false
