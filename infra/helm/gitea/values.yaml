# PRODUCTION WARNING: Override ALL passwords before deploying to production.
# Default values are for local development only.
# Use --set gitea.admin.password=<secure-value> or a values override file.
gitea:
  admin:
    username: gitea_admin
    password: loopzero-gitea-dev-2026  # LOCAL DEV ONLY — matches provision-api-tokens.sh defaults
    email: admin@loopzero.local
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  config:
    database:
      DB_TYPE: postgres
      HOST: postgresql.loopzero-system.svc.cluster.local:5432
      NAME: gitea
      USER: loopzero
      PASSWD: loopzero-dev-password  # LOCAL DEV ONLY — override for production
      SSL_MODE: disable
      MAX_OPEN_CONNS: "8"        # Bug #44 HA: 8 pods × 8 = 64 conns — under DO PG default 50 headroom
      MAX_IDLE_CONNS: "4"
      CONN_MAX_LIFETIME: "3600s"
    server:
      ROOT_URL: http://gitea-http.loopzero-system.svc.cluster.local:3000
      HTTP_PORT: 3000
    service:
      DISABLE_REGISTRATION: true
    metrics:
      ENABLED: true
      ENABLE_PPROF: false
    # Bug #44 HA config (per Gitea Enterprise HA docs + helm-gitea/ha-setup.md).
    # Without these, session/cache/queue use in-memory per-pod → auth cache
    # misses race across pods, producing 401 mid-stream. Redis shares state.
    # B29 history: previously `gitea-redis-master` because Bitnami chart was
    # used. CHG-2026-05-05 (charts-sota-implementation-plan dogfood):
    # infra/helm/gitea/templates/redis.yaml ships a STANDALONE redis StatefulSet
    # whose Service is named `gitea-redis` (NOT `gitea-redis-master`). Bitnami
    # `<release>-master` convention does NOT apply here. Use `gitea-redis:6379`.
    session:
      PROVIDER: redis
      PROVIDER_CONFIG: "network=tcp,addr=gitea-redis:6379,db=0,pool_size=100,idle_timeout=180s"
    cache:
      ADAPTER: redis
      HOST: "network=tcp,addr=gitea-redis:6379,db=1,pool_size=100,idle_timeout=180s"
    queue:
      TYPE: redis
      CONN_STR: "network=tcp,addr=gitea-redis:6379,db=2,pool_size=100,idle_timeout=180s"
    # Bleve repo indexer breaks HA — disable for multi-pod
    indexer:
      ISSUE_INDEXER_TYPE: db
      REPO_INDEXER_ENABLED: false

image:
  tag: "1.22.6"

resources:
  # Bug #44 fix persisted: L3 c=30 saturated default 500m CPU (7s auth latency
  # → 401 errors in git push). Per-pod headroom for burst + HPA scaling across
  # replicas. See docs/plans/scale-50k-technical-debt.md.
  limits:
    cpu: "3000m"     # was 500m
    memory: "2Gi"    # was 512Mi
  requests:
    cpu: "500m"      # was 100m
    memory: "1Gi"    # was 128Mi

podSecurityContext:
  runAsNonRoot: true

service:
  http:
    # Bug #44 fix: ClusterIP virtual IP (não headless) habilita kube-proxy LB.
    type: ClusterIP
    #
    # NO sessionAffinity — git HTTP uses Authorization header per request
    # (stateless at transport), so ClientIP stickiness just creates
    # hotspots when API pods have few IPs. Redis session/cache/queue
    # (configured in gitea.config above) is the HA primitive that
    # makes auth safe across pods. Per research:
    # https://docs.gitea.com/enterprise/installation/high-availability
    sessionAffinity: None

persistence:
  size: 1Gi

redis-cluster:
  enabled: false

postgresql-ha:
  enabled: false

postgresql:
  enabled: false
