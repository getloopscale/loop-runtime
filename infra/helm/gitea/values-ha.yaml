# Gitea HA-Ready Values Override
#
# This file brings Gitea from a singleton pod to a production-grade
# deployment that can survive pod kills and node failures. Applied on
# top of the base values.yaml:
#
#   helm upgrade gitea gitea-charts/gitea -n loopzero-system \
#     -f values.yaml -f values-ha.yaml
#
# What this changes:
#   1. Redis for sessions/cache/queues/globalLock (no session loss on restart)
#   2. S3 (DO Spaces) for non-git storage (LFS, attachments, avatars)
#   3. PVC bumped to 10Gi for L3 (200 repos)
#   4. Resource limits bumped for sustained load
#
# What this does NOT change (yet):
#   - Replicas stays at 1 (multi-replica needs shared git repo storage
#     via NFS or Gitea's experimental S3 git storage — deferred to L4)
#   - No external Elasticsearch (code search remains DB-backed)
#
# Prerequisites:
#   - Redis deployed in loopzero-system (see redis section below)
#   - DO Spaces bucket `gitea-storage` created (Pulumi handles this)
#   - Spaces credentials available as K8s secret
#
# Gitea Community Edition (1.22+) supports all of these features
# without an Enterprise license (MIT license).
#
# Reference: https://docs.gitea.com/installation/install-with-docker
# HA Guide: Gitea Enterprise docs (config format identical for Community)
#
# Roadmap: index § Gitea Bottleneck (escalation trigger at L4)

gitea:
  config:
    # ── Sessions via Redis ──
    # Without this, sessions live in the pod's local /tmp. Every pod
    # restart or reschedule logs out all users (the API uses tokens so
    # this is less critical, but the dashboard Kratos sessions pass
    # through Gitea OAuth and ARE affected).
    session:
      PROVIDER: redis
      PROVIDER_CONFIG: "redis://:@redis.loopzero-system.svc.cluster.local:6379/0?pool_size=100&idle_timeout=120s"

    # ── Cache via Redis ──
    # Default is in-memory. Redis eliminates cold-start cache misses
    # and allows future multi-replica cache coherence.
    cache:
      ADAPTER: redis
      HOST: "redis://:@redis.loopzero-system.svc.cluster.local:6379/1"

    # ── Task queues via Redis ──
    # Without this, queues are leveldb on local disk. Crash = lost tasks.
    # Redis queues survive pod restarts.
    queue:
      TYPE: redis
      CONN_STR: "redis://:@redis.loopzero-system.svc.cluster.local:6379/2"

    # ── Global lock via Redis ──
    # Required for multi-replica (prevents concurrent repo writes).
    # Even with 1 replica, this is a prerequisite for future scaling.
    global_lock:
      SERVICE_TYPE: redis
      SERVICE_CONN_STR: "redis://:@redis.loopzero-system.svc.cluster.local:6379/5"

    # ── S3 storage for non-git data ──
    # LFS objects, avatars, attachments, packages — everything except
    # the bare git repos themselves. This eliminates the local PVC
    # dependency for these files and makes them durable across pod
    # rescheduling.
    storage:
      STORAGE_TYPE: minio
      MINIO_BUCKET: gitea-storage
      MINIO_ENDPOINT: sfo3.digitaloceanspaces.com
      MINIO_USE_SSL: true
      # Access keys are injected via env vars from a K8s Secret.
      # See the envFrom block below.

    # ── Indexer ──
    # Keep DB-backed issue indexer (good enough for L3).
    # Code search via bleve (single-node only). At L4+ evaluate
    # Elasticsearch if code search is a product feature.
    indexer:
      ISSUE_INDEXER_TYPE: db
      REPO_INDEXER_ENABLED: false

    # ── Server tuning ──
    server:
      LFS_START_SERVER: true
      # JWT secret for LFS — MUST be shared across replicas if we
      # scale beyond 1. Generate once and store in a K8s Secret.
      # LFS_JWT_SECRET: <from secret>

    # ── Logging ──
    # Structured JSON for Loki/Promtail ingestion.
    log:
      MODE: console
      LEVEL: info

# ── Resources ──
# Bumped from 512Mi to 1Gi limit for sustained L3 (100 tenants = 200
# repos, each with ~5 pushes during load test = concurrent git ops).
resources:
  limits:
    cpu: "1"
    memory: "1Gi"
  requests:
    cpu: "200m"
    memory: "256Mi"

# ── Persistence ──
# Bumped from 1Gi to 10Gi. At 200 repos × ~5MB avg = ~1GB of git
# data, 10Gi gives 10x headroom for growth + temporary files.
#
# Sprint 8 v3.2 / CHG-002a / T2.1 — switch to ReadWriteMany via NFS
# provisioner (D-5 namespace-scoped StorageClass `gitea-nfs`). 2 gitea
# replicas mount the same backing PV. Falls back to default RWO when
# nfs-server-provisioner not yet deployed (operator runs
# `task gitea:nfs-install` before scaling replicas).
persistence:
  size: 10Gi
  accessModes:
    - ReadWriteMany
  # Sprint 8 v3.2 / CHG-002a / T2.1 — actual StorageClass on mgmt cluster is
  # `nfs` (provisioner cluster.local/nfs-provisioner). Original ADR-0016 D-5
  # mentioned namespace-scoped `gitea-nfs` — deferred (renaming the existing
  # class would require migrating all 3 PVs that already use it).
  storageClass: nfs

# ── HA replica count ──
# Sprint 8 v3.2 / CHG-002a / T2.1 — 2 replicas + RWX shared storage above
# enables Gitea HA per ADR-0010 deliverable #3. Bumps unblock 200
# concurrent clones load test (Phase 1 / CHG-002b T1.x prerequisite).
# Gitea Community 1.22+ supports multi-replica with shared filesystem
# (Bleve indexer on RWX, Redis sessions, S3 LFS — all already configured
# above). NOT bumped to >2 because NFS write contention scales poorly.
replicaCount: 2

# Anti-affinity: enforce that the 2 replicas land on distinct mgmt nodes.
# With mgmtMaxNodes: 5 (T0.2), 2 replicas have headroom.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: gitea
        topologyKey: kubernetes.io/hostname

# ── Pod security ──
podSecurityContext:
  runAsNonRoot: true

# ── Probes ──
# Tighter probes for faster failure detection. The default 120s
# initial delay is too long for a restart during load.
gitea:
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# ── Metrics ──
# Already enabled in base values. Kept here for visibility.
  metrics:
    enabled: true
