# Gitea HA Values Override
#
# Layered on top of values.yaml for the dev and prod environments only
# (core.helmfile.yaml.gotmpl), so Gitea survives pod kills and node failures:
#
#   helm upgrade gitea gitea-charts/gitea -n loopzero-system \
#     -f values.yaml -f values-ha.yaml
#
# What this changes, on top of the base values:
#   1. Redis global_lock — required once there are two replicas writing repos.
#      Sessions, cache and queues are already on Redis in values.yaml.
#   2. LFS served by Gitea, structured console logs for Promtail/Loki.
#   3. 2 replicas on a ReadWriteMany (NFS) volume, spread across nodes.
#   4. Tighter probes for faster failure detection.
#
# Every Redis address points at the bitnami `gitea-redis` release's primary
# Service, `gitea-redis-master:6379` — the same host values.yaml uses. The
# `redis.loopzero-system.svc.cluster.local` host this file named before does not
# exist (see the gitea-redis note in values.yaml).
#
# Non-git data (LFS, avatars, attachments) stays on the shared volume. Moving it
# to object storage needs a bucket and an access-key Secret wired into the pod,
# and neither exists; declaring STORAGE_TYPE without them would crash Gitea at
# startup instead of making it durable.
#
# This file used to declare `gitea:` twice. Helm keeps only the LAST mapping of a
# duplicated key, silently, so everything in the first block was dropped. It is
# one block now; keep it that way — a second top-level `gitea:` erases this one.
#
# Gitea Community Edition (1.22+) supports all of this without an Enterprise
# license (MIT license).
#
# Reference: https://docs.gitea.com/installation/install-with-docker

gitea:
  config:
    # ── Global lock via Redis ──
    # Required for multi-replica (prevents concurrent repo writes).
    global_lock:
      SERVICE_TYPE: redis
      SERVICE_CONN_STR: "network=tcp,addr=gitea-redis-master:6379,db=5,pool_size=100,idle_timeout=180s"

    # ── Server tuning ──
    server:
      LFS_START_SERVER: true

    # ── Logging ──
    # Structured JSON for Loki/Promtail ingestion.
    log:
      MODE: console
      LEVEL: info

  # ── Probes ──
  # Tighter probes for faster failure detection. The default 120s
  # initial delay is too long for a restart during load.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # ── Metrics ──
  metrics:
    enabled: true

# ── Resources ──
# Bumped from 512Mi to 1Gi limit for sustained L3 (100 tenants = 200
# repos, each with ~5 pushes during load test = concurrent git ops).
resources:
  limits:
    cpu: "1"
    memory: "1Gi"
  requests:
    cpu: "200m"
    memory: "256Mi"

# ── Persistence ──
# Bumped from 1Gi to 10Gi. At 200 repos × ~5MB avg = ~1GB of git
# data, 10Gi gives 10x headroom for growth + temporary files.
#
# Sprint 8 v3.2 / CHG-002a / T2.1 — switch to ReadWriteMany via NFS
# provisioner (D-5 namespace-scoped StorageClass `gitea-nfs`). 2 gitea
# replicas mount the same backing PV. Falls back to default RWO when
# nfs-server-provisioner not yet deployed (operator runs
# `task gitea:nfs-install` before scaling replicas).
persistence:
  size: 10Gi
  accessModes:
    - ReadWriteMany
  # Sprint 8 v3.2 / CHG-002a / T2.1 — actual StorageClass on mgmt cluster is
  # `nfs` (provisioner cluster.local/nfs-provisioner). Original ADR-0016 D-5
  # mentioned namespace-scoped `gitea-nfs` — deferred (renaming the existing
  # class would require migrating all 3 PVs that already use it).
  storageClass: nfs

# ── HA replica count ──
# Sprint 8 v3.2 / CHG-002a / T2.1 — 2 replicas + RWX shared storage above
# enables Gitea HA per ADR-0010 deliverable #3. Bumps unblock 200
# concurrent clones load test (Phase 1 / CHG-002b T1.x prerequisite).
# Gitea Community 1.22+ supports multi-replica with shared filesystem
# (Bleve indexer on RWX, Redis sessions, S3 LFS — all already configured
# above). NOT bumped to >2 because NFS write contention scales poorly.
replicaCount: 2

# Anti-affinity: enforce that the 2 replicas land on distinct mgmt nodes.
# With mgmtMaxNodes: 5 (T0.2), 2 replicas have headroom.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: gitea
        topologyKey: kubernetes.io/hostname

# ── Pod security ──
podSecurityContext:
  runAsNonRoot: true
