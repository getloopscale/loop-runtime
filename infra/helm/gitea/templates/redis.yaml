---
apiVersion: v1
kind: Service
metadata:
  name: gitea-redis
  namespace: loop-runtime-system
  labels:
    app.kubernetes.io/name: gitea-redis
    app.kubernetes.io/instance: gitea-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: loop-runtime
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gitea-redis
    app.kubernetes.io/instance: gitea-redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-redis-headless
  namespace: loop-runtime-system
  labels:
    app.kubernetes.io/name: gitea-redis
    app.kubernetes.io/instance: gitea-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: loop-runtime
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: gitea-redis
    app.kubernetes.io/instance: gitea-redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitea-redis
  namespace: loop-runtime-system
  labels:
    app.kubernetes.io/name: gitea-redis
    app.kubernetes.io/instance: gitea-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: loop-runtime
spec:
  serviceName: gitea-redis-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-redis
      app.kubernetes.io/instance: gitea-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-redis
        app.kubernetes.io/instance: gitea-redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: loop-runtime
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          args:
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ""
            - --dir
            - /data
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          startupProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: gitea-redis
          app.kubernetes.io/instance: gitea-redis
          app.kubernetes.io/part-of: loop-runtime
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gitea-redis
  namespace: loop-runtime-system
  labels:
    app.kubernetes.io/name: gitea-redis
    app.kubernetes.io/instance: gitea-redis
    app.kubernetes.io/part-of: loop-runtime
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-redis
      app.kubernetes.io/instance: gitea-redis
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitea-redis
  namespace: loop-runtime-system
  labels:
    app.kubernetes.io/name: gitea-redis
    app.kubernetes.io/instance: gitea-redis
    app.kubernetes.io/part-of: loop-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gitea-redis
      app.kubernetes.io/instance: gitea-redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea
      ports:
        - protocol: TCP
          port: 6379
