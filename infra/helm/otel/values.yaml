# OpenTelemetry Collector values
# MEET-2026-03-30-020: Traces exported to Tempo (was: debug exporter)
image:
  repository: "otel/opentelemetry-collector-contrib"
  tag: "0.96.0"

mode: deployment

# Hardened securityContext (INF-G08 + plan ADR D7).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: "200m"
    memory: "256Mi"
  requests:
    cpu: "50m"
    memory: "128Mi"

livenessProbe:
  httpGet:
    path: /
    port: 13133
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /
    port: 13133
  initialDelaySeconds: 10
  periodSeconds: 15

config:
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      timeout: 5s
      send_batch_size: 1024
    # C9: Sampling config ready to tune without redeploy.
    # Default 100% — reduce in prod if volume grows.
    probabilistic_sampler:
      sampling_percentage: 100

  exporters:
    debug:
      verbosity: basic
    prometheus:
      endpoint: 0.0.0.0:8889
    # Traces to Tempo (MEET-020, was: debug exporter)
    otlp/tempo:
      endpoint: "tempo.loopruntime-system.svc:4317"
      tls:
        insecure: true  # In-cluster communication, no TLS needed

  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [probabilistic_sampler, batch]
        exporters: [otlp/tempo]
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [prometheus]

command:
  extraArgs:
    - "--set=service.telemetry.metrics.address=0.0.0.0:8890"

ports:
  metrics:
    enabled: true
    containerPort: 8890
    servicePort: 8890
    protocol: TCP
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP
