# ClusterRole + ClusterRoleBinding for tenant-controller.
# Provisions tenant infrastructure: Tenant CR, Gitea repos (via API),
# ArgoCD AppProjects, runtime cluster RBAC, GitRepositoryBinding, etc.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-controller
  labels:
    app: tenant-controller
    loopzero.io/component: tenant-controller
rules:
  # B51 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — The operators binary is
  # monolithic (B32: same image deployed by both loopzero-controller and
  # tenant-controller charts), so each pod boots controller-runtime
  # informers for ALL 10 loopzero.io CRDs (Tenant, Environment, Application,
  # Exposure, PlatformBootstrap, GitRepositoryBinding, ClusterCredential,
  # Preview, AppSecret, ReconciliationReport). Without permissions on
  # ALL CRDs, the informer cache sync times out → CrashLoopBackOff.
  # Wildcard `loopzero.io/*` is the safe expansion until the binary is split
  # into purpose-specific images (T2 follow-up).
  - apiGroups: ["loopzero.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ArgoCD AppProjects + Applications (per-tenant scoping)
  - apiGroups: ["argoproj.io"]
    resources: ["appprojects", "applications"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Namespaces (tenant isolation)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Secrets + ConfigMaps for cluster registration & cross-cluster wiring
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Cluster-scoped RBAC for runtime delegation (per CHG-2026-04-28-LAYERED-BOOTSTRAP T2.4 / B7)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # NetworkPolicies + ResourceQuotas (tenant isolation)
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Events — record reconcile outcomes
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenant-controller
  labels:
    app: tenant-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant-controller
subjects:
  - kind: ServiceAccount
    name: tenant-controller
    namespace: {{ .Release.Namespace }}
