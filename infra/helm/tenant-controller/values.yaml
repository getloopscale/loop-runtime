replicaCount: 1

# B32 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — Aligned image to the binary
# actually published by CI (`loopzero-tenant-controller`, built from
# `operators/Dockerfile`). The operators monolith runs all 8 controllers
# (Tenant, Environment, Application, Exposure, PlatformBootstrap,
# GitRepositoryBinding, ClusterCredential, Preview) under leader election.
image:
  # Production (DO Registry, pinned to CI-published tag).
  # standalone-multi local uses values-standalone-multi.yaml overlay
  # to switch to k3d-loopzero-registry/loopzero-tenant-controller:b69-fix
  # (local image with B69 fix until CI republishes with that fix).
  repository: registry.digitalocean.com/loopzero-system/loopzero-tenant-controller
  tag: REDACTED_SECRET_061
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: loopzero-registry-pull

wiringConfigMap: loopzero-platform-topology
dbCredentialsSecret: loopzero-db-credentials

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  LOOPZERO_TENANT_CONTROLLER_MODE: "true"
  LOOPZERO_LOG_LEVEL: "info"
  LOOPZERO_CLUSTER_ISSUER: "letsencrypt-prod"
  LOOPZERO_TENANT_MAX_CONCURRENT: "20"
  # B43 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — see loopzero-controller/values.yaml
  BASE_DOMAIN: "loopzero.local"
  LOOPZERO_BASE_DOMAIN: "loopzero.local"
  # B66 (end-to-end-deploy-validation-plan iter 8) — GITEA_URL required by
  # operators/cmd/main.go for tenant-controller to reconcile gitea repos.
  # In standalone-multi: in-cluster service. In LoopZero Cloud: ingress URL.
  GITEA_URL: "http://gitea-http.loopzero-system.svc.cluster.local:3000"
  # B69 (end-to-end-deploy-validation-plan iter 8) — GITEA_ORG was hardcoded
  # to "loopzero" in operators/cmd/main.go. Now configurable. In standalone the
  # org "loopzero-platform" is created during bootstrap; in LoopZero Cloud it
  # matches the customer org name (set via Pulumi outputs).
  GITEA_ORG: "loopzero-platform"
