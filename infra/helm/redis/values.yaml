# Redis for Gitea HA — sessions, cache, queues, global_lock
#
# Bitnami Redis chart (standalone mode, NOT cluster).
# Standalone is correct for Gitea HA because Gitea does not use
# Redis Cluster commands (MULTI/EXEC suffice). Sentinel can be
# added later for HA Redis itself, but for L3 a single Redis pod
# with persistence is fine — Gitea gracefully degrades to in-memory
# if Redis is temporarily down (sessions are re-created on next
# request, queues replay from DB).
#
# Chart: oci://registry-1.docker.io/bitnamicharts/redis
# Version: 20.x (pin in Pulumi)
#
# Install:
#   helm install redis oci://registry-1.docker.io/bitnamicharts/redis \
#     -n loopzero-system -f values.yaml
#
# Cost: ~0 (runs as a pod on existing mgmt cluster node, <128Mi RAM)

architecture: standalone

# B19 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — Bitnami removed legacy image
# tags from `docker.io/bitnami/*` in mid-2025 and migrated free tier to
# `docker.io/bitnamilegacy/*`. The redis chart 19.6.4 references the
# deleted tag `redis:7.2.5-debian-12-r4`. Until we migrate to chart 20.x
# (Sprint 9 supply chain) or mirror to DO Registry, override the
# repositories here. Detected by smoke-test on fresh k3d bootstrap
# 2026-04-28 in this exact cluster — same failure would occur on a
# fresh DOKS bootstrap, this fix is therefore production-bound.
image:
  repository: bitnamilegacy/redis

auth:
  enabled: false  # Internal-only, no external exposure. Simplifies config.

master:
  persistence:
    enabled: true
    size: 1Gi

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  podSecurityContext:
    runAsNonRoot: true

  containerSecurityContext:
    runAsNonRoot: true

metrics:
  enabled: true
  image:
    repository: bitnamilegacy/redis-exporter
  serviceMonitor:
    enabled: false  # Enable when Prometheus ServiceMonitor CRD is available

# No replicas — standalone mode. Gitea handles Redis downtime
# gracefully (sessions regenerate, cache rebuilds, queues replay).
replica:
  replicaCount: 0
