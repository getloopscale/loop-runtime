# velero-backup-dr-plan v1.0 / T2.1 — 5 backup schedules per ADR D3.
#
# Each schedule maps to a critical platform scope. Retention differentiates
# by churn: CRDs/ArgoCD/Secrets change every deploy (6h), Gitea PVCs are
# big but slow-moving (24h), full snapshot is a weekly safety net.
#
# EC-1/EC-2 fix: tenant CRs live in `loop-runtime-tn-*` namespaces (canonical
# `pkg/naming/naming.go TenantNamespace`), and Velero `includedNamespaces`
# does NOT support glob/wildcards. The crds-backup schedule therefore
# omits `includedNamespaces` entirely — when only `includedResources` is
# set, Velero captures matching resources across ALL namespaces. This
# guarantees CRDs in tenant namespaces are included.

velero:
  schedules:
    # 1) CRD backup — every 6h, 30 days retention.
    # Captures the 10 runtime.getloopscale.com/v1 CRDs across every namespace they live in
    # (loop-runtime-system, loop-runtime-tn-*, etc.). Velero's `Schedule.spec.template`
    # mirrors the Backup spec.
    loop-runtime-crds-backup:
      disabled: false
      schedule: "0 */6 * * *"
      useOwnerReferencesInBackup: false
      template:
        ttl: "720h"
        # No includedNamespaces — backup cross-namespace per resource type.
        includedResources:
          - tenants.runtime.getloopscale.com
          - environments.runtime.getloopscale.com
          - loopruntimeapplications.runtime.getloopscale.com
          - exposedroutes.runtime.getloopscale.com
          - platformbootstraps.runtime.getloopscale.com
          - gitrepositorybindings.runtime.getloopscale.com
          - clustercredentials.runtime.getloopscale.com
          - previewenvironments.runtime.getloopscale.com
        storageLocation: default
        snapshotVolumes: false
        defaultVolumesToFsBackup: false

    # 2) ArgoCD state — every 6h, 30 days retention.
    # Apps, AppProjects, repository Secrets — the GitOps control plane.
    loop-runtime-argocd-backup:
      disabled: false
      schedule: "0 */6 * * *"
      useOwnerReferencesInBackup: false
      template:
        ttl: "720h"
        includedNamespaces:
          - argocd
        storageLocation: default
        snapshotVolumes: false
        defaultVolumesToFsBackup: false

    # 3) Gitea metadata — daily at 02:00 UTC, 14 days retention.
    # PVC data is NOT backed up (D4 — repos are small + re-pushable).
    # Captures StatefulSet, Service, ConfigMap, Secret labelled app=gitea.
    loop-runtime-gitea-backup:
      disabled: false
      schedule: "0 2 * * *"
      useOwnerReferencesInBackup: false
      template:
        ttl: "336h"
        includedNamespaces:
          - loop-runtime-system
        labelSelector:
          matchLabels:
            app: gitea
        storageLocation: default
        snapshotVolumes: false
        defaultVolumesToFsBackup: false

    # 4) Secrets — every 6h, 30 days retention.
    # Cluster kubeconfigs, signing keys, registry pull secrets.
    # NOTE EC-7: backups land in S3 encrypted-at-rest by provider, but
    # readable to anyone holding the bucket API key. Document in runbook.
    loop-runtime-secrets-backup:
      disabled: false
      schedule: "0 */6 * * *"
      useOwnerReferencesInBackup: false
      template:
        ttl: "720h"
        includedNamespaces:
          - loop-runtime-system
        includedResources:
          - secrets
        storageLocation: default
        snapshotVolumes: false
        defaultVolumesToFsBackup: false

    # 5) Full cluster snapshot — Sunday 03:00 UTC, 7 days retention.
    # Safety net beyond the targeted scopes. Excludes K8s-internal
    # namespaces (kube-system / kube-public / kube-node-lease) which
    # are managed by the control plane and survive cluster destroys.
    loop-runtime-full-backup:
      disabled: false
      schedule: "0 3 * * 0"
      useOwnerReferencesInBackup: false
      template:
        ttl: "168h"
        excludedNamespaces:
          - kube-system
          - kube-public
          - kube-node-lease
        storageLocation: default
        snapshotVolumes: false
        defaultVolumesToFsBackup: false
