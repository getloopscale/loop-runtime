# NodePort bridge — exposes the public Hydra to the host's edge (Caddy).
#
# Sibling of `infra/helm/ory-kratos/nodeport-service.yaml`, created by the same measurement of
# 2026-08-10 and for the same reason: the chart's Service is ClusterIP and the edge reached it
# through an unsupervised `kubectl port-forward`, which died together with the clusters.
#
# Hydra appears in the login flow right after Kratos — the Caddyfile records that "the
# browser needs to reach Hydra (localhost:14444), not Kratos" at the consent step.
# Fixing only Kratos would leave login breaking one step further on, which is the half-fix
# B-018 exists not to repeat.
#
# THE THREE ENDS: this Service (`nodePort: 30006`), the `14444:30006` mapping in
# `infra/k3d/core-cluster.yaml`, and the Caddyfile's `localhost:14444`.
# `infra/tests/charts/ory_edge_nodeport_test.go` locks all three.
#
# MIND THE PORT: the Hydra chart's Service listens on 4444, and NOT on 80 like Kratos's.
# Forwarding to 80 here produces a Service that exists, has endpoints, and refuses
# connections — measured while restoring the manual forwarding, which answered `HTTP 000` until
# the port was fixed.
apiVersion: v1
kind: Service
metadata:
  name: ory-hydra-public-nodeport
  namespace: loopruntime-auth
  labels:
    app.kubernetes.io/name: hydra
    app.kubernetes.io/instance: ory-hydra
    app.kubernetes.io/component: edge-bridge
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: hydra
    app.kubernetes.io/instance: ory-hydra
  ports:
    - name: http
      port: 4444
      targetPort: http-public
      nodePort: 30006
      protocol: TCP
