# Production MinIO values overlay
# Usage: helm upgrade --install minio minio/minio -f values.yaml -f values.production.yaml
#
# This file documents the target production configuration. It is NOT used in
# local development (k3d clusters use values.yaml with standalone mode).

# --- Mode ---
# Switch from standalone to distributed mode for erasure coding and fault tolerance.
# Minimum 4 replicas required for erasure coding (can tolerate loss of n/2 drives).
mode: distributed

# --- Replicas ---
# 4 nodes is the minimum for distributed mode. Increase for higher durability.
replicas: 4

# --- Storage ---
persistence:
  size: 100Gi
  storageClass: ""  # Use cluster default; override per cloud provider

# --- Resources ---
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# --- TLS ---
# Enable in-transit encryption. Requires a TLS secret with tls.crt and tls.key.
# Use cert-manager to automate certificate provisioning.
tls:
  enabled: true
  certSecret: minio-tls

# --- Probes ---
livenessProbe:
  enabled: true
readinessProbe:
  enabled: true

# --- Security ---
podSecurityContext:
  runAsNonRoot: true

# --- Buckets ---
# Same buckets as development, but with lifecycle policies applied via mc client.
buckets:
  - name: loopzero-artifacts
    policy: none
  - name: loopzero-cache
    policy: none

# --- Lifecycle Policies ---
# MinIO lifecycle rules for automatic cleanup. Applied via mc client post-install
# or via ILM configuration. The Helm chart may not support inline lifecycle rules;
# use a post-install Job or mc command:
#
#   mc ilm rule add myminio/loopzero-cache --expire-days 90 --prefix "cache/"
#   mc ilm rule add myminio/loopzero-cache --expire-days 7 --prefix "temp/"
#
# Documented here for operational reference:
# lifecycle:
#   rules:
#     - id: expire-cache
#       status: Enabled
#       prefix: "cache/"
#       expiration:
#         days: 90
#     - id: expire-temp
#       status: Enabled
#       prefix: "temp/"
#       expiration:
#         days: 7

# --- Metrics ---
# Enable Prometheus metrics endpoint for Grafana dashboards.
metrics:
  serviceMonitor:
    enabled: true
    namespace: monitoring
    labels:
      release: monitoring

# --- Auth ---
# IMPORTANT: Override these in production via --set or external secret.
# NEVER use the dev defaults from values.yaml in production.
# rootUser: <from-external-secret>
# rootPassword: <from-external-secret>
