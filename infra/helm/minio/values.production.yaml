# Production MinIO values overlay
# Usage: helm upgrade --install minio minio/minio -f values.yaml -f values.production.yaml
#
# This file documents the target production configuration. It is NOT used in
# local development (k3d clusters use values.yaml with standalone mode).

# --- Mode ---
# Switch from standalone to distributed mode for erasure coding and fault tolerance.
# Minimum 4 replicas required for erasure coding (can tolerate loss of n/2 drives).
mode: distributed

# --- Replicas ---
# 4 nodes is the minimum for distributed mode. Increase for higher durability.
replicas: 4

# --- Storage ---
persistence:
  size: 100Gi
  storageClass: ""  # Use cluster default; override per cloud provider

# --- Resources ---
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# --- TLS ---
# Enable in-transit encryption. Requires a TLS secret with tls.crt and tls.key.
# Use cert-manager to automate certificate provisioning.
tls:
  enabled: true
  certSecret: minio-tls

# --- Probes ---
livenessProbe:
  enabled: true
readinessProbe:
  enabled: true

# --- Security ---
podSecurityContext:
  runAsNonRoot: true

# --- Buckets ---
# Names MUST match CWT references: loopruntime-builds (cache) and loopruntime-artifacts (assets).
buckets:
  - name: loopruntime-artifacts
    policy: none
  - name: loopruntime-builds
    policy: none

# --- Metrics ---
# Enable Prometheus metrics endpoint for Grafana dashboards.
metrics:
  serviceMonitor:
    enabled: true
    namespace: monitoring
    labels:
      release: monitoring

# --- Auth ---
# IMPORTANT: Override these in production via --set or external secret.
# NEVER use the dev defaults from values.yaml in production.
# rootUser: <from-external-secret>
# rootPassword: <from-external-secret>
