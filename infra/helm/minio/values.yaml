# PRODUCTION WARNING: Override ALL passwords before deploying to production.
# Default values are for local development only.
# Use --set rootPassword=<secure-value> or a values override file.
mode: standalone

rootUser: loop-runtime-admin
rootPassword: ""  # T1.3: empty triggers MinIO fail-fast; override via helmfile env or --set

livenessProbe:
  enabled: true
readinessProbe:
  enabled: true

resources:
  limits:
    cpu: "2000m"     # was 500m — bug #35 Fase 1 (cache-restore saturation at L3)
    memory: "4Gi"    # was 512Mi
  requests:
    cpu: "500m"      # was 100m
    memory: "2Gi"    # was 128Mi — requires s-4vcpu-8gb node (added mgmt-big pool)

podSecurityContext:
  runAsNonRoot: true

persistence:
  size: 50Gi  # was 10Gi — room for 100+ tenants with cache

# Performance tuning — prevents cache-restore timeouts at L3+ scale (bug #35).
extraEnvVars:
  - name: MINIO_API_REQUESTS_MAX
    value: "10000"          # default: 4 × CPU = 8 (too low for concurrent builds)
  - name: MINIO_API_REQUESTS_DEADLINE
    value: "30s"            # default: 10s (too aggressive for mc cp pulls)
  - name: MINIO_SCANNER_SPEED
    value: "slowest"        # reduce background load

service:
  type: NodePort

# Console NOT exposed via NodePort — use kubectl port-forward when needed.
# Exposing console gives full admin access to all buckets and data.
consoleService:
  type: ClusterIP

# B75 (end-to-end-deploy-validation-plan iter 9) — buckets required by LoopRuntime
# platform across all profiles. SOURCE OF TRUTH: minio chart's post-install
# job creates each bucket idempotently on every helm install/upgrade.
#
# Each bucket maps to a specific consumer in the codebase:
#   loop-runtime-builds       → CLI uploads source bundle here (POST /source/upload)
#                       and Argo loop-runtime-clone CWT downloads from here
#                       (charts/loop-runtime-build-cwts/templates/cwt-clone.yaml).
#   loop-runtime-artifacts    → BuildKit layer cache (cwt-cache-save/restore.yaml).
#   loop-runtime-logs         → Loki long-term storage when S3 backend configured.
#   loop-runtime-static-assets→ Frontend delivery + SBOMs + attestations
#                       (api/internal/buildplane/argo/constants.go:s3BucketStaticAssets).
#                       In LoopRuntime Cloud this is DO Spaces (worker.mjs); in
#                       standalone (no external S3) it MUST live in MinIO.
buckets:
  - name: loop-runtime-builds
    policy: none
  - name: loop-runtime-artifacts
    policy: none
  - name: loop-runtime-logs
    policy: none
  - name: loop-runtime-static-assets
    policy: none
  # velero-backup-dr-plan v1.0 / EC-4 fix — Velero in standalone uses
  # this bucket as BackupStorageLocation. Without it pre-created, Velero
  # reports BSL status=Unavailable and no backups run. Versioning is
  # disabled (MinIO Helm chart doesn't support it via this CRD path; the
  # plan's protection model in standalone is "infra is ephemeral").
  - name: velero-backups
    policy: none
