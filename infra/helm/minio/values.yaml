# PRODUCTION WARNING: Override ALL passwords before deploying to production.
# Default values are for local development only.
# Use --set rootPassword=<secure-value> or a values override file.
mode: standalone

rootUser: loopzero-admin
rootPassword: loopzero-dev-password  # LOCAL DEV ONLY — override for production

livenessProbe:
  enabled: true
readinessProbe:
  enabled: true

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

podSecurityContext:
  runAsNonRoot: true

persistence:
  size: 10Gi  # Sized for ~30 projects with dependency cache (~300MB each compressed)

service:
  type: NodePort

# Console NOT exposed via NodePort — use kubectl port-forward when needed.
# Exposing console gives full admin access to all buckets and data.
consoleService:
  type: ClusterIP

# Buckets must match names used in CWTs (cwt-cache-save.yaml, cwt-cache-restore.yaml)
buckets:
  - name: loopzero-artifacts
    policy: none
  - name: loopzero-builds
    policy: none
