# Post-install Job that configures MinIO lifecycle rules for automatic cache cleanup.
# Applies ILM (Information Lifecycle Management) rules to the loopzero-builds bucket
# so old cache entries expire automatically instead of growing unbounded.
#
# Applied by: task infra:install:core (after MinIO is ready)
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-lifecycle-setup
  namespace: loopzero-system
  labels:
    app.kubernetes.io/name: loopzero-build
    app.kubernetes.io/component: lifecycle
    app.kubernetes.io/part-of: loopzero
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-lifecycle-setup
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
        - name: mc-config
          emptyDir: {}
      initContainers:
        # Wait for MinIO to be ready before applying lifecycle rules
        - name: wait-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MinIO to be ready..."
              until wget -q -O /dev/null http://minio.loopzero-system.svc.cluster.local:9000/minio/health/ready 2>/dev/null; do
                echo "MinIO not ready, retrying in 5s..."
                sleep 5
              done
              echo "MinIO is ready"
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      containers:
        - name: lifecycle-setup
          # loopzero-clone-runner is the platform's one mc image, built from pinned
          # source: MinIO publishes no community mc image any more (#394).
          image: k3d-loopzero-registry:5000/loopzero-clone-runner:v0.1.0
          command:
            - sh
            - -c
            - |
              set -euo pipefail

              # Wait for MinIO to be ready (may still be starting during setup)
              echo "Waiting for MinIO..."
              for i in $(seq 1 30); do
                if mc alias set local http://minio.loopzero-system.svc.cluster.local:9000 \
                  "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; then
                  echo "MinIO ready"
                  break
                fi
                echo "  attempt $i/30..."
                sleep 2
              done

              # Configure mc alias
              mc alias set local http://minio.loopzero-system.svc.cluster.local:9000 \
                "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"

              # Ensure buckets exist (idempotent)
              mc mb --ignore-existing local/loopzero-builds
              mc mb --ignore-existing local/loopzero-artifacts
              mc mb --ignore-existing local/loopzero-static-assets

              # Apply lifecycle rule: expire cache entries after 30 days
              # This prevents unbounded cache growth from lockfile hash changes.
              # Each new lockfile version creates a new cache key; old ones expire.
              mc ilm rule add local/loopzero-builds \
                --expire-days 30 \
                --prefix "" \
                --tags "" 2>/dev/null || echo "Lifecycle rule already exists or update not needed"

              echo "MinIO lifecycle rules configured successfully"
              mc ilm rule ls local/loopzero-builds
          env:
            - name: HOME
              value: /tmp
            - name: MINIO_ROOT_USER
              value: "loopzero-admin"
            - name: MINIO_ROOT_PASSWORD
              value: ""  # T1.3: see docs/operations.md
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: mc-config
              mountPath: /home/1000/.mc
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
