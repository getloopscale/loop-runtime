# MinIO credentials for the build cluster.
# Workflow containers (cache-save, cache-restore) read credentials from this
# Secret via envFrom instead of receiving them as Workflow parameters.
#
# This prevents MinIO credentials from being visible in plaintext in
# Workflow CR objects (kubectl get workflow -o yaml).
#
# In production: replace stringData values with references to an external
# secret manager (e.g., Sealed Secrets, External Secrets Operator).
#
# Applied to the build cluster (argo namespace) by: task infra:install:build
apiVersion: v1
kind: Secret
metadata:
  name: loopruntime-minio-credentials
  namespace: argo
  labels:
    app.kubernetes.io/name: loopruntime-build
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: loopruntime
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "loopruntime-admin"
  AWS_SECRET_ACCESS_KEY: ""  # T1.3: this manifest is a TEMPLATE — generate-secrets.sh writes real values via kubectl
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_ENDPOINT_URL: "http://172.18.0.3:32000"
  MINIO_ENDPOINT: "http://172.18.0.3:32000"
