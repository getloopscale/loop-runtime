# Production overrides for loopzero-api.
#
# CHG-2026-04-30-INFRA-NORMALIZE / Phase 5 T5.4. Closes T0.1 audit
# Gap 4 ("LOOPZERO_DYNAMIC_ROUTER missing in loopzero-api values for cloud
# profiles → silent single-cell fallback").

env:
  # DynamicRouter discovers cells from ClusterCredential CRs in
  # `loopzero-system` (per K8sCellStore). Setting this enables the
  # multi-cell code path; cells.status (in DB) gates which cells
  # accept tenant pinning.
  LOOPZERO_DYNAMIC_ROUTER: "true"
  # Plan 2026-05-19-drill-skills-rigor-restoration T2.1 — PROD-PARITY fix
  # caught by drill skill. Canonical values.yaml does NOT set JWT_ISSUER/JWKS_URL;
  # api/cmd/setup_auth.go:58-60 reads os.Getenv() returning empty string when
  # vars absent → JWT validator constructed with empty URLs → ALL tenant-scoped
  # requests fail 401. Pulumi platform overlay NEVER set these (verified via
  # grep across infra/pulumi*/ — comments in values-standalone-multi.yaml
  # claiming "Pulumi sets prod" were stale). Drill caught this Bug #24 in
  # dogfood-drill 11/12 journeys 401.
  # Issuer string MUST match Hydra config (values-ory-hydra has same FQDN).
  # JWKS URL is fetched cross-namespace from inside loopzero-api pod.
  JWT_ISSUER: "http://ory-hydra-public.loopzero-auth.svc.cluster.local:4444/"
  JWKS_URL: "http://ory-hydra-public.loopzero-auth.svc.cluster.local:4444/.well-known/jwks.json"
