{{- if .Values.serviceMonitor.enabled }}
# F-08 (CHG-2026-04-29-DOGFOOD T5.3) — ServiceMonitor opt-in.
# Renderizado apenas quando `.Values.serviceMonitor.enabled=true` (default
# false em standalone-multi sem prometheus-operator; true em dev/prod).
# Sem essa guarda o helm template falharia em clusters sem o CRD
# monitoring.coreos.com/ServiceMonitor — kubeconform recusa o manifest.
#
# LoopZero metrics endpoints documentados em
# `docs/runbooks/observability.md`:
#  - :3001/api/v1/health        → liveness (público)
#  - :3001/api/v1/health/deep   → readiness com deps (público, sem auth)
#  - :3001/api/v1/version       → metadata público (F-07)
#  - :9090/metrics              → Prometheus exposition (interno-only;
#                                  scraped via ServiceMonitor)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loopzero-api
  labels:
    app: loopzero-api
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    loopzero.io/component: loopzero-api
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: loopzero-api
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout | default "10s" }}
      path: /metrics
      scheme: http
      # honorLabels=true: a app emite labels canônicos (loopzero_*) e nós
      # respeitamos em vez de sobrescrever com instance/pod/...
      honorLabels: true
{{- end }}
