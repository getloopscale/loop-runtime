# B36 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — ServiceAccount + ClusterRole for
# loopzero-api. In standalone, this SA is what the in-cluster kubeconfig (mounted
# via Secret) authenticates as. Permissions cover: submitting Argo Workflows
# (build cluster role), reconciling loopzero.io CRDs (mgmt+runtime cluster role).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loopzero-api
  namespace: loopzero-system
  labels:
    app.kubernetes.io/name: loopzero-api
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loopzero-api
  labels:
    app.kubernetes.io/name: loopzero-api
rules:
  # Argo Workflows — build cluster operations.
  - apiGroups: [argoproj.io]
    resources: [workflows, workflowtemplates, cronworkflows]
    verbs: [get, list, watch, create, update, patch, delete]
  # LoopZero CRDs — mgmt+runtime reconciliation. Explicit verbs, the same set the
  # published chart grants (charts/loopzero-api/templates/clusterrole.yaml): `*` also
  # granted deletecollection, which no code path in api/ calls.
  - apiGroups: [loopzero.io]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [loopzero.io]
    resources: ["*/status"]
    verbs: [get, update, patch]
  # ArgoCD apps — gitops sync trigger.
  - apiGroups: [argoproj.io]
    resources: [applications, appprojects]
    verbs: [get, list, watch, create, update, patch, delete]
  # K8s core — namespaces, configmaps, secrets, services, pods, events, logs.
  - apiGroups: [""]
    resources: [namespaces, configmaps, secrets, services, pods, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log, pods/exec]
    verbs: [get, list, create]
  # Workloads.
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  # Networking.
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [traefik.io]
    resources: [ingressroutes, middlewares]
    verbs: [get, list, watch, create, update, patch, delete]
  # External Secrets.
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, secretstores, clustersecretstores]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loopzero-api
  labels:
    app.kubernetes.io/name: loopzero-api
subjects:
  - kind: ServiceAccount
    name: loopzero-api
    namespace: loopzero-system
roleRef:
  kind: ClusterRole
  name: loopzero-api
  apiGroup: rbac.authorization.k8s.io
