{{- /*
ADR D1 (decisions/2026-06-11-tilt-yaml-configmap-mount.md) — sensitive runtime config.
EC-2 absorption: split from configmap-runtime.yaml to prevent credential leak.
Hermetic test infra/tests/helm/tilt-secret-keys-classification_test.sh asserts
sensitive keys (SECRET / PASSWORD / TOKEN / DATABASE_URL / etc.) appear ONLY here.
Production: source via ESO ExternalSecret pointing at OpenBao Transit (orthogonal to mount contract).
Dev:        plain helm values populate stringData directly.
*/ -}}
{{- if .Values.runtimeSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-runtime-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: runtime-secret
type: Opaque
stringData:
{{- range $key, $value := .Values.runtimeSecrets }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
