{{- if .Values.vault.day30VerifyCron.enabled }}
{{/*
SPDX-License-Identifier: Apache-2.0
T10.1 of plan 2026-06-02-openbao-adoption v1.3.

Day 30 verify cron — sweeps the secrets table, decrypts each row with the
configured key (AES legacy OR Vault Transit), and asserts the value
round-trips. Catches:
  (a) Pre-migration AES rows not yet re-encrypted with Transit
  (b) Transit key revocation that orphans ciphertext
  (c) DB corruption (rare; sanity check)

Calendar-gated: schedule runs once on Day 30 of cutover month. Operator
manually triggers earlier runs via `kubectl create job --from=cronjob/...`.

EC-12 SQL filter (v1.1 amendment): only sweeps rows where the parent tenant
is NOT soft-deleted. Crypto-shredded tenants (post 90d delete) intentionally
have un-decryptable ciphertexts — sweeping those raises noise + may block
quality gate indefinitely.
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: loopzero-secrets-day30-verify
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: loopzero-api
    app.kubernetes.io/component: secrets-verify-cron
    loopzero.io/related-plan: "2026-06-02-openbao-adoption v1.3 T10.1"
spec:
  schedule: {{ .Values.vault.day30VerifyCron.schedule | default "0 3 1 * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        spec:
          serviceAccountName: loopzero-api
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: verify
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - "/loopzero-api"
                - "secret"
                - "verify"
                - "--batch-size=100"
                - "--filter-deleted-tenants"  # EC-12: skip soft-deleted tenants
              env:
                - name: LOOPZERO_VERIFY_MODE
                  value: "day30"
              envFrom:
                - secretRef:
                    name: loopzero-api
                    optional: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
{{- end }}
