apiVersion: apps/v1
kind: Deployment
metadata:
  name: loopzero-api
  labels:
    app: loopzero-api
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    loopzero.io/component: loopzero-api
spec:
  replicas: {{ .Values.replicaCount }}
  # MEET-ASYNC-AMENDMENT-2026-05-12-003 Option A (RATIFIED 2026-05-12):
  # RollingUpdate when replicaCount >= 2 (multi-replica HA); Recreate when
  # single-replica (preserves legacy single-instance semantics for dev).
  # RollingUpdate + maxUnavailable=0 ensures zero-downtime deploys.
  {{- if gt (int .Values.replicaCount) 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: loopzero-api
  template:
    metadata:
      labels:
        app: loopzero-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # B36 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — Mount synthetic kubeconfigs
      # generated by generate-secrets.sh. In standalone, all 3 collapse to
      # the local API server (in-cluster service account). In LoopZero Cloud,
      # Pulumi will inject distinct kubeconfigs for mgmt/build/runtime DOKS.
      serviceAccountName: loopzero-api
      volumes:
        - name: cluster-kubeconfigs
          secret:
            secretName: loopzero-cluster-kubeconfigs
            optional: true
        # B79 (end-to-end-deploy-validation-plan iter 11) — gitops push
        # creates temp dirs under /tmp for git clone. Pod has
        # readOnlyRootFilesystem: true (security hardening), so /tmp must
        # be a writable emptyDir volume.
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        {{- if .Values.vault.enabled }}
        # T5.11 of plan 2026-06-02-openbao-adoption v1.3 — projected SA
        # token with bounded audience + expiration. Read by pkg/vault.Client
        # at /var/run/secrets/vault.loopzero.io/token; sent to auth/k8s-core/login.
        # Vault TokenReview validates audience claim cryptographically,
        # preventing token re-use against K8s API or other audiences.
        - name: vault-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.vault.audience | default "vault.loopzero.io" }}
                  expirationSeconds: {{ .Values.vault.tokenExpirationSeconds | default 3600 }}
        {{- end }}
      containers:
        - name: loopzero-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
            # F-08 (CHG-2026-04-29-DOGFOOD T5.3) — metrics port declarado
            # explicitamente para que ServiceMonitor (Prometheus Operator)
            # consiga scrape. Em standalone-multi sem prometheus-operator,
            # ServiceMonitor não é renderizado mas o port permanece exposto
            # — pode ser scraped via `kubectl port-forward` ou via Prometheus
            # standalone scrape config.
            - containerPort: 9090
              name: metrics
              protocol: TCP
          volumeMounts:
            - name: cluster-kubeconfigs
              mountPath: /etc/loopzero/kubeconfigs
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.vault.enabled }}
            # T5.11 of plan 2026-06-02-openbao-adoption v1.3 — Vault projected
            # token mount. pkg/vault.Client reads /var/run/secrets/vault.loopzero.io/token.
            - name: vault-sa-token
              mountPath: /var/run/secrets/vault.loopzero.io
              readOnly: true
            {{- end }}
          env:
            - name: CORE_KUBECONFIG
              value: /etc/loopzero/kubeconfigs/core.kubeconfig
            - name: BUILD_KUBECONFIG
              value: /etc/loopzero/kubeconfigs/build.kubeconfig
            - name: CELL_0_KUBECONFIG
              value: /etc/loopzero/kubeconfigs/cell-0.kubeconfig
            # Plan 2026-05-19-drill-skills-rigor-restoration T2.1: REMOVED
            # hardcoded "in-cluster" defaults that caused loopzero-api CrashLoop
            # quando overlay drill (DOKS) tem real context names like
            # "do-sfo3-loopzero-drill-core-cluster". Bootstrap script tinha
            # workaround kubectl-set-env post-sync (T2 follow-up tag) que
            # NÃO sobrevivia a re-sync. Comment "Pulumi sets these to actual
            # DOKS context names" era FALSA — Pulumi nunca setou.
            # NOW: values fornecem context names via .Values.kubeContexts
            # com fallback default "in-cluster" para local k3d synthetic.
            - name: CORE_KUBE_CONTEXT
              value: {{ .Values.kubeContexts.core | default "in-cluster" | quote }}
            - name: BUILD_KUBE_CONTEXT
              value: {{ .Values.kubeContexts.build | default "in-cluster" | quote }}
            - name: CELL_0_KUBE_CONTEXT
              value: {{ .Values.kubeContexts.cell0 | default "in-cluster" | quote }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
            # F-7 (dogfood-2026-05-08-fixes T0.1, ADR D7) — gate OTel
            # tracing on .Values.tracing.enabled. Default false in this
            # bootstrap chart (local k3d has no Tempo); operators set
            # `tracing.enabled: true` via overlay when Tempo is reachable.
            - name: LOOPZERO_TRACING_ENABLED
              value: {{ .Values.tracing.enabled | default false | quote }}
            # B78 (end-to-end-deploy-validation-plan iter 11) — loopzero-api
            # needs GITEA_TOKEN to create + push to tenant gitops repos.
            # Mapped from `gitea-admin.token` Secret (same source as
            # tenant-controller B41) — both share the org-admin token.
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-admin
                  key: token
                  optional: true
            # B35 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — Map secret key
            # `uri` to env var `DATABASE_URL` because the application
            # expects DATABASE_URL but the secret stores it as `uri`.
            # Without this mapping, loopzero-api warns "DATABASE_URL not set"
            # and runs without DB. Detected on standalone bootstrap 2026-04-28.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbCredentialsSecret | quote }}
                  key: uri
                  optional: true
            # F-12 (CHG-2026-04-29-DOGFOOD T5.4) — JWT admin token p/ ArgoCD
            # populado por generate-secrets.sh (login REST + persist em
            # loopzero-api-tokens Secret). Sem este token, /api/v1/health/deep
            # reporta `argocd: auth_failed` mesmo com ArgoCD healthy.
            # Default in-cluster URL via config.go já resolve para
            # argocd-server.argocd.svc.cluster.local:80 (server.insecure: true).
            - name: ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: loopzero-api-tokens
                  key: argocd-token
                  optional: true
            # Phase 3.3 closure of plan 2026-06-02-loopzero-api-vault-integration v1.8.
            # CF_API_TOKEN previously read via os.Getenv only (config.go:417);
            # now sourced from loopzero-api-tokens Secret (key=cf-api-token) so ESO
            # ExternalSecret CR can sync from Vault path api/secrets/cf/api_token.
            # optional=true → graceful fallback to env var legacy when ESO disabled.
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: loopzero-api-tokens
                  key: cf-api-token
                  optional: true
            # T2.5 of openbao-adoption v1.3 — Vault TLS SPKI cert pin.
            # Written by openbao-init spki-extractor CronJob every 5min;
            # ESO syncs to K8s Secret vault-spki-pin (refreshInterval: 5m).
            # pkg/vault VerifyPeerCertificate callback validates Vault server
            # cert against this pinned hash (defense against MITM via
            # compromised CA per Q8/D8). optional=true: when empty, loopzero-api
            # falls back to standard TLS verification (no pin enforcement).
            - name: LOOPZERO_VAULT_SPKI_PIN
              valueFrom:
                secretKeyRef:
                  name: vault-spki-pin
                  key: LOOPZERO_VAULT_SPKI_PIN
                  optional: true
            # CANONICAL FIX 2026-06-15 (FAANG SEM WORKAROUND): api/internal/
            # config/config.go:429 reads env var `OPENBAO_SPKI_PIN_SHA256`
            # (NOT `LOOPZERO_VAULT_SPKI_PIN`). The pin Secret created by
            # vault-bootstrap-dev.sh Step 10b is canonical-named
            # `openbao-spki-pin` with key `OPENBAO_SPKI_PIN_SHA256`. Map
            # that into the env var name config.go reads — closes the
            # silent SPKI-pin-ignored regression that left loopzero-api falling
            # back to standard TLS verify against cert-manager self-signed
            # CA (x509: certificate signed by unknown authority).
            - name: OPENBAO_SPKI_PIN_SHA256
              valueFrom:
                secretKeyRef:
                  name: openbao-spki-pin
                  key: OPENBAO_SPKI_PIN_SHA256
                  optional: true
            # CANONICAL FIX 2026-06-15 (FAANG SEM WORKAROUND): GitHub
            # webhook HMAC signing secret. api/cmd/setup_github.go:147
            # reads GITHUB_WEBHOOK_SECRET env. Without it the webhook
            # handler short-circuits ("webhook disabled" log) and the
            # dogfood-project-connect test cannot exercise the chain.
            # Mirrors the tilt/api-deployment.yaml:140 binding so chart
            # consumers (dev-public + prod via ESO) get parity.
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: loopzero-github-webhook
                  key: value
                  optional: true
            # CANONICAL FIX 2026-06-15 (FAANG SEM WORKAROUND): GitHub App
            # private key (PKCS1 RSA PEM). api/cmd/setup_github.go:75
            # calls github.NewAppClient(appID, GITHUB_APP_PRIVATE_KEY); the
            # client is required by the autoDeployer construction guard at
            # setup_github.go:121 ("if ghAppClient != nil && buildSub !=
            # nil"). Without it, autoDeployer stays nil and the webhook
            # handler short-circuits ("webhook stays disabled" WARN log)
            # leaving POST /api/v1/webhooks/github at 404. Mirrors the
            # tilt/api-deployment.yaml:146 binding so chart consumers
            # (dev-public + prod via ESO) get parity.
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: loopzero-api-github
                  key: GITHUB_APP_PRIVATE_KEY
                  optional: true
            # Ed25519 dual-control public keys (ADR 2026-05-13-service-auth-
            # ed25519-adoption). Materialized by ESO from the Pulumi
            # ServiceAuthEd25519 component into Secret
            # `loopzero-service-auth-ed25519-pub` with keys `current` +
            # `previous`. Phase 1 default: env vars empty → trust set
            # empty → unsigned requests proceed via legacy path.
            - name: LOOPZERO_SERVICE_AUTH_ED25519_PUBLIC_CURRENT
              valueFrom:
                secretKeyRef:
                  name: loopzero-service-auth-ed25519-pub
                  key: current
                  optional: true
            - name: LOOPZERO_SERVICE_AUTH_ED25519_PUBLIC_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: loopzero-service-auth-ed25519-pub
                  key: previous
                  optional: true
            # Phase 1 → Phase 2 cutover toggle (ADR Q3). Default false
            # (accept-both). Operator sets to "true" only after 7-day
            # soak at 100% present rate confirms full adoption.
            - name: LOOPZERO_SERVICE_AUTH_REQUIRE_SIGNATURE
              value: {{ .Values.serviceAuthEd25519.requireSignature | default false | quote }}
            # Replay-protection nonce store address (ADR Q2). Default
            # points at the existing Bitnami Redis at
            # `redis.loopzero-system:6379` (gitea Redis, no auth, DB 0
            # default). Empty value forces in-memory fallback (single-
            # replica / dev only; multi-replica needs the shared store).
            - name: LOOPZERO_SERVICE_AUTH_NONCE_REDIS_ADDR
              value: {{ .Values.serviceAuthEd25519.nonceRedisAddr | default "" | quote }}
            - name: LOOPZERO_SERVICE_AUTH_NONCE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loopzero-service-auth-redis
                  key: password
                  optional: true
            {{- if .Values.vault.enabled }}
            # T5.11-T5.12 of plan 2026-06-02-openbao-adoption v1.3 — Vault
            # K8s auth login config. pkg/vault.Client reads these env vars
            # at startup; performs auth/<mount>/login with SA JWT from
            # /var/run/secrets/vault.loopzero.io/token.
            - name: LOOPZERO_VAULT_ADDR
              value: {{ .Values.vault.addr | quote }}
            - name: LOOPZERO_VAULT_K8S_AUTH_PATH
              value: {{ .Values.vault.authMount | quote }}
            - name: LOOPZERO_VAULT_ROLE
              value: {{ .Values.vault.role | quote }}
            - name: LOOPZERO_VAULT_SA_JWT_PATH
              value: "/var/run/secrets/vault.loopzero.io/token"
            {{- end }}
          envFrom:
            # B-104 — cada `optional: true` abaixo carrega a razao de ser opcional.
            # `optional: true` faz o kubelet iniciar o container mesmo sem a fonte,
            # entao ele e' o mecanismo que permite uma dependencia sumir sem que o
            # arranque diga nada. Medido em dev-public em 2026-08-16: SEIS das dez
            # fontes abaixo NAO EXISTEM no cluster (topology, broker-token, minio,
            # internal, stripe, admin) e a API esta' de pe' servindo. Isso nao e'
            # hipotese — e' o estado de agora, e e' o motivo de a consequencia ter
            # virado observavel via `loopzero_api_surface_enabled`.
            #
            # A wiring ConfigMap distribui a topologia da plataforma (enderecos dos
            # cluster peers). optional porque o chart e' instalado antes dela existir
            # na ordem de bootstrap: a ConfigMap e' criada por um passo posterior do
            # helmfile, e exigi-la aqui tornaria o bootstrap circular. Sem ela a API
            # sobe com os defaults de `config.go` — que apontam para os enderecos
            # in-cluster canonicos, logo o caminho feliz de instalacao unica funciona.
            # AUSENTE em dev-public 2026-08-16.
            - configMapRef:
                name: {{ .Values.wiringConfigMap | quote }}
                optional: true
            # NAO e' opcional, e a pergunta que este comentario carregava esta'
            # FECHADA: MEET-ASYNC-AMENDMENT-2026-08-17-no-database-is-a-config-error
            # (B-116).
            #
            # Era `optional: true`, e a combinacao com a "graceful degradation" do
            # `setup_database.go` fazia a API SUBIR SEM BANCO — 27 das 36 superficies
            # do roteador desligadas de uma vez, com `/api/v1/health` respondendo 200
            # porque aquela sonda e' a rasa.
            #
            # Tres medicoes fecharam a pergunta: (a) a degradacao nunca executou — ela
            # entrava em panico tres funcoes adiante (B-104); (b) o alcance e' 27/36,
            # nao uma superficie; (c) ela ja aconteceu, e o estrago esta' registrado
            # LOGO ACIMA neste arquivo — B35, 2026-04-28, "loopzero-api warns 'DATABASE_URL
            # not set' and runs without DB", descoberto por alguem investigando outra
            # coisa.
            #
            # Agora sao duas camadas dizendo a mesma coisa: o kubelet recusa iniciar o
            # conteiner sem o Secret, e o binario falha com erro tipado
            # (`ErrDatabaseURLNotSet`) se a variavel faltar por outro caminho.
            - secretRef:
                name: {{ .Values.dbCredentialsSecret | quote }}
                optional: false
            # T1.1 of plan 2026-05-29-dashboard-public-integration-canonicalization.
            # Shared with loopzero-cloud — single source of truth for X-Service-Auth.
            # Eliminates the inline-literal drift that caused 401 on /engine/* in
            # the 2026-05-29 LIVE session.
            - secretRef:
                name: loopzero-service-auth
                optional: true
            # T2.5 + T6.1 of plan 2026-06-10-j22-openbao-transit-eso-sync v1.2.
            # AppRole secret_id is the only OpenBao credential that MUST come
            # from a K8s Secret (per feedback_secret_canonical_no_hardcode).
            # The 4 non-sensitive OpenBao env vars (TRANSIT_ENABLED, VAULT_ADDR,
            # VAULT_ROLE_ID, SPKI_PIN_SHA256) flow through .Values.env as
            # literals. Bootstrap the Secret via:
            #   kubectl create secret generic loopzero-openbao-approle \
            #     --from-literal=OPENBAO_VAULT_SECRET_ID="<from vault write>"
            # See docs/operations/openbao-transit-cutover-runbook.md step 2.1.
            # optional=true so dev/test envs without OpenBao still boot —
            # config.Validate() fail-louds at startup IF transit was enabled
            # but the secret_id env is missing, which is the canonical signal
            # the secret wasn't created.
            - secretRef:
                name: loopzero-openbao-approle
                optional: true
            # CANONICAL FIX 2026-06-15 (FAANG SEM WORKAROUND): loopzero-broker-token
            # envFrom binding for the Layer 2 ESO sync broker (plan
            # 2026-06-10-j22-openbao-transit-eso-sync v1.2 D3). The broker
            # endpoint `/internal/v1/secret-fetch/{tenant_id}/{secret_name}`
            # validates Bearer auth via const-time compare against
            # LOOPZERO_BROKER_TOKEN; without this env var loopzero-api logs
            # "secret-fetch broker disabled" + the route stays unregistered
            # (router.go:122 guard), causing ESO ExternalSecret reconciles
            # to 404 in tenant workload namespaces — blocks the entire
            # J-22 secrets canonical chain. Mirrors tilt/api-deployment.yaml
            # binding. Secret key MUST be `LOOPZERO_BROKER_TOKEN` (envFrom
            # 1:1 mapping).
            - secretRef:
                name: loopzero-broker-token
                optional: true
            # Phase 3.3 of plan 2026-06-02-loopzero-api-vault-integration v1.8 (D11 ESO).
            # 5 NEW Secrets created por ExternalSecret CRs (chart
            # loopzero-external-secrets) pulling from loopzero-secrets. Keys são
            # UPPER_SNAKE matching env var names (envFrom 1:1 mapping).
            # All optional=true — fallback ao env var legacy se ESO desabilitado
            # (vaultEnabled=false) OR Secret ainda não sincronizado.
            # Credenciais do armazenamento de objetos (bundles de fonte). Sem elas o
            # upload cai no default in-cluster de `config.go`. AUSENTE em dev-public
            # 2026-08-16.
            - secretRef:
                name: loopzero-api-minio
                optional: true
            # Segredos de chamada interna entre componentes da plataforma. AUSENTE em
            # dev-public 2026-08-16.
            - secretRef:
                name: loopzero-api-internal
                optional: true
            # Credenciais do GitHub App (id + chave privada). Sem elas o introspector
            # de repositorio fica nil e o painel nao lista repos. PRESENTE em
            # dev-public 2026-08-16. O segredo HMAC do webhook e' outro (`loopzero-github-webhook`)
            # e a ausencia DELE e' o que este item tornou observavel.
            - secretRef:
                name: loopzero-api-github
                optional: true
            # Chaves do Stripe. Sem elas a jornada de cobranca responde erro tipado
            # em vez de sumir — e' o caminho que ja' falha alto. AUSENTE em dev-public
            # 2026-08-16, logo a cobranca esta' desligada agora.
            - secretRef:
                name: loopzero-api-stripe
                optional: true
            # Chave da API administrativa. Sem ela `validateAdminAPIKey` FALHA FECHADO
            # (chave vazia recusa antes da comparacao), entao a ausencia nega acesso em
            # vez de conceder — o caminho correto. AUSENTE em dev-public 2026-08-16.
            - secretRef:
                name: loopzero-api-admin
                optional: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
          # B-135 — DEEP de proposito, e diferente da liveness.
          #
          # Ate' 2026-08-19 as duas apontavam para `/api/v1/health`, que responde 200
          # INCONDICIONALMENTE. O pod ficava `Ready` com o banco fora, recebendo trafego e
          # devolvendo erro. `/api/v1/health/ready` (`server/router.go:120` -> DeepHealth)
          # devolve 503 quando o banco nao responde, quando um servico declarado esta'
          # inalcancavel, ou quando a descoberta encontra ZERO cells.
          #
          # A liveness NAO muda: aponta-la para o deep faria o banco fora MATAR o pod, e o
          # pod novo tambem nao teria banco — laco de reinicio sem convergencia.
          #
          # Este chart e' o que de fato roda; o irmao publicado foi corrigido junto, e a
          # guarda `probes_readiness_is_deep_test.go` cobre os dois.
          #
          # MEET-ASYNC-AMENDMENT-2026-08-19-readiness-deep-probe (pending ratification).
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
          # T3.3 of deep-review-2026-05-10-remediation-plan (find_infra_no_startup_probe):
          # slow boots (DB pool warm-up, advisory-lock-on-startup) should
          # not get killed by livenessProbe before the binary is ready.
          # startupProbe gives the pod up to 60s (30 × 2s) before
          # liveness takes over.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.service.port }}
            failureThreshold: 30
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: loopzero-api
  labels:
    app: loopzero-api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      # F-01 (CHG-2026-04-29-DOGFOOD T2.1) — fixed NodePort para que k3d-mgmt
      # serverlb forwarde host:13001 → cluster:30001 → este Service. Permite
      # CLI alcançar API em standalone-multi sem `tilt up` ou port-forward.
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    # F-08 (CHG-2026-04-29-DOGFOOD T5.3) — metrics port no Service para
    # scraping pelo Prometheus / Loki / Grafana. ServiceMonitor target this
    # port via name=metrics (não port number direto, para resiliência a
    # mudanças de port). Permanece ClusterIP — não exposto externamente.
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app: loopzero-api
