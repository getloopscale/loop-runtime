apiVersion: apps/v1
kind: Deployment
metadata:
  name: loopzero-api
  labels:
    app: loopzero-api
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    loopzero.io/component: loopzero-api
spec:
  replicas: {{ .Values.replicaCount }}
  # MEET-ASYNC-AMENDMENT-2026-05-12-003 Option A (RATIFIED 2026-05-12):
  # RollingUpdate when replicaCount >= 2 (multi-replica HA); Recreate when
  # single-replica (preserves legacy single-instance semantics for dev).
  # RollingUpdate + maxUnavailable=0 ensures zero-downtime deploys.
  {{- if gt (int .Values.replicaCount) 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: loopzero-api
  template:
    metadata:
      labels:
        app: loopzero-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # B36 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — Mount synthetic kubeconfigs
      # generated by generate-secrets.sh. In standalone, all 3 collapse to
      # the local API server (in-cluster service account). In LoopZero Cloud,
      # Pulumi will inject distinct kubeconfigs for mgmt/build/runtime DOKS.
      serviceAccountName: loopzero-api
      volumes:
        - name: cluster-kubeconfigs
          secret:
            secretName: loopzero-cluster-kubeconfigs
            optional: true
        # B79 (end-to-end-deploy-validation-plan iter 11) — gitops push
        # creates temp dirs under /tmp for git clone. Pod has
        # readOnlyRootFilesystem: true (security hardening), so /tmp must
        # be a writable emptyDir volume.
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        {{- if .Values.vault.enabled }}
        # T5.11 of plan 2026-06-02-openbao-adoption v1.3 — projected SA
        # token with bounded audience + expiration. Read by pkg/vault.Client
        # at /var/run/secrets/vault.loopzero.io/token; sent to auth/k8s-mgmt/login.
        # Vault TokenReview validates audience claim cryptographically,
        # preventing token re-use against K8s API or other audiences.
        - name: vault-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.vault.audience | default "vault.loopzero.io" }}
                  expirationSeconds: {{ .Values.vault.tokenExpirationSeconds | default 3600 }}
        {{- end }}
      containers:
        - name: loopzero-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
            # F-08 (CHG-2026-04-29-DOGFOOD T5.3) — metrics port declarado
            # explicitamente para que ServiceMonitor (Prometheus Operator)
            # consiga scrape. Em standalone-multi sem prometheus-operator,
            # ServiceMonitor não é renderizado mas o port permanece exposto
            # — pode ser scraped via `kubectl port-forward` ou via Prometheus
            # standalone scrape config.
            - containerPort: 9090
              name: metrics
              protocol: TCP
          volumeMounts:
            - name: cluster-kubeconfigs
              mountPath: /etc/loopzero/kubeconfigs
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.vault.enabled }}
            # T5.11 of plan 2026-06-02-openbao-adoption v1.3 — Vault projected
            # token mount. pkg/vault.Client reads /var/run/secrets/vault.loopzero.io/token.
            - name: vault-sa-token
              mountPath: /var/run/secrets/vault.loopzero.io
              readOnly: true
            {{- end }}
          env:
            - name: MGMT_KUBECONFIG
              value: /etc/loopzero/kubeconfigs/mgmt.kubeconfig
            - name: BUILD_KUBECONFIG
              value: /etc/loopzero/kubeconfigs/build.kubeconfig
            - name: RUNTIME_KUBECONFIG
              value: /etc/loopzero/kubeconfigs/runtime.kubeconfig
            # Plan 2026-05-19-drill-skills-rigor-restoration T2.1: REMOVED
            # hardcoded "in-cluster" defaults that caused loopzero-api CrashLoop
            # quando overlay drill (DOKS) tem real context names like
            # "do-sfo3-loopzero-drill-mgmt-cluster". Bootstrap script tinha
            # workaround kubectl-set-env post-sync (T2 follow-up tag) que
            # NÃO sobrevivia a re-sync. Comment "Pulumi sets these to actual
            # DOKS context names" era FALSA — Pulumi nunca setou.
            # NOW: values fornecem context names via .Values.kubeContexts
            # com fallback default "in-cluster" para local k3d synthetic.
            - name: MGMT_KUBE_CONTEXT
              value: {{ .Values.kubeContexts.mgmt | default "in-cluster" | quote }}
            - name: BUILD_KUBE_CONTEXT
              value: {{ .Values.kubeContexts.build | default "in-cluster" | quote }}
            - name: RUNTIME_KUBE_CONTEXT
              value: {{ .Values.kubeContexts.runtime | default "in-cluster" | quote }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
            # F-7 (dogfood-2026-05-08-fixes T0.1, ADR D7) — gate OTel
            # tracing on .Values.tracing.enabled. Default false in this
            # bootstrap chart (local k3d has no Tempo); operators set
            # `tracing.enabled: true` via overlay when Tempo is reachable.
            - name: LOOPZERO_TRACING_ENABLED
              value: {{ .Values.tracing.enabled | default false | quote }}
            # B78 (end-to-end-deploy-validation-plan iter 11) — loopzero-api
            # needs GITEA_TOKEN to create + push to tenant gitops repos.
            # Mapped from `gitea-admin.token` Secret (same source as
            # tenant-controller B41) — both share the org-admin token.
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-admin
                  key: token
                  optional: true
            # B35 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — Map secret key
            # `uri` to env var `DATABASE_URL` because the application
            # expects DATABASE_URL but the secret stores it as `uri`.
            # Without this mapping, loopzero-api warns "DATABASE_URL not set"
            # and runs without DB. Detected on standalone bootstrap 2026-04-28.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbCredentialsSecret | quote }}
                  key: uri
                  optional: true
            # F-12 (CHG-2026-04-29-DOGFOOD T5.4) — JWT admin token p/ ArgoCD
            # populado por generate-secrets.sh (login REST + persist em
            # loopzero-api-tokens Secret). Sem este token, /api/v1/health/deep
            # reporta `argocd: auth_failed` mesmo com ArgoCD healthy.
            # Default in-cluster URL via config.go já resolve para
            # argocd-server.argocd.svc.cluster.local:80 (server.insecure: true).
            - name: ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: loopzero-api-tokens
                  key: argocd-token
                  optional: true
            # Phase 3.3 closure of plan 2026-06-02-loopzero-api-vault-integration v1.8.
            # CF_API_TOKEN previously read via os.Getenv only (config.go:417);
            # now sourced from loopzero-api-tokens Secret (key=cf-api-token) so ESO
            # ExternalSecret CR can sync from Vault path api/secrets/cf/api_token.
            # optional=true → graceful fallback to env var legacy when ESO disabled.
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: loopzero-api-tokens
                  key: cf-api-token
                  optional: true
            # T2.5 of openbao-adoption v1.3 — Vault TLS SPKI cert pin.
            # Written by openbao-init spki-extractor CronJob every 5min;
            # ESO syncs to K8s Secret vault-spki-pin (refreshInterval: 5m).
            # pkg/vault VerifyPeerCertificate callback validates Vault server
            # cert against this pinned hash (defense against MITM via
            # compromised CA per Q8/D8). optional=true: when empty, loopzero-api
            # falls back to standard TLS verification (no pin enforcement).
            - name: LOOPZERO_VAULT_SPKI_PIN
              valueFrom:
                secretKeyRef:
                  name: vault-spki-pin
                  key: LOOPZERO_VAULT_SPKI_PIN
                  optional: true
            # Ed25519 dual-control public keys (ADR 2026-05-13-service-auth-
            # ed25519-adoption). Materialized by ESO from the Pulumi
            # ServiceAuthEd25519 component into Secret
            # `loopzero-service-auth-ed25519-pub` with keys `current` +
            # `previous`. Phase 1 default: env vars empty → trust set
            # empty → unsigned requests proceed via legacy path.
            - name: LOOPZERO_SERVICE_AUTH_ED25519_PUBLIC_CURRENT
              valueFrom:
                secretKeyRef:
                  name: loopzero-service-auth-ed25519-pub
                  key: current
                  optional: true
            - name: LOOPZERO_SERVICE_AUTH_ED25519_PUBLIC_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: loopzero-service-auth-ed25519-pub
                  key: previous
                  optional: true
            # Phase 1 → Phase 2 cutover toggle (ADR Q3). Default false
            # (accept-both). Operator sets to "true" only after 7-day
            # soak at 100% present rate confirms full adoption.
            - name: LOOPZERO_SERVICE_AUTH_REQUIRE_SIGNATURE
              value: {{ .Values.serviceAuthEd25519.requireSignature | default false | quote }}
            # Replay-protection nonce store address (ADR Q2). Default
            # points at the existing Bitnami Redis at
            # `redis.loopzero-system:6379` (gitea Redis, no auth, DB 0
            # default). Empty value forces in-memory fallback (single-
            # replica / dev only; multi-replica needs the shared store).
            - name: LOOPZERO_SERVICE_AUTH_NONCE_REDIS_ADDR
              value: {{ .Values.serviceAuthEd25519.nonceRedisAddr | default "" | quote }}
            - name: LOOPZERO_SERVICE_AUTH_NONCE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loopzero-service-auth-redis
                  key: password
                  optional: true
            {{- if .Values.vault.enabled }}
            # T5.11-T5.12 of plan 2026-06-02-openbao-adoption v1.3 — Vault
            # K8s auth login config. pkg/vault.Client reads these env vars
            # at startup; performs auth/<mount>/login with SA JWT from
            # /var/run/secrets/vault.loopzero.io/token.
            - name: LOOPZERO_VAULT_ADDR
              value: {{ .Values.vault.addr | quote }}
            - name: LOOPZERO_VAULT_K8S_AUTH_PATH
              value: {{ .Values.vault.authMount | quote }}
            - name: LOOPZERO_VAULT_ROLE
              value: {{ .Values.vault.role | quote }}
            - name: LOOPZERO_VAULT_SA_JWT_PATH
              value: "/var/run/secrets/vault.loopzero.io/token"
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Values.wiringConfigMap | quote }}
                optional: true
            - secretRef:
                name: {{ .Values.dbCredentialsSecret | quote }}
                optional: true
            # T1.1 of plan 2026-05-29-dashboard-public-integration-canonicalization.
            # Shared with loopzero-cloud — single source of truth for X-Service-Auth.
            # Eliminates the inline-literal drift that caused 401 on /engine/* in
            # the 2026-05-29 LIVE session.
            - secretRef:
                name: loopzero-service-auth
                optional: true
            # Phase 3.3 of plan 2026-06-02-loopzero-api-vault-integration v1.8 (D11 ESO).
            # 5 NEW Secrets created por ExternalSecret CRs (chart
            # loopzero-external-secrets) pulling from loopzero-vault. Keys são
            # UPPER_SNAKE matching env var names (envFrom 1:1 mapping).
            # All optional=true — fallback ao env var legacy se ESO desabilitado
            # (vaultEnabled=false) OR Secret ainda não sincronizado.
            - secretRef:
                name: loopzero-api-minio
                optional: true
            - secretRef:
                name: loopzero-api-internal
                optional: true
            - secretRef:
                name: loopzero-api-github
                optional: true
            - secretRef:
                name: loopzero-api-stripe
                optional: true
            - secretRef:
                name: loopzero-api-admin
                optional: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          # T3.3 of deep-review-2026-05-10-remediation-plan (find_infra_no_startup_probe):
          # slow boots (DB pool warm-up, advisory-lock-on-startup) should
          # not get killed by livenessProbe before the binary is ready.
          # startupProbe gives the pod up to 60s (30 × 2s) before
          # liveness takes over.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.service.port }}
            failureThreshold: 30
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: loopzero-api
  labels:
    app: loopzero-api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      # F-01 (CHG-2026-04-29-DOGFOOD T2.1) — fixed NodePort para que k3d-mgmt
      # serverlb forwarde host:13001 → cluster:30001 → este Service. Permite
      # CLI alcançar API em standalone-multi sem `tilt up` ou port-forward.
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    # F-08 (CHG-2026-04-29-DOGFOOD T5.3) — metrics port no Service para
    # scraping pelo Prometheus / Loki / Grafana. ServiceMonitor target this
    # port via name=metrics (não port number direto, para resiliência a
    # mudanças de port). Permanece ClusterIP — não exposto externamente.
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app: loopzero-api
