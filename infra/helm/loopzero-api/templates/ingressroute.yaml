{{- if .Values.ingress.enabled }}
# Traefik IngressRoute exposing loopzero-api at api.{domain}.
# Cloudflare Tunnel routes *.{domain} to Traefik (per ADR D9 — runtime cluster);
# in mgmt cluster the same host pattern applies for self-hosting/standalone.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: loopzero-api
  labels:
    app: loopzero-api
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    loopzero.io/component: loopzero-api
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`api.{{ .Values.domain }}`)
      kind: Rule
      # SD-04.6 (system-design audit 2026-09-07). Traefik declares Middleware
      # rate-limit (average 100, burst 200, period 1s) and NOTHING referenced it —
      # the only occurrence of the name in the whole repository was a comment
      # claiming it was referenced. Rate limiting ran in-process only, inside the
      # deployment it is meant to protect, so an overloaded loopzero-api could not
      # shed load before the request reached it.
      #
      # Attaching it here also bounds SD-04.7 and SD-04.3 for traffic on this
      # route: the edge is the one place where a single instance of the limit
      # exists, so neither the per-replica multiplication nor the fixed-window
      # boundary burst applies to what arrives through it.
      #
      # body-limit is now attached too. It was held back while it capped at 10 MiB
      # against a 500 MB SOURCE_MAX_BUNDLE_SIZE — attaching it then would have
      # rejected every deploy over 10 MiB. The cap was raised to match the app
      # (SD-14.1), and edge_body_limit_test.go fails if the two ever diverge.
      middlewares:
        - name: rate-limit
          namespace: traefik
        - name: body-limit
          namespace: traefik
      services:
        - name: loopzero-api
          port: {{ .Values.service.port }}
  tls:
    {{- if eq .Values.ingress.certIssuer "CFManaged" }}
    {}  # Cloudflare-managed TLS; no cert-manager Certificate
    {{- else }}
    secretName: loopzero-api-tls
    {{- end }}
{{- if and .Values.ingress.tls (ne .Values.ingress.certIssuer "CFManaged") }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: loopzero-api-tls
  labels:
    app: loopzero-api
spec:
  secretName: loopzero-api-tls
  duration: 2160h     # 90d
  renewBefore: 360h   # 15d
  commonName: api.{{ .Values.domain }}
  dnsNames:
    - api.{{ .Values.domain }}
  issuerRef:
    name: {{ .Values.ingress.certIssuer | quote }}
    kind: ClusterIssuer
{{- end }}
{{- if .Values.ingress.localhost }}
---
# F-01 (CHG-2026-04-29-DOGFOOD T2.1) — IngressRoute adicional para localhost.
# Em standalone-multi o CLI default endpoint é http://localhost:13001 que k3d
# mapeia para NodePort 30001 do mgmt-serverlb. Esta route faz Traefik aceitar
# o Host header `localhost`, `127.0.0.1` e `api.loopzero.local` no entry point
# `web` (HTTP) — sem TLS para evitar self-signed cert warnings em dev local.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: loopzero-api-localhost
  labels:
    app: loopzero-api
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    loopzero.io/component: loopzero-api
    loopzero.io/profile: standalone-multi
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`localhost`) || Host(`127.0.0.1`) || Host(`api.loopzero.local`)
      kind: Rule
      services:
        - name: loopzero-api
          port: {{ .Values.service.port }}
{{- end }}
{{- end }}
