{{/*
T8.2 of deep-review-remediation-plan (closes find_infra_004 MEDIUM):
adds PodDisruptionBudget to bootstrap chart (published chart already had
one via loopzero-common.pdb).

EC-12 of edge-case review: PDB with minAvailable=1 + replicaCount=1 blocks
node drain forever (drain cannot reduce ready replicas below minAvailable).
This template emits PDB ONLY when replicaCount >= 2 — single-replica dev
deployments stay drainable.

Production should run replicaCount >= 2 (set in cell-specific overrides).
*/}}
{{- if ge (int .Values.replicaCount) 2 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: loopzero-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: loopzero-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: loopzero-api
{{- end }}
