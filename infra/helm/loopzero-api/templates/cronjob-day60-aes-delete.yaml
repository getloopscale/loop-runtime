{{- if .Values.vault.day60AesDeleteCron.enabled }}
{{/*
SPDX-License-Identifier: Apache-2.0
T10.3+T10.4 of plan 2026-06-02-openbao-adoption v1.3.

Day 60 AES deletion cron — final crypto-shred. Runs after T10.1 Day 30
verify pass:
  (1) Re-encrypts any remaining AES rows to Vault Transit (`vault:v1:` prefix)
  (2) Asserts ZERO rows remain without the Transit prefix
  (3) DELETES the legacy `secret/data/platform/legacy-aes-key` from Vault
      (crypto-shred — irreversibly destroys the AES master key)

After this job completes:
  - All ciphertexts in DB carry vault:v1: prefix
  - The AES master key no longer exists anywhere
  - pkg/quality/noaesremaining enforcement begins (T10.2)
  - The AES code path in secret_wrapper.go is dead code (T10.3 delete)
  - Legacy AES tests are dead (T10.5 delete)

WARNING (operator-time):
  - DRY RUN first: --dry-run flag does NOT delete the AES master key
  - Backup Vault snapshot before final run
  - Confirm with sponsor sign-off — crypto-shred is irreversible
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: loopzero-secrets-day60-aes-delete
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: loopzero-api
    app.kubernetes.io/component: aes-delete-cron
    loopzero.io/related-plan: "2026-06-02-openbao-adoption v1.3 T10.3-T10.4"
spec:
  schedule: {{ .Values.vault.day60AesDeleteCron.schedule | default "0 5 1 */2 *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 7
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        spec:
          serviceAccountName: loopzero-api
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: delete-aes
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - "/loopzero-api"
                - "secret"
                - "migrate-to-transit"
                - "--dry-run={{ .Values.vault.day60AesDeleteCron.dryRun | default "true" }}"
                - "--shred-aes-key={{ .Values.vault.day60AesDeleteCron.shredAesKey | default "false" }}"
              env:
                - name: LOOPZERO_VERIFY_MODE
                  value: "day60"
              envFrom:
                - secretRef:
                    name: loopzero-api
                    optional: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
{{- end }}
