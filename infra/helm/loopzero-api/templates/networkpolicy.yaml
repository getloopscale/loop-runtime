{{/*
T3.3 of plan 2026-06-10-j22-openbao-transit-eso-sync v1.2 — egress
NetworkPolicy scoped to loopzero-api pods that allows TCP/8200 ONLY to the
openbao pod(s) in the secrets-system namespace.

Cutover procedure: docs/runbooks.md, `Transit cutover` — the longest in the set,
600+ lines, and worth reading in full before starting. It was
`openbao-transit-cutover-runbook.md` until the six-document consolidation; the
citation left with the file and this comment is where it belongs.

NetworkPolicy operates at L3/L4; path-level enforcement (only
/v1/transit/{encrypt,decrypt,keys}/loopzero-tenants/*) is delegated to the
AppRole policy (per D4 ADR per-tenant key isolation). The L4 restriction
caps blast-radius: a compromised loopzero-api can still TALK to OpenBao but
cannot exfiltrate data via other secrets-system services (debug ports,
sidecars, etc.).

Conditional via .Values.networkPolicy.vaultEgress.enabled (default false
to preserve backwards compatibility with environments where the network
policy controller is not yet wired). When enabled in the same env as
the default-deny-egress baseline (loopzero-system-default-deny-egress, see
infra/helm/network-policies/templates/loopzero-system-egress.yaml), this
explicit allow is REQUIRED for loopzero-api → OpenBao traffic to succeed.

Validates D6 ADR's fail-loud contract from another angle: even if
boot-time validation passes, the network policy must explicitly permit
the egress or the runtime HTTP call will hang and surface as
ErrVaultUnreachable.
*/}}
{{- if .Values.networkPolicy.vaultEgress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loopzero-api-vault-egress
  namespace: {{ .Release.Namespace | default "loopzero-system" }}
  labels:
    app: loopzero-api
    loopzero.io/component: loopzero-api
    loopzero.io/plan: 2026-06-10-j22-openbao-transit-eso-sync
    loopzero.io/task: T3.3
  annotations:
    plan.loopzero.io/ref: "T3.3 of plan 2026-06-10-j22-openbao-transit-eso-sync v1.2"
spec:
  podSelector:
    matchLabels:
      app: loopzero-api
  policyTypes:
    - Egress
  egress:
    # Allow loopzero-api → openbao pod(s) in secrets-system on TCP/8200 ONLY.
    # The combined namespaceSelector + podSelector means: a pod is the
    # endpoint iff it lives in secrets-system NS AND has
    # app.kubernetes.io/name: openbao label. Either alone is insufficient.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.vaultEgress.namespace | default "secrets-system" }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.networkPolicy.vaultEgress.podName | default "openbao" }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.vaultEgress.port | default 8200 }}
{{- end }}
