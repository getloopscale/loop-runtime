# Overlay applied on top of values.yaml in the standalone-multi profile only.
# end-to-end-deploy-validation-plan iter 11 — B77 fix requires a rebuilt loopzero-api
# image (cmd/setup_*.go GITEA_ORG via cfg.GiteaOrg). Until next CI tag publish
# includes the patch, standalone-multi uses the locally-built image pushed to
# k3d-loopzero-registry. dev/prod profiles continue using values.yaml default
# (DO Registry REDACTED_SECRET_061).
image:
  # F-07 (CHG-2026-04-29-DOGFOOD T5.2) — rebuild com `/api/v1/version`
  # endpoint público. Antes: localhost:13001/api/v1/version → 404.
  repository: k3d-loopzero-registry:5000/loopzero-api
  tag: f07-fix
  pullPolicy: IfNotPresent

# F-01 (CHG-2026-04-29-DOGFOOD T2.1) — expor loopzero-api ao usuário em
# standalone-multi. NodePort 30001 é mapeado por k3d-mgmt para host:13001
# (mgmt-cluster.yaml ports section); IngressRoute adicional aceita Host=`localhost`
# em entry point `web` (HTTP, sem TLS). Resultado: `loopzero whoami`, `loopzero deploy`,
# etc. funcionam após `task setup -e standalone-multi` sem `tilt up`.
# Em dev/prod este overlay não é aplicado — Service segue ClusterIP, ingress
# apenas via Cloudflare Tunnel + Traefik websecure (api.dev.loopzero.example).
service:
  type: NodePort
  port: 3001
  nodePort: 30001

ingress:
  enabled: true
  localhost: true

# F-NEW (CHG-2026-04-29-DOGFOOD iter 8) — JWT validation via Hydra JWKS.
# Sem essas envs loopzero-api fallback para validação legacy (que rejeita
# qualquer JWT RSA emitido pelo Hydra). Rule 10: ambiente local = produção,
# que SEMPRE tem JWKS apontando para Hydra. Em produção (DOKS) essas vars
# vêm de Pulumi outputs; em standalone-multi viram do service DNS interno.
env:
  # api/cmd/setup_auth.go:24 lê JWKS_URL (não JWKS_ENDPOINT — config.go usa
  # esse outro nome em outro contexto). audience hardcoded "loopzero-engine"
  # bate com aud das tokens emitidas pelo loopzero-bootstrap client.
  JWKS_URL: "http://ory-hydra-public.loopzero-auth.svc.cluster.local:4444/.well-known/jwks.json"
  # JWT_ISSUER deve casar com `hydra.config.urls.self.issuer` da chart
  # ory-hydra. Em standalone-multi o helm values ficou em
  # `http://localhost:4444/` (default da chart). Em dev/prod o overlay
  # de Pulumi seta para a URL pública real (ex: https://auth.<domain>).
  JWT_ISSUER: "http://localhost:4444/"
