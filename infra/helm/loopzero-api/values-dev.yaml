# Dev (DOKS shared dev) overrides for loopzero-api.
#
# CHG-2026-04-30-INFRA-NORMALIZE / Phase 5 T5.4. Pairs with values-prod
# overlay; dev opts into DynamicRouter so cell-2 canary stages 1+2
# (T5.6/T5.7) can exercise the multi-cell code path before production.

env:
  LOOPZERO_DYNAMIC_ROUTER: "true"


# ============================================================================
# T1.1.b (plan 2026-06-11-code-review-remediation-147-findings v1.2) — runtime
# config + secrets migrated from infra/tilt/api-deployment.yaml per ADR D1.
# Mounted into Tilt-owned Deployment via envFrom: [configMapRef, secretRef].
# checksum/config annotation on Pod template triggers rollout on edit.
# ============================================================================
runtimeConfig:
  PORT: "3001"
  LOG_LEVEL: "debug"
  LOOPZERO_TRACING_ENABLED: "false"
  LOOPZERO_DISABLE_LEGACY_LOOPS: "false"
  MINIO_ENDPOINT: "http://minio.loopzero-system.svc.cluster.local:9000"
  MINIO_CROSS_CLUSTER_ENDPOINT: "http://172.18.0.3:32000"
  MINIO_ACCESS_KEY: "loopzero-admin"
  GITEA_URL: "http://gitea-http.loopzero-system.svc.cluster.local:3000"
  GITEA_CROSS_CLUSTER_URL: "http://172.18.0.3:30000"
  API_CROSS_CLUSTER_URL: "http://172.18.0.3:30001"
  ARGOCD_URL: "http://argocd-server.argocd.svc.cluster.local:80"
  BUILD_KUBECONFIG: "/etc/loopzero/build-kubeconfig"
  BUILD_KUBE_CONTEXT: "build"
  RUNTIME_KUBECONFIG: "/etc/loopzero/runtime/kubeconfig"
  RUNTIME_KUBE_CONTEXT: "in-cluster"
  LOKI_URL: "http://k3d-loopzero-build-serverlb:30094"
  REGISTRY_URL: "k3d-loopzero-registry:5000"
  REGISTRY_INSECURE: "true"
  LOOPZERO_PACKS_IMAGE: "k3d-loopzero-registry:5000/loopzero-packs-runner:v0.4.0"
  LOOPZERO_DOCKERFILE_LINT_IMAGE: "k3d-loopzero-registry:5000/loopzero-dockerfile-lint:v0.1.0"
  LOOPZERO_CLONE_IMAGE: "k3d-loopzero-registry:5000/loopzero-clone-runner:v0.1.0"
  LOOPZERO_SYFT_IMAGE: "k3d-loopzero-registry:5000/loopzero-syft-scanner:v0.1.0"
  LOOPZERO_COSIGN_IMAGE: "k3d-loopzero-registry:5000/loopzero-cosign-signer:v0.1.0"
  LOOPZERO_ADMIN_API: "true"
  GITHUB_APP_ID: "3319955"
  WORKLOAD_INGRESS_URL: "http://172.18.0.12:80"
  # J-25 Live URL Discoverability — FAANG canonical fix (sponsor walkthrough
  # 2026-06-12 catches #21+#22). Replaces v1 patch-the-symptom approach where
  # BASE_DOMAIN was bent to carry the public wildcard — that broke the
  # IngressRoute Host match because Caddy reverse_proxies *.prod-dev.loopzero.example
  # to Traefik with Host rewritten to <sub>.loopzero.local.
  #
  # SEPARATION OF CONCERNS (ADR D3 of plan 2026-06-12-dashboard-journey-j25):
  #   BASE_DOMAIN        = cluster-internal SNI used by IngressRoute Host rule
  #                        (single source of truth: pkg/naming.AppHostname).
  #                        Caddy rewrites the public Host header to this
  #                        domain before forwarding — IngressRoute MUST be
  #                        emitted under loopzero.local for the rewrite to land.
  #   LOOPZERO_PUBLIC_DOMAIN = wildcard root used by status.url + dashboard
  #                        "Visit" link. Shape:
  #                          https://<tenant>-<project>-<entryApp>-<env>.<LOOPZERO_PUBLIC_DOMAIN>
  #                        Matches IngressRoute Host after Caddy rewrite.
  #
  # Mirror of LOOPZERO_PREVIEW_PUBLIC_DOMAIN/BaseDomain split already in place
  # for J-23 previews. values-dev.yaml is the canonical consumed by Tilt-
  # rendered ConfigMap (Tiltfile line 165) per memory
  # `feedback_tilt_owned_deployment_yaml_drift`.
  BASE_DOMAIN: "loopzero.local"
  LOOPZERO_PUBLIC_DOMAIN: "prod-dev.loopzero.example"
  JWKS_URL: "http://ory-hydra-public.loopzero-auth.svc.cluster.local:4444/.well-known/jwks.json"
  JWT_ISSUER: "http://ory-hydra-public.loopzero-auth.svc.cluster.local:4444/"
  LOOPZERO_CLUSTER_ISSUER: "loopzero-ca-issuer"
  OPENBAO_TRANSIT_ENABLED: "true"
  OPENBAO_VAULT_ADDR: "https://openbao.vault-system.svc.cluster.local:8200"
  OPENBAO_VAULT_ROLE_ID: "b805a39a-2b8c-afdd-1b7a-95073b1c1be6"
  # T1.4 of plan 2026-06-11-cleanroom-canonical-5-defense-layers v1.2:
  # OPENBAO_SPKI_PIN_SHA256 literal REMOVED. SPKI pin changes whenever
  # cert-manager rotates the openbao-tls Secret — hardcoded hex went
  # stale every Cleanroom, breaking Transit chain. Canonical pattern:
  # env var sourced via valueFrom.secretKeyRef pointing at K8s Secret
  # `openbao-spki-pin` created by `task vault:bootstrap-dev` (T2.1)
  # which auto-extracts SPKI from the live openbao-tls cert. See
  # j22-aprendizado-spki-pin-hardcoded-vs-dynamic-cert memory.
  # Chart deployment.yaml wires via valueFrom.secretKeyRef name: openbao-spki-pin key OPENBAO_SPKI_PIN_SHA256 optional true.

runtimeSecrets:
  DATABASE_URL: "postgres://loopzero:loopzero-dev-password@postgresql.loopzero-system.svc.cluster.local:5432/loopzero?sslmode=disable"
  LOOPZERO_ARGO_CALLBACK_SECRET: "dev-callback-secret"
  MINIO_SECRET_KEY: "loopzero-dev-password"
  LOOPZERO_SERVICE_AUTH_SECRET: "cleanroom-service-auth-secret-do-not-use-in-prod"
