# Loki behind an internal Application Load Balancer (profile.awsLoadBalancerController).
#
# The one Loki of the environment runs on the build cluster; the Promtail of every other
# cluster (core, the cells) pushes to it through the internal ALB the AWS Load Balancer
# Controller makes for the Ingress below, as production's Promtail pushes to one Loki
# behind an internal load balancer. `task staging:platform` reads the ALB's DNSName from
# this Ingress' status once the build cluster is synced (infra/staging/monitoring-addresses.sh)
# and hands it to the syncs that render those Promtail (LOOPZERO_LOKI_ALB_DNS_NAME).
#
# Instance targets, as for the edge (../traefik/values-alb.yaml.gotmpl): the ALB registers
# the node group's instances on a NodePort, which needs nothing of the CNI. The chart's
# own `loki` Service is a ClusterIP it hard-codes, so the NodePort is a second Service
# over the same pod.
extraObjects:
  - apiVersion: v1
    kind: Service
    metadata:
      name: loki-internal
      namespace: monitoring
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/component: internal-load-balancer
    spec:
      type: NodePort
      selector:
        app.kubernetes.io/name: loki
        app.kubernetes.io/instance: loki
        app.kubernetes.io/component: single-binary
      ports:
        - name: http-metrics
          port: 3100
          targetPort: http-metrics
          protocol: TCP
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: loki-internal
      namespace: monitoring
      annotations:
        alb.ingress.kubernetes.io/scheme: internal
        alb.ingress.kubernetes.io/target-type: instance
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
        alb.ingress.kubernetes.io/backend-protocol: HTTP
        alb.ingress.kubernetes.io/healthcheck-path: /ready
    spec:
      ingressClassName: alb
      rules:
        - http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: loki-internal
                    port:
                      name: http-metrics
