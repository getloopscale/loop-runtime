# Grafana Loki — log aggregation for build logs
# Chart: grafana/loki
# Purpose: Stores build output from Argo Workflows pods, queried by loopzero API
# Storage: MinIO (S3-compatible) — bucket loopzero-logs
#
# LOCAL DEVELOPMENT (k3d) ONLY.
# Production: Pulumi (infra/pulumi/src/components/build-loki.ts) overrides S3
# credentials with config.spacesAccessKeyId / config.spacesSecretAccessKey from
# `pulumi config set --secret`. These dev defaults are never used in production.
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
    # Filesystem path config required by chart v6.24+ when storage.type=filesystem.
    path_prefix: /var/loki
  # LIVE-caught 2026-06-09 sponsor walkthrough: the previous S3 storage
  # config pointed at `minio.loopzero-system:9000` which is unreachable from
  # the BUILD cluster (MinIO lives on MGMT cluster, no cross-cluster path
  # wired in k3d serverlb mappings). The secret_access_key field was also
  # left empty with a "T1.3: helmfile env or --set required" TODO that
  # never got wired. Both gaps caused Loki ingester to fail flushing
  # chunks (NoCredentialProviders → DNS lookup failure cascade), and
  # query path returned "connection reset by peer" because Loki's internal
  # state was broken. Switching to filesystem storage decouples build-cluster
  # Loki from core-cluster MinIO entirely — clean SoC: build-pipeline logs
  # persist on the build cluster's local PV. Production (DOKS) gets cloud-
  # native object storage (DO Spaces) which IS network-reachable from the
  # build cluster — that wiring lives in pulumi-platform overrides, NOT in
  # this dev-local chart. Per feedback_no_hardcode_gate_2026_06_09: removes
  # the stale legacy MinIO endpoint literal and the never-wired credential
  # TODO from the chart values.
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: rules
      admin: admin
  limits_config:
    retention_period: 168h                   # 7 days (default)
    # T8.2 of plan 2026-06-02-openbao-adoption v1.4 — Vault audit log
    # streams require 90-day retention for forensic + compliance review.
    # Selector matches Vault server pod (secrets-system NS). Higher priority
    # overrides the default 168h. Other audit-bearing namespaces can be
    # added here (e.g., argocd, loopzero-system) as separate retention_stream
    # entries.
    retention_stream:
      - selector: '{namespace="secrets-system"}'
        priority: 1
        period: 2160h                        # 90 days
    max_query_series: 500
    max_query_length: 721h
    # CHG-002b 2026-04-27 — L3 stream cap fix.
    # Default Loki cap (5000 streams/tenant) saturates within ~3 L3 cycles
    # because Argo Workflows produces ~30 streams/workflow. Combined with
    # Promtail relabel (drop step+pod high-cardinality labels) and
    # chunk_idle_period=15m flush, this keeps active streams < 20k under L3.
    max_global_streams_per_user: 100000
    max_streams_per_user: 0
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    max_entries_limit_per_query: 10000
    per_stream_rate_limit: 10MB
    per_stream_rate_limit_burst: 20MB
  ingester:
    chunk_idle_period: 15m
    chunk_target_size: 1572864
    max_chunk_age: 1h
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        # Switched to filesystem 2026-06-09 — see storage block above for
        # rationale (cross-cluster MinIO unreachable; build-cluster Loki
        # uses local PV). Production overrides this to "s3" via Pulumi
        # against DO Spaces.
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

# Single binary mode — sufficient for LoopZero's scale (<100 builds/day)
#
# Loki primary Service stays ClusterIP (in-cluster Promtail ingest path).
# Cross-cluster query path uses the SEPARATE `loki-cross-cluster` NodePort
# Service that infra/helmfile/build.helmfile.yaml.gotmpl adds through
# extraObjects where the environment declares crossCluster.lokiNodePort —
# clean SoC: chart-default Service handles same-cluster traffic; the bridge
# exposes the cross-cluster query path. The sponsor's verbatim approval of
# 2026-06-09 (English: "YOU ARE AUTHORIZED TO MAKE FAANG-LEVEL CHANGES"),
# "VOCE É AUTORIZADO A FAZER ALTERAÇÕES FAANG LEVEL",  # english-only: verbatim sponsor approval, kept as evidence
# gated the canonical persistence.
deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  resources:
    # CHG-002b 2026-04-27 — Loki was previously sized for <100 builds/day.
    # Under L3 (100 tenants × 30 streams/workflow × concurrency 30) the
    # default 256Mi/512Mi caused ingester throttling before the stream cap
    # was even reached. New ceiling 2Gi gives headroom for L4 (500 tenants).
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

# Explicitly disable SimpleScalable components (required by chart v6.24+)
# Without this, the chart validation fails: "more than zero replicas for both
# single binary and simple scalable targets"
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Gateway not needed — API queries Loki directly via ClusterIP
gateway:
  enabled: false

# Disable self-monitoring to reduce resource usage in dev
monitoring:
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false

# Disable test pod
test:
  enabled: false

# Chunk cache — in-memory, small footprint for dev
chunksCache:
  enabled: false

resultsCache:
  enabled: false
