# NodePort service for cross-cluster access to Loki from build cluster.
# Promtail on build cluster ships logs to Loki on mgmt cluster.
# The actual endpoint IP is patched by infra/scripts/update-cross-cluster-ips.sh
# into infra/helm/promtail/values.yaml.
apiVersion: v1
kind: Service
metadata:
  name: loki-cross-cluster
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loki
  ports:
    - port: 3100
      targetPort: 3100
      nodePort: 30094
      protocol: TCP
