# Cross-cluster NodePort bridge — exposes Loki on the BUILD cluster so
# loopzero-api on the MGMT cluster can query build pipeline logs.
#
# Architecture (post-2026-06-09 sponsor walkthrough canonicalization):
#   - Loki + Promtail both live on the BUILD cluster `monitoring` namespace.
#     Promtail → Loki same-cluster push uses ClusterIP `loki.monitoring.svc:3100`
#     (see infra/helmfile/environments/dev-public.yaml `loki.pushUrl`).
#   - loopzero-api on MGMT cluster queries Loki via this NodePort Service,
#     reached at `k3d-loopzero-build-serverlb:30094` over the shared `k3d-loopzero`
#     docker network (see infra/tilt/api-deployment.yaml `LOKI_URL`).
#
# Selector matches the upstream grafana/loki chart's pod label, so this
# Service binds to the actual Loki pod regardless of where the chart's own
# Service ends up (chart-default Service stays ClusterIP for clean SoC).
#
# k3d port-mapping 30094:30194 is declared in infra/k3d/build-cluster.yaml —
# host port 30194 forwards to serverlb container port 30094, which round-
# robins to NodePort 30094 on the cluster nodes (this Service).
#
# LIVE-caught 2026-06-09 sponsor walkthrough: previous version of this
# manifest was being applied to the MGMT cluster (where Loki does NOT
# exist) so its selector matched no pods. Build pipeline logs page hung
# empty for every build because Promtail push errored connection-refused
# (helmfile pushUrl pointed at stale legacy IP) AND loopzero-api queries
# resolved to a Service with zero endpoints. Apply this manifest to the
# BUILD cluster (`kubectl --context k3d-loopzero-build apply -f` OR helmfile
# rawManifests extension).
apiVersion: v1
kind: Service
metadata:
  name: loki-cross-cluster
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: cross-cluster-bridge
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http-metrics
      port: 3100
      targetPort: 3100
      nodePort: 30094
      protocol: TCP
