{{- if .Values.eventBus.enabled }}
# T0.2 Cenário B POC — EventBus (JetStream NATS).
# Per ADR-2026-05-27-T0.2-RATIFIED D1: EventSource publishes; Sensor
# subscribes. EventBus buffers during transient outages (per EC-1).
#
# Native JetStream (NATS) chosen over default Stan (deprecated).
# Persistence enabled by default for buffering durability.
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  namespace: argo-events  # CI namespace per ADR D3
  labels:
    app.kubernetes.io/name: argo-events
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    loopzero.io/component: ci
spec:
  jetstream:
    version: latest  # Renovate-pinned upstream chart version controls
    replicas: {{ .Values.eventBus.replicas }}
    {{- if .Values.eventBus.persistence.enabled }}
    persistence:
      storageClassName: {{ .Values.eventBus.persistence.storageClassName | quote }}
      accessMode: ReadWriteOnce
      volumeSize: {{ .Values.eventBus.persistence.size }}
    {{- end }}
    containerTemplate:
      resources:
        {{- toYaml .Values.eventBus.resources | nindent 8 }}
{{- end }}
