# ArgoCD Application template for tenant project deployments.
# This is a reference template showing the structure created by the TenantController's
# ArgoCD provisioner (operators/internal/argocd/provisioner.go).
#
# Placeholders:
#   TENANT_PLACEHOLDER      - tenant identifier (e.g., "acme")
#   PROJECT_PLACEHOLDER     - project identifier (e.g., "web-app")
#   ENVIRONMENT_PLACEHOLDER - environment name (e.g., "production", "staging")
#
# Sync policy is MANUAL: the API triggers sync via the ArgoCD API,
# ArgoCD does not auto-sync on git push.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "TENANT_PLACEHOLDER-PROJECT_PLACEHOLDER-ENVIRONMENT_PLACEHOLDER"
  namespace: argocd
  labels:
    runtime.getloopscale.com/tenant: "TENANT_PLACEHOLDER"
    runtime.getloopscale.com/project: "PROJECT_PLACEHOLDER"
    runtime.getloopscale.com/environment: "ENVIRONMENT_PLACEHOLDER"
    app.kubernetes.io/part-of: loop-runtime
    app.kubernetes.io/managed-by: loop-runtime-operator
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: "TENANT_PLACEHOLDER"
  source:
    repoURL: "http://gitea-http.loop-runtime-system.svc.cluster.local:3000/TENANT_PLACEHOLDER/PROJECT_PLACEHOLDER-gitops.git"
    targetRevision: HEAD
    path: "environments/ENVIRONMENT_PLACEHOLDER"
  destination:
    server: "https://cell-0-cluster-api:6443"
    namespace: "TENANT_PLACEHOLDER-ENVIRONMENT_PLACEHOLDER"
  syncPolicy:
    automated: null
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
    - group: traefik.io
      kind: TraefikService
      jsonPointers:
        - /spec/weighted/services/0/weight
        - /spec/weighted/services/1/weight
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
