global:
  image:
    tag: "v2.13.3"

server:
  containerSecurityContext:
    runAsNonRoot: true
  readinessProbe:
    enabled: true
  livenessProbe:
    enabled: true
  resources:
    limits:
      cpu: "500m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  service:
    type: NodePort
    nodePortHttp: 30082
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
      namespace: monitoring

controller:
  # T-05: 3 replicas with sharding distributes Applications by hash across
  # pods. At L3+ a single controller saturates reconciling 100+ Apps,
  # causing sync latency >15min. Sharding cuts p95 sync below 60s.
  # Plan: 50k-immediate-focus
  replicas: 3
  # fix-all-platform-issues-plan T3.1 BUG-FIX (mgmt-argocd duplicate env var):
  # The upstream argo-cd chart 7.3.11 auto-injects ARGOCD_CONTROLLER_REPLICAS
  # from .Values.controller.replicas at templates/argocd-application-controller/
  # statefulset.yaml:80. Our manual `env: - name: ARGOCD_CONTROLLER_REPLICAS`
  # entry caused a duplicate, breaking ArgoCD's structured-merge-diff calculation
  # — the entire mgmt-argocd app went to status=Unknown with ComparisonError:
  # "duplicate entries for key [name=ARGOCD_CONTROLLER_REPLICAS]".
  # Removed the manual entry; upstream injection is authoritative.
  env:
    # Workqueue rate limiting — prevent CPU amplification from apps in
    # persistent error state (e.g., ComparisonError with empty repos).
    # Default maxdelay is 1s which means 100 broken apps = 100 retries/sec.
    # With 300s maxdelay, exponential backoff caps at 5 min between retries.
    - name: ARGOCD_CONTROLLER_WORKQUEUE_BASEDELAY
      value: "5s"
    - name: ARGOCD_CONTROLLER_WORKQUEUE_MAXDELAY
      value: "300s"
    - name: ARGOCD_CONTROLLER_WORKQUEUE_BACKOFF_FACTOR
      value: "2"
    # F-01 fix (argocd-sync-cleanroom-resilience-plan T1.1, ADR D1):
    # Default repo-server timeout is 60s (60_000_000_000 ns); the auto-set
    # `--repo-server-timeout-seconds` flag in 15s default observed in our
    # chart caused `application refresh deadline exceeded` under cleanroom
    # cold-cache load. Explicitly set to 60s via env var so the application-
    # controller respects the longer deadline when calling repo-server for
    # ManifestGeneration/Refresh. Operator can override per-stack if needed.
    - name: ARGOCD_APPLICATION_CONTROLLER_REPO_SERVER_TIMEOUT_SECONDS
      value: "60"
  containerSecurityContext:
    runAsNonRoot: true
  readinessProbe:
    enabled: true
  livenessProbe:
    enabled: true
  resources:
    limits:
      cpu: "2000m"     # was 500m — bump for controller load
      memory: "2Gi"    # was 512Mi — ArgoCD caches many Apps in memory
    requests:
      cpu: "200m"      # was 100m
      memory: "512Mi"  # was 256Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
      namespace: monitoring

repoServer:
  containerSecurityContext:
    runAsNonRoot: true
  readinessProbe:
    enabled: true
  livenessProbe:
    enabled: true
  resources:
    limits:
      cpu: "1000m"      # was 500m — Sprint A trio-fix 2026-06-02: bump for
                         # concurrent manifest generation under dogfood load
      memory: "1Gi"     # was 512Mi — Sprint A trio-fix: avoid OOM on 10+ concurrent journeys
    requests:
      cpu: "200m"       # was 100m — Sprint A trio-fix: keep room under burst
      memory: "512Mi"   # was 256Mi
  # B17 prevention (iter 18) — repo-server caches Application state for the
  # configured TTL. Stale cache after rapid tenant create/delete cycles
  # caused "(cached)" misroutes in L3 #4. Mitigations:
  #   1. Reduce default cache TTL via env (10m → 1m for fresh-deploy scenarios)
  #   2. Replicas: 3 (was 2) — Sprint A trio-fix 2026-06-02: under dogfood
  #      load (10+ journeys submitting concurrent syncs), 2 replicas saturated
  #      and ArgoCD returned "application refresh deadline exceeded" 30s
  #      timeouts → release CANCELLED → spec FAIL. Bumping to 3 spreads the
  #      manifest-generation load and recovers the convergence chain. LIVE-
  #      observed in Sprint A trio v4b dogfood: 10/132 specs FAILED, all
  #      converging to "no pods with label X" because App stuck Unknown.
  #   3. ConfigMap setting that invalidates manifest cache on revision change
  replicas: 3
  env:
    # Reduce manifest cache duration — default 24h is way too long for L3
    # where tenants are created+destroyed frequently.
    - name: ARGOCD_REPO_SERVER_REPO_CACHE_EXPIRATION
      value: "10m"
    # fix-all-platform-issues-plan T3.1: ARGOCD_REPO_SERVER_DISABLE_TLS
    # removed because the upstream argo-cd chart already injects this env
    # var (template repo-server/deployment.yaml). Manual entry caused
    # duplicate that broke ArgoCD structured-merge-diff for mgmt-argocd
    # (sync stuck at Unknown). Setting via configs.params.server.disable.tls
    # if needed.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
      namespace: monitoring

redis:
  containerSecurityContext:
    runAsNonRoot: true
  readinessProbe:
    enabled: true
  livenessProbe:
    enabled: true
  resources:
    limits:
      cpu: "200m"
      memory: "128Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"

configs:
  rbac:
    # LoopRuntime API service account: sync + get + action (terminate stuck operations).
    # MEET-2026-03-29-019: action/* needed for TerminateOperation on stuck syncs.
    policy.csv: |
      p, loopruntime-api, applications, sync, */*, allow
      p, loopruntime-api, applications, get, */*, allow
      p, loopruntime-api, applications, action/*, */*, allow
  params:
    server.insecure: true
    # Manual sync only — API controls when to sync, not ArgoCD auto-sync
    controller.self.heal.enabled: "false"
    # MEET-2026-03-29-019: Terminate sync operations that run longer than 5 minutes.
    # Prevents stuck Certificate/CRD from blocking all deploys indefinitely.
    # Without this, a single orphaned resource can lock the entire pipeline.
    controller.operation.processing.timeout: "300"
    # V9-CLEANROOM-FRESH-FAANG-FIX 2026-05-31: with controller.replicas=3
    # (T-05), the default `legacy` sharding algorithm exhibits a startup
    # race where multiple shards keep re-assigning clusters during boot
    # and all three controllers end up "Ignoring cluster" for the same
    # cluster — Applications never get reconciled (status.sync.status="").
    # `consistent-hashing` (GA in ArgoCD 2.10) computes a stable shard
    # assignment per cluster and converges on first boot without thrash.
    # Discovered LIVE in cleanroom-fresh dogfood 2026-05-31: 7/7 Apps
    # never processed; all journeys requiring deploy timed out.
    controller.sharding.algorithm: "consistent-hashing"
  repositories:
    # Gitea repository credentials for tenant GitOps repos.
    # ArgoCD uses these to clone tenant repos from the internal Gitea instance.
    gitea-internal:
      url: "http://gitea-http.loopruntime-system.svc.cluster.local:3000"
      type: git
      # Credentials managed via ArgoCD repo-creds secret (provisioned by TenantController)
  cm:
    # Dedicated service account for LoopRuntime API — apiKey only, no login (cannot access UI).
    # Tokens generated with `argocd account generate-token` never expire by default.
    # This replaces the old pattern of using admin session tokens which expire in 24h.
    accounts.loopruntime-api: apiKey
    # Health assessment settings
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

    # F-11 (CHG-2026-04-29-DOGFOOD T5.1) — Lua health checks for the Traefik
    # CRDs. Without them, ArgoCD reports `health: ""` for IngressRoute /
    # Middleware (it does not know the spec), and the aggregated App stays in
    # `Progressing` forever even after a complete sync. Manifests generated
    # by api/internal/manifests/renderer.go ALWAYS include these CRDs in
    # static-frontend deploys, so this check is load-bearing for post-deploy
    # UI consolidation.
    resource.customizations.health.traefik.io_IngressRoute: |
      hs = {}
      -- IngressRoute has no .status field in its spec ("applied-only" resource).
      -- If the object exists and has spec.routes, consider it Healthy.
      if obj.spec ~= nil and obj.spec.routes ~= nil and #obj.spec.routes > 0 then
        hs.status = "Healthy"
        hs.message = "IngressRoute applied with " .. tostring(#obj.spec.routes) .. " route(s)"
      else
        hs.status = "Progressing"
        hs.message = "IngressRoute spec.routes empty or pending"
      end
      return hs

    resource.customizations.health.traefik.io_Middleware: |
      hs = {}
      -- Middleware is stateless (no .status). Existence = Healthy.
      hs.status = "Healthy"
      hs.message = "Middleware applied"
      return hs

    resource.customizations.health.traefik.io_TLSOption: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "TLSOption applied"
      return hs

    # F-11 — cert-manager Certificate health (parse .status.conditions).
    # In standalone-multi without a real LE, the Certificate stays "Progressing/Issuing"
    # — expected behaviour, not a failure. In dev/prod with LE ACME, it becomes
    # "Healthy/Ready=True" after the challenge.
    resource.customizations.health.cert-manager.io_Certificate: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Issuing"
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "Ready" then
            if c.status == "True" then
              hs.status = "Healthy"
              hs.message = c.message or "Certificate ready"
            elseif c.status == "False" then
              -- Distinguishes "still issuing" (Progressing) from "permanent fail"
              -- (Degraded). reason "Failed" or "InvalidConfig" → Degraded.
              if c.reason == "Failed" or c.reason == "InvalidConfig" then
                hs.status = "Degraded"
                hs.message = c.reason .. ": " .. (c.message or "")
              else
                hs.status = "Progressing"
                hs.message = c.message or "Issuing certificate"
              end
            end
          end
        end
      end
      return hs


# ArgoCD Notifications — push-based deploy activation.
# When an Application reaches Synced + Healthy, ArgoCD calls the API
# callback endpoint instead of the API polling ArgoCD every 10 seconds.
# MEET-2026-03-27-012: replaces Phase D synchronous polling.
# NOTE: These keys are TOP-LEVEL in the argo-cd Helm chart, NOT under configs.
notificationsController:
  enabled: true
notifications:
  # Webhook service: calls LoopRuntime API internal endpoint
  # IMPORTANT: argo-cd chart v7.x uses "notifiers" key (not "services")
  notifiers:
    service.webhook.loopruntime-api: |
      # NOTE (infra-arch-012): This URL uses loopruntime-system namespace which is correct for
      # production (where ArgoCD and loopruntime-api share the namespace). In local dev (k3d),
      # ArgoCD lives in the 'argocd' namespace so this cross-namespace DNS name still
      # resolves correctly — K8s DNS handles {svc}.{ns}.svc.cluster.local across namespaces.
      url: http://loopruntime-api.loopruntime-system.svc.cluster.local:8080/internal/argocd-callback
      headers:
      - name: Content-Type
        value: application/json
      # MEET-2026-04-04-029 P0: Must match LOOPRUNTIME_ARGO_CALLBACK_SECRET.
      # Production: overridden by Pulumi with RandomPassword-generated secret.
      # Dev: uses this default. NEVER use this value in production.
      - name: Authorization
        value: "Bearer cb-loopruntime-dev-local-only"
  # Template: sends sync status as JSON payload
  templates:
    template.sync-completed: |
      webhook:
        loopruntime-api:
          method: POST
          body: |
            {"app_name": "{{.app.metadata.name}}", "sync_status": "{{.app.status.sync.status}}", "health_status": "{{.app.status.health.status}}", "revision": "{{.app.status.sync.revision}}"}
  # Trigger: fires when Application is Synced AND Healthy
  triggers:
    trigger.on-sync-healthy: |
      - when: app.status.sync.status == 'Synced' && app.status.health.status == 'Healthy'
        send: [sync-completed]
