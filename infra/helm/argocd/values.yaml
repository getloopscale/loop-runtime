global:
  image:
    tag: "v2.13.3"

server:
  containerSecurityContext:
    runAsNonRoot: true
  readinessProbe:
    enabled: true
  livenessProbe:
    enabled: true
  resources:
    limits:
      cpu: "500m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  service:
    type: NodePort
    nodePortHttp: 30082
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
      namespace: monitoring

controller:
  # T-05: 3 replicas with sharding distributes Applications by hash across
  # pods. At L3+ a single controller saturates reconciling 100+ Apps,
  # causing sync latency >15min. Sharding cuts p95 sync below 60s.
  # Plan: docs/plans/50k-immediate-focus.md
  replicas: 3
  env:
    - name: ARGOCD_CONTROLLER_REPLICAS
      value: "3"
    # Workqueue rate limiting — prevent CPU amplification from apps in
    # persistent error state (e.g., ComparisonError with empty repos).
    # Default maxdelay is 1s which means 100 broken apps = 100 retries/sec.
    # With 300s maxdelay, exponential backoff caps at 5 min between retries.
    - name: ARGOCD_CONTROLLER_WORKQUEUE_BASEDELAY
      value: "5s"
    - name: ARGOCD_CONTROLLER_WORKQUEUE_MAXDELAY
      value: "300s"
    - name: ARGOCD_CONTROLLER_WORKQUEUE_BACKOFF_FACTOR
      value: "2"
  containerSecurityContext:
    runAsNonRoot: true
  readinessProbe:
    enabled: true
  livenessProbe:
    enabled: true
  resources:
    limits:
      cpu: "2000m"     # was 500m — bump for controller load
      memory: "2Gi"    # was 512Mi — ArgoCD caches many Apps in memory
    requests:
      cpu: "200m"      # was 100m
      memory: "512Mi"  # was 256Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
      namespace: monitoring

repoServer:
  containerSecurityContext:
    runAsNonRoot: true
  readinessProbe:
    enabled: true
  livenessProbe:
    enabled: true
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"   # was 256Mi — iter 18: bump for cache headroom (B17 prevention)
    requests:
      cpu: "100m"
      memory: "256Mi"
  # B17 prevention (iter 18) — repo-server caches Application state for the
  # configured TTL. Stale cache after rapid tenant create/delete cycles
  # caused "(cached)" misroutes in L3 #4. Mitigations:
  #   1. Reduce default cache TTL via env (10m → 1m for fresh-deploy scenarios)
  #   2. Replicas: 2 so a forced restart doesn't cause sync downtime
  #   3. ConfigMap setting that invalidates manifest cache on revision change
  replicas: 2
  env:
    # Reduce manifest cache duration — default 24h is way too long for L3
    # where tenants are created+destroyed frequently.
    - name: ARGOCD_REPO_SERVER_REPO_CACHE_EXPIRATION
      value: "10m"
    # Force re-fetch on every sync request — prevents serving stale clones
    # of recently-recreated tenant repos (B11 + B17 interaction).
    - name: ARGOCD_REPO_SERVER_DISABLE_TLS
      value: "false"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
      namespace: monitoring

redis:
  containerSecurityContext:
    runAsNonRoot: true
  readinessProbe:
    enabled: true
  livenessProbe:
    enabled: true
  resources:
    limits:
      cpu: "200m"
      memory: "128Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"

configs:
  rbac:
    # LoopZero API service account: sync + get + action (terminate stuck operations).
    # MEET-2026-03-29-019: action/* needed for TerminateOperation on stuck syncs.
    policy.csv: |
      p, loopzero-api, applications, sync, */*, allow
      p, loopzero-api, applications, get, */*, allow
      p, loopzero-api, applications, action/*, */*, allow
  params:
    server.insecure: true
    # Manual sync only — API controls when to sync, not ArgoCD auto-sync
    controller.self.heal.enabled: "false"
    # MEET-2026-03-29-019: Terminate sync operations that run longer than 5 minutes.
    # Prevents stuck Certificate/CRD from blocking all deploys indefinitely.
    # Without this, a single orphaned resource can lock the entire pipeline.
    controller.operation.processing.timeout: "300"
  repositories:
    # Gitea repository credentials for tenant GitOps repos.
    # ArgoCD uses these to clone tenant repos from the internal Gitea instance.
    gitea-internal:
      url: "http://gitea-http.loopzero-system.svc.cluster.local:3000"
      type: git
      # Credentials managed via ArgoCD repo-creds secret (provisioned by TenantController)
  cm:
    # Dedicated service account for LoopZero API — apiKey only, no login (cannot access UI).
    # Tokens generated with `argocd account generate-token` never expire by default.
    # This replaces the old pattern of using admin session tokens which expire in 24h.
    accounts.loopzero-api: apiKey
    # Health assessment settings
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

    # F-11 (CHG-2026-04-29-DOGFOOD T5.1) — Lua health checks para CRDs
    # Traefik. Sem isso, ArgoCD reporta `health: ""` para IngressRoute /
    # Middleware (não conhece o spec), e o App agregado fica em
    # `Progressing` infinito mesmo após sync completo. Manifests gerados
    # por api/internal/manifests/renderer.go SEMPRE incluem essas CRDs em
    # static-frontend deploys, então este check é load-bearing para UI
    # consolidation pós-deploy.
    resource.customizations.health.traefik.io_IngressRoute: |
      hs = {}
      -- IngressRoute não tem .status field no spec (recurso "applied-only").
      -- Se o objeto existe e tem spec.routes, considera Healthy.
      if obj.spec ~= nil and obj.spec.routes ~= nil and #obj.spec.routes > 0 then
        hs.status = "Healthy"
        hs.message = "IngressRoute applied with " .. tostring(#obj.spec.routes) .. " route(s)"
      else
        hs.status = "Progressing"
        hs.message = "IngressRoute spec.routes empty or pending"
      end
      return hs

    resource.customizations.health.traefik.io_Middleware: |
      hs = {}
      -- Middleware é stateless (sem .status). Existência = Healthy.
      hs.status = "Healthy"
      hs.message = "Middleware applied"
      return hs

    resource.customizations.health.traefik.io_TLSOption: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "TLSOption applied"
      return hs

    # F-11 — cert-manager Certificate health (parse .status.conditions).
    # Em standalone-multi sem real LE, Certificate fica "Progressing/Issuing"
    # — comportamento esperado, não é falha. Em dev/prod com LE ACME, vira
    # "Healthy/Ready=True" após challenge.
    resource.customizations.health.cert-manager.io_Certificate: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Issuing"
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "Ready" then
            if c.status == "True" then
              hs.status = "Healthy"
              hs.message = c.message or "Certificate ready"
            elseif c.status == "False" then
              -- Distingue "ainda issuing" (Progressing) de "permanent fail"
              -- (Degraded). reason "Failed" ou "InvalidConfig" → Degraded.
              if c.reason == "Failed" or c.reason == "InvalidConfig" then
                hs.status = "Degraded"
                hs.message = c.reason .. ": " .. (c.message or "")
              else
                hs.status = "Progressing"
                hs.message = c.message or "Issuing certificate"
              end
            end
          end
        end
      end
      return hs


# ArgoCD Notifications — push-based deploy activation.
# When an Application reaches Synced + Healthy, ArgoCD calls the API
# callback endpoint instead of the API polling ArgoCD every 10 seconds.
# MEET-2026-03-27-012: replaces Phase D synchronous polling.
# NOTE: These keys are TOP-LEVEL in the argo-cd Helm chart, NOT under configs.
notificationsController:
  enabled: true
notifications:
  # Webhook service: calls LoopZero API internal endpoint
  # IMPORTANT: argo-cd chart v7.x uses "notifiers" key (not "services")
  notifiers:
    service.webhook.loopzero-api: |
      # NOTE (infra-arch-012): This URL uses loopzero-system namespace which is correct for
      # production (where ArgoCD and loopzero-api share the namespace). In local dev (k3d),
      # ArgoCD lives in the 'argocd' namespace so this cross-namespace DNS name still
      # resolves correctly — K8s DNS handles {svc}.{ns}.svc.cluster.local across namespaces.
      url: http://loopzero-api.loopzero-system.svc.cluster.local:8080/internal/argocd-callback
      headers:
      - name: Content-Type
        value: application/json
      # MEET-2026-04-04-029 P0: Must match LOOPZERO_ARGO_CALLBACK_SECRET.
      # Production: overridden by Pulumi with RandomPassword-generated secret.
      # Dev: uses this default. NEVER use this value in production.
      - name: Authorization
        value: "Bearer cb-loopzero-dev-local-only"
  # Template: sends sync status as JSON payload
  templates:
    template.sync-completed: |
      webhook:
        loopzero-api:
          method: POST
          body: |
            {"app_name": "{{.app.metadata.name}}", "sync_status": "{{.app.status.sync.status}}", "health_status": "{{.app.status.health.status}}", "revision": "{{.app.status.sync.revision}}"}
  # Trigger: fires when Application is Synced AND Healthy
  triggers:
    trigger.on-sync-healthy: |
      - when: app.status.sync.status == 'Synced' && app.status.health.status == 'Healthy'
        send: [sync-completed]
