global:
  image:
    tag: "v2.13.3"

server:
  containerSecurityContext:
    runAsNonRoot: true
  readinessProbe:
    enabled: true
  livenessProbe:
    enabled: true
  resources:
    limits:
      cpu: "500m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  service:
    type: NodePort
    nodePortHttp: 30082
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
      namespace: monitoring

controller:
  containerSecurityContext:
    runAsNonRoot: true
  readinessProbe:
    enabled: true
  livenessProbe:
    enabled: true
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
      namespace: monitoring

repoServer:
  containerSecurityContext:
    runAsNonRoot: true
  readinessProbe:
    enabled: true
  livenessProbe:
    enabled: true
  resources:
    limits:
      cpu: "500m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
      namespace: monitoring

redis:
  containerSecurityContext:
    runAsNonRoot: true
  readinessProbe:
    enabled: true
  livenessProbe:
    enabled: true
  resources:
    limits:
      cpu: "200m"
      memory: "128Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"

configs:
  rbac:
    # LoopZero API service account: sync + get on all applications (least privilege).
    # The API only needs to trigger syncs and check sync status.
    policy.csv: |
      p, loopzero-api, applications, sync, */*, allow
      p, loopzero-api, applications, get, */*, allow
  params:
    server.insecure: true
    # Manual sync only — API controls when to sync, not ArgoCD auto-sync
    controller.self.heal.enabled: "false"
  repositories:
    # Gitea repository credentials for tenant GitOps repos.
    # ArgoCD uses these to clone tenant repos from the internal Gitea instance.
    gitea-internal:
      url: "http://gitea-http.loopzero-system.svc.cluster.local:3000"
      type: git
      # Credentials managed via ArgoCD repo-creds secret (provisioned by TenantController)
  cm:
    # Dedicated service account for LoopZero API — apiKey only, no login (cannot access UI).
    # Tokens generated with `argocd account generate-token` never expire by default.
    # This replaces the old pattern of using admin session tokens which expire in 24h.
    accounts.loopzero-api: apiKey
    # Health assessment settings
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
