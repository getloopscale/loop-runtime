# KEDA values -- LOCAL DEVELOPMENT (k3d workload cluster) only.
# Production overrides: values.production.yaml

keda:
  # ---------------------------------------------------------------------------
  # Operator (core controller)
  # ---------------------------------------------------------------------------
  operator:
    replicaCount: 1
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

  # ---------------------------------------------------------------------------
  # Metrics Server (serves external metrics to HPA)
  # ---------------------------------------------------------------------------
  metricsServer:
    replicaCount: 1
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

  # ---------------------------------------------------------------------------
  # Admission Webhooks
  # ---------------------------------------------------------------------------
  webhooks:
    enabled: true
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

  # ---------------------------------------------------------------------------
  # Namespace exclusions
  # Prevent KEDA from acting on system namespaces.
  # ---------------------------------------------------------------------------
  namespaceLabels:
    keda.sh/exclude: "true"

  # Additional arguments for the operator to skip system namespaces.
  # KEDA does not natively support namespace exclusion via values, so we rely
  # on ScaledObject placement -- only tenant namespaces will have ScaledObjects.
  # This list documents namespaces where ScaledObjects MUST NOT be created.
  # Enforcement is at the API/operator layer, not KEDA itself.
  #
  # Excluded namespaces (enforced by LoopZero API, not KEDA config):
  #   - kube-system
  #   - kube-public
  #   - argocd
  #   - argo
  #   - traefik
  #   - cert-manager
  #   - monitoring
  #   - loopzero-platform

  # ---------------------------------------------------------------------------
  # Security context (non-root, read-only filesystem)
  # ---------------------------------------------------------------------------
  podSecurityContext:
    operator:
      runAsNonRoot: true
    metricServer:
      runAsNonRoot: true
    webhooks:
      runAsNonRoot: true

  # ---------------------------------------------------------------------------
  # Prometheus metrics
  # ---------------------------------------------------------------------------
  prometheus:
    operator:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: monitoring
    metricServer:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: monitoring
    webhooks:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: monitoring
