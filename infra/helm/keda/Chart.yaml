# KEDA (Kubernetes Event-Driven Autoscaling) for workload cluster.
# Provides ScaledObject/ScaledJob CRDs for autoscaling tenant applications
# based on external metrics (HTTP traffic, queue depth, custom Prometheus queries).

apiVersion: v2
name: loopzero-keda
description: KEDA event-driven autoscaler for LoopZero workload cluster
type: application
version: 0.1.0
appVersion: "2.16.1"

dependencies:
  - name: keda
    version: "2.16.1"
    repository: "https://kedacore.github.io/charts"
