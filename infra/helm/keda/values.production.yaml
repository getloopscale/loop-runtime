#
# KEDA production overrides (DigitalOcean workload cluster), layered on top of
# values.yaml for the dev and prod environments by cell.helmfile.yaml.gotmpl.
# Upstream kedacore/keda 2.16.1 shape — see values.yaml.

# ---------------------------------------------------------------------------
# HA — 2 replicas each (the operator elects a leader; the second replica only
# shortens failover)
# ---------------------------------------------------------------------------
operator:
  replicaCount: 2

metricsServer:
  replicaCount: 2

resources:
  operator:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
  metricServer:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  webhooks:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ---------------------------------------------------------------------------
# PodDisruptionBudgets — keep one replica available during node drains
# ---------------------------------------------------------------------------
podDisruptionBudget:
  operator:
    minAvailable: 1
  metricServer:
    minAvailable: 1
