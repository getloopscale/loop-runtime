{{- if .Values.rag.externalSecretEnabled }}
# T2 CANONICAL 2026-07-16 (DELEGATION-M7-rag-ui.md).
#
# Materializes k8s Secret `loopzero-rag-admin-key` in the loopzero-system namespace
# from OpenBao path `secret/loopzero/cloud` property `rag_platform_admin_key`
# via the existing `loopzero-vault-secrets` ClusterSecretStore (kubernetes-auth,
# SA eso-vault-reader, audience openbao.vault.loopzero.io — see
# infra/helm/loopzero-external-secrets/templates/clustersecretstore-openbao-transit.yaml
# and charts/loopzero-cloud/examples/eso-openbao.yaml canonical example).
#
# Rotation: sponsor mints a new admin key on loopzero-rag (POST /v1/admin/keys
# after resetting admin_bootstrap consumed=false), writes to OpenBao via
# `bao kv patch secret/loopzero/cloud rag_platform_admin_key=<new>`; ESO
# refreshes the k8s Secret within `refreshInterval` (1h). Operator
# `kubectl rollout restart deployment/loopzero-cloud` picks up the new key
# on next boot (envFrom.optional keeps running pods on last-observed
# value until restart — canonical for rare-rotation admin keys). Old
# key revoked separately via loopzero-rag DELETE /v1/admin/keys/{id}.
#
# Gated: only when `rag.externalSecretEnabled: true` (per-env overlay).
# dev-public opts in; standalone-multi + prod default off (standalone
# does not run ESO; prod overlays wire admin key via a different path).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: loopzero-rag-admin-key
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: rag-admin-key
spec:
  refreshInterval: {{ .Values.rag.externalSecretRefreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ .Values.rag.secretStoreName | default "loopzero-vault-secrets" | quote }}
    kind: ClusterSecretStore
  target:
    name: loopzero-rag-admin-key
    creationPolicy: Owner
  data:
    - secretKey: RAG_PLATFORM_ADMIN_KEY
      remoteRef:
        key: {{ .Values.rag.openBaoPath | default "loopzero/cloud" | quote }}
        property: {{ .Values.rag.openBaoProperty | default "rag_platform_admin_key" | quote }}
{{- end }}
