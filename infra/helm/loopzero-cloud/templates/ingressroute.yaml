{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: loopzero-cloud
  labels:
    app: loopzero-cloud
    loopzero.io/component: loopzero-cloud
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`app.{{ .Values.domain }}`)
      kind: Rule
      services:
        - name: loopzero-cloud
          port: {{ .Values.service.port }}
  tls:
    {{- if eq .Values.ingress.certIssuer "CFManaged" }}
    {}
    {{- else }}
    secretName: loopzero-cloud-tls
    {{- end }}
{{- if and .Values.ingress.tls (ne .Values.ingress.certIssuer "CFManaged") }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: loopzero-cloud-tls
spec:
  secretName: loopzero-cloud-tls
  duration: 2160h
  renewBefore: 360h
  commonName: app.{{ .Values.domain }}
  dnsNames:
    - app.{{ .Values.domain }}
  issuerRef:
    name: {{ .Values.ingress.certIssuer | quote }}
    kind: ClusterIssuer
{{- end }}
{{- end }}
