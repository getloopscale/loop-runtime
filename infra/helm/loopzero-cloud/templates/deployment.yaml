apiVersion: apps/v1
kind: Deployment
metadata:
  name: loopzero-cloud
  labels:
    app: loopzero-cloud
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    loopzero.io/component: loopzero-cloud
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: loopzero-cloud
  template:
    metadata:
      labels:
        app: loopzero-cloud
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: loopzero-cloud
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
            # B35/B49 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — Map secret key
            # `uri` to env var `DATABASE_URL` because the cloud binary
            # expects DATABASE_URL but the secret stores it as `uri`.
            {{- if .Values.dbCredentialsSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbCredentialsSecret | quote }}
                  key: uri
                  optional: true
            {{- end }}
            # Ed25519 dual-control PRIVATE key (ADR 2026-05-13). The
            # cloud proxy is the SOLE binary that holds this key. ESO
            # materializes it from the Pulumi ServiceAuthEd25519
            # component into Secret `loopzero-service-auth-ed25519` with
            # secretKey `private`. Phase 1 default: env empty → cloud
            # logs a warn and runs in single-control mode (legacy
            # X-Service-Auth only). Phase 2 requires the key to be
            # set; mismatched/missing key crashes startup per Q5
            # fail-closed.
            - name: LOOPZERO_SERVICE_AUTH_ED25519_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: loopzero-service-auth-ed25519
                  key: private
                  optional: true
          envFrom:
            - configMapRef:
                name: {{ .Values.wiringConfigMap | quote }}
                optional: true
            {{- if .Values.dbCredentialsSecret }}
            - secretRef:
                name: {{ .Values.dbCredentialsSecret | quote }}
                optional: true
            {{- end }}
            # T1.1 of plan 2026-05-29-dashboard-public-integration-canonicalization.
            # Single source of truth for LOOPZERO_SERVICE_AUTH_SECRET (and
            # LOOPZERO_SERVICE_AUTH_SECRET_PREVIOUS during rotation). loopzero-api consumes
            # the same Secret via envFrom — eliminates the inline-literal drift
            # that produced 401 `Invalid service authentication` on /engine/* in
            # the 2026-05-29 LIVE session. optional=true so dev clusters without
            # the presync-generated Secret still boot (cloud reads from env and
            # falls back to dev secret in cloud/internal/config/config.go:124).
            - secretRef:
                name: loopzero-service-auth
                optional: true
            # P4-T4.2 of same plan: Stripe webhook secret via Secret reference.
            # optional=true so dev without `stripe listen` setup still boots.
            # cloud/internal/billing/webhook.go MUST fail-closed when env unset
            # (v1.1 EC-S2 hermetic test asserts this).
            - secretRef:
                name: loopzero-stripe-webhook
                optional: true
            # Plan stripe-l2-wiring-canonical-fix T3.1 (2026-06-24): Stripe API
            # key via separate Secret (ADR D1 — rotation cadence isolation:
            # webhook secret vs API key rotate on different triggers per Stripe
            # runbook). Materialized by seed-stripe-api-keys-canonical.sh.
            # optional=true preserves dev-without-stripe boot path.
            - secretRef:
                name: loopzero-stripe-api-keys
                optional: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              # B50 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — loopzero-cloud binary
              # exposes `/health` (200 OK) and `/` returns 404 by design.
              # Path was incorrectly `/`. Detected on standalone bootstrap.
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
          # T3.3 of deep-review-2026-05-10-remediation-plan: slow boots
          # (Stripe SDK init, loopzero-engine handshake) get up to 60s before
          # liveness takes over.
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            failureThreshold: 30
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loopzero-cloud
  labels:
    app: loopzero-cloud
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector:
    app: loopzero-cloud
