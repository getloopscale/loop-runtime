{{- /*
ADR D1 (decisions/2026-06-11-tilt-yaml-configmap-mount.md) — non-sensitive runtime config.
Tilt-owned Deployment + production chart Deployment BOTH mount this via envFrom.
Sensitive values live in secret-runtime.yaml — never inline here.
Hermetic test infra/tests/helm/tilt-secret-keys-classification_test.sh asserts no SECRET/PASSWORD/TOKEN keys leak here.
*/ -}}
{{- if .Values.runtimeConfig }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-runtime-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: runtime-config
data:
{{- range $key, $value := .Values.runtimeConfig }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
