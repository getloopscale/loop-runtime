{{/*
T8.2 of deep-review-remediation-plan (closes find_infra_004 MEDIUM):
PodDisruptionBudget for loopzero-cloud bootstrap chart, omitted when
replicaCount<2 to avoid blocking node drain (per EC-12).
*/}}
{{- if ge (int .Values.replicaCount) 2 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: loopzero-cloud
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: loopzero-cloud
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: loopzero-cloud
{{- end }}
