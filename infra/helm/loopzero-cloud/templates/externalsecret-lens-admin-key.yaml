{{- if .Values.lens.externalSecretEnabled }}
# 2026-07-20 — mirror of externalsecret-rag-admin-key.yaml for loopzero-lens.
#
# Materializes k8s Secret `loopzero-lens-admin-key` in the loopzero-system namespace
# from OpenBao path `secret/loopzero/cloud` property `lens_platform_admin_key`
# via the existing `loopzero-vault-secrets` ClusterSecretStore (kubernetes-auth,
# SA eso-vault-reader, audience openbao.vault.loopzero.io — see
# infra/helm/loopzero-external-secrets/templates/clustersecretstore-openbao-transit.yaml
# and charts/loopzero-cloud/examples/eso-openbao.yaml canonical example).
#
# Rotation: sponsor mints a new admin key on loopzero-lens (POST /v1/admin/keys
# after resetting admin_bootstrap consumed=false), writes to OpenBao via
# `bao kv patch secret/loopzero/cloud lens_platform_admin_key=<new>`; ESO
# refreshes the k8s Secret within `refreshInterval` (1h). Operator
# `kubectl rollout restart deployment/loopzero-cloud` picks up the new key
# on next boot (envFrom.optional keeps running pods on last-observed
# value until restart — canonical for rare-rotation admin keys). Old
# key revoked separately via loopzero-lens DELETE /v1/admin/keys/{id}.
#
# Gated: only when `lens.externalSecretEnabled: true` (per-env overlay).
# dev-public opts in; standalone-multi + prod default off (standalone
# does not run ESO; prod overlays wire admin key via a different path).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: loopzero-lens-admin-key
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: lens-admin-key
spec:
  refreshInterval: {{ .Values.lens.externalSecretRefreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ .Values.lens.secretStoreName | default "loopzero-vault-secrets" | quote }}
    kind: ClusterSecretStore
  target:
    name: loopzero-lens-admin-key
    creationPolicy: Owner
  data:
    - secretKey: LENS_PLATFORM_ADMIN_KEY
      remoteRef:
        key: {{ .Values.lens.openBaoPath | default "loopzero/cloud" | quote }}
        property: {{ .Values.lens.openBaoProperty | default "lens_platform_admin_key" | quote }}
{{- end }}
