replicaCount: 1

# CANONICAL 2026-06-19 (issue #104 Architecture A; ADR PROPOSED
# `2026-06-19-loopzero-cloud-image-registry-canonical`). loopzero-cloud images
# are published EXCLUSIVELY to GHCR by the AM6 reusable workflow at
# loopzero/.github/workflows/build-publish.yml (registry default is
# `ghcr.io/getloopscale`). The legacy DOCR default never received
# the image — pulls hit ImagePullBackOff. Aligning the chart default to
# where the image actually lives. Tags: `:latest` on release tags;
# `:develop` + `:develop-<sha>` on develop branch pushes (per AM6).
image:
  repository: ghcr.io/getloopscale/loopzero-cloud
  # Issue #232 — deliberately EMPTY, not `latest`. Same reasoning as the
  # loopzero-api chart: the default is only reached when an override was forgotten,
  # so it must fail loudly rather than ship whatever `latest` points at today.
  # CI publishes `:develop` + `:develop-<sha>` and sets the tag explicitly.
  tag: ""
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull

wiringConfigMap: loopzero-platform-topology

# B33/B35 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — loopzero-cloud needs the same
# DATABASE_URL mapping that loopzero-api/controllers received.
dbCredentialsSecret: loopzero-db-credentials

service:
  type: ClusterIP
  # B50 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — loopzero-cloud binary listens on
  # port 13002 (see startup log "addr=:13002"). The chart was configured
  # for 3000 which caused readiness probe connection refused. Same pattern
  # as B40 (loopzero-api). Detected on standalone bootstrap 2026-04-28.
  port: 13002

ingress:
  enabled: true
  tls: true
  certIssuer: CFManaged  # Cloudflare-managed TLS at the edge

domain: dev.loopzero.example

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 128Mi

env:
  # B50: PORT must match service.port. loopzero-cloud binary uses :13002 by default.
  PORT: "13002"
  NODE_ENV: production
  # B49 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — Ory Hydra deploys to the
  # `loopzero-auth` namespace (separated for blast radius). Default values
  # pointed to `loopzero-system` which fails DNS resolution. Detected on
  # standalone bootstrap 2026-04-28.
  HYDRA_ADMIN_URL: "http://ory-hydra-admin.loopzero-auth.svc.cluster.local:4445"
  HYDRA_PUBLIC_URL: "http://ory-hydra-public.loopzero-auth.svc.cluster.local:4444"
  KRATOS_PUBLIC_URL: "http://ory-kratos-public.loopzero-auth.svc.cluster.local:80"
  KRATOS_ADMIN_URL: "http://ory-kratos-admin.loopzero-auth.svc.cluster.local:80"
  # 2026-06-05 (J-09 dogfood): loopzero-cloud proxy /engine/* needs ENGINE_API_URL
  # to reach the loopzero-api Service. Default in cloud/internal/config/config.go:111
  # was "http://loopzero-api.loopzero-system:8080" but the Service exposes :3001 -- led
  # to 502 -> SERVICE_UNAVAILABLE on every /engine/* request after the J-09
  # rollout when the wiring ConfigMap drifted. Pin canonical URL here so it
  # survives clean bootstrap.
  ENGINE_API_URL: "http://loopzero-api.loopzero-system.svc.cluster.local:3001"
  # Plan J-09 T1.1 (2026-06-05) — GitHub App install handshake.
  # Operator overrides these per-env (dev-public, prod). Defaults below
  # are safe-for-local (loopzero-platform slug, host-only cookie, dashboard
  # at localhost). The cloud binary reads them via cloud/internal/config/config.go.
  GITHUB_APP_SLUG: "loopzero-platform"
  APP_PUBLIC_URL: "http://localhost:3000"
  AUTH_COOKIE_DOMAIN: ""

# ============================================================================
# ADR D1 (decisions/2026-06-11-tilt-yaml-configmap-mount.md) — runtime config
# Mounted via envFrom by Tilt-owned Deployment + production chart Deployment.
# Closes 15 of 53 hardcoded literals identified in code-review-output/.
# Override per-env via values-{dev,prod,standalone-multi}.yaml.
# Sensitive values MUST live under runtimeSecrets (see secret-runtime.yaml).
# ============================================================================
runtimeConfig: {}
  # Example dev keys (moved from infra/tilt/cloud-deployment.yaml):
  #   CLOUD_LISTEN_ADDR: ":3002"
  #   KRATOS_PUBLIC_URL: "http://ory-kratos-public.loopzero-auth.svc.cluster.local:80"
  #   HYDRA_PUBLIC_URL: "http://ory-hydra-public.loopzero-auth.svc.cluster.local:4444"
  #   APP_PUBLIC_URL: "https://app-dev.loopzero.example"
  #   (...6 more — see infra/helm/loopzero-cloud/values-dev.yaml)

runtimeSecrets: {}
  # Example dev keys (moved from infra/tilt/cloud-deployment.yaml):
  #   DATABASE_URL: "postgres://loopzero:loopzero-dev-password@..."
  #   LOOPZERO_SERVICE_AUTH_SECRET: "..."
  #   SESSION_TOKEN_SECRET: "..."
  #   STRIPE_API_KEY: "rk_test_..."
  #   STRIPE_WEBHOOK_SECRET: "whsec_..."

# ============================================================================
# T2 CANONICAL 2026-07-16 (DELEGATION-M7-rag-ui.md § T1+T2). loopzero-rag
# platform-admin key wiring for the /v1/dashboard/rag/* BFF surface. Only
# dev-public opts in today (rag.externalSecretEnabled: true in the overlay).
# Standalone-multi + prod default off (see rules for those envs); the chart
# templates for ExternalSecret + envFrom rendering are gated on this flag.
# ============================================================================
rag:
  # Renders infra/helm/loopzero-cloud/templates/externalsecret-rag-admin-key.yaml
  # when true. Requires an ESO controller in the cluster + a ClusterSecretStore
  # named `loopzero-vault-secrets` (dev-public canonical). Off by default so
  # clusters without ESO still boot.
  externalSecretEnabled: false
  # ClusterSecretStore name — dev-public uses `loopzero-vault-secrets`.
  secretStoreName: "loopzero-vault-secrets"
  # OpenBao path (kv-v2 mount `secret/`) — canonical `loopzero/cloud` with
  # property `rag_platform_admin_key` (matches the canonical eso-openbao
  # example at charts/loopzero-cloud/examples/eso-openbao.yaml). Rotation:
  # `bao kv patch secret/loopzero/cloud rag_platform_admin_key=<new-key>`.
  openBaoPath: "loopzero/cloud"
  openBaoProperty: "rag_platform_admin_key"
  # ESO refresh cadence — 1h matches loopzero-cloud-secrets canonical (see
  # charts/loopzero-cloud/examples/eso-openbao.yaml:37).
  externalSecretRefreshInterval: "1h"

# loopzero-lens dashboard admin key wiring — mirror of `rag:` above (2026-07-20).
# Renders infra/helm/loopzero-cloud/templates/externalsecret-lens-admin-key.yaml
# when true. Off by default so clusters without ESO still boot; dev-public opts
# in (lens.externalSecretEnabled: true in the overlay). Materializes Secret
# `loopzero-lens-admin-key` from OpenBao `loopzero/cloud` property `lens_platform_admin_key`.
# Rotation: `bao kv patch secret/loopzero/cloud lens_platform_admin_key=<new-key>`.
lens:
  externalSecretEnabled: false
  secretStoreName: "loopzero-vault-secrets"
  openBaoPath: "loopzero/cloud"
  openBaoProperty: "lens_platform_admin_key"
  externalSecretRefreshInterval: "1h"
