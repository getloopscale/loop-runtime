# Dev overrides for loopzero-cloud


# ============================================================================
# T1.1.b (plan 2026-06-11-code-review-remediation-147-findings v1.2) — runtime
# config + secrets migrated from infra/tilt/cloud-deployment.yaml per ADR D1.
# Mounted into Tilt-owned Deployment via envFrom: [configMapRef, secretRef].
# checksum/config annotation on Pod template triggers rollout on edit.
# ============================================================================
runtimeConfig:
  CLOUD_LISTEN_ADDR: ":13002"
  KRATOS_PUBLIC_URL: "http://ory-kratos-public.loopzero-auth.svc.cluster.local:80"
  KRATOS_ADMIN_URL: "http://ory-kratos-admin.loopzero-auth.svc.cluster.local:80"
  HYDRA_PUBLIC_URL: "http://ory-hydra-public.loopzero-auth.svc.cluster.local:4444"
  HYDRA_ADMIN_URL: "http://ory-hydra-admin.loopzero-auth.svc.cluster.local:4445"
  HYDRA_CLIENT_ID: "loopzero-cli"
  ENGINE_API_URL: "http://loopzero-api.loopzero-system.svc.cluster.local:3001"
  AUTH_COOKIE_DOMAIN: "loopzero.example"
  APP_PUBLIC_URL: "https://app-dev.loopzero.example"
  BILLING_RETURN_URL: "https://app-dev.loopzero.example/billing"

runtimeSecrets:
  DATABASE_URL: "postgres://loopzero:loopzero-dev-password@postgresql.loopzero-system.svc.cluster.local:5432/loopzero?sslmode=disable"
  LOOPZERO_SERVICE_AUTH_SECRET: "cleanroom-service-auth-secret-do-not-use-in-prod"
  SESSION_TOKEN_SECRET: "cleanroom-cloud-session-token-secret-do-not-use-in-prod-32chars"
  STRIPE_API_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
