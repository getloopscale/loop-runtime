# SPDX-License-Identifier: Apache-2.0
# Phase 8 D12 of plan 2026-06-02-loop-runtime-api-vault-integration v1.8.
#
# Wrapper for openbao-snapshot-agent v0.3.0 (upstream openbao org).
# Deploys a CronJob on the loop-runtime-secrets cluster that runs `bao operator raft snapshot
# save` periodically + an S3-compatible upload to DO Spaces.
#
# Pre-reqs (operator-time):
#   1. loop-runtime-secrets cluster up + openbao-init Job completed (Vault role
#      `bao-snapshot` provisioned via openbao-init authRoles extension)
#   2. K8s Secret `openbao-snapshot-s3-creds` in the secrets-system NS containing
#      AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY (DO Spaces creds from
#      ~/.openbao-<env>-resources.env per SCRIPT.5)
#
# Replaces the Phase 8 runbook section "snapshot procedure manual" — the agent
# automates it completely.
apiVersion: v2
name: openbao-snapshot-agent
description: |
  Wrapper for openbao/openbao-snapshot-agent v0.3.0 CronJob.
  Auto-snapshots Vault Raft → DO Spaces (S3-compatible) per schedule.
type: application
version: 0.1.0
appVersion: "0.3.0"
