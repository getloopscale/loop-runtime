{{/* Phase 8 D12 — CronJob wrapping openbao-snapshot-agent v0.3.0. */}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-snapshot
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: openbao-snapshot
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: {{ .Values.schedule | quote }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-snapshot
        spec:
          restartPolicy: Never
          automountServiceAccountToken: true
          serviceAccountName: {{ .Values.serviceAccount.name }}
          containers:
            - name: openbao-snapshot
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: BAO_ADDR
                  value: {{ .Values.vault.addr | quote }}
                - name: BAO_AUTH_PATH
                  value: {{ .Values.vault.authPath | quote }}
                - name: BAO_ROLE
                  value: {{ .Values.vault.role | quote }}
                - name: BAO_CACERT
                  value: /etc/openbao/ca/ca.crt
                - name: S3_HOST
                  value: {{ .Values.s3.host | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.s3.bucket | quote }}
                - name: S3_URI
                  value: {{ .Values.s3.uri | quote }}
                - name: S3_EXPIRE_DAYS
                  value: {{ .Values.s3.expireDays | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.s3.credsSecretName }}
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.s3.credsSecretName }}
                      key: AWS_SECRET_ACCESS_KEY
              volumeMounts:
                - name: vault-ca
                  mountPath: /etc/openbao/ca
                  readOnly: true
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: vault-ca
              secret:
                secretName: {{ .Values.vault.caSecretName }}
                items:
                  - key: {{ .Values.vault.caSecretKey }}
                    path: ca.crt
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: openbao-snapshot
{{- end }}
