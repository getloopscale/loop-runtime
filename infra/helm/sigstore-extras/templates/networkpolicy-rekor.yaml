apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ .Values.sourceNamespace }}-to-rekor
  namespace: {{ .Values.namespaces.rekor }}
  labels:
    app.kubernetes.io/name: rekor
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    runtime.getloopscale.com/purpose: sigstore-ingress-from-{{ .Values.sourceNamespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rekor
  policyTypes:
    - Ingress
  ingress:
    # T3.1 (CR-7): source-namespace ingress NARROWED via podSelector AND
    # so only Argo Workflow-spawned pods reach Rekor.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.sourceNamespace }}
          podSelector:
            matchExpressions:
              - key: {{ .Values.ingress.podLabel.key }}
                operator: {{ .Values.ingress.podLabel.operator }}
      ports:
        - protocol: TCP
          port: {{ .Values.ports.rekorHttp }}
        - protocol: TCP
          port: {{ .Values.ports.metrics }}
    # Internal Fulcio → Rekor traffic stays namespaceSelector-only.
    # All pods in fulcio-system are operator-managed; podSelector
    # narrowing would only add noise without security gain.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.fulcio }}
      ports:
        - protocol: TCP
          port: {{ .Values.ports.rekorHttp }}
