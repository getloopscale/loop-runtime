apiVersion: v2
name: k6-operator
description: Grafana k6 Operator for distributed load testing
version: 0.1.0
appVersion: "0.0.18"
dependencies:
  # 3.10.0 does not exist in the upstream index — measured 2026-08-18: 39 published versions,
  # and the 3.x series runs up to 3.16.0. We stay within the same major on purpose: 4.x jumps
  # the k6-operator app from 0.0.23 to 1.6.0, which is an upgrade decision and not a fix for
  # a broken dependency. (B-015)
  - name: k6-operator
    version: "3.16.0"
    repository: "https://grafana.github.io/helm-charts"
