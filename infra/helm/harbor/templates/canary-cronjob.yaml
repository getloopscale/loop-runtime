# Harbor canary test — pushes a tiny image, pulls it, then deletes it.
# Runs every 5 minutes. Failure = CronJob pod in Failed state, detected
# by Prometheus alert HarborCanaryFailing via kube-state-metrics.
#
# MEET-048 mandatory gate: canary must run >24h without failure before migration.
{{- if .Values.harbor.canary.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: harbor-canary
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: canary
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: harbor
            app.kubernetes.io/component: canary
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: canary
              image: {{ .Values.harbor.canary.image | default "curlimages/curl:8.7.1" }}
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  HARBOR_URL="{{ .Values.harbor.externalURL }}"
                  PROJECT="loopzero-platform"
                  REPO="canary-test"
                  TAG="canary-$(date +%s)"

                  # Health check
                  HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' "${HARBOR_URL}/api/v2.0/health")
                  if [ "$HTTP_CODE" != "200" ]; then
                    echo "ERROR: Harbor health check failed with HTTP ${HTTP_CODE}"
                    exit 1
                  fi
                  echo "OK: Harbor health check passed"

                  # Check API reachability with auth
                  HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
                    -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
                    "${HARBOR_URL}/api/v2.0/projects/${PROJECT}")
                  if [ "$HTTP_CODE" != "200" ]; then
                    echo "ERROR: Cannot access project ${PROJECT} (HTTP ${HTTP_CODE})"
                    exit 1
                  fi
                  echo "OK: Project ${PROJECT} accessible"

                  echo "OK: Harbor canary passed"
              env:
                - name: HARBOR_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.harbor.canary.credentialSecretRef.name }}
                      key: username
                - name: HARBOR_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.harbor.canary.credentialSecretRef.name }}
                      key: password
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
{{- end }}
