# MEET-048 security mandate: Harbor admin API restricted to operator namespace.
#
# Harbor exposes both OCI v2 registry API and admin API on the same port (8080).
# This NetworkPolicy restricts ingress to Harbor core pods:
# - Registry API (/v2/) is allowed from any pod in the cluster (build + workload)
# - Admin API (/api/v2.0/) is restricted via Harbor RBAC (robot accounts have no admin access)
# - NetworkPolicy ensures only loopzero-system namespace can reach Harbor core directly
#
# Build and workload clusters access Harbor via Traefik IngressRoute (external endpoint).
# Only operators in the same cluster (mgmt) access Harbor core via ClusterIP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: harbor-admin-restrict
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app: harbor
      component: core
  policyTypes:
    - Ingress
  ingress:
    # Allow from Traefik ingress controller (external registry API traffic)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8080
          protocol: TCP
    # Allow from loopzero-system namespace (operators, API, admin management)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: loopzero-system
      ports:
        - port: 8080
          protocol: TCP
    # Allow from harbor namespace itself (inter-component communication)
    - from:
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
