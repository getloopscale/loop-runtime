# PodDisruptionBudget for Harbor registry — only active when replicas > 1.
# With a single replica, minAvailable: 1 blocks node drain during cluster upgrades.
{{- if gt (int .Values.harbor.registry.replicas) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: harbor-registry
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: registry
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: harbor
      component: registry
{{- end }}
