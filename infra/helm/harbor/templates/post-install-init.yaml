# Helm post-install/post-upgrade hook: runs harbor-init to configure Harbor
# after deployment (password change, project creation, system config, CI robot).
# Idempotent — safe to run multiple times.
{{- if .Values.harbor.init.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-init
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: init
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor
        app.kubernetes.io/component: init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: harbor-init
          image: {{ .Values.harbor.init.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: HARBOR_URL
              value: {{ .Values.harbor.externalURL | quote }}
            - name: HARBOR_ADMIN_PASSWORD_NEW
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.harbor.init.passwordSecretRef.name }}
                  key: {{ .Values.harbor.init.passwordSecretRef.key }}
            - name: HARBOR_HEALTH_TIMEOUT
              value: "120s"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
{{- end }}
