# Harbor values — MINIMAL deployment for LoopZeroCloud registry.
# Decision: MEET-2026-04-11-048 (Harbor + DO Spaces)
#
# CRITICAL mandates from the meeting:
#   - PG maxOpenConns = 10 (prevents connection pool exhaustion)
#   - Trivy/Notary/Chartmuseum/Portal DISABLED
#   - External PG (LoopZero's managed instance, separate database harbor_db)
#   - S3 storage backend (DO Spaces)
#   - Robot accounts TTL ≤ 24h (managed by TenantController)
#   - Admin API restricted via NetworkPolicy
#
# Environment-specific values (set via --set or Pulumi):
#   harbor.externalURL             — e.g. https://harbor.dev.loopzero.example
#   harbor.database.external.host  — managed PG host
#   harbor.database.external.password — from ESO
#   harbor.core.secretKey          — generated, from ESO
#   harbor.persistence.imageChartStorage.s3.regionendpoint — DO Spaces endpoint
#   harbor.persistence.imageChartStorage.s3.bucket — container-images bucket name
#   harbor.persistence.imageChartStorage.s3.accesskey — from ESO
#   harbor.persistence.imageChartStorage.s3.secretkey — from ESO

harbor:
  # ---------------------------------------------------------------------------
  # Expose — ClusterIP only (Traefik IngressRoute handles TLS externally)
  # ---------------------------------------------------------------------------
  expose:
    type: clusterIP
    clusterIP:
      name: harbor
    tls:
      enabled: false  # Traefik terminates TLS

  externalURL: "https://harbor.dev.loopzero.example"

  # Disable internal nginx — Traefik is the ingress controller
  nginx:
    replicas: 0

  # ---------------------------------------------------------------------------
  # Core — Sprint 8 v3.2 / CHG-002a / T2.2: HA 2 replicas per ADR-0010 #4.
  # Anti-affinity below distributes pods across mgmt nodes.
  # ---------------------------------------------------------------------------
  core:
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8001"
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  component: core
              topologyKey: kubernetes.io/hostname
    secretKey: ""
    xsrfKey: ""
    # Robot account token duration: 24 hours (1440 minutes)
    robotTokenDuration: 1440

  # ---------------------------------------------------------------------------
  # Registry — Sprint 8 v3.2 / CHG-002a / T2.2: HA 2 replicas per ADR-0010 #4.
  # ---------------------------------------------------------------------------
  registry:
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  component: registry
              topologyKey: kubernetes.io/hostname

  # ---------------------------------------------------------------------------
  # Job Service — 1 replica (GC, replication jobs)
  # ---------------------------------------------------------------------------
  jobservice:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    maxJobWorkers: 5

  # ---------------------------------------------------------------------------
  # DISABLED components — MEET-048 mandate
  # ---------------------------------------------------------------------------
  trivy:
    enabled: false

  notary:
    enabled: false

  chartmuseum:
    enabled: false

  portal:
    enabled: false  # Rule 9: CLI is the primary interface

  # ---------------------------------------------------------------------------
  # Database — External PostgreSQL (LoopZero's managed DO instance)
  # ---------------------------------------------------------------------------
  database:
    type: external
    external:
      host: ""
      port: "25060"
      username: "harbor"
      password: ""
      coreDatabase: "harbor_db"
      sslmode: "require"
      # CRITICAL: Connection pool cap at 10 (MEET-048 mandate).
      # Prevents Harbor from exhausting LoopZero's PG connection pool.
      # LoopZero uses pg_advisory_xact_lock with 5s timeout — if Harbor
      # takes too many connections, withEnvironmentLock fails for ALL deploys.
      maxOpenConns: 10
      maxIdleConns: 5

  # ---------------------------------------------------------------------------
  # Redis — Sprint 8 v3.2 / CHG-002a / T2.2 transition note:
  # Per ADR-0016 D-6 the target is external Redis with password via
  # ExternalSecret (NEVER literal in Helm values — Security veto). However,
  # provisioning DO managed Redis is a Pulumi work item that depends on
  # mgmt-redis-ha component which doesn't exist yet. To unblock T2.2 HA core
  # /registry replicas (the deliverable of ADR-0010 #4), Redis stays internal
  # for now with a single instance shared between the 2 core + 2 registry
  # replicas. Internal Redis is NOT a SPOF for Harbor's primary contract
  # (image push/pull) — only sessions + job queue cache cold-restart. ESO+
  # external Redis migration deferred to CHG-002b post-L3-stable.
  redis:
    type: internal
    internal:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi

  # ---------------------------------------------------------------------------
  # Storage — S3 backend on DO Spaces
  # ---------------------------------------------------------------------------
  persistence:
    enabled: true
    resourcePolicy: "keep"
    imageChartStorage:
      disableredirect: false
      type: s3
      s3:
        region: "us-east-1"
        regionendpoint: ""
        bucket: ""
        accesskey: ""
        secretkey: ""
        rootdirectory: "/harbor"
        encrypt: false
        secure: true
        multipartcopymaxconcurrency: 100
        multipartcopythresholdsize: "33554432"

  # ---------------------------------------------------------------------------
  # Garbage Collection — online (non-blocking), daily at 2 AM UTC
  # ---------------------------------------------------------------------------
  gc:
    enabled: true
    schedule: "0 2 * * *"
    deleteUntagged: true

  # ---------------------------------------------------------------------------
  # Metrics — Prometheus scraping via ServiceMonitor
  # ---------------------------------------------------------------------------
  metrics:
    enabled: true
    core:
      path: /metrics
      port: 8001
    registry:
      path: /metrics
      port: 8001
    jobservice:
      path: /metrics
      port: 8001
    serviceMonitor:
      # B23 (CHG-2026-04-28-LAYERED-BOOTSTRAP) — Disabled until we adopt
      # Prometheus Operator (Sprint 9). Current monitoring stack is plain
      # `prometheus-community/prometheus`, which doesn't ship the
      # `monitoring.coreos.com/v1` ServiceMonitor CRD.
      enabled: false
      additionalLabels:
        release: monitoring

  # ---------------------------------------------------------------------------
  # Security context — non-root, drop all capabilities
  # ---------------------------------------------------------------------------
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  # ---------------------------------------------------------------------------
  # Canary CronJob — runs every 5min, checks Harbor health + API access.
  # Failure detected via kube-state-metrics + HarborCanaryFailing alert.
  # MEET-048 mandatory gate: must run >24h without failure before migration.
  # ---------------------------------------------------------------------------
  canary:
    enabled: false
    image: "curlimages/curl:8.7.1"
    credentialSecretRef:
      name: ""

  # ---------------------------------------------------------------------------
  # Post-install init Job — configures Harbor after deployment.
  # Runs harbor-init: password change, loopzero-platform project, system config, CI robot.
  # Set via Pulumi: image reference + password secret.
  # ---------------------------------------------------------------------------
  init:
    enabled: false
    image: ""
    passwordSecretRef:
      name: ""
      key: "harbor-admin-password"

  updateStrategy:
    type: RollingUpdate
