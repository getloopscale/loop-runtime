# Default values for cluster-issuer chart.

# Issuer kind: selfsigned | acme
issuerKind: selfsigned

# ACME-only fields
acme:
  email: ops@getloopscale.com
  server: https://acme-v02.api.letsencrypt.org/directory
  privateKeySecretRef: letsencrypt-prod-account-key

# LoopZero CA issuer name (always created for local dev fallback)
loopzeroCaIssuerName: loopzero-ca-issuer

# Extra self-signed issuers, by name. An environment that cannot complete an ACME
# challenge lists here the issuer name its apps' Certificates ask for, so they are
# issued. Only for issuerKind selfsigned: with acme the chart owns letsencrypt-prod.
selfSignedAliases: []
