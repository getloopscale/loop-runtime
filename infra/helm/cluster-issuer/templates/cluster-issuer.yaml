{{- if eq .Values.issuerKind "selfsigned" }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.loopRuntimeCaIssuerName }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    runtime.getloopscale.com/component: cluster-issuer
spec:
  selfSigned: {}
{{- end }}
{{- if eq .Values.issuerKind "acme" }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    runtime.getloopscale.com/component: cluster-issuer
spec:
  acme:
    server: {{ .Values.acme.server | quote }}
    email: {{ .Values.acme.email | quote }}
    privateKeySecretRef:
      name: {{ .Values.acme.privateKeySecretRef | quote }}
    solvers:
      - http01:
          ingress:
            class: traefik
{{- end }}
{{- range .Values.selfSignedAliases }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ . | quote }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
    runtime.getloopscale.com/component: cluster-issuer
spec:
  selfSigned: {}
{{- end }}
