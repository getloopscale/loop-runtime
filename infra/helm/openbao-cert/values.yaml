# SPDX-License-Identifier: Apache-2.0
# PRODLIKE.3 — Certificate values for OpenBao HTTPS.

# Issuer reference (created by cluster-issuer chart)
issuerRef:
  name: self-signed-issuer
  kind: ClusterIssuer

# Resulting Secret name. Must match what server.extraVolumes[0].name
# expects in secrets.helmfile.yaml.gotmpl.
secretName: openbao-tls

# Certificate validity (90d = pattern LoopRuntime)
duration: 2160h  # 90d
renewBefore: 360h  # 15d before expiration

# DNS SANs — cover every way an in-cluster client might reach OpenBao
# StatefulSet pods are named openbao-0, openbao-1, ...
# Default cluster.local suffix; chart oficial usa Service "openbao".
dnsNames:
  - openbao
  - openbao.secrets-system
  - openbao.secrets-system.svc
  - openbao.secrets-system.svc.cluster.local
  - openbao-0.openbao-internal
  - openbao-0.openbao-internal.secrets-system.svc.cluster.local
  - openbao-1.openbao-internal
  - openbao-1.openbao-internal.secrets-system.svc.cluster.local
  - openbao-2.openbao-internal
  - openbao-2.openbao-internal.secrets-system.svc.cluster.local
  - localhost
  # VK.5 LIVE 2026-06-02: cross-cluster access from loop-runtime-core via
  # kubectl port-forward exposed on host.k3d.internal hostname (k3d
  # injects this as hostAlias for the host machine IP).
  - host.k3d.internal
  - host.docker.internal

# IPs for SAN (cover ClusterIP + pod IP fallback paths)
ipAddresses:
  - "127.0.0.1"
