# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loopruntime-registry-auth
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "roleArn is required" .Values.roleArn | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loopruntime-registry-auth
  namespace: {{ .Release.Namespace }}
rules:
  # kubectl apply reads and patches the one Secret, and creates it the first time; create
  # cannot be scoped to a name.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.secretName | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loopruntime-registry-auth
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loopruntime-registry-auth
subjects:
  - kind: ServiceAccount
    name: loopruntime-registry-auth
    namespace: {{ .Release.Namespace }}
