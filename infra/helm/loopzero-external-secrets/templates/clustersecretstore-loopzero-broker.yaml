{{- /*
  clustersecretstore-loopzero-broker.yaml — Layer 2 ESO sync webhook CSS.

  Built 2026-06-10 J-22 walkthrough per plan
  2026-06-10-j22-openbao-transit-eso-sync v1.2 D3 (ESO webhook → loopzero-api
  broker → OpenBao transit decrypt). Sponsor mandate (English: "You must finish
  implementing it, we need to close our Secrets system"), verbatim:
  "Voce deve terminar de implementar, precisamos fechar nosso sistema de Scrects".  english-only: verbatim sponsor quote, kept as evidence

  Provider model: webhook. ESO POSTs to loopzero-api's broker endpoint with the
  Bearer token shared via the `loopzero-broker-token` Secret. loopzero-api validates
  the bearer (constant-time compare), enforces tenant↔cell binding (EC-07),
  loads the vault:v1: ciphertext from PG, decrypts via OpenBao transit,
  and returns plaintext_b64. ESO base64-decodes it into the materialized
  K8s Secret.

  URL contract — T2.1 + ADR D2 of plan 2026-06-10-j22-layer2-code-review-fixes:
  the 4-segment URL substitutes .remoteRef.key + .remoteRef.property +
  .remoteRef.metadata.project + .remoteRef.metadata.environment so the
  broker scopes the SQL by the canonical composite unique key (closes
  HIGH #15 rawSecretReader scope-drop / cross-env value-mix). The 2-segment
  legacy contract is gone — operator must delete pre-existing ExternalSecret
  CRs that have empty metadata.project/environment (see plan EC-1 absorption).

  Why split into separate fields (key vs property vs metadata) — ESO
  URL-encodes slashes inside a SINGLE value, so a key like "tn-X/SECRET"
  becomes "tn-X%2FSECRET" which chi router rejects as 404 "unsupported path".
  Separate variables keep the slash as a literal path delimiter.

  Helm fail-CLOSED guard — T2.2 + EC-6 absorption: when envName is "prod"
  OR unknown OR empty, refuse to render a non-HTTPS broker.apiURL (plaintext
  bearer = leak vector). Only the explicit "dev-public" allowlist may use
  http://. Closes HIGH #23 broker apiURL plaintext bearer.

  See `feedback_security_first_mandate` for why we picked Bearer-via-
  Secret (medium-strong) over env-var-shared (weak) and noted that prod
  multi-cluster will upgrade to TokenReview when cell ESO ships.
*/}}
{{- if .Values.broker.enabled -}}
{{- /* T2.2 + EC-6 helm fail-CLOSED guard — only "dev-public" envName may use http:// */ -}}
{{- if and (hasPrefix "http://" .Values.broker.apiURL) (ne (.Values.envName | default "") "dev-public") -}}
{{- fail (printf "loopzero-external-secrets: insecure broker.apiURL %q under envName=%q. Plaintext Bearer over http:// is forbidden. Allowed: envName=dev-public OR apiURL https://... (T2.2 of plan 2026-06-10-j22-layer2-code-review-fixes, closes HIGH #23)." .Values.broker.apiURL (.Values.envName | default "<unset>")) -}}
{{- end -}}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.broker.name | default "loopzero-broker" }}
  labels:
    app.kubernetes.io/name: loopzero-broker
    app.kubernetes.io/managed-by: loopzero
spec:
  provider:
    webhook:
      # ESO substitutes 2 variables into the URL path. Runtime URL pattern:
      #   /internal/v1/secret-fetch/<KEY>/<COMPOSITE_PROPERTY>
      # T2.1 + ADR D2 of plan 2026-06-10-j22-layer2-code-review-fixes
      # (revised 2026-06-11 LIVE catch — ESO v1beta1 CRD strict decoder
      # rejects remoteRef.metadata as unknown field). The composite
      # property carries `secretName.projectID.environment` so loopzero-api
      # can scope SQL by composite unique key (closes HIGH #15). EC-08
      # regex forbids `.` in secret names → safe delimiter.
      # Helm evaluates templates BEFORE YAML parsing, so any literal
      # double-curly token in a comment would trigger a nil-pointer error
      # at render time. The actual URL line below escapes the ESO
      # substitutions via the canonical printf double-curly pattern.
      url: "{{ .Values.broker.apiURL }}/internal/v1/secret-fetch/{{ printf "{{ .remoteRef.key }}" }}/{{ printf "{{ .remoteRef.property }}" }}"
      method: POST
      timeout: 10s
      headers:
        Content-Type: "application/json"
        # ESO renders `.auth.token` at request time from the referenced
        # Secret (see `secrets:` block below).
        Authorization: "Bearer {{ printf "{{ .auth.token }}" }}"
        # X-Cell-ID is a constant for single-cluster dev-public. Prod
        # multi-cluster will source this from the ExternalSecret's
        # remoteRef.metadata when ESO supports per-CR header templating.
        X-Cell-ID: "{{ .Values.broker.cellID | default "cell-0" }}"
      body: |
        {}
      # The Secret value referenced by `.auth.token` above. ESO mounts
      # the Secret read at request time (caching per refreshInterval).
      secrets:
        - name: auth
          secretRef:
            name: {{ .Values.broker.authSecretName | default "loopzero-broker-token" }}
            namespace: {{ .Values.broker.authSecretNamespace | default "external-secrets" }}
      result:
        # plaintext_b64 from loopzero-api's response. The webhook provider writes
        # it as is; each ExternalSecret decodes it (remoteRef.decodingStrategy Base64,
        # api/internal/k8s/secretsync).
        jsonPath: "$.plaintext_b64"
  {{- with .Values.broker.refreshIntervalSeconds }}
  refreshInterval: {{ . }}
  {{- end }}
{{- end }}
