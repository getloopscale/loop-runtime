{{/*
Phase 3.2 — render N ExternalSecret CRs from .Values.externalSecrets inventory.

For each entry, produce:
  - 1 ExternalSecret CR (group keys per target Secret name)
  - data.remoteRef points at Vault path:
      secret/data/loopzero/<envName>/<vaultBinary>/<vaultCategory>/<vaultKey>

ESO will:
  1. Login to Vault via ClusterSecretStore (role=eso, SA=eso-vault-reader)
  2. Fetch each vaultKey at refreshInterval
  3. Create/update K8s Secret matching target.name
  4. Pods consume via existing valueFrom.secretKeyRef (zero Deployment change)

Pre-flight Helm fails if envName not set (must be injected via Helmfile env values).
*/}}
{{- if not .Values.envName }}
{{- fail "loopzero-external-secrets: .Values.envName REQUIRED (inject via Helmfile env, e.g. dev/drill/staging/prod/vault-local)" }}
{{- end }}

{{- range $es := .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $es.targetSecret }}
  namespace: {{ $es.targetNamespace | default "loopzero-system" }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/part-of: loopzero-external-secrets
    loopzero.io/binary: {{ $es.vaultBinary }}
    loopzero.io/category: {{ $es.vaultCategory }}
  annotations:
    loopzero.io/vault-path-prefix: "loopzero/{{ $.Values.envName }}/{{ $es.vaultBinary }}/{{ $es.vaultCategory }}"
    loopzero.io/plan: "2026-06-02-loopzero-api-vault-integration v1.8 Phase 3.2"
spec:
  refreshInterval: {{ $es.refreshInterval | default $.Values.defaultRefreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.secretStoreRef.kind }}
    name: {{ $.Values.secretStoreRef.name }}
  target:
    name: {{ $es.targetSecret }}
    # CRITICAL: Orphan (NOT Owner) — Owner sets ownerReference with
    # blockOwnerDeletion=true, causing K8s GC to cascade-delete the Secret
    # quando ExternalSecret CR é deleted (LIVE bug found iter 20 audit
    # 2026-06-03-vault-INT-LIVE-evidence.md). Orphan decouples lifecycle so
    # `helmfile vaultEnabled=false sync` (rollback P3) preserves K8s Secrets
    # with last-known-good values (pods continue serving via envFrom).
    # deletionPolicy: Retain has NO effect when creationPolicy=Owner because
    # K8s cascade runs BEFORE ESO controller reconcile.
    creationPolicy: Orphan
    deletionPolicy: Retain  # Belt-and-suspenders (no-op com Orphan, mas explícito intent)
  data:
  {{- range $d := $es.data }}
    {{/* Phase 3.3 amendment: vaultBinaryOverride permite cross-binary path
         (ex: tenant-operator lê GITEA_TOKEN do path api/secrets/gitea/token
         — D6 shared path; evita duplicar secret no Vault). */}}
    {{- $binary := default $es.vaultBinary $d.vaultBinaryOverride }}
    - secretKey: {{ $d.secretKey }}
      remoteRef:
        key: loopzero/{{ $.Values.envName }}/{{ $binary }}/{{ $es.vaultCategory }}/{{ $d.vaultKey }}
        # KVv2 default field — values.yaml convention: each secret stored as
        # `{ "value": "<actual>" }` em Vault. Path schema documented em
        # docs/runbooks.md.
        property: value
  {{- end }}
{{- end }}
