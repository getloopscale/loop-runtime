# SPDX-License-Identifier: Apache-2.0
# Phase 3.2 inventory — single source of truth para Vault → K8s Secret mapping.
#
# Schema per entry:
#   targetSecret:   string  K8s Secret name (matches existing secretKeyRef in Deployments)
#   targetNamespace: string K8s namespace (default loopzero-system)
#   refreshInterval: string ESO pull interval (default 1h; faster for rotated secrets)
#   vaultBinary:    string  binary owning the secret (api|cloud|operators|build|platform) for D6 path
#                           (build added iter 26 per openbao-adoption T2.3 cosign-passphrase migration;
#                            platform added iter 27 per openbao-adoption T2.5 SPKI pin extractor)
#   vaultCategory:  string  secrets|config (D6 path)
#   data:           []      list of {secretKey, vaultKey} pairs (multiple keys per Secret)
#
# Path constructed: secret/data/loopzero/<env>/<vaultBinary>/<vaultCategory>/<vaultKey>
# where <env> comes from Helmfile environment values (envName).

# Environment name — injected via Helmfile per-env values (D5 + D6).
# Required for all path constructions.
envName: ""

# ClusterSecretStore name (Phase 3.1 — loopzero-vault-secrets).
secretStoreRef:
  kind: ClusterSecretStore
  name: loopzero-vault-secrets

# Default refresh interval (override per-secret for high-rotation cases).
defaultRefreshInterval: 1h

# Inventory canonical of ExternalSecret → Vault mapping.
# Each item creates 1 ExternalSecret CR + 1 K8s Secret. Group keys per
# target Secret name to match existing Deployment secretKeyRef conventions.
externalSecrets:

  # === loopzero-api binary (16 secrets total, grouped per existing K8s Secret name) ===

  - targetSecret: gitea-admin
    targetNamespace: loopzero-system
    vaultBinary: api
    vaultCategory: secrets
    data:
      - secretKey: token
        vaultKey: gitea/token

  - targetSecret: loopzero-api-tokens
    targetNamespace: loopzero-system
    vaultBinary: api
    vaultCategory: secrets
    data:
      # NOTE: loopzero-api Deployment reads argocd-token + cf-api-token via
      # per-key secretKeyRef (kebab-case OK). cf-api-token block added em
      # deployment.yaml iter 10 (Phase 3.3 closure follow-up); previously
      # config.go:417 lia via os.Getenv only.
      - secretKey: argocd-token
        vaultKey: argocd/token
      - secretKey: cf-api-token
        vaultKey: cf/api_token

  # Phase 3.3 finding: loopzero-api Deployment uses envFrom.secretRef pattern
  # for bulk Secret consumption (existing: dbCredentialsSecret +
  # loopzero-service-auth). For the 5 NEW Secrets below (não existentes pre-v1.8),
  # we use UPPER_SNAKE keys matching env var names exatamente — pods consume
  # via NEW envFrom.secretRef block em deployment.yaml (added Phase 3.3 closure).
  - targetSecret: loopzero-api-minio
    targetNamespace: loopzero-system
    vaultBinary: api
    vaultCategory: secrets
    data:
      - secretKey: MINIO_ACCESS_KEY
        vaultKey: minio/access_key
      - secretKey: MINIO_SECRET_KEY
        vaultKey: minio/secret_key

  - targetSecret: loopzero-api-internal
    targetNamespace: loopzero-system
    vaultBinary: api
    vaultCategory: secrets
    refreshInterval: 24h  # rarely rotated; longer interval reduces Vault load
    data:
      - secretKey: LOOPZERO_ARGO_CALLBACK_SECRET
        vaultKey: argo/callback_secret
      - secretKey: LOOPZERO_BOOTSTRAP_SECRET
        vaultKey: bootstrap_secret
      - secretKey: LOOPZERO_SECRET_ENCRYPTION_KEY
        vaultKey: secret_encryption_key

  - targetSecret: loopzero-api-github
    targetNamespace: loopzero-system
    vaultBinary: api
    vaultCategory: secrets
    data:
      - secretKey: GITHUB_APP_PRIVATE_KEY  # RSA PEM
        vaultKey: github/app_private_key
      - secretKey: GITHUB_WEBHOOK_SECRET
        vaultKey: github/webhook_secret

  - targetSecret: loopzero-api-stripe
    targetNamespace: loopzero-system
    vaultBinary: api
    vaultCategory: secrets
    refreshInterval: 6h  # billing — moderate cadence
    data:
      - secretKey: STRIPE_SECRET_KEY
        vaultKey: stripe/secret_key

  - targetSecret: loopzero-service-auth
    targetNamespace: loopzero-system
    vaultBinary: api
    vaultCategory: secrets
    refreshInterval: 5m  # frequently rotated (cross-binary shared per EC-22)
    data:
      - secretKey: secret
        vaultKey: service_auth/secret
      - secretKey: secret-previous
        vaultKey: service_auth/secret_previous

  - targetSecret: loopzero-service-auth-ed25519-pub
    targetNamespace: loopzero-system
    vaultBinary: api
    vaultCategory: secrets
    data:
      - secretKey: current
        vaultKey: service_auth/ed25519_public_current
      - secretKey: previous
        vaultKey: service_auth/ed25519_public_previous

  - targetSecret: loopzero-api-admin
    targetNamespace: loopzero-system
    vaultBinary: api
    vaultCategory: secrets
    refreshInterval: 5m  # admin keys — fast rotation needed
    data:
      - secretKey: LOOPZERO_ADMIN_API_KEY
        vaultKey: admin/api_key
      - secretKey: LOOPZERO_ADMIN_API_KEY_PREVIOUS
        vaultKey: admin/api_key_previous
      - secretKey: LOOPZERO_ADMIN_SERVICE_AUTH_SECRET
        vaultKey: admin/service_auth_secret
      - secretKey: LOOPZERO_ADMIN_SERVICE_AUTH_SECRET_PREVIOUS
        vaultKey: admin/service_auth_secret_previous

  - targetSecret: loopzero-service-auth-redis
    targetNamespace: loopzero-system
    vaultBinary: api
    vaultCategory: secrets
    data:
      - secretKey: password
        vaultKey: nonce_redis/password

  # === loopzero-cloud binary (3 secrets) ===

  # Phase 3.3 ALIGN: loopzero-cloud Deployment already references Secret
  # `loopzero-service-auth-ed25519` (singular, no `-signing` suffix).
  # ESO target name MUST match existing reference — chose to align ESO →
  # existing name (KISS: zero Deployment diff) rather than refactor cloud.
  - targetSecret: loopzero-service-auth-ed25519
    targetNamespace: loopzero-system
    vaultBinary: cloud
    vaultCategory: secrets
    refreshInterval: 24h  # Ed25519 private key — rare rotation
    data:
      - secretKey: private  # matches existing secretKeyRef key naming pattern
        vaultKey: service_auth/ed25519_private_key

  - targetSecret: loopzero-cloud-stripe
    targetNamespace: loopzero-system
    vaultBinary: cloud
    vaultCategory: secrets
    refreshInterval: 6h
    data:
      - secretKey: api-key
        vaultKey: stripe/api_key
      - secretKey: webhook-secret
        vaultKey: stripe/webhook_secret

  # === tenant-operator binary (4 secrets + GITEA_TOKEN shared) ===
  # Phase 3.3 finding: operators use envFrom.secretRef pattern (não
  # per-key secretKeyRef como loopzero-api). Keys MUST be UPPER_SNAKE
  # matching env var names exatamente (kubelet expoe Secret data keys
  # como env var names diretamente via envFrom).
  #
  # ALIGN: target Secret name precisa match
  # `.Values.secrets.existingSecret` (default "loopzero-tenant-operator"
  # per `loopzero-common.fullname` helper). Operator chart já tem Secret
  # template para esses; ESO substitui creation com sync from Vault.

  - targetSecret: loopzero-tenant-operator  # matches charts/loopzero-tenant-operator/templates/secret.yaml
    targetNamespace: loopzero-system
    vaultBinary: operators
    vaultCategory: secrets
    data:
      # ENV VAR NAMES (UPPER_SNAKE) — envFrom maps Secret keys → env vars 1:1
      - secretKey: GITEA_TOKEN  # shared com loopzero-api (D6 path: api/secrets/gitea/token)
        vaultKey: gitea/token
        vaultBinaryOverride: api  # explicit override: usa path api/secrets/gitea/token
      - secretKey: MINIO_ACCESS_KEY
        vaultKey: minio/access_key
        vaultBinaryOverride: api
      - secretKey: MINIO_SECRET_KEY
        vaultKey: minio/secret_key
        vaultBinaryOverride: api
      - secretKey: DIGITALOCEAN_TOKEN
        vaultKey: digitalocean/token
      - secretKey: SPACES_ACCESS_KEY_ID
        vaultKey: spaces/access_key_id
      - secretKey: SPACES_SECRET_ACCESS_KEY
        vaultKey: spaces/secret_access_key
      - secretKey: HARBOR_ADMIN_PASSWORD
        vaultKey: harbor/admin_password

  # === platform binary — Vault SPKI cert pin (T2.5 of openbao-adoption v1.3) ===
  # Written by openbao-init/templates/spki-extractor-cronjob.yaml every 5 min.
  # loopzero-api consumes via env LOOPZERO_VAULT_SPKI_PIN, validates Vault server cert
  # against pinned hash in pkg/vault VerifyPeerCertificate callback.
  # Per EC-09 v1.1: 5m ESO refresh matches CronJob schedule — pin propagates
  # to K8s Secret quickly after cert-manager renewal.
  - targetSecret: vault-spki-pin
    targetNamespace: loopzero-system
    vaultBinary: platform
    vaultCategory: secrets
    refreshInterval: 5m  # matches CronJob schedule per EC-09
    data:
      - secretKey: LOOPZERO_VAULT_SPKI_PIN
        vaultKey: vault-spki-pin/spki_hash

  # === build binary — cosign signing passphrase (T2.3 of openbao-adoption v1.3) ===
  # Migrated from co-located K8s Secret (cosign-signing-key.cosign.password)
  # to Vault path secret/loopzero/<env>/build/secrets/cosign/passphrase. cosign.key
  # keypair stays in K8s Secret (until Fulcio keyless cutover); only the
  # passphrase moves. Defense-in-depth: passphrase + key separately rotatable.
  #
  # NOTE: Build cluster NS = loopzero-build (not loopzero-system). Requires ESO operator
  # install em build cluster (separate helmfile release; tracked iter T2.3.bis).
  # Argo Workflows cosign-sign template reads via secretKeyRef from this Secret.
  - targetSecret: cosign-passphrase
    targetNamespace: loopzero-build
    vaultBinary: build
    vaultCategory: secrets
    refreshInterval: 24h  # cosign key rotation cadence = quarterly drill (rare)
    data:
      - secretKey: cosign.password  # matches generate-build-secrets.sh existing key name
        vaultKey: cosign/passphrase
