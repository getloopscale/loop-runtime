apiVersion: v2
name: static-assets
description: |
  In-cluster S3 gateway used by static-frontend deploys generated by LoopRuntime.
  Renders nginx-s3-gateway as Service `static-assets` in `loopruntime-system`.
  IngressRoutes generated by api/internal/manifests/renderer_static.go target
  this Service for path-prefixed asset serving from S3 / MinIO / DO Spaces.

  In production, Cloudflare Worker intercepts requests at the edge and the
  cluster path is a fallback / canary. In local k3d (standalone-multi) the
  Worker is absent, so this Service is the only delivery path.
type: application
version: 0.1.0
appVersion: "20240218"
