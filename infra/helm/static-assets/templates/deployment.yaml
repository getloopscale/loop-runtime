apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-assets
  labels:
    app: static-assets
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    runtime.getloopscale.com/component: static-delivery
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: static-assets
  template:
    metadata:
      labels:
        app: static-assets
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        # nginx-s3-gateway writes pid + cache + tmp under /var/cache/nginx
        # and /tmp; readOnlyRootFilesystem requires emptyDir for both.
        - name: var-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: var-run
          emptyDir:
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # The image's docker-entrypoint.d scripts (20-envsubst-on-templates.sh)
        # render /etc/nginx/templates/*.template into /etc/nginx/conf.d/. With
        # readOnlyRootFilesystem the rendered config silently fails to land
        # and nginx falls back to the stock default.conf — that swallowed bug
        # produced empty-bucket 404s for hours during E2E.
        - name: nginx-conf-d
          emptyDir:
            sizeLimit: 8Mi
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: S3_BUCKET_NAME
              value: {{ .Values.s3.bucket | quote }}
            - name: S3_SERVER
              value: {{ .Values.s3.server | quote }}
            - name: S3_SERVER_PORT
              value: {{ .Values.s3.port | quote }}
            - name: S3_SERVER_PROTO
              value: {{ .Values.s3.proto | quote }}
            - name: S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: S3_STYLE
              value: {{ .Values.s3.style | quote }}
            - name: AWS_SIGS_VERSION
              value: "4"
            - name: ALLOW_DIRECTORY_LIST
              value: {{ .Values.s3.allowDirectoryList | quote }}
            - name: PROVIDE_INDEX_PAGE
              value: {{ .Values.s3.provideIndexPage | quote }}
            - name: APPEND_SLASH_FOR_POSSIBLE_DIRECTORY
              value: {{ .Values.s3.appendSlashForPossibleDirectory | quote }}
            - name: CORS_ENABLED
              value: {{ .Values.s3.corsEnabled | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret.name | quote }}
                  key: {{ .Values.credentialsSecret.accessKeyIdKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret.name | quote }}
                  key: {{ .Values.credentialsSecret.secretAccessKeyKey | quote }}
          volumeMounts:
            - name: var-cache
              mountPath: /var/cache/nginx
            - name: var-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf-d
              mountPath: /etc/nginx/conf.d
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # nginx-s3-gateway doesn't ship an HTTP health endpoint — probes
          # use TCP. The container exposes port 80 only after nginx finishes
          # its startup (see /docker-entrypoint.sh in the upstream image),
          # so a successful TCP connect implies the gateway is serving.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: static-assets
  labels:
    app: static-assets
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: static-assets
