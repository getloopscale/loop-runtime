# Ponte NodePort — expõe o Kratos público para a borda (Caddy) do host.
#
# POR QUE ISTO EXISTE. Medido no droplet app-dev em 2026-08-10, durante a reconstrução
# total: `auth-dev.loopzero.example` devolvia 502 com Kratos PERFEITAMENTE saudável no cluster.
# O Service do chart é ClusterIP, e a borda o alcançava por um `kubectl port-forward` que
# ninguém supervisionava — sem unidade systemd, sem nada. Destruir os clusters matou o
# processo, e o login ficou fora até alguém reiniciá-lo à mão.
#
# É o mesmo defeito do B-010, que custou ao `/engine/*` uma janela de erro 502 a cada
# reinício do encaminhamento (NRestarts=126499, ~1,8 por minuto). A resposta é a mesma:
# port-forward é ferramenta de depuração, não transporte.
#
# AS TRÊS PONTAS TÊM DE CASAR, e moram em arquivos diferentes:
#   1. este Service, com `nodePort: 30005` FIXO;
#   2. `infra/k3d/core-cluster.yaml`, que publica `14433:30005` no loadbalancer;
#   3. o Caddyfile, que encaminha `auth-dev` para `localhost:14433`.
# Quebrar qualquer uma reproduz o 502. `infra/tests/charts/ory_edge_nodeport_test.go` trava
# as três juntas, porque foi a divergência entre elas que produziu o incidente.
#
# O nodePort é FIXO de propósito: sem fixar, o Kubernetes sorteia uma porta livre a cada
# recriação e o mapeamento do cluster — que é estático — passa a apontar para o vazio.
#
# O Service do chart continua ClusterIP e intocado: esta ponte é aditiva, então nada que já
# alcança o Kratos por dentro do cluster muda de caminho.
apiVersion: v1
kind: Service
metadata:
  name: ory-kratos-public-nodeport
  namespace: loopzero-auth
  labels:
    app.kubernetes.io/name: kratos
    app.kubernetes.io/instance: ory-kratos
    app.kubernetes.io/component: edge-bridge
spec:
  type: NodePort
  # Seletor copiado do Service do chart. Se ele mudar e este não, o Service passa a existir
  # com ZERO endpoints — que responde igualzinho a não existir, e é bem mais difícil de ver.
  selector:
    app.kubernetes.io/name: kratos
    app.kubernetes.io/instance: ory-kratos
  ports:
    - name: http
      port: 80
      targetPort: http-public
      nodePort: 30005
      protocol: TCP
