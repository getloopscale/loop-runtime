# NodePort bridge — exposes the public Kratos to the host's edge (Caddy).
#
# WHY THIS EXISTS. Measured on the app-dev droplet on 2026-08-10, during the full
# rebuild: `auth-dev.loopzero.example` returned 502 with Kratos PERFECTLY healthy in the cluster.
# The chart's Service is ClusterIP, and the edge reached it through a `kubectl port-forward` that
# nobody supervised — no systemd unit, nothing. Destroying the clusters killed the
# process, and login stayed down until someone restarted it by hand.
#
# It is the same defect as B-010, which cost `/engine/*` a 502 error window on every
# restart of the forwarding (NRestarts=126499, ~1.8 per minute). The answer is the same:
# port-forward is a debugging tool, not a transport.
#
# THE THREE ENDS MUST MATCH, and they live in different files:
#   1. this Service, with a FIXED `nodePort: 30005`;
#   2. `infra/k3d/core-cluster.yaml`, which publishes `14433:30005` on the loadbalancer;
#   3. the Caddyfile, which forwards `auth-dev` to `localhost:14433`.
# Breaking any of them reproduces the 502. `infra/tests/charts/ory_edge_nodeport_test.go` locks
# the three together, because it was the divergence between them that produced the incident.
#
# The nodePort is FIXED on purpose: without pinning it, Kubernetes picks a free port on every
# recreation and the cluster mapping — which is static — ends up pointing at nothing.
#
# The chart's Service stays ClusterIP and untouched: this bridge is additive, so nothing that
# already reaches Kratos from inside the cluster changes path.
apiVersion: v1
kind: Service
metadata:
  name: ory-kratos-public-nodeport
  namespace: loopzero-auth
  labels:
    app.kubernetes.io/name: kratos
    app.kubernetes.io/instance: ory-kratos
    app.kubernetes.io/component: edge-bridge
spec:
  type: NodePort
  # Selector copied from the chart's Service. If that one changes and this one does not, the
  # Service goes on existing with ZERO endpoints — which answers exactly like not existing, and
  # is much harder to see.
  selector:
    app.kubernetes.io/name: kratos
    app.kubernetes.io/instance: ory-kratos
  ports:
    - name: http
      port: 80
      targetPort: http-public
      nodePort: 30005
      protocol: TCP
