# Ory Kratos — Identity Management for LoopZero Cloud
# Chart: ory/kratos v0.59.0 (app: Kratos v1.3.1)
#
# LOCAL DEV ONLY — production overrides via Pulumi secrets.
# DSN is overridden by Pulumi in DigitalOcean environments.

kratos:
  automigration:
    enabled: true
    type: initContainer

  config:
    # DSN — overridden by Pulumi in production (managed PostgreSQL)
    dsn: "postgres://loopzero:loopzero-dev-password@postgresql.loopzero-system.svc.cluster.local:5432/kratos?sslmode=disable"

    # --- Identity ---
    identity:
      default_schema_id: default
      schemas:
        - id: default
          url: file:///etc/config/identity.default.schema.json

    # --- Self-Service Flows ---
    selfservice:
      default_browser_return_url: "http://localhost:4455/"

      methods:
        password:
          enabled: true
          config:
            min_password_length: 8
            identifier_similarity_check_enabled: true

        oidc:
          enabled: true
          config:
            providers: []
            # GitHub and Google providers configured via Pulumi secrets in production.
            # Local dev: add providers manually or test with password only.

      flows:
        registration:
          enabled: true
          ui_url: "http://localhost:4455/registration"
          after:
            password:
              hooks:
                - hook: session

        login:
          ui_url: "http://localhost:4455/login"

        verification:
          enabled: true
          ui_url: "http://localhost:4455/verification"

        recovery:
          enabled: true
          ui_url: "http://localhost:4455/recovery"

        settings:
          ui_url: "http://localhost:4455/settings"

        error:
          ui_url: "http://localhost:4455/error"

        logout:
          after:
            default_browser_return_url: "http://localhost:4455/login"

    # --- Courier (Email) ---
    courier:
      smtp:
        # LOCAL DEV: emails logged to stdout (no real SMTP).
        # Production: overridden by Pulumi with real SMTP (e.g., Resend).
        connection_uri: "smtp://localhost:1025/?disable_starttls=true"
        from_address: "noreply@loopzero.example"
        from_name: "LoopZero"

    # --- Session ---
    session:
      lifespan: "24h"
      cookie:
        same_site: "Lax"

    # --- Logging ---
    log:
      level: info
      format: json
      leak_sensitive_values: false

    # --- Security ---
    secrets:
      # LOCAL DEV ONLY — production overrides via Pulumi.
      cookie:
        - "loopzero-dev-cookie-secret-32chars!!"
      cipher:
        - "loopzero-dev-cipher-secret-32chars!!"

    # --- Hashers ---
    hashers:
      argon2:
        parallelism: 1
        memory: "128MB"
        iterations: 2
        salt_length: 16
        key_length: 16

  # --- Identity Schema (mounted as file inside /etc/config/) ---
  identitySchemas:
    "identity.default.schema.json": |
      {
        "$id": "https://schemas.loopzero.example/identity.schema.json",
        "$schema": "http://json-schema.org/draft-07/schema#",
        "title": "LoopZero Identity",
        "type": "object",
        "properties": {
          "traits": {
            "type": "object",
            "properties": {
              "email": {
                "type": "string",
                "format": "email",
                "title": "Email",
                "ory.sh/kratos": {
                  "credentials": {
                    "password": { "identifier": true }
                  },
                  "recovery": { "via": "email" },
                  "verification": { "via": "email" }
                }
              },
              "name": {
                "type": "string",
                "title": "Name"
              }
            },
            "required": ["email"],
            "additionalProperties": false
          }
        }
      }

# --- Service ---
service:
  public:
    enabled: true
    type: ClusterIP
    port: 80
  admin:
    enabled: true
    type: ClusterIP
    port: 80

# --- Resources ---
resources:
  requests:
    cpu: "50m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "256Mi"

# --- Security Context ---
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
