# Kyverno — Policy engine for image verification (MEET-2026-03-30-022 item 4.2).
#
# Installed ONLY on the workload cluster for verifyImages policies.
# Phase 2 policies (registry, latest, limits) use native ValidatingAdmissionPolicy.
# Kyverno is here specifically for cosign signature verification (no native K8s equivalent).
#
# Scope: workload cluster only. NOT installed on mgmt or build clusters.

admissionController:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

backgroundController:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

webhookConfiguration:
  failurePolicy: Ignore  # Permanent Ignore — Kyverno is safety net, not primary enforcement (MEET-021)
  timeoutSeconds: 5

# Cleanup controller not needed for our use case.
cleanupController:
  enabled: false
