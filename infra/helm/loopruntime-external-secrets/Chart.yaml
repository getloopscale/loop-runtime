# SPDX-License-Identifier: Apache-2.0
# Phase 3.2 of plan 2026-06-02-loopruntime-api-vault-integration v1.8 — D11 ESO.
#
# Renders N ExternalSecret CRs from a single canonical inventory in values.yaml.
# Each entry produces an ExternalSecret that pulls from Vault path
# secret/data/loopruntime/<env>/<binary>/<category>/<key> (D6 path convention) and
# creates/updates a K8s Secret with target.name matching what existing Helm
# Deployments (loopruntime-api, loopruntime-cloud, tenant-operator) consume via secretKeyRef.
#
# DRY rationale: 26 secrets × 5 envs = 130 manifests would be unmaintainable
# if hand-written. Single inventory + Helm range generates all.
apiVersion: v2
name: loopruntime-external-secrets
description: |
  ExternalSecret CRs rendering ALL LoopRuntime secrets from Vault via ESO.
  Canonical inventory in values.yaml. Per-env overrides allowed (refresh
  interval, target Secret name).
type: application
version: 0.1.0
appVersion: "1.0.0"
