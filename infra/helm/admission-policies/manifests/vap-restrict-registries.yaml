# ValidatingAdmissionPolicy: Restrict image registries for tenant workloads.
# Only images from the LoopZero container registry are allowed.
# Covers: containers, initContainers, ephemeralContainers (F2-C1).
# MEET-2026-03-30-021 Phase 2.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: loopzero-restrict-image-registries
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        loopzero.io/managed-by: environment-controller
  validations:
    - expression: >-
        object.spec.containers.all(c,
          c.image.startsWith('registry.digitalocean.com/loopzero-infra-registry/'))
      message: "All containers must use images from registry.digitalocean.com/loopzero-infra-registry/"
    - expression: >-
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(c,
          c.image.startsWith('registry.digitalocean.com/loopzero-infra-registry/'))
      message: "All init containers must use images from registry.digitalocean.com/loopzero-infra-registry/"
    - expression: >-
        !has(object.spec.ephemeralContainers) ||
        object.spec.ephemeralContainers.all(c,
          c.image.startsWith('registry.digitalocean.com/loopzero-infra-registry/'))
      message: "All ephemeral containers must use images from registry.digitalocean.com/loopzero-infra-registry/"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: loopzero-restrict-image-registries-binding
spec:
  policyName: loopzero-restrict-image-registries
  validationActions:
    - Audit
  matchResources:
    namespaceSelector:
      matchLabels:
        loopzero.io/managed-by: environment-controller
