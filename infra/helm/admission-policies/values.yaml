# Default values for the admission-policies chart.
# Override per environment via environments/dev.yaml, prod.yaml in helmfile.

# Domain used to derive the Harbor registry hostname.
domain: dev.loopzero.example

# Approved registry prefixes used by ClusterImagePolicy and the
# restrict-registries VAP.
registries:
  docrPrefix: "registry.digitalocean.com/loopzero-system/"
  harborPrefix: "harbor.dev.loopzero.example/loopzero-platform/"
  # CHG-2026-04-29-DOGFOOD iter 9 — opt-in list of additional registry
  # prefixes accepted by the registry-restriction VAP. Default: empty
  # (production only allows DOCR + Harbor). Standalone-multi overlay
  # sets this to ["k3d-loopzero-registry:5000/<tenant>/"] so locally-built
  # images pass admission while keeping production semantics intact.
  additionalPrefixes: []

# ClusterImagePolicy — sigstore policy-controller resource (B16).
# WARNING: policy-controller deny-by-default rejects ALL pods if no
# ClusterImagePolicy matches. This chart MUST be installed before any
# tenant workload starts.
clusterImagePolicy:
  enabled: true
  name: loopzero-images-warn
  # T0.5 of deep-review-2026-05-10-remediation-plan (find_infra_008 CRITICAL).
  # ADR-0050 (2026-05-10): flip default warn → enforce. Production
  # (prod.yaml) retains `policyMode: warn` until Sprint 9 readiness
  # review delivers cosign keyless + 7-day dual-signing window.
  #
  # Mode flip is gated by the `clusterimagepolicy-mode` quality gate, which
  # requires an ADR signing the deny-flip. That ADR is
  # .claude/knowledge-base/decisions/2026-08-12-clusterimagepolicy-deny-flip.md
  # (B-045). The two references that stood here before — `ADR-0050` and
  # `infra/scripts/check_clusterimagepolicy_mode.sh` — did not exist; measured
  # 2026-08-12, same class as the phantom ADR-0024 of B-052.
  #
  # warn    — log audit, admit
  # enforce — reject unsigned images (current default — local + dev)
  mode: enforce
  # static action when no signature can be verified yet
  staticAction: pass
  imageGlobs:
    - "registry.digitalocean.com/loopzero-system/**"
    - "harbor.dev.loopzero.example/loopzero-platform/**"

# INF-G16 + MEET-2026-05-03-063 (MEET-B Track-1).
# loopzero-images-keyless: ClusterImagePolicy with Fulcio keyless authority.
# Coexists with loopzero-images-warn during transition (≥ 7 days dual-signing).
# After T4.4 cutover, loopzero-images-warn is REMOVED and this becomes sole policy.
# Identity regex narrow: only signatures from this repo's GHA OIDC token are accepted.
clusterImagePolicyKeyless:
  enabled: false   # flip to true to install side-by-side warn-mode (T4.3)
  name: loopzero-images-keyless
  mode: warn       # warn during transition; flip to enforce at cutover
  imageGlobs:
    - "registry.digitalocean.com/loopzero-system/**"
    - "harbor.dev.loopzero.example/loopzero-platform/**"
  fulcioURL: https://fulcio.sigstore.dev
  rekorURL: https://rekor.sigstore.dev
  # v1.1 EC-NEW-4 fix — oidcIssuer MUST be set explicitly post-Sigstore
  # activation. Use BUILD cluster's external OIDC URL (NOT intra-cluster
  # which breaks cross-cluster verification). Extract via:
  #   kubectl --context=loopzero-build get --raw /.well-known/openid-configuration | jq -r .issuer
  # Empty default + chart fail-fast prevents accidental render with stale
  # GitHub Actions issuer (now-removed).
  oidcIssuer: ""
  # v1.1 EC-NEW-11 SHOULD TEST: regex anchored ^...$ scopes strictly to
  # loopzero-build-sa ServiceAccount. Prevents prefix-match attacks
  # (e.g., system:serviceaccount:argo:loopzero-build-sa-malicious would
  # match unanchored regex).
  identityRegexp: "^system:serviceaccount:argo:loopzero-build-sa$"

# Toggle individual VAPs (enabled by default).
vaps:
  # D4 / plan d4-vap-delete-guardrail — protect boundary resources (Application,
  # AppProject, Tenant, Environment, ClusterCredential) AND their CRDs from unauthorized
  # DELETE. The cascade finalizer means deleting one of these deletes what it manages;
  # under BYOC that reaches a customer account.
  #
  # Default OFF, same reasoning as tenantNamespace above: enabling a DELETE policy with an
  # incomplete exemption map deadlocks namespace teardown (B33). Enable via the mgmt
  # overlay AFTER the Warn observation window.
  protectPlatformDeletes: false
  # Warn | Deny. Stays Warn until T2.3 proves no legitimate identity is caught.
  protectPlatformDeletesAction: Warn
  disallowLatestTag: true
  restrictRegistries: true
  requireResourceLimits: true
  protectPlatformNetworkpolicies: true
  argocdManagedBy: true
  requireImageSignature: true
  # M14 gap #2 — validate loopzero.io Tenant CR shape at the API-server boundary
  # (CEL VAP, plan ADR D1). Closes the M2 legacy-namespace incident class where
  # a direct kubectl apply created a CR the REST layer would have rejected.
  # Default ON: shape + immutability invariants are always desirable, unlike the
  # migration-gated tenantNamespace/noRuntimeImageMutations toggles below.
  tenantCrShape: true
  # ADR-0018 v2 / T3.2 — Tenant + Environment CRs MUST live in `loopzero-system`.
  # Default OFF: toggle on via overlay AFTER T3.3 migration ran successfully
  # (mandatory deployment order C4 in MEET-ADR-0018 rollout runbook).
  # Enabling before clearing misplaced CRs causes self-inflicted DoS —
  # status subresource updates rejected → operator stops reconciling.
  tenantNamespace: false
  # CHG-2026-04-30-INFRA-PARITY / T1.2 / ADR D3 — block kubectl set image
  # on LoopZero-managed Deployments. Default OFF: dev workflow needs to adapt
  # to "rebuild → push :latest → kubectl rollout restart" before enable.
  # Enable via overlay (prod first, dev last after Phase 1 stable).
  noRuntimeImageMutations: false
  # When `noRuntimeImageMutations` is on, what action to enforce.
  # Warn  — admit + log (Sprint 8 default)
  # Deny  — reject the UPDATE (production)
  noRuntimeImageMutationsAction: Warn
  # Failure policy. Ignore is the safest default — VAP outage doesn't break
  # rollouts. Switch to Fail once policy is stable in production.
  noRuntimeImageMutationsFailurePolicy: Ignore
  # T2.3 of maturity-3-62-to-4-0-roadmap: require image@sha256:<digest> for
  # platform pods (loopzero-system, loopzero-system-build, argocd namespaces).
  # Default ON in warn-mode (validationActions=[Warn, Audit]); sponsor flips
  # requireImageDigestEnforce=true post-7d-soak to switch to Deny+Audit.
  # Why warn first: legacy charts may still emit :tag refs until rollout
  # propagates everywhere — warn surfaces the violation without blocking.
  requireImageDigest: true
  requireImageDigestEnforce: false

# Toggle the policy-controller PrometheusRule (alerts).
alerts:
  enabled: true
  namespace: monitoring
  prometheusReleaseLabel: monitoring
  # T1.2 + T1.1 of plan 2026-05-27-tenant-build-pipeline-gaps-closure:
  # 4 Sigstore-specific alerts + 2 PV storage alerts gated by this flag.
  # Default OFF — operator flips post-Sigstore activation to avoid alert
  # noise when stack not yet deployed.
  sigstoreEnabled: false

# T1.2.b of plan 2026-05-27-tenant-build-pipeline-gaps-closure:
# TUF ceremony date for tuf_root_expiry_timestamp emitter CronJob.
# Operator sets post-ceremony via helmfile override:
#   helmfile -e prod sync --set tufRootCeremonyDate=2026-06-15T10:00:00Z
# Default empty disables the CronJob (better than emitting garbage).
tufRootCeremonyDate: ""
