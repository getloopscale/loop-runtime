apiVersion: v2
name: admission-policies
description: |
  LoopZero platform admission policies — ValidatingAdmissionPolicies (VAP) for tenant
  workload guardrails plus the ClusterImagePolicy required by sigstore policy-controller (B16).

  Includes:
    - VAPs: disallow-latest-tag, restrict-registries, require-resource-limits,
      protect-platform-networkpolicies, argocd-managed-by, require-image-signature
    - ClusterImagePolicy loopzero-images-warn (mode: warn, static.action: pass)
    - PrometheusRule loopzero-policy-controller-alerts (SLO/latency/availability)

  Reference: T0.1 of docs/plans/infra-layered-bootstrap-plan.md.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - admission-policies
  - sigstore
  - policy-controller
  - loopzero
maintainers:
  - name: loopzero-platform
    url: https://github.com/loopzero/loopzero
