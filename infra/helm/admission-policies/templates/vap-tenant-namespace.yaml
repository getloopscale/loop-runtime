{{- if .Values.vaps.tenantNamespace }}
# ValidatingAdmissionPolicy: Tenant + Environment CRs canonical namespace.
#
# ADR-0018 v2 / T3.2 (MEET-ADR-0018 condition C6).
#
# Native VAP (K8s 1.30+, mgmt cluster pin is 1.32). Rejects any CREATE or
# UPDATE of `loopzero.io/v1` Tenant or Environment resources outside namespace
# `loopzero-system`. Defense-in-depth complement to T3.1 (operator/API code
# const) — closes the user-side write surface (kubectl apply by admins,
# server-side apply, future operator drift).
#
# Critical condition C6: status subresource updates MUST pass through.
# Tenant-controller writes Tenant/Environment .status every reconcile
# cycle. If VAP intercepts status writes, the operator stops reconciling
# (self-inflicted DoS — see production-design-reviewer Failure Mode #3).
# We exclude status by checking `request.subResource` in the CEL
# expression — empty string means main resource (CREATE/UPDATE of spec).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: loopzero-tenant-namespace-policy
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["loopzero.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["tenants", "environments"]
  matchConditions:
    # C6 — status subresource bypass. `request.subResource` is empty
    # string for main resource updates and "status"/"scale"/etc for
    # subresource updates. We only validate the main resource — status
    # writes by the controller pass through unchanged.
    - name: skip-status-subresource
      expression: 'request.subResource == ""'
  validations:
    - expression: 'object.metadata.namespace == "loopzero-system"'
      messageExpression: '"LoopZero platform CRDs (Tenant, Environment) must be created in the platform namespace, not " + object.metadata.namespace + ". This is a protected namespace boundary; contact your platform admin."'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: loopzero-tenant-namespace-policy-binding
spec:
  policyName: loopzero-tenant-namespace-policy
  validationActions:
    - Deny
  # No namespaceSelector — policy applies cluster-wide. The CEL expression
  # itself enforces the canonical namespace; we want the policy fired for
  # ANY admission of these CRDs anywhere.
{{- end }}
