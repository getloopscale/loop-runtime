{{- if .Values.vaps.tenantCrShape }}
# M14 gap #2 — validate the shape + immutability of loopzero.io Tenant CRs at the
# Kubernetes API-server boundary (plan ADR D1, blueprint Q8).
#
# loopzero has zero admission webhooks on its own CRDs today (blueprint Q8 confirmed
# `grep SetupWebhookWithManager operators/` is empty), so a hand-authored
# `kubectl apply` of a malformed Tenant bypasses the REST-layer validation —
# the exact class of the M2 legacy-namespace incident. This CEL VAP restores a
# fail-closed boundary WITHOUT a webhook server or cert (which the loopzero VAP
# fleet already avoids; see vap-argocd-managed-by.yaml).
#
# EC-1: every field access is has()-guarded so a CR missing `spec.environments`
# is DENIED cleanly with a product message, not aborted with an opaque CEL
# runtime error under failurePolicy: Fail.
#
# EC/B33: system controllers are excluded via matchConditions so the policy
# never deadlocks namespace deletion or controller-manager operations.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: loopzero-tenant-cr-shape
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["loopzero.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["tenants"]
  matchConditions:
    # Anti-B33: never gate the platform's own controllers / kube system actors.
    - name: exclude-system-actors
      expression: >
        !(request.userInfo.username.startsWith('system:serviceaccount:kube-system:')) &&
        request.userInfo.username != 'system:kube-controller-manager' &&
        !('system:masters' in request.userInfo.groups)
  validations:
    # EC-1: has()-guard before iterating so a missing field denies cleanly.
    - expression: >
        has(object.spec) && has(object.spec.environments) &&
        object.spec.environments.all(e,
          has(e.name) && e.name.matches('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'))
      message: >
        Each environment name must be a valid DNS label (lowercase letters,
        digits, hyphens; must start and end alphanumeric). Set 'spec.environments'
        with valid names, then re-apply.
      reason: Invalid
    # Immutability: cellID pins a tenant's placement and must never change on
    # UPDATE (moving a tenant is an operator-only 'loopzero admin tenants pin').
    - expression: >
        request.operation != 'UPDATE' ||
        !has(oldObject.spec.cellID) ||
        (has(object.spec.cellID) && object.spec.cellID == oldObject.spec.cellID)
      message: >
        A team's placement cannot be changed by editing the resource directly.
        Use 'loopzero admin tenants pin' to move a team.
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: loopzero-tenant-cr-shape
spec:
  policyName: loopzero-tenant-cr-shape
  validationActions:
    - Deny
{{- end }}
