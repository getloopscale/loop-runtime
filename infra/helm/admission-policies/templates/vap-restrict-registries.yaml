{{- if .Values.vaps.restrictRegistries }}
# ValidatingAdmissionPolicy: Restrict image registries for tenant workloads.
# Only images from approved LoopZero container registries are allowed.
# Covers: containers, initContainers, ephemeralContainers (F2-C1).
# MEET-2026-03-30-021 Phase 2.
#
# MEET-2026-04-11-048: Harbor registry migration (dual-registry transition).
# During migration, BOTH DOCR and Harbor prefixes are allowed.
# TODO(MEET-048): After migration completes, remove the DOCR prefix
# (registry.digitalocean.com/loopzero-system/) and keep only Harbor
# (harbor.dev.loopzero.example/loopzero-platform/).
{{- $docr := .Values.registries.docrPrefix }}
{{- $harbor := .Values.registries.harborPrefix }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: loopzero-restrict-image-registries
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        loopzero.io/managed-by: environment-controller
  validations:
    # MEET-048: Allow both DOCR (legacy) and Harbor (new) during transition.
    - expression: >-
        object.spec.containers.all(c,
          c.image.startsWith({{ $docr | quote }}) ||
          c.image.startsWith({{ $harbor | quote }}))
      message: "All containers must use images from an approved registry (DOCR or Harbor)"
    - expression: >-
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(c,
          c.image.startsWith({{ $docr | quote }}) ||
          c.image.startsWith({{ $harbor | quote }}))
      message: "All init containers must use images from an approved registry (DOCR or Harbor)"
    - expression: >-
        !has(object.spec.ephemeralContainers) ||
        object.spec.ephemeralContainers.all(c,
          c.image.startsWith({{ $docr | quote }}) ||
          c.image.startsWith({{ $harbor | quote }}))
      message: "All ephemeral containers must use images from an approved registry (DOCR or Harbor)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: loopzero-restrict-image-registries-binding
spec:
  policyName: loopzero-restrict-image-registries
  # MEET-048: Upgraded from [Audit] to [Deny, Audit] — enforce registry restriction.
  validationActions:
    - Deny
    - Audit
  matchResources:
    namespaceSelector:
      matchLabels:
        loopzero.io/managed-by: environment-controller
{{- end }}
