# Helmfile environment: drill (PROD-IDENTICAL 4-CLUSTER DR + maturity validation)
#
# Plan: 2026-05-16-drill-prod-identical-multicluster-plan.md v1.1
# MEET-ASYNC-AMENDMENT-2026-05-16-001 (pending ratification)
#
# CTO directive 2026-05-16: drill is now PROD-IDENTICAL. Removed all
# "smaller footprint" / "in-cluster Postgres" / "single cluster" semantics
# from v0 (MEET-ASYNC-AMENDMENT-2026-05-12-003). Drill mirrors prod
# topology exactly so chaos+maturity validation reflects prod behavior 1:1.
#
# Target stack: infra/pulumi-drill/ (4 DOKS clusters per D1:
#   mgmt + build + runtime + runtime-2; managed PG mgmt-tier per D4;
#   shared VPC 10.40.0.0/16 per D5).
#
# Lifecycle:
#   1. infra/pulumi-drill && pulumi up                  (~25min provision 4 clusters)
#   2. Export drill kubeconfigs from pulumi stack outputs to per-cluster files
#   3. helmfile -e drill sync                            (~25min platform bootstrap)
#   4. drill-mint-jwt.sh → JWT for L-series tests       (T2.2)
#   5. bootstrap-cell-cc.sh --cell <0|1> --env drill (T2.3 D3 cell wiring)
#   6. Run drill scenarios (L0-L4 + Stage 1/2 + chaos)
#   7. infra/pulumi-drill && pulumi destroy             (~10min mandatory teardown)
#   8. drill-teardown-validator.sh                      (T4.1.bis doctl fallback)
#
# Differences vs prod.yaml (intentional, documented):
#   - Domain isolated: drill.getloopscale.com (separate CF Zone, D7)
#   - ephemeral lifecycle (expires-at tag, watchdog auto-destroy)
#   - chaos-mesh installed by default (drill IS the chaos test env)
#   - policyMode: enforce (validates prod-bound mitigations BEFORE prod)
#   - VAP noRuntimeImageMutations: Deny (full posture validation)

domain: drill.getloopscale.com
dnsZone: drill.getloopscale.com

# Phase 3.4 of plan 2026-06-02-loopzero-api-vault-integration v1.8 (D11 ESO).
# Opt-in flag: when true, core.helmfile installs ESO operator +
# loopzero-external-secrets CRs (pulls secrets from loopzero-secrets cluster).
# Default false → drill uses ephemeral env-var secrets (consistent with the
# drill ephemeral lifecycle); flip to true ONLY when a drill scenario
# explicitly tests Vault integration prod-identical (T9.2 Dogfood QA).
# Requires: loopzero-secrets drill cluster up (separate ephemeral DOKS) +
# ClusterSecretStore + seed-loopzero-secrets.sh ran for env=drill.
vaultEnabled: false

# Per D1: drill IS prod-identical topology. The marker `clusterTopology:
# multi-cluster` is now MEANINGFUL — bootstrap iterates over 4 DOKS
# clusters via per-cluster kubeconfig (Pulumi outputs).
clusterRole: drill
clusterTopology: multi-cluster

# Per D2 + prod Pulumi.dev.yaml: mirror prod replica counts so HA chaos
# scenarios surface same patterns prod will face. Drill IS NOT smaller —
# CTO directive 2026-05-16 explicitly removed that.
replicas:
  api: 2          # passive standby leader election (MEET-ASYNC-2026-05-12-003 Opt A)
  controller: 1   # operator split-binary topology
  argocd: 1
  gitea: 1

# Per D2 — prod tier specs (NOT minimal). Drill mgmt nodes are medium per
# Pulumi.drill.yaml mgmtNodeSize=s-4vcpu-8gb-amd × 3 nodes. Runtime/build
# are small (s-2vcpu-4gb × 2 nodes each).
resources:
  default:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

certIssuer:
  kind: ClusterIssuer
  name: letsencrypt-prod

registries:
  docrPrefix: "registry.digitalocean.com/loopzero-drill/"

loki:
  maxGlobalStreamsPerUser: 50000
  pushUrl: http://loki-internal.drill.drill.getloopscale.com:3100/loki/api/v1/push

# Policy mode: enforce — validates D2 mitigation #4 against prod-identical
# stack BEFORE real prod gets it. If chaos+maturity in drill shows enforce
# breaks anything, we catch it here (cheap) instead of in prod (expensive).
policyMode: enforce
noRuntimeImageMutations: true
noRuntimeImageMutationsAction: Deny
noRuntimeImageMutationsFailurePolicy: Fail

# Per D4 — Managed PG mgmt-tier (db-s-2vcpu-4gb) provisioned by
# infra/pulumi-drill/. Host + port + database injected via pulumi stack
# output during helmfile sync (operator runbook).
#
# Removed: inClusterPostgres flag (was true in v0 "cost optimization"
# semantics). Per CTO directive 2026-05-16, drill must be prod-identical;
# managed PG specifics (pool, replica lag, failover) ARE testable here.
inClusterPostgres: false

# Managed PG connection details — operator populates from Pulumi outputs:
#   pgHost: <pulumi stack output pg.host>
#   pgPort: <pulumi stack output pg.port>
#   pgDatabase: <pulumi stack output pg.database>
# These keys are consumed by loopzero-api + migrations helm values.

# The DO Spaces bucket source bundles are staged in and cloned from
# (infra/pulumi-drill `buckets.builds`). core.helmfile gives it to loopzero-api,
# build.helmfile to the loopzero-clone ClusterWorkflowTemplate.
sourceBucket: loopzero-drill-builds-sfo3

# DOKS default storage class.
underlyingStorageClass: do-block-storage

# Per D3 cell mapping — drill mirrors prod cell-to-cluster topology:
#   cell-0 → runtimeCluster  (pulumi-drill output key)
#   cell-1 → runtimeCluster2 (pulumi-drill output key)
# One cell per cluster since the 2026-08-09 1:1 unification.
# Single-cell `cell0Id: cell-drill` removed per CTO directive
# 2026-05-16 ("the system will NEVER work with a single cell").
cells:
  - id: cell-0
    pulumiOutputKey: runtimeCluster
  - id: cell-1
    pulumiOutputKey: runtimeCluster2

# DynamicRouter enabled — drill exercises full cell discovery + routing
# semantics. With 2 cells discovered on 2 runtime clusters, routing rules
# are real (not synthetic).
dynamicRouter: true

# Chaos Mesh installed for §3.D LIVE validation against drill cluster.
# After drill LIVE-validates chaos posture, prod gets clean baseline
# (chaos-mesh is DR/test tool, NOT prod runtime dependency).
installChaosMesh: true

# Velero backup config — same bucket pattern as prod but pointed at
# drill-specific bucket (set by pulumi-drill stack output buckets.builds).
velero:
  bucket: loopzero-drill-velero-backups
  region: sfo3
  s3Url: https://sfo3.digitaloceanspaces.com

# Cross-cluster URLs (loopzero-platform-topology ConfigMap). Per D1 + D5,
# drill clusters share VPC so private endpoints are valid. Operator
# populates from Pulumi stack outputs during helmfile sync.
#   crossCluster.argoApi: <buildCluster argo workflows endpoint>
#   crossCluster.giteaApi: <mgmtCluster gitea endpoint>
#   crossCluster.prometheusApi: <mgmtCluster prometheus endpoint>

# Plan v1.2 T2.3 / D4 — kratos+hydra UI base URL placeholder (drill DOKS)
uiBaseUrl: "https://app.drill.getloopscale.com"
dashboardOrigin: "https://cloud.drill.getloopscale.com"

# T2.2 of plan 2026-05-29-dashboard-public-integration-canonicalization.
publicAuthUrl: "https://auth.drill.getloopscale.com"
publicCloudUrl: "https://cloud.drill.getloopscale.com"
cookieDomain: "drill.getloopscale.com"
corsAllowedOrigins:
  - "https://app.drill.getloopscale.com"
  - "https://cloud.drill.getloopscale.com"
allowedReturnUrls:
  - "https://app.drill.getloopscale.com"
  - "https://app.drill.getloopscale.com/"
  - "https://cloud.drill.getloopscale.com"
  - "https://cloud.drill.getloopscale.com/"
dashboardRoute:
  login: /login
  register: /register
  recovery: /recovery
  verification: /verification
  settings: /settings
  error: /login

# Environment profile — the behaviour that differs between environments, as named
# values the helmfiles read (infra/helmfile/environments.yaml). A helmfile must not
# switch on the environment NAME.
profile:
  highAvailability: false       # multi-replica Gitea on NFS (values-ha.yaml), distributed MinIO, KEDA HA overlays
  managedRedis: true            # Gitea uses a managed Redis; the in-cluster gitea-redis release is not installed
  kedaHttpAddon: false          # install the KEDA HTTP add-on on the cells
  staticAssets: false           # install the static-assets server on the cells
  loopzeroCloud: false              # install the control plane (loopzero-cloud), unless clusterRole is standalone
  smokeTest: false              # run the post-install smoke-test release
  localObjectStore: false       # in-cluster MinIO is the object store: deterministic dev root password, Velero waits for it
  inClusterObjectStore: true    # the in-cluster MinIO release is the object store (false: the buckets are managed S3)
  awsSecretsManager: false      # secrets come from AWS Secrets Manager through External Secrets with IRSA; also bootstraps the managed database
  awsLoadBalancerController: false  # install the AWS Load Balancer Controller and publish the edge through an ALB
  localRegistry: false          # cells admit images from the local k3d registry (k3d-loopzero-registry:5000)
  secretFetchBroker: false      # install the ESO secret-fetch broker (loopzero-broker) on the cells; its chart allows a plaintext bearer only in dev-public
