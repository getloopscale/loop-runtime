# Helmfile environment: standalone-multi (3-cluster local validation)
# end-to-end-deploy-validation-plan T0.3
#
# Variant of `standalone` for local E2E validation with 3 separate k3d
# clusters (loopzero-core + loopzero-build + loopzero-cell-0). Used by:
#   - infra/tests/e2e/deploy_e2e_test.go (TestE2EDeployHappyPath)
#
# Differences vs `standalone`:
#   - clusterTopology: multi-cluster (cross-cluster service DNS via
#     host.k3d.internal:NodePort instead of in-cluster .svc.cluster.local)
#   - In-cluster Postgres still in mgmt; build+workload connect via NodePort
#   - cosign-signing-key Secret in build cluster (not mgmt)
#   - cf-tunnel-credentials in workload cluster with replicas:0 (no real CF)

domain: loopzero.local

# Phase 3.4 of plan 2026-06-02-loopzero-api-vault-integration v1.8 (D11 ESO).
# Opt-in flag: when true, core.helmfile installs ESO operator +
# loopzero-external-secrets CRs (pulls secrets from loopzero-secrets cluster).
# Default false → secrets continue via legacy env var / K8s Secret pattern.
# Set to true ONLY after loopzero-secrets cluster up + openbao-init Job ran +
# ClusterSecretStore loopzero-secrets-secrets applied (Phase 3.1 manifests).
vaultEnabled: false
dnsZone: loopzero.local

clusterRole: standalone
clusterTopology: multi-cluster

replicas:
  # MEET-ASYNC-AMENDMENT-2026-05-12-003 Option A (RATIFIED 2026-05-12)
  # unblocked multi-replica:
  #   - main.go now starts HTTP server before leader election
  #     (passive standby pods serve /healthz while waiting for lock)
  #   - loopzero-api Deployment uses RollingUpdate when replicaCount>=2
  # 2 replicas validates chaos scenario 1 (recover within 120s) +
  # delivers true HA in production. Local k3d resource footprint
  # acceptable (~256Mi×2 = 512Mi for loopzero-api).
  api: 2
  controller: 1
  argocd: 1
  gitea: 1
  harbor: 1

resources:
  default:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

certIssuer:
  kind: ClusterIssuer
  name: selfsigned-issuer

registries:
  docrPrefix: "harbor.loopzero.local/loopzero-platform/"
  harborPrefix: "harbor.loopzero.local/loopzero-platform/"
  # CHG-2026-04-29-DOGFOOD iter 9 — k3d-loopzero-registry serves images
  # built locally by the build pipeline (no DOCR/Harbor in dev). The
  # tenant-id segment is intentionally NOT pinned: LoopZero names images
  # `<registry>/<tenant>/<project>-<app>:<sha>`, so the prefix needs
  # to cover all tenants in this k3d cluster.
  additionalPrefixes:
    - "k3d-loopzero-registry:5000/"

loki:
  maxGlobalStreamsPerUser: 50000
  # No pushUrl: crossCluster.lokiNodePort publishes the build cluster's Loki, and
  # infra/helm/promtail/values.yaml.gotmpl derives every Promtail's push address
  # from it. The 172.18.0.3:30094 this carried was a container IP from before the
  # k3d network re-IP, and no Promtail could reach it.

policyMode: warn

# In-cluster Postgres ENABLED on mgmt only. Build+workload connect via NodePort.
inClusterPostgres: true

# Underlying storage class empty → cluster default (local-path on k3d).
underlyingStorageClass: ""

# Cross-cluster URLs (loopzero-platform-topology ConfigMap). Used by loopzero-api
# to reach Argo, Loki, etc. across clusters via the host network.
crossCluster:
  argoApi: "http://host.k3d.internal:30093"
  # The build cluster's Loki, published on the build serverlb (infra/k3d/build-cluster.yaml
  # `30120:30120`). build.helmfile renders the NodePort Service on this port and the
  # loopzero-api overlay reads Loki at host.k3d.internal:<this port>. Declared here so the
  # three agree by construction; the `loki-cross-cluster` seed used to compute the
  # pair at runtime and patch it onto live objects.
  lokiNodePort: 30120
  giteaApi: "http://host.k3d.internal:3000"
  harborApi: "http://host.k3d.internal:30002"
  prometheusApi: "http://host.k3d.internal:9090"

# velero-backup-dr-plan v1.0 / T0.2 + ADR D5 — Velero BSL targets in-cluster
# MinIO. Bucket pre-created by MinIO Helm values (EC-4).
velero:
  bucket: velero-backups
  region: us-east-1
  s3Url: http://minio.loopzero-system.svc:9000

# Plan v1.2 T2.3 / D4 — kratos+hydra UI base URL placeholder
uiBaseUrl: "http://localhost:4455"
dashboardOrigin: "http://localhost:3000"

# Plan J-05 (2026-06-06 cleanroom recovery) — publicAuthUrl / publicCloudUrl
# / cookieDomain / corsAllowedOrigins / allowedReturnUrls / dashboardRoute
# declared even on standalone-multi so the Go template
# `{{ .Values.X | default Y }}` doesn't crash with "map has no entry for
# key" (default kicks in for empty/zero values but the key MUST exist in
# the env's values map — Go templates do NOT short-circuit `default` when
# the parent map lookup itself fails).
# Standalone-multi has no public auth — empty strings + minimal localhost
# defaults so in-cluster fallback FQDNs are used.
# publicAuthUrl + publicCloudUrl EMPTY for standalone-multi.
# - Hydra template now checks `hasKey AND non-empty` (fix 2026-06-06):
#   empty publicAuthUrl → Hydra uses cluster-internal issuer
#   (http://ory-hydra-public.loopzero-auth.svc.cluster.local:4444/) which is
#   what loopzero-api expects for JWT validation in standalone.
# - Kratos template uses same hasKey AND non-empty pattern: falls back
#   to uiBaseUrl for base_redirect_uri = http://localhost:4455/.
publicAuthUrl: ""
publicCloudUrl: ""
cookieDomain: "localhost"
corsAllowedOrigins:
  - "http://localhost:3000"
  - "http://localhost:4455"
  - "http://localhost:13001"
  - "http://localhost:13002"
allowedReturnUrls:
  - "http://localhost:3000"
  - "http://localhost:3000/"
  - "http://localhost:4455"
  - "http://localhost:4455/"
dashboardRoute:
  login: /login
  register: /register
  recovery: /recovery
  verification: /verification
  settings: /settings
  error: /login

# Os CronWorkflows de CI/drill NAO sao agendados aqui.
#
# MEDIDO em 2026-08-10, na reconstrucao total do app-dev: o pod `drill-watchdog-*` ficava
# em ImagePullBackOff, e a causa nao era credencial — `doctl registry get` responde
# **404 registry does not exist**. A imagem que os quatro crons executam,
# `registry.digitalocean.com/loopzero-system/loopzero-ops:v0.1.0`, mora num registro DELETADO.
# Ninguem consegue puxa-la, com ou sem token.
#
# Eles tambem nao tem alvo aqui: `drill:watchdog` e `drill:l2-scale` exercitam o ambiente
# DRILL (DOKS), que nao existe num k3d local. Desligar nao remove cobertura deste
# ambiente — ela nunca existiu.
#
# Pod vermelho recorrente e pior que ausencia de automacao: treina quem olha o cluster a
# ignorar vermelho. Foi esse ruido que fez o watchdog ser o ULTIMO item investigado nesta
# reconstrucao. Isto nao e o conserto — o conserto e republicar `loopzero-ops` num registro
# alcancavel (BACKLOG.md B-019). O ambiente `drill`, que tem alvo de verdade, segue
# agendando os quatro.
ciCronsEnabled: false

# Environment profile — the behaviour that differs between environments, as named
# values the helmfiles read (infra/helmfile/environments.yaml). A helmfile must not
# switch on the environment NAME.
profile:
  highAvailability: false       # multi-replica Gitea on NFS (values-ha.yaml), distributed MinIO, KEDA HA overlays
  managedRedis: false           # Gitea/Harbor use a managed Redis; the in-cluster gitea-redis/harbor-redis releases are not installed
  harbor: true                  # install the Harbor registry mirror
  kedaHttpAddon: true           # install the KEDA HTTP add-on on the cells
  staticAssets: true            # install the static-assets server on the cells
  loopzeroCloud: true               # install the control plane (loopzero-cloud), unless clusterRole is standalone
  smokeTest: true               # run the post-install smoke-test release
  localObjectStore: true        # in-cluster MinIO is the object store: deterministic dev root password, Velero waits for it
  localRegistry: true           # cells admit images from the local k3d registry (k3d-loopzero-registry:5000)
  secretFetchBroker: false      # install the ESO secret-fetch broker (loopzero-broker) on the cells; its chart allows a plaintext bearer only in dev-public
