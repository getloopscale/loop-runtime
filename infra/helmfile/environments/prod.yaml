# Helmfile environment: prod
# CHG-2026-04-28-LAYERED-BOOTSTRAP — Phase 2 (T2.1/T2.2/T2.3)
#
# HA replicas, ACME production TLS, secrets injected from external store.

domain: loopzero.example
dnsZone: loopzero.example

clusterRole: prod

replicas:
  api: 3
  controller: 2
  argocd: 2
  gitea: 2
  harbor: 2

resources:
  default:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

certIssuer:
  kind: ClusterIssuer
  name: letsencrypt-prod

registries:
  docrPrefix: "registry.digitalocean.com/loopzero-system/"
  harborPrefix: "harbor.loopzero.example/loopzero-platform/"

loki:
  maxGlobalStreamsPerUser: 200000

# Policy mode — `enforce` per MEET-2026-05-12 T1.12 (post-Wave 1 deliverable).
# Operator action required: run pre-flight via `infra/scripts/check-prod-vap-readiness.sh`
# before flipping this value to `enforce`. The pre-flight verifies:
#   1. All running prod pods have valid cosign signatures (no unsigned images)
#   2. No `kubectl set image` cron exists in any prod workflow
#   3. ArgoCD apps are all Synced (no pending image updates that would fail VAP)
# After flip: monitor `loopzero_admission_denied_total` for 24h before declaring
# T1.12 complete. Rollback path: `policyMode: warn` + helmfile sync.
#
# noRuntimeImageMutations VAP-specific config: failurePolicy and action
# tracked separately because the VAP needs both elevated to fully enforce.
policyMode: warn  # OPERATOR ACTION: flip to "enforce" per T1.12 pre-flight checklist
noRuntimeImageMutations: true  # VAP active in prod (was implicit; now explicit)
noRuntimeImageMutationsAction: Warn  # OPERATOR ACTION: flip to "Deny" per T1.12 + EC-NEW-4
noRuntimeImageMutationsFailurePolicy: Ignore  # OPERATOR ACTION: flip to "Fail" per T1.12 + EC-NEW-4

# In-cluster Postgres — DISABLED for LoopZero Cloud prod (uses DO Managed HA PG cluster).
inClusterPostgres: false

# B20: NFS server provisioner underlying storage class. DOKS default.
underlyingStorageClass: do-block-storage

# CHG-2026-04-30-INFRA-NORMALIZE / Phase 5 T5.2 — multi-cell metadata.
# Production: runtime → cell-1, runtime-2 → cell-2. Seeded in cells
# table (migration 000006). cell-2 in 'maintenance' until canary
# stage 4 (T7.1) flips it 'active' with explicit customer opt-in.
runtimeCellId: cell-1
runtime2CellId: cell-2

# DynamicRouter enabled in production — but cell-2 admission gated by
# cells.status, so production traffic routes to cell-1 only until
# canary promotion.
dynamicRouter: true

# velero-backup-dr-plan v1.0 / T0.2 — Velero BSL config. Bucket name comes
# from Pulumi L1 (InfraOutputs.veleroBackupsBucketName) and is protected
# from accidental destroy in prod (T0.1 protect:isProd).
velero:
  bucket: loopzero-infra-sfo3-velero-backups
  region: sfo3
  s3Url: https://sfo3.digitaloceanspaces.com
