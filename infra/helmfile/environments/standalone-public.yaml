# Helmfile environment: standalone-public
# T2.2 of plan 2026-05-29-dashboard-public-integration-canonicalization
#
# Variant of `standalone-multi` for local k3d clusters fronted by Caddy on
# a droplet/host with PUBLIC DNS (app/cloud/auth.getloopscale.com). Caddy
# terminates Let's Encrypt TLS and reverse-proxies into kubectl port-forwards
# pointing at the in-cluster services.
#
# NO EDGE SERVES THIS ENVIRONMENT, AND THAT IS DELIBERATE (B-165, 2026-09-04).
#
# The paragraph above describes the topology as built. It stopped being true on
# 2026-08-19, when B-025 removed the three bare hostnames this environment
# advertises — app, cloud and auth at getloopscale.com — from infra/local/Caddyfile,
# because they served development processes under names reserved for production.
# Measured 2026-09-04: the Caddyfile declares four site blocks (app-dev,
# auth-dev, *.preview-dev, *.prod-dev) and the three bare names survive in it
# only inside comments.
#
# B-165 offered two ways to resolve that — retire this environment with the
# hostnames, or give it an edge of its own. Neither was taken, and the third
# option is recorded here rather than inferred:
#
#   The environment is KEPT and STAYS SELECTABLE with an explicit
#   ENV=standalone-public. It is NOT served. What changed is that no task
#   defaults to it any more — `infra:install:core-dashboard-only` now defaults
#   to dev-public, which is the canonical public variant and whose hostnames do
#   have site blocks.
#
# So selecting this environment installs the releases and leaves nothing
# terminating TLS for the names it advertises. That is a usable state for
# rendering and for the `ory-kratos-public-urls` gate, which still templates it,
# and it is not a usable state for reaching the cluster over those hostnames.
#
# To make it servable again, someone has to add site blocks for the three bare
# names to infra/local/Caddyfile — which is the decision B-025 deliberately made
# the other way, and reversing it is a decision, not an edit.
#
# `infra/tests/unit/task_env_edge_test.go` holds the part of this that can rot:
# it fails if any task default names an environment whose public hostnames have
# no site block. It does not forbid selecting one explicitly, because explicit
# is the point.

# Differences vs `standalone-multi`:
#   - publicAuthUrl + publicCloudUrl + cookieDomain set → Kratos renders
#     serve.public.base_url, CORS, session.cookie.domain, allowed_return_urls.
#   - corsAllowedOrigins includes the public app/cloud hosts.
#   - allowedReturnUrls covers ?return_to=... callback patterns.
#   - dashboardRoute defaults aligned with cloud/dashboard/src/app.tsx.
#
# Intended for: paulo@droplet 165.227.121.20 (or any operator with `caddy:up`
# + `port-forward:public-dashboard` running) demoing the dashboard flow end-to-end
# without DOKS provisioning costs.

domain: loopzero.local
dnsZone: loopzero.local

# clusterRole=cloud-local: triggers loopzero-cloud + loopzero-api install via helmfile
# (rather than tilt local). The local Caddy edge proxies their services to
# the public app/cloud/auth.getloopscale.com hostnames. T3.1 of plan.
clusterRole: cloud-local
clusterTopology: multi-cluster

replicas:
  api: 2
  controller: 1
  argocd: 1
  gitea: 1

resources:
  default:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

certIssuer:
  kind: ClusterIssuer
  name: selfsigned-issuer

registries:
  additionalPrefixes:
    - "k3d-loopzero-registry:5000/"

loki:
  maxGlobalStreamsPerUser: 50000
  # No pushUrl: crossCluster.lokiNodePort publishes the build cluster's Loki, and
  # infra/helm/promtail/values.yaml.gotmpl derives every Promtail's push address
  # from it. The 172.18.0.3:30094 this carried was a container IP from before the
  # k3d network re-IP, and no Promtail could reach it.

policyMode: warn
inClusterPostgres: true
underlyingStorageClass: ""

crossCluster:
  argoApi: "http://host.k3d.internal:30093"
  # The build cluster's Loki, published on the build serverlb (infra/k3d/build-cluster.yaml
  # `30120:30120`). build.helmfile renders the NodePort Service on this port and the
  # loopzero-api overlay reads Loki at host.k3d.internal:<this port>. Declared here so the
  # three agree by construction; the `loki-cross-cluster` seed used to compute the
  # pair at runtime and patch it onto live objects.
  lokiNodePort: 30120
  giteaApi: "http://host.k3d.internal:3000"
  prometheusApi: "http://host.k3d.internal:9090"

velero:
  bucket: velero-backups
  region: us-east-1
  s3Url: http://minio.loopzero-system.svc:9000

# UI: dashboard served by vite dev (5173) behind Caddy on https://app.getloopscale.com
uiBaseUrl: "https://app.getloopscale.com"
dashboardOrigin: "https://cloud.getloopscale.com"

# T2.2 — public-flow canonical values for the local-Caddy demo droplet.
# The Caddy edge maps:
#   https://app.getloopscale.com   → localhost:5173 (vite dev)
#   https://cloud.getloopscale.com → localhost:13002 (kubectl port-forward loopzero-cloud)
#   https://auth.getloopscale.com  → localhost:14433 (kubectl port-forward ory-kratos-public)
publicAuthUrl: "https://auth.getloopscale.com"
publicCloudUrl: "https://cloud.getloopscale.com"
cookieDomain: "getloopscale.com"
corsAllowedOrigins:
  - "https://app.getloopscale.com"
  - "https://cloud.getloopscale.com"
allowedReturnUrls:
  - "https://app.getloopscale.com"
  - "https://app.getloopscale.com/"
  - "https://cloud.getloopscale.com"
  - "https://cloud.getloopscale.com/"
dashboardRoute:
  login: /login
  register: /register
  recovery: /recovery
  verification: /verification
  settings: /settings
  error: /login

# Environment profile — the behaviour that differs between environments, as named
# values the helmfiles read (infra/helmfile/environments.yaml). A helmfile must not
# switch on the environment NAME.
profile:
  highAvailability: false       # multi-replica Gitea on NFS (values-ha.yaml), distributed MinIO, KEDA HA overlays
  managedRedis: false           # Gitea uses a managed Redis; the in-cluster gitea-redis release is not installed
  kedaHttpAddon: true           # install the KEDA HTTP add-on on the cells
  staticAssets: true            # install the static-assets server on the cells
  loopzeroCloud: true               # install the control plane (loopzero-cloud), unless clusterRole is standalone
  smokeTest: true               # run the post-install smoke-test release
  localObjectStore: false       # in-cluster MinIO is the object store: deterministic dev root password, Velero waits for it
  localRegistry: true           # cells admit images from the local k3d registry (k3d-loopzero-registry:5000)
  secretFetchBroker: false      # install the ESO secret-fetch broker (loopzero-broker) on the cells; its chart allows a plaintext bearer only in dev-public
