# Helmfile environment: dev
# CHG-2026-04-28-LAYERED-BOOTSTRAP — Phase 2 (T2.1/T2.2/T2.3)
#
# Overrides for the dev environment. Used by mgmt/build/runtime helmfiles
# when invoked with `-e dev`.
#
# Convention: env vars from `pulumi stack output --stack dev` are injected
# at runtime by `loopzero platform install --provider digitalocean` or directly
# by the developer when running helmfile manually.

# Domain
domain: dev.loopzero.example
dnsZone: loopzero.example

# Cluster role identity (used by templates / tests).
clusterRole: dev

# Replica counts (small for dev — HA values go in prod overlay).
replicas:
  api: 1
  controller: 1
  argocd: 1
  gitea: 1
  harbor: 1

# Resource sizing
resources:
  default:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# TLS issuer
certIssuer:
  kind: ClusterIssuer
  name: letsencrypt-staging

# Image registries (must match Pulumi outputs).
registries:
  docrPrefix: "registry.digitalocean.com/loopzero-system/"
  harborPrefix: "harbor.dev.loopzero.example/loopzero-platform/"

# Loki capacity (B5)
loki:
  maxGlobalStreamsPerUser: 100000

# Policy mode (B16) — `warn` for dev so test workloads are not blocked.
policyMode: warn

# In-cluster Postgres — DISABLED for LoopZero Cloud (uses DO Managed PG via Pulumi L1).
# iter 20: explicit toggle so the postgresql release is only rendered in standalone.
inClusterPostgres: false

# B20: NFS server provisioner underlying storage class. DOKS default.
underlyingStorageClass: do-block-storage

# CHG-2026-04-30-INFRA-NORMALIZE / Phase 5 T5.2 — multi-cell metadata.
# cellId names the cell that runtime cluster X belongs to. Per T0.1
# audit Gap 3: cell-id is K8s/ArgoCD metadata, NOT cloud infra — so it
# lives in helmfile env (not Pulumi.dev.yaml).
#
# In dev: runtime cluster maps to cell-1; runtime-2 to cell-2. Both
# seeded in cells SQL table (migration 000006); cell-2 starts in
# 'maintenance' status (no traffic until canary stage 1 flips it).
runtimeCellId: cell-1
runtime2CellId: cell-2

# CHG-2026-04-30-INFRA-NORMALIZE / Phase 5 T5.4 — enable DynamicRouter
# in loopzero-api so it consumes ClusterCredential CRs and routes per-tenant
# to cell-1 or cell-2. Audit T0.1 Gap 4 (was: silently single-cell).
dynamicRouter: true

# velero-backup-dr-plan v1.0 / T0.2 — Velero BSL config. Bucket name comes
# from Pulumi L1 (InfraOutputs.veleroBackupsBucketName). Region matches the
# cloud region. s3Url targets the regional Spaces endpoint.
velero:
  bucket: loopzero-infra-sfo3-velero-backups
  region: sfo3
  s3Url: https://sfo3.digitaloceanspaces.com
