# Helmfile environment: dev
# CHG-2026-04-28-LAYERED-BOOTSTRAP — Phase 2 (T2.1/T2.2/T2.3)
#
# Overrides for the dev environment. Used by mgmt/build/runtime helmfiles
# when invoked with `-e dev`.
#
# Convention: env vars from `pulumi stack output --stack dev` are injected
# at runtime by `loopzero platform install --provider digitalocean` or directly
# by the developer when running helmfile manually.

# Domain
domain: dev.getloopscale.com
dnsZone: getloopscale.com

# Phase 3.4 of plan 2026-06-02-loopzero-api-vault-integration v1.8 (D11 ESO).
# Opt-in flag: when true, core.helmfile installs ESO operator +
# loopzero-external-secrets CRs (pulls secrets from loopzero-secrets cluster).
# Default false → secrets continue via legacy env var / K8s Secret pattern.
# Set to true ONLY after DOKS loopzero-secrets-dev cluster up + openbao-init Job ran +
# ClusterSecretStore loopzero-secrets-secrets applied (Phase 3.1 manifests) +
# seed-loopzero-secrets.sh ran for env=dev (T8.1 EC-21).
vaultEnabled: false

# Cluster role identity (used by templates / tests).
clusterRole: dev

# Replica counts (small for dev — HA values go in prod overlay).
replicas:
  api: 1
  controller: 1
  argocd: 1
  gitea: 1

# Resource sizing
resources:
  default:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# TLS issuer
certIssuer:
  kind: ClusterIssuer
  name: letsencrypt-staging

# Image registries (must match Pulumi outputs).
registries:
  docrPrefix: "registry.digitalocean.com/loopzero-system/"

# Loki capacity (B5)
loki:
  maxGlobalStreamsPerUser: 100000
  # Audit M08 #18 / §6.C.4b — promtail cross-cluster push target (env-specific).
  pushUrl: http://172.18.0.3:30094/loki/api/v1/push

# Policy mode (B16) — `warn` for dev so test workloads are not blocked.
policyMode: warn

# In-cluster Postgres — DISABLED for LoopZero Cloud (uses DO Managed PG via Pulumi L1).
# iter 20: explicit toggle so the postgresql release is only rendered in standalone.
inClusterPostgres: false

# B20: NFS server provisioner underlying storage class. DOKS default.
underlyingStorageClass: do-block-storage

# CHG-2026-04-30-INFRA-NORMALIZE / Phase 5 T5.2 — multi-cell metadata.
# cellId names the cell that runtime cluster X belongs to. Per T0.1
# audit Gap 3: cell-id is K8s/ArgoCD metadata, NOT cloud infra — so it
# lives in helmfile env (not Pulumi.dev.yaml).
#
# In dev: runtime cluster maps to cell-0; runtime-2 to cell-1. Both
# seeded in cells SQL table (migration 000006); cell-1 starts in
# 'maintenance' status (no traffic until canary stage 1 flips it).
cell0Id: cell-0
cell1Id: cell-1

# CHG-2026-04-30-INFRA-NORMALIZE / Phase 5 T5.4 — enable DynamicRouter
# in loopzero-api so it consumes ClusterCredential CRs and routes per-tenant
# to cell-0 or cell-1. Audit T0.1 Gap 4 (was: silently single-cell).
dynamicRouter: true

# velero-backup-dr-plan v1.0 / T0.2 — Velero BSL config. Bucket name comes
# from Pulumi L1 (InfraOutputs.veleroBackupsBucketName). Region matches the
# cloud region. s3Url targets the regional Spaces endpoint.
velero:
  bucket: loopzero-infra-sfo3-velero-backups
  region: sfo3
  s3Url: https://sfo3.digitaloceanspaces.com

# Plan v1.2 T2.3 / D4 — kratos+hydra UI base URL placeholder
uiBaseUrl: "http://localhost:4455"
dashboardOrigin: "http://localhost:3000"

# Environment profile — the behaviour that differs between environments, as named
# values the helmfiles read (infra/helmfile/environments.yaml). A helmfile must not
# switch on the environment NAME.
profile:
  highAvailability: true        # multi-replica Gitea on NFS (values-ha.yaml), distributed MinIO, KEDA HA overlays
  managedRedis: false           # Gitea uses a managed Redis; the in-cluster gitea-redis release is not installed
  kedaHttpAddon: true           # install the KEDA HTTP add-on on the cells
  staticAssets: true            # install the static-assets server on the cells
  loopzeroCloud: true               # install the control plane (loopzero-cloud), unless clusterRole is standalone
  smokeTest: true               # run the post-install smoke-test release
  localObjectStore: false       # in-cluster MinIO is the object store: deterministic dev root password, Velero waits for it
  localRegistry: false          # cells admit images from the local k3d registry (k3d-loopzero-registry:5000)
  secretFetchBroker: false      # install the ESO secret-fetch broker (loopzero-broker) on the cells; its chart allows a plaintext bearer only in dev-public
