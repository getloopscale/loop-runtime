# Helmfile environment: dev-public
# T2.1 of plan 2026-06-04-dev-public-domain-canonicalization-plan.md
#
# Variant of `standalone-public` that uses *-dev.getloopscale.com hostnames.
# Per D1 of plan: reserves *.getloopscale.com for future prod cutover; this env
# is the canonical dev infra (paulo@droplet 165.227.121.20).
#
# Differences vs `standalone-public`:
#   - publicAuthUrl / publicCloudUrl / uiBaseUrl / dashboardOrigin use the
#     `-dev` subdomain (auth-dev / app-dev / cloud-dev . getloopscale.com)
#   - allowedReturnUrls + corsAllowedOrigins enumerate the dev hosts
#   - cookieDomain stays `getloopscale.com` (eTLD+1) — same shape as standalone-public
#   - OAuth credentials read from LOOPZERO_*_DEV env vars (per T3.2 of plan) so
#     dev OAuth apps coexist with prod ones in the same .env file
#
# Operator workflow on this droplet:
#   1. ssh root@loopzero-e2e-runner (or git clone fresh)
#   2. cd <repo>
#   3. export $(grep -E '^LOOPZERO_|^CLOUDFLARE_' .env | xargs)
#   4. infra/scripts/local/setup-dev-public-dns.sh --verify
#   5. infra/scripts/local/caddy-up-dev-public.sh --verify
#   6. helmfile -e dev-public -f infra/helmfile/core.helmfile.yaml.gotmpl sync
#   7. task doctor (38/0)
#   8. Browser: https://app-dev.getloopscale.com/login

domain: loopzero.local
# The public root of every app URL: users reach <label>.prod-dev.getloopscale.app, and the
# edge rewrites it to <label>.loopzero.local for the cell's Traefik. loopzero-api announces it
# (status.url) and the app-operator probes under it (#447) — one value, two readers.
publicAppDomain: prod-dev.getloopscale.app
dnsZone: loopzero.local

# clusterRole=cloud-local: triggers loopzero-cloud + loopzero-api install via helmfile
# (rather than tilt local). The local Caddy edge proxies their services to
# the public *-dev hostnames.
clusterRole: cloud-local
clusterTopology: multi-cluster

replicas:
  api: 2
  controller: 1
  argocd: 1
  gitea: 1

resources:
  default:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

certIssuer:
  kind: ClusterIssuer
  name: selfsigned-issuer

# Platform images (#435): Amazon ECR, the registry production pulls from, provisioned
# by getloopscale/loopzero-infra-live (`registry/ecr`). Every tag is the full commit SHA CI
# built the image from; the repositories are immutable, so a tag names one build and
# this file says exactly which commit each service runs. Promoting a service is a
# commit that changes its line here.
#
# The nodes authenticate through the kubelet credential provider
# (`task ecr:credential-provider`), as EKS nodes do — no pull secret.
platformImages:
  registry: "776217504929.dkr.ecr.us-east-1.amazonaws.com/"
  tags:
    # getloopscale/loopzero
    loopzero-api: "5782d4331d58a88c97bc2f3f4c692af87f2e06a2"
    loopzero-tenant-operator: "5782d4331d58a88c97bc2f3f4c692af87f2e06a2"
    loopzero-app-operator: "5782d4331d58a88c97bc2f3f4c692af87f2e06a2"
    loopzero-preview-operator: "5782d4331d58a88c97bc2f3f4c692af87f2e06a2"
    loopzero-platform-operator: "5782d4331d58a88c97bc2f3f4c692af87f2e06a2"
    # Built from pinned upstream source; they pass the vulnerability gate since #441.
    loopzero-minio: "5782d4331d58a88c97bc2f3f4c692af87f2e06a2"
    loopzero-clone-runner: "5782d4331d58a88c97bc2f3f4c692af87f2e06a2"
    loopzero-syft-scanner: "5782d4331d58a88c97bc2f3f4c692af87f2e06a2"
    loopzero-cosign-signer: "5782d4331d58a88c97bc2f3f4c692af87f2e06a2"
    # getloopscale/loopzero-cloud
    loopzero-cloud: "03ff7b193dd60e1075052cbdb2c38bc96106bfd7"
    # The dashboard bundle the edge serves at app-dev (extracted by dev-public:caddy, #462).
    loopzero-dashboard: "03ff7b193dd60e1075052cbdb2c38bc96106bfd7"
    # getloopscale/loopzero-lens
    loopzero-lens: "3e3e4604109ab91ab8a930970c994f58ae8f9f9e"
    # getloopscale/loopzero-rag
    loopzero-rag: "532e55a347ca7fc4d7030fbafa54dae5bf4cb2e3"
    # getloopscale/loopzero-memory
    loopzero-memory: "02e004700865676c7a3500b9bb39cbffe5c91602"

# The data plane (#446): memory, RAG and lens run on the core cluster from Helmfile,
# pulled from ECR by commit like the platform images (`platformImages.tags`). A service is
# listed here once its repository publishes to ECR; each needs its tag above.
dataPlane:
  services:
    - loopzero-lens
    - loopzero-memory
    - loopzero-rag

# MCP servers behind infra/helm/mcp-gateway (#470). A server joins once it validates Hydra
# tokens itself; its resource URI is `publicCloudUrl` + `path`.
mcp:
  servers:
    - name: memory
      path: /mcp/memory
      host: loopzero-memory-mcp.loopzero-data-plane.svc.cluster.local
      port: 3100
      upstreamPath: /mcp

# Tenant builds still push to and run from k3d-loopzero-registry (fast local iteration).
# `docrPrefix` is read by the admission policies only; its registry was deleted and
# the policies move to ECR separately (#435).
registries:
  docrPrefix: "registry.digitalocean.com/loopzero-system/"
  additionalPrefixes:
    - "k3d-loopzero-registry:5000/"

loki:
  maxGlobalStreamsPerUser: 50000
  # No pushUrl: this environment publishes the build cluster's Loki through
  # crossCluster.lokiNodePort, and infra/helm/promtail/values.yaml.gotmpl derives
  # every Promtail's push address from that one value (in-cluster Service on the
  # build cluster, host.k3d.internal:<port> on the cells). The in-cluster URL this
  # used to carry was right only for the build cluster; the cells have no Loki.

policyMode: warn
inClusterPostgres: true
underlyingStorageClass: ""

crossCluster:
  argoApi: "http://host.k3d.internal:30093"
  # The build cluster's Loki, published on the build serverlb (infra/k3d/build-cluster.yaml
  # `30120:30120`). build.helmfile renders the NodePort Service on this port and the
  # loopzero-api overlay reads Loki at host.k3d.internal:<this port>. Declared here so the
  # three agree by construction; the `loki-cross-cluster` seed used to compute the
  # pair at runtime and patch it onto live objects.
  lokiNodePort: 30120
  # loopzero-api, as a cell reaches it: host port 13001 is published by the core serverlb to
  # loopzero-api's NodePort 30001 (infra/k3d/core-cluster.yaml). The cell's secret-fetch
  # broker (cell.helmfile, release loopzero-broker) calls it. The broker seed used to
  # record the core server-0 CONTAINER IP here, which docker reassigns on every restart.
  coreApi: "http://host.k3d.internal:13001"
  giteaApi: "http://host.k3d.internal:3000"
  prometheusApi: "http://host.k3d.internal:9090"

velero:
  bucket: velero-backups
  region: us-east-1
  s3Url: http://minio.loopzero-system.svc:9000

# D1 of plan 2026-06-04: *-dev.getloopscale.com hostnames
# uiBaseUrl controls 4 URLs in Hydra: login, consent, logout,
# post_device_done_url (device flow). Plan J-05 T2.2 D1.
# One dashboard, one name. `cloud-dev` was removed on 2026-08-10: it declared the SAME
# thing as `app-dev` — dashboardOrigin and publicCloudUrl — and only worked because it
# answered 301 to here. It was the same "two words, same thing" defect that motivated
# renaming the clusters and unifying the cells, now in the identity layer, with the
# aggravating factor of authorizing, in CORS and as a return URL, a host that existed only
# to redirect.
#
# Verified before removing that nothing depended on it: the GitHub webhook is registered
# against `app-dev` (cmd/loopzero-ops/internal/seed/github_webhook_fixture.go:44), and
# `app-dev` already has the same direct bypass to loopzero-api that `cloud-dev` had.
uiBaseUrl: "https://app-dev.getloopscale.com"
dashboardOrigin: "https://app-dev.getloopscale.com"
publicAuthUrl: "https://auth-dev.getloopscale.com"
publicCloudUrl: "https://app-dev.getloopscale.com"
cookieDomain: "getloopscale.com"
corsAllowedOrigins:
  - "https://app-dev.getloopscale.com"
allowedReturnUrls:
  - "https://app-dev.getloopscale.com"
  - "https://app-dev.getloopscale.com/"
dashboardRoute:
  login: /login
  register: /register
  recovery: /recovery
  verification: /verification
  settings: /settings
  error: /login

# D5 of plan 2026-06-04 (operator decision 2026-06-04): OAuth apps were
# reused (the legacy GitHub + Google clients had `auth-dev.getloopscale.com/
# self-service/methods/oidc/callback/{provider}` callback URLs added to
# the SAME client_id rather than provisioning new dev-specific OAuth
# apps). Consequence: dev + legacy prod share OAuth client_id. Cognitive
# separation moves to URL/cookie space (auth-dev vs auth) only.
#
# Helm chart values.yaml.gotmpl already reads `{{ env "LOOPZERO_GITHUB_CLIENT_ID" }}`
# (no _DEV suffix), so no chart override needed — same env var works for
# both standalone-public and dev-public envs.
#
# Stripe webhook (T4.1) deviates: dev gets a SEPARATE webhook endpoint
# (we_1TeVZFJF08yCtMK1RiMjeLc0) with its own whsec_*. Operator wires the
# Secret `loopzero-stripe-webhook-dev` (created 2026-06-04) so loopzero-cloud
# verifies dev events with the right signing key.
#
# Plan J-09 T4.1 (2026-06-05) — GitHub App webhook secret. Operator wires
# the `loopzero-github-webhook` Secret BEFORE bootstrapping dev-public so the
# loopzero-api Deployment can mount GITHUB_WEBHOOK_SECRET via envFrom. Without
# the secret the webhook handler stays unmounted (router nil-guards) and
# auto-deploy never fires. The secret value is the SAME string configured
# on the GitHub App webhook URL https://app-dev.getloopscale.com/api/v1/webhooks/github
# so HMAC validation succeeds end-to-end.
#
# Runbook:
#   kubectl --namespace loopzero-system create secret generic loopzero-github-webhook \
#     --from-literal=value="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#   # then paste the same value into the App config at github.com/settings/apps/loopzero-platform
#
# loopzero-api Deployment must reference the Secret via env:
#   - name: GITHUB_WEBHOOK_SECRET
#     valueFrom:
#       secretKeyRef:
#         name: loopzero-github-webhook
#         key: value
#         optional: true   # absent secret => webhook handler off, NOT crash

# Environment profile — the behaviour that differs between environments, as named
# values the helmfiles read (infra/helmfile/environments.yaml). A helmfile must not
# switch on the environment NAME.
profile:
  highAvailability: false       # multi-replica Gitea on NFS (values-ha.yaml), distributed MinIO, KEDA HA overlays
  managedRedis: false           # Gitea uses a managed Redis; the in-cluster gitea-redis release is not installed
  kedaHttpAddon: true           # install the KEDA HTTP add-on on the cells
  staticAssets: true            # install the static-assets server on the cells
  loopzeroCloud: true               # install the control plane (loopzero-cloud), unless clusterRole is standalone
  smokeTest: false              # run the post-install smoke-test release
  localObjectStore: false       # in-cluster MinIO is the object store: deterministic dev root password, Velero waits for it
  inClusterObjectStore: true    # the in-cluster MinIO release is the object store (false: the buckets are managed S3)
  awsSecretsManager: false      # secrets come from AWS Secrets Manager through External Secrets with IRSA; also bootstraps the managed database
  awsLoadBalancerController: false  # install the AWS Load Balancer Controller and publish the edge through an ALB
  localRegistry: true           # cells admit images from the local k3d registry (k3d-loopzero-registry:5000)
  secretFetchBroker: true       # install the ESO secret-fetch broker (loopzero-broker) on the cells; its chart allows a plaintext bearer only in dev-public
