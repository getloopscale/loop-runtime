# Helmfile environment: standalone (self-hosting single cluster)
# CHG-2026-04-28-LAYERED-BOOTSTRAP — ADR D6
#
# `loopzero platform install -f values.yaml` (without --provider) uses this
# environment. ALL releases (mgmt + build + runtime) install into a single
# customer-provided K8s cluster.

domain: loopzero.local
dnsZone: loopzero.local

clusterRole: standalone

# end-to-end-deploy-validation-plan T0.3 — clusterTopology distinguishes
# between (a) standalone single-cluster (mgmt+build+runtime collapsed, default)
# and (b) standalone multi-cluster (3 separate clusters in 1 host, used for
# local E2E validation). Templates use this to gate cross-cluster wiring,
# NodePort exposure, and DNS resolution strategy.
clusterTopology: single-cluster

replicas:
  api: 1
  controller: 1
  argocd: 1
  gitea: 1

resources:
  default:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# self-signed by default; customer overrides with their own ClusterIssuer
certIssuer:
  kind: ClusterIssuer
  name: selfsigned-issuer

loki:
  maxGlobalStreamsPerUser: 50000
  # Audit M08 #18 / §6.C.4b — promtail cross-cluster push target (env-specific).
  pushUrl: http://172.18.0.3:30094/loki/api/v1/push

policyMode: warn

# In-cluster Postgres — ENABLED for self-hosting (no external managed DB).
# iter 20: standalone profile is now truly self-contained — customer only
# needs to provide a K8s cluster, NOT bring their own database.
inClusterPostgres: true

# B20: NFS server provisioner underlying storage class. Empty = cluster
# default StorageClass (local-path on k3d, customer's default elsewhere).
# Self-hosting must NOT assume DO-specific resources.
underlyingStorageClass: ""

# velero-backup-dr-plan v1.0 / T0.2 + ADR D5 — Velero BSL config in
# standalone mode points to the in-cluster MinIO (not DO Spaces, no cloud
# credentials available). The `velero-backups` bucket is pre-created by
# the MinIO Helm values (EC-4 fix: see infra/helm/minio/values.yaml).
velero:
  bucket: velero-backups
  region: us-east-1
  s3Url: http://minio.loopzero-system.svc:9000

# Plan v1.2 T2.3 / D4 — kratos+hydra UI base URL placeholder
uiBaseUrl: "http://localhost:4455"
dashboardOrigin: "http://localhost:3000"

# Environment profile — the behaviour that differs between environments, as named
# values the helmfiles read (infra/helmfile/environments.yaml). A helmfile must not
# switch on the environment NAME.
profile:
  highAvailability: false       # multi-replica Gitea on NFS (values-ha.yaml), distributed MinIO, KEDA HA overlays
  managedRedis: false           # Gitea uses a managed Redis; the in-cluster gitea-redis release is not installed
  kedaHttpAddon: true           # install the KEDA HTTP add-on on the cells
  staticAssets: true            # install the static-assets server on the cells
  loopzeroCloud: true               # install the control plane (loopzero-cloud), unless clusterRole is standalone
  smokeTest: true               # run the post-install smoke-test release
  localObjectStore: true        # in-cluster MinIO is the object store: deterministic dev root password, Velero waits for it
  inClusterObjectStore: true    # the in-cluster MinIO release is the object store (false: the buckets are managed S3)
  awsSecretsManager: false      # secrets come from AWS Secrets Manager through External Secrets with IRSA; also bootstraps the managed database
  awsLoadBalancerController: false  # install the AWS Load Balancer Controller and publish the edge through an ALB
  localRegistry: false          # cells admit images from the local k3d registry (k3d-loopzero-registry:5000)
  secretFetchBroker: false      # install the ESO secret-fetch broker (loopzero-broker) on the cells; its chart allows a plaintext bearer only in dev-public
