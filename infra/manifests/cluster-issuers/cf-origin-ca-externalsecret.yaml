# ExternalSecret: Cloudflare Origin CA Key (stored in SOPS/Vault/ESO backend)
#
# Replaces the insecure `kubectl create secret --from-literal` pattern.
# The actual key should live in the secret store backend (Vault, DO Spaces
# with encryption, or SOPS-encrypted in git), and ExternalSecret syncs it
# to the cluster-local Secret that origin-ca-issuer reads.
#
# Rotation:
#   - Source-of-truth rotation happens in the backend (manual or scheduled).
#   - ExternalSecret.spec.refreshInterval: 1h — picks up changes within 1h.
#   - No pod restart needed; cert-manager re-reads on next reconcile.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-origin-ca-key
  namespace: origin-ca-issuer
  annotations:
    runtime.getloopscale.com/purpose: "Cloudflare Origin CA service key — emits certs for entire zone"
    runtime.getloopscale.com/rotation: "Annual — key is sensitive (can issue certs for ANY zone domain)"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: loopruntime-platform-secrets  # configured by ESO bootstrap (points to DO Spaces + encryption)
  target:
    name: cloudflare-origin-ca-key
    creationPolicy: Owner
    # Output as key field consumed by ClusterOriginIssuer
    template:
      type: Opaque
      data:
        key: "{{ .originCaKey }}"
  data:
    - secretKey: originCaKey
      remoteRef:
        key: cloudflare/origin-ca-key   # path in the backend
