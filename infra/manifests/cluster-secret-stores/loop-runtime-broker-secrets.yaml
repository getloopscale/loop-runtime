# SPDX-License-Identifier: Apache-2.0
# T4.5 of plan 2026-06-02-openbao-adoption v1.3 — ESO ClusterSecretStore
# webhook backend that points to the loop-runtime-api broker endpoint
# POST /internal/v1/secret-fetch/{tenant_id}/{secret_name}.
#
# Architecture (broker pattern):
#   ExternalSecret CR (in the cell runtime cluster)
#       ↓ ESO refresh tick
#   ClusterSecretStore "loop-runtime-broker-secrets" (webhook provider)
#       ↓ HTTP POST with Authorization: Bearer <SA-token-cell> + X-Cell-ID
#   loop-runtime-api /internal/v1/secret-fetch/{tenant_id}/{secret_name}
#       ↓ cross-cluster TokenReview (T4.2) + EC-07 cell-tenant binding +
#         EC-08 secret_name regex + dispatcher (T3.4) Vault Transit decrypt
#   Plaintext base64 → ESO materializes K8s Secret
#       ↓ tenant pod envFrom
#
# Distinct from loop-runtime-secrets-secrets (core-cluster direct-to-Vault store
# used pre-broker by vault-INT D11 ESO supersedes path). Both coexist
# during migration window:
#   - loop-runtime-secrets-secrets: core-cluster ExternalSecrets (loop-runtime-system NS)
#   - loop-runtime-broker-secrets: per-cell ExternalSecrets (tenant NS)
#
# T4.6 cert pinning: when serverCABundle is set, ESO validates loop-runtime-api
# TLS cert against the bundle. SPKI pin (T2.5 pattern) is enforced by
# loop-runtime-api's own VerifyPeerCertificate; client-side pinning here belt-and-
# suspenders for the broker call.
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: loop-runtime-broker-secrets
  annotations:
    runtime.getloopscale.com/purpose: "ESO broker — calls loop-runtime-api /internal/v1/secret-fetch"
    runtime.getloopscale.com/related-plan: "2026-06-02-openbao-adoption v1.3 T4.5"
    runtime.getloopscale.com/related-middleware: "api/internal/middleware/cross_cluster_token_review.go (T4.2)"
spec:
  provider:
    webhook:
      # loop-runtime-api internal endpoint URL. Per-cell overrides via Helmfile
      # values (default standalone-multi local: https://loop-runtime-api.loop-runtime-system:443/...).
      # Production: https://loop-runtime-api.loop-runtime-system.svc.cluster.local:443/...
      url: "https://loop-runtime-api.loop-runtime-system.svc.cluster.local/internal/v1/secret-fetch/{{ .tenant_id }}/{{ .remoteRef.key }}"
      method: POST
      timeout: 30s
      # T4.6 cert pinning — populated by Helmfile from openbao-init
      # SPKI extractor output (T2.5). When empty, ESO uses system trust
      # store (acceptable for local dev with self-signed CA via
      # caProvider below). PROD: serverCABundle MUST be set; the SPKI
      # pin is enforced by loop-runtime-api server-side too (T2.6 cached_client).
      caProvider:
        type: ConfigMap
        name: loop-runtime-api-tls
        namespace: external-secrets
        key: ca.crt
      headers:
        Authorization: "Bearer {{ .auth.token }}"
        X-Cell-ID: "{{ .auth.cellID }}"
        Content-Type: "application/json"
      body: "{}"
      # Response is JSON: {"tenant_id": "...", "secret_name": "...", "plaintext_b64": "..."}
      # ESO needs to extract plaintext_b64 + base64-decode.
      result:
        jsonPath: "$.plaintext_b64"
      # ESO 0.14.x supports secrets/auth fetch from K8s Secrets to populate
      # template variables. Each cell deploys a K8s Secret named
      # `loop-runtime-broker-auth` (NS external-secrets) with keys:
      #   - token: SA token of the cell's eso ServiceAccount
      #   - cellID: literal cell-XX value
      # Generated by per-cell helmfile sync (T4.5 wiring) — operator-time
      # provisioning, not bootstrap.
      secrets:
        - name: token
          secretRef:
            name: loop-runtime-broker-auth
            namespace: external-secrets
            key: token
        - name: cellID
          secretRef:
            name: loop-runtime-broker-auth
            namespace: external-secrets
            key: cellID
