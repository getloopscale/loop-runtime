# SPDX-License-Identifier: Apache-2.0
# Phase 3.1 pre-req: SA `eso-vault-reader` (mgmt cluster, loop-runtime-system ns)
# with ClusterRoleBinding `system:auth-delegator` for cross-cluster
# TokenReview (mirror of loop-runtime-secrets-reviewer pattern, VK.5 commit 41e7408f).
#
# Vault validates ESO's SA token by calling TokenReview API back to mgmt
# cluster's kube-apiserver — this SA's JWT is what ESO sends to Vault
# at auth/kubernetes/login.
#
# Apply on MGMT cluster (k3d-loop-runtime-core OR DOKS loop-runtime-core-prod).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault-reader
  namespace: loop-runtime-system
  annotations:
    runtime.getloopscale.com/purpose: "ESO SA for loop-runtime-secrets cluster Vault auth/kubernetes login"
    runtime.getloopscale.com/cross-cluster: "true (validated against mgmt apiserver via auth-delegator)"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eso-vault-reader-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: eso-vault-reader
    namespace: loop-runtime-system
