# SPDX-License-Identifier: Apache-2.0
# Phase 3.1 of plan 2026-06-02-loopzero-api-vault-integration v1.7 — D11 ratified.
#
# ClusterSecretStore `loopzero-vault-secrets` — points ESO to loopzero-vault cluster
# via Kubernetes auth method (TokenReview cross-cluster, validated VK.5
# commit 41e7408f).
#
# Architecture:
#   ESO (mgmt cluster) → kubernetes auth login → loopzero-vault → reads kv-v2
#   secrets → creates K8s Secrets matching ExternalSecret CRs.
#
# Pre-requisites (operator-time):
#   1. loopzero-vault cluster up + openbao-init Job completed (PRODLIKE state)
#   2. Vault auth/kubernetes/config set up pointing to MGMT cluster API
#      (per VK.5 runbook section "Step 2: Configure Vault auth/kubernetes")
#   3. Vault role `eso` provisioned with policy granting read on
#      `secret/data/loopzero/<env>/*` paths (D11 + D6 path convention)
#   4. SA `eso-vault-reader` in mgmt cluster (loopzero-system ns) with
#      ClusterRoleBinding `system:auth-delegator` for cross-cluster
#      TokenReview (mirror of loopzero-vault-reviewer pattern from VK.5)
#
# Each pre-req has corresponding manifest/Job in this plan's Phase 3.1
# expansion (will be added incrementally).
#
# Verification after apply:
#   kubectl --context k3d-loopzero-mgmt get clustersecretstore loopzero-vault-secrets \
#     -o jsonpath='{.status.conditions[0]}'
#   Expected: type=Ready, status=True, reason=Validated.
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: loopzero-vault-secrets
  annotations:
    loopzero.io/purpose: "Pull LoopZero platform secrets from loopzero-vault cluster"
    loopzero.io/path-convention: "secret/data/loopzero/<env>/<binary>/<category>/<key> (D6 ADR)"
    loopzero.io/created-by: "plan 2026-06-02-loopzero-api-vault-integration v1.7 D11"
spec:
  provider:
    vault:
      # loopzero-vault cluster endpoint. For k3d standalone-multi:
      # https://host.k3d.internal:8210 (port-forward, per VK.5 runbook).
      # For DOKS prod: https://vault.loopzero-vault-prod.svc.cluster.local:8200.
      # Override via Helm values per env (Phase 3.4).
      server: "https://host.k3d.internal:8210"
      # KV-v2 path prefix (D6: secret/data/loopzero/<env>/...)
      path: "secret"
      version: "v2"
      # Self-signed CA from openbao-cert chart (Secret openbao-tls in
      # vault-system ns of loopzero-vault cluster). For local validation,
      # operator copies ca.crt to ConfigMap `loopzero-vault-ca` in
      # external-secrets ns (per VK.5 ConfigMap vault-ca pattern).
      caProvider:
        type: ConfigMap
        name: loopzero-vault-ca
        namespace: external-secrets
        key: ca.crt
      auth:
        kubernetes:
          # Vault role `eso` (provisioned via openbao-init values
          # extension — see plan Phase 3.1 follow-up T3.1.2).
          role: "eso"
          mountPath: "kubernetes"
          serviceAccountRef:
            name: eso-vault-reader
            namespace: loopzero-system
