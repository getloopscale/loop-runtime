# SPDX-License-Identifier: Apache-2.0
# Phase 3.1 of plan 2026-06-02-loopruntime-api-vault-integration v1.7 — D11 ratified.
#
# ClusterSecretStore `loopruntime-secrets-secrets` — points ESO to loopruntime-secrets cluster
# via Kubernetes auth method (TokenReview cross-cluster, validated VK.5
# commit 41e7408f).
#
# Architecture:
#   ESO (mgmt cluster) → kubernetes auth login → loopruntime-secrets → reads kv-v2
#   secrets → creates K8s Secrets matching ExternalSecret CRs.
#
# Pre-requisites (operator-time):
#   1. loopruntime-secrets cluster up + openbao-init Job completed (PRODLIKE state)
#   2. Vault auth/kubernetes/config set up pointing to MGMT cluster API
#      (per VK.5 runbook section "Step 2: Configure Vault auth/kubernetes")
#   3. Vault role `eso` provisioned with policy granting read on
#      `secret/data/loopruntime/<env>/*` paths (D11 + D6 path convention)
#   4. SA `eso-vault-reader` in mgmt cluster (loopruntime-system ns) with
#      ClusterRoleBinding `system:auth-delegator` for cross-cluster
#      TokenReview (mirror of loopruntime-secrets-reviewer pattern from VK.5)
#
# Each pre-req has corresponding manifest/Job in this plan's Phase 3.1
# expansion (will be added incrementally).
#
# Verification after apply:
#   kubectl --context k3d-loopruntime-core get clustersecretstore loopruntime-secrets-secrets \
#     -o jsonpath='{.status.conditions[0]}'
#   Expected: type=Ready, status=True, reason=Validated.
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: loopruntime-secrets-secrets
  annotations:
    runtime.getloopscale.com/purpose: "Pull LoopRuntime platform secrets from loopruntime-secrets cluster"
    runtime.getloopscale.com/path-convention: "secret/data/loopruntime/<env>/<binary>/<category>/<key> (D6 ADR)"
    runtime.getloopscale.com/created-by: "plan 2026-06-02-loopruntime-api-vault-integration v1.7 D11"
spec:
  provider:
    vault:
      # loopruntime-secrets cluster endpoint.
      # R4 of plan dev-public-cross-cluster-secrets (issue #111, sponsor
      # approved 2026-06-19): use host.k3d.internal:8200, NOT :8210.
      # Rationale: the k3d loopruntime-secrets cluster config
      # (infra/k3d/secrets-cluster.yaml) maps host:8200 → loadbalancer 8200
      # → NodePort 30200 → openbao pod 8200. The cert SAN includes
      # `host.k3d.internal` (verified 2026-06-19). The legacy `:8210`
      # comment cited a manual operator port-forward that was never
      # codified in the seed chain → seed chain FAIL=11 root cause.
      # For DOKS prod: https://vault.loopruntime-secrets-prod.svc.cluster.local:8200.
      server: "https://host.k3d.internal:8200"
      # KV-v2 path prefix (D6: secret/data/loopruntime/<env>/...)
      path: "secret"
      version: "v2"
      # Self-signed CA from openbao-cert chart (Secret openbao-tls in
      # secrets-system ns of loopruntime-secrets cluster). For local validation,
      # operator copies ca.crt to ConfigMap `loopruntime-secrets-ca` in
      # external-secrets ns (per VK.5 ConfigMap vault-ca pattern).
      caProvider:
        type: ConfigMap
        name: loopruntime-secrets-ca
        namespace: external-secrets
        key: ca.crt
      auth:
        kubernetes:
          # Vault role `eso` provisioned via openbao-init chart values
          # (infra/helm/openbao-init/values.yaml § authRoles[0]).
          # R1+R2 of plan dev-public-cross-cluster-secrets (issue #111,
          # sponsor approved 2026-06-19): mountPath moves from legacy
          # `kubernetes` (intended for in-cluster loopruntime-secrets workloads)
          # to canonical `k8s-core` (multi-cluster mgmt-side workloads).
          # The `serviceAccountRef.audiences` MUST match the role's
          # `boundAudiences` exactly — TokenRequest emits a JWT with
          # `aud: openbao.vault.runtime.getloopscale.com` (EC-5: defence-in-depth).
          role: "eso"
          mountPath: "k8s-core"
          serviceAccountRef:
            name: eso-vault-reader
            namespace: loopruntime-system
            audiences:
              - openbao.vault.runtime.getloopscale.com
