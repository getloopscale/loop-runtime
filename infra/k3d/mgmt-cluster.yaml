apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: loopzero-mgmt
# Pin to match production DOKS 1.32.13 (Rule 10: local equals production)
image: rancher/k3s:v1.32.13-k3s1
servers: 1
agents: 2
kubeAPI:
  hostPort: "6443"
ports:
  - port: 3000:30000
    nodeFilters:
      - loadbalancer
  - port: 13001:30001
    nodeFilters:
      - loadbalancer
  - port: 3002:30002
    nodeFilters:
      - loadbalancer
  - port: 9001:30003
    nodeFilters:
      - loadbalancer
  - port: 9090:30004
    nodeFilters:
      - loadbalancer
  - port: 30082:30082
    nodeFilters:
      - loadbalancer
  - port: 30093:30093
    nodeFilters:
      - loadbalancer
  # 30094 exposes loki-cross-cluster so Promtail (build cluster) can ship workflow
  # pod logs to Loki (mgmt cluster). Without this, `loopzero logs --build <id>` works
  # only if logs arrive via another path. F1.4 E2E validation 2026-04-23.
  - port: 30094:30094
    nodeFilters:
      - loadbalancer
network: k3d-loopzero
registries:
  use:
    - k3d-loopzero-registry:5000
options:
  k3d:
    wait: true
    timeout: "120s"
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
