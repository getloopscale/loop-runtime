apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: loopzero-core
# Pin to match production DOKS 1.32.13 (Rule 10: local equals production)
image: rancher/k3s:v1.32.13-k3s1
servers: 1
agents: 2
kubeAPI:
  hostPort: "6443"
ports:
  - port: 3000:30000
    nodeFilters:
      - loadbalancer
  - port: 13001:30001
    nodeFilters:
      - loadbalancer
  - port: 3002:30002
    nodeFilters:
      - loadbalancer
  - port: 9001:30003
    nodeFilters:
      - loadbalancer
  - port: 9090:30004
    nodeFilters:
      - loadbalancer
  - port: 30082:30082
    nodeFilters:
      - loadbalancer
  - port: 30093:30093
    nodeFilters:
      - loadbalancer
  # Edge -> identity. Kratos and Hydra are ClusterIP in the chart, and the edge reached them
  # through an unsupervised `kubectl port-forward`: destroying the clusters on 2026-08-10 killed
  # the processes and took login down, with both services healthy (B-018, the same defect as
  # B-010). Paired with infra/helm/ory-{kratos,hydra}/nodeport-service.yaml and with the
  # Caddyfile's `localhost:14433`/`localhost:14444`.
  - port: 14433:30005
    nodeFilters:
      - loadbalancer
  - port: 14444:30006
    nodeFilters:
      - loadbalancer
  # The data plane (#446), on the host port the edge and the seed chain reach each service
  # at, paired with its nodePort in infra/helmfile/values/dev-public/loopzero-*.yaml.gotmpl. A
  # service's mapping joins here with its entry in `dataPlane.services`: until then its
  # compose container holds the host port, and mapping it would fail cluster creation.
  # memory 18081:30181 and RAG 18082:30182 are next.
  - port: 18084:30184
    nodeFilters:
      - loadbalancer
  # 30094 exposes loki-cross-cluster so Promtail (build cluster) can ship workflow
  # pod logs to Loki (mgmt cluster). Without this, `loopzero logs --build <id>` works
  # only if logs arrive via another path. F1.4 E2E validation 2026-04-23.
  - port: 30094:30094
    nodeFilters:
      - loadbalancer
network: k3d-loopzero
registries:
  use:
    - k3d-loopzero-registry:5000
  # B6 fix (cleanroom iter 6, 2026-05-05): mirror docker.io and registry-1.docker.io
  # through k3d-loopzero-registry's pull-through proxy. Eliminates the dependency on
  # public Docker Hub for repeat builds — first cleanroom run populates the cache,
  # subsequent destroy/recreate cycles serve from cache. Without this, anonymous
  # Docker Hub rate-limit (100 pulls/6h) blocks ~5 cleanroom cycles.
  config: |
    mirrors:
      "docker.io":
        endpoint:
          - https://mirror.gcr.io
      "registry-1.docker.io":
        endpoint:
          - https://mirror.gcr.io
# Kubelet image credential provider for Amazon ECR (#435) — how EKS nodes pull, with
# no pull secret in any namespace. k3s enables it only when the bin directory AND the
# config exist under /var/lib/rancher/credentialprovider, and `task
# ecr:credential-provider` writes them only for an environment that declares
# `platformImages`; everywhere else the directory is empty and nothing changes.
# ${HOME} is expanded by k3d (it expands environment variables in this file).
volumes:
  - volume: ${HOME}/.loopzero/credentialprovider:/var/lib/rancher/credentialprovider
    nodeFilters:
      - server:*
      - agent:*
options:
  k3d:
    wait: true
    timeout: "120s"
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
