# LoopZero Vault Cluster (k3d local, single-node)
#
# Dedicated K8s cluster for OpenBao (Bank-Vaults operator + OpenBao StatefulSet).
# Local validation of the topology that will go to DOKS prod (loopzero-secrets-prod) per
# architectural decision T3 2026-06-02 (vault cluster isolation, sponsor-direct).
#
# Pin K8s version to match production DOKS 1.32.13 (Rule 10: local equals
# production). Single server (no agents) — the k3d host already runs 3-4 clusters;
# local Vault does not need real HA (the host process does not survive a laptop crash
# even with HA pods). Production (DOKS loopzero-secrets-prod) will have 3 nodes
# s-2vcpu-4gb (hard anti-affinity, Raft 2/3 quorum).
#
# kubeAPI hostPort 6447 (next free after mgmt=6443, workload=6444,
#   build=6445, runtime-2=6446)
#
# Network: k3d-loopzero (shared with the other 4 clusters → native cross-cluster
#   lookup via container DNS k3d-loopzero-secrets-server-0).
#
# Registry: k3d-loopzero-registry pull-through (the same shared cache).
#
# Exposed ports:
#   - 8200 (HTTPS Vault API) → host:8200 → k3d serverlb (k3d-proxy nginx
#     `stream{}` L4 passthrough) → server-0:30200 → openbao pod (host-published
#     reach plan k3d-host-published-vault-reach, sponsor 2026-06-20). The
#     openbao Service is type: NodePort with explicit nodePort: 30200; the
#     serverlb publishes host:8200 → node:30200 transparently. Reuses the
#     same in-repo proven pattern as core-cluster.yaml (8 services mapped
#     `port:NN@loadbalancer` + Service type: NodePort). Klipper svclb is
#     DISABLED via `--disable=servicelb` so the serverlb is the sole publish
#     mechanism (no two LB stacks competing). x509-clean: CSS reads via
#     host.k3d.internal:8200 — already covered by the openbao-cert SAN.
#   - 30095 NodePort for cross-cluster scraping (future Prometheus federation)
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: loopzero-secrets

image: rancher/k3s:v1.32.13-k3s1
servers: 1
agents: 0
kubeAPI:
  hostPort: "6447"

ports:
  # Vault HTTPS API → host:8200 → k3d serverlb (k3d-proxy nginx stream{}
  # L4 TCP passthrough) → server-0:30200 → openbao pod
  # (plan k3d-host-published-vault-reach, sponsor 2026-06-20). The openbao
  # Service is type: NodePort with explicit nodePort: 30200 (see
  # secrets.helmfile.yaml.gotmpl); the serverlb forwards transparently,
  # preserving the TLS bytes intact (no L7 decode). Same pattern as
  # core-cluster.yaml mappings.
  - port: 8200:30200
    nodeFilters:
      - loadbalancer
  # OpenBao metrics NodePort (Prometheus federation cross-cluster)
  - port: 30095:30095
    nodeFilters:
      - loadbalancer

network: k3d-loopzero

registries:
  use:
    - k3d-loopzero-registry:5000
  # B6 fix (cleanroom iter 6) — mirror docker.io via gcr.io cache.
  # Same rationale as the other clusters (see core-cluster.yaml).
  config: |
    mirrors:
      "docker.io":
        endpoint:
          - https://mirror.gcr.io
      "registry-1.docker.io":
        endpoint:
          - https://mirror.gcr.io

options:
  k3d:
    wait: true
    timeout: "120s"
  k3s:
    extraArgs:
      # Disable traefik default (we install our own via Helmfile if needed —
      # Vault doesn't need ingress, accessible via Service ClusterIP +
      # NodePort 30200).
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
      # Disable Klipper svclb so the k3d serverlb (k3d-proxy nginx stream{})
      # is the sole publish path (plan k3d-host-published-vault-reach D3,
      # sponsor 2026-06-20). Two LB stacks competing on the same hostPort
      # caused the #112 decode_error 562 + #113 servicelb hostPort gap;
      # one LB mechanism removes the ambiguity. The serverlb maps
      # 8200:30200@loadbalancer → openbao Service nodePort: 30200.
      - arg: "--disable=servicelb"
        nodeFilters:
          - server:*
