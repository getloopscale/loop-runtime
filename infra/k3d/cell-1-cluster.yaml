apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: loopruntime-cell-1
# Pin to match production DOKS 1.32.13 (Rule 10: local equals production).
# cell-1-activation-plan T0.1 — pairs with cell-1 in the cells SQL table
# (migration 000006). Cluster name `loopruntime-cell-1` aligns with production
# wire-clusters.sh + Pulumi convention (LOOPRUNTIME_RUNTIME2_KUBECONFIG, runtime2*).
# ClusterCredential CR name is `cell-1` (per existing live state), with
# spec.clusterName=loopruntime-cell-1 + spec.cellID=cell-1.
#
# Once cells.status flips from 'maintenance' to 'active' (migration 000007),
# this cluster becomes a routing target for tenants pinned via
# `loopruntime admin tenants pin --cell cell-1`.
#
# Port allocation distinct from loopruntime-cell-0 (which uses 8090/8443/30091):
#   * kubeAPI hostPort 6446 (mgmt=6443, workload=6444, build=6445, runtime-2=6446)
#   * 8091:80   — Traefik HTTP entrypoint (workload uses 8090)
#   * 8444:443  — Traefik HTTPS entrypoint (workload uses 8443)
#   * 30191:30091 — Traefik metrics NodePort (workload uses 30091:30091).
# LOCAL ONLY (LP-002): k3d port mapping diverges from production single-DNS-per-cell.
# Local probes need cellID-aware port resolution; matrix entry tracks closure.
#     Inside the cluster the NodePort remains 30091 so cross-cluster Prometheus
#     federation configs that reference port 30091 work without per-cell branches.
#     Host port 30191 avoids collision with workload's 30091.
image: rancher/k3s:v1.32.13-k3s1
servers: 1
agents: 1
kubeAPI:
  hostPort: "6446"
ports:
  - port: 8091:80
    nodeFilters:
      - loadbalancer
  - port: 8444:443
    nodeFilters:
      - loadbalancer
  - port: 30191:30091
    nodeFilters:
      - loadbalancer
network: k3d-loopruntime
registries:
  use:
    - k3d-loopruntime-registry:5000
  # B6 fix (cleanroom iter 6, 2026-05-05): mirror docker.io via pull-through
  # cache in k3d-loopruntime-registry. See core-cluster.yaml for full rationale.
  config: |
    mirrors:
      "docker.io":
        endpoint:
          - https://mirror.gcr.io
      "registry-1.docker.io":
        endpoint:
          - https://mirror.gcr.io
options:
  k3d:
    wait: true
    timeout: "120s"
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
