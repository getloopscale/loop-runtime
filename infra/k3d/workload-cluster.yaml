apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: loopzero-workload
# Pin to match production DOKS 1.32.13 (Rule 10: local equals production)
image: rancher/k3s:v1.32.13-k3s1
servers: 1
agents: 2
kubeAPI:
  hostPort: "6444"
ports:
  # Traefik HTTP entrypoint — host:8090 → loadbalancer:80
  # HTTP redirects to HTTPS; also used by health probes (direct IP access)
  - port: 8090:80
    nodeFilters:
      - loadbalancer
  # Traefik HTTPS entrypoint — host:8443 → loadbalancer:443
  # TLS-terminated traffic for deployed apps
  - port: 8443:443
    nodeFilters:
      - loadbalancer
  # Traefik metrics NodePort for cross-cluster Prometheus scraping
  - port: 30091:30091
    nodeFilters:
      - loadbalancer
registries:
  use:
    - k3d-loopzero-registry:5000
options:
  k3d:
    wait: true
    timeout: "120s"
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
