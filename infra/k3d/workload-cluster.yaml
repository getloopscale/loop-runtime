apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: loopzero-workload
servers: 1
agents: 2
kubeAPI:
  hostPort: "6444"
ports:
  # Traefik HTTP entrypoint — host:8090 → loadbalancer:80
  # Allows health probes and local access to deployed apps on the workload cluster
  - port: 8090:80
    nodeFilters:
      - loadbalancer
  - port: 30091:30091
    nodeFilters:
      - loadbalancer
registries:
  use:
    - k3d-loopzero-registry:5000
options:
  k3d:
    wait: true
    timeout: "120s"
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
