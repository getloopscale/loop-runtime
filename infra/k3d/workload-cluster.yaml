apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: loopzero-workload
servers: 1
agents: 1
kubeAPI:
  hostPort: "6444"
options:
  k3d:
    wait: true
    timeout: "120s"
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
