apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: loopruntime-build
# Pin to match production DOKS 1.32.13 (Rule 10: local equals production).
# end-to-end-deploy-validation-plan T0.2 — sized for ~2GB total memory
# (1 server + 1 agent) so 3-cluster local topology fits in 16GB.
image: rancher/k3s:v1.32.13-k3s1
servers: 1
agents: 1
kubeAPI:
  hostPort: "6445"
ports:
  - port: 30081:30081
    nodeFilters:
      - loadbalancer
  - port: 30090:30090
    nodeFilters:
      - loadbalancer
  # B59 (end-to-end-deploy-validation-plan T1.1) — host ports 30093/30094
  # already mapped by mgmt cluster. Use 30193/30194 externally; internal
  # NodePort remains 30093/30094 inside loopruntime-build cluster.
  # Argo Workflows server UI (cross-cluster reachability via host.k3d.internal)
  - port: 30193:30093
    nodeFilters:
      - loadbalancer
  # Loki Gateway for cross-cluster log shipping from mgmt+workload Promtail
  - port: 30194:30094
    nodeFilters:
      - loadbalancer
  # loopruntime-workspace#23 item 2 — the NodePort of the Loki cross-cluster bridge (Service
  # loki-cross-cluster, rendered by infra/helmfile/build.helmfile.yaml.gotmpl on
  # crossCluster.lokiNodePort) must be reachable from outside the cluster at a STABLE
  # address. Without this publication the only path was the IP of the
  # `k3d-loopruntime-build-server-0` container — assigned by DHCP, reshuffled on every
  # `docker restart` / `k3d cluster create`. When it reshuffled, a recorded LOKI_URL
  # pointed at another cluster IN SILENCE, and the symptom (an empty `loopruntime logs`) read
  # as "Loki is down", never as "wrong cluster".
  #
  # Published, it is reachable through the network gateway (host.k3d.internal) plus
  # this port, the stable pair the loopruntime-api overlays render as LOKI_URL. Same port
  # inside and out (30120:30120): measured across the five `infra/k3d/*.yaml`, the
  # host ports in use are 3000 3002 8090 8091 8200 8443 8444 9001 9090 13001 30081
  # 30082 30090 30091 30093 30094 30095 30191 30193 30194.
  - port: 30120:30120
    nodeFilters:
      - loadbalancer
network: k3d-loopruntime
registries:
  use:
    - k3d-loopruntime-registry:5000
  # B6 fix (cleanroom iter 6, 2026-05-05): mirror docker.io via pull-through
  # cache in k3d-loopruntime-registry. See core-cluster.yaml for full rationale.
  config: |
    mirrors:
      "docker.io":
        endpoint:
          - https://mirror.gcr.io
      "registry-1.docker.io":
        endpoint:
          - https://mirror.gcr.io
# Kubelet image credential provider for Amazon ECR (#435) — how EKS nodes pull, with
# no pull secret in any namespace. k3s enables it only when the bin directory AND the
# config exist under /var/lib/rancher/credentialprovider, and `task
# ecr:credential-provider` writes them only for an environment that declares
# `platformImages`; everywhere else the directory is empty and nothing changes.
# ${HOME} is expanded by k3d (it expands environment variables in this file).
volumes:
  - volume: ${HOME}/.loopruntime/credentialprovider:/var/lib/rancher/credentialprovider
    nodeFilters:
      - server:*
      - agent:*
options:
  k3d:
    wait: true
    timeout: "120s"
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
      # LOCAL-ONLY (not parity with production DOKS).
      # See ADR .claude/knowledge-base/decisions/2026-05-28-T1.4-anonymous-auth-local-only.md
      # and CR-3 of MEET-2026-05-28-001 for the full context.
      #
      # Sigstore Fulcio fetches K8s OIDC discovery from the apiserver's
      # `/.well-known/openid-configuration`. On LOCAL k3d, Fulcio's K8s
      # OIDC client connects ANONYMOUSLY because the k3s default disables
      # anonymous-auth (unlike upstream K8s 1.32+). Forcing the flag here
      # makes the LOCAL discovery path work via the built-in RBAC binding
      # `system:unauthenticated → system:service-account-issuer-discovery`.
      #
      # PRODUCTION (DOKS) does NOT use this flag — Fulcio there connects
      # AUTHENTICATED via a Pulumi-provisioned service account token
      # (see ADR-2026-05-27-T2.2-OFFLINE-TUF). LOCAL keyless GREEN does
      # NOT validate the PROD discovery code path.
      - arg: "--kube-apiserver-arg=anonymous-auth=true"
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
