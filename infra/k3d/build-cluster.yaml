apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: loopzero-build
# Pin to match production DOKS 1.32.13 (Rule 10: local equals production).
# end-to-end-deploy-validation-plan T0.2 — sized for ~2GB total memory
# (1 server + 1 agent) so 3-cluster local topology fits in 16GB.
image: rancher/k3s:v1.32.13-k3s1
servers: 1
agents: 1
kubeAPI:
  hostPort: "6445"
ports:
  - port: 30081:30081
    nodeFilters:
      - loadbalancer
  - port: 30090:30090
    nodeFilters:
      - loadbalancer
  # B59 (end-to-end-deploy-validation-plan T1.1) — host ports 30093/30094
  # already mapped by mgmt cluster. Use 30193/30194 externally; internal
  # NodePort remains 30093/30094 inside loopzero-build cluster.
  # Argo Workflows server UI (cross-cluster reachability via host.k3d.internal)
  - port: 30193:30093
    nodeFilters:
      - loadbalancer
  # Loki Gateway for cross-cluster log shipping from mgmt+workload Promtail
  - port: 30194:30094
    nodeFilters:
      - loadbalancer
network: k3d-loopzero
registries:
  use:
    - k3d-loopzero-registry:5000
  # B6 fix (cleanroom iter 6, 2026-05-05): mirror docker.io via pull-through
  # cache in k3d-loopzero-registry. See mgmt-cluster.yaml for full rationale.
  config: |
    mirrors:
      "docker.io":
        endpoint:
          - https://mirror.gcr.io
      "registry-1.docker.io":
        endpoint:
          - https://mirror.gcr.io
options:
  k3d:
    wait: true
    timeout: "120s"
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
      # M07 Ralph iter 5 (plan 2026-05-28-M07-fulcio-cacert-keyless-LIVE
      # v1.6 Final Phase): Sigstore Fulcio fetches K8s OIDC discovery from
      # `/.well-known/openid-configuration` to validate SA OIDC tokens
      # presented by build pods (cosign sign --identity-token). Fulcio
      # connects WITHOUT bearer token — relies on K3s anonymous-auth
      # + ClusterRoleBinding system:unauthenticated →
      # system:service-account-issuer-discovery. Some K3s configurations
      # gate anonymous-auth off (default in upstream K8s 1.32+); the
      # explicit flag below guarantees behavior matches DOKS production
      # (CTO Golden Rule 0: local fidedigno ao prod). Without this,
      # Fulcio logs "401 Unauthorized" + "unsupported issuer" → sign fails.
      - arg: "--kube-apiserver-arg=anonymous-auth=true"
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
