apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: loopruntime-cell-0
# Pin to match production DOKS 1.32.13 (Rule 10: local equals production).
# end-to-end-deploy-validation-plan T0.2 — sized for ~3GB total memory
# (1 server + 1 agent) so 3-cluster local topology fits in 16GB.
image: rancher/k3s:v1.32.13-k3s1
servers: 1
agents: 1
kubeAPI:
  hostPort: "6444"
ports:
  # Traefik HTTP entrypoint — host:8090 → loadbalancer:80
  # HTTP redirects to HTTPS; also used by health probes (direct IP access)
  - port: 8090:80
    nodeFilters:
      - loadbalancer
  # Traefik HTTPS entrypoint — host:8443 → loadbalancer:443
  # TLS-terminated traffic for deployed apps
  - port: 8443:443
    nodeFilters:
      - loadbalancer
  # Traefik metrics NodePort for cross-cluster Prometheus scraping
  - port: 30091:30091
    nodeFilters:
      - loadbalancer
network: k3d-loopruntime
registries:
  use:
    - k3d-loopruntime-registry:5000
  # B6 fix (cleanroom iter 6, 2026-05-05): mirror docker.io via pull-through
  # cache in k3d-loopruntime-registry. See core-cluster.yaml for full rationale.
  config: |
    mirrors:
      "docker.io":
        endpoint:
          - https://mirror.gcr.io
      "registry-1.docker.io":
        endpoint:
          - https://mirror.gcr.io
options:
  k3d:
    wait: true
    timeout: "120s"
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
