# LoopZero Vault Cluster (k3d local, single-node)
#
# Cluster K8s dedicado para OpenBao (Bank-Vaults operator + OpenBao StatefulSet).
# Validação local da topology que irá para DOKS prod (loopzero-vault-prod) per
# decisão arquitetural T3 2026-06-02 (vault cluster isolation, sponsor-direct).
#
# Pin K8s version to match production DOKS 1.32.13 (Rule 10: local equals
# production). Single server (no agents) — k3d host already roda 3-4 clusters;
# Vault local não precisa HA real (host process não sobrevive crash do laptop
# mesmo com HA pods). Production (DOKS loopzero-vault-prod) terá 3 nodes
# s-2vcpu-4gb (anti-affinity hard, Raft 2/3 quorum).
#
# kubeAPI hostPort 6447 (próximo livre após mgmt=6443, workload=6444,
#   build=6445, runtime-2=6446)
#
# Network: k3d-loopzero (compartilhada com outros 4 clusters → cross-cluster
#   lookup nativo via container DNS k3d-loopzero-vault-server-0).
#
# Registry: k3d-loopzero-registry pull-through (mesma cache compartilhada).
#
# Exposed ports:
#   - 8200 (HTTPS Vault API) → host:8200 → k3d-loopzero-vault-server-0 hostPort:8200
#     The Klipper svclb DaemonSet (auto-deployed by k3s for LoadBalancer
#     Services) binds hostPort = Service.port (NOT Service.nodePort) on
#     each node. Originally `8200:30200@loadbalancer` expected HAProxy →
#     server-0:30200 but Klipper binds 8200 → connection chain broken
#     mid-TLS (decode_error 562). Issue #112 fix 2026-06-19: direct
#     `8200:8200@server:0` skips serverlb HAProxy, hits Klipper hostPort
#     directly, preserving cert SAN host.k3d.internal.
#   - 30095 NodePort para cross-cluster scraping (Prometheus federation futura)
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: loopzero-vault

image: rancher/k3s:v1.32.13-k3s1
servers: 1
agents: 0
kubeAPI:
  hostPort: "6447"

ports:
  # Vault HTTPS API → host:8200 → server-0 hostPort:8200 (issue #112 fix
  # 2026-06-19). Klipper svclb binds hostPort=Service.port=8200 directly
  # on server-0 — the prior `8200:30200@loadbalancer` mapping went via
  # serverlb HAProxy expecting NodePort 30200 backend, but Klipper does
  # NOT bind nodePort, only Service.port, causing TLS handshake decode_error
  # 562 mid-stream. Direct server:0 hostPort skips HAProxy entirely.
  - port: 8200:8200
    nodeFilters:
      - server:0
  # OpenBao metrics NodePort (Prometheus federation cross-cluster)
  - port: 30095:30095
    nodeFilters:
      - loadbalancer

network: k3d-loopzero

registries:
  use:
    - k3d-loopzero-registry:5000
  # B6 fix (cleanroom iter 6) — mirror docker.io via gcr.io cache.
  # Same rationale as outros clusters (see mgmt-cluster.yaml).
  config: |
    mirrors:
      "docker.io":
        endpoint:
          - https://mirror.gcr.io
      "registry-1.docker.io":
        endpoint:
          - https://mirror.gcr.io

options:
  k3d:
    wait: true
    timeout: "120s"
  k3s:
    extraArgs:
      # Disable traefik default (we install our own via Helmfile if needed —
      # Vault doesn't need ingress, accessible via Service ClusterIP +
      # NodePort 30200).
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
      # VK5.1 LIVE 2026-06-02: re-enabled servicelb (Klipper).
      # Originally disabled because Vault uses only ClusterIP intra-cluster,
      # but VK.5 cross-cluster auth requires NodePort routing host:30200 →
      # pod. Without servicelb, k3d port mapping 8200:30200 has no fabric
      # to forward traffic from the k3d serverlb container to the pod.
      # Klipper adds ~5MB and runs as one DaemonSet pod — accepted cost.
