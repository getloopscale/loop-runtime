# Cenário A — Anonymous discovery 401/403 fix (M07 plan 2026-05-28 T2.1)
#
# ⚠️ Ralph iter 5 LIVE TESTED (2026-05-28): ESSA APLICAÇÃO ISOLADA É INSUFICIENTE
# para K3s clusters com anonymous-auth=false (k3s 1.30+ default behavior).
#
# Two cenário variants identified LIVE:
#   A.1 — K3s `--anonymous-auth=true` + RBAC missing → ClusterRoleBinding fixes
#   A.2 — K3s `--anonymous-auth=false` → ClusterRoleBinding ALONE não basta;
#         ALL endpoints retornam 401 (including /healthz, /livez), confirmando
#         que anonymous requests são rejeitadas no LEVEL DE AUTENTICAÇÃO,
#         antes mesmo de RBAC ser avaliado.
#
# LIVE VERIFY (Ralph iter 5):
#   kubectl run dual-test --rm -i --image=alpine/curl -- sh -c "
#     curl -sk -w 'STATUS=%{http_code}' --max-time 3 \
#       https://kubernetes.default.svc.cluster.local/healthz
#   "
#   Se retorna 401 → Cenário A.2 (cluster-level config); CRB abaixo NÃO RESOLVE.
#   Se retorna 200 + curl /openid retorna 401 → Cenário A.1; aplicar CRB abaixo.
#
# ─── Cenário A.2 fix (OPERATOR HARD STOP — high blast radius) ────────────
#
# Requires K3s cluster recreate with `--kube-apiserver-arg=anonymous-auth=true`:
#
#   k3d cluster delete loopzero-build
#   k3d cluster create loopzero-build \
#     --k3s-arg "--kube-apiserver-arg=anonymous-auth=true@server:*"
#   # then re-bootstrap Sigstore stack (helm install fulcio + rekor)
#
# Effort: ~30min operator + ALL prior Sigstore state perdido
# Blast radius: loopzero-build cluster destruction + state loss
# Alternative paths:
#   (a) Fork fulcio chart 2.9.1 + adicionar extraEnv para SA token bearer
#   (b) Use Helm postRenderer kustomize patch para inject extraEnv
#   (c) Custom Fulcio image com built-in OIDC client config
#   (d) Wait for chart 2.10+ exposing extraEnv hook
#
# ─── Cenário A.1 fix (apply below se K3s anonymous-auth=true) ────────────
#
# Apply via:
#   KC=$(k3d kubeconfig write loopzero-build)
#   kubectl --kubeconfig="$KC" apply -f \
#     infra/pulumi-platform/values-fulcio-oidc-overrides/cenario-a-anonymous-discovery.yaml

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: service-account-issuer-discovery-anon
  labels:
    app.kubernetes.io/managed-by: loopzero-m07-fulcio-oidc-fix
    loopzero.io/plan: 2026-05-28-M07-fulcio-oidc-trust-to-3-85
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:unauthenticated
