# Scenario C — Issuer mismatch fix (M07 plan 2026-05-28 T2.1).
#
# Apply via:
#   KC=$(k3d kubeconfig write loopruntime-build)
#   helm --kubeconfig="$KC" upgrade fulcio sigstore/fulcio \
#     --version 2.9.1 -n sigstore-system --reuse-values \
#     -f infra/pulumi-platform/values-fulcio-oidc-overrides/scenario-c-issuer-mismatch.yaml
#
# Then verify:
#   kubectl --kubeconfig="$KC" -n sigstore-system get cm fulcio-server-config \
#     -o jsonpath='{.data.config\.json}' | jq '.OIDCIssuers'
#
# Should show 2 entries: original .cluster.local + new variant matching token iss.
#
# Replace <ACTUAL_ISS> below with value from /tmp/fulcio-diagnose-out/probe1-sa-token.json
# (jq -r .iss) BEFORE applying — otherwise no-op.

config:
  contents:
    # Existing canonical (preserved — additive, not replacement)
    OIDCIssuers:
      - ClientID: sigstore
        IssuerURL: https://kubernetes.default.svc.cluster.local
        Type: kubernetes
      # ADDED: K3s real issuer extracted from Phase 1 verdict.json
      # Common variants seen in K3s deployments:
      #   - https://kubernetes.default.svc (without .cluster.local)
      #   - https://kubernetes.default
      # Operator: replace below with EXACT value from probe1-sa-token.json .iss
      - ClientID: sigstore
        IssuerURL: https://kubernetes.default.svc
        Type: kubernetes
    MetaIssuers:
      - ClientID: sigstore
        IssuerURL: https://kubernetes.*.svc
        Type: kubernetes
