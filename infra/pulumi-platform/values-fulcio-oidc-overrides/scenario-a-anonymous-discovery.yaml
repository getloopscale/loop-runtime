# Scenario A — Anonymous discovery 401/403 fix (M07 plan 2026-05-28 T2.1)
#
# ⚠️ Ralph iter 5 LIVE TESTED (2026-05-28): APPLYING THIS ALONE IS INSUFFICIENT
# for K3s clusters with anonymous-auth=false (k3s 1.30+ default behavior).
#
# Two scenario variants identified LIVE:
#   A.1 — K3s `--anonymous-auth=true` + RBAC missing → ClusterRoleBinding fixes
#   A.2 — K3s `--anonymous-auth=false` → ClusterRoleBinding ALONE is not enough;
#         ALL endpoints return 401 (including /healthz, /livez), confirming
#         that anonymous requests are rejected at the AUTHENTICATION LEVEL,
#         before RBAC is even evaluated.
#
# LIVE VERIFY (Ralph iter 5):
#   kubectl run dual-test --rm -i --image=alpine/curl -- sh -c "
#     curl -sk -w 'STATUS=%{http_code}' --max-time 3 \
#       https://kubernetes.default.svc.cluster.local/healthz
#   "
#   If it returns 401 → Scenario A.2 (cluster-level config); the CRB below DOES NOT FIX IT.
#   If it returns 200 + curl /openid returns 401 → Scenario A.1; apply the CRB below.
#
# ─── Scenario A.2 fix (OPERATOR HARD STOP — high blast radius) ────────────
#
# Requires K3s cluster recreate with `--kube-apiserver-arg=anonymous-auth=true`:
#
#   k3d cluster delete loopruntime-build
#   k3d cluster create loopruntime-build \
#     --k3s-arg "--kube-apiserver-arg=anonymous-auth=true@server:*"
#   # then re-bootstrap Sigstore stack (helm install fulcio + rekor)
#
# Effort: ~30min operator + ALL prior Sigstore state lost
# Blast radius: loopruntime-build cluster destruction + state loss
# Alternative paths:
#   (a) Fork fulcio chart 2.9.1 + add extraEnv for the SA token bearer
#   (b) Use a Helm postRenderer kustomize patch to inject extraEnv
#   (c) Custom Fulcio image with built-in OIDC client config
#   (d) Wait for chart 2.10+ exposing extraEnv hook
#
# ─── Scenario A.1 fix (apply below if K3s anonymous-auth=true) ───────────
#
# Apply via:
#   KC=$(k3d kubeconfig write loopruntime-build)
#   kubectl --kubeconfig="$KC" apply -f \
#     infra/pulumi-platform/values-fulcio-oidc-overrides/scenario-a-anonymous-discovery.yaml

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: service-account-issuer-discovery-anon
  labels:
    app.kubernetes.io/managed-by: loopruntime-m07-fulcio-oidc-fix
    runtime.getloopscale.com/plan: 2026-05-28-M07-fulcio-oidc-trust-to-3-85
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:unauthenticated
