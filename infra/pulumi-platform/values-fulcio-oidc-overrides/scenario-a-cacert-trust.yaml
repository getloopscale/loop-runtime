# Scenario A — CACert Fix (M07 plan 2026-05-28-fulcio-cacert-keyless-LIVE v1.1)
#
# Research-1 (2026-05-28) finding: the Fulcio v1.8.6 OIDCIssuer config schema exposes
# a native CACert field (PEM-encoded CA cert) precisely for self-signed CA
# scenarios. Iter 1-9 failed to find that option upstream — it chased
# SSL_CERT_FILE env + extraVolumes mount + custom image, all wrong paths.
#
# Source: https://pkg.go.dev/github.com/sigstore/fulcio/pkg/config
# Quote: "CACert is an optional parameter that holds the CA certificate in PEM
# format. This is used to trust the TLS certificate signed by an internal CA
# when interacting with some OIDC providers, preventing x509 certificate
# verification failures."
#
# Apply via (after Phase -1 prereqs LIVE):
#   # Step 1: extract K3s server CA
#   docker exec k3d-loop-runtime-build-server-0 \
#     cat /var/lib/rancher/k3s/server/tls/server-ca.crt > /tmp/k3s-server-ca.pem
#
#   # Step 2: render this template with PEM inline (python — see plan T2.1)
#   # Output: /tmp/scenario-a-cacert-trust-rendered.yaml
#
#   # Step 3: helm upgrade --install (upsert idempotent)
#   helm --kubeconfig=$(k3d kubeconfig write loop-runtime-build) \
#     upgrade --install fulcio sigstore/fulcio --version 2.9.1 \
#     -n fulcio-system -f /tmp/scenario-a-cacert-trust-rendered.yaml
#
# Verify:
#   kubectl get cm fulcio-server-config -n fulcio-system \
#     -o jsonpath='{.data.config\.json}' | jq '.OIDCIssuers'
#   # Expected: an entry for kubernetes.default.svc.cluster.local with a CACert PEM field

config:
  contents:
    OIDCIssuers:
      - IssuerURL: https://kubernetes.default.svc.cluster.local
        ClientID: sigstore
        Type: kubernetes
        # CACert content injected at apply time (LIVE extract from K3s container).
        # Per Research-1: this resolves Fulcio go-oidc client TLS handshake
        # failure with K3s self-signed API server CA.
        CACert: |
          <K3S_SERVER_CA_PEM_PLACEHOLDER>
    MetaIssuers:
      - ClientID: sigstore
        IssuerURL: https://kubernetes.*.svc
        Type: kubernetes
