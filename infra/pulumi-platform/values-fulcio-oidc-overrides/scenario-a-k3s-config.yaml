# K3s config file for Scenario A.2 fix (M07 plan 2026-05-28 T2.2)
#
# Ralph iter 7 LIVE-validated (2026-05-28): K3s default `anonymous-auth=false`
# blocks Fulcio anonymous OIDC discovery. This config enables anonymous
# discovery endpoints + overrides jwks_uri to use DNS (not raw IP).
#
# Apply via (preserves cluster state — pods + PVCs + Helm releases survive
# container restart since K3s reads config.yaml at startup):
#
#   docker exec k3d-loopzero-build-server-0 sh -c 'cat > /etc/rancher/k3s/config.yaml' \
#     < infra/pulumi-platform/values-fulcio-oidc-overrides/scenario-a-k3s-config.yaml
#   docker restart k3d-loopzero-build-server-0
#   # Wait ~10s for k3s ready: kubectl get nodes
#
# Then apply Scenario A.1 RBAC (now effective):
#   KC=$(k3d kubeconfig write loopzero-build)
#   kubectl --kubeconfig="$KC" apply -f \
#     infra/pulumi-platform/values-fulcio-oidc-overrides/scenario-a-anonymous-discovery.yaml
#
# LIVE STATE post-apply (verified Ralph iter 7):
# - anonymous discovery endpoint: 200 OK (was 401)
# - jwks_uri: https://kubernetes.default.svc.cluster.local/openid/v1/jwks (was raw IP)
# - JWKS endpoint anonymous: 200 OK
#
# REMAINING BLOCKER (Ralph iter 7 unresolved):
# - Fulcio /api/v2/signingCert still returns 400 "error processing identity token"
# - SSL_CERT_FILE=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt patch
#   to Fulcio deploy did NOT resolve (rolled back)
# - Suspected: Fulcio v1.8.6 go-oidc client has independent cert pool
#   that doesn't honor SSL_CERT_FILE, OR there's an additional validation
#   step failing silently
# - Next investigation: kubectl debug ephemeral container with Fulcio image
#   + custom debug logging fork, OR upgrade Fulcio image to v1.9+ if available

kube-apiserver-arg:
  - "anonymous-auth=true"
  - "service-account-jwks-uri=https://kubernetes.default.svc.cluster.local/openid/v1/jwks"
