config:
  loopzero-infra:environment: prod
  loopzero-infra:provider: digitalocean
  loopzero-infra:region: nyc3
  loopzero-infra:domain: loopzero.example
  loopzero-infra:dnsZone: loopzero.example
  loopzero-infra:infraVersion: v1
  # Management cluster — platform services (ArgoCD, API, Traefik, cert-manager)
  loopzero-infra:mgmtK8sVersion: "1.33.9-do.3"
  loopzero-infra:mgmtNodeClass: medium
  loopzero-infra:mgmtMinNodes: "3"
  loopzero-infra:mgmtMaxNodes: "5"
  # Runtime cluster — user applications
  loopzero-infra:runtimeK8sVersion: "1.33.9-do.3"
  loopzero-infra:runtimeNodeClass: medium
  loopzero-infra:runtimeMinNodes: "3"
  loopzero-infra:runtimeMaxNodes: "6"
  # Build cluster — Argo Workflows + BuildKit
  loopzero-infra:buildK8sVersion: "1.33.9-do.3"
  loopzero-infra:buildNodeClass: medium
  loopzero-infra:buildMinNodes: "2"
  loopzero-infra:buildMaxNodes: "4"
  # Database — managed PostgreSQL HA
  loopzero-infra:dbNodeClass: medium
  loopzero-infra:dbVersion: "16"
  loopzero-infra:dbNodeCount: "3"
  # Secrets — MUST be set before first deploy:
  #   pulumi config set --secret spacesAccessKeyId <value> --stack prod
  #   pulumi config set --secret spacesSecretAccessKey <value> --stack prod
  #   pulumi config set --secret digitaloceanToken <value> --stack prod
  #   pulumi config set --secret giteaAdminPassword <strong-password> --stack prod
  #   pulumi config set --secret minioRootPassword <strong-password> --stack prod
  # Observability — Tempo trace storage (MEET-020)
  loopzero-infra:tempoStorageBucket: loopzero-traces
  # Cloudflare (required for CF Tunnel + static delivery):
  #   pulumi config set --secret cfApiToken <value> --stack prod
  #   pulumi config set cfAccountId <value> --stack prod
  #   pulumi config set cfZoneId <value> --stack prod
