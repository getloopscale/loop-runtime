config:
  loopruntime-infra:environment: prod
  loopruntime-infra:provider: digitalocean
  loopruntime-infra:region: nyc3
  loopruntime-infra:domain: getloopscale.com
  loopruntime-infra:dnsZone: getloopscale.com
  loopruntime-infra:infraVersion: v1
  # Management cluster — platform services (ArgoCD, API, Traefik, cert-manager)
  loopruntime-infra:mgmtK8sVersion: "1.33.9-do.4"
  loopruntime-infra:mgmtNodeClass: medium
  loopruntime-infra:mgmtMinNodes: "3"
  loopruntime-infra:mgmtMaxNodes: "5"
  # Runtime cluster — user applications
  loopruntime-infra:runtimeK8sVersion: "1.33.9-do.4"
  loopruntime-infra:runtimeNodeClass: medium
  loopruntime-infra:runtimeMinNodes: "3"
  loopruntime-infra:runtimeMaxNodes: "6"
  # Build cluster — Argo Workflows + BuildKit
  loopruntime-infra:buildK8sVersion: "1.33.9-do.4"
  loopruntime-infra:buildNodeClass: medium
  loopruntime-infra:buildMinNodes: "2"
  loopruntime-infra:buildMaxNodes: "4"
  # Database — managed PostgreSQL HA
  loopruntime-infra:dbNodeClass: medium
  loopruntime-infra:dbVersion: "16"
  loopruntime-infra:dbNodeCount: "3"
  # Secrets — MUST be set before first deploy:
  #   pulumi config set --secret spacesAccessKeyId <value> --stack prod
  #   pulumi config set --secret spacesSecretAccessKey <value> --stack prod
  #   pulumi config set --secret digitaloceanToken <value> --stack prod
  #   pulumi config set --secret giteaAdminPassword <strong-password> --stack prod
  #   pulumi config set --secret minioRootPassword <strong-password> --stack prod
  # Observability — Tempo trace storage (MEET-020)
  loopruntime-infra:tempoStorageBucket: loopruntime-traces
  # Cloudflare (required for CF Tunnel + static delivery):
  #   pulumi config set --secret cfApiToken <value> --stack prod
  #   pulumi config set cfAccountId <value> --stack prod
  #   pulumi config set cfZoneId <value> --stack prod
  #
  # OpenBao auto-unseal (F1.1 of plan 2026-06-02-openbao-adoption v1.2).
  # Opt-in. When enabled, creates AWS KMS key + IAM user openbao-unseal in
  # the AWS profile configured for this Pulumi run. Operator must have
  # AWS_PROFILE=loopruntime-openbao OR equivalent active. See:
  #   MEET-ASYNC-AMENDMENT-2026-06-02-001-openbao-f1-execution.md (Q2-F1)
  # The bootstrap user openbao-pulumi-bootstrap (perms to create the
  # resources) is operator-time, NOT Pulumi-managed.
  #
  # Enable (when ready for F1.1):
  #   pulumi config set openbaoEnabled true --stack prod
  # Optional region override (default us-east-1):
  #   pulumi config set openbaoAwsRegion us-east-1 --stack prod
  # openbaoEnabled: false  # default — set via CLI when ready
  loopruntime-infra:spacesAccessKeyId:
    secure: v1:YELG+/CfjKtksJaj:uCcqvIbxrcCMig/A3yc0wg6oKa4UxAEzYKB4H3X91z/wRc2R
  loopruntime-infra:spacesSecretAccessKey:
    secure: v1:/mxsWf7LEWCGOzSO:h5TyKQHT953kV8BgLkR+zplKs6SZRvyGcyNMc8MU0N8siqwDU9sBl3tLoAyNb8dnJ5t5yr6j3uYCXYg=
  loopruntime-infra:digitaloceanToken:
    secure: v1:SFEFqglTquk0LvnJ:XHaI5dI65mH+r2wMOT22mflTItIHYilfLTMb671d+zkscbZb4xxv8smXckk2AzSJo++Cm84kSxKPJmdMETeDDayYAmtEIN2wtMnkp5x3fH0gnizx+IHe
  loopruntime-infra:cfApiToken:
    secure: v1:pwfm0eDR0K/DnO1c:UnFrcx5ZJ8IfpDN4W6zt+1bdlKFdP68yPGUTZbYLl+HNuZ+UIE+ogGnIlPfcGPbS8Xi5MTASpEgBelDg+NuRBkzeVhDx
encryptionsalt: v1:61WYd0xVlaQ=:v1:FWU8qAcf/IyAODRU:ucm7lhQepqVqbcvDZAMAogljf4/xBA==
