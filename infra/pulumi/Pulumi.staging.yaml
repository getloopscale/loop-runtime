config:
  loopzero-infra:environment: staging
  loopzero-infra:provider: digitalocean
  loopzero-infra:region: nyc3
  loopzero-infra:domain: staging.loopzero.example
  loopzero-infra:dnsZone: loopzero.example
  loopzero-infra:infraVersion: v1

  # Management cluster
  loopzero-infra:mgmtK8sVersion: "1.32.13-do.0"
  loopzero-infra:mgmtNodeClass: small
  loopzero-infra:mgmtMinNodes: "2"
  loopzero-infra:mgmtMaxNodes: "3"

  # Runtime cluster
  loopzero-infra:runtimeK8sVersion: "1.32.13-do.0"
  loopzero-infra:runtimeNodeClass: small
  loopzero-infra:runtimeMinNodes: "2"
  loopzero-infra:runtimeMaxNodes: "4"

  # Runners
  loopzero-infra:runnerNodeClass: small
  loopzero-infra:runnerCount: "2"

  # Database
  loopzero-infra:dbNodeClass: small
  loopzero-infra:dbVersion: "16"
  loopzero-infra:dbNodeCount: "1"
