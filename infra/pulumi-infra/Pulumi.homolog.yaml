config:
  loopzero-infra:environment: homolog
  loopzero-infra:provider: digitalocean
  loopzero-infra:region: nyc3
  loopzero-infra:domain: homolog.loopzero.example
  loopzero-infra:dnsZone: loopzero.example
  loopzero-infra:infraVersion: v3
  # VPC CIDR — must not overlap with dev (10.20.0.0/16 in sfo3)
  loopzero-infra:vpcCidr: "10.30.0.0/16"
  # Topology — minimal sizing for validation
  loopzero-infra:topology:
    mgmt:
      - id: mgmt-default
        region: nyc3
        nodeClass: small
        minNodes: 2
        maxNodes: 2
    build:
      - id: build-default
        region: nyc3
        nodeClass: small
        minNodes: 2
        maxNodes: 3
    runtime:
      - id: runtime-default
        cellId: cell-default
        region: nyc3
        nodeClass: small
        minNodes: 2
        maxNodes: 2
      # Second runtime — validates multi-cell topology
      - id: runtime-nyc3-02
        cellId: cell-nyc3-02
        region: nyc3
        nodeClass: small
        minNodes: 2
        maxNodes: 2
  # Database — minimal
  loopzero-infra:dbNodeClass: small
  loopzero-infra:dbVersion: "16"
  loopzero-infra:dbNodeCount: "1"
  # Cloudflare DNS zone
  loopzero-infra:cfZoneId: "9f9a41bef0bcb7adf15969c81c303bef"
  # Secrets — set via: pulumi config set --secret <key> <value> --stack homolog
  # loopzero-infra:spacesAccessKeyId
  # loopzero-infra:spacesSecretAccessKey
  # loopzero-infra:digitaloceanToken

  loopzero-infra:spacesAccessKeyId:
    secure: v1:TXnWzbACmwh5oBy5:8qWc7JaYA6n90lM04z4VE4alFoWdEgiYlm5A3FWgWjL84Irt
  loopzero-infra:spacesSecretAccessKey:
    secure: v1:HZr0NQm5pnqwPw3G:M3NUuFxonYsvmSWfgtGUNwZqmu4ZDkWKKQXrrCMT9Nv0myk85FT9oN7zEJHuUctDgyJmm7K3QW474ZQ=
  loopzero-infra:digitaloceanToken:
