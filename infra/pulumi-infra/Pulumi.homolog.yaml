config:
  loopzero-infra:environment: homolog
  loopzero-infra:provider: digitalocean
  loopzero-infra:region: nyc3
  loopzero-infra:domain: homolog.loopzero.example
  loopzero-infra:dnsZone: loopzero.example
  loopzero-infra:infraVersion: v3
  # VPC CIDR — must not overlap with dev (10.20.0.0/16 in sfo3)
  loopzero-infra:vpcCidr: "10.30.0.0/16"
  # Topology — 2 clusters only (DO account limit: 5, dev uses 3)
  # mgmt+build share one cluster. Runtime is separate.
  # The provisioner deduplicates entries with the same id.
  loopzero-infra:topology:
    mgmt:
      - id: combo-mgmt-build
        region: nyc3
        nodeClass: small
        minNodes: 2
        maxNodes: 3
    build:
      - id: combo-mgmt-build
        region: nyc3
        nodeClass: small
        minNodes: 2
        maxNodes: 3
    runtime:
      - id: runtime-nyc3
        cellId: cell-default
        region: nyc3
        nodeClass: small
        minNodes: 2
        maxNodes: 2
  # Database — minimal
  loopzero-infra:dbNodeClass: small
  loopzero-infra:dbVersion: "16"
  loopzero-infra:dbNodeCount: "1"
  # Cloudflare DNS zone
  loopzero-infra:cfZoneId: "9f9a41bef0bcb7adf15969c81c303bef"
  loopzero-infra:spacesAccessKeyId:
    secure: v1:r4lfPQJPwn5w5A9d:FGY0RoaBh3VtWCZYzdq4e9R1PK3JjPflZqzT3AtHXmWKNony
  loopzero-infra:spacesSecretAccessKey:
    secure: v1:PHLA+XnnDrkosK06:pAWBor/MMXk4gf92z/YNWCrtI4smnKHRpUZ1FnLj57MNz7VMQWt/3JxD//oII8myzI6t8duMI8qP8RE=
  loopzero-infra:digitaloceanToken:
    secure: v1:pdierZpOYqQ8dEsy:QvTZpZZIM5B1WZs6XRK637kjfBnT6H6Ko1GctPlRONq+zWe47tHnvF/c3PXUoGcIHGcdBIjMY75KuDs7gu8+8BgEt16dPg0wavXTcYw6iTWn5snevNgr
encryptionsalt: v1:EMy3Tx0UFnE=:v1:HMgAvOY1LdhhgWyc:tZcI2cYFpPNSxkIC/KhUzeGPqxv2Mg==
