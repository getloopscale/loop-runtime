config:
  loopzero-infra:environment: dev
  loopzero-infra:provider: digitalocean
  loopzero-infra:region: sfo3
  loopzero-infra:domain: dev.loopzero.example
  loopzero-infra:dnsZone: loopzero.example
  loopzero-infra:infraVersion: v3
  # Management cluster
  loopzero-infra:mgmtK8sVersion: "1.32.13-do.2"
  loopzero-infra:mgmtNodeClass: small
  loopzero-infra:mgmtMinNodes: "3"
  loopzero-infra:mgmtMaxNodes: "3"
  # Runtime cluster
  loopzero-infra:runtimeK8sVersion: "1.32.13-do.2"
  loopzero-infra:runtimeNodeClass: small
  loopzero-infra:runtimeMinNodes: "2"
  loopzero-infra:runtimeMaxNodes: "3"
  # Build cluster
  loopzero-infra:buildK8sVersion: "1.32.13-do.2"
  loopzero-infra:buildNodeClass: medium
  loopzero-infra:buildMinNodes: "2"
  loopzero-infra:buildMaxNodes: "5"
  # Database
  loopzero-infra:dbNodeClass: small
  loopzero-infra:dbVersion: "16"
  loopzero-infra:dbNodeCount: "2"
  # Cloudflare DNS zone (NS is Cloudflare)
  loopzero-infra:cfZoneId: "9f9a41bef0bcb7adf15969c81c303bef"
  # Secrets — set via: pulumi config set --secret <key> <value>
  # loopzero-infra:spacesAccessKeyId
  # loopzero-infra:spacesSecretAccessKey
  # loopzero-infra:digitaloceanToken
