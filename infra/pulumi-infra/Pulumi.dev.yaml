config:
  loop-runtime-infra:environment: dev
  loop-runtime-infra:provider: digitalocean
  loop-runtime-infra:region: sfo3
  loop-runtime-infra:domain: dev.getloopscale.com
  loop-runtime-infra:dnsZone: getloopscale.com
  loop-runtime-infra:infraVersion: v3
  # Management cluster
  loop-runtime-infra:mgmtK8sVersion: "1.32.13-do.2"
  loop-runtime-infra:mgmtNodeClass: small
  loop-runtime-infra:mgmtMinNodes: "3"
  loop-runtime-infra:mgmtMaxNodes: "3"
  # Runtime cluster
  # Sizing notes (2026-04-16, L2 validation):
  #   - s-2vcpu-4gb × 3 nodes = ~4.8 vCPU usable after system reserves.
  #   - L2 (50 tenants, hello-server) needs ~5 vCPU for 50 pods simultaneous.
  #   - Previous maxNodes=3 → 9 pods Pending with NotTriggerScaleUp.
  #   - Bumped to 6 so autoscaler can reach ~9.6 vCPU for L2 headroom.
  # For L3+ (100+ tenants) this must be re-sized. See scale-50k-plan.
  loop-runtime-infra:runtimeK8sVersion: "1.32.13-do.2"
  loop-runtime-infra:runtimeNodeClass: small
  loop-runtime-infra:runtimeMinNodes: "2"
  loop-runtime-infra:runtimeMaxNodes: "6"
  # Build cluster
  loop-runtime-infra:buildK8sVersion: "1.32.13-do.2"
  loop-runtime-infra:buildNodeClass: medium
  loop-runtime-infra:buildMinNodes: "2"
  loop-runtime-infra:buildMaxNodes: "5"
  # Database
  loop-runtime-infra:dbNodeClass: small
  loop-runtime-infra:dbVersion: "16"
  loop-runtime-infra:dbNodeCount: "2"
  # Cloudflare DNS zone (NS is Cloudflare)
  loop-runtime-infra:cfZoneId: "9f9a41bef0bcb7adf15969c81c303bef"
  # Secrets — set via: pulumi config set --secret <key> <value>
  # loop-runtime-infra:spacesAccessKeyId
  # loop-runtime-infra:spacesSecretAccessKey
  # loop-runtime-infra:digitaloceanToken

  loop-runtime-infra:spacesAccessKeyId:
    secure: v1:4e0tzPc5wYsLbaJR:lzHZldHAEa1KrnuQrBde+irPDOM8dOH+BTxu7fgrEKgkArL+
  loop-runtime-infra:spacesSecretAccessKey:
    secure: v1:824DDwLvLKLQTbNP:mKAG0UauASVH4vgL7GJxqeWxspG0wiy8xHv6oj2beKJqPMHJaoOicaDxfJEF5p9j66oPs7g3eZW2aKQ=
  loop-runtime-infra:digitaloceanToken:
