<title>As-is and To-be</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#eef1f5; --paper-2:#fff; --paper-3:#e6ebf1; --grid:#d9e0e8;
  --ink:#161d28; --ink-2:#4e5b6e; --ink-3:#7a8698;
  --rule:#d2d9e3; --rule-2:#bcc6d4;
  --bad:#8a3a52; --bad-s:rgba(138,58,82,.10); --bad-b:rgba(138,58,82,.38);
  --good:#2c6a4d; --good-s:rgba(44,106,77,.10); --good-b:rgba(44,106,77,.36);
  --st-approved:#2c6a4d; --st-planned:#9c5b16; --st-unplanned:#8a3a52;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1218; --paper-2:#161c25; --paper-3:#1c232d; --grid:#1e2630;
  --ink:#e6ebf2; --ink-2:#9aa7b9; --ink-3:#6d7a8c;
  --rule:#242d39; --rule-2:#33404f;
  --bad:#dd7f9c; --bad-s:rgba(221,127,156,.12); --bad-b:rgba(221,127,156,.40);
  --good:#6cc298; --good-s:rgba(108,194,152,.12); --good-b:rgba(108,194,152,.38);
  --st-approved:#6cc298; --st-planned:#dd9d55; --st-unplanned:#dd7f9c;
}}
:root[data-theme="dark"]{
  --paper:#0e1218; --paper-2:#161c25; --paper-3:#1c232d; --grid:#1e2630;
  --ink:#e6ebf2; --ink-2:#9aa7b9; --ink-3:#6d7a8c;
  --rule:#242d39; --rule-2:#33404f;
  --bad:#dd7f9c; --bad-s:rgba(221,127,156,.12); --bad-b:rgba(221,127,156,.40);
  --good:#6cc298; --good-s:rgba(108,194,152,.12); --good-b:rgba(108,194,152,.38);
  --st-approved:#6cc298; --st-planned:#dd9d55; --st-unplanned:#dd7f9c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
#root{width:100vw;height:100vh}

.frame{width:100%;height:100%;border:1px solid var(--rule);border-radius:8px;background:var(--paper-2)}

.colhd{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;
  padding:0 4px;border-bottom:2px solid var(--rule-2)}
.colhd strong{font-family:Newsreader,Georgia,serif;font-size:23px;font-weight:500;letter-spacing:.02em}
.colhd span{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);margin-top:2px}
.c-as{border-bottom-color:var(--ink-3)}
.c-tb{border-bottom-color:var(--st-planned)}
.c-tb strong{color:var(--ink)}

.rowhd{width:100%;height:100%;display:flex;align-items:flex-end}
.rowhd span{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--rule);
  width:100%;padding-bottom:4px}

.stack{width:100%;height:100%}
.cell{width:100%;height:100%;display:flex;align-items:center;padding:0 11px;
  border:1px solid var(--rule);border-radius:3px;background:var(--paper);
  font-family:"IBM Plex Mono",monospace;font-size:11px;line-height:1.25;color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-bad{border-color:var(--bad-b);background:var(--bad-s);color:var(--ink)}
.t-good{border-color:var(--good-b);background:var(--good-s);color:var(--ink)}
.sd-a.t-bad{border-left:2px solid var(--bad)}
.sd-b.t-good{border-left:2px solid var(--good)}

.delta{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;
  padding:9px 12px;border-radius:4px;border:1px dashed var(--rule-2);background:var(--paper-2)}
.delta p{margin:0 0 5px;font-family:Newsreader,Georgia,serif;font-size:13px;
  line-height:1.35;color:var(--ink)}
.delta span{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.05em}
.st-approved{border-color:var(--st-approved)} .st-approved span{color:var(--st-approved)}
.st-planned{border-color:var(--st-planned)}   .st-planned span{color:var(--st-planned)}
.st-unplanned{border-color:var(--st-unplanned);border-style:solid;border-width:1.5px}
.st-unplanned span{color:var(--st-unplanned)}

.panel{position:fixed;right:16px;top:16px;width:340px;max-height:calc(100vh - 32px);
  overflow-y:auto;background:var(--paper-2);border:1px solid var(--rule);border-radius:6px;
  padding:17px 19px;font-size:12px;z-index:20}
.phd{display:flex;flex-direction:column;gap:3px;padding-bottom:12px;
  border-bottom:1px solid var(--rule);margin-bottom:12px}
.phd strong{font-family:Newsreader,Georgia,serif;font-size:19px;font-weight:500}
.phd span{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3)}
.intro{margin:0 0 14px;font-size:11.5px;line-height:1.6;color:var(--ink-2)}
.intro b{color:var(--ink)} .intro em{font-style:italic}
.srow{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--rule)}
.sm{width:22px;height:2px;margin-top:8px;flex:none;border-radius:1px}
.sm.st-approved{background:var(--st-approved)}
.sm.st-planned{background:var(--st-planned)}
.sm.st-unplanned{background:var(--st-unplanned)}
.srow b{font-size:11.5px} .srow p{margin:1px 0 0;font-size:10.5px;line-height:1.5;color:var(--ink-3)}
.alert{margin-top:14px;padding:13px 14px;border-left:2px solid var(--st-unplanned);
  background:var(--bad-s);border-radius:0 3px 3px 0}
.alert strong{font-size:12px;display:block;margin-bottom:6px}
.alert p{margin:0 0 7px;font-size:10.5px;line-height:1.55;color:var(--ink-2)}
.alert p:last-child{margin-bottom:0}
.alert b{color:var(--ink)} .alert code{font-family:"IBM Plex Mono",monospace;font-size:9.5px}
.foot{margin:13px 0 0;padding-top:12px;border-top:1px solid var(--rule);
  font-size:10px;line-height:1.55;color:var(--ink-3)}
.foot b{color:var(--ink-2)} .foot em{font-style:italic}

.react-flow__controls button{background:var(--paper-2)!important;border-color:var(--rule)!important;fill:var(--ink-2)!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
