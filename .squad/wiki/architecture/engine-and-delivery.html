<title>Engine and Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#eef1f5; --paper-2:#fff; --paper-3:#e6ebf1; --grid:#d7dee7;
  --ink:#161d28; --ink-2:#4e5b6e; --ink-3:#7a8698;
  --rule:#d2d9e3; --rule-2:#bcc6d4;
  --ok:#2c6a4d; --warn:#9c5b16; --build:#8a3a52; --out:#8a92a0;
  --ok-s:rgba(44,106,77,.09); --warn-s:rgba(156,91,22,.09);
  --build-s:rgba(138,58,82,.09); --out-s:rgba(138,146,160,.08);
  --edge:#8e9aab;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1218; --paper-2:#161c25; --paper-3:#1c232d; --grid:#212a35;
  --ink:#e6ebf2; --ink-2:#9aa7b9; --ink-3:#6d7a8c;
  --rule:#242d39; --rule-2:#33404f;
  --ok:#6cc298; --warn:#dd9d55; --build:#dd7f9c; --out:#67717f;
  --ok-s:rgba(108,194,152,.11); --warn-s:rgba(221,157,85,.11);
  --build-s:rgba(221,127,156,.11); --out-s:rgba(103,113,127,.10);
  --edge:#5c6a7d;
}}
:root[data-theme="dark"]{
  --paper:#0e1218; --paper-2:#161c25; --paper-3:#1c232d; --grid:#212a35;
  --ink:#e6ebf2; --ink-2:#9aa7b9; --ink-3:#6d7a8c;
  --rule:#242d39; --rule-2:#33404f;
  --ok:#6cc298; --warn:#dd9d55; --build:#dd7f9c; --out:#67717f;
  --ok-s:rgba(108,194,152,.11); --warn-s:rgba(221,157,85,.11);
  --build-s:rgba(221,127,156,.11); --out-s:rgba(103,113,127,.10);
  --edge:#5c6a7d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
#root{width:100vw;height:100vh}

.region{width:100%;height:100%;border:1px solid var(--rule-2);border-radius:7px;
  background:var(--paper-2);opacity:.5}
.region.t-deliver{border-style:dashed}
.rhd{padding:24px 30px}
.rhd h2{font-family:Newsreader,Georgia,serif;font-size:30px;font-weight:500;
  letter-spacing:-.015em;margin:0 0 7px;color:var(--ink)}
.rhd p{margin:0;font-size:13px;line-height:1.55;color:var(--ink-2);max-width:74ch}

.comp{width:100%;height:100%;border:1px solid var(--rule);border-radius:5px;background:var(--paper-2)}
.comp.k-gap{border-color:var(--build);background:var(--build-s)}
.comp.k-block{border-width:2px;border-color:var(--rule-2)}
.chd{padding:13px 14px 0}
.chd h3{font-size:14.5px;font-weight:600;margin:0 0 3px;letter-spacing:-.01em}
.chd p{margin:0;font-size:10.5px;line-height:1.4;color:var(--ink-3)}
.cn{position:absolute;top:13px;right:14px;font-family:"IBM Plex Mono",monospace;
  font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cn em{font-style:normal;color:var(--out)}

.chip{width:100%;height:100%;display:flex;align-items:center;gap:6px;padding:0 8px;
  border:1px solid var(--rule);border-radius:3px;background:var(--paper);
  font-family:"IBM Plex Mono",monospace;font-size:10px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{width:5px;height:5px;border-radius:50%;flex:none}
.s-ready{border-left:2px solid var(--ok);background:var(--ok-s)}   .s-ready .cd{background:var(--ok)}
.s-modify{border-left:2px solid var(--warn);background:var(--warn-s)} .s-modify .cd{background:var(--warn)}
.s-build{border-left:2px solid var(--build);background:var(--build-s)} .s-build .cd{background:var(--build)}
.s-out{border-left:2px solid var(--out);background:var(--out-s);color:var(--ink-3);
  text-decoration:line-through;text-decoration-color:var(--out)} .s-out .cd{background:var(--out)}

.panel{position:fixed;left:16px;top:16px;width:346px;max-height:calc(100vh - 32px);
  overflow-y:auto;background:var(--paper-2);border:1px solid var(--rule);border-radius:6px;
  padding:17px 19px;font-size:12px;z-index:20}
.phd{display:flex;flex-direction:column;gap:3px;padding-bottom:12px;
  border-bottom:1px solid var(--rule);margin-bottom:12px}
.phd strong{font-family:Newsreader,Georgia,serif;font-size:19px;font-weight:500}
.phd span{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3)}
.keys{display:flex;flex-wrap:wrap;gap:7px 12px;margin-bottom:14px}
.legend-swatch{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-2)}
.legend-swatch i{width:9px;height:9px;border-radius:2px;display:block}
.sec{padding-top:13px;border-top:1px solid var(--rule);margin-bottom:13px}
.sec > strong{font-family:Newsreader,Georgia,serif;font-size:15px;font-weight:500;
  display:block;margin-bottom:5px}
.lead{margin:0 0 11px;font-size:11px;color:var(--ink-2);line-height:1.5}
.fnd{margin-bottom:11px;padding-left:11px;border-left:2px solid var(--build)}
.ft{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--build)}
.fnd code{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  line-height:1.45;color:var(--ink);background:var(--paper-3);padding:5px 7px;
  border-radius:2px;margin:4px 0 5px;word-break:break-all}
.fnd p{margin:0;font-size:10.5px;line-height:1.5;color:var(--ink-2)}
.scope{display:grid;grid-template-columns:34px 1fr;gap:4px 10px;align-items:baseline}
.sr{display:contents}
.sr b{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;
  text-align:right;font-variant-numeric:tabular-nums}
.sr span{font-size:10.5px;color:var(--ink-2);line-height:1.45}
.foot{margin:0;padding-top:12px;border-top:1px solid var(--rule);
  font-size:10px;line-height:1.55;color:var(--ink-3)}
.foot b{color:var(--ink-2)}

.react-flow__minimap{background:var(--paper-2)!important;border:1px solid var(--rule)!important;border-radius:4px!important}
.react-flow__controls button{background:var(--paper-2)!important;border-color:var(--rule)!important;fill:var(--ink-2)!important}
@media (prefers-reduced-motion:reduce){.react-flow__edge-path{animation:none!important}}
</style>
