<title>LoopZero Target Solution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#eef1f5; --paper-2:#fff; --grid:#d7dee7;
  --ink:#161d28; --ink-2:#4e5b6e; --ink-3:#7a8698;
  --rule:#d2d9e3; --rule-2:#bcc6d4;
  --ok:#2c6a4d; --warn:#9c5b16; --build:#8a3a52;
  --ok-s:rgba(44,106,77,.08); --warn-s:rgba(156,91,22,.08); --build-s:rgba(138,58,82,.08);
  --edge:#8e9aab; --seam:#9c5b16;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1218; --paper-2:#161c25; --grid:#212a35;
  --ink:#e6ebf2; --ink-2:#9aa7b9; --ink-3:#6d7a8c;
  --rule:#242d39; --rule-2:#33404f;
  --ok:#6cc298; --warn:#dd9d55; --build:#dd7f9c;
  --ok-s:rgba(108,194,152,.10); --warn-s:rgba(221,157,85,.10); --build-s:rgba(221,127,156,.10);
  --edge:#5c6a7d; --seam:#dd9d55;
}}
:root[data-theme="dark"]{
  --paper:#0e1218; --paper-2:#161c25; --grid:#212a35;
  --ink:#e6ebf2; --ink-2:#9aa7b9; --ink-3:#6d7a8c;
  --rule:#242d39; --rule-2:#33404f;
  --ok:#6cc298; --warn:#dd9d55; --build:#dd7f9c;
  --ok-s:rgba(108,194,152,.10); --warn-s:rgba(221,157,85,.10); --build-s:rgba(221,127,156,.10);
  --edge:#5c6a7d; --seam:#dd9d55;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
#root{width:100vw;height:100vh}

.region{width:100%;height:100%;border:1px solid var(--rule-2);border-radius:6px;
  background:var(--paper-2);opacity:.55}
.region-hd{padding:22px 26px}
.region-hd h2{font-family:Newsreader,Georgia,serif;font-size:26px;font-weight:500;
  letter-spacing:-.01em;margin:0 0 6px;color:var(--ink)}
.region-hd p{margin:0;font-size:12.5px;line-height:1.5;color:var(--ink-2);max-width:62ch}

.piece{width:100%;height:100%;border:1px solid var(--rule);border-radius:4px;
  background:var(--paper-2)}
.piece-hd{padding:12px 12px 0}
.pid{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;color:var(--ink-3)}
.piece-hd h3{font-size:14px;font-weight:600;margin:3px 0 4px;letter-spacing:-.01em;line-height:1.25}
.preqs{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3)}
.bar{display:flex;gap:2px;height:3px;margin-top:9px;border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%}

.item{width:100%;height:100%;display:flex;align-items:center;gap:8px;
  padding:5px 9px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);
  font-size:11px;line-height:1.3}
.item .dot{width:6px;height:6px;border-radius:50%;flex:none}
.st-ready{border-left:2px solid var(--ok);background:var(--ok-s)}
.st-ready .dot{background:var(--ok)}
.st-modify{border-left:2px solid var(--warn);background:var(--warn-s)}
.st-modify .dot{background:var(--warn)}
.st-build{border-left:2px solid var(--build);background:var(--build-s)}
.st-build .dot{background:var(--build)}
.item .txt{display:flex;flex-direction:column;min-width:0;flex:1}
.nm{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:500;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds{font-size:9.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font-family:"IBM Plex Mono",monospace;font-size:8.5px;color:var(--ink-3);
  max-width:96px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}

.legend{position:fixed;left:16px;bottom:16px;width:322px;max-height:calc(100vh - 32px);
  overflow-y:auto;background:var(--paper-2);border:1px solid var(--rule);border-radius:5px;
  padding:16px 18px;font-size:12px;z-index:20}
.lg-hd{display:flex;flex-direction:column;gap:3px;margin-bottom:13px;
  padding-bottom:11px;border-bottom:1px solid var(--rule)}
.lg-hd strong{font-family:Newsreader,Georgia,serif;font-size:17px;font-weight:500}
.lg-hd span{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3)}
.lg-row{display:flex;align-items:center;gap:9px;padding:3px 0}
.sw{width:11px;height:11px;border-radius:2px;flex:none}
.lg-n{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;
  min-width:24px;font-variant-numeric:tabular-nums}
.lg-l{color:var(--ink-2);font-size:11.5px}
.lg-note{margin:11px 0 0;padding-top:11px;border-top:1px solid var(--rule);
  font-size:10.5px;line-height:1.55;color:var(--ink-2)}
.lg-note b{color:var(--ink)}
.lg-slices{margin-top:13px;padding-top:12px;border-top:1px solid var(--rule)}
.lg-slices strong{font-family:Newsreader,Georgia,serif;font-size:14px;font-weight:500;
  display:block;margin-bottom:8px}
.sl{display:grid;grid-template-columns:22px 1fr 30px;gap:7px;align-items:baseline;padding:2.5px 0}
.sn{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3);
  border:1px solid var(--rule-2);border-radius:2px;text-align:center;padding:1px 0}
.sn.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-s)}
.sd{font-size:10px;color:var(--ink-2);line-height:1.35}
.sg{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--ink-3);text-align:right}

.react-flow__minimap{background:var(--paper-2)!important;border:1px solid var(--rule)!important;
  border-radius:4px!important}
.react-flow__controls button{background:var(--paper-2)!important;border-color:var(--rule)!important;
  fill:var(--ink-2)!important}
@media (prefers-reduced-motion:reduce){.react-flow__edge-path{animation:none!important}}
</style>
