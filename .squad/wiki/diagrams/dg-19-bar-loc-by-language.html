  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
    .caption { margin-top: 1.25rem; padding-top: 0.75rem; border-top: 1px solid rgba(45,49,66,0.12);
      font-family: var(--font-mono); font-size: 0.62rem; line-height: 1.9; color: var(--color-muted); }
    .caption span { display: block; }
  </style>
