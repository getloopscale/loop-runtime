    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;

  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Nested - DG-13</p>
    <h1>What contains what - from the repository down to one adapter</h1>
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nested-title nested-desc">
      <title id="nested-title">What contains what - from the repository down to one adapter</title>
      <desc id="nested-desc">Four levels of measured containment. Each ring is a parent_key relation: the repository holds the api module, which holds the buildplane package group, which holds the Argo adapter that submits the Workflow.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        <marker id="tri-hollow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/></marker>
        <marker id="dia-filled" markerWidth="14" markerHeight="8" refX="13" refY="4" orient="auto"><polygon points="0 4, 7 0, 14 4, 7 8" fill="#2d3142"/></marker>

      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect x="120" y="96" width="1040" height="480" rx="8" fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/><rect x="144" y="90" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="176.0" y="99" fill="rgba(45,49,66,0.5)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">REPOSITORY</text><rect x="176" y="152" width="928" height="368" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.45)" stroke-width="1"/><rect x="200" y="146" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="228.0" y="155" fill="rgba(45,49,66,0.5)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">GO MODULE</text><rect x="232" y="208" width="816" height="256" rx="8" fill="rgba(45,49,66,0.025)" stroke="#4f5d75" stroke-width="1"/><rect x="256" y="202" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="294.0" y="211" fill="rgba(45,49,66,0.5)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">PACKAGE GROUP</text><rect x="288" y="264" width="704" height="144" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><rect x="312" y="258" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="336.0" y="267" fill="#eb6c36" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">ADAPTER</text>
      
      <text x="144" y="132" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">LoopZero engine</text><text x="144" y="150" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">loopzero</text><text x="200" y="188" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">API module</text><text x="200" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">mod.api</text><text x="256" y="244" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">buildplane</text><text x="256" y="262" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">api.buildplane</text><text x="312" y="300" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">buildplane/argo</text><text x="312" y="318" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">api.buildplane.argo</text><text x="316" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">submits the Argo Workflow CR to the build cluster</text>
      <line x1="40" y1="656" x2="1240" y2="656" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="40" y="672" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><rect x="116" y="664" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/><text x="140" y="673" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">innermost scope</text><rect x="244" y="664" width="16" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="#4f5d75" stroke-width="1"/><text x="268" y="673" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">containing scope</text><line x1="376" y1="669" x2="392" y2="669" stroke="#4f5d75" stroke-width="1.2"/><text x="400" y="673" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">outer = broader, inner = more specific</text>
    </svg>
    <p class="caption"><span>Source: 160 `contains` relations and 166 components declaring a parent; one 4-level chain drawn - the type&#x27;s level cap is 6 and its anti-pattern is content that is not part of the hierarchy.</span></p>
