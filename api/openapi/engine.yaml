# SPDX-License-Identifier: Apache-2.0
# Copyright 2025-2026 The LoopRuntime Authors
#
# LoopRuntime Engine — public HTTP contract (OpenAPI 3.0.3).
# M1.4 (plan m1-4-openapi-contract-tests) started this CONSUMER-DRIVEN (cli/cloud
# routes only). M11 (plan m11-api-validation) SUPERSEDES that scope: this spec now
# documents 100% of the public /api/v1 router surface — enforced by
# TestEngineConformance_RouterRoutesAreDocumented (every registered /api/v1 route
# is documented) alongside SpecPathsAreRegistered (no phantom spec), giving
# bijective coverage. Only /internal/* routes stay excluded — they are service-auth
# internal, not part of the public consumer contract. Source of truth for paths:
# api/internal/server/router.go (+ helper registrations in api/internal/routes/).
openapi: 3.0.3
info:
  title: LoopRuntime Engine API
  version: "1.0.0"
  description: >
    Consumer-facing surface of the LoopRuntime engine consumed across the
    decomposition seams (cli ↔ engine, cloud ↔ engine). Frozen here so the
    M2/M3 extractions can be validated against a machine-checkable contract.

servers:
- url: /
  description: engine root (relative; consumers supply the base URL)

tags:
- name: meta
- name: auth
- name: projects
- name: builds
- name: secrets
- name: environments
- name: domains
- name: billing
- name: teams
- name: audit
- name: source
- name: admin

paths:
  /api/v1/health:
    get:
      tags: [meta]
      summary: Liveness probe
      responses:
        "200":
          description: service healthy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}

  /api/v1/version:
    get:
      tags: [meta]
      summary: Build version
      responses:
        "200":
          description: version info
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VersionResponse"}

  /api/v1/auth/whoami:
    get:
      tags: [auth]
      summary: Current session identity
      responses:
        "200":
          description: identity
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/auth/team/switch:
    post:
      tags: [auth]
      summary: Switch the active team/tenant
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200":
          description: switched
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/projects:
    get:
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: project list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Project"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags:
      - projects
      summary: Create a project
      responses:
        '200':
          description: create a project

  /api/v1/projects/{name}:
    parameters: [$ref: "#/components/parameters/ProjectName"]
    get:
      tags: [projects]
      summary: Get one project
      responses:
        "200":
          description: project
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags:
      - projects
      summary: Delete a project
      responses:
        '200':
          description: delete a project

  /api/v1/projects/{name}/status:
    parameters: [$ref: "#/components/parameters/ProjectName"]
    get:
      tags: [projects]
      summary: Project runtime status
      responses:
        "200":
          description: status
          content:
            application/json:
              schema: {type: object, additionalProperties: true}

  /api/v1/builds:
    post:
      tags: [builds]
      summary: Submit a build (deploy)
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "202":
          description: build accepted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Build"}
        "409":
          description: concurrent build rejected

  /api/v1/projects/{name}/builds:
    parameters: [$ref: "#/components/parameters/ProjectName"]
    get:
      tags: [builds]
      summary: List builds for a project
      responses:
        "200":
          description: build list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Build"}

  /api/v1/builds/{id}:
    parameters: [$ref: "#/components/parameters/BuildID"]
    get:
      tags: [builds]
      summary: Get one build
      responses:
        "200":
          description: build
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Build"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/builds/{id}/cancel:
    parameters: [$ref: "#/components/parameters/BuildID"]
    post:
      tags: [builds]
      summary: Cancel a build
      responses:
        "202":
          description: cancellation accepted
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "409":
          description: build not cancellable in current state

  /api/v1/builds/{id}/logs/stream:
    parameters: [$ref: "#/components/parameters/BuildID"]
    get:
      tags: [builds]
      summary: Stream build logs (SSE)
      description: >
        Server-Sent Events stream. Body is text/event-stream and is NOT
        JSON-validated by the conformance test (status + Content-Type only).
      responses:
        "200":
          description: event stream
          content:
            text/event-stream:
              schema: {type: string}

  /api/v1/builds/{id}/stream:
    parameters: [$ref: "#/components/parameters/BuildID"]
    get:
      tags: [builds]
      summary: Stream build events (SSE)
      responses:
        "200":
          description: event stream
          content:
            text/event-stream:
              schema: {type: string}

  /api/v1/projects/{name}/logs/stream:
    parameters: [$ref: "#/components/parameters/ProjectName"]
    get:
      tags: [projects]
      summary: Stream runtime logs (SSE)
      responses:
        "200":
          description: event stream
          content:
            text/event-stream:
              schema: {type: string}

  /api/v1/secrets:
    get:
      tags: [secrets]
      summary: List secret names (values never returned)
      responses:
        "200":
          description: secret name list
          content:
            application/json:
              schema:
                type: array
                items: {type: object, additionalProperties: true}
    post:
      tags:
      - secrets
      summary: Create or update a secret
      responses:
        '200':
          description: create or update a secret

  /api/v1/environments:
    get:
      tags: [environments]
      summary: List environments
      responses:
        "200":
          description: environment list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Environment"}
    post:
      tags:
      - environments
      summary: Create an environment
      responses:
        '200':
          description: create an environment

  /api/v1/environments/{name}:
    parameters: [$ref: "#/components/parameters/EnvName"]
    get:
      tags: [environments]
      summary: Get one environment
      responses:
        "200":
          description: environment
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Environment"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags:
      - environments
      summary: Delete an environment
      responses:
        '200':
          description: delete an environment

  /api/v1/domains:
    get:
      tags: [domains]
      summary: List custom domains
      responses:
        "200":
          description: domain list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Domain"}
    post:
      tags:
      - domains
      summary: Add a custom domain
      responses:
        '200':
          description: add a custom domain

  /api/v1/domains/{domain}:
    parameters:
    - name: domain
      in: path
      required: true
      schema: {type: string}
    get:
      tags: [domains]
      summary: Get one domain
      responses:
        "200":
          description: domain
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Domain"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags:
      - domains
      summary: Remove a custom domain
      responses:
        '200':
          description: remove a custom domain

  /api/v1/billing:
    get:
      tags: [billing]
      summary: Billing + usage summary
      responses:
        "200":
          description: billing summary
          content:
            application/json:
              schema: {type: object, additionalProperties: true}

  /api/v1/billing/portal:
    post:
      tags: [billing]
      summary: Create a billing-portal session
      responses:
        "200":
          description: portal URL
          content:
            application/json:
              schema: {type: object, additionalProperties: true}

  /api/v1/teams/members:
    get:
      tags: [teams]
      summary: List team members
      responses:
        "200":
          description: member list
          content:
            application/json:
              schema:
                type: array
                items: {type: object, additionalProperties: true}
    post:
      tags:
      - teams
      summary: Add a team member
      responses:
        '200':
          description: add a team member

  /api/v1/audit:
    get:
      tags: [audit]
      summary: List audit-log entries (filterable, paginated)
      parameters:
      - {name: action, in: query, required: false, schema: {type: string}}
      - {name: resource_type, in: query, required: false, schema: {type: string}}
      - {name: since, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: audit entries
          content:
            application/json:
              schema: {type: object, additionalProperties: true}

  /api/v1/source/upload:
    post:
      tags: [source]
      summary: Upload a source bundle (multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: upload accepted
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/admin/tenants/evict:
    post:
      tags: [admin]
      summary: Evict a tenant (admin)
      responses:
        "200":
          description: evicted
          content:
            application/json:
              schema: {type: object, additionalProperties: true}

  /api/v1/admin/tenants/pin:
    post:
      tags: [admin]
      summary: Pin a tenant to a cell (admin)
      responses:
        "200":
          description: pinned
          content:
            application/json:
              schema: {type: object, additionalProperties: true}

  /api/v1/admin/releases/{id}/inspect:
    parameters: [$ref: "#/components/parameters/BuildID"]
    get:
      tags: [admin]
      summary: Inspect a release (admin)
      responses:
        "200":
          description: release inspection
          content:
            application/json:
              schema: {type: object, additionalProperties: true}

  /api/v1/builds/{id}/logs:
    parameters: [$ref: "#/components/parameters/BuildID"]
    get:
      tags: [builds]
      summary: Build logs (non-streaming)
      responses:
        "200":
          description: logs
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "503": {description: the log backend is unreachable (LOGS_UNAVAILABLE)}

  /api/v1/secrets/{name}:
    parameters: [$ref: "#/components/parameters/SecretName"]
    delete:
      tags: [secrets]
      summary: Delete a secret
      responses:
        "200": {description: deleted}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/domains/{domain}/dns-records:
    parameters:
    - {name: domain, in: path, required: true, schema: {type: string}}
    get:
      tags: [domains]
      summary: List the DNS records of a Cloudflare-managed domain
      responses:
        "200":
          description: the domain's DNS records
          content:
            application/json:
              schema:
                type: object
                required: [domain, records, total]
                properties:
                  domain: {type: string}
                  total: {type: integer}
                  records:
                    type: array
                    items: {type: object, additionalProperties: true}
        "400": {description: the domain's DNS is not managed by the platform (NOT_CF_MANAGED)}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {description: the DNS provider could not be reached}
  /api/v1/domains/{domain}/verify:
    parameters:
    - {name: domain, in: path, required: true, schema: {type: string}}
    post:
      tags: [domains]
      summary: Trigger domain verification
      responses:
        "200":
          description: verification result
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "429": {description: rate limited}

  /api/v1/projects/{name}/connect:
    parameters: [$ref: "#/components/parameters/ProjectName"]
    get:
      tags: [projects]
      summary: Get repository connection
      responses:
        "200":
          description: connection
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
    post:
      tags: [projects]
      summary: Connect a repository
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200": {description: connected}
    delete:
      tags: [projects]
      summary: Disconnect the repository
      responses:
        "200": {description: disconnected}

  /api/v1/projects/{name}/environments/{env}:
    parameters:
    - {$ref: "#/components/parameters/ProjectName"}
    - {name: env, in: path, required: true, schema: {type: string}}
    delete:
      tags: [environments]
      summary: Delete a project environment
      responses:
        "200": {description: deleted}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/projects/{name}/promote:
    parameters: [$ref: "#/components/parameters/ProjectName"]
    post:
      tags: [projects]
      summary: Promote a release between environments
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200": {description: promoted}
        "409": {description: conflict}

  /api/v1/projects/{name}/rollback:
    parameters: [$ref: "#/components/parameters/ProjectName"]
    post:
      tags: [projects]
      summary: Roll back to the previous release
      description: >-
        Answers once the target release's manifests are pushed and the sync is triggered.
        The cells finish the rollout afterwards; the project status shows the target as the
        active release when it completed, and the release rolled back from when it failed.
      responses:
        "202": {description: "rollback started (status in_progress); rollback_id names its record"}
        "409": {description: no previous release}

  /api/v1/projects/{name}/rollbacks:
    parameters: [$ref: "#/components/parameters/ProjectName"]
    get:
      tags: [projects]
      summary: List the rollbacks of a project
      description: >-
        One entry per rollback, newest first: its id, environment, the release and build it
        left (from) and aimed at (to), who asked, when, and its status. The status is
        in_progress, succeeded, failed (failure_reason says why; the release it left stayed
        active) or interrupted (the API stopped before the rollback was confirmed).
      parameters:
      - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200": {description: "the rollbacks, under the key rollbacks"}
        "400": {description: invalid limit}

  /api/v1/projects/{name}/scale:
    parameters: [$ref: "#/components/parameters/ProjectName"]
    post:
      tags: [projects]
      summary: Scale a project
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200": {description: scaled}
        "402": {description: plan upgrade required}
        "404": {description: "project not found (PROJECT_NOT_FOUND), or an app the active release of the environment does not declare (APP_NOT_FOUND)"}

  /api/v1/projects/{project}/previews:
    parameters:
    - {name: project, in: path, required: true, schema: {type: string}}
    get:
      tags: [projects]
      summary: List preview environments
      responses:
        "200":
          description: preview list
          content:
            application/json:
              schema:
                type: array
                items: {type: object, additionalProperties: true}
    post:
      tags:
      - projects
      summary: Create a preview environment
      responses:
        '200':
          description: create a preview environment

  /api/v1/projects/{project}/previews/{id}:
    parameters:
    - {name: project, in: path, required: true, schema: {type: string}}
    - {$ref: "#/components/parameters/BuildID"}
    get:
      tags: [projects]
      summary: Get one preview environment
      responses:
        "200":
          description: preview
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags:
      - projects
      summary: Delete a preview environment
      responses:
        '200':
          description: delete a preview environment

  /api/v1/teams/members/{username}:
    parameters:
    - {name: username, in: path, required: true, schema: {type: string}}
    delete:
      tags: [teams]
      summary: Remove a team member
      responses:
        "200": {description: removed}
    patch:
      tags: [teams]
      summary: Update a team member's role
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200": {description: updated}

  # M10 T2.1 (EC-1) — dashboard-consumed engine routes previously absent from the
  # spec (all registered in api/internal/server/router.go). Added so the
  # dashboard↔engine consumer contract (dashboard_consumer_test.go) is GREEN
  # without trimming the manifest. See plan m10-test-foundation-gap.
  /api/v1/deploys/{deployID}/timeline:
    parameters:
    - {name: deployID, in: path, required: true, schema: {type: string}}
    get:
      tags: [deploys]
      summary: Deploy timeline event stream (SSE)
      responses:
        "200":
          description: server-sent event stream of deploy timeline phases
          content:
            text/event-stream:
              schema: {type: string}
  /api/v1/integrations/github/installations:
    get:
      tags: [integrations]
      summary: List the GitHub App installations verified for the caller's tenant
      responses:
        "200":
          description: installations bound to the tenant after GitHub confirmed a user's access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubInstallationList"
  /api/v1/integrations/github/installations/claim:
    post:
      tags: [integrations]
      summary: Bind to the tenant the installations GitHub confirms the user can access
      description: >-
        Exchanges the one-time code of the GitHub App's user authorization and binds to the
        caller's tenant the installations of this App that the GitHub user can access. An
        installation that belongs to another tenant is left alone. Requires the admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The code GitHub returned to the authorization callback.
      responses:
        "200":
          description: the installations now verified for the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubInstallationList"
        "400":
          description: INVALID_REQUEST (no code) or GITHUB_CODE_REJECTED (expired or already used)
        "403":
          description: INSUFFICIENT_ROLE
        "502":
          description: GITHUB_UNAVAILABLE; nothing was bound
        "503":
          description: GITHUB_OAUTH_NOT_CONFIGURED
  /api/v1/integrations/github/installations/{id}/repositories:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [integrations]
      summary: List repositories for a GitHub App installation
      responses:
        "200":
          description: repository list for the installation
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /api/v1/projects/{name}/signals/stream:
    parameters: [$ref: "#/components/parameters/ProjectName"]
    get:
      tags: [projects]
      summary: Project runtime signals stream (SSE)
      responses:
        "200":
          description: server-sent event stream of runtime status signals
          content:
            text/event-stream:
              schema: {type: string}
  /api/v1/projects/{name}/builds/stream:
    parameters: [$ref: "#/components/parameters/ProjectName"]
    get:
      tags: [projects]
      summary: Project builds stream (SSE)
      responses:
        "200":
          description: server-sent event stream of build updates
          content:
            text/event-stream:
              schema: {type: string}
  /api/v1/builds/{id}/attestation:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - builds
      summary: Get build attestation
      responses:
        '200':
          description: get build attestation
  /api/v1/builds/{id}/sbom:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - builds
      summary: Get build SBOM
      responses:
        '200':
          description: get build sbom
  /api/v1/builds/{id}/sbom/{app}/download:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: app
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - builds
      summary: Download the SBOM of one app of a build
      description: >-
        Streams the CycloneDX file of the app as an attachment. The path is the download_path
        that GET /api/v1/builds/{id}/sbom reports for the app.
      responses:
        '200':
          description: the SBOM file
        '404':
          description: the build has no SBOM for this app
        '502':
          description: the SBOM is recorded and the object store did not return it
  /api/v1/builds/stats:
    get:
      tags:
      - builds
      summary: Tenant deploys aggregate stats
      responses:
        '200':
          description: tenant deploys aggregate stats
  /api/v1/health/deep:
    get:
      tags:
      - health
      summary: Deep health check
      description: >-
        Superseded by /api/v1/health/ready, which answers identically. Kept because deployment
        probes point at it; removal is a separate item after a deprecation deadline (B-123).
      responses:
        '200':
          description: deep health check
  /api/v1/health/ready:
    get:
      tags:
      - health
      summary: Readiness — the service can take traffic
      description: >-
        The ecosystem-canonical readiness name (loop-runtime-contracts/httpsurface, D5). Checks the
        database and every registered service; 200 when all are healthy, 503 when any is degraded.
        Shares the handler with /api/v1/health/deep, whose name describes how the check is
        implemented rather than what it answers.
      responses:
        '200':
          description: every dependency answered; safe to route traffic here
        '503':
          description: a dependency is degraded; do not route traffic here
  /api/v1/projects/{name}/build-envs:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - projects
      summary: List build environments for a project
      responses:
        '200':
          description: list build environments for a project
  /api/v1/projects/{name}/metrics:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - projects
      summary: Project runtime metrics (Prometheus proxy)
      responses:
        '200':
          description: project runtime metrics (prometheus proxy)
  /api/v1/secrets/bulk:
    post:
      tags:
      - secrets
      summary: Bulk create/update secrets
      responses:
        '200':
          description: bulk create/update secrets
  /api/v1/tenants/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      tags:
      - tenants
      summary: Soft-delete a tenant
      responses:
        '200':
          description: soft-delete a tenant
  /api/v1/tenants/{id}/restore:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - tenants
      summary: Restore a soft-deleted tenant
      responses:
        '200':
          description: restore a soft-deleted tenant
  /api/v1/webhooks/github:
    post:
      tags:
      - webhooks
      summary: GitHub App webhook receiver
      responses:
        '200':
          description: github app webhook receiver

components:
  parameters:
    ProjectName:
      name: name
      in: path
      required: true
      schema: {type: string}
    EnvName:
      name: name
      in: path
      required: true
      schema: {type: string}
    BuildID:
      name: id
      in: path
      required: true
      schema: {type: string}
    SecretName:
      name: name
      in: path
      required: true
      schema: {type: string}

  responses:
    Unauthorized:
      description: missing or invalid credentials
    NotFound:
      description: resource not found
    BadRequest:
      description: invalid request

  schemas:
    GitHubInstallationList:
      type: object
      required: [installations]
      properties:
        installations:
          type: array
          items:
            type: object
            required: [id, account_login, account_type]
            properties:
              id: {type: integer, format: int64}
              account_login: {type: string}
              account_type: {type: string, description: User or Organization}
    Health:
      type: object
      additionalProperties: true
    VersionResponse:
      type: object
      additionalProperties: false
      required: [version, commit, build_date, go_version, platform]
      properties:
        version: {type: string}
        commit: {type: string}
        build_date: {type: string}
        go_version: {type: string}
        platform: {type: string}
    Project:
      type: object
      additionalProperties: true
    Build:
      type: object
      additionalProperties: true
    Environment:
      type: object
      additionalProperties: true
    Domain:
      type: object
      additionalProperties: true
