# Composite action: Setup Node.js with npm cache.
# Per Plan T5.1.

name: Setup Node
description: Setup Node.js with npm cache, configurable version and lock path.

inputs:
  node-version:
    description: "Node version (e.g., '20')"
    required: false
    default: "20"
  cache-dependency-path:
    description: "Path to package-lock.json for cache key"
    required: false
    default: "package-lock.json"

runs:
  using: composite
  steps:
    - name: Setup Node ${{ inputs.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Verify Node version
      shell: bash
      run: node --version
