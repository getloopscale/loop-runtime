name: governance-notify
description: Reusable notification step for governance CI workflows (decay-scan, cross-validation, spotcheck).

# Per T5.4 of status-validation-and-doc-consolidation-plan.
#
# Sends Slack notification only when alert_payload is non-empty.
# No-op when SLACK_WEBHOOK_URL secret is unset (allows CI to function without setup).

inputs:
  title:
    description: "Alert title (used in Slack message)"
    required: true
  body:
    description: "Alert body markdown (truncated to 2000 chars for Slack)"
    required: true
  workflow_url:
    description: "Link to the workflow run"
    required: true
  webhook_url:
    description: "Slack webhook URL (from secret)"
    required: false

runs:
  using: composite
  steps:
    - name: Send Slack notification (if webhook configured)
      if: inputs.webhook_url != ''
      shell: bash
      run: |
        # Truncate body
        BODY="${{ inputs.body }}"
        if [[ ${#BODY} -gt 2000 ]]; then
          BODY="${BODY:0:2000}... (truncated)"
        fi

        PAYLOAD=$(jq -nc \
          --arg title "${{ inputs.title }}" \
          --arg body "$BODY" \
          --arg url "${{ inputs.workflow_url }}" \
          '{
            blocks: [
              {type: "header", text: {type: "plain_text", text: $title}},
              {type: "section", text: {type: "mrkdwn", text: $body}},
              {type: "actions", elements: [
                {type: "button", text: {type: "plain_text", text: "View Run"}, url: $url}
              ]}
            ]
          }')

        curl -sS -X POST -H "Content-Type: application/json" \
          --data "$PAYLOAD" \
          "${{ inputs.webhook_url }}" || echo "WARN: Slack notify failed (non-fatal)"

    - name: No-op when webhook unset
      if: inputs.webhook_url == ''
      shell: bash
      run: echo "SLACK_WEBHOOK_URL not configured — skipping notification"
