# Integration Tests — requires PostgreSQL, runs separately from CI.
# T4.8 of deep-review-remediation-plan (closes find_cicd_004 MEDIUM):
# promoted to required PR gate. PRs touching api/ or pkg/ now run the
# integration suite (which includes T0.1 + T7.2 + T2.6 + T3.3 invariants
# against a real PostgreSQL container) before merge.
#
# Pre-T4.8 the workflow ran only on workflow_dispatch + nightly cron. A
# PR breaking advisory-lock, idempotency replay, or DB CHECK constraint
# invariants could merge during business hours undetected.
name: Integration Tests

on:
  pull_request:
    branches: [main, develop, homolog]
    paths:
      - 'api/**'
      - 'pkg/**'
      - '.github/workflows/integration-tests.yml'
  push:
    branches: [main, develop, homolog]
    paths:
      - 'api/**'
      - 'pkg/**'
      - '.github/workflows/integration-tests.yml'
  workflow_dispatch:
    inputs:
      component:
        description: "Component to test"
        required: true
        type: choice
        options:
          - all
          - api
  schedule:
    # Run nightly at 03:00 UTC
    - cron: '0 3 * * *'

permissions:
  contents: read

env:
  GO_VERSION: '1.25.9'
  GOPRIVATE: 'github.com/getloopscale/*'
  GONOSUMCHECK: 'github.com/getloopscale/*'

jobs:
  integration-api:
    name: API Integration (PG)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loopzero_test
          POSTGRES_PASSWORD: loopzero_test_pass
          POSTGRES_DB: loopzero_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum
      - name: Run integration tests
        env:
          DATABASE_URL: postgres://loopzero_test:loopzero_test_pass@localhost:5432/loopzero_test?sslmode=disable
        run: cd api && go test ./tests/integration/... -v -race -timeout 10m
