# fix-all-platform-issues-plan T6.1 / ADR D7 — 7-day continuous GREEN watcher.
#
# The maturity assessment 3.8 → 4.0 bump is gated on 168 consecutive GREEN
# hourly checks (7 days × 24h). This workflow provides empirical confirmation
# that fixes from T1-T5 stick, no drift creeps in, and the platform sustains
# operational health.
#
# Each hourly run executes:
#   1. cell2-activation-gates.sh --json (12 ADR conditions C1-C12)
#   2. audit-argocd-drift.sh (count of OutOfSync apps with classification)
#   3. audit-stale-loopzeroapps.sh (count of orphaned LoopZeroApps > 1h)
#
# Output: JSON artifact + summary line in workflow run. The 168-run streak
# is tracked manually by maturity-bump PR (operator reviews artifact history).

name: platform health 7-day GREEN watch

on:
  schedule:
    - cron: '0 * * * *'  # hourly
  workflow_dispatch: {}

concurrency:
  group: platform-health-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_DEV_MGMT }}" > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          kubectl cluster-info
      - name: Run cell-2 activation gates (12 ADR conditions)
        id: gates
        env:
          KUBECONFIG: /tmp/kubeconfig
          PROM_URL: ${{ secrets.PROM_URL_DEV }}
          LOOPZERO_API_URL: ${{ secrets.LOOPZERO_API_URL_DEV }}
        run: |
          OUT=$(bash infra/tests/parity/cell2-activation-gates.sh --json 2>&1 | tail -1)
          echo "gates_json=${OUT}" >> "$GITHUB_OUTPUT"
          # Parse all_pass; fail step if false.
          ALL_PASS=$(echo "$OUT" | python3 -c 'import sys,json; print(json.load(sys.stdin)["all_pass"])' 2>/dev/null || echo "false")
          if [[ "$ALL_PASS" != "True" && "$ALL_PASS" != "true" ]]; then
            echo "::error::cell-2 gates not all_pass=true: $OUT"
            exit 1
          fi
      - name: Audit ArgoCD drift (real-bug count must be 0)
        env:
          KUBECONFIG: /tmp/kubeconfig
        run: |
          # The audit table has classes A/B/C. After fix-all phase 3, the
          # only acceptable classes are deferred-informational (C). Class A
          # or B with active rows would indicate a regression.
          OUT=$(bash infra/tests/parity/audit-argocd-drift.sh)
          # Count rows with Class A or B (real bugs).
          REAL_BUG_COUNT=$(echo "$OUT" | grep -E "^\| .* \| (A|B) \|" | grep -vE "deferred" | wc -l || echo "0")
          if [[ "$REAL_BUG_COUNT" -gt 0 ]]; then
            echo "::warning::ArgoCD audit found $REAL_BUG_COUNT real-bug rows (Class A/B). See log."
            echo "$OUT"
          fi
      - name: Audit stale LoopZeroApps (count must be 0)
        env:
          KUBECONFIG: /tmp/kubeconfig
        run: |
          OUT=$(bash infra/tests/parity/audit-stale-loopzeroapps.sh 2>&1)
          STALE_COUNT=$(echo "$OUT" | grep -cE "^\| tn-" || echo "0")
          if [[ "$STALE_COUNT" -gt 0 ]]; then
            echo "::error::Found $STALE_COUNT stale LoopZeroApps:"
            echo "$OUT"
            exit 1
          fi
      - name: Upload health artifact
        if: always()
        # pragma: allow-tag-pin
        # TODO(INF-G18 / plan T1.1): Renovate Bot resolves to @<sha40> on first run.
        uses: actions/upload-artifact@v4
        with:
          name: platform-health-${{ github.run_id }}
          path: |
            /tmp/health-*.json
          if-no-files-found: ignore
      - name: Open issue on red streak break
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[health] platform 7-day GREEN streak BROKEN — run ${context.runId}`,
              body: `Hourly health check failed in run ${context.runId}.\n\nLogs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThis resets the 168-run GREEN streak. Maturity bump 3.8 → 4.0 requires 168 consecutive GREEN runs from the next successful run forward.`,
              labels: ['priority/high', 'area/health-watch', 'maturity-gate']
            });
