---
# T1.6 — Pulumi Reconstruction Drill (Quarterly + Manual)
# Per MEET-2026-05-12 D9 + EC-NEW-5: executes end-to-end DR drill using
# isolated pulumi-drill project. Captures RTO/RPO evidence per EC-NEW-10.

name: Pulumi Reconstruction Drill (T1.6)

on:
  schedule:
    # Quarterly: 1st day of Mar/Jun/Sep/Dec at 10:00 UTC
    - cron: '0 10 1 3,6,9,12 *'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to execute (prepare/smoke/disaster/recover/verify/teardown/all)'
        required: false
        default: 'all'
      skip_teardown:
        description: 'Skip teardown (leaves drill stack provisioned for manual inspection)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: pulumi-drill
  cancel-in-progress: false  # NEVER cancel mid-drill — partial state is dangerous

jobs:
  pre-flight-gate:
    name: Pre-flight isolation verification
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify drill credentials are scoped (NOT prod credentials)
        id: gate
        env:
          DRILL_PULUMI_TOKEN: ${{ secrets.DRILL_PULUMI_TOKEN }}
          DRILL_DO_TOKEN: ${{ secrets.DRILL_DO_TOKEN }}
          DRILL_CF_TOKEN: ${{ secrets.DRILL_CF_TOKEN }}
        run: |
          if [[ -z "${DRILL_PULUMI_TOKEN:-}" ]] || [[ -z "${DRILL_DO_TOKEN:-}" ]] || [[ -z "${DRILL_CF_TOKEN:-}" ]]; then
            echo "::error title=Drill credentials missing::DRILL_PULUMI_TOKEN, DRILL_DO_TOKEN, DRILL_CF_TOKEN must be configured. These are SEPARATE from production credentials per EC-NEW-5."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  drill:
    name: Run DR drill
    needs: pre-flight-gate
    if: needs.pre-flight-gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Setup Pulumi CLI
        uses: pulumi/actions@cd99a7f8865434dd3532b586a26f9ebea596894f # v5.5.1

      - name: Install drill dependencies
        working-directory: infra/pulumi-drill
        run: npm ci

      - name: Run drill orchestration
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.DRILL_PULUMI_TOKEN }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DRILL_DO_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.DRILL_CF_TOKEN }}
        run: |
          chmod +x infra/scripts/dr-drill.sh
          ./infra/scripts/dr-drill.sh "${{ inputs.stage || 'all' }}"

      - name: Upload drill evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: dr-drill-evidence-${{ github.run_id }}
          path: .claude/knowledge-base/reviews/dr-drill-*/
          retention-days: 90

      - name: Cost alert if drill stack still up
        if: failure() && inputs.skip_teardown != true
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DRILL_DO_TOKEN }}
        run: |
          # If drill failed mid-stage, drill stack may be left provisioned.
          # Open issue to remind operator to teardown manually.
          echo "::warning title=Drill stack may be live::Drill failed; verify pulumi-drill stack is destroyed via 'pulumi destroy --stack drill'"

      - name: Open issue on drill failure
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `[Drill FAIL] DR reconstruction drill failed — ${new Date().toISOString().slice(0,10)}`,
              labels: ['drill-failure', 'priority/high', 'dr', 'infrastructure'],
              body: `DR reconstruction drill FAILED in workflow ${context.runId}.\n\n` +
                    `**Stage requested:** ${{ inputs.stage || 'all' }}\n` +
                    `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                    `Per plan T1.6 + MEET-2026-05-12 D9: drill failure indicates one of:\n` +
                    `  - Runbook bit-rot (procedure changed but doc didn't)\n` +
                    `  - Pulumi-drill project config drift\n` +
                    `  - Credential rotation broke drill access\n\n` +
                    `Action: investigate logs, fix root cause, re-run via workflow_dispatch.\n\n` +
                    `**IMPORTANT:** If drill stack was left up (skip_teardown), run \`pulumi destroy --stack drill\` manually to avoid cost.`
            });
