---
# Audit gap §6.B.4 — cosign keyless v1.1 cutover deadline tracking.
#
# The ADR `decisions/2026-05-12-cosign-keyless-v11-cutover.md` carries a
# hard 90-day deadline from v1.0 GA. The ADR's claim "auto-blocks via
# W1.14 hook" was stale — W1.14 (decisions-stability-check.yml) only
# protects against ADR deletion, not against deadline slip. This workflow
# closes that gap.
#
# Triggers:
#   - weekly cron Monday 09:00 UTC (alert before the weekend dies)
#   - on any PR that touches the ADR file
#   - workflow_dispatch for manual checks
#
# Behavior is governed by infra/scripts/check-cosign-cutover-deadline.sh
# which is DORMANT pre-GA (marker file absent) and starts ratcheting
# post-GA: warn at day 75, BLOCK at day 90 unless sponsor-signed
# exception file present.

name: Cosign Cutover Deadline (§6.B.4)

on:
  schedule:
    - cron: "0 9 * * 1"  # Monday 09:00 UTC
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '.claude/knowledge-base/decisions/2026-05-12-cosign-keyless-v11-cutover.md'
      - '.github/v1.0-ga-date.txt'
      - '.github/cosign-cutover-exception.txt'
      - '.github/workflows/cosign-cutover-deadline.yml'
      - 'pkg/quality/deadlineratchet/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: cosign-cutover-deadline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-deadline:
    name: Check cosign keyless v1.1 cutover deadline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'
          cache-dependency-path: cmd/loopzero-ops/go.sum

      # T5.3 of plan 2026-05-22: migrated from check-cosign-cutover-deadline.sh +
      # its hermetic test (D6 AUTO-DIE) to a pure-Go gate (loopzero-ops).
      - name: Run unit tests on the deadline gate
        # Self-check: if the gate's own tests fail, refuse to run the real
        # check — a broken gate could otherwise silently exit 0 while the
        # deadline is blown.
        run: cd pkg && go test ./quality/deadlineratchet/...

      - name: Check deadline
        id: deadline
        # rationale (T6.8): continue-on-error lets this step "fail" softly so
        # the issue-creation step still runs.
        continue-on-error: true
        run: cd cmd/loopzero-ops && go run . quality cosign-cutover --root "${GITHUB_WORKSPACE}"

      - name: Open auto-issue on block
        if: steps.deadline.outcome == 'failure' && github.event_name == 'schedule'
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6.4.1
        with:
          script: |
            const title = '[cosign-cutover] DEADLINE BLOWN — keyless v1.1 cutover overdue';
            const body = `The weekly deadline check exited non-zero. Per
            ADR \`2026-05-12-cosign-keyless-v11-cutover.md\` the 90-day
            window has elapsed without an approved sponsor exception.

            **Next steps (one of):**
            1. Execute the cutover. Update the ADR status from PROPOSED
               to APPLIED + record the cutover date.
            2. Create \`.github/cosign-cutover-exception.txt\` with a
               slip rationale and an \`approved-by: <operator>\` line.
               Commit it via PR (this workflow runs on PR and will
               accept the file).

            Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'cosign-cutover', 'auto-issue'],
            });

      - name: Re-fail the job after issue is created
        # The continue-on-error above lets us open the auto-issue first,
        # then we surface the failure so the PR check still goes red
        # (and the weekly run shows red in the dashboard).
        if: steps.deadline.outcome == 'failure'
        run: |
          echo "::error::cosign cutover deadline blown — see auto-issue above"
          exit 1
