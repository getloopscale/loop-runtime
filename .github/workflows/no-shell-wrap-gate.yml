---
# no-shell-wrap CI gate (T6.3 of plan 2026-05-22-shell-script-strategic-plan.md v1.3)
#
# Materializes D5 ADR ("Shell-wrap em Go is PROIBIDO when SDK Go nativo exists").
# AST-walker scans pkg/* for `<x>.Run("<forbidden-cli>", ...)` calls. Forbidden
# CLIs: pulumi, helm, kubectl, aws, gh. Allowed via `//nolint:shell-wrap` + justification.
#
# Complementary to T7.1 (Pluto) + T7.2 (OpenCost) which are Anti-Pattern #8
# (adopt external mature tools, don't reimplement). This gate prevents the
# inverse problem: implementing Go that wraps a CLI when the Go SDK exists.

name: no-shell-wrap gate (D5)

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "pkg/**/*.go"
      - "cmd/**/*.go"
      - ".github/workflows/no-shell-wrap-gate.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "pkg/**/*.go"
      - "cmd/**/*.go"

permissions:
  contents: read

jobs:
  no-shell-wrap:
    name: D5 — no shell-wrap of forbidden CLIs without nolint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'
          cache-dependency-path: cmd/loopzero-ops/go.sum

      - name: Build loopzero-ops
        working-directory: cmd/loopzero-ops
        run: go build -o /tmp/loopzero-ops .

      - name: Scan pkg/ for shell-wrap violations
        run: /tmp/loopzero-ops quality no-shell-wrap --root pkg

      - name: Scan cmd/ for shell-wrap violations
        run: /tmp/loopzero-ops quality no-shell-wrap --root cmd

      - name: Annotate failure
        if: failure()
        run: |
          echo "::error title=D5 Gate Violation::Go code in pkg/ or cmd/ wraps a forbidden CLI (pulumi/helm/kubectl/aws/gh) without //nolint:shell-wrap suppression. Per plan D5 + Anti-Pattern #8: use the Go SDK alternative (pulumi-go-sdk, helm.sh/helm/v3, client-go, aws-sdk-go-v2, go-github). If shell-out is genuinely needed, add //nolint:shell-wrap on the call line with a justification comment + ADR reference."
