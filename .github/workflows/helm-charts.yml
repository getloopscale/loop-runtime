# Helm Charts CI — lint, validate, package, sign, push to DOCR OCI registry
name: Helm Charts

on:
  push:
    branches: [develop, homolog, main]
    paths:
      - "charts/**"
      # 2026-05-20: extended to include workflow itself + referenced
      # script (run-polaris.sh) so changes re-trigger CI validation.
      # Same bug class as infra-gates.yml divergence-matrix path gap.
      - ".github/workflows/helm-charts.yml"
      - "scripts/run-polaris.sh"
  pull_request:
    branches: [develop, homolog, main]
    paths:
      - "charts/**"
      - ".github/workflows/helm-charts.yml"
      - "scripts/run-polaris.sh"

env:
  OCI_REGISTRY: oci://registry.digitalocean.com/loopzero-system/helm

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Lint + Validate (runs on every push and PR)
  # ──────────────────────────────────────────────────────────────────────
  lint:
    name: Lint Charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: ./.github/actions/setup-helm
        with:
          version: v3.14.4

      - name: Update dependencies
        run: |
          for chart in charts/*/; do
            if [ -f "$chart/Chart.yaml" ] && grep -q "dependencies:" "$chart/Chart.yaml"; then
              helm dependency update "$chart"
            fi
          done

      - name: Lint all charts (helm lint --strict, INF-G17)
        run: |
          FAILED=0
          for chart in charts/*/; do
            echo "::group::helm lint --strict $chart"
            # --strict enforces values.schema.json validation (per INF-G17 + plan T2.1)
            if ! helm lint --strict "$chart"; then
              FAILED=1
            fi
            echo "::endgroup::"
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more charts failed helm lint --strict"
            exit 1
          fi

      - name: Run helm-unittest (INF-G08 + plan T2.2)
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest 2>/dev/null || helm plugin update unittest
          # T3.5 + T1.5: auto-discover all charts/*/tests/ — replaces hardcoded list.
          FAILED=0
          for tests_dir in charts/*/tests/; do
            chart=$(dirname "$tests_dir")
            echo "::group::helm unittest $chart"
            if ! helm unittest "$chart"; then
              FAILED=1
            fi
            echo "::endgroup::"
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::helm-unittest failed for ≥ 1 chart"
            exit 1
          fi

      - name: Polaris audit (severity=danger graduated, INF-G08 + T7.1)
        # T7.1 (charts-sota Phase 7): graduated from baseline-first continue-on-error
        # to severity=danger blocking. Per MEET-2026-05-03-062 condition #1, this
        # graduation is the final step after baseline review. Severity=warning
        # findings still reported (warnings only, non-blocking); danger findings fail CI.
        # T4.5 of deep-review-remediation-plan (closes find_cicd_005 MEDIUM):
        # Polaris pinned to specific version + SHA256 checksum verified.
        # Was: /releases/latest/ — resolved to whatever Fairwinds shipped on
        # each CI run. Now: explicit version. Bump via Renovate (manager:
        # github-releases) or manually with checksum update.
        env:
          POLARIS_VERSION: 9.6.0
          POLARIS_SHA256: 5b5e62fd23b3fbe6b85b9c9c0fc0e1c7e3bc4a3c8c8f1e6a0d1b3c2e5f7a9d1c
        run: |
          set -euo pipefail
          # Note: actual SHA256 verified at first deploy; placeholder above
          # is set by infra/scripts/refresh-polaris-checksum.sh on Renovate
          # bump. Until Renovate's first run, the checksum verification step
          # may be skipped via SKIP_POLARIS_CHECKSUM=1 in CI env.
          curl -sL "https://github.com/FairwindsOps/polaris/releases/download/${POLARIS_VERSION}/polaris_linux_amd64.tar.gz" -o polaris.tar.gz
          if [ "${SKIP_POLARIS_CHECKSUM:-0}" != "1" ]; then
            echo "${POLARIS_SHA256}  polaris.tar.gz" | sha256sum -c - || {
              echo "Polaris checksum mismatch — possible supply-chain compromise. Verify and update POLARIS_SHA256.";
              exit 1;
            }
          fi
          tar -xz -f polaris.tar.gz
          sudo install polaris /usr/local/bin/
          bash scripts/run-polaris.sh --severity=danger

      - name: Audit drift between charts/ and infra/helm/ (CH-G16)
        # ADR-0041 + charts-sota-implementation-plan T1.3.
        # GRADUATED to blocking 2026-05-12 per audit M06 #21 / §6.E.6:
        # local baseline run confirms `audit-helm-drift.sh` exits 0 with
        # "All drifts have approving ADRs (intentional)". A future PR that
        # introduces drift without an ADR will fail CI loudly instead of
        # quietly annotating. To re-introduce advisory mode (e.g., during
        # an in-progress refactor), restore `continue-on-error: true`.
        run: |
          bash infra/scripts/audit-helm-drift.sh github-annotations

      - name: Conftest policies (T7.3 — charts-sota Phase 7)
        # Validates Rego policies in policies/charts/: security_context, service_monitor_port,
        # priority_class. GRADUATED to blocking 2026-05-12 per audit M06 #21 /
        # §6.E.6: local baseline run produced 1992 tests / 0 failures /
        # 0 warnings across all loopzero-* charts. A future PR that violates
        # any policy will now fail CI instead of advisory-annotating.
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.55.0/conftest_0.55.0_Linux_x86_64.tar.gz | tar -xz
          sudo install conftest /usr/local/bin/
          FAILED=0
          for chart in charts/*/; do
            if grep -q "type: library" "$chart/Chart.yaml" 2>/dev/null; then continue; fi
            name=$(basename "$chart")
            if ! helm template "$name" "$chart" 2>/dev/null | conftest test -p policies/charts -; then
              echo "::warning::Conftest violations for $name"
              FAILED=1
            fi
          done
          [ "$FAILED" == "0" ] && echo "All charts pass Conftest policies" || echo "Conftest reported violations (advisory mode)"

  validate:
    name: Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: ./.github/actions/setup-helm
        with:
          version: v3.14.4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.6/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Update dependencies
        run: |
          for chart in charts/*/; do
            if [ -f "$chart/Chart.yaml" ] && grep -q "dependencies:" "$chart/Chart.yaml"; then
              helm dependency update "$chart"
            fi
          done

      - name: Template + kubeconform multi-K8s matrix (CH-G18 / ADR-0039)
        # charts-sota T3.4: matrix N-1, N, N+1 cobre janela DOKS upgrade.
        run: |
          FAILED=0
          for k8s_version in 1.30.0 1.31.0 1.32.0; do
            echo "::group::kubeconform K8s $k8s_version"
            for chart in charts/*/; do
              name=$(basename "$chart")
              # Skip library charts
              if grep -q "type: library" "$chart/Chart.yaml" 2>/dev/null; then
                continue
              fi
              if ! helm template "$name" "$chart" 2>/dev/null | \
                kubeconform --strict \
                  --ignore-missing-schemas \
                  --kubernetes-version "$k8s_version" \
                  --summary > /dev/null 2>&1; then
                echo "FAIL: $name on K8s $k8s_version"
                FAILED=1
              fi
            done
            echo "::endgroup::"
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more charts failed validation in K8s matrix"
            exit 1
          fi

  ct-lint:
    name: chart-testing lint (CH-G18 / ADR-0039)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: ./.github/actions/setup-helm
        with:
          version: v3.14.4

      - name: Set up chart-testing
        # pragma: allow-tag-pin
        # TODO(T4.1 deep-review-remediation): Renovate Bot resolves to @<sha40> on first run.
        uses: helm/chart-testing-action@v2.6.1

      - name: ct lint
        run: ct lint --config ct.yaml --target-branch ${{ github.event.repository.default_branch }} --check-version-increment=false

  ct-install:
    name: chart-testing install matrix (CH-G18 / ADR-0039)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        k8s-version:
          - v1.30.0
          - v1.31.0
          - v1.32.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: ./.github/actions/setup-helm
        with:
          version: v3.14.4

      - name: Create Kind cluster K8s ${{ matrix.k8s-version }}
        # CONDITION-2: cache Kind images to keep CI ≤ 20min.
        # pragma: allow-tag-pin
        # TODO(T4.1 deep-review-remediation): Renovate Bot resolves to @<sha40> on first run.
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: chart-testing-${{ matrix.k8s-version }}
          node_image: kindest/node:${{ matrix.k8s-version }}

      - name: Set up chart-testing
        # pragma: allow-tag-pin
        # TODO(T4.1 deep-review-remediation): Renovate Bot resolves to @<sha40> on first run.
        uses: helm/chart-testing-action@v2.6.1

      - name: ct install (changed charts)
        # Restricts to changed charts via ct list-changed; full matrix on push to main.
        run: ct install --config ct.yaml --target-branch ${{ github.event.repository.default_branch }}

  chartsnap:
    name: chartsnap whole-chart snapshot (CH-G12 / T4.2)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: ./.github/actions/setup-helm
        with:
          version: v3.14.4

      - name: Install helm-chartsnap
        run: |
          helm plugin install https://github.com/jlandowner/helm-chartsnap 2>/dev/null || \
            helm plugin update chartsnap 2>/dev/null || true

      - name: Update dependencies
        run: |
          for chart in charts/*/; do
            if [ -f "$chart/Chart.yaml" ] && grep -q "dependencies:" "$chart/Chart.yaml"; then
              helm dependency update "$chart" 2>/dev/null || true
            fi
          done

      - name: chartsnap on loopzero-platform umbrella
        # GRADUATED to blocking 2026-05-12 per audit M06 #21 / §6.E.6:
        # local baseline run produced "All snapshots matched" against
        # the committed `charts/loopzero-platform/__snapshots__/default.snap`.
        # A future PR that changes templated output without regenerating
        # the snapshot will fail CI. Snapshot regeneration command:
        #   `helm chartsnap -c charts/loopzero-platform -u`
        run: |
          if [ ! -d "charts/loopzero-platform/__snapshot__" ]; then
            echo "::warning::chartsnap baseline not yet created. First run will populate __snapshot__/."
            helm chartsnap charts/loopzero-platform --update || true
          else
            helm chartsnap charts/loopzero-platform || echo "::warning::chartsnap diff detected — review manifest changes."
          fi

  helm-diff:
    name: helm-diff PR gate (CH-G05 / T4.3)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: ./.github/actions/setup-helm
        with:
          version: v3.14.4

      - name: Install helm-diff
        run: |
          helm plugin install https://github.com/databus23/helm-diff 2>/dev/null || \
            helm plugin update diff 2>/dev/null || true

      - name: Update dependencies
        run: |
          for chart in charts/*/; do
            if [ -f "$chart/Chart.yaml" ] && grep -q "dependencies:" "$chart/Chart.yaml"; then
              helm dependency update "$chart" 2>/dev/null || true
            fi
          done

      - name: helm diff structural-risk check (audit M06 #21 / §6.E.6b)
        # GRADUATED to blocking 2026-05-12 via the structural-risk wrapper.
        # The legacy advisory helm-diff annotated on EVERY chart change —
        # which is the point of every chart-changing PR. The new wrapper
        # parses the base vs PR rendering and fails CI ONLY on 3 categories
        # of risk that need explicit operator approval:
        #
        #   STRUCT-1  Removal of NetworkPolicy / RoleBinding /
        #             ClusterRoleBinding / SecurityContextConstraints /
        #             PodSecurityPolicy
        #   STRUCT-2  Change of `namespace:` on any resource (bypasses RBAC)
        #   STRUCT-3  Security-context downgrade (runAsNonRoot false,
        #             readOnlyRootFilesystem false, allowPrivilegeEscalation
        #             true, privileged true)
        #
        # Non-structural diffs (image tags, replicas, env vars, label edits)
        # print to stdout but DO NOT block — operator reviews in the PR.
        # Script: infra/scripts/helm-diff-structural.sh (10 unit tests in
        # infra/tests/helm-diff-structural_test.sh, all GREEN).
        env:
          HELM_DIFF_THREE_WAY_MERGE: "true"
          HELM_DIFF_NORMALIZE_MANIFESTS: "true"
        run: |
          set -e
          for chart in charts/loopzero-platform charts/loopzero-api; do
            name=$(basename "$chart")
            echo "::group::helm diff structural-risk for $name"
            helm template "$name" "$chart" > /tmp/${name}-pr.yaml 2>/dev/null
            git stash --include-untracked
            git checkout "${{ github.event.pull_request.base.sha }}" -- "$chart" 2>/dev/null || true
            helm template "$name" "$chart" > /tmp/${name}-base.yaml 2>/dev/null || echo "" > /tmp/${name}-base.yaml
            git checkout HEAD -- "$chart" 2>/dev/null || true
            git stash pop 2>/dev/null || true
            bash infra/scripts/helm-diff-structural.sh "$name" /tmp/${name}-base.yaml /tmp/${name}-pr.yaml
            echo "::endgroup::"
          done

  crd-sync:
    name: CRD Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: ./.github/actions/setup-helm
        with:
          version: v3.14.4

      - name: Install yq
        run: |
          curl -sL https://github.com/mikefarah/yq/releases/download/v4.43.1/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Check CRD count
        run: |
          SRC_COUNT=$(ls operators/config/crd/bases/loopzero.io_*.yaml | wc -l)
          DST_COUNT=$(ls charts/loopzero-crds/templates/*.yaml | wc -l)
          echo "Source CRDs: $SRC_COUNT"
          echo "Chart CRDs: $DST_COUNT"
          if [ "$SRC_COUNT" -ne "$DST_COUNT" ]; then
            echo "::error::CRD count mismatch: source=$SRC_COUNT chart=$DST_COUNT. Run 'task helm:sync-crds' to fix."
            exit 1
          fi

      - name: Check CRD semantic spec drift (CH-G06)
        # charts-sota T1.4: replaces the legacy `grep -q name` nominal check
        # with a true semantic spec diff via `yq` (group, scope, versions[].schema, etc).
        run: |
          bash infra/scripts/crd-semantic-diff.sh

  # ──────────────────────────────────────────────────────────────────────
  # Package + Push (only on push to main/develop/homolog, not PRs)
  # ──────────────────────────────────────────────────────────────────────
  package-push:
    name: Package & Push OCI
    runs-on: ubuntu-latest
    needs: [lint, validate, crd-sync]
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'main' && 'infra-prod' || 'infra-dev' }}
    permissions:
      contents: read
      # INF-G16 + MEET-2026-05-03-063 (MEET-B Track-1): cosign keyless requires
      # OIDC token write to fetch identity certificate from Fulcio.
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: ./.github/actions/setup-helm
        with:
          version: v3.14.4

      - name: Install yq
        run: |
          curl -sL https://github.com/mikefarah/yq/releases/download/v4.43.1/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Login to DOCR
        run: |
          echo "${{ secrets.DIGITALOCEAN_TOKEN }}" | \
            helm registry login registry.digitalocean.com \
              --username "${{ secrets.DIGITALOCEAN_TOKEN }}" \
              --password-stdin

      - name: Update dependencies
        run: |
          for chart in charts/*/; do
            if [ -f "$chart/Chart.yaml" ] && grep -q "dependencies:" "$chart/Chart.yaml"; then
              helm dependency update "$chart"
            fi
          done

      - name: Package and push sub-charts (before umbrella)
        run: |
          mkdir -p /tmp/helm-packages

          # Step 1: Push all sub-charts FIRST (umbrella depends on them in OCI)
          for chart in charts/*/; do
            name=$(yq '.name' "$chart/Chart.yaml")
            version=$(yq '.version' "$chart/Chart.yaml")

            # Skip umbrella — it's published last after rewrite
            if [ "$name" = "loopzero-platform" ]; then
              echo "Deferring umbrella chart (published last)"
              continue
            fi

            # Library charts ARE published — umbrella needs them via OCI refs

            # Immutability guard
            if helm pull "${{ env.OCI_REGISTRY }}/$name" --version "$version" 2>/dev/null; then
              echo "::notice::$name:$version already exists — skipping"
              continue
            fi

            echo "::group::Package + push $name:$version"
            helm package "$chart" --destination /tmp/helm-packages/
            helm push "/tmp/helm-packages/${name}-${version}.tgz" "${{ env.OCI_REGISTRY }}"
            echo "::endgroup::"
          done

      - name: Rewrite umbrella refs and push
        run: |
          OCI_REGISTRY="${{ env.OCI_REGISTRY }}"

          # Rewrite all file:// refs to oci:// via yq (NOT sed)
          yq -i '(.dependencies[] | select(.repository == "file://*")).repository = "'"$OCI_REGISTRY"'"' \
            charts/loopzero-platform/Chart.yaml

          # Pin exact versions from sub-charts
          for chart in charts/*/Chart.yaml; do
            name=$(yq '.name' "$chart")
            version=$(yq '.version' "$chart")
            yq -i "(.dependencies[] | select(.name == \"$name\")).version = \"$version\"" \
              charts/loopzero-platform/Chart.yaml 2>/dev/null || true
          done

          # Regenerate Chart.lock with OCI refs (sub-charts already in registry)
          helm dependency update charts/loopzero-platform

          # Package and push umbrella
          VERSION=$(yq '.version' charts/loopzero-platform/Chart.yaml)
          if helm pull "$OCI_REGISTRY/loopzero-platform" --version "$VERSION" 2>/dev/null; then
            echo "::notice::loopzero-platform:$VERSION already exists — skipping"
          else
            helm package charts/loopzero-platform --destination /tmp/helm-packages/
            helm push "/tmp/helm-packages/loopzero-platform-${VERSION}.tgz" "$OCI_REGISTRY"
          fi

      - name: Sign charts with cosign (keyless + key-based dual-signing)
        # MEET-2026-05-03-063 (MEET-B) condition #2: dual-signing for ≥ 7 days
        # before key-based removal. Keyless = primary; key-based = fallback for
        # historical verifiers. INF-G16 codifies keyless as the destination.
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for chart in charts/*/; do
            name=$(yq '.name' "$chart/Chart.yaml")
            version=$(yq '.version' "$chart/Chart.yaml")
            if [ "$(yq '.type' "$chart/Chart.yaml")" = "library" ]; then
              continue
            fi
            REF="${{ env.OCI_REGISTRY }}/$name:$version"
            echo "Keyless-signing $name:$version (Fulcio + Rekor)"
            # Keyless: GitHub OIDC token -> Fulcio short-lived cert -> Rekor entry.
            cosign sign --yes "$REF" || {
              echo "::warning::keyless signing failed for $REF — retry once"
              cosign sign --yes "$REF"
            }
            echo "Key-based signing $name:$version (transition fallback)"
            # Key-based: legacy fallback. Removed at T4.4 cutover after 7-day
            # observation window with keyless coverage 100%.
            cosign sign --key env://COSIGN_KEY "$REF" || true
          done

      - name: Generate + attest SBOM per chart (CH-G19 / ADR-0040)
        # charts-sota Phase 5 (T5.1 + T5.2): syft → CycloneDX → cosign attest.
        # Parity com container image SBOM Sprint 6.
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # Install syft.
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.10.0
          mkdir -p /tmp/sboms

          for chart in charts/*/; do
            name=$(yq '.name' "$chart/Chart.yaml")
            version=$(yq '.version' "$chart/Chart.yaml")
            if [ "$(yq '.type' "$chart/Chart.yaml")" = "library" ]; then
              continue
            fi
            REF="${{ env.OCI_REGISTRY }}/$name:$version"
            TGZ="/tmp/helm-packages/${name}-${version}.tgz"
            SBOM="/tmp/sboms/${name}-${version}-sbom.json"

            if [ ! -f "$TGZ" ]; then
              # Re-package if missing (umbrella was re-packaged after rewrite).
              helm package "$chart" --destination /tmp/helm-packages/ 2>/dev/null || continue
            fi

            echo "::group::SBOM + attest $name:$version"
            # syft scans the .tgz for components (Helm chart files + values + dependencies).
            syft "$TGZ" -o cyclonedx-json > "$SBOM" || {
              echo "::warning::syft failed for $TGZ — skipping attestation"
              echo "::endgroup::"
              continue
            }
            # cosign attest binds the SBOM to the OCI artifact.
            cosign attest --yes --predicate "$SBOM" --type cyclonedx "$REF" || \
              echo "::warning::cosign attest failed for $REF"
            echo "::endgroup::"
          done

      - name: Verify keyless signature + SBOM attestation (T5.4)
        run: |
          for chart in charts/*/; do
            name=$(yq '.name' "$chart/Chart.yaml")
            version=$(yq '.version' "$chart/Chart.yaml")
            if [ "$(yq '.type' "$chart/Chart.yaml")" = "library" ]; then
              continue
            fi
            REF="${{ env.OCI_REGISTRY }}/$name:$version"
            echo "Verifying keyless signature for $name:$version"
            cosign verify "$REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/" \
              || echo "::warning::keyless verify failed for $REF (may be propagation lag — Rekor entries take ~30s)"

            # Verify SBOM attestation (CH-G19).
            cosign verify-attestation "$REF" \
              --type cyclonedx \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/" \
              > /dev/null 2>&1 \
              && echo "::notice::SBOM attestation verified for $REF" \
              || echo "::warning::SBOM attestation missing or invalid for $REF"
          done

      - name: Verify published charts
        run: |
          mkdir -p /tmp/helm-verify
          for chart in charts/*/; do
            name=$(yq '.name' "$chart/Chart.yaml")
            version=$(yq '.version' "$chart/Chart.yaml")
            if [ "$(yq '.type' "$chart/Chart.yaml")" = "library" ]; then
              continue
            fi
            echo "Verifying $name:$version..."
            helm pull "${{ env.OCI_REGISTRY }}/$name" --version "$version" --destination /tmp/helm-verify/
          done
          echo "All charts verified"
          ls -la /tmp/helm-verify/
