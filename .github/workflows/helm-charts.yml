# Helm Charts CI — lint, validate, package, sign, push to DOCR OCI registry
name: Helm Charts

on:
  push:
    branches: [develop, homolog, main]
    paths:
      - "charts/**"
  pull_request:
    branches: [develop, homolog, main]
    paths:
      - "charts/**"

env:
  OCI_REGISTRY: oci://registry.digitalocean.com/loopzero-system/helm

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Lint + Validate (runs on every push and PR)
  # ──────────────────────────────────────────────────────────────────────
  lint:
    name: Lint Charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Update dependencies
        run: |
          for chart in charts/*/; do
            if [ -f "$chart/Chart.yaml" ] && grep -q "dependencies:" "$chart/Chart.yaml"; then
              helm dependency update "$chart"
            fi
          done

      - name: Lint all charts
        run: |
          FAILED=0
          for chart in charts/*/; do
            echo "::group::Linting $chart"
            if ! helm lint "$chart"; then
              FAILED=1
            fi
            echo "::endgroup::"
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more charts failed lint"
            exit 1
          fi

  validate:
    name: Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.6/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Update dependencies
        run: |
          for chart in charts/*/; do
            if [ -f "$chart/Chart.yaml" ] && grep -q "dependencies:" "$chart/Chart.yaml"; then
              helm dependency update "$chart"
            fi
          done

      - name: Template + kubeconform
        run: |
          FAILED=0
          for chart in charts/*/; do
            name=$(basename "$chart")
            # Skip library charts
            if grep -q "type: library" "$chart/Chart.yaml" 2>/dev/null; then
              echo "Skipping library chart: $name"
              continue
            fi
            echo "::group::Validating $name"
            if ! helm template "$name" "$chart" 2>/dev/null | \
              kubeconform --strict \
                --ignore-missing-schemas \
                --kubernetes-version 1.31.0 \
                --summary; then
              FAILED=1
            fi
            echo "::endgroup::"
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more charts failed validation"
            exit 1
          fi

  crd-sync:
    name: CRD Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check CRD count
        run: |
          SRC_COUNT=$(ls operators/config/crd/bases/loopzero.io_*.yaml | wc -l)
          DST_COUNT=$(ls charts/loopzero-crds/templates/*.yaml | wc -l)
          echo "Source CRDs: $SRC_COUNT"
          echo "Chart CRDs: $DST_COUNT"
          if [ "$SRC_COUNT" -ne "$DST_COUNT" ]; then
            echo "::error::CRD count mismatch: source=$SRC_COUNT chart=$DST_COUNT. Run 'task helm:sync-crds' to fix."
            exit 1
          fi

      - name: Check CRD content drift
        run: |
          DRIFT=0
          for src in operators/config/crd/bases/loopzero.io_*.yaml; do
            short=$(basename "$src" .yaml | sed 's/loopzero.io_//')
            dst="charts/loopzero-crds/templates/${short}.yaml"
            if [ ! -f "$dst" ]; then
              echo "::error::Missing CRD template: $dst (source: $src)"
              DRIFT=1
              continue
            fi
            # Extract spec from source and check it exists in template
            src_name=$(grep "^  name:" "$src" | head -1 | awk '{print $2}')
            if ! grep -q "$src_name" "$dst"; then
              echo "::error::CRD name mismatch for $short"
              DRIFT=1
            fi
          done
          if [ "$DRIFT" -ne 0 ]; then
            echo "::error::CRD drift detected. Run 'task helm:sync-crds' to fix."
            exit 1
          fi
          echo "CRDs are in sync"

  # ──────────────────────────────────────────────────────────────────────
  # Package + Push (only on push to main/develop/homolog, not PRs)
  # ──────────────────────────────────────────────────────────────────────
  package-push:
    name: Package & Push OCI
    runs-on: ubuntu-latest
    needs: [lint, validate, crd-sync]
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'main' && 'infra-prod' || 'infra-dev' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Install yq
        run: |
          curl -sL https://github.com/mikefarah/yq/releases/download/v4.43.1/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to DOCR
        run: |
          echo "${{ secrets.DIGITALOCEAN_TOKEN }}" | \
            helm registry login registry.digitalocean.com \
              --username "${{ secrets.DIGITALOCEAN_TOKEN }}" \
              --password-stdin

      - name: Update dependencies
        run: |
          for chart in charts/*/; do
            if [ -f "$chart/Chart.yaml" ] && grep -q "dependencies:" "$chart/Chart.yaml"; then
              helm dependency update "$chart"
            fi
          done

      - name: Package and push sub-charts (before umbrella)
        run: |
          mkdir -p /tmp/helm-packages

          # Step 1: Push all sub-charts FIRST (umbrella depends on them in OCI)
          for chart in charts/*/; do
            name=$(yq '.name' "$chart/Chart.yaml")
            version=$(yq '.version' "$chart/Chart.yaml")

            # Skip umbrella — it's published last after rewrite
            if [ "$name" = "loopzero-platform" ]; then
              echo "Deferring umbrella chart (published last)"
              continue
            fi

            # Library charts ARE published — umbrella needs them via OCI refs

            # Immutability guard
            if helm pull "${{ env.OCI_REGISTRY }}/$name" --version "$version" 2>/dev/null; then
              echo "::notice::$name:$version already exists — skipping"
              continue
            fi

            echo "::group::Package + push $name:$version"
            helm package "$chart" --destination /tmp/helm-packages/
            helm push "/tmp/helm-packages/${name}-${version}.tgz" "${{ env.OCI_REGISTRY }}"
            echo "::endgroup::"
          done

      - name: Rewrite umbrella refs and push
        run: |
          OCI_REGISTRY="${{ env.OCI_REGISTRY }}"

          # Rewrite all file:// refs to oci:// via yq (NOT sed)
          yq -i '(.dependencies[] | select(.repository == "file://*")).repository = "'"$OCI_REGISTRY"'"' \
            charts/loopzero-platform/Chart.yaml

          # Pin exact versions from sub-charts
          for chart in charts/*/Chart.yaml; do
            name=$(yq '.name' "$chart")
            version=$(yq '.version' "$chart")
            yq -i "(.dependencies[] | select(.name == \"$name\")).version = \"$version\"" \
              charts/loopzero-platform/Chart.yaml 2>/dev/null || true
          done

          # Regenerate Chart.lock with OCI refs (sub-charts already in registry)
          helm dependency update charts/loopzero-platform

          # Package and push umbrella
          VERSION=$(yq '.version' charts/loopzero-platform/Chart.yaml)
          if helm pull "$OCI_REGISTRY/loopzero-platform" --version "$VERSION" 2>/dev/null; then
            echo "::notice::loopzero-platform:$VERSION already exists — skipping"
          else
            helm package charts/loopzero-platform --destination /tmp/helm-packages/
            helm push "/tmp/helm-packages/loopzero-platform-${VERSION}.tgz" "$OCI_REGISTRY"
          fi

      - name: Sign charts with cosign
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          for chart in charts/*/; do
            name=$(yq '.name' "$chart/Chart.yaml")
            version=$(yq '.version' "$chart/Chart.yaml")
            if [ "$(yq '.type' "$chart/Chart.yaml")" = "library" ]; then
              continue
            fi
            echo "Signing $name:$version"
            cosign sign --key env://COSIGN_KEY \
              "${{ env.OCI_REGISTRY }}/$name:$version" || true
          done

      - name: Verify published charts
        run: |
          for chart in charts/*/; do
            name=$(yq '.name' "$chart/Chart.yaml")
            version=$(yq '.version' "$chart/Chart.yaml")
            if [ "$(yq '.type' "$chart/Chart.yaml")" = "library" ]; then
              continue
            fi
            echo "Verifying $name:$version..."
            helm pull "${{ env.OCI_REGISTRY }}/$name" --version "$version" --destination /tmp/helm-verify/
          done
          echo "All charts verified"
