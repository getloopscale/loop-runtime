# Progressive load testing — runs against dev environment.
# Triggered manually or on schedule (weekly baseline).
#
# Levels:
#   L0 — Single deploy baseline
#   L1 — 10 tenants concurrent + webhook burst
#   L2 — 50 tenants sustained
#   L3 — 100 tenants concurrent (milestone)
#   L4 — Lock stress (50 concurrent same project)

name: Load Test

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Test level (L0/L1/L2/L3/L4/all)"
        required: true
        default: "L0"
        type: choice
        options:
          - L0
          - L1
          - L2
          - L3
          - L4
          - all
      api_url:
        description: "API endpoint (default: dev)"
        required: false
        default: "https://api.dev.loopzero.example"
  schedule:
    # Weekly baseline (L0) — Monday 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  LOOPZERO_LOAD_TEST: "1"
  LOOPZERO_API_URL: ${{ inputs.api_url || 'https://api.dev.loopzero.example' }}

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.work
          cache-dependency-path: infra/tests/go.sum

      - name: Determine test pattern
        id: pattern
        run: |
          LEVEL="${{ inputs.level || 'L0' }}"
          case "$LEVEL" in
            L0) echo "pattern=TestL0_Baseline" >> "$GITHUB_OUTPUT" ;;
            L1) echo "pattern=TestL1_" >> "$GITHUB_OUTPUT" ;;
            L2) echo "pattern=TestL2_" >> "$GITHUB_OUTPUT" ;;
            L3) echo "pattern=TestL3_" >> "$GITHUB_OUTPUT" ;;
            L4) echo "pattern=TestL4_" >> "$GITHUB_OUTPUT" ;;
            all) echo "pattern=TestL" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run load test
        env:
          LOOPZERO_SERVICE_AUTH: ${{ secrets.LOOPZERO_SERVICE_AUTH_SECRET }}
          LOOPZERO_LOAD_TENANT: "loadtest-tn-0"
        run: |
          cd infra/tests
          go test ./load/ -v -run "${{ steps.pattern.outputs.pattern }}" -timeout 120m 2>&1 | tee /tmp/load-test-output.txt

      - name: Upload results
        if: always()
        # pragma: allow-tag-pin
        # TODO(INF-G18 / plan T1.1): Renovate Bot resolves to @<sha40> on first run.
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: load-test-results-${{ inputs.level || 'L0' }}-${{ github.run_number }}
          path: /tmp/load-test-output.txt
          retention-days: 90

      - name: Post summary
        if: always()
        run: |
          echo "## Load Test Results (${{ inputs.level || 'L0' }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -A 20 "LOAD TEST REPORT\|LOCK STRESS REPORT" /tmp/load-test-output.txt >> "$GITHUB_STEP_SUMMARY" || echo "No report found" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
