# Build and push container images to DigitalOcean Container Registry.
#
# Trigger map:
#   push to develop → build + push with :dev tag + :sha tag
#   push to homolog → build + push with :staging tag + :sha tag
#   push to main    → build + push with :latest tag + :sha tag
#   workflow_dispatch → manual build for any component
#
# DOKS clusters pull from the registry automatically when integrated
# via `doctl kubernetes cluster registry add` (done in infra-deploy post-step).
#
# Required secrets (set per GitHub Environment):
#   DIGITALOCEAN_TOKEN — DO API token (registry login + push)

name: "Build: Container Images"

on:
  # Only build images after CI passes — prevents pushing untested images to registry.
  # Fix for CICD-002: build-images.yml previously ran independently of CI.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop, homolog, main]

  workflow_dispatch:
    inputs:
      component:
        description: "Component to build"
        required: true
        type: choice
        options:
          - all
          - api
          - operator

permissions:
  contents: read

env:
  REGISTRY: registry.digitalocean.com/loopzero-infra-registry

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # RESOLVE — determine what to build and how to tag
  # ─────────────────────────────────────────────
  resolve:
    # Only proceed if CI workflow succeeded (skip on failure/cancellation).
    # workflow_dispatch bypasses this gate (manual builds always allowed).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Resolve build targets
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha_tag: ${{ steps.resolve.outputs.sha_tag }}
      env_tag: ${{ steps.resolve.outputs.env_tag }}
      build_api: ${{ steps.resolve.outputs.build_api }}
      build_operator: ${{ steps.resolve.outputs.build_operator }}
    steps:
      - name: Resolve tags and targets
        id: resolve
        run: |
          # For workflow_run events, use the triggering commit SHA.
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            SHA_SHORT="${{ github.event.workflow_run.head_sha }}"
            BRANCH="${{ github.event.workflow_run.head_branch }}"
          else
            SHA_SHORT="${{ github.sha }}"
            BRANCH="${{ github.ref_name }}"
          fi
          SHA_SHORT="${SHA_SHORT:0:7}"

          case "$BRANCH" in
            develop) TAG="dev" ;;
            homolog) TAG="staging" ;;
            main)    TAG="latest" ;;
            *)       TAG="dev" ;;
          esac

          # Also tag as the environment name for Pulumi stack references.
          # Pulumi stacks use IMAGE_TAG=config.environment (dev/staging/prod).
          # "main" maps to both :latest and :prod for production deploy.
          ENV_TAG=""
          case "$BRANCH" in
            develop) ENV_TAG="dev" ;;
            homolog) ENV_TAG="staging" ;;
            main)    ENV_TAG="prod" ;;
          esac

          # Determine which components to build
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.component }}" in
              all)      BUILD_API="true"; BUILD_OP="true" ;;
              api)      BUILD_API="true"; BUILD_OP="false" ;;
              operator) BUILD_API="false"; BUILD_OP="true" ;;
            esac
          else
            # On push: build everything (path filter already limits triggers)
            BUILD_API="true"
            BUILD_OP="true"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "env_tag=$ENV_TAG" >> "$GITHUB_OUTPUT"
          echo "build_api=$BUILD_API" >> "$GITHUB_OUTPUT"
          echo "build_operator=$BUILD_OP" >> "$GITHUB_OUTPUT"

          echo "### Build Targets" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`$TAG\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA | \`$SHA_SHORT\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| API | $BUILD_API |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Operator | $BUILD_OP |" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────
  # BUILD API
  # ─────────────────────────────────────────────
  build-api:
    name: Build loopzero-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: resolve
    if: needs.resolve.outputs.build_api == 'true'
    environment: infra-dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Login to DO Container Registry
        run: doctl registry login --expiry-seconds 3600

      - name: Build and push loopzero-api
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          SHA="${{ needs.resolve.outputs.sha_tag }}"
          ENV_TAG="${{ needs.resolve.outputs.env_tag }}"

          docker build -f api/Dockerfile \
            -t ${{ env.REGISTRY }}/loopzero-api:${TAG} \
            -t ${{ env.REGISTRY }}/loopzero-api:${SHA} \
            .

          docker push ${{ env.REGISTRY }}/loopzero-api:${TAG}
          docker push ${{ env.REGISTRY }}/loopzero-api:${SHA}

          # Push environment-specific tag (e.g., :prod) for Pulumi stack references.
          # INFRA-001: Pulumi uses IMAGE_TAG=config.environment which resolves to
          # "prod" for the production stack. Without this tag, production deploys
          # fail with ImagePullBackOff.
          if [[ -n "$ENV_TAG" && "$ENV_TAG" != "$TAG" ]]; then
            docker tag ${{ env.REGISTRY }}/loopzero-api:${TAG} ${{ env.REGISTRY }}/loopzero-api:${ENV_TAG}
            docker push ${{ env.REGISTRY }}/loopzero-api:${ENV_TAG}
            echo "- \`${{ env.REGISTRY }}/loopzero-api:${ENV_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "### loopzero-api" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/loopzero-api:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/loopzero-api:${SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────
  # BUILD OPERATOR
  # ─────────────────────────────────────────────
  build-operator:
    name: Build tenant-controller
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: resolve
    if: needs.resolve.outputs.build_operator == 'true'
    environment: infra-dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Login to DO Container Registry
        run: doctl registry login --expiry-seconds 3600

      - name: Build and push tenant-controller
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          SHA="${{ needs.resolve.outputs.sha_tag }}"
          ENV_TAG="${{ needs.resolve.outputs.env_tag }}"

          docker build -f operators/Dockerfile \
            -t ${{ env.REGISTRY }}/tenant-controller:${TAG} \
            -t ${{ env.REGISTRY }}/tenant-controller:${SHA} \
            .

          docker push ${{ env.REGISTRY }}/tenant-controller:${TAG}
          docker push ${{ env.REGISTRY }}/tenant-controller:${SHA}

          # Push environment-specific tag for Pulumi stack references (INFRA-001).
          if [[ -n "$ENV_TAG" && "$ENV_TAG" != "$TAG" ]]; then
            docker tag ${{ env.REGISTRY }}/tenant-controller:${TAG} ${{ env.REGISTRY }}/tenant-controller:${ENV_TAG}
            docker push ${{ env.REGISTRY }}/tenant-controller:${ENV_TAG}
            echo "- \`${{ env.REGISTRY }}/tenant-controller:${ENV_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "### tenant-controller" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/tenant-controller:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/tenant-controller:${SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────
  # BUILD LOOPZERO-PACKS-RUNNER (COMP-003 fix)
  # ─────────────────────────────────────────────
  build-loopzero-packs:
    name: Build loopzero-packs-runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: resolve
    # Always build loopzero-packs — it's a critical dependency for all deploys.
    # COMP-003: Previously had no CI job. If this image is missing from the
    # registry, every deploy for every tenant fails at Dockerfile generation.
    environment: infra-dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Login to DO Container Registry
        run: doctl registry login --expiry-seconds 3600

      - name: Build and push loopzero-packs-runner
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          SHA="${{ needs.resolve.outputs.sha_tag }}"

          docker build -f loopzero-packs/Dockerfile.generate \
            -t ${{ env.REGISTRY }}/loopzero-packs-runner:v0.1.0 \
            -t ${{ env.REGISTRY }}/loopzero-packs-runner:${SHA} \
            loopzero-packs/

          docker push ${{ env.REGISTRY }}/loopzero-packs-runner:v0.1.0
          docker push ${{ env.REGISTRY }}/loopzero-packs-runner:${SHA}

          echo "### loopzero-packs-runner" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/loopzero-packs-runner:v0.1.0\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/loopzero-packs-runner:${SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────
  # POST-BUILD — integrate registry with DOKS clusters
  # ─────────────────────────────────────────────
  integrate-registry:
    name: Integrate registry with DOKS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-api, build-operator, build-loopzero-packs]
    if: always() && (needs.build-api.result == 'success' || needs.build-operator.result == 'success' || needs.build-loopzero-packs.result == 'success')
    environment: infra-dev
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Add registry to DOKS clusters
        run: |
          # Discover cluster names dynamically — avoids hardcoding region.
          # doctl returns all DOKS clusters; we filter for loopzero-infra ones.
          CLUSTERS=$(doctl kubernetes cluster list --format Name --no-header 2>/dev/null | grep "^loopzero-infra" || true)
          if [ -z "$CLUSTERS" ]; then
            echo "::warning::No loopzero-infra DOKS clusters found"
            exit 0
          fi

          echo "### Registry Integration" >> "$GITHUB_STEP_SUMMARY"
          for CLUSTER in $CLUSTERS; do
            doctl kubernetes cluster registry add "$CLUSTER" 2>/dev/null || true
            echo "- ✅ $CLUSTER" >> "$GITHUB_STEP_SUMMARY"
          done

  # ─────────────────────────────────────────────
  # POST-BUILD — update CWTs on build cluster
  # ─────────────────────────────────────────────
  update-cwts:
    name: Update CWTs on build cluster
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-api, build-operator, build-loopzero-packs]
    if: always() && (needs.build-api.result == 'success' || needs.build-operator.result == 'success' || needs.build-loopzero-packs.result == 'success')
    environment: infra-dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.14.0

      - name: Update CWTs on build cluster
        run: |
          # Discover build cluster name dynamically — avoids hardcoding region.
          BUILD_CLUSTER=$(doctl kubernetes cluster list --format Name --no-header 2>/dev/null | grep "^loopzero-infra.*-build$" | head -1)
          if [ -z "$BUILD_CLUSTER" ]; then
            echo "::warning::Build cluster not found"
            exit 0
          fi

          # Get kubeconfig for the build cluster
          doctl kubernetes cluster kubeconfig save "$BUILD_CLUSTER"

          # Extract the kubectl context name from the saved kubeconfig
          BUILD_CONTEXT=$(kubectl config get-contexts -o name 2>/dev/null | grep "$BUILD_CLUSTER" | head -1)

          # Render and apply CWT templates from the local Helm chart.
          # This ensures CWTs always match the latest code, even if the
          # Pulumi Helm release version hasn't changed.
          helm template loopzero-build-cwts infra/helm/argo-workflows \
            --set minio.insecure=true | \
            kubectl apply --context "$BUILD_CONTEXT" -f -

          # Ensure buildkit-registry-config secret exists for image push.
          # BuildKit needs Docker config.json to push to DO Container Registry.
          # Without this, build-image pods hang in PodInitializing (AUDIT-2026-03-28).
          RW_CONFIG=$(doctl registry docker-config --read-write --expiry-seconds 2592000)
          kubectl create secret generic buildkit-registry-config \
            --context "$BUILD_CONTEXT" \
            --namespace argo \
            --from-literal=config.json="$RW_CONFIG" \
            --dry-run=client -o yaml | kubectl apply --context "$BUILD_CONTEXT" -f -

          echo "### CWT Update" >> "$GITHUB_STEP_SUMMARY"
          echo "- CWTs updated on $BUILD_CLUSTER" >> "$GITHUB_STEP_SUMMARY"
          echo "- buildkit-registry-config secret ensured" >> "$GITHUB_STEP_SUMMARY"
