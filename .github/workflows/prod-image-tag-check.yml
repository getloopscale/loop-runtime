---
# T1.16 — Mutable Production Image Tag Enforcement
# Rejects PRs that introduce :prod or :latest image tags in production
# manifests, per ADR-0020 D1 + MEET-2026-05-12 plan T1.16.
#
# Production manifests MUST reference immutable :sha7 tags so Git is the
# canonical source of truth for workload identity (INV-1).

name: Prod Image Tag Check (T1.16)

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'charts/**/*.yaml'
      - 'charts/**/*.yml'
      - 'infra/helm/**/*.yaml'
      - 'infra/helm/**/*.yml'
      - 'infra/helmfile/**/*.yaml'
      - 'infra/helmfile/**/*.yml'
      - 'pkg/quality/prodimagetags/**'
      - '.github/workflows/prod-image-tag-check.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  check-prod-image-tags:
    name: Reject mutable :prod / :latest tags in prod manifests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'
          cache-dependency-path: cmd/loopzero-ops/go.sum

      # T5.3 of plan 2026-05-22: migrated from infra/scripts/check-prod-image-tags.sh
      # to pure-Go gate (loopzero-ops). Same default scan paths + exemptions.
      - name: Run prod image tag enforcement (T1.16)
        run: cd cmd/loopzero-ops && go run . quality prod-image-tags --root "${GITHUB_WORKSPACE}"

      - name: Annotate violation
        if: failure()
        run: |
          echo "::error title=Mutable Prod Image Tag::Production manifest references :prod or :latest tag. Per ADR-0020 D1, production deploys MUST use immutable :sha7 tags. See workflow log for affected files. To override an intentional case, add '# loopzero:mutable-tag-allowed' comment + reference an ADR."
