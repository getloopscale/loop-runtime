# workflow-hygiene — as propriedades de #233 e #250, MAIS a integridade do observador do portao.
#
# Este repo hospeda `build-publish.yml`, o reusable que CINCO repos consumidores chamam. Um defeito
# nele nao fica nele: propaga no proximo build de todos. Os dois defeitos que este gate cobre ja
# foram corrigidos a mao uma vez, e nada impedia a reintroducao.
#
# O TERCEIRO ASSUNTO, adicionado em 2026-09-06 (B-192), e' de outra natureza e esta' aqui por um
# motivo estrutural, nao por conveniencia: `delivery-gate-armed.yml` e' o unico check que reprova
# quando o portao local de entrega nao esta' armado, E UM WORKFLOW NAO CONSEGUE REPORTAR A PROPRIA
# DELECAO. Apagado, ele nao fica vermelho: ele some, e um check ausente le, num PR, igualzinho a um
# repositorio que nunca o teve. Quem reporta essa delecao tem de ser um arquivo que o commit da
# delecao nao apaga junto — e' este. Ver `.github/scripts/assert-gate-observers-intact.py`.
name: workflow-hygiene
on:
  # OS TRES GATILHOS, e cada um cobre um momento que os outros nao alcancam.
  #
  # Ate' 2026-09-06 este bloco era so' `push: [develop, main]`. O cabecalho acima
  # descrevia "os DOIS gatilhos ... o de PR mata o defeito antes de entrar no
  # trunk" — verdade quando foi escrito, e falsa desde 464b9d7e3 (2026-08-12),
  # o commit que removeu o `pull_request` e criou a decisao pos-merge cujas tres
  # premissas o B-192 mediu falsas. A frase sobreviveu ao gatilho por todo esse
  # tempo; a rodada anterior do B-192 corrigiu a mesma mentira em
  # `check-workflow-hygiene.sh` e em `ci.yml` e deixou esta duas telas acima.
  #
  # `workspace` entra porque a janela medida foi de quatro dias e 21 commits NELE.
  # Sem `workspace`, o primeiro momento em que este arquivo poderia falar sobre um
  # observador apagado seria o PR de promocao — que e' o mesmo atraso de quatro
  # dias reaparecendo com outro nome.
  #
  # `pull_request` volta porque e' o unico momento PRE-MERGE em que a delecao do
  # observador aparece: num PR que apaga `delivery-gate-armed.yml`, aquele
  # workflow nao roda (foi apagado) e este roda e reprova. Sem ele, esse PR fica
  # verde. Custa segundos; `ci.yml` continua pos-merge por custo e por estar
  # vermelho, o que nao vale para este arquivo.
  push:
    branches: [workspace, develop, main]
    paths: [".github/**"]
  pull_request:
    branches: [develop, main]
    paths: [".github/**"]
  # Disparo manual: e' o gate mais barato do repo (segundos), entao e' com ele
  # que se valida a frota apos uma migracao — o runbook do umbrella e' explicito
  # em nao usar a suite longa para isso. Sem `workflow_dispatch` nao ha como
  # exercitar um runner sem antes mergear em `develop`, o que inverte a ordem:
  # validar-se-ia a frota DEPOIS de confiar nela.
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  hygiene:
    # Aspas obrigatorias: um `name:` terminado em `run:` o YAML le como mapping aninhado e o workflow
    # morre em `startup_failure` — sem job algum, portanto sem sinal vermelho util.
    name: "workflows — observador do portao intacto + actionlint + SHA-pin + sem interpolacao em run:"
    # Frota Blacksmith, habilitada com a transferencia para a org `getloopscale`
    # (2026-07-30). Label LITERAL: `vars.CI_RUNNER` nao resolve no repo e o
    # fallback devolve a frota antiga em silencio (runbook do umbrella).
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # PRIMEIRO passo, e a ordem e' deliberada. Os passos param no primeiro que
      # falha, entao um actionlint vermelho por qualquer outro motivo esconderia
      # este veredito — e este e' o unico assunto deste arquivo que nenhum outro
      # arquivo cobre. Custa milissegundos: le' dois YAML e sai.
      #
      # Se o script sumir, `python3` sai diferente de zero e o passo reprova.
      # Fecha por construcao: apagar o verificador nao produz um verde.
      - name: o observador do portao de entrega esta' intacto
        run: python3 .github/scripts/assert-gate-observers-intact.py

      # actionlint entra AQUI, e nao num workflow proprio como no loopzero-memory.
      #
      # Os dois checam a mesma coisa — correcao de workflow — e separa-los daria
      # duas superficies com os mesmos gatilhos e os mesmos `paths: .github/**`,
      # que divergem no dia em que alguem editar so' uma. O modelo os separa
      # porque la' nasceram em momentos diferentes, nao por contrato.
      #
      # A cobertura e' COMPLEMENTAR, nao sobreposta:
      #   actionlint                 sintaxe, expressoes, labels de runner, e
      #                              shellcheck DENTRO dos blocos `run:`
      #   check-workflow-hygiene.sh  SHA-pin das actions (#233) e ausencia de
      #                              `${{ }}` dentro de `run:` (#250)
      #
      # Nenhum dos dois pega o que o outro pega. Rodar so' um deixa metade.
      #
      # Imagem fixada por DIGEST, mesmo padrao do loopzero-memory: um `:latest` num
      # gate de qualidade e' a mesma classe de risco de supply-chain que o gate
      # ao lado existe para impedir.
      - name: actionlint (workflows + shellcheck dos blocos run:)
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      - run: bash .github/scripts/check-workflow-hygiene.sh
