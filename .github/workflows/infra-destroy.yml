# Infrastructure Destroy — tears down a complete environment.
#
# Manual trigger only. Requires GitHub Environment approval for ALL stacks.
# Stack-scoped — only deletes resources matching the exact stack prefix.
# Does NOT reset Pulumi state — use infra-state-reset.yml for that.

name: "Infra: Destroy"

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "Target stack to destroy"
        required: true
        type: choice
        options: [dev, homolog, prod]
      confirm:
        description: "Type DESTROY {stack} to confirm (e.g., DESTROY dev)"
        required: true
        type: string

permissions:
  contents: read

env:
  PULUMI_WORKING_DIR: infra/pulumi
  PULUMI_BACKEND_URL: "s3://loopzero-infra-pulumi-state?endpoint=nyc3.digitaloceanspaces.com&region=us-east-1&s3ForcePathStyle=true"
  PULUMI_HOMOLOG_BACKEND_URL: "s3://loopzero-homolog-pulumi-state?endpoint=sfo3.digitaloceanspaces.com&region=us-east-1&s3ForcePathStyle=true"

jobs:
  destroy:
    name: "Destroy ${{ inputs.stack }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: infra-${{ inputs.stack }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Validate confirmation
        run: |
          EXPECTED="DESTROY ${{ inputs.stack }}"
          if [ "${{ inputs.confirm }}" != "$EXPECTED" ]; then
            echo "::error::Confirmation mismatch. Expected: '$EXPECTED', got: '${{ inputs.confirm }}'"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ env.PULUMI_WORKING_DIR }}/package-lock.json

      - name: Install Pulumi CLI
        run: curl -fsSL https://get.pulumi.com | PULUMI_VERSION=3.227.0 sh

      - name: Install dependencies
        working-directory: ${{ env.PULUMI_WORKING_DIR }}
        run: npm ci

      - name: Login to Pulumi backend
        working-directory: ${{ env.PULUMI_WORKING_DIR }}
        run: |
          BACKEND="${{ env.PULUMI_BACKEND_URL }}"
          [ "${{ inputs.stack }}" = "homolog" ] && BACKEND="${{ env.PULUMI_HOMOLOG_BACKEND_URL }}"
          pulumi login "$BACKEND"

      - name: Pre-destroy summary
        working-directory: ${{ env.PULUMI_WORKING_DIR }}
        run: |
          STACK="${{ inputs.stack }}"
          echo "### Resources to be destroyed (stack: $STACK)" >> "$GITHUB_STEP_SUMMARY"
          pulumi stack --stack "organization/loopzero-infra/$STACK" export 2>/dev/null | \
            python3 -c "import sys,json; resources=json.load(sys.stdin)['deployment']['resources']; print(f'Total: {len(resources)} resources'); [print(f'  - {r[\"type\"].split(\"::\")[-1]}') for r in resources if r.get('type') != 'pulumi:pulumi:Stack']" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null

      - name: Pre-destroy cleanup
        run: STACK="${{ inputs.stack }}" bash infra/scripts/pre-destroy-cleanup.sh
        continue-on-error: true

      - name: Pulumi destroy
        working-directory: ${{ env.PULUMI_WORKING_DIR }}
        run: |
          STACK="${{ inputs.stack }}"
          PULUMI_K8S_DELETE_UNREACHABLE=true pulumi destroy --yes --skip-preview --stack "organization/loopzero-infra/$STACK" --non-interactive

      - name: Post-destroy validation
        if: always()
        run: |
          echo "### Post-Destroy Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "Checking for surviving resources..." >> "$GITHUB_STEP_SUMMARY"
          REGION=$(cd ${{ env.PULUMI_WORKING_DIR }} && pulumi config get region --stack "organization/loopzero-infra/${{ inputs.stack }}" 2>/dev/null || echo "sfo3")
          PREFIX="loopzero-infra-${{ inputs.stack }}-${REGION}"
          echo "| Resource | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          CLUSTERS=$(doctl kubernetes cluster list --no-header --format Name 2>/dev/null | grep "^$PREFIX" || echo "(none)")
          echo "| Clusters | $CLUSTERS |" >> "$GITHUB_STEP_SUMMARY"
          DBS=$(doctl databases list --no-header --format Name 2>/dev/null | grep "^$PREFIX" || echo "(none)")
          echo "| Databases | $DBS |" >> "$GITHUB_STEP_SUMMARY"
