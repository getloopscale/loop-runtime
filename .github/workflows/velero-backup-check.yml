# velero-backup-check — daily Velero backup freshness verification.
# velero-backup-dr-plan v1.0 / T4.3.
#
# Verifies, against the production mgmt cluster:
#   1. BackupStorageLocation `default` is Available
#   2. Each of the 5 loopzero-* schedules has a Completed backup within RPO
#   3. infra/scripts/velero-dr-drill.sh --dry-run exits 0
# On failure, creates a GitHub issue tagged backup-freshness/critical.

name: Velero Backup Check

on:
  schedule:
    # Daily 08:00 UTC — checks the previous day's overnight backups.
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # for opening freshness alerts

concurrency:
  group: velero-check
  cancel-in-progress: true

jobs:
  freshness-check:
    name: Verify Velero backup freshness
    runs-on: ubuntu-latest
    # Don't run on forks — the kubeconfig secret is not available there
    # and the workflow would fail noisily.
    if: github.repository == 'loopzero/loopzero'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.32.0'

      - name: Install Velero CLI
        run: |
          set -euo pipefail
          VELERO_VERSION=v1.14.1
          curl -sL "https://github.com/vmware-tanzu/velero/releases/download/${VELERO_VERSION}/velero-${VELERO_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          sudo mv "/tmp/velero-${VELERO_VERSION}-linux-amd64/velero" /usr/local/bin/velero
          velero version --client-only

      - name: Configure kubeconfig (mgmt cluster)
        env:
          MGMT_KUBECONFIG: ${{ secrets.MGMT_KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$MGMT_KUBECONFIG" ]; then
            echo "::error::MGMT_KUBECONFIG secret missing"; exit 1
          fi
          mkdir -p ~/.kube
          printf '%s' "$MGMT_KUBECONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version --client

      - name: Probe BackupStorageLocation
        id: bsl
        run: |
          set +e
          phase=$(velero -n velero-system backup-location get -o json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["items"][0]["status"]["phase"])')
          rc=$?
          set -e
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] || [ "$phase" != "Available" ]; then
            echo "::error::BSL phase=$phase (expected Available)"
            exit 1
          fi

      - name: Check schedule freshness
        id: freshness
        run: |
          set -euo pipefail
          # Each LoopZero schedule must have a Completed backup whose
          # startTimestamp is within its RPO window:
          #   loopzero-crds-backup       -> 12h
          #   loopzero-argocd-backup     -> 12h
          #   loopzero-gitea-backup      -> 28h (daily + 4h slack)
          #   loopzero-secrets-backup    -> 12h
          #   loopzero-full-backup       -> 8d (weekly + 1d slack)
          declare -A RPO_HOURS=(
            [loopzero-crds-backup]=12
            [loopzero-argocd-backup]=12
            [loopzero-gitea-backup]=28
            [loopzero-secrets-backup]=12
            [loopzero-full-backup]=192
          )
          fail=0
          report=""
          for sched in "${!RPO_HOURS[@]}"; do
            rpo="${RPO_HOURS[$sched]}"
            ts=$(velero -n velero-system backup get \
              --selector "velero.io/schedule-name=$sched" \
              --sort-by=.status.startTimestamp -o json \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); items=[b for b in d.get("items",[]) if b.get("status",{}).get("phase")=="Completed"]; print(items[-1]["status"]["startTimestamp"] if items else "")')
            if [ -z "$ts" ]; then
              echo "::error::No completed backup for schedule=$sched"
              report+=$'\n'"- $sched: no completed backups"
              fail=1
              continue
            fi
            age_h=$(TS_VAL="$ts" python3 -c 'import os,datetime; t=datetime.datetime.fromisoformat(os.environ["TS_VAL"].replace("Z","+00:00")); now=datetime.datetime.now(datetime.timezone.utc); print(int((now-t).total_seconds()//3600))')
            if [ "$age_h" -gt "$rpo" ]; then
              echo "::error::Schedule $sched age=${age_h}h > RPO=${rpo}h"
              report+=$'\n'"- $sched: age ${age_h}h > RPO ${rpo}h"
              fail=1
            else
              echo "$sched OK (age=${age_h}h, rpo=${rpo}h)"
            fi
          done
          {
            echo "report<<__EOF__"
            echo "$report"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          exit "$fail"

      - name: Run DR drill (dry-run)
        run: |
          bash infra/scripts/velero-dr-drill.sh --dry-run --context default

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Velero backup freshness check failed (${new Date().toISOString().slice(0,10)})`;
            const body = [
              "## Velero backup freshness alert",
              "",
              "Daily freshness probe failed. See the workflow run for details.",
              "",
              `- Run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              "- Runbook: docs/runbooks/disaster-recovery-restore.md",
              "",
              "Investigate within RPO window — production is at risk if backups are stuck."
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["backup-freshness", "critical"]
            });
