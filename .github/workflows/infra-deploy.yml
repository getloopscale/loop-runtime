# Infrastructure Deploy — provisions cloud resources via Pulumi
#
# Trigger map:
#   push to develop  → deploy to dev   (automatic)
#   push to main     → deploy to prod  (requires approval)
#   workflow_dispatch → manual operations (any stack, any command)
#
# State backend: DigitalOcean Spaces (S3-compatible) — no Pulumi Cloud dependency.
#
# Required secrets (set per GitHub Environment):
#   DIGITALOCEAN_TOKEN         — DO API token (full access for provisioning)
#   SPACES_ACCESS_KEY_ID       — DO Spaces access key (for state backend)
#   SPACES_SECRET_ACCESS_KEY   — DO Spaces secret key (for state backend)
#   PULUMI_CONFIG_PASSPHRASE   — Passphrase for secrets encryption in state
#
# Required GitHub Environments:
#   infra-dev   — no protection rules (auto-deploy)
#   infra-prod  — required reviewers + deployment branch = main

name: "Infra: Deploy"

on:
  push:
    branches: [develop, main]
    paths:
      - "infra/pulumi/**"
      - "infra/helm/**"
      - "api/internal/db/migrations/**"
      - ".github/workflows/infra-deploy.yml"

  workflow_dispatch:
    inputs:
      stack:
        description: "Target stack"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      command:
        description: "Pulumi command"
        required: true
        type: choice
        options:
          - up
          - preview
          - refresh
          - destroy
      message:
        description: "Reason for this operation"
        required: false
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PULUMI_WORKING_DIR: infra/pulumi
  PULUMI_BACKEND_URL: s3://loopzero-infra-pulumi-state?endpoint=nyc3.digitaloceanspaces.com&region=us-east-1

jobs:
  # ─────────────────────────────────────────────
  # RESOLVE — determine stack and environment
  # ─────────────────────────────────────────────
  resolve:
    name: Resolve deployment target
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      stack: ${{ steps.resolve.outputs.stack }}
      environment: ${{ steps.resolve.outputs.environment }}
      command: ${{ steps.resolve.outputs.command }}
    steps:
      - name: Resolve from trigger
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            STACK="${{ inputs.stack }}"
            COMMAND="${{ inputs.command }}"
          else
            case "${{ github.ref_name }}" in
              develop) STACK="dev" ;;
              main)    STACK="prod" ;;
              *)       echo "::error::Unexpected branch: ${{ github.ref_name }}" && exit 1 ;;
            esac
            COMMAND="up"
          fi

          case "$STACK" in
            dev)     ENV="infra-dev" ;;
            staging) ENV="infra-staging" ;;
            prod)    ENV="infra-prod" ;;
          esac

          echo "stack=$STACK" >> "$GITHUB_OUTPUT"
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "command=$COMMAND" >> "$GITHUB_OUTPUT"

          echo "### Deployment Target" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stack | \`$STACK\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Command | \`$COMMAND\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`$ENV\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| State backend | S3 (DigitalOcean Spaces) |" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────
  # VALIDATE — typecheck + tests (gate before deploy)
  # ─────────────────────────────────────────────
  validate:
    name: Validate Pulumi code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.PULUMI_WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.PULUMI_WORKING_DIR }}
        run: npm ci

      - name: Type check
        working-directory: ${{ env.PULUMI_WORKING_DIR }}
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: ${{ env.PULUMI_WORKING_DIR }}
        run: npm test

  # ─────────────────────────────────────────────
  # DEPLOY — execute Pulumi command
  # ─────────────────────────────────────────────
  deploy:
    name: "${{ needs.resolve.outputs.command }} → ${{ needs.resolve.outputs.stack }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [resolve, validate]
    environment: ${{ needs.resolve.outputs.environment }}

    # CRITICAL: never cancel a running deploy — creates orphaned resources
    concurrency:
      group: infra-deploy-${{ needs.resolve.outputs.stack }}
      cancel-in-progress: false

    env:
      # S3 state backend auth (Pulumi reads AWS_* for S3 protocol)
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      # DO provider auth for Spaces resources (buckets, objects)
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.PULUMI_WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.PULUMI_WORKING_DIR }}
        run: npm ci

      - name: Login to S3 state backend
        run: pulumi login "$PULUMI_BACKEND_URL"

      # --- Pre-destroy: remove K8s finalizers that block deletion ---
      # CRD finalizers, ArgoCD app finalizers, and Helm release finalizers
      # cause deadlocks during destroy (controllers being deleted can't process
      # their own finalizers). Removing them first allows clean deletion.
      - name: Pre-destroy cleanup (remove finalizers)
        if: needs.resolve.outputs.command == 'destroy'
        continue-on-error: true
        working-directory: ${{ env.PULUMI_WORKING_DIR }}
        run: |
          set +e
          STACK="${{ needs.resolve.outputs.stack }}"
          KUBECONFIG_DATA=$(pulumi stack output mgmtKubeconfig --show-secrets --stack "$STACK" 2>/dev/null)
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "No kubeconfig found — skipping finalizer cleanup"
            exit 0
          fi

          echo "$KUBECONFIG_DATA" > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig

          echo "Removing ArgoCD application finalizers..."
          kubectl -n platform-system get applications -o name 2>/dev/null | xargs -I{} kubectl -n platform-system patch {} --type=json -p '[{"op":"remove","path":"/metadata/finalizers"}]' 2>/dev/null || true

          echo "Removing CRD finalizers..."
          kubectl get crd -o name 2>/dev/null | grep loopzero.io | xargs -I{} kubectl patch {} --type=json -p '[{"op":"remove","path":"/metadata/finalizers"}]' 2>/dev/null || true

          echo "Removing tenant finalizers..."
          kubectl -n platform-system get tenants -o name 2>/dev/null | xargs -I{} kubectl -n platform-system patch {} --type=json -p '[{"op":"remove","path":"/metadata/finalizers"}]' 2>/dev/null || true

          echo "Force-deleting stuck namespaces..."
          for NS in platform-system argo; do
            kubectl delete ns "$NS" --force --grace-period=0 2>/dev/null || true
          done

          # Also clean build and runtime clusters
          for CLUSTER_KEY in buildKubeconfig runtimeKubeconfig; do
            KC=$(pulumi stack output "$CLUSTER_KEY" --show-secrets --stack "$STACK" 2>/dev/null)
            if [ -n "$KC" ]; then
              echo "$KC" > /tmp/kc-remote
              kubectl --kubeconfig=/tmp/kc-remote get ns -o name 2>/dev/null | grep -E "loopzero-|build-|argo" | xargs -I{} kubectl --kubeconfig=/tmp/kc-remote delete {} --force --grace-period=0 2>/dev/null || true
            fi
          done

          echo "Finalizer cleanup complete"

      # --- Step 1: Pulumi (non-up commands run directly) ---
      - name: "Run: pulumi ${{ needs.resolve.outputs.command }}"
        id: pulumi
        if: needs.resolve.outputs.command != 'up'
        uses: pulumi/actions@v6
        with:
          command: ${{ needs.resolve.outputs.command }}
          stack-name: ${{ needs.resolve.outputs.stack }}
          work-dir: ${{ env.PULUMI_WORKING_DIR }}
          upsert: true

      # --- Step 1 (up): Infrastructure provisioning ---
      # Creates clusters, DB, registry, Helm charts. Deployments will fail
      # (no images yet) — that's OK, Step 3 handles convergence.
      - name: "Step 1: Provision infrastructure"
        id: infra
        if: needs.resolve.outputs.command == 'up'
        working-directory: ${{ env.PULUMI_WORKING_DIR }}
        continue-on-error: true
        run: pulumi up --yes --skip-preview --stack ${{ needs.resolve.outputs.stack }} --non-interactive

      # --- Step 2: Build and push container images ---
      - name: "Step 2: Build container images"
        if: needs.resolve.outputs.command == 'up'
        working-directory: ${{ env.PULUMI_WORKING_DIR }}
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          STACK="${{ needs.resolve.outputs.stack }}"
          REGISTRY_NAME=$(pulumi stack output registryName --show-secrets --stack "$STACK" 2>/dev/null || echo "")

          if [ -z "$REGISTRY_NAME" ]; then
            echo "::error::Registry not created. Step 1 may have failed completely."
            exit 1
          fi

          REGISTRY="registry.digitalocean.com/$REGISTRY_NAME"

          # Install doctl
          curl -sL https://github.com/digitalocean/doctl/releases/download/v1.104.0/doctl-1.104.0-linux-amd64.tar.gz | tar xz -C /usr/local/bin
          doctl auth init --access-token "$DIGITALOCEAN_ACCESS_TOKEN"
          doctl registry login --expiry-seconds 600

          # Build images
          cd "$GITHUB_WORKSPACE"
          echo "Building loopzero-api..."
          docker build -f api/Dockerfile -t "$REGISTRY/loopzero-api:dev" .
          docker push "$REGISTRY/loopzero-api:dev"

          echo "Building tenant-controller..."
          docker build -f operators/Dockerfile -t "$REGISTRY/tenant-controller:dev" .
          docker push "$REGISTRY/tenant-controller:dev"

          # Integrate registry with DOKS clusters
          cd "$GITHUB_WORKSPACE/${{ env.PULUMI_WORKING_DIR }}"
          for KEY in mgmtClusterName buildClusterName runtimeClusterName; do
            CLUSTER=$(pulumi stack output "$KEY" --stack "$STACK" 2>/dev/null || echo "")
            [ -n "$CLUSTER" ] && doctl kubernetes cluster registry add "$CLUSTER" 2>/dev/null || true
          done

          # Create Spaces bucket for build artifacts
          aws s3 mb "s3://loopzero-builds" --endpoint-url "https://nyc3.digitaloceanspaces.com" --region us-east-1 2>/dev/null || true

      # --- Step 3: Convergence — deployments pull images and start ---
      - name: "Step 3: Deploy applications (convergence)"
        if: needs.resolve.outputs.command == 'up'
        working-directory: ${{ env.PULUMI_WORKING_DIR }}
        run: pulumi up --yes --skip-preview --stack ${{ needs.resolve.outputs.stack }} --non-interactive

      # --- Post-deploy: capture execution state ---
      - name: Capture execution state
        if: always() && needs.resolve.outputs.command == 'up'
        continue-on-error: true
        working-directory: ${{ env.PULUMI_WORKING_DIR }}
        run: |
          set +e
          STACK="${{ needs.resolve.outputs.stack }}"

          echo "### Execution State" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          EXEC_OUT=$(pulumi stack output execution --json --stack "$STACK" 2>&1)
          if [ $? -eq 0 ]; then
            echo "$EXEC_OUT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '{"status": "could not retrieve execution state"}' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### Wiring" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          WIRING_OUT=$(pulumi stack output wiring --json --stack "$STACK" 2>&1)
          if [ $? -eq 0 ]; then
            echo "$WIRING_OUT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '{"status": "could not retrieve wiring"}' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # --- Post-deploy: bootstrap Gitea + ArgoCD credentials ---
      - name: Bootstrap platform credentials
        if: success() && needs.resolve.outputs.command == 'up'
        continue-on-error: true
        run: |
          set +e
          STACK="${{ needs.resolve.outputs.stack }}"

          # Install doctl and kubectl
          curl -sL https://github.com/digitalocean/doctl/releases/download/v1.104.0/doctl-1.104.0-linux-amd64.tar.gz | tar xz -C /usr/local/bin
          curl -sLO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && mv kubectl /usr/local/bin/

          # Get mgmt kubeconfig from Pulumi
          cd ${{ env.PULUMI_WORKING_DIR }}
          pulumi stack output mgmtKubeconfig --show-secrets --stack "$STACK" > /tmp/kubeconfig 2>/dev/null
          export KUBECONFIG=/tmp/kubeconfig

          NAMESPACE="platform-system"

          # 1. Wait for Gitea pod to be ready
          echo "Waiting for Gitea pod..."
          kubectl -n $NAMESPACE wait --for=condition=ready pod -l app.kubernetes.io/name=gitea --timeout=120s 2>/dev/null || true

          # 2. Generate Gitea admin token (idempotent — check if exists first)
          GITEA_POD=$(kubectl -n $NAMESPACE get pod -l app.kubernetes.io/name=gitea -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if [ -z "$GITEA_POD" ]; then
            echo "::warning::Gitea pod not found, skipping bootstrap"
            exit 0
          fi

          EXISTING_TOKEN=$(kubectl -n $NAMESPACE get secret loopzero-platform-tokens -o jsonpath='{.data.GITEA_TOKEN}' 2>/dev/null | base64 -d)
          GITEA_URL="http://gitea-http.${NAMESPACE}.svc.cluster.local:3000"

          if [ "$EXISTING_TOKEN" != "placeholder-set-after-first-deploy" ] && [ -n "$EXISTING_TOKEN" ]; then
            echo "Gitea token already set, skipping token generation"
            GITEA_TOKEN="$EXISTING_TOKEN"
          else
            echo "Generating Gitea admin token..."
            GITEA_TOKEN=$(kubectl -n $NAMESPACE exec "$GITEA_POD" -- gitea admin user generate-access-token --username gitea_admin --token-name "loopzero-platform-$(date +%s)" --scopes all 2>/dev/null | grep -oP 'Access token was successfully created: \K.*')
            if [ -z "$GITEA_TOKEN" ]; then
              echo "::warning::Failed to generate Gitea token"
              exit 0
            fi
            echo "Gitea token generated successfully"
          fi

          # 3. Get ArgoCD admin password
          ARGOCD_PASS=$(kubectl -n $NAMESPACE get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' 2>/dev/null | base64 -d)

          # 4. Update loopzero-platform-tokens Secret
          kubectl -n $NAMESPACE create secret generic loopzero-platform-tokens \
            --from-literal=GITEA_TOKEN="$GITEA_TOKEN" \
            --from-literal=ARGOCD_TOKEN="$ARGOCD_PASS" \
            --dry-run=client -o yaml | kubectl apply -f - 2>/dev/null

          # 5. Update gitea-repo-creds Secret for ArgoCD
          kubectl -n $NAMESPACE create secret generic gitea-repo-creds \
            --from-literal=type=git \
            --from-literal=url="http://gitea-http.${NAMESPACE}.svc.cluster.local:3000" \
            --from-literal=username=gitea_admin \
            --from-literal=password="$GITEA_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f - 2>/dev/null
          kubectl -n $NAMESPACE label secret gitea-repo-creds argocd.argoproj.io/secret-type=repo-creds --overwrite 2>/dev/null

          # 6. Create Gitea orgs (idempotent)
          kubectl -n $NAMESPACE port-forward svc/gitea-http 13000:3000 &
          PF_PID=$!
          sleep 3
          for ORG in loopzero loopzero-platform; do
            curl -sf "http://localhost:13000/api/v1/orgs/$ORG" -H "Authorization: token $GITEA_TOKEN" > /dev/null 2>&1 || \
              curl -sf -X POST "http://localhost:13000/api/v1/orgs" \
                -H "Authorization: token $GITEA_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"username\":\"$ORG\",\"visibility\":\"private\"}" > /dev/null 2>&1 || true
          done
          kill $PF_PID 2>/dev/null

          # 7. Restart API to pick up new tokens
          kubectl -n $NAMESPACE rollout restart deployment loopzero-api 2>/dev/null || true
          kubectl -n $NAMESPACE delete pod -l app=tenant-controller 2>/dev/null || true

          echo "### ✅ Platform credentials bootstrapped" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gitea token: generated" >> "$GITHUB_STEP_SUMMARY"
          echo "- ArgoCD password: configured" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gitea orgs: loopzero, loopzero-platform" >> "$GITHUB_STEP_SUMMARY"
          echo "- ArgoCD repo credentials: configured" >> "$GITHUB_STEP_SUMMARY"

      # --- Post-deploy: verify all phases completed ---
      - name: Verify deployment health
        if: success() && needs.resolve.outputs.command == 'up'
        continue-on-error: true
        working-directory: ${{ env.PULUMI_WORKING_DIR }}
        run: |
          set +e
          EXECUTION=$(pulumi stack output execution --json --stack ${{ needs.resolve.outputs.stack }} 2>&1)
          if [ $? -ne 0 ]; then
            echo "::warning::Could not retrieve execution state"
            echo "### ⚠️ Could not verify deployment health" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          PENDING=$(echo "$EXECUTION" | jq -r '.phases[]? | select(.status != "completed") | .phase' 2>/dev/null)

          if [ -n "$PENDING" ]; then
            echo "::warning::The following phases are not completed: $PENDING"
            echo "### ⚠️ Incomplete Phases" >> "$GITHUB_STEP_SUMMARY"
            echo "$PENDING" | while read -r phase; do
              echo "- \`$phase\`" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "### ✅ All phases completed" >> "$GITHUB_STEP_SUMMARY"
          fi
