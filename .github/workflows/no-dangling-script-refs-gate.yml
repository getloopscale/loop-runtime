---
# no-dangling-script-refs CI gate (T0.1 of plan 2026-05-23-incremental-bash-to-go-migration-plan.md)
#
# Backstop against the failure that abandoned the develop-bkp big-bash→Go
# migration: scripts were DELETED faster than their callers were rewired, and
# unit-test-green masked the broken drill/cleanroom/chaos SKILLs.
#
# Fails a PR when a .sh deleted (or renamed-away) in the diff is still
# referenced — in a live, non-comment context — by Taskfile/CI/SKILL/infra
# callers. Enforces D2 (rewire ALL 4 caller surfaces in the deletion PR).
#
# EC-02 + EC-04: dedicated workflow (NOT inline in ci.yml) with path filter on
# *.sh + fetch-depth: 0 mandatory. Without full history the base-ref is
# unreachable in a shallow clone; the gate emits BASE_REF_UNREACHABLE.

name: no-dangling-script-refs gate (T0.1)

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      # Only relevant when a PR touches shell scripts. A deletion lives here.
      - '**/*.sh'

permissions:
  contents: read
  pull-requests: read

jobs:
  no-dangling-script-refs:
    name: T0.1 — no deleted script left with live references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head (fetch-depth=0 mandatory per EC-04)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Without fetch-depth: 0 the base-ref is unreachable in a shallow
          # clone; the gate emits BASE_REF_UNREACHABLE with a clear error.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'
          cache-dependency-path: cmd/loopzero-ops/go.sum

      - name: Build loopzero-ops
        working-directory: cmd/loopzero-ops
        run: go build -o /tmp/loopzero-ops .

      - name: Determine base ref
        id: baseref
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          git fetch origin "${{ github.event.pull_request.base.ref }}" --no-tags --quiet || true
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      - name: Run dangling-script-refs gate
        run: |
          /tmp/loopzero-ops quality dangling-script-refs \
            --root . \
            --base-ref "${{ steps.baseref.outputs.base }}" \
            --head-ref HEAD

      - name: Annotate failure
        if: failure()
        run: |
          echo "::error title=Dangling Script Reference::This PR deletes a .sh that is still referenced by a live caller (Taskfile/CI/SKILL/infra). Per docs/plans/2026-05-23-incremental-bash-to-go-migration-plan.md D2, rewire ALL four caller surfaces in the SAME PR that deletes the script."
