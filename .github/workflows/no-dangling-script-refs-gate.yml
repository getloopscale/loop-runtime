---
# no-dangling-script-refs CI gate (T0.1 of plan 2026-05-23-incremental-bash-to-go-migration-plan.md)
#
# Backstop against the failure that abandoned the develop-bkp big-bash→Go
# migration: scripts were DELETED faster than their callers were rewired, and
# unit-test-green masked the broken drill/cleanroom/chaos SKILLs.
#
# Two mirror backstops for the same integration-boundary failure class:
#   - dangling-script-refs: a .sh deleted (or renamed-away) still referenced by
#     a live caller (the develop-bkp failure: scripts deleted faster than
#     callers rewired).
#   - dangling-data-refs: a config/data file (.yaml/.yml/.json) deleted still
#     referenced by an executable caller (the governance subsystem failure
#     2026-05-23: the 2026-05-11 consolidation deleted the maturity-scoring data
#     but left the scripts that read it dangling).
#
# EC-02 + EC-04: dedicated workflow (NOT inline in ci.yml) with fetch-depth: 0
# mandatory. Without full history the base-ref is unreachable in a shallow
# clone; the gates emit BASE_REF_UNREACHABLE.

name: no-dangling-refs gate (T0.1)

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      # Script deletions (dangling-script-refs) live in *.sh.
      - '**/*.sh'
      # Config/data deletions (dangling-data-refs) live in *.yaml/*.yml/*.json.
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  no-dangling-script-refs:
    name: T0.1 — no deleted script left with live references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head (fetch-depth=0 mandatory per EC-04)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Without fetch-depth: 0 the base-ref is unreachable in a shallow
          # clone; the gate emits BASE_REF_UNREACHABLE with a clear error.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'
          cache-dependency-path: cmd/loopzero-ops/go.sum

      - name: Build loopzero-ops
        working-directory: cmd/loopzero-ops
        run: go build -o /tmp/loopzero-ops .

      - name: Determine base ref
        id: baseref
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          git fetch origin "${{ github.event.pull_request.base.ref }}" --no-tags --quiet || true
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      - name: Run dangling-script-refs gate
        run: |
          /tmp/loopzero-ops quality dangling-script-refs \
            --root . \
            --base-ref "${{ steps.baseref.outputs.base }}" \
            --head-ref HEAD

      - name: Run dangling-data-refs gate
        run: |
          /tmp/loopzero-ops quality dangling-data-refs \
            --root . \
            --base-ref "${{ steps.baseref.outputs.base }}" \
            --head-ref HEAD

      - name: Annotate failure
        if: failure()
        run: |
          echo "::error title=Dangling Reference::This PR deletes a script (.sh) or config/data file (.yaml/.yml/.json) that is still referenced by a live caller. Rewire or remove ALL callers in the SAME PR. See docs/plans/2026-05-23-incremental-bash-to-go-migration-plan.md D2 + finding-2026-05-23-governance-subsystem-orphaned.md."
