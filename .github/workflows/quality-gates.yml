name: Quality Gates

# Plan 2026-05-21-comprehensive-quality-gates v1.1.
# Single workflow with multiple jobs — each Required Status Check.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # =========================================================================
  # Phase 2 gates
  # =========================================================================

  coverage-diff:
    name: Quality Gates - Coverage Diff Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'

      - name: Install gocovmerge
        run: go install github.com/wadey/gocovmerge@latest

      - name: Build PR diff file list (path:line per added line)
        # Migrated to pure-Go (pkg/quality/gitdiff) per plan 2026-05-23 — drops the
        # Python heredoc; exact parity proven (619 lines). Refs via env (safe).
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_REF: HEAD
        run: |
          (cd cmd/loopzero-ops && go run . quality git-diff-to-lines) > /tmp/pr-diff.txt

      - name: Generate coverage
        run: |
          # Run Go coverage (CI quality target)
          bash infra/scripts/quality/coverage-go.sh
          # Stub CLI lcov (Phase 1 wiring; full integration in next iter)
          : > /tmp/cli-coverage.lcov
          # Migrated to pure-Go gate (pkg/quality/coveragemerge) per plan 2026-05-23.
          (cd cmd/loopzero-ops && go run . quality coverage-merge \
            --go-profile /tmp/coverage.out \
            --cli-lcov /tmp/cli-coverage.lcov \
            --output /tmp/coverage-merged.lcov)

      - name: Run coverage-diff gate
        # Migrated to pure-Go gate (pkg/quality/coveragediff) per plan 2026-05-23.
        run: |
          (cd cmd/loopzero-ops && go run . quality coverage-diff \
            --diff /tmp/pr-diff.txt \
            --lcov /tmp/coverage-merged.lcov \
            --threshold 80)

  baseline-regression:
    name: Quality Gates - Baseline Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'

      - name: Generate current coverage
        run: bash infra/scripts/quality/coverage-go.sh

      - name: Build current-coverage JSON from profile
        # Migrated to pure-Go gate (pkg/quality/baselineupdate) per plan 2026-05-23.
        run: |
          : > /tmp/empty.lcov
          export DRY_RUN=1 GO_PROFILE=/tmp/coverage.out CLI_LCOV=/tmp/empty.lcov
          export BASELINE_FILE="${GITHUB_WORKSPACE}/infra/quality/coverage-baseline.json"
          (cd cmd/loopzero-ops && go run . quality baseline-update) > /tmp/current-coverage.json

      - name: Read defer label state
        id: defer
        run: |
          if echo "${{ join(github.event.pull_request.labels.*.name, ',') }}" | grep -q "coverage-baseline-defer"; then
            echo "present=1" >> "$GITHUB_OUTPUT"
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
          fi
          # Defer reason from PR body
          echo "${{ github.event.pull_request.body }}" | \
            grep -oE 'Defer reason:[[:space:]]*[^[:space:]].*' | head -1 > /tmp/defer-reason.txt || true
          echo "reason=$(cat /tmp/defer-reason.txt)" >> "$GITHUB_OUTPUT"

      - name: Run baseline-compare gate
        # Migrated to pure-Go gate (pkg/quality/baselinecompare) per plan 2026-05-23.
        run: (cd cmd/loopzero-ops && go run . quality baseline-compare)
        env:
          BASELINE_FILE: ${{ github.workspace }}/infra/quality/coverage-baseline.json
          CURRENT_FILE: /tmp/current-coverage.json
          DEFER_LABEL_PRESENT: ${{ steps.defer.outputs.present }}
          DEFER_REASON: ${{ steps.defer.outputs.reason }}

  # =========================================================================
  # Migration KPI gate — operational-logic capability architecture (2026-05-23)
  # =========================================================================

  unhomed-logic:
    name: Quality Gates - Un-homed Operational Logic (monotonic ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'
          cache-dependency-path: cmd/loopzero-ops/go.sum
      - name: Un-homed logic must not increase (plan 2026-05-23)
        # Unbiased migration tracker: a PR may NEVER increase un-homed shell
        # logic (total or per-domain). GREEN reached only by homing capabilities.
        run: cd cmd/loopzero-ops && go run . quality unhomed-logic --check --root "${GITHUB_WORKSPACE}" --allowlist "${GITHUB_WORKSPACE}/.claude/rules/shell-scripts-allowlist.md" --baseline "${GITHUB_WORKSPACE}/infra/quality/unhomed-baseline.json"

  # =========================================================================
  # Phase 5 gates
  # =========================================================================

  template-compliance:
    name: Quality Gates - PR Template Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run template-compliance gate
        # Migrated to pure-Go gate (pkg/quality/templatecompliance) per plan 2026-05-23.
        # PR_BODY passed via env (NOT CLI arg) to avoid GitHub Actions injection.
        run: (cd cmd/loopzero-ops && go run . quality template-compliance)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

  regression-test:
    name: Quality Gates - Bug-fix Regression Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'
          cache-dependency-path: cmd/loopzero-ops/go.sum

      # T5.3 of plan 2026-05-22: migrated from check-regression-test.sh to
      # pure-Go gate (loopzero-ops). PR_DIFF_FILES computed here (git is ALLOWED CLI).
      - name: Run regression-test gate
        run: |
          PR_DIFF_FILES=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD")
          export PR_DIFF_FILES
          cd cmd/loopzero-ops && go run . quality regression-test
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}

  test-deletion:
    name: Quality Gates - Test Deletion Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'
          cache-dependency-path: cmd/loopzero-ops/go.sum

      # T5.3 of plan 2026-05-22: migrated from check-test-deletion.sh to pure-Go
      # gate (loopzero-ops). git is an ALLOWED CLI per D5 — gate shells `git diff`.
      - name: Run test-deletion gate
        run: cd cmd/loopzero-ops && go run . quality test-deletion
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_REF: HEAD
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

  # =========================================================================
  # Phase 6 gates
  # =========================================================================

  pyramid:
    name: Quality Gates - Test Pyramid
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Regenerate inventory
        run: bash infra/scripts/quality/test-inventory.sh

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'
          cache-dependency-path: cmd/loopzero-ops/go.sum

      # T5.3 of plan 2026-05-22: migrated from check-pyramid.sh to pure-Go gate
      # (loopzero-ops). Reads test-inventory JSON via encoding/json — no python3 dep.
      - name: Run pyramid gate
        run: cd cmd/loopzero-ops && go run . quality test-pyramid --inventory "${GITHUB_WORKSPACE}/infra/quality/test-inventory.json"
        env:
          PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}

  mock-budget:
    name: Quality Gates - Mock Budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # BLOCKING MODE (graduated 2026-05-21): only known offender carries a
    # documented `// mock-budget: N — <reason>` opt-out comment per ADR D8.
    # New violations fail the gate.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'
          cache-dependency-path: cmd/loopzero-ops/go.sum

      # T5.3 of plan 2026-05-22: migrated from check-mock-budget.sh to pure-Go
      # gate (loopzero-ops). Honors `// mock-budget: N` opt-out comments (ADR D8).
      - name: Run mock-budget gate (blocking)
        run: cd cmd/loopzero-ops && go run . quality mock-budget --dir "${GITHUB_WORKSPACE}"

  stack-coverage:
    name: Quality Gates - Stack Coverage (strategy ↔ fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # T5.3 of plan 2026-05-22: migrated from check-stack-coverage.sh, which was
    # never wired into any workflow ("implemented but not wired"). Now blocking:
    # every LanguageStrategy in languages.go must have an E2E fixture (T10.1).
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'
          cache-dependency-path: cmd/loopzero-ops/go.sum

      - name: Run stack-coverage gate (blocking)
        run: cd cmd/loopzero-ops && go run . quality stack-coverage --root "${GITHUB_WORKSPACE}"

  skip-link:
    name: Quality Gates - Skip-Link Enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # BLOCKING MODE (graduated 2026-05-21) using baseline-aware subtraction:
    # 109 legacy violations are grandfathered in
    # infra/quality/skip-link-baseline.txt. NEW violations FAIL the gate.
    # Phase 4 backlog: shrink the baseline incrementally.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'
          cache-dependency-path: cmd/loopzero-ops/go.sum

      # T5.3 of plan 2026-05-22: migrated from check-skip-link.sh to pure-Go
      # gate (loopzero-ops). Baseline-aware; excludes nested worktrees (local==CI).
      - name: Run skip-link gate (blocking; baseline-aware)
        run: cd cmd/loopzero-ops && go run . quality skip-link --dir "${GITHUB_WORKSPACE}" --baseline "${GITHUB_WORKSPACE}/infra/quality/skip-link-baseline.txt"

  runtime-slo:
    name: Quality Gates - Runtime SLO
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'

      - name: Run go test capturing output
        run: |
          cd pkg && go test -v -timeout 90s ./... > /tmp/go-test-output.log 2>&1 || true

      # T5.3 of plan 2026-05-22: migrated from check-runtime-slo.sh to pure-Go
      # gate (loopzero-ops). Parses go test -v log; per-test ≤60s, per-suite ≤600s.
      - name: Run runtime-slo gate
        run: cd cmd/loopzero-ops && go run . quality runtime-slo --log /tmp/go-test-output.log

  # =========================================================================
  # Hermetic tests for all gate scripts (build gate)
  # =========================================================================

  hermetic-tests:
    name: Quality Gates Hermetic Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'

      - name: Install gocovmerge
        run: go install github.com/wadey/gocovmerge@latest

      - name: T1.1 coverage-go hermetic tests
        run: bash infra/tests/scripts/coverage-go_test.sh

      - name: coverage-merge + coverage-diff hermetic tests (pure-Go, plan 2026-05-23)
        run: cd pkg && go test ./quality/coveragemerge/... ./quality/coveragediff/... ./quality/coverageparse/... ./quality/gitdiff/...

      - name: baseline + template-compliance hermetic tests (pure-Go, plan 2026-05-23)
        run: cd pkg && go test ./quality/baselineupdate/... ./quality/baselinecompare/... ./quality/baseline/... ./quality/templatecompliance/...

      - name: T1.3 test-inventory hermetic tests
        run: bash infra/tests/scripts/test-inventory_test.sh

      - name: job-timeout-coverage gate + hermetic tests (pure-Go, migrated from bash, plan 2026-05-23)
        run: |
          cd pkg && go test ./quality/jobtimeout/...
          cd ../cmd/loopzero-ops && go run . quality job-timeout-coverage --root ../..

      - name: postgresql-pdb-config gate + hermetic tests (pure-Go, migrated from bash, plan 2026-05-23)
        run: |
          cd pkg && go test ./quality/pgpdb/...
          cd ../cmd/loopzero-ops && go run . quality postgresql-pdb-config --root ../..

