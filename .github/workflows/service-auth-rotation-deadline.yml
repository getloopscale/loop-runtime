---
# ADR §6.B.5 — service-auth Ed25519 rotation deadline tracking.
#
# Mirror of cosign-cutover-deadline.yml. The
# `decisions/2026-05-13-service-auth-ed25519-adoption.md` ADR carries a
# 90-day rotation cadence. This workflow self-checks weekly and on any
# PR touching the rotation marker / exception / script files.
#
# Behavior is governed by infra/scripts/check-service-auth-rotation.sh
# which is DORMANT pre-rotation (no marker yet) and starts ratcheting
# once the first rotation lands a date in
# `.github/service-auth-ed25519-rotation-date.txt`:
#   - day <= 60: silent OK
#   - 60 < day <= 90: warn (CI annotation)
#   - day > 90:  BLOCK exit 2 (unless sponsor-signed exception)

name: Service-Auth Ed25519 Rotation Deadline (§6.B.5)

on:
  schedule:
    - cron: "0 10 * * 1"  # Monday 10:00 UTC — 1h after cosign cutover so dashboards group nicely
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '.claude/knowledge-base/decisions/2026-05-13-service-auth-ed25519-adoption.md'
      - '.github/service-auth-ed25519-rotation-date.txt'
      - '.github/service-auth-rotation-exception.txt'
      - '.github/workflows/service-auth-rotation-deadline.yml'
      - 'infra/scripts/check-service-auth-rotation.sh'
      - 'infra/tests/check-service-auth-rotation_test.sh'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: service-auth-rotation-deadline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-rotation:
    name: Check service-auth Ed25519 rotation deadline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run unit tests on the rotation script
        # Self-check: if the script's own tests fail, refuse to run the
        # real check — a broken script could otherwise silently exit 0
        # while the rotation deadline is blown.
        run: |
          chmod +x infra/tests/check-service-auth-rotation_test.sh
          bash infra/tests/check-service-auth-rotation_test.sh

      - name: Check rotation deadline
        id: rotation
        continue-on-error: true
        run: |
          chmod +x infra/scripts/check-service-auth-rotation.sh
          bash infra/scripts/check-service-auth-rotation.sh

      - name: Open auto-issue on block
        if: steps.rotation.outcome == 'failure' && github.event_name == 'schedule'
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6.4.1
        with:
          script: |
            const title = '[service-auth-rotation] DEADLINE BLOWN — Ed25519 keypair rotation overdue';
            const body = `The weekly rotation deadline check exited non-zero. Per
            ADR \`2026-05-13-service-auth-ed25519-adoption.md\` the 90-day
            rotation window has elapsed without an approved sponsor exception.

            **Next steps (one of):**
            1. Generate a new Ed25519 keypair offline (see runbook), set
               via \`pulumi config set --secret serviceAuthEd25519Private\`
               and \`serviceAuthEd25519PublicCurrent\`, set the OLD
               public as \`serviceAuthEd25519PublicPrevious\` for the
               7-day overlap, \`pulumi up\`, then update
               \`.github/service-auth-ed25519-rotation-date.txt\` to today.
            2. Create \`.github/service-auth-rotation-exception.txt\` with
               a slip rationale and an \`approved-by: <operator>\` line.
               Commit it via PR (this workflow runs on PR and will accept).

            Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'service-auth-rotation', 'auto-issue'],
            });

      - name: Re-fail the job after issue is created
        if: steps.rotation.outcome == 'failure'
        run: |
          echo "::error::service-auth Ed25519 rotation deadline blown — see auto-issue above"
          exit 1
