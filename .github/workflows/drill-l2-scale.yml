---
# Drill L2 Scale Test — automated CTO Rule 5 validation (50 concurrent deploys).
#
# Provisions an isolated pulumi-drill DOKS cluster, runs the L2 scale harness
# (TestL2_1_FiftyConcurrentDeploys), captures evidence, and ALWAYS tears down.
# Cost: ~$15-30 per run (3-node DOKS + LB + DB for ~90min wall-clock).
#
# Validates under real concurrent load:
#   - ArgoCD SyncSerializer (plan T1.1 D2) — no HTTP 400 race
#   - EnvironmentEnsurer (plan T2.2 D5) — multi-tenant provisioning storm
#   - Migration 000018 active_tenant_id (plan T2.5 D8 full)
#   - chaos-mesh values.yaml prod default socketPath (plan T3.2 D10)
#
# Pass criteria (per harness l2_scenarios_test.go):
#   - success_rate >= 90% (allows 5/50 to fail under resource pressure)
#   - p95 latency <= 10min (cloud deploy chain upper bound)
#
# Cadence: bi-weekly Sunday + workflow_dispatch on-demand.

name: Drill L2 Scale Test (CTO Rule 5)

on:
  schedule:
    # Bi-weekly: 1st and 15th of every month at 04:00 UTC
    # Low-traffic window; avoids competition with cell2-soaks cron (02:00 UTC Sunday)
    - cron: '0 4 1,15 * *'
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Concurrent tenants (overrides L2 default 50)'
        required: false
        default: '50'
      skip_teardown:
        description: 'Leave drill stack provisioned for manual inspection (COST WARNING)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: pulumi-drill-l2
  cancel-in-progress: false  # NEVER cancel mid-test — partial state requires manual teardown

jobs:
  pre-flight-gate:
    name: Pre-flight isolation verification
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify drill credentials are scoped (NOT prod)
        id: gate
        env:
          DRILL_PULUMI_TOKEN: ${{ secrets.DRILL_PULUMI_TOKEN }}
          DRILL_DO_TOKEN: ${{ secrets.DRILL_DO_TOKEN }}
        run: |
          if [[ -z "${DRILL_PULUMI_TOKEN:-}" ]] || [[ -z "${DRILL_DO_TOKEN:-}" ]]; then
            echo "::error title=Drill credentials missing::DRILL_PULUMI_TOKEN + DRILL_DO_TOKEN must be configured (separate from prod)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  scale-test:
    name: Provision + L2 scale + teardown
    needs: pre-flight-gate
    if: needs.pre-flight-gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 90min provision + 90min test + 30min teardown + buffer
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Pulumi CLI
        uses: pulumi/actions@v5

      - name: Install drill dependencies
        working-directory: infra/pulumi-drill
        run: npm ci

      - name: Provision drill cluster
        id: provision
        working-directory: infra/pulumi-drill
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.DRILL_PULUMI_TOKEN }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DRILL_DO_TOKEN }}
        run: |
          npx pulumi stack select drill --create
          npx pulumi up --stack drill --yes --skip-preview
          # Export API endpoint for downstream steps
          API_URL=$(npx pulumi stack output apiUrl --stack drill)
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          # Wait for API health
          for i in $(seq 1 60); do
            if curl -sf -m 5 "$API_URL/api/v1/health" > /dev/null; then
              echo "API healthy after ${i} attempts"
              break
            fi
            sleep 10
          done

      - name: Mint JWT for L2 test
        id: jwt
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DRILL_DO_TOKEN }}
        run: |
          # The drill stack publishes a kubeconfig + seed-local-user.sh equivalent.
          # See infra/pulumi-drill/src/* for token mint flow.
          chmod +x infra/scripts/drill-mint-jwt.sh 2>/dev/null || true
          if [ -x infra/scripts/drill-mint-jwt.sh ]; then
            JWT=$(bash infra/scripts/drill-mint-jwt.sh)
            echo "::add-mask::$JWT"
            echo "jwt=$JWT" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::drill-mint-jwt.sh not found — operator must implement"
            exit 1
          fi

      - name: Run L2 scale test (50 concurrent deploys)
        id: l2
        env:
          LOOPZERO_E2E: '1'
          LOOPZERO_REAL_DEPLOY: '1'
          LOOPZERO_LOAD_LEVEL: 'l2'
          LOOPZERO_L2_CONCURRENCY: ${{ inputs.concurrency || '50' }}
          LOOPZERO_API_URL: ${{ steps.provision.outputs.api_url }}
          LOOPZERO_TOKEN: ${{ steps.jwt.outputs.jwt }}
        run: |
          mkdir -p /tmp/l2-evidence
          go test -timeout 120m -v \
            -run TestL2_1_FiftyConcurrentDeploys \
            ./infra/tests/load/... \
            | tee /tmp/l2-evidence/l2-output.log
          # Capture pass/fail summary
          if grep -q "PASS: TestL2_1_FiftyConcurrentDeploys" /tmp/l2-evidence/l2-output.log; then
            echo "verdict=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=FAIL" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Upload L2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drill-l2-scale-evidence-${{ github.run_id }}
          path: |
            /tmp/l2-evidence/
            .claude/knowledge-base/reviews/l2-scale-*/
          retention-days: 90

      - name: Destroy drill stack (MANDATORY cleanup)
        if: always() && inputs.skip_teardown != true
        working-directory: infra/pulumi-drill
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.DRILL_PULUMI_TOKEN }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DRILL_DO_TOKEN }}
        run: |
          npx pulumi destroy --stack drill --yes --skip-preview
          echo "Drill stack destroyed; cost stopped."

      - name: Cost alert if drill stack still up
        if: failure() && inputs.skip_teardown != true
        run: |
          echo "::warning title=Drill stack may be live::L2 test or destroy step failed; verify pulumi-drill stack is destroyed via 'pulumi destroy --stack drill' to avoid recurring cost (~\$15-30/day)."

      - name: Open issue on L2 failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `[L2 FAIL] Drill scale test failed — ${new Date().toISOString().slice(0,10)}`,
              labels: ['drill-failure', 'priority/high', 'scale', 'cto-rule-5'],
              body: `Drill L2 scale test FAILED in workflow ${context.runId}.\n\n` +
                    `**Concurrency:** ${{ inputs.concurrency || '50' }}\n` +
                    `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                    `Per CTO Rule 5 (FOCO 50k tenants), L2 failure indicates one of:\n` +
                    `  - ArgoCD SyncSerializer (T1.1) regression under concurrent load\n` +
                    `  - EnvironmentEnsurer (T2.2) provisioning storm breakage\n` +
                    `  - Plan cap / quota enforcement gap surfacing at scale\n` +
                    `  - Drill cluster resource pressure (check l2EnsureClusterCapacity pre-flight)\n\n` +
                    `Action: investigate l2-evidence artifact, fix root cause, re-run via workflow_dispatch.\n\n` +
                    `**IMPORTANT:** If skip_teardown was set, run \`pulumi destroy --stack drill\` manually to stop cost.`
            });
