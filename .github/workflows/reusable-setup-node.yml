# Reusable workflow: Setup Node.js with npm cache.
# Internal use — invoked via `uses: ./.github/workflows/reusable-setup-node.yml`.

name: Reusable — Setup Node

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node version (e.g., '20')"
        type: string
        default: "20"
      cache-dependency-path:
        description: "Path to package-lock.json for dependency caching"
        type: string
        default: "package-lock.json"

jobs:
  setup:
    name: Setup Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node ${{ inputs.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Verify Node version
        run: node --version
