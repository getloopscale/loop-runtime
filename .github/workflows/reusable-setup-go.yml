# Reusable workflow: Setup Go with caching.
# Internal use only — invoked via `uses: ./.github/workflows/reusable-setup-go.yml`.
# Per Plan ADR D3 + INF-G18: internal reusables are exempt from external SHA pinning.

name: Reusable — Setup Go

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version (e.g., '1.25.x' or '1.25')"
        type: string
        default: "1.25.x"
      cache-dependency-path:
        description: "Newline-separated paths to go.sum files for dependency caching"
        type: string
        default: |
          api/go.sum
          operators/go.sum
          pkg/go.sum

jobs:
  setup:
    name: Setup Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go ${{ inputs.go-version }}
        # pragma: allow-tag-pin
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Verify Go version
        run: go version
