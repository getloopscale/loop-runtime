# Infrastructure State Reset — BREAK-GLASS emergency operation.
#
# Resets Pulumi state to empty (keeps only Stack resource).
# Use ONLY when state is corrupted beyond repair.

name: "Infra: State Reset (Break-Glass)"

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "Target stack"
        required: true
        type: choice
        options: [dev, homolog, prod]
      confirm:
        description: "Type RESET STATE FOR {stack} to confirm"
        required: true
        type: string

permissions:
  contents: read

env:
  PULUMI_BACKEND_URL: "s3://loopzero-infra-pulumi-state?endpoint=nyc3.digitaloceanspaces.com&region=us-east-1&s3ForcePathStyle=true"
  PULUMI_HOMOLOG_BACKEND_URL: "s3://loopzero-homolog-pulumi-state?endpoint=sfo3.digitaloceanspaces.com&region=us-east-1&s3ForcePathStyle=true"

jobs:
  reset:
    name: "State Reset ${{ inputs.stack }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: infra-${{ inputs.stack }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
    steps:
      - name: Validate confirmation
        run: |
          EXPECTED="RESET STATE FOR ${{ inputs.stack }}"
          if [ "${{ inputs.confirm }}" != "$EXPECTED" ]; then
            echo "::error::Confirmation mismatch. Expected: '$EXPECTED'"
            exit 1
          fi

      - name: Install Pulumi CLI
        run: curl -fsSL https://get.pulumi.com | PULUMI_VERSION=3.227.0 sh

      - name: Reset state
        run: |
          STACK="${{ inputs.stack }}"
          BACKEND="${{ env.PULUMI_BACKEND_URL }}"
          [ "$STACK" = "homolog" ] && BACKEND="${{ env.PULUMI_HOMOLOG_BACKEND_URL }}"
          pulumi login "$BACKEND"

          echo "::warning::State reset by ${{ github.actor }} at $(date -u) for stack $STACK"

          pulumi stack --stack "organization/loopzero-infra/$STACK" export > /tmp/state.json
          python3 << 'PYEOF' > /tmp/clean.json
          import json
          state = json.load(open("/tmp/state.json"))
          count = len(state["deployment"]["resources"])
          state["deployment"]["resources"] = [r for r in state["deployment"]["resources"] if r.get("type") == "pulumi:pulumi:Stack"]
          state["deployment"]["pending_operations"] = []
          json.dump(state, open("/tmp/clean.json", "w"))
          import sys; print(f"Reset: {count} -> {len(state['deployment']['resources'])} resources", file=sys.stderr)
          PYEOF
          pulumi stack --stack "organization/loopzero-infra/$STACK" import --file /tmp/clean.json

          echo "### State Reset" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stack | $STACK |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actor | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Time | $(date -u) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Backup pre-reset state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-backup-${{ inputs.stack }}-${{ github.run_id }}
          path: /tmp/state.json
          retention-days: 30
