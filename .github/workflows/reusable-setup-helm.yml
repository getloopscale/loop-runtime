# Reusable workflow: Setup Helm with helm-diff plugin.
# Internal use — invoked via `uses: ./.github/workflows/reusable-setup-helm.yml`.

name: Reusable — Setup Helm

on:
  workflow_call:
    inputs:
      helm-version:
        description: "Helm version (e.g., 'v3.14.4')"
        type: string
        default: "v3.14.4"
      install-diff-plugin:
        description: "Whether to install helm-diff plugin"
        type: boolean
        default: false
      install-unittest-plugin:
        description: "Whether to install helm-unittest plugin"
        type: boolean
        default: false

jobs:
  setup:
    name: Setup Helm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Helm
        # pragma: allow-tag-pin
        uses: azure/setup-helm@v4
        with:
          version: ${{ inputs.helm-version }}

      - name: Install helm-diff plugin
        if: ${{ inputs.install-diff-plugin }}
        run: helm plugin install https://github.com/databus23/helm-diff || helm plugin update diff

      - name: Install helm-unittest plugin
        if: ${{ inputs.install-unittest-plugin }}
        run: helm plugin install https://github.com/helm-unittest/helm-unittest || helm plugin update unittest

      - name: Verify
        run: |
          helm version
          helm plugin list
