# Infrastructure Bootstrap — one-time platform setup after pulumi up.
#
# Creates tokens, secrets, seeds database, applies Tenant CR.
# Idempotent — safe to re-run on a healthy system.
#
# Called automatically by infra-deploy.yml after successful `up`,
# or manually via workflow_dispatch for repair.

name: "Infra: Bootstrap"

on:
  workflow_call:
    inputs:
      stack:
        description: "Target stack (dev/homolog/prod)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      stack:
        description: "Target stack"
        required: true
        type: choice
        options: [dev, homolog, prod]

permissions:
  contents: read

concurrency:
  group: infra-bootstrap-${{ inputs.stack }}
  cancel-in-progress: false

env:
  PULUMI_WORKING_DIR: infra/pulumi
  PULUMI_BACKEND_URL: "s3://loopzero-infra-pulumi-state?endpoint=nyc3.digitaloceanspaces.com&region=us-east-1&s3ForcePathStyle=true"
  PULUMI_HOMOLOG_BACKEND_URL: "s3://loopzero-homolog-pulumi-state?endpoint=sfo3.digitaloceanspaces.com&region=us-east-1&s3ForcePathStyle=true"

jobs:
  bootstrap:
    name: "Bootstrap ${{ inputs.stack }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: infra-${{ inputs.stack }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LOOPZERO_GITHUB_CLIENT_ID: ${{ secrets.LOOPZERO_GITHUB_CLIENT_ID }}
      LOOPZERO_GITHUB_CLIENT_SECRET: ${{ secrets.LOOPZERO_GITHUB_CLIENT_SECRET }}
      LOOPZERO_GOOGLE_CLIENT_ID: ${{ secrets.LOOPZERO_GOOGLE_CLIENT_ID }}
      LOOPZERO_GOOGLE_CLIENT_SECRET: ${{ secrets.LOOPZERO_GOOGLE_CLIENT_SECRET }}
      LOOPZERO_RESEND_API_KEY: ${{ secrets.LOOPZERO_RESEND_API_KEY }}
      LOOPZERO_STRIPE_API_KEY: ${{ secrets.LOOPZERO_STRIPE_API_KEY }}
      LOOPZERO_STRIPE_WEBHOOK_SECRET: ${{ secrets.LOOPZERO_STRIPE_WEBHOOK_SECRET }}
      LOOPZERO_SESSION_TOKEN_SECRET: ${{ secrets.LOOPZERO_SESSION_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          curl -sL "https://github.com/digitalocean/doctl/releases/download/v1.104.0/doctl-1.104.0-linux-amd64.tar.gz" | tar xz -C /usr/local/bin
          curl -sL https://get.helm.sh/helm-v3.14.0-linux-amd64.tar.gz | tar xz -C /usr/local/bin --strip-components=1 linux-amd64/helm
          curl -sLO "https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl" && chmod +x kubectl && mv kubectl /usr/local/bin/
          curl -fsSL https://get.pulumi.com | PULUMI_VERSION=3.227.0 sh
          doctl auth init --access-token "$DIGITALOCEAN_TOKEN"

      - name: Get kubeconfig from Pulumi
        working-directory: ${{ env.PULUMI_WORKING_DIR }}
        run: |
          STACK="${{ inputs.stack }}"
          BACKEND="${{ env.PULUMI_BACKEND_URL }}"
          [ "$STACK" = "homolog" ] && BACKEND="${{ env.PULUMI_HOMOLOG_BACKEND_URL }}"
          pulumi login "$BACKEND"
          pulumi stack output mgmtKubeconfig --show-secrets --stack "organization/loopzero-infra/$STACK" > /tmp/mgmt-kc.yaml
          echo "KUBECONFIG=/tmp/mgmt-kc.yaml" >> "$GITHUB_ENV"

      - name: Run bootstrap
        run: bash infra/scripts/bootstrap-platform.sh
        env:
          STACK: ${{ inputs.stack }}

      - name: Validate bootstrap health
        run: |
          echo "Checking Gitea..."
          kubectl exec deploy/gitea -n platform-system -c gitea -- wget -qO- http://localhost:3000/api/healthz
          echo ""
          echo "Checking ArgoCD..."
          kubectl get pods -n platform-system -l app.kubernetes.io/name=argocd-server --no-headers | grep Running
          echo "Bootstrap health: OK"

      # Registry integration + CWT updates — moved from build-images.yml
      # (pipeline review: build pipeline should produce artifacts only).
      # These are idempotent infra operations, safe to re-run.
      - name: Integrate DOCR registry with clusters
        run: |
          CLUSTERS=$(doctl kubernetes cluster list --format Name --no-header 2>/dev/null | grep "^loopzero-infra" || true)
          [ -z "$CLUSTERS" ] && exit 0
          for CLUSTER in $CLUSTERS; do
            doctl kubernetes cluster registry add "$CLUSTER" 2>/dev/null || true
            echo "  Registry added: $CLUSTER"
          done

      - name: Update CWTs on build cluster
        run: |
          BUILD_CLUSTER=$(doctl kubernetes cluster list --format Name --no-header 2>/dev/null | grep "^loopzero-infra.*-build$" | head -1)
          [ -z "$BUILD_CLUSTER" ] && exit 0
          doctl kubernetes cluster kubeconfig save "$BUILD_CLUSTER"
          BUILD_CTX=$(kubectl config get-contexts -o name 2>/dev/null | grep "$BUILD_CLUSTER" | head -1)
          kubectl --context "$BUILD_CTX" get ns argo >/dev/null 2>&1 || { echo "argo ns not found — skipping"; exit 0; }

          # Render + apply CWT templates
          helm template loopzero-build-cwts infra/helm/argo-workflows \
            --set minio.insecure=true | \
            kubectl apply --context "$BUILD_CTX" -f - || { echo "::warning::CWT apply failed"; exit 0; }

          # BuildKit registry config (DOCR, 30d expiry for async user builds)
          RW_CONFIG=$(doctl registry docker-config --read-write --expiry-seconds 2592000)
          kubectl create secret generic buildkit-registry-config \
            --context "$BUILD_CTX" --namespace argo \
            --from-literal=config.json="$RW_CONFIG" \
            --dry-run=client -o yaml | kubectl apply --context "$BUILD_CTX" -f - || true
          echo "  CWTs + registry config updated on $BUILD_CLUSTER"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/mgmt-kc.yaml
