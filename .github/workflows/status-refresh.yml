name: status-refresh

# STALE: docs/STATUS.md was removed in 2026-05-11 governance consolidation.
# Canonical maturity document is now .claude/knowledge-base/audits/2026-05-11/SUMMARY.md.
# This workflow is retained but will no-op since regenerate-status.sh exits 0
# when the target file does not exist.
#
# Originally: Daily refresh of docs/STATUS.md auto-sections (activity-30d + decay-summary).
# Per T4.4 of status-validation-and-doc-consolidation-plan.

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 100  # for git log --since=30.days

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Regenerate auto-sections
        run: |
          # docs/STATUS.md was removed; script exits 0 gracefully
          bash infra/scripts/governance/regenerate-status.sh || true

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(status): refresh auto-sections ($(date +%Y-%m-%d))"
          git push

      - name: No-op notice
        if: steps.diff.outputs.changed == 'false'
        run: echo "No changes — docs/STATUS.md was removed in 2026-05-11 governance consolidation"
