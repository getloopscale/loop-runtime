# AM6 — reusable build-publish: buildx (SBOM + provenance) → push by digest → cosign KEYLESS sign.
# Auth via the ephemeral GITHUB_TOKEN (no literal token, EC-2). Keyless cosign via GitHub OIDC
# (id-token: write) — no long-lived signing key (D2). Build engine = buildx from the existing
# distroless Dockerfiles (D1, not Buildpacks). SBOM via buildx native (D3, no syft).
name: build-publish
on:
  workflow_call:
    inputs:
      image:      { required: true,  type: string }
      dockerfile: { required: true,  type: string }
      context:    { required: false, type: string, default: "." }
      registry:   { required: false, type: string, default: "ghcr.io/getloopscale" }
permissions:
  contents: read
  packages: write   # push to GHCR
  id-token: write   # keyless cosign (OIDC)
jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # EC-2: no literal token
      - name: Build + push by digest (SBOM + provenance)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.registry }}/${{ inputs.image }}:${{ github.sha }}
          sbom: true          # D3 — buildx native SPDX SBOM
          provenance: true    # SLSA provenance
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Keyless sign by digest
        run: cosign sign --yes "${{ inputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}"
