# Reusable build-publish — the single hardened image pipeline for the whole org.
#
# Shape: (optional Trivy gate) → buildx build+push (GHA cache) → SBOM + SLSA mode=max
# attestations + keyless cosign sign (release only) → identity-pinned cosign verify.
# Every action is pinned by commit SHA. Callers stay thin: a per-repo `ci.yml`/gate job
# runs the language-specific tests, then `publish.yml` calls THIS workflow.
#
# Channels (docker/metadata-action): develop → :develop + :develop-<sha>;
# tag vX.Y.Z → :X.Y.Z + :X.Y + :latest. Signing/SBOM/provenance only when sign=true.
#
# Inputs added in the org-standardization pass (2026-06-30):
#   trivy           — gate the image on CRITICAL/HIGH CVEs (Trivy) before push
#   verify          — cosign verify the signature with an identity pinned to THIS workflow
#   dockerhub_image — also publish to docker.io/<this> when the DOCKERHUB_TOKEN secret is set
name: build-publish
on:
  workflow_call:
    inputs:
      image:           { required: true,  type: string }
      dockerfile:      { required: true,  type: string }
      context:         { required: false, type: string,  default: "." }
      # Vazio por default = derivado do dono do repositorio em runtime (ver o step
      # `resolve-registry`). Fixar o dono em texto e' o passo que o runbook de
      # migracao lista como o mais esquecido: uma transferencia de conta para
      # organizacao troca o namespace do GHCR e um valor fixo passa a dar 403 no
      # push — falha tardia, no CI de outro repositorio.
      registry:        { required: false, type: string,  default: "" }
      sign:            { required: false, type: boolean, default: false }   # SBOM+provenance(mode=max)+cosign — release only
      verify:          { required: false, type: boolean, default: false }   # identity-pinned cosign verify (needs sign=true)
      trivy:           { required: false, type: boolean, default: false }   # CRITICAL/HIGH Trivy gate before push (uses .trivyignore if present)
      dockerhub_image: { required: false, type: string,  default: "" }      # e.g. "loopzero/themory" — also push to Docker Hub when DOCKERHUB_TOKEN is set
      # Default = frota Blacksmith da org `getloopscale` (2026-07-30). Consumidores
      # fora da org devem passar a propria label; um default GitHub-hosted aqui
      # gastaria minutos da conta de quem chama, em silencio.
      runner:          { required: false, type: string,  default: '["blacksmith-8vcpu-ubuntu-2404"]' }
    secrets:
      # Deploy key read-only de loopzero-contracts — via PREFERIDA desde 2026-07-31.
      # Alcanca exatamente um repositorio, so' leitura, revogavel sozinha. O PAT
      # anterior morreu (`Bad credentials`) e derrubou 10 builds sem nomear a
      # causa, porque a mesma credencial morta aparecia como `Repository not
      # found` no build da imagem.
      GOMOD_SSH_KEY:      { required: false }
      # Fallback legado. Mantido para consumidores do reusable que ainda o usem —
      # a troca e' aditiva, nao uma quebra de contrato.
      GOMOD_TOKEN:        { required: false }   # cross-repo read for the pinned private loopzero-contracts module
      DOCKERHUB_USERNAME: { required: false }
      DOCKERHUB_TOKEN:    { required: false }
permissions:
  contents: read
  packages: write
  id-token: write   # consumed only when sign=true (keyless cosign); harmless otherwise
jobs:
  build-publish:
    runs-on: ${{ fromJSON(inputs.runner) }} # default = frota Blacksmith da org; ver o input `runner`
    env:
      # `secrets` is NOT allowed in step `if:` — lift the token to a job-level env so the
      # Docker Hub guards below can use `env.*` (valid in if/with). Stays masked in logs.
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      # Exposta no ambiente do job porque `secret-envs:` referencia o NOME de uma
      # variavel, nao um valor — e' o que permite carregar a chave privada
      # multilinha intacta. O Actions mascara o valor nos logs normalmente.
      GOMOD_SSH_KEY: ${{ secrets.GOMOD_SSH_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # Deriva o namespace do GHCR do dono do repositorio quando o chamador nao o
      # passa. Substitui um default fixado em texto (`ghcr.io/getloopscale`), que o
      # runbook de migracao lista entre os pontos que se esquece: transferir o repo
      # para uma organizacao troca o namespace, e o valor fixo passa a produzir 403
      # no push — falha tardia, e no CI de outro repositorio.
      #
      # Minusculas porque nomes de repositorio no GitHub preservam maiusculas e
      # referencias OCI nao as aceitam.
      #
      # `[:upper:]`/`[:lower:]` em vez de `A-Z`/`a-z` (SC2018/SC2019): as faixas
      # literais dependem do locale — em locales nao-C a ordem de colacao pode
      # nao ser a ASCII, e a traducao sai errada para caracteres fora do
      # esperado. As classes POSIX nao tem essa dependencia.
      - name: Resolve registry namespace
        id: resolve-registry
        env:
          EXPLICIT: ${{ inputs.registry }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$EXPLICIT" ]; then
            echo "registry=$EXPLICIT" >> "$GITHUB_OUTPUT"
          else
            echo "registry=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute tags (community-standard channels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          # Docker Hub image is added ONLY when both the input and the token are present,
          # so a missing secret never produces an un-pushable docker.io tag.
          images: |
            ${{ steps.resolve-registry.outputs.registry }}/${{ inputs.image }}
            ${{ (inputs.dockerhub_image != '' && env.DOCKERHUB_TOKEN != '') && format('docker.io/{0}', inputs.dockerhub_image) || '' }}
          # As duas ultimas regras cobrem o disparo MANUAL, e existem porque a
          # ausencia delas tornava esse caminho impossivel.
          #
          # `release-artifacts.yml` anuncia `workflow_dispatch` e o job `plan`
          # trata `IS_DISPATCH` explicitamente construindo TODAS as imagens. Mas
          # nenhuma regra de tag disparava fora de `develop` e de tags `v*`,
          # entao um dispatch a partir de qualquer outro branch gerava ZERO tags
          # e o buildx morria com `tag is needed when pushing to registry` —
          # medido no run 30583134483, cinco imagens de uma vez.
          #
          # Um gatilho anunciado que nunca pode funcionar e' pior que gatilho
          # ausente: quem o usa conclui que a imagem esta quebrada, nao o
          # workflow.
          #
          # Branch + sha curto (e nao um `latest` qualquer): o artefato de um
          # dispatch precisa ser rastreavel ate' o commit exato, e nao pode
          # colidir com o canal `develop` que a CI publica.
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=develop-,format=short,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop' }}
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop' }}

      # --- Optional Trivy gate (build locally, scan, THEN push the cache-identical image) ---
      - name: Build for scan (Trivy gate)
        if: ${{ inputs.trivy }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: ${{ inputs.image }}:scan-target
          cache-from: type=gha,scope=${{ inputs.image }}
          # ignore-error: the GitHub Actions cache service (type=gha) intermittently 500s /
          # returns BlobNotFound on export (esp. large mode=max exports on self-hosted
          # runners). Cache is a build-time optimization, not a correctness input — a cache
          # miss/failure must never fail the build. Warns and continues instead.
          cache-to: type=gha,mode=max,ignore-error=true,scope=${{ inputs.image }}
          secrets: |
            gomod_token=${{ secrets.GOMOD_TOKEN }}
          # A chave SSH vai por `secret-envs`, NAO por `secrets`.
          #
          # O formato `chave=valor` de `secrets:` e' de UMA LINHA. Uma chave
          # privada tem varias, e o buildx rejeita com `*** is not a valid
          # secret` — medido no run 30626856096. `secret-envs` referencia uma
          # variavel de ambiente e por isso carrega multilinha intacta.
          #
          # O build local passava com `--secret id=...,src=arquivo`, que tambem
          # aceita multilinha. Foi essa diferenca de FORMA — nao de conteudo —
          # que fez o teste local aprovar o que a CI reprovou.
          secret-envs: |
            gomod_ssh_key=GOMOD_SSH_KEY

      - name: Trivy vulnerability scan (CRITICAL + HIGH gate)
        if: ${{ inputs.trivy }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ inputs.image }}:scan-target
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

      # Registry login happens HERE — AFTER the (slow, cold-cache) Trivy build-for-scan — so the
      # GHCR token is FRESH at push time. A long build (e.g. a native-compile image via the Trivy
      # double-build, ~14 min cold) would otherwise outlive a token fetched at job start → buildkit
      # re-auths anonymously → 403 on the attestation push. The build-for-scan above needs no
      # registry login (it loads locally + uses the GHA cache + a public base image).
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (optional)
        if: ${{ inputs.dockerhub_image != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Build + push (cache-identical to the scanned image when trivy=true) ---
      - name: Build + push (SBOM + SLSA mode=max on release)
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: ${{ inputs.sign }}
          provenance: ${{ inputs.sign && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=${{ inputs.image }}
          # ignore-error: the GitHub Actions cache service (type=gha) intermittently 500s /
          # returns BlobNotFound on export (esp. large mode=max exports on self-hosted
          # runners). Cache is a build-time optimization, not a correctness input — a cache
          # miss/failure must never fail the build. Warns and continues instead.
          cache-to: type=gha,mode=max,ignore-error=true,scope=${{ inputs.image }}
          secrets: |
            gomod_token=${{ secrets.GOMOD_TOKEN }}
          # A chave SSH vai por `secret-envs`, NAO por `secrets`.
          #
          # O formato `chave=valor` de `secrets:` e' de UMA LINHA. Uma chave
          # privada tem varias, e o buildx rejeita com `*** is not a valid
          # secret` — medido no run 30626856096. `secret-envs` referencia uma
          # variavel de ambiente e por isso carrega multilinha intacta.
          #
          # O build local passava com `--secret id=...,src=arquivo`, que tambem
          # aceita multilinha. Foi essa diferenca de FORMA — nao de conteudo —
          # que fez o teste local aprovar o que a CI reprovou.
          secret-envs: |
            gomod_ssh_key=GOMOD_SSH_KEY

      - name: Install cosign
        if: ${{ inputs.sign }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # `${{ }}` dentro de `run:` e substituido NO TEXTO do script antes do shell existir: um valor com
      # aspas, `;` ou `$(...)` deixa de ser argumento e vira comando, com acesso aos segredos do job
      # (#250). Passar pelo `env:` do step nao tem essa propriedade — o valor chega como variavel de
      # ambiente, e `"${VAR}"` e um argumento, aconteca o que acontecer dentro dele.
      #
      # Isto NAO e teatro para o semgrep: um input de `workflow_call` e, por definicao, controlado pelo
      # CALLER, e o conjunto de callers muda sem que este arquivo mude. Hoje os valores vem de
      # `publish.yml` versionado; a garantia estava na disciplina de quem chama, e agora esta na
      # estrutura do workflow.
      - name: Keyless sign by digest (release only)
        if: ${{ inputs.sign }}
        env:
          IMAGE_REF: ${{ steps.resolve-registry.outputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

      # Confused-deputy guard (EC-2): accept ONLY signatures produced by THIS reusable
      # workflow (path-pinned) via the GitHub OIDC issuer. One signing identity for every
      # org image — pinned in one place.
      - name: Verify the signature (identity-pinned)
        if: ${{ inputs.sign && inputs.verify }}
        env:
          IMAGE_REF: ${{ steps.resolve-registry.outputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
          # A identidade keyless deriva de repo + caminho do workflow. Fixar o dono
          # em texto quebra a verificacao numa transferencia — e, pior, um dono
          # ERRADO aqui aceitaria assinatura produzida por OUTRO workflow. Este e' o
          # guard de confused-deputy, entao ele acompanha o repo que de fato roda.
          IDENTITY_REPO: ${{ github.repository }}
        run: |
          cosign verify "${IMAGE_REF}" \
            --certificate-identity-regexp "^https://github\.com/${IDENTITY_REPO}/\.github/workflows/build-publish\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
