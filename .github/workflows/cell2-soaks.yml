# fix-all-platform-issues-plan T5.2 / ADR D6 — ADR-compliant cell-2 soaks via CI cron.
#
# The ADR mandates 1h Stage 1 + 24h Stage 2 soaks for cell-2 production
# canary readiness. Operator-driven manual runs are infeasible (25h wall-clock
# blocks human attention). This workflow runs both stages weekly via cron;
# any failure pages on-call via auto-issue creation.
#
# Stage 1: 1 synthetic tenant pinned to cell-2; 1h probe soak.
# Stage 2: 10% dev tenants (>=1) on cell-2; 24h soak with EB+5xx checks.
#
# Pre-conditions (enforced by stages' --dry-run preflight):
#   - cell-2 ClusterCredential connected
#   - cells.status='active' for cell-2
#   - loopzero_cell_discovery_count >= 2

name: cell-2 ADR canary soaks

on:
  schedule:
    # Sunday 02:00 UTC — low-traffic window so ADR soak doesn't compete with
    # weekday dogfood loops.
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Which stage to run'
        type: choice
        required: true
        default: 'both'
        options:
          - stage1
          - stage2
          - both

concurrency:
  group: cell2-soaks-${{ github.ref }}
  cancel-in-progress: false  # never cancel a running soak — let it complete

permissions:
  contents: read
  issues: write  # for auto-issue creation on failure

jobs:
  stage1:
    name: Stage 1 (1h synthetic soak)
    if: ${{ github.event_name == 'schedule' || inputs.stage == 'stage1' || inputs.stage == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75  # 1h soak + 15min preflight + cleanup buffer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure kubectl + loopzero CLI
        run: |
          echo "${{ secrets.KUBECONFIG_DEV_MGMT }}" > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          kubectl cluster-info
      - name: Stage 1 preflight (dry-run)
        run: |
          KUBECONFIG=/tmp/kubeconfig \
          LOOPZERO_API_URL="${{ secrets.LOOPZERO_API_URL_DEV }}" \
          PROM_URL="${{ secrets.PROM_URL_DEV }}" \
            bash infra/tests/parity/cell2-canary-stage1.sh --dry-run
      - name: Stage 1 LIVE (1h soak)
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          export LOOPZERO_API_URL="${{ secrets.LOOPZERO_API_URL_DEV }}"
          export PROM_URL="${{ secrets.PROM_URL_DEV }}"
          export LOOPZERO_SERVICE_AUTH="${{ secrets.LOOPZERO_ADMIN_SERVICE_AUTH_DEV }}"
          export SYNTH_TENANT_ID="tn-canary-stage1-${GITHUB_RUN_ID}"
          # Note: full ADR-compliant duration. Workflow timeout caps at 75min.
          bash infra/tests/parity/cell2-canary-stage1.sh
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CRITICAL] cell-2 Stage 1 ADR soak FAILED — run ${context.runId}`,
              body: `Stage 1 (1h synthetic) canary failed in run ${context.runId}.\n\nLogs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nTriage:\n- Verify ClusterCredential cell-2 connected\n- Verify loopzero_cell_discovery_count >= 2\n- See cell2-activation-plan T1.2 halt criteria.`,
              labels: ['priority/critical', 'area/multi-cell', 'cell-2-canary']
            });

  stage2:
    name: Stage 2 (24h, 10% dev tenants)
    needs: stage1
    if: ${{ github.event_name == 'schedule' || inputs.stage == 'stage2' || inputs.stage == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1500  # 25h cap (24h soak + 1h overhead)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure kubectl + loopzero CLI
        run: |
          echo "${{ secrets.KUBECONFIG_DEV_MGMT }}" > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          kubectl cluster-info
      - name: Stage 2 preflight (dry-run)
        run: |
          KUBECONFIG=/tmp/kubeconfig \
          LOOPZERO_API_URL="${{ secrets.LOOPZERO_API_URL_DEV }}" \
          PROM_URL="${{ secrets.PROM_URL_DEV }}" \
            bash infra/tests/parity/cell2-canary-stage2.sh --dry-run
      - name: Stage 2 LIVE (24h soak)
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          export LOOPZERO_API_URL="${{ secrets.LOOPZERO_API_URL_DEV }}"
          export PROM_URL="${{ secrets.PROM_URL_DEV }}"
          export LOOPZERO_SERVICE_AUTH="${{ secrets.LOOPZERO_ADMIN_SERVICE_AUTH_DEV }}"
          # Full ADR-compliant 24h soak with 10% sample.
          SOAK_SECONDS=86400 PERCENT=10 \
            bash infra/tests/parity/cell2-canary-stage2.sh
      - name: Append closure section to runbook (on success)
        if: success()
        env:
          RUN_ID: ${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo ""
            echo "## T5.7 stage 2 closure (CI run ${RUN_ID}, ${DATE})"
            echo ""
            echo "Mode: ADR-compliant 24h soak via .github/workflows/cell2-soaks.yml."
            echo "Sample: 10% of cell-1 dev tenants."
            echo "Result: GREEN — script exit 0."
            echo "Run logs: ${REPO_URL}/actions/runs/${RUN_ID}"
          } >> /tmp/cell2-stage2-closure.log
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CRITICAL] cell-2 Stage 2 ADR 24h soak FAILED — run ${context.runId}`,
              body: `Stage 2 (24h, 10% dev tenants) canary failed in run ${context.runId}.\n\nLogs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nTriage:\n- HALT remaining stages; production canary BLOCKED until RCA action items shipped.`,
              labels: ['priority/critical', 'area/multi-cell', 'cell-2-canary']
            });
