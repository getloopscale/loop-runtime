# AM6 — loopruntime artifact pipeline, dual-channel + low-cost.
#   develop push  → DEV channel: build only CHANGED services (paths-filter), tags :develop/:develop-<sha>, NO sign (cheap/fast)
#   tag v*        → RELEASE channel: build ALL 9 images + ALL charts, SBOM + provenance + keyless cosign
#   workflow_dispatch → build ALL (unsigned), manual
# Low-cost levers: change-detection (dev), GHA layer cache (build-publish.yml), amd64-only, cancel-in-progress (dev only).
name: artifacts
on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch: {}
# THE FLOOR, and only the floor. `packages: write` and `id-token: write` lived here and
# applied to all three jobs, including `plan`, which only checks out and runs paths-filter.
# zizmor flagged both as excessive-permissions (High) and was right: a token with package
# write scope exposed to a job that never publishes anything is surface that buys nothing.
# Each job declares what it uses, below.
permissions:
  contents: read
concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/develop' }}   # cancel superseded DEV runs only; never release
jobs:
  plan:
    # GitHub's default is 6 HOURS: a hung job burns that in billed minutes and holds a
    # concurrency slot the whole time.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set.outputs.images }}
      charts: ${{ steps.set.outputs.charts }}
      sign: ${{ steps.set.outputs.sign }}
      built_at: ${{ steps.provenance.outputs.built_at }}
      version: ${{ steps.provenance.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA-pin: supply-chain; matches build-publish.yml; issue #233)
        with:
          fetch-depth: 0                 # full history for accurate paths-filter diff on push
          persist-credentials: false     # zizmor artipacked: no later step pushes
      # The COMMIT date, not the build time. Two reasons, and the second decides: a build
      # timestamp changes on every run and the value enters the layer's cache key (the ARG is
      # used in the RUN), so EVERY build would recompile from scratch; and the commit date is
      # the provenance that matters to whoever reads the dashboard — "the code is from this
      # moment", not "the pipeline ran just now".
      #
      # `%cI` is strict ISO-8601, which is what the dashboard's formatInstant expects;
      # `repository.pushed_at` from the push event arrives as an integer epoch and the "Built"
      # column would show the raw number.
      - id: provenance
        # REF_NAME comes from the event via `env`, not from `git rev-parse --abbrev-ref HEAD`:
        # the Actions checkout is DETACHED at the sha, so git would return "HEAD" and the
        # version would come out as `HEAD-abc1234`. Nothing would fail — it would only be
        # wrong on screen, forever.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `develop-<sha7>`, not just `develop`: it is the convention the five neighbouring
          # services already show on the dashboard, and what makes the "Version" column
          # useful. The channel alone does not distinguish two builds — the screen would show
          # `develop` even after a fresh deploy. It mirrors the tag the metadata-action
          # produces for the image.
          {
            echo "built_at=$(git log -1 --format=%cI)"
            echo "version=${REF_NAME}-$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_OUTPUT"
      - id: filter
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3 (SHA-pin; issue #233)
        with:
          filters: |
            loopruntime-api: ['api/**', 'pkg/**']
            loopruntime-app-operator: ['operators/**', 'pkg/**']
            loopruntime-platform-operator: ['operators/**', 'pkg/**']
            loopruntime-tenant-operator: ['operators/**', 'pkg/**']
            loopruntime-preview-operator: ['operators/**', 'pkg/**']
            loopruntime-minio: ['infra/images/minio/**']
            loopruntime-clone-runner: ['infra/images/clone-runner/**']
            loopruntime-syft-scanner: ['infra/images/syft-scanner/**']
            loopruntime-cosign-signer: ['infra/images/cosign-signer/**']
            charts: ['charts/**']
      - id: set
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail
          ALL='[{"image":"loopruntime-api","dockerfile":"api/Dockerfile","context":"."},{"image":"loopruntime-app-operator","dockerfile":"operators/Dockerfile.app-operator","context":"."},{"image":"loopruntime-platform-operator","dockerfile":"operators/Dockerfile.platform-operator","context":"."},{"image":"loopruntime-tenant-operator","dockerfile":"operators/Dockerfile.tenant-operator","context":"."},{"image":"loopruntime-preview-operator","dockerfile":"operators/Dockerfile.preview-operator","context":"."},{"image":"loopruntime-minio","dockerfile":"infra/images/minio/Dockerfile","context":"infra/images/minio"},{"image":"loopruntime-clone-runner","dockerfile":"infra/images/clone-runner/Dockerfile","context":"infra/images/clone-runner"},{"image":"loopruntime-syft-scanner","dockerfile":"infra/images/syft-scanner/Dockerfile","context":"infra/images/syft-scanner"},{"image":"loopruntime-cosign-signer","dockerfile":"infra/images/cosign-signer/Dockerfile","context":"infra/images/cosign-signer"}]'
          # A grouped block instead of three `>>` (SC2129): one redirect opens the file
          # once. Beyond style, it avoids the class of bug where one of the redirects is
          # written `>` by mistake and truncates what the earlier ones wrote — in
          # `$GITHUB_OUTPUT` that erases outputs silently.
          if [ "$IS_TAG" = "true" ] || [ "$IS_DISPATCH" = "true" ]; then
            {
              echo "images=$ALL"
              echo "charts=true"
              echo "sign=$IS_TAG"        # sign ONLY on a real release tag
            } >> "$GITHUB_OUTPUT"
          else
            CH="${CHANGES:-[]}"
            SEL=$(printf '%s' "$ALL" | jq -c --argjson ch "$CH" '[.[] | select(.image as $i | $ch | index($i))]')
            {
              echo "images=$SEL"
              echo "charts=$(printf '%s' "$CH" | jq 'index("charts") != null')"
              echo "sign=false"
            } >> "$GITHUB_OUTPUT"
          fi
  images:
    needs: plan
    if: ${{ needs.plan.outputs.images != '[]' && needs.plan.outputs.images != '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    # The called workflow signs with cosign (`id-token`) and publishes to GHCR
    # (`packages`). They are its, and nobody else's in this file.
    permissions:
      contents: read
      packages: write
      id-token: write
      # build-publish.yml asks for it (GitHub-native provenance). A reusable that asks for
      # more than its caller grants is refused at startup, with no log and no message.
      attestations: write
    uses: ./.github/workflows/build-publish.yml
    with:
      image: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
      context: ${{ matrix.context }}
      sign: ${{ needs.plan.outputs.sign == 'true' }}
      # The CRITICAL+HIGH gate (fixed only) the control plane's images already pass. Off,
      # images built on Go 1.26.1 reached ECR with 53 HIGH findings in loopruntime-api.
      trivy: true
      # Amazon ECR, the registry production pulls from. Both are repository variables:
      # unset, the reusable skips ECR entirely instead of failing the GHCR channel.
      ecr_registry: ${{ vars.ECR_REGISTRY }}
      aws_role_arn: ${{ vars.AWS_IMAGE_PUBLISH_ROLE_ARN }}
      # Provenance injected into the binary. Without it the version endpoint serves the
      # code's defaults and the /status dashboard showed `dev` as the production version —
      # worse than an empty cell, because it looks like data.
      #
      # Passed to EVERY image in the matrix: only the engine's Dockerfile declares the ARGs
      # today, and a Dockerfile that does not declare them ignores the arg (an "unused build
      # arg" warning, not an error). Conditioning per image would need a branch in the matrix
      # that would break on the day the operators gained the same endpoint.
      #
      # `ref_name` is the CHANNEL (develop / vX.Y.Z) — what the dashboard's reader
      # recognises; the exact sha goes in LOOPRUNTIME_COMMIT, beside it.
      build_args: |
        LOOPRUNTIME_VERSION=${{ needs.plan.outputs.version }}
        LOOPRUNTIME_COMMIT=${{ github.sha }}
        LOOPRUNTIME_BUILD_DATE=${{ needs.plan.outputs.built_at }}
    # NAMED, not `inherit`. `inherit` hands EVERY repository secret to the called workflow,
    # including the ones it does not declare and the ones created later. These four are the
    # ones `build-publish.yml` declares in `workflow_call.secrets`; a fifth created tomorrow
    # does not leak by omission.
    secrets:
      GOMOD_SSH_KEY: ${{ secrets.GOMOD_SSH_KEY }}
      GOMOD_TOKEN: ${{ secrets.GOMOD_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  charts:
    # GitHub's default is 6 HOURS: a hung job burns that in billed minutes and holds a
    # concurrency slot the whole time.
    timeout-minutes: 20
    needs: plan
    if: ${{ needs.plan.outputs.charts == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA-pin; issue #233)
        with:
          persist-credentials: false   # zizmor artipacked: no later step pushes
      - name: Login GHCR (helm)
        # Same class as #250: no `${{ }}` inside `run:`. Here the secret also stops travelling
        # through the COMMAND LINE — `printenv` does not show up in `ps`, unlike an `echo` with
        # the value already substituted into the script text.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printenv GHCR_TOKEN | helm registry login ghcr.io -u "${GHCR_USER}" --password-stdin
      - name: Package + push the charts (OCI)
        # The namespace comes from the REPOSITORY OWNER, not from fixed text.
        #
        # It read `oci://ghcr.io/getloopscale/charts`. With the repo transferred to the
        # `getloopscale` org, the run stopped having push permission in that namespace and the
        # charts died with `403: Forbidden` on the first `HEAD` — measured in run 30583134483.
        #
        # It is the same defect the images' `registry` already had, and the umbrella runbook
        # lists that cascade among the things forgotten in a transfer. Deriving it instead of
        # fixing it makes the next change of owner inert here.
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # lowercase: account names preserve case, OCI references do not.
          NS="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          mkdir -p /tmp/charts
          # loopruntime-common is a library chart that image-backed charts depend on; resolve
          # local (file://) deps into charts/<chart>/charts/ before packaging.
          for c in charts/*/; do
            [ -f "$c/Chart.yaml" ] || continue
            helm dependency update "$c"
            helm package "$c" -d /tmp/charts
          done
          # Every merge pushes every chart, so a transient GHCR error (run 45447262098: `failed
          # to perform "Tag" on destination: ...: not found`) is retried before the run fails.
          for tgz in /tmp/charts/*.tgz; do
            for attempt in 1 2 3; do
              helm push "$tgz" "oci://ghcr.io/${NS}/charts" && break
              if [ "$attempt" = 3 ]; then
                echo "::error::pushing $(basename "$tgz") failed 3 times"
                exit 1
              fi
              sleep $((attempt * 10))
            done
          done
