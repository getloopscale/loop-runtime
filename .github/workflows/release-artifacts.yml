# AM6 — loopzero artifact pipeline, dual-channel + low-cost.
#   develop push  → DEV channel: build only CHANGED services (paths-filter), tags :develop/:develop-<sha>, NO sign (cheap/fast)
#   tag v*        → RELEASE channel: build ALL 5 services + ALL 13 charts, SBOM + provenance + keyless cosign
#   workflow_dispatch → build ALL (unsigned), manual
# Low-cost levers: change-detection (dev), GHA layer cache (build-publish.yml), amd64-only, cancel-in-progress (dev only).
name: artifacts
on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/develop' }}   # cancel superseded DEV runs only; never release
jobs:
  plan:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    outputs:
      images: ${{ steps.set.outputs.images }}
      charts: ${{ steps.set.outputs.charts }}
      sign: ${{ steps.set.outputs.sign }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA-pin: supply-chain; matches build-publish.yml; issue #233)
        with: { fetch-depth: 0 }   # full history for accurate paths-filter diff on push
      - id: filter
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3 (SHA-pin; issue #233)
        with:
          filters: |
            loopzero-api: ['api/**', 'pkg/**']
            loopzero-app-operator: ['operators/**', 'pkg/**']
            loopzero-platform-operator: ['operators/**', 'pkg/**']
            loopzero-tenant-operator: ['operators/**', 'pkg/**']
            loopzero-preview-operator: ['operators/**', 'pkg/**']
            charts: ['charts/**']
      - id: set
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail
          ALL='[{"image":"loopzero-api","dockerfile":"api/Dockerfile","context":"."},{"image":"loopzero-app-operator","dockerfile":"operators/Dockerfile.app-operator","context":"."},{"image":"loopzero-platform-operator","dockerfile":"operators/Dockerfile.platform-operator","context":"."},{"image":"loopzero-tenant-operator","dockerfile":"operators/Dockerfile.tenant-operator","context":"."},{"image":"loopzero-preview-operator","dockerfile":"operators/Dockerfile.preview-operator","context":"."}]'
          # Bloco agrupado em vez de tres `>>` (SC2129): um unico redirect abre o
          # arquivo uma vez so'. Alem do estilo, evita a classe de bug em que um
          # dos redirects e' escrito `>` por engano e trunca o que os anteriores
          # gravaram — em `$GITHUB_OUTPUT` isso apaga saidas silenciosamente.
          if [ "$IS_TAG" = "true" ] || [ "$IS_DISPATCH" = "true" ]; then
            {
              echo "images=$ALL"
              echo "charts=true"
              echo "sign=$IS_TAG"        # sign ONLY on a real release tag
            } >> "$GITHUB_OUTPUT"
          else
            CH="${CHANGES:-[]}"
            SEL=$(printf '%s' "$ALL" | jq -c --argjson ch "$CH" '[.[] | select(.image as $i | $ch | index($i))]')
            {
              echo "images=$SEL"
              echo "charts=$(printf '%s' "$CH" | jq 'index("charts") != null')"
              echo "sign=false"
            } >> "$GITHUB_OUTPUT"
          fi
  images:
    needs: plan
    if: ${{ needs.plan.outputs.images != '[]' && needs.plan.outputs.images != '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    uses: ./.github/workflows/build-publish.yml
    with:
      image: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
      context: ${{ matrix.context }}
      sign: ${{ needs.plan.outputs.sign == 'true' }}
      # Proveniencia injetada no binario. Sem isto o endpoint de versao serve os
      # defaults do codigo e o painel /status exibia `dev` como versao de
      # producao — pior que celula vazia, porque parece um dado.
      #
      # Passado a TODAS as imagens da matriz: so' o Dockerfile do engine declara
      # as ARGs hoje, e um Dockerfile que nao as declara ignora a arg (aviso de
      # "unused build arg", nao erro). Condicionar por imagem exigiria um ramo na
      # matriz que quebraria no dia em que os operators ganhassem o mesmo
      # endpoint.
      #
      # `ref_name` e' o CANAL (develop / vX.Y.Z) — o que o leitor do painel
      # reconhece; o sha exato vai em LOOPZERO_COMMIT, ao lado.
      build_args: |
        LOOPZERO_VERSION=${{ github.ref_name }}
        LOOPZERO_COMMIT=${{ github.sha }}
        LOOPZERO_BUILD_DATE=${{ github.event.repository.pushed_at }}
    secrets: inherit
  charts:
    needs: plan
    if: ${{ needs.plan.outputs.charts == 'true' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA-pin; issue #233)
      - name: Login GHCR (helm)
        # Mesma classe do #250: nada de `${{ }}` dentro de `run:`. Aqui o segredo tambem deixa de
        # transitar pela LINHA DE COMANDO — `printenv` nao aparece em `ps`, ao contrario de um `echo`
        # com o valor ja substituido no texto do script.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printenv GHCR_TOKEN | helm registry login ghcr.io -u "${GHCR_USER}" --password-stdin
      - name: Package + push the 13 charts (OCI)
        # O namespace vem do DONO DO REPOSITORIO, nao de texto fixo.
        #
        # Estava `oci://ghcr.io/getloopscale/charts`. Com o repo transferido para a
        # org `getloopscale`, o run passou a nao ter permissao de push naquele
        # namespace e os 13 charts morreram com
        # `403: Forbidden` no primeiro `HEAD` — medido no run 30583134483.
        #
        # E' o mesmo defeito que o `registry` das imagens ja' tinha, e o runbook do
        # umbrella lista essa cascata entre os pontos que se esquece numa
        # transferencia. Derivar em vez de fixar faz o proximo movimento de dono
        # ser inerte aqui.
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # minusculas: nomes de conta preservam maiusculas, referencias OCI nao.
          NS="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          mkdir -p /tmp/charts
          # loopzero-common is a library chart that image-backed charts depend on; resolve
          # local (file://) deps into charts/<chart>/charts/ before packaging.
          for c in charts/*/; do
            [ -f "$c/Chart.yaml" ] || continue
            helm dependency update "$c" 2>/dev/null || true
            helm package "$c" -d /tmp/charts
          done
          for tgz in /tmp/charts/*.tgz; do
            helm push "$tgz" "oci://ghcr.io/${NS}/charts"
          done
