---
# T1.14 — Decisions + Operations Stability Check
# Prevents silent deletion of ratified ADRs, MEET DRs, and operational
# runbooks/inventories without a superseding record, per Plan Amendment
# Policy (`.claude/rules/pre-release-governance.md`).
#
# Lesson source 1: MEET-2026-05-12 D5 — commit fc1793dd silently deleted
# ADR-0020 + ADR-0021 + 3 MEET DRs under an unrelated commit message.
#
# Lesson source 2: Same commit fc1793dd ALSO swept the T8.5a egress
# inventory runbook (docs/runbooks/network-policy-egress-inventory.md),
# breaking TestNetworkPolicy_DocumentsT85b silently. Restored via
# MEET-ASYNC-AMENDMENT-2026-05-12-001 + commit a6e8b895. Path glob
# extended to cover operations/*-runbook.md + *-inventory.md to prevent
# recurrence on the next cleanup pass.

name: Decisions + Operations Stability Check (T1.14)

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '.claude/knowledge-base/decisions/**'
      - '.claude/knowledge-base/meetings/**'
      - '.claude/knowledge-base/concepts/operations/**'
      - '.github/workflows/decisions-stability-check.yml'
      - 'pkg/quality/decisionsdeletion/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  check-decisions-stability:
    name: Validate ADR/MEET deletion has superseder
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'
          cache-dependency-path: cmd/loopzero-ops/go.sum

      - name: Ensure base ref available
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          echo "Base ref: ${{ github.base_ref }}"
          echo "PR head: ${{ github.event.pull_request.head.sha }}"

      # T5.3 of plan 2026-05-22: migrated from check-decisions-deletion.sh + its
      # hermetic test (D6 AUTO-DIE) to a pure-Go gate. git is on the D5 allow-list
      # (only pulumi/helm/kubectl/aws/gh are forbidden shell-wraps).
      - name: Run decisions deletion guard
        run: |
          cd cmd/loopzero-ops && go run . quality decisions-deletion \
            --root "${GITHUB_WORKSPACE}" \
            --base-ref "origin/${{ github.base_ref }}" \
            --head-ref "${{ github.event.pull_request.head.sha }}"

      - name: Annotate violation
        if: failure()
        run: |
          echo "::error title=Stability Violation::A ratified ADR, MEET DR, or operations runbook/inventory was deleted without a superseder. See workflow log for details. Per Plan Amendment Policy, deletion requires either a superseding file with 'superseded_by:' frontmatter OR explicit MEET ratification."
