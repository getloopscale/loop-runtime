# Infra SOTA Gates — consolidated CI workflow that enforces the 19 gates
# defined in docs/technical/infra/sota-gates.md.
#
# Gate enforcement scripts live in scripts/ and are exercised here as required
# CI checks. Per Plan ADR D8 ("gate without enforcement is not a gate"),
# adding a gate to sota-gates.md MUST be paired with a script invocation here.
#
# Trigger paths cover all surfaces gated by this workflow:
#   - infra/helm/** (bootstrap charts — securityContext audit)
#   - charts/**     (published charts — schema validation)
#   - .github/workflows/** (action SHA pinning)
#   - scripts/**    (gate scripts themselves)
#   - docs/technical/infra/** (gate definitions)
#
# Per MEET-2026-05-03-062 (MEET-A) condition #4: this workflow MUST be a
# required check on main + develop branch protection.

name: Infra Gates

on:
  push:
    branches: [develop, homolog, main]
    paths:
      - "infra/helm/**"
      - "charts/**"
      - ".github/workflows/**"
      - "pkg/quality/securitycontext/**"
      - "pkg/quality/actionpinning/**"
      # 2026-05-20: extend filter to include divergence-matrix gate
      # (was missing — script changes did not re-trigger CI validation)
      - "pkg/quality/divergencematrix/**"
      - ".claude/knowledge-base/concepts/operations/local-prod-divergence-matrix.md"
      - "docs/runbooks/local-prod-divergence-matrix.md"
      # Files where LP-NNN markers live — changing them should trigger
      # matrix integrity re-check
      - "api/**/*.go"
      - "operators/**/*.go"
      - "cli/src/**/*.ts"
      - "pkg/**/*.go"
      - "docs/technical/infra/sota-gates.md"
  pull_request:
    branches: [develop, homolog, main]
    paths:
      - "infra/helm/**"
      - "charts/**"
      - ".github/workflows/**"
      - "pkg/quality/securitycontext/**"
      - "pkg/quality/actionpinning/**"
      # 2026-05-20: matrix integrity (see push filter notes above)
      - "pkg/quality/divergencematrix/**"
      - ".claude/knowledge-base/concepts/operations/local-prod-divergence-matrix.md"
      - "docs/runbooks/local-prod-divergence-matrix.md"
      - "api/**/*.go"
      - "operators/**/*.go"
      - "cli/src/**/*.ts"
      - "pkg/**/*.go"
      - "docs/technical/infra/sota-gates.md"

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # INF-G08 — Secure Defaults
  # securityContext audit on bootstrap charts
  # ──────────────────────────────────────────────────────────────────────
  securitycontext-audit:
    name: "INF-G08: securityContext audit"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'
          cache-dependency-path: cmd/loopzero-ops/go.sum

      # T5.3 of plan 2026-05-22: migrated audit-security-context.sh to pure-Go gate.
      - name: Run audit (--gate mode)
        run: cd cmd/loopzero-ops && go run . quality security-context --root "${GITHUB_WORKSPACE}" --gate

      - name: Generate report (PR comment artifact)
        if: always()
        run: cd cmd/loopzero-ops && go run . quality security-context --root "${GITHUB_WORKSPACE}" > "${GITHUB_WORKSPACE}/audit-report.md"

      - name: Upload audit report
        if: always()
        # pragma: allow-tag-pin
        # TODO(INF-G18 / plan T1.1): Renovate Bot resolves to @<sha40> on first run.
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: securitycontext-audit-report
          path: audit-report.md

  # ──────────────────────────────────────────────────────────────────────
  # INF-G18 — CI Pipeline Supply Chain Security
  # Action SHA pinning enforcement
  # ──────────────────────────────────────────────────────────────────────
  action-pinning:
    name: "INF-G18: Action SHA pinning"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'
          cache-dependency-path: cmd/loopzero-ops/go.sum

      # T5.3 of plan 2026-05-22: migrated from scripts/check-action-pinning.sh to
      # pure-Go gate. The bash regex `^[[:space:]]*uses:` silently MISSED the
      # inline `- uses:` form (latent no-op — see finding-2026-05-22-action-pinning-noop).
      # The Go gate fixes that: it matches both inline and standalone uses lines.
      - name: Run action-pinning gate (INF-G18)
        run: cd cmd/loopzero-ops && go run . quality action-pinning --workflows-dir "${GITHUB_WORKSPACE}/.github/workflows"

  # ──────────────────────────────────────────────────────────────────────
  # Plan T5.2 — Local↔Prod divergence matrix integrity
  # Per ADR D5: every code marker `LOCAL ONLY (LP-NNN)` must have a matrix entry.
  # ──────────────────────────────────────────────────────────────────────
  divergence-matrix:
    name: "Plan T5.2: divergence matrix integrity"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'
          cache-dependency-path: cmd/loopzero-ops/go.sum

      # T5.3 of plan 2026-05-22: migrated from check-divergence-matrix.sh to
      # pure-Go gate (no shell-out). Same invariant: every code marker
      # `LOCAL ONLY (LP-NNN)` must have a matrix entry + OPEN entries need markers.
      - name: Run divergence-matrix gate
        run: cd cmd/loopzero-ops && go run . quality divergence-matrix --root "${GITHUB_WORKSPACE}"

  # ──────────────────────────────────────────────────────────────────────
  # Plan T0.3 — TypeScript orphan-exports gate (knip)
  # Per ADR-0022 amplification: detects "implemented but not wired" pattern
  # in TS code. Currently warn-mode (continue-on-error) until baseline ≤ 0.
  # ──────────────────────────────────────────────────────────────────────
  ts-orphan-exports:
    name: "Plan T0.3: knip orphan-exports (CLI)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          node-version: '20'
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI deps
        working-directory: cli
        run: npm ci

      - name: Run knip (warn-mode)
        # rationale (T6.8): warn-mode until knip baseline reaches 0. Flip to
        # fail-on-finding when all current findings deleted or moved to ignore.
        # graduation: tracked in T-INF-G14 backlog
        continue-on-error: true
        working-directory: cli
        run: npx knip --no-progress

      - name: Knip summary
        if: always()
        working-directory: cli
        run: |
          echo "::group::Knip findings"
          npx knip --no-progress --reporter compact 2>&1 | tail -20 || true
          echo "::endgroup::"

  # ──────────────────────────────────────────────────────────────────────
  # INF-G17 — Chart Schema Validation
  # values.schema.json present + helm lint --strict on charts/*
  # ──────────────────────────────────────────────────────────────────────
  chart-schema:
    name: "INF-G17: Chart schema validation"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: ./.github/actions/setup-helm
        with:
          version: v3.14.4

      - name: Verify schema presence
        run: |
          MISSING=()
          for chart in charts/*/; do
            chart_name=$(basename "$chart")
            # loopzero-common is a library chart — schema not strictly required
            if [ "$chart_name" = "loopzero-common" ]; then continue; fi
            if [ ! -f "$chart/values.schema.json" ]; then
              MISSING+=("$chart_name")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Charts without values.schema.json: ${MISSING[*]}"
            echo "Per INF-G17, all published charts (except loopzero-common library) MUST have values.schema.json."
            exit 1
          fi
          echo "✅ All published charts have values.schema.json"

      - name: helm lint --strict
        run: |
          FAILED=0
          for chart in charts/*/; do
            echo "::group::helm lint --strict $chart"
            if ! helm lint --strict "$chart"; then
              FAILED=1
            fi
            echo "::endgroup::"
          done
          if [ $FAILED -ne 0 ]; then
            echo "::error::helm lint --strict failed for ≥ 1 chart"
            exit 1
          fi
