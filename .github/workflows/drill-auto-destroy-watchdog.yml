# Drill auto-destroy watchdog — Plan 2026-05-16 T4.1 (EC-12 mitigation).
#
# Runs every 6 hours. Scans DO account for drill clusters tagged with
# `loopzero-drill-expires-at-<ISO>`, parses expiration, destroys any stack
# whose expires-at < now via pulumi destroy + drill-teardown-validator.sh
# (doctl fallback per T4.1.bis EC-05).
#
# Safety net for cost burn: drill stack costs ~$0.32/hr when active.
# Without watchdog, a forgotten run leaks $7.68/day until billing
# dashboard catches it. Watchdog catches within 6h max → $1.92 max leak.
#
# Per D6 + T3.4.bis: default drill expires-at is 8h (Stage 1 + ad-hoc);
# Stage 2 cell2-soaks overrides to 26h. 48h ceiling enforced in
# infra/pulumi-drill/src/index.ts:71.
#
# Belt-and-suspenders with T4.2 DO budget alerts (different layer —
# alerts fire on $ threshold, watchdog fires on time threshold).

name: Drill Auto-Destroy Watchdog

on:
  schedule:
    # Every 6h. Aligned to common drill expires-at default (8h) so most
    # forgotten stacks die within 2h after expiry.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (scan + report, no destroy)'
        required: false
        type: boolean
        default: false

concurrency:
  # Single watchdog per ref — prevent overlapping cron invocations.
  group: drill-watchdog-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  scan-and-destroy:
    name: Scan drill resources + destroy if expired
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup doctl + pulumi
        run: |
          # Install doctl
          DOCTL_VERSION="1.110.0"
          curl -sL "https://github.com/digitalocean/doctl/releases/download/v${DOCTL_VERSION}/doctl-${DOCTL_VERSION}-linux-amd64.tar.gz" \
            | tar -xz
          sudo mv doctl /usr/local/bin/
          # Install pulumi
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> $GITHUB_PATH

      - name: Run watchdog (dry-run check)
        if: ${{ inputs.dry_run == true }}
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          # Dry-run: invoke watchdog logic in scan-only mode by listing
          # drill clusters without destroying.
          doctl kubernetes cluster list --format ID,Name,Tag --no-header | grep -E "loopzero-drill" || echo "No drill clusters found"

      - name: Run watchdog (full destroy if expired)
        if: ${{ !inputs.dry_run }}
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          bash infra/scripts/dr/watchdog.sh

      - name: Upload audit trail (always)
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: drill-watchdog-audit-${{ github.run_id }}
          path: /tmp/drill-teardown-audit-*.md
          retention-days: 90
          if-no-files-found: ignore

      - name: Open issue on PARTIAL/FAILED teardown
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CRITICAL] Drill watchdog FAILED — manual cleanup required — run ${context.runId}`,
              body: `Watchdog scan found expired drill stack(s) but force-delete FAILED.\n\nCost burn risk: drill stack continues at ~$0.32/hr until manual cleanup.\n\nLogs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nAction required:\n1. Download audit trail artifact\n2. SSH to drill account and run \`doctl kubernetes cluster list\` + force-delete manually\n3. Run \`pulumi state delete\` if Pulumi state contains orphan resources\n\nPer plan 2026-05-16 T4.1.bis + EC-05 — partial teardown is the highest-cost failure mode.`,
              labels: ['priority/critical', 'area/drill', 'cost-burn']
            });
