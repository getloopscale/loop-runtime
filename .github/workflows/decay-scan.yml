name: decay-scan

# Weekly decay scanner — detects expired claims per docs/GOVERNANCE.md (§2 Decay Policy).
# Opens issue when claims overdue (CRITICAL >60d, HIGH >30d, MEDIUM <=30d).
#
# Per T0.3 of status-validation-and-doc-consolidation-plan.

on:
  schedule:
    # Sundays 02:00 UTC (after drill-prod-identical-soak.yml at 01:00)
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no issue creation)"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Run decay scanner
        id: scan
        run: |
          bash infra/scripts/governance/scan-decay.sh --json > /tmp/decay-report.json || true
          echo "report_path=/tmp/decay-report.json" >> "$GITHUB_OUTPUT"
          EXPIRED_COUNT=$(python3 -c "import json; d=json.load(open('/tmp/decay-report.json')); print(d['expired_count'])")
          echo "expired_count=$EXPIRED_COUNT" >> "$GITHUB_OUTPUT"
          echo "scanned=$(python3 -c "import json; d=json.load(open('/tmp/decay-report.json')); print(d['scanned'])")" >> "$GITHUB_OUTPUT"
          echo "## Decay scan completed"
          echo "Scanned: $(python3 -c "import json; d=json.load(open('/tmp/decay-report.json')); print(d['scanned'])") files"
          echo "Expired: $EXPIRED_COUNT claims"

      - name: Generate markdown report
        if: steps.scan.outputs.expired_count != '0'
        run: |
          bash infra/scripts/governance/scan-decay.sh > /tmp/decay-report.md || true

      - name: Open / update issue
        if: steps.scan.outputs.expired_count != '0' && github.event.inputs.dry_run != 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const reportBody = fs.readFileSync('/tmp/decay-report.md', 'utf8');
            const expired = ${{ steps.scan.outputs.expired_count }};

            const title = `[decay] ${expired} expired claims need revalidation`;

            // Find existing open issue with this title prefix
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'decay-scan',
            });

            const existingIssue = existing.data.find(i => i.title.startsWith('[decay]'));

            if (existingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                title: title,
                body: reportBody,
              });
              console.log(`Updated issue #${existingIssue.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: reportBody,
                labels: ['decay-scan', 'governance'],
              });
              console.log('Created new decay-scan issue');
            }

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: decay-scan-report-${{ github.run_id }}
          path: |
            /tmp/decay-report.json
            /tmp/decay-report.md
          retention-days: 90

      - name: Notify on alert (Slack)
        if: steps.scan.outputs.expired_count != '0' && github.event.inputs.dry_run != 'true'
        uses: ./.github/actions/governance-notify
        with:
          title: "[decay] ${{ steps.scan.outputs.expired_count }} expired claims"
          body: "Decay scan found ${{ steps.scan.outputs.expired_count }} expired claims in ${{ steps.scan.outputs.scanned }} files. See workflow run + GitHub issue."
          workflow_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          webhook_url: "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Fail if expired claims found (non-dry-run)
        if: steps.scan.outputs.expired_count != '0' && github.event.inputs.dry_run != 'true'
        run: |
          echo "::warning::${{ steps.scan.outputs.expired_count }} expired claims detected"
          # Non-fatal — issue is opened, work continues
