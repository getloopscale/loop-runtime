# The premise check. This is the one thing in this repository that goes red when
# the local delivery gate is not armed, and it is deliberately not the local
# delivery gate.
#
# AND SOMETHING ELSE WATCHES THIS FILE, since 2026-09-06. An audit measured that
# the sentence above had a hole exactly its own size: a workflow cannot report
# its own deletion. Delete this file and no run is queued, no check appears, and
# an absent check reads on a pull request like a repository that never had one.
# `.github/scripts/assert_gate_observers_intact.py` is what reports that now —
# it asserts this file exists, keeps the triggers below, carries no paths filter
# and still runs its script. It is invoked from `workflow-hygiene.yml` (on
# GitHub, at the push and on the promotion PR) and from `task quality:hermetic`
# (on the pusher's machine, BEFORE the push). Neither of those is this file, and
# that is the whole requirement.
#
# WHERE THE RING ENDS, said plainly: one commit that disarms the local gate AND
# deletes both workflows is reported by nothing, because every reporter is in it.
# Terminating that needs an authority outside the file tree — a REQUIRED status
# check — and this repository cannot have one. Measured 2026-09-06: branch
# protection and rulesets both return 403, "Upgrade to GitHub Pro or make this
# repository public" (org `getloopscale` is on the `free` plan; `loopruntime` is PRIVATE).
# So this check NOTIFIES and does not block, and no amount of work inside the
# repository changes that — it is a purchase or a visibility change.
#
# WHY IT IS A SEPARATE WORKFLOW AND NOT A JOB IN ci.yml. Three measured reasons,
# each of which alone would be enough:
#
#   1. `on:` FILTERS ARE PER-WORKFLOW, NOT PER-JOB. ci.yml ignores `.claude/**`,
#      and `.claude/**` is the only place the gate can be disarmed from. Of the
#      three commits that falsified the premises, the deletion ("chore: reinstall
#      the Squad kit — mechanisms/, Python hooks, and the squad library",
#      2026-09-02) and the restore that missed the wiring ("fix(.claude): restore
#      three files the repo gates still require", 2026-08-29) touched NOTHING
#      outside `.claude/**`; the wiring removal ("chore(.claude): adopt the
#      reconfigured kit", 2026-08-29) touched `.gitignore` and `.claude/**` and
#      nothing else. The published history holds only the `.gitignore` half of
#      the third (8526133a2) and nothing of the first two: `.claude/**` is the
#      gitignored kit and never reaches GitHub. Two of the three would not have started
#      ci.yml at all, merged. A job inside ci.yml inherits that blindness in the
#      exact case it exists for. This file therefore carries no paths filter, and
#      that is not an oversight to tidy up later.
#
#   2. ci.yml IS RED AND HAS BEEN. Its last 15 runs all failed (32084704925
#      through 32197072865, measured 2026-09-06), the failing step is `Test the
#      hermetic modules`, and `go test ./... -count=1` in cmd/loopruntime-ops is red on
#      `trufflehogscan.TestRealTreeIsAdjudicated` in a clean worktree today.
#      A new signal added to an already-red job is not a signal. This one stands
#      or falls on its own subject.
#
#   3. COST. ci.yml needs two checkouts, a deploy key for a private module and a
#      Go toolchain, and runs 2-4 minutes; `task quality:gates` needs helmfile,
#      kubeconform, actionlint, trivy and golangci-lint and fails high without
#      them, by design. This needs python3 and bash, which every runner has, and
#      finishes in seconds. That is what buys the pre-merge trigger below.
#
# WHAT IT DOES NOT COVER — read this before citing it. It answers exactly one
# question: is the local gate armed? It does not build, does not vet, does not
# run a test of this repository's product code, and says nothing about whether
# the change under review is correct. Build/vet/test coverage before a merge
# still does not exist here, and the reason is (2) above, not a decision.
name: delivery-gate-armed

# NO paths / paths-ignore, on purpose — see (1). A commit that touches only
# `.claude/settings.json` is precisely the commit that must start this.
on:
  # `workspace` is in the list and it is the point of the list. The window the
  # item measured was four days and 21 commits on `workspace`, and no workflow in
  # this repository has a trigger that fires on a push to it — so the earliest a
  # non-local check could possibly have spoken was the promotion PR, four days in.
  #
  # Measure this before trusting it, because the obvious measurement misleads:
  # `gh run list --branch workspace` returns 50 rows. All 50 are `pull_request`
  # events dated 2026-08-10..2026-08-12, from before bcb52c9ac ("validacao
  # pos-merge em develop e main; PR sem acao") removed the trigger that produced
  # them. Nothing has run on this branch since. At seconds per run a push trigger
  # is affordable, and the push is the earliest event there is.
  push:
    branches: [workspace, develop, main]
  # The promotion — `workspace -> develop -> main`, where PR #344 sat
  # MERGEABLE/CLEAN with one check from a third-party service reporting as
  # skipping.
  #
  # This comment used to call it "the check that CAN BE MADE REQUIRED". Measured
  # 2026-09-06 and it cannot: branch protection and rulesets are both 403 on this
  # plan (see the header). What this trigger buys is therefore narrower and worth
  # stating exactly — the verdict EXISTS on the promotion PR, in red, before the
  # merge, for a human to read. It does not stop the merge, and nothing in this
  # repository does.
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gate-armed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  armed:
    name: "delivery gate — file, wiring, no bypass"
    # Frota Blacksmith, LITERAL label: `vars.CI_RUNNER` does not resolve in this
    # repo and the `||` fallback returns the old fleet in silence (umbrella
    # runbook). This is the same label ci.yml and workflow-hygiene.yml already
    # prove works here; naming a smaller, cheaper-looking fleet size that has
    # never been exercised in this repository would risk a job that queues
    # forever, which is the one outcome a check like this cannot afford.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA-pin; issue #233)
        with:
          persist-credentials: false   # zizmor artipacked: no later step pushes

      # If the script is missing, python3 exits non-zero and this step fails.
      # Fail-closed by construction: deleting the checker cannot produce a pass.
      - run: python3 .github/scripts/assert_delivery_gate_armed.py
