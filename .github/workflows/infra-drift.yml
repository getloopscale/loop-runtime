# MEET-055 B1: Pulumi Drift Detection
# Runs every 6 hours. Detects infrastructure drift (IaC vs cloud provider).
# NEVER auto-remediates. Creates GitHub Issue + Slack alert on drift.
#
# The stress test incident showed 576 drift changes accumulated over 2 days
# because there was no scheduled detection. This workflow prevents recurrence.

name: Infra Drift Detection

on:
  schedule:
    # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
  PULUMI_SKIP_CHECKPOINTS: "true"
  AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
  DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  drift-check:
    name: Check Pulumi Drift (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stack: [homolog]
    defaults:
      run:
        working-directory: infra/pulumi
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/pulumi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Pulumi preview (expect no changes)
        id: preview
        # continue-on-error: true is required so the "Create GitHub Issue" step runs on drift.
        # The job is marked as failed via the explicit exit 1 in "Check for drift" step.
        continue-on-error: true
        run: |
          npx pulumi preview --stack ${{ matrix.stack }} --expect-no-changes --non-interactive --json 2>&1 | tee /tmp/drift-output.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Check for drift
        id: drift
        run: |
          if [ "${{ steps.preview.outcome }}" = "failure" ]; then
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
            echo "::error::Infrastructure drift detected on stack ${{ matrix.stack }}!"
          else
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            echo "No drift detected on stack ${{ matrix.stack }}"
          fi

      - name: Create GitHub Issue on drift
        if: steps.drift.outputs.drift_detected == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const title = `🚨 Infrastructure drift detected on stack: ${{ matrix.stack }}`;
            const body = [
              `## Drift Detection Report`,
              ``,
              `**Stack:** \`${{ matrix.stack }}\``,
              `**Time:** ${new Date().toISOString()}`,
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `### What happened`,
              `\`pulumi preview --expect-no-changes\` detected differences between`,
              `the Pulumi state and the actual cloud resources.`,
              ``,
              `### Action Required`,
              `1. Review the drift in the workflow logs`,
              `2. If drift is from a break-glass hotfix: reconcile via \`pulumi up\``,
              `3. If drift is unauthorized: investigate and revert`,
              `4. **NEVER** use \`pulumi state delete --force\` without deleting the real resource first`,
              ``,
              `### Labels`,
              `\`infra\`, \`drift\`, \`priority:high\``,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['infra', 'drift'],
            });

      - name: Fail job on drift
        if: steps.drift.outputs.drift_detected == 'true'
        run: |
          echo "::error::Drift detected. GitHub Issue created. Job marked as failed."
          exit 1
