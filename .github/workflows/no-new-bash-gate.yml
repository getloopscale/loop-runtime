---
# no-new-bash CI gate (T6.2 of plan 2026-05-22-shell-script-strategic-plan.md v1.3)
#
# Materializes D3 ADR ("Creation of new bash scripts is FORBIDDEN by default").
# Fails PR if any new .sh file is introduced outside the allowlist at
# .claude/rules/shell-scripts-allowlist.md.
#
# EC-04 mitigation: fetch-depth: 0 is MANDATORY. Without full git history,
# the gate would produce 100 false positives (all scripts marked as "new").
# A pre-flight git rev-parse confirms base-ref reachable; on failure emits
# BASE_REF_UNREACHABLE with actionable fix hint.

name: no-new-bash gate (D3)

on:
  pull_request:
    branches:
      - main
      - develop
    # Run on every PR — gate is cheap (<5s) and protects the regression invariant.
    # Path filter intentionally absent: PR adding `.sh` outside expected paths
    # MUST still be caught.

permissions:
  contents: read
  pull-requests: read

jobs:
  no-new-bash:
    name: D3 — no new bash scripts outside allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head (fetch-depth=0 mandatory per EC-04)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Without fetch-depth: 0 the base-ref `origin/main` is unreachable
          # in a shallow clone, gate emits BASE_REF_UNREACHABLE and CI fails
          # with a CLEAR error (no false positives).
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25.10'
          cache-dependency-path: cmd/loopzero-ops/go.sum

      - name: Build loopzero-ops
        working-directory: cmd/loopzero-ops
        run: go build -o /tmp/loopzero-ops .

      - name: Determine base ref
        id: baseref
        run: |
          # PR base ref from GitHub event payload
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          # Ensure base ref is fetched
          git fetch origin "${{ github.event.pull_request.base.ref }}" --no-tags --quiet || true
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      - name: Run no-new-bash gate
        run: |
          /tmp/loopzero-ops quality no-new-bash \
            --root . \
            --allowlist .claude/rules/shell-scripts-allowlist.md \
            --base-ref "${{ steps.baseref.outputs.base }}" \
            --head-ref HEAD

      - name: Annotate failure
        if: failure()
        run: |
          echo "::error title=D3 Gate Violation::This PR introduces new .sh file(s) outside the allowlist. Per docs/plans/2026-05-22-shell-script-strategic-plan.md D3, bash creation is forbidden by default. Either: (1) migrate the function to helmfile/Go/Ginkgo, OR (2) add an entry to .claude/rules/shell-scripts-allowlist.md with an ADR explaining D4 criteria satisfaction."
