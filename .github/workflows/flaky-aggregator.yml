name: Quality Gates - Flaky Aggregator

# Plan 2026-05-21-comprehensive-quality-gates v1.1 T6.2 + EC-4.
# Single-writer daily cron — reads all flaky-tracker artifacts from
# past 7 days + opens GitHub issues for tests with >=3 marks.

on:
  schedule:
    - cron: '0 8 * * *'  # daily 08:00 UTC
  workflow_dispatch:

concurrency:
  group: flaky-aggregator
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read  # for artifact download

jobs:
  aggregate:
    name: Aggregate flaky test events
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download flaky event artifacts (past 7d)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/flaky-artifacts
          gh api -X GET "/repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            > /tmp/all-artifacts.json
          python3 infra/scripts/quality/flaky-artifact-fetch.py /tmp/all-artifacts.json /tmp/flaky-artifacts

      - name: Aggregate + open issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 infra/scripts/quality/flaky-aggregator.py
