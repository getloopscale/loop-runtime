# pkg-sota-faang-grade-plan / Phase 3 — T3.2 Final Dogfood Gate via CI cron.
#
# Per ADR-0030 + ADR-0029 + CONDITION-5 (sre-engineer absolute veto), the
# T3.2 dogfood gate verifies the cross-cutting pkg-sota changes did not
# regress the deploy/scaling/promote/rollback flows under load:
#   - 4-hour soak with continuous deploy traffic at production rate (~30/h)
#   - Zero pod restarts across api + 4 split operators
#   - SLO: loopzero deploy P95 < 705ms (cell-2 baseline per CHG-2026-05-03)
#   - RFC 9457 problem+json shape on error responses (T2.3 Stage C)
#   - Circuit breaker recovery via Hydra restart simulation (T1.4 + T2.1)
#   - kstatus condition triplet present on Tenant CRs (T2.2 future adoption)
#
# Per pkg-sota-faang-grade-plan v1.1 T3.2 Deferred Runbook, this is
# wall-clock-bound (4h+ soak), not compute-bound — Ralph Loop iterations
# cannot execute it honestly. This workflow runs the gate on production
# DOKS clusters via weekly cron — same pattern as
# operator-split-soak.yml + cell2-soaks.yml.
#
# Pre-conditions (enforced by preflight):
#   - All 4 split operator charts deployed
#   - api running with pkg/errors/http RFC 9457 emitter
#   - Hydra running (for CB recovery probe)
#   - Prometheus reachable for SLO query
#   - Sample app fixture available at /tmp/sample-app
#
# Failure auto-pages on-call via issue creation.

name: pkg-sota dogfood gate (4h soak + RFC9457 + CB recovery + SLO)

on:
  schedule:
    # Friday 02:00 UTC — separate from cell2-soaks.yml (Sunday) and
    # operator-split-soak.yml (Saturday) to avoid overlapping soak runs.
    - cron: '0 2 * * 5'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Soak duration in minutes'
        type: choice
        required: true
        default: '240'
        options:
          - '15'    # smoke
          - '60'    # 1h sanity
          - '240'   # 4h ADR-compliant
      cluster:
        description: 'Target cluster context'
        type: string
        required: true
        default: 'loopzero-mgmt-dev'
      enable_chaos:
        description: 'Inject Hydra restart mid-soak (CB recovery test)'
        type: boolean
        required: true
        default: true

jobs:
  preflight:
    name: Preflight (verify cluster + pkg-sota deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cluster_ready: ${{ steps.check.outputs.cluster_ready }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Check api + 4 split operators present
        id: check
        run: |
          set -e
          CTX="${{ github.event.inputs.cluster || 'loopzero-mgmt-dev' }}"
          OK=0
          # api deployment is required for RFC 9457 emission and CB-protected JWKS
          if kubectl --context "$CTX" -n loopzero-system get deploy api >/dev/null 2>&1; then
            OK=$((OK+1))
          else
            echo "::error::api deployment NOT found on $CTX"
          fi
          # Split operators (T2.1+T1.4 ate-own-dogfood path requires CB v2)
          for op in tenant app preview platform; do
            if kubectl --context "$CTX" -n loopzero-system get deploy loopzero-${op}-operator >/dev/null 2>&1; then
              OK=$((OK+1))
            else
              echo "::error::loopzero-${op}-operator deployment NOT found on $CTX"
            fi
          done
          if [ "$OK" -ne 5 ]; then
            echo "cluster_ready=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "cluster_ready=true" >> $GITHUB_OUTPUT
      - name: Check Hydra reachable (CB recovery test pre-cond)
        if: ${{ github.event.inputs.enable_chaos == 'true' }}
        run: |
          CTX="${{ github.event.inputs.cluster || 'loopzero-mgmt-dev' }}"
          if ! kubectl --context "$CTX" -n loopzero-system get deploy ory-hydra >/dev/null 2>&1; then
            echo "::error::ory-hydra not deployed; CB recovery test impossible"
            exit 1
          fi
      - name: Check Prometheus reachable
        run: |
          CTX="${{ github.event.inputs.cluster || 'loopzero-mgmt-dev' }}"
          kubectl --context "$CTX" -n monitoring port-forward svc/prometheus-server 9090:80 >/dev/null 2>&1 &
          PF=$!
          sleep 5
          curl -sf http://localhost:9090/-/healthy >/dev/null
          kill $PF

  rfc9457_shape:
    name: RFC 9457 problem+json shape (T2.3 Stage C)
    needs: preflight
    if: needs.preflight.outputs.cluster_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Trigger 422 + verify problem+json
        run: |
          CTX="${{ github.event.inputs.cluster || 'loopzero-mgmt-dev' }}"
          kubectl --context "$CTX" -n loopzero-system port-forward svc/api 13001:8080 >/dev/null 2>&1 &
          PF=$!
          sleep 5
          # POST without body should return 400 INVALID_REQUEST or 422 VALIDATION_FAILED
          RESP=$(curl -sfi -X POST http://localhost:13001/api/v1/projects -H "Authorization: Bearer ${{ secrets.SOAK_AUTH_TOKEN }}" -d '{}' || true)
          kill $PF
          # Assert Content-Type: application/problem+json
          if ! echo "$RESP" | grep -qi "application/problem+json"; then
            echo "::error::T2.3 Stage C: response missing application/problem+json content-type"
            echo "$RESP"
            exit 1
          fi
          # Assert required fields
          BODY=$(echo "$RESP" | tail -n 1)
          for f in type title status detail code; do
            if ! echo "$BODY" | jq -e ".$f" >/dev/null 2>&1; then
              echo "::error::T2.3 Stage C: response missing RFC 9457 field $f"
              echo "$BODY"
              exit 1
            fi
          done
          # Assert type URI starts with https://loopzero.example/errors/
          TYPE=$(echo "$BODY" | jq -r .type)
          if ! echo "$TYPE" | grep -q "^https://loopzero.example/errors/"; then
            echo "::error::T2.3 Stage C: type URI does not match canonical prefix"
            exit 1
          fi
          echo "RFC 9457 shape PASS: $BODY"

  cb_recovery:
    name: Circuit breaker recovery (T1.4 + T2.1)
    needs: preflight
    if: |
      needs.preflight.outputs.cluster_ready == 'true' &&
      github.event.inputs.enable_chaos == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Restart Hydra and verify CB graceful degradation
        run: |
          CTX="${{ github.event.inputs.cluster || 'loopzero-mgmt-dev' }}"
          # Restart Hydra to force JWKS endpoint outage.
          kubectl --context "$CTX" -n loopzero-system rollout restart deploy ory-hydra
          # Tail api logs for the CB sentinel.
          kubectl --context "$CTX" -n loopzero-system logs -l app=api --tail=100 --since=2m > /tmp/api-logs.txt &
          # Wait for Hydra rollout (must complete in <2m).
          kubectl --context "$CTX" -n loopzero-system rollout status deploy ory-hydra --timeout=120s
          sleep 30
          # Verify api log contains either CB-open sentinel or stale-cache fallback evidence.
          if ! grep -qE "circuit breaker|jwks fetch skipped|stale" /tmp/api-logs.txt; then
            echo "::warning::CB sentinel not observed in logs — graceful degradation may be silent (acceptable if no auth failures recorded)"
          fi
          # The hard-pass criterion: NO 5xx auth errors recorded in the api error rate metric.
          kubectl --context "$CTX" -n monitoring port-forward svc/prometheus-server 9090:80 >/dev/null 2>&1 &
          PF=$!
          sleep 5
          ERR_RATE=$(curl -sG "http://localhost:9090/api/v1/query" \
            --data-urlencode "query=rate(http_requests_total{job=\"api\",code=~\"5..\"}[2m])" \
            | jq -r '.data.result[0].value[1] // "0"')
          kill $PF
          echo "5xx error rate during Hydra restart: $ERR_RATE/s"
          if (( $(echo "$ERR_RATE > 0.1" | bc -l) )); then
            echo "::error::T1.4 + T2.1: CB failed to insulate auth flow during Hydra outage (5xx rate ${ERR_RATE}/s > 0.1)"
            exit 1
          fi

  soak:
    name: ${{ github.event.inputs.duration || '240' }}-minute soak
    needs: [preflight, rfc9457_shape]
    if: needs.preflight.outputs.cluster_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 270  # 4h soak + 30min slack
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Capture initial pod state
        run: |
          CTX="${{ github.event.inputs.cluster || 'loopzero-mgmt-dev' }}"
          kubectl --context "$CTX" -n loopzero-system get pods \
            -o custom-columns=NAME:.metadata.name,RESTARTS:.status.containerStatuses[0].restartCount > /tmp/initial-pods.txt
          cat /tmp/initial-pods.txt
      - name: Spawn deploy traffic (30/h baseline)
        run: |
          CTX="${{ github.event.inputs.cluster || 'loopzero-mgmt-dev' }}"
          DURATION_MIN=${{ github.event.inputs.duration || '240' }}
          INTERVAL=120
          ITERATIONS=$(( DURATION_MIN * 60 / INTERVAL ))
          for i in $(seq 1 $ITERATIONS); do
            loopzero deploy --project /tmp/sample-app --json > /tmp/deploy-$i.json &
            sleep $INTERVAL
          done
          wait
      - name: Capture final pod state + SLO
        run: |
          CTX="${{ github.event.inputs.cluster || 'loopzero-mgmt-dev' }}"
          kubectl --context "$CTX" -n loopzero-system get pods \
            -o custom-columns=NAME:.metadata.name,RESTARTS:.status.containerStatuses[0].restartCount > /tmp/final-pods.txt
          cat /tmp/final-pods.txt
          if ! diff /tmp/initial-pods.txt /tmp/final-pods.txt; then
            echo "::warning::Pod restart count changed during soak"
          fi
          kubectl --context "$CTX" -n monitoring port-forward svc/prometheus-server 9090:80 >/dev/null 2>&1 &
          PF=$!
          sleep 5
          P95=$(curl -sG "http://localhost:9090/api/v1/query" \
            --data-urlencode "query=histogram_quantile(0.95, rate(loopzero_deploy_duration_seconds_bucket[5m]))" \
            | jq -r '.data.result[0].value[1] // "missing"')
          kill $PF
          echo "P95 deploy duration: ${P95}s"
          if [ "$P95" = "missing" ]; then
            echo "::error::P95 metric missing — Prometheus scrape gap?"
            exit 1
          fi
          if (( $(echo "$P95 > 0.705" | bc -l) )); then
            echo "::error::SLO breach: P95=${P95}s > 0.705s (CHG-2026-05-03 baseline)"
            exit 1
          fi

  report:
    name: Auto-issue on failure
    needs: [soak, rfc9457_shape]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Open auto-issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="pkg-sota dogfood gate failed. Run: ${RUN_URL}. "
          BODY+="Per pkg-sota-faang-grade-plan v1.1 T3.2 Deferred Runbook, "
          BODY+="the gate enforces RFC 9457 problem+json shape (T2.3 Stage C), "
          BODY+="circuit breaker recovery during Hydra restart (T1.4 + T2.1), "
          BODY+="4h soak + zero pod restarts, and SLO loopzero deploy P95 < 705ms. "
          BODY+="Investigate registry coverage, JWKS fallback, kstatus regression."
          gh issue create \
            --title "pkg-soak FAILED on $(date -u +%Y-%m-%d)" \
            --label "soak-failure,p1,pkg-sota" \
            --body "$BODY"
