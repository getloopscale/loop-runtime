# CI — Fast quality gate for every push and PR.
# Only deterministic, fast checks. No databases, no clusters, no deploys.
# Integration tests live in integration-tests.yml (separate workflow).
name: CI

on:
  push:
    branches: [main, develop, homolog]
  pull_request:
    # Only run on PRs from external branches — NOT when head is develop/main/homolog
    # (those already trigger via push). Prevents duplicate runs.
    branches: [main, develop, homolog]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  GO_VERSION: '1.25.9'
  NODE_VERSION: '20'
  KUBECONFORM_VERSION: 'v0.6.7'
  ENVTEST_K8S_VERSION: '1.31.0'
  GOPRIVATE: 'github.com/getloopscale/*'
  GONOSUMCHECK: 'github.com/getloopscale/*'

# Same group for push and PR on same branch — prevents duplicate runs.
# push to develop and PR develop→main share the same group key.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # CHANGE DETECTION
  # ─────────────────────────────────────────────

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      go-api: ${{ steps.filter.outputs.go-api }}
      go-operators: ${{ steps.filter.outputs.go-operators }}
      go-pkg: ${{ steps.filter.outputs.go-pkg }}
      go-infra: ${{ steps.filter.outputs.go-infra }}
      cli: ${{ steps.filter.outputs.cli }}
      pulumi: ${{ steps.filter.outputs.pulumi }}
      manifests: ${{ steps.filter.outputs.manifests }}
      charts: ${{ steps.filter.outputs.charts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go-api:
              - 'api/**'
              - 'pkg/**'
              - 'go.work'
            go-operators:
              - 'operators/**'
              - 'pkg/**'
              - 'go.work'
            go-pkg:
              - 'pkg/**'
            go-infra:
              - 'infra/tests/**'
              - 'infra/scripts/**'
            cli:
              - 'cli/**'
            pulumi:
              - 'infra/pulumi/**'
            manifests:
              - 'operators/config/**'
              - 'infra/helm/**'
              - 'infra/tilt/**'
            charts:
              - 'charts/**'

  # ─────────────────────────────────────────────
  # LINT — code quality checks
  # ─────────────────────────────────────────────

  lint-go:
    name: Lint Go (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: >-
      needs.changes.outputs.go-pkg == 'true' ||
      needs.changes.outputs.go-api == 'true' ||
      needs.changes.outputs.go-operators == 'true'
    strategy:
      fail-fast: false
      matrix:
        component: [pkg, operators, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.component }}/go.sum
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          working-directory: ${{ matrix.component }}

  lint-cli:
    name: Lint CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: cd cli && npm ci
      - name: ESLint
        run: cd cli && npm run lint
      - name: Type check
        run: cd cli && npx tsc --noEmit

  tidy-go:
    name: Go mod tidy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: >-
      needs.changes.outputs.go-api == 'true' ||
      needs.changes.outputs.go-operators == 'true' ||
      needs.changes.outputs.go-pkg == 'true' ||
      needs.changes.outputs.go-infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify go.mod and go.sum are tidy
        run: |
          FAILED=0
          for dir in pkg api operators infra/tests infra/scripts; do
            if [ -f "$dir/go.mod" ]; then
              echo "Checking $dir..."
              (cd "$dir" && go mod tidy)
              if [ -n "$(git status --porcelain -- "$dir/go.mod" "$dir/go.sum")" ]; then
                echo "::error::go.mod or go.sum is not tidy in $dir. Run 'go mod tidy' and commit."
                FAILED=1
              fi
            fi
          done
          exit $FAILED

  # ─────────────────────────────────────────────
  # UNIT TESTS — fast, no external deps
  # ─────────────────────────────────────────────

  test-pkg:
    name: Test pkg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.go-pkg == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: pkg/go.sum
      - run: cd pkg && go test ./... -short -v -race -count=1

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.go-api == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum
      - run: cd api && go test ./... -short -v -race -count=1

  test-operators:
    name: Test Operators
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.go-operators == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: operators/go.sum
      - name: Install envtest
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use ${{ env.ENVTEST_K8S_VERSION }} -p path)" >> $GITHUB_ENV
      - run: cd operators && go test ./... -short -v -race -count=1

  test-infra:
    name: Test infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.go-infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: infra/tests/go.sum
      - run: cd infra/tests && go test ./unit/... -short -v -race -count=1

  test-cli:
    name: Test CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: cd cli && npm ci && npm run build
      - run: cd cli && npm test -- --ci --coverage
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cli-coverage
          path: cli/coverage/
          retention-days: 7

  test-pulumi:
    name: Test Pulumi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.pulumi == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/pulumi/package-lock.json
      - run: cd infra/pulumi && npm ci && npx tsc --noEmit && npm test

  # ─────────────────────────────────────────────
  # VALIDATE — manifests + migrations + charts
  # ─────────────────────────────────────────────

  validate-manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.manifests == 'true' || needs.changes.outputs.go-operators == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/${{ env.KUBECONFORM_VERSION }}/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz && sudo mv kubeconform /usr/local/bin/
      - run: kubeconform --strict --skip CustomResourceDefinition operators/config/
      - run: kubeconform --strict infra/tilt/api-deployment.yaml infra/tilt/operator-deployment.yaml
      - run: kubeconform --strict --skip AppProject,Application infra/helm/argocd/templates/
      - run: kubeconform --strict --skip ServiceMonitor,PrometheusRule,Probe infra/helm/monitoring/manifests/

  migration-safety:
    name: Migration safety
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: changes
    if: needs.changes.outputs.go-api == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Reject migrate force
        run: |
          matches=$(grep -rnE '(^|[[:space:]`"''])migrate([[:space:]]+-[^[:space:]]+)*[[:space:]]+force([[:space:]]+[0-9]+|$)' \
              --include='*.sh' --include='*.yml' --include='*.yaml' \
              --include='*.go' --include='*.ts' \
              --include='Taskfile.yml' --include='Tiltfile' \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=docs \
              --exclude='ci.yml' . || true)
          offending=$(echo "$matches" | grep -vE '(^|[[:space:]])(#|//)\s*NEVER' | grep -vE '^\s*$' || true)
          if [ -n "$offending" ]; then
            echo "::error::migrate force invocation found"
            echo "$offending"
            exit 1
          fi
      - name: Forward-only migrations
        run: |
          viol=$(grep -rlnE '^\s*(ALTER\s+TABLE\s+\w+\s+)?DROP\s+(TABLE|COLUMN)' \
              api/internal/db/migrations/ --include='*.up.sql' 2>/dev/null || true)
          for f in $viol; do
            case "$(basename "$f")" in *rebuild*) continue ;; esac
            if head -20 "$f" | grep -qE '^\s*--\s*ALLOW-DESTRUCTIVE'; then continue; fi
            echo "::error::Destructive DDL in $f"
            exit 1
          done

  lint-charts:
    name: Lint charts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Update deps + lint
        run: |
          for chart in charts/*/; do
            [ -f "$chart/Chart.yaml" ] && grep -q "dependencies:" "$chart/Chart.yaml" && helm dependency update "$chart" 2>/dev/null
          done
          FAILED=0
          for chart in charts/*/; do helm lint "$chart" || FAILED=1; done
          exit $FAILED
      - name: kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.6/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
          for chart in charts/*/; do
            grep -q "type: library" "$chart/Chart.yaml" 2>/dev/null && continue
            helm template "$(basename "$chart")" "$chart" 2>/dev/null | \
              kubeconform --strict --ignore-missing-schemas --kubernetes-version 1.31.0 --summary
          done
      - name: CRD sync
        run: |
          SRC=$(ls operators/config/crd/bases/loopzero.io_*.yaml | wc -l)
          DST=$(ls charts/loopzero-crds/templates/*.yaml | wc -l)
          [ "$SRC" -eq "$DST" ] || { echo "::error::CRD mismatch: source=$SRC chart=$DST"; exit 1; }

  # ─────────────────────────────────────────────
  # SECURITY — vuln scans + secret detection
  # ─────────────────────────────────────────────

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: govulncheck (pkg)
        if: needs.changes.outputs.go-pkg == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          cd pkg && govulncheck ./...
      - name: govulncheck (api)
        if: needs.changes.outputs.go-api == 'true'
        run: cd api && govulncheck ./...
      - name: govulncheck (operators)
        if: needs.changes.outputs.go-operators == 'true'
        run: cd operators && govulncheck ./...
      - name: npm audit
        if: needs.changes.outputs.cli == 'true'
        run: cd cli && npm ci && npm audit --omit=dev --audit-level=high

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          ignore-unfixed: true
          trivyignores: .trivyignore
          skip-dirs: infra/tests/e2e/fixtures,examples,loopzero-packs,loopzero-forge,referencias

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.94.3
        with:
          extra_args: --only-verified --results=verified,unknown

  # ─────────────────────────────────────────────
  # GATE — all checks must pass
  # ─────────────────────────────────────────────

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    needs:
      - changes
      - lint-go
      - lint-cli
      - tidy-go
      - test-pkg
      - test-api
      - test-operators
      - test-infra
      - test-cli
      - test-pulumi
      - validate-manifests
      - lint-charts
      - migration-safety
      - security
    steps:
      - name: Check results
        run: |
          RESULTS="${{ join(needs.*.result, ' ') }}"
          for result in $RESULTS; do
            if [[ "$result" == "failure" ]] || [[ "$result" == "cancelled" ]]; then
              echo "::error::CI failed"
              exit 1
            fi
          done
          echo "CI passed"
