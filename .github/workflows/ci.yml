# Fast compile gate plus the hermetic tests of the Go modules.
#
# THE DEFECT THIS PREVENTS: until this file, the repository had NO gate on GitHub at all.
# Actions were removed as the pipeline on 2026-05-23 and replaced by `task quality:gates`
# in a pre-push hook — which runs on the pusher's machine, and only there. Measured
# consequences, in the same week this was written:
#
#   - a push dying in SIGPIPE (#256) cannot tell "the gate refused" from "the connection
#     dropped", and anyone with the hook uninstalled runs nothing at all;
#   - `LOOP_RUNTIME_SKIP_PREPUSH` exists and nothing records that it was used;
#   - the operator's machine happens to have Go 1.26, helmfile, kubeconform, trivy and
#     golangci-lint installed. A new contributor does not, and finds out after the merge.
#
# SCOPE — honestly limited, and the limit is deliberate.
#
# It runs build, vet and the tests that do NOT need a cluster. It does NOT run
# `task quality:gates` (the full gate set) or the operators suite. Concrete reasons, not
# a lack of will:
#
#   quality:gates  needs helmfile, kubeconform, actionlint, trivy and golangci-lint on
#                  PATH, and FAILS LOUDLY when they are missing — by design, so it never
#                  passes in silence. Provisioning that is work of its own; until then the
#                  set stays in the pre-push hook.
#   operators/     uses envtest (Ginkgo plus kube-apiserver binaries via setup-envtest).
#                  It downloads ~100MB and takes minutes; it lands when the gate has the
#                  time budget for it.
#
# A gate that covers less and SAYS what it does not cover is useful. A gate that promises
# full coverage and runs half is worse than none — which is what motivated #255.
name: CI

# TRIGGERS: post-merge push to `develop` and `main`, plus `workflow_call`.
#
# This header used to describe a `pull_request` trigger and call it one of "the
# TWO triggers, not one". The `on:` block below has not had a `pull_request` key
# since bcb52c9ac, "ci: validacao pos-merge em develop e main; PR sem acao"  # english-only: verbatim quote of a commit subject
# (in English: "post-merge validation on develop and main; no action on PRs") — the
# commit that made the decision this file records, which changed the trigger and
# left the paragraph describing the old one. So the header outlived what it
# described by every run since. Corrected 2026-09-06 rather than deleted, because
# the sentence it got right is still right — every commit entering the trunk
# should be verified, and here the trunk is `develop` — and the honest form of
# that sentence is that what runs on `develop` today runs AFTER the merge. The
# `on:` block says why, and names what now checks the premise it rests on.
on:
  workflow_call:
  # POST-MERGE validation, not on the PR. Decision of 2026-08-12, re-examined on
  # 2026-09-06 and KEPT — with its reason replaced by a measurement.
  #
  # WHAT THE REASON USED TO BE. It was asserted right here: that the gate
  # stopping a bad merge in this repository is local — `.claude/hooks/
  # delivery-gate.sh` runs the quality suite before every `git push` and blocks
  # on red, with no bypass — so duplicating it on the PR would pay runner minutes
  # to re-run what already ran on the pusher's machine. Three premises, and all
  # three were false at the same time between 2026-08-29 and 2026-09-02: the
  # hook file was deleted ("chore: reinstall the Squad kit — mechanisms/, Python
  # hooks, and the squad library", 2026-09-02, the third deletion), its wiring in
  # `.claude/settings.json` had been gone four days longer ("chore(.claude): adopt
  # the reconfigured kit", 2026-08-29 — published as 8526133a2, which carries only
  # its `.gitignore` half; and the restore four hours later put the FILE back and
  # not the wiring), and "no
  # bypass" was false in four spellings, each one a real push that reached the
  # remote with the gate deciding nothing. 21 commits landed on `workspace` in
  # that window — an upper bound, since the repository records when a commit was
  # authored and not when it was pushed. Nothing, anywhere, said so.
  #
  # WHAT THE REASON IS NOW. The same trade, with the premises CHECKED instead of
  # asserted: `.github/workflows/delivery-gate-armed.yml` runs
  # `.github/scripts/assert_delivery_gate_armed.py` on every push to `workspace`,
  # `develop` and `main`, and on every pull request into `develop` and `main`. It
  # verifies the file, the wiring and the four bypass spellings, in seconds, on a
  # runner that needs neither Go nor a deploy key. It is a SEPARATE workflow
  # because `on:` filters are per-workflow and the `paths-ignore` below excludes
  # `.claude/**` — the only place the gate can be disarmed from. Two of the three
  # commits that falsified the premises touched nothing outside `.claude/**` and
  # would not have started this workflow at all.
  #
  # AND WHAT CHECKS THAT CHECK. An audit of the paragraph above measured the hole
  # it left, and the hole has the shape of the fix: A WORKFLOW CANNOT REPORT ITS
  # OWN DELETION. Delete `delivery-gate-armed.yml` and it does not go red — it
  # stops existing, and an absent check reads on a pull request exactly like a
  # repository that never had one. Same outcome, harder to see: leave it in place
  # and give it a `paths:` filter, and it survives every listing while never
  # firing for the `.claude/**`-only commit that is the shape of all three
  # historical disarms. So since 2026-09-06 a THIRD file reports on the second:
  # `.github/scripts/assert_gate_observers_intact.py` asserts that
  # `delivery-gate-armed.yml` is present, carries no paths filter, still triggers
  # on `workspace`/`develop`/`main` and on PRs into `develop`/`main`, and still
  # invokes its script. It runs from two substrates that fail independently —
  # `workflow-hygiene.yml` on GitHub, and `task quality:hermetic` on the pusher's
  # machine BEFORE the push, which is the only moment a deletion can be refused
  # at a cost of zero ungated pushes.
  #
  # WHY THIS JOB STAYS POST-MERGE — measured 2026-09-06, not assumed:
  #   - it costs 2-4 minutes and needs two checkouts, a deploy key for a private
  #     module and a Go toolchain; `task quality:gates` on top of that needs
  #     helmfile, kubeconform, actionlint, trivy and golangci-lint and fails high
  #     without them by design (see ESCOPO above);
  #   - it is RED, and has been. Runs 32084704925 through 32197072865 — the last
  #     fifteen — all failed, the failing step being `Test the hermetic modules`,
  #     and `go test ./... -count=1` in cmd/loop-runtime-ops is red in a clean worktree
  #     today on `trufflehogscan.TestRealTreeIsAdjudicated` (re-measured
  #     2026-09-06). Promoting a permanently-red job to a gate on the PR would
  #     block every promotion for a cause unrelated to the change under review,
  #     which is how gates get switched off.
  #
  # AND THE THING NONE OF THE ABOVE DOES — measured, not assumed, because the
  # sentence this paragraph replaces assumed it. NOTHING IN THIS REPOSITORY CAN
  # BLOCK A MERGE. Every check here, this one included, NOTIFIES; a red check
  # stops nothing until branch protection marks it required, and on 2026-09-06
  # that setting was not merely unset — it is unavailable:
  #
  #     gh api repos/getloopscale/loop-runtime/branches/develop/protection  -> 403
  #     gh api repos/getloopscale/loop-runtime/branches/main/protection     -> 403
  #     gh api repos/getloopscale/loop-runtime/rulesets                     -> 403
  #     "Upgrade to GitHub Pro or make this repository public to enable this
  #      feature."
  #
  # The org `getloopscale` is on the `free` plan and `loop-runtime` is PRIVATE, and that
  # combination is what the API is refusing. So "make the armed-check a required
  # check" is not a checkbox anyone forgot to tick — it is a purchase (org Team
  # plan) or a visibility change (make the repo public), and until one of those
  # happens the honest description of every gate in this file is that it tells
  # someone, and that someone has to act. Written here rather than left implied,
  # because the previous version of this comment reasoned about required checks
  # as though this repository had them.
  #
  # THE CONSEQUENCE, STILL SAID OUT LOUD: with this job not acting on the PR, its
  # first signal arrives AFTER the merge, and fixing a red `develop` is a
  # follow-up commit or a revert rather than a "do not merge". What changed is
  # that the premise this trade rests on is now verified before the merge instead
  # of believed. What did NOT change: build, vet and test coverage before a merge
  # still does not exist here, and what blocks it is the red above, not this
  # decision. (B-192)
  push:
    branches: [develop, main]
    # `.claude/**` is ignored here and NOT in delivery-gate-armed.yml, which is
    # the whole reason that file is separate: a commit touching only
    # `.claude/settings.json` cannot start this workflow, and that is precisely
    # the commit that disarms the gate.
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      - 'docs/**'

  # THE MISSING TRIGGER, and why it was missing matters more than the line.
  #
  # `bcb52c9ac` (2026-08-12) removed `pull_request` and moved the gates into a pre-push
  # hook. While the repository was private with one author the difference was theoretical:
  # whoever pushes has the hook. Open, it stops being theoretical — a stranger's PR would
  # reach `develop` without the suite having run once, because the `push:` above only
  # fires AFTER the merge.
  #
  # Measured 2026-09-16: of the 8 modules in go.work, only `api` and `pkg` need the
  # PRIVATE sibling `loop-runtime-contracts`. The other six — including `cmd/loop-runtime-ops`, which
  # carries the gates — build with `GOWORK=off` and need no secret at all. That is what
  # makes a real gate for a fork possible: see `public-checks`.
  #
  # No path filter here, unlike `push:` above. Branch protection requires `CI gate`, and a
  # workflow skipped by a path filter reports no status at all, so a pull request that
  # changed only documentation stayed blocked on a check that could never arrive (#183).
  # Such a pull request now pays for one full run.
  pull_request:
    branches: [develop, main]

  # Without this, a repository using a merge queue waits forever for a check that never
  # reports on the queue's temporary branch, and there is no failure anywhere to read. It
  # costs one line and is only ever noticed when it is missing.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Skipped on a FORK PR, and the reason is mechanical rather than political: the steps
    # below use a deploy key to fetch the PRIVATE sibling `loop-runtime-contracts`, and GitHub does
    # not hand a secret to a workflow triggered by a fork's PR. Without this condition the
    # job RUNS and fails at the deploy-key step — a red that says nothing about the
    # contribution. `ci-gate` accepts the skip by name, for a fork only.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # RUNNER: the Blacksmith fleet, enabled 2026-07-30 with the transfer of this
    # repository to the `getloopscale` org.
    #
    # The label is LITERAL on purpose. The umbrella runbook measured that
    # `vars.CI_RUNNER` does NOT resolve in this repo (`LABELS=[self-hosted,linux,x64]`,
    # even with `visibility=all`) and the `||` fallback returns the old fleet IN SILENCE —
    # CI goes green on the wrong fleet. Check `runner_name`, never `conclusion`.
    #
    # Two chained pre-conditions, both satisfied before this line existed:
    #   1. the repo belongs to an ORGANISATION (`owner.type=Organization`)
    #   2. the `blacksmith-sh` GitHub App is installed IN THE ORG that owns the repo
    # The second only becomes visible after solving the first, which is what cost three
    # attempts during the loop-runtime-memory migration.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GOPRIVATE: github.com/getloopscale/*

    steps:
      # TWO checkouts, and the second is not optional.
      #
      # `GOWORK=off` with a single checkout was tried first — it is what api/Dockerfile
      # does. It does NOT work for the whole repository, and the measurement was this:
      #
      #   cmd/loop-runtime-ops  `go.mod` does not declare `jackc/pgx/v5` at all; the dependency
      #                 resolves only through the workspace.
      #   api           `go.sum` carries the hash of the pgx module but NOT its `/go.mod`
      #                 line — exactly the form go.work supplies.
      #   infra/scripts the same gap.
      #
      # The Dockerfile escapes this because it builds ONLY `api/./cmd/`, a subset whose
      # dependencies are complete. A gate that builds everything has no such luck.
      #
      # The alternative would be `go mod tidy` across the 6 modules. Rejected here:
      # changing the whole repository's dependency resolution to accommodate a new gate is
      # letting the gate dictate the architecture — and it risks breaking image builds
      # that work today. Preserving the workspace makes CI exercise the SAME resolution a
      # developer exercises locally, which is the property a gate is wanted for.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA-pin: supply-chain; issue #233)
        with:
          # Full history: the cmd/loop-runtime-ops suite resolves commit SHAs cited in workflow
          # comments and scans history for secrets, and a shallow clone makes both refuse
          # to measure (they fail under CI rather than report a clean they did not see).
          fetch-depth: 0
          persist-credentials: false   # zizmor artipacked: no later step pushes
          path: loop-runtime

      # `loop-runtime-contracts` is PRIVATE and was transferred to `getloopscale` together with this
      # repo. Access comes from a read-only DEPLOY KEY registered on it (id 158891596),
      # with the private half in GOMOD_SSH_KEY.
      #
      # UPDATED 2026-08-07: the import path does NOT stay on `getloopscale` any more. Commit
      # 0b4bbd63d (2026-08-06) rewrote api/go.mod and pkg/go.mod to
      # `github.com/getloopscale/contracts v0.6.0`, reversing the premise above — but
      # this workflow stayed on `getloopscale` and stopped finding the version, failing with
      # "pkg/go.mod does not declare loop-runtime-contracts". The last green run was 2026-07-31;
      # the whole pipeline was blocked from the migration onwards.
      #
      # Why a deploy key and not a PAT: the need is `Contents: read` on ONE repository. An
      # account PAT reaches everything the account reaches; the deploy key reaches exactly
      # this repo, read-only, and is revocable on its own without affecting anything else.
      # The previous `GOMOD_TOKEN` died (`Bad credentials`, measured in run 30621505439)
      # and took down 10 builds without naming the cause.
      - name: Deploy key for the private module
        env:
          GOMOD_SSH_KEY: ${{ secrets.GOMOD_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GOMOD_SSH_KEY:-}" ]; then
            echo "::error::GOMOD_SSH_KEY is empty — api/go.mod requires github.com/getloopscale/contracts (private). Register the private half of the read-only deploy key."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printenv GOMOD_SSH_KEY > ~/.ssh/gomod_key
          chmod 600 ~/.ssh/gomod_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # IdentitiesOnly + IdentityAgent=none: without these the runner's agent can
          # offer another key first and GitHub answers `Repository not found` — the same
          # message a genuinely absent repository gives. It cost one round of
          # local diagnosis before `-v` showed the wrong key being offered.
          cat >> ~/.ssh/config <<'SSHCFG'
          Host github.com
            IdentityFile ~/.ssh/gomod_key
            IdentitiesOnly yes
            IdentityAgent none
          SSHCFG
          # go/git fetch the module over HTTPS; rewriting to SSH is what makes the deploy
          # key get used.
          git config --global url."git@github.com:getloopscale/".insteadOf "https://github.com/getloopscale/"
          git ls-remote git@github.com:getloopscale/contracts.git >/dev/null
          echo "deploy key OK — loop-runtime-contracts reachable."

      # WHICH version of loop-runtime-contracts to check out — derived from `go.mod`, never fixed
      # here.
      #
      # THE DEFECT THIS CORRECTS (measured in run 30627506396): a checkout with no `ref:`
      # brings the repository's DEFAULT branch, which is `main` — 12 commits behind
      # `develop` and without `plan.MetricCPUCoreSeconds`. The build died on
      # `undefined: plan.MetricCPUCoreSeconds`, and the message suggested broken code when
      # what was broken was the VERSION the gate had chosen on its own.
      #
      # The `v0.3.0` tag the go.mod files require DOES have the symbols — the declared
      # dependency was correct the whole time. Pinning the version in the workflow would fix
      # today and lie at the next bump; deriving it from go.mod makes the gate exercise
      # exactly the version the repository declares.
      - name: Resolve the loop-runtime-contracts version go.mod requires
        id: contracts
        run: |
          set -euo pipefail
          pkg_v=$(awk '/getloopscale\/contracts/ {print $2}' loop-runtime/pkg/go.mod | head -1)
          api_v=$(awk '/getloopscale\/contracts/ {print $2}' loop-runtime/api/go.mod | head -1)
          if [ -z "$pkg_v" ]; then
            echo "::error::loop-runtime/pkg/go.mod does not declare loop-runtime-contracts — the gate has no version to exercise."
            exit 1
          fi
          # A divergence between modules is real drift: go.work hides which of the two
          # wins, and an external consumer of each module would see different versions.
          # Fail loudly rather than pick one in silence.
          if [ "$pkg_v" != "$api_v" ]; then
            echo "::error::pkg/go.mod asks for $pkg_v and api/go.mod asks for $api_v — align them before going on."
            exit 1
          fi
          echo "loop-runtime-contracts: $pkg_v"
          echo "ref=$pkg_v" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA-pin; issue #233)
        with:
          persist-credentials: false   # zizmor artipacked: no later step pushes
          repository: getloopscale/contracts
          ref: ${{ steps.contracts.outputs.ref }}
          path: loop-runtime-contracts
          ssh-key: ${{ secrets.GOMOD_SSH_KEY }}

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0 (SHA-pin; issue #233)
        with:
          go-version-file: loop-runtime/api/go.mod
          cache-dependency-path: |
            loop-runtime/api/go.sum
            loop-runtime/operators/go.sum

      - uses: ./loop-runtime/.github/actions/test-prerequisites

      # This repository is MULTI-MODULE and has no `go.mod` at the root: a `go build ./...`
      # there covers NOTHING. Each module is built explicitly. The list is `go.work`'s minus
      # `../loop-runtime-contracts`, which has CI of its own in its repository — this gate validates
      # the consumption, not the production.
      - name: Build every module
        run: |
          set -euo pipefail
          cd loop-runtime
          for m in pkg api operators operators/api cmd/loop-runtime-ops infra/scripts; do
            echo "::group::build $m"
            (cd "$m" && go build ./...)
            echo "::endgroup::"
          done

      - name: Vet every module
        run: |
          set -euo pipefail
          cd loop-runtime
          for m in pkg api operators operators/api cmd/loop-runtime-ops infra/scripts; do
            echo "::group::vet $m"
            (cd "$m" && go vet ./...)
            echo "::endgroup::"
          done

      # `operators` is left out: its suite is Ginkgo plus envtest and needs the
      # kube-apiserver binaries. Excluded EXPLICITLY rather than silently omitted —
      # whoever reads the gate sees what it does not cover.
      - name: Test the hermetic modules
        run: |
          set -euo pipefail
          cd loop-runtime
          for m in pkg api cmd/loop-runtime-ops; do
            echo "::group::test $m"
            (cd "$m" && go test ./... -count=1)
            echo "::endgroup::"
          done

      # The chart and unit tests of infra/tests render every chart with helm (on the runner
      # image) and the staging Helmfile with helmfile (installed here). No workflow ran them,
      # and 17 had broken without anyone seeing (#80).
      - name: helmfile (pinned, SHA-256 verified)
        env:
          HELMFILE_VERSION: 1.5.1
          HELMFILE_SHA256: 4c0c92f711aaf95b953065a0a76c6adfd4f7fb9f8c7065db5c94d32a0caf288f
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/helmfile"
          archive="helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz"
          mkdir -p "${dir}"
          curl -fsSL --retry 3 -o "${dir}/${archive}" \
            "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/${archive}"
          echo "${HELMFILE_SHA256}  ${dir}/${archive}" | sha256sum -c -
          tar -xzf "${dir}/${archive}" -C "${dir}" helmfile
          sudo install -m 0755 "${dir}/helmfile" /usr/local/bin/helmfile
          helmfile --version
          helm version --short

      # The dogfood package holds the staging journeys. Without the `live` tag only its
      # offline tests run: they check the probe app the journeys embed and the client
      # they drive, so a broken fixture fails here and not on the staging host.
      - name: Test the charts, the infra unit tests and the journeys' offline tests
        run: |
          set -euo pipefail
          cd loop-runtime/infra/tests
          go test ./charts/ ./unit/ ./livetest/dogfood/ -count=1

  # ---------------------------------------------------------------------------
  # Tenant isolation — the gate that did not exist.
  #
  # This repository already carried tests asserting tenant isolation. They were
  # green for five months without ever running: `build-and-test` executes
  # `go test ./...` with no `services:` block, so every integration test hit an
  # unreachable database and called t.Skip. A skipped test is indistinguishable
  # from a passing one in the run summary, and on 2026-08-14 the property they
  # claimed to protect turned out to be false — a connection scoped to one
  # tenant read another tenant's rows.
  #
  # This job exists so that cannot recur silently. It provisions a real
  # PostgreSQL, applies the whole migration chain, and runs the isolation
  # suite with LOOP_RUNTIME_RLS_AUDIT_REQUIRE=1 — which turns "cannot connect" from a
  # skip into a failure.
  #
  # SCOPE IS THE WHOLE SUITE, as of 2026-08-14. It used to run only the isolation
  # and hardening tests because 16 others were already failing against a real
  # database — fixtures that predated the cell_id trigger (000061), fixtures that
  # predated the `apps: [AppInput]` body and the mandatory Idempotency-Key, and
  # the find_data_004 FK regression. Every one of those is now fixed, so the
  # narrowing has no reason left: 62 tests, 62 green.
  #
  # The narrowing had a cost worth remembering. `-run '<list>'` silently excludes
  # any test whose name is not in it, so two isolation tests added later ran in
  # NO job with a database and were green by never executing — the same
  # "green without running" this job exists to prevent, reintroduced by the
  # mechanism protecting against it. Running everything removes the list, and
  # with it the possibility of forgetting to add a name to it.
  # ---------------------------------------------------------------------------
  tenant-isolation:
    # Skipped on a FORK's PR, and the reason is mechanical, not political: the steps below
    # use a deploy key to fetch the PRIVATE sibling `loop-runtime-contracts`, and
    # GitHub does not hand a secret to a workflow triggered by a fork's PR. Without this
    # condition the job RUNS and fails at the deploy-key step — a red that says nothing
    # about the contribution. `ci-gate` accepts the skip by name, for a fork only.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GOPRIVATE: github.com/getloopscale/*

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loop_runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA-pin; issue #233)
        with:
          persist-credentials: false   # zizmor artipacked: no later step pushes
          path: loop-runtime

      - name: Deploy key for the private module
        env:
          GOMOD_SSH_KEY: ${{ secrets.GOMOD_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GOMOD_SSH_KEY:-}" ]; then
            echo "::error::GOMOD_SSH_KEY is empty — api/go.mod requires github.com/getloopscale/contracts (private)."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printenv GOMOD_SSH_KEY > ~/.ssh/gomod_key
          chmod 600 ~/.ssh/gomod_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<'SSHCFG'
          Host github.com
            IdentityFile ~/.ssh/gomod_key
            IdentitiesOnly yes
            IdentityAgent none
          SSHCFG
          git config --global url."git@github.com:getloopscale/".insteadOf "https://github.com/getloopscale/"

      - name: Resolve the loop-runtime-contracts version go.mod requires
        id: contracts
        run: |
          set -euo pipefail
          api_v=$(awk '/getloopscale\/contracts/ {print $2}' loop-runtime/api/go.mod | head -1)
          if [ -z "$api_v" ]; then
            echo "::error::loop-runtime/api/go.mod does not declare loop-runtime-contracts."
            exit 1
          fi
          echo "ref=$api_v" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA-pin; issue #233)
        with:
          persist-credentials: false   # zizmor artipacked: no later step pushes
          repository: getloopscale/contracts
          ref: ${{ steps.contracts.outputs.ref }}
          path: loop-runtime-contracts
          ssh-key: ${{ secrets.GOMOD_SSH_KEY }}

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0 (SHA-pin; issue #233)
        with:
          go-version-file: loop-runtime/api/go.mod
          cache-dependency-path: loop-runtime/api/go.sum

      # The role split is the point. Applying the schema as `loop-runtime` makes that
      # role the table owner, exactly as in production, so the tests measure the
      # real posture instead of a convenient one.
      - name: Provision the database with production's separation of roles
        env:
          PGHOST: localhost
          PGPORT: "5432"
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

          echo "::group::roles"
          PGPASSWORD=postgres psql -U postgres -d loop_runtime_test -v ON_ERROR_STOP=1 \
            -f loop-runtime/api/internal/db/testdata/test-roles.sql
          # The owner owns its database, as in production: the chain creates the
          # pgcrypto extension (000037), which needs CREATE on the database.
          PGPASSWORD=postgres psql -U postgres -d loop_runtime_test -v ON_ERROR_STOP=1 \
            -c "ALTER DATABASE loop_runtime_test OWNER TO loop_runtime"
          echo "::endgroup::"

          # THE WHOLE MIGRATION CHAIN, with the tool and version production runs
          # (api/Dockerfile builds golang-migrate v4.19.1 with the same flags).
          #
          # This used to load schema.gen.sql and then five isolation migrations
          # named by hand. That database was not the one production has: the
          # dump carries no reference data (plan_limits is filled by 000002), and
          # 000067/000068 were never on the list. Tests passed only because two
          # of them re-ran every migration file as the owner at test time and
          # ignored the errors — which also loaded the plan limits the project-cap
          # tests depend on. The chain removes both the list and the dependency:
          # a new migration is applied here the day it lands (issue #387).
          echo "::group::migrations (as owner loop-runtime)"
          GOBIN="${RUNNER_TEMP}/migrate" GOWORK=off go install -tags postgres \
            github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
          "${RUNNER_TEMP}/migrate/migrate" -path loop-runtime/api/internal/db/migrations \
            -database "postgres://loop_runtime:loop_runtime@localhost:5432/loop_runtime_test?sslmode=disable" up
          echo "::endgroup::"

      # Asserted before the tests run: if the migration silently did less than
      # it claims, fail here with a number rather than let a downstream test
      # produce a confusing error.
      - name: Check the posture in the catalogue
        run: |
          set -euo pipefail
          read -r rls forced open <<< "$(PGPASSWORD=postgres psql -U postgres -h localhost -d loop_runtime_test -tAF' ' -c "
            SELECT
              (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                WHERE n.nspname='public' AND c.relkind='r' AND c.relrowsecurity),
              (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                WHERE n.nspname='public' AND c.relkind='r' AND c.relforcerowsecurity),
              (SELECT count(*) FROM pg_policy p
                WHERE pg_get_expr(p.polqual, p.polrelid) LIKE '%IS NULL%'
                   OR pg_get_expr(p.polqual, p.polrelid) LIKE '%''''::text%');")"
          echo "rls_enabled=$rls forced=$forced fail_open_policies=$open"
          if [ "$open" -ne 0 ]; then
            echo "::error::$open policy(ies) still accept an empty context — the fail-open disjunct is back."
            exit 1
          fi
          if [ "$rls" -lt 30 ] || [ "$forced" -lt 30 ]; then
            echo "::error::expected >=30 tables with RLS and FORCE, measured rls=$rls forced=$forced."
            exit 1
          fi

      - name: Integration against a real database (fails if the database vanishes, never skips)
        env:
          DATABASE_URL: postgres://loop_runtime:loop_runtime@localhost:5432/loop_runtime_test?sslmode=disable
          LOOP_RUNTIME_API_DATABASE_URL: postgres://loop_runtime_api:loop-runtime-api@localhost:5432/loop_runtime_test?sslmode=disable
          LOOP_RUNTIME_WORKER_DATABASE_URL: postgres://loop_runtime_worker:loop-runtime-worker@localhost:5432/loop_runtime_test?sslmode=disable
          LOOP_RUNTIME_RLS_AUDIT_SUPERUSER_URL: postgres://postgres:postgres@localhost:5432/loop_runtime_test?sslmode=disable
          LOOP_RUNTIME_RLS_AUDIT_REQUIRE: "1"
        run: |
          set -euo pipefail
          cd loop-runtime/api
          go test ./tests/integration/ -count=1 -v

  # ---------------------------------------------------------------------------
  # THE GATE AN OUTSIDE CONTRIBUTOR ACTUALLY MEETS.
  #
  # `build-and-test` and `tenant-isolation` above use a deploy key to fetch the PRIVATE
  # sibling `loop-runtime-contracts`. A PR from a FORK receives NO secret at all — that is how
  # GitHub works, not a configuration choice — so those two jobs cannot run for anyone
  # outside the organisation.
  #
  # This job uses no secret, by construction. Measured 2026-09-16: of the 8 modules in
  # go.work, only `api` and `pkg` need the private one. `cmd/loop-runtime-ops` (the quality
  # gates), `operators`, `operators/api`, `infra/scripts`, `infra/tests` and `tools/...`
  # build with `GOWORK=off` — verified by running `go build ./...` with the workspace
  # switched off, which is what simulates the private repo being absent.
  # ---------------------------------------------------------------------------
  public-checks:
    name: Public checks (no secrets — runs on a fork)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA-pin: supply-chain; issue #233)
        with:
          # `quality:diff` compares against a base; with no history there is no diff.
          fetch-depth: 0
          persist-credentials: false   # no step below pushes

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0 (SHA-pin; issue #233)
        with:
          go-version-file: cmd/loop-runtime-ops/go.mod
          cache-dependency-path: |
            cmd/loop-runtime-ops/go.sum
            operators/go.sum

      - uses: ./.github/actions/test-prerequisites

      # `GOWORK=off` is the entire point of this job: with the workspace active Go tries to
      # resolve `../loop-runtime-contracts` and fails without the deploy key. Switched off, each
      # independent module resolves through its own go.mod.
      - name: Build and vet the independent modules
        env:
          GOWORK: off
        run: |
          set -euo pipefail
          for m in cmd/loop-runtime-ops operators operators/api tools/gen-service-auth-ed25519; do
            echo "::group::$m"
            (cd "$m" && go build ./... && go vet ./...)
            echo "::endgroup::"
          done

      # LOOP_RUNTIME_NO_PRIVATE_MODULE_CREDENTIAL declares what this job is: it runs on forks and
      # receives no credential for the private loop-runtime-contracts module, so the modules that
      # require it (api, pkg) cannot be built here. module-selfcontained reports them NOT
      # VERIFIED instead of failing them; build-and-test, which holds the deploy key,
      # verifies them.
      - name: Test the independent modules
        env:
          GOWORK: off
          LOOP_RUNTIME_NO_PRIVATE_MODULE_CREDENTIAL: "1"
        run: |
          set -euo pipefail
          for m in cmd/loop-runtime-ops operators/api; do
            echo "::group::test $m"
            (cd "$m" && go test ./... -count=1)
            echo "::endgroup::"
          done

      # The quality gates. Until today they lived in a pre-push hook that runs "on the
      # pusher's machine, and only there" — which means that, for anyone outside, they did
      # not exist. Here they run scoped to the diff, which is what the PR proposes.
      - name: Quality gates (diff-scoped)
        # BOTH values go through `env:`. The `git fetch` below interpolated `github.base_ref`
        # straight into the shell, and a branch name is chosen by whoever opens the PR — in a
        # fork, by a stranger. zizmor flagged template-injection (High). The three gate lines
        # already used "$BASE_REF" correctly: the same step got it right three times and
        # wrong once, which is exactly the case the manual describes.
        env:
          GOWORK: off
          BASE_BRANCH: ${{ github.base_ref || 'develop' }}
          BASE_REF: origin/${{ github.base_ref || 'develop' }}
        run: |
          set -euo pipefail
          # The checkout above took full history (fetch-depth: 0), so the base branch
          # is already here. A second `git fetch` needs credentials this job
          # deliberately does not keep (persist-credentials: false), and on a private
          # repository it died with "could not read Username" before any gate ran.
          if ! git rev-parse --verify --quiet "${BASE_REF}^{commit}" >/dev/null; then
            echo "::error::base ${BASE_REF} (branch ${BASE_BRANCH}) is not in the checkout — the diff-scoped gates need it"
            exit 1
          fi
          (cd cmd/loop-runtime-ops && go build -o /tmp/loop-runtime-ops .)
          # `no-new-bash` is NOT here, and the absence is measured rather than forgotten.
          # Measured 2026-09-16: it exits 5 — "read allowlist
          # .claude/rules/shell-scripts-allowlist.md: no such file or directory". That
          # file lives under `.claude/`, which `.gitignore:311` excludes, so it exists in
          # no clone. The gate runs on the machine of whoever has the kit installed and
          # nowhere else; putting it here would be a guaranteed red on the first PR,
          # saying nothing about the contribution. Tracked in the backlog.
          /tmp/loop-runtime-ops quality dangling-script-refs --base-ref "$BASE_REF" --head-ref HEAD
          /tmp/loop-runtime-ops quality dangling-data-refs --base-ref "$BASE_REF" --head-ref HEAD

  # ---------------------------------------------------------------------------
  # ONE required check, not five. Two subtleties decide this block:
  #
  # 1. A required check that is SKIPPED reports as passing to branch protection. Hence
  #    `if: always()` and the explicit assertion of each result below.
  # 2. `build-and-test` and `tenant-isolation` are legitimately skipped on a fork PR
  #    (there is no secret for the private module). That is accepted BY NAME here, not by
  #    omission — the difference between "we decided this may skip" and "we forgot to
  #    look" is exactly this line.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI gate
    needs: [public-checks, build-and-test, tenant-isolation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the jobs to be green
        env:
          PUBLIC: ${{ needs.public-checks.result }}
          PRIVATE_BUILD: ${{ needs.build-and-test.result }}
          PRIVATE_TENANT: ${{ needs.tenant-isolation.result }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          fail=0

          # `public-checks` may never skip: it depends on no secret at all.
          [ "$PUBLIC" = success ] || { echo "::error::public-checks is $PUBLIC"; fail=1; }

          for name in PRIVATE_BUILD PRIVATE_TENANT; do
            result="${!name}"
            if [ "$result" = success ]; then
              continue
            fi
            if [ "$result" = skipped ] && [ "$IS_FORK" = true ]; then
              echo "::notice::$name skipped: a fork PR receives no secret for the private module"
              continue
            fi
            echo "::error::$name is $result"
            fail=1
          done

          exit "$fail"
