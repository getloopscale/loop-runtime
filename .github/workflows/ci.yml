# Gate rapido de compilacao + testes hermeticos dos modulos Go.
#
# O DEFEITO QUE ISTO PREVINE: ate aqui este repositorio NAO tinha gate algum no
# GitHub. As Actions foram removidas como pipeline em 2026-05-23 e substituidas
# por `task quality:gates` no hook de pre-push — que roda na maquina de quem
# empurra, e so' nela. Consequencias medidas nesta mesma semana:
#
#   - um push que morre em SIGPIPE (#256) nao distingue "gate reprovou" de
#     "conexao caiu", e quem estiver com o hook desinstalado nao roda nada;
#   - `LOOPZERO_SKIP_PREPUSH` existe e nada registra o seu uso;
#   - a maquina do operador tem Go 1.26, helmfile, kubeconform, trivy e
#     golangci-lint instalados. Um contribuidor novo nao tem, e descobre isso
#     depois do merge.
#
# ESCOPO — honestamente limitado, e a limitacao e' deliberada.
#
# Roda build + vet + os testes que NAO precisam de cluster. NAO roda
# `task quality:gates` (os 111 gates) nem a suite dos operators. Motivos
# concretos, nao falta de vontade:
#
#   quality:gates  exige helmfile, kubeconform, actionlint, trivy e
#                  golangci-lint no PATH, e FALHA ALTO se faltarem — por
#                  desenho, para nao passar em silencio. Provisionar isso e'
#                  trabalho proprio; ate' la' o conjunto continua no pre-push.
#   operators/     usa envtest (Ginkgo + binarios do kube-apiserver via
#                  setup-envtest). Baixa ~100MB e leva minutos; entra quando o
#                  gate tiver orcamento de tempo para isso.
#
# Um gate que cobre menos e diz o que nao cobre e' util. Um gate que promete
# cobertura total e roda metade e' pior que nenhum — foi o que motivou o #255.
name: CI

# TRIGGERS: post-merge push to `develop` and `main`, plus `workflow_call`.
#
# This header used to describe a `pull_request` trigger and call it one of "the
# TWO triggers, not one". The `on:` block below has not had a `pull_request` key
# since 464b9d7e3, "ci: validacao pos-merge em develop e main; PR sem acao" — the
# commit that made the decision this file records, which changed the trigger and
# left the paragraph describing the old one. So the header outlived what it
# described by every run since. Corrected 2026-09-06 rather than deleted, because
# the sentence it got right is still right — every commit entering the trunk
# should be verified, and here the trunk is `develop` — and the honest form of
# that sentence is that what runs on `develop` today runs AFTER the merge. The
# `on:` block says why, and names what now checks the premise it rests on.
on:
  workflow_call:
  # POST-MERGE validation, not on the PR. Decision of 2026-08-12, re-examined on
  # 2026-09-06 and KEPT — with its reason replaced by a measurement.
  #
  # WHAT THE REASON USED TO BE. It was asserted right here: that the gate
  # stopping a bad merge in this repository is local — `.claude/hooks/
  # delivery-gate.sh` runs the quality suite before every `git push` and blocks
  # on red, with no bypass — so duplicating it on the PR would pay runner minutes
  # to re-run what already ran on the pusher's machine. Three premises, and all
  # three were false at the same time between 2026-08-29 and 2026-09-02: the
  # hook file was deleted (9a6e6e903, third deletion), its wiring in
  # `.claude/settings.json` had been gone four days longer (63cc51c48, and the
  # restore four hours later put the FILE back and not the wiring), and "no
  # bypass" was false in four spellings, each one a real push that reached the
  # remote with the gate deciding nothing. 21 commits landed on `workspace` in
  # that window — an upper bound, since the repository records when a commit was
  # authored and not when it was pushed. Nothing, anywhere, said so.
  #
  # WHAT THE REASON IS NOW. The same trade, with the premises CHECKED instead of
  # asserted: `.github/workflows/delivery-gate-armed.yml` runs
  # `.github/scripts/assert-delivery-gate-armed.py` on every push to `workspace`,
  # `develop` and `main`, and on every pull request into `develop` and `main`. It
  # verifies the file, the wiring and the four bypass spellings, in seconds, on a
  # runner that needs neither Go nor a deploy key. It is a SEPARATE workflow
  # because `on:` filters are per-workflow and the `paths-ignore` below excludes
  # `.claude/**` — the only place the gate can be disarmed from. Two of the three
  # commits that falsified the premises touched nothing outside `.claude/**` and
  # would not have started this workflow at all.
  #
  # AND WHAT CHECKS THAT CHECK. An audit of the paragraph above measured the hole
  # it left, and the hole has the shape of the fix: A WORKFLOW CANNOT REPORT ITS
  # OWN DELETION. Delete `delivery-gate-armed.yml` and it does not go red — it
  # stops existing, and an absent check reads on a pull request exactly like a
  # repository that never had one. Same outcome, harder to see: leave it in place
  # and give it a `paths:` filter, and it survives every listing while never
  # firing for the `.claude/**`-only commit that is the shape of all three
  # historical disarms. So since 2026-09-06 a THIRD file reports on the second:
  # `.github/scripts/assert-gate-observers-intact.py` asserts that
  # `delivery-gate-armed.yml` is present, carries no paths filter, still triggers
  # on `workspace`/`develop`/`main` and on PRs into `develop`/`main`, and still
  # invokes its script. It runs from two substrates that fail independently —
  # `workflow-hygiene.yml` on GitHub, and `task quality:hermetic` on the pusher's
  # machine BEFORE the push, which is the only moment a deletion can be refused
  # at a cost of zero ungated pushes.
  #
  # WHY THIS JOB STAYS POST-MERGE — measured 2026-09-06, not assumed:
  #   - it costs 2-4 minutes and needs two checkouts, a deploy key for a private
  #     module and a Go toolchain; `task quality:gates` on top of that needs
  #     helmfile, kubeconform, actionlint, trivy and golangci-lint and fails high
  #     without them by design (see ESCOPO above);
  #   - it is RED, and has been. Runs 32084704925 through 32197072865 — the last
  #     fifteen — all failed, the failing step being `Test the hermetic modules`,
  #     and `go test ./... -count=1` in cmd/loopzero-ops is red in a clean worktree
  #     today on `trufflehogscan.TestArvoreRealEstaAdjudicada` (re-measured
  #     2026-09-06). Promoting a permanently-red job to a gate on the PR would
  #     block every promotion for a cause unrelated to the change under review,
  #     which is how gates get switched off.
  #
  # AND THE THING NONE OF THE ABOVE DOES — measured, not assumed, because the
  # sentence this paragraph replaces assumed it. NOTHING IN THIS REPOSITORY CAN
  # BLOCK A MERGE. Every check here, this one included, NOTIFIES; a red check
  # stops nothing until branch protection marks it required, and on 2026-09-06
  # that setting was not merely unset — it is unavailable:
  #
  #     gh api repos/getloopscale/loopzero/branches/develop/protection  -> 403
  #     gh api repos/getloopscale/loopzero/branches/main/protection     -> 403
  #     gh api repos/getloopscale/loopzero/rulesets                     -> 403
  #     "Upgrade to GitHub Pro or make this repository public to enable this
  #      feature."
  #
  # The org `getloopscale` is on the `free` plan and `loopzero` is PRIVATE, and that
  # combination is what the API is refusing. So "make the armed-check a required
  # check" is not a checkbox anyone forgot to tick — it is a purchase (org Team
  # plan) or a visibility change (make the repo public), and until one of those
  # happens the honest description of every gate in this file is that it tells
  # someone, and that someone has to act. Written here rather than left implied,
  # because the previous version of this comment reasoned about required checks
  # as though this repository had them.
  #
  # THE CONSEQUENCE, STILL SAID OUT LOUD: with this job not acting on the PR, its
  # first signal arrives AFTER the merge, and fixing a red `develop` is a
  # follow-up commit or a revert rather than a "do not merge". What changed is
  # that the premise this trade rests on is now verified before the merge instead
  # of believed. What did NOT change: build, vet and test coverage before a merge
  # still does not exist here, and what blocks it is the red above, not this
  # decision. (B-192)
  push:
    branches: [develop, main]
    # `.claude/**` is ignored here and NOT in delivery-gate-armed.yml, which is
    # the whole reason that file is separate: a commit touching only
    # `.claude/settings.json` cannot start this workflow, and that is precisely
    # the commit that disarms the gate.
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      - 'docs/**'

  # O GATILHO QUE FALTAVA, e a razao pela qual ele faltava importa mais que a linha.
  #
  # `464b9d7e3` (2026-08-12) removeu o `pull_request` e moveu os gates para um hook
  # de pre-push. Enquanto o repositorio era privado com um autor, a diferenca era
  # teorica: quem empurra tem o hook. Aberto, deixa de ser — o PR de um estranho
  # chegaria a `develop` sem que a suite tivesse rodado uma vez, porque o `push:`
  # acima so' dispara DEPOIS do merge.
  #
  # Medido 2026-09-16: dos 8 modulos do go.work, apenas `api` e `pkg` exigem o
  # sibling PRIVADO `loopzero-contracts`. Os outros seis — incluindo `cmd/loopzero-ops`,
  # que carrega os 126 gates — compilam com `GOWORK=off` e nao precisam de segredo
  # nenhum. E' isso que torna um gate real para fork possivel: ver `public-checks`.
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      - 'docs/**'

  # Sem isto, um repositorio com merge queue espera para sempre por um check que
  # nunca reporta na branch temporaria da fila, e nao ha falha em lugar nenhum
  # para ler. Custa uma linha e so' e' notado quando falta.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Pula num PR de FORK, e a razao e' mecanica, nao politica: os passos abaixo
    # usam um deploy key para buscar o sibling PRIVADO `loopzero-contracts`, e o
    # GitHub nao entrega segredo a workflow disparado por PR de fork. Sem esta
    # condicao o job RODA e falha no passo do deploy key — um vermelho que nao diz
    # nada sobre a contribuicao. `ci-gate` aceita o skip por nome, so' para fork.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # RUNNER: frota Blacksmith, habilitada em 2026-07-30 com a transferencia
    # deste repositorio para a org `getloopscale`.
    #
    # A label e' LITERAL de proposito. O runbook do umbrella mediu que
    # `vars.CI_RUNNER` NAO resolve no repo (`LABELS=[self-hosted,linux,x64]`,
    # mesmo com `visibility=all`) e o fallback `||` devolve a frota antiga EM
    # SILENCIO — o CI fica verde na frota errada. Verificar `runner_name`, nunca
    # `conclusion`.
    #
    # Duas pre-condicoes encadeadas, ambas satisfeitas antes desta linha existir:
    #   1. o repo pertence a uma ORGANIZACAO (`owner.type=Organization`)
    #   2. o GitHub App `blacksmith-sh` esta instalado NA ORG que dona o repo
    # A segunda so' fica visivel depois de resolver a primeira, e foi o que
    # custou tres tentativas na migracao do loopzero-memory.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GOPRIVATE: github.com/getloopscale/*,github.com/getloopscale/*

    steps:
      # DOIS checkouts, e o segundo nao e' opcional.
      #
      # Tentei primeiro `GOWORK=off` com um checkout so' — e' o que api/Dockerfile
      # faz. NAO funciona para o repositorio inteiro, e a medicao foi esta:
      #
      #   cmd/loopzero-ops  `go.mod` nao declara `jackc/pgx/v5` de forma alguma;
      #                 a dependencia so' resolve pelo workspace.
      #   api           `go.sum` tem o hash do modulo pgx mas NAO a linha
      #                 `/go.mod` dele — a forma exata que o go.work supre.
      #   infra/scripts mesma lacuna.
      #
      # O Dockerfile escapa disso porque compila SO' `api/./cmd/`, um
      # subconjunto cujas dependencias estao completas. Um gate que compila tudo
      # nao tem essa sorte.
      #
      # A alternativa seria `go mod tidy` nos 6 modulos. Rejeitada aqui: mexer na
      # resolucao de dependencia de todo o repo para acomodar um gate novo e'
      # deixar o gate ditar a arquitetura — e arrisca quebrar builds de imagem
      # que hoje funcionam. Preservar o workspace faz o CI exercitar a MESMA
      # resolucao que o desenvolvedor exercita localmente, que e' a propriedade
      # que se quer de um gate.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA-pin: supply-chain; issue #233)
        with:
          persist-credentials: false   # zizmor artipacked: nenhum passo seguinte empurra
          path: loopzero

      # `loopzero-contracts` e' PRIVADO e foi transferido para `getloopscale` junto com
      # este repo. O acesso vem de uma DEPLOY KEY read-only registrada nele
      # (id 158891596), com a chave privada em GOMOD_SSH_KEY.
      #
      # ATUALIZADO 2026-08-07: o import path NAO continua mais em `getloopscale`.
      # O commit f813b367 (2026-08-06) reescreveu api/go.mod e pkg/go.mod para
      # `github.com/getloopscale/loopzero-contracts v0.4.0`, revertendo a premissa acima —
      # mas este workflow ficou em `getloopscale` e passou a nao encontrar a versao,
      # falhando com "pkg/go.mod nao declara loopzero-contracts". O ultimo run verde foi
      # 2026-07-31; toda a esteira ficou bloqueada desde a migracao.
      #
      # Por que deploy key e nao PAT: a necessidade e' `Contents: read` em UM
      # repositorio. Um PAT de conta alcanca tudo que a conta alcanca; a deploy
      # key alcanca exatamente este repo, so' leitura, e e' revogavel sozinha sem
      # afetar mais nada. O `GOMOD_TOKEN` anterior morreu (`Bad credentials`,
      # medido no run 30621505439) e derrubou 10 builds sem nomear a causa.
      - name: Deploy key para o modulo privado
        env:
          GOMOD_SSH_KEY: ${{ secrets.GOMOD_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GOMOD_SSH_KEY:-}" ]; then
            echo "::error::GOMOD_SSH_KEY vazio — api/go.mod requer github.com/getloopscale/loopzero-contracts (privado). Registre a chave privada da deploy key read-only."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printenv GOMOD_SSH_KEY > ~/.ssh/gomod_key
          chmod 600 ~/.ssh/gomod_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # IdentitiesOnly + IdentityAgent=none: sem isso o agente do runner pode
          # oferecer outra chave primeiro e o GitHub responde `Repository not
          # found` — a mesma mensagem de repo inexistente. Custou uma rodada de
          # diagnostico local ate' o `-v` mostrar a chave errada sendo oferecida.
          cat >> ~/.ssh/config <<'SSHCFG'
          Host github.com
            IdentityFile ~/.ssh/gomod_key
            IdentitiesOnly yes
            IdentityAgent none
          SSHCFG
          # go/git buscam o modulo por HTTPS; reescrever para SSH e' o que faz a
          # deploy key ser usada.
          git config --global url."git@github.com:getloopscale/".insteadOf "https://github.com/getloopscale/"
          git config --global url."git@github.com:getloopscale/".insteadOf "https://github.com/getloopscale/"
          git ls-remote git@github.com:getloopscale/loopzero-contracts.git >/dev/null
          echo "deploy key OK — loopzero-contracts acessivel."

      # QUAL versao de loopzero-contracts fazer checkout — derivada do `go.mod`, nunca
      # fixada aqui.
      #
      # O DEFEITO QUE ISTO CORRIGE (medido no run 30627506396): o checkout sem
      # `ref:` traz o branch DEFAULT do repositorio, que e' `main` — 12 commits
      # atras de `develop` e sem `plan.MetricCPUCoreSeconds`. O build morria em
      # `undefined: plan.MetricCPUCoreSeconds`, e a mensagem sugeria codigo
      # quebrado quando o quebrado era a VERSAO que o gate escolhia sozinho.
      #
      # A tag `v0.3.0` que os go.mod exigem TEM os simbolos — a dependencia
      # declarada estava correta o tempo todo. Fixar a versao no workflow
      # resolveria hoje e mentiria no proximo bump; derivar do go.mod faz o gate
      # exercitar exatamente a versao que o repositorio declara.
      - name: Resolver a versao de loopzero-contracts exigida pelo go.mod
        id: contracts
        run: |
          set -euo pipefail
          pkg_v=$(awk '/getloopscale\/loopzero-contracts/ {print $2}' loopzero/pkg/go.mod | head -1)
          api_v=$(awk '/getloopscale\/loopzero-contracts/ {print $2}' loopzero/api/go.mod | head -1)
          if [ -z "$pkg_v" ]; then
            echo "::error::loopzero/pkg/go.mod nao declara loopzero-contracts — o gate nao tem versao para exercitar."
            exit 1
          fi
          # Divergencia entre modulos e' drift real: o go.work esconde qual das
          # duas vence, e o consumidor externo de cada modulo veria versoes
          # diferentes. Falha alto em vez de escolher uma em silencio.
          if [ "$pkg_v" != "$api_v" ]; then
            echo "::error::pkg/go.mod pede $pkg_v e api/go.mod pede $api_v — alinhe os dois antes de seguir."
            exit 1
          fi
          echo "loopzero-contracts: $pkg_v"
          echo "ref=$pkg_v" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA-pin; issue #233)
        with:
          persist-credentials: false   # zizmor artipacked: nenhum passo seguinte empurra
          repository: getloopscale/loopzero-contracts
          ref: ${{ steps.contracts.outputs.ref }}
          path: loopzero-contracts
          ssh-key: ${{ secrets.GOMOD_SSH_KEY }}

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0 (SHA-pin; issue #233)
        with:
          go-version-file: loopzero/api/go.mod
          cache-dependency-path: |
            loopzero/api/go.sum
            loopzero/operators/go.sum

      # Este repositorio e' MULTI-MODULO e nao tem `go.mod` na raiz: um
      # `go build ./...` na raiz nao cobre NADA. Cada modulo e' compilado
      # explicitamente. A lista e' a do `go.work` menos `../loopzero-contracts`, que
      # tem CI proprio no repositorio dele — este gate valida o consumo, nao a
      # producao.
      - name: Build every module
        run: |
          set -euo pipefail
          cd loopzero
          for m in pkg api operators operators/api cmd/loopzero-ops infra/scripts; do
            echo "::group::build $m"
            (cd "$m" && go build ./...)
            echo "::endgroup::"
          done

      - name: Vet every module
        run: |
          set -euo pipefail
          cd loopzero
          for m in pkg api operators operators/api cmd/loopzero-ops infra/scripts; do
            echo "::group::vet $m"
            (cd "$m" && go vet ./...)
            echo "::endgroup::"
          done

      # `operators` fica de fora: a suite dele e' Ginkgo + envtest e precisa dos
      # binarios do kube-apiserver. Excluido EXPLICITAMENTE em vez de
      # silenciosamente omitido — quem le' o gate ve' o que ele nao cobre.
      - name: Test the hermetic modules
        run: |
          set -euo pipefail
          cd loopzero
          for m in pkg api cmd/loopzero-ops; do
            echo "::group::test $m"
            (cd "$m" && go test ./... -count=1)
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # Tenant isolation — the gate that did not exist.
  #
  # This repository already carried tests asserting tenant isolation. They were
  # green for five months without ever running: `build-and-test` executes
  # `go test ./...` with no `services:` block, so every integration test hit an
  # unreachable database and called t.Skip. A skipped test is indistinguishable
  # from a passing one in the run summary, and on 2026-08-14 the property they
  # claimed to protect turned out to be false — a connection scoped to one
  # tenant read another tenant's rows.
  #
  # This job exists so that cannot recur silently. It provisions a real
  # PostgreSQL, applies the schema and migration 000062, and runs the isolation
  # suite with LOOPZERO_RLS_AUDIT_REQUIRE=1 — which turns "cannot connect" from a
  # skip into a failure.
  #
  # SCOPE IS THE WHOLE SUITE, as of 2026-08-14. It used to run only the isolation
  # and hardening tests because 16 others were already failing against a real
  # database — fixtures that predated the cell_id trigger (000061), fixtures that
  # predated the `apps: [AppInput]` body and the mandatory Idempotency-Key, and
  # the find_data_004 FK regression. Every one of those is now fixed, so the
  # narrowing has no reason left: 62 tests, 62 green.
  #
  # The narrowing had a cost worth remembering. `-run '<list>'` silently excludes
  # any test whose name is not in it, so two isolation tests added later ran in
  # NO job with a database and were green by never executing — the same
  # "green without running" this job exists to prevent, reintroduced by the
  # mechanism protecting against it. Running everything removes the list, and
  # with it the possibility of forgetting to add a name to it.
  # ---------------------------------------------------------------------------
  tenant-isolation:
    # Pula num PR de FORK, e a razao e' mecanica, nao politica: os passos abaixo
    # usam um deploy key para buscar o sibling PRIVADO `loopzero-contracts`, e o
    # GitHub nao entrega segredo a workflow disparado por PR de fork. Sem esta
    # condicao o job RODA e falha no passo do deploy key — um vermelho que nao diz
    # nada sobre a contribuicao. `ci-gate` aceita o skip por nome, so' para fork.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GOPRIVATE: github.com/getloopscale/*,github.com/getloopscale/*

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loopzero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA-pin; issue #233)
        with:
          persist-credentials: false   # zizmor artipacked: nenhum passo seguinte empurra
          path: loopzero

      - name: Deploy key para o modulo privado
        env:
          GOMOD_SSH_KEY: ${{ secrets.GOMOD_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GOMOD_SSH_KEY:-}" ]; then
            echo "::error::GOMOD_SSH_KEY vazio — api/go.mod requer github.com/getloopscale/loopzero-contracts (privado)."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printenv GOMOD_SSH_KEY > ~/.ssh/gomod_key
          chmod 600 ~/.ssh/gomod_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<'SSHCFG'
          Host github.com
            IdentityFile ~/.ssh/gomod_key
            IdentitiesOnly yes
            IdentityAgent none
          SSHCFG
          git config --global url."git@github.com:getloopscale/".insteadOf "https://github.com/getloopscale/"
          git config --global url."git@github.com:getloopscale/".insteadOf "https://github.com/getloopscale/"

      - name: Resolver a versao de loopzero-contracts exigida pelo go.mod
        id: contracts
        run: |
          set -euo pipefail
          api_v=$(awk '/getloopscale\/loopzero-contracts/ {print $2}' loopzero/api/go.mod | head -1)
          if [ -z "$api_v" ]; then
            echo "::error::loopzero/api/go.mod nao declara loopzero-contracts."
            exit 1
          fi
          echo "ref=$api_v" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA-pin; issue #233)
        with:
          persist-credentials: false   # zizmor artipacked: nenhum passo seguinte empurra
          repository: getloopscale/loopzero-contracts
          ref: ${{ steps.contracts.outputs.ref }}
          path: loopzero-contracts
          ssh-key: ${{ secrets.GOMOD_SSH_KEY }}

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0 (SHA-pin; issue #233)
        with:
          go-version-file: loopzero/api/go.mod
          cache-dependency-path: loopzero/api/go.sum

      # The role split is the point. Applying the schema as `loopzero` makes that
      # role the table owner, exactly as in production, so the tests measure the
      # real posture instead of a convenient one.
      - name: Provisionar o banco com a separacao de papeis de producao
        env:
          PGHOST: localhost
          PGPORT: "5432"
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

          echo "::group::papeis"
          PGPASSWORD=postgres psql -U postgres -d loopzero_test -v ON_ERROR_STOP=1 \
            -f loopzero/api/internal/db/testdata/test-roles.sql
          echo "::endgroup::"

          # The dump replays a few metering helpers out of dependency order.
          # Those errors are tolerated here and the outcome is asserted below —
          # a count is a stronger check than a clean-looking log.
          echo "::group::schema (como owner loopzero)"
          PGPASSWORD=loopzero psql -U loopzero -d loopzero_test \
            -f loopzero/api/internal/db/schema.gen.sql 2>&1 | tail -5
          echo "::endgroup::"

          echo "::group::migrations de isolamento"
          # Applied by name rather than by a glob over the whole directory: the
          # rest of the migration chain is not replayable against a schema dump
          # (the dump already carries its result), and a glob would silently
          # start including the next migration somebody adds.
          #
          # The flip side is that adding a migration and forgetting this line is
          # invisible — the job stays green measuring the schema WITHOUT it. The
          # step below counts what the migrations must have produced, which is
          # what catches the omission for 62/63/64; 065 and 066 are pinned by
          # their own integration tests (FK ON DELETE, idempotency per tenant).
          for m in 000062_rls_fail_closed 000063_cloud_named_role 000064_drop_owner_maintenance \
                   000065_explicit_fk_on_delete 000066_idempotency_key_per_tenant; do
            echo "-- $m"
            PGPASSWORD=loopzero psql -U loopzero -d loopzero_test -v ON_ERROR_STOP=1 \
              -f "loopzero/api/internal/db/migrations/$m.up.sql"
          done
          echo "::endgroup::"

      # Asserted before the tests run: if the migration silently did less than
      # it claims, fail here with a number rather than let a downstream test
      # produce a confusing error.
      - name: Verificar a postura no catalogo
        run: |
          set -euo pipefail
          read -r rls forced open <<< "$(PGPASSWORD=postgres psql -U postgres -h localhost -d loopzero_test -tAF' ' -c "
            SELECT
              (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                WHERE n.nspname='public' AND c.relkind='r' AND c.relrowsecurity),
              (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                WHERE n.nspname='public' AND c.relkind='r' AND c.relforcerowsecurity),
              (SELECT count(*) FROM pg_policy p
                WHERE pg_get_expr(p.polqual, p.polrelid) LIKE '%IS NULL%'
                   OR pg_get_expr(p.polqual, p.polrelid) LIKE '%''''::text%');")"
          echo "rls_enabled=$rls forced=$forced fail_open_policies=$open"
          if [ "$open" -ne 0 ]; then
            echo "::error::$open policy(ies) ainda aceitam contexto vazio — o disjunto fail-open voltou."
            exit 1
          fi
          if [ "$rls" -lt 30 ] || [ "$forced" -lt 30 ]; then
            echo "::error::esperado >=30 tabelas com RLS e FORCE, medido rls=$rls forced=$forced."
            exit 1
          fi

      - name: Integração contra banco real (falha se o banco sumir, nunca pula)
        env:
          DATABASE_URL: postgres://loopzero:loopzero@localhost:5432/loopzero_test?sslmode=disable
          LOOPZERO_API_DATABASE_URL: postgres://loopzero_api:loopzero-api@localhost:5432/loopzero_test?sslmode=disable
          LOOPZERO_WORKER_DATABASE_URL: postgres://loopzero_worker:loopzero-worker@localhost:5432/loopzero_test?sslmode=disable
          LOOPZERO_RLS_AUDIT_SUPERUSER_URL: postgres://postgres:postgres@localhost:5432/loopzero_test?sslmode=disable
          LOOPZERO_RLS_AUDIT_REQUIRE: "1"
        run: |
          set -euo pipefail
          cd loopzero/api
          go test ./tests/integration/ -count=1 -v

  # ---------------------------------------------------------------------------
  # O GATE QUE UM CONTRIBUIDOR EXTERNO REALMENTE ENCONTRA.
  #
  # `build-and-test` e `tenant-isolation` acima usam um deploy key para buscar o
  # sibling PRIVADO `loopzero-contracts`. Um PR vindo de FORK nao recebe segredo
  # nenhum — e' como o GitHub funciona, nao configuracao — entao aqueles dois jobs
  # nao podem rodar para quem nao e' da organizacao.
  #
  # Este job nao usa segredo, por construcao. Medido 2026-09-16: dos 8 modulos do
  # go.work, so' `api` e `pkg` exigem o privado. `cmd/loopzero-ops` (os 126 gates de
  # qualidade), `operators`, `operators/api`, `infra/scripts`, `infra/tests` e
  # `tools/...` compilam com `GOWORK=off` — verificado rodando `go build ./...`
  # com o workspace desligado, que e' o que simula a ausencia do repo privado.
  # ---------------------------------------------------------------------------
  public-checks:
    name: Public checks (sem segredos — roda em fork)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA-pin: supply-chain; issue #233)
        with:
          # `quality:diff` compara contra uma base; sem historico nao ha diff.
          fetch-depth: 0
          persist-credentials: false   # nenhum passo abaixo empurra

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0 (SHA-pin; issue #233)
        with:
          go-version-file: cmd/loopzero-ops/go.mod
          cache-dependency-path: |
            cmd/loopzero-ops/go.sum
            operators/go.sum

      # GOWORK=off e' o ponto inteiro deste job: com o workspace ativo o Go tenta
      # resolver `../loopzero-contracts` e falha sem o deploy key. Desligado, cada
      # modulo independente se resolve pelo proprio go.mod.
      - name: Build e vet dos modulos independentes
        env:
          GOWORK: off
        run: |
          set -euo pipefail
          for m in cmd/loopzero-ops operators operators/api tools/gen-service-auth-ed25519; do
            echo "::group::$m"
            (cd "$m" && go build ./... && go vet ./...)
            echo "::endgroup::"
          done

      - name: Testes dos modulos independentes
        env:
          GOWORK: off
        run: |
          set -euo pipefail
          for m in cmd/loopzero-ops operators/api; do
            echo "::group::test $m"
            (cd "$m" && go test ./... -count=1)
            echo "::endgroup::"
          done

      # Os 126 gates. Ate' hoje viviam num hook de pre-push que roda "na maquina de
      # quem empurra, e so' la'" — o que significa que, para qualquer pessoa de fora,
      # eles nao existiam. Aqui rodam no escopo do diff, que e' o que o PR propoe.
      - name: Quality gates (escopo do diff)
        # Os DOIS valores passam por `env:`. O `git fetch` abaixo interpolava
        # `github.base_ref` direto no shell, e nome de branch e' escolhido por quem
        # abre o PR — num fork, por um estranho. zizmor marcou template-injection
        # (High). As tres linhas de gate ja' usavam "$BASE_REF" corretamente: o mesmo
        # passo acertava tres vezes e errava uma, que e' o caso exato do manual.
        env:
          GOWORK: off
          BASE_BRANCH: ${{ github.base_ref || 'develop' }}
          BASE_REF: origin/${{ github.base_ref || 'develop' }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_BRANCH"
          (cd cmd/loopzero-ops && go build -o /tmp/loopzero-ops .)
          # `no-new-bash` NAO esta aqui, e a ausencia e' medida, nao esquecimento.
          # Medido 2026-09-16: sai com exit 5 — "read allowlist
          # .claude/rules/shell-scripts-allowlist.md: no such file or directory".
          # Esse arquivo vive sob `.claude/`, que o `.gitignore:311` exclui, entao ele
          # nao existe em clone nenhum. O gate roda na maquina de quem tem o kit
          # instalado e em lugar nenhum mais; po-lo aqui seria um vermelho garantido
          # no primeiro PR, dizendo nada sobre a contribuicao. Rastreado no backlog.
          /tmp/loopzero-ops quality dangling-script-refs --base-ref "$BASE_REF" --head-ref HEAD
          /tmp/loopzero-ops quality dangling-data-refs --base-ref "$BASE_REF" --head-ref HEAD

  # ---------------------------------------------------------------------------
  # UM check exigido, nao cinco. Duas sutilezas decidem este bloco:
  #
  # 1. Um check exigido que e' PULADO reporta como aprovado na protecao de branch.
  #    Por isso `if: always()` e a asercao explicita de cada resultado abaixo.
  # 2. `build-and-test` e `tenant-isolation` sao legitimamente pulados num PR de
  #    fork (nao ha segredo para o modulo privado). Isso e' aceito POR NOME aqui,
  #    nao por omissao — a diferenca entre "decidimos que pode pular" e "esquecemos
  #    de olhar" e' exatamente esta linha.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI gate
    needs: [public-checks, build-and-test, tenant-isolation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exigir os jobs verdes
        env:
          PUBLIC: ${{ needs.public-checks.result }}
          PRIVATE_BUILD: ${{ needs.build-and-test.result }}
          PRIVATE_TENANT: ${{ needs.tenant-isolation.result }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          fail=0

          # `public-checks` nunca pode pular: nao depende de segredo nenhum.
          [ "$PUBLIC" = success ] || { echo "::error::public-checks is $PUBLIC"; fail=1; }

          for name in PRIVATE_BUILD PRIVATE_TENANT; do
            result="${!name}"
            if [ "$result" = success ]; then
              continue
            fi
            if [ "$result" = skipped ] && [ "$IS_FORK" = true ]; then
              echo "::notice::$name pulado: PR de fork nao recebe o segredo do modulo privado"
              continue
            fi
            echo "::error::$name is $result"
            fail=1
          done

          exit "$fail"
