name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'
  KUBECONFORM_VERSION: 'v0.6.7'
  ENVTEST_K8S_VERSION: '1.31.0'

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # LINT
  # ─────────────────────────────────────────────

  lint-go:
    name: Lint Go (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        component: [pkg, operators, api]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.component }}/go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v7.0.0
        with:
          version: v2.11.3
          working-directory: ${{ matrix.component }}

  lint-cli:
    name: Lint CLI (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642195b5e65ec0cc5acb848 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install dependencies
        working-directory: cli
        run: npm ci
      - name: Run ESLint
        working-directory: cli
        run: npm run lint
      - name: Type check
        working-directory: cli
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────
  # TIDINESS — go.mod/go.sum consistency
  # ─────────────────────────────────────────────

  tidy-go:
    name: Go mod tidy (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        component: [pkg, api, operators, infra/tests, infra/scripts]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify go.mod and go.sum are tidy
        working-directory: ${{ matrix.component }}
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "::error::go.mod or go.sum is not tidy in ${{ matrix.component }}. Run 'go mod tidy' and commit."
            git diff -- go.mod go.sum
            exit 1
          fi

  # ─────────────────────────────────────────────
  # TESTS
  # ─────────────────────────────────────────────

  test-pkg:
    name: Test pkg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: pkg/go.sum
      - name: Run pkg tests
        working-directory: pkg
        run: go test ./... -short -v -race -count=1

  test-go:
    name: Test Go (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-pkg]
    strategy:
      fail-fast: false
      matrix:
        component: [operators, api]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.component }}/go.sum
      - name: Install envtest binaries
        if: matrix.component == 'operators'
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use ${{ env.ENVTEST_K8S_VERSION }} -p path)" >> $GITHUB_ENV
      - name: Run Go tests
        working-directory: ${{ matrix.component }}
        run: go test ./... -short -v -race -count=1

  test-infra:
    name: Test infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: infra/tests/go.sum
      - name: Run infra unit tests
        working-directory: infra/tests
        run: go test ./unit/... -short -v -race -count=1

  test-cli:
    name: Test CLI (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642195b5e65ec0cc5acb848 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install dependencies
        working-directory: cli
        run: npm ci
      - name: Build CLI
        working-directory: cli
        run: npm run build
      - name: Run Jest tests
        working-directory: cli
        run: npm test -- --ci --coverage
      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-coverage
          path: cli/coverage/
          retention-days: 7

  test-pulumi:
    name: Test Pulumi (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642195b5e65ec0cc5acb848 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/pulumi/package-lock.json
      - name: Install dependencies
        working-directory: infra/pulumi
        run: npm ci
      - name: Type check
        working-directory: infra/pulumi
        run: npx tsc --noEmit
      - name: Run tests
        working-directory: infra/pulumi
        run: npm test

  # ─────────────────────────────────────────────
  # VALIDATE MANIFESTS
  # ─────────────────────────────────────────────

  validate-manifests:
    name: Validate K8s manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/${{ env.KUBECONFORM_VERSION }}/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate operator manifests
        run: kubeconform --strict --skip CustomResourceDefinition operators/config/
      - name: Validate Tilt deployment manifests
        run: kubeconform --strict infra/tilt/api-deployment.yaml infra/tilt/operator-deployment.yaml
      - name: Validate ArgoCD templates
        run: kubeconform --strict --skip AppProject,Application infra/helm/argocd/templates/
      - name: Validate PodDisruptionBudgets
        run: |
          kubeconform --strict infra/helm/postgresql/templates/pdb.yaml
          kubeconform --strict infra/helm/gitea/templates/pdb.yaml
          kubeconform --strict infra/helm/argocd/templates/pdb.yaml
      - name: Validate NetworkPolicies
        run: kubeconform --strict infra/helm/network-policies/loopzero-system.yaml
      - name: Validate monitoring manifests
        run: kubeconform --strict --skip ServiceMonitor,PrometheusRule infra/helm/monitoring/manifests/

  # ─────────────────────────────────────────────
  # SECURITY — Vulnerability Scanning
  # ─────────────────────────────────────────────

  security-go:
    name: Security scan Go (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        component: [api, operators, pkg]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.component }}/go.sum
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd ${{ matrix.component }}
          govulncheck ./...

  security-cli:
    name: Security scan CLI (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642195b5e65ec0cc5acb848 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install dependencies
        working-directory: cli
        run: npm ci
      - name: Audit production dependencies
        working-directory: cli
        run: npm audit --omit=dev --audit-level=high

  security-trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366cf37 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: infra/tests/e2e/fixtures,examples,loopzero-packs,loopzero-forge
      - name: Run Trivy IaC scanner
        uses: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366cf37 # 0.35.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

  security-dockerfiles:
    name: Trivy Dockerfile scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        component: [api, operators]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan Dockerfile for misconfigurations
        uses: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366cf37 # 0.35.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.component }}
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

  # ─────────────────────────────────────────────
  # SECRETS — Detect leaked credentials
  # ─────────────────────────────────────────────

  secrets-scan:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@2e5a050867b8ee09fce8e2e4df4c8c4e73fa3bda # v3.88.27
        with:
          extra_args: --only-verified --results=verified,unknown

  # ─────────────────────────────────────────────
  # BUILD — Verify artifacts compile
  # ─────────────────────────────────────────────

  build-go:
    name: Build Go (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-go, lint-go]
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            binary: loopzero-api
          - component: operators
            binary: tenant-controller
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.component }}/go.sum
      - name: Build binary
        working-directory: ${{ matrix.component }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ${{ matrix.binary }} ./cmd/
      - name: Verify binary
        working-directory: ${{ matrix.component }}
        run: test -f ${{ matrix.binary }}

  build-cli:
    name: Build CLI (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-cli, lint-cli]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642195b5e65ec0cc5acb848 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install dependencies
        working-directory: cli
        run: npm ci
      - name: Build
        working-directory: cli
        run: npm run build

  # ─────────────────────────────────────────────
  # GATE — All checks must pass
  # ─────────────────────────────────────────────

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    needs:
      - lint-go
      - lint-cli
      - tidy-go
      - test-pkg
      - test-go
      - test-infra
      - test-cli
      - test-pulumi
      - validate-manifests
      - security-go
      - security-cli
      - security-trivy
      - security-dockerfiles
      - secrets-scan
      - build-go
      - build-cli
    steps:
      - name: Check all jobs passed
        run: |
          echo "Job results:"
          echo "  lint-go:              ${{ needs.lint-go.result }}"
          echo "  lint-cli:             ${{ needs.lint-cli.result }}"
          echo "  tidy-go:              ${{ needs.tidy-go.result }}"
          echo "  test-pkg:             ${{ needs.test-pkg.result }}"
          echo "  test-go:              ${{ needs.test-go.result }}"
          echo "  test-infra:           ${{ needs.test-infra.result }}"
          echo "  test-cli:             ${{ needs.test-cli.result }}"
          echo "  test-pulumi:          ${{ needs.test-pulumi.result }}"
          echo "  validate-manifests:   ${{ needs.validate-manifests.result }}"
          echo "  security-go:          ${{ needs.security-go.result }}"
          echo "  security-cli:         ${{ needs.security-cli.result }}"
          echo "  security-trivy:       ${{ needs.security-trivy.result }}"
          echo "  security-dockerfiles: ${{ needs.security-dockerfiles.result }}"
          echo "  secrets-scan:         ${{ needs.secrets-scan.result }}"
          echo "  build-go:             ${{ needs.build-go.result }}"
          echo "  build-cli:            ${{ needs.build-cli.result }}"

          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI jobs failed or were cancelled"
            exit 1
          fi

          echo "All CI checks passed"
