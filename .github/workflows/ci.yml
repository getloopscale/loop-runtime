# CI — Fast quality gate for every push and PR.
# Only deterministic, fast checks. No databases, no clusters, no deploys.
# Integration tests live in integration-tests.yml (separate workflow).
name: CI

on:
  push:
    branches: [main, develop, homolog]
  pull_request:
    # Only run on PRs from external branches — NOT when head is develop/main/homolog
    # (those already trigger via push). Prevents duplicate runs.
    branches: [main, develop, homolog]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  GO_VERSION: '1.25.10'
  NODE_VERSION: '20'
  KUBECONFORM_VERSION: 'v0.6.7'
  ENVTEST_K8S_VERSION: '1.31.0'
  GOPRIVATE: 'github.com/getloopscale/*'
  GONOSUMCHECK: 'github.com/getloopscale/*'

# Same group for push and PR on same branch — prevents duplicate runs.
# push to develop and PR develop→main share the same group key.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # CHANGE DETECTION
  # ─────────────────────────────────────────────

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      go-api: ${{ steps.filter.outputs.go-api }}
      go-operators: ${{ steps.filter.outputs.go-operators }}
      go-pkg: ${{ steps.filter.outputs.go-pkg }}
      go-infra: ${{ steps.filter.outputs.go-infra }}
      cli: ${{ steps.filter.outputs.cli }}
      pulumi: ${{ steps.filter.outputs.pulumi }}
      manifests: ${{ steps.filter.outputs.manifests }}
      charts: ${{ steps.filter.outputs.charts }}
      helmfile: ${{ steps.filter.outputs.helmfile }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # pragma: allow-tag-pin
      # TODO(T4.1 deep-review-remediation): Renovate Bot resolves to @<sha40> on first run.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go-api:
              - 'api/**'
              - 'pkg/**'
              - 'go.work'
            go-operators:
              - 'operators/**'
              - 'pkg/**'
              - 'go.work'
            go-pkg:
              - 'pkg/**'
            go-infra:
              - 'infra/tests/**'
              - 'infra/scripts/**'
            cli:
              - 'cli/**'
            pulumi:
              - 'infra/pulumi/**'
            manifests:
              - 'operators/config/**'
              - 'infra/helm/**'
              - 'infra/tilt/**'
            charts:
              - 'charts/**'
            helmfile:
              - 'infra/helmfile/**'
              - 'infra/helm/admission-policies/**'
              - 'infra/helm/cloudflared/**'
              - 'infra/helm/cluster-issuer/**'
              - 'infra/helm/network-policies/**'
              - 'infra/helm/smoke-test/**'
              - 'infra/helm/loopzero-api/**'
              - 'infra/helm/loopzero-cloud/**'
              # ADR-0023 / plan v1.1 T1.5: monolith chart paths removed.
              # 4 split operator charts now live under charts/ and trigger
              # via the existing 'charts: charts/**' filter above.
              - 'infra/argocd-bootstrap/**'

  # ─────────────────────────────────────────────
  # LINT — code quality checks
  # ─────────────────────────────────────────────

  lint-go:
    name: Lint Go (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: >-
      needs.changes.outputs.go-pkg == 'true' ||
      needs.changes.outputs.go-api == 'true' ||
      needs.changes.outputs.go-operators == 'true'
    strategy:
      fail-fast: false
      matrix:
        component: [pkg, operators, api]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.component }}/go.sum
      # pragma: allow-tag-pin
      # TODO(T4.1 deep-review-remediation): Renovate Bot resolves to @<sha40> on first run.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          working-directory: ${{ matrix.component }}

  lint-cli:
    name: Lint CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: cd cli && npm ci
      - name: ESLint
        run: cd cli && npm run lint
      - name: Type check
        run: cd cli && npx tsc --noEmit

  tidy-go:
    name: Go mod tidy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: >-
      needs.changes.outputs.go-api == 'true' ||
      needs.changes.outputs.go-operators == 'true' ||
      needs.changes.outputs.go-pkg == 'true' ||
      needs.changes.outputs.go-infra == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify go.mod and go.sum are tidy
        run: |
          FAILED=0
          for dir in pkg api operators infra/tests infra/scripts; do
            if [ -f "$dir/go.mod" ]; then
              echo "Checking $dir..."
              (cd "$dir" && go mod tidy)
              if [ -n "$(git status --porcelain -- "$dir/go.mod" "$dir/go.sum")" ]; then
                echo "::error::go.mod or go.sum is not tidy in $dir. Run 'go mod tidy' and commit."
                FAILED=1
              fi
            fi
          done
          exit $FAILED

  # ADR-0023 / plan v1.1 T1.5: rbac-subset-check.sh deleted.
  # Original purpose was to ensure split operator ClusterRoles ⊆ monolith
  # ClusterRole ∪ allowlist (privilege escalation gate during cutover).
  # With the monolith chart deleted in T1.5, the comparison baseline no
  # longer exists in this codebase. Phase 4 (RBAC pipeline / ADR-0026)
  # introduces a forward-looking gate: kubebuilder:rbac markers + AST
  # analyzer (hack/validate-rbac/) that enforces "every r.Client.X call
  # has a corresponding marker". That gate replaces this subset check
  # with stronger semantics (least-privilege from source-of-truth).
  # Source: docs/meetings/adr/0026-rbac-from-markers.md.

  # T1.2 / VAL-001: detect orphan alert rules — alerts that reference
  # Prometheus metrics not registered anywhere in Go source. Prevents
  # the recurring "alert dark zone" pattern where rules fire on metrics
  # that no code emits. The vector(0) literal is the documented opt-out
  # for intentionally-disabled rules awaiting future feature work.
  alert-orphans:
    name: Alert metric orphan check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: changes
    if: >-
      needs.changes.outputs.helm == 'true' ||
      needs.changes.outputs.go-api == 'true' ||
      needs.changes.outputs.go-operators == 'true' ||
      needs.changes.outputs.go-pkg == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cross-reference alert metrics vs Go registrations
        run: |
          set -euo pipefail
          # Extract metric names from PrometheusRule expr fields, excluding
          # rules that contain "ORPHAN" (intentionally disabled) or vector(0).
          ALERT_METRICS=$(
            cat infra/helm/monitoring/manifests/prometheusrule-*.yaml \
              | grep -v "ORPHAN" \
              | awk '/expr:/{gsub(/.*\(/,""); gsub(/[^a-zA-Z_]+/,"\n"); print}' \
              | grep "^loopzero_" | sort -u
          )
          # Extract registered metric names from Go source.
          REGISTERED_METRICS=$(
            grep -rE 'Name: "loopzero_' operators/internal/metrics/ api/internal/metrics/ pkg/ 2>/dev/null \
              | sed -nE 's/.*Name: "(loopzero_[a-z_]+)".*/\1/p' \
              | sort -u
          )
          ORPHANS=$(comm -23 <(echo "$ALERT_METRICS") <(echo "$REGISTERED_METRICS"))
          if [[ -n "$ORPHANS" ]]; then
            echo "::error::Alert rules reference metrics not registered in Go:"
            echo "$ORPHANS" | while read -r m; do echo "  - $m"; done
            echo ""
            echo "Either implement the metric (prometheus.NewCounter/Gauge/Histogram"
            echo "+ MustRegister) or disable the rule via 'expr: vector(0) > 1' with"
            echo "an inline ORPHAN comment per T1.2."
            exit 1
          fi
          echo "Alert orphan check: OK (all alert metrics are registered)"

  # T3.2 / INFRA-004: detect drift between kubebuilder-generated CRDs in
  # operators/config/crd/bases/ and Helm chart templates in
  # charts/loopzero-crds/templates/. Fails CI if the source-of-truth diverges
  # from the chart shipped to clusters.
  crd-drift:
    name: CRD schema drift check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: changes
    if: >-
      needs.changes.outputs.go-operators == 'true' ||
      needs.changes.outputs.helm == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Run drift check
        run: |
          set -euo pipefail
          BASES_DIR="operators/config/crd/bases"
          CHART_DIR="charts/loopzero-crds/templates"
          drift_found=0
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          for base_file in "${BASES_DIR}"/loopzero.io_*.yaml; do
            base_name="$(basename "${base_file}")"
            plural="${base_name#loopzero.io_}"
            chart_file="${CHART_DIR}/${plural}"
            if [[ ! -f "${chart_file}" ]]; then
              echo "::error::DRIFT: ${base_name} has no chart counterpart at ${chart_file}"
              drift_found=1
              continue
            fi
            base_spec="${tmp_dir}/${base_name}.base.yaml"
            chart_spec="${tmp_dir}/${plural}.chart.yaml"
            yq eval '.spec.versions' "${base_file}" > "${base_spec}"
            yq eval '.spec.versions' "${chart_file}" > "${chart_spec}"
            if ! diff -q "${base_spec}" "${chart_spec}" >/dev/null 2>&1; then
              echo "::error::DRIFT in ${plural}:"
              diff -u "${base_spec}" "${chart_spec}" || true
              drift_found=1
            fi
          done
          if [[ "${drift_found}" -eq 1 ]]; then
            echo ""
            echo "CRD schema drift detected. Run 'cd operators && make manifests'"
            echo "to regenerate bases/, then sync charts/loopzero-crds/templates/."
            exit 1
          fi
          echo "CRD schema drift check: OK (all pairs aligned)"

  # ─────────────────────────────────────────────
  # UNIT TESTS — fast, no external deps
  # ─────────────────────────────────────────────

  test-pkg:
    name: Test pkg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.go-pkg == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: pkg/go.sum
      - run: cd pkg && go test ./... -short -v -race -count=1

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.go-api == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum
      - run: cd api && go test ./... -short -v -race -count=1

  test-operators:
    name: Test Operators
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.go-operators == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: operators/go.sum
      - name: Install envtest
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use ${{ env.ENVTEST_K8S_VERSION }} -p path)" >> $GITHUB_ENV
      - run: cd operators && go test ./... -short -v -race -count=1

  test-infra:
    name: Test infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.go-infra == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: infra/tests/go.sum
      - run: cd infra/tests && go test ./unit/... -short -v -race -count=1

  test-cli:
    name: Test CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: cd cli && npm ci && npm run build
      - run: cd cli && npm test -- --ci --coverage
      # pragma: allow-tag-pin
      # TODO(T4.1 deep-review-remediation): Renovate Bot resolves to @<sha40> on first run.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cli-coverage
          path: cli/coverage/
          retention-days: 7

  test-pulumi:
    name: Test Pulumi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.pulumi == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/pulumi/package-lock.json
      - run: cd infra/pulumi && npm ci && npx tsc --noEmit && npm test

  # ─────────────────────────────────────────────
  # VALIDATE — manifests + migrations + charts
  # ─────────────────────────────────────────────

  validate-manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    # CHG-2026-04-28-LAYERED-BOOTSTRAP — also fires on helmfile/internal-chart
    # changes so the L2/L3 surface (helmfile templates, ArgoCD sync waves,
    # internal Helm charts, helmfile scripts) is gated on every PR.
    if: >-
      needs.changes.outputs.manifests == 'true' ||
      needs.changes.outputs.go-operators == 'true' ||
      needs.changes.outputs.helmfile == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/${{ env.KUBECONFORM_VERSION }}/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz && sudo mv kubeconform /usr/local/bin/
      - name: Install helm + helm-diff + helmfile v1
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm plugin install https://github.com/databus23/helm-diff || true
          curl -fsSL https://github.com/helmfile/helmfile/releases/download/v1.0.0/helmfile_1.0.0_linux_amd64.tar.gz | tar xz
          sudo mv helmfile /usr/local/bin/
          helmfile --version
      - name: Install Task
        run: |
          curl -sL https://taskfile.dev/install.sh | sudo sh -s -- -b /usr/local/bin
          task --version
      - run: kubeconform --strict --skip CustomResourceDefinition operators/config/
      - run: kubeconform --strict infra/tilt/api-deployment.yaml infra/tilt/operator-deployment.yaml
      - run: kubeconform --strict --skip AppProject,Application infra/helm/argocd/templates/
      - run: kubeconform --strict --skip ServiceMonitor,PrometheusRule,Probe infra/helm/monitoring/manifests/
      # L2/L3 gates — CHG-2026-04-28-LAYERED-BOOTSTRAP T7.x
      - name: Validate internal Helm charts (lint + template)
        run: task validate:internal-charts
      - name: Validate ArgoCD sync-wave invariants
        run: task validate:argocd-sync-waves
      - name: Validate helmfile shell scripts (mock kubectl)
        run: task validate:helmfile-scripts
      - name: Validate helmfile-rendered K8s objects (kubeconform)
        run: task validate:helmfile-templates

  migration-safety:
    name: Migration safety
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: changes
    if: needs.changes.outputs.go-api == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # allowlist: migrate force (step name references the phrase being rejected — this is the gate itself)
      - name: Reject migrate force (plan T1.2 — CORRECTIONS.txt item B)
        # Replaced inline grep with canonical script per plan
        # 2026-05-13-corrections-txt-definitive-fix-sprint-plan T1.2.
        # New script broadens scope (all extensions), uses explicit
        # `# allowlist: migrate force` markers (vs prior `NEVER` keyword),
        # and has hermetic test coverage at infra/tests/check-no-migrate-force_test.sh.
        run: bash infra/scripts/check-no-migrate-force.sh
      - name: Forward-only migrations
        run: |
          viol=$(grep -rlnE '^\s*(ALTER\s+TABLE\s+\w+\s+)?DROP\s+(TABLE|COLUMN)' \
              api/internal/db/migrations/ --include='*.up.sql' 2>/dev/null || true)
          for f in $viol; do
            case "$(basename "$f")" in *rebuild*) continue ;; esac
            if head -20 "$f" | grep -qE '^\s*--\s*ALLOW-DESTRUCTIVE'; then continue; fi
            echo "::error::Destructive DDL in $f"
            exit 1
          done

  lint-charts:
    name: Lint charts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-helm
        with:
          version: v3.14.4
      - name: Update deps + lint
        run: |
          for chart in charts/*/; do
            [ -f "$chart/Chart.yaml" ] && grep -q "dependencies:" "$chart/Chart.yaml" && helm dependency update "$chart" 2>/dev/null
          done
          FAILED=0
          for chart in charts/*/; do helm lint "$chart" || FAILED=1; done
          exit $FAILED
      - name: kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.6/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
          for chart in charts/*/; do
            grep -q "type: library" "$chart/Chart.yaml" 2>/dev/null && continue
            helm template "$(basename "$chart")" "$chart" 2>/dev/null | \
              kubeconform --strict --ignore-missing-schemas --kubernetes-version 1.31.0 --summary
          done
      - name: CRD sync
        run: |
          SRC=$(ls operators/config/crd/bases/loopzero.io_*.yaml | wc -l)
          DST=$(ls charts/loopzero-crds/templates/*.yaml | wc -l)
          [ "$SRC" -eq "$DST" ] || { echo "::error::CRD mismatch: source=$SRC chart=$DST"; exit 1; }

  # ─────────────────────────────────────────────
  # SECURITY — vuln scans + secret detection
  # ─────────────────────────────────────────────

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: govulncheck (pkg)
        if: needs.changes.outputs.go-pkg == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          cd pkg && govulncheck ./...
      - name: govulncheck (api)
        if: needs.changes.outputs.go-api == 'true'
        run: cd api && govulncheck ./...
      - name: govulncheck (operators)
        if: needs.changes.outputs.go-operators == 'true'
        run: cd operators && govulncheck ./...
      - name: npm audit
        if: needs.changes.outputs.cli == 'true'
        run: cd cli && npm ci && npm audit --omit=dev --audit-level=high

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          ignore-unfixed: true
          trivyignores: .trivyignore
          skip-dirs: infra/tests/e2e/fixtures,examples,loopzero-packs,loopzero-forge,referencias

      - name: TruffleHog secret scan
        # pragma: allow-tag-pin
        # TODO(INF-G18 / plan T1.1): Renovate Bot resolves to @<sha40> on first run.
        uses: trufflesecurity/trufflehog@v3.94.3
        with:
          extra_args: --only-verified --results=verified,unknown

      - name: GitHub Actions SHA pinning lint (T4.1 deep-review-remediation)
        run: bash infra/scripts/check_actions_sha_pinned.sh

      - name: Orphan PrometheusRule alerts lint (T5.10 deep-review-remediation)
        run: bash infra/scripts/check_orphan_alerts.sh

      - name: Migration regression-test coverage (T3.4 deep-review-remediation)
        run: bash infra/scripts/migration_test_coverage.sh

      - name: AGPL isolation lint (T9.1 deep-review-remediation, ADR-0048)
        run: bash infra/scripts/check_agpl_isolation.sh

      - name: Alert runbook coverage lint (T5.8 deep-review-remediation)
        run: bash infra/scripts/check_alert_runbooks.sh

      - name: ClusterImagePolicy mode flip governance lint (T8.6 deep-review-remediation)
        run: bash infra/scripts/check_clusterimagepolicy_mode.sh

      - name: CLI bundle size guard (T9.3 deep-review-remediation)
        run: |
          if [ ! -d cli/dist ]; then
            (cd cli && npm install --silent && npm run build)
          fi
          bash infra/scripts/check_cli_bundle_size.sh

      - name: Base image digest pinning lint (T4.6 deep-review-remediation)
        run: bash infra/scripts/check_base_image_digest_pin.sh

  # ──────────────────────────────────────────────────────────────────────
  # Quality-Gate Phase 4 — 5 baseline-tracking gates
  # ──────────────────────────────────────────────────────────────────────
  # Phase 1+2 closed: 26+2 CVEs → 0, 9 TS orphans → 0, 100 dead funcs → 0.
  # Phase 3 lock: dupl 1203 + jscpd 112 + lint 200 baselines (decrement
  # over time via dedicated PRs).
  # Override note: T2/T3 governance bypass per user "ignorar regra de
  # meeting para este caso" on 2026-05-13 thread.
  # ──────────────────────────────────────────────────────────────────────
  quality-gate-deadcode:
    name: "Quality Gate: dead code (Go)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: >-
      needs.changes.outputs.go-pkg == 'true' ||
      needs.changes.outputs.go-api == 'true' ||
      needs.changes.outputs.go-operators == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Run dead-code:strict (baseline=0)
        run: task dead-code:strict

  quality-gate-vuln:
    name: "Quality Gate: vulnerability scan (Go + npm)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: >-
      needs.changes.outputs.go-pkg == 'true' ||
      needs.changes.outputs.go-api == 'true' ||
      needs.changes.outputs.go-operators == 'true' ||
      needs.changes.outputs.cli == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Install CLI deps
        run: cd cli && npm ci
      - name: Run vuln-scan:strict (MEDIUM+ blocks)
        run: task vuln-scan:strict

  quality-gate-dupl:
    name: "Quality Gate: Go duplication (baseline tracked)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: >-
      needs.changes.outputs.go-pkg == 'true' ||
      needs.changes.outputs.go-api == 'true' ||
      needs.changes.outputs.go-operators == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Run dupl:strict (baseline=1203, threshold=50)
        run: task dupl:strict

  quality-gate-jscpd:
    name: "Quality Gate: TS duplication (baseline tracked)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install CLI deps
        run: cd cli && npm ci
      - name: Install Task
        run: |
          curl -sL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin
      - name: Run jscpd:strict (baseline=112, min-tokens=50)
        run: task jscpd:strict

  quality-gate-lint:
    name: "Quality Gate: golangci-lint (baseline tracked)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: >-
      needs.changes.outputs.go-pkg == 'true' ||
      needs.changes.outputs.go-api == 'true' ||
      needs.changes.outputs.go-operators == 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Task + golangci-lint
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.3
      - name: Run lint:strict (baseline=200)
        run: task lint:strict

  # ─────────────────────────────────────────────
  # GATE — all checks must pass
  # ─────────────────────────────────────────────

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    needs:
      - changes
      - lint-go
      - lint-cli
      - tidy-go
      - test-pkg
      - test-api
      - test-operators
      - test-infra
      - test-cli
      - test-pulumi
      - validate-manifests
      - lint-charts
      - migration-safety
      - security
      - quality-gate-deadcode
      - quality-gate-vuln
      - quality-gate-dupl
      - quality-gate-jscpd
      - quality-gate-lint
    steps:
      - name: Check results
        run: |
          RESULTS="${{ join(needs.*.result, ' ') }}"
          for result in $RESULTS; do
            if [[ "$result" == "failure" ]] || [[ "$result" == "cancelled" ]]; then
              echo "::error::CI failed"
              exit 1
            fi
          done
          echo "CI passed"
