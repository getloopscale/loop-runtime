# Gate rapido de compilacao + testes hermeticos dos modulos Go.
#
# O DEFEITO QUE ISTO PREVINE: ate aqui este repositorio NAO tinha gate algum no
# GitHub. As Actions foram removidas como pipeline em 2026-05-23 e substituidas
# por `task quality:gates` no hook de pre-push — que roda na maquina de quem
# empurra, e so' nela. Consequencias medidas nesta mesma semana:
#
#   - um push que morre em SIGPIPE (#256) nao distingue "gate reprovou" de
#     "conexao caiu", e quem estiver com o hook desinstalado nao roda nada;
#   - `LOOPZERO_SKIP_PREPUSH` existe e nada registra o seu uso;
#   - a maquina do operador tem Go 1.26, helmfile, kubeconform, trivy e
#     golangci-lint instalados. Um contribuidor novo nao tem, e descobre isso
#     depois do merge.
#
# ESCOPO — honestamente limitado, e a limitacao e' deliberada.
#
# Roda build + vet + os testes que NAO precisam de cluster. NAO roda
# `task quality:gates` (os 111 gates) nem a suite dos operators. Motivos
# concretos, nao falta de vontade:
#
#   quality:gates  exige helmfile, kubeconform, actionlint, trivy e
#                  golangci-lint no PATH, e FALHA ALTO se faltarem — por
#                  desenho, para nao passar em silencio. Provisionar isso e'
#                  trabalho proprio; ate' la' o conjunto continua no pre-push.
#   operators/     usa envtest (Ginkgo + binarios do kube-apiserver via
#                  setup-envtest). Baixa ~100MB e leva minutos; entra quando o
#                  gate tiver orcamento de tempo para isso.
#
# Um gate que cobre menos e diz o que nao cobre e' util. Um gate que promete
# cobertura total e roda metade e' pior que nenhum — foi o que motivou o #255.
name: CI

# GATILHOS: PR para `develop` OU `main`, mais push em `develop`.
#
# Todo commit que entra no trunk e' verificado — e' a definicao de CI. Aqui o
# trunk e' `develop`, entao e' ELE que precisa de gate; gate so' em `main`
# protegeria apenas o instante do release, com o estrago ja' feito e diluido num
# diff grande.
#
# Os DOIS gatilhos, e nao um: o de PR mata o defeito antes de entrar no trunk;
# o de push (pos-merge) pega o que so' existe DEPOIS do merge — dois PRs verdes
# isoladamente que se quebram juntos. Escopos diferentes, nao redundancia.
on:
  workflow_call:
  # Validacao POS-MERGE, nao no PR (decisao de 2026-08-12).
  #
  # O portao que impede um merge ruim neste repositorio e' local: o
  # .claude/hooks/delivery-gate.sh roda `task quality:gates` antes de todo
  # `git push` e bloqueia em vermelho, sem bypass. Duplicar isso no PR pagaria
  # minutos de runner por turno para reexecutar o que ja rodou na maquina de
  # quem empurrou — e o CLAUDE.md ja declara que estes workflows NAO sao o
  # quality gate do repo.
  #
  # A consequencia, dita: com o PR sem acao, o primeiro sinal de CI chega DEPOIS
  # do merge. O conserto de uma falha em `main` e um commit de correcao ou um
  # revert, nao um "nao mergear". Isso e' aceitavel aqui porque o gate real ja
  # correu antes do push; deixa de ser se alguem empurrar com o hook desativado.
  push:
    branches: [develop, main]
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # RUNNER: frota Blacksmith, habilitada em 2026-07-30 com a transferencia
    # deste repositorio para a org `getloopscale`.
    #
    # A label e' LITERAL de proposito. O runbook do umbrella mediu que
    # `vars.CI_RUNNER` NAO resolve no repo (`LABELS=[self-hosted,linux,x64]`,
    # mesmo com `visibility=all`) e o fallback `||` devolve a frota antiga EM
    # SILENCIO — o CI fica verde na frota errada. Verificar `runner_name`, nunca
    # `conclusion`.
    #
    # Duas pre-condicoes encadeadas, ambas satisfeitas antes desta linha existir:
    #   1. o repo pertence a uma ORGANIZACAO (`owner.type=Organization`)
    #   2. o GitHub App `blacksmith-sh` esta instalado NA ORG que dona o repo
    # A segunda so' fica visivel depois de resolver a primeira, e foi o que
    # custou tres tentativas na migracao do loopzero-memory.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20

    env:
      GOPRIVATE: github.com/getloopscale/*,github.com/getloopscale/*

    steps:
      # DOIS checkouts, e o segundo nao e' opcional.
      #
      # Tentei primeiro `GOWORK=off` com um checkout so' — e' o que api/Dockerfile
      # faz. NAO funciona para o repositorio inteiro, e a medicao foi esta:
      #
      #   cmd/loopzero-ops  `go.mod` nao declara `jackc/pgx/v5` de forma alguma;
      #                 a dependencia so' resolve pelo workspace.
      #   api           `go.sum` tem o hash do modulo pgx mas NAO a linha
      #                 `/go.mod` dele — a forma exata que o go.work supre.
      #   infra/scripts mesma lacuna.
      #
      # O Dockerfile escapa disso porque compila SO' `api/./cmd/`, um
      # subconjunto cujas dependencias estao completas. Um gate que compila tudo
      # nao tem essa sorte.
      #
      # A alternativa seria `go mod tidy` nos 6 modulos. Rejeitada aqui: mexer na
      # resolucao de dependencia de todo o repo para acomodar um gate novo e'
      # deixar o gate ditar a arquitetura — e arrisca quebrar builds de imagem
      # que hoje funcionam. Preservar o workspace faz o CI exercitar a MESMA
      # resolucao que o desenvolvedor exercita localmente, que e' a propriedade
      # que se quer de um gate.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA-pin: supply-chain; issue #233)
        with:
          path: loopzero

      # `loopzero-contracts` e' PRIVADO e foi transferido para `getloopscale` junto com
      # este repo. O acesso vem de uma DEPLOY KEY read-only registrada nele
      # (id 158891596), com a chave privada em GOMOD_SSH_KEY.
      #
      # ATUALIZADO 2026-08-07: o import path NAO continua mais em `getloopscale`.
      # O commit f813b367 (2026-08-06) reescreveu api/go.mod e pkg/go.mod para
      # `github.com/getloopscale/loopzero-contracts v0.4.0`, revertendo a premissa acima —
      # mas este workflow ficou em `getloopscale` e passou a nao encontrar a versao,
      # falhando com "pkg/go.mod nao declara loopzero-contracts". O ultimo run verde foi
      # 2026-07-31; toda a esteira ficou bloqueada desde a migracao.
      #
      # Por que deploy key e nao PAT: a necessidade e' `Contents: read` em UM
      # repositorio. Um PAT de conta alcanca tudo que a conta alcanca; a deploy
      # key alcanca exatamente este repo, so' leitura, e e' revogavel sozinha sem
      # afetar mais nada. O `GOMOD_TOKEN` anterior morreu (`Bad credentials`,
      # medido no run 30621505439) e derrubou 10 builds sem nomear a causa.
      - name: Deploy key para o modulo privado
        env:
          GOMOD_SSH_KEY: ${{ secrets.GOMOD_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GOMOD_SSH_KEY:-}" ]; then
            echo "::error::GOMOD_SSH_KEY vazio — api/go.mod requer github.com/getloopscale/loopzero-contracts (privado). Registre a chave privada da deploy key read-only."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printenv GOMOD_SSH_KEY > ~/.ssh/gomod_key
          chmod 600 ~/.ssh/gomod_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # IdentitiesOnly + IdentityAgent=none: sem isso o agente do runner pode
          # oferecer outra chave primeiro e o GitHub responde `Repository not
          # found` — a mesma mensagem de repo inexistente. Custou uma rodada de
          # diagnostico local ate' o `-v` mostrar a chave errada sendo oferecida.
          cat >> ~/.ssh/config <<'SSHCFG'
          Host github.com
            IdentityFile ~/.ssh/gomod_key
            IdentitiesOnly yes
            IdentityAgent none
          SSHCFG
          # go/git buscam o modulo por HTTPS; reescrever para SSH e' o que faz a
          # deploy key ser usada.
          git config --global url."git@github.com:getloopscale/".insteadOf "https://github.com/getloopscale/"
          git config --global url."git@github.com:getloopscale/".insteadOf "https://github.com/getloopscale/"
          git ls-remote git@github.com:getloopscale/loopzero-contracts.git >/dev/null
          echo "deploy key OK — loopzero-contracts acessivel."

      # QUAL versao de loopzero-contracts fazer checkout — derivada do `go.mod`, nunca
      # fixada aqui.
      #
      # O DEFEITO QUE ISTO CORRIGE (medido no run 30627506396): o checkout sem
      # `ref:` traz o branch DEFAULT do repositorio, que e' `main` — 12 commits
      # atras de `develop` e sem `plan.MetricCPUCoreSeconds`. O build morria em
      # `undefined: plan.MetricCPUCoreSeconds`, e a mensagem sugeria codigo
      # quebrado quando o quebrado era a VERSAO que o gate escolhia sozinho.
      #
      # A tag `v0.3.0` que os go.mod exigem TEM os simbolos — a dependencia
      # declarada estava correta o tempo todo. Fixar a versao no workflow
      # resolveria hoje e mentiria no proximo bump; derivar do go.mod faz o gate
      # exercitar exatamente a versao que o repositorio declara.
      - name: Resolver a versao de loopzero-contracts exigida pelo go.mod
        id: contracts
        run: |
          set -euo pipefail
          pkg_v=$(awk '/getloopscale\/loopzero-contracts/ {print $2}' loopzero/pkg/go.mod | head -1)
          api_v=$(awk '/getloopscale\/loopzero-contracts/ {print $2}' loopzero/api/go.mod | head -1)
          if [ -z "$pkg_v" ]; then
            echo "::error::loopzero/pkg/go.mod nao declara loopzero-contracts — o gate nao tem versao para exercitar."
            exit 1
          fi
          # Divergencia entre modulos e' drift real: o go.work esconde qual das
          # duas vence, e o consumidor externo de cada modulo veria versoes
          # diferentes. Falha alto em vez de escolher uma em silencio.
          if [ "$pkg_v" != "$api_v" ]; then
            echo "::error::pkg/go.mod pede $pkg_v e api/go.mod pede $api_v — alinhe os dois antes de seguir."
            exit 1
          fi
          echo "loopzero-contracts: $pkg_v"
          echo "ref=$pkg_v" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA-pin; issue #233)
        with:
          repository: getloopscale/loopzero-contracts
          ref: ${{ steps.contracts.outputs.ref }}
          path: loopzero-contracts
          ssh-key: ${{ secrets.GOMOD_SSH_KEY }}

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0 (SHA-pin; issue #233)
        with:
          go-version-file: loopzero/api/go.mod
          cache-dependency-path: |
            loopzero/api/go.sum
            loopzero/operators/go.sum

      # Este repositorio e' MULTI-MODULO e nao tem `go.mod` na raiz: um
      # `go build ./...` na raiz nao cobre NADA. Cada modulo e' compilado
      # explicitamente. A lista e' a do `go.work` menos `../loopzero-contracts`, que
      # tem CI proprio no repositorio dele — este gate valida o consumo, nao a
      # producao.
      - name: Build every module
        run: |
          set -euo pipefail
          cd loopzero
          for m in pkg api operators operators/api cmd/loopzero-ops infra/scripts; do
            echo "::group::build $m"
            (cd "$m" && go build ./...)
            echo "::endgroup::"
          done

      - name: Vet every module
        run: |
          set -euo pipefail
          cd loopzero
          for m in pkg api operators operators/api cmd/loopzero-ops infra/scripts; do
            echo "::group::vet $m"
            (cd "$m" && go vet ./...)
            echo "::endgroup::"
          done

      # `operators` fica de fora: a suite dele e' Ginkgo + envtest e precisa dos
      # binarios do kube-apiserver. Excluido EXPLICITAMENTE em vez de
      # silenciosamente omitido — quem le' o gate ve' o que ele nao cobre.
      - name: Test the hermetic modules
        run: |
          set -euo pipefail
          cd loopzero
          for m in pkg api cmd/loopzero-ops; do
            echo "::group::test $m"
            (cd "$m" && go test ./... -count=1)
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # Tenant isolation — the gate that did not exist.
  #
  # This repository already carried tests asserting tenant isolation. They were
  # green for five months without ever running: `build-and-test` executes
  # `go test ./...` with no `services:` block, so every integration test hit an
  # unreachable database and called t.Skip. A skipped test is indistinguishable
  # from a passing one in the run summary, and on 2026-08-14 the property they
  # claimed to protect turned out to be false — a connection scoped to one
  # tenant read another tenant's rows.
  #
  # This job exists so that cannot recur silently. It provisions a real
  # PostgreSQL, applies the schema and migration 000062, and runs the isolation
  # suite with LOOPZERO_RLS_AUDIT_REQUIRE=1 — which turns "cannot connect" from a
  # skip into a failure.
  #
  # SCOPE IS DELIBERATE. It runs the isolation and hardening tests, not the whole
  # integration suite: 16 of those tests were already failing against a real
  # database before this work (fixtures that predate the cell_id trigger added by
  # migration 000061, plus a pre-existing find_data_004 FK regression). Widening
  # this job would mix a security gate with unrelated debt and give a reason to
  # disable it. That debt is tracked separately.
  # ---------------------------------------------------------------------------
  tenant-isolation:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15

    env:
      GOPRIVATE: github.com/getloopscale/*,github.com/getloopscale/*

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loopzero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA-pin; issue #233)
        with:
          path: loopzero

      - name: Deploy key para o modulo privado
        env:
          GOMOD_SSH_KEY: ${{ secrets.GOMOD_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GOMOD_SSH_KEY:-}" ]; then
            echo "::error::GOMOD_SSH_KEY vazio — api/go.mod requer github.com/getloopscale/loopzero-contracts (privado)."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printenv GOMOD_SSH_KEY > ~/.ssh/gomod_key
          chmod 600 ~/.ssh/gomod_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<'SSHCFG'
          Host github.com
            IdentityFile ~/.ssh/gomod_key
            IdentitiesOnly yes
            IdentityAgent none
          SSHCFG
          git config --global url."git@github.com:getloopscale/".insteadOf "https://github.com/getloopscale/"
          git config --global url."git@github.com:getloopscale/".insteadOf "https://github.com/getloopscale/"

      - name: Resolver a versao de loopzero-contracts exigida pelo go.mod
        id: contracts
        run: |
          set -euo pipefail
          api_v=$(awk '/getloopscale\/loopzero-contracts/ {print $2}' loopzero/api/go.mod | head -1)
          if [ -z "$api_v" ]; then
            echo "::error::loopzero/api/go.mod nao declara loopzero-contracts."
            exit 1
          fi
          echo "ref=$api_v" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA-pin; issue #233)
        with:
          repository: getloopscale/loopzero-contracts
          ref: ${{ steps.contracts.outputs.ref }}
          path: loopzero-contracts
          ssh-key: ${{ secrets.GOMOD_SSH_KEY }}

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0 (SHA-pin; issue #233)
        with:
          go-version-file: loopzero/api/go.mod
          cache-dependency-path: loopzero/api/go.sum

      # The role split is the point. Applying the schema as `loopzero` makes that
      # role the table owner, exactly as in production, so the tests measure the
      # real posture instead of a convenient one.
      - name: Provisionar o banco com a separacao de papeis de producao
        env:
          PGHOST: localhost
          PGPORT: "5432"
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

          echo "::group::papeis"
          PGPASSWORD=postgres psql -U postgres -d loopzero_test -v ON_ERROR_STOP=1 \
            -f loopzero/api/internal/db/testdata/test-roles.sql
          echo "::endgroup::"

          # The dump replays a few metering helpers out of dependency order.
          # Those errors are tolerated here and the outcome is asserted below —
          # a count is a stronger check than a clean-looking log.
          echo "::group::schema (como owner loopzero)"
          PGPASSWORD=loopzero psql -U loopzero -d loopzero_test \
            -f loopzero/api/internal/db/schema.gen.sql 2>&1 | tail -5
          echo "::endgroup::"

          echo "::group::migrations de isolamento"
          # Applied by name rather than by a glob over the whole directory: the
          # rest of the migration chain is not replayable against a schema dump
          # (the dump already carries its result), and a glob would silently
          # start including the next migration somebody adds.
          for m in 000062_rls_fail_closed 000063_cloud_named_role; do
            echo "-- $m"
            PGPASSWORD=loopzero psql -U loopzero -d loopzero_test -v ON_ERROR_STOP=1 \
              -f "loopzero/api/internal/db/migrations/$m.up.sql"
          done
          echo "::endgroup::"

      # Asserted before the tests run: if the migration silently did less than
      # it claims, fail here with a number rather than let a downstream test
      # produce a confusing error.
      - name: Verificar a postura no catalogo
        run: |
          set -euo pipefail
          read -r rls forced open <<< "$(PGPASSWORD=postgres psql -U postgres -h localhost -d loopzero_test -tAF' ' -c "
            SELECT
              (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                WHERE n.nspname='public' AND c.relkind='r' AND c.relrowsecurity),
              (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                WHERE n.nspname='public' AND c.relkind='r' AND c.relforcerowsecurity),
              (SELECT count(*) FROM pg_policy p
                WHERE pg_get_expr(p.polqual, p.polrelid) LIKE '%IS NULL%'
                   OR pg_get_expr(p.polqual, p.polrelid) LIKE '%''''::text%');")"
          echo "rls_enabled=$rls forced=$forced fail_open_policies=$open"
          if [ "$open" -ne 0 ]; then
            echo "::error::$open policy(ies) ainda aceitam contexto vazio — o disjunto fail-open voltou."
            exit 1
          fi
          if [ "$rls" -lt 30 ] || [ "$forced" -lt 30 ]; then
            echo "::error::esperado >=30 tabelas com RLS e FORCE, medido rls=$rls forced=$forced."
            exit 1
          fi

      - name: Isolamento de tenant (falha se o banco sumir, nunca pula)
        env:
          DATABASE_URL: postgres://loopzero:loopzero@localhost:5432/loopzero_test?sslmode=disable
          LOOPZERO_API_DATABASE_URL: postgres://loopzero_api:loopzero-api@localhost:5432/loopzero_test?sslmode=disable
          LOOPZERO_WORKER_DATABASE_URL: postgres://loopzero_worker:loopzero-worker@localhost:5432/loopzero_test?sslmode=disable
          LOOPZERO_RLS_AUDIT_SUPERUSER_URL: postgres://postgres:postgres@localhost:5432/loopzero_test?sslmode=disable
          LOOPZERO_RLS_AUDIT_REQUIRE: "1"
        run: |
          set -euo pipefail
          cd loopzero/api
          go test ./tests/integration/ -count=1 -v \
            -run 'TenantIsolation|RLSGuard|RLSOnAllTenantTables|RolesExist|LoopZeroApiCannotDDL|AuditLogAppendOnly|ReconciliationQueriesWithRLS|OwnerMaintenancePoliciesAreGone|NoUnconditionalTruePolicyOutsideNamedWorkers'
