# Branch protection: the status checks a pull request must pass before it merges.
#
# Applied by infra/scripts/ci/branch-protection-update.sh (BRANCH=develop, then
# BRANCH=main). Each name MUST be the exact `name:` of a job in .github/workflows —
# cmd/loopzero-ops/branch_protection_checks_test.go fails otherwise.
#
# ONE required check: `CI gate`, the aggregation job of ci.yml. It asserts the result
# of every other CI job itself (a SKIPPED required check reports as passing, so the
# aggregate is what cannot be bypassed), so requiring the individual jobs as well
# would only duplicate it.
#
# This file listed 13 checks until 2026-09-23 — "Quality Gates - Coverage Report",
# "Helm Charts / Render-time tests", "drill-hermetic-tests" and others — all produced
# by workflows deleted on 2026-05-23. Applied, it would have blocked every merge
# waiting for checks nothing could report.
#
# Applying it needs branch protection on the remote, which the current GitHub plan
# of the organisation does not offer for this private repository (403, measured
# 2026-09-06 — see .github/workflows/delivery-gate-armed.yml).

branches:
  develop:
    required_status_checks:
      - "CI gate"

  main:
    required_status_checks:
      - "CI gate"
