# Runner labels actionlint must accept in `runs-on`.
#
# THE DEFECT THIS PREVENTS: actionlint validates `runs-on` against the list of
# GitHub-hosted labels it knows and REJECTS any other
# (`label "..." is unknown`). Without this declaration, the moment a workflow
# starts using the literal Blacksmith label, the workflow gate fails on
# EVERY file — not only on the one that changed.
#
# It went unnoticed while the runner came out of an expression
# (`fromJSON(vars.CI_RUNNER)`): actionlint does not evaluate expressions statically,
# so the label was never seen. Pinning the literal label — which is what the
# umbrella runbook says to do, because `vars.CI_RUNNER` does NOT resolve and silently
# falls back to the old fleet — makes the label visible, and without this file the gate breaks.
#
# That is why the runbook lists this file as a PREREQUISITE of the migration, not as
# diligence: it lands BEFORE the label, never after.
#
# `self-hosted-runner.labels` is the key intended for exactly this: labels
# served by a fleet that is not GitHub's. Blacksmith's go here despite the
# key's name — from actionlint's point of view, any non-GitHub-hosted runner
# is "self-hosted".
self-hosted-runner:
  labels:
    - blacksmith-8vcpu-ubuntu-2404
